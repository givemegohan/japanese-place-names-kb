- id: muni/20-南牧村
  code: '203050'
  names:
    ja: 南牧村
    reading: みなみまきむら
    aliases: []
  user_terms:
  - みなみまきむら
  - 南牧村 長野 読み方
  - 野辺山の村
  naming_type: 合併新設
  prefecture: 長野県
  homonyms:
  - muni/10-南牧村
  summary: 明治22年（1889年）に海尻・海ノ口・広瀬・平沢と大明村の一部（板橋）が合併して発足した村。千曲川上流・八ヶ岳東麓の高原の村で、野辺山原の秣場や馬市場に象徴される馬と放牧の歴史を持つ。群馬県の南牧村とは漢字が同じでも読みが異なり、こちらは「みなみまき」と読む。1889年の命名理由そのものを記した資料は確認できていない。
  first_attestation:
    era: 明治22年
    year_western: 1889
    document: 町村制施行による南牧村の発足（1889年4月1日）
    note: 自治体名としての初出。村公式の年表には1886年の馬市場の開設を「南牧村に馬市場ができる」と記す箇所があり、「南牧」の名が発足前から地域を指して使われた可能性もあるが、確定はできない
  claims:
  - text: 明治22年（1889年）4月1日、海尻村・海ノ口村・広瀬村・平沢村の区域と大明村の区域のうち板橋の区域をもって南牧村が発足した
    kind: fact
    level: E2
    status: established
    sources:
    - h6-minamimaki-official-history
    - h6-minamimaki-wiki
  - text: 村公式の歴史は、大明村を「馬産・蕎麦・炭焼き・木材搬出等を収入源とする山間の集落」と紹介し、明治19年（1886年）には南牧村に馬市場ができたとする年表を載せる
    kind: fact
    level: E2
    status: established
    sources:
    - h6-minamimaki-official-history
  - text: 日本歴史地名大系によれば、野辺山原は江戸時代を通じて板橋・平沢（現南牧村）や川上村の樋沢など諸村の入会林野で、大部分が秣場（馬の飼料を採る草地）として利用されていた
    kind: fact
    level: E3
    status: established
    sources:
    - h6-nanmoku-kotobank
  - text: 読みは「みなみまき」で、県境の向こうにある群馬県甘楽郡の南牧村の読み「なんもく」とは異なる（異なる層）。共通するのは「南牧」という漢字表記だけで、成立年も経緯も別である
    kind: fact
    level: E2
    status: established
    sources:
    - h6-minamimaki-official-history
    - h6-nanmoku-gunma-pref
  - text: 「牧」の字は、秣場や馬市場に象徴される当地の放牧・馬産の歴史と響き合うが、1889年の合併時に「南牧」と命名した理由そのものを記した資料は確認できておらず、村名と放牧の直接の因果は未確定である
    kind: fact
    level: E3
    status: indeterminate
    sources:
    - h6-minamimaki-official-history
    - h6-nanmoku-kotobank
  column:
    title: 馬の村だった「みなみまき」
    text: 南牧村の公式の歴史をたどると、馬の話が繰り返し出てきます。大明村は馬産を収入源とし、明治19年には馬市場が開かれ、明治中期にはアメリカから乳牛や優良な種馬を輸入して牧場経営が試みられたこともありました（これは失敗に終わったそうです）。野辺山原は長く諸村の秣場でした。「牧」という字が村名に入っているのは、偶然とは思えない土地の記憶です。ただし、それがそのまま命名理由だと断言できる資料はまだ見つかっていません。
    sources:
    - h6-minamimaki-official-history
    - h6-nanmoku-kotobank
  relations:
  - pref/20
  - muni/10-南牧村
  unknowns:
  - 明治22年の合併時に「南牧」と命名した理由の一次記録は未確認
  - 「南牧」の地名としての初出（1886年の馬市場の記事より前に遡れるか）は未確認
  updated: '2026-11-13'
- id: muni/20-塩尻市
  code: '202151'
  names:
    ja: 塩尻市
    reading: しおじりし
    aliases:
    - 塩尻町
    - 塩尻宿
  user_terms:
  - しおじりし
  - 塩の道のまち
  - 塩尻宿の宿場町
  - 塩尻の名前の由来
  naming_type: その他（塩の道の集散地だった宿場町・塩尻の名の継承）
  prefecture: 長野県
  homonyms: []
  summary: 塩尻市は中山道の宿場町・塩尻宿を中心に発達した市で、名は塩の輸送の末端という位置に由来すると説明される。市公式サイトによれば、太平洋側と日本海側の両方から塩を運ぶ「塩の道」の終着・集散の地だったため、道の最後を意味する「尻」が付いたという説が有名である（諸説あるとも明記される）。1959年に塩尻町ほかの合併で市制を施行し、2005年に楢川村と合併した。
  first_attestation:
    era: （未確認）
    year_western: null
    document: （未確認）
    note: 塩尻宿は近世の中山道の宿場として知られるが、「塩尻」の地名の初出は本調査では確認できなかった
  claims:
  - text: 塩尻市公式サイトは「塩尻」の由来として、太平洋側と日本海側の両方から塩を運ぶ「塩の道」の終着・集散の地だったため、道の最後を意味する「尻」を付けたという説が有名であると紹介している
    kind: fact
    level: E2
    status: contested
    sources:
    - v2-shiojiri-yurai
  - text: 同ページは、この由来については諸説あることも明記しており、塩の道説を唯一の定説とはしていない
    kind: fact
    level: E2
    status: contested
    sources:
    - v2-shiojiri-yurai
  - text: 昭和34年（1959年）に塩尻町・片丘村・広丘村・宗賀村・筑摩地村が合併して塩尻市が発足した
    kind: fact
    level: E2
    status: established
    sources:
    - v2-shiojiri-yurai
  - text: 平成17年（2005年）に木曽郡楢川村と合併し、現在の塩尻市となった
    kind: fact
    level: E2
    status: established
    sources:
    - v2-shiojiri-yurai
  - text: 塩尻は中山道の宿場町（塩尻宿）を中心とする地名であり、市名はこの宿場町の名を受け継ぐ
    kind: fact
    level: E2
    status: established
    sources:
    - v2-shiojiri-yurai
  - text: 塩尻市の地方公共団体コードは202151である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 海のない真ん中で、二つの海の塩が出会った
    text: 海に面しない信濃の山あいにあって、塩は命をつなぐ貴重品だった。塩尻には、日本海側の糸魚川から千国街道を南下する塩と、太平洋側から伊那谷を北上する塩の、両方の「塩の道」が届いた。その終着点であり集散地だったことが、「尻」という名の由来とされる。地名の最後の一文字に、海から遠く離れた土地の切実な事情が刻まれている。
    sources:
    - v2-shiojiri-yurai
  relations:
  - pref/20
  unknowns:
  - 「塩尻」の地名の初出文献を確認できなかった
  - 塩の道説以外の諸説の具体的な内容を、専門辞典で確認できなかった
  - 合併年次は市の紹介ページに基づくもので、市史による裏付けは今後の課題
  updated: '2026-11-13'
- id: muni/20-大町市
  code: '202126'
  names:
    ja: 大町市
    reading: おおまちし
    aliases: []
  user_terms:
  - おおまちし
  - 北アルプスの玄関口
  - 黒部ダムの玄関口
  - 仁科三湖のまち
  naming_type: 一部の地名
  prefecture: 長野県
  homonyms:
  - muni/41-大町町
  summary: 大町市は北アルプスの麓、仁科三湖を擁する市で、「大町」の名は中世の市場町に遡る。『角川日本地名大辞典』によれば「大町」の初出は天文22年（1553年）の仁科盛政文書で、本来は本町と仲町の総称だったという。平安時代から戦国時代にこの地を領有した仁科氏のもと、千国街道（塩の道）沿いの交通の要地として発展した。なお佐賀県には同名の「大町町」がある。
  first_attestation:
    era: 天文22年
    year_western: 1553
    document: 仁科盛政文書
    note: 『角川日本地名大辞典 20 長野県』の記載としてWikipedia「大町（大町市）」が紹介するもの（辞典・原典そのものの確認はしていない）
  claims:
  - text: Wikipedia「大町（大町市）」は『角川日本地名大辞典 20 長野県』の記載として、「大町」の名称の初出は天文22年（1553年）の仁科盛政文書で、本来は「本町」と「仲町」の総称を指したと紹介する
    kind: fact
    level: E5
    status: established
    sources:
    - v2-omachi-wiki
  - text: 同記事は同じく同辞典の記載として、鎌倉時代には仁科氏の居館を中心に三日町・五日町などの定期市が立つ市場町が形成され、戦国期以降は千国街道（糸魚川街道）沿いに大町宿が形成されたと紹介する
    kind: fact
    level: E5
    status: established
    sources:
    - v2-omachi-wiki
  - text: 長野県の資料によれば、この地は平安時代中期から戦国時代にかけて仁科氏が領有し、北方の糸魚川方面と結ぶ千国街道（通称・塩の道）に沿って発展し、海産物をはじめ多くの物資が流通した
    kind: fact
    level: E2
    status: established
    sources:
    - v2-omachi-pref
  - text: 昭和29年（1954年）7月に大町・平村・常盤村・社村が合併して大町市が発足し、平成18年（2006年）1月に美麻村・八坂村を編入した
    kind: fact
    level: E2
    status: established
    sources:
    - v2-omachi-pref
  - text: 大町市には国宝の仁科神明宮や仁科三湖（青木湖・中綱湖・木崎湖）があり、黒部ダム・立山黒部アルペンルートの長野県側の玄関口である
    kind: fact
    level: E2
    status: established
    sources:
    - v2-omachi-pref
  - text: 大町市の地方公共団体コードは202126である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 「大きな町」ではなく、二つの町の総称だった
    text: 「大町」という名は、町が大きかったから付いたのではない。もともとは「本町」と「仲町」という、市場町の二つの町並みをまとめて呼ぶ総称だったという。仁科氏の居館のまわりには三日町・五日町といった定期市の立つ町が並び、やがて千国街道の宿場として賑わった。二つの町の名が合わさって残り、昭和の合併で市の名になった。佐賀県の大町町と同名だが、由来の層はまったく別の土地の話である。
    sources:
    - v2-omachi-wiki
    - v2-omachi-pref
  relations:
  - pref/20
  - muni/41-大町町
  unknowns:
  - 『角川日本地名大辞典 20 長野県』の「大町」項目を直接確認できなかった（Wikipedia経由の紹介による）
  - 佐賀県大町町との由来の異同は、相手方のレコード作成時に確認する
  updated: '2026-11-13'
- id: muni/20-安曇野市
  code: '202207'
  names:
    ja: 安曇野市
    reading: あづみのし
    aliases:
    - 安曇
    - 安曇野
  user_terms:
  - あづみのし
  - 安曇野
  - わさびのまち
  - 北アルプスのふもと
  - 安曇の名前の由来
  naming_type: 合併新設
  prefecture: 長野県
  homonyms: []
  summary: 安曇野市は2005年に豊科町・穂高町・三郷村・堀金村・明科町の5町村が合併して生まれた市で、名は古代の信濃国安曇郡を受け継ぐ。「安曇」は、綿津見神を祖神とする海人の有力氏族・安曇氏（阿曇氏）の名であり、北九州の志賀島を本拠とした同氏の一部が、姫川をさかのぼって内陸の信濃・安曇郡に住み着いたと伝えられる。海から遠く離れた山国に、海の神を祀る穂高神社と船の祭りが残るのはそのためとされる。
  first_attestation:
    era: 古代
    year_western: null
    document: （未確認）
    note: 信濃国安曇郡の名は平安時代の文献に遡ると考えられるが、本調査では一次資料の原文で確認できなかった。なお『和名類聚抄』には筑前国糟屋郡の「阿曇郷」がみえ（國學院大學の神名データベースによる）、これは安曇氏の本拠地側の地名である
  claims:
  - text: 平成17年（2005年）10月1日に、豊科町・穂高町・三郷村・堀金村・明科町の5町村が合併して安曇野市が誕生した
    kind: fact
    level: E2
    status: established
    sources:
    - v2-azumino-bunsho
  - text: 現在の安曇野市一帯は古代の信濃国安曇郡にあたり、市名「安曇野」はこの郡名を受け継ぐ
    kind: fact
    level: E4
    status: established
    sources:
    - v2-azumi-reinet
  - text: 國學院大學の神名データベースによれば、綿津見神は阿曇連（安曇氏）が祖神として奉斎する神で、阿曇連は海人を統括した有力な氏族であり、その拠点は筑前国糟屋郡阿曇郷（現在の福岡市東区和白・糟屋郡新宮町付近）とされる
    kind: fact
    level: E2
    status: established
    sources:
    - v2-azumi-kokugakuin
  - text: 志賀島の志賀海神社では阿曇氏が綿津見神を祀っており、『先代旧事本紀』は三柱の綿津見神を阿曇連らの祀る「筑紫斯香神」すなわち志賀の神と明記する（國學院大學の神名データベースが紹介するもの）
    kind: fact
    level: E2
    status: established
    sources:
    - v2-azumi-kokugakuin
  - text: 本拠地を離れた安曇族の一部は日本海を北上し、交易関係にあった越後の糸魚川にたどり着いて、そこから姫川をさかのぼり、信濃国の安曇郡に住み着いたと伝えられる
    kind: legend
    level: E4
    status: established
    sources:
    - v2-azumi-reinet
  - text: 穂高神社はこの地の安曇氏が祖神を祀った古社とされ、穂高見命や綿津見命など海の神を祀っており、海のない山国でありながら船を用いる「御船祭り」が行われる
    kind: fact
    level: E4
    status: established
    sources:
    - v2-azumi-reinet
  - text: 「安曇」の語源については、「海人津見（あまつみ）」が転訛したもので「海に住む人」を意味するという説がある
    kind: fact
    level: E4
    status: contested
    sources:
    - v2-azumi-reinet
  - text: 安曇野市の地方公共団体コードは202207である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 海のない山国に残る、海の神と船の祭り
    text: 安曇野のほぼ中央に鎮座する穂高神社では、毎年、舟の形をした山車を引き回してぶつけ合う「御船祭り」が行われる。周囲に海はなく、あるのは北アルプスの山々と田園だけである。それなのに祭神は海の神・綿津見命であり、その子で安曇氏の祖とされる穂高見命である。海人だった安曇氏が遠く九州から移り住んだという伝承は、この不思議な取り合わせを説明するために語り継がれてきた。「安曇野」という地名は、山国に残された海の記憶なのである。
    sources:
    - v2-azumi-reinet
  relations:
  - pref/20
  unknowns:
  - 信濃国安曇郡の初出を一次資料（『和名類聚抄』等）の原文で確認できなかった
  - 安曇氏の信濃への移住の時期と経路は伝承の域を出ておらず、考古学的な裏付けを確認できなかった
  - 2005年の合併に際して市名「安曇野市」が選定された経緯（公募・協議の過程）の詳細を確認できなかった
  updated: '2026-11-13'
- id: muni/20-小諸市
