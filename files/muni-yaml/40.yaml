    note: 「糸田」の地名の起こりは湧泉「泌泉」と結びつけて語られるが、「糸田」の初出文献は確認できなかった
  claims:
  - text: 泌泉（たぎり）は、糸田町の地名の由来である「いと良き田」を潤したとされる湧泉で、町指定文化財（史跡）に指定されている
    kind: fact
