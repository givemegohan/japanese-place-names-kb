  naming_type: 旧行政区画名の継承
  naming_note: 郡名「築上郡」を採用
  formation: 合併新設
  prefecture: 福岡県
  homonyms: []
  summary: 築上郡の町。2006年1月10日に椎田町と築城町が新設合併して発足した。町名は郡名「築上郡」に由来する。築上郡は1896年に築城郡と上毛郡が合併してできた郡で、「築城」の「築」と「上毛」の「上」の頭文字を合成した郡名である。ただし築上町の区域は旧築城郡のみで、旧上毛郡は町域に含まれない。
  first_attestation:
    era: 平成時代
    year_western: 2006
    document: 椎田町・築城町の新設合併による築上町の発足
    note: 町名の由来である郡名「築上」は、1896年の築城郡・上毛郡の合併で生まれた合成地名である
  claims:
  - text: 町名は郡名「築上郡」に由来する
    kind: fact
    level: E5
    status: established
    sources:
    - r5-chikujo-wiki
  - text: 築上郡は1896年（明治29年）に、築城郡と上毛郡の区域をもって設置された郡である
    kind: fact
    level: E4
    status: established
    sources:
    - upg-ae5-uub-fukuoka
  - text: 「築上」の名は、「築城」の「築」と「上毛」の「上」の頭文字を合成した名前であるとされる
    kind: fact
    level: E5
    status: established
    sources:
    - r5-chikujo-wiki
  - text: 築上町の区域は全域が旧築城郡に属し、旧上毛郡は含まれない。一方、町が属する築上郡は旧上毛郡側（現在の吉富町・上毛町など）まで含む郡であり、町名「築上」は町域を越えた広がりを持つ郡の名を継いだ形になっている
    kind: fact
    level: E2
    status: established
    sources:
    - upg-p2-chikujo-rekishi
    - upg-p2-chikujo-gun-kotobank
  - text: 1889年には築城郡の椎田村・西角田村・葛城村・八津田村・築城村・上城井村・下城井村が発足し、1898年に椎田村が町制を施行、1955年に新椎田町と築城町が成立した
    kind: fact
    level: E2
    status: established
    sources:
    - upg-p2-chikujo-rekishi
  - text: 2006年1月10日に椎田町と築城町が新設合併して築上町が発足した
    kind: fact
    level: E2
    status: established
    sources:
    - upg-p2-chikujo-rekishi
    - r3-iizuka-kokudo
  - text: 合併協議は当初、行橋市・京都郡3町など6市町で進められたが築城町の離脱で破談し、次いで豊前市・椎田町・築城町の協議も椎田町の住民投票で反対多数となり破談した末、合併特例法の期限間際に2町だけの協議会を設けて合併に漕ぎ着けた
    kind: fact
    level: E4
    status: established
    sources:
    - upg-p2-chikujo-jichiro
    - upg-p2-chikujo-buzen-gikai
  - text: 築上町の地方公共団体コードは406473である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 郡名を名乗るのに、郡の半分は町内にない
    text: 築上町の名は郡名「築上郡」から採られた。だが築上郡という郡自体、1896年に築城郡と上毛郡を合成して作られた人工的な名前で、「築城」の築と「上毛」の上を継ぎ合わせたものだ。現在の築上郡は築上町と上毛町・吉富町などからなるが、築上町の区域は旧築城郡だけであり、「上」にあたる旧上毛郡は町内にはない。二度の破談を経て期限間際に成立した合併で、町は自らの区域を越える広がりを持つ郡名を選んだ。町内にはその名に「城」の字を残す航空自衛隊築城基地もある。
    sources:
    - r5-chikujo-wiki
  relations:
  - pref/40
  unknowns:
  - 合併時に「築上」以外の町名候補があったかは確認できなかった
  - 「築城」「上毛」それぞれの語源は確認できなかった
  updated: '2026-11-13'
