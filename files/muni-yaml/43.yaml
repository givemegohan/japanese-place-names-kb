  naming_type: 一部の地名
  prefecture: 熊本県
  homonyms: []
  summary: 肥後国葦北郡の水俣郷に遡る古い地名を受け継ぐ市で、「みなまた」は『延喜式』（927年）や『和名類聚抄』（930年代）に記されていると熊本県の資料は紹介する。語源は、水俣川や湯出川が合流して水が「股」になる地形によるとする説が伝えられる。明治22年（1889年）に郷名を採って水俣村が発足し、昭和24年（1949年）4月1日に市制を施行した。水俣病の公式確認は昭和31年（1956年）で、地名そのものはそれより千年以上古い。
  first_attestation:
    era: 延喜式
    year_western: 927
    document: 『延喜式』（葦北郡水俣郷）
    note: 熊本県の市町村史資料は「みなまた」の地名が『延喜式』（927年）・『和名類聚抄』（930年代成立）に記されているとする。原文は未確認のため紹介形で記録する
  claims:
  - text: 水俣市の地方公共団体コードは432059である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  - text: 「みなまた」の地名は古くからあり、『延喜式』（927年）や『和名類聚抄』（930年代に成立）にも記されていると熊本県の市町村史資料は紹介している
    kind: fact
    level: E2
    status: established
    sources:
    - r6-minamata-pref
  - text: 地名の由来は、水俣川・湯出川などがこの地で合流し、水が「股」になっている様子によるものであろうと、同資料は吉田東伍『大日本地名辞書』の葦北郡水俣郷の記述を引いて紹介している
    kind: fact
    level: E2
    status: indeterminate
    sources:
    - r6-minamata-pref
  - text: 明治22年（1889年）の町村制施行の際、それまでの村々が合併して「郷名をとって」水俣村が発足した
    kind: fact
    level: E2
    status: established
    sources:
    - r6-minamata-pref
  - text: 水俣市は昭和24年（1949年）4月1日に市制を施行して発足し、昭和31年（1956年）9月1日には久木野村を編入した
    kind: fact
    level: E2
    status: established
    sources:
    - r6-minamata-pref
  - text: 平成の市町村合併では、隣接する津奈木町との合併協議が住民投票の結果で協議会設置に至らず、水俣市は合併を行わなかった
    kind: fact
    level: E2
    status: established
    sources:
    - r6-minamata-pref
  - text: 水俣病が公式に確認されたのは昭和31年（1956年）であり、「水俣」の地名が文献に現れる時期より千年以上あとのことである
    kind: fact
    level: E2
    status: established
    sources:
    - r6-minamata-pref
  column:
    title: 病名より千年古い地名
    text: 「水俣」と聞けば多くの人が水俣病を思い浮かべる。しかし地名としての水俣は、熊本県の資料によれば『延喜式』や『和名類聚抄』にすでに現れる10世紀の名である。水の流れが股に分かれる地形から来たという説が伝えられる。水俣病の公式確認は1956年で、地名の初出からは千年以上が過ぎていた。病の歴史が地名を覆い尽くしたように見えるこの町でも、名そのものははるかに長く、川の合流する土地の姿を写してきたことになる。
    sources:
    - r6-minamata-pref
  relations:
  - pref/43
  unknowns:
  - 『延喜式』における水俣郷の記載の原文は未確認（熊本県資料の紹介による）
  - 語源の「水の股」説以外の説の有無は確認できなかった
  updated: '2026-11-13'
- id: muni/43-氷川町
  code: '434680'
  names:
    ja: 氷川町
    reading: ひかわちょう
    aliases: []
  user_terms:
  - ひかわちょう
  - 氷川が流れる町
  - 吉野梨の町
  naming_type: 合併新設（2005年の合併に際し、両町を流れる二級河川・氷川の名を公募で採用）
  prefecture: 熊本県
  homonyms: []
  summary: 八代郡の町で、熊本県中央部を流れる二級河川・氷川にちなむ。2005年に竜北町と宮原町が合併した際、新町名の公募では両町に共通する川の名を冠した「氷川」の応募が最多となり、協議会委員の投票で「氷川町」に決した。川の名をそのまま町名にした平成合併の命名である。
  first_attestation:
    era: 平成17年
    year_western: 2005
    document: 竜北町・宮原町の合併による氷川町の発足
    note: 町名としての命名そのもの。河川名「氷川」自体の初出・由来は未確認（unknowns参照）
  claims:
  - text: 総務省の全国地方公共団体コードで、氷川町の団体コードは434680と定められている
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  - text: 平成17年（2005年）10月1日、八代郡の竜北町と宮原町が合併して氷川町が誕生した
    kind: fact
    level: E2
    status: established
    sources:
    - r9-pref-hikawa
  - text: 合併協議に際して合併協議会は新町名を公募したが、当該地域は共に氷川流域にあり、その多大な恩恵を受けていたことから、「氷川」の名を冠した応募が最多であった。最終的には合併協議会委員の投票で決したが、地域住民にも馴染みの深いこの町名に決したのは自然な成り行きであった
    kind: fact
    level: E2
    status: established
    sources:
    - r9-pref-hikawa
  - text: 氷川は町を東西に貫流して不知火海に注ぐ二級河川で、流域の田園地帯を潤している。氷川町長も随想で「町名の由来となる二級河川『氷川』が町の中央部を東から西へ流れる」と述べている
    kind: fact
    level: E2
    status: established
    sources:
    - r9-pref-hikawa
    - r9-hikawa-zck
  - text: 合併前の竜北町は、昭和29年（1954年）4月1日に和鹿島村・吉野村・野津村が合併して誕生した竜北村が、昭和49年（1974年）に町制を施行したものである
    kind: fact
    level: E2
    status: established
    sources:
    - r9-pref-hikawa
  column:
    title: 川の名をもらった町と、消えた村の名の梨
    text: 氷川町は、合併する2町に共通するものとして川の名を選んだ。公募でも「氷川」を冠した応募が最も多く、協議会の投票でそのまま町名になった。一方、合併で消えた地名のすべてが消えるわけではない。旧竜北村を構成した村の一つに吉野村があり、町の東部の丘陵地帯は今も「吉野梨」で知られる梨の産地である。新しい町名が川から来たのに対し、果物の名のほうに古い村の名が残った格好である。
    sources:
    - r9-pref-hikawa
  relations:
  - pref/43
  unknowns:
  - 河川名「氷川」の由来と初出は確認できなかった（各地の氷川神社との関係の有無も含め未確認）
  - 新町名公募の応募総数や、氷川以外の最終候補は確認できなかった
  updated: '2026-11-13'
- id: muni/43-津奈木町
  code: '434841'
  names:
    ja: 津奈木町
    reading: つなぎまち
    aliases: []
  user_terms:
  - つなぎまち
  - つなぎ美術館の町
  - 不知火海の港町
  naming_type: その他（景行天皇が大泊の港に船を繋いだという故事に由来すると伝えられる古い地名）
  prefecture: 熊本県
  homonyms: []
  summary: 不知火海に面する葦北郡の港町。町名「津奈木（つなぎ）」は、景行天皇が熊襲征伐の折に大泊の港へ寄港して船を繋いだという故事に由来すると、県の資料や『日本大百科全書』が伝える。藩政期には津奈木手永の名として行政区画にも使われ、1889年に津奈木村、1963年に津奈木町となった。
  first_attestation:
    era: 江戸時代
    year_western: null
    document: 津奈木手永（藩政期の行政区画名として）
    note: 「津奈木」の名が行政区画の名として使われていたことは確認できるが、名そのものの文献上の初出は未確認。起こりは景行天皇の大泊寄港の故事で説明される
  claims:
  - text: 総務省の全国地方公共団体コードで、津奈木町の団体コードは434841と定められている
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  - text: 景行天皇が熊襲征伐の折、不知火海を船で通り、本町の大泊に寄港して船を繋がれたことから、「つなぎ」の名がついたといわれる。『日本大百科全書（ニッポニカ）』も、町名は「景行天皇が大泊（おおど）港に船をつながれた」との故事に由来するとする
    kind: legend
    level: E2
    status: established
    sources:
    - r9-pref-tsunagi
    - r9-tsunagi-nipponika
  - text: 「つなぎ」という音と船を繋ぐ行為で名を説明する伝承からみて、現在の漢字表記「津奈木」は、音に字を当てた当て字であると考えられる
    kind: fact
    level: H
    status: inferred
    sources:
    - r9-pref-tsunagi
  - text: 藩政時代には手永制が布かれ、津奈木は惣庄屋によって支配される行政区画（津奈木手永）の名として用いられた
    kind: fact
    level: E2
    status: established
    sources:
    - r9-pref-tsunagi
  - text: 明治22年（1889年）、町村制の施行に伴い岩城・津奈木・千代・福浜および小津奈木の一部が合併して津奈木村となり、昭和38年（1963年）に町制を施行して津奈木町となった
    kind: fact
    level: E2
    status: established
    sources:
    - r9-pref-tsunagi
    - r9-tsunagi-nipponika
  - text: 町の西の海岸線はリアス式で良港に富んでおり、千代川と染竹川が合流して津奈木川となって津奈木湾に注ぐ。名の由来の故事が語るように、津奈木は不知火海に開けた湊の町である
    kind: fact
    level: E2
    status: established
    sources:
    - r9-pref-tsunagi
  column:
    title: 天皇の船をつないだ港
    text: 「つなぎ」という名の説明は、古代の天皇の巡幸に結びつけられている。景行天皇が熊襲征伐の航路で不知火海を通り、大泊の港に船を繋いだ――それが「つなぎ」の起こりだという。不知火海に面した津奈木の海岸は入り組んだリアス式で、小さな良港に恵まれてきた。古代の帝の故事は史実とは確かめられないが、港として古くから船が出入りした土地だからこそ、船を「繋ぐ」行為に名の由来を求める語りが生まれたのだろう。町内には津奈木城趾や、孝女千代の墓と伝える千代塚などの史跡も残る。
    sources:
    - r9-pref-tsunagi
    - r9-tsunagi-nipponika
  relations:
  - pref/43
  unknowns:
  - 「津奈木」の名の文献上の初出は確認できなかった（中世の文書への登場の有無を含む）
  - 「奈木」の部分の語源は確認できず、「津奈木」の字がいつから当てられたかも未確認
  - 大泊という港の名が現在の地名として残っているかは確認できなかった
  updated: '2026-11-13'
- id: muni/43-湯前町
  code: '435066'
  names:
    ja: 湯前町
    reading: ゆのまえまち
    aliases: []
  user_terms:
  - ゆのまえまち
  - くま川鉄道の終着駅の町
  - まんが美術館の町
  naming_type: その他（湧き水の「井の前（イノマエ）」が転訛して「ユノマエ」となったと『湯前町史』が伝える古い地名）
  prefecture: 熊本県
  homonyms: []
  summary: 人吉盆地の東端、球磨郡の町。読みは「ゆのまえ」。『湯前町史』によれば、名の起源は温泉の「湯」ではなく、古城台地の崖下に湧く泉群「井（イ）」の前にできた集落「イノマエ」が転訛したものとされる。1889年に湯山との組合村から分かれて湯前村となり、1937年に町制を施行した。
  first_attestation:
    era: 明治22年
    year_western: 1889
    document: 町村制施行に伴う湯前村の発足
    note: 自治体としての発足時点。それ以前は湯山と組合村を組織しており、地名の起源は中世の湯前氏の居城があった古城台地の「イノマエ」に求められると町史が伝える
  claims:
  - text: 総務省の全国地方公共団体コードで、湯前町の団体コードは435066と定められている
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  - text: 『湯前町史』によると、古くは古城台地に湯前氏の居城がおかれていたことから、台地の南崖下に湧き出る「井（イ）」といわれる泉群を中心に形成された「イノマエ」が転訛して「ユノマエ」となったと考えられている。すなわち町史の説では、名の起こりは温泉の「湯」ではなく湧き水の「井の前」にある
    kind: fact
    level: E2
    status: established
    sources:
    - r9-yunomae-sougou
  - text: 当時の湯前は湯山（現在の水上村の一部）と組合村を組織していたが、明治22年（1889年）の町村制施行に伴い湯山と分村して「湯前村」となり、昭和12年（1937年）の町制施行によって「湯前町」となった
    kind: fact
    level: E2
    status: established
    sources:
    - r9-yunomae-sougou
  - text: 町内の大谷川には鉱泉が存在し、戦前頃までは鉱泉を沸かした湯治場として賑わいをみせていたとされる。名の由来とは別に、湯前に「湯」にゆかりの歴史もあった
    kind: fact
    level: E2
    status: established
    sources:
    - r9-yunomae-fuchi
  - text: 球磨川は、商人・林正盛が寛文5年（1665年）に河川改修工事を完成させたことで河口の八代までの水路が確保され、産物の搬出入が容易になった。湯前は球磨川を通じて下流と結ばれる上球磨の要衝であった
    kind: fact
    level: E2
    status: established
    sources:
    - r9-yunomae-fuchi
  column:
    title: 「湯の前」なのに、由来は井戸だった
    text: 「湯前」という字面からは、温泉の手前にある町を想像しがちである。ところが『湯前町史』の説明は違う。町の中心だった古城台地の崖下には「井」と呼ばれる湧き水の泉群があり、その前にできた集落が「イノマエ」と呼ばれ、それが転訛して「ユノマエ」になったという。つまり「湯」の字は後から音に当てられたものらしい。面白いことに、町の大谷川には実際に鉱泉があり、戦前までは湯治場として賑わったというから、「湯」と無縁でもなかったことになる。対になる湯山（現・水上村）とは、もとは一つの組合村だった。
    sources:
    - r9-yunomae-sougou
    - r9-yunomae-fuchi
  relations:
  - pref/43
  - muni/43-水上村
  unknowns:
  - 「イノマエ」説の根拠となった古文書等の一次資料は未読で、町史の記述以上には遡れなかった
  - 「湯前」という漢字表記がいつから用いられたかは確認できなかった
  updated: '2026-11-13'
- id: muni/43-熊本市
  code: '431001'
  names:
    ja: 熊本市
    reading: くまもとし
    aliases:
    - 隈本
  user_terms:
  - 熊本は昔は隈本だったの
  - 清正が熊の字に変えた理由
  - 隈本城と熊本城は同じ場所
  - 熊本市はいつできた
  naming_type: その他（城下町名の継承。ただし表記は近世初頭に「隈本」から「熊本」へ改められた）
  prefecture: 熊本県
  homonyms: []
  summary: 市名は城下町「熊本」に由来し、その旧表記は「隈本」である。隈本の名は南北朝時代の軍忠状に確認でき、1607年の熊本城完成の頃に「隈」から「熊」へ表記が改められたとされる。改字の理由として語られる「畏を嫌った」という説明は伝承の域を出ない。1889年に市制が施行された。
  first_attestation:
    era: 観応2年
    year_western: 1351
    document: 伊東氏祐軍忠状
    note: 「隈本在陣」とあり、「隈本」の初見とされる（熊本市の講座資料による）。「隈本城」の初見は永和3年（1377年）の大嶋堅軍忠状
  claims:
  - text: 市名「熊本」は城下町の名に由来し、熊本市は1889年（明治22年）の市制施行以来、周辺町村との合併を繰り返して発展してきた
    kind: fact
    level: E2
    status: established
    sources:
    - f-cap-kumamoto-city-plan
  - text: 「隈本」の初見は観応2年（1351年）の伊東氏祐軍忠状の「隈本在陣」で、「隈本城」の初見は永和3年（1377年）の大嶋堅軍忠状である
    kind: fact
    level: E2
    status: established
    sources:
    - f-cap-kumamoto-city-lecture
  - text: 中世の隈本城は茶臼山の一角に築かれた城で、現在の熊本城の本丸一帯とは位置が少しずれており、近世の城とは区別して「古城」と呼ばれている
    kind: fact
    level: E2
    status: established
    sources:
    - f-cap-kumamoto-city-lecture
    - f-kumamoto-kotobank
  - text: 1607年（慶長12年）の熊本城完成の頃、「隈本」から「熊本」への表記変更が行われたとされる
    kind: fact
    level: E2
    status: established
    sources:
    - f-kumamoto-maff
  - text: 加藤清正が「隈」の字に「畏（おそれる）」の字を含むことを嫌い、武将の居城にふさわしくないとして「熊」の字に改めた、と広く伝えられている
    kind: legend
    level: E2
    status: established
    sources:
    - f-kumamoto-maff
  - text: 「隈」は川の屈曲部や山の奥まった場所を指す地形語であり、隈本も地形に由来する地名とする見方が地名学では示されている
    kind: fact
    level: E3
    status: contested
    sources:
    - f-kumamoto-kotobank
  - text: 隈本の由来として、菊池氏の祖・菊池則隆が鞍岳から眺めた山並みの「隈取り」にちなんで隈本・隈府と名付けたとする伝承が語られている
    kind: legend
    level: E4
    status: established
    sources:
    - f-kumamoto-kikuchi
  - text: 熊本市は2012年（平成24年）4月1日に政令指定都市へ移行し、九州では福岡市・北九州市に次ぐ政令市となった
    kind: fact
    level: E2
    status: established
    sources:
    - f-cap-kumamoto-city-plan
  column:
    title: 清正は「くまもと城」を二つ造った
    text: 熊本城と聞いて思い浮かべる天守は加藤清正の新城だが、清正はそれ以前に、中世の隈本城を取り込んだ「古城」も造っている。熊本市の講座資料は「清正は新旧二つの『くまもと城』を造った」と整理する。中世の隈本城は茶臼山の一角にあり、新城の本丸とは場所がずれる。地名のほうも同じで、「隈本」の舞台は古城の側、「熊本」の舞台は新城の側というように、字の交代と城の交代がほぼ重なって起きた。だから熊本の中心市街を歩くと、中世と近世の二つの「くまもと」が同じ丘の上に重なっている。
    sources:
    - f-cap-kumamoto-city-lecture
  relations:
  - pref/43
  unknowns:
  - 加藤清正が隈本から熊本への改字を命じたことを示す同時代の正式文書の現存は、本調査では確認できなかった
  - 「隈本」の語源（地形由来か、その他か）は確定していない
  updated: '2026-11-13'
- id: muni/43-玉名市
  code: '432067'
  names:
    ja: 玉名市
    reading: たまなし
    aliases:
    - 玉名町
    - 玉名郡
    - 玉杵名
    - 玉杵名邑
  user_terms:
  - たまな
  - 玉名温泉
  - 草枕の小天温泉
  - 金栗四三の出身地
  naming_type: 合併新設
  prefecture: 熊本県
  homonyms: []
  summary: 菊池川下流の玉名平野に広がる、玉名郡の中心地だった市。古代の名は「玉杵名（たまきな）」で、『日本書紀』景行天皇18年の条に「玉杵名邑」と見え、『和名類聚抄』では「多萬伊名（タマイナ）」と記されるなど、タマキナ→タマイナ→タマナと音が変化して現在の「玉名」になったと考えられている。昭和29年（1954年）に玉名町ほか13町村の合併で市制を施行し、平成17年（2005年）10月3日に岱明町・横島町・天水町と新設合併した。このとき新市名の最終投票では古代名「玉杵名市」が対抗候補に残った。
  first_attestation:
    era: 景行天皇18年
    year_western: null
    document: 日本書紀巻七
    note: 玉名市立歴史博物館が、『日本書紀』景行天皇18年の条にこの地が「玉杵名邑（タマキナムラ）」と呼ばれていたことを紹介する。原文は未読のため紹介形で記録する
  claims:
  - text: 玉名市の地方公共団体コードは432067である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  - text: 『日本書紀』景行天皇18年の条では、この地は「玉杵名邑（タマキナムラ）」と呼ばれていたと、玉名市立歴史博物館が紹介している
    kind: fact
    level: E2
    status: established
    sources:
    - s1-tamana-city-museum
  - text: 平安時代の『和名類聚抄』には「多萬伊名（タマイナ）」と記され、「玉杵名（タマキナ）」から「玉名（タマナ）」へ音が変化してきたと考えられている
    kind: fact
    level: E2
    status: established
    sources:
    - s1-tamana-city-museum
  - text: 「玉杵名」は「魂来名」の意で、タマは霊、キは来、ナは地域を意味し、「神霊が依り来る聖地」と解されると、玉名市立歴史博物館が説明している
    kind: fact
    level: E2
    status: inferred
    sources:
    - s1-tamana-city-museum
  - text: 昭和29年（1954年）の合併・市制にあたっては、市域が玉名郡の中心地で官公庁の多くが「玉名」を冠していたことから、郡名の「玉名」を新市名とすることが最も適切と判断された
    kind: fact
    level: E2
    status: established
    sources:
    - s1-tamana-pref
  - text: 平成17年（2005年）10月3日に玉名市・岱明町・横島町・天水町が新設合併し、新市名は候補の「玉名市」と「玉杵名市」の2案について合併協議会委員の投票が行われ、「玉名市」に決した
    kind: fact
    level: E2
    status: established
    sources:
    - s1-tamana-pref
  - text: 近世の玉名は、菊池川の河港・高瀬に熊本藩の高瀬御蔵が置かれ、菊池川流域の米が大阪へ搬出される藩財政の窓口として栄えた
    kind: fact
    level: E2
    status: established
    sources:
    - s1-tamana-pref
  - text: 『日本書紀』景行天皇18年の条は、九州を巡った景行天皇が玉杵名邑に至り、王化に従わない土蜘蛛の津頬を誅したと伝えており、この地が玉杵名の故地とされる玉名大神宮にその物語が受け継がれている
    kind: legend
    level: E2
    status: established
    sources:
    - s1-tamana-city-museum
  column:
    title: あと一歩で「玉杵名市」になるところだった
    text: 平成17年（2005年）の合併で新市名を決める際、候補には「有明市」「城北市」「たまな市」と並んで、古代の名を復活させる「玉杵名市」が入っていた。最終的には「玉名市」と「玉杵名市」の2案で協議会委員の投票が行われ、「玉名市」が選ばれた。もし結果が逆なら、『日本書紀』に登場する「玉杵名邑」の名が、1,900年近くをへて市名としてよみがえっていたことになる。タマキナ→タマイナ→タマナという音の変化の途中の姿が、候補として真剣に争われた珍しい事例である。
    sources:
    - s1-tamana-pref
    - s1-tamana-city-museum
  relations:
  - pref/43
  - muni/43-山鹿市
  - muni/43-荒尾市
  unknowns:
  - 『日本書紀』景行天皇18年条の原文は未読のため、玉杵名邑の初出と土蜘蛛・津頬の物語は博物館資料による紹介形にとどめた
  - 「玉杵名」の「魂来名」という解釈は市立博物館の説明であり、言語学的な定説かどうかは確認できなかった
  updated: '2026-11-13'
- id: muni/43-玉東町
  code: '433641'
  names:
    ja: 玉東町
    reading: ぎょくとうまち
    aliases: []
  user_terms:
  - ぎょくとうまち
  - 玉名郡の東の町
  - 木葉山の町
  naming_type: 合併新設（1955年の新村発足に際し、玉名郡の東部に位置することから住民公募で命名）
  prefecture: 熊本県
  homonyms: []
  summary: 熊本県北部、玉名郡の南東部にある町。1955年に山北村と木葉村が合併した際、住民公募により、玉名郡の東部に位置することから「玉東村」が選ばれ、1967年に町制を施行して玉東町となった。郡名の一部と方角を組み合わせた、位置を示す命名である。
  first_attestation:
    era: 昭和30年
    year_western: 1955
    document: 新村発足時の住民公募による「玉東村」の命名（熊本県の合併資料）
    note: 命名そのもの。1967年4月1日の町制施行で「玉東町」となった
  claims:
  - text: 総務省の全国地方公共団体コードで、玉東町の団体コードは433641と定められている
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  - text: 昭和30年（1955年）3月の新村発足にあたり、合併二か村（山北村・木葉村）の住民から公募したもので、玉名郡の東部に位置するところから「玉東村」が選ばれた
    kind: fact
    level: E2
    status: established
    sources:
    - r9-pref-gyokuto
  - text: 昭和42年（1967年）4月1日に町制を施行し、玉東町となった
    kind: fact
    level: E2
    status: established
    sources:
    - r9-pref-gyokuto
  - text: 「玉東」の名は、郡名「玉名」の「玉」に方角の「東」を組み合わせ、郡の東部という位置を示した命名と考えられる
    kind: fact
    level: H
    status: inferred
    sources:
    - r9-pref-gyokuto
  - text: 前身の山北村・木葉村は、明治22年（1889年）に木葉・上木葉・山口・稲佐・浦田・上白木・白木・二俣・西安・原倉の各村が合併してできた村々である
    kind: fact
    level: E2
    status: established
    sources:
    - r9-gyokuto-plan
  - text: 町北部の木葉山には石灰岩が埋蔵し、明治のころから生石灰・タンカル製造が主産業として栄えた。合併で消えた旧村名「木葉」は、山の名として今も残っている
    kind: fact
    level: E2
    status: established
    sources:
    - r9-gyokuto-plan
  column:
    title: 郡の名前を半分もらった町
    text: 「玉東」は、玉名郡の「玉」と「東」をつないだ名である。1955年の合併では新村の名を住民から公募し、「玉名郡の東部に位置する」という理由でこの名が選ばれた。旧村の山北・木葉のどちらでもない第三の名として、郡と方角だけで土地を示す、潔い命名だった。一方の旧村名「木葉」は、石灰岩の山・木葉山の名として残り、町の産業史を今に伝えている。
    sources:
    - r9-pref-gyokuto
    - r9-gyokuto-plan
  relations:
  - pref/43
  unknowns:
  - 公募の応募総数や玉東以外の候補名は確認できなかった
  - 郡名「玉名」自体の由来は、本レコードでは確認していない
  updated: '2026-11-13'
- id: muni/43-球磨村
  code: '435139'
  names:
    ja: 球磨村
    reading: くまむら
    aliases: []
  user_terms:
  - くまむら
  - 球磨川中流の山村
  - 一勝地駅のある村
  naming_type: 合併新設（1954年の合併に際し、球磨川の「球磨」をとって命名）
  prefecture: 熊本県
  homonyms: []
  summary: 球磨川中流の両岸に沿う球磨郡の山村。1954年に渡村・一勝地村・神瀬村が合併した際、三村の住民の生活と歴史が球磨川とともにあったことから、球磨川の「球磨」をとって「球磨村」と名付けられた。村名の直接の出どころは郡名ではなく川の名である。
  first_attestation:
    era: 昭和29年
    year_western: 1954
    document: 渡村・一勝地村・神瀬村の合併による球磨村の発足（熊本県の合併資料）
    note: 村名としての命名そのもの。「球磨」の名自体は球磨川・球磨郡の名として古くから使われてきたが、その語源は未確認
  claims:
  - text: 総務省の全国地方公共団体コードで、球磨村の団体コードは435139と定められている
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  - text: 渡村・一勝地村・神瀬村の合併は昭和28年（1953年）当初から議論され、翌29年（1954年）1月に三村の村議会が相次いで合併を議決し、同年4月1日から新たに球磨村が設置された
    kind: fact
    level: E2
    status: established
    sources:
    - r9-pref-kuma
  - text: 村名の由来について熊本県の合併資料は、昭和の合併時の三か村の住民は球磨川の流れとともにその歴史をつくってきたこと、球磨川の電源開発などにより新村の産業の発展も一層期待されているなどの理由から、昭和の合併時に球磨川の「球磨」をとって新村名としたと記す。村名は郡名（球磨郡）からではなく、川の名から直接採られた
    kind: fact
    level: E2
    status: established
    sources:
    - r9-pref-kuma
  - text: 村は球磨川中流部の北岸・南岸に沿って位置し、村の中央を東から西へ球磨川が流れて地域を大きく二分する。村域の88パーセントは山林で、村全体が山岳地帯である
    kind: fact
    level: E2
    status: established
    sources:
    - r9-pref-kuma
  - text: 球磨川は日本三急流の一つに数えられる川で、国土交通省の資料によれば、流域では人吉に相良氏が入った1200年頃から開田や利水事業が積極的に実施され、鎌倉時代に人吉城が築造されるなど、古くから流域の歴史の中心にあった
    kind: fact
    level: E2
    status: established
    sources:
    - r9-kumagawa-mlit
    - r9-yunomae-fuchi
  column:
    title: 「一升地」が「一勝地」になった谷
    text: 球磨村の旧村の一つ、一勝地村の地域は、かつて大牟田谷村・松谷村・毎床谷村・一勝地谷村に分かれていた。県の資料はこの谷の名を「一勝地（一升地）」と併記する。枡の量目のような「一升地」の字が、勝負に勝つ「一勝地」になったらしい。村内には肥薩線の渡・一勝地・那良口の各駅があり、「一勝地」という駅名は、球磨川に沿う山村の地名として今も残っている。川の名をもらった村の中に、字の姿を変えた小さな谷の名が生きている。
    sources:
    - r9-pref-kuma
  relations:
  - pref/43
  - muni/43-山江村
  unknowns:
  - 「球磨」という名自体の語源（球磨川・球磨郡の名の起こり）については、確かな資料で確認できなかった
  - 1954年の命名に際して、球磨郡の郡名との関係が議論されたかどうかは、県の合併資料からは読み取れなかった
  updated: '2026-11-13'
- id: muni/43-産山村
  code: '434256'
  names:
    ja: 産山村
    reading: うぶやまむら
    aliases:
    - 宇歩山
    - 宇夫山
    - 生産山
  user_terms:
  - 産山
  - うぶやま
  - 池山水源の村
  - ヒゴタイの里
  - 阿蘇郡産山村
  naming_type: 一部の地名
  prefecture: 熊本県
  homonyms: []
  summary: 阿蘇郡の村。名は古く平安時代の文書に「宇歩山（うふのやま）」と見える山の名に由来するとみられる。一方、村に伝わる由来譚では、建磐竜命に同伴した阿蘇姫命が速瓶玉命を出産した地であることから「産山」と称されるようになったと伝えられる。1889年に産山・田尻・山鹿・大利・片俣の5村が合併して発足した。
  first_attestation:
    era: 寛弘8年
    year_western: 1011
    document: 阿蘇郡四境注文（写）（阿蘇家文書）
    note: 阿蘇郡の東境を示す12地名の一つに「宇歩山」とあることを『日本歴史地名大系』が紹介する。「産山」の漢字表記そのものの初出ではない
  claims:
  - text: 現在の産山の地は、寛弘8年（1011年）の阿蘇郡四境注文写（阿蘇家文書）に、阿蘇郡東境の地名の一つとして「宇歩山」と記されたと『日本歴史地名大系』が紹介する
    kind: fact
    level: E2
    status: established
    sources:
    - r10-ubuyama-kotobank
  - text: 当地は「宇夫山」「生産山」とも記され、「うふのやま」と呼ばれていたと『日本歴史地名大系』が紹介する
    kind: fact
    level: E2
    status: established
    sources:
    - r10-ubuyama-kotobank
  - text: 正慶元年（1332年）の阿蘇社造営料鍛冶炭苫未進注文写（阿蘇家文書）にも「宇夫山方」の用例があると『日本歴史地名大系』が紹介する
    kind: fact
    level: E2
    status: established
    sources:
    - r10-ubuyama-kotobank
  - text: 村名の由来として、建磐竜命がこの地にとどまった際、同伴した阿蘇姫命が速瓶玉命を出産したことから「山が産まれた」と言われるようになり、のち「産山」と称されるようになったと伝えられる
    kind: legend
    level: E2
    status: established
    sources:
    - r10-ubuyama-pref
  - text: 出産の地とされるのは産山川上流の「乙宮」で、昔はこの地を「元宮」と称していたと伝えられる
    kind: legend
    level: E2
    status: established
    sources:
    - r10-ubuyama-pref
  - text: 1889年（明治22年）の町村制施行時に、産山・田尻・山鹿・大利・片俣の5か村が合併して産山村が発足した
    kind: fact
    level: E2
    status: established
    sources:
    - r10-ubuyama-pref
    - r10-ubuyama-kaso
  - text: 平成の市町村合併では、一の宮町・阿蘇町・波野村との枠組みから離脱し、単独の村政を選んだ
    kind: fact
    level: E2
    status: established
    sources:
    - r10-ubuyama-pref
  - text: 村内を流れる大野川上流の池山水源は、全国名水百選に選ばれている
    kind: fact
    level: E2
    status: established
    sources:
    - r10-ubuyama-kaso
  - text: 地方公共団体コードは434256である（総務省「地方公共団体コード一覧」で確認）
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 「宇歩山」から「産山」へ——音がつないだ千年
    text: 1011年の文書に現れた「宇歩山」は「うふのやま」と読まれた。やがて宇夫山・生産山と書き換えられながら音は受け継がれ、現在の「産山（うぶやま）」になった。文書に残るこの古い層とは別に、乙宮での出産の伝説が「産」の字に物語を与えた。史実として追える音の系譜と、土地の人々が名に込めた伝承——産山の名はこの二つの層が重なってできている。
    sources:
    - r10-ubuyama-kotobank
    - r10-ubuyama-pref
  relations:
  - pref/43
  unknowns:
  - 「うふ（うぶ）」という音自体の語源は確認できなかった
  - 「産山」の漢字表記が定着した時期は確認できなかった
  - 出産伝承を伝える最古の文献は確認できなかった
  updated: '2026-11-13'
- id: muni/43-甲佐町
  code: '434442'
  names:
    ja: 甲佐町
    reading: こうさまち
    aliases: []
  user_terms:
  - 甲佐
  - こうさ
  - 甲佐神社の町
  - 緑川の鮎の町
  - 肥後国二宮のある町
  naming_type: 一部の地名
  prefecture: 熊本県
  homonyms: []
  summary: 上益城郡の町で、緑川の中流域に位置する。町名は中世以来の郷名「甲佐郷」に由来し、1955年の合併が旧甲佐郷の範囲全体に及んだため、郷名をそのまま新町名とした。郷の中心には肥後国二宮・甲佐神社があり、その社名の由来には神功皇后の甲冑にまつわる伝承が伝わる。
  first_attestation:
    era: 江戸時代
    year_western: null
    document: 甲佐手永
    note: 町公式の沿革が、江戸時代に現在の町域は甲佐手永総庄屋の支配下に統一されていたことを記す。「甲佐郷」の郷名としての初出文献は未確認
  claims:
  - text: 1955年（昭和30年）1月1日、甲佐町・宮内村・竜野村・白旗村・乙女村が合併して新しい甲佐町が発足した
    kind: fact
    level: E2
    status: established
    sources:
    - r10-kosa-geoshape
  - text: この合併は昔の甲佐郷全体が合併するものだったため、郷名をとって「甲佐町」をそのまま町名としたと、熊本県の市町村史資料が説明する
    kind: fact
    level: E2
    status: established
    sources:
    - r10-kosa-pref
  - text: 江戸時代、現在の町域は甲佐手永総庄屋の支配下に統一されていた
    kind: fact
    level: E2
    status: established
    sources:
    - r10-kosa-town
  - text: 甲佐神社は肥後国二宮で、もともと鏑崎宮（かぶらざきぐう）と称した
    kind: fact
    level: E5
    status: established
    sources:
    - r10-kosa-shrine-wiki
  - text: 甲佐神社の由緒では、健磐龍命が鏑矢を放ち、その矢が当たった所に社殿を建てたため鏑崎宮と称したと伝える
    kind: legend
    level: E4
    status: established
    sources:
    - r10-kosa-jinja-blog
  - text: 神功皇后が南九州の内乱平定後の凱旋ののち、甲冑を甲佐神社に納めたので、この地を甲佐と呼ぶようになり、鏑崎宮から甲佐宮へ改めたと言われる
    kind: legend
    level: E5
    status: established
    sources:
    - r10-kosa-shrine-wiki
  - text: 町名の由来については、甲佐神社の名称に由来すると説明する郷土資料もあり、県の公式史資料による「甲佐郷の郷名を継承した」という説明と、どの層を由来と捉えるかで説明が分かれている
    kind: fact
    level: E4
    status: contested
    sources:
    - r10-kosa-morita
    - r10-kosa-pref
  - text: 甲佐神社には、鎌倉時代の武士・竹崎季長が『蒙古襲来絵詞』を奉納した
    kind: fact
    level: E5
    status: established
    sources:
    - r10-kosa-shrine-wiki
  - text: 地方公共団体コードは434442である（総務省「地方公共団体コード一覧」で確認）
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 鏑矢と甲冑——二つの伝説を持つ甲佐神社
    text: 甲佐の歴史の中心にある甲佐神社には、二つの名の物語がある。一つは、健磐龍命が放った鏑矢（かぶらや）が当たった所に社を建てたという「鏑崎宮」の由来。もう一つは、神功皇后が甲冑を納めたので「甲佐」と呼ぶようになったという改称の物語である。町名そのものは郷名「甲佐郷」の継承だが、「甲」の字に甲冑の伝説が重なって語られてきたこの町では、地名と神社の伝承が今も切り離せない。
    sources:
    - r10-kosa-shrine-wiki
    - r10-kosa-jinja-blog
  relations:
  - pref/43
  unknowns:
  - 「甲佐郷」の郷名としての初出文献は確認できなかった
  - 「甲佐」の語源として、甲冑伝承以前の地名の成り立ちは専門資料で確認できなかった
  updated: '2026-11-13'
- id: muni/43-益城町
  code: '434434'
  names:
    ja: 益城町
    reading: ましきまち
    aliases: []
  user_terms:
  - 益城
  - ましき
  - 阿蘇くまもと空港のある町
  - 熊本地震で震度7を2度観測した町
  - 木山
  naming_type: 合併新設
  prefecture: 熊本県
  homonyms: []
  summary: 上益城郡の町。1954年に木山町など5町村が合併して発足し、町名は、郡内で最初の合併町であることを示すため、郡名の「益城」を採用したもの。「益城」は肥後国の古代郡・益城郡に遡る名で、江戸時代に上益城郡と下益城郡に分かれた。2016年の熊本地震では、同一自治体で2度の震度7を観測した。
  first_attestation:
    era: 昭和29年
    year_western: 1954
    document: 益城町の発足（木山町・飯野村・広安村・福田村・津森村の合併）
    note: 町名としての初出。郡名「益城」自体は古代の益城郡に遡る
  claims:
  - text: 1954年（昭和29年）4月1日、木山町・飯野村・広安村・福田村・津森村が合併して益城町が発足した
    kind: fact
    level: E2
    status: established
    sources:
    - r10-mashiki-pref
  - text: 町名は、昭和の合併時に郡内第一番目の合併町であることを示すため、郡名の「益城」をとって名付けたものである
    kind: fact
    level: E2
    status: established
    sources:
    - r10-mashiki-pref
  - text: 新町名は合併促進協議会の第2回会合で「益城町」と仮決定された
    kind: fact
    level: E2
    status: established
    sources:
    - r10-mashiki-pref
  - text: 「益城」は肥後国の古代郡・益城郡の名で、後世に上益城郡と下益城郡に分割された
    kind: fact
    level: E5
    status: established
    sources:
    - r10-mashiki-gun-wiki
  - text: 益城郡は和銅年間までは「萬志岐」と記したとする説があると、『下益城郡誌』を引きつつWikipedia「益城郡」が紹介する
    kind: fact
    level: E5
    status: indeterminate
    sources:
    - r10-mashiki-gun-wiki
  - text: 合併前の中心地だった木山には、木山氏代々の居城である木山城跡が残る
    kind: fact
    level: E2
    status: established
    sources:
    - r10-mashiki-pref
  - text: 2016年（平成28年）の熊本地震では、4月14日のM6.5と4月16日のM7.3の地震により、益城町で2度の最大震度7が観測された
    kind: fact
    level: E2
    status: established
    sources:
    - r10-mashiki-mlit
  - text: この2度の地震は、それぞれ日奈久断層帯と布田川断層帯の活動によるものと考えられている
    kind: fact
    level: E2
    status: established
    sources:
    - r10-mashiki-mlit
  - text: 地方公共団体コードは434434である（総務省「地方公共団体コード一覧」で確認）
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 「郡で最初の合併町」という名乗り
    text: 1954年の合併で、中心地の名「木山」を捨ててでも郡名「益城」を掲げたのは、この合併が郡内で一番目の合併町だという自負の表明だった。自分の町の名より大きな単位の名を名乗り、「最初であること」を名前に刻む——益城町は、合併のリーダーシップそのものを名前にした珍しい例である。
    sources:
    - r10-mashiki-pref
  relations:
  - pref/43
  unknowns:
  - 「益城（ましき／萬志岐）」という郡名自体の語源は確認できなかった
  - 『和名類聚抄』における益城郡の郷名などの詳細は未確認
  updated: '2026-11-13'
- id: muni/43-相良村
  code: '435104'
  names:
    ja: 相良村
    reading: さがらむら
    aliases: []
  user_terms:
  - 相良
  - さがら
  - 相性が良くなる村
  - 相良700年の村
  - 川辺川の村
  - 人吉球磨
  naming_type: 合併新設
  prefecture: 熊本県
  homonyms: []
  summary: 球磨郡の村。1956年に川村と四浦村が合併して発足し、村名は住民公募で、人吉球磨を約700年間治めた相良氏にちなむ「相良村」が大多数を占めて選ばれた。村の中央を清流・川辺川が流れ、相良氏ゆかりの社寺が残る。
  first_attestation:
    era: 昭和31年
    year_western: 1956
    document: 相良村の発足（川村・四浦村の合併）
    note: 村名としての初出。「相良」の氏名自体は鎌倉時代に遡る
  claims:
  - text: 1956年（昭和31年）9月1日、川村と四浦村が合併して相良村が誕生した
    kind: fact
    level: E2
    status: established
    sources:
    - r10-sagara-geoshape
  - text: 村名は合併にあたり住民から公募され、相良藩35代700年の歴史の中に生きてきた住民は球磨川とともに相良城のイメージを断ちがたく、「相良村」が大多数を占めたため、これを新村名とした
    kind: fact
    level: E2
    status: established
    sources:
    - r10-sagara-pref
  - text: 村名には「相携えて良くなるように」との願いも込められたと、村制70周年の報道が伝えている
    kind: fact
    level: E4
    status: established
    sources:
    - r10-sagara-kumanichi
  - text: 相良村を含む人吉球磨地域は、鎌倉時代から明治維新までの約700年間、相良氏が治めた地域で、この歴史は2015年度に熊本県第1号の日本遺産に認定された
    kind: fact
    level: E2
    status: established
    sources:
    - r10-sagara-zck
  - text: 村の中央を川辺川が北から南に貫流し、国土交通省の調査で13年間連続して最も水質が良好な川と評価された
    kind: fact
    level: E2
    status: established
    sources:
    - r10-sagara-zck
  - text: 村内には国指定重要文化財の十島菅原神社など、相良氏と関わりの深い社寺が残る
    kind: fact
    level: E2
    status: established
    sources:
    - r10-sagara-zck
  - text: 地方公共団体コードは435104である（総務省「地方公共団体コード一覧」で確認）
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 「相性が良くなる村」——領主の名に重ねた願い
    text: 「相良」という名は、もともと約700年の統治者・相良氏の名である。ところが村はこの名を、「相」と「良く」を読み解いて「相性が良くなる村」という標語にも使っている。歴史的な由来の上に、字の読みを重ねてもう一つの意味を与える——地名が生き続けるために、持ち主である住民が新しい意味を育てることがある。
    sources:
    - r10-sagara-zck
    - r10-sagara-kumanichi
  relations:
  - pref/43
  unknowns:
  - 相良氏の氏名自体の由来（駿河方面の相良庄への居住など）は、本調査では出典を確認できなかった
  - 公募で「相良村」以外にどのような候補が挙がったかは確認できなかった
  updated: '2026-11-13'
- id: muni/43-美里町
  code: '433489'
  names:
    ja: 美里町
    reading: みさとまち
    aliases: []
  user_terms:
  - 美里町の名前の由来
  - 中央町と砥用町が合併した町
  - 美里町は公募で決まった名前
  naming_type: 合併新設
  prefecture: 熊本県
  homonyms:
  - muni/04-美里町
  - muni/11-美里町
  summary: 2004年に中央町と砥用町が合併した際、全国公募と合併協議会の投票で決まった新町名。町公式・県資料には「いつまでも美しいふる里であって欲しい」という理由文が残り、「美しい里」型の命名であることが公式に確認できる。最終候補には「石橋町」「宇城東町」などもあった。
  first_attestation:
    era: 平成16年
    year_western: 2004
    document: 自治体名としての「美里町」（中央町・砥用町合併協議会の第18回協議会の投票で決定）
    note: 合併前の両町域に「美里」という地名があったかは未確認
  claims:
  - text: 平成16年（2004年）11月1日に中央町と砥用町が合併して美里町が誕生した。町名は全国から公募した中から選考し、「いつまでも美しいふる里でありますように」等の理由から美里町となったと町の公式ページが説明する
    kind: fact
    level: E2
    status: established
    sources:
    - h3-kumamoto-misato-town
  - text: 熊本県の市町村史資料によれば、最終候補は「あけぼの町」「石橋町」「宇城東町」「砥央町」「美里町」の5点で、第18回合併協議会の投票により「美里町」に決定した
    kind: fact
    level: E2
    status: established
    sources:
    - h3-kumamoto-misato-pref
  - text: 投票結果は美里町7票、宇城東町5票、石橋町4票、砥央町4票、あけぼの町1票だったと町の広報が伝える
    kind: fact
    level: E2
    status: established
    sources:
    - h3-kumamoto-misato-koho
  - text: 「美里」が候補に推された理由として「いつまでも美しいふる里であって欲しい」「山紫水明のごとき眺望」「山と水に恵まれ、人情味豊かで美しいふる里にしたい」などが県資料に記録されている
    kind: fact
    level: E2
    status: established
    sources:
    - h3-kumamoto-misato-pref
  - text: 3町とも合併新名で「美しい里」と読める字面は共通する。本町は理由文が公式に残り「美しい里」型の命名と確認できる点で、理由の確認できない宮城県美里町と異なる。埼玉県美里町は「平和な農村」への願いとして説明され、字義の中心がやや異なる
    kind: fact
    level: E2
    status: established
    sources:
    - h3-kumamoto-misato-town
    - h3-saitama-mayor
  - text: 総務省「地方公共団体コード一覧」では本町のコードは433489とされる
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 投票結果まで残る命名
    text: 最終候補5点と得票数（美里町7・宇城東町5・石橋町4・砥央町4・あけぼの町1）が町広報と県資料に残っており、全国公募から投票までの過程をたどることができます。「美しいふる里」という理由文とあわせ、平成期の合併新名としては記録の残り方が丁寧な部類です。
    sources:
    - h3-kumamoto-misato-pref
    - h3-kumamoto-misato-koho
  relations:
  - pref/43
  - muni/04-美里町
  - muni/11-美里町
  unknowns:
  - 公募の応募総数
  - 合併前の両町域に「美里」という字名・小地名があったか
  updated: '2026-11-13'
- id: muni/43-芦北町
  code: '434825'
  names:
    ja: 芦北町
    reading: あしきたまち
    aliases:
    - 葦北
  user_terms:
  - 芦北
  - あしきた
  - 葦北郡芦北町
  - 佐敷
  - うたせ船の町
  naming_type: その他
  prefecture: 熊本県
  homonyms: []
  summary: 葦北郡の町で、不知火海（八代海）に面する。「葦北」は『日本書紀』や『和名類聚抄』に記録される古代以来の地名で、郡名として受け継がれてきた。1955年の合併で葦北町が発足し、1970年に湯浦町と合併した際、「葦」を略字の「芦」に替えて芦北町となった。郡名は今も「葦北」のままである。
  first_attestation:
    era: 奈良時代
    year_western: null
    document: 『日本書紀』・平城京出土木簡の「葦北郡」
    note: 熊本県の市町村史資料が「芦北」という地名は日本書紀や和名類聚抄などに記録されると紹介し、町教育委員会は平城京出土の木簡に「葦北郡」とあることを紹介する。具体的な初出年は特定できない
  claims:
  - text: 「芦北（葦北）」という地名は『日本書紀』や『和名類聚抄』などに記録されるなど、古代には中央によく知られていたと、熊本県の市町村史資料が紹介する
    kind: fact
    level: E2
    status: established
    sources:
    - r10-ashikita-pref
  - text: 葦北郡は奈良時代にはすでに存在し、平城京で発見された木簡に「葦北郡」という漢字が使われていると、芦北町教育委員会が紹介する
    kind: fact
    level: E4
    status: established
    sources:
    - r10-ashikita-tbs
  - text: この地方は隼人の北限居住地域でもあり大和勢力との接点であったため、「葦北の国」として国造が派遣されたと、熊本県の市町村史資料が紹介する
    kind: fact
    level: E2
    status: established
    sources:
    - r10-ashikita-pref
  - text: 『万葉集』には、長田王の「芦北の野坂の浦ゆ船出して水嶋ゆかむ波立つなゆめ」という歌が収められていると、熊本県の市町村史資料が紹介する
    kind: fact
    level: E2
    status: established
    sources:
    - r10-ashikita-pref
  - text: 1955年（昭和30年）1月1日、佐敷町・大野村・吉尾村が合併して葦北町が発足した
    kind: fact
    level: E2
    status: established
    sources:
    - r10-ashikita-pref
    - r10-ashikita-geoshape
  - text: 1970年（昭和45年）11月1日、湯浦町と合併した際に、町名の表記を「葦北」から「芦北」に変更した
    kind: fact
    level: E2
    status: established
    sources:
    - r10-ashikita-geoshape
  - text: 「芦」への変更は、郡名と同じ「葦北町」がそのまま引き継がれると湯浦町が吸収された印象になるため、対等に合併したという意味があったのではないかと、町教育委員会は推測する
    kind: fact
    level: E4
    status: inferred
    sources:
    - r10-ashikita-tbs
  - text: 2005年（平成17年）1月に田浦町と合併し、新しい芦北町が発足した
    kind: fact
    level: E2
    status: established
    sources:
    - r10-ashikita-plan
  - text: 地方公共団体コードは434825である（総務省「地方公共団体コード一覧」で確認）
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 郡は「葦北」、町は「芦北」——一字だけ違う住所の謎
    text: 住所を書くと「葦北郡芦北町」と、同じ「あし」で字が違う。奈良時代の木簡以来の「葦北」は郡の名として続いてきたが、町の方は1970年、湯浦町との合併を機に略字の「芦」に姿を変えた。郡名をそのまま町名に残すと吸収合併に見えるから、というのが町教育委員会の推測である。一字の違いの裏に、対等合併への配慮と、千三百年の地名の重みが同居している。
    sources:
    - r10-ashikita-tbs
    - r10-ashikita-pref
  relations:
  - pref/43
  unknowns:
