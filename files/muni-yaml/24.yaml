  naming_type: 中心地名の継承
  naming_note: 尾鷲町の名を継承し、読みを「おわせ」とした
  formation: 合併新設
  prefecture: 三重県
  homonyms: []
  summary: 市名「尾鷲」は、尾鷲湾奥の中心集落の名を受け継ぐ。文献上の初出は貞和2年（1346年）の文書の「おハしの浦」と『日本歴史地名大系』は紹介する。語源は江戸時代の地誌『紀伊続風土記』の段階でも「不詳」とされ、確定していない。昭和29年（1954年）の合併市制の際、旧町名「尾鷲（おわし）」の読みを「おわせ」として市が発足した。
  first_attestation:
    era: 貞和2年
    year_western: 1346
    document: 荘司文書（荘司都盛氏旧蔵）の「おハしの浦」
    note: 『日本歴史地名大系』が「おハし」（尾鷲）の用例として紹介するもの。原文は未読のため紹介形で記録する
  claims:
  - text: 「おハし」（尾鷲）の古い用例として、貞和2年（1346年）4月20日の荘司文書に「おハしの浦の三浦の窪の豊浦左衛門」とあることを『日本歴史地名大系』は紹介している
    kind: fact
    level: E3
    status: established
    sources:
    - r1-owase-kotobank-taikei
  - text: 江戸時代の地誌『紀伊続風土記』は尾鷲の名義を不詳としつつ、「大輪内（おおわうち）の詰まりたるなるべし」という説と、水地浦は尾鷲の本村で「山の尾端（おはし）にあるより称した」という里伝の説の2説を立てていると、『日本歴史地名大系』は紹介する
    kind: fact
    level: E3
    status: contested
    sources:
    - r1-owase-kotobank-taikei
  - text: 「尾鷲」の語源は、『紀伊続風土記』以来の資料でも確定しておらず、未確定である
    kind: fact
    level: E3
    status: indeterminate
    sources:
    - r1-owase-kotobank-taikei
  - text: 江戸時代、元和5年（1619年）に紀州藩の所領となり、この地方は「牟婁郡奥熊野尾鷲組」と呼称された
    kind: fact
    level: E2
    status: established
    sources:
    - r1-owase-city-plan
  - text: 明治22年（1889年）の町村制施行により北牟婁郡尾鷲町となった
    kind: fact
    level: E2
    status: established
    sources:
    - r1-owase-city-plan
  - text: 昭和29年（1954年）6月、尾鷲町・須賀利村・九鬼村・北輪内村・南輪内村の5町村が合併して尾鷲市が発足し、新市名を「尾鷲（おわせ）」と呼称した
    kind: fact
    level: E2
    status: established
    sources:
    - r1-owase-city-plan
  - text: 旧・尾鷲町の読みは「おわし」で、1954年の合併市制に際して「おわせ」として市制が施行されたと、ブリタニカ国際大百科事典小項目事典は説明している
    kind: fact
    level: E3
    status: established
    sources:
    - r1-owase-kotobank-taikei
  - text: 尾鷲市の地方公共団体コードは242098である
    kind: fact
    level: E2
    status: established
    sources:
    - k4-ise-jlis
  column:
    title: 市になるとき、読みが変わった
    text: 尾鷲町はもともと「おわし」と読んだ。ところが1954年に5町村が合併して市になる際、読みは「おわせ」に改められた。市の紋章は「オ」の字と鷲を図案化し、5つの部分は合併した5町村を表す。「鷲」という勇ましい字面とは裏腹に、地名の意味そのものは江戸時代の地誌『紀伊続風土記』の頃から「不詳」と書かれてきた。分からないことは分からないと書き続けてきた、正直な地名である。
    sources:
    - r1-owase-city-plan
    - r1-owase-kotobank-taikei
  relations:
  - pref/24
  - muni/24-熊野市
  unknowns:
  - 「尾鷲」に鷲が棲んでいた等に結びつける伝承は、公的・専門資料で確認できなかった
  - 読みが「おわし」から「おわせ」に変わった理由（経緯の記録）は未確認
  - 貞和2年の荘司文書の原文は未読で、大系の紹介に拠っている
  updated: '2026-11-13'
