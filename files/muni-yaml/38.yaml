prefecture_code: '38'
records:
- id: muni/38-上島町
  code: '383562'
  names:
    ja: 上島町
    reading: かみじまちょう
    aliases:
    - 上島諸島
  user_terms:
  - かみじま
  naming_type: 合併新設
  prefecture: 愛媛県
  homonyms: []
  summary: 愛媛県越智郡の町で、芸予諸島の上島諸島と魚島群島の25島からなる離島の町。2004年10月1日に弓削町・生名村・岩城村・魚島村が合併して発足した。町名は、藩政期からこの一帯を指した呼称「上島諸島」を踏まえ、新町名称の公募によって「上島町」と決定された。
  first_attestation:
    era: 平成16年
    year_western: 2004
    document: 愛媛県「市町村要覧」上島町のページ
    note: 新町名としての初出（2004年10月1日の合併発足）。地域呼称としての「上島諸島」は、伊予松山藩の領地だった江戸時代に遡るとされる
  claims:
  - text: 総務省の全国地方公共団体コードで、上島町の団体コードは383562と定められている
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  - text: 2004年10月1日、弓削町・生名村・岩城村・魚島村の合併によって上島町が誕生したと愛媛県の市町村要覧は記している
    kind: fact
    level: E2
    status: established
    sources:
    - q12-kamijima-ehime
  - text: 昔から当地域は伊予松山藩の「上島諸島」と呼ばれていたこともあり、新町名は公募により「上島町」に決定されたと、愛媛県の市町村要覧は明記している
    kind: fact
    level: E2
    status: established
    sources:
    - q12-kamijima-ehime
  - text: 「上島」の「上」は、藩政期の松山藩が三津浜を境として北側の島々（生名・岩城など）を「上島」、南側を「下島」と呼んだことに由来するという一説がある
    kind: fact
    level: E5
    status: contested
    sources:
    - q12-kamijima-wiki
  - text: 上島町は上島諸島（弓削島・佐島・生名島・岩城島など）と魚島群島（魚島・高井神島）の合わせて25島で構成される
    kind: fact
    level: E2
    status: established
    sources:
    - q12-kamijima-ehime
  - text: 町域の百貫島は愛媛県の最北端にあたる
    kind: fact
    level: E5
    status: established
    sources:
    - q12-kamijima-wiki
  - text: 江戸時代、この一帯は今治藩・松山藩に属し、参勤交代の要路として港を中心に商業や廻船業で賑わったと伝えられている
    kind: fact
    level: E2
    status: established
    sources:
    - q12-kamijima-ehime
  column:
    title: 「上」は藩の都合だった
    text: 「上島」は単なる方角の名ではなく、松山藩が領内の島々を三津浜を境に「上」と「下」に分けて呼んだ行政上の呼び分けに由来するとされる。対になる「下島」は現在では使われず、大三島などが下島と呼ばれることもない。2004年の合併で公募によって選ばれた町名は、この藩政期の地域呼称をそのまま自治体名に引き上げたものだった。なお、広島県の大崎上島町とは別の自治体で、混同されやすい。
    sources:
    - q12-kamijima-ehime
    - q12-kamijima-wiki
  relations:
  - pref/38
  unknowns:
  - 「上島・下島」の呼び分けを裏付ける藩政期の史料を直接確認できていない（松山藩側の記録の所在は未確認）
  - 公募で「上島町」以外にどのような候補があったかを確認できていない
  updated: '2026-11-13'
- id: muni/38-久万高原町
  code: '383864'
  names:
    ja: 久万高原町
    reading: くまこうげんちょう
    aliases:
    - 久万郷
    - 久万山
  user_terms:
  - くまこうげん
  - 四国の軽井沢
  naming_type: 合併新設
  prefecture: 愛媛県
  homonyms: []
  summary: 愛媛県上浮穴郡の町で、県内最大の面積を持つ山間の町。2004年8月1日に久万町・面河村・美川村・柳谷村が合併して発足した。町名は、室町時代から仁淀川上流域一帯の総称だった「久万」に、旧久万町が観光PRでも使ってきた「高原」を付した合成名である。
  first_attestation:
    era: 室町時代
    year_western: null
    document: 仁淀川上流域一帯の総称「久万」
    note: 「久万」は総称として室町時代から使われ「久万山」「久万郷」とも呼ばれたとされるが、その用例を示す具体的な文献名は本調査では特定できていない
  claims:
  - text: 総務省の全国地方公共団体コードで、久万高原町の団体コードは383864と定められている
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  - text: 2004年8月、久万町・面河村・美川村・柳谷村の1町3村が合併して久万高原町が誕生したと、町が国へ提出した地域再生計画は記している
    kind: fact
    level: E2
    status: established
    sources:
    - q12-kumakogen-chisou
  - text: 「久万」は仁淀川上流域一帯の総称として室町時代から使われてきた地名で、「久万山」「久万郷」とも呼ばれてきた
    kind: fact
    level: E5
    status: established
    sources:
    - q12-kumakogen-wiki
  - text: 「くま」は本来、山の奥や山と山に挟まれた土地を指す言葉であるとされる
    kind: fact
    level: E5
    status: established
    sources:
    - q12-kumakogen-wiki
  - text: 2004年の合併に際して、古い総称「久万」に「高原」を付して「久万高原町」と命名された
    kind: fact
    level: E5
    status: established
    sources:
    - q12-kumakogen-wiki
  - text: 「久万高原」という名称は、旧久万町が観光レクリエーションのPRに用いてきた名称でもあった
    kind: fact
    level: E5
    status: established
    sources:
    - q12-kumakogen-wiki
  - text: 町自身は「高原」という語について、雄大さ・清らかさ・爽やかさや避暑地のイメージを備え観光振興に利点のある言葉であると説明している
    kind: fact
    level: E2
    status: established
    sources:
    - q12-kumakogen-chisou
  column:
    title: 観光PRの言葉が、そのまま町名になった
    text: 「高原」は合成名のお飾りではなく、旧久万町が観光PRで実際に使ってきた「久万高原」という看板を、合併後の町名にそのまま引き上げたものだという。室町時代からの総称「久万」に、昭和・平成の観光の言葉「高原」を重ねた二層の名前で、町も「高原を冠した町」と自認して計画文書にそのイメージ効果を書き込んでいる。
    sources:
    - q12-kumakogen-wiki
    - q12-kumakogen-chisou
  relations:
  - pref/38
  unknowns:
  - 「久万」の総称としての室町時代の用例を示す具体的な文献（久万郷の初出文献）を確認できていない
  - 合併協議で「久万高原」以外の新町名候補があったかを確認できていない
  updated: '2026-11-13'
- id: muni/38-今治市
  code: '382027'
  names:
    ja: 今治市
    reading: いまばりし
    aliases:
    - 今張
  user_terms:
  - 今治の名前の由来
  - 今治はなぜ「いまばり」と読むの
  - いまはると呼ばれていたの
  naming_type: 一部の地名
  prefecture: 愛媛県
  homonyms: []
  summary: 市名は中世以来の地名で、古くは「今張」と書かれた。愛媛県の市町要覧によれば、慶長5年（1600年）に藤堂高虎が今治城の築城に際して「今張」を「今治」として届け出たといわれ、宝永2年（1705年）以降「今治」の表記が定着した。読みもイマハリ・イマハルなど一定せず、大正9年（1920年）の市制施行後に市議会の議決で「いまばり」と定められた。
  first_attestation:
    era: 建治2年
    year_western: 1276
    document: 文献上の初出（愛媛県「市町要覧」が「今治」の初出とするもの。具体的な文書名は要覧に明記なし）
    note: 県要覧による初出。14世紀後半の『太平記』には「今張」と記され、徳川初期の『予章記』は「今治」の表記を用いていると要覧は紹介する
  claims:
  - text: 今治市の地方公共団体コードは382027である（総務省「地方公共団体コード一覧」による）
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  - text: 愛媛県の市町要覧によれば、「今治」が文献にあらわれた最初は建治2年（1276年）ごろで、14世紀後半の『太平記』には「今張」と記されている
    kind: fact
    level: E2
    status: established
    sources:
    - l5-imabari-pref-youran
  - text: 徳川初期の『予章記』は「今治」の表記を用いていると愛媛県の市町要覧は紹介する
    kind: fact
    level: E2
    status: established
    sources:
    - l5-imabari-pref-youran
  - text: 慶長5年（1600年）、藤堂高虎がこの地に任じ今治城を築城した際、「今張」を「今治」として届け出たといわれると愛媛県の市町要覧は記す
    kind: fact
    level: E2
    status: established
    sources:
    - l5-imabari-pref-youran
  - text: 宝永2年（1705年）以降、「今治」の表記が専用されるようになった
    kind: fact
    level: E2
    status: established
    sources:
    - l5-imabari-pref-youran
  - text: 読みはイマハリ、イマハル、いまばる、いまばりなど種々使われて一定しなかったが、大正9年（1920年）2月11日の市制施行後に呼称問題となり、同年9月8日に市議会が「いまばり」と呼称することを議決した
    kind: fact
    level: E2
    status: established
    sources:
    - l5-imabari-pref-youran
  - text: 平成17年（2005年）1月16日、旧今治市と越智郡の11か町村（朝倉村・玉川町・波方町・大西町・菊間町・吉海町・宮窪町・伯方町・上浦町・大三島町・関前村）が合併し、人口約18万人の県下第2の都市となった
    kind: fact
    level: E2
    status: established
    sources:
    - l5-imabari-pref-youran
  column:
    title: 読み方を議会で決めた市
    text: 今治は、漢字も読みも長く揺れていた地名である。表記は「今張」と「今治」が交錯し、江戸時代前期までは一定しなかった。読みにいたってはイマハリ、イマハル、いまばる、いまばりと地域や時代でばらばらだった。決着をつけたのは近代の議会である。1920年に市制が施行されると呼称問題が持ち上がり、同年9月8日の市議会で「いまばり」と呼称することが議決された。地名の読みが民主的な手続きで決まった、珍しい事例として残っている。
    sources:
    - l5-imabari-pref-youran
  relations:
  - pref/38
  unknowns:
  - 建治2年（1276年）ごろの初出とされる文献の具体名は、市町要覧に明記されておらず未確認
  - 「今治」の字義を「今から治める」と結びつける命名譚は広く流布しているが、史料による裏づけは未確認
  updated: '2026-11-13'
- id: muni/38-伊予市
  code: '382108'
  names:
    ja: 伊予市
    reading: いよし
    aliases:
    - 郡中町
  user_terms:
  - 伊予市はなぜ伊予という名前なの
  - 県庁所在地じゃないのに国名がそのまま市名
  - 郡中（ぐんちゅう）のまち
  - 五色姫のまち
  naming_type: その他（旧国名「伊予」をそのまま市名に採用したもの）
  prefecture: 愛媛県
  homonyms: []
  summary: 昭和30年（1955年）1月1日、伊予郡の郡中町・北山崎村・南伊予村・南山崎村が合併して発足した市で、市名は旧国名の伊予（伊豫国・伊予郡）に由来する。伊予は『古事記』の国生み神話に「伊予之二名島」と見える古い名だが、県庁所在地は松山市で、国名そのままの市名は県都とは別の港町が名乗っている。平成17年（2005年）には中山町・双海町と新設合併し、その際も公募によって改めて「伊予市」が新市名に選ばれた。
  first_attestation:
    era: 奈良時代
    year_western: 712
    document: 『古事記』上巻（国生みの条）
    note: 四国を指す「伊予之二名島」としての初出で、本文に「伊予国は愛比売といひ」とある。自治体名としての「伊予市」は昭和30年（1955年）の発足が初出
  claims:
  - text: 伊予市の地方公共団体コードは382108である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  - text: 昭和30年（1955年）1月1日、郡中町・北山崎村・南伊予村・南山崎村が合併して伊予市が発足したと伊予市公式の沿革年表は伝える
    kind: fact
    level: E2
    status: established
    sources:
    - q6-iyo-ayumi
  - text: 平成17年（2005年）4月1日、伊予市・中山町・双海町の1市2町が新設対等合併して現在の伊予市が誕生した
    kind: fact
    level: E2
    status: established
    sources:
    - q6-iyo-kaso-plan
  - text: 愛媛県の市町要覧は「伊予は伊豫の国、伊豫郡から由来している」と説明し、平成17年の合併に伴い市の名称を公募して「伊予市（いよし）」と決定したと記す
    kind: fact
    level: E2
    status: established
    sources:
    - q6-ehime-yoran
  - text: 『愛媛県史』文学編は、「伊予（伊豫）」の名が『古事記』『日本書紀』の国生み神話に「伊予之二名島」として見え、伊予国は愛比売と呼ばれたとする記載を紹介している
    kind: fact
    level: E2
    status: established
    sources:
    - q6-ehime-kenshi-iyo
  - text: 「伊予（イヨ）」がなぜ国名になったのか、その語源については『愛媛県史』文学編も「語源をめぐる伝承は残っていない」としており、定説は確認できない
    kind: fact
    level: E2
    status: indeterminate
    sources:
    - q6-ehime-kenshi-iyo
  - text: 伊予市の五色浜には、平家の5人の姫が海に身を投げて五色の石になったという「五色姫伝説」が伝わり、五色浜神社の拝殿にはこの伝説を描いた絵馬が飾られているという
    kind: legend
    level: E4
    status: established
    sources:
    - q6-iyo-kanko-goshiki
  column:
    title: 五色の石になった姫たち――五色姫伝説と復活祭
    text: 伊予市の五色浜には、源氏に敗れた平家の5人の姫がこの地に逃れ、悲劇の末に海に身を投げ、五色の小石になったという五色姫伝説が伝わる。五色浜神社の拝殿には伝説を描いた絵馬があり、「土地の人々の哀れみの心が五色姫を復活させた」という後日譚にあやかって、5色の石を奉納すると願いがかなうともいわれる。市では平成元年（1989年）から五色姫復活祭が開かれており、悲しい入水伝説が「復活」の物語として語り直され、まちの祭りになっている。
    sources:
    - q6-iyo-kanko-goshiki
    - q6-iyo-ayumi
  relations:
  - pref/38
  unknowns:
  - 昭和30年（1955年）の市制発足時に「伊予市」の名が選ばれた具体的な選定経緯（候補名や理由）は、市公式の沿革資料では確認できなかった
  - 「伊予」の語源そのものは県史も伝承なしとしており未確定
  updated: '2026-11-13'
- id: muni/38-伊方町
  code: '384429'
  names:
    ja: 伊方町
    reading: いかたちょう
    aliases: []
  user_terms:
  - いかた
  - 佐田岬半島
  - 原発の町
  naming_type: 合併新設
  prefecture: 愛媛県
  homonyms: []
  summary: 愛媛県西宇和郡の町で、佐田岬半島に位置する。現在の伊方町は2005年4月1日に旧伊方町・瀬戸町・三崎町が合併して発足した（町名は旧伊方町を継承）。地名「伊方」は原子力発電所よりはるかに古い名だが、その起源がいつに遡るかははっきりせず、語源にも複数の説がある。
  first_attestation:
    era: 不明
    year_western: null
    document: 未特定
    note: 愛媛県の市町村要覧も「『伊方』という名の起源はいつの時代からかはっきりしていない」と明記する。自治体名としては、1889年の町村制施行で発足した伊方村にまで遡れる
  claims:
  - text: 総務省の全国地方公共団体コードで、伊方町の団体コードは384429と定められている
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  - text: 2005年4月1日、伊方町・瀬戸町・三崎町が合併して現在の伊方町が発足したと愛媛県の市町村要覧は記している
    kind: fact
    level: E2
    status: established
    sources:
    - q12-ikata-ehime
  - text: 旧伊方町は1955年3月31日に伊方村と町見村が合併して発足した町で、2005年の合併ではこの「伊方町」の名がそのまま新町の名に継承された
    kind: fact
    level: E5
    status: established
    sources:
    - q12-ikata-uub
  - text: 「伊方」という名の起源がいつに遡るかははっきりしていないと、愛媛県の市町村要覧は明記している
    kind: fact
    level: E2
    status: indeterminate
    sources:
    - q12-ikata-ehime
  - text: 『日本地名語源事典』は「イカタ」について、「イヘカタ（家方）」か「イホカタ（庵方）」の転で、もと農・漁業の仮小屋のあった所を指すのではないかと述べていると、愛媛県の市町村要覧は紹介している
    kind: fact
    level: E2
    status: contested
    sources:
    - q12-ikata-ehime
  - text: 一説に「イカ」は山麓など後方に山を負うところに見られる地名の要素で「タ」は土地を意味し、後ろに山をかかえた地形から名付けられたのではないかとされるが、はっきりしたところはわからないと、愛媛県の市町村要覧は紹介している
    kind: fact
    level: E2
    status: contested
    sources:
    - q12-ikata-ehime
  - text: 伊方町は愛媛県の最西端、豊予海峡に突き出した佐田岬半島に位置し、南は宇和海、北は瀬戸内海に面する
    kind: fact
    level: E2
    status: established
    sources:
    - q12-ikata-ehime
  - text: 町内には四国電力の伊方発電所があり「伊方」の名は原子力発電所の所在地として知られるが、地名自体は発電所のはるか以前から存在する古い名である
    kind: fact
    level: E2
    status: established
    sources:
    - q12-ikata-ehime
  column:
    title: 原発よりもずっと古い、由来不明の名
    text: 「伊方」は原子力発電所の名として全国に知られるが、地名そのものは県の公式要覧ですら「起源はいつの時代からかはっきりしていない」と書くほど古い。仮小屋（家方・庵方）のあった場所という説と、背後に山を負った地形という説が並び、どちらとも決め手がない。2005年の合併でも瀬戸・三崎の両町を合わせてなお、この由来不明の古い名が町名に選ばれた。
    sources:
    - q12-ikata-ehime
  relations:
  - pref/38
  unknowns:
  - 「伊方」の文献上の初出（中世文書・近世の地誌等での用例）を特定できていない
  - 2005年の合併で新町名に旧伊方町の名が採用された経緯（公募や協議の記録）を直接確認できていない
  updated: '2026-11-13'
- id: muni/38-八幡浜市
  code: '382043'
  names:
    ja: 八幡浜市
    reading: やわたはまし
    aliases:
    - 八幡浜町
    - 保内町
  user_terms:
  - 八幡浜はなぜ八幡浜というの
  - 伊予の大阪と呼ばれたまち
  - 四国の西の玄関口
  - みかんと魚の港町
  naming_type: その他（八幡大神が浜に立ったという伝承に結びつく古い地名）
  prefecture: 愛媛県
  homonyms: []
  summary: 佐田岬半島の付け根にある港町で、「八幡浜」という地名は養老年間（717年〜724年）からあると市が伝え、その由来は八幡大神がこの地の浜に立たせられたことによるとされる。明治には商港として「伊予の大阪」と謳われるほど栄えた。昭和10年（1935年）に八幡浜町が神山町・千丈村・舌田村を併合して市制を施行し、平成17年（2005年）に保内町と合併して現在の市域となった。
  first_attestation:
    era: 養老年間
    year_western: 717
    document: 古文書（愛媛県市町要覧が「古文書に記されている」とするが、文書名は示されていない）
    note: 地名の初出とされる時期。八幡大神の降臨伝承と結びついて伝えられており、史実として確認できる初出ではない
  claims:
  - text: 八幡浜市の地方公共団体コードは382043である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  - text: 八幡浜市公式の沿革は、「八幡浜」という地名はすでに養老年間（717年〜724年）からあったと伝える
    kind: fact
    level: E2
    status: established
    sources:
    - q6-yawatahama-enkaku
  - text: その由来は、八幡大神がこの地の浜に立たせられたことによると伝えられ、愛媛県の市町要覧は「古文書に記されている」と紹介する
    kind: legend
    level: E2
    status: established
    sources:
    - q6-yawatahama-enkaku
    - q6-ehime-yoran-yawatahama
  - text: 明治22年（1889年）の町村制施行で八幡浜町が誕生し、大正・昭和にかけて周辺町村を併合したと八幡浜市公式の沿革は伝える
    kind: fact
    level: E2
    status: established
    sources:
    - q6-yawatahama-enkaku
  - text: 昭和10年（1935年）、八幡浜町は神山町・千丈村・舌田村を併合して市制を施行し、人口30,501人の八幡浜市が誕生した
    kind: fact
    level: E2
    status: established
    sources:
    - q6-yawatahama-enkaku
  - text: 平成17年（2005年）3月28日、八幡浜市と保内町が合併して新しい八幡浜市が誕生した
    kind: fact
    level: E2
    status: established
    sources:
    - q6-ehime-yoran-yawatahama
  - text: 明治の初め頃、八幡浜は商業・海運で活況を呈し「伊予の大阪」と謳われたと愛媛県の市町要覧は伝える
    kind: fact
    level: E2
    status: established
    sources:
    - q6-ehime-yoran-yawatahama
  column:
    title: 「伊予の大阪」と謳われた港町
    text: 八幡浜は四国の西の玄関口で、対岸の大分とを結ぶ航路の発着地として発展した。愛媛県の市町要覧によれば、明治の初め頃には商工業が活況を呈し、「伊予の大阪」と謳われるほどだったという。みかんと魚の集散地として栄えた港町の繁栄は、八幡大神が浜に立ったという養老年間の伝承とともに、この市の古い地名を今に伝えている。
    sources:
    - q6-ehime-yoran-yawatahama
  relations:
  - pref/38
  unknowns:
  - 県要覧が「古文書に記されている」とする養老元年（717年）の八幡大神の記事について、その古文書の名称・現存状況は確認できなかった
  - 「八幡」の社（八幡神社）の勧請経緯と地名化の過程は、公式資料では確認できなかった
  updated: '2026-11-13'
- id: muni/38-内子町
  code: '384224'
  names:
    ja: 内子町
    reading: うちこちょう
    aliases:
    - 内之子
  user_terms:
  - うちこ
  - 町並み保存
  - 内子座
  naming_type: その他（旧町名の継承）
  prefecture: 愛媛県
  homonyms: []
  summary: 愛媛県喜多郡の町。現在の内子町は2005年1月1日に旧内子町・五十崎町・小田町が合併して発足した（町名は旧内子町を継承）。地名「内子」は、1340年の文書に見える人名「内之子忠太夫」に因むといわれ、藩政期には大洲藩・新谷藩の在郷町として木蝋や和紙で栄えた町並みが残る。
  first_attestation:
    era: 暦応3年
    year_western: 1340
    document: 『清谷寺旦那譲り状』
    note: 文書には人名「内之子忠太夫」が見え、地名「内子」はこれに因むといわれている。町の公式計画が紹介する形で確認したため、主張のレベルはE2に落としている
  claims:
  - text: 総務省の全国地方公共団体コードで、内子町の団体コードは384224と定められている
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  - text: 2005年1月1日、内子町・五十崎町・小田町が合併して現在の内子町となったと愛媛県の市町村要覧は記している
    kind: fact
    level: E2
    status: established
    sources:
    - q12-uchiko-ehime
  - text: 内子の地名は、暦応3年（1340）の『清谷寺旦那譲り状』にある人名「内之子忠太夫」に因むといわれていると、内子町の歴史的風致維持向上計画は記している
    kind: fact
    level: E2
    status: established
    sources:
    - q12-uchiko-town-plan
  - text: 旧内子町は1889年の町村制施行で発足した町で、1955年1月1日に五城村・大瀬村・立川村・満穂村と合併して町域を広げた
    kind: fact
    level: E5
    status: established
    sources:
    - q12-uchiko-uub
  - text: 藩政時代、内子は大洲藩ならびに新谷藩に属し、木蝋や和紙などの生産地として名声を高めた在郷町であった
    kind: fact
    level: E2
    status: established
    sources:
    - q12-uchiko-ehime
  - text: 八日市護国地区の町並みは重要伝統的建造物群保存地区に選定され、芝居小屋の内子座（重要文化財）とともに往時の繁栄を伝えている
    kind: fact
    level: E2
    status: established
    sources:
    - q12-uchiko-ehime
  - text: 合併した旧3町はいずれも小田川（肱川支流）の流域にあり、現在の町域は小田川流域を単位としてまとまっている
    kind: fact
    level: E2
    status: established
    sources:
    - q12-uchiko-town-plan
  column:
    title: 地名は、人名だった
    text: 「内子」の由来として町の公式計画が採るのは、1340年の寺への寄進状に現れる「内之子忠太夫」という人名である。土地の形や産物ではなく、人の名がそのまま土地の名になったとされる珍しい型で、しかも根拠が中世の文書に置かれている。2005年の合併では五十崎・小田の両町名は自治体名としては消えたが、いずれも小田川流域の地区名として今も使われている。
    sources:
    - q12-uchiko-town-plan
  relations:
  - pref/38
  unknowns:
  - 「内之子」という人名（姓氏）自体の意味や、内之子氏がこの地とどう関係したかを『清谷寺旦那譲り状』の原文で直接確認できていない
  - 『清谷寺旦那譲り状』以外での中世の「内子」の用例（寺社文書・戦国期文書）を確認できていない
  updated: '2026-11-13'
- id: muni/38-四国中央市
  code: '382132'
  names:
    ja: 四国中央市
    reading: しこくちゅうおうし
    aliases: []
  user_terms:
  - 四国中央市の名前の由来
  - 四国の真ん中にあるの？
  - 宇摩市にならなかったのはなぜ
  - 紙の町の名前
  naming_type: 合併新設
  prefecture: 愛媛県
  homonyms: []
  summary: 2004年（平成16年）4月1日に川之江市・伊予三島市・土居町・新宮村が合併して発足した市。市名は全国公募を経て合併協議会の投票で決定されたもので、四国のほぼ中央に位置し、四国の4県すべてに接する立地をイメージした名である。ただし公募の応募数では旧郡名の「宇摩市」が1位で「四国中央市」は5位だったため、決定をめぐっては議論もあった。
  first_attestation:
    era: 平成16年
    year_western: 2004
    document: 四国中央市の市制施行（2004年4月1日）
    note: 合併により新設された市名であるため、名前の初出は市制施行そのもの。市名自体の決定は2003年2月14日の第7回合併協議会における投票による
  claims:
  - text: 四国中央市の地方公共団体コードは382132である（総務省「地方公共団体コード一覧」による）
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  - text: 2004年（平成16年）4月1日、川之江市・伊予三島市・土居町・新宮村の4市町村が合併して四国中央市が誕生した
    kind: fact
    level: E2
    status: established
    sources:
    - q5-ehime-youran-shikokuchuo
  - text: 愛媛県の公式資料は「四国中央市」について、全国からみても新市の位置を地理的にイメージしやすい名称であり、四国の4県が接する自治体として、四国の交流拠点都市として発展するという希望や気概が込められた名称であると説明する
    kind: fact
    level: E2
    status: established
    sources:
    - q5-ehime-youran-shikokuchuo
  - text: 新市名は2002年9月から10月に全国公募され、2003年2月14日の第7回合併協議会において、5つの候補の中から投票により過半数を得て「四国中央市」と決定した
    kind: fact
    level: E5
    status: established
    sources:
    - q5-shikokuchuo-wiki
  - text: 公募の応募数では、旧宇摩郡の郡名による「宇摩市」が1位、「うま市」が2位、「法皇市」が3位、「ひうち市」が4位で、「四国中央市」は5位だったとされる。決定後には再考を求める署名が1万名を超えて集まるなど、命名をめぐる議論が続いた
    kind: fact
    level: E5
    status: established
    sources:
    - q5-shikokuchuo-wiki
  - text: 合併前の両市はともに1954年（昭和29年）11月1日に市制を施行しており、川之江市は中心の川之江町に、伊予三島市は中心の三島町にそれぞれ由来する市名だった
    kind: fact
    level: E2
    status: established
    sources:
    - q5-ehime-youran-shikokuchuo
  - text: 市は日本有数の製紙業の集積地で「紙の町」として知られ、三島川之江港は四国最大規模の国際貿易港であると愛媛県の公式資料は記す
    kind: fact
    level: E2
    status: established
    sources:
    - q5-ehime-youran-shikokuchuo
  column:
    title: 公募1位は「宇摩市」だった
    text: 四国中央市の命名は、平成の大合併でも珍しい「公募の人気投票と最終決定が食い違った」事例である。全国公募で最も多くの支持を集めたのは、この地の古代からの郡名「宇摩」を継ぐ「宇摩市」だった。ところが合併協議会の投票で選ばれたのは、応募数5位の「四国中央市」である。四国の真ん中で4県と接する結節点という、将来の姿を描いた名が、由緒ある郡名に優先された。決定後には再考を求める署名が1万名を超えて集まったという。旧伊予三島市の市長は、宇摩の名について「若い人は馬の鳴き声のようで嫌だと言う」と取材に答えたとも伝えられる。名前の「正しさ」ではなく「将来のイメージ」で選ぶという、平成合併らしい判断の記録である。
    sources:
    - q5-shikokuchuo-wiki
    - q5-ehime-youran-shikokuchuo
  relations:
  - pref/38
  - muni/38-西条市
  unknowns:
  - 市域が地理的に四国の重心に当たるかどうかについては議論があり、公式の測定値は確認できていない
  - 伊予三島市が「伊予」を冠した理由（静岡県三島市との区別とする説明が一般的）について、一次資料での裏付けは確認できていない
  - 公募の応募総数や候補ごとの得票数の公式記録は確認できていない
  updated: '2026-11-13'
- id: muni/38-大洲市
  code: '382078'
  names:
    ja: 大洲市
    reading: おおずし
    aliases:
    - 大津
    - 大洲町
  user_terms:
  - 大洲はなぜ大洲というの
  - 伊予の小京都
  - おはなはんのまち
  - 肱川の城下町
  naming_type: その他（旧称「大津」を同名回避のため「大洲」に書き改めたと伝わる）
  prefecture: 愛媛県
  homonyms: []
  summary: 肱川中流の城下町で、もとは「大津（大いなる渡し場）」と呼ばれていた。江戸時代に大洲藩主加藤氏が入ってから、近江・土佐の大津と紛れるという理由で「大洲」と書き改められたと伝えられ、「洲」は肱川の氾濫でできた中洲・砂洲の地勢にちなむ字と説明される。昭和29年（1954年）に大洲町など10か町村が合併して市制を施行し、平成17年（2005年）に長浜町・肱川町・河辺村と合併して現在の市域となった。
  first_attestation:
    era: 江戸時代
    year_western: null
    document: 大津から大洲への改称（加藤氏の入部後）
    note: 「大洲」の表記の始まり。改称の時期は元和3年（1617年）の加藤貞泰入城後とする県要覧と、万治元年（1658年）とする県史地誌編とで異なり、特定できない。旧称「大津」はそれ以前の城下の呼称
  claims:
  - text: 大洲市の地方公共団体コードは382078である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  - text: 大洲は以前「大津」と呼ばれており、「大津」とは大いなる渡し場の意であると愛媛県の市町要覧は説明する
    kind: fact
    level: E2
    status: established
    sources:
    - q6-ehime-yoran-ozu
  - text: 「大津」から「大洲」への書き改めの時期については、県要覧が元和3年（1617年）に米子から移封された加藤貞泰の入城後とするのに対し、『愛媛県史』地誌編は加藤氏によって万治元年（1658年）に大洲と改められたとし、資料によって異なる
    kind: fact
    level: E2
    status: contested
    sources:
    - q6-ehime-yoran-ozu
    - q6-ehime-kenshi-ozu
  - text: 改称の理由は「大津は、近江の大津、土佐の大津に紛れる処あり」とされたためだと県要覧は伝える
    kind: fact
    level: E2
    status: established
    sources:
    - q6-ehime-yoran-ozu
  - text: 「洲」は河川の氾濫により土砂等が高低に堆積された地勢（砂洲・中洲）を意味し、「大洲」はその地勢の現象に相応しい地名呼称であると県要覧は説明する
    kind: fact
    level: E2
    status: established
    sources:
    - q6-ehime-yoran-ozu
  - text: 大洲は藩政時代、伊予大洲藩加藤氏六万石の城下町として栄え、「伊予の小京都」と呼ばれてきた
    kind: fact
    level: E2
    status: established
    sources:
    - q6-ozu-rekishi-fuchi
  - text: 昭和29年（1954年）9月1日、大洲町・平野村・南久米村・菅田村・大川村・柳沢村・新谷村・三善村・粟津村・上須戒村の10か町村が合併して大洲市が誕生した
    kind: fact
    level: E2
    status: established
    sources:
    - q6-ozu-rekishi-fuchi
  - text: 平成17年（2005年）1月11日、大洲市・長浜町・肱川町・河辺村の1市2町1村が合併し、現在の市域が形成された
    kind: fact
    level: E2
    status: established
    sources:
    - q6-ozu-rekishi-fuchi
  column:
    title: 大津から大洲へ――改名の年が定まらない
    text: 大洲の旧称「大津」は「大いなる渡し場」の意で、肱川の渡津の町らしい名だった。それが「大洲」に書き改められた理由は、近江の大津・土佐の大津と紛れるからだと伝えられる。ところが改名の年は資料によって揺れる。愛媛県の市町要覧は1617年の加藤貞泰の入城後とし、『愛媛県史』地誌編は1658年（万治元年）とする。貞泰は1623年に没しているため、1658年説では改名したのは後の代の加藤氏ということになる。同じ「公的資料」でも年が違う好例で、本レコードでは両説を併記した。
    sources:
    - q6-ehime-yoran-ozu
    - q6-ehime-kenshi-ozu
  relations:
  - pref/38
  unknowns:
  - 「大津」という旧称自体の文書上の初出は確認できなかった
  - 改称を行った藩主が加藤貞泰か後の代かは、2つの公的資料の記述が異なり確定できない
  updated: '2026-11-13'
