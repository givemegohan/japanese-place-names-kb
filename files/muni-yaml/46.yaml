  - text: 村名「大和村」は明治41年（1908年）の成立以来、改称の記録がなく、現在まで継承されている
    kind: fact
    level: E2
    status: established
    sources:
    - s4-oshima-gaikyou
  - text: 『浦内沿革誌』には「大和時代、この地に大和人が住んでいた」とあると村公式サイトが紹介する
    kind: legend
    level: E2
    status: established
    sources:
    - s4-yamato-history
  - text: 遣唐使の船が補給のために寄港するなど、大和からの船や人がこの浜に立ち寄ったことが「大和浜」の名の由来だという言い伝えがある
    kind: legend
    level: E2
    status: established
    sources:
    - s4-yamato-history
  column:
    title: 大和人が住んでいたという浜
    text: 大和浜の名の起こりを、村は二つの伝承で伝える。一つは遣唐使の船が補給に寄港し、大和の船や人が立ち寄った浜だという言い伝え。もう一つは郷土資料『浦内沿革誌』の「大和時代、この地に大和人が住んでいた」という一文である。文献の上でたどれるのは、1572年の辞令書の「屋まとはま」、薩摩藩時代の行政区分「大和浜方」、そして1908年の大和村という系譜までで、「大和」の名そのものの起こりは伝承の域を出ない。村名が明治以来一度も変わっていないことは、奄美の町村の中でも静かな特徴である。
    sources:
    - s4-yamato-history
  relations:
  - pref/46
  unknowns:
  - 「大和浜」の名の確実な語源は確認できなかった（大和人の居住・寄港の話は伝承として記録した）
  - 村公式サイトが紹介する1572年の琉球王の辞令書の原文は直接確認できなかった
  updated: '2026-11-13'
