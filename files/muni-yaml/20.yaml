  naming_type: 文献から命名（1875年の合併に際し『詩経』の句から命名）
  prefecture: 長野県
  homonyms: []
  summary: 天竜川右岸の山村。1875年に5村が合併して発足した際、村名「喬木」は中国の古典『詩経』の「出自幽谷、遷于喬木」の句から命名された。幽谷（深い谷）から高い木へ移る鳥の姿を、合併して新たに発展する村の姿に重ねたと解説される。以来合併・分村することなく2025年に150周年を迎えた。
  first_attestation:
