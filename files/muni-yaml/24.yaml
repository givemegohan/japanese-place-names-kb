  summary: 三重県北東端、桑名郡唯一の町で、木曽三川の河口部に位置する輪中の町。1889年に25の新田の区域を合わせて木曽岬村が成立し、1989年（平成元年）に町制施行した。「木曽岬」は木曽川の河口に突き出た岬状の地形に由来すると考えられるが、命名理由を明記した公的資料は確認できていない。三重県の市町村で木曽川の東岸にあるのは本町と桑名市長島町の一部のみである。
  first_attestation:
