  - 河越と川越の違い
  naming_type: 一部の地名
  prefecture: 埼玉県
  homonyms: []
  summary: 市名は中世の荘園・河越荘と、その領主だった河越氏の名に由来する古い地名を受け継いだもので、古くは「河越」と書かれ、「河肥」の表記もあった。語源には、入間川を越える地点に由来するという説と、「河肥」の字から肥沃な土地に由来するという説があり、定説はない。大正11年（1922年）に埼玉県内で初めて市制を施行した。
  first_attestation:
    era: 平安時代後期
    year_western: null
    document: 河越荘（入間川流域の荘園）の成立
    note: 平安時代後期に河越荘が成立し、その管理者（荘司）が河越氏を称した。文応元年（1260年）の養寿院銅鐘銘では「武蔵国河肥庄」と記される
  claims:
  - text: 現在の川越市域北西部の上戸には河越氏の館（河越館跡）があり、平安時代末期から鎌倉時代にかけて河越荘を領した河越氏は、鎌倉幕府でも重鎮の位置を占めた
    kind: fact
    level: E2
    status: established
    sources:
    - k1-kawagoe-yakata
  - text: 川越の語源には二つの対立する説がある。一つは入間川を越える地点に由来するという説、もう一つは文献に現れた当時の表記「河肥」から、入間川・小畔川などによって肥沃な土地であることに由来するという説で、郷土史料は「必ずしも定説があるとはいえない」と述べる
    kind: fact
    level: E4
    status: contested
    sources:
    - k1-kawagoe-minzoku
  - text: 川越市内南町の養寿院にある文応元年（1260年）の銅鐘の銘には「武蔵国河肥庄新日吉山王宮」とあり、鎌倉時代には「河肥」の表記が実際に使われていた
    kind: fact
    level: E4
    status: established
    sources:
    - k1-kawagoe-minzoku
  - text: 河越荘は後白河上皇が永暦元年（1160年）に京都東山に創建した新日吉社に寄進された荘園で、「河肥」の表記は寄進の文書で嘉字（縁起のよい字）が選ばれたためではないかという推測がある
    kind: fact
    level: E4
    status: inferred
    sources:
    - k1-kawagoe-minzoku
  - text: 江戸時代、川越は川越藩の城下町として栄え、新河岸川の舟運によって江戸と結ばれ、「小江戸」と呼ばれる繁栄を見せた
    kind: fact
    level: E2
    status: established
    sources:
    - k1-kawagoe-rekimachi
  - text: 明治22年（1889年）に川越町として成立し、大正11年（1922年）12月1日に埼玉県内で初めて市制が施行され、人口約31,000人の川越市が誕生した
    kind: fact
    level: E2
    status: established
    sources:
    - k1-kawagoe-rekimachi
  - text: 総務省の全国地方公共団体コードで、川越市のコードは112011と定められている（J-LISの埼玉県内市町村一覧による）
    kind: fact
    level: E2
    status: established
    sources:
    - k1-jlis-saitama
  column:
    title: 「河肥」という一文字の謎
    text: 川越の古い表記は「河越」だが、1260年の銅鐘には「河肥庄」と刻まれている。なぜ「肥」なのか。郷土の研究者は、河越荘が1160年創建の新日吉社へ寄進された際、中央の文書で「越」の代わりに嘉字の「肥」が選ばれたのではないかと推測する。ただし『吾妻鏡』では地名も河越氏の姓も常に「越」で書かれ、「肥」は見えないとも指摘されており、この一字は今も決着がついていない。なお、同じ「かわごえ」という読みの自治体に三重県の川越町があるが、別の土地の別の歴史を持つ地名である。
    sources:
    - k1-kawagoe-minzoku
  relations:
  - pref/11
  - muni/24-川越町
  unknowns:
  - 語源の定説はない（川を越える地点説／肥沃な土地説の両論を併記した）
  - 「河越」の名の確実な初出文書（平安時代の記録）は本バッチでは特定できなかった
  updated: '2026-11-13'
- id: muni/11-美里町
  code: '113816'
  names:
    ja: 美里町
    reading: みさとまち
    aliases:
    - 美里村
  user_terms:
  - 美里町の名前の由来
  - 美里村はどうやって決まった
  - 児玉郡の美里町
  naming_type: 合併新設
  prefecture: 埼玉県
  homonyms:
  - muni/04-美里町
  - muni/43-美里町
  summary: 1954年に東児玉村・松久村・大沢村が合併した際、住民公募と全世帯投票で選ばれた新村名「美里村」が前身で、1984年に町制を施行して美里町となった。町長の公式コラムは、この名に「将来も平和な農村として発展したい」という意味が込められたと説明する。3つの美里町の中で命名が最も古く、理由が公式に説明される点で宮城県美里町と異なる。
  first_attestation:
    era: 昭和29年
    year_western: 1954
    document: 新村名「美里村」の決定（三村合併促進協議会の候補選出と村内全世帯の投票による）
    note: 村名としての初出。これ以前に「美里」という小地名が域内にあったかは未確認
  claims:
  - text: 昭和29年（1954年）に東児玉村・松久村・大沢村が合併して美里村が誕生し、昭和59年（1984年）10月に町制を施行して美里町となった
    kind: fact
    level: E2
    status: established
    sources:
    - h3-saitama-enkaku
  - text: 合併後の新村名は住民公募とし、三村合併促進協議会で「美里村」「山里村」「三栗村」の候補を投票で選出したうえで、村内全世帯に選んでもらい「美里村」に決まったと町長コラムが伝える
    kind: fact
    level: E2
    status: established
    sources:
    - h3-saitama-mayor
  - text: 町長コラムは「住民の大部分が農業を営んでおり、将来も平和な農村として発展したいという意味が込められています」と命名の意味を説明する
    kind: fact
    level: E2
    status: established
    sources:
    - h3-saitama-mayor
  - text: 3町とも「美しい里」と読める字面の合併新名という点は共通する。ただし本町は1954年と命名が最も古く、公式の説明は字義の「美しい里」そのものより「平和な農村として発展したい」という願いに置かれている。熊本県美里町は「美しいふる里」への願いを理由文に明記し、宮城県美里町は理由が確認できない
    kind: fact
    level: E2
    status: established
    sources:
    - h3-saitama-mayor
    - h3-kumamoto-misato-town
  - text: 総務省「地方公共団体コード一覧」では本町のコードは113816とされる
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 落選した「三栗村」と「山里村」
    text: 最終候補に残ったのは「美里村」「山里村」「三栗村」の3つで、決め方は協議会の投票で候補を絞ったうえでの全世帯投票でした。落選した候補名まで具体的に記録が残っている例は、合併新名の記録として貴重です。
    sources:
    - h3-saitama-mayor
  relations:
  - pref/11
  - muni/04-美里町
  - muni/43-美里町
  unknowns:
  - 公募の応募総数と各候補の得票数
  - 1954年以前に「美里」という小地名が域内にあったか
  updated: '2026-11-13'
- id: muni/11-越谷市
  code: '112224'
  names:
    ja: 越谷市
    reading: こしがやし
    aliases:
    - 越ヶ谷町
    - 越ヶ谷宿
    - 越ヶ谷郷
  user_terms:
  - 越谷市の名前の由来
  - 越谷と越ヶ谷の違い
  - 越ヶ谷宿のあったまち
  naming_type: 合併新設
  prefecture: 埼玉県
  homonyms: []
  summary: 市名は、昭和29年（1954年）の合併で発足した越谷町の名を受け継いだものである。その際、合併前の越ヶ谷町と区別するため「ヶ」を取って「越谷」とした。「越ヶ谷」はもと広い地域を指した越ヶ谷郷の名で、語源は「越（腰）＝山や丘のふもと」「谷＝低地」とされ、台地のふもとの低地を指す名だと市の資料は説明する。
  first_attestation:
    era: 永禄5年
    year_western: 1562
    document: 小田原北条氏が葛西の本田氏に宛てた印判状（「越谷・舎人」）
    note: 『越谷市の文化財』が紹介する用例。「越ヶ谷」はもと越ヶ谷郷と称され広い地域を指した。戦国期には「越谷」と書かれ、江戸期に「越ヶ谷」と記すようになった
  claims:
  - text: 『越谷市の文化財』によれば、「越ヶ谷」はもと「越ヶ谷郷」と称され、市内の出羽地区や荻島地区、それに現在のさいたま市岩槻区の一部などを含めた広い地域を指していた
    kind: fact
    level: E2
    status: established
    sources:
    - k1-koshigaya-bunkazai
  - text: 永禄5年（1562年）の小田原北条氏が葛西の本田氏に宛てた印判状には、「越谷・舎人」は大郷であると記されている
    kind: fact
    level: E2
    status: established
    sources:
    - k1-koshigaya-bunkazai
  - text: 『越谷市の文化財』は地名の由来について、「越」は「腰」とも書かれ山や丘のふもとを、「谷」は低地を指すといわれ、越ヶ谷は川口から大門にかけての台地のふもとの低地であることによる名だと説明している
    kind: fact
    level: E2
    status: contested
    sources:
    - k1-koshigaya-bunkazai
  - text: 一方、語源由来辞典は別の説として、旧荒川の川谷を越える地を意味するという説や、「コシ」は崩壊地形を意味するという説も挙げており、語源は確定していない
    kind: fact
    level: E3
    status: contested
    sources:
    - k1-koshigaya-gogen
  - text: 明治22年（1889年）の町村制施行では「越ヶ谷町」として成立した
    kind: fact
    level: E3
    status: established
    sources:
    - k1-koshigaya-gogen
  - text: 昭和29年（1954年）11月3日、越ヶ谷町・大沢町の2町と桜井村・新方村・増林村・大袋村・荻島村・出羽村・蒲生村・大相模村の8村が合併して越谷町が発足した。その際、合併前の越ヶ谷町と区別するために「ヶ」を取って「越谷町」とした
    kind: fact
    level: E2
    status: established
    sources:
    - k1-koshigaya-tokei
    - k1-koshigaya-gogen
  - text: 昭和33年（1958年）11月3日、市制を施行して越谷市となった。埼玉県下で22番目の市だった
    kind: fact
    level: E2
    status: established
    sources:
    - k1-koshigaya-tokei
  - text: 総務省の全国地方公共団体コードで、越谷市のコードは112224と定められている（J-LISの埼玉県内市町村一覧による）
    kind: fact
    level: E2
    status: established
    sources:
    - k1-jlis-saitama
  column:
    title: 「ヶ」があるかないかで分かる新旧
    text: 越谷の中心部にある旧来の土地は今も「越ヶ谷」と「ヶ」を付けて書き、越ヶ谷高校や越ヶ谷宿の表記にも「ヶ」が残る。一方、1954年の合併後に生まれた地名は「ヶ」なしで、南越谷・北越谷・東越谷のほか越谷北高校・越谷南高校にも「ヶ」は入らない。これは1954年に、新しい町を合併前の越ヶ谷町と区別するために「ヶ」を外した名残である。市内で「ヶ」のある地名とない地名を見比べると、合併前の町の範囲と、その後に広がった市街地の輪郭が浮かび上がる。
    sources:
    - k1-koshigaya-gogen
    - k1-koshigaya-tokei
  relations:
  - pref/11
  unknowns:
  - 語源は台地のふもとの低地とする説と、川谷を越える地とする説などがあり確定していない
  - 越ヶ谷郷の成立時期を示す中世以前の確実な用例は、本バッチでは確認できなかった
  updated: '2026-11-13'
- id: muni/12-千葉市
  code: '121002'
  names:
    ja: 千葉市
    reading: ちばし
    aliases:
    - 千葉郡
  user_terms:
  - 千葉市の名前の由来
  - 千葉はなぜ千葉と書く
  - 千葉開府900年とは
  - 千葉常重と千葉市
  - 千葉氏のまち
  naming_type: 一部の地名
  prefecture: 千葉県
  homonyms: []
  summary: 千葉は古代の下総国千葉郡の郡名で、『万葉集』の防人の歌や墨書土器に約1,300年前の用例が見える。大治元年（1126年）に千葉常重がこの地に本拠を移し、地名を名字として千葉を名乗って城下の基礎を作り、明治に県庁が置かれ、大正10年（1921年）の市制施行で地名がそのまま市名に継承された。語源は、草木の生い茂る豊かな土地に好字を当てたとする市の説明があるが、諸説あるとされる。
  first_attestation:
    era: 奈良時代（8世紀）
    year_western: null
    document: 万葉集
    note: 千葉郡の防人が詠んだ歌に地名「千葉」が登場すると千葉市が紹介する、使用例の初出級資料。あわせて発掘された墨書土器の用例も市が紹介し、約1,300年の歴史が確認できるという
  claims:
  - text: 千葉市公式によれば、「千葉」という地名は古代からあり、『万葉集』で千葉郡の防人が詠んだ歌に登場するほか、発掘された墨書土器によっても、「千葉」という地名が約1,300年の歴史をもつことが確認できる
    kind: fact
    level: E2
    status: established
    sources:
    - b-chiba-city-900
  - text: 千葉市公式によれば、千葉の地名の由来は諸説あるが、草木の生い茂る豊かな土地であったことから、その意味を表す好字（たくさんを意味する「千」と、草木を意味する「葉」）を当てて「千葉」と表記したのだと考えられている
    kind: fact
    level: E2
    status: contested
    sources:
    - b-chiba-city-900
  - text: 千葉市公式によれば、平安時代後期の大治元年（1126年）6月1日、千葉常重が大椎（現在の緑区大椎町）から現在の中央区亥鼻付近に本拠を移し、千葉を名乗ったことにより、千葉の都市としての歴史が始まったと言われている
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-shi-portal
  - text: 千葉市広報によれば、この1126年の本拠移転は中世の史料『千学集抜粋』の記述によるもので、大治元年6月1日に千葉常重が現在の中央区亥鼻付近に本拠を定めてまちが成立したとされている
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-kaifu-dayori
  - text: 千葉市公式によれば、常重の子・千葉常胤は1180年に房総へ逃れてきた源頼朝をいち早く助けて鎌倉幕府の成立に大きく貢献し、千葉氏は東北から九州に至る広大な所領を持つ屈指の御家人に成長した
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-shi-portal
  - text: 千葉市議会の市政概要によれば、千葉市の市章は開祖・千葉氏の月星の紋章に千葉の「千」を入れたもので、大正10年（1921年）に市制施行を記念して制定された
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-sisei
  - text: 総務省の全国地方公共団体コードで、千葉市のコードは121002と定められている（総務省の地方公共団体コード一覧による）
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: まちを作った一族と、同じ名前の市
    text: 千葉市は2026年に「千葉開府900年」を迎えた。大治元年（1126年）に千葉常重が本拠を移して以来、都市の名と支配した一族の名が同じ「千葉」であり続けている。千葉市の担当者は「都市を作った人物である『千葉氏』と、現在の都市の名前である『千葉市』が同じであることは、大都市としては非常に珍しい」と書いている。市の紋章にも千葉氏の月星紋に「千」の字を入れたものが使われており、市名・市章・開府の記念年まで、一族の名がまちのアイデンティティとして生き続けている。
    sources:
    - b-cap-chiba-kyokucho
    - b-cap-chiba-sisei
  relations:
  - pref/12
  unknowns:
  - 「千葉」の語源について、市のいう好字説以外の説の具体的内容は、本バッチでは専門文献（『角川日本地名大辞典』等）で確認できなかった
  - 『万葉集』の千葉郡防人の歌の正確な巻・歌番号は、本バッチでは特定できなかった
  - 千葉市が市制を施行した正確な月日は、本バッチで確認した市公式資料の範囲では明記されていなかった
  updated: '2026-11-13'
- id: muni/12-柏市
  code: '122173'
  names:
    ja: 柏市
    reading: かしわし
    aliases:
    - 東葛市
    - 柏町
    - 千代田村
    - 柏村
  user_terms:
  - 柏市の名前の由来
  - 柏はなぜ柏というのか
  - 東葛市だった柏市
  - 柏駅のまち
  naming_type: 合併新設
  prefecture: 千葉県
  homonyms: []
  summary: 市名は2段階で決まった。昭和29年（1954年）9月の合併では、構成町村の名を避けて「東葛市」と命名されたが、旧小金町の分離を契機に名称への疑問が広がり、市民の要望に応えて同年11月15日、中心地として定着していた「柏」の名に改称された。「柏」は江戸時代の柏村に遡る地名だが、その語源は市の公式資料では説明されていない。
  first_attestation:
    era: 江戸時代
    year_western: null
    document: 柏村（水戸街道沿いの村）
    note: 市名の直接の由来である柏町は大正15年（1926年）に千代田村が町制を施行して成立した。「柏」という地名自体はそれ以前の柏村に遡るが、初出の文献と語源は本バッチでは確認できなかった
  claims:
  - text: 江戸時代の柏村は、明治22年（1889年）の町村制施行で新たに設けられた千代田村の一部となった
    kind: fact
    level: E2
    status: established
    sources:
    - k1-kashiwa-shisei
  - text: 明治29年（1896年）に鉄道（現在のJR常磐線）が敷設されて柏駅が開業すると、柏駅を中心に市街地が形成され始めた
    kind: fact
    level: E2
    status: established
    sources:
    - k1-kashiwa-shisei
  - text: 大正15年（1926年）に千代田村は町制を施行し、「柏町」となった
    kind: fact
    level: E2
    status: established
    sources:
    - k1-kashiwa-shisei
  - text: 昭和29年（1954年）9月1日、柏町・小金町・田中村・土村の4町村が合併して東葛市が発足した。市名は、四か町村の名称を受け継ぐことが市民の融和の妨げになると予想されたため、この地区が東葛飾郡の中央部に位置することにちなんで「東葛市」と決定された
    kind: fact
    level: E2
    status: established
    sources:
    - k1-kashiwa-tokatsu
  - text: 同年10月15日に旧小金町の大部分が松戸市へ編入され、11月1日には富勢村の一部が東葛市に編入された
    kind: fact
    level: E2
    status: established
    sources:
    - k1-kashiwa-tokatsu
    - k1-kashiwa-rekishi
  - text: 旧小金町の分離を契機に住民の間から東葛市という名称に疑問がつけられ、当時の市の広報は「市民の要望に応え市の名称を柏市と変更」と伝えた。昭和29年（1954年）11月15日、市の名称変更に関する条例により、東葛市は柏市に改称された
    kind: fact
    level: E2
    status: established
    sources:
    - k1-kashiwa-tokatsu
  - text: 柏市は、柏駅の設置とともに交通の要衝として市街地が形成される中で、「柏」という名前はもはや旧村名ではなく、新市にふさわしい名称として周囲から認められる存在になっていたと説明している
    kind: fact
    level: E2
    status: established
    sources:
    - k1-kashiwa-tokatsu
  - text: 総務省の全国地方公共団体コードで、柏市のコードは122173と定められている（J-LISの千葉県内市町村一覧による）
    kind: fact
    level: E2
    status: established
    sources:
    - k1-jlis-chiba
  column:
    title: 75日だけ存在した市「東葛市」
    text: 柏市の前身「東葛市」が存在したのは、昭和29年（1954年）9月1日から11月15日までの約75日間にすぎない。融和を考えて付けたはずの新市名は、合併の枠組みが崩れた（小金町の大半が松戸市へ移った）途端に存在意義を問われ、住民の要望で中心地の旧名「柏」に取って代わられた。市の名前がこれほど短期間で覆る例は珍しく、東葛市の役所看板の写真が市の公式サイトに残されている。現在の「東葛」という言葉は、高校名（県立東葛飾高校）などに生き続けている。
    sources:
    - k1-kashiwa-tokatsu
  relations:
  - pref/12
  unknowns:
  - 「柏」という地名自体の語源（柏の木に因む説など）は、本バッチで参照した市の公式資料では説明されておらず、専門文献での確認が今後の課題
  - 柏村の初出文献は未確認
  updated: '2026-11-13'
- id: muni/12-船橋市
  code: '122041'
  names:
    ja: 船橋市
    reading: ふなばしし
    aliases:
    - 船橋町
    - 船橋御厨
    - 船橋宿
  user_terms:
  - 船橋市の名前の由来
  - 船橋は本当に船の橋があったのか
  - 船橋大神宮のあるまち
  naming_type: 一部の地名
  prefecture: 千葉県
  homonyms: []
  summary: 市名は中世以来の地名「船橋」を受け継いだものである。「船橋」は『吾妻鏡』文治2年（1186年）の記事に「船橋御厨」として現れる。語源については、海老川に船を並べて板を渡した橋が地名になったという説が通説とされる一方、船の停泊用の桟橋に由来するという説もあり、市の資料でも「どちらとも決めがたい」とされている。
  first_attestation:
    era: 文治2年
    year_western: 1186
    document: 『吾妻鏡』（「船橋御厨」）
    note: 船橋市デジタルミュージアム『ふるさとの地名（改訂版）』が紹介する初出。伊勢神宮領の御厨（みくりや）の名として記された。一次文献そのものは未読のため二次資料経由の記録として扱う
  claims:
  - text: 船橋市デジタルミュージアム『ふるさとの地名（改訂版）』によれば、「船橋」の名が初めて見える文献は鎌倉幕府の公式記録『吾妻鏡』で、文治2年（1186年）の記事の中に「船橋御厨（みくりや）」として記されている
    kind: fact
    level: E2
    status: established
    sources:
    - k1-funabashi-museum
  - text: 同書は語源の通説として、宮本の台地から海神方面へ渡る道が海老川を越える場所に、船を並べて上に板等を渡した橋が設けられ、それが地名になったとする説を挙げる。一方で地名辞典類には「船の停泊のために桟橋を設けた所」と説くものもあり、同書は「どちらとも決めがたいが、現時点では通説をやや優位としておく」としている
    kind: fact
    level: E2
    status: contested
    sources:
    - k1-funabashi-museum
  - text: 船橋市西図書館の郷土資料は由来伝説として、景行天皇が東国を巡って当地に着いた帰路、大勢の行列を渡すために夏見から対岸まで船が並び、まるで船の橋のように見えたため「船橋」の名が起こったという話を伝えている
    kind: legend
    level: E2
    status: established
    sources:
    - k1-funabashi-lib
  - text: 江戸時代の船橋は五日市村・九日市村・海神村に分かれていたが、三村を総称して船橋村とか船橋宿とも称し、明治22年（1889年）にその地域が船橋町となった
    kind: fact
    level: E2
    status: established
    sources:
    - k1-funabashi-museum
  - text: 昭和12年（1937年）、船橋町が葛飾町・八栄村・塚田村・法典村と合併して船橋市が誕生した
    kind: fact
    level: E2
    status: established
    sources:
    - k1-funabashi-museum
    - k1-funabashi-natsumi
  - text: 総務省の全国地方公共団体コードで、船橋市のコードは122041と定められている（J-LISの千葉県内市町村一覧による）
    kind: fact
    level: E2
    status: established
    sources:
    - k1-jlis-chiba
  column:
    title: 御厨（みくりや）という名の船橋
    text: 文治2年（1186年）の『吾妻鏡』に現れる「船橋御厨」とは、伊勢神宮に年貢を納める荘園「御厨」のことである。船橋は中世、伊勢神宮領として知られた土地で、その中心にあったのが意富比神社（船橋大神宮）だとされる。隣の夏見にも「夏見御厨」があり、夏見の西夏見日枝神社の大鳥居には今も伊勢神宮の方角を向いた「わらへび」が毎年奉納されているという。船橋の名が文献に初めて現れた時、それは橋の名である前に、神宮に属する土地の名だった。
    sources:
    - k1-funabashi-museum
    - k1-funabashi-natsumi
  relations:
  - pref/12
  unknowns:
  - 語源は「船を並べた橋」説（通説）と「桟橋」説が併存し、市の資料でも確定していない
  - 『吾妻鏡』文治2年条の原文は未読で、市デジタルミュージアムの紹介による記録にとどまる
  - 日本武尊に結びつける由来伝説も市の図書館資料にあるが、本バッチでは景行天皇伝説のみを記録した
  updated: '2026-11-13'
- id: muni/13-府中市
  code: '132063'
  names:
    ja: 府中市
    reading: ふちゅうし
    aliases:
    - 府中町
    - 府中宿
  user_terms:
  - 東京の府中の名前の由来
  - 武蔵国府があった市
  - 府中市はなぜ2つあるの
  naming_type: その他（国府所在地を指す普通名詞的地名の継承）
  prefecture: 東京都
  homonyms:
  - muni/34-府中市
  summary: 市名は、奈良時代から平安時代にかけて武蔵国の国府が置かれた地であることに由来し、「国府の中」という意味で「府中」と名付けられたと市は説明する。江戸時代には甲州街道の府中宿として栄え、昭和29年（1954年）4月1日に府中町・多磨村・西府村の合併で府中市が誕生した。広島県府中市とは、律令制の国府所在地に由来する点で共通するが、国（武蔵国／備後国）と成立事情は別である。
  first_attestation:
    era: 承平年間（931〜938年）
    year_western: null
    document: 和名類聚抄
    note: 武蔵国府が多麻郡に在ることを記す記録として、府中市教育委員会の保存管理計画が挙げるもの。「府中」という語そのものの初出を示す記録ではない
  claims:
  - text: 府中市教育委員会は、市名は武蔵国の国府の所在地であったことにちなみ、「国府の中」という意味で「府中」という地名がつけられたと説明している
    kind: fact
    level: E2
    status: established
    sources:
    - h1-fuchu-tokyo-plan
    - h1-fuchu-tokyo-remains
  - text: 府中市の保存管理計画は、平安時代中期の『和名類聚抄』に武蔵国府が「多麻郡」に在ると記されていることを紹介し、これをもとに国府所在地の検討が重ねられてきたとする
    kind: fact
    level: E2
    status: established
    sources:
    - h1-fuchu-tokyo-plan
  - text: 国府の厳密な中心（国庁）の位置は現在も明らかになっておらず、大國魂神社東側の「京所」と呼ばれる一帯にあることはまず間違いないと府中市は述べている
    kind: fact
    level: E2
    status: established
    sources:
    - h1-fuchu-tokyo-remains
  - text: 江戸時代には甲州街道の宿場町「府中宿」として栄え、明治以降は郡役所が置かれるなど多摩地域の中心であった
    kind: fact
    level: E2
    status: established
    sources:
    - h1-fuchu-tokyo-history
  - text: 昭和29年（1954年）4月1日、北多摩郡府中町と多磨村・西府村の1町2村が合併して府中市が誕生した
    kind: fact
    level: E2
    status: established
    sources:
    - h1-fuchu-tokyo-history
    - h1-jk-chimei-61
  - text: （共通する層）広島県府中市とは読み・表記が同一で、ともに律令制の国府（こちらは武蔵国府、相手は備後国府）の所在地に由来する「府中」である点で共通する
    kind: fact
    level: E3
    status: established
    sources:
    - h1-jk-chimei-61
  - text: （異なる層）両市の成立は広島県府中市が1954年3月31日、東京都府中市が翌4月1日と1日違いであり、全国で表記が同一の市名は府中市と伊達市の2組だけであると日本歴史地名大系ジャーナルは指摘する
    kind: fact
    level: E3
    status: established
    sources:
    - h1-jk-chimei-61
  - text: 大國魂神社の例大祭「くらやみ祭」は、国府の祭りを起源とする伝統を受け継ぐ祭りであると伝えられている
    kind: legend
    level: E2
    status: established
    sources:
    - h1-fuchu-tokyo-vision
  column:
    title: 1日違いで生まれた、2つの府中市
    text: 広島県府中市と東京都府中市は、1954年3月31日と4月1日、わずか1日違いで誕生しました。日本歴史地名大系ジャーナルによれば、当時は既存市と同名の市を避ける空気があったものの、武蔵国府と備後国府という古代以来の由緒を背負う両府中町は、どちらも名前を譲らなかったのではないかと筆者は推測しています（この動機づけは筆者の想像として紹介されています）。国府の中心にあった大國魂神社は武蔵国の総社で、その例大祭「くらやみ祭」は今も国府の祭りの伝統を伝えるとされます。同じ名前は偶然ではなく、「国の都」が日本各地に置かれたことの名残なのです。
    sources:
    - h1-jk-chimei-61
    - h1-fuchu-tokyo-vision
  relations:
  - pref/13
  - muni/34-府中市
  - muni/34-府中町
  unknowns:
  - 武蔵国庁の正確な位置（大國魂神社東側の京所一帯とされるが、市公式も「まだ明らかになっていない」と明記）
  - 「府中」という語の文献上の初出の特定は未了（本レコードの初出は国府所在地の記録としての和名類聚抄）
  - 1954年の市制施行時に同名回避の指導が実際にあったかどうかは、日本歴史地名大系ジャーナルも筆者の推測としており未確定
  updated: '2026-11-13'
- id: muni/13-新宿区
  code: '131041'
  names:
    ja: 新宿区
    reading: しんじゅくく
    aliases:
    - 内藤新宿
    - 四谷区
    - 牛込区
    - 淀橋区
  user_terms:
  - 新宿の名前の由来
  - 内藤新宿とは何か
  - 新宿区はいつできた
  - 都庁はなぜ新宿にある
  - 都庁所在地は新宿区か東京か
  naming_type: 一部の地名
  prefecture: 東京都
  homonyms: []
  summary: 新宿は、甲州街道に新しく設けられた宿場「内藤新宿」に由来する。元禄11年（1698年）、高遠藩主内藤家の屋敷地に宿場が開かれ、その「新しい宿」が地名になった。昭和22年（1947年）に四谷区・牛込区・淀橋区が合併して新宿区が成立し、平成3年（1991年）には東京都庁が西新宿に移転して、都庁が所在する特別区となっている。
  first_attestation:
    era: 元禄11年
    year_western: 1698
    document: 内藤新宿の開設（新宿区公式「区名の由来」ほかが紹介）
    note: 宿場の設置そのものが命名の出来事。宿場があったのは現在の新宿駅の位置ではなく、新宿通り沿いの現在の新宿一・二丁目あたりで、中心の位置は現在の繁華街と少しずれている
  claims:
  - text: 新宿区公式によれば、甲州街道は日本橋から最初の宿場である高井戸までの距離が長く旅人が難儀していたため、名主・高松喜六らの願いにより、その中間の地に宿場の設置が認められた
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-shinjuku-city
  - text: 新宿区の資料によれば、元禄11年（1698年）に新しい宿場の設置が認められ、内藤氏が幕府に返上した屋敷地に置かれたことから「内藤新宿」と呼ばれ、これが新宿の地名の起こりとなっている
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-shinjuku-doboku
    - b-cap-shinjuku-gaiyo
  - text: 新宿区の資料によれば、内藤新宿の宿場町は現在の新宿一・二丁目の新宿通りにほぼ沿った形で広がっており、南側には内藤家下屋敷（現在の新宿御苑）があった。つまり宿場の中心は、現在の新宿駅周辺ではなく東寄りにあった
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-shinjuku-doboku
  - text: 国立国会図書館の展示によれば、内藤新宿は江戸四宿の1つで、明治18年（1885年）に日本鉄道の新宿駅が、もとの宿場の中心から数百メートル離れた場所に開設された
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-shinjuku-ndl
  - text: 新宿区公式によれば、現在の新宿区は昭和22年（1947年）3月15日に、かつての四谷区・牛込区・淀橋区が統合して成立した
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-shinjuku-gaiyo
  - text: 東京都公式FAQによれば、東京都庁は平成3年（1991年）4月1日に、千代田区丸の内（現在の東京国際フォーラムの場所）から現在の新宿区西新宿に移転した。新宿区は市ではなく地方自治法上の特別区であり、本レコードで「都庁所在地」と呼ぶのは、都庁（本庁舎）が物理的に所在する基礎自治体という意味である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-tokyo-syozaichi
  - text: 総務省の全国地方公共団体コードで、新宿区のコードは131041と定められている（J-LISの東京都内市町村一覧による）
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-shinjuku-jlis
  column:
    title: 宿場と駅は、数百メートルずれている
    text: 「新宿」の中心は、時代とともに西へ動いてきた。内藤新宿の宿場町は今の新宿一・二丁目、新宿通り沿いにあり、その南には内藤家の下屋敷（現在の新宿御苑）が広がっていた。1885年にできた鉄道の新宿駅は、宿場の中心から数百メートル離れた場所に置かれ、繁華街の重心は駅のほうへ移った。現在の都庁も西新宿にある。地名は江戸の宿場から受け継いだが、地名の指す「中心」は300年で少しずつ西へずれ続けたことになる。
    sources:
    - b-cap-shinjuku-doboku
    - b-cap-shinjuku-ndl
  relations:
  - pref/13
  unknowns:
  - 「内藤新宿」の文字列が現れる最古の文書は、本バッチでは特定できなかった
  - 東京都は「都庁所在地」という概念自体に公式の定義を置いておらず、都公式FAQも「都庁の所在地」（住所）に答える形のため、「新宿区が都庁所在地である」と断定する一次的な根拠は存在しない。本レコードでは都庁の物理的所在地をもって扱った
  - 内藤新宿の開設が元禄11年（1698年）か元禄12年（1699年）かは資料により表記の揺れがあり（新宿区広報は1699年開設とする）、本バッチでは区の概要資料の1698年を採用したが、設置認可と開設の段階差の可能性がある
  updated: '2026-11-13'
- id: muni/14-川崎市
  code: '141305'
  names:
    ja: 川崎市
    reading: かわさきし
    aliases:
    - 川崎町
    - 川崎宿
    - 河崎
  user_terms:
  - 川崎市の名前の由来
  - 川崎はなぜ川崎というのか
  - 川崎大師の川崎
  - 川崎宿のあったまち
  naming_type: 一部の地名
  prefecture: 神奈川県
  homonyms: []
  summary: 市名は東海道の宿場町・川崎宿に発達した川崎町の名を受け継いだものである。「川崎」は平安時代後期の文献に「河崎」と現れる古い地名で、川崎市は「川の先」、すなわち多摩川の河口近くに位置していたことに由来すると説明する。大正13年（1924年）に川崎町・大師町・御幸村が合併して川崎市が誕生した。
  first_attestation:
    era: 平安時代後期
    year_western: null
    document: 「河崎冠者基家」の名乗り（『川崎市水道百年史』が紹介）
    note: この地に移って荘園を開いた秩父基家が地名をとって「河崎冠者」と名乗ったのが文献上の初めと市は伝える。当時は「河崎」と書かれた
  claims:
  - text: 『川崎市水道百年史』によれば、「川崎」という地名が文献に登場するのは平安時代後期のことで、この地に移って荘園を開いた秩父基家が地名をとって「河崎冠者基家」と名乗ったことに始まるといわれている
    kind: fact
    level: E2
    status: established
    sources:
    - k1-kawasaki-suido
  - text: 「川崎」の由来について、川崎市は「川の先」、すなわち多摩川の河口近くに位置していたことによる名であると説明している
    kind: fact
    level: E2
    status: established
    sources:
    - k1-kawasaki-seisaku
  - text: 元和9年（1623年）、久根崎・砂子・小土呂・新宿の各地区をもって川崎宿が東海道の宿駅の一つに加えられ、多摩川の六郷の渡しを控える宿場として栄えた
    kind: fact
    level: E2
    status: established
    sources:
    - k1-kawasaki-suido
    - k1-kawasaki-chimei
  - text: 明治22年（1889年）の町村制施行の際、新宿・砂子・小土呂・久根崎と堀之内を合わせて川崎町となった
    kind: fact
    level: E2
    status: established
    sources:
    - k1-kawasaki-suido
  - text: 大正13年（1924年）7月1日、川崎町・大師町・御幸村が合併して川崎市が誕生した。当時の人口は約4万8,000人だった
    kind: fact
    level: E2
    status: established
    sources:
    - k1-kawasaki-seisaku
  - text: 市制の発足は当初大正12年（1923年）に目指されたが、関東大震災の発生と、大師河原村が町制を施行してから合併したいという事情のため、翌大正13年にずれ込んだ
    kind: fact
    level: E2
    status: established
    sources:
    - k1-kawasaki-kusei50
  - text: 総務省の全国地方公共団体コードで、川崎市のコードは141305と定められている（J-LISの神奈川県内市町村一覧による）
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-yoko-jlis
  column:
    title: 市制は震災で1年延びた
    text: 川崎の市制は、本来なら大正12年（1923年）に始まるはずだった。ところが同年9月に関東大震災が発生し、さらに合併相手の大師河原村が「まず町になってから合流したい」と望んだため、発足は大正13年7月1日にずれ込んだ。川崎大師の門前町である大師町と、東海道の宿場町だった川崎町、多摩川沿いの農村だった御幸村という、性格の違う3町村の合併で生まれた市である。誕生時の人口は約4万8,000人で、その後の100年で30倍を超える大都市に成長した。
    sources:
    - k1-kawasaki-kusei50
    - k1-kawasaki-seisaku
  relations:
  - pref/14
  unknowns:
  - 「川の先」説以外の語源説（「川の崎」など）については、本バッチでは専門文献の裏付けが取れなかった
  - 平安時代後期の「河崎」の一次資料そのものは未読で、市史の紹介による記録にとどまる
  updated: '2026-11-13'
- id: muni/14-横浜市
  code: '141003'
  names:
    ja: 横浜市
    reading: よこはまし
    aliases:
    - 横浜村
    - 横浜新田
  user_terms:
  - 横浜の名前の由来
  - 横浜はなぜ横浜と呼ぶ
  - 横に長い浜って本当
  - 開港前の横浜村
  - 神奈川県なのに県庁は横浜
  naming_type: 一部の地名
  prefecture: 神奈川県
  homonyms: []
  summary: 横浜は、入り江に横に長く突き出た砂浜を指した地名だと横浜市の論考は説明する。その砂浜にあった横浜村は戸数100戸ほどの漁村だったが、安政6年（1859年）の開港で国際港のまちとなり、明治22年（1889年）の市制施行で村の名がそのまま市名に継承された。
  first_attestation:
    era: 江戸時代
    year_western: null
    document: 横浜村（横浜市中区の歴史年表が紹介する村名）
    note: 「横浜」の名が現れる最古の文書は本バッチでは未特定。18世紀には横浜新田と洲干を合わせた横浜村として存在し、安政元年（1854年）の日米和親条約の交渉地として国際的な記録に現れる
  claims:
  - text: 横浜市の調査季報に収録された論考によれば、かつての大岡川が注いでいた洲乾湊（すがんみなと）が江戸湾に接する部分に、石川郷の台地から横に長く突き出た砂浜があり、それが元々の「横浜」であった
    kind: fact
    level: E2
    status: contested
    sources:
    - b-cap-yoko-kiyou
  - text: 横浜市中区の歴史年表によれば、18世紀になると洲干（洲乾）の付け根に隣接する海岸が埋め立てられて横浜新田が造成され、この横浜新田と洲干を合わせて横浜村といい、その頃は100戸ほどの寒村であった
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-yoko-naka-nenpyo
  - text: 横浜市の開港150周年基本計画によれば、安政元年（1854年）、日米和親条約の締結場所として一寒村に過ぎなかった横浜村が選ばれた
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-yoko-kaiko-plan
  - text: 横浜市公式によれば、日米修好通商条約では神奈川に開港場が置かれることとされたが、実際に開港したのは神奈川宿の東南約4キロにあった横浜であり、安政6年（1859年）7月1日（旧暦6月2日）に横浜が開港した。条約が名指した地名と、実際に開かれた港の地名にはずれがある
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-yoko-kaiko-plan
    - b-cap-yoko-kaiko150
  - text: 横浜市中区の歴史年表によれば、明治22年（1889年）に市制が施行され、横浜市が誕生した
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-yoko-naka-nenpyo
  - text: 横浜市公式によれば、開港前の横浜は戸数100戸ほどの小さな村であり、開港を契機に海外の窓口として技術・文化・人が集まる港を中心に発展し、現在の大都市が築かれた
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-yoko-kaiko150
  - text: 総務省の全国地方公共団体コードで、横浜市のコードは141003と定められている（J-LISの神奈川県内市町村一覧による）
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-yoko-jlis
  column:
    title: 条約には「神奈川」と書かれたのに
    text: 1858年の日米修好通商条約が開港場として名指したのは「神奈川」だった。ところが幕府が実際に開港場を整えたのは、東海道の宿場町・神奈川宿から約4キロ離れた寒村の横浜である。街道の往来と外国人を切り離す狙いがあったとされるこの置き換えの結果、港の名は「横浜」が世界に知られ、県の名には条約どおりの「神奈川」が残った。横浜市と神奈川県という、港と県で名前が食い違う現在の姿は、この1859年のずれがそのまま化石になったものといえる。
    sources:
    - b-cap-yoko-kaiko-plan
    - b-cap-yoko-kiyou
  relations:
  - pref/14
  unknowns:
  - 「横浜」の名が現れる最古の文書は本バッチでは特定できなかった。室町時代の用例が指摘されることがあるが、一次資料で確認できていない
  - 「横に長い浜」説以外の語源説は、本バッチでは専門文献で確認できなかった
  - 開港場を神奈川から横浜に置いた幕府の判断理由については諸説があり、本バッチでは市の公式資料の範囲を超えて断定していない
  updated: '2026-11-13'
- id: muni/14-横須賀市
  code: '142018'
  names:
    ja: 横須賀市
    reading: よこすかし
    aliases:
    - 横須賀町
    - 横須賀村
  user_terms:
  - 横須賀市の名前の由来
  - 横須賀はなぜ横須賀というのか
  - 軍港のまち横須賀
  - ペリーが来た横須賀
  naming_type: 一部の地名
  prefecture: 神奈川県
  homonyms: []
  summary: 市名は三浦半島の漁村だった横須賀村・横須賀町の名を受け継いだものである。「横須賀」は鎌倉時代の『吾妻鏡』に「三浦横須賀」と見える古い地名で、「須賀」は砂州を意味し、横に長く伸びた砂州を指す名と考えられている。慶応元年（1865年）の横須賀製鉄所設立を機に軍港都市となり、明治40年（1907年）に横浜市に次ぐ県内2番目の市として発足した。
  first_attestation:
    era: 建保3年
    year_western: 1215
    document: 『吾妻鏡』建保3年3月5日条（「三浦横須賀」）
    note: 『日本歴史地名大系』が引く用例で、将軍家の花見の地として記される。一次文献そのものは未読のため、二次資料経由の記録として扱う
  claims:
  - text: 『日本歴史地名大系』によれば、「横須賀」の地名は『吾妻鏡』建保3年（1215年）3月5日条に「将軍家為覧花、御出于三浦横須賀」と見える
    kind: fact
    level: E3
    status: established
    sources:
    - k1-yokosuka-kotobank
  - text: 語源由来辞典は、「スカ（須賀）」は砂州（砂処・州処）を意味し、横須賀は横に長く伸びた砂州のことと考えられるとする
    kind: fact
    level: E3
    status: established
    sources:
    - k1-yokosuka-gogen
  - text: 「須賀」という地名要素が砂州・砂地を意味することは、千葉県匝瑳市の須賀地区について同市の公式資料も「須賀という地名は、全国各地に存在する。その語源は須が砂州を意味する」と説明しており、各地の「須賀」に共通する語義とされる
    kind: fact
    level: E2
    status: established
    sources:
    - k1-sosa-suka
  - text: 明治9年（1876年）に横須賀村が横須賀町となった
    kind: fact
    level: E2
    status: established
    sources:
    - k1-yokosuka-zaidan
  - text: 慶応元年（1865年）、江戸幕府が横須賀村（現在の本町一帯）に横須賀製鉄所を設立した。以後、横須賀は漁村・農村集落から軍港都市へと変貌していった
    kind: fact
    level: E2
    status: established
    sources:
    - k1-yokosuka-zaidan
  - text: 明治39年（1906年）12月15日に横須賀町と豊島町が合併し、明治40年（1907年）2月15日に市制を施行して横須賀市が誕生した。横浜市に次いで神奈川県内2番目の市だった
    kind: fact
    level: E2
    status: established
    sources:
    - k1-yokosuka-shisei110
  - text: 総務省の全国地方公共団体コードで、横須賀市のコードは142018と定められている（J-LISの神奈川県内市町村一覧による）
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-yoko-jlis
  column:
    title: 黒船が来たのは「横須賀」ではなかった
    text: 嘉永6年（1853年）にペリーが来航したのは浦賀沖で、上陸したのは久里浜である。どちらも現在の横須賀市域だが、当時は横須賀とは別の村々だった。横須賀の名が表舞台に出るのはその12年後、幕府が横須賀村に製鉄所（後の横須賀造船所）を造ってからである。軍港として急成長した横須賀は、明治40年（1907年）に県内2番目の市となり、やがて浦賀や久里浜も市域に取り込んだ。黒船の舞台と軍港の名が同居する現在の市域は、この合併の結果である。
    sources:
    - k1-yokosuka-zaidan
    - k1-yokosuka-shisei110
  relations:
  - pref/14
  unknowns:
  - 『吾妻鏡』建保3年条の原文は未読で、『日本歴史地名大系』の引用による記録にとどまる
  - 「横に長い砂州」説について、『角川日本地名大辞典』の見解は本バッチでは確認できなかった
  updated: '2026-11-13'
- id: muni/14-相模原市
  code: '141500'
  names:
    ja: 相模原市
    reading: さがみはらし
    aliases:
    - 相模原町
  user_terms:
  - 相模原市の名前の由来
  - 相模原はなぜ相模原というのか
  - 軍都だった相模原
  - 日本一大きな町だった相模原町
  naming_type: 合併新設
  prefecture: 神奈川県
  homonyms: []
  summary: 「相模原」は昭和16年（1941年）の8町村合併で生まれた新しい町名で、構成町村のどの名でもなく、相模国に広がる原野「相模野」・相模原台地を指す地域の名を採用したものとされる。町名の決定には神奈川県が関与した。相模原町は昭和29年（1954年）に市制を施行して相模原市となった。
  first_attestation:
    era: 昭和16年
    year_western: 1941
    document: 高座郡相模原町の成立（8町村の合併）
    note: 「相模原」という自治体名の初出。それ以前、この一帯の原野は「相模野」と呼ばれ、台地は相模原台地と呼ばれていた
  claims:
  - text: 江戸時代、現在の相模原市域の中央部は「相模野」と呼ばれる雑草や雑木の茂る広大な原野で、江戸期を通じて新田開発が進められた
    kind: fact
    level: E2
    status: established
    sources:
    - k1-sagamihara-gappei
  - text: 昭和16年（1941年）4月29日、上溝町・座間町の2町と相原・大野・大沢・田名・麻溝・新磯の6村が合併し、人口45,482人・面積108.71平方キロで当時「日本一大きな町」とされた高座郡相模原町が誕生した
    kind: fact
    level: E2
    status: established
    sources:
    - k1-sagamihara-gappei
    - k1-sagamihara-archive
  - text: 「相模原」という町名は合併する8町村のいずれの名でもなく、相模原市立図書館のレファレンス記録によれば、町名は神奈川県の側から提示されて「相模原町」に決められたという
    kind: fact
    level: E2
    status: established
    sources:
    - k1-sagamihara-ndlref
  - text: 合併を進めた相模原市（合併協議会）の資料は、「相模原」の歴史的背景として、相模野と呼ばれた原野の開発の歴史を位置づけており、市名は相模国の名と台地の原野を指す「原」を組み合わせた地域名である
    kind: fact
    level: E2
    status: established
    sources:
    - k1-sagamihara-gappei
  - text: 昭和10年代には陸軍士官学校や相模陸軍造兵廠などの軍施設が次々に置かれて「軍都」と呼ばれるようになり、県による相模原都市建設区画整理事業が進められたことが、8町村合併の背景にあった
    kind: fact
    level: E2
    status: established
    sources:
    - k1-sagamihara-gappei
  - text: 昭和29年（1954年）11月20日、相模原町が市制を施行して相模原市が発足した
    kind: fact
    level: E2
    status: established
    sources:
    - k1-sagamihara-archive
  - text: 総務省の全国地方公共団体コードで、相模原市のコードは141500と定められている（J-LISの神奈川県内市町村一覧による）
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-yoko-jlis
  column:
    title: 「日本一大きな町」の名は県が決めた
    text: 1941年に生まれた相模原町は、面積108.71平方キロ・人口45,482人で「日本一大きな町」だった。だが、その名は合併する8町村の住民が選んだものではない。相模原市立図書館の調べでは、町名は神奈川県の側から一方的に「相模原町」と決められたという。軍都建設を進める県にとって、相模野の大台地全体を指す大きな名前が必要だったのだろう。「相模原」という地名が世に出たのはこの時が初めてで、それ以前に「相模原」という町や村は存在しなかった。
    sources:
    - k1-sagamihara-gappei
    - k1-sagamihara-ndlref
    - k1-sagamihara-archive
  relations:
  - pref/14
  unknowns:
  - 神奈川県が「相模原」の名を選んだ具体的な理由を記した一次資料は、本バッチでは確認できなかった（図書館レファレンスが引く『相模原市史』第4巻等は未読）
  - 「相模原」の語が1941年以前に地域名としてどう使われていたかは、台地名（相模原台地）としての用例以上の確認ができていない
  updated: '2026-11-13'
- id: muni/14-箱根町
  code: '143821'
  names:
    ja: 箱根町
    reading: はこねまち
    aliases:
    - 筥根
  user_terms:
  - 箱根の名前の由来
  - 箱根町はいつできたの
  - 箱根関所と天下の険
  - 筥根とは何か
  naming_type: 合併新設
  prefecture: 神奈川県
  homonyms: []
  summary: 現在の箱根町は、1956年に湯本町・温泉村・宮城野村・仙石原村・箱根町の5町村が合併して生まれた町で、合併前の構成町村の一つだった旧箱根町（関所の町）の名が全体の名となった。「箱根」の語源については確定した説明を確認できておらず、中世の縁起では「筥根」とも表記された。万巻上人が757年に社殿を建立したという箱根神社の社伝など、山岳信仰の伝承がこの名と深く結びついている。
  first_attestation:
    era: 建久2年
    year_western: 1191
    document: 筥根山縁起并序
    note: 箱根神社の縁起。「筥根」と表記され、箱根山と箱根権現の名を伝える中世の資料。より古い用例の有無は未確認
  claims:
  - text: 1956年（昭和31年）9月30日、湯本町・温泉村・宮城野村・仙石原村・箱根町の5町村が合併して現在の箱根町が誕生した。発足当時の人口は16,491人だった（地方公共団体コードは143821）
    kind: fact
    level: E2
    status: established
    sources:
    - k6-hakone-town-nenpyo
    - k6-hakone-town-ayumi
    - b-cap-chiba-soumu-code
  - text: 1889年（明治22年）の町村制では、のちの箱根町域は湯本村・温泉村・宮城野村・仙石原村・箱根駅・元箱根村・芦之湯村の1駅6村に分かれていた
    kind: fact
    level: E2
    status: established
    sources:
    - k6-hakone-town-ayumi
  - text: 中世の縁起『筥根山縁起并序』（1191年成立）では地名が「筥根」と表記され、箱根神社はこの縁起を伝えている
    kind: fact
    level: E2
    status: established
    sources:
    - k6-hakone-jinja
  - text: 箱根神社の社伝では、天平宝字元年（757年）に万巻上人が芦ノ湖畔に社殿を建立し、箱根山の三神を祀って「箱根三所権現」と号したと伝える
    kind: fact
    level: E2
    status: established
    sources:
    - k6-hakone-jinja
  - text: 縁起には、聖占仙人が孝昭天皇の御代に駒ヶ岳の山頂に神仙宮を開いたという開山の伝承が記される
    kind: legend
    level: E2
    status: contested
    sources:
    - k6-hakone-jinja
  - text: 箱根は東海道の要衝で、深い谷と急な坂路から「天下の険」と呼ばれ、江戸時代には幕府が芦ノ湖畔に関所を置いて往来を取り締まったと箱根町は説明する
    kind: fact
    level: E2
    status: established
    sources:
    - k6-hakone-town-ayumi
  column:
    title: 関所の町の名前が、山全体の名前になった
    text: 1956年の合併で新しい町の名になった「箱根」は、もとは芦ノ湖畔の関所を中心に栄えた一町村の名だった。江戸時代、東海道最大の難所とされたこの地には関所が置かれ、「入り鉄砲に出女」の取り締まりで知られた。その宿場町の名が、湯本・宮城野・仙石原といった温泉地を含む町全体の名となり、今日では温泉地群全体を指す広域ブランドとして定着している。町の名は、関所の町の名の「格上げ」だったのである。
    sources:
    - k6-hakone-town-ayumi
    - k6-hakone-town-nenpyo
  relations:
  - pref/14
  unknowns:
  - 「箱根」の語源（カルデラの形状に由来するという俗説等）については、専門辞典による確定した説明を本調査では確認できなかった
  - 『万葉集』に箱根の歌があるとする紹介も見られるが、本調査では原典・専門資料での確認が取れていないため主張に含めていない
  updated: '2026-11-13'
- id: muni/14-鎌倉市
  code: '142042'
  names:
    ja: 鎌倉市
    reading: かまくらし
    aliases:
    - 鎌倉町
    - 鎌倉郷
    - 可麻久良
  user_terms:
  - 鎌倉の名前の由来
  - 鎌倉はなぜ鎌倉というのか
  - 藤原鎌足の鎌の話は本当か
  - 鎌倉幕府の鎌倉
  naming_type: 一部の地名
  prefecture: 神奈川県
  homonyms: []
  summary: 市名は相模国鎌倉郡の郷名以来の古い地名を受け継いだものである。「鎌倉」は奈良時代には確実に使われており、天平5年（733年）の木簡に「鎌倉郡鎌倉里」とある。語源は確定しておらず、三方を山に囲まれた地形に由来する説が有力とされるほか、藤原鎌足が鎌を埋めたという伝説などが市の公式ページに併記されている。
  first_attestation:
    era: 和銅5年
    year_western: 712
    document: 『古事記』中巻・景行天皇条（「鎌倉之別」）
    note: 氏族名としての「鎌倉」の初出とされる。地名としての確実な初期例は天平5年（733年）の宮久保遺跡出土木簡「鎌倉郡鎌倉里」で、『万葉集』には「可麻久良」と詠まれている
  claims:
  - text: 「鎌倉」の名が文書に登場するのは、和銅5年（712年）成立の『古事記』の中で、日本武尊の子・足鏡別王を「鎌倉之別の祖」と記しているのが最初とされる
    kind: fact
    level: E4
    status: established
    sources:
    - k1-kamakura-izakamakura
  - text: 神奈川県綾瀬市の宮久保遺跡から出土した天平5年（733年）銘の木簡に「鎌倉郡鎌倉里」と記されており、奈良時代には鎌倉郡・鎌倉郷（里）の名が実際に使われていた
    kind: fact
    level: E4
    status: established
    sources:
    - k1-kamakura-izakamakura
  - text: 鎌倉市公式は、「鎌倉」の由来には諸説あるとした上で、地形的な説として「鎌はもともと『かまど』のことで、倉は『谷』のこと。三方を山に囲まれ南が海に開けた地形が、かまどのようで倉のように一方が開いていることによる」という説を紹介している
    kind: fact
    level: E2
    status: contested
    sources:
    - k1-kamakura-yurai
  - text: 鎌倉市中央図書館のレファレンス記録は、地形に由来を求める説が有力だとしつつ、『角川日本地名大辞典』が「カマは洞穴、クラは岩の意ともいう」と説くことなど、複数の地形説が併存することを示している
    kind: fact
    level: E2
    status: contested
    sources:
    - k1-kamakura-ndlref
  - text: 藤原鎌足が神宮参拝の途中、由井里（今の由比ガ浜）に泊まった夜に不思議な夢を見て、いつも持っていた鎌（鎌槍）を大蔵の松ヶ岡に埋めた。そこから「鎌倉」になったといわれている
    kind: legend
    level: E2
    status: established
    sources:
    - k1-kamakura-yurai
  - text: 神武天皇が東国を征服しようとした際、毒矢に当たって死んだ人々の屍が山となり今の鎌倉の山ができた。「屍（かばね）が蔵をつくった」ので「屍蔵（かばねくら）」となり、それがなまって「かまくら」になったといわれている
    kind: legend
    level: E2
    status: established
    sources:
    - k1-kamakura-yurai
  - text: 昭和14年（1939年）11月3日、鎌倉郡鎌倉町と腰越町の区域を合わせて市制を施行し、鎌倉市が発足した
    kind: fact
    level: E2
    status: established
    sources:
    - k1-kamakura-intro
  - text: 総務省の全国地方公共団体コードで、鎌倉市のコードは142042と定められている（J-LISの神奈川県内市町村一覧による）
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-yoko-jlis
  column:
    title: 幕府より500年以上古い名前
    text: 「鎌倉」は源頼朝の幕府で有名になったが、地名自体はそれよりはるか前からあった。奈良時代の木簡には「鎌倉郡鎌倉里」とあり、『万葉集』にも「可麻久良」と詠まれている。つまり頼朝は新しい名前を作ったのではなく、三方を山に囲まれた天然の要害に、少なくとも450年以上の歴史を持つ古い地名の土地を選んだことになる。幕府の所在地として選ばれた理由の一つが地形だとすれば、「かまど」のように囲まれた地形を指すという語源説とも響き合う。
    sources:
    - k1-kamakura-izakamakura
    - k1-kamakura-yurai
  relations:
  - pref/14
  unknowns:
  - 語源の定説はなく、地形説が有力とされるが確定していない。アイヌ語説・蒲（がま）説・神倉（かみくら）説なども市公式が併記する
  - 『古事記』の「鎌倉之別」を地名そのものの初出とみなしてよいかは議論の余地があり、本レコードでは氏族名としての初出と位置づけた
  updated: '2026-11-13'
- id: muni/15-新潟市
  code: '151009'
  names:
    ja: 新潟市
    reading: にいがたし
    aliases:
    - 新潟町
    - 新潟区
    - 新潟湊
  user_terms:
  - 新潟市の名前の由来
  - 新潟市はなぜ新潟というのか
  - 開港5港の新潟
  - 新潟と沼垂の関係
  naming_type: 一部の地名
  prefecture: 新潟県
  homonyms: []
  summary: 市名は信濃川河口の港町「新潟町」の名をそのまま受け継いだものである。「新潟」は、古くからの湊である蒲原・沼垂に対して新しく開けた湊を意味する名と考えられている。明治22年（1889）の市制施行で新潟区から新潟市が発足し、市名は県名にもなった港町の名がそのまま市名となった。
  first_attestation:
    era: 永禄11年
    year_western: 1568
    document: 上杉輝虎（謙信）書状
    note: 市名の元になった港町名「新潟」の表記が確認できる初期の用例（新潟県立図書館の解説が紹介）。さらに古い用例として永正17年（1520）の『越後過去名簿』の「新方」がある
  claims:
  - text: 永禄11年（1568）の上杉輝虎（後の謙信）の手紙の中に「新潟」という表記が見え、これが港町名「新潟」の初期の確認例とされる
    kind: fact
    level: E2
    status: established
    sources:
    - c-niigata-lib
  - text: 「新」は、周辺の蒲原・沼垂という7〜8世紀の文献にも出てくる古い湊に比べて新しい湊であることを示すと考えられている
    kind: fact
    level: E2
    status: established
    sources:
    - c-niigata-lib
  - text: 新潟市公式は、延長5年（927）の『延喜式』に載る越後国の国津「蒲原津」を文献に現れる最初の新潟港としており、河口部の湊の歴史は平安時代に遡る
    kind: fact
    level: E2
    status: established
    sources:
    - c-cap-niigata-port
  - text: 新潟湊は江戸時代に北前船の日本海側最大級の寄港地として栄え、安政5年（1858）の修好通商条約では函館・横浜・神戸・長崎とともに開港5港の一つに指定された
    kind: fact
    level: E2
    status: established
    sources:
    - c-cap-niigata-shisei
  - text: 明治12年（1879）に新潟町ほかの区域をもって新潟区が置かれ、明治22年（1889）4月1日の市制施行により新潟区から新潟市が発足した
    kind: fact
    level: E2
    status: established
    sources:
    - c-cap-niigata-kita
  - text: 信濃川を挟んで対岸にあった沼垂町とは川の中州の帰属をめぐって争いが続き、元禄12年（1699）の幕府裁定（元禄の湊訴訟）で島の支配権は新潟町のものとなった
    kind: fact
    level: E2
    status: established
    sources:
    - c-cap-niigata-ryusaku
  - text: 大正3年（1914）4月1日、沼垂町が新潟市に編入され、対岸同士で競い合ってきた二つの湊町が一つの市になった
    kind: fact
    level: E4
    status: established
    sources:
    - c-cap-niigata-uub
  - text: 総務省の全国地方公共団体コードで、新潟市の団体コードは151009と定められている
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 対岸のライバル同士が、一つの市になった
    text: 信濃川の河口には、左岸の新潟町と右岸の沼垂町という二つの湊町が向かい合っていました。川が運ぶ土砂で中州ができては姿を変える土地で、両町は島の取り合いを繰り返し、元禄12年（1699）には幕府の裁定（元禄の湊訴訟）にまで発展しました。ところが大正3年（1914）、沼垂町は新潟市に編入されます。何世紀も川を挟んで競い合ったライバル同士が、同じ市の住民になったのです。今も信濃川の両岸に古い町並みの名残が残り、二つの湊の記憶を伝えています。
    sources:
    - c-cap-niigata-ryusaku
    - c-cap-niigata-uub
  relations:
  - pref/15
  unknowns:
  - 「新潟」の「新」が新しい潟そのものを指すのか、新しく作られた港町を指すのかは決着していない（県レコードでも対立として記録）
  - 蒲原津の正確な所在地は、現在の新潟市域の河口部に比定されるが地点の特定はできていない
  - 沼垂町編入（1914）の経緯について、市公式年表での直接確認は次回に回した（変遷情報サイトの整理に基づく）
  updated: '2026-11-13'
- id: muni/16-富山市
  code: '162019'
  names:
    ja: 富山市
    reading: とやまし
    aliases:
    - 富山町
    - 外山郷
    - 富山城下
  user_terms:
  - 富山市の名前の由来
  - 富山市はなぜ富山というのか
  - 外山と富山の違い
  - 富山市が2005年に合併した経緯
  naming_type: 合併新設
  prefecture: 富山県
  homonyms: []
  summary: 現在の富山市は、平成17年（2005）に旧富山市と周辺6町村の新設合併で発足した自治体だが、市名自体は明治22年（1889）の市制施行以来のもので、富山藩の城下町「富山」の名を受け継いでいる。その「とやま」は室町期の郷名「外山郷」に遡り、「富山」の字は戦国期以降に広がった。
  first_attestation:
    era: 応永5年
    year_western: 1398
    document: 吉見詮頼寄進状
    note: 「富山」ではなく「外山郷（越中国外山郷地頭職）」という表記での初見（富山市郷土博物館蔵）
  claims:
  - text: 応永5年（1398）5月3日の吉見詮頼寄進状に「越中国外山郷地頭職」とあり、「とやま」の文献上の初見は「外山」の表記だった
    kind: fact
    level: E2
    status: established
    sources:
    - c-toyama-joka
  - text: 「外山」の語源については、呉羽山の外側に位置することによるとする説のほか、深山に対する外山とする説などもあり、確定していない
    kind: fact
    level: E3
    status: contested
    sources:
    - c-toyama-weblio
  - text: もとは藤井村と称された地が、真言宗の藤井山富山（ふせん）寺にちなんで富山と改称したという伝承が『三州志』などに伝えられる
    kind: legend
    level: E3
    status: established
    sources:
    - c-toyama-joka
  - text: 「富山」という表記は戦国時代に現れ、江戸時代には「外山」と「富山」の両表記が使われた
    kind: fact
    level: E2
    status: established
    sources:
    - c-toyama-weblio
  - text: 明治22年（1889）4月1日に市制が施行されて富山市が誕生した。当時の人口は約5万7千人で、日本海側では金沢に次ぐ規模であり、明治29年の調べでは全国14位の人口だった
    kind: fact
    level: E2
    status: established
    sources:
    - c-cap-toyama-museum
  - text: 初代富山市長には、旧富山藩主・前田家の前田則邦（富山藩9代藩主の孫）が任命され、藩政期との人的な連続があった
    kind: fact
    level: E2
    status: established
    sources:
    - c-cap-toyama-museum
  - text: 現在の富山市は、平成17年（2005）4月1日に旧富山市・大沢野町・大山町・八尾町・婦中町・山田村・細入村の7市町村が新設合併して発足した自治体であり、市名は1889年以来の「富山市」を受け継いだ
    kind: fact
    level: E4
    status: established
    sources:
    - c-cap-toyama-uub
  - text: 総務省の全国地方公共団体コードで、富山市の団体コードは162019と定められている
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 藩主の孫が、初代市長になった
    text: 明治22年（1889）に富山市が誕生したとき、初代市長に選ばれたのは旧富山藩主・前田家の前田則邦でした。当時の市長は市民の直接選挙ではなく、市会が推した候補から内務大臣が任命する仕組みで、則邦は富山藩9代藩主の孫にあたります。廃藩置県から18年、まちの顔は藩主の家系から選ばれたのです。しかも当時の富山市は人口約5万7千人、日本海側では金沢に次ぐ大都市で、人口では全国14位（明治29年）という存在感がありました。
    sources:
    - c-cap-toyama-museum
  relations:
  - pref/16
  unknowns:
  - 「外山」から「富山」へ字が替わった正確な時期と理由は確定していない（県レコードでも未確認として記録）
  - 外山郷の成立時期は特定できていない
  - 2005年の新設合併の経緯（合併協議の公式記録）については市公式資料での直接確認は未了
  updated: '2026-11-13'
- id: muni/16-朝日町
  code: '163431'
  names:
    ja: 朝日町
    reading: あさひまち
    aliases: []
  user_terms:
  - 朝日町の名前の由来
  - 富山の朝日町は朝日岳にちなむ
  - 朝日町は山形と富山と三重にある
  naming_type: 合併新設
  prefecture: 富山県
  homonyms:
  - muni/06-朝日町
  - muni/24-朝日町
  summary: 昭和29年（1954年）8月に泊町・大家庄村・山崎村・南保村・五箇荘村・宮崎村・境村の1町6村が合併して誕生した。町公式は「名峰朝日岳にちなんで『朝日町』と名付けられ」と由来を明示しており、3つの朝日町のうち唯一、山名由来が公式に確定している例である。同じ昭和29年の合併で生まれた山形県朝日町にも朝日岳（大朝日岳）があるが、そちらには由来の明示がない。
  first_attestation:
    era: 昭和29年
    year_western: 1954
    document: 朝日町の成立（1954年8月の合併。朝日町公式「朝日町の概要」）
    note: 自治体としての「朝日町」の初出。由来の元である朝日岳の山名自体の初出は未確認
  claims:
  - text: 昭和29年（1954年）8月、泊町・山崎村・大家庄村・南保村・五箇庄村・宮崎村・境村の1町6村が合併し、朝日町が誕生した
    kind: fact
    level: E2
    status: established
    sources:
    - h4-toyama-asahi-gaiyo
  - text: 町公式は「名峰朝日岳にちなんで『朝日町』と名付けられ」と明記しており、町名が朝日岳に由来することが公式に確定している
    kind: fact
    level: E2
    status: established
    sources:
    - h4-toyama-asahi-gaiyo
  - text: 【共通する層】山形県朝日町も同じ昭和29年（1954年）の合併で生まれ、朝日連峰の主峰・大朝日岳を擁する山麓の町である。2つの朝日町は、同じ年に生まれ、同じ読みの山の名と結びつく点で共通する
    kind: fact
    level: E2
    status: established
    sources:
    - h4-yamagata-asahi-gikai
    - h4-toyama-asahi-gaiyo
  - text: 【異なる層】ただし山名由来を公式に明示しているのは富山側だけで、山形側には同様の明示が確認できない。また三重県朝日町の「朝日」は山名ではなく、大海人皇子（天武天皇）が朝日を拝んだという故事にあやかったもので、命名の型が異なる
    kind: fact
    level: E2
    status: established
    sources:
    - h4-toyama-asahi-gaiyo
    - h4-yamagata-asahi-gikai
    - h4-mie-asahi-aramashi
  - text: 命名の背景にある泊は、江戸時代には加賀藩の統治下で境に関所が置かれた街道筋の宿場町として栄えたと町公式は説明する
    kind: fact
    level: E2
    status: established
    sources:
    - h4-toyama-asahi-gaiyo
  column:
    title: 朝日岳は2つある
    text: 富山の朝日岳と、山形の大朝日岳は、別の山である。なのに山麓の町はどちらも「朝日町」を名乗り、しかも同じ1954年に生まれた。富山側は「名峰朝日岳にちなんで」と公式に宣言していて、山への誇りがそのまま町の名になっている。同名の町が並ぶと紛らわしいが、山の名を誇る気持ちは両町に共通しているのだろう。
    sources:
    - h4-toyama-asahi-gaiyo
    - h4-yamagata-asahi-gikai
  relations:
  - pref/16
  - muni/06-朝日町
  - muni/24-朝日町
  unknowns:
  - 朝日岳の山名自体の由来（なぜ「朝日」と呼ばれるか）の確かな資料は未確認
  - 1954年11月20日の野中村編入の町公式資料での再確認は未実施
  updated: '2026-11-13'
- id: muni/17-金沢市
  code: '172014'
  names:
    ja: 金沢市
    reading: かなざわし
    aliases:
    - 金沢
    - 金沢御坊
    - 金沢町
    - 尾山
  user_terms:
  - 金沢市の名前の由来
  - 金沢は芋掘り藤五郎の話は本当か
  - 金洗いの沢とは
  - 金沢御坊と金沢の関係
  naming_type: 一部の地名
  prefecture: 石川県
  homonyms: []
  summary: 市名は城下町「金沢」の名を受け継いだもので、その初見は天文15年（1546）の『天文日記』に見える「金沢坊舎（金沢御堂）」とされる。まちは一向一揆の拠点・金沢御坊の門前から起こり、前田利家の入城後は加賀藩の城下町として発展した。砂金を洗った沢に由来するという芋掘り藤五郎の話は伝説として伝えられる。
  first_attestation:
    era: 天文15年
    year_western: 1546
    document: 天文日記
    note: 天文15年10月条の「加州金澤坊舎（金沢御堂）」が地名「金沢」の早い例とされる（『日本歴史地名大系』の説明を金沢市立図書館のレファレンス回答が紹介）。日付を10月25日とする資料と10月29日とする資料がある
  claims:
  - text: 『日本歴史地名大系』は、『天文日記』天文15年（1546）10月条に見える「金沢坊舎（金沢御堂）」を地名「金沢」の早い例として挙げている
    kind: fact
    level: E2
    status: established
    sources:
    - c-cap-kanazawa-ndl
  - text: 天文15年（1546）に金沢御堂（金沢御坊）が建立され、一向一揆の拠点とそのまわりのまちが金沢の起こりとされる
    kind: fact
    level: E2
    status: established
    sources:
    - c-cap-kanazawa-plan
  - text: 金沢御堂の廃絶後も「金沢」の名は城名や城下町の総名として引き継がれたと『日本歴史地名大系』は説明する
    kind: fact
    level: E2
    status: established
    sources:
    - c-cap-kanazawa-ndl
  - text: 芋掘り藤五郎が小立野台地の沢で芋の泥を洗ったら砂金が出たという物語が伝わり、『角川日本地名大辞典』は地名の由来を「小立野台地で砂金採掘を行った『金洗沢』によるといわれる」と記す
    kind: legend
    level: E2
    status: established
    sources:
    - c-cap-kanazawa-ndl
  - text: 城下の総名については、前田利家の時代に「尾山」と称され、文禄元年（1592）頃から再び「金沢」を号したとする記録（『金沢古蹟志』『越登賀三州志』等）があり、金沢の名が一時「尾山」に置き換わった時期があったと伝えられる
    kind: fact
    level: E2
    status: contested
    sources:
    - c-cap-kanazawa-ndl
  - text: 天正11年（1583）に前田利家が金沢城へ入城し、以後、金沢は加賀藩前田家の城下町として発展した
    kind: fact
    level: E2
    status: established
    sources:
    - c-cap-kanazawa-plan
  - text: 明治22年（1889）の市制施行以来、金沢市は近隣町村との編入・合併を重ねて市域を拡大してきた
    kind: fact
    level: E2
    status: established
    sources:
    - c-cap-kanazawa-city
  - text: 総務省の全国地方公共団体コードで、金沢市の団体コードは172014と定められている
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 金を洗った沢と、芋を掘る藤五郎
    text: 金沢の由来として一番有名なのは、芋掘り藤五郎の話でしょう。貧しい藤五郎が小立野の沢で芋についた土を洗っていると、きらきら光る砂金が混じっていて、その沢は「金洗いの沢」と呼ばれるようになり、金沢の名になった――という筋書きです。この話は江戸時代の『藤五物語』などに伝わり、『石川県史』にも収められています。ただし、史料で確かめられる「金沢」の初めは、天文15年（1546）の金沢御坊の記録です。伝説は伝説として面白く、でも地名の歴史は御坊の門前町から始まる。その両方を並べて眺めるのが、この地名の正しい楽しみ方だと思います。
    sources:
    - c-cap-kanazawa-ndl
  relations:
  - pref/17
  unknowns:
  - 『天文日記』天文15年10月条の日付は資料により25日・29日の両説があり、原本での確定は未了
  - 「金洗沢」の実在した地点（小立野台地のどの沢か）の特定はできていない
  - 「尾山」から「金沢」へ戻した正確な時期と経緯は、後世の地誌類の記述に依る部分が大きい
  updated: '2026-11-13'
- id: muni/18-池田町
  code: '183822'
  names:
    ja: 池田町
    reading: いけだちょう
    aliases:
    - 上池田村
    - 下池田村
    - 池田村
    - 池田荘
  user_terms:
  - 池田町 福井
  - 池田荘があった町
  - かずら橋のある池田町
  naming_type: 一部の地名
  prefecture: 福井県
  homonyms:
  - muni/01-池田町
  - muni/20-池田町
  - muni/21-池田町
  summary: 福井県今立郡の町。町名は中世の荘園「池田荘」の名による。その名は上池田村・下池田村という村名を経て、1955年の合併で池田村、1964年の町制で池田町となった。4つの池田町のうち、岐阜県池田町と並んで荘園名に遡る層を持つ。
  first_attestation:
    era: 中世
    year_western: null
    document: 荘園名「池田荘」としての記録
    note: 池田荘に関する池田氏発給文書（寄進状・安堵状など）が残ることが福井県史に記される。具体的な初出年は今回の調査では特定できていない
  claims:
  - text: 町名は、中世にこの地にあった荘園「池田荘」の名による
    kind: fact
    level: E3
    status: established
    sources:
    - h2-kotobank-ikedacho
  - text: 今立郡池田荘では、在地領主の池田氏が星崎城を拠点とし、天文年間に朝倉氏に滅ぼされるまで、寄進状・安堵状などの文書を発給した
    kind: fact
    level: E2
    status: established
    sources:
    - h2-fukui-kenshi
  - text: 池田氏の出自については、摂津国池田荘の出身であるとも考えられているが、確定していない
    kind: fact
    level: E2
    status: contested
    sources:
    - h2-fukui-kenshi
  - text: 1955年に上池田村と下池田村が合併して池田村となり、1964年の町制施行で池田町となった
    kind: fact
    level: E3
    status: established
    sources:
    - h2-kotobank-ikedacho
  - text: 同名の比較（共通する層）：岐阜県池田町も中世の「池田荘」に遡る点で共通する。ただし越前国今立郡の池田荘と美濃国の池田荘は別の荘園であり、直接の関係はない
    kind: fact
    level: E3
    status: established
    sources:
    - h2-kotobank-ikedacho
    - h2-kotobank-ikeda
  - text: 同名の比較（異なる層）：北海道池田町の人名由来や長野県池田町の郷名の継承とは異なり、荘園名が上池田・下池田という村名を経て町名になった。読みは「いけだちょう」
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
    - h2-kotobank-ikedacho
  column:
    title: 池田氏が、池田荘にやってきた
    text: 福井県史によれば、この地を治めた池田氏は、摂津国池田荘の出身であるとも考えられているという。つまり「池田」という姓の武士が、たまたま同じ「池田」という名の荘園の領主になった可能性がある。姓と地名のどちらが先かははっきりしないが、同名の偶然が重なって、荘園の名は21世紀の町名にまで生き延びた。
    sources:
    - h2-fukui-kenshi
  relations:
  - pref/18
  - muni/01-池田町
  - muni/20-池田町
  - muni/21-池田町
  unknowns:
  - 池田荘の成立時期と初出文書は未確認
  - 上池田村・下池田村の成立時期は未確認
  updated: '2026-11-13'
- id: muni/18-福井市
  code: '182010'
  names:
    ja: 福井市
    reading: ふくいし
    aliases:
    - 福井町
    - 北ノ庄
    - 北庄
    - 福居
  user_terms:
  - 福井市の名前の由来
  - 福の井は本当か
  - 北ノ庄から福井への改名
  - 福居と福井の違い
  naming_type: 一部の地名
  prefecture: 福井県
  homonyms: []
  summary: 市名は福井藩の城下町「福井」の名を受け継いだものである。もとの地名「北ノ庄」は寛永元年（1624）の松平忠昌の代に改められたが、まず「福居」と改められ元禄頃に「福井」となったとする説が有力で、天守台の井戸「福の井」に由来するとする説は県立図書館の検証では誤りと位置づけられている。明治22年（1889）に市制が施行されて福井市となった。
  first_attestation:
    era: 寛永元年
    year_western: 1624
    document: 越前国名跡考
    note: 寛永元年7月19日の松平忠昌入城の頃より改められたとする後世の地誌の記事。改められた字が直ちに「福井」だったか「福居」だったかには対立がある（県レコードと同一の記録）
  claims:
  - text: 現在の福井市中心部は室町時代から北の庄（北ノ庄）と呼ばれ、柴田勝家の城づくりからまちづくりが始まり、結城秀康の入封後は福井藩の城下町として整備された
    kind: fact
    level: E2
    status: established
    sources:
    - c-cap-fukui-enkaku
  - text: 福井市の公式沿革は、地名について「北庄から福居となり、3代藩主忠昌のとき、福井と改められた」と略述している
    kind: fact
    level: E2
    status: established
    sources:
    - c-cap-fukui-enkaku
  - text: 改名の時期については、1624年に直ちに「福井」となったとする説明と、まず「福居」と改められ1700年頃に「福井」となったとする説が対立しており、福井県立図書館のレファレンス回答は後者を有力とする
    kind: fact
    level: E2
    status: contested
    sources:
    - c-ndl-fukui
  - text: 天守台の井戸「福の井」が福井の名の由来だとする説は広く語られるが、『福井県の地名』等に基づくレファレンス回答はこの説を誤りと位置づけている
    kind: legend
    level: E2
    status: contested
    sources:
    - c-ndl-fukui
  - text: 「福の井」自体は福井城天守台に現存する井戸であり、県が史跡の案内資料で紹介している実在の遺構である
    kind: fact
    level: E2
    status: established
    sources:
    - c-fukui-fukunoi
  - text: 明治22年（1889）に市制が施行されて福井市が発足した
    kind: fact
    level: E2
    status: established
    sources:
    - c-cap-fukui-enkaku
  - text: 総務省の全国地方公共団体コードで、福井市の団体コードは182010と定められている
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 井戸は本物、由来は別物
    text: 福井城の天守台には「福の井」と呼ばれる井戸が今も残っていて、市の公式沿革も「北庄から福居となり、忠昌のときに福井と改められた」と手短に説明します。ところが県立図書館や県文書館の検証では、忠昌が改めたのはまず「福居」で、「福井」の表記が定まるのは1700年頃とみるのが有力とされ、福の井由来説は誤りとされています。福井市の名前は、実在の井戸の分かりやすさに引っ張られてきた面があるのです。井戸は本物でも、由来の話は別――市のレコードでも県のレコードでも、この線引きは崩さずに記録しています。
    sources:
    - c-ndl-fukui
    - c-fukui-fukunoi
  relations:
  - pref/18
  unknowns:
  - 「福居」から「福井」への表記移行の正確な時期を示す同時代文書は特定できていない（県レコードと同一の未確認事項）
  - 改名の理由とされる「北の字が敗北に通じるため」という説明の同時代史料での裏付けは未了
  - 福井市の公式沿革の略述（忠昌のときに福井）と県側資料の有力説（1700年頃に福井）の間の説明の差は、市・県の公表資料の間でも解消されていない
  updated: '2026-11-13'
- id: muni/18-美浜町
  code: '184420'
  names:
    ja: 美浜町
    reading: みはまちょう
    aliases:
    - 耳村
    - 山東村
    - 南西郷村
    - 北西郷村
  user_terms:
  - 福井の美浜町の由来
  - 美浜町はなぜ美浜という名前か
  - 原発のある美浜町
  naming_type: 合併新設
  prefecture: 福井県
  homonyms:
  - muni/23-美浜町
  - muni/30-美浜町
  summary: 昭和29年（1954）に若狭湾に面した4村の合併で生まれた新設町。町名の説明は「各村に美しい浜があることから」とする地名資料と、「弥美の『美』と砂浜の『浜』の合成」とする説に分かれており、命名理由は確定していない。同名の愛知県・和歌山県の美浜町とは、同時期の合併で生まれた「美しい浜」型の命名という点で響き合うが、成立事情はそれぞれ別である。
  first_attestation:
    era: 昭和29年
    year_western: 1954
    document: 美浜町の発足（町村合併・町制施行）
    note: 町名は合併時に新たに付けられたもので、それ以前に「美浜」を名乗る自治体はなかった。名前の初出は命名そのもの
  claims:
  - text: 昭和29年（1954）2月11日に旧耳村・山東村・南西郷村・北西郷村の4か村が合併し、美浜町が誕生した
    kind: fact
    level: E2
    status: established
    sources:
    - h5-fukui-mihama-70th
  - text: 町域は若狭湾に面し、白い砂浜の水晶浜や三方五湖の久々子湖を抱える海岸の町である
    kind: fact
    level: E2
    status: established
    sources:
    - h5-fukui-mihama-intro
  - text: 町名は、合併各村がいずれも若狭湾に面して美しい浜があることから名付けられたと、地名研究サイト「丹後の地名」は説明する
    kind: fact
    level: E4
    status: contested
    sources:
    - h5-fukui-mihama-tango
  - text: 一方で、町名は「弥美（みみ）の『美』と砂浜の『浜』を合成した」とする説明もあり、命名の由来は資料によって説明が分かれる
    kind: fact
    level: E5
    status: contested
    sources:
    - h5-fukui-mihama-wiki
  - text: 共通する層として、同名の愛知県美浜町（1955年成立）・和歌山県美浜町（1954年成立）も昭和の大合併期に合併で生まれた新設町であり、旧自治体名「美浜」を継承した町は3町のうち一つもない
    kind: fact
    level: E2
    status: established
    sources:
    - h5-aichi-mihama-gaiyo
    - h2-hidaka-wakayama-manabi
  - text: 異なる層として、愛知・和歌山では「美しい浜」にちなむ命名が辞典・県資料で明示されるのに対し、福井では旧地名の字の合成とする説が併存し、3町の中で命名理由の確定度が最も低い
    kind: fact
    level: E4
    status: contested
    sources:
    - h5-fukui-mihama-tango
    - h5-fukui-mihama-wiki
  - text: 総務省の全国地方公共団体コードで、美浜町の団体コードは184420と定められている
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 名前の理由は割れても、「美（うま）し美浜」と名乗り続ける町
    text: 福井の美浜町は、町名の由来の説明が資料によって分かれる珍しい町です。それでも町自身は、キャッチフレーズに「美（うま）し美浜」を掲げ、「美」の字を「美しい」と「うまい（おいしい）」の両方に読ませています。平成17年（2005）には鯖のへしこを看板にした「へしこの町」を宣言しました。由来の確定は今後の町史確認に残りますが、「美」という一文字を海の景色と食の両方に広げて使い続ける町の姿勢は、命名の不確かさを補って余りある自己紹介になっています。
    sources:
    - h5-fukui-mihama-intro
  relations:
  - pref/18
  - muni/23-美浜町
  - muni/30-美浜町
  unknowns:
  - 町名の命名理由について町の公式サイト・町勢要覧は明記しておらず、「美しい浜」説と「弥美＋砂浜」合成説のどちらが『美浜町誌』等の町史の記述かは未確認
  - 合成説の「弥美（みみ）」が何を指す地名か（合併村の一つ耳村（みみ）との関係を含む）は未確認
  - 命名が公募だったかどうかなど、1954年当時の選定過程の記録は未確認
  updated: '2026-11-13'
- id: muni/19-南部町
  code: '193666'
  names:
    ja: 南部町
    reading: なんぶちょう
    aliases:
    - 南部郷
    - 南部村
  user_terms:
  - 南部町の名前の由来
  - 南部氏発祥の地
  - 南部三郎光行の地名
  naming_type: 合併新設
  prefecture: 山梨県
  homonyms:
  - muni/02-南部町
  - muni/31-南部町
  summary: 甲斐国南部郷の地で、南部三郎光行がこの地を与えられて「南部の地名を姓とした」ことが町の説明する南部氏の始まり。現在の町は1955年に発足した旧南部町と富沢町が2003年に合併して生まれ、旧南部町の名を継いだ。青森県南部町とは発祥地と移転先の関係にあり、鳥取県南部町とは由来を共有しない。
  first_attestation:
    era: 鎌倉時代初期
    year_western: null
    document: 南部郷（甲斐国巨摩郡。光行が領して南部氏を称した地と町公式が説明する）
    note: 郷名としての文書上の初出年は未確認。明治初年の町村再編では、旧南部町の区域を構成した11村の中に南部村があったことが町の概要に見える
  claims:
  - text: 町の観光サイトは、本町が南部氏発祥の地であり、加賀美遠光の三男・南部三郎光行がこの地を領して「南部の地名を姓とした」ことに始まると説明する。町の総合計画も、南部氏の名称の由来は光行がこの地を与えられて南部氏と称したことに始まると記す
    kind: fact
    level: E2
    status: established
    sources:
    - h3-yamanashi-yukari
    - h3-yamanashi-plan
  - text: 町の概要は、源頼朝に従い戦功のあった光行が南部を与えられてこの地を領し、その後奥州に移って糠部五郡を与えられ南部藩を築いたと記す
    kind: fact
    level: E2
    status: established
    sources:
    - h3-yamanashi-gaiyou
  - text: 昭和30年（1955年）に南部町と富沢町が誕生し、平成15年（2003年）3月1日に両町が合併して新「南部町」が発足した。現在の町名は旧南部町の名の継承である
    kind: fact
    level: E2
    status: established
    sources:
    - h3-yamanashi-gaiyou
  - text: 青森県南部町とは同じ南部氏を介する共通の層を持つが、こちらは姓の由来となった地そのものであり、青森側は一族の移転先である点で異なる
    kind: fact
    level: E2
    status: established
    sources:
    - h3-yamanashi-yukari
    - h3-yamanashi-gaiyou
  - text: 鳥取県南部町の「南部」は南部氏と関係のない地域名の採用であり、本町の「南部」とは由来を共有しない
    kind: fact
    level: E2
    status: established
    sources:
    - h3-tottori-gikai
  - text: 総務省「地方公共団体コード一覧」では本町のコードは193666とされる
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 姓になった地名
    text: 地名がそのまま大名の姓になった例は少なくありませんが、南部町の場合、その姓が後に奥州の大藩の名となり、発祥地と移転先の両方に同じ「南部町」が残りました。町は「南部氏発祥の地」を掲げ、光行ゆかりの地を観光資源として紹介しています。
    sources:
    - h3-yamanashi-yukari
    - h3-yamanashi-gaiyou
  relations:
  - pref/19
  - muni/02-南部町
  - muni/31-南部町
  unknowns:
  - 南部郷の文書上の初出
  - 光行が南部を与えられた正確な年
  - 2003年の合併時に旧町名「南部」を新町名とした選定理由の公式文
  updated: '2026-11-13'
- id: muni/19-甲府市
  code: '192015'
  names:
    ja: 甲府市
    reading: こうふし
    aliases:
    - 甲府町
    - 甲斐府中
  user_terms:
  - 甲府市の名前の由来
  - 甲府はなぜ甲府というのか
  - 甲斐府中の略とは
  - 武田信虎と甲府の関係
  naming_type: 一部の地名
  prefecture: 山梨県
  homonyms: []
  summary: 市名は城下町「甲府」の名を受け継いだもので、甲府市公式は「甲府とは『甲斐の府中』の略」と説明する。永正16年（1519）に武田信虎が躑躅ヶ崎に居館を移して城下町をつくったときに名付けたといわれ、名称が広く定着したのは近世になってからとされる。明治22年（1889）に市制が施行された。
  first_attestation:
    era: 永正16年
    year_western: 1519
    document: 躑躅ヶ崎の城下町建設に伴う命名（甲府市公式解説）
    note: 市公式は1519年の信虎の城下町建設時に名付けたと伝えるが、「甲府」表記の同時代の初出文書は特定できていない。名称の定着は近世以降と市公式も述べる
  claims:
  - text: 甲府市公式は「甲府とは『甲斐の府中』の略です」と説明している
    kind: fact
    level: E2
    status: established
    sources:
    - c-cap-kofu-city
  - text: 府中とは国の政治・経済・文化の中心地を意味する言葉であり、「甲府」の名は甲斐国の中心地という位置づけを負っている
    kind: fact
    level: E2
    status: established
    sources:
    - c-cap-kofu-city
  - text: 永正16年（1519）、武田信虎が躑躅ヶ崎（現在の武田神社境内）に居館を移し城下町をつくったときに「甲府」と名付けたといわれている
    kind: fact
    level: E2
    status: established
    sources:
    - c-cap-kofu-city
  - text: 「甲府」という名称が定着したのは近世になってからのようだと、市公式も留保している
    kind: fact
    level: E2
    status: established
    sources:
    - c-cap-kofu-city
  - text: 市制は明治22年（1889）7月1日に施行され、当時の人口は3万1,128人だった。市役所の開庁は10月になってからだった
    kind: fact
    level: E2
    status: established
    sources:
    - c-cap-kofu-city
  - text: 現在の市制施行記念日は施行日（7月1日）ではなく、開庁や当時の祝祭日にちなんで10月17日とされている
    kind: fact
    level: E2
    status: established
    sources:
    - c-cap-kofu-city
  - text: 総務省の全国地方公共団体コードで、甲府市の団体コードは192015と定められている
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 市の誕生日が2回ある
    text: 甲府市の市制施行記念日は10月17日です。ところが実際に市制が施行されたのは、明治22年（1889）7月1日でした。事務手続きや諸機関の整備のため市役所の開庁が10月にずれ込んだうえ、7月は農繁期で人出も見込めず、10月17日は当時の祝祭日「神嘗祭」にあたる吉日でもあったため、この日が記念日になったのだと市は説明します。初の市制祭は3日間にわたって盛大に行われたそうです。「市の誕生日」が施行日と記念日でずれているのは、制度と実際の暮らしの時間のずれが記念日に刻まれた例と言えます。
    sources:
    - c-cap-kofu-city
  relations:
  - pref/19
  unknowns:
  - 「甲府」表記の同時代（戦国期）の初出文書は特定できておらず、1519年の命名は市の伝承的な説明にとどまる
  - 律令期の甲斐国府は現在の甲府市ではなく笛吹市付近に比定されており、「甲斐の府中」という名が指す中心地は時代とともに移動している。この位置のずれの検証は本バッチでは未了
  - 武田信玄自身が「甲府」の名を用いた同時代史料の有無は未確認
  updated: '2026-11-13'
- id: muni/20-南牧村
  code: '203050'
  names:
    ja: 南牧村
    reading: みなみまきむら
    aliases: []
  user_terms:
  - みなみまきむら
  - 南牧村 長野 読み方
  - 野辺山の村
  naming_type: 合併新設
  prefecture: 長野県
  homonyms:
  - muni/10-南牧村
  summary: 明治22年（1889年）に海尻・海ノ口・広瀬・平沢と大明村の一部（板橋）が合併して発足した村。千曲川上流・八ヶ岳東麓の高原の村で、野辺山原の秣場や馬市場に象徴される馬と放牧の歴史を持つ。群馬県の南牧村とは漢字が同じでも読みが異なり、こちらは「みなみまき」と読む。1889年の命名理由そのものを記した資料は確認できていない。
  first_attestation:
    era: 明治22年
    year_western: 1889
    document: 町村制施行による南牧村の発足（1889年4月1日）
    note: 自治体名としての初出。村公式の年表には1886年の馬市場の開設を「南牧村に馬市場ができる」と記す箇所があり、「南牧」の名が発足前から地域を指して使われた可能性もあるが、確定はできない
  claims:
  - text: 明治22年（1889年）4月1日、海尻村・海ノ口村・広瀬村・平沢村の区域と大明村の区域のうち板橋の区域をもって南牧村が発足した
    kind: fact
    level: E2
    status: established
    sources:
    - h6-minamimaki-official-history
    - h6-minamimaki-wiki
  - text: 村公式の歴史は、大明村を「馬産・蕎麦・炭焼き・木材搬出等を収入源とする山間の集落」と紹介し、明治19年（1886年）には南牧村に馬市場ができたとする年表を載せる
    kind: fact
    level: E2
    status: established
    sources:
    - h6-minamimaki-official-history
  - text: 日本歴史地名大系によれば、野辺山原は江戸時代を通じて板橋・平沢（現南牧村）や川上村の樋沢など諸村の入会林野で、大部分が秣場（馬の飼料を採る草地）として利用されていた
    kind: fact
    level: E3
    status: established
    sources:
    - h6-nanmoku-kotobank
  - text: 読みは「みなみまき」で、県境の向こうにある群馬県甘楽郡の南牧村の読み「なんもく」とは異なる（異なる層）。共通するのは「南牧」という漢字表記だけで、成立年も経緯も別である
    kind: fact
    level: E2
    status: established
    sources:
    - h6-minamimaki-official-history
    - h6-nanmoku-gunma-pref
  - text: 「牧」の字は、秣場や馬市場に象徴される当地の放牧・馬産の歴史と響き合うが、1889年の合併時に「南牧」と命名した理由そのものを記した資料は確認できておらず、村名と放牧の直接の因果は未確定である
    kind: fact
    level: E3
    status: indeterminate
    sources:
    - h6-minamimaki-official-history
    - h6-nanmoku-kotobank
  column:
    title: 馬の村だった「みなみまき」
    text: 南牧村の公式の歴史をたどると、馬の話が繰り返し出てきます。大明村は馬産を収入源とし、明治19年には馬市場が開かれ、明治中期にはアメリカから乳牛や優良な種馬を輸入して牧場経営が試みられたこともありました（これは失敗に終わったそうです）。野辺山原は長く諸村の秣場でした。「牧」という字が村名に入っているのは、偶然とは思えない土地の記憶です。ただし、それがそのまま命名理由だと断言できる資料はまだ見つかっていません。
    sources:
    - h6-minamimaki-official-history
    - h6-nanmoku-kotobank
  relations:
  - pref/20
  - muni/10-南牧村
  unknowns:
  - 明治22年の合併時に「南牧」と命名した理由の一次記録は未確認
  - 「南牧」の地名としての初出（1886年の馬市場の記事より前に遡れるか）は未確認
  updated: '2026-11-13'
- id: muni/20-川上村
  code: '203041'
  names:
    ja: 川上村
    reading: かわかみむら
    aliases:
    - 川上郷
  user_terms:
  - 川上村 千曲川の源流
  - 御所平の村
  - レタスの村
  naming_type: 合併新設
  prefecture: 長野県
  homonyms:
  - muni/29-川上村
  summary: 千曲川の最上流部に位置する村。地域名としては戦国期の文書に「川上郷」が見え、明治22年（1889年）に八つの旧村の区域をもって川上村が発足した。村名は最上流部という立地と旧郷名の継承で説明される。奈良県の川上村とは「大河の最上流部」という命名の構造だけが共通し、川も歴史も無関係である。大字「御所平」には保元の乱にまつわる皇子の伝承が残る。
  first_attestation:
    era: 天正2年
    year_western: 1574
    document: 大井文書
    note: 日本歴史地名大系が紹介する「川上郷」の用例（郷名としての初出）。村名そのものの成立は1889年
  claims:
  - text: 日本歴史地名大系によれば、天正2年（1574年）の大井文書に「平賀之事」とある十二郷の中に「川上郷」の名が見える
    kind: fact
    level: E3
    status: established
    sources:
    - h6-kawakami-kotobank
  - text: 村は千曲川の最上流部に位置し、村域は梓山・秋山・居倉・川端下・原・大深山・御所平・樋沢の旧八か村からなる
    kind: fact
    level: E3
    status: established
    sources:
    - h6-kawakami-kotobank
  - text: 明治22年（1889年）4月1日、居倉村・原村・御所平村・大深山村・秋山村・梓山村・川端下村の区域と大明村の区域のうち樋沢の区域をもって川上村が発足した
    kind: fact
    level: E5
    status: established
    sources:
    - h6-kawakami-nagano-wiki
  - text: 村名「川上」は、千曲川の最上流部にあたる立地と、戦国期以来の地域名「川上郷」の継承によって説明される
    kind: fact
    level: E3
    status: inferred
    sources:
    - h6-kawakami-kotobank
    - h6-kawakami-nagano-yoran
  - text: 奈良県の川上村も「川の上流部」の名という点は共通するが、対象の川は吉野川であり、戦国期の「川上郷」のような旧郷名の用例は奈良側では確認していない（共通する層＝命名の構造、異なる層＝川と地域史）
    kind: fact
    level: E3
    status: established
    sources:
    - h6-kawakami-kotobank
  - text: 保元の乱（1156年）で敗れた崇徳上皇の皇子・重仁親王が、信濃の村上基国を頼って川上村の御所平・御殿窪に安住したという伝承があり、大字「御所平」の名はその名残と語られる。作家の佐藤春夫は『佐久の内裏』で、この伝承と「佐久川上村御所平要図」という史料を取り上げた
    kind: legend
    level: E4
    status: established
    sources:
    - h6-kawakami-shigehito-legend
    - h6-kawakami-nagano-wiki
  column:
    title: 御所平に眠る皇子の伝説
    text: 川上村の大字に「御所平」という、いかにも皇族ゆかりの名があります。伝承では、保元の乱で敗れた崇徳上皇の皇子・重仁親王が、信濃の武士・村上基国を頼って千曲川を遡り、この御所平の御殿窪に住んだとされます。再起を図りながら若くして病に倒れたとも語られ、近くの南相木村には御陵山の名まで残ります。昭和には佐藤春夫が小説『佐久の内裏』にこの伝承を書きました。史実として確認できる話ではありませんが、「川の最上流の村」に皇子の落人伝説が根づいたこと自体が、この土地の記憶の形です。
    sources:
    - h6-kawakami-shigehito-legend
  relations:
  - pref/20
  - muni/29-川上村
  unknowns:
  - 「川上郷」の範囲と現在の村域がどの程度一致するかは未確認
  - 重仁親王伝承について、村公式資料（村史・村勢要覧）がどう扱っているかは未確認
  updated: '2026-11-13'
- id: muni/20-松本市
  code: '202029'
  names:
    ja: 松本市
    reading: まつもとし
    aliases:
    - 深志
    - 府中
    - 松本町
  user_terms:
  - 松本市の名前の由来
  - 深志から松本への改称
  - 松本城の名前の由来
  naming_type: その他（城の改称に由来する名の継承）
  prefecture: 長野県
  homonyms: []
  summary: 市名は城下町「松本」の継承で、その松本は天正10年（1582）に小笠原貞慶が深志城を松本城と改めたことに始まると松本市は説明する。この地は古くは深志と呼ばれ、国府が置かれてからは府中とも呼ばれた。貞慶がなぜ「松本」の名を選んだのかは同時代の記録では確認できていない。明治40年（1907）に市制を施行した。
  first_attestation:
    era: 天正10年
    year_western: 1582
    document: 小笠原貞慶による深志城の松本城への改称（松本市公式「松本城の歴史」）
    note: 「松本」の公称としての初出は1582年の城の改称。これ以前に地名としての用例があったかは確認できていない
  claims:
  - text: 松本の地は古くは深志と呼ばれ、平安時代初期に上田から国府が移されてからは府中とも呼ばれていた
    kind: fact
    level: E2
    status: established
    sources:
    - k3-matsumoto-shiseki
  - text: 深志城は永正元年（1504）に小笠原氏の一族・島立貞永により平城として構築され、天文19年（1550）以降は武田氏の信濃支配の拠点となった
    kind: fact
    level: E2
    status: established
    sources:
    - k3-matsumoto-shiseki
  - text: 天正10年（1582年）、武田氏の滅亡後に小笠原貞慶が深志城を回復して名を松本城と改め、これ以降、松本の地名が用いられるようになった
    kind: fact
    level: E2
    status: established
    sources:
    - k3-matsumoto-fuchi
    - k3-matsumoto-castle
  - text: 貞慶が「松本」という名を選んだ理由について、松本市公式の資料は説明しておらず、「松本」の語源は確定していない
    kind: fact
    level: E2
    status: indeterminate
    sources:
    - k3-matsumoto-castle
    - k3-matsumoto-shiseki
  - text: 明治40年（1907）5月1日に市制を施行して松本市が誕生した
    kind: fact
    level: E2
    status: established
    sources:
    - k3-matsumoto-fuchi
  - text: 平成17年（2005）と平成22年（2010）の合併を経て、現在の松本市の市域となった
    kind: fact
    level: E2
    status: established
    sources:
    - k3-matsumoto-fuchi
  - text: 総務省の全国地方公共団体コードで、松本市の団体コードは202029と定められている
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 名前を付けた人は、天守を見ていない
    text: 1582年に城を「松本」と名付けた小笠原貞慶は、父の代に武田氏に追われた旧領を取り返したばかりでした。深志という旧名を捨てて新しい名を掲げることは、支配の再出発の宣言でもあったはずです。ところが貞慶は1590年に移封され、いま私たちが見ている国宝の天守を実際に築いたのは、次の城主・石川康長の代（1593年から）です。名前を付けた人は天守を見ず、天守を建てた人は名前を変えなかった。その後400年以上、「松本」の名だけが城とまちの顔として残りました。
    sources:
    - k3-matsumoto-castle
    - k3-matsumoto-fuchi
  relations:
  - pref/20
  unknowns:
  - 貞慶が「松本」の名を選んだ理由を示す同時代史料は確認できていない
  - 1582年の改称以前に「松本」という地名の用例があったかは未確認
  - 「深志」の語源については本バッチでは確認できていない
  updated: '2026-11-13'
- id: muni/20-池田町
  code: '204811'
  names:
    ja: 池田町
    reading: いけだまち
    aliases:
    - 池田町村
    - 池田郷
  user_terms:
  - 池田町 長野
  - いけだまち
  - 北安曇郡の池田町
  - ハーブの町 池田
  naming_type: 一部の地名
  prefecture: 長野県
  homonyms:
  - muni/01-池田町
  - muni/18-池田町
  - muni/21-池田町
  summary: 長野県北安曇郡の町。中世の池田郷の名を継承し、『親元日記』寛正6年（1465）の記事に「矢原庄池田郷」と見えるのが確認できる早い記録である。江戸時代は松本藩の池田組に属し、明治8年（1875）に池田町村、大正4年（1915）に町制施行で池田町となった。4つの池田町のうち唯一「いけだまち」と読む。
  first_attestation:
    era: 寛正6年
    year_western: 1465
    document: 『親元日記』寛正6年5月18日条（「矢原庄池田郷」）
    note: 日本歴史地名大系が紹介する形で確認した二次確認であり、原典は未読
  claims:
  - text: 池田郷は『親元日記』寛正6年（1465）5月18日の記事に「矢原庄池田郷」と見え、中世の郷名として確認できる
    kind: fact
    level: E3
    status: established
    sources:
    - h2-kotobank-ikedamachi
  - text: 江戸時代を通じて松本藩領の池田組に属し、明治8年（1875）に池田町村となった
    kind: fact
    level: E3
    status: established
    sources:
    - h2-kotobank-ikedamachi
  - text: 大正4年（1915）に町制を施行して池田町となり、昭和30年（1955）に会染村と合併して現在の池田町となった
    kind: fact
    level: E2
    status: established
    sources:
    - h2-ikeda-nagano-gaiyo
  - text: 原初の池田の集落は、東南の「馬の口」と呼ばれる場所の近くにあったと伝えられる
    kind: legend
    level: E3
    status: indeterminate
    sources:
    - h2-kotobank-ikedamachi
  - text: 「池田」という名の語源については、確認した公式・専門資料の範囲では説明が見当たらず、確定できない
    kind: fact
    level: E3
    status: indeterminate
    sources:
    - h2-kotobank-ikedamachi
    - h2-ikeda-nagano-gaiyo
  - text: 同名の比較（異なる層）：中世の郷名の継承であり、荘園名に遡る福井県・岐阜県の池田町、人名に由来する北海道池田町とは成り立ちが異なる
    kind: fact
    level: E3
    status: established
    sources:
    - h2-kotobank-ikedamachi
  - text: 同名の比較（異なる層）：読みは「いけだまち」で、他の3つの池田町（すべて「いけだちょう」）と異なる、4件中で唯一の「まち」読みである
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 1465年の日記に残る、郷の名のままの町
    text: 池田郷の名は、室町時代の日記『親元日記』の1465年の記事にすでにある。荘園の名でも人名でもなく、在地の小さな郷の名が、村・町と姿を変えながら550年以上そのまま使われ続けてきた。しかも全国4つの池田町の中で、ここだけが「ちょう」ではなく「まち」と読む。古い地名ほど静かに残る、という好例である。
    sources:
    - h2-kotobank-ikedamachi
    - b-cap-chiba-soumu-code
  relations:
  - pref/20
  - muni/01-池田町
  - muni/18-池田町
  - muni/21-池田町
  unknowns:
  - 「池田」の語源（池と田の地形名に由来するか等）は、確認した資料の範囲では説明がなく未確認
  - 池田郷の成立時期（1465年より前の記録）は未確認
  updated: '2026-11-13'
- id: muni/20-軽井沢町
  code: '203211'
  names:
    ja: 軽井沢町
    reading: かるいざわまち
    aliases:
    - 軽井沢宿
    - 東長倉村
    - かるいさわ
  user_terms:
  - 軽井沢の名前の由来
  - 軽井沢のアイヌ語説は本当か
  - かるいさわ と かるいざわ の違い
  - 軽井沢の語源の諸説
  naming_type: 一部の地名
  prefecture: 長野県
  homonyms: []
  summary: 町名は碓氷峠のふもとの集落・宿場の名「軽井沢」の継承である。古くは「かるいさわ」と読まれ、明治以降に避暑地として知られるようになると「かるいざわ」に変化したとされる。語源は今日でもはっきりしておらず、渇れた沢とする説、柳田国男の「背負う」説、アイヌ語説など諸説が対立したままで、専門の論文も定説なしと評価している。大正時代に東長倉村が町制を施行して軽井沢町となった。
  first_attestation:
    era: 応永2年
    year_western: 1395
    document: 真楽寺金剛力士像の墨書銘（『信濃史料』第7巻収録）
    note: 北佐久郡軽井沢の文献上の初出として地名研究の江良武の論文が紹介するもの。「軽井沢」の名の成立は中世とみるのが妥当と論文は論じる
  claims:
  - text: 軽井沢は古くは「かるいさわ」と呼ばれ、明治以降に避暑地として広まり外国人の往来が盛んになると、発音しやすい「かるいざわ」へ変化していったといわれている
    kind: fact
    level: E4
    status: established
    sources:
    - k3-karuizawa-kanko
  - text: この地名がいつ何から起こったのかは今日でもはっきりしていないと軽井沢観光協会は述べ、「凍り冷わ（こおりさわ）」から転じたという説、「軽石沢」から来たという説、水が枯れた「かれ沢」から来たという説などを挙げている
    kind: fact
    level: E4
    status: contested
    sources:
    - k3-karuizawa-kanko
  - text: 地名研究者の江良武は、北佐久郡軽井沢の文献上の初出として応永2年（1395）の真楽寺金剛力士像後頭部の墨書銘に旦那名として見える例を挙げ、軽井沢地名の成立は中世とみてよいと論じている
    kind: fact
    level: E3
    status: established
    sources:
    - k3-karuizawa-era
  - text: 「karuはアイヌ語で軽石、iは大いなる、sawaは沢であるから『軽石の大沢』の意である」とするアイヌ語説が辞典類に紹介されているが、江良は、こうした音の類似性という直感に基づく諸説は論理に乏しいと評している
    kind: fact
    level: E3
    status: contested
    sources:
    - k3-karuizawa-era
  - text: 柳田国男は、峠では荷物を馬からおろして自分で背負って登らねばならず、中古時代に背負うことを「かるう」といったことから「かるう沢」が「かるい沢」に転じたとする説を唱えた。この説は論議の中心となって批判も受け、今日では水の枯れた沢に由来する渇沢説が有力になっているように思われると江良は述べる
    kind: fact
    level: E3
    status: contested
    sources:
    - k3-karuizawa-era
    - k3-karuizawa-kanko
  - text: 江戸時代には五街道の一つである中山道に軽井沢宿が設置され、宿場として栄えた
    kind: fact
    level: E4
    status: established
    sources:
    - k3-karuizawa-kanko
  - text: 大正時代に東長倉村が町制を施行し、軽井沢町と改称して現在に至っている
    kind: fact
    level: E4
    status: established
    sources:
    - k3-karuizawa-kanko
  - text: 総務省の全国地方公共団体コードで、軽井沢町の団体コードは203211と定められている
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 荷物を背負って越えた峠のふもと
    text: 碓氷峠は中山道最大の難所で、馬の背に荷を載せたままでは越えられず、ふもとで荷をおろし、人が背負って登ったといいます。柳田国男はここに目をつけ、背負うことを意味した古い言葉「かるう」から「かるう沢」、やがて「軽井沢」になったと考えました。地名研究の江良武はこの説への批判を整理したうえで、軽井沢型の地名の多くが街道沿いの居住地名であることは、命名が農業ではなく交通に関係したことを暗示すると指摘しています。語源の決着はついていませんが、「峠の交通が生んだ名前」という見立て自体は、軽井沢が宿場として育った歴史とよく響き合います。
    sources:
    - k3-karuizawa-era
    - k3-karuizawa-kanko
  relations:
  - pref/20
  unknowns:
  - 語源は諸説が対立したままで、専門の論文も「どれも特に有力な説とはいえない」水準の評価にとどまる
  - 1395年より前の用例の有無は確認できていない
  - 東長倉村が町制を施行して軽井沢町となった正確な年月日は、本バッチで確認した観光協会の資料では年次まで示されていない
  - アイヌ語説を最初に唱えた文献とその根拠の詳細は、論文の要約的な紹介の範囲を超えて確認できていない
  updated: '2026-11-13'
- id: muni/20-長野市
  code: '202011'
  names:
    ja: 長野市
    reading: ながのし
    aliases:
    - 長野町
    - 長野村
    - 善光寺町
  user_terms:
  - 長野市の名前の由来
  - 長野市はなぜ長野というのか
  - 善光寺と長野市の関係
  - 長野市の市制が遅かった理由
  naming_type: 一部の地名
  prefecture: 長野県
  homonyms: []
  summary: 市名は善光寺の門前町を含む長野村・長野町の名を受け継いだものである。「長野」は扇状地の長い緩やかな傾斜地を指す地形由来の地名と説明される。明治4年（1871）に県庁が長野村へ移って村名が県名になり、市制の施行は明治30年（1897）と県庁所在地としては遅めだった。
  first_attestation:
    era: 慶長6年
    year_western: 1601
    document: 善光寺文書（大久保長安等連署証文）
    note: 慶長6年9月16日付の証文に「信州水内郡之内長野」とある。1570年の武田信玄書状に初出を求める説もあるが字句の読みが定まらないため、確実な用例としてこちらを採った（県レコードと同一の記録）
  claims:
  - text: 慶長6年（1601）9月16日の大久保長安等連署証文（善光寺文書）に「信州水内郡之内長野」とあり、善光寺領の確定に関わる文書の中で「長野」が確認できる
    kind: fact
    level: E2
    status: established
    sources:
    - c-jstage-nagano
  - text: 元亀元年（1570）の武田信玄の書状に長野の初出を見る説もあるが、その字句は「艮野」とも読まれ、1601年初出説と併存している
    kind: fact
    level: E3
    status: contested
    sources:
    - c-jstage-nagano
  - text: 「長野」は、善光寺平に裾花川などがつくった扇状地のような、長く緩やかな傾斜地を指す地形由来の地名と説明される
    kind: fact
    level: E2
    status: established
    sources:
    - c-suzaka-city
  - text: 江戸時代、現・長野市中心部は地籍上は水内郡長野村であり、その町場の部分が善光寺の門前町として善光寺町と呼ばれた
    kind: fact
    level: E2
    status: established
    sources:
    - c-ndl-nagano
  - text: 明治4年（1871）6月、中野県の県庁が長野村の西方寺へ移され、県名が長野県と改称されたため、村名「長野」がそのまま県名になった
    kind: fact
    level: E2
    status: established
    sources:
    - c-nagano-shishi
  - text: 明治30年（1897）4月1日、長野町が市制を施行して長野市が誕生した。県庁所在地になってから市になるまでに26年を要している
    kind: fact
    level: E2
    status: established
    sources:
    - c-nagano-shishi
    - c-cap-nagano-uub
  - text: 総務省の全国地方公共団体コードで、長野市の団体コードは202011と定められている
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 一つのまちに、二つの名前
    text: 江戸時代のいまの長野市中心部には、二つの名前が重なっていました。地籍のうえでは水内郡「長野村」、しかし実際に人々が暮らし参詣客でにぎわう町場は、善光寺の門前町として「善光寺町」と呼ばれていたのです。明治4年（1871）に県庁の引っ越し先になったのは長野村で、県の名前は「長野県」になりました。一方、まちの知名度でいえば善光寺の方が圧倒的でした。村の名前が県名になり、門前町のにぎわいがそのまま都市の土台になる――長野市は、その二つの名前の重なりから生まれた県庁所在地です。
    sources:
    - c-ndl-nagano
    - c-nagano-shishi
  relations:
  - pref/20
  unknowns:
  - 1570年の武田信玄書状の該当字句（長野か艮野か）の確定には原本の画像確認が必要で未了（県レコードと同一の未確認事項）
  - 長野村から長野町が成立した年次（町制の経緯）については本バッチでは市公式資料まで確認できていない
  - 「長野＝長い傾斜地」とする地形語源説の言語学的な検証水準は、専門地名辞典まで確認できていない
  updated: '2026-11-13'
- id: muni/20-高山村
  code: '205435'
  names:
    ja: 高山村
    reading: たかやまむら
    aliases: []
  user_terms:
  - 高山村 長野 合成地名
  - 高井と山田の村
  - 一茶ゆかりの里
  naming_type: 合併新設
  prefecture: 長野県
  homonyms:
  - muni/10-高山村
  summary: 昭和31年（1956年）に高井村と山田村が合併して生まれた村で、村名は高井の「高」と山田の「山」を合わせた合成地名とされる。群馬県の高山村も合成地名だが材料は尻高・中山で、字面の一致は偶然である。村内には御牧に由来するとされる「牧」「駒場」の地名も残る。
  first_attestation:
    era: 昭和31年
    year_western: 1956
    document: 高井村・山田村の合併による高山村の発足（1956年9月30日）
    note: 自治体名としての初出（合併時の合成地名）
  claims:
  - text: 昭和31年（1956年）9月30日、高井村と山田村が合併して高山村が発足した
    kind: fact
    level: E5
    status: established
    sources:
    - h6-takayama-nagano-wiki
  - text: 合成地名の一覧資料では、長野県上高井郡高山村は「高井村＋山田村」の合成地名とされる。すなわち高井の「高」と山田の「山」を合わせた名である
    kind: fact
    level: E5
    status: established
    sources:
    - h6-takayama-gosei-list
  - text: 群馬県の高山村も合成地名という点は共通するが、材料は尻高村と中山村であり、「高山」という結果の字面だけが偶然一致する（共通する層＝命名方式、異なる層＝元の村名と成立年）
    kind: fact
    level: E5
    status: established
    sources:
    - h6-takayama-gosei-list
    - h6-takayama-gosei-kitagawa
  - text: 合併前の高井村は明治22年に高井村・牧村の区域をもって発足し、山田村は中山村・奥山田村の区域をもって発足した村で、旧村名は現在の大字（高井・牧など）に残る
    kind: fact
    level: E5
    status: established
    sources:
    - h6-takayama-nagano-wiki
  - text: 村内には「牧」「駒場」の地名があり、奈良時代末に皇室の馬を飼育する御牧が各地に置かれたことと関係するとされる
    kind: fact
    level: E5
    status: established
    sources:
    - h6-takayama-nagano-wiki
  column:
    title: 同じレシピ、違う材料
    text: 高井村の「高」と山田村の「山」。群馬県高山村の尻高＋中山とまったく同じ作り方で、まったく同じ「高山村」ができました。面白いのは、この村の旧村域にはもう一つ「牧村」という村があり、いまも大字「牧」が残っていることです。御牧（皇室の馬の放牧地）に由来するとされる地名で、県境の向こうの二つの「南牧村」とも、馬と牧をめぐる地名の集まりとして眺めると一続きの風景に見えてきます。
    sources:
    - h6-takayama-nagano-wiki
    - h6-takayama-gosei-list
  relations:
  - pref/20
  - muni/10-高山村
  unknowns:
  - 昭和31年の合併時の命名経緯を記した村公式資料は未確認（合成地名の説明は一覧資料とWikipediaによる）
  - 「高井」「山田」という旧村名自体の語源は今回未調査
  updated: '2026-11-13'
