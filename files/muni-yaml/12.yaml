  - 神崎
  - 発酵の里
  - 下総神崎
  - なんじゃもんじゃの木
  naming_type: 中心地名の継承
  naming_note: 神崎神社の鎮座地の名「神崎」の継承
  formation: 合併新設
  prefecture: 千葉県
  homonyms: []
  summary: 利根川南岸の、千葉県で最も人口の少ない町の一つで、「発酵の里」として知られる。町名は利根川をのぞむ台地に鎮座する神崎神社に由来すると専門辞典が明記する地名で、中世には神崎庄・神崎郷と呼ばれ、神崎津は川港として栄えた。1889年に神崎村が成立して翌年に町制を施行し、1955年の合併でも「神崎町」の名が保たれた。
  first_attestation:
    era: 天正19年
    year_western: 1591
    document: 徳川家康朱印状（神崎神社文書）
    note: 『日本歴史地名大系』が紹介する記載で「香取郡神崎郷」と見える。原文未確認のため、主張側では紹介として扱う
  claims:
  - text: 『日本歴史地名大系』は、神崎大橋の東方に「町名の由来となる神崎神社が鎮座している」と記し、町名が神崎神社に由来することを示す
    kind: fact
    level: E3
    status: established
    sources:
    - w12-kozaki-kotobank-taikei
  - text: 神崎の地は中世の神崎庄の遺称地で、天正19年（1591年）11月の徳川家康朱印状（神崎神社文書）に「香取郡神崎郷」と見えることが『日本歴史地名大系』に紹介されている
    kind: fact
    level: E3
    status: established
    sources:
    - w12-kozaki-kotobank-taikei-mura
  - text: 中世以来の神崎津・神崎関は、江戸時代にも利根川の河岸場（川港）として役割を果たした
    kind: fact
    level: E3
    status: established
    sources:
    - w12-kozaki-kotobank-taikei-mura
  - text: 神崎神社は、今から約1300年前の白鳳時代に、現在の茨城県側の大沼浦二ツ塚からこの地に遷座したものと町は伝え、祭神は天鳥船命である
    kind: fact
    level: E2
    status: established
    sources:
    - w12-kozaki-town-kanko
  - text: 神崎神社の境内にある大樟は「なんじゃもんじゃの木」と呼ばれ、水戸光圀が「この木は何というもんじゃろうか」と自問自答したことから付いた名だと伝えられる
    kind: legend
    level: E2
    status: established
    sources:
    - w12-kozaki-town-kanko
  - text: 明治22年（1889年）4月、神崎本宿・神崎神宿など7か村が合併して神崎村が、武田など8か村が合併して米沢村が発足し、神崎村は翌明治23年（1890年）3月に町制を施行して神崎町となった
    kind: fact
    level: E2
    status: established
    sources:
    - w12-kozaki-town-profile
  - text: 昭和30年（1955年）4月19日、神崎町と米沢村が合併して神崎米沢町が発足したが、同日付で神崎町に改称された
    kind: fact
    level: E2
    status: established
    sources:
    - upg-r5-kozaki-chiba-gaiyo
  - text: 神崎町の地方公共団体コードは123421である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 発酵の里と、川を見下ろす神の森
    text: 神崎の名の中心にある神崎神社は、利根川をのぞむ小高い森「神崎森」に鎮座する。江戸時代、この森は川を行く船人たちの目印で、「ここはこうざき森の下、舵をよくとれ船頭どのよ」と唄われたという。川港・神崎河岸の繁栄は、酒・味噌・醤油を育てる発酵文化の土台にもなった。江戸時代から盛んだった発酵食品づくりは今も町の看板で、道の駅の名は「発酵の里こうざき」。神社の森と発酵の蔵の両方が、川の恵みの上に成り立っている。
    sources:
    - w12-kozaki-town-kanko
    - w12-kozaki-jal
  relations:
  - pref/12
  - muni/12-東庄町
  unknowns:
  - 神崎神社そのものの社名の由来（「神の崎」とする地形由来説など）を、神社・町公式が明示した資料は確認できなかった
  - 1591年以前の「神崎」の用例（『将門記』の「神前の津」を神崎に比定する見解があるが、「神崎」表記そのものの初出は未確認）
  - 神崎米沢町から即日改称した理由や経緯は未確認（合体と同日の名称変更という事実自体は千葉県「市町村の概要」で確認できる）
  updated: '2026-11-13'
- id: muni/12-習志野市
  code: '122165'
  names:
    ja: 習志野市
    reading: ならしのし
    aliases:
    - 津田沼町
    - 津田沼村
  user_terms:
  - 習志野ってどういう意味
  - ならしのの由来
  - 習志野演習場のまち
  - 津田沼から習志野になった理由
  naming_type: 旧国名・広域地名の採用
  naming_note: 明治天皇の命名による広域地名「習志野原」にちなむ
  formation: 改称
  prefecture: 千葉県
  homonyms: []
  summary: 市名は、明治6年（1873年）に明治天皇が陸軍大演習の地（大和田原）を「習志野原」と命名したことに由来する広域地名「習志野」を採用したもの。1954年8月1日、千葉郡津田沼町が市制施行と同時に習志野市と改称して発足した。なお命名の地である習志野原の中心は現在の船橋市域にあり、市名の由来地は市域の外にある。
  first_attestation:
    era: 明治6年
    year_western: 1873
    document: 明治天皇による「習志野原」の命名（習志野市公式資料）
    note: 命名そのものの初出。同年5月17日の太政官達でこの一帯が習志野原となったことが紹介される
  claims:
  - text: 習志野市公式によれば、「習志野」の名称は陸軍大演習の際に明治天皇が命名されたものである
    kind: fact
    level: E2
    status: established
    sources:
    - m5-narashino-city-yurai
  - text: 明治6年（1873年）、現在の習志野市・船橋市・八千代市にまたがる小金牧の一部が陸軍の演習場となり、明治天皇が「習志野原」と命名した（習志野市公式）
    kind: fact
    level: E2
    status: established
    sources:
    - m5-narashino-city-rekishi
  - text: 市公式は命名の由来の一説として、大演習で全体指揮をとった篠原国幹陸軍少将の活躍を称えた「篠原を見習うように」とのお言葉から「見習篠原」が転じて「習志野原」になったという説を紹介する
    kind: fact
    level: E2
    status: contested
    sources:
    - m5-narashino-city-yurai
  - text: 一方、市公式の郷土解説は篠原説には問題もあることを指摘し、命名の由来には諸説あるとしている
    kind: fact
    level: E2
    status: contested
    sources:
    - m5-narashino-city-sansaku98
  - text: 新市名「習志野市」は、1953年（昭和28年）11月から開かれた津田沼町・幕張町・犢橋村の合併協議会が、合併によって成立する市の名として決定した（習志野市公式）。その後、最終的には津田沼町が単独で市制施行しこの名を採用した
    kind: fact
    level: E2
    status: established
    sources:
    - upg-ae5-narashino-sansaku73
    - m5-narashino-city-yurai
  - text: 1954年（昭和29年）8月1日、千葉郡津田沼町は千葉県下で16番目、全国で415番目の市として習志野市として発足した（習志野市公式。地方公共団体コードは122165）
    kind: fact
    level: E2
    status: established
    sources:
    - m5-narashino-city-yurai
    - k1-jlis-chiba
  - text: 明治天皇が「習志野之原」と命名した演習の地は現在の船橋市習志野台周辺にあり、「習志野」の地名は現在の船橋市の習志野・習志野台・西習志野に残っている。習志野原は現在の船橋市と習志野市にまたがる一帯であったが、1954年の市制施行の際、津田沼町がこの広域地名を市名に採用した
    kind: fact
    level: E2
    status: established
    sources:
    - upg-r9-funabashi-narashinohara
    - upg-r9-narashino-koho2023
    - m5-narashino-city-yurai
  - text: 前身の津田沼という名は、1889年（明治22年）の村制施行時に谷津の「津」・久々田の「田」・鷺沼の「沼」の三字を取った合成地名である（習志野市公式）
    kind: fact
    level: E2
    status: established
    sources:
    - m5-narashino-city-yurai
  column:
    title: 市の外にある「地名の原点」
    text: 習志野という名前の原点は、じつは習志野市の中にない。明治天皇が「習志野原」と名づけた演習場の中心は現在の船橋市域（習志野台周辺）で、旧津田沼町はその区域の外にあった。それでも1954年の市制施行の際、津田沼町は由緒ある広域地名を市名に迎えた。名づけの地と名を受け継いだまちがずれている、珍しい命名の例である。
    sources:
    - m5-narashino-city-rekishi
    - m5-narashino-wikipedia
  relations:
  - pref/12
  unknowns:
  - 命名の正確な経緯（「篠原に習え」説の真偽）は資料上確定していない
  - 1951年に改称があったとする一部資料の記述は市公式資料では確認できず、改称は1954年の市制施行時であることを市公式で確認した
  - 合併協議会が市名「習志野市」を決定した正確な日（1953年12月17日と伝える資料がある）は、市公式資料では確認できなかった
  updated: '2026-11-13'
- id: muni/12-船橋市
  code: '122041'
  names:
    ja: 船橋市
    reading: ふなばしし
    aliases:
    - 船橋町
    - 船橋御厨
    - 船橋宿
  user_terms:
  - 船橋市の名前の由来
  - 船橋は本当に船の橋があったのか
  - 船橋大神宮のあるまち
  naming_type: 中心地名の継承
  formation: 合併新設
  prefecture: 千葉県
  homonyms: []
  summary: 市名は中世以来の地名「船橋」を受け継いだものである。「船橋」は『吾妻鏡』文治2年（1186年）の記事に「船橋御厨」として現れる。語源については、海老川に船を並べて板を渡した橋が地名になったという説が通説とされる一方、船の停泊用の桟橋に由来するという説もあり、市の資料でも「どちらとも決めがたい」とされている。
  first_attestation:
    era: 文治2年
    year_western: 1186
    document: 『吾妻鏡』（「船橋御厨」）
    note: 船橋市デジタルミュージアム『ふるさとの地名（改訂版）』が紹介する初出。伊勢神宮領の御厨（みくりや）の名として記された。一次文献そのものは未読のため二次資料経由の記録として扱う
  claims:
  - text: 船橋市デジタルミュージアム『ふるさとの地名（改訂版）』によれば、「船橋」の名が初めて見える文献は鎌倉幕府の公式記録『吾妻鏡』で、文治2年（1186年）の記事の中に「船橋御厨（みくりや）」として記されている
    kind: fact
    level: E2
    status: established
    sources:
    - k1-funabashi-museum
  - text: 同書は語源の通説として、宮本の台地から海神方面へ渡る道が海老川を越える場所に、船を並べて上に板等を渡した橋が設けられ、それが地名になったとする説を挙げる。一方で地名辞典類には「船の停泊のために桟橋を設けた所」と説くものもあり、同書は「どちらとも決めがたいが、現時点では通説をやや優位としておく」としている
    kind: fact
    level: E2
    status: contested
    sources:
    - k1-funabashi-museum
  - text: 船橋市西図書館の郷土資料は由来伝説として、景行天皇が東国を巡って当地に着いた帰路、大勢の行列を渡すために夏見から対岸まで船が並び、まるで船の橋のように見えたため「船橋」の名が起こったという話を伝えている
    kind: legend
    level: E2
    status: established
    sources:
    - k1-funabashi-lib
  - text: 江戸時代の船橋は五日市村・九日市村・海神村に分かれていたが、三村を総称して船橋村とか船橋宿とも称し、明治22年（1889年）にその地域が船橋町となった
    kind: fact
    level: E2
    status: established
    sources:
    - k1-funabashi-museum
  - text: 昭和12年（1937年）、船橋町が葛飾町・八栄村・塚田村・法典村と合併して船橋市が誕生した
    kind: fact
    level: E2
    status: established
    sources:
    - k1-funabashi-museum
    - k1-funabashi-natsumi
  - text: 総務省の全国地方公共団体コードで、船橋市のコードは122041と定められている（J-LISの千葉県内市町村一覧による）
    kind: fact
    level: E2
    status: established
    sources:
    - k1-jlis-chiba
  column:
    title: 御厨（みくりや）という名の船橋
    text: 文治2年（1186年）の『吾妻鏡』に現れる「船橋御厨」とは、伊勢神宮に年貢を納める荘園「御厨」のことである。船橋は中世、伊勢神宮領として知られた土地で、その中心にあったのが意富比神社（船橋大神宮）だとされる。隣の夏見にも「夏見御厨」があり、夏見の西夏見日枝神社の大鳥居には今も伊勢神宮の方角を向いた「わらへび」が毎年奉納されているという。船橋の名が文献に初めて現れた時、それは橋の名である前に、神宮に属する土地の名だった。
    sources:
    - k1-funabashi-museum
    - k1-funabashi-natsumi
  relations:
  - pref/12
  unknowns:
  - 語源は「船を並べた橋」説（通説）と「桟橋」説が併存し、市の資料でも確定していない
  - 『吾妻鏡』文治2年条の原文は未読で、市デジタルミュージアムの紹介による記録にとどまる
  - 日本武尊に結びつける由来伝説も市の図書館資料にあるが、景行天皇伝説のみを記録した
  updated: '2026-11-13'
- id: muni/12-芝山町
  code: '124095'
  names:
    ja: 芝山町
    reading: しばやままち
    aliases:
    - 千代田村
    - 二川村
    - 柴山
  user_terms:
  - しばやま
  - 芝山
  - 芝山仁王尊
  - はにわの町
  - 空港の隣の町
  naming_type: 学校名・駅名などから
  naming_note: 芝山仁王尊観音教寺と柴山藩を考慮して議会が決めた新名
  formation: 合併新設
  prefecture: 千葉県
  homonyms: []
  summary: 成田空港に接する山武郡の町で、芝山古墳群と芝山仁王尊（観音教寺）で知られる。1955年7月に二川村と千代田村が合併した際、町名は議会が「知名度と信仰的に名高い芝山仁王尊観音教寺」と、明治2年設置の柴山藩を考慮して決めたと町公式が説明する。「芝山」と「柴山」で字が違う点も記録に値する。
  first_attestation:
    era: null
    year_western: null
    document: null
    note: 「芝山」は観音教寺の別称として古くから用いられ、現在も大字名として残るが、その初出を示す文書は確認できなかった
  claims:
  - text: 昭和30年（1955年）7月、二川村と千代田村が合併し、芝山町が発足（町制施行）した
    kind: fact
    level: E2
    status: established
    sources:
    - w12-shibayama-town-history
  - text: 町公式サイトは町名の決定について「議会において知名度と信仰的に名高い芝山仁王尊観音教寺、歴史に残る明治2年に設置された柴山藩のことなどを考慮して『芝山町』と称しました」と説明している
    kind: fact
    level: E2
    status: established
    sources:
    - w12-shibayama-town-about
  - text: 考慮された藩の名は「柴山藩」で、町名に採用された「芝山」とは漢字が異なる
    kind: fact
    level: E2
    status: established
    sources:
    - w12-shibayama-town-about
  - text: 「芝山」という呼び名の由来は、町南部の天台宗寺院・観音教寺の別称「芝山仁王尊」によるとされる
    kind: fact
    level: E5
    status: established
    sources:
    - w12-shibayama-wiki
  - text: 観音教寺は天応元年（781年）に創建されたと伝える県内有数の古刹で、「芝山仁王尊」の通称で親しまれてきた
    kind: fact
    level: E2
    status: established
    sources:
    - w12-shibayama-town-furari
  - text: 町内の芝山古墳群の殿塚・姫塚は、昭和33年（1958年）に国の史跡に指定された
    kind: fact
    level: E2
    status: established
    sources:
    - w12-shibayama-town-history
  - text: 芝山町の地方公共団体コードは124095である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 「芝山」と「柴山」、一字違いの二つの由緒
    text: 1955年の合併で町名を考えた議会が念頭に置いたのは、二つの名前だった。一つは芝山仁王尊――江戸時代には成田山新勝寺と信者を二分するほど栄えた観音教寺の別称で、参詣の鉄道まで計画されたほどの知名度があった。もう一つは、明治2年（1869年）にこの地に置かれた柴山藩。ただしこちらは「柴」の字である。採用された町名は仁王尊の「芝山」の方で、藩の「柴山」は考慮の対象にはなっても字までは受け継がれなかった。成田空港の騒音に悩む現代の町の名は、信仰の拠点と、一代限りの藩の記憶とを、一字の違いとともに抱えている。
    sources:
    - w12-shibayama-town-about
    - w12-shibayama-wiki
  relations:
  - pref/12
  - muni/12-横芝光町
  unknowns:
  - 観音教寺がなぜ「芝山」と呼ばれるようになったか（寺のある山の名など）の由来は、公式資料で確認できなかった
  - 「芝山」の地名としての初出文書は未確認
  - 柴山藩の藩名「柴山」の由来も未確認
  updated: '2026-11-13'
- id: muni/12-茂原市
  code: '122106'
  names:
    ja: 茂原市
    reading: もばらし
    aliases:
    - 藻原
    - 藻原荘
    - 茂原町
  user_terms:
  - もばら
  - 茂原七夕まつりのまち
  - 天然ガスのまち
  naming_type: 中心地名の継承
  naming_note: 中心地名「藻原」の継承。表記は後に「茂原」へ改められた
  formation: 合併新設
  prefecture: 千葉県
  homonyms: []
  summary: 九十九里平野南部の商工業都市。「茂原」はもと「藻原」と書き、語源は藻が茂る湿地の原野を開拓して作られた荘園「藻原荘」とされる。表記は江戸時代に「茂原」へ変わったといわれ、旧表記の「藻原」は市内の名刹・藻原寺の名に今も残る。昭和27年（1952年）に茂原町ほか6町村の合併で市制を施行し、昭和47年（1972年）に本納町と合併して現在の市域となった。
  first_attestation:
    era: 宝亀5年
    year_western: 774
    document: 藻原荘の開拓（藤原黒麻呂による開拓とされる荘園。二次資料の紹介による）
    note: 「藻原」の文献上の確実な初出は未確認。藻原荘の開拓については、市総合計画が「平安時代に藤原黒麻呂」と記す一方、宝亀5年（774年）とする紹介もあり、年次・時代区分の表記が資料により揺れている
  claims:
  - text: 総務省の全国地方公共団体コードで、茂原市の団体コードは122106と定められている
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  - text: 茂原市の総合計画によれば、茂原市の名称は、藤原黒麻呂が藻が茂る湿地帯の原野を開拓して私有地（荘園）とした「藻原の荘」に由来している
    kind: fact
    level: E2
    status: established
    sources:
    - w5-mobara-city-plan
  - text: 『角川日本地名大辞典』の項目構成では、平安期の荘園名は「藻原荘」、戦国期の郷名は「藻原郷」とされ、江戸期〜明治14年の村名は「茂原村」と表記される。すなわち「茂原」の表記は近世から確認できるが、表記が変わった正確な時期は特定されていない
    kind: fact
    level: E3
    status: indeterminate
    sources:
    - upg-ah2-mobara-kadokawa
  - text: 茂原市公式サイトによれば、市内の藻原寺はもと妙光寺と称したが、天正19年（1591年）の徳川家康による寺領朱印状の写に「埴生郡藻原寺」とあったことから、明治時代以降「藻原寺」と改めたという
    kind: fact
    level: E2
    status: established
    sources:
    - w5-mobara-city-sougenji
  - text: 茂原市の総合計画によれば、江戸時代には茂原で「六斎市」が開かれ、商都として繁栄した
    kind: fact
    level: E2
    status: established
    sources:
    - w5-mobara-city-plan
  - text: 茂原市の総合計画によれば、昭和27年（1952年）に茂原町・東郷村・豊田村・二宮本郷村・五郷村・鶴枝村の6町村が合併して市制が施行された
    kind: fact
    level: E2
    status: established
    sources:
    - w5-mobara-city-plan
  - text: 茂原市の総合計画によれば、昭和47年（1972年）に本納町と合併して現在の市域が形成された
    kind: fact
    level: E2
    status: established
    sources:
    - w5-mobara-city-plan
  column:
    title: 「藻原」の名を残したのはお寺だった
    text: 茂原のもとの書き方は「藻原」でした。九十九里平野の低湿地に藻や葦が茂る原野――地名はその土地の姿そのものだったと、市は説明します。やがて表記は「茂原」へと改められましたが、古い「藻原」の字は思わぬところに残りました。市内の日蓮宗の名刹は、もと妙光寺と称していたのに、天正19年（1591年）の朱印状の写しに「埴生郡藻原寺」とあるのを見て、明治になって「藻原寺」と改めたというのです。地名の側が新しい字に移った後も、寺の名が古い字を守り続けたわけです。今の茂原の地図には、「茂原」の市街地と「藻原寺」の境内の間で、同じ地名の二つの時代の表記が向かい合っています。
    sources:
    - w5-mobara-city-plan
    - w5-mobara-city-sougenji
  relations:
  - pref/12
  unknowns:
  - 「藻原」の文献上の確実な初出は確認できていない。藻原荘の開拓年次についても、宝亀5年（774年）とする紹介と、市の総合計画の「平安時代」という記述とで表記が揺れている
  - 「藻原」から「茂原」への表記の変更時期は、『角川日本地名大辞典』の項目構成から近世（江戸期）には「茂原村」の表記になっていたことまでは確認できるが、変更の正確な時期・理由は未確認（同辞典の「茂原村（近世）」本文は未確認）。また「藻原」の表記が湿地の多い土地柄を表したものという説明は、同辞典では確認できなかった
  updated: '2026-11-14'
- id: muni/12-袖ケ浦市
  code: '122297'
  names:
    ja: 袖ケ浦市
    reading: そでがうらし
    aliases:
