    document: 新設合併による洋野町の発足（総務省「市町村合併資料集」にも記録）
    note: 町名としての初出は2006年1月1日の町発足時である
  claims:
  - text: 洋野町は平成18年（2006）1月1日に、沿岸部の種市町と内陸部の大野村が合併して誕生した
    kind: fact
    level: E2
    status: established
    sources:
