  - 俵山の村
  - 阿蘇の西原村
  - 白糸の滝
  naming_type: 合併新設
  prefecture: 熊本県
  homonyms: []
  summary: 阿蘇郡の村。1960年に阿蘇郡山西村と上益城郡河原村が合併して発足し、村名は山西の「西」と河原の「原」を一字ずつ取った合成名である。阿蘇外輪山の西麓、俵山のふもとに広がり、2016年の熊本地震では震度7を観測した。
  first_attestation:
    era: 昭和35年
    year_western: 1960
    document: 西原村の発足（山西村・河原村の合併）
    note: 村名としての初出。構成名の「山西」「河原」は近世以来の村名に遡る
  claims:
  - text: 大化の改新で、山西地区は阿蘇郡、河原地区は益城郡（のち上益城郡）に属するようになった
    kind: fact
    level: E2
    status: established
    sources:
    - r10-nishihara-vill
  - text: 江戸時代の手永制度では、山西地区は布田手永、河原地区は沼山津手永に属した
    kind: fact
    level: E2
    status: established
    sources:
    - r10-nishihara-vill
  - text: 1960年（昭和35年）に、山西村と河原村が合併して西原村が誕生した
    kind: fact
    level: E2
    status: established
    sources:
    - r10-nishihara-vill
  - text: 村名は、昭和の合併時、山西村の「西」と河原村の「原」を一字ずつ取って「西原村」とされたものである
    kind: fact
    level: E2
    status: established
    sources:
    - r10-nishihara-pref
  - text: 合併は1960年9月1日に行われた対等合併で、それに先立つ1956年8月1日には錦野村の一部が山西村に編入されている
    kind: fact
    level: E5
    status: established
    sources:
    - r10-nishihara-wiki
  - text: 2016年（平成28年）4月16日の熊本地震の本震では、西原村でも震度7を観測した
    kind: fact
    level: E5
    status: established
    sources:
    - r10-nishihara-wiki
  - text: 村内には俵山や、高さ18メートルと12メートルの二段滝である白糸の滝がある
    kind: fact
    level: E2
    status: established
    sources:
    - r10-nishihara-pref
  - text: 地方公共団体コードは434329である（総務省「地方公共団体コード一覧」で確認）
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 郡境を越えた、一字ずつの合併
    text: 西原村を生んだ1960年の合併は、阿蘇郡と上益城郡という、大化の改新以来の区割りをまたぐ合併だった。名前も、山西の「西」と河原の「原」を一字ずつ出し合う対等な合成。村の名前そのものが、郡境を越えた対等合併の証しになっている。
    sources:
    - r10-nishihara-vill
    - r10-nishihara-pref
  relations:
  - pref/43
  unknowns:
  - 「山西」「河原」という旧村名自体の語源は確認できなかった
  updated: '2026-11-13'
- id: muni/43-錦町
  code: '435015'
  names:
    ja: 錦町
    reading: にしきまち
    aliases: []
  user_terms:
  - 錦
  - にしき
  - 球磨の錦町
  - 錦村
  naming_type: 合併新設
  prefecture: 熊本県
  homonyms: []
  summary: 球磨郡の町で、球磨盆地の中央に位置する。1955年に西村・一武村・木上村が合併して錦村が発足し、1965年に町制を施行した。町名は3村の頭文字「ニ（西）・シ（一）・キ（木上）」を組み合わせた合成名で、「錦のような麗しい村を育てよう」という願いも込められた。
  first_attestation:
    era: 昭和30年
    year_western: 1955
    document: 錦村の発足（西村・一武村・木上村の合併）
    note: 町村名としての初出
  claims:
  - text: 1955年（昭和30年）7月1日、西村・一武村・木上村が合併して錦村が発足し、1965年（昭和40年）4月1日に町制を施行して錦町となった
    kind: fact
    level: E2
    status: established
    sources:
    - r10-nishiki-pref
  - text: 村名は昭和の合併時の3か村名を折衷したもので、西村の頭文字の「ニ」、一武村の頭文字の「一」は数字の始まりで「シ」とも読むとして「シ」、木上村の頭文字の「キ」を取って「ニシキ」（錦）とした
    kind: fact
    level: E2
    status: established
    sources:
    - r10-nishiki-pref
  - text: 「錦」という名には、3か村が相協力して錦のような麗しい村を育てようという願いも込められている
    kind: fact
    level: E2
    status: established
    sources:
    - r10-nishiki-pref
  - text: 一武という名の由来は明らかではないが、寛永年間に当地で武をもって名をなした丸目蔵人が在居していた頃から呼ばれていたものと思われると、熊本県の市町村史資料は記す
    kind: fact
    level: E2
    status: indeterminate
    sources:
    - r10-nishiki-pref
  - text: 平成の合併では、人吉市・相良村・五木村・山江村・球磨村との任意協議会に参加したが、協議はまとまらず、単独の町政を続けている
    kind: fact
    level: E2
    status: established
    sources:
    - r10-nishiki-pref
  - text: 地方公共団体コードは435015である（総務省「地方公共団体コード一覧」で確認）
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: ニ・シ・キで「錦」——読みの工夫が生んだ合成名
    text: 3村の頭文字を素直に並べれば「ニイキ」になってしまう。そこで一武の「一」を、数字の始まりであることから「シ」と読む工夫をして「ニシキ」に仕立て、美しい織物の名に結びつけた。頭文字合成はありふれた手法だが、読みをひねって実在の美しい言葉に着地させる職人技が、錦の名には光っている。
    sources:
    - r10-nishiki-pref
  relations:
  - pref/43
  unknowns:
  - 「西」「木上」という旧村名自体の語源は確認できなかった
  - 丸目蔵人の実在と「一武」の名の関係は、伝承の域を出ない
  updated: '2026-11-13'
- id: muni/43-長洲町
  code: '433683'
  names:
    ja: 長洲町
    reading: ながすまち
    aliases:
    - 長渚
    - 長須
  user_terms:
  - 長洲
  - ながす
  - 金魚の町
  - 的ばかいの町
  - 有明海の町
  naming_type: 一部の地名
  prefecture: 熊本県
  homonyms: []
  summary: 玉名郡の町で、有明海に面する。旧長洲町地域は古くから長渚・千鳥ケ浜と呼ばれ、江戸時代初期には長須村、中期からは長洲町と記された。1957年の合併でも、この中心地の名が新町名となった。景行天皇の妃・御刀媛にまつわる「泣洲の浜」の伝説が伝わる。
  first_attestation:
    era: 江戸時代初期
    year_western: null
    document: 荒尾手永惣庄屋・関氏の手鑑の「長須村」
    note: 熊本県の市町村史資料が紹介する記録。それ以前から「長渚」と呼ばれていたとされるが、その文書名は未確認
  claims:
  - text: 合併前の旧長洲町地域は、古くから長渚、泣洲の浜、千鳥ケ浜などと呼ばれていた
    kind: fact
    level: E2
    status: established
    sources:
    - r10-nagasu-pref
  - text: 景行天皇の西征の際、妃の御刀媛が天皇のあとを慕って豊後の国から来たが、すでに天皇は出発した後で、逢えなかった悲しみから涙を流して入水したため、「泣洲の浜」となったという伝説が伝わる
    kind: legend
    level: E2
    status: established
    sources:
    - r10-nagasu-pref
  - text: 一方で、長い渚で千鳥が鳴いている浜であるため、その自然の様子から「長渚」「千鳥ケ浜」の名が自然に発生したともいわれる
    kind: fact
    level: E2
    status: established
    sources:
    - r10-nagasu-pref
  - text: 江戸時代初期にはすでに「長須村」と記されていたことが、荒尾手永惣庄屋・関氏の手鑑の記録に見える
    kind: fact
    level: E2
    status: established
    sources:
    - r10-nagasu-pref
  - text: 江戸時代中期からは「長洲町」と記されるようになった
    kind: fact
    level: E2
    status: established
    sources:
    - r10-nagasu-pref
  - text: 1957年（昭和32年）10月の3町村合併の際も、地理的・経済的に中心であるこの地方の名称が、新町名とされた
    kind: fact
    level: E2
    status: established
    sources:
    - r10-nagasu-pref
  - text: 町内の四王子神社には、約850年の歴史と伝統を誇る祭り「的ばかい（破魔弓祭）」がある
    kind: fact
    level: E2
    status: established
    sources:
    - r10-nagasu-pref
  - text: 町内には「金魚と鯉の郷広場」があり、県の金魚すくい選手権大会が開かれている
    kind: fact
    level: E2
    status: established
    sources:
    - r10-nagasu-pref
  - text: 地方公共団体コードは433683である（総務省「地方公共団体コード一覧」で確認）
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 泣洲の浜——妃の涙が残した地名
    text: 「泣洲の浜」の名には、景行天皇を追ってきた妃・御刀媛が逢えずに入水したという伝説がある。もちろん伝説だが、その一方で「長い渚に千鳥が鳴く浜だから長渚」という写実的な由来も同じ資料に並んでいる。長渚から長須へ、長洲へと字を変えながら千年近く続いてきた名は、伝説と風景の両方を載せて今に届いている。
    sources:
    - r10-nagasu-pref
  relations:
  - pref/43
  unknowns:
  - 「長渚」の名の文書上の初出は確認できなかった
  - 1957年の合併の相手町村の名は、熊本県の市町村史資料の当該箇所では確認できなかった
  updated: '2026-11-13'
- id: muni/43-阿蘇市
  code: '432148'
  names:
    ja: 阿蘇市
    reading: あそし
    aliases:
    - 阿蘇町
    - 一の宮町
    - 波野村
    - 阿蘇郡
  user_terms:
  - あそ
  - カルデラのまち
  - 阿蘇神社の一の宮
  - 内牧温泉のある市
  naming_type: 合併新設
  prefecture: 熊本県
  homonyms: []
  summary: 阿蘇カルデラの北部、阿蘇谷を中心とする市。平成17年（2005年）2月11日、阿蘇郡の一の宮町・阿蘇町・波野村が対等合併して発足した。市名の基層「阿蘇」は、阿蘇山とその一帯を指す古代以来の地名で、国造の国「阿蘇国」の名として古い記録に見えると紹介される。阿蘇を開拓した神・健磐龍命を祀る阿蘇神社は肥後国一の宮で、旧一の宮町の町名の由来にもなっている。「阿蘇」の語源そのものは確定していない。
  first_attestation:
    era: null
    year_western: null
    document: null
    note: 「阿蘇」の確かな初出は今回確認できなかった。Wikipedia「阿蘇市」は『日本書紀』に国造の国「阿蘇国」として記されると紹介するが、原典での直接確認は未了のため、断定は避ける
  claims:
  - text: 阿蘇市の地方公共団体コードは432148である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  - text: 平成17年（2005年）2月11日、旧阿蘇郡一の宮町・阿蘇町・波野村が合併（対等合併）して阿蘇市が誕生した
    kind: fact
    level: E2
    status: established
    sources:
    - s1-aso-city-record
  - text: 合併した旧阿蘇町は昭和29年（1954年）に内牧町と山田・尾ヶ石・黒川・永水の4村が合併して成立した町で、新市名「阿蘇」はこの町名と阿蘇郡・阿蘇山の名を引き継ぐものである
    kind: fact
    level: E5
    status: established
    sources:
    - s1-aso-uub
  - text: 「阿蘇」の名は古代に遡り、国造の治める国「阿蘇国」の名として『日本書紀』に記されると、Wikipedia「阿蘇市」が紹介している
    kind: fact
    level: E5
    status: established
    sources:
    - s1-aso-wiki-city
  - text: 阿蘇神社は、神武天皇の孫神で阿蘇を開拓した健磐龍命をはじめ家族神12神を祀る古社で、肥後国一の宮として崇敬を集め、全国に約500ある阿蘇神社の総本社である。宮司職は阿蘇氏が世襲してきた
    kind: fact
    level: E2
    status: established
    sources:
    - s1-aso-jinja
  - text: 旧一の宮町の「一の宮」という地名は、阿蘇神社が肥後国一の宮であったことに由来し、神社の鎮座する中心集落はもともと「宮地」と呼ばれていた
    kind: fact
    level: E4
    status: established
    sources:
    - s1-aso-pedia
  - text: 阿蘇の開拓神話では、健磐龍命がカルデラに満ちていた湖の壁を蹴破って水を流そうとしたところ、大鯰が横たわって水をせき止めたため、これを退治して水を流し、土地を拓いたと語られる（蹴破り神話）
    kind: legend
    level: E3
    status: established
    sources:
    - s1-aso-myth-paper
  column:
    title: 湖を蹴破る神話と、カルデラの底の市
    text: 阿蘇谷は、かつてカルデラ湖の底だった。地質学の知見では、阿蘇のカルデラには実際に巨大な湖（カルデラ湖）が存在し、立野の溶岩が崩れて水が流出したと考えられている。阿蘇の開拓神・健磐龍命が湖の壁を蹴破って水を流し、せき止める大鯰を退治して田を開いたという神話は、この地形の記憶を物語の形で伝えたものとも読める。現在の阿蘇市は、その「干上がった湖」の底に広がる農地と、肥後国一の宮・阿蘇神社の門前町を中心に成り立っている。神話の検証はできないが、火山と水と人の暮らしの関係が一つの名前に折り重なっている。
    sources:
    - s1-aso-myth-paper
    - s1-aso-jinja
  relations:
  - pref/43
  - muni/43-菊池市
  - muni/43-山鹿市
  unknowns:
  - 「阿蘇」の語源（火山灰に因むとする説など）は確定しておらず、今回の調査では出典のある裏付けが得られなかった
  - 『日本書紀』に「阿蘇国」が見えるという紹介の原典確認（該当巻・条の特定）は未了
  - 平成の合併協議会における新市名の公募・選定過程の詳細（候補名や得票）は確認できなかった
  updated: '2026-11-13'
- id: muni/43-高森町
  code: '434281'
  names:
    ja: 高森町
    reading: たかもりまち
    aliases:
    - 高森手永
    - 色見村
    - 草部村
    - 野尻村
  user_terms:
  - 熊本の高森町の由来
  - 阿蘇の高森町 なぜ高森か
  - 高森殿の杉のある町
  naming_type: 一部の地名
  prefecture: 熊本県
  homonyms:
  - muni/20-高森町
  summary: 阿蘇郡の町。地名「高森」は江戸時代に細川藩の行政区画「高森手永」が置かれた古い地名で、1889年の町村制ですでに高森町が存在した。昭和30年（1955）の合併でも旧高森町の名がそのまま継承されており、合併新名ではなく既存地名の存続である。語源については「高貴なる阿蘇大神が一時、宮居を定めた森」に由来するという伝承が『日本大百科全書』に紹介されており、伝説として分離して記録する。同名の長野県高森町は1957年に本高森山から採った新名で、成り立ちが逆である。
  first_attestation:
    era: 明治22年
    year_western: 1889
    document: 町村制施行による高森町の発足
    note: 自治体としての初出は1889年だが、地名「高森」は江戸時代の行政区画「高森手永」に遡り、町村制以前から使われていた
  claims:
  - text: 江戸時代、町域は肥後細川藩の南郷郡代の管下にあり、高森手永と野尻手永に分かれて支配されていた
    kind: fact
    level: E2
    status: established
    sources:
    - h5-takamori-kumamoto-enkaku
  - text: 明治22年（1889）の町村制施行により、高森町・色見村・草部村・野尻村の1町3村になった
    kind: fact
    level: E2
    status: established
    sources:
    - h5-takamori-kumamoto-enkaku
  - text: 昭和30年（1955）4月に旧高森町・色見村・草部村が合併して新しい高森町が誕生し、昭和32年（1957）8月には野尻村が編入された
    kind: fact
    level: E2
    status: established
    sources:
    - h5-takamori-kumamoto-kaso
  - text: 町名の由来について、当地方の伝承として「高貴なる阿蘇大神が一時、宮居を定めた森」に由来すると伝えられている
    kind: legend
    level: E3
    status: established
    sources:
    - h5-takamori-kotobank
  - text: 町内では、戦国時代に高森一帯を治めた高森城主・高森伊予守惟居を指す「高森殿」の名が残り、「高森殿の杉」が観光地となっている
    kind: fact
    level: E4
    status: established
    sources:
    - h5-takamori-kanko-sugi
  - text: 異なる層として、同名の長野県高森町は1957年に両村を結ぶ本高森山から新たに名付けられた合併新名であるのに対し、熊本の高森は江戸期以来の地名で、合併では旧高森町の名がそのまま継承された
    kind: fact
    level: E2
    status: established
    sources:
    - h5-takamori-nagano-handbook
  - text: 共通する層として、両町とも「森」を含む名が山地の地形と結びついた町であり、昭和の大合併期に現在の町として発足した点は共通する
    kind: fact
    level: E2
    status: established
    sources:
    - h5-takamori-kumamoto-kaso
    - h5-takamori-nagano-handbook
  - text: 熊本県の地方公共団体コード一覧で、高森町の団体コードは434281とされている
    kind: fact
    level: E2
    status: established
    sources:
    - h5-kumamoto-codes
  column:
    title: 神の森と、「高森殿」の杉
    text: 熊本の高森には、地名をめぐる物語が二つ重なっています。一つは『日本大百科全書』が伝える「高貴なる阿蘇大神が一時、宮居を定めた森」という伝承で、「高森」を神の森として語る層です。もう一つは歴史の層で、戦国時代に高森城を拠点に一帯を治めた高森伊予守惟居は「高森殿」と呼ばれ、その名を残す「高森殿の杉」が今も観光地になっています。神話の森と戦国の殿様。古い地名には、こうして何層もの物語が積み重なります。
    sources:
    - h5-takamori-kotobank
    - h5-takamori-kanko-sugi
  relations:
  - pref/43
  - muni/20-高森町
  unknowns:
  - 「高森」の語源を確定する中世の文書（高森郷・高森村などの記載）の確認は未了であり、伝承以外の定説は本調査で確認できなかった
  - 高森手永の設置年など、江戸時代初期の行政区画としての「高森」の詳細は未確認
  updated: '2026-11-13'
