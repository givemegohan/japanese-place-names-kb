  summary: 市名「鳥羽」は、鳥羽港を擁する中心地・鳥羽の名を受け継ぐ。その語源は、古くこの港が「泊浦（とまりうら）」と呼ばれたことにあり、「泊」が訛って「とば」となり「鳥羽」の字が当てられたと言われるが、確実な根拠に乏しいとする指摘もある。近世は鳥羽藩の城下町として栄え、昭和29年（1954年）に鳥羽町ほか4村の合併で鳥羽市が発足した。
  first_attestation:
    era: ''
    year_western: null
    document: ''
    note: 「鳥羽」の文献上の初出は特定できなかった。中世の「泊浦」が語源と考えられているが、その初出文書も未確認
  claims:
  - text: 鳥羽の語源は、古くこの港が「泊浦（とまりうら）」と呼ばれたことにあると考えられ、泊浦が訛って「とば」となり「鳥羽」の字が当てられたと言われている。ただし、後代の資料が「泊」に「とば」のルビを振る根拠は乏しく、「とまり」と読むのが正しいとする指摘もある
    kind: fact
    level: E5
    status: contested
    sources:
    - r1-toba-wiki
  - text: 中世、伊勢神宮の警護のため都から下向していた橘氏の一族が泊浦を支配し、泊衆（鳥羽衆）と呼ばれた
    kind: fact
    level: E5
    status: established
    sources:
    - r1-toba-wiki
  - text: 近世には鳥羽藩の城下町が形成され、鳥羽港は江戸と上方を結ぶ廻船が熊野灘・遠州灘の難所を越える前後に風待ちで寄港する港として栄えた
    kind: fact
    level: E5
    status: established
    sources:
    - r1-toba-wiki
  - text: 明治4年（1871年）の廃藩置県で鳥羽県が置かれたが、同年のうちに廃されて度会県に合併されたことを、鳥羽市の公式観光年表は記している
    kind: fact
    level: E2
    status: established
    sources:
    - r1-toba-kanko-nenpyo
  - text: 昭和29年（1954年）11月、鳥羽市が市制を施行した。中心の鳥羽町に周辺の村々が合併して発足した市で、市名は鳥羽町の名を継いだ
    kind: fact
    level: E2
    status: established
    sources:
    - r1-toba-city-enkaku
    - r1-toba-wiki
  - text: 鳥羽市の地方公共団体コードは242110である
    kind: fact
    level: E2
    status: established
    sources:
    - k4-ise-jlis
  column:
    title: 船が「泊まる」浦から、鳥の羽へ
    text: 鳥羽の港は、熊野灘と遠州灘という二つの難所のあいだにある天然の良港で、江戸時代には廻船が風を待って停泊した。古くは「泊浦（とまりうら）」と呼ばれたこの港の名が、やがて「とば」と訛り、「鳥羽」という字が当てられた——これが鳥羽の名の由来とされる話である。確かな証拠は乏しいとも言われるが、「船の泊まる場所」という意味は、この港町にはよく似合う。今では真珠と水族館の町として知られる鳥羽は、名の底にも海の暮らしをたたえている。
    sources:
    - r1-toba-wiki
  relations:
  - pref/24
  - muni/24-志摩市
  - muni/24-伊勢市
  unknowns:
  - 「泊浦」語源説は Wikipedia の紹介に拠っており、角川日本地名大辞典・日本歴史地名大系の本文での直接確認はできなかった
  - 「鳥羽」の文献上の初出は未確認
  - 1954年の合併の構成村（加茂村・長岡村・鏡浦村・桃取村）の裏付けを市公式の沿革本文では確認できなかった（市制施行の年月は市公式で確認済み）
