  prefecture: 岩手県
  homonyms: []
  summary: 和賀郡に属する唯一の町で、平成17年（2005）11月1日に湯田町と沢内村が合併して誕生した。両町村の区域は、明治12年（1879）に和賀郡が東西に分割された際の西和賀郡におおむね重なり、「西和賀」は和賀郡の西部を表す名であると同時に、かつて実在した郡の名前の復活でもある。和賀郡そのものは古代の奥六郡の一つに数えられる古い郡名である。
