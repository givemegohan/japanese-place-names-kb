  naming_type: 旧行政区画名の継承
  formation: 単独発足
  prefecture: 沖縄県
  homonyms: []
  summary: 沖縄本島最北端の村で、村名は琉球王国の行政区画「国頭間切」に由来する。「国頭」はもともと島の北の頭部にあたる当地の地名で、「国の上」という意味と説明される。1896年の郡制施行で恩納・金武以北を束ねる国頭郡の名となり、さらに沖縄島北部全体を指す地域名にもなった。地元の方音は「クンジャン」。
  first_attestation:
    era: 明代
    year_western: null
    document: 『明史』などの古文書
    note: 『世界大百科事典』は、中国の『明史』などの古文書に「くにかみ」とあるのが文献上の初見で、『おもろさうし』では「かみ」と呼ばれたとする。具体的な年次を特定できないため year_western は null とした（二次資料経由の確認）
  claims:
  - text: 国頭村の地方公共団体コードは473014である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  - text: 村名は琉球王国の行政区画である国頭間切に由来し、1908年4月1日の島嶼町村制施行により間切がそのまま国頭村となった
    kind: fact
    level: E3
    status: established
    sources:
    - s6-kunigami-vill-plan
    - upg-t6-kunigami-geoshape
    - s6-kunigami-kotobank-hou
  - text: 「国頭」はもともと沖縄島最北端の当地の地名であったが、1896年の勅令による郡制施行で、恩納村・金武村から北方の地域をまとめる国頭郡の名となったことが『世界大百科事典』で紹介されている
    kind: fact
    level: E3
    status: established
    sources:
    - s6-kunigami-kotobank-sekai
  - text: 「国頭」の名は、沖縄島の頭部（国の上）にあたることに由来すると『日本大百科全書』『世界大百科事典』が説明している
    kind: fact
    level: E3
    status: established
    sources:
    - s6-kunigami-kotobank-sekai
  - text: 文献上の初見は中国の『明史』などの古文書に見える「くにかみ」で、『おもろさうし』では「かみ」と呼ばれていたことが『世界大百科事典』で紹介されている
    kind: fact
    level: E3
    status: established
    sources:
    - s6-kunigami-kotobank-sekai
  - text: 近世の国頭は、1660年に代官が置かれた国頭方の九間切の一つである国頭間切として管轄され、方音では「くんぢゃん」と呼ばれたことが『日本歴史地名大系』で紹介されている
    kind: fact
    level: E3
    status: established
    sources:
    - s6-kunigami-kotobank-hou
  - text: 1945年9月1日に国頭村・大宜味村・東村の三村が統合して辺土名市が誕生したが、1946年1月に再び三村へ分離した
    kind: fact
    level: E2
    status: established
    sources:
    - s6-kunigami-vill-plan
  - text: 2021年7月、村域を含む沖縄島北部が「奄美大島、徳之島、沖縄島北部及び西表島」として世界自然遺産に登録された
    kind: fact
    level: E2
    status: established
    sources:
    - s6-kunigami-vill-plan
  column:
    title: 「クニカミ」が「クンヂャン」になるまで
    text: 国頭の地元での呼び名は「クンジャン」で、公称の「くにがみ」とはかなり響きが違う。中国語のようにも聞こえるが、『沖縄県国頭郡志』によると、これは外来の音ではない。クニカミ→クニガミ→クンギャミ→クンヂャミ→クンヂャン→クンチャンと、島の言葉の中で音が少しずつ姿を変えてきた結果だという。「国の上」という意味を持つ名が、方音のなかで転訛しながら今も村の人々に使われ続けている。『おもろさうし』の時代には単に「かみ」とも呼ばれていたというから、この地名は呼び名の層を幾重にも重ねてきたことになる。
    sources:
    - s6-kunigami-kotobank-sekai
  relations:
  - pref/47
  - muni/47-大宜味村
  - muni/47-東村
  unknowns:
  - 「国の上（頭部）」という語義以外の語源説については、確認した専門辞典の範囲では検討できなかった
  - 『明史』等の「くにかみ」の具体的な用例箇所は二次資料経由でしか確認できていない
  - 『国頭村史』（1967年）など村史の直接確認は未了である
  updated: '2026-11-13'
- id: muni/47-多良間村
  code: '473758'
  names:
    ja: 多良間村
    reading: たらまそん
    aliases:
    - 脱羅麻
    - 達喇麻
    - 達喇奇麻
    - 多羅満
  user_terms:
  - たらま
  - 多良間島
  - タラマ
  naming_type: 島名の継承
  naming_note: 島名の継承。由来は未詳
  formation: 分村・分立
  prefecture: 沖縄県
  homonyms: []
  summary: 宮古島と石垣島のほぼ中間に浮かぶ多良間島と水納島の2島からなる村で、村名は主島の島名そのままである。「たらま」の名は古く、文明11年（1479年）の朝鮮『李朝実録』に「脱羅麻島」と現れるのが史書への初出とされるが、語そのものの語源は確定していない。近世の多良間は宮古の三間切のいずれにも属さない特別行政区で、明治41年（1908年）には平良村の字となり、大正2年（1913年）2月14日に分村して多良間村が誕生した。
  first_attestation:
    era: 文明11年
    year_western: 1479
    document: 『李朝実録』成宗10年五月辛未条
    note: 『日本歴史地名大系』が「脱羅麻島」とあると紹介するもので、原文は未読のため紹介形で記録する。済州島民の漂着記事に伴う記録とされ、多良間村公式年表も「朝鮮の李朝実録に多良間島はじめて史書にあらわれる」とする
  claims:
  - text: 多良間村の地方公共団体コードは473758である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  - text: 大正2年（1913年）2月14日、仲筋・塩川・水納の3字が平良村から分離して多良間村が誕生した
    kind: fact
    level: E3
    status: established
    sources:
    - s11-kotobank-tarama-taikei
    - s11-tarama-official-nenpyo
  - text: 明治41年（1908年）の沖縄県及島嶼町村制の施行により、仲筋・塩川・水納の三村はそれぞれ字となり、平良村に属した
    kind: fact
    level: E3
    status: established
    sources:
    - s11-kotobank-tarama-taikei
  - text: 近世の多良間は宮古の平良・下地・砂川の三間切のいずれにも属さない特別行政区であったとされる一方で、『宮古史伝』には下地間切に属したともあり、多良間村公式年表は両方の記述を併記している
    kind: fact
    level: E3
    status: contested
    sources:
    - s11-kotobank-tarama-taikei
    - s11-tarama-official-nenpyo
  - text: 『日本歴史地名大系』によれば、『李朝実録』成宗10年（1479年）五月辛未条に「脱羅麻島」とあり、これが「たらま」の名の史書における古い用例である
    kind: fact
    level: E3
    status: established
    sources:
    - s11-kotobank-taramajima-taikei
  - text: 『中山伝信録』では「達喇奇麻」、『中山世譜』では「達喇麻（俗叫多良間）」、『寰瀛水路誌』では「多羅満島」と記されるなど、漢字表記は揺れながら「たらま」の音が伝えられてきた
    kind: fact
    level: E3
    status: established
    sources:
    - s11-kotobank-taramajima-taikei
  - text: 「たらま」という名称は古くから使われていたと思われるが、その起源ははっきりしないと地質調査所の随筆が述べ、専門辞典にも語源を確定する記述は見当たらない
    kind: fact
    level: E4
    status: indeterminate
    sources:
    - s11-gsj-tarama
  - text: 15世紀末に多良間島を統一したとされる土原豊見親春源の伝説が島に濃密に伝わり、島の口承伝承の中心をなしている
    kind: legend
    level: E2
    status: established
    sources:
    - s11-cinii-nutabaru
  column:
    title: 漢字が旅をしても、音は変わらなかった
    text: 多良間の名は、史書のなかで何度も姿を変えてきた。文明11年（1479年）の朝鮮『李朝実録』では「脱羅麻」、中国で編まれた『中山伝信録』では「達喇奇麻」、『中山世譜』では「達喇麻」、『寰瀛水路誌』では「多羅満」。字面はそれぞれ違うが、指しているのは同じ「たらま」の音である。現在の「多良間」の字に落ち着いたのは比較的新しい時代になってからで、島の人びとの口のなかでは音のほうが一貫して受け継がれてきた。村をなすもう一つの島、水納も、『中山世譜』に「面那（俗叫水納）」とある。こちらも、音が先にあって、字は後からついた地名である。
    sources:
    - s11-kotobank-taramajima-taikei
    - s11-kotobank-minna-taikei
  relations:
  - pref/47
  - muni/47-宮古島市
  unknowns:
  - 「たらま」の語源（何を意味する語だったか）は、専門資料でも確定した説を確認できなかった
  - 現在の「多良間」という漢字表記が公的に定着した時期は特定できなかった
  - 1479年の『李朝実録』の記事原文は未読で、日本歴史地名大系経由の紹介にとどまる
  updated: '2026-11-13'
- id: muni/47-大宜味村
  code: '473022'
  names:
    ja: 大宜味村
    reading: おおぎみそん
    aliases:
    - 田港間切
    - 大宜味間切
  user_terms:
  - おおぎみ
