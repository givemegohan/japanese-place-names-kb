prefecture_code: '20'
records:
- id: muni/20-上松町
  code: '204226'
  names:
    ja: 上松町
    reading: あげまつまち
    aliases:
    - 駒ヶ根村
    - 上松村
    - 上松宿
  user_terms:
  - あげまつ
  - 寝覚の床の町
  - 赤沢自然休養林の町
  - 森林浴発祥の地
  naming_type: 一部の地名（合併村の中心集落であった旧上松村の名。前身の駒ヶ根村が1922年の町制施行時に改称して継承）
  prefecture: 長野県
  homonyms: []
  summary: 木曽川中流の町で、中山道の上松宿と木曽材の集積地として栄えた。前身は小川村・上松村・荻原村が合併した駒ヶ根村で、大正11年（1922年）の町制施行の際に、中心集落の旧名を取って上松町と改称した。「上松」という旧村名自体の語源は定かでない。読みは「あげまつまち」で、「ちょう」とは読まない。
  first_attestation:
    era: 大正11年
    year_western: 1922
    document: 駒ヶ根村の町制施行に伴う改称
    note: 町名としての初出。旧村名「上松」の初出・語源は未確認
  claims:
  - text: 寛文4年（1664年）、尾張藩の林政改革後に木曽材木奉行所が上松に置かれ、上松材木役所・上松御陣屋とも呼ばれた
    kind: fact
    level: E5
    status: established
    sources:
    - v10-agematsu-wiki
  - text: 中山道の上松宿は、木曽ヒノキの集積地として栄えた宿場町であった
    kind: fact
    level: E2
    status: established
    sources:
    - v10-agematsu-chusho
  - text: 明治4年（1871年）の廃藩置県の際、上松村と荻原村が合併して筑摩県駒ヶ根村と命名されたが、明治14年（1881年）に上松村・小川村・荻原村の3村に分離した
    kind: fact
    level: E2
    status: established
    sources:
    - v10-agematsu-chusho
  - text: 明治22年（1889年）に3村が再び合併して駒ヶ根村となり、大正11年（1922年）9月1日に町制を施行して上松町と改称した
    kind: fact
    level: E2
    status: established
    sources:
    - v10-agematsu-chusho
    - v10-agematsu-wiki
  - text: 寝覚の床一帯には、竜宮から戻った浦島太郎がこの地で釣りをして暮らしたという伝説が残り、町の公認キャラクター「上松太郎」のモデルにもなっている
    kind: legend
    level: E5
    status: established
    sources:
    - v10-agematsu-wiki
  - text: 赤沢自然休養林は、昭和44年（1969年）に自然休養林の第1号として開放され、のちに「森林浴発祥の地」とされるようになった
    kind: fact
    level: E2
    status: established
    sources:
    - v10-agematsu-chusho
  - text: 昭和25年（1950年）5月13日の大火で、町の約7割にあたる約600戸が焼失した
    kind: fact
    level: E5
    status: established
    sources:
    - v10-agematsu-wiki
  - text: 上松町の地方公共団体コードは204226で、総務省の一覧では読みは「アゲマツマチ」とされる
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 二度生まれて消えた「駒ヶ根」という名
    text: 上松町の前身である駒ヶ根村は、1871年に一度生まれ、1881年に解体され、1889年に復活し、1922年の改称で消えた。「駒ヶ根」が町の東にそびえる木曽駒ヶ岳にちなむ名であることは想像に難くないが、命名理由を明記した資料は本調査では見つからなかった。最終的に残った「上松」は、材木役所と宿場のある中心集落の名である。山の名に一度は席を譲りながら、町制という節目に舞い戻ったところに、この町の名の履歴の面白さがある。
    sources:
    - v10-agematsu-chusho
    - v10-agematsu-wiki
  relations:
  - pref/20
  unknowns:
  - 「上松」という旧村名の語源（松の木や地形にちなむかなど）は、公式・専門資料で確認できなかった
  - 「駒ヶ根村」の命名理由を記した当時の記録は確認できなかった
  updated: '2026-11-13'
- id: muni/20-上田市
  code: '202037'
  names:
    ja: 上田市
    reading: うえだし
    aliases:
    - 上田町
  user_terms:
  - 上田市の名前の由来
  - 上田はなぜ上田というのか
  - 真田昌幸の上田城のまち
  - 信州上田
  naming_type: 一部の地名
  prefecture: 長野県
  homonyms: []
  summary: 市名は真田昌幸が天正11年（1583年）に築いた上田城と、その城下町の名を受け継いだものである。「上田」という地名自体は築城以前からこの地の呼称として使われていたとみられるが、語源や文献上の初出は本バッチでは確定できなかった。大正8年（1919年）に市制を施行し、平成18年（2006年）に丸子町・真田町・武石村と新設合併して現在の市域となった。
  first_attestation:
    era: 天正11年
    year_western: 1583
    document: 真田昌幸による上田城築城の開始（上田市公式「上田城の歴史」）
    note: 城名・城下町名としての確実な起点。地名「上田」自体の文献上の初出は特定できていない
  claims:
  - text: 上田城築城以前のこの地は、東山道・北国道などの通る交通の要点として集落をなし、中世末には地方土豪の拠点であった
    kind: fact
    level: E3
    status: established
    sources:
    - l3-ueda-kotobank
  - text: 古代の上田市域には信濃国府が置かれ、その所在地については染屋台や信州大学繊維学部周辺が有力と推測されている
    kind: fact
    level: E2
    status: established
    sources:
    - l3-ueda-fuzoku
  - text: 天正11年（1583年）、真田昌幸は徳川氏の力を借りて上田城の築城に着手した
    kind: fact
    level: E2
    status: established
    sources:
    - l3-ueda-uedajo
  - text: 天正13年（1585年）、第一次上田合戦で昌幸は数ではるかに優勢な徳川軍を上田城に退けた
    kind: fact
    level: E2
    status: established
    sources:
    - l3-ueda-uedajo
  - text: 大正8年（1919年）5月1日、上田町が市制を施行して上田市となった
    kind: fact
    level: E2
    status: established
    sources:
    - l3-ueda-donna
  - text: 平成18年（2006年）3月6日、上田市・丸子町・真田町・武石村の4市町村が対等合併し、新しい上田市が誕生した
    kind: fact
    level: E2
    status: established
    sources:
    - l3-ueda-donna
  - text: 総務省「地方公共団体コード一覧」では、上田市のコードは202037とされる
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 本拠「真田」と新城「上田」
    text: 真田氏の本拠は現在の上田市真田町周辺の「真田」であり、昌幸はそこから約10キロメートル南西の、小県盆地の中心・上田に新しい城を築いた。2006年の合併で真田町が上田市に入ったことで、本拠の地と新城の地が一つの市に収まった。市名は新城の名「上田」のままである。
    sources:
    - l3-ueda-kotobank
  relations:
  - pref/20
  unknowns:
  - 地名「上田」の語源（氏の名に由来するのか、地形に由来するのか）や文献上の初出は、本バッチでは確定できなかった。築城以前から使われていたことは各種資料が示唆するが、断定はしない
  updated: '2026-11-13'
- id: muni/20-下條村
  code: '204111'
  names:
    ja: 下條村
    reading: しもじょうむら
    aliases:
    - 下条
  user_terms:
  - しもじょう
  - 下條氏の村
  - 下条氏の里
  naming_type: その他（中世にこの地を治めた下條氏に由来する地名の継承）
  prefecture: 長野県
  homonyms: []
  summary: 天竜川の東、下伊那の山間の村。村名は、室町時代に甲斐方面からこの地に入り、戦国期に伊那谷の南部で勢力を持った武士・下條氏に由来するとされる。村名そのものが人名（氏族名）から来ている点がこの村の特徴で、明治22年（1889年）に睦沢村と陽皐村が合併して下條村が発足した。「條」は旧字体で、自治体名にこの表記が残る数少ない例である。
  first_attestation:
    era: 明治22年
    year_western: 1889
    document: 町村制施行による下條村の発足
    note: 自治体名としての初出。下條氏の名自体は戦国期の文書・軍記に見えるが、地名としての確実な初出は未確認
  claims:
  - text: 村名は、室町時代のはじめに甲斐の国からこの地に入り、室町中期から戦国期にかけて全盛を極めた下條氏に由来するとされる
    kind: fact
    level: E5
    status: established
    sources:
    - v10-shimojo-wiki
  - text: 下条信氏（1529年〜1582年）は下條氏の当主で、武田氏の信濃先方衆として伊那郡の南西部を領した国衆であった
    kind: fact
    level: E5
    status: established
    sources:
    - v10-shimojo-nobuuji-wiki
  - text: 下條氏の出自については、甲斐国巨摩郡下条（現在の韮崎市）から興った武田氏の庶流であるとも、室町時代中期に小笠原氏から養子が入ったともいわれ、説が分かれる
    kind: fact
    level: E5
    status: contested
    sources:
    - v10-shimojo-nobuuji-wiki
  - text: 明治8年（1875年）に小松原村・大久保村・粒良脇村・阿知原村・親田村・山田河内村が合併して睦沢村が発足し、同じ頃に陽皐村も発足した
    kind: fact
    level: E5
    status: established
    sources:
    - v10-shimojo-wiki
  - text: 明治22年（1889年）4月1日、睦沢村と陽皐村の区域をもって下條村が発足した
    kind: fact
    level: E5
    status: established
    sources:
    - v10-shimojo-wiki
  - text: 村役場は大字睦沢に置かれ、旧村名「睦沢」は今も地名として残っている
    kind: fact
    level: E5
    status: established
    sources:
    - v10-shimojo-wiki
  - text: 同じ下伊那郡には、かつて大下条村（現在の阿南町）という自治体もあり、「下条」を名乗る地名が近隣に複数存在した
    kind: fact
    level: E5
    status: established
    sources:
    - v10-shimojo-oshimojo-wiki
  - text: 下條村の地方公共団体コードは204111である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 「しもじょう」は武士の姓だった
    text: 「しもじょう」という音からは、別の読み方や歌舞伎の世界を連想する人もいるかもしれないが、この村の名は中世の武士・下條氏から来ている。戦国期の下条信氏は武田晴信（信玄）の義兄弟ともいわれ、伊那谷の南を押さえた国衆だった。面白いのは地名の広がりで、近くの阿南町には大下条という地区があり、昭和32年（1957年）までは大下条村という自治体も実在した。下條氏の勢力圏が、そのまま地名の分布として残っているのである。なお自治体名の「條」は旧字体で、この表記が明治22年以来そのまま使われ続けている。
    sources:
    - v10-shimojo-wiki
    - v10-shimojo-nobuuji-wiki
    - v10-shimojo-oshimojo-wiki
  relations:
  - pref/20
  unknowns:
  - 村名が下條氏に由来することを明記した村公式資料（『下條村誌』等）の本文を、オンラインでは確認できなかった
  - 1889年の発足時に「下條」の名が新しく選ばれたのか、旧地名として既に存在したのかの経緯は未確認である
  updated: '2026-11-13'
- id: muni/20-下諏訪町
  code: '203611'
  names:
    ja: 下諏訪町
    reading: しもすわまち
    aliases:
    - 下諏訪村
    - 下諏訪宿
  user_terms:
  - しもすわ
  - 諏訪大社下社の門前町
  - 御柱祭の町
  - 下諏訪温泉の町
  naming_type: その他（諏訪大社下社の鎮座する地の名「下諏訪」の継承）
  prefecture: 長野県
  homonyms: []
  summary: 諏訪湖の北岸の町で、諏訪大社下社（春宮・秋宮）の門前町であり、中山道と甲州街道が合流する温泉宿場・下諏訪宿として栄えた。「諏訪」は湖・郡・神社に共通する古地名で、「下」は湖の南東側の上社に対する下社の側であることを示す位置関係の名である。古代には『和名類聚抄』の諏訪郡「土武郷」が現在の下諏訪町に比定される。
  first_attestation:
    era: 10世紀初め
    year_western: null
    document: 和名類聚抄
    note: 信濃国諏訪郡の「土武郷」が現在の下諏訪町にあたると町公式資料が紹介する（原文の直接確認はしていない）。「下諏訪」という地名自体の初出は未確認
  claims:
  - text: 下諏訪町公式資料によれば、『和名類聚抄』にみえる信濃国諏訪郡の「土武郷」が、現在の下諏訪町にあたると考えられている
    kind: fact
    level: E2
    status: established
    sources:
    - v10-shimosuwa-town
  - text: 『続日本紀』によれば、奈良時代の一時期、諏訪地域は信濃国から分立して諏方国をなしたが、約10年で信濃国に復されたとされる
    kind: fact
    level: E5
    status: established
    sources:
    - v10-shimosuwa-wiki
  - text: 諏訪大社は諏訪湖を挟んで上社と下社に分かれ、上社の本宮は諏訪市、下社の春宮・秋宮は下諏訪町に鎮座し、上社・下社は湖を隔てて向き合っている
    kind: fact
    level: E2
    status: established
    sources:
    - n3-suwa-jtb
  - text: 中世には、下社の大祝を務める金刺氏と上社方の諏訪氏が争いを続け、劣勢となった金刺氏は甲斐の武田氏を頼って落ち延びた
    kind: fact
    level: E5
    status: established
    sources:
    - v10-shimosuwa-wiki
  - text: 江戸時代の下諏訪は、中山道と甲州道中が合流する交通の要衝であり、中山道随一の温泉宿場町として賑わった
    kind: fact
    level: E2
    status: established
    sources:
    - v10-shimosuwa-town
  - text: 明治7年（1874年）に7か村が合併して下諏訪村となり、明治26年（1893年）6月30日に町制を施行して下諏訪町となった
    kind: fact
    level: E2
    status: established
    sources:
    - v10-shimosuwa-siryou
  - text: 昭和33年（1958年）には、隣接する岡谷市の一部（東町・東山田）を編入した
    kind: fact
    level: E2
    status: established
    sources:
    - v10-shimosuwa-siryou
  - text: 下諏訪町の地方公共団体コードは203611である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 湖を挟んだ「上」と「下」の諏訪
    text: 諏訪大社の上社と下社は、諏訪湖の南東と北西に大きく離れて向かい合う。上社を擁するのが諏訪市と茅野市、下社を擁するのが下諏訪町で、町名の「下」はこの下社の側であることに対応している。もっとも上・下は偉さの順位ではなく、両社の神紋も上社は4本根の「諏訪梶」、下社は5本根の「明神梶」と異なっている。中世に上社の諏訪氏と下社の金刺氏が争った歴史もあり、御柱祭の進め方には今なお上社系と下社系の違いが残るという。一つの湖を挟んで二つの「諏訪」が競い合ってきた構図が、そのまま町名の「下」の字に刻まれている。
    sources:
    - n3-suwa-jtb
    - v10-shimosuwa-wiki
  relations:
  - pref/20
  - muni/20-諏訪市
  unknowns:
  - 「下諏訪」という地名の確実な初出と、「上諏訪・下諏訪」の対が成立した時期は確認できなかった
  - 『和名類聚抄』の「土武郷」の読みと現在地への比定の根拠は、町公式資料の紹介に依拠しており、原文の確認はしていない
  updated: '2026-11-13'
- id: muni/20-中川村
  code: '203866'
  names:
    ja: 中川村
    reading: なかがわむら
    aliases: []
  user_terms:
  - なかがわ
  - 日本で最も美しい村
  - 陣馬形山の村
  naming_type: 合併新設（1958年に片桐村・南向村が合併して発足。命名理由は村公式資料にも明示されていない）
  prefecture: 長野県
  homonyms: []
  summary: 伊那谷の南部、天竜川の両岸に広がる村。昭和33年（1958年）に、川の西岸の片桐村と東岸の南向村が合併して発足した。「中川」という新しい村名の命名理由は、村公式の村勢要覧の沿革にも記載がなく、本調査では確認できなかった。
  first_attestation:
    era: 昭和33年
    year_western: 1958
    document: 中川村の発足（1958年8月1日）
    note: 自治体名としての初出
  claims:
  - text: 昭和33年（1958年）3月31日に南向村と片桐村が合併に調印し、同年8月1日より中川村が新村として発足した
    kind: fact
    level: E2
    status: established
    sources:
    - v10-nakagawa-yoran
  - text: 旧南向村は天竜川の東岸、旧片桐村は西岸に位置し、現在の村は川を挟んで南向地区と片桐地区に分かれる
    kind: fact
    level: E5
    status: established
    sources:
    - v10-nakagawa-wiki
  - text: 中世以来の片桐郷は天竜川の両岸にまたがり、東岸の葛島村も片桐郷7か村に属していたことが、村公式の沿革に記されている
    kind: fact
    level: E2
    status: established
    sources:
    - v10-nakagawa-yoran
  - text: 旧南向村は、明治8年（1875年）に大草村・四徳村・葛島村が合併して成立したが、その後いったん3村に分かれ、明治22年（1889年）に再び合併して南向村となった
    kind: fact
    level: E2
    status: established
    sources:
    - v10-nakagawa-yoran
  - text: 村章は昭和34年（1959年）3月2日に制定され、「中」の字を図案化したもので、輪は和合を、三角錐は発展を象徴すると村公式資料は説明する
    kind: fact
    level: E2
    status: established
    sources:
    - v10-nakagawa-yoran
  - text: 村は「日本で最も美しい村」連合に加盟しており、陣馬形山や四徳地区の景観が登録地域資源となっている
    kind: fact
    level: E5
    status: established
    sources:
    - v10-nakagawa-wiki
  - text: 「中川」という新村名の命名理由は、村公式の村勢要覧の沿革にも明記されておらず、本調査の範囲では確認できなかった
    kind: fact
    level: E2
    status: indeterminate
    sources:
    - v10-nakagawa-yoran
  - text: 中川村の地方公共団体コードは203866である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 川を挟んで生まれた村名の謎
    text: 中川村は天竜川の東西両岸の2村が合わさって生まれた。「中川」という名の村はかつて各地にあり、埼玉県秩父郡の旧中川村については「荒川が村の中央を流れていたことから」と命名理由が辞典に残っている。ところが長野県の中川村については、村の公式資料にすら命名の理由が書かれていない。川の「中」を取ったのか、伊那谷の「中央」を意味するのか。1958年の合併協議の記録が村のどこかに残っているはずであり、「由来自体が未確認」という状態も、この村の地名の履歴の一部として正直に記録しておく。
    sources:
    - v10-nakagawa-yoran
    - v10-nakagawa-saitama-wiki
  relations:
  - pref/20
  unknowns:
  - 「中川」という新村名の命名理由・選定過程は、村公式資料および公開資料では確認できなかった
  - 合併前の両村の地域に、中世以前から「中川」という地名が存在したかどうかは未確認である
  updated: '2026-11-13'
- id: muni/20-中野市
  code: '202118'
  names:
    ja: 中野市
    reading: なかのし
    aliases:
    - 中野町
    - 中野牧
    - 信州中野
  user_terms:
  - なかの
  - 信州中野
  - 高井富士の見える市
  - 唱歌「故郷」のふるさと
  naming_type: 一部の地名
  prefecture: 長野県
  homonyms: []
  summary: 1954年（昭和29年）に下高井郡中野町を中心に1町8村が合併して誕生した市で、市名は旧中野町の名を継承した。「中野」の名は古代の官牧とされる中野牧に遡り、鎌倉時代には中野氏が活躍した。2005年には豊田村と合併して現在の市域となった。市の北にそびえる高社山は、その秀麗な姿から「高井富士」の異名で親しまれている。
  first_attestation:
    era: 平安時代
    year_western: null
    document: null
    note: 市公式の沿革が古代の「中野牧」の発達を述べることから、地名「中野」は古代の牧の名として現れる。牧の名を記した一次史料の直接確認は未了のため、西暦年と文献名は null とした
  claims:
  - text: 総務省の全国地方公共団体コードで、中野市の団体コードは202118と定められている
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  - text: 中野市によれば、古代には官牧とされる中野牧・笠原牧が発達し、郷の形成を促した。「中野」の名はこの牧の名に遡る
    kind: fact
    level: E2
    status: established
    sources:
    - v1-nakano-city-enkaku
  - text: 中野市によれば、鎌倉時代には中野氏が活躍し、のち高梨氏が館を構えて城下町を形成し、現在の本市の基盤をつくった
    kind: fact
    level: E2
    status: established
    sources:
    - v1-nakano-city-enkaku
  - text: 中野市によれば、明治初年に中野村に中野県の県庁が置かれたが、中野騒動で県庁が焼失し、明治4年（1871年）に県庁を長野村へ移して長野県と改称された
    kind: fact
    level: E2
    status: established
    sources:
    - v1-nakano-city-enkaku
  - text: 中野市によれば、昭和29年（1954年）に中野町を中心に近隣8か村が合併して中野市が誕生し、市名は中心町の中野町の名を継承した
    kind: fact
    level: E2
    status: established
    sources:
    - v1-nakano-city-enkaku
  - text: 中野市によれば、平成17年（2005年）4月1日に中野市と豊田村が合併し、新市「中野市」として発足した
    kind: fact
    level: E2
    status: established
    sources:
    - v1-nakano-city-keikaku
  - text: 中野市によれば、市北部の高社山（こうしゃさん）は地元で「たかやしろ」と呼ばれ、その美しさから「高井富士（たかいふじ）」の異名をもつ市のシンボルである
    kind: fact
    level: E2
    status: established
    sources:
    - v1-nakano-city-kanko
  column:
    title: 一度は県庁所在地だった「中野」
    text: 中野市には、長野県の県名を決めたドラマの前半が眠っています。明治3年（1870年）、伊那県から分かれた中野県の県庁は中野村（現在の中野市）に置かれました。ところが翌年、世直しを求める中野騒動で県庁が焼失。県庁は長野村へ移され、県名も長野県に改められました。もし騒動がなければ、「中野県」が生まれていたかもしれない——県庁所在地の座を巡る歴史の分岐点が、この市の名に刻まれています。
    sources:
    - v1-nakano-city-enkaku
  relations:
  - pref/20
  unknowns:
  - 「中野牧」の名を記した一次史料（延喜式等）の直接確認は未了で、市公式の沿革の紹介による
  - 「中野」の語源（野の中ほどという地形的解釈など）を専門辞典で確認することは未了
  updated: '2026-11-13'
- id: muni/20-伊那市
  code: '202096'
  names:
    ja: 伊那市
    reading: いなし
    aliases:
    - 伊那町
  user_terms:
  - いなし
  - 伊那谷の中心
  - 上伊那の中心都市
  - 伊那の名前の由来
  naming_type: その他（古代の伊那郡に遡る郡名の継承）
  prefecture: 長野県
  homonyms: []
  summary: 伊那市は天竜川の流れる伊那谷北部の中心都市で、市名「伊那」は古代の信濃国伊那郡に遡る古い名である。旧伊那市は1954年の合併で発足し、2006年に高遠町・長谷村と合併して現在の伊那市となった。「伊那」の語源については、渡来系の造船技術集団「伊奈部氏」に由来する説と地形に由来する説があり、地名研究者の間でも見解が分かれている。
  first_attestation:
    era: 古代
    year_western: null
    document: （未確認）
    note: 信濃国伊那郡の名は平安時代の文献に遡ると考えられるが、本調査では一次資料の原文で確認できなかった
  claims:
  - text: 平成18年（2006年）3月31日に、旧伊那市・高遠町・長谷村が合併して新しい伊那市が誕生した
    kind: fact
    level: E2
    status: established
    sources:
    - v2-ina-plan
  - text: 旧伊那市は昭和29年（1954年）4月1日に伊那町・富県村・美篶村・手良村・東春近村・西箕輪村の1町5村の合併で発足し、昭和40年（1965年）に西春近村を編入した
    kind: fact
    level: E2
    status: established
    sources:
    - v2-ina-plan
  - text: 2006年の合併は新設合併であったが、新市の名称には旧伊那市の「伊那市」がそのまま用いられた
    kind: fact
    level: E2
    status: established
    sources:
    - v2-ina-plan
  - text: 「伊那」の語源については、朝鮮半島からの渡来系の造船技術集団「伊奈部氏」に由来するという説がある（伊那谷地名研究会の研究者の説として、伊那市歴史シンポジウムの報告で長野県公式ブログが紹介するもの）
    kind: fact
    level: E4
    status: contested
    sources:
    - v2-ina-sympo
  - text: 同じシンポジウムでは地形に由来するという別の見解も示されており、「いな」という地名の語源は地名研究者の間でも見解がまったく異なっている（長野県公式ブログのシンポジウム報告による）
    kind: fact
    level: E4
    status: contested
    sources:
    - v2-ina-sympo
  - text: 伊那市の地方公共団体コードは202096である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 「伊那」は氏族の名か、地形の名か
    text: 伊那市で開かれた歴史シンポジウムでは、普段当たり前に使っている「いな」という地名の語源をめぐって、研究者の見解が真っ向から分かれた。伊那谷地名研究会の側は、朝鮮半島から渡来した造船技術集団「伊奈部氏」に由来するという説を唱え、別の研究者は地形に由来するという説を唱えた。県の公式ブログはこの対立を「伊那谷の歴史上の事件」とまで書いている。語源が決まらないことは欠陥ではなく、それだけ古く、多くの人の営みが重なった名前だということでもある。
    sources:
    - v2-ina-sympo
  relations:
  - pref/20
  unknowns:
  - 「伊那」の語源の定説は確認できなかった（伊奈部氏説と地形説が研究者の間で対立している）
  - 伊那郡の初出文献を一次資料の原文で確認できなかった
  - 「稲」に由来するとする説など、その他の諸説の出典を確認できなかった
  updated: '2026-11-13'
- id: muni/20-佐久市
  code: '202177'
  names:
    ja: 佐久市
    reading: さくし
    aliases: []
  user_terms:
  - 佐久の名前の由来
  - さくし
  - 佐久平の市
  - 佐久鯉のまち
  naming_type: その他（郡名「佐久」以来の地名の継承）
  prefecture: 長野県
  homonyms: []
  summary: 佐久市は、信濃国の古代の郡名「佐久郡」に由来する地名を受け継ぐ。佐久の語源については、他の信濃諸郡から隔たる位置に由来する説、国境を守る柵の説、狭い地形の説などが古くから挙げられてきたが、『佐久市志』も定説はないとし、『北佐久郡志』は解明は困難だと述べる。市としては昭和36年（1961年）に浅間町ほか3町村の合併で市制を施行し、平成17年（2005年）に臼田町・浅科村・望月町と合併して現在の市となった。
  first_attestation:
    era: 古代
    year_western: null
    document: 和名類聚抄ほか古代史料
    note: 『北佐久郡志』によれば六国史・延喜式・和名抄などの諸書にも佐久郡に関する記述ははなはだ少なく、郡名の確実な初出は本バッチでは特定できなかった
  claims:
  - text: 旧佐久市は、昭和36年（1961年）4月1日に北佐久郡浅間町・東村と南佐久郡野沢町・中込町の合併により市制を施行した
    kind: fact
    level: E2
    status: established
    sources:
    - n3-saku-gappei
  - text: 平成17年（2005年）4月1日に、佐久市・臼田町・浅科村・望月町の4市町村が合併し、現在の佐久市となった
    kind: fact
    level: E2
    status: established
    sources:
    - n3-saku-gappei
  - text: 佐久市は本州のほぼ中央にあり、標高約692メートルで県下四つの平の一つである佐久平の中央に位置する高原都市である
    kind: fact
    level: E2
    status: established
    sources:
    - n3-saku-gappei
  - text: 『佐久市志』は、「佐久」という地名の由来に定説はないとしながら、甲斐・上州の間に突出して他の信濃諸郡から隔たる（さかる）位置にあることに由来する説、国境を守る柵に由来する説、狭隘な地形を意味する「剖割（さきわる）」に由来する説、平地を抉ったような地形に由来する説を挙げている
    kind: fact
    level: E5
    status: contested
    sources:
    - n3-saku-wiki-note
  - text: 『北佐久郡志』は、諏訪の国から地を割（さ）いて分けた意味であるという説や、外敵を防ぐ柵が築かれたためであるという説について「ともに納得できる語源説ではない」とし、今日これを解明することは困難であろうと述べている
    kind: fact
    level: E5
    status: contested
    sources:
    - n3-saku-wiki-note
  - text: 『北佐久郡志』は、六国史・延喜式・和名抄等の諸書にも佐久郡に関する記述ははなはだ少ないことを指摘している
    kind: fact
    level: E5
    status: established
    sources:
    - n3-saku-wiki-note
  - text: 佐久市の地方公共団体コードは202177である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 定説のない地名を、子どもたちにどう教えるか
    text: 佐久の地元の小中学校で使われる副読本『見たい・行きたい 佐久の歴史』は、「佐久」という地名の由来に4つの説を併記している。他の信濃の郡々から遠く離れた「さかる」から来たという説、関東とを結ぶ碓氷峠が国境をふさぐ「せく」が転じたという説、外敵を防ぐ柵が築かれたという説、開拓の神を祀る新海三社神社に関係して「新開（にいさく）」が略されたという説。どれが正しいかは、いまも決まっていない。決まっていないことを決まっていないまま並べて教える――地名の由来の扱いとして、これはむしろ誠実なやり方だろう。
    sources:
    - n3-saku-wiki-note
  relations:
  - pref/20
  unknowns:
  - 「佐久」の語源は定説がなく、市志・郡志とも解明は困難としている
  - 佐久郡の名の確実な初出となる史料は、古代史料の記述自体が乏しく、本バッチでは特定できなかった
  - 平成17年（2005年）の合併の方式（新設合併か編入合併か）は、協議会資料の公開範囲では確認できなかった
  updated: '2026-11-13'
