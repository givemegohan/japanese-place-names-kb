  - 勝浦郡の町
  naming_type: 旧行政区画名の継承
  formation: 合併新設
  prefecture: 徳島県
  homonyms: []
  summary: 徳島県東部の勝浦郡の町。勝浦川流域の勝浦盆地にあり、1955年に生比奈村と横瀬町が合併して発足した。地名「勝浦」は千葉県勝浦市と同名だが、自治体としては市と町で別であり、由来の層も別に追う必要がある。郡名の層では古くは「かつら」と読まれた古い名で、舎人親王に結びつける起源譚が伝わる。
  first_attestation:
    era: 中世（古くは「かつら」）
    year_western: null
    document: 『精選版日本国語大辞典』「勝浦」
    note: 郡名「勝浦」は古くは「かつら」と読まれたと辞典が記す。『平家物語』『源平盛衰記』に「かつら」と読んで見えるとWikipedia「勝浦郡」が紹介しており、長門本『平家物語』については同記事が引用する本文で起源譚を確認した。自治体名としての初出は1955年の合併
  claims:
  - text: 総務省の地方公共団体コード一覧で、勝浦町の団体コードは363014と定められている
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  - text: 勝浦町は1955年に生比奈村と横瀬町が合併して発足したが、合併の日は徳島県の市・郡沿革表が3月31日とする一方、Wikipedia「勝浦町」と歴史的行政区域データセットは3月1日としており、資料の間で食い違う
    kind: fact
    level: E2
    status: contested
    sources:
    - q4-tokushima-enkaku
    - q10-wiki-katsuura
    - q10-nii-katsuura
  - text: 横瀬町は、1889年（明治22年）に発足した棚野村が、1926年（大正15年）2月11日に町制施行と同時に改称して生まれた町である
    kind: fact
    level: E2
    status: established
    sources:
    - upg-ae2-tokushima-hensen
  - text: 生比奈村は1889年（明治22年）に発足した
    kind: fact
    level: E2
    status: established
    sources:
    - upg-ae2-tokushima-hensen
  - text: 郡名「勝浦」は古くは「かつら」と読まれた（『精選版日本国語大辞典』は、勝浦郡について「古くは『かつら』」と記す）
    kind: fact
    level: E3
    status: established
    sources:
    - upg-s1-katsuura-nikokugo
  - text: 『平家物語』（長門本）には、崇道尽敬天皇（舎人親王）が異賊を平らげて軍に勝ったことから、この地を勝浦と呼ぶようになったという起源譚が見える（Wikipedia「勝浦郡」が長門本の本文を引用して紹介している）
    kind: legend
    level: E2
    status: established
    sources:
    - q10-wiki-katsuura-gun
  - text: 千葉県勝浦市とは読みの同じ「かつうら」の同名地名だが、県も自治体の種別（市と町）も異なる別の自治体であり、総務省の地方公共団体コード一覧でも別々に定められている
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  - text: 町域は勝浦川の中流域にあり、四方を山に囲まれた準山間盆地帯で、阿波みかん発祥の地として知られる
    kind: fact
    level: E2
    status: established
    sources:
    - upg-s1-katsuura-town-plan
  column:
    title: 「かつら」と読まれた勝浦と、親王の伝説
    text: かつて勝浦は「かつうら」ではなく「かつら」と読まれていたという。そこに結びつけられたのが、舎人親王が浦で勝ったから勝浦になったという、勝ち名の起源譚である。読みも由来譚も今とは違う姿を見せるこの地名は、房総の勝浦と字も読み（現在）も同じでありながら、まったく別の物語を背負っている。
    sources:
    - q10-wiki-katsuura-gun
  relations:
  - pref/36
  - muni/36-上勝町
  unknowns:
  - 1955年の合併日（3月1日か3月31日か）は町公式の沿革での確定が未了
  - 『源平盛衰記』本文における「勝浦」の用例の直接確認は未了（『平家物語』長門本については、Wikipediaが引用する本文で起源譚を確認した）
  - 「勝浦」という地名そのものの実際の語源は未確認
  updated: '2026-11-13'
- id: muni/36-北島町
  code: '364029'
  names:
    ja: 北島町
    reading: きたじまちょう
    aliases: []
  user_terms:
  - きたじま
  - ひょうたん島の町
  - 徳島県で一番小さい町
  - 人口密度の高い町
  naming_type: その他
  formation: 合併新設
  prefecture: 徳島県
  homonyms: []
  summary: 徳島県北東部、板野郡の町。吉野川河口の三角州にあり、旧吉野川と今切川に挟まれた「ひょうたん島」と呼ばれる中州の西半を占める。1889年に北島村が発足し、1940年に町制を施行した。徳島県で最も面積の小さい自治体である。「北島」の命名理由を示す公式記録は確認できていない。
  first_attestation:
    era: 明治22年
    year_western: 1889
    document: 徳島県「市・郡沿革表」
    note: 1889年10月1日に7村の区域をもって北島村が発足したことが、自治体名「北島」の初出にあたる
  claims:
  - text: 総務省の地方公共団体コード一覧で、北島町の団体コードは364029と定められている
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  - text: 1889年（明治22年）10月1日に北島村が発足した
    kind: fact
    level: E2
    status: established
    sources:
    - upg-ae2-tokushima-hensen
    - q10-nii-kitajima
  - text: 1940年2月11日、北島村が町制を施行して北島町となった
    kind: fact
    level: E2
    status: established
    sources:
    - q4-tokushima-enkaku
    - q10-nii-kitajima
  - text: 町は吉野川河口の三角州上にあり、北を旧吉野川、南を今切川に挟まれたひょうたん形の中州の西側に位置し、東側は主に松茂町である
    kind: fact
    level: E2
    status: established
    sources:
    - q10-tokushima-iju-kitajima
    - q10-wiki-kitajima
  - text: 徳島県の市町村別指標（県企画総務部統計課、2022年版）では、北島町の総面積8.74km2は県内24市町村の中で最も小さく、人口密度は県内1位（2,609.0人/km2）とされている
    kind: fact
    level: E2
    status: established
    sources:
    - upg-af8-tokushima-shihyo
  - text: 四国の町村では人口密度が最も高いとされる
    kind: fact
    level: E5
    status: established
    sources:
    - q10-wiki-kitajima
  - text: 「北島」という村名は、中州の北西に位置することや構成村の一つである北村と結びつけて理解できる位置名とみられるが、1889年の命名理由を示す公式記録は確認できていない
    kind: fact
    level: H
    status: inferred
    sources:
    - q10-wiki-kitajima
  - text: 当地は阿波藍の歴史を持つ地域で、文化庁の日本遺産「藍のふるさと阿波」（2019年認定）の構成自治体に北島町も含まれている
    kind: fact
    level: E2
    status: established
    sources:
    - upg-s1-ai-heritage
  column:
    title: ひょうたん島を分け合う二つの町
    text: 旧吉野川と今切川に挟まれた中州は、上から見るとひょうたんの形をしている。その西半分が北島町、東半分が松茂町で、一つの「島」を二つの町が分け合っている。北島町の「島」は海に浮かぶ島ではなく、川に挟まれた陸地を指す名であり、吉野川のデルタという土地の成り立ちがそのまま町名の風景になっている。
    sources:
    - q10-tokushima-iju-kitajima
    - q10-wiki-kitajima
  relations:
  - pref/36
  - muni/36-松茂町
  unknowns:
  - 「北島」の命名理由を示す1889年当時の公式記録は未確認
  - 中州が「島」として意識され地名化した時期は未確認
  updated: '2026-11-13'
- id: muni/36-吉野川市
  code: '362051'
  names:
    ja: 吉野川市
    reading: よしのがわし
    aliases: []
  user_terms:
  - 吉野川のほとりの市
  - よしのがわ
  - 鴨島・川島・山川の合併市
  - 麻植市にならなかった市
  naming_type: 自然地名から
  formation: 合併新設
  prefecture: 徳島県
  homonyms: []
  summary: 2004年10月1日に麻植郡の鴨島町・川島町・山川町・美郷村が合併して発足した市で、市名は市域の北を流れる吉野川に由来する。新市名称の公募では郡名を採った「麻植市」が1位だったが、麻植郡合併協議会は2位の「吉野川市」に決定した。この合併で麻植郡は消滅した。
  first_attestation:
    era: 平成16年
    year_western: 2004
    document: 麻植郡合併協議会による新市名称の決定と合併による吉野川市の発足
    note: 市名としては2004年の合併で生まれた名。河川名「吉野川」自体の初出・語源は本レコードでは扱わない。
  claims:
  - text: 吉野川市は2004年10月1日、麻植郡の鴨島町・川島町・山川町・美郷村が合併して発足した。
    kind: fact
    level: E2
    status: established
    sources:
    - q4-tokushima-enkaku
  - text: 新市名称の公募では、郡名を採る「麻植市」が応募数1位、「吉野川市」が2位だった。
    kind: fact
    level: E4
    status: established
    sources:
    - upg-s11-yoshinogawa-uub
  - text: 麻植郡合併協議会は新市名称の候補を「麻植市」「吉野川市」の2案に絞り込んだうえで協議し、「吉野川市」に決定した。
    kind: fact
    level: E4
    status: established
    sources:
    - upg-s11-yoshinogawa-uub
  - text: この合併で麻植郡の全町村が一つの市となり、麻植郡自体も消滅した。
    kind: fact
    level: E4
    status: established
    sources:
    - q4-yoshinogawa-uub
  - text: 市名の由来である吉野川は四国最大の河川で、市はその中流域の南岸に位置する。
    kind: fact
    level: E2
    status: established
    sources:
    - upg-s11-yoshinogawa-city-profile
    - upg-s11-yoshino-mlit
  - text: 吉野川市の地方公共団体コードは362051である。
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 公募1位が敗れた市名
    text: 合併の新市名を公募すると、多くの場合、応募1位がそのまま採用される。吉野川市はその逆を行った例である。2002年の公募で最も多かったのは、郡名を残す「麻植市」だった。協議会もいったん候補を「麻植市」と「吉野川市」の2案に絞ったが、最終的に選んだのは2位のほうだった。麻植という郡名は「あさぎ」とも読める難読さもあり、吉野川の知名度が勝ったとみられる。結果として「麻植」は郡ごと地図から消え、川の名が残った。地名の存続は、公募の票数だけでは決まらないのである。
    sources:
    - q4-yoshinogawa-wiki
    - q4-yoshinogawa-uub
  relations:
  - pref/36
  unknowns:
  - 協議会が公募2位の「吉野川市」を選んだ理由の公式な説明は確認できなかった。
  - 河川名「吉野川」の語源（奈良の吉野との関係など）は確認できなかった。
  updated: '2026-11-13'
- id: muni/36-小松島市
  code: '362034'
  names:
    ja: 小松島市
    reading: こまつしまし
    aliases: []
  user_terms:
  - こまつしま
  - 小松市と小松島市の違い
  - 四国と阪神を結ぶ港町
  - フェリーの港 小松島
  naming_type: その他
  formation: 編入合併
  prefecture: 徳島県
  homonyms: []
  summary: 市の公式の沿革によれば、「小松島」の地名は、平安時代に当地の篠原郷が京都の仁和寺の荘園だった折、仁和寺のある京都の「小松郷」にちなんで生まれたとされる。1908年に小松島村が町制を施行し、1951年に市制を施行して小松島市となった。石川県の小松市とは別であり、こちらは四国と京阪神を結ぶ港町として発展した。
  first_attestation:
    era: 平安時代
    year_western: null
    document: null
    note: 市の公式の沿革は、篠原郷が仁和寺領だった時期に「小松島」の名が生まれたと説明するが、初出の文書名は示されておらず確認できなかった。
  claims:
  - text: 小松島市公式の沿革によれば、平安時代の当地には篠原郷・新居郷・余戸郷があり、篠原郷は一時、京都の仁和寺の荘園であった。
    kind: fact
    level: E2
    status: established
    sources:
    - q4-komatsushima-city-enkaku
  - text: 同市の沿革は、仁和寺が京都の「小松郷」という場所にあったことにちなんで「小松島」の地名が生まれたものと考えられると説明している。
    kind: fact
    level: E2
    status: established
    sources:
    - q4-komatsushima-city-enkaku
  - text: 小松島村は1908年11月1日に町制を施行して小松島町となり、1951年4月に那賀郡立江町と合併、同年6月1日に市制を施行して小松島市となった。
    kind: fact
    level: E2
    status: established
    sources:
    - q4-komatsushima-gaikyo
    - q4-komatsushima-city-enkaku
  - text: 1956年に那賀郡坂野町を編入し、現在の市域となった。
    kind: fact
    level: E2
    status: established
    sources:
    - q4-komatsushima-gaikyo
  - text: 小松島は天然の良港を持ち、四国と京阪神を結ぶ海上交通の要衝として「港都」と呼ばれる都市へ発展した。
    kind: fact
    level: E2
    status: established
    sources:
    - q4-komatsushima-city-enkaku
  - text: 小松島市の地方公共団体コードは362034である。
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 京都の小松郷から来た名前
    text: 小松島という名の故郷は、四国ではなく京都にある。市の沿革が語る由来はこうだ。平安時代、この地の篠原郷は京都の仁和寺の荘園だった。仁和寺は京都の「小松郷」と呼ばれる場所にあり、それにちなんで遠く離れた荘園の地にも「小松島」の名が生まれたという。荘園を通じて本拠地の地名が遠隔地へ移植される例は各地にあるが、本家が寺院で、名の由来が寺のある郷の名というのは珍しい。石川県の小松市は加賀の小松の地名に由来する別の市で、読みも成り立ちも異なる。港町・小松島の名は、京の寺へのつながりを今に伝えている。
    sources:
    - q4-komatsushima-city-enkaku
  relations:
  - pref/36
  - muni/17-小松市
  unknowns:
  - 「小松島」の名が文献に現れる初出は確認できなかった。
  - 篠原郷が仁和寺の荘園だった時期の詳細（荘園の名称や年代）は、市の公式の説明の範囲を超えては確認できなかった。
  updated: '2026-11-13'
- id: muni/36-徳島市
  code: '362018'
  names:
    ja: 徳島市
    reading: とくしまし
    aliases: []
  user_terms:
  - 徳島の名前の由来
  - 阿波おどりの市の名前
  - 渭津から徳島に改名した市の名前
  naming_type: 藩名・城名から
  formation: 単独発足
  prefecture: 徳島県
  homonyms: []
  summary: 市名は徳島藩の城下町・徳島に由来する。天正13年（1585年）、蜂須賀家政が猪山（現在の城山）に徳島城を築く際、それまで「渭津（いのつ）」と呼ばれた地を「徳島」と改めた。誰が名付けたか、「徳」の字をなぜ選んだかを示す文献は確認されておらず、縁起を担いだ命名とする郷土史家の推定がある。徳島市は明治22年（1889年）10月1日に誕生した。
  first_attestation:
    era: 天正13年
    year_western: 1585
    document: 徳島城築城に伴う改名（徳島市立徳島城博物館の解説）
    note: 地名の命名そのものとしての初出。改名を記した同時代の一次文書は特定できていない
  claims:
  - text: 徳島市の地方公共団体コードは362018である（総務省「全国地方公共団体コード」市区町村コード一覧による）
    kind: fact
    level: E2
    status: established
    sources:
    - e-cap-soumu-code-list
  - text: 天正13年（1585年）、豊臣秀吉の四国平定により蜂須賀家政が阿波国を与えられ、徳島城を築いて居城とした
    kind: fact
    level: E2
    status: established
    sources:
    - e-tokushima-pref-gaiyo
  - text: 城地は秀吉の命により猪山（現在の城山）と定められたと徳島市立徳島城博物館は伝えている
    kind: fact
    level: E2
    status: established
    sources:
    - e-tokushima-city-history01
  - text: 築城当時、城の周囲の地は「渭津（いのつ）」と呼ばれていたが、築城と城下町の開設にあたって「徳島」と地名を改めた
    kind: fact
    level: E2
    status: established
    sources:
    - e-tokushima-city-history05
    - e-tokushima-city-history01
  - text: 「徳島」という地名を誰が命名したかを、文献・古文書は明らかにしてくれない。郷土史家・河野幸夫は、「徳」は富田庄の「富」と同意の嘉字（よい意味の字）であり、東に福島という地名もあることから、家政が福島に対して徳島と縁起をかついで名付けたのではないかと推定しているが、決め手はないとされている
    kind: fact
    level: E2
    status: inferred
    sources:
    - e-tokushima-city-history05
  - text: 徳島は江戸時代を通じて、阿波・淡路両国25万7千石を領した蜂須賀氏の城下町として栄えた
    kind: fact
    level: E2
    status: established
    sources:
    - e-tokushima-pref-gaiyo
  - text: 明治22年（1889年）10月1日、かつて御山下と称した朱引地内の33か町村とこれに接続する4郷町村に市制が施行され、徳島市が誕生した。当時の徳島市の人口は6万861人で、その年に市制を施行した市の中で全国10位の規模だった
    kind: fact
    level: E2
    status: established
    sources:
    - e-cap-tokushima-city-hensan
  - text: 市制施行の際、市内の町村名はすべて「町」に統一され、10月1日は後に徳島市の置市記念日とされた
    kind: fact
    level: E2
    status: established
    sources:
    - e-cap-tokushima-city-hensan
  column:
    title: 福島の隣に徳島を ― 縁起を担いだ命名か
    text: 「徳島」の名付け親は分からない。しかし手がかりは地名の配置にある。城下の東には「福島」という地名があった。郷土史家・河野幸夫は、富田庄の「富」と同じく縁起のよい字である「徳」を選び、福島に対して徳島と対にして名付けたのではないか、と推定した。徳島城博物館の連載はこの推定を紹介しながら「決め手はない」と正直に結んでいる。命名の理由が残らなかった城下町は多いが、徳島の場合は「分からない」と明示した上で、もっともらしい推定の根拠まで示されている点が読みどころである。
    sources:
    - e-tokushima-city-history05
  relations:
  - pref/36
  unknowns:
  - 「徳島」の命名者と、「徳」の字が選ばれた理由を示す確かな記録は確認できていない
  - 「渭津」から「徳島」への改名を記した同時代の一次文書は特定できていない
  updated: '2026-11-13'
- id: muni/36-東みよし町
  code: '364894'
  names:
    ja: 東みよし町
    reading: ひがしみよしちょう
    aliases: []
  user_terms:
  - ひがしみよし
  - 三好町と三加茂町が合併した町
  - 三好郡の町
  - 三三大橋の町
  naming_type: 方位・位置による命名
  formation: 合併新設
  prefecture: 徳島県
  homonyms: []
  summary: 徳島県北西部、三好郡の町。吉野川中流部の両岸にまたがり、2006年に三好町と三加茂町が合併して発足した平成合併の町名である。「東みよし」は合併協議会の公募と投票で選ばれた名で、候補時の理由は「三好郡の東部に位置するから」とされた。「みよし」をひらがなにし、旧三好町の名を継ぎながら郡の東部であることを示す名である。
  first_attestation:
    era: 平成18年
    year_western: 2006
    document: 総務省「市町村合併資料集」
    note: 2006年3月1日に三好町・三加茂町が合併して「東みよし町」として発足したことが町名の初出にあたる
  claims:
  - text: 総務省の地方公共団体コード一覧で、東みよし町の団体コードは364894と定められている
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  - text: 2006年3月1日、三好町と三加茂町が合併して東みよし町が発足した
    kind: fact
    level: E2
    status: established
    sources:
    - q10-soumu-gapei
    - q4-tokushima-enkaku
    - q10-nii-higashimiyoshi
  - text: 「東みよし」の名は合併協議会の新町名称公募から選ばれたもので、候補として示された理由は「三好郡の東部に位置するから。ひらがなの『みよし』は清々しく明るく感じられる」というものであった
    kind: fact
    level: E4
    status: established
    sources:
    - q10-miyoshi-name-blog
  - text: 旧三好町の名「三好」は、天地人・山水人の三要素を表すとともに、構成地区である昼間・足代・東山の「三」にも通じ、調和と融和発展を表す名として採用された、と東みよし町の公式計画は説明している
    kind: fact
    level: E2
    status: established
    sources:
    - q10-higashimiyoshi-kaso
  - text: 旧三好町は1955年3月21日に昼間町と足代村の合併で、旧三加茂町は1959年3月31日に加茂町と三庄村の合併で、それぞれ発足した
    kind: fact
    level: E2
    status: established
    sources:
    - q4-tokushima-enkaku
    - q10-higashimiyoshi-kaso
  - text: 三好郡の郡名の由来には、百済国王の末裔である三善氏に由来するという説と、「三野・三津・三繩」の三郷を合わせて「三好」という佳名にしたという説があり、決着はついていない
    kind: fact
    level: E5
    status: contested
    sources:
    - q10-wiki-miyoshi-gun
  - text: 合併協議は当初、三野町・三好町・井川町・三加茂町の三好郡東部4町の枠組みで進んだが、三野町と井川町が離脱し、最終的に三好町と三加茂町の2町合併となった
    kind: fact
    level: E4
    status: established
    sources:
    - q10-miyoshi-name-blog
    - q10-wiki-higashimiyoshi
  column:
    title: 決選投票16対11で決まった「東みよし」
    text: 新町名は公募2,357通・1,201種の中から絞られ、最終候補は清流町・東みよし町・みかわ町・三井町・みのだ町の5つだった。2004年3月18日の合併協議会の投票では1位の「東みよし」が過半数に届かず、「みかわ」との決選投票に。議長が同数回避のため投票を辞退して行われた記名投票は16対11で、東みよしが勝った。その後、合併の枠組み自体が4町から2町に縮んでも、一度決まった名は再検討されずに残った。
    sources:
    - q10-miyoshi-name-blog
  relations:
  - pref/36
  unknowns:
  - 「みよし」をひらがなとした正式な決定理由を示す協議会の一次資料は未確認
  - 三好郡の郡名の語源（両説の決着）は未確認
  updated: '2026-11-13'
- id: muni/36-松茂町
  code: '364011'
  names:
    ja: 松茂町
    reading: まつしげちょう
    aliases: []
  user_terms:
  - まつしげ
  - 徳島空港のある町
  - 堤防の松の町
  - 徳島の玄関口
  naming_type: 新規命名
  formation: 合併新設
  prefecture: 徳島県
  homonyms: []
  summary: 徳島県北東部、板野郡の町。吉野川河口の三角州の低地にあり、徳島空港を擁する。1889年に松茂村が発足し、1961年に町制を施行した。町名「松茂」は、江戸時代以降の新田開発で築いた堤防に松を多く植えたことに由来するとされる、干拓の歴史を映す名である。
  first_attestation:
    era: 明治22年
    year_western: 1889
    document: 徳島県「市・郡沿革表」
    note: 1889年10月1日に10の区域をもって松茂村が発足したことが、自治体名「松茂」の初出にあたる
  claims:
  - text: 総務省の地方公共団体コード一覧で、松茂町の団体コードは364011と定められている
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  - text: 1889年（明治22年）10月1日に松茂村が発足した
    kind: fact
    level: E2
    status: established
    sources:
    - upg-ae2-tokushima-hensen
    - q10-nii-matsushige
  - text: 1961年8月1日、松茂村が町制を施行して松茂町となった
    kind: fact
    level: E2
    status: established
    sources:
    - q4-tokushima-enkaku
    - q10-nii-matsushige
  - text: 町名「松茂」は、江戸時代以降の新田開発の際に築いた堤防に松を多く植えたことが由来であると、町の公式計画が説明する
    kind: fact
    level: E2
    status: established
    sources:
    - upg-s1-matsushige-plan
  - text: 町域の大部分は吉野川河口の三角州で、干拓による新田開発によって造成された土地である
    kind: fact
    level: E2
    status: established
    sources:
    - upg-s1-matsushige-plan
  - text: 町は徳島市・鳴門市・北島町に隣接し、徳島阿波おどり空港を擁する徳島県の玄関口である
    kind: fact
    level: E2
    status: established
    sources:
    - upg-s1-matsushige-plan
  column:
    title: 堤防の松並木が、そのまま町の名に
    text: 海を埋めて田を作る新田開発では、潮風と波から堤防を守るために松が植えられた。松茂の「松が茂る」風景は、そうして人の手で作られた護岸の緑である。できた土地の名に「新田」「浦」の痕跡を残す区域が並ぶ中で、村の名に選ばれたのは開発の象徴だった松並木だった。地名が土地の作られ方を記録する好例である。
    sources:
    - q10-wiki-matsushige
  relations:
  - pref/36
  - muni/36-北島町
  unknowns:
  - 1889年に「松茂」の字が選ばれた経緯を示す当時の記録は未確認
  updated: '2026-11-13'
- id: muni/36-板野町
  code: '364045'
  names:
    ja: 板野町
    reading: いたのちょう
    aliases: []
  user_terms:
  - いたの
  - 遍路の町
  - 板野郡の町
  - 札所が3つある町
  naming_type: 新規命名
  formation: 合併新設
  prefecture: 徳島県
  homonyms: []
  summary: 徳島県北東部、板野郡の町。阿讃山脈の麓にあり、1955年に板西町・松坂村・栄村が合併して発足した。新町名には、3町村すべてが属していた郡の名「板野」が採用された。郡名「板野」は律令制以来の阿波国の郡名に遡る古い名で、町内には四国八十八箇所の札所が3か寺ある遍路の町でもある。
  first_attestation:
    era: 昭和30年
    year_western: 1955
    document: 徳島県「市・郡沿革表」
    note: 1955年2月11日に板西町・松坂村・栄村が合併して「板野町」として発足したことが町名の初出にあたる。地名「板野」自体は律令郡名に遡る
  claims:
  - text: 総務省の地方公共団体コード一覧で、板野町の団体コードは364045と定められている
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  - text: 1955年2月11日、板西町・松坂村・栄村が合併して板野町が発足した
    kind: fact
    level: E2
    status: established
    sources:
    - q4-tokushima-enkaku
    - q10-nii-itano
  - text: 合併した3町村はいずれも板野郡に属しており、新町名には郡名「板野」が採用された
    kind: fact
    level: E2
    status: established
    sources:
    - q4-tokushima-enkaku
    - q10-wiki-itano
  - text: 板西村は1908年7月29日に町制を施行して板西町となったが、その読みは「いたにし」ではなく「ばんざいちょう」であった
    kind: fact
    level: E2
    status: established
    sources:
    - upg-s1-banzai-geoshape
    - upg-s1-itano-nipponica
  - text: 板野郡は鎌倉時代前期までに板東郡と板西郡に分割され、寛文4年（1664年）に両郡が合併して板野郡が再置された
    kind: fact
    level: E3
    status: established
    sources:
    - upg-s1-itano-gun-taikei
  - text: 律令制の時代には当地に板野郡衙が置かれたとされ、古くから交通の要衝であった
    kind: fact
    level: E5
    status: established
    sources:
    - q10-wiki-itano
  - text: 町内には四国八十八箇所の寺院が3つ所在し、遍路の歴史が深い町である
    kind: fact
    level: E3
    status: established
    sources:
    - upg-s1-henro-taikei
  column:
    title: 「ばんざい」と読んだ町と、郡名への回帰
    text: 板野町の前身の一つ・板西町は、「板西」を音読みで「ばんざい」と読む難読の町名だった。「板」には「バン」という読みがあるとはいえ、初めて見る人はまず読めない。1955年の合併で新しい町の名に選ばれたのは、その板西でも松坂でも栄でもなく、千年以上の履歴を持つ郡名「板野」だった。3町村のどれの名でもない「郡の名」を掲げることで、対立のない統合を図る、昭和の大合併らしい知恵である。
    sources:
    - q10-wiki-banzai
    - q4-tokushima-enkaku
  relations:
  - pref/36
  - muni/36-上板町
  unknowns:
  - 郡名「板野」自体の語源は、角川日本地名大辞典・日本歴史地名大系等の専門資料での確認が未了
  - 1955年の合併で郡名を新町名に採用した協議の経緯は未確認
  updated: '2026-11-13'
- id: muni/36-海陽町
  code: '363880'
  names:
    ja: 海陽町
    reading: かいようちょう
    aliases: []
  user_terms:
  - かいよう
  - 徳島県最南端の町
