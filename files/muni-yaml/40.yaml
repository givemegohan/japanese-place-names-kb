  - 鞍橋君
  naming_type: 旧行政区画名の継承
  naming_note: 1955年の剣町・西川村・古月村の合併に際し、公募で郡名「鞍手」を新町名に決定した
  formation: 合併新設
  prefecture: 福岡県
  homonyms: []
  summary: 鞍手郡の町で、町名は1955年の合併時に公募で選ばれた郡名である。その郡名の由来として町が語るのは、『日本書紀』の伝承に現れる筑紫国造「鞍橋君（くらじのきみ）」の物語で、「くらじ」が転じて「くらて」になったという。合併した剣町・西川村・古月村のいずれの名でもない、郡の名が新町の名になった。
  first_attestation:
    era: 奈良時代
    year_western: 720
    document: 『日本書紀』（鞍橋君の伝承）
    note: 由来譚の典拠としての初出層であり、地名「鞍手」そのものの初出ではない。郡名「鞍手」の文献上の初出は確認できなかった
  claims:
  - text: 鞍手町の地方公共団体コードは404021である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  - text: 町公式は町名の由来を『日本書紀』に記されている伝承に求め、欽明天皇の命を受けた筑紫国造が百済の皇太子・餘昌（のちの威徳王）を新羅の騎馬兵から救い出す功績を挙げたと伝える
    kind: legend
    level: E2
    status: established
    sources:
    - r6-kurate-youran
  - text: その功績により餘昌は筑紫国造に「鞍橋君（くらじのきみ）」の尊称を授けたとされ、鞍橋とは馬の鞍骨のことで、敵の馬の鞍骨やよろいを射抜くほどの弓の名手であったことに由来すると町公式は伝える
    kind: legend
    level: E2
    status: established
    sources:
    - r6-kurate-youran
  - text: 筑紫国造が治めたこの地は「くらじ」と呼ばれるようになり、それが時を経て「くらて」へと変化し、現在の鞍手町の地名になったと町公式は伝える
    kind: legend
    level: E2
    status: established
    sources:
    - r6-kurate-youran
  - text: 鞍手町の「くらて」は「くらじ」が訛ったものとされ、町内の飯盛山にある鞍橋神社では鞍橋君が祀られている
    kind: fact
    level: E5
    status: established
    sources:
    - r6-kuraji-wiki
  - text: 現在の鞍手町は1955年（昭和30年）1月1日に剣町・西川村・古月村の1町2村が合併して誕生し、新しい町名「鞍手町」は公募により決定された
    kind: fact
    level: E2
    status: established
    sources:
    - r6-kurate-youran
  - text: 合併した剣町・西川村・古月村のいずれも「鞍手」を名乗っておらず、公募で選ばれた「鞍手」は3町村が属していた鞍手郡の郡名を採ったものと解される
    kind: fact
    level: H
    status: inferred
    sources:
    - r6-kurate-youran
  column:
    title: 公募で選ばれた、千四百年前の名
    text: 1955年の合併で、剣町・西川村・古月村は、3町村のどれか一つの名ではなく「鞍手町」を公募で選んだ。その「鞍手」の由来として町が語るのは、6世紀の筑紫国造が百済の王子を救ったという『日本書紀』の伝承である。弓の名手への褒美の名「鞍橋君」から「くらじ」、そして「くらて」へ。合併の公募が、伝説の層までつながる古い名をすくい上げた格好だ。町内の飯盛山には今も鞍橋神社が祀られている。
    sources:
    - r6-kurate-youran
    - r6-kuraji-wiki
  relations:
  - pref/40
  - muni/40-遠賀町
  unknowns:
  - 『日本書紀』の鞍橋君に関する記事を原文で直接確認したわけではなく、町公式資料の紹介による。また伝承の舞台が現在の鞍手町域であることの史料上の裏付けは確認できなかった
  - 郡名「鞍手」の文献上の初出（『和名類聚抄』などへの記載の有無を含む）は確認できなかった
  updated: '2026-11-13'
- id: muni/40-須恵町
  code: '403440'
  names:
    ja: 須恵町
    reading: すえまち
    aliases:
    - 須恵村
  user_terms:
  - 須恵
  - すえ
  - 須恵焼
  naming_type: 中心地名の継承
  naming_note: 1889年の6村合併に際し、構成村の一つ「須恵村」の名を新村名とした
  formation: 合併新設
  prefecture: 福岡県
  homonyms: []
  summary: 糟屋郡の町で、町名は1889年の合併で構成村の一つ須恵村の名を継いだもの。「須恵」は古代の須恵器の生産に由来するといわれるが、町自身の計画書は地名の初出が中世であることを併記しており、須恵器との直接の結びつきは確かめられていない。江戸時代に藩の御用窯で焼かれた磁器「須恵焼」も、古代の須恵器とは別のものである。
  first_attestation:
    era: 中世
    year_western: null
    document: null
    note: 町公式の総合計画は「須恵」という地名の初出は中世になっていると述べるが、具体的な文献名は示されておらず確認できなかった
  claims:
  - text: 須恵町の地方公共団体コードは403440である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  - text: 町公式の総合計画は、「須恵」という地名は古代の須恵器の生産に由来していると言われると紹介する一方で、須恵町において「須恵」という地名の初出は中世になっているとしており、須恵器生産と地名の直接の結びつきは裏付けられていない
    kind: fact
    level: E2
    status: contested
    sources:
    - r6-sue-plan
  - text: 「須恵器」という呼称自体は、奈良・平安時代に「陶器」と表記されていた土器に、釉薬をかけた陶器との混同を避けるため、後世の考古学が「須恵」の字を当てて一般化した用語である
    kind: fact
    level: E3
    status: established
    sources:
    - upg-p8-sue-kotobank-sueki
  - text: 1889年（明治22年）、佐谷村・上須恵村・須恵村・新原村・旅石村・植木村の6村が合併して「須恵村」となり、新村名は構成村の一つ「須恵村」の名を継いだ
    kind: fact
    level: E2
    status: established
    sources:
    - r6-sue-plan
  - text: 1953年（昭和28年）に町制を施行して「須恵町」となった
    kind: fact
    level: E2
    status: established
    sources:
    - r6-sue-plan
    - r6-sue-wiki
  - text: 江戸時代の17世紀中ごろ、上須恵の皿山に福岡黒田藩唯一の本格的な磁器御用窯が築かれて「須恵焼」が誕生し、明治30年代まで約150年間作られたと町公式の総合計画は述べる
    kind: fact
    level: E2
    status: established
    sources:
    - r6-sue-plan
  - text: 須恵町は町村制施行以来、一度も市町村合併を経験していない
    kind: fact
    level: E2
    status: established
    sources:
    - upg-p8-sue-geoshape
  column:
    title: 三つの「すえ」
    text: 須恵町には「すえ」が三つある。古代の土器「須恵器」、江戸時代に藩の御用窯で焼かれた磁器「須恵焼」、そして地名の「須恵」。似た名が重なるため地名は須恵器から来たと思われがちだが、町の計画書自身が「地名の初出は中世」と留保し、「須恵器」という言葉自体も後世の学者が作った当て字だとされる。名の連想は魅力的だが、証拠の上では三つの「すえ」は切り分けて考えるべきものとして残っている。
    sources:
    - r6-sue-plan
    - r6-sueki-wiki
  relations:
  - pref/40
  unknowns:
  - 地名「須恵」の中世の初出とされる具体的な文献・文書名は確認できなかった
  - 須恵焼の御用窯の設置時期は、町公式の総合計画が「17世紀中ごろ」とする一方、1764年の設置とする百科事典的な記述もあり、資料により異なる
  updated: '2026-11-13'
- id: muni/40-飯塚市
  code: '402052'
  names:
    ja: 飯塚市
    reading: いいづかし
    aliases:
    - 飯塚町
    - 飯塚宿
  user_terms:
  - 炭都いいづか
  - 筑豊の商都
  - 長崎街道の宿場町
  - 嘉穂劇場のまち
  naming_type: 中心地名の継承
  formation: 合併新設
  prefecture: 福岡県
  homonyms: []
  summary: 福岡県中央部、遠賀川流域に位置する筑豊地方の中心市。市名「飯塚」の由来は定かでなく、飯塚市公式は、神功皇后が兵士との別れに言った「いつか」がなまったとする説と、聖光上人が明星寺の再建の際に余った飯を塚に積んだ「飯の塚」説の、二つの伝説を紹介する。江戸時代は長崎街道の飯塚宿として、明治以後は筑豊炭田の商業の中心として栄え、1932年に市制を施行、2006年に筑穂町・穂波町・庄内町・頴田町と合併した。
  first_attestation:
    era: null
    year_western: null
    document: null
    note: 「飯塚」の文献上の確実な初出は確認できなかった。地名の伝説は建久8年（1198）の聖光上人による明星寺の復興に結び付けられる
  claims:
  - text: 飯塚市の地方公共団体コードは402052である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  - text: 神功皇后がこの地で兵士たちと別れる際「いつか再びお会いしたい」と言って別れを惜しんだことが「いつか」と伝わり、それがなまって「飯塚」になったという伝説が伝わる
    kind: legend
    level: E2
    status: contested
    sources:
    - r3-iizuka-yurai
    - r3-iizuka-kanko
  - text: 聖光上人が明星寺の再建を指揮した際、炊いたご飯が余って塚のように積み上げられたことから「飯の塚（めしのつか）」と呼ばれ、「飯塚」になったという伝説が伝わり、市内には地名発祥の地とされる「飯の山」がある
    kind: legend
    level: E2
    status: contested
    sources:
    - r3-iizuka-yurai
    - r3-iizuka-kanko
  - text: 『日本歴史地名大系』も、市名は明星寺造営の際にできた「飯の塚」と、神功皇后が兵士との離別のときに言ったと伝える「何日（いつか）」の言葉に由来するという伝承を紹介するにとどまり、文献に基づく語源は確定していない
    kind: fact
    level: E3
    status: indeterminate
    sources:
    - r3-iizuka-kotobank
  - text: 江戸時代、飯塚は長崎街道の宿場町（飯塚宿）として栄え、遠賀川の水運の拠点でもあった
    kind: fact
    level: E2
    status: established
    sources:
    - r3-iizuka-chushinshi
  - text: 明治14年（1881）に市域の目尾炭坑で筑豊初の蒸気ポンプによる揚水が成功するなど、市は筑豊炭田の商業の中心として発展し、飯塚市立図書館のデジタルミュージアムは当時の姿を「炭都の記憶」として伝えている
    kind: fact
    level: E2
    status: established
    sources:
    - r3-iizuka-museum
    - r3-iizuka-chushinshi
  - text: 1932年（昭和7年）に市制を施行して飯塚市となった
    kind: fact
    level: E3
    status: established
    sources:
    - r3-iizuka-kotobank
  - text: 2006年3月26日に飯塚市・筑穂町・穂波町・庄内町・頴田町が合併して、現在の飯塚市となった
    kind: fact
    level: E2
    status: established
    sources:
    - r3-iizuka-kokudo
  column:
    title: 皇后の「いつか」と、上人の余り飯
    text: 飯塚の名の由来は、二つの物語の競演である。一つは、神功皇后が兵士との別れに言った「いつか（再び会いたい）」がなまったという説。もう一つは、明星寺を再建した聖光上人のもとで炊かれた飯が余り、塚のように積まれたという「飯の塚」説で、市内には発祥の地とされる「飯の山」まである。どちらも文献で裏付けられた語源ではないが、遠賀川の宿場町らしい「人と食」の記憶が、名前の物語として残った。
    sources:
    - r3-iizuka-yurai
    - r3-iizuka-kanko
  relations:
  - pref/40
  unknowns:
  - 中世の荘園名など、「飯塚」の文献上の初出は確認できなかった
  - 市制施行の正確な日付（1932年1月20日）は、個人が編纂した市名一覧でしか確認できなかった
  updated: '2026-11-13'
- id: muni/40-香春町
  code: '406015'
  names:
    ja: 香春町
    reading: かわらまち
    aliases:
    - 鹿春郷
    - 香春宮
  user_terms:
  - 香春
  - かわら
  - 香春岳
  - 採銅所
  naming_type: 中心地名の継承
  naming_note: 1956年の香春町・勾金村・採銅所村の合併に際し、旧香春町の名を継承した
  formation: 合併新設
  prefecture: 福岡県
  homonyms: []
  summary: 田川郡の町で、町名は8世紀の『豊前国風土記』に「鹿春郷」と見える古い地名の継承である。語源には、金辺川の美しい「川原」に由来するという風土記以来の説明と、古代朝鮮語で銅を意味する語の転訛で、香春岳の銅と結びついた地名だという学術説とが対立する。1956年の合併では、銅を採る役所を思わせる「採銅所村」も相手に含まれていた。
  first_attestation:
    era: 奈良時代
    year_western: null
    document: 『豊前国風土記』逸文（田川郡鹿春郷）
    note: 町公式は「初めて公式文書に登場するのは8世紀に編集された風土記」とする。風土記本文は逸文としてのみ伝わり、成立年次も諸説あるため西暦年は特定しない
  claims:
  - text: 香春町の地方公共団体コードは406015である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  - text: 「香春」の名が公式文書に初めて現れるのは8世紀に編集された『豊前国風土記』であり、「鹿春郷」と記されたと町公式は述べる
    kind: fact
    level: E2
    status: established
    sources:
    - r6-kawara-town-intro
  - text: 町公式によれば、地名の漢字表記は河原・鹿春・清河原・加波流・賀春・香春・香原など多様に書き残され、『豊前国風土記』はその語源を金辺川（清瀬川）の美しい「川原」に求め、『和名類聚抄』は田川郡香春郷を「加波留（カハラ）」と訓じた
    kind: fact
    level: E2
    status: established
    sources:
    - r6-kawara-town-intro
  - text: 町公式は、語源について古代朝鮮語のカパル（急険な）・カグポル（金の村）という意味から来たという説も紹介している
    kind: fact
    level: E2
    status: contested
    sources:
    - r6-kawara-town-intro
  - text: 学術研究（井上孝夫）では、「香春」は古代朝鮮語で銅を意味する「カリ」「クリ」が転訛した地名であり、風土記の「清い河原」に基づくという由来は和銅6年（713年）の「郷の名は好字を書け」という命令のもとで付け替えられた説明であると解釈されている
    kind: fact
    level: E3
    status: contested
    sources:
    - r6-kawara-inoue
  - text: 学術論文と北九州市立考古博物館の展示図録が紹介するところでは、和同開珎の鋳銭のために豊前国香春岳の銅が使用されていた
    kind: fact
    level: E2
    status: established
    sources:
    - r6-kawara-inoue
  - text: 『豊前国風土記』逸文は、香春神社の第一座である辛国息長大姫大目命を朝鮮半島からの渡来神とし、新羅の神がこの地の川原に来て鹿春神になったと伝える内容を含むと、福岡県の公式観光サイトが紹介している
    kind: legend
    level: E2
    status: established
    sources:
    - r6-kawara-jinja-fukuoka
  - text: 香春神社は『延喜式』神名帳に載る豊前国田川郡の辛国息長大姫大目命神社・忍骨神社・豊比咩神社を前身とし、和銅2年（709年）に三神を合祀して「香春宮」と称したと伝えられる
    kind: fact
    level: E2
    status: established
    sources:
    - r6-kawara-jinja-fukuoka
    - r6-kawara-engishiki
  - text: 現在の香春町は1956年（昭和31年）に香春町・勾金村・採銅所村の3町村が合併して発足した
    kind: fact
    level: E2
    status: established
    sources:
    - r6-kawara-bunkazai
  column:
    title: 川原か、銅か
    text: 香春の語源は二つの物語が奪い合っている。一つは平安の昔から語られる「美しい川原」の名。もう一つは、古代朝鮮語で銅を意味する語が転じたもので、香春岳の銅を掘った渡来の人々の地名だという説である。和同開珎の銅に香春岳の銅が使われたとされ、1956年に合併した相手には「採銅所」という、いかにも銅を採る役所らしい村名まであった。「川原」説は風土記自身が語る由来だが、713年の好字令のもとで整えられた説明かもしれない。どちらが本当かは、まだ決着していない。
    sources:
    - r6-kawara-town-intro
    - r6-kawara-inoue
    - r6-kawara-bunkazai
  relations:
  - pref/40
  unknowns:
  - 和同開珎への香春岳の銅の使用について、『続日本紀』など一次史料の直接の記事は確認できなかった（学術論文・博物館図録の紹介による）
  - 語源の「川原」説と「銅」説のいずれが正しいかは決着しておらず、町公式が紹介する古代朝鮮語説の原典も確認できなかった
  - 香春と神功皇后を結びつける伝承は、参照した公的資料では確認できなかった（香春神社の祭神・辛国息長大姫大目命は朝鮮半島からの渡来神とされる）
  updated: '2026-11-13'
sources:
  b-cap-chiba-soumu-code:
    label: 総務省「地方公共団体コード一覧」
    url: https://www.soumu.go.jp/main_content/000925834.pdf
  d-cap-jlis-hyogo:
    label: 地方公共団体情報システム機構（J-LIS）「兵庫県内市町」（地方公共団体コード住所一覧）
    url: https://www.j-lis.go.jp/spd/code-address/kinki/cms_14914183.html
  f-cap-chikuzen-fudoki-zoku:
    label: 貝原益軒『筑前国続風土記』巻之三（1709年頃成立、福岡命名の経緯を記す地誌。紙資料）
