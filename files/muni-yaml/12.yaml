  prefecture: 千葉県
  homonyms: []
  summary: 千葉は古代の下総国千葉郡の郡名で、『万葉集』の防人の歌や墨書土器に約1,300年前の用例が見える。大治元年（1126年）に千葉常重がこの地に本拠を移し、地名を名字として千葉を名乗って城下の基礎を作り、明治に県庁が置かれ、大正10年（1921年）の市制施行で地名がそのまま市名に継承された。語源は、草木の生い茂る豊かな土地に好字を当てたとする市の説明があるが、諸説あるとされる。
  first_attestation:
    era: 奈良時代（8世紀）
    year_western: null
    document: 万葉集
    note: 千葉郡の防人が詠んだ歌に地名「千葉」が登場すると千葉市が紹介する、使用例の初出級資料。あわせて発掘された墨書土器の用例も市が紹介し、約1,300年の歴史が確認できるという
  claims:
  - text: 千葉市公式によれば、「千葉」という地名は古代からあり、『万葉集』で千葉郡の防人が詠んだ歌に登場するほか、発掘された墨書土器によっても、「千葉」という地名が約1,300年の歴史をもつことが確認できる
    kind: fact
    level: E2
    status: established
    sources:
    - b-chiba-city-900
  - text: 千葉市公式によれば、千葉の地名の由来は諸説あるが、草木の生い茂る豊かな土地であったことから、その意味を表す好字（たくさんを意味する「千」と、草木を意味する「葉」）を当てて「千葉」と表記したのだと考えられている
    kind: fact
    level: E2
    status: contested
    sources:
    - b-chiba-city-900
  - text: 千葉市公式によれば、平安時代後期の大治元年（1126年）6月1日、千葉常重が大椎（現在の緑区大椎町）から現在の中央区亥鼻付近に本拠を移し、千葉を名乗ったことにより、千葉の都市としての歴史が始まったと言われている
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-shi-portal
  - text: 千葉市広報によれば、この1126年の本拠移転は中世の史料『千学集抜粋』の記述によるもので、大治元年6月1日に千葉常重が現在の中央区亥鼻付近に本拠を定めてまちが成立したとされている
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-kaifu-dayori
  - text: 千葉市公式によれば、常重の子・千葉常胤は1180年に房総へ逃れてきた源頼朝をいち早く助けて鎌倉幕府の成立に大きく貢献し、千葉氏は東北から九州に至る広大な所領を持つ屈指の御家人に成長した
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-shi-portal
  - text: 千葉市議会の市政概要によれば、千葉市の市章は開祖・千葉氏の月星の紋章に千葉の「千」を入れたもので、大正10年（1921年）に市制施行を記念して制定された
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-sisei
  - text: 総務省の全国地方公共団体コードで、千葉市のコードは121002と定められている（総務省の地方公共団体コード一覧による）
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: まちを作った一族と、同じ名前の市
    text: 千葉市は2026年に「千葉開府900年」を迎えた。大治元年（1126年）に千葉常重が本拠を移して以来、都市の名と支配した一族の名が同じ「千葉」であり続けている。千葉市の担当者は「都市を作った人物である『千葉氏』と、現在の都市の名前である『千葉市』が同じであることは、大都市としては非常に珍しい」と書いている。市の紋章にも千葉氏の月星紋に「千」の字を入れたものが使われており、市名・市章・開府の記念年まで、一族の名がまちのアイデンティティとして生き続けている。
    sources:
    - b-cap-chiba-kyokucho
    - b-cap-chiba-sisei
  relations:
  - pref/12
  unknowns:
  - 「千葉」の語源について、市のいう好字説以外の説の具体的内容は、専門文献（『角川日本地名大辞典』等）で確認できなかった
  - 『万葉集』の千葉郡防人の歌の正確な巻・歌番号は、特定できなかった
  - 千葉市が市制を施行した正確な月日は、確認した市公式資料の範囲では明記されていなかった
  updated: '2026-11-13'
- id: muni/12-南房総市
  code: '122343'
  names:
    ja: 南房総市
    reading: みなみぼうそうし
    aliases:
    - 富浦町
    - 富山町
    - 白浜町
    - 千倉町
    - 丸山町
    - 和田町
    - 三芳村
  user_terms:
  - みなみぼうそう
  - 房総半島の南の市
  - 南房総
  naming_type: 方位・位置による命名
  formation: 合併新設
  prefecture: 千葉県
  homonyms: []
  summary: 南房総市は平成18年（2006年）3月20日に安房郡の富浦町・富山町・三芳村・白浜町・千倉町・丸山町・和田町の7町村が合併して発足した。「南房総」は房総半島の南部という位置を表す新市名で、合併協議では古代国名に由来する「安房（あわ）」と最終候補に残り、「南房総」が選ばれたと変遷資料に記される。当初は館山市を含む11市町村での広域合併が検討されたが実現しなかった。
  first_attestation:
    era: 平成18年
    year_western: 2006
    document: 南房総市の発足（安房7町村の新設合併）
    note: 市名「南房総」の初出。「房総」の名自体は安房・上総・下総の総称として古くから使われてきた地域名である。
  claims:
  - text: 平成18年（2006年）3月20日に安房7町村（富浦町・富山町・三芳村・白浜町・千倉町・丸山町・和田町）による合併が行われ、南房総市が誕生した（南房総市公式「歴史」）
    kind: fact
    level: E2
    status: established
    sources:
    - w4-minamiboso-city-history
  - text: 合併協議会は平成16年（2004年）12月15日に安房7町村合併協議会として設置され、平成17年（2005年）2月8日に合併協定の調印式が行われた（南房総市公式）
    kind: fact
    level: E2
    status: established
    sources:
    - w4-minamiboso-city-history
  - text: 新市名の最終候補は「南房総」と「安房（あわ）」の2点であり、「南房総市」に決定したと市区町村変遷情報に記される
    kind: fact
    level: E4
    status: established
    sources:
    - w4-minamiboso-uub
  - text: 当初は館山市・鴨川市・鋸南町・天津小湊町を含む11市町村での合併が検討されたが、館山市議会の脱退決議などを経て協議が難航し、鋸南町の離脱ののち最終的に7町村での合併となった
    kind: fact
    level: E2
    status: established
    sources:
    - upg-r3-chiba-gappei-minamiboso
  - text: この地域は718年に上総国から分かれて安房国となり、一度は廃されたものの757年に再び安房国として独立した土地であり、市名の最終候補に残った「安房」はこの国名の名である（南房総市公式「歴史」）
    kind: fact
    level: E2
    status: established
    sources:
    - w4-minamiboso-city-history
  - text: 南房総市の地方公共団体コードは122343である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: あと一歩で「安房市」だった
    text: 南房総市の名が決まる過程で、最後まで残った対抗馬は「安房（あわ）」だった。718年に国として分かれた安房国の名であり、由緒という点では申し分ない。選ばれたのは、方角と地域の総称を重ねた「南房総」の方だった。もし「安房市」が選ばれていれば、「あわし」という読みをいちいち説明しなければならない市名になっていたかもしれない。なお当初は館山市を含む11市町村の大合併が目指されたが、館山の離脱などで規模が縮み、最終的に7町村の市として出発した。
    sources:
    - w4-minamiboso-uub
    - w4-minamiboso-city-history
  relations:
  - pref/12
  unknowns:
  - 「南房総」が選ばれた理由や公募の得票数など、市名決定の詳細を示す合併協議会の一次資料は確認できていない
  - 「房総」という総称がいつ成立したか（安房・上総・下総の頭字を連ねた用例の初出）は本レコードでは確認していない
  updated: '2026-11-13'
- id: muni/12-印西市
  code: '122319'
  names:
    ja: 印西市
    reading: いんざいし
    aliases:
    - 印西町
  user_terms:
  - いんざい
  - 千葉ニュータウンの市
  - 印西
  naming_type: 旧国名・広域地名の採用
  formation: 編入合併
  prefecture: 千葉県
  homonyms: []
  summary: 「印西」は印旛郡の西部という位置を表す名で、この一帯は従来「印西地方」と呼ばれていた。昭和29年（1954年）に木下町・大森町・船穂村・永治村の一部が合併する際、新町名を住民公募し、最も希望の多かった「印西町」に決定した。平成8年（1996年）に市制を施行し、平成22年（2010年）に印旛村・本埜村を編入した。
  first_attestation:
    era: 昭和29年
    year_western: 1954
    document: 印西町の成立（合併時の住民公募による命名、印西市広報による紹介）
    note: 自治体名「印西」の初出。「印西地方」という地域の呼び名はそれ以前からあったと市の広報は説明するが、その使用開始時期は示されていない。
  claims:
  - text: 昭和29年（1954年）12月1日に木下町・大森町・船穂村・永治村の一部が合併して印西町が誕生した（印西市広報「合併特別号」）
    kind: fact
    level: E2
    status: established
    sources:
    - w4-inzai-city-gappei-pdf
  - text: 新町名「印西町」は住民から公募して決定され、この地区が印旛郡の西部に当たることから従来より「印西地方」と呼ばれ親しみ深い名称であったこと、公募の結果も「印西町」を希望するものが最も多かったことが理由として市の広報に記される
    kind: fact
    level: E2
    status: established
    sources:
    - w4-inzai-city-gappei-pdf
  - text: 平成8年（1996年）4月1日に市制を施行して印西市が誕生し、県内で31番目、全国で666番目の市となった（印西市広報）
    kind: fact
    level: E2
    status: established
    sources:
    - w4-inzai-city-gappei-pdf
  - text: 平成22年（2010年）3月23日に印旛村・本埜村を編入し、新「印西市」が誕生した（印西市広報「合併特別号」）
    kind: fact
    level: E2
    status: established
    sources:
    - w4-inzai-city-gappei-pdf
  - text: 昭和41年（1966年）に千葉県が首都圏の宅地需要に対応するため千葉ニュータウン計画を立て、市域はその開発の中核となった（印西市広報）
    kind: fact
    level: E2
    status: established
    sources:
    - w4-inzai-city-gappei-pdf
  - text: 印西市の地方公共団体コードは122319である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 公募で「方角の名前」が勝った町
    text: 1954年の合併で新町名を公募したとき、候補には木下や大森といった由緒ある旧町名もあったはずだが、選ばれたのは「印旛郡の西」という方角を示すだけの「印西」だった。市の広報によれば、もともと一帯が「印西地方」と呼ばれて親しまれていたうえ、公募でも希望が最も多かったという。2010年に印旛村・本埜村を編入したときも市名は変わらず、今度は「印旛」の名を持つ村が「印西」の市に吸収される形になった。
    sources:
    - w4-inzai-city-gappei-pdf
  relations:
  - pref/12
  unknowns:
  - 「印西地方」という呼び名がいつ頃から使われていたのか（明治期の文書等での用例）は確認できていない
  - 「印旛」自体の語源（印旛沼・印旛郡の名の由来）は本レコードの範囲では確認していない
  updated: '2026-11-13'
- id: muni/12-君津市
  code: '122254'
  names:
    ja: 君津市
    reading: きみつし
    aliases:
    - 君津町
    - 君津郡
  user_terms:
  - きみつ
  - 君津
  naming_type: 中心地名の継承
  formation: 合併新設
  prefecture: 千葉県
  homonyms: []
  summary: 市名は郡名「君津郡」に由来する。君津郡は明治に生まれた郡名で、当初は「木更津郡」と提案されていたと君津市公式は紹介する。自治体名の「君津町」は昭和18年（1943年）に周西村と八重原村の合併で初めて現れ、昭和の合併でも「君津地域の中心」であることが理由に選ばれ、昭和46年（1971年）の市制で君津市となった。郡名自体の語源は確定していない。
  first_attestation:
    era: 明治
    year_western: null
    document: 君津郡の設置（君津市公式「名前のひみつ」による紹介）
    note: 「君津」という名は郡名として明治に現れたものと市公式資料は説明する。これより古い地名としての用例は確認できなかったため、年は null とした。
  claims:
  - text: 君津市公式サイト「名前のひみつ」は、明治に生まれた「君津郡」の名は、当初は「木更津郡」と提案されていたと紹介する
    kind: fact
    level: E2
    status: established
    sources:
    - w4-kimitsu-city-namae
  - text: 自治体名としての「君津町」は、昭和18年（1943年）に周西村と八重原村が合併したときに初めて登場した（君津市公式）
    kind: fact
    level: E2
    status: established
    sources:
    - w4-kimitsu-city-namae
  - text: 1943年の「君津町」の命名理由を書いた公文書は残っておらず、「君津郡の中央を占める位置にある」と「必ず君津郡の中核に発展する」という二説が伝えられている（君津市公式。『君津町誌』（1962年）は前者の趣旨を記すと紹介される）
    kind: fact
    level: E2
    status: contested
    sources:
    - w4-kimitsu-city-namae
  - text: 昭和45年（1970年）6月には、木更津市を含めた合併後の新市名として「君津木更津市」が提案されたが、庁舎の位置と市名が折り合わず合併協議会は解散した（君津市公式）
    kind: fact
    level: E2
    status: established
    sources:
    - w4-kimitsu-city-namae
  - text: 現在の君津市のもとになった君津町は、合併関係五町村の位置が従来「君津地域」と呼ばれてきた地域の中心部にあたることを理由に「君津町」と称することとされ、市制施行後も名前が引き継がれて君津市となった（君津市公式）
    kind: fact
    level: E2
    status: established
    sources:
    - w4-kimitsu-city-namae
  - text: 君津郡は、明治30年（1897年）に望陀郡・周淮郡・天羽郡の三郡が合併して成立した郡である（『日本歴史地名大系』）
    kind: fact
    level: E3
    status: established
    sources:
    - upg-r3-kimitsu-taikei
  - text: 君津市の地方公共団体コードは122254である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 幻の「君津木更津市」
    text: 1970年、君津と木更津を含む広域合併の協議で、新しい市の名前として「君津木更津市」が提案されたことがある。両市の名を連ねた妥協案だったが、庁舎の位置と市名をめぐって折り合いがつかず、協議会自体が解散してしまった。もし実現していれば、日本でも有数の長い市名が生まれていたことになる。なお君津市公式によれば、そもそも明治に君津郡が生まれるときも当初案は「木更津郡」で、君津と木更津は郡名の段階から競い合ってきた間柄である。
    sources:
    - w4-kimitsu-city-namae
  relations:
  - pref/12
  - muni/12-木更津市
  unknowns:
  - 「君津」という語自体の語源（なぜこの字と読みが郡名に選ばれたのか）は市公式資料でも明示されておらず未確認である
  - 君津郡の発足・再編の時期については資料により表記の揺れがあり、郡区町村編制法下での郡の扱いまで遡った確認はできていない
  - 小糸川など市域の河川名と「君津」の語源的な関係は確認できなかった
  updated: '2026-11-13'
- id: muni/12-四街道市
  code: '122289'
  names:
    ja: 四街道市
    reading: よつかいどうし
    aliases:
    - 四街道町
    - 四ツ街道
    - 千代田町
    - 旭村（印旛郡）
  user_terms:
  - よつかいどう
  - 四街道
  - 四街道十字路
  naming_type: 学校名・駅名などから
  formation: 合併新設
  prefecture: 千葉県
  homonyms: []
  summary: 四街道は、成田山道・千葉町道・東金道・船橋道と四方向へ街道が分かれる十字路の呼び名に由来する。その十字路には明治14年（1881年）建立の道標石塔が現存し、市は「四街道地名発祥の地」とする。同じ1881年に郵便局名として「四街道」が認可されたのが公的な名の始まりとされ、昭和30年（1955年）に千代田町と旭村が合併して四街道町となり、昭和56年（1981年）に市制を施行した。
  first_attestation:
    era: 明治14年
    year_western: 1881
    document: 四街道十字路の道標石塔の建立と四街道郵便局の開設
    note: 十字路の呼び名としての「四つ角」「四ツ街道」はそれ以前からあったとされるが、石塔の建立と郵便局名の認可という形で「四街道」の名が公に現れるのは1881年である。
  claims:
  - text: 四街道市は、JR四街道駅の南西約500メートルにある四街道十字路を「四街道地名発祥の地」とし、文字通り4方向への道が伸びていることを公式サイトで紹介する
    kind: fact
    level: E2
    status: established
    sources:
    - w4-yotsukaido-city-chimei
  - text: 四街道十字路の傍らには明治14年（1881年）2月に建てられた駒形方形の道標石塔があり、各面に船橋道方面・千葉町道方面・東金道・馬渡道方面・成田山道方面と4つの街道の名が書き記されている（四街道市公式）
    kind: fact
    level: E2
    status: established
    sources:
    - w4-yotsukaido-city-chimei
  - text: 呼び名は「四つ角」から「四ツ街道」を経て「四街道」になったとされ、1881年に四つ角に私設郵便局が開設した際、初代局長の福島和吉が局名を「四街道」とするよう県に懇願し認可されたのが始まりとされる
    kind: fact
    level: E5
    status: established
    sources:
    - w4-yotsukaido-wiki
  - text: 古くから街道が交わる交通の要衝であったことが「四街道」の名の背景であり、『日本大百科全書（ニッポニカ）』は、地名は船橋・佐倉・東金・千葉方面への街道が交差することに由来すると説明する
    kind: fact
    level: E3
    status: established
    sources:
    - upg-r3-yotsukaido-kotobank
    - w4-yotsukaido-city-chimei
  - text: 昭和30年（1955年）3月10日に印旛郡千代田町と旭村が合併して四街道町が発足した
    kind: fact
    level: E2
    status: established
    sources:
    - upg-r3-yotsukaido-sogokeikaku
    - upg-r3-yotsukaido-geoshape-machi
    - upg-r3-yotsukaido-kotobank
  - text: 昭和56年（1981年）4月1日に市制を施行して四街道市となった
    kind: fact
    level: E2
    status: established
    sources:
    - upg-r3-yotsukaido-sogokeikaku
    - upg-r3-yotsukaido-geoshape-shi
  - text: 四街道市の地方公共団体コードは122289である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 郵便局が地名を決めた町
    text: 四街道の名は、もともと原野の中の十字路の呼び名にすぎなかった。1881年、その四つ角に私設郵便局が開かれるとき、初代局長の福島和吉が局名を「四街道」としてほしいと県に懇願し、認可されたという。郵便局の名前として公に認められたことが、土地の呼び名を公式の地名へと押し上げた。市が「地名発祥の地」とする十字路には、今も同じ年（1881年）に建てられた道標石塔が立っている。
    sources:
    - w4-yotsukaido-wiki
    - w4-yotsukaido-city-chimei
  relations:
  - pref/12
  unknowns:
  - 「四つ角」の呼び名がいつ頃からあったのか、江戸期の文書での用例は確認できていない
  - 1955年の合併の相手である印旛郡旭村は、千葉県旭市（旧・旭町）とは別の自治体であり、旭村側の町村史での確認はできていない
  updated: '2026-11-13'
- id: muni/12-多古町
  code: '123471'
  names:
    ja: 多古町
    reading: たこまち
    aliases:
    - 多胡
    - 田子
    - 多湖
    - 多古村
    - 多古藩
  user_terms:
  - 多古
  - たこ
  - 多古米
  - 多胡碑
  - 道の駅多古
  naming_type: 中心地名の継承
  naming_note: 中世以来の地名「多古（多胡）」の継承
  formation: 合併新設
  prefecture: 千葉県
  homonyms: []
  summary: 香取郡の町で、「たこ」と読む古い地名である。地名は南北朝時代に千田荘の一角に「多古」「多胡」と現れ、「田子」「多湖」とも記された。由来は定説がなく、湖が多かった地形に「多胡」の字が当てられたとする説のほか、町の広報コラムは「渡来系の人々（胡）が多かった」とする説を消去法で最も有力と紹介している。1889年（明治22年）に多古村、1891年（明治24年）に多古町となり、1951年・1954年の合併で現在の町域となった。多古米の産地として知られる。
  first_attestation:
    era: 南北朝時代
    year_western: null
    document: 千田荘の一角における「多古」「多胡」の表記
    note: 千田荘の一角に「多古」または「多胡」の地名が現れるのは南北朝時代と多古藩の解説が紹介する。具体的な文書名・年次は確認できなかった
  claims:
  - text: 千田荘の一角に「多古」または「多胡」の地名が現れるのは南北朝時代で、ほかに「田子」や「多湖」とも記された
    kind: fact
    level: E3
    status: established
    sources:
    - w11-tako-weblio-han
  - text: 地名の由来は明らかでなく、『角川日本地名大辞典』は、古代にこの地に湖が多く「多胡」となり、のち「多古」に演変したという一説を紹介するにとどまる
    kind: fact
    level: E3
    status: indeterminate
    sources:
    - w11-tako-kakugawa
    - w11-tako-wiki
  - text: 町の広報コラムは語源の候補として「湖が多い」「古い村が多い」「田を耕す人々（田子）」「渡来系の人々（胡）が多い」の諸説を検討し、消去法で渡来系の人々に由来する説を最も有力としている
    kind: fact
    level: E4
    status: contested
    sources:
    - w11-tako-koho
  - text: 群馬県には同じ「多胡」を冠する多胡郡があり、和銅6年（713年）建立の多胡碑が残るが、多古町との直接的な関係は確認されていない
    kind: fact
    level: E4
    status: established
    sources:
    - w11-tako-koho
  - text: 1889年（明治22年）に多古村が発足し、1891年（明治24年）6月に町制を施行して多古町となった
    kind: fact
    level: E2
    status: established
    sources:
    - upg-r6-tako-adeac
    - upg-r6-tako-kotobank
  - text: 1951年（昭和26年）に東条村と合併し、1954年（昭和29年）3月31日に久賀村・中村・常磐村と合併して現在の多古町となった
    kind: fact
    level: E2
    status: established
    sources:
    - upg-r6-tako-adeac
    - upg-r6-tako-kotobank
  - text: 江戸時代は久松松平家が居所を置いた多古藩の陣屋町で、現在は「多古米」のブランドで知られる米どころである
    kind: fact
    level: E3
    status: established
    sources:
    - w11-tako-weblio-han
    - w11-tako-wiki
  - text: 多古町の地方公共団体コードは123471である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 「たこ」の語源を消去法で考える
    text: 多古町の広報コラムは、町の名の語源を正面から検討している。候補は四つ。湖が多かったこと、古い村が多かったこと、田を耕す人々を指す「田子」、渡来系の人々を指す「胡」が多かったこと。コラムは、和銅6年（713年）に郷名に好字の二字を使うよう朝廷の達しが出た時代に、あえて普段使わない「胡」の字を選ぶには理由があったはずだとして、消去法で「胡」の説を残す。決定的な証拠があるわけではない。だが、自治体の広報が「分からない」を出発点に説を一つずつ潰していく姿勢は、地名の由来の誠実な扱い方の見本である。なお同じ713年には、群馬県の多胡郡に多胡碑が建てられている。
    sources:
    - w11-tako-koho
  relations:
  - pref/12
  unknowns:
  - 「多古」の語源は定説がなく、湖沼に由来する説と渡来系の人々に由来する説などが併存する
  - 南北朝時代の「多古」「多胡」の初出文書の書誌は確認できなかった
  updated: '2026-11-13'
- id: muni/12-大多喜町
  code: '124419'
  names:
    ja: 大多喜町
    reading: おおたきまち
    aliases:
    - 小田喜
    - ヲダキ
    - オダキ
    - 大多喜城下
  user_terms:
  - 大多喜
  - おおたき
  - 大多喜城の城下町
  - 房総の小江戸
  naming_type: 中心地名の継承
  naming_note: 中世の地名「小田喜」に由来する城下町名「大多喜」の継承
  formation: 合併新設
  prefecture: 千葉県
  homonyms: []
  summary: 夷隅川中流の城下町。大多喜城は本多忠勝の居城として知られるが、中世のこの地の名は「小田喜（おだき）」で、城も小田喜城と呼ばれていた。「大多喜」の表記がいつ定着したかは資料で確認できず、読み自体は江戸時代後期まで中世以来の「ヲダキ」のままであった。現在の町は1889年に生まれた大多喜町が1954年に周辺4村と合併して成立した。
  first_attestation:
    era: 中世
    year_western: null
    document: null
    note: 中世の資料に「小田喜」と見えることは千葉県立中央博物館大多喜城分館の解説で確認できるが、具体的な文書名・年代は特定できていない。「大多喜」表記の初出も未確認
  claims:
  - text: 中世の資料ではこの地は「小田喜（おだき）」と記され、城も小田喜城ないし小田喜の城と呼ばれていたと、千葉県立中央博物館大多喜城分館が解説する
    kind: fact
    level: E2
    status: established
    sources:
    - w12-otaki-muse
  - text: 大永元年（1521年）、真里谷武田氏の信清が上総国小田喜の地に城を築いたといわれる
    kind: fact
    level: E2
    status: established
    sources:
    - w12-otaki-town-yoran
  - text: 天正18年（1590年）、徳川四天王の一人である本多忠勝が10万石で入封し、戦国期の小田喜城下を継承して大多喜城の城下町を形成した
    kind: fact
    level: E3
    status: established
    sources:
    - w12-otaki-kotobank-taikei
  - text: ただし天正18年の入封の時点でも城は「小田喜城」と呼ばれており（千葉県立中央博物館の解説）、「小田喜」から「大多喜」への表記変更がいつ・なぜ行われたかを示す資料は確認できない
    kind: fact
    level: E2
    status: indeterminate
    sources:
    - w12-otaki-muse
  - text: 『日本歴史地名大系』は、城下町は大多喜町とも称されるが、江戸時代後期においても地名の読みは中世以来の「ヲダキ」であったと記す
    kind: fact
    level: E3
    status: established
    sources:
    - w12-otaki-kotobank-taikei
  - text: 明治22年（1889年）の町村制施行で大多喜町・上瀑村・総元村・西畑村・老川村が生まれ、昭和29年（1954年）10月5日にこの5か町村が合併して現在の大多喜町が誕生した
    kind: fact
    level: E2
    status: established
    sources:
    - w12-otaki-town-plan
    - w12-otaki-kotobank-nipponika
  - text: 慶長14年（1609年）に御宿沖で遭難したスペインのドン・ロドリゴ一行は大多喜城に迎えられて城主本多忠朝の歓待を受け、この出来事は日本とメキシコの交流の起点とされる
    kind: fact
    level: E2
    status: established
    sources:
    - w12-otaki-muse
  - text: 大多喜町の地方公共団体コードは124419である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 海を渡った縁――ドン・ロドリゴとメキシコ通り
    text: 慶長14年（1609年）、スペイン船サンフランシスコ号が御宿の岩和田沖で遭難し、300人を超える乗員が地元の人々に救助された。一行を率いたドン・ロドリゴは大多喜城に招かれ、城主の本多忠朝に歓待されたと伝わる。千葉県の民話集はこの顚末を物語として収めているが、ロドリゴ自身が帰国後に見聞録を残した実在の出来事である。この縁は今も生きていて、大多喜町には「メキシコ通り」という名の道があり、町は1978年にメキシコのクエルナバカ市と姉妹都市を結んでいる。城下町の名の由来をたどるはずが、太平洋を越えた交流史に行き当たるのも房総の町らしいところである。
    sources:
    - w12-otaki-chiba-minwa
    - w12-otaki-town-plan
  relations:
  - pref/12
  - muni/12-御宿町
  unknowns:
  - 「小田喜」から「大多喜」への表記変更の正確な時期と経緯。本多忠勝が「大いに喜ぶ地であるように」と願って改めたとする言い伝えは、町公式・専門資料では確認できなかった
  - 「オダキ（小田喜）」という地名自体の語源（地形・水名などに由来するか）は専門資料でも確定していない
  - 中世資料における「小田喜」の具体的な初出文書名と年代
  updated: '2026-11-13'
- id: muni/12-大網白里市
  code: '122394'
  names:
    ja: 大網白里市
    reading: おおあみしらさとし
    aliases:
    - 大網白里町
    - 大網町
    - 白里町
    - 大網郷
  user_terms:
  - おおあみしらさと
  - 大網
  - 白里海岸
  naming_type: 合成地名
  formation: 合併新設
  prefecture: 千葉県
  homonyms: []
  summary: 大網白里市は、昭和29年（1954年）に大網町・増穂村・白里町が合併して生まれた大網白里町が、平成25年（2013年）に市制を施行したもので、市名は旧町名「大網」と「白里」を連ねた合成名である。大網は中世以来の大網郷の名で、文禄元年（1592年）の『家忠日記』に「大あミ」と見える。白里は九十九里浜にちなむ名で、「百」から「一」を取ると「白」になるという命名の説明が伝えられる。
  first_attestation:
    era: 文禄元年
    year_western: 1592
    document: 『家忠日記』文禄元年12月6日条「大あミ」（『日本歴史地名大系』が紹介）
    note: 「大網」の用例として専門辞典が紹介するもので、文書そのものは二次資料経由の確認である。なお「白里」の名は明治22年（1889年）の白里村発足に始まる。
  claims:
  - text: 昭和29年（1954年）に大網町・増穂村・白里町が合併して大網白里町が誕生し、平成25年（2013年）1月1日に市制を施行して大網白里市となった（大網白里市公式統計書「データ大網白里」）
    kind: fact
    level: E2
    status: established
    sources:
    - w4-oami-city-data
  - text: 『日本歴史地名大系』は、文禄元年（1592年）の『家忠日記』に「大あミ」とあること、文禄3年の上総国村高帳に大網村の村名が見えることを紹介する
    kind: fact
    level: E3
    status: established
    sources:
    - w4-kotobank-oami
  - text: 中世の天正19年（1591年）には「山野辺之庄大網郷」が見え、正保国絵図には大網町、寛文5年（1665年）の朱印状には大網郷とあるなど、大網は近世を通じてこの地の中心的な地名であった（『日本歴史地名大系』の紹介）
    kind: fact
    level: E3
    status: established
    sources:
    - w4-kotobank-oami
  - text: 白里の名は九十九里浜に由来し、漢字の「百」から「一」を取ると「白」となるからであると説明される（大網白里町の市制施行名称検討委員会の資料を引く紹介による）
    kind: fact
    level: E5
    status: established
    sources:
    - w4-shirasato-wiki
  - text: 白里村は明治22年（1889年）4月1日に発足し、昭和10年（1935年）8月10日に町制を施行して白里町となった
    kind: fact
    level: E2
    status: established
    sources:
    - upg-r3-shirasato-geoshape-mura
    - upg-r3-shirasato-geoshape-machi
  - text: 明治2年（1869年）から明治4年（1871年）までの間、宮谷県の県庁が本国寺に置かれ、この地が県政の中心地となった時期がある（大網白里市公式統計書）
    kind: fact
    level: E2
    status: established
    sources:
    - w4-oami-city-data
  - text: 大網白里市の地方公共団体コードは122394である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 「百」から「一」を引くと「白」
    text: 白里という名の説明は、ちょっとした文字遊びである。東に広がる九十九里浜の「九十九里」から「里」を取り、「百」の字から「一」を引くと「白」になる。だから白里。九十九里そのものを名乗る隣の九十九里町とは対照的に、数字を分解して作られた地名である。この説明は、大網白里町が市制を施行する際に名称を検討した委員会の資料でも紹介されていたという。1889年に白里村が生まれたとき、すでにこの理屈で名が付けられたと伝えられる。
    sources:
    - w4-shirasato-wiki
  relations:
  - pref/12
  unknowns:
  - 「大網」の語源（大きな漁網や網代に由来するのか等）は、確認した『日本歴史地名大系』の抜粋範囲では明示されておらず未確認である
  - 「百から一を取って白」という白里の命名説は名称検討委員会資料を引く二次的な紹介に依拠しており、明治22年当時の記録そのものは確認できていない
  - 増穂村など合併した他の旧村名の由来は本レコードでは扱っていない
  updated: '2026-11-13'
