prefecture_code: '12'
records:
- id: muni/12-いすみ市
  code: '122386'
  names:
    ja: いすみ市
    reading: いすみし
    aliases:
    - 夷隅町
    - 大原町
    - 岬町
    - 夷隅郡
    - 伊甚
  user_terms:
  - いすみ
  - 夷隅
  - 千葉県で唯一の平仮名の市
  naming_type: 旧行政区画名の継承
  formation: 合併新設
  prefecture: 千葉県
  homonyms: []
  summary: 房総半島南東部、太平洋に面する市。2005年12月5日に夷隅町・大原町・岬町の3町が合併して発足した。市名は旧郡名「夷隅」の読みを平仮名で表記したもので、千葉県内の現行市町村で平仮名を用いる自治体名は同市のみである。「夷隅」の地名は『古事記』の「伊自牟」、『日本書紀』の「伊甚」に遡る古い名で、漢字表記は江戸時代に多用されるようになった。
  first_attestation:
    era: null
    year_western: 712
    document: 『古事記』（「伊自牟（いじむ）」の表記として紹介される）
    note: 地域の古名の初出とされるもの。読みは「いじむ／いじみ」で現在の「いすみ」とは異なる。「夷隅」の漢字表記は江戸時代に多用されるようになったと『日本歴史地名大系』は記す。
  claims:
  - text: 2005年（平成17年）12月5日に夷隅郡夷隅町・大原町・岬町が合併して、いすみ市が誕生した
    kind: fact
    level: E2
    status: established
    sources:
    - w3-isumi-city-plan
  - text: 市名「いすみ市」は、当初検討された大多喜町・御宿町を含む5町の合併枠組みの段階で、合併期日とともに既に合意されていた名称であり、枠組みが3町に縮小して再出発した後も引き継がれた
    kind: fact
    level: E2
    status: established
    sources:
    - w3-isumi-chiba-keii
  - text: 市名は旧郡名「夷隅」の読みを平仮名で表記したもので、千葉県内の現行市町村で名前に平仮名を用いるのはいすみ市のみである
    kind: fact
    level: E2
    status: established
    sources:
    - w3-isumi-chiba-keii
    - upg-r10-isumi-taikei-gun
    - b-cap-chiba-soumu-code
  - text: 「夷隅」の地名は古くは『古事記』に「伊自牟（いじむ）」、『日本書紀』に「伊甚（いじみ）」として登場し、『日本歴史地名大系』によれば、『日本書紀』には朝廷の直轄地である伊甚屯倉が分れて夷隅郡になったと記される
    kind: fact
    level: E3
    status: established
    sources:
    - upg-r10-isumi-taikei-gun
    - upg-r10-isumi-city-history
  - text: 郡名には「夷灊」など様々な当て字が用いられてきたが、「夷隅」の字は江戸時代には多用されるようになったと、『日本歴史地名大系』は記す
    kind: fact
    level: E3
    status: established
    sources:
    - upg-r10-isumi-taikei-gun
    - upg-r10-isumi-city-history
  - text: 合併した旧町の一つである夷隅町は、1954年（昭和29年）4月に国吉町・中川村・千町村が合併して生まれた町である
    kind: fact
    level: E2
    status: established
    sources:
    - w3-isumi-ndl
  - text: 総務省の全国地方公共団体コードで、いすみ市の団体コードは122386と定められている
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 消えた合併枠組みから残った名前
    text: 「いすみ市」という名前は、2度の合併協議の崩壊を生き延びた。最初は勝浦市を含む1市5町の大きな枠組みが2003年に解散し、次に大多喜町・御宿町を加えた5町の枠組みで「名称はいすみ市」と合意まで漕ぎ着けながら、大多喜町議会の反対で2004年に崩れた。それでも2005年3月に夷隅町・大原町・岬町の3町で協議が再出発したとき、新市の名前には合意済みの「いすみ市」がそのまま残された。旧郡名「夷隅」は難読のためか漢字では書かれず、平仮名の自治体名として発足し、現在も県内の現行市町村で平仮名の名は同市のみである。「夷隅」の読み自体は『古事記』の「伊自牟（いじむ）」に遡る古い音であり、平仮名の新しさと音の古さが同居している。
    sources:
    - w3-isumi-chiba-keii
    - w3-isumi-wiki
    - w3-isumi-wiki-gun
  relations:
  - pref/12
  unknowns:
  - 「夷隅（いじむ／いすみ）」という音自体の語源は未確認（夷隅川の蛇行に結びつける説などがあるが、いずれも裏付けのある専門資料では確認できなかった）
  - 市名を漢字の「夷隅市」でなく平仮名の「いすみ市」とした理由を明記した合併協議会の公式資料は未確認（難読への配慮と推測されるが、断定できる資料は見つからなかった）
  - 『古事記』『日本書紀』の「伊自牟」「伊甚」の記載は『日本歴史地名大系』と市公式の解説で確認したが、原典そのものは未読
  updated: '2026-11-13'
- id: muni/12-一宮町
  code: '124214'
  names:
    ja: 一宮町
    reading: いちのみやまち
    aliases:
    - 一宮本郷村
    - 一宮庄
    - 一宮藩
  user_terms:
  - 一宮
  - いちのみや
  - 上総一ノ宮
  - 玉前神社
  - 上総一ノ宮駅
  - サーフィンの町
  naming_type: 中心地名の継承
  naming_note: 上総国一宮・玉前神社の門前一帯の地名「一宮」の継承
  formation: 合併新設
  prefecture: 千葉県
  homonyms:
  - muni/23-一宮市
  summary: 長生郡の町で、町名は町内の玉前神社が上総国の一宮（その国で最も格式の高い神社）であったことに由来する。神社の周辺は中世に一宮庄と呼ばれて「一宮」の地名が定着し、1890年（明治23年）に一宮本郷村が町制を施行して一宮町となった。1953年（昭和28年）に東浪見村と合併し、その後の編入を経て現在の町域となった。愛知県一宮市も尾張国一宮に由来する同名の自治体で、由来の仕組みは同じだが別の国の一宮である。
  first_attestation:
    era: 中世
    year_western: null
    document: 一宮庄の用例
    note: 玉前神社の一帯が一宮庄（玉前庄）と呼ばれたことに地名「一宮」が由来する。具体的な初出文書・年次は確認できなかった
  claims:
  - text: 町名「一宮」は、玉前神社が上総国の一ノ宮に選ばれたことにより、この地が一宮と呼ばれるようになったことに由来する
    kind: fact
    level: E4
    status: established
    sources:
    - w11-ichinomiya-jre
    - w11-ichinomiya-wiki
  - text: 玉前神社は平安時代にまとめられた『延喜式』神名帳では名神大社とされ、上総国一之宮の格式を保ってきたが、永禄年間の戦火で社殿・宝物・文書の多くを焼失し、創建の由来は明らかでないと神社公式サイトが伝える
    kind: fact
    level: E4
    status: established
    sources:
    - w11-tamasaki-mikadokai
  - text: この地は玉前神社の神領を基盤とする玉前庄（玉崎庄）となり、南北朝時代以降は一宮庄と呼ばれるようになった
    kind: fact
    level: E3
    status: established
    sources:
    - upg-r6-tamasaki-sho
  - text: 1890年（明治23年）10月27日に一宮本郷村が新笈村と合併し、町制を施行して一宮町となった
    kind: fact
    level: E2
    status: established
    sources:
    - upg-r6-ichinomiya-yoran
    - upg-r6-ichinomiya-geoshape
  - text: 1953年（昭和28年）に東浪見村と合併して一宮町が新設され、1954年に船頭給、1955年に新地・宮原が長生村から編入されて、現在の一宮町となった
    kind: fact
    level: E2
    status: established
    sources:
    - upg-r6-ichinomiya-yoran
    - upg-r6-ichinomiya-bunkazai
  - text: 幕末には加納氏の一宮藩が置かれ（文政9年・1826年に陣屋が設けられた）、最後の藩主となった加納久宜は、明治45年（1912年）に一宮町長に就任した
    kind: fact
    level: E2
    status: established
    sources:
    - upg-r6-ichinomiya-jinya
    - upg-r6-ichinomiya-yoran
    - upg-r6-ichinomiya-bunkazai
  - text: 玉前神社の例祭である上総十二社祭りは、大同2年（807年）に始まったと伝えられている
    kind: legend
    level: E2
    status: established
    sources:
    - upg-r6-tamasaki-12sai
  - text: 一宮町の地方公共団体コードは124214である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 国ごとにあった「一宮」という名
    text: 「一宮」は固有名詞のようでいて、もとは普通名詞である。律令国のそれぞれに、その国で最も格式の高い神社が「一宮」と呼ばれ、その門前や社領の地名に「一宮」の名が残った。千葉県一宮町の玉前神社は上総国の一宮、愛知県一宮市の真清田神社は尾張国の一宮で、遠く離れた両自治体は同じ仕組みで生まれた同名である。一宮町では毎年9月に玉前神社の例祭「上総十二社祭り」が行われ、九十九里浜を裸の男たちが神輿を担いで駆ける。神社の公式サイトも創建は明らかでないとする古社が、「一宮」という国の格付けの名を町に残したのである。
    sources:
    - w11-ichinomiya-wiki
    - w11-tamasaki-mikadokai
  relations:
  - pref/12
  - muni/23-一宮市
  - muni/12-九十九里町
  unknowns:
  - 「一宮庄」の初出文書と年次は確認できなかった
  - 玉前神社の創建年代は、永禄年間の戦火で古文書が焼失したため、神社自身も明らかでないとしている
  updated: '2026-11-13'
- id: muni/12-九十九里町
  code: '124036'
  names:
    ja: 九十九里町
    reading: くじゅうくりまち
    aliases:
    - 片貝町
    - 豊海町
  user_terms:
  - 九十九里
  - くじゅうくり
  - 九十九里浜
  - イワシの町
  - 片貝
  - 矢指ヶ浦
  naming_type: 自然地名から
  naming_note: 1955年の合併で、九十九里浜の名を新しい町名に採用
  formation: 合併新設
  prefecture: 千葉県
  homonyms: []
  summary: 山武郡の町で、町名は日本最大級の砂浜海岸である九十九里浜に由来する。1955年（昭和30年）に片貝町・豊海町・鳴浜村の一部が合併した際、構成町村の名ではない「九十九里」が新しい町名に選ばれた。浜の名は、源頼朝の命で1里ごとに矢を刺して測ったら99本だったという伝承で知られるが、その「里」は6町を1里とする古い単位で、99里は実際の浜の長さ約66kmとほぼ一致する。
  first_attestation:
    era: 昭和30年
    year_western: 1955
    document: 九十九里町の発足（片貝町・豊海町・鳴浜村一部の新設合併）
    note: 自治体名としての初出。浜の名「九十九里」は近世には広く用いられており、古名は『日本書紀』景行天皇紀の「玉浦」とも伝えられる
  claims:
  - text: 1955年（昭和30年）3月31日、片貝町・豊海町および鳴浜村の一部（作田）の新設合併により九十九里町が発足し、町名は町の面する九十九里浜の名から採られた
    kind: fact
    level: E2
    status: established
    sources:
    - upg-r6-kujukuri-town
    - upg-r6-kujukuri-nipponica
  - text: 九十九里浜は刑部岬から太東崎まで弓形に約66km続く、日本最大級の砂浜海岸である
    kind: fact
    level: E2
    status: established
    sources:
    - w11-kujukuri-ndl
  - text: 浜の古名は『日本書紀』景行天皇紀に見られる「玉浦（玉の浦）」であると紹介される
    kind: fact
    level: E5
    status: established
    sources:
    - w11-kujukuri-wiki-hama
  - text: 源頼朝の命で、6町を1里として1里ごとに矢を刺して測ったところ99里あったことから、九十九里浜、矢指ヶ浦と命名されたという伝説がある
    kind: legend
    level: E2
    status: established
    sources:
    - w11-kujukuri-ndl
  - text: 伝承の「里」は1町を約109mとする古い単位で、99里は約65kmとなり、実際の浜の長さとほぼ一致する
    kind: fact
    level: E2
    status: established
    sources:
    - w11-kujukuri-ndl
  - text: 浜の中央にあたるとされる山武市蓮沼（旧蓮沼村）には箭挿神社があり、この一帯は「矢指浦」とも呼ばれた
    kind: fact
    level: E2
    status: established
    sources:
    - upg-r6-yasashi-sammu
    - upg-r6-kujukuri-hama-kotobank
  - text: 町の中心である片貝は、近世からイワシ漁の中心地として知られ、江戸時代には紀州から伝えられた地引網によるイワシ漁と干鰯（ほしか）の生産でにぎわった
    kind: fact
    level: E3
    status: established
    sources:
    - upg-r6-kujukuri-kotobank
    - upg-r6-kujukuri-nipponica
  - text: 九十九里町の地方公共団体コードは124036である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 99本の矢と、消えた「里」の物差し
    text: 九十九里浜の名は伝説の数字だが、計算してみると妙に正確である。頼朝が1里ごとに矢を立てさせたら99本だった、という言い伝えに使われる「里」は、明治以降の1里（約3.9km）ではない。6町を1里とする古い里（1町は約109m、1里は約654m）で数え直すと、99里は約65kmとなり、刑部岬から太東崎まで約66kmの実際の海岸線とほぼ重なる。伝説のほうが間違っていたのではなく、物差しの単位が時代とともに変わってしまったために、「ありえない数字」に見えるようになったのである。1955年に生まれた九十九里町は、この伝説の数字をそのまま町名に受け継いだ。
    sources:
    - w11-kujukuri-ndl
  relations:
  - pref/12
  - muni/12-一宮町
  unknowns:
  - 1955年の合併時に新町名「九十九里」が選ばれた手続き（公募か協議か）の詳細は確認できなかった
  - 「九十九里」の呼称が文献に現れる最古の例は確認できなかった
  updated: '2026-11-13'
- id: muni/12-佐倉市
  code: '122122'
  names:
    ja: 佐倉市
    reading: さくらし
    aliases:
    - 佐倉町
  user_terms:
  - 佐倉ってどういう意味
  - 老中の城のまち
  - 佐倉順天堂のまち
  - さくらの語源
  naming_type: 中心地名の継承
  formation: 合併新設
  prefecture: 千葉県
  homonyms: []
  summary: 市名は佐倉町以来の地名「佐倉」を継いだもの。語源は、麻布を納めた倉「アサクラ」が転じたとする説と、清い倉の意の「さ＋倉」とする説が市公式に紹介されるが、確定していない。江戸時代は佐倉藩の城下町として栄え、1954年に佐倉町など6町村が合併して市制を施行した。
  first_attestation:
    era: 慶長15年
    year_western: 1610
    document: 土井利勝の佐倉入封（佐倉市公式資料）
    note: 城下町としての佐倉の画期。地名「佐倉」自体の文書上の初出は特定できなかった
  claims:
  - text: 佐倉市公式は、「佐倉」の由来として、この地で生産された麻布を朝廷に献上するための貯蔵庫があったことから「アサクラ」が転じて「サクラ」になったという説を紹介する
    kind: fact
    level: E2
    status: contested
    sources:
    - m5-sakura-city-profile
  - text: 同公式はもう一つの説として、清い倉があったことから、すがすがしい語感をもつ「さ」という言葉をつけて「さくら」と呼ぶようになったという説を併記する
    kind: fact
    level: E2
    status: contested
    sources:
    - m5-sakura-city-profile
  - text: 1610年（慶長15年）に老中・土井利勝が徳川家康の命により佐倉に配され、翌年から7年をかけて佐倉城を築城し、城下町が形成された（佐倉市公式）
    kind: fact
    level: E2
    status: established
    sources:
    - m5-sakura-city-jokamachi
  - text: 佐倉城には幕府の老中職についた大名が徳川諸藩中最多を数えたことから、俗に「老中の城」とも呼ばれた（佐倉市公式）
    kind: fact
    level: E2
    status: established
    sources:
    - m5-sakura-city-jokamachi
  - text: 佐倉藩は千葉県における最大の藩で、その石高は概ね11万石、藩の歴史の6割弱を堀田家が治めた（佐倉市公式）
    kind: fact
    level: E2
    status: established
    sources:
    - m5-sakura-city-jokamachi
  - text: 幕末の藩主・堀田正睦は洋学を積極的に取り入れ、蘭方医・佐藤泰然を招いて医学塾兼診療所の佐倉順天堂（順天堂大学の前身）を開かせた（佐倉市公式）
    kind: fact
    level: E2
    status: established
    sources:
    - m5-sakura-city-jokamachi
  - text: 1954年（昭和29年）3月31日、佐倉町・臼井町・志津村・根郷村・和田村・弥富村が合併して市制を施行し、佐倉市が発足した（地方公共団体コードは122122）
    kind: fact
    level: E4
    status: established
    sources:
    - m5-uub-chiba-cities
    - k1-jlis-chiba
  column:
    title: 老中の城と蘭学のまち
    text: 佐倉の城下町は、江戸の東を守る要衝として幕府の重臣が代々治めた。老中職についた城主が諸藩で最も多かったことから「老中の城」と呼ばれ、幕末には藩主・堀田正睦が蘭方医の佐藤泰然を招いて佐倉順天堂を開いた。のちの順天堂大学につながる学びの場が、城下町の名とともに今も語り継がれている。
    sources:
    - m5-sakura-city-jokamachi
  relations:
  - pref/12
  unknowns:
  - 地名「佐倉」の文書上の初出と語源の確定は未了（市公式の2説はいずれも「説」の提示にとどまる）
  - 中世の佐倉郷や千葉氏との関係についての専門辞典の記述確認が未了
  updated: '2026-11-13'
- id: muni/12-八千代市
  code: '122211'
  names:
    ja: 八千代市
    reading: やちよし
    aliases:
    - 八千代町
    - 大和田町
  user_terms:
  - 八千代ってどういう意味
  - やちよの由来
  - 八千代台団地のまち
  - 公募で決まった市名
  naming_type: 新規命名
  formation: 合併新設
  prefecture: 千葉県
  homonyms:
  - muni/08-八千代町
  summary: 市名は1954年の合併の際に公募で採用された瑞祥地名「八千代」を継いだもの。「幾千年も幾万年も終わりを知らない、無限の発展の可能性」という意味を込めた命名で、旧来の地名には由来しない。1967年1月1日に市制を施行した。茨城県には同名の八千代町がある。
  first_attestation:
    era: 昭和29年
    year_western: 1954
    document: 八千代市市政概要（八千代市議会事務局）
    note: 1954年1月15日の合併に際し町名を公募して「八千代」を採用したことを市政概要が記す。命名そのものの初出
  claims:
  - text: 八千代市市政概要によれば、1954年（昭和29年）1月15日、千葉郡大和田町と睦村が合併のさい町名を公募し、たくさんの応募の中から「八千代」を採用した
    kind: fact
    level: E2
    status: established
    sources:
    - m5-yachiyo-city-gaiyo
  - text: 同概要は「八千代」について、めでたく喜ばしいときに使われ、幾千年も幾万年も終わりを知らない、無限の発展の可能性を秘めているという意味があると説明する
    kind: fact
    level: E2
    status: established
    sources:
    - m5-yachiyo-city-gaiyo
  - text: 八千代市制施行50周年記念誌は、「千代に八千代に」という想いから、永遠に栄えるように祈って付けられた名であると記す
    kind: fact
    level: E2
    status: established
    sources:
    - m5-yachiyo-city-50th
  - text: 1954年（昭和29年）9月1日に印旛郡阿蘇村を合併し、おおむね現在の市域が形成された（市政概要の市域変遷）
    kind: fact
    level: E2
    status: established
    sources:
    - m5-yachiyo-city-gaiyo
  - text: 1967年（昭和42年）1月1日、人口4万1,574人で市制を施行して八千代市となった（市政概要。地方公共団体コードは122211）
    kind: fact
    level: E2
    status: established
    sources:
    - m5-yachiyo-city-gaiyo
    - k1-jlis-chiba
  - text: 1967年（昭和42年）1月1日に千葉郡八千代町が市制を施行して八千代市となり、千葉郡は消滅した（同日に市制を施行した流山市は東葛飾郡流山町の市制であり、千葉郡の消滅とは無関係である）
    kind: fact
    level: E4
    status: established
    sources:
    - m5-yachiyo-city-gaiyo
    - m5-uub-chiba-cities
  - text: 1957年（昭和32年）に完成した八千代台団地は日本初の大規模住宅団地とされ、これをきっかけに市の人口増加が始まった（市政概要の沿革）
    kind: fact
    level: E2
    status: established
    sources:
    - m5-yachiyo-city-gaiyo
  - text: 合併前の中心地・大和田は、江戸時代に佐倉・成田へ通じる街道の宿場町（大和田宿）として繁栄した地である（八千代市公式）
    kind: fact
    level: E2
    status: established
    sources:
    - m5-yachiyo-city-keisei
  column:
    title: 公募で生まれた「永遠」の名
    text: 八千代は、土地の古い名ではない。1954年、大和田町と睦村の合併にあたって町名を公募し、「千代に八千代に」と末永く栄える願いを込めた瑞祥の名が選ばれた。その願いどおりかどうか、まちは八千代台団地の開発とともに急速に成長し、13年後に市制を施行した。公募の瑞祥地名は、合併新設の名づけの典型例でもある。
    sources:
    - m5-yachiyo-city-gaiyo
    - m5-yachiyo-city-50th
  relations:
  - pref/12
  - muni/08-八千代町
  unknowns:
  - 公募の応募総数や次点候補など選定過程の詳細は市政概要に記されておらず未確認
  - 茨城県八千代町との由来の異同の本格的な横断確認は未了（同名自治体として相互参照のみ）
  updated: '2026-11-13'
- id: muni/12-八街市
  code: '122301'
  names:
    ja: 八街市
    reading: やちまたし
    aliases:
    - 八街町
    - 八街村
  user_terms:
  - やちまた
  - 落花生のまち
  naming_type: 新規命名
  formation: 単独発足
  prefecture: 千葉県
  homonyms: []
  summary: 「やちまた」という難読の読みで知られる、北総の開拓地に生まれた市。市名は明治2年（1869年）に始まった下総牧の開墾事業で、入植の順番に基づいて「漢数字＋好字」で命名された一連の開墾地名の一つで、8番目の「八」に、集落の繁栄を願う「街」の字を組み合わせたものである。名付け親は開墾事業の担当者だった東京府権大参事の北島秀朝とされる。1992年4月1日に市制を施行した。
  first_attestation:
    era: 明治2年
    year_western: 1869
    document: 北島秀朝が東京府知事・大木喬任に宛てた書簡（明治2年8月15日付）
    note: 書簡に「開墾名前明日参館之節持参」とあり、この頃に各開墾地の地名とともに「八街」が名付けられたと市が推測するもの。命名そのものを示す史料として市が紹介している。
  claims:
  - text: 「八街」の地名は、江戸時代の御用馬の放牧地であった下総牧（小金牧・佐倉牧）の開墾事業が開始された時期に命名され、名付け親は開墾事業の担当者だった東京府権大参事の北島秀朝である
    kind: fact
    level: E2
    status: established
    sources:
    - w3-yachimata-city-meiji
  - text: 開墾地の地名は、開墾に従事する人々を受け入れていった地域の順番に基づき、漢数字と好字（こうじ）を組み合わせて付けられていったもので、「八街」はその8番目に当たる
    kind: fact
    level: E2
    status: established
    sources:
    - w3-yachimata-city-meiji
  - text: 「街」という字には住宅や商店の集まる場所という意味があり、開墾後に豊かに、賑やかに、栄えていくよう願いが込められている
    kind: fact
    level: E2
    status: established
    sources:
    - w3-yachimata-city-meiji
  - text: 同じ命名の系列には、初富、二和、三咲、豊四季、五香、六実、七栄、八街、九美上、十倉などがあり、二和・三咲は現在の船橋市域、豊四季は現在の柏市域に当たる
    kind: fact
    level: E2
    status: established
    sources:
    - upg-r10-yachimata-funabashi-niwa
  - text: 1872年（明治5年）に八街村が誕生し、1919年（大正8年）に町制を施行して八街町となった
    kind: fact
    level: E2
    status: established
    sources:
    - upg-r10-yachimata-masterplan
  - text: 1992年（平成4年）4月1日に八街町が市制を施行し、千葉県下30番目の市として八街市が発足した
    kind: fact
    level: E2
    status: established
    sources:
    - w3-yachimata-city-gaiyo
  - text: 総務省の全国地方公共団体コードで、八街市の団体コードは122301と定められている
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 数字で数えられた開拓地の名前
    text: 北総の台地には、明治の開墾で生まれた「数字の地名」が並んでいる。幕府の放牧地だった下総牧を切り開く事業で、入植を受け入れた順に初富、二和、三咲、豊四季、五香、六実、七栄、八街、九美上、十倉……と、漢数字に縁起のよい字を組み合わせた名が付けられていった。八街の「街」にも、住宅や商店の集まる場所という意味で、開墾地の繁栄への願いが込められている。姉妹地名の多くは今、船橋市や柏市など周辺市の町名として残るが、「八街」だけは1872年の村から町を経て1992年に市となり、地名の系列の中で唯一、自治体の名前として残った。「やちまた」という読みの難しさも、この命名が漢字の音読みの組み合わせではなく、開墾計画の中で作られた人工の地名であることの名残である。
    sources:
    - w3-yachimata-city-meiji
    - w3-yachimata-wiki
    - w3-yachimata-city-gaiyo
  relations:
  - pref/12
  unknowns:
  - 「八街」の読み「やちまた」が命名当初からこの読みだったのかを示す当時の記録は未確認（読みの由来について市の公式資料には明記がなかった）
  updated: '2026-11-13'
- id: muni/12-勝浦市
  code: '122181'
  names:
    ja: 勝浦市
    reading: かつうらし
    aliases:
    - 桂浦
    - 葛浦
    - 勝占
    - 浜勝浦
  user_terms:
  - 勝浦ってどういう意味
  - かつうらの由来
  - 朝市のまち
  - お万の方のまち
  naming_type: 中心地名の継承
  formation: 合併新設
  prefecture: 千葉県
  homonyms:
  - muni/36-勝浦町
  summary: 市名は勝浦町以来の港町の名「勝浦」を継いだもの。古くは桂浦・葛浦・勝占とも表記され、語源には勝占の忌部氏に由来する説、紀伊勝浦や土佐の桂との関係をいう説、「勝れた浦」の意とする説など諸説がある。1955年の合併で勝浦町が発足し、1958年に市制を施行した。徳島県には同名の勝浦町がある。
  first_attestation:
    era: 江戸時代
    year_western: null
    document: 桂浦・葛浦・勝占などの旧表記（勝浦市公式資料）
    note: 「勝浦」の表記の確実な初出は特定できなかった。中世には浜勝浦の八幡岬に勝浦城が築かれていたことが『日本歴史地名大系』にみえる
  claims:
  - text: 勝浦市公式によれば、勝浦は古くは桂浦、葛浦、勝占とも表記されていた
    kind: fact
    level: E2
    status: established
    sources:
    - m5-katsuura-city-promotion
  - text: 市公式は語源の説の一つとして、紀伊勝浦や土佐の桂（桂浜）との関係からという説を挙げる
    kind: fact
    level: E2
    status: contested
    sources:
    - m5-katsuura-city-promotion
  - text: 市公式は、房総半島開拓の祖とされる「勝占の忌部（いんべ）」の名に由来するという説も挙げる
    kind: fact
    level: E2
    status: contested
    sources:
    - m5-katsuura-city-promotion
  - text: 市公式はさらに、天然の良港であること、すなわち「勝れた浦」に由来するという説も併記し、語源には諸説あるとする
    kind: fact
    level: E2
    status: contested
    sources:
    - m5-katsuura-city-promotion
  - text: 勝占の忌部氏の名が由来になったとする説について、勝浦市公式は、阿波忌部氏を率いて四国から関東に渡った天冨命を祀る遠見岬神社を創建した勝占忌部の名が、勝浦の地名の由来になったと伝わると紹介する
    kind: fact
    level: E2
    status: contested
    sources:
    - m5-katsuura-city-promotion
  - text: 『日本歴史地名大系』によれば、浜勝浦の八幡岬の要害には勝浦城が築かれ、16世紀初めには真里谷武田氏の拠点であったとされる
    kind: fact
    level: E3
    status: established
    sources:
    - m5-katsuura-kotobank
  - text: 1955年（昭和30年）に勝浦町・興津町・上野村・総野村が合併して勝浦町が発足し、1958年（昭和33年）に市制を施行して勝浦市となった（勝浦市公式。地方公共団体コードは122181）
    kind: fact
    level: E2
    status: established
    sources:
    - m5-katsuura-city-promotion
    - k1-jlis-chiba
  - text: 勝浦城主・正木頼忠の娘で徳川家康の側室となったお万の方が、勝浦城落城の際に40メートルの断崖に白い布を垂らして海へ逃れたという「お万の布ざらし」伝説が残されている（勝浦市公式）
    kind: legend
    level: E2
    status: established
    sources:
    - m5-katsuura-city-promotion
  column:
    title: 断崖に垂れた白い布
    text: 勝浦城のあった八幡岬には、「お万の布ざらし」と呼ばれる伝説が残る。城主・正木頼忠の娘で、のちに徳川家康の側室となったお万の方が、落城の際に40メートルの断崖へ白い布を垂らし、それを伝って海へ降りて逃れたという。布をさらした跡とされる岩肌は、今も岬の名所として語り継がれている。
    sources:
    - m5-katsuura-city-promotion
  relations:
  - pref/12
  - muni/36-勝浦町
  unknowns:
  - 「勝浦」の表記の文書上の初出は特定できなかった
  - 語源は忌部説・他地名との関係説・「勝れた浦」説のいずれとも決められず、確定していない
  - 徳島県勝浦町・和歌山県那智勝浦町との由来の異同の本格的な横断確認は未了（同名自治体として相互参照のみ）
  updated: '2026-11-13'
- id: muni/12-匝瑳市
  code: '122351'
  names:
    ja: 匝瑳市
    reading: そうさし
    aliases:
    - 八日市場市
    - 野栄町
    - 匝瑳郡
    - 狭布佐
  user_terms:
  - そうさ
  - 読めない市名
  - 植木のまち
  naming_type: 旧行政区画名の継承
  formation: 合併新設
  prefecture: 千葉県
  homonyms: []
  summary: 「そうさ」という難読の市名で知られる市で、植木の産地でもある。2006年1月23日に八日市場市と匝瑳郡野栄町が合併して発足し、市名は両市町の旧郡名「匝瑳」を住民アンケートの結果で採用した。「匝瑳」の地名は741年の正倉院の記録に遡るとされ、もとの音「さふさ」に縁起のよい漢字を当てたものと考えられている。語源には「美しい麻のとれる土地」とする説などがある。
  first_attestation:
    era: 天平13年
    year_western: 741
    document: 正倉院に伝わる庸調（朝廷に納めた特産物）の記録
    note: 「匝瑳」の現存最古の記録と市が紹介するもの。文書そのものは未読で、市の公式説明による。
  claims:
  - text: 匝瑳市は2006年（平成18年）1月23日に、八日市場市と匝瑳郡野栄町が合併して誕生した
    kind: fact
    level: E2
    status: established
    sources:
    - w3-sosa-city-name
  - text: 市の名称は、八日市場市・野栄町合併協議会が15歳以上の住民を対象に両市町の名称を除いて行ったアンケート調査で1位であったこと、また両市町の旧郡名でもあり住民が共有して一体感の持てる名称であったことから決定した
    kind: fact
    level: E2
    status: established
    sources:
    - w3-sosa-city-name
  - text: 「匝瑳」という地名の現存最古の記録は、奈良・東大寺正倉院に伝わる庸調に見られる天平13年（741年）の記録であるとされている
    kind: fact
    level: E2
    status: established
    sources:
    - w3-sosa-city-name
  - text: 『続日本後紀』によれば、5世紀の終わり頃から6世紀のはじめにかけて物部小事が坂東を征した勲功によって朝廷から下総国の一部を与えられ匝瑳郡（さふさごおり）とし、小事の子孫は物部匝瑳氏を名乗るようになったと伝えられる
    kind: fact
    level: E2
    status: established
    sources:
    - w3-sosa-city-name
  - text: 「匝瑳」の語源については諸説あって定まっていないが、「さふさ」の「さ」は狭で美しい、「ふさ」は布佐で麻の意であり、「美しい麻のとれる土地」であったとする説がある
    kind: fact
    level: E2
    status: contested
    sources:
    - w3-sosa-city-name
  - text: 「ふさ」は下総国11郡中で最大の郡であったことに由来するという説もある
    kind: fact
    level: E2
    status: contested
    sources:
    - w3-sosa-city-name
  - text: 「匝瑳」という表記は、もとの音「さふさ」に縁起のよい漢字を充てたものと考えられている
    kind: fact
    level: E2
    status: established
    sources:
    - w3-sosa-city-name
  - text: 総務省の全国地方公共団体コードで、匝瑳市の団体コードは122351と定められている
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 読めない市名を、住民が選んだ
    text: 初めて見て「そうさ」と読める人はまずいない。2006年の合併で新市の名前を決める際、合併協議会は旧来の八日市場市と野栄町の名前を候補から外し、15歳以上の住民にアンケートを取った。その結果、1位になったのが旧郡名の「匝瑳」だった。難読であることよりも、両市町に共通し、一体感を持てる名前であることが優先されたのである。この「匝瑳」という字自体、もとは「さふさ」という音に縁起のよい漢字を当てたものと考えられている。「匝」は一巡りして帰る、「瑳」は鮮やかで美しいという意味を持つ。地名の最古の記録は741年、正倉院に納められた特産物の記録にまで遡るというから、住民の選んだ名前は奈良時代からの由緒を持つ名前でもあった。
    sources:
    - w3-sosa-city-name
  relations:
  - pref/12
  unknowns:
  - 「さふさ」の語源は市公式も「諸説あって定まっていない」としており、狭布佐（麻）説と最大郡説のどちらが有力かは未確認。なお調査指示にあった「五穀豊穣の瑞祥」による命名説は、市の公式説明では確認できなかった
  - 741年の正倉院文書の記録内容そのものは未読で、市の公式説明による紹介である
  updated: '2026-11-13'
