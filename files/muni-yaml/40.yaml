  naming_type: 中心地名の継承
  naming_note: 旧来の地名「芦屋」の継承
  formation: 不明
  prefecture: 福岡県
  homonyms: []
  summary: 遠賀郡の町。1889年に芦屋村として発足し、1891年に町制を施行、1905年に山鹿村を編入した。平安時代後期の文書に「筑前国葦屋津」とみえる、古い港の地名である。兵庫県の芦屋市とは読みも表記も同じ「あしや」だが、市と町とで異なる自治体である（芦屋市のレコードからも相互に言及されている）。
  first_attestation:
    era: 平安時代
    year_western: null
    document: 芦屋津（港）としての記録
    note: 平安時代中期から芦屋津として記録に残るとされるが、初出文献の特定はできなかった
  claims:
  - text: 芦屋は古代の岡水門の後身とされる葦屋津の地で、平安時代後期の保延2年（1136年）の文書に「筑前国葦屋津」とみえる港の地名である
    kind: fact
    level: E3
    status: established
    sources:
    - upg-p2-ashiya-ashiyatsu-kotobank
  - text: 芦屋は「芦屋釜」の産地として知られ、国の重要文化財に指定されている茶の湯釜9点のうち8点は芦屋釜である。また芦屋はかつて「芦屋千軒、関千軒」と称され、遠賀川の河口港として下関と肩を並べるほど発展した
    kind: fact
    level: E4
    status: established
    sources:
    - upg-p2-ashiya-chosonkai
  - text: 1891年に芦屋村が町制を施行して芦屋町となり、1905年に山鹿村と合併した
    kind: fact
    level: E3
    status: established
    sources:
    - upg-p2-ashiya-nipponika
  - text: 町内の山鹿貝塚は福岡県指定史跡で、縄文時代早期から晩期にわたる貝塚として知られ、装身具を身に着けた女性人骨（2号人骨）の出土で全国的に知られる
    kind: fact
    level: E3
    status: established
    sources:
    - upg-p2-ashiya-yamaga-kotobank
    - upg-p2-ashiya-gikai
    - upg-p2-ashiya-chosonkai
  - text: 読みも表記も同じ「あしや」である兵庫県芦屋市とは別の自治体である
    kind: fact
    level: E2
    status: established
    sources:
    - h5-jlis-fukuoka
    - d-cap-jlis-hyogo
  - text: 芦屋町の地方公共団体コードは403814である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 芦屋千軒――港町「芦屋津」と芦屋釜
    text: 芦屋の名は、まず港の名として歴史に現れる。平安時代中期には芦屋津として記録に残り、1185年には源平の争いの葦屋浦の戦いの舞台となった。鎌倉期のおよそ1200年頃には宇都宮氏のもとで茶釜の「芦屋釜」が興り、中世の芦屋は「芦屋千軒・関千軒」と称され、下関と肩を並べる都市だったという。1891年という早い時期に町制を施行したのも、この港町としての蓄積があってのことだろう。今も町には航空自衛隊芦屋基地とボートレース芦屋があり、水辺の町の性格は受け継がれている。
    sources:
    - r5-ashiya-wiki
  relations:
  - pref/40
  - muni/28-芦屋市
  unknowns:
  - 「芦屋」の語源（葦の生える地に由来するか等）は確認できなかった
  - 芦屋津の初出文献は特定できなかった
  updated: '2026-11-13'
