    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 「酒」と「水」で「酒水園」――町の中の合成地名
    text: 粕屋町と隣の須恵町が合同で設けた下水処理施設には「酒水園（しゅすいえん）」という風変わりな名が付いている。その由来は合成にある。地名「酒殿」の「酒」と、かつてのボタ山の名称だった「水洗」の「水」とを一文字ずつ採って組み合わせたのだという。町名「粕屋」自体の命名経緯は今のところ資料に見当たらないが、町の中には、身近な地名を一文字ずつ継ぎ合わせて新しい名を作るという、合併地名の作法そのままの命名が残っている。
    sources:
    - r5-kasuya-wiki
  relations:
  - pref/40
  unknowns:
  - 町名「粕屋」の命名理由と、郡名「糟屋」と字が異なる理由は確認できなかった
  - 合併時に他の町名候補があったかは確認できなかった
  updated: '2026-11-13'
- id: muni/40-糸島市
  code: '402303'
  names:
    ja: 糸島市
    reading: いとしまし
    aliases: []
  user_terms:
  - 糸島の名前の由来
  - 糸島半島の市
  - 伊都国のあった市
  - 糸島郡から生まれた市
  naming_type: 旧行政区画名の継承
  formation: 合併新設
  prefecture: 福岡県
  homonyms: []
  summary: 2010年1月1日に前原市・二丈町・志摩町が合併して誕生した新市で、市名「糸島」はこの地域が属した糸島郡と、広く知られる糸島半島の名を継いだ。糸島郡は1896年に怡土郡と志摩郡が合併して生まれた郡名で、その下にはさらに『魏志倭人伝』に記される伊都国の比定地という古代の層がある。糸島郡は市の発足と同時に消滅した。
  first_attestation:
    era: 平成22年
    year_western: 2010
    document: 糸島1市2町合併協議会による新市名の決定
    note: 自治体名としての「糸島市」の初出。地域名としての「糸島」は糸島郡（1896年発足）に遡る
  claims:
  - text: 糸島市の地方公共団体コードは402303である（総務省「地方公共団体コード一覧」による）
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  - text: 2010年1月1日、前原市・志摩町・二丈町が合併して糸島市が誕生した
    kind: fact
    level: E2
    status: established
    sources:
    - r2-itoshima-kobunsyokan
  - text: 糸島郡は1896年（明治29年）に怡土郡と志摩郡が合併して発足し、前原市・二丈町・志摩町が合併して糸島市が発足した2010年（平成22年）1月に消滅した
    kind: fact
    level: E2
    status: established
    sources:
    - upg-p12-itoshima-city-sousetsu
  - text: 郡名「糸島」は、合併前の怡土（いと）と志摩（しま）の名をつなげて「糸島」という字を当てたものである
    kind: fact
    level: E2
    status: established
    sources:
    - r2-itoshima-kobunsyokan
  - text: 糸島市の市域は『魏志倭人伝』に記される伊都国があった地とされ、平原遺跡から出土した内行花文鏡は国宝に指定されている
    kind: fact
    level: E2
    status: established
    sources:
    - r2-itoshima-kobunsyokan
  - text: 新市名の公募では「伊都」「いとしま」「伊都国」「伊都島」など伊都国にちなむ案も上位に挙がったが、「糸島」が新市名に選ばれたと市区町村変遷情報は伝える
    kind: fact
    level: E5
    status: established
    sources:
    - r2-itoshima-uub
  - text: 糸島市を構成した前原市・二丈町・志摩町はいずれも、もとは糸島郡に属した市町である（前原市は1992年の市制施行で糸島郡を離れた）
    kind: fact
    level: E4
    status: established
    sources:
    - r2-itoshima-uub
    - upg-ae5-uub-fukuoka
  column:
    title: 「伊都」と「糸島」のあいだ
    text: 糸島市が生まれるとき、新しい市の名前の公募には、古代の「伊都国」にちなむ案が数多く寄せられた。「伊都」「伊都国」「伊都の国」――市域が『魏志倭人伝』の伊都国の地とされるだけに、古代の名への期待は大きかった。しかし最終的に選ばれたのは、明治29年（1896年）に怡土郡と志摩郡の合併で生まれた郡名「糸島」だった。古代の王国の名よりも、百年余り地域の住所として使われてきた郡名のほうが、住民にとっての「自分たちの名前」だったということなのだろう。糸島郡は市の誕生と同時に消滅し、郡名は市名として生き続けることになった。
    sources:
    - r2-itoshima-uub
    - r2-itoshima-kobunsyokan
  relations:
  - pref/40
  - muni/40-福岡市
  unknowns:
  - 新市名の選定理由を記した合併協議会の一次資料（議事録等）は確認できなかった
  - 「糸島半島」という呼称がいつ頃から使われるようになったかは未確認
  updated: '2026-11-13'
- id: muni/40-糸田町
