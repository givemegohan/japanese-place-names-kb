- id: muni/06-朝日町
  code: '063231'
  names:
    ja: 朝日町
    reading: あさひまち
    aliases: []
  user_terms:
  - 朝日町の名前の由来
  - 山形の朝日町は大朝日岳のふもと
  - 朝日町は山形と富山と三重にある
  naming_type: 自然地名から
  formation: 合併新設
  prefecture: 山形県
  homonyms:
  - muni/16-朝日町
  - muni/24-朝日町
  summary: 昭和29年（1954年）11月1日に宮宿町・西五百川村・大谷村が合併して誕生した。町は磐梯朝日国立公園の主峰・大朝日岳の東部山麓に位置し、奈良時代には朝日岳への山岳信仰の隆盛とともに集落が発達したと町議会概要は述べる。ただし町名が大朝日岳に由来すると明示した町の公表資料は確認できず、「名峰朝日岳にちなんで」と公式に明記する富山県朝日町とは事情が異なる。
  first_attestation:
    era: 昭和29年
    year_western: 1954
    document: 朝日町の成立（1954年11月1日の合併。朝日町議会概要「歴史と文化」）
    note: 自治体としての「朝日町」の初出。それ以前の地域名・山名としての「朝日」の用例の特定は未確認
  claims:
  - text: 昭和29年（1954年）11月1日、宮宿町・西五百川村・大谷村の1町2村が合併して朝日町となった。宮宿町は、もとの東五百川村が昭和3年（1928年）に町制を施行したものである
    kind: fact
    level: E2
    status: established
    sources:
    - h4-yamagata-asahi-gikai
  - text: 町は磐梯朝日国立公園の主峰大朝日岳の東部山麓地域に位置し、町の中心部を最上川が約21kmにわたって南北に流れ、面積の76%ほどが山林で占められている
    kind: fact
    level: E2
    status: established
    sources:
    - h4-yamagata-asahi-gikai
  - text: 町議会概要は、奈良時代に入ると朝日岳などの山岳信仰の隆盛とともに集落が発達したと述べており、「朝日」の名は山岳信仰の対象としての朝日岳の名として、この地域に古くから結びついていた
    kind: fact
    level: E2
    status: established
    sources:
    - h4-yamagata-asahi-gikai
  - text: 町名「朝日」が大朝日岳・朝日連峰に由来するかは地理的には自然な見方だが、町の公式サイト・議会概要に命名理由の明示はなく、断定できる資料が得られなかった
    kind: fact
    level: E2
    status: indeterminate
    sources:
    - h4-yamagata-asahi-gikai
  - text: 【異なる層】富山県朝日町は町公式が「名峰朝日岳にちなんで『朝日町』と名付けられ」と命名由来を明示しているのに対し、山形県朝日町には同様の明示が確認できない。三重県朝日町は山ではなく天武天皇の故事にあやかった命名であり、3町の「朝日」は由来の型も確かさもそれぞれ異なる
    kind: fact
    level: E2
    status: established
    sources:
    - h4-toyama-asahi-gaiyo
    - h4-mie-asahi-aramashi
  - text: 【共通する層】3町とも「朝日」を名に持ち、このうち山形・富山の2町はともに「朝日岳」と呼ばれる山を擁する山麓の町という地理的な共通点を持つ
    kind: fact
    level: E2
    status: established
    sources:
    - h4-yamagata-asahi-gikai
    - h4-toyama-asahi-gaiyo
  column:
    title: 由来の説明がない「朝日」
    text: 富山県朝日町は「朝日岳にちなんで」とはっきり書くのに、山形の朝日町は公式資料のどこにも命名理由を書いていない。大朝日岳の麓という立地から「山の名をもらったのだろう」と思いたくなるが、記録がない以上、このKBはそう書かない。地名の由来調査では、この「言いたくなる一言」を我慢できるかどうかが正確さの分かれ目になる。
    sources:
    - h4-yamagata-asahi-gikai
    - h4-toyama-asahi-gaiyo
  relations:
  - pref/06
  - muni/16-朝日町
  - muni/24-朝日町
  unknowns:
  - 1954年の合併時における町名選定理由を記した資料（合併協議の記録・町史）は未確認
  - 地域の古い呼称「五百川郷」と町名「朝日」との関係は未確認
  updated: '2026-11-13'
- id: muni/06-村山市
  code: 062081
  names:
    ja: 村山市
    reading: むらやまし
    aliases:
    - 楯岡
    - 村山郷
  user_terms:
  - バラのまち村山
  - 村山の名前の由来
  - むらやま
  naming_type: 旧行政区画名の継承
  formation: 合併新設
  prefecture: 山形県
  homonyms: []
  summary: 最上川中流の市で、市名は1954年の合併の際に新たに選ばれた。「村山」はこの地方の総称であり、古来の村山郡・村山郷に由来する。当時の中心地「楯岡」も候補に上がったが、合併各村との協議で、村山地区の中核都市への意気込みを込めて「村山」が選ばれたと市は説明している。
  first_attestation:
    era: null
    year_western: null
    document: null
    note: 市名は1954年の新設。もととなった「村山」は古来の郡名・郷名とされるが、その初出の文献・年次は確認できなかった
  claims:
  - text: 村山市統計資料の「地名由来」は、1954年の合併に際し名称には当時の経済の中心地であった楯岡の名が候補に上がったが、合併他村との協議を経て、この地方の総称を生かし村山地区の中核都市へという意気込みと期待感をもって「村山」と名付けられた、と説明する
    kind: fact
    level: E2
    status: established
    sources:
    - t6-murayama-city-tokei
  - text: 市名の「村山」は古来の村山郡・村山郷に由来する（『日本歴史地名大系』）
    kind: fact
    level: E3
    status: established
    sources:
    - t6-murayama-kotobank
  - text: 村山市は1954年（昭和29）11月1日に楯岡町・西郷村・大倉村・大久保村・冨本村・戸沢村の1町5村が合併して市制を施行し、同年12月1日に袖崎村、1955年1月1日に大高根村を合併した
    kind: fact
    level: E2
    status: established
    sources:
    - t6-murayama-city-ayumi
  - text: 中心地の楯岡は、応永年間（1394年〜）に最上満家の末弟・満国が楯山に居城を築いて「楯岡殿」と呼ばれたことに始まるとされ、明治11年（1878年）には楯岡村に北村山郡役所が置かれて地域の政治経済の中心となった
    kind: fact
    level: E2
    status: established
    sources:
    - t6-murayama-city-kaso
  - text: 村山市の総務省地方公共団体コードは062081である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 中心地の名をやめて、地方の総称を選んだ
    text: 合併で新しい市名を決めるとき、中心地の名をそのまま使うのが普通のやり方である。村山でも「楯岡」が候補だった。しかし選ばれたのは、合併する村々のどれか一つの地名ではなく、郡に遡るこの地方全体の総称「村山」だった。市の統計資料はその理由を「村山地区の中核都市へという意気込みと期待感」と率直に記している。一地域の名を、合併に参加した全員の名にした選択である。
    sources:
    - t6-murayama-city-tokei
  relations:
  - pref/06
  unknowns:
  - 「村山」の郡名・郷名としての初出（文献・年次）と、郡名そのものの語源は確認できなかった
  - 1954年の合併協議で「楯岡」以外の候補名があったかは未確認
  updated: '2026-11-13'
- id: muni/06-東根市
  code: '062111'
  names:
    ja: 東根市
    reading: ひがしねし
    aliases:
    - 東根町
    - 東根村
  user_terms:
  - ひがしね
  - さくらんぼ東根
  - 果樹王国ひがしね
  - 東根温泉
  naming_type: 中心地名の継承
  formation: 合併新設
  prefecture: 山形県
  homonyms: []
  summary: 村山盆地の東部、奥羽山脈の麓に広がる果樹の市。「東根」は中世の小田島荘に現れる古い地名で、市公式は、盆地の中央にあったとされる湖「藻が湖」の東の山麓で最も早く拓けた地を東根と呼んだと説明する。1954年に町村合併で東根町となり、1958年に市制を施行した。
  first_attestation:
    era: 観応3年
    year_western: 1352
    document: 足利尊氏文書（「出羽国小田島荘東根孫五郎跡」を鎌倉宝戒寺に寄進）
    note: 市公式が紹介する記録上の初見。文書そのものは未読のため、紹介した自治体資料の形で記録する。
  claims:
  - text: 東根市公式は市名の由来について、村山盆地の真ん中に「藻が湖（もがうみ）」という大きな湖があり、この湖の東に連なる奥羽山脈の麓に最も早く拓けたところを東根と呼び、この地名が付けられたと説明している
    kind: fact
    level: E2
    status: established
    sources:
    - w1-higashine-city
  - text: 村山盆地にはかつて藻が湖と呼ばれる大きな湖があったと伝えられている
    kind: legend
    level: E2
    status: indeterminate
    sources:
    - w1-higashine-city
  - text: 観応3年（1352）の足利尊氏の文書に「出羽国小田島荘東根孫五郎跡」を鎌倉宝戒寺に寄進したと記されることが、東根の名の記録上の初見であることを市公式が紹介している
    kind: fact
    level: E2
    status: established
    sources:
    - w1-higashine-city
  - text: 正平11年（1356）に東根城を築いた小田島長義が寄進した普光寺の梵鐘に「東根境致」と刻まれており、これが東根の名の金石文としての最古の用例であることを市公式が紹介している
    kind: fact
    level: E2
    status: established
    sources:
    - w1-higashine-city
  - text: 明治22年（1889年）の町村制施行により東根村・東郷村・高崎村・大富村・小田島村・長瀞村の6村が成立し、明治29年（1896年）に東根村が町制を施行して東根町となった
    kind: fact
    level: E2
    status: established
    sources:
    - w1-higashine-city
  - text: 昭和29年（1954年）に6町村が合併して東根町となり、昭和33年（1958年）11月3日に市制を施行して東根市となった
    kind: fact
    level: E2
    status: established
    sources:
    - w1-higashine-city
  - text: 東根小学校の校庭にある日本一の大ケヤキは、小田島長義が本城を築くときすでに天空を覆うほどの大木としてそびえていたと伝えられている
    kind: legend
    level: E2
    status: indeterminate
    sources:
    - w1-higashine-city
  - text: 総務省の全国地方公共団体コードで、東根市の団体コードは062111と定められている
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 消えた湖「藻が湖」と日本一の大ケヤキ
    text: 東根市の公式の由来説明には、村山盆地の真ん中に「藻が湖（もがうみ）」という大きな湖があったという伝承が登場する。その湖の東の山麓で最も早く拓けた土地が「東根」だったというのである。湖そのものの実在は確かめられていないが、盆地の低湿地が古くから開拓されてきた土地の記憶を映しているのかもしれない。もう一つの語り草が、東根小学校の校庭にそびえる樹齢1500年以上ともいわれる大ケヤキである。室町時代に東根城を築いた小田島長義の頃にすでに大木だったと伝えられ、国の特別天然記念物に指定されている。地名の古さは、1352年の文書と1356年の梵鐘の銘という確かな記録で裏づけられている。
    sources:
    - w1-higashine-city
  relations:
  - pref/06
  unknowns:
  - 「東根」の語源について『角川日本地名大辞典』『日本歴史地名大系』等の専門辞典の説は未確認（市公式の藻が湖説以外の検討は今後の課題）
  - 藻が湖とされる湖の実在と範囲は未確認
  updated: '2026-11-13'
- id: muni/06-河北町
  code: '063215'
  names:
    ja: 河北町
    reading: かほくちょう
    aliases:
    - 河北
    - 谷地（中心集落の旧名）
    - 河北地方
  user_terms:
  - 河北
  - かほく
  - 谷地
  - 雛とべに花の里
  - 冷たい肉そばの町
  naming_type: 旧国名・広域地名の採用
  naming_note: 1954年の合併新町名。合併前からの一帯の地域名「河北」を採ったとみられる
  formation: 合併新設
  prefecture: 山形県
  homonyms: []
  summary: 山形県のほぼ中央、最上川と寒河江川に囲まれた町で、中心は旧谷地町。近世は最上川舟運による紅花の集散地として栄えた。1954年（昭和29年）に谷地町・西里村・溝延村・北谷地村が合併して河北町が生まれた。町名「河北」の命名理由は公式資料に明記されていないが、町域は寒河江川の北・最上川の西にあり、平安時代には寒河江荘の北部「北寒河江荘」にあたった土地である。山形県で唯一、「町」を「ちょう」と読む。
  first_attestation:
    era: 昭和29年
    year_western: 1954
    document: 谷地町・西里村・溝延村・北谷地村の合併による河北町の新設
    note: 自治体名としての初出。地域名としての「河北」の初出は確認できていない
  claims:
  - text: 町は最上川と寒河江川に囲まれ、最上川が東側を、寒河江川が南側を流れる
    kind: fact
    level: E2
    status: established
    sources:
    - z12-kahoku-mlit
  - text: 平安時代、町域は摂関家領であった寒河江荘の一部（北寒河江荘）であり、鎌倉時代に入ると大江氏の流れを汲む寒河江氏が地頭として領した
    kind: fact
    level: E5
    status: established
    sources:
    - z12-kahoku-wiki
  - text: 近世、谷地は最上川舟運の船着場であり、紅花・青苧の集積地として栄えた
    kind: fact
    level: E2
    status: established
    sources:
    - z12-kahoku-mlit
    - z12-kahoku-wiki
  - text: 明治の行政区改正により西里村・谷地村・北谷地村・溝延村が生まれ、谷地村は谷地町となって河北地方の中心となった
    kind: fact
    level: E2
    status: established
    sources:
    - z12-kahoku-town-youran
    - z12-kahoku-town-gaiyo
  - text: 1954年（昭和29年）10月1日、谷地町・西里村・溝延村・北谷地村を廃して河北町が新設された。その後、1955年に元泉地区、1963年に荒小屋地区を編入した
    kind: fact
    level: E5
    status: established
    sources:
    - z12-kahoku-wiki
    - z12-kahoku-town-youran
  - text: 町名「河北」の命名理由は町公式資料に明記されていない。町域が寒河江川の北・最上川の西に位置し、古くは寒河江荘の北部であったことから、「川の北」を意味する名と解されるが、確証はない
    kind: fact
    level: E5
    status: indeterminate
    sources:
    - z12-kahoku-mlit
    - z12-kahoku-wiki
  - text: 河北町は、山形県の中で唯一「町」を「まち」ではなく「ちょう」と読む町である
    kind: fact
    level: E5
    status: established
    sources:
    - z12-kahoku-wiki
  - text: 河北町の地方公共団体コードは063215である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 県内唯一の「ちょう」
    text: 山形県の町はすべて「まち」と読む中で、河北町だけが「かほくちょう」と「ちょう」で読む。1954年に谷地町など1町3村が合併して生まれたこの町は、古くから最上川舟運の紅花の集散地として栄え、上方から運ばれた雛人形が旧家に残る「雛とべに花の里」でもある。新しい町名「河北」が、寒河江川と最上川にはさまれたこの土地の位置をそのまま写した名なのか、合併前の地域名の継承なのかは記録が残っていない。だが、川の北という意味だけは、地図の上ではっきりと読み取れる。
    sources:
    - z12-kahoku-wiki
    - z12-kahoku-mlit
  relations:
  - pref/06
  - muni/06-寒河江市
  - muni/06-西川町
  unknowns:
  - 町名「河北」の命名理由（どの川の「北」か）は、町公式資料・Wikipediaのいずれにも明記がなく確認できなかった
  - 地域名としての「河北」がいつからこの一帯を指したかは確認できていない
  - 1954年の新町名の決定経緯（公募・協議の有無）は確認できなかった
  updated: '2026-11-13'
