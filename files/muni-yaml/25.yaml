  - 草津市はいつできたの
  naming_type: 合併新設
  prefecture: 滋賀県
  homonyms: []
  summary: 草津は近江国栗太郡の地名で、江戸時代には東海道五十三次の52番目の宿場となり、中山道との分岐・合流点として栄えた。1954年、草津町・志津村・老上村・山田村・笠縫村・常盤村が合併して草津市が誕生し、市名は天下に知られた宿場の名が満場一致で選ばれた。群馬県の温泉地・草津町とは別の自治体である。
  first_attestation:
    era: 鎌倉時代
    year_western: 1299
    document: 一遍上人絵伝
    note: 日本歴史地名大系によれば、草津の地名は正安元年（1299）成立の『一遍上人絵伝』に見えるのが早い用例
  claims:
  - text: 日本歴史地名大系によれば、草津の地名は正安元年（1299）成立の「一遍上人絵伝」に見えるのが早い（地方公共団体コードは252069）
    kind: fact
    level: E3
    status: established
    sources:
    - l4-kusatsu-kotobank
    - b-cap-chiba-soumu-code
  - text: 江戸時代の草津宿は東海道五十三次のうち江戸から52番目の宿場で、東海道と中山道が分岐・合流する交通の要衝だったと草津市は紹介する
    kind: fact
    level: E2
    status: established
    sources:
    - l4-kusatsu-city-shukuba
  - text: 天保14年（1843）の「東海道宿村大概帳」には、草津宿に本陣2軒・脇本陣2軒・旅籠72軒があったと記録されている
    kind: fact
    level: E2
    status: established
    sources:
    - l4-kusatsu-city-shukuba
  - text: 東海道と中山道の分かれ目には1816年に飛脚仲間が寄付した追分道標が立ち、「右 東海道いせみち／左 中仙道美のぢ」と刻まれている
    kind: fact
    level: E2
    status: established
    sources:
    - l4-kusatsu-city-shukuba
  - text: 1954年（昭和29年）10月15日、栗太郡草津町・志津村・老上村・山田村・笠縫村・常盤村が合併して草津市が誕生した
    kind: fact
    level: E2
    status: established
    sources:
    - l4-kusatsu-city-fuchi
    - l4-kusatsu-city-shiryo
  - text: 市名「草津」の選定理由について、市制施行の申請書には、国鉄駅名をはじめ各官衙がすべて草津の名称を冠し、東海道・中仙道の分岐点で五十三次の宿場として名が天下に知られていたため、合併促進協議会で満場一致で選ばれたと記されている
    kind: fact
    level: E2
    status: established
    sources:
    - l4-kusatsu-city-shiryo
  - text: 草津市は群馬県草津町と友好交流協定を締結している。相手の草津町は温泉地として知られる自治体で、滋賀県草津市とは名前は同じでも成り立ちの異なる別の自治体である
    kind: fact
    level: E2
    status: established
    sources:
    - l4-kusatsu-city-sogokeikaku
  column:
    title: 二つの「草津」――温泉の草津と、宿場の草津
    text: 「草津」と聞いて多くの人が思い浮かべるのは、湯けむりの群馬県草津町だろう。ところが滋賀県草津市も、江戸時代には東海道屈指の宿場として全国に名を知られた「草津」である。語源も来歴もまったく違う二つの草津は、混同されがちな同士で、草津市は草津町と友好交流協定を結んでつきあっている。なお群馬の草津の古い読みは「くそうづ」で硫黄の臭い泉に由来するとされ、滋賀の草津とは名前の成り立ちからして別物である。
    sources:
    - l4-kusatsu-city-sogokeikaku
    - l4-kusatsu-city-shiryo
  relations:
  - pref/25
  - muni/10-草津町
  unknowns:
  - 滋賀の「草津」という地名そのものの語源（草津川の川名との先後関係を含む）は、今回確認した資料では特定できなかった
  - 『一遍上人絵伝』以前の用例の有無は未確認
  updated: '2026-11-13'
- id: muni/25-近江八幡市
  code: '252042'
  names:
    ja: 近江八幡市
    reading: おうみはちまんし
    aliases:
    - 八幡町
    - 八幡
  user_terms:
  - おうみはちまん
  - 近江商人のふるさと
  - 八幡堀のまち
  - 三方よしのまち
  naming_type: 合併新設
  prefecture: 滋賀県
  homonyms: []
  summary: 市名は、城下町・商都として栄えた「八幡」に、旧国名「近江」を冠したものである。「八幡」の地名は八幡山麓の日牟禮八幡宮に由来し、天正13年（1585年）に豊臣秀次が八幡山城を築いて城下町を整備した。1954年に八幡町と4村が合併して市制を施行する際、「近江八幡市」と名付けられた。2010年に安土町と合併して現在の市域となった。
  first_attestation:
    era: 未確認
    year_western: null
    document: 未確認
    note: 「八幡」の地名の文献上の初出は本調査では特定できなかった。日牟禮八幡宮の社伝では正暦2年（991年）に宇佐八幡宮が八幡山へ勧請されたとし、これが「八幡」の名の広まりの起点とみられる。
  claims:
  - text: 「八幡」という地名は日牟禮八幡宮に由来するとされ、同宮は「近江八幡の地名の由来にもなっている」と全国観光資源台帳は記している。
    kind: fact
    level: E4
    status: established
    sources:
    - p1-omihachiman-jtb
  - text: 日牟禮八幡宮の社伝によると、第13代成務天皇が即位した131年に武内宿禰に命じて当地に地主神の大嶋大神を祀ったのが鎮座の始めで、応神天皇の御座所の跡に日輪の奇瑞があったため祠を建てたと伝えられる。
    kind: legend
    level: E2
    status: established
    sources:
    - p1-omihachiman-himure
  - text: 正暦2年（991年）に一条天皇の勅願により八幡山（法華峰）に社を造営して宇佐八幡宮を勧請し、寛弘2年（1005年）には山麓に遥拝所（下の社）を建てたと、日牟禮八幡宮の由緒は伝えている。
    kind: fact
    level: E2
    status: established
    sources:
    - p1-omihachiman-himure
  - text: 天正13年（1585年）に豊臣秀次が八幡山城を築城する際、山上の八幡宮は麓の下の社へ合祀され、秀次は八幡堀を開削し城下町を整備して八幡商人の基礎を築いたと近江八幡市公式の基礎情報は述べている。
    kind: fact
    level: E2
    status: established
    sources:
    - p1-omihachiman-city
    - p1-omihachiman-himure
  - text: 八幡城の廃城後は天領となり、商業の町として発展を続け、近江商人の一大拠点となった。
    kind: fact
    level: E4
    status: established
    sources:
    - p1-omihachiman-jtb
  - text: 昭和29年（1954年）に蒲生郡八幡町と4村が合併して市制を施行し近江八幡市となった。その後、昭和30年（1955年）に2村、平成22年（2010年）に安土町と合併して現在の市域となった。
    kind: fact
    level: E4
    status: established
    sources:
    - p1-omihachiman-jtb
  - text: 市制施行にあたって旧国名「近江」を冠して「近江八幡市」とした理由については、市公式資料での明示を確認できず、全国各地の「八幡」と区別するためとする説明が一般に流布している。
    kind: fact
    level: E5
    status: indeterminate
    sources:
    - p1-omihachiman-jtb
  - text: 近江八幡市の地方公共団体コードは252042である。
    kind: fact
    level: E2
    status: established
    sources:
    - d-cap-jlis-shiga
  column:
    title: 安土の隣に生まれた商都
    text: 近江八幡の市域には、信長が天下布武の拠点とした安土城の跡も含まれる。しかし市の名の中心は安土ではなく、その西隣の八幡である。1585年、秀吉の甥・秀次が八幡山に城を築くと、安土の商人や職人を呼び寄せて城下町を整えた。城は秀次の失脚とともに一代で廃されたが、町は残り、「売り手よし、買い手よし、世間よし」の三方よしで知られる近江商人の本拠となった。城主の名ではなく神社の名が、商都の名前として生き残ったのである。
    sources:
    - p1-omihachiman-city
    - p1-omihachiman-jtb
  relations:
  - pref/25
  unknowns:
  - 「八幡」の地名の文献上の初出（年・文書）は確認できなかった。
  - 1954年の市制施行時に旧国名「近江」を冠した経緯・理由は、市公式資料では確認できず、合併協議の一次資料での裏付けが残る。
  - 日牟禮八幡宮の創建を131年とするのは社伝であり、史料による裏付けは確認できなかった。
  updated: '2026-11-13'
- id: muni/25-野洲市
  code: '252107'
  names:
    ja: 野洲市
    reading: やすし
    aliases:
    - 野洲町
    - 野洲郡
  user_terms:
  - やす
  - 近江富士・三上山のまち
  - 銅鐸のまち
  - 野洲川のまち
  naming_type: 合併新設
  prefecture: 滋賀県
  homonyms: []
  summary: 市名は旧野洲郡と、その中心町であった野洲町の名を引き継いだものである。2004年10月1日に野洲郡の野洲町と中主町が合併して誕生した。古代の野洲郡は現在の野洲市・守山市・近江八幡市の一部にあたり、郡衙は現在の市役所周辺にあったと推定されている。「野洲」の語源は資料では未詳である。
  first_attestation:
    era: 未確認
    year_western: null
    document: 未確認
    note: 「野洲」の文献上の初出は本調査では特定できなかった。古代の近江国野洲郡の名が郡・川・町の名として受け継がれてきた。
  claims:
  - text: 野洲市は、平成16年（2004年）10月に野洲郡の野洲町と中主町とが合併して新たに誕生した都市であると、野洲市公式の都市計画資料は記している（合併の日は2004年10月1日）。
    kind: fact
    level: E2
    status: established
    sources:
    - p1-yasu-city
  - text: 古代の野洲郡は、現在の野洲市と守山市、近江八幡市の一部に該当し、郡衙（郡の役所）は現在の野洲市役所周辺にあったと推定されていると、野洲市公式資料は述べている。
    kind: fact
    level: E2
    status: established
    sources:
    - p1-yasu-city
  - text: 合併した2町はいずれも野洲郡に属しており、市名は郡名と中心町の名をそのまま継承する形となった。合併により野洲郡は消滅した。
    kind: fact
    level: E2
    status: established
    sources:
    - p1-yasu-city
  - text: 市域は野洲川・日野川の堆積作用によって形成された沖積平野にあり、「近江富士」と呼ばれる三上山が地域のランドマークとなっていると、野洲市公式資料は説明している。
    kind: fact
    level: E2
    status: established
    sources:
    - p1-yasu-city
  - text: 野洲市の地方公共団体コードは252107である。
    kind: fact
    level: E2
    status: established
    sources:
    - d-cap-jlis-shiga
  column:
    title: 郡の名を2町で受け継いだ市
    text: 野洲市は、郡と同じ名前の町（野洲町）と、もう1町（中主町）の合併で生まれた。2町とも野洲郡の所属で、郡の名は奈良時代以来の古い名前である。合併によって野洲郡という行政区画は消えたが、その名は市の名として残った。市役所の周辺には、古代の郡衙があったと推定されている。千年以上前の郡の役所の場所に、いま郡の名を受け継いだ市の役所が立っている。
    sources:
    - p1-yasu-city
  relations:
  - pref/25
  - muni/25-守山市
  - muni/25-近江八幡市
  unknowns:
  - 「野洲」の語源（「やす」の意味）は、今回参照した市の公式資料では説明がなく、未確認である。
  - 「野洲」の文献上の初出（『和名類聚抄』の野洲郡など古代史料の用例）の直接確認はできなかった。
  - 市名選定の過程（公募の有無など）は公式資料で確認できなかった。
  updated: '2026-11-13'
- id: muni/25-長浜市
  code: '252034'
  names:
    ja: 長浜市
    reading: ながはまし
    aliases:
    - 今浜
    - 長浜町
  user_terms:
  - ながはま
  - 秀吉の出世城のまち
  - 長浜城
  - 湖北の中心都市
  naming_type: 一部の地名
  prefecture: 滋賀県
  homonyms: []
  summary: 市名は、もとの地名「今浜」を羽柴秀吉（豊臣秀吉）が天正年間に「長浜」と改めたことに由来する。浅井氏を滅ぼして初めて城持ち大名となった秀吉は、琵琶湖岸の今浜に長浜城を築き、楽市楽座の城下町を開いた。「長」の字の由来には信長の一字説・浅井長政説などがあるが定説はない。1943年に市制を施行し、2006年と2010年の合併で現在の市域となった。
  first_attestation:
    era: 天正2年ごろ
    year_western: 1574
    document: 長浜市『歴史的風致維持向上計画』が伝える今浜から長浜への改名
    note: 「長浜」の名の初出は秀吉による改名そのもの。市の計画資料は天正2年（1574）ごろの築城開始と改名を述べ、城の完成・小谷城からの移転を天正4年（1576）として改名をこの時とする記述もあり、年に幅がある。
  claims:
  - text: 長浜の地はもとは「今浜」と呼ばれており、戦国時代のはじめに北近江を支配した京極氏方の今浜城があったと、長浜城歴史博物館は『江北記』を引いて説明している。
    kind: fact
    level: E2
    status: established
    sources:
    - p1-nagahama-rekihaku
  - text: 天正元年（1573年）に小谷城が落城して浅井氏が滅ぶと、秀吉は北近江三郡を与えられて初めて城持ち大名となり、天正2年（1574年）ごろから湖岸の今浜に築城を開始して、「今浜」という地名を「長浜」に改めたと長浜市の歴史的風致維持向上計画は述べている。
    kind: fact
    level: E2
    status: established
    sources:
    - p1-nagahama-rekimachi
  - text: 長浜市公式の市政のあらましも「天正年間に羽柴秀吉（後の豊臣秀吉）が『今浜』を『長浜』に改名し、小谷城下などの商人たちを集めて、楽市である城下町を作ったのが長浜の基礎となっています」と説明している。
    kind: fact
    level: E2
    status: established
    sources:
    - p1-nagahama-aramashi
  - text: 改名の「長」の字については、主君である織田信長の一字を戴いたとする説と、滅ぼした浅井長政の「長」を取ったとする説が伝えられるが、市の公式資料は理由を明示しておらず、定説は確認できない。
    kind: fact
    level: E5
    status: contested
    sources:
    - p1-nagahama-aramashi
  - text: 昭和18年（1943年）に長浜町・六荘村・西黒田村・神照村・南郷里村・北郷里村・神田村の1町6村が合併して市制が施行され、長浜市が成立した。
    kind: fact
    level: E2
    status: established
    sources:
    - p1-nagahama-aramashi
  - text: 平成18年（2006年）2月13日に長浜市・東浅井郡浅井町・同郡びわ町が合併し、平成22年（2010年）1月1日に虎姫町・湖北町・高月町・木之本町・余呉町・西浅井町が合併して、現在の長浜市となった。
    kind: fact
    level: E2
    status: established
    sources:
    - p1-nagahama-aramashi
    - p1-nagahama-rekimachi
  - text: 長浜市の地方公共団体コードは252034である。
    kind: fact
    level: E2
    status: established
    sources:
    - d-cap-jlis-shiga
  column:
    title: 「今浜」から「長浜」へ ― 出世城の改名
    text: 秀吉にとって長浜城は、家来から初めて「一城の主」へ出世した記念の城である。その城下町の名を「今浜」から「長浜」へ改めた理由は、公式の資料には残っていない。主君・信長の「長」をもらったという説、倒した相手・浅井長政の「長」を取ったという説が今も並んで語られる。いずれにせよ、わずか一文字の差し替えが、滅びた浅井氏の土地に新しい支配者の印を刻んだ。現在の長浜市の名は、この改名がそのまま400年以上受け継がれたものである。
    sources:
    - p1-nagahama-rekimachi
    - p1-nagahama-aramashi
  relations:
  - pref/25
  unknowns:
  - 「長浜」の「長」の字の由来（信長の一字説・浅井長政説など）は、市の公式資料・博物館資料では明示されておらず、一次資料による確認ができなかった。
  - 改名の正確な年は、築城開始の天正2年（1574）ごろとする資料と、城の完成・移転した天正4年（1576）とする記述があり、確定できなかった。
  - 「今浜」の地名自体の語源（いまはま）の文献上の初出は確認できなかった。
  updated: '2026-11-13'
- id: muni/25-高島市
  code: '252123'
  names:
    ja: 高島市
    reading: たかしまし
    aliases:
    - 高島町
    - 高島郡
  user_terms:
  - たかしま
  - 琵琶湖の湖北の市
  - メタセコイア並木のまち
  - 高島ちぢみのまち
  naming_type: 合併新設
  prefecture: 滋賀県
  homonyms: []
  summary: 市名は旧高島郡の名を引き継いだものである。高島郡の成立は大宝元年（701）にさかのぼると市公式は伝える。2005年1月1日に高島郡のマキノ町・今津町・朽木村・安曇川町・高島町・新旭町の全6町村が合併して誕生した。郡内には郡名を名乗る高島町も含まれており、郡名をそのまま市名とする形になった。「高島」の語源は資料では未詳である。
  first_attestation:
    era: 大宝元年
    year_western: 701
    document: 高島市公式「歴史」が伝える高島郡の成立（大宝律令）
    note: 郡名としての「高島」の成立時期を市公式が示すもの。「高島」という地名そのものの語源・それ以前の用例は未確認。
  claims:
  - text: 高島市の地域は古くから高島郡と呼ばれてきており、高島郡の成立は大宝元年（701）に定められた大宝律令にさかのぼると、高島市公式の歴史解説は述べている。
    kind: fact
    level: E2
    status: established
    sources:
    - p1-takashima-city
  - text: 平成17年（2005年）1月1日にマキノ町・今津町・朽木村・安曇川町・高島町・新旭町が合併して高島市が誕生したと、高島市公式は記している。合併した6町村はいずれも高島郡に属していた。
    kind: fact
    level: E2
    status: established
    sources:
    - p1-takashima-city
    - p1-takashima-uub
  - text: 新市名の公募では「高島」のほか「西近江」などが上位に並んだと、市区町村変遷情報データベースは伝えている。
    kind: fact
    level: E5
    status: established
    sources:
    - p1-takashima-uub
  - text: 合併に参加した高島町は、1943年に高島村・水尾村・大溝町が合併して生まれた町で、旧高島郡の郡名を町名として名乗っていた。
    kind: fact
    level: E5
    status: established
    sources:
    - p1-takashima-uub
  - text: 高島市の市域は琵琶湖の北西岸から若狭との境の山地まで、旧高島郡の全域にほぼ重なっている。
    kind: fact
    level: E2
    status: established
    sources:
    - p1-takashima-city
  - text: 高島市の地方公共団体コードは252123である。
    kind: fact
    level: E2
    status: established
    sources:
    - d-cap-jlis-shiga
  column:
    title: 郡まるごとの合併 ― 郡名がそのまま市名に
    text: 高島市の合併は、参加した6町村すべてが高島郡の町村という、郡単位の合併だった。郡の中には「高島町」という、郡名そのものを名乗る町もあった。新しい市の名として郡名「高島」を選ぶのは、6町村のいずれにも偏らない、最も自然な落としどころだったといえる。郡という区画は合併で消えたが、その名と範囲は市の名と市域として、ほぼそのまま受け継がれた。
    sources:
    - p1-takashima-uub
    - p1-takashima-city
  relations:
  - pref/25
  - muni/25-大津市
  unknowns:
  - 「高島」の語源は、今回参照した資料では確認できなかった（湖に突き出た地形など諸説の裏付け未確認）。
  - 「高島」の文献上の初出（『和名類聚抄』の高島郡など）の直接確認はできなかった。
  - 市名の公募の詳細（応募数や得票）は、市公式資料では確認できなかった。
  updated: '2026-11-13'
