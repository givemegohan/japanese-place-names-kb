  code: '403822'
  names:
    ja: 水巻町
    reading: みずまきまち
    aliases: []
  user_terms:
  - みずまき
  - 水巻
  - 遠賀川のコスモスの町
  - 北九州市のベッドタウン
  naming_type: 旧行政区画名の継承
  naming_note: 中世の荘園名「水巻の庄（御牧庄）」を1889年の新村名に採用
  formation: 合併新設
  prefecture: 福岡県
  homonyms: []
  summary: 遠賀郡の町で、遠賀川の下流に位置する。古くは「みまき」と読まれ、遠賀川の水の巻く地形にちなむ地名とされる。1889年の合併では、中世の荘園名「水巻の庄（御牧庄）」を根拠として新村名に「水巻」を採用したことが、合併の施行理由書に明記されている。1940年に町制を施行し、読みは「みずまき」となった。かつての産炭地で、今は北九州市のベッドタウンである。
  first_attestation:
    era: 明治22年
    year_western: 1889
    document: 水巻村の合併施行理由書（水巻町『水巻の学校史』が引用）
    note: 新村名の選定根拠として「新村名を水巻の庄（御牧庄ともあり）と唱えしによる」と明記する。「水巻」の語自体の文献初出は確認できなかった
  claims:
  - text: 水巻町公式サイトによれば、立屋敷の八劔神社に合祀されている保食（うけもち）神社の棟札に「保食宮は昔、水巻宮（みまきぐう）と称す。水巻（みまき）は、地名にして水の巻く意なり」と記されている
    kind: fact
    level: E2
    status: established
    sources:
    - r4-mizumaki-town
  - text: 1889年（明治22年）の合併に際して作成された村施行理由書には、新村名について「新村名を水巻の庄（御牧庄ともあり）と唱えしによる」と記されており、中世の荘園名を新村名の根拠としたことが文書で確認できる（水巻町『水巻の学校史』の引用）
    kind: fact
    level: E4
    status: established
    sources:
    - r4-mizumaki-gakkoshi
  - text: 1889年に立屋敷・伊左座・二・下二・吉田・頃末・朳（えぶり）・古賀・猪熊の9か村が合併して水巻村が発足した。水巻山にあった戸長役場を村役場に改称し、役場の所在地の名をとって村名とした。1940年（昭和15年）に町制を施行し、水巻町（みずまきまち）となった
    kind: fact
    level: E2
    status: established
    sources:
    - r4-mizumaki-town
  - text: 中世の「麻生文書」には水巻関係の地名として「二村村」「古加名」「是末名」が記され、永享4年（1432年）の「対島文書」には是末名・古賀名が見える。これらは現在の二・古賀・頃末のもとになった名である
    kind: fact
    level: E4
    status: established
    sources:
    - r4-mizumaki-town
    - r4-mizumaki-gakkoshi
  - text: 元和6年（1620年）、黒田長政が水巻大明神に参拝したことが「岡郡宗社志」に記されている（水巻町公式サイトの紹介）
    kind: fact
    level: E2
    status: established
    sources:
    - r4-mizumaki-town
  - text: 明治に入って石炭産業で栄え、水巻村の発足後も人口が急増したが、昭和46年（1971年）に石炭産業は終焉を迎え、その後は炭鉱跡地の再開発と住宅政策により北九州都市圏のベッドタウンとして発展した
    kind: fact
    level: E2
    status: established
    sources:
    - r4-mizumaki-town
  - text: 町章（1950年制定）は、遠賀川の水が三つ巴になり、渦巻きながら流れる様を「水巻」と図案化したものと説明される
    kind: fact
    level: E5
    status: established
    sources:
    - r4-mizumaki-wiki
  - text: 地方公共団体コードは403822である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 理由書に残った命名の根拠
    text: 多くの自治体では1889年の新村名の理由は伝わらないが、水巻村では合併の施行理由書に「水巻の庄（御牧庄ともあり）と唱えしによる」とはっきり書かれている。中世の荘園名を掘り起こして新しい村の名にした、記録の残る命名の好例である。しかも読みは当初の「みまき」から、町制の頃には「みずまき」へと姿を変えた。棟札の「水の巻く意」という説明と、遠賀川の渦を描いた町章が、今もその語源を伝えている。
    sources:
    - r4-mizumaki-gakkoshi
    - r4-mizumaki-town
  relations:
  - pref/40
  unknowns:
  - 荘園名「水巻の庄（御牧庄）」の成立時期・文献上の初出は確認できなかった
  - 読みが「みまき」から「みずまき」に変わった正確な時期と経緯は確認できなかった
  updated: '2026-11-13'
- id: muni/40-添田町
  code: '406023'
  names:
    ja: 添田町
    reading: そえだまち
    aliases:
    - 添田村
    - 添伊田村
  user_terms:
  - そえだ
  - 添田
  - 田川郡添田町
  - 英彦山の町
  naming_type: 中心地名の継承
  naming_note: 旧村名「添田」の継承
  formation: 合併新設
  prefecture: 福岡県
  homonyms: []
  summary: 田川郡の町。1889年に添田村として発足し、1911年に町制を施行した。町名は合併前からあった旧村「添田」に由来する。その前身には、添田町村・添田村・伊原村が合併して生まれた添伊田村がある。現在も町の大字（添田・庄・野田・津野・桝田・英彦山・落合・中元寺）は1889年以前に存在した8村の名を受け継いでいる。修験の霊峰・英彦山を擁する町でもある。
  first_attestation:
    era: 明治時代
    year_western: 1887
    document: 添田町村・添田村・伊原村の合併による添伊田村の発足
    note: 「添田」は合併前から村名として存在しており、1887年の合併で添伊田村、1889年の合併で添田村となった経緯は確認できるが、「添田」の語源と初出文献は確認できなかった
  claims:
  - text: 町公式資料によれば、現在の大字（添田・庄・野田・津野・桝田・英彦山・落合・中元寺）は1889年以前に存在した8村の名称に由来する
    kind: fact
    level: E2
    status: established
    sources:
    - r5-soeda-town-plan
  - text: 1889年に添伊田村・野田村・庄村が合併して添田村が発足した
    kind: fact
    level: E2
    status: established
    sources:
    - upg-p2-soeda-fuchi
  - text: 1911年に町制を施行して添田町となり、1942年に彦山村を合併、1955年に津野村と合併して現在の添田町となった
    kind: fact
    level: E2
    status: established
    sources:
    - upg-p2-soeda-fuchi
  - text: 「添伊田」は、合併した添田町村・添田村の「添」と伊原村の「伊」を組み合わせた合成地名とみられ、1889年の合併の際にその前半部分の「添田」が村名として残ったと考えられる
    kind: fact
    level: H
    status: inferred
    sources:
    - r5-soeda-wiki
  - text: 英彦山の名の由来について、町公式資料は祭神である天忍穂耳命が日の神・天照大神の子であることと結びつける説明を紹介し、あわせて天平6年（734年）開山説と弘仁13年（822年）の法蓮による修験開祖説を紹介している
    kind: fact
    level: E2
    status: established
    sources:
    - r5-soeda-town-fuchi
  - text: 福岡共同公文書館は、英彦山について、その昔この山へ降臨し山の神とあがめられた日胤尊（ひこのみこと）の名にちなんで日子の山「日子山」と名付けられたとされ、それが変化して「英彦山」と呼ばれるようになったと伝える
    kind: legend
    level: E2
    status: established
    sources:
    - r5-soeda-kobunsyokan
  - text: 添田町の地方公共団体コードは406023である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 日子山から英彦山へ――修験の霊峰の名
    text: 添田町の南にそびえる英彦山は、古くは「日子山」と呼ばれたという。福岡共同公文書館の紹介では、この山に降臨して山の神とあがめられた日胤尊（ひこのみこと）の名にちなんで「日子山」と名付けられ、それが変化して「英彦山」になったと伝わる。一方、町の公式資料は、祭神の天忍穂耳命が日の神・天照大神の子であることと結びつける由来説明を挙げ、開山についても天平6年（734年）説と弘仁13年（822年）に法蓮が修験を開いたとする説とを紹介している。山の名ひとつにも、神話的な伝承と修験の歴史とが幾重にも重なっている。
    sources:
    - r5-soeda-kobunsyokan
    - r5-soeda-town-fuchi
  relations:
  - pref/40
  unknowns:
  - 「添田」の語源（なぜこの地が「添田」と呼ばれたか）は確認できなかった
  - 「添田」の初出文献は確認できなかった
  updated: '2026-11-13'
- id: muni/40-田川市
  code: '402061'
  names:
    ja: 田川市
    reading: たがわし
    aliases:
    - 伊田町
    - 後藤寺町
  user_terms:
  - 炭都たがわ
  - 炭坑節のふるさと
  - 二本煙突のまち
  naming_type: 旧行政区画名の継承
  naming_note: 合併した両町の名ではなく、郡名「田川」を市名としたもの
  formation: 合併新設
  prefecture: 福岡県
  homonyms: []
  summary: 福岡県北東部、田川盆地の市で、筑豊炭田の南部を担った炭鉱のまち。市名は郡名「田川」に由来し、この名は古くは「たかは」と読まれ、鷹羽・高羽・田河とも書かれたという。1943年11月3日、炭鉱で栄えた伊田町と後藤寺町が合併して田川市が誕生した。炭坑節に歌われる二本煙突と伊田竪坑櫓が市の象徴である。
  first_attestation:
    era: 古代
    year_western: null
    document: null
    note: 田川郡の名は古代に遡るが、初出文献の原文確認はできなかった。『精選版日本国語大辞典』は郡名の古い読みを「たかは」とし、鷹羽・高羽・田河の表記を伝える
  claims:
  - text: 田川市の地方公共団体コードは402061である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  - text: 『精選版日本国語大辞典』によれば田川郡は古くは「たかは」といい、鷹羽・高羽・田河とも書かれたといい、『日本歴史地名大系』「田川郡」も古くは田河と書かれたことと、郡域が古代からほぼ変化なかったことを記している
    kind: fact
    level: E3
    status: established
    sources:
    - r3-tagawa-kotobank
    - r3-tagawa-kotobank-gun
  - text: 「田川（たかは）」の語源について、確認した専門辞典には確定的な語源説の記載がなく、語源は確定していない
    kind: fact
    level: E3
    status: indeterminate
    sources:
    - r3-tagawa-kotobank
  - text: 昭和18年（1943年）に伊田町と後藤寺町が合併して田川市が誕生したと、田川市立図書館のデジタルアーカイブは伝える
    kind: fact
    level: E2
    status: established
    sources:
    - r3-tagawa-lib
  - text: 合併による市制の日付は1943年11月3日と変遷記録に残り、1955年4月5日には猪位金村を編入した
    kind: fact
    level: E4
    status: established
    sources:
    - r3-tagawa-uub
  - text: 明治33年（1900）に三井田川炭礦が創業し（大正7年に三井田川鉱業所へ改称）、明治43年（1910）に竣工した伊田竪坑は筑豊の首座とされた
    kind: fact
    level: E2
    status: established
    sources:
    - r3-tagawa-tanto
  - text: 伊田竪坑櫓と第一・第二煙突（通称・二本煙突）は「炭坑節」に歌われる市の象徴で、田川は炭坑節発祥の地とされる
    kind: fact
    level: E2
    status: established
    sources:
    - r3-tagawa-tankosetsu
    - r3-tagawa-tanto
  - text: 筑豊における石炭の発見は文明10年（1478）のことだという言い伝えを、田川市公式の歴史解説は紹介している
    kind: legend
    level: E2
    status: contested
    sources:
    - r3-tagawa-rekishi
  column:
    title: 「たかは」だった田川
    text: いま「たがわ」と読む田川は、古くは「たかは」と呼ばれ、鷹羽・高羽・田河とも書かれた。読みも字も大きく変わっているのに、郡域は古代からほぼそのままだったというから面白い。その田川が全国に知られるようになったのは石炭によってである。伊田と後藤寺、二つの炭鉱町が合併して市になった1943年以降、二本煙突と竪坑櫓は炭坑節とともに「炭都」の印になった。
    sources:
    - r3-tagawa-kotobank
    - r3-tagawa-tankosetsu
  relations:
  - pref/40
  unknowns:
  - 「田川（たかは）」の語源は解明されておらず、川の名前に由来するかどうかも確認できなかった
  - 『日本書紀』景行天皇12年条に「田川」が初出するという地元のウェブサイトの紹介は、原典での裏付けが取れなかった
  updated: '2026-11-13'
- id: muni/40-直方市
  code: '402044'
  names:
    ja: 直方市
    reading: のおがたし
    aliases:
    - 直方藩
    - 東蓮寺藩
    - 東蓮寺村
    - 直方（能方）村
  user_terms:
  - のおがた（読みにくい市名）
  - 直方藩の城下町
  - 筑豊三都のひとつ
  - のおがたチューリップフェスタのまち
  naming_type: 藩名・城名から
  formation: 改称
  prefecture: 福岡県
  homonyms: []
  summary: 福岡県北部、遠賀川流域の市で、飯塚市・田川市と並ぶ筑豊三都の一つ。中心部はもと東蓮寺村と呼ばれ、1623年に東蓮寺藩、1675年に直方藩が置かれた。「直方」の名は、藩内の小村・直方（能方）村の読み「のうがた」に、儒学者・貝原益軒の兄である元端が『易経』から縁起の良い「直方」の字を当てたものと市公式は伝える。1931年1月に市制を施行した。
  first_attestation:
    era: 延宝3年
    year_western: 1675
    document: 直方藩への改称（直方市公式「市名の由来」による）
    note: 藩名としての「直方」の初出。もとになった村名「直方（能方）」自体の初出は未確認である
  claims:
  - text: 直方市の地方公共団体コードは402044である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  - text: 直方の中心部はかつて東蓮寺村と呼ばれ（鞍手郡倉久村の内山寺の末寺・東蓮寺があったため）、元和9年（1623）に黒田長政の遺言によって四男の高政に4万石が与えられ、東蓮寺藩が成立したと市公式は伝える
    kind: fact
    level: E2
    status: established
    sources:
    - r3-nogata-yurai
  - text: 延宝3年（1675）に東蓮寺藩は直方藩へ改称した。市公式によれば命名は儒学者・貝原益軒の兄の貝原元端によるもので、藩内の小村「直方（能方）村」の読み「のうがた」を取り、『易経』から縁起の良い「直方」の字を当てたと伝えられる
    kind: fact
    level: E2
    status: established
    sources:
    - r3-nogata-yurai
  - text: 南北朝時代にこの地方が懐良親王方、すなわち「王方（のうがた）」と呼ばれたことにちなむという別伝も、市公式は併せて伝えている
    kind: legend
    level: E2
    status: contested
    sources:
    - r3-nogata-yurai
  - text: もとの読みは「のうがた」で、現在の「のおがた」はその変化した形とみられる
    kind: fact
    level: E2
    status: inferred
    sources:
    - r3-nogata-yurai
  - text: 1926年に直方町・頓野村・新入村・下境村・福地村が合併して新・直方町となり、1931年1月に市制を施行し、1955年3月に植木町を編入した
    kind: fact
    level: E2
    status: established
    sources:
    - r3-nogata-shiho
  - text: 市報の市制90周年記事は、直方のまちの歩みを1623年の直方藩の設置に始まり、敗戦と復興、石炭景気、その後の石炭産業の衰退と産業構造の転換を経てきたものと概観している
    kind: fact
    level: E2
    status: established
    sources:
    - r3-nogata-shiho
  column:
    title: 『易経』が決めた藩の名前
    text: 直方の読みは「のおがた」。もとは藩内の小さな村の名「のうがた（能方）」だった。1675年に藩の名を改めるとき、儒学者・貝原益軒の兄である元端が、この読みに『易経』の「直方」——まっすぐで方正であるという意味の字——を当てたという。読みにくいと評判の市名は、江戸の学者が選んだ縁起の良い当て字の贈り物だった。南北朝の「王方（のうがた）」に由来するというもう一つの伝説とともに、市公式はこの命名の物語を大切に伝えている。
    sources:
    - r3-nogata-yurai
  relations:
  - pref/40
  unknowns:
  - 村名「直方（能方）」自体の由来と初出は、市公式の解説でも示されていない
  - 貝原元端の命名を裏付ける藩の一次記録は確認できておらず、市公式の伝える伝承として記録した
  updated: '2026-11-13'
- id: muni/40-福岡市
  code: '401307'
  names:
    ja: 福岡市
    reading: ふくおかし
    aliases:
    - 博多
    - 福崎
    - 那の津（那津）
  user_terms:
  - 福岡市と博多市はなぜ分かれていたの
  - 福岡と博多 どっちが古い地名
  - 那の津ってどこ
  - 市名は福岡なのに駅名は博多なのはなぜ
  naming_type: 新規命名
  formation: 不明
  prefecture: 福岡県
  homonyms: []
  summary: 市名「福岡」は、1601年に黒田長政が博多の西隣に築いた城下町の名で、長政が先祖ゆかりの備前福岡にちなんで命名したと地誌が伝える。その下には、古代の港「那津（那の津）」と中世以来の貿易港「博多」という古い地名の層があり、1889年の市制施行では福岡と博多が一つの市となり、市名を福岡とするか博多とするかが争われた。
  first_attestation:
    era: 慶長6年
    year_western: 1601
    document: 福岡城・城下町の命名（経緯は『筑前国続風土記』等に記録）
    note: 市名「福岡」そのものの起源。地名の層としては、8世紀の記録に現れる「博多」、さらに古い「那津」が下に重なる
  claims:
  - text: 市名「福岡」は、1601年（慶長6年）に黒田長政が那珂川西岸の福崎の地に築いた城下町の名に由来し、1889年（明治22年）の市制施行でそのまま市名となった
    kind: fact
    level: E2
    status: established
    sources:
    - f-fukuoka-city
    - f-fukuoka-ndl
  - text: 『筑前国続風土記』は、長政が黒田氏先祖ゆかりの備前国邑久郡福岡にちなんで「福岡」と名付けたと記すと、福岡市史関係資料と国立国会図書館レファレンスが紹介している
    kind: fact
    level: E2
    status: established
    sources:
    - f-cap-chikuzen-fudoki-zoku
    - f-fukuoka-ndl
    - f-fukuoka-city
  - text: 命名の動機については、備前福岡由来説に対し、築城地の旧名「福崎」の丘陵地にちなむとする説もあり、完全には決着していない
    kind: fact
    level: E3
    status: contested
    sources:
    - f-fukuoka-ndl
  - text: 那珂川を挟んだ東側の博多は、もともと博多湾岸一帯を指す広い地名で、中世以降は国際貿易の中心となった都市部分を指すようになったと福岡市史コラムは説明する
    kind: fact
    level: E2
    status: established
    sources:
    - f-fukuoka-city
  - text: 「博多」の文献上の初出は、『続日本紀』（797年完成）の天平宝字3年（759年）の記事にみえる「博多大津」であると福岡市（博多港の歴史）が紹介している
    kind: fact
    level: E2
    status: established
    sources:
    - f-cap-fukuoka-city-port
  - text: さらに古い層として、港は「那津（那の津）」と呼ばれ、『日本書紀』宣化天皇元年（536年）条には、那津の口に穀物を集める官家（那津官家）を造った記事があることを福岡市博物館が紹介している
    kind: fact
    level: E2
    status: established
    sources:
    - f-cap-fukuoka-museum-nanotsu
  - text: 1889年の市制施行後も、市会では「博多市」への改称が争われ、僅差で「福岡」が維持された話が有名であると福岡市史コラムは伝える
    kind: fact
    level: E2
    status: established
    sources:
    - f-fukuoka-city
  - text: 博多の名は、駅名として残ったほか、1972年（昭和47年）に福岡市が政令指定都市へ移行した際、行政区名「博多区」として復活した
    kind: fact
    level: E2
    status: established
    sources:
    - f-fukuoka-city
  - text: 「ハカタ」の語源は確定しておらず、福岡市史コラムも湾岸の地形に由来するという見方を紹介するにとどまる
    kind: fact
    level: E2
    status: indeterminate
    sources:
    - f-fukuoka-city
  column:
    title: 市名は福岡、駅名は博多——妥協が生んだ二つの顔
    text: 1889年、福岡と博多は一つの市になったが、市名をどちらにするかは最後までもめた。人口では博多が福岡を上回っていた時期もあり、翌年の市会でも改称案が争われたと福岡市史は伝える。決着の落としどころとして、同年に開業した九州鉄道の駅名は「福岡駅」ではなく「博多駅」とされた。市役所のある市は福岡、九州最大のターミナル駅は博多、空港は福岡空港——このねじれは、那珂川を挟んで並立した武家の町と商人の町の、400年越しの力関係の化石である。
    sources:
    - f-fukuoka-city
  relations:
  - pref/40
  unknowns:
  - 「ハカタ」の語源（地形由来とされるが具体的な原義）は確定していない
  - 『日本書紀』の「那津」と『続日本紀』の「博多大津」が完全に同一の港を指すかについては検討を要すると専門事典が指摘しており、断定しない
  - 福岡命名を命じた長政自身の同時代文書の現存は確認できず、命名経緯は後世の地誌と家譜に依拠する
  updated: '2026-11-13'
- id: muni/40-福智町
  code: '406104'
  names:
    ja: 福智町
    reading: ふくちまち
    aliases:
    - 金田町
    - 方城町
    - 赤池町
  user_terms:
  - ふくち
  - 福智
  - 福智山の町
  - 旧金田町・方城町・赤池町
  naming_type: 文献・故事から命名
  naming_note: 一般公募により福智山にちなんで命名
  formation: 合併新設
  prefecture: 福岡県
  homonyms: []
  summary: 田川郡の町。2006年3月6日に金田町・方城町・赤池町が対等合併して発足した。町名は一般公募により選ばれたもので、町の北端にそびえる福智山（標高約901m）に由来する。旧3町はいずれも準用財政再建団体となったことがあり、合併は筑豊の町々の再建とも深く結びついている。
  first_attestation:
    era: 平成時代
    year_western: 2006
    document: 金田町・方城町・赤池町の対等合併による福智町の発足
    note: 町名「福智」は2004年8月3日に法定合併協議会が採用で合意したもので、その由来である地名「福智山」はこれ以前から存在する。福智山そのものの名の由来は確認できなかった
  claims:
  - text: 町の暮らしのガイドブックは、福智山（標高901m）を「町の象徴と、町名の由来でもある」存在として紹介している
    kind: fact
    level: E2
    status: established
    sources:
    - r5-fukuchi-guide
  - text: 2006年3月6日に金田町・方城町・赤池町が対等合併して福智町が発足し、町名は一般公募により選ばれたもので、福智山（標高901m）に由来する
    kind: fact
    level: E4
    status: established
    sources:
    - r5-fukuchi-guide
    - r5-fukuchi-uub-akaike
    - r3-iizuka-kokudo
  - text: 福智山は標高901mで、2006年に麓の3町が合併して誕生した福智町の名はこの山に因んで名付けられた
    kind: fact
    level: E2
    status: established
    sources:
    - r5-fukuchi-guide
  - text: 新町名の公募では福智・下田川・あかほ・池田城・北田川・平成・筑豊・赤金城・ふくち・赤金方が上位10点に入り、最終候補は福智・あかほ・下田川の3点に絞られた
    kind: fact
    level: E4
    status: established
    sources:
    - r5-fukuchi-uub-akaike
  - text: 旧3町の前身は、1916年7月28日に町制を施行して金田町と改称した神田村、1939年11月3日に町制を施行して赤池町と改称した上野村、1956年8月1日に町制を施行した方城村（方城町）であり、旧上野村の名は特産の上野焼（あがのやき）に今も残る
    kind: fact
    level: E3
    status: established
    sources:
    - upg-p2-fukuchi-geoshape-kanada
    - upg-p2-fukuchi-kanada-kotobank
    - upg-p2-fukuchi-akaike-kotobank
    - upg-p2-fukuchi-pref-agano
  - text: 旧3町はいずれも準用財政再建団体となったことがあり、赤池町は平成3年度末（1992年）に準用財政再建団体となった
    kind: fact
    level: E2
    status: established
    sources:
    - upg-p2-fukuchi-ndl-ref
  - text: 福智町の地方公共団体コードは406104である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 公募で敗れた名前たち――「下田川」と「あかほ」
    text: 福智町の名は公募で決まった。市区町村変遷情報が伝える公募の上位10点には、採用された「福智」のほかに、旧赤池町・金田町を流れる下田川にちなむ「下田川」、赤池と方城の名を織り込んだとみられる「あかほ」、旧町の名を合成した「赤金城」「赤金方」、そして「平成」「筑豊」などがあった。最終候補は福智・あかほ・下田川の3点で、最後に残ったのは3町に共通する象徴である福智山の名だった。敗れた候補の数々が、合併前の3町の名をどう残すかに悩んだ経緯を物語っている。
    sources:
    - r5-fukuchi-uub-akaike
    - r5-fukuchi-wiki
  relations:
  - pref/40
  unknowns:
  - 福智山そのものの名の由来（「福智」の語源）は確認できなかった
  - 新町名公募の応募総数と各候補の得票数は確認できなかった
  updated: '2026-11-13'
- id: muni/40-福津市
  code: '402249'
  names:
    ja: 福津市
    reading: ふくつし
    aliases: []
  user_terms:
  - 福津の名前の由来
  - 福間と津屋崎が合併した市
  - 幸福が集まる津
  naming_type: 新規命名
  formation: 合併新設
  prefecture: 福岡県
  homonyms: []
  summary: 2005年1月24日に宗像郡福間町と津屋崎町が合併して誕生した新市で、市名は全国公募によって選ばれた。市の20周年記念誌は、「福津」という名に「幸福が集まる津（港、場所）」「津々浦々まで幸福であるように」という思いが込められていると説明する。旧町名の福間は中世以来の地域呼称「ふくま」に、津屋崎は岬の地形に由来するとされる古い港町の名に、それぞれ由来の層がある。
  first_attestation:
    era: 平成17年
    year_western: 2005
    document: 福間町・津屋崎町合併協議会による新市名の決定
    note: 自治体名としての「福津市」の初出。新市名は公募3,064通・698種類の中から選ばれた（福津市20周年記念誌）
  claims:
  - text: 福津市の地方公共団体コードは402249である（総務省「地方公共団体コード一覧」による）
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  - text: 2005年1月24日、宗像郡福間町と津屋崎町が合併して福津市となった
    kind: fact
    level: E2
    status: established
    sources:
    - r2-fukutsu-city-gaikyo
  - text: 市名「福津」は公募で選ばれた名であり、全国から3,064通・698種類の応募があったと福津市の20周年記念誌は伝える
    kind: fact
    level: E2
    status: established
    sources:
    - r2-fukutsu-city-20th
  - text: 福津市の20周年記念誌は、「福津」という地名には「幸福が集まる津（港、場所）」「津々浦々まで幸福であるように」という思いが込められていると説明する
    kind: fact
    level: E2
    status: established
    sources:
    - r2-fukutsu-city-20th
  - text: 福間という名は、西郷川下流域（現在のJR福間駅から西の海岸線までの地域）を中世から「ふくま」と呼んでいたことに由来すると『福岡県地名考』は紹介する
    kind: fact
    level: E4
    status: established
    sources:
    - r2-munahaku-chimei
  - text: 福間の語源については、『福間町史』が『和名類聚抄』の蓑生郷（訓み「美乃布」）の「美乃布の隈（入り込んだ地形）」が縮まって「布隈」となり「ふくま」になったとする説を説明し、『市町村名語源辞典』はフケ（湿地）・マ（接尾語）の転化で砂州に囲まれた湿地を指すとする説を挙げており、両説が併存する
    kind: fact
    level: E4
    status: contested
    sources:
    - r2-munahaku-chimei
  - text: 津屋崎の語源については、『市町村名語源辞典』がツエ（崩壊地形）・サキ（崎）の転じたもので断崖の岬を指すとする説と、「津屋」を港の施設とする説を紹介している
    kind: fact
    level: E3
    status: contested
    sources:
    - r2-munahaku-chimei
  - text: 津屋崎の波折神社の縁起には、神功皇后が杖をさした地が「杖さし」から津恵崎になったという言い伝えがあり、また仏像の漂着を一晩通夜してお祭りした「通夜崎」が転じたという言い伝えもあるが、『津屋崎風土記』はいずれも伝説の域を出ないとしている
    kind: legend
    level: E4
    status: established
    sources:
    - r2-munahaku-chimei
  column:
    title: 市の名前に込めた「幸福」の願い
    text: 福津市の名前は、全国公募で集まった3,064通・698種類の候補の中から選ばれた。候補には「北筑前市」「宮地岳市」、そして「うみがめ市」といった名もあったという。「福間」の「福」と「津屋崎」の「津」を合わせた形にも読めるこの名前について、市自身は別の説明を用意している。「幸福が集まる津（港、場所）」「津々浦々まで幸福であるように」という願いが込められている、と。合併で生まれる新しい市に、旧町名の面影と未来への願いを同時に託した命名だった。
    sources:
    - r2-fukutsu-city-20th
  relations:
  - pref/40
  - muni/40-宗像市
  - muni/40-古賀市
  unknowns:
  - 市名の最終選考過程（候補の絞り込みと決定理由）を示す合併協議会の議事録は未確認
  - 福間の語源は諸説が併存し、確定していない
  updated: '2026-11-13'
- id: muni/40-筑前町
