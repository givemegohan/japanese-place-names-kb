  unknowns:
  - 2005年の合併協議で新町名「木曽」を選定した経緯（公募の有無や候補名）を明記した公的資料は確認できていない
  - 広域地名「木曽」の語源と一次資料上の初出は確認できていない
  updated: '2026-11-13'
- id: muni/20-木祖村
  code: '204251'
  names:
    ja: 木祖村
    reading: きそむら
    aliases: []
  user_terms:
  - 木曽川の源流の村
  - 木曽郡の村
  - 藪原宿のある村
  naming_type: 新規命名
  prefecture: 長野県
  homonyms: []
  summary: 長野県木曽郡の村。木曽川の源流域にあり、1874年（明治7年）に藪原村・小木曽村・菅村が合併して生まれた。村名は、木曽川の源流であることから「木曽の祖」という意味を込めて付けられた。一度分村したが1889年（明治22年）に再合併して現在の村となった。なお「木曽」の「曽」ではなく「祖」の字を使う点が村資料でも注意されている。
  first_attestation:
    era: 明治7年
    year_western: 1874
    document: null
    note: 村名「木祖」は1874年の3村合併に伴う命名そのものが初出。1889年は分村後の再合併の年である。
  claims:
  - text: 明治7年（1874年）に藪原村・小木曽村・菅村が合併して木祖村となり、明治17年（1884年）にいったん分村したものの、明治22年（1889年）に再び合併して現在の木祖村になったと、木祖村公式の議会概要（村の沿革）が記す
    kind: fact
    level: E2
    status: established
    sources:
    - x1-kisomura-gikai
  - text: 村名「木祖」は、木曽川の源流であることから「木曽の祖なり」という意味を込めて付けられたと、木祖村役場総務課の資料が説明する
    kind: fact
    level: E2
    status: established
    sources:
    - x1-kisomura-yakuba
  - text: 農林水産省の事例資料も「明治7年 藪原村・小木曽村・菅村が合併、木曽の祖として木祖村と命名」と記し、命名の経緯を裏づける
    kind: fact
    level: E2
    status: established
    sources:
    - x1-kisomura-maff
  - text: 木曽川は村内の鉢盛山（標高2,446m）を源とし、長野・岐阜・愛知を流れて伊勢湾に注ぐ川であると、国土交通省中部地方整備局の資料として紹介されている
    kind: fact
    level: E4
    status: established
    sources:
    - x1-kisomura-donnatoko
  - text: 村役場の資料は、村名の表記について「木曽」の「曽」ではなく「祖」の字を使うことに注意を促しており、両者は別の言葉として意識されている
    kind: fact
    level: E2
    status: established
    sources:
    - x1-kisomura-yakuba
  - text: 村内の藪原は中山道・木曽路11宿の1つ「藪原宿」の地であり、享保年間から続くお六櫛の産地として知られたと農林水産省資料が紹介する
    kind: fact
    level: E2
    status: established
    sources:
    - x1-kisomura-maff
  - text: 地方公共団体コードは204251である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 「曽」ではなく「祖」――源流の名乗り
    text: 木曽川は木祖村の鉢盛山に源を発し、伊勢湾まで流れる大河である。その「源（もと）」であることを名前に刻んだのが「木祖」で、郡名の「木曽」の「曽」とは字が違う。村役場の資料にも「『曽祖父』等の『祖』です」とわざわざ断りがあるほどで、村の人々にとってこの一字は源流の里の名乗りそのものだ。1874年の命名以来、分村と再合併を経てもこの名は守られてきた。木祖村役場総務課の資料と農林水産省の事例資料に基づく。
    sources:
    - x1-kisomura-yakuba
    - x1-kisomura-maff
  relations:
  - pref/20
  - muni/20-木曽町
  - muni/20-王滝村
  unknowns:
  - 1874年の命名を決めた当時の文書（合併願書等）の原文は確認できていない
  - 1884年の分村の理由は資料で確認できていない
  updated: '2026-11-13'
- id: muni/20-東御市
  code: '202193'
  names:
    ja: 東御市
    reading: とうみし
    aliases:
    - 東部町
    - 北御牧村
  user_terms:
  - とうみし
  - 東部と御牧の合成市名
  - 東御の名前の由来
  naming_type: 合併新設
  prefecture: 長野県
  homonyms: []
  summary: 東御市は2004年に小県郡東部町と北佐久郡北御牧村が合併して生まれた市で、郡境を越えた合併だった。市名「東御」は、東部町の「東」と北御牧村の「御」の各1文字を取った合成地名で、読みは「とうみ」。「御」の元になった北御牧村の名は、平安時代の信濃御牧・望月牧の北半が村域だったことに由来するとされる。
  first_attestation:
    era: 平成16年
    year_western: 2004
    document: 東部町・北御牧村の合併（東御市公式サイト「東部町と北御牧村の合併協議の経過」による）
    note: 市名としての「東御」の命名そのもの
  claims:
  - text: 平成16年（2004年）4月1日に、小県郡東部町と北佐久郡北御牧村が新設合併して、長野県下で第18番目の新市「東御市」が誕生した
    kind: fact
    level: E2
    status: established
    sources:
    - v2-tomi-gappei
  - text: 市名「東御」は、合併した東部町の「東」と北御牧村の「御」の各1文字を取った合成地名である（Wikipedia「東御市」による）
    kind: fact
    level: E5
    status: established
    sources:
    - v2-tomi-wiki
  - text: 新市名の選定にあたっては、合併協議会に新市名称候補選定小委員会が置かれ、平成15年（2003年）5月16日から6月14日にかけて新市名称アンケート調査が実施され、6月16日に開票された
    kind: fact
    level: E2
    status: established
    sources:
    - v2-tomi-gappei
  - text: 「御」の元になった北御牧村の村名は、平安時代の信濃御牧（官牧）の一つで最も貢馬が多かったと伝えられる望月牧の、北半分が村域だったことから「北御牧村」としたものである（Wikipedia「北御牧村」が東部町・北御牧村合併協議会の町村プロフィールを引いて紹介するもの）
    kind: fact
    level: E5
    status: established
    sources:
    - v2-tomi-kitami
  - text: 合併した2町村は、小県郡と北佐久郡という異なる郡に属し、それぞれ上田地域と佐久地域に分かれていた
    kind: fact
    level: E2
    status: established
    sources:
    - v2-tomi-gappei
  - text: 東御市の地方公共団体コードは202193である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 10月3日は「東御の日」
    text: 「東御」と書いて「とうみ」と読む。この読みは、東部町の「東（とう）」と北御牧村の「御（み）」を組み合わせた合成地名だからこそ生まれた、新しい読みである。そして市は、この語呂にちなんで10月3日を「東御の日」としている。合併で生まれた名の弱点は「読みにくさ」だが、東御市はそれを逆手に取り、記念日に変えてしまった。郡も広域圏も違う2町村が一つの市になる象徴として、名の読みまで含めて新しく作られた例である。
    sources:
    - v2-tomi-wiki
    - v2-tomi-gappei
  relations:
  - pref/20
  unknowns:
  - 市名の最終候補5点（東御・東信濃・美駒・御牧野・湯の牧）と「東御」が28.9%で最多だったという数値は、市区町村変遷情報サイトで見られる情報であり、市公式資料では確認できなかった
  - 「東御」が合成地名であることの、市公式資料による明示は確認できなかった（Wikipediaによる）
  - 東部町の「東部」という名の由来（1956年に田中町・祢津村・和村が合併して発足した際の命名理由）は確認できなかった
  updated: '2026-11-13'
