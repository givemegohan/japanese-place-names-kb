    - x1-kijimadaira-donnatoko
  - text: 木島は「鬼島」であり、稲光や豪雨をもたらす鬼を恐れた名残が照明寺旧大門の「鬼の首塚」に残り、村名の語源になったという伝説が伝わると、長野県の災害伝承データが紹介する
    kind: legend
    level: E2
    status: indeterminate
    sources:
    - x1-kijimadaira-saigai
  - text: 地方公共団体コードは205621である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 郷の名と総称が重なった村名
    text: 木島平村の名は二つの層からできている。中世の「木島郷」と、近世に18カ村の総称として幕府にも認められた「木島平」である。1955年の合併で3村が選んだのは、どの旧村の名でもなく、村々全体を指してきた広い地名だった。一方で村には「木島は鬼島」という伝説も伝わる。豪雨という災いを鬼に見立てた言い伝えで、災害伝承として県が記録している。木島平村公式の村史と長野県「災害伝承データ」に基づく。
    sources:
    - x1-kijimadaira-sonshi
    - x1-kijimadaira-saigai
  relations:
  - pref/20
  - muni/20-栄村
  unknowns:
  - 「木島」の語源そのもの（木の島状の地形か、鬼島の当て字か等）は資料で確定していない
  - 1955年の合併時に村名を「木島平」と決めた協議の記録は確認できていない
  updated: '2026-11-13'
- id: muni/20-木曽町
  code: '204323'
  names:
