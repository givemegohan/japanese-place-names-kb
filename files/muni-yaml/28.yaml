  - 淡路島の中心の市
  - 洲本城のある市
  naming_type: 中心地名の継承
  formation: 合併新設
  prefecture: 兵庫県
  homonyms: []
  summary: 洲本は淡路島の中心地で、市の市章解説によれば「往古、海浜の洲にあった」ことから付いた地名である。中世には港町として史料に現れ、近世には徳島藩家老稲田氏の城下町となった。1940年に市制を施行し、2006年に五色町と合併して現在の市域となった。市名は中心地だった洲本町の名をそのまま継いでいる。
  first_attestation:
    era: 室町時代
    year_western: 1445
    document: 兵庫北関入船納帳・兵庫北関雑船納帳
    note: 日本歴史地名大系によれば、文安2年（1445）の入船納帳の中に、米・塩・材木を積んだ「洲本」「スモト」「須本」の船が見える
  claims:
  - text: 地方公共団体コードは282057である
    kind: fact
    level: E2
    status: established
    sources:
    - d-cap-jlis-hyogo
  - text: 洲本市は市章の由来として「洲本は往古海浜の洲にあったので、地名を洲本と呼ぶようになった」と説明している
    kind: fact
    level: E2
    status: established
    sources:
    - p4-sumoto-city-gaiyo
  - text: 日本歴史地名大系によれば、現在の洲本川（塩屋川）河口右岸一帯を指す地名で「須本」とも記され、文安2年（1445）の兵庫北関の入船納帳に「洲本」の名が見える
    kind: fact
    level: E3
    status: established
    sources:
    - p4-kotobank-sumoto
  - text: 近世の洲本は、徳島藩（蜂須賀氏）の家老稲田氏が洲本城に代々居城した城下町で、淡路全域を支配する拠点となったと洲本市は紹介する
    kind: fact
    level: E2
    status: established
    sources:
    - p4-sumoto-city-kyoiku
  - text: 明治4年（1871年）の廃藩置県で淡路島は名東県（徳島県側）となり、明治9年（1876年）に全島が兵庫県の管轄となった
    kind: fact
    level: E2
    status: established
    sources:
    - p4-sumoto-city-kyoiku
  - text: 昭和15年（1940年）に市制が施行された
    kind: fact
    level: E3
    status: established
    sources:
    - p4-kotobank-sumoto
  - text: 平成18年（2006年）2月に五色町と合併した
    kind: fact
    level: E3
    status: established
    sources:
    - p4-kotobank-sumoto
  column:
    title: 市章に残る「洲」の記憶
    text: 洲本市の市章は「洲浜の紋」である。市が市章の由来として語るのは、「洲本は往古、海浜の洲にあったので、地名を洲本と呼ぶようになった」という説明だ。洲本川の河口にできた砂洲の集落が、やがて港町として史料に顔を出し、近世には淡路支配の拠点の城下町になった。地名の由来の説明がそのまま市の紋章の意匠になっている例は珍しく、洲本では名前と紋章が同じ物語を伝えている。
    sources:
    - p4-sumoto-city-gaiyo
    - p4-sumoto-city-kyoiku
  relations:
  - pref/28
  - muni/28-淡路市
  - muni/28-南あわじ市
  unknowns:
  - 「本」の字の意味（洲の中心・本拠の意か）について、市の市章解説以上の典拠は確認できなかった
  - 室町時代より前の用例は確認できなかった
  updated: '2026-11-13'
- id: muni/28-淡路市
  code: '282260'
  names:
    ja: 淡路市
    reading: あわじし
    aliases:
    - 淡路町
  user_terms:
  - 淡路市の名前の由来
  - あわじ
  - 国生みの島の市
  - 伊弉諾神宮のある市
  naming_type: 中心地名の継承
  formation: 合併新設
  prefecture: 兵庫県
  homonyms: []
  summary: 淡路市は2005年、津名郡の5町（津名町・淡路町・北淡町・一宮町・東浦町）が合併して誕生し、市名は旧淡路町の名を引き継いだ。「淡路」は古代の国名で、『古事記』の国生み神話で最初に生まれた島「淡道之穂之狭別島」に比定される島の名であり、「アハヂ」は阿波国へ行く道の意味とされる。
  first_attestation:
    era: 古代
    year_western: null
    document: 『古事記』上巻（国生み神生み）
    note: 國學院大學の地名データベースによれば、『古事記』に見える「淡道之穂之狭別島」が大八島国の第一の島で、淡路島に比定される
  claims:
  - text: 地方公共団体コードは282260である
    kind: fact
    level: E2
    status: established
    sources:
    - d-cap-jlis-hyogo
  - text: 國學院大學の古事記地名データベースによれば、『古事記』の国生み神話で伊耶那岐神・伊耶那美神が最初に生んだ島「淡道之穂之狭別島」が淡路島に比定される
    kind: fact
    level: E2
    status: established
    sources:
    - p4-kokugakuin-awaji
  - text: 「アハヂ」という名は、阿波国へ行く道の意味とされる
    kind: fact
    level: E2
    status: established
    sources:
    - p4-kokugakuin-awaji
  - text: 『日本書紀』神代第四段の本書には、最初に生まれた淡路洲を胞（えな）として意に快からず「淡路洲」と名付けたという地名起源の記事があることが、國學院大學の地名データベースで紹介されている
    kind: legend
    level: E2
    status: established
    sources:
    - p4-kokugakuin-awaji
  - text: 『延喜式』神名帳の淡路国津名郡「淡路伊佐奈伎神社」は、現在の伊弉諾神宮（淡路市多賀）に当たるとされる
    kind: fact
    level: E2
    status: established
    sources:
    - p4-kokugakuin-awaji
  - text: 2005年（平成17年）4月1日、津名郡の津名町・淡路町・北淡町・一宮町・東浦町が合併して淡路市が誕生し、市名はその一つである淡路町の名を引き継いだ
    kind: fact
    level: E2
    status: established
    sources:
    - p4-awaji-gappei
  column:
    title: 最初に生まれた島の名前
    text: 『古事記』の国生みでは、伊耶那岐・伊耶那美の二神が生んだ大八島国のうち、最初に生まれたのが淡路島に比定される「淡道之穂之狭別島」だった。一方『日本書紀』には、最初に生まれたこの島を不完全な「胞」と見なして名付けたという、やや対照的な起源譚が残されている。市域の多賀には二神を祀る伊弉諾神宮があり、「国生み第一の島」という物語は、今も淡路市の看板であり続けている。
    sources:
    - p4-kokugakuin-awaji
  relations:
  - pref/28
  - muni/28-洲本市
  - muni/28-南あわじ市
  unknowns:
  - 新市名の選定過程（公募の有無や他の候補名）については、合併協議会資料での確認が未了
  - 「穂之狭別」の語義については諸説があり、特定できなかった
  updated: '2026-11-13'
- id: muni/28-猪名川町
  code: '283011'
  names:
    ja: 猪名川町
    reading: いながわちょう
    aliases:
    - 猪名野
  user_terms:
  - 猪名川
  - いながわ
  - 川辺郡猪名川町
  - 多田銀銅山の町
  naming_type: 自然地名から
  naming_note: 川名「猪名川」の継承とみられる
  formation: 合併新設
  prefecture: 兵庫県
  homonyms: []
  summary: 川辺郡の町で、兵庫県の南東部に位置する。1955年に中谷村と六瀬村が合併して誕生した。町名は、町最北部の大野山を源流とし町の中央を南流する猪名川にちなむとみられる。川名の由来には、『住吉大社神代記』の阿我奈川の伝承と、『日本書紀』『新撰姓氏録』に現れる職能集団「猪名部」に結びつける説がある。
  first_attestation:
    era: ''
    year_western: null
    document: ''
    note: 川名「猪名川」の文献上の初出は確認できなかった。『住吉大社神代記』の「阿我奈川」をその前身とする伝承がある
  claims:
  - text: 1955年（昭和30年）4月10日、中谷村と六瀬村が合併して猪名川町が誕生した
    kind: fact
    level: E2
    status: established
    sources:
    - x12-inagawa-yoran
    - x12-inagawa-shirahama
    - x12-inagawa-town-lib
  - text: 猪名川は町の最北部にある大野山（標高753m）を水源地とし、渓谷を南に流れて町の中央を貫く
    kind: fact
    level: E2
    status: established
    sources:
    - x12-inagawa-mlit
    - x12-inagawa-shirahama
  - text: 新町名「猪名川」は、この川の名をそのまま採用したものとみられる。ただし、合併当時の命名経緯を明示した資料は確認できなかった
    kind: fact
    level: H
    status: inferred
    sources:
    - x12-inagawa-mlit
    - x12-inagawa-town-lib
  - text: 国土交通省猪名川河川事務所は、川名の由来について、『住吉大社神代記』によれば、川のほとりに住んでいた山直阿我奈賀（やまのあたいあがなが）が川を阿我奈川と名付け、それが訛って為奈川（いながわ）となったと言われている、と紹介する
    kind: legend
    level: E2
    status: established
    sources:
    - x12-inagawa-mlit
  - text: 一方、尼崎市教育委員会の資料は、『日本書紀』に猪名部御田が見えること、『新撰姓氏録』に猪名部造・為奈部首が見えることを挙げ、「猪名野」は猪名部（朝廷に仕えた職能集団）の住む野に由来すると考えられると説明する。川名の由来については、この説も併存する
    kind: fact
    level: E2
    status: contested
    sources:
    - x12-inagawa-ama
  - text: 町内の多田銀銅山は、東大寺大仏の鋳造の際に銅を献上したと伝えられている
    kind: legend
    level: E2
    status: established
    sources:
    - x12-inagawa-shirahama
  - text: 1970年代以降、町南部では日生ニュータウン・猪名川パークタウンなどの大規模開発が進み、合併当初7,000人台だった人口は2010年には31,700人を超えた
    kind: fact
    level: E2
    status: established
    sources:
    - x12-inagawa-shirahama
  - text: 猪名川町の地方公共団体コードは283011である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 「猪」の字は、イノシシではないかもしれない
    text: 猪名川の「猪」は、動物のイノシシとは無関係かもしれない。古代、朝廷に仕える職能集団に「猪名部（いなべ）」があり、『日本書紀』や『新撰姓氏録』にその名が見える。この一帯は「猪名野」と呼ばれ、猪名部の人々の本拠だったと考えられている。いっぽう『住吉大社神代記』には、山直阿我奈賀が名付けた「阿我奈川」が訛って「為奈川」になったという物語もある。二つの由来譚が重なって、今の「猪名川」の字がある。
    sources:
    - x12-inagawa-ama
    - x12-inagawa-mlit
  relations:
  - pref/28
  unknowns:
  - 合併時の町名選定の経緯（なぜ川名が採用されたか）を記した一次資料は未確認
  - 川名「猪名川」の文献上の初出は未確認。神代記説と猪名部説のどちらが古い地名の実態に近いかは判断できない
  updated: '2026-11-13'
- id: muni/28-相生市
  code: '282081'
  names:
    ja: 相生市
    reading: あいおいし
    aliases:
    - おお
    - 大浦
  user_terms:
  - あいおい
  - おお（旧称）
  - 世界最短の地名だった町
  naming_type: 表記・読みの変更
  formation: 単独発足
  prefecture: 兵庫県
  homonyms: []
  summary: 1942年に相生町が単独で市制施行した市。「相生」はもともと「おお」と読まれた名で、元の地名「大浦」に、相模国出身の海老名氏が故郷にちなんで字を当てたのが始まりとする説がある。読みが「あいおい」に改められたのは1939年のことで、それまで正式な読みは「おお」だった。高砂市の高砂神社にある「相生の松」とは文化的な対として知られるが、市名の由来そのものは松とは別の層にある。
  first_attestation:
    era: ''
    year_western: null
    document: ''
    note: 「相生」の確実な初出は未確認。小学館『日本大百科全書』「相生（市）」は一説として、もと那波浦の字大浦といったが、12世紀末ごろ大島に城を構えた海老名氏が生国の相模にちなんで相生と改めたという説を紹介するが、裏づけとなる同時代史料は未確認である
  claims:
  - text: 相生市は昭和17年（1942）10月1日に、赤穂郡相生町が単独で市制施行して誕生した
    kind: fact
    level: E2
    status: established
    sources:
    - upg-u1-geoshape-aioi-shi
    - upg-u1-geoshape-aioi-cho
  - text: 相生の地名は、一説に、もと那波浦の字（あざ）大浦といったが、12世紀末ごろ大島に城を構えた海老名氏の生国の相模にちなんで相生と改められ、大島の「大」の音をとって「おお」と読ませたことに始まるという
    kind: fact
    level: E3
    status: contested
    sources:
    - upg-u1-kotobank-aioi
  - text: 相生町はもともと「相生（おお）」と読まれていたが、1939年に那波町を編入した際、読みが「あいおい」に変更された
    kind: fact
    level: E3
    status: established
    sources:
    - upg-u1-kotobank-aioi
  - text: 現在でも相生市相生の集落一帯は通称「おお」と呼ばれており、「O」という地名としてギネスブックに「世界最短の地名」の一つとして掲載されていたことがある
    kind: fact
    level: E5
    status: established
    sources:
    - x3-wiki-aioi
  - text: 赤穂郡相生町は、1913年1月1日に相生村が町制を施行して発足した
    kind: fact
    level: E2
    status: established
    sources:
    - upg-u1-geoshape-aioi-cho
  - text: 高砂市の高砂神社には「相生の松」があり、謡曲『高砂』ゆかりの地として相生市と文化的に結びつけて語られるが、相生市の市名の由来として百科事典が紹介する説は松ではなく、もと「大浦」と呼ばれた地に、相模にちなむ「相生」の字が当てられたというものである
    kind: fact
    level: E3
    status: contested
    sources:
    - upg-u1-kotobank-aioi
    - x3-takasago-meisho
  - text: 総務省の全国地方公共団体コードで、相生市の団体コードは282081と定められている
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 昭和14年まで「おお」と読まれた「相生」
    text: 相生市は長いあいだ、「相生」と書いて「おお」と読む町でした。正式な読みが「あいおい」に改められたのは昭和14年（1939）のことです。元の地名は「大浦」で、「おお」はその名残だと考えられています。「相生」の字は、相模国から来た海老名氏が故郷にちなんで当てたものだという説が、百科事典に紹介されています。今も相生地区の集落は通称「おお」と呼ばれ、その短さから一時はギネスブックに「世界最短の地名」の一つとして載っていたこともあります。読みが変わっても、土地の人の呼び名は古い名を残しているのです。
    sources:
    - x3-wiki-aioi
  relations:
  - pref/28
  - muni/28-高砂市
  unknowns:
  - 海老名氏が「相生」と改めたという説の原拠となる中世史料は未確認で、百科事典の紹介によった。相生市公式サイトの由来説明も未確認である
  - 読みが「あいおい」に変更された正確な日（1939年4月11日）はWikipediaのみが伝えるもので、専門辞典では年の精度までしか確認できなかった
  - 相生村が1889年の町村制施行で発足したことはWikipediaの紹介によるもので、強い出典での確認は未了である
  - 「相生」が双生や夫婦和合の意味から名づけられたという説明は、公的資料では確認できなかった
  updated: '2026-11-13'
- id: muni/28-神戸市
  code: '281000'
  names:
    ja: 神戸市
    reading: こうべし
    aliases:
    - 神戸村
    - 神戸区
    - かんべ
  user_terms:
  - 生田神社のまち
  - 兵庫津の隣の港町
  - 開港で育った港町
  naming_type: 中心地名の継承
  formation: 単独発足
  prefecture: 兵庫県
  homonyms: []
  summary: 市名は生田神社の神戸（かんべ）の集落名に由来する。神社に属して神社を支えた民戸の居住地が「神戸村」となり、1868年の開港で港町として発展し、1889年に神戸市が発足した。読みはもとの「かんべ」から「こうべ」へ変化した。
  first_attestation:
    era: 神功皇后摂政元年（伝承）
    year_western: null
    document: 『日本書紀』神功皇后条
    note: 生田神社の創祀を伝える記事で、神戸の地名伝承の起点とされる。ただし地名「神戸」そのものの文書上の初出ではなく、その年代は未確認である。
  claims:
  - text: 「神戸」の名称は生田神社の神戸（かんべ）に由来すると辞典類は解説する。神戸（かんべ）とは、神社に属して租・庸・調や雑役を神社に納めた民戸（神封戸）のことである。
    kind: fact
    level: E3
    status: established
    sources:
    - d-cap-kobe-kotobank
  - text: 神戸市の資料も、古代、神領で神社を支えていた家のことを「かんべ」（神戸）といい、神戸の地名は生田神社の「かんべ」に由来すると伝わると説明する。
    kind: fact
    level: E2
    status: established
    sources:
    - d-cap-kobe-ikuta
  - text: 地名の読みは、もとの「かんべ」から「かうべ」を経て、現在の「こうべ」へと変化した。
    kind: fact
    level: E3
    status: established
    sources:
    - d-cap-kobe-kotobank
  - text: 修好通商条約で開港が定められたのは兵庫津だったが、実際の開港場と外国人居留地は神戸村に置かれ、慶応3年12月7日（西暦1868年1月1日）に開港した。
    kind: fact
    level: E2
    status: established
    sources:
    - d-cap-kobe-port
    - d-cap-kobe-archives
  - text: 1879年の郡区制実施に伴い、兵庫・神戸に坂本村を加えた「神戸区」が置かれ、現在の神戸市の原型となる行政単位が形成された。
    kind: fact
    level: E2
    status: established
    sources:
    - d-cap-kobe-archives
  - text: 1889年4月1日、神戸区に荒田村と葺合村を加えて神戸市が誕生した。
    kind: fact
    level: E2
    status: established
    sources:
    - d-cap-kobe-archives
  - text: 開港前の神戸村は、現在の神戸市中央区の元町通三丁目から生田川へかけての一帯にあたる小さな村であった。
    kind: fact
    level: E4
    status: established
    sources:
    - d-cap-kobe-motomachi
  - text: 生田神社は、神功皇后により布引の滝付近にある砂山に祀られたことが始まりと『日本書紀』に記される伝承があり、799年の大洪水により砂山が崩壊したため、現在の地に移されたと伝えられる。
    kind: legend
    level: E2
    status: established
    sources:
    - d-cap-kobe-ikuta
  - text: 神戸市の地方公共団体コードは281000である。
    kind: fact
    level: E2
    status: established
    sources:
    - d-cap-jlis-hyogo
  column:
    title: 「神戸」は「かんべ」だった
    text: 「神戸」という字面からは「神の戸」を想像しがちだが、もとの読みは「かんべ」である。神社に属し、神社の維持にあたった家々を神戸（神封戸）といい、生田神社の神戸の集落がそのまま地名になった。読みは「かうべ」を経て「こうべ」に変わったが、字は古代の制度の名をそのまま残している。開港地として世界に知られるようになった港町の名前は、実は律令時代の神社の戸籍に由来する。
    sources:
    - d-cap-kobe-kotobank
    - d-cap-kobe-ikuta
  relations:
  - pref/28
  unknowns:
  - 地名「神戸」が文書に現れる初出の年代は、参照した市公式・辞典資料では特定できなかった。
  - 生田神社の神戸がどの程度の規模の集落をなし、いつ「神戸村」として定着したかなど、成立過程の詳細は未確認である。
  updated: '2026-11-13'
