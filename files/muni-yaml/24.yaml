    sources:
    - x8-watarai-gun
  - text: 度会氏は明治初期まで伊勢神宮外宮（豊受大神宮）の祠官を世襲した氏族で、その主な根拠地は伊勢国度会郡であった
    kind: fact
    level: E5
    status: established
    sources:
    - x8-watarai-clan
  - text: 度会町公式サイトは、町は古代から伊勢神宮の歴史と関わりが深く、萱の御料地などが町内各地に残されていると記す
    kind: fact
    level: E2
    status: established
    sources:
    - x8-watarai-town
  - text: 天照大御神を内宮に祀ったとされる倭姫命の伝説が町内各地に残されていると、度会町公式サイトは伝える
    kind: legend
    level: E2
    status: established
    sources:
    - x8-watarai-town
  - text: 度会町の地方公共団体コードは244708である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 神宮の祠官・度会氏の郡
    text: 「度会」という名は、伊勢神宮の外宮に深く結びついている。外宮の祠官を代々世襲した度会氏はこの郡を本拠とし、中世には伊勢神道を唱えて内宮方と張り合った。もっとも郡名と氏名のどちらが先かは単純ではなく、郡そのものは神宮最古の神郡の一つに数えられる。1955年に新しい村の名を公募したとき、住民の半数以上が選んだのは、この千年の重みを持つ「度会」だった。神宮のご料地や倭姫命の伝説が点在する町に、それ以上の名は要らなかったということだろう。
    sources:
    - x8-watarai-clan
    - x8-watarai-wiki
  relations:
  - pref/24
  - muni/24-玉城町
  - muni/24-伊勢市
  unknowns:
  - 郡名「度会」と氏族名「度会氏」の先後関係、および「度会」の語源そのもの
  - 1955年の公募における「度会」以外の候補名
  updated: '2026-11-13'
- id: muni/24-御浜町
  code: '245615'
  names:
    ja: 御浜町
    reading: みはまちょう
    aliases: []
  user_terms:
  - みはまちょう
  - 御浜
  - 七里御浜の町
  - 年中みかんのとれる町
  naming_type: 自然地名から
  naming_note: 1958年の合併で生まれた新町名。熊野灘に面する長大な礫浜「七里御浜」にちなんで名づけられた
  formation: 合併新設
  prefecture: 三重県
  homonyms: []
  summary: 三重県南部、南牟婁郡の町。1958年に阿田和町・神志山村・市木尾呂志村の合併で発足した。町名は、熊野灘に延びる長大な礫浜「七里御浜」にちなむと『日本大百科全書（ニッポニカ）』が明記する。「年中みかんのとれる町」として知られる柑橘の産地でもある。
  first_attestation:
    era: 昭和33年
    year_western: 1958
    document: 阿田和町・神志山村・市木尾呂志村の合併による御浜町発足
    note: 町名としての初出。由来となった浜名「七里御浜」自体の文献上の初出は、確認できていない
  claims:
  - text: 1958年9月1日に阿田和町・神志山村・市木尾呂志村が合併して御浜町が発足した
    kind: fact
    level: E4
    status: established
    sources:
    - x8-mihama-uub
  - text: 『日本大百科全書（ニッポニカ）』は、御浜町について「熊野灘の七里御浜に面し、町名もそれにちなんで命名された」と明記している
    kind: fact
    level: E3
    status: established
    sources:
    - x8-mihama-kotobank
  - text: 町の観光サイトも「七里御浜は御浜町の名前の由来にもなっています」と記している
    kind: fact
    level: E4
    status: established
    sources:
    - x8-mihama-kanko
  - text: 町は七里御浜の中間部に位置し、吉野熊野国立公園の区域を含んでいる
    kind: fact
    level: E2
    status: established
    sources:
    - x8-mihama-yoran
  - text: 町は「年中みかんのとれる町」を掲げる柑橘の産地である
    kind: fact
    level: E2
    status: established
    sources:
    - x8-mihama-yoran
  - text: 御浜町の地方公共団体コードは245615である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 七里御浜と、年中みかんのとれる町
    text: 熊野灘に沿って熊野市から和歌山県新宮市方面へ延びる七里御浜は、砂ではなく小石でできた長大な礫浜で、その距離は名のとおり七里あまりに及ぶ。御浜町はちょうどその中ほどにあり、町名そのものがこの浜から採られた。浜の背後の丘陵では温暖な気候を生かした柑橘栽培が盛んで、町は「年中みかんのとれる町」をキャッチフレーズに掲げる。海の地形が自治体の名前になり、その名前が町の暮らしの看板にもなっている例である。
    sources:
    - x8-mihama-kotobank
    - x8-mihama-yoran
  relations:
  - pref/24
  - muni/24-紀宝町
  - muni/24-熊野市
  unknowns:
  - 1958年の合併協議で「御浜」が選定された経緯（公募の有無・他候補）
  - 「七里御浜」という浜名の文献上の初出
  updated: '2026-11-13'
- id: muni/24-志摩市
  code: '242152'
  names:
    ja: 志摩市
    reading: しまし
    aliases:
    - 志摩
    - 志摩国
    - 志摩郡
    - 嶋
  user_terms:
  - しま
  - 志摩
  - 志摩市の名前の由来
  - 伊勢志摩
  - 御食国のまち
  naming_type: 旧行政区画名の継承
  naming_note: 郡名・旧国名「志摩」を採用
  formation: 分村・分立
  prefecture: 三重県
  homonyms: []
  summary: 市名「志摩」は、平成16年（2004年）に志摩郡の5町が合併した際に、郡名であり旧国名でもある「志摩」を採用したもの。その領域は古代の小国・志摩国におおむね重なり、朝廷に海の幸を納める「御食国（みけつくに）」として知られた。「志摩」はもともと「嶋」とも書かれた土地の名である。
  first_attestation:
    era: 奈良時代（8世紀前半）
    year_western: null
    document: 木簡にみえる「志摩国志摩郡」の表記
    note: 志摩国は当初「島国嶋評」「島国嶋郡」と書かれ、養老年間までの木簡の過程で「志摩国志摩郡」の形が現れたとする研究資料の紹介に基づく。正確な初出年は特定されていない
  claims:
  - text: 平成16年（2004年）10月1日、志摩郡の浜島町・大王町・志摩町・阿児町・磯部町の5町が合併して志摩市が誕生した
    kind: fact
    level: E2
    status: established
    sources:
    - r1-shima-city-sdgs
  - text: 新市名の最終候補は「志摩」「しま」「伊勢志摩」「美志摩（みしま）」「英虞（あご）」の5点で、郡名・旧国名に由来する「志摩市」が選ばれた
    kind: fact
    level: E4
    status: established
    sources:
    - r1-shima-uub
  - text: 市の領域は古代の志摩国におおむね属し、志摩国は朝廷に多様な海産物を「贄」として納める「御食国（みけつくに）」として万葉集にも詠われたと、市の公式計画は述べている
    kind: fact
    level: E2
    status: established
    sources:
    - r1-shima-city-sdgs
  - text: 志摩国はもと伊勢国の一部で、当初は1郡のみからなる小国として分立し、その頃の表記は「島国嶋評」「島国嶋郡」のように「嶋」の字が使われていたとする研究資料がある
    kind: fact
    level: E2
    status: established
    sources:
    - r1-shima-yokkaichi-kenkyu
  - text: 志摩国はのちに答志郡と志摩郡の2郡となり、うち志摩郡の名は平成16年（2004年）の合併まで郡名として残った
    kind: fact
    level: E2
    status: established
    sources:
    - r1-shima-yokkaichi-kenkyu
  - text: 合併後の市役所は旧阿児町（鵜方）に置かれた
    kind: fact
    level: E4
    status: established
    sources:
    - r1-shima-uub
  - text: 志摩市の地方公共団体コードは242152である
    kind: fact
    level: E2
    status: established
    sources:
    - k4-ise-jlis
  column:
    title: あわや「美志摩市」に「英虞市」
    text: 2004年の合併で新市名の最終候補に残ったのは5つ。「志摩」「しま」「伊勢志摩」に混じって、「美志摩（みしま）」と「英虞（あご）」という凝った案があった。美志摩は「美しい志摩」、英虞は市内の英虞湾にちなむ。選ばれたのは最も古くて最も短い「志摩」だった。その名は、朝廷に海の幸を届ける「御食国」だった小国の名であり、かつては「嶋」とも書かれた。海に浮かぶ島々の土地らしい、素朴な名である。
    sources:
    - r1-shima-uub
    - r1-shima-city-sdgs
  relations:
  - pref/24
  - muni/24-鳥羽市
  - muni/24-伊勢市
  unknowns:
  - 「嶋」から「志摩」の表記に改められた正確な時期と理由（好字の選定経緯）は未確認
  - 新市名の公募の応募総数・得票の内訳は、合併協議会の一次資料では未確認
  - 「志摩」の読み「しま」が島（嶋）に由来することは表記の変遷からうかがえるが、専門辞典の明示的な語源説明は確認できなかった
  updated: '2026-11-13'
- id: muni/24-明和町
  code: '244422'
  names:
    ja: 明和町
    reading: めいわちょう
    aliases:
    - 神郷町
    - 三和町
    - 斎明村
  user_terms:
  - 三重の明和町の由来
  - 斎宮のある明和町
  - 神郷町という幻の町名
  naming_type: 合成地名
  formation: 合併新設
  prefecture: 三重県
  homonyms:
  - muni/10-明和町
  summary: 多気郡の町で、1958（昭和33）年に三和町と斎明村が合併して成立した。合併の激論の末に町名が決まらず、暫定名「神郷町」として合併を行い、合併決議後の公募で「明和」が決まって発足と同時に改称したという、異例の経緯を持つ。「明和」の字は斎明村の「明」と三和町の「和」の合成と説明される。同名の群馬県明和町も公募命名だが、そちらは理念を掲げた瑞祥地名で、字の出どころの論理が異なる。
  first_attestation:
    era: 昭和33年
    year_western: 1958
    document: 公募による新町名「明和」の決定（神郷町の発足と同時の改称）
    note: 合併自体は暫定名「神郷町」で行われ、「明和」の初出は合併決議後の公募決定による改称である
  claims:
  - text: 昭和30年（1955）に大淀町・上御糸村・下御糸村が合併して三和町に、斎宮村と明星村が合併して斎明村になった
    kind: fact
    level: E2
    status: established
    sources:
    - h5-meiwa-mie-rekimachi
  - text: 昭和33年（1958）9月、三和町と斎明村の合併は、県の仲裁を要する激論の末に町名が決まらず、仮に「神郷町」として合併を行うことで決着した
    kind: fact
    level: E2
    status: established
    sources:
    - h5-meiwa-mie-rekimachi
  - text: 合併決議の後に新町名を公募した結果「明和」と決まり、神郷町発足と同時に明和町と改称したため、神郷町は実質的に発足の瞬間だけの暫定名となった
    kind: fact
    level: E2
    status: established
    sources:
    - h5-meiwa-mie-rekimachi
  - text: 町の文化財計画は「神郷」を「斎明村と三和町が合併し、明和町になるまでの暫定町名」と定義し、「斎明」は斎宮村と明星村が合併してできた地名であると定義している
    kind: fact
    level: E2
    status: established
    sources:
    - h5-meiwa-mie-bunka
  - text: 町名「明和」は、斎明村から「明」を、三和町から「和」をとって名付けられたと説明される
    kind: fact
    level: E4
    status: established
    sources:
    - h5-meiwa-mie-weblio
  - text: 共通する層として、同名の群馬県明和町も1950年代の合併で新名を公募により決めており、「公募で生まれた明和」という点は両町に共通する
    kind: fact
    level: E2
    status: established
    sources:
    - h5-meiwa-gunma-yurai
  - text: 異なる層として、群馬の明和が「明朗にして平和なる理想郷」という理念を表す瑞祥地名として選ばれたのに対し、三重の明和は前身2町村の名の字（斎明の「明」と三和の「和」）を組み合わせた合成名であり、暫定名「神郷町」を経た経緯も三重だけのものである
    kind: fact
    level: E2
    status: established
    sources:
    - h5-meiwa-mie-rekimachi
    - h5-meiwa-gunma-yurai
  - text: 総務省の全国地方公共団体コードで、明和町の団体コードは244422と定められている
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 発足の瞬間だけ存在した町名「神郷町」
    text: 1958年の合併は、町の場所をめぐる激論の末に県の仲裁でようやくまとまりましたが、新しい町の名前だけは決まりませんでした。そこで暫定的に「神郷町」として合併を行い、名前は後から公募することにしたのです。公募で「明和」と決まると、神郷町は発足と同時に明和町へ改称されました。つまり神郷町は、書類の上でのみ一瞬存在した「幻の町名」です。伊勢神宮の斎王の宮・斎宮の地であるこの地域で、「神」の字を持つ暫定名が生まれ、すぐに消えたことも、偶然にせよ象徴的です。
    sources:
    - h5-meiwa-mie-rekimachi
    - h5-meiwa-mie-bunka
  relations:
  - pref/24
  - muni/10-明和町
  unknowns:
  - 公募の応募総数や「明和」以外の候補名の一覧は未確認
  - 暫定名「神郷」の選定理由（伊勢神宮・斎宮との関係を意図したものか）は資料に明記がなく未確認
  - 「明は斎明、和は三和」の字配分を記した町史の原文の直接確認は未了（辞書サイト経由の確認にとどまる）
  updated: '2026-11-13'
- id: muni/24-朝日町
  code: '243434'
  names:
    ja: 朝日町
    reading: あさひちょう
    aliases:
    - 朝日村
  user_terms:
  - 朝日町の名前の由来
  - 三重の朝日町は天武天皇の故事
  - 読み方が「あさひちょう」の朝日町
  - 朝日町は山形と富山と三重にある
  naming_type: 文献・故事から命名
  formation: 単独発足
  prefecture: 三重県
  homonyms:
  - muni/06-朝日町
  - muni/16-朝日町
  summary: 明治22年（1889年）に朝明郡の小向・柿・埋縄・縄生の村々をもって発足した朝日村が前身で、昭和29年（1954年）10月17日に単独で町制を施行して朝日町となった。町公式は、大海人皇子（後の天武天皇）が壬申の乱の際にこの近辺で朝日を拝んだという故事にあやかって命名されたと伝える。『日本書紀』には朝明郡迹太川のほとりで天照太神を望拝した記事があるが、迹太川を現在の朝明川とする比定には異説がある。
  first_attestation:
    era: 明治22年
    year_western: 1889
    document: 朝日村の発足（町村制施行、1889年4月1日）
    note: 自治体名としての「朝日」の初出。故事そのものの記録は『日本書紀』巻第二十八（720年成立）にさかのぼるとされる
  claims:
  - text: 明治22年（1889年）4月1日、町村制の施行により、朝明郡の小向村・柿村・埋縄村・当新田の区域の一部および縄生村の区域の一部をもって朝日村が発足した
    kind: fact
    level: E2
    status: established
    sources:
    - h4-mie-asahi-wikipedia
  - text: 町公式の「朝日町のあらまし」は、大海人皇子（後の天武天皇）が壬申の乱（672年）でこの近辺を通過した際に朝日を拝んだと言われており、この故事にあやかり明治22年（1889年）に「朝日村」が誕生し、昭和29年に町制施行で「朝日町」となったと伝える
    kind: legend
    level: E2
    status: established
    sources:
    - h4-mie-asahi-aramashi
  - text: 『朝日町史』（1974年）に基づく命名経緯の紹介によれば、村名について朝明郡長は「山添村」としたが、村側が申請した「朝明村」は郡と同名であるとして退けられ、舘通因に相談したところ天武天皇が縄生・小向の辺りで朝日を拝まれたという故事があると聞き、これに因んで「朝日村」として申請し、許可されるに至ったとされる
    kind: fact
    level: E2
    status: established
    sources:
    - h4-mie-asahi-wikipedia
  - text: 『日本書紀』巻第二十八には、大海人皇子が「朝明郡迹太川の辺（ほとり）で天照太神を望拝した」という趣旨の記事があり、故事には古典籍の裏付けがある。ただし故事の舞台を現在の朝日町内とするのは迹太川を現在の朝明川に比定する前提に立ち、この比定には異説があって確定していない
    kind: fact
    level: E2
    status: contested
    sources:
    - h4-mie-asahi-wikipedia
  - text: 昭和29年（1954年）10月17日、朝日村は合併せず単独で町制を施行して朝日町となった。町村合併促進法のもとで同村は合併の対象だったが、産業面のほか交通・文化に恵まれていたことから単独町制を選んだと町の広報は説明する
    kind: fact
    level: E2
    status: established
    sources:
    - h4-mie-asahi-koho
  - text: 【異なる層】3つの朝日町のうち三重の例だけが「朝日（太陽）」を直接の由来とし、山の名から取って公式に明示する富山県朝日町とも、大朝日岳の麓にありながら命名理由の明示がない山形県朝日町とも、命名の型が異なる
    kind: fact
    level: E2
    status: established
    sources:
    - h4-toyama-asahi-gaiyo
    - h4-yamagata-asahi-gikai
  column:
    title: 却下された2つの名前
    text: 「朝日村」の前には2つの落選案があった。郡長が推した「山添村」、村が申請した「朝明村」は郡と同じ名で却下。困って地元の碩学・舘通因に相談すると、『日本書紀』にある天武天皇の故事を教えてくれた。こうして生まれた「朝日村」は、以来130年以上、一度も合併せずに「朝日町」として続いている。
    sources:
    - h4-mie-asahi-wikipedia
  relations:
  - pref/24
  - muni/06-朝日町
  - muni/16-朝日町
  unknowns:
  - 迹太川の比定について、現在の朝明川とする説への異説の具体的内容は、久志本鉄也「壬申紀『迹太川』小考」（2013年）などの原典確認が必要
  - 『朝日町史』（1974年）原文での命名経緯の直接確認は未実施（Wikipediaが同書を引く紹介によって記録した）
