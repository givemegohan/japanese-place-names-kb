  summary: 2005年4月1日に板野郡の吉野町・土成町と阿波郡の市場町・阿波町の4町が合併して発足した市。市の総合計画はこの合併を「あわ北4町の合併」と位置づけている。市名「阿波」は旧国名であると同時に、構成町の一つだった旧・阿波町の名と重なっており、国名への回帰と町名の継承が重なった命名である。この合併で阿波郡は消滅した。
