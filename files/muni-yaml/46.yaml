  - 指宿の温泉と地名
  naming_type: 中心地名の継承
  formation: 合併新設
  prefecture: 鹿児島県
  homonyms: []
  summary: 「指宿（いぶすき）」は難読地名として知られるが、その読みの核は「湯」を含む古い形にある。指宿市の文化財計画によれば、地名の初出は927年編纂の『延喜式』とされ、郷土史家・小川亥三郎は本来の意味を「湯生村（ユフスキ）」とし、713年の好字令の影響で好字の「指宿」に書き換えられたとする説を唱えた。1954年に指宿町と今和泉村の合併で市となり、2006年に山川町・開聞町と合併して現在の市になった。
  first_attestation:
    era: 延長5年
    year_western: 927
    document: 延喜式
    note: 指宿市の文化財保存活用地域計画が、小川亥三郎の研究として紹介する初出。『和名類聚抄』には読みが「以夫須岐（イフスキ）」と記されるという
  claims:
  - text: 指宿の地名の初出は927年（延長5年）に編纂された『延喜式』とされ、『和名類聚抄』には読みが「以夫須岐（イフスキ）」と記されていると、指宿市の文化財保存活用地域計画は紹介する（地方公共団体コードは462101）
    kind: fact
    level: E2
    status: established
    sources:
    - k6-ibusuki-city-bunkazai
    - b-cap-chiba-soumu-code
  - text: 郷土史家の小川亥三郎は、「指宿」の本来の意味は「湯生村（ユフスキ）」であり、713年（和銅6年）の諸国郡郷名著好字令の影響で好字の「指宿」になったとする説を唱えた
    kind: fact
    level: E2
    status: contested
    sources:
    - k6-ibusuki-city-bunkazai
  - text: 1543年（天文12年）に津曲兼任が建立した板碑には「湯豊宿（ユブスキ）」の表記があり、本来の意味に近い書き方が中世まで残っていたことがうかがえる
    kind: fact
    level: E2
    status: established
    sources:
    - k6-ibusuki-city-bunkazai
  - text: 市域には「湯」を含む小字が周辺に比べて圧倒的に多く、地名群の上からも温泉と結びついた土地であることがうかがえると同計画は指摘する
    kind: fact
    level: E2
    status: established
    sources:
    - k6-ibusuki-city-bunkazai
  - text: 1954年（昭和29年）4月、指宿町と今和泉村が合併して指宿市が誕生した
    kind: fact
    level: E2
    status: established
    sources:
    - k6-ibusuki-city-bunkazai
  - text: 2006年（平成18年）1月1日、山川町・開聞町と合併して、新しい指宿市となった
    kind: fact
    level: E2
    status: established
    sources:
    - k6-ibusuki-city-bunkazai
  column:
    title: 好字令で書き換えられた名前——「湯」から「指」へ
    text: 奈良時代の713年、政府は「郡や郷の名には良い字を二つ使え」という令を出した（諸国郡郷名著好字令）。小川亥三郎の研究によれば、「指宿」もこの波に洗われた名の一つで、もとは「湯生村（ユフスキ）」、つまり温泉の湧く里をそのまま表す名だったという。ところが16世紀の板碑には「湯豊宿」の字が残っており、公式の書き換えの後も、土地の人々の記憶の中では「湯」の名が生き続けていたことがわかる。難読地名「指宿」の半分は、千年以上前の漢字政策の名残なのである。
    sources:
    - k6-ibusuki-city-bunkazai
  relations:
  - pref/46
  unknowns:
  - 『延喜式』における「指宿」の具体的な表記字形は、市の計画PDFの抽出で欠けた部分があり、原典での直接確認が未了
  - 小川亥三郎の説に対する学界の評価や、対抗する語源説の有無は確認できなかった
  updated: '2026-11-13'
