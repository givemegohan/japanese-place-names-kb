  naming_type: 人名に由来
  formation: 合併新設
  prefecture: 埼玉県
  homonyms: []
  summary: 埼玉県北足立郡の町。町名は江戸幕府の代官頭（のち関東郡代）・伊奈備前守忠次にちなむ人名由来の名で、昭和18年（1943年）に小室村と小針村が合併した際に命名された。忠次は天正19年（1591年）に小室郷へ陣屋を構え、関東の治水・検地・新田開発の拠点とした。なお忠次の姓「伊奈」自体は、伊奈氏が信州伊那の出身であることに由来する。
  first_attestation:
    era: 昭和18年
    year_western: 1943
    document: 小室村・小針村の合併による伊奈村の設置（1943年7月15日）
    note: 自治体名としての命名そのもの。人名「伊奈」の側の初出は、伊奈氏が信州伊那出身とされる中世に遡るが、原典は未確認
  claims:
  - text: 総務省の全国地方公共団体コードで、伊奈町の団体コードは113018と定められている
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
    - w9-ina-town-mayor
  - text: 昭和18年（1943年）7月15日に小室村と小針村が合併して伊奈村が誕生した
    kind: fact
    level: E2
    status: established
    sources:
    - w9-ina-town-mayor
    - w9-ina-wiki
  - text: 合併の際の村名は、今から400年ほど前に代官頭（のちの関東郡代）伊奈備前守忠次がこの地に陣屋を構えたことから、その名にちなみ「伊奈村」と命名されたと、町公式は説明する
    kind: fact
    level: E2
    status: established
    sources:
    - w9-ina-town-mayor
  - text: 忠次は天正18年（1590年）の徳川家康の関東入国に際し、小室・鴻巣に所領1万3千石（1万石とも）を与えられ、翌19年に小室郷（現・伊奈町大字小室）に陣屋を構えて、代官頭として治水・灌漑工事、検地、新田開発、宿場の整備などにあたった
    kind: fact
    level: E2
    status: established
    sources:
    - w9-ina-town-kinsei
  - text: 伊奈氏は信州伊那（現・長野県伊那地方）の出身であり、町名の直接の由来である姓「伊奈」自体が、別の地名に由来する
    kind: fact
    level: E2
    status: established
    sources:
    - w9-ina-town-yashiki
  - text: 慶長15年（1610年）の忠次の死後、嫡子忠政・忠勝と継いだが、忠勝が元和5年（1619年）に9歳で死去して直系は断絶した。その後、忠次の功労が認められ、忠勝の弟忠隆に陣屋そのまま小室郷一円が与えられて旗本伊奈家が成立し、子孫が幕末までこの地を支配した
    kind: fact
    level: E2
    status: established
    sources:
    - w9-ina-town-kinsei
  - text: 昭和45年（1970年）11月1日に町制を施行して伊奈町となった
    kind: fact
    level: E5
    status: established
    sources:
    - w9-ina-wiki
  column:
    title: 名前の中の名前――伊奈、忠次、信州伊那
    text: 伊奈町の名前は三重の入れ子になっています。まず町名「伊奈」は、江戸初期の代官・伊奈忠次の姓から来ています。その忠次がこの地に選ばれたのは、家康の関東入国の際に小室・鴻巣の領地を与えられ、沼を控えた要害の地に陣屋を構えたからでした。そして「伊奈」という姓自体は、伊奈氏が信州の伊那地方の出身であることに由来します。長野県には今も伊那市がありますが、埼玉の伊奈町は、伊那の地から出た一族の姓を、さらにその一族の功績を記念して付けた名前なのです。なお同じ伊奈忠次は、群馬県玉村町の新田開発も手がけており、二つの町の名前の歴史は思わぬところでつながっています。
    sources:
    - w9-ina-town-mayor
    - w9-ina-town-yashiki
  relations:
  - pref/11
  - muni/20-伊那市
  - muni/10-玉村町
  unknowns:
  - 1943年の合併時に「伊奈」以外の村名候補があったかは未確認
  - 伊奈氏の姓の由来（伊那郡の郡司職等との関係）の詳細は未確認
  updated: '2026-11-13'
- id: muni/11-入間市
  code: '112259'
  names:
    ja: 入間市
    reading: いるまし
    aliases:
    - 武蔵町
    - 入間町
  user_terms:
  - いるま
  - 狭山茶の里
  - 入間基地
  - 万燈まつり
  naming_type: 旧行政区画名の継承
  formation: 改称
  prefecture: 埼玉県
  homonyms: []
  summary: 狭山茶の産地として知られる埼玉県南西部の市。市名は1966年の市制施行に際して公募で選ばれたもので、律令制以来の郡名「入間郡」と、古く「入間野」と呼ばれた地域の呼称に由来する。前身は1956年に発足した武蔵町で、「豊岡」「武蔵」という旧称の分かりにくさを避けて改称・市制した。
  first_attestation:
    era: 奈良・平安時代
    year_western: null
    document: 武蔵国分寺奉献瓦の刻銘「入間」（東金子窯跡群で生産）
    note: 市公式ガイドが紹介する、郡名「入間」の古い使用例。文献上の郡名の初出（『和名類聚抄』の入間郡の郷など）の原文確認は未実施。
  claims:
  - text: 市名「入間」は昭和41年（1966年）の市制に際して公募で選ばれたもので、応募者数2,332人、応募市名297点の中には読みの異なる「入間（いりま）」や「入間野」「金子」「修武」「豊武」などの候補もあったことを入間市立図書館が紹介している
    kind: fact
    level: E2
    status: established
    sources:
    - w1-iruma-city-library
  - text: 選定理由として、この辺りは昔から「入間野」と呼ばれていたこと（『吾妻鏡』に見える呼称であること）、狭山茶などの生産物に「入間」の文字が盛んに使われて一般的であることが挙げられたことを市立図書館が紹介している
    kind: fact
    level: E2
    status: established
    sources:
    - w1-iruma-city-library
  - text: 「入間」は古代の律令制以来の郡名「入間郡」に由来する名である
    kind: fact
    level: E5
    status: established
    sources:
    - w1-iruma-wiki
  - text: 市内の東金子窯跡群で生産され武蔵国分寺に奉献された瓦の中には、「入間」の郡名が刻まれたものがあることを入間市公式ガイドが紹介している
    kind: fact
    level: E2
    status: established
    sources:
    - w1-iruma-city-guide
  - text: 前身は昭和31年（1956年）9月30日に豊岡町・金子村・宮寺村・藤沢村・東金子村などが合併して発足した武蔵町で、昭和41年（1966年）11月1日に武蔵町を入間町と改称した上で即日市制を施行し、埼玉県で25番目の市として入間市が誕生した
    kind: fact
    level: E2
    status: established
    sources:
    - w1-iruma-city-guide
    - w1-iruma-wiki
  - text: 改称の背景には、中心地区の「豊岡」が兵庫県豊岡市と重なること、「武蔵」がどこを指すか分かりにくく東京都武蔵野市と間違えられることがあったとされる
    kind: fact
    level: E5
    status: established
    sources:
    - w1-iruma-wiki
  - text: 総務省の全国地方公共団体コードで、入間市の団体コードは112259と定められている
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 入間市に「狭山小学校」、狭山市に「入間小学校」
    text: 入間と狭山は、名前の入り組みで知られる。「入間」の名はもともと広い地域を指す郡名だったが、明治の合併で現在の狭山市域に「入間村」ができ、1954年にその入間町が狭山市となった。一方、現在の入間市は1956年に武蔵町として生まれ、1966年に公募で「入間市」を名乗った。結果として、入間市には旧狭山村の流れをくむ「入間市立狭山小学校」が、狭山市には旧入間村に由来する「狭山市立入間小学校」が存在するという、地図を見る人を混乱させる状態が生まれた。狭山市は混同を避けるため、2009年に旧入間村域の地域名を「入間地区」から「入曽地区」へ改めている。郡名という大きな傘を、隣り合う二つの市が違う経路で受け継いだ例である。
    sources:
    - w1-iruma-wiki
  relations:
  - pref/11
  unknowns:
  - 郡名「入間」そのものの語源（入間川の名との先後関係を含む）は未確定
  - 『吾妻鏡』に見えるという「入間野」の用例の原文確認は未実施
  updated: '2026-11-13'
- id: muni/11-八潮市
  code: '112348'
  names:
    ja: 八潮市
    reading: やしおし
    aliases:
    - 八潮町
    - 八潮村
    - 八條村
    - 潮止村
    - 八幡村
  user_terms:
  - やしお
  - 八潮駅
  - 中川低地のまち
  naming_type: 合成地名
  formation: 合併新設
  prefecture: 埼玉県
  homonyms: []
  summary: 中川と綾瀬川に挟まれた埼玉県南東端の低地の市。「八潮」は1956年に八條村・潮止村・八幡村が合併した際、3村の頭文字「八」と「潮」を組み合わせて生まれた合成地名である。1964年に町制、1972年に市制を施行した。構成村の一つ「八條」は、古代の条里制に由来する古い地名の層を持つ。
  first_attestation:
    era: 昭和31年
    year_western: 1956
    document: 三村合併による八潮村の発足（1956年9月28日）
    note: 新村の命名そのもの。ただし構成要素の「八條」は古代の条里地名に遡る、より古い層の地名である。
  claims:
  - text: 昭和31年（1956年）9月28日に八條村・潮止村・八幡村の3村が合併した際、3村の頭文字をとって「八潮村」と命名されたことを八潮市公式の記念誌が記している
    kind: fact
    level: E2
    status: established
    sources:
    - w1-yashio-city-50th
  - text: 明治22年（1889年）の町村制施行により、江戸時代から続く村々が合併して八條村・八幡村・潮止村が成立した
    kind: fact
    level: E2
    status: established
    sources:
    - w1-yashio-city-50th
  - text: 昭和39年（1964年）10月1日に町制を施行して八潮町となり、昭和47年（1972年）1月15日に埼玉県内34番目の市制を施行して八潮市となった
    kind: fact
    level: E2
    status: established
    sources:
    - w1-yashio-city-50th
  - text: 構成村の一つ「八條」は古代の条里制の区画に由来する条里地名で、八條条里の遺構が越谷市から八潮市にかけての中川（旧利根川）右岸の自然堤防から後背湿地にかけて確認されていることが学術論文に紹介されている
    kind: fact
    level: E3
    status: established
    sources:
    - w1-yashio-jori
  - text: 市域は東を中川、西を綾瀬川に囲まれた標高1〜4メートルの中川低地にあり、江戸時代には綾瀬川の直道化や八條用水・葛西用水の開削によって耕作地が広がった
    kind: fact
    level: E2
    status: established
    sources:
    - w1-yashio-city-enkaku
  - text: 総務省の全国地方公共団体コードで、八潮市の団体コードは112348と定められている
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 三つの村の頭文字が、そのまま市名になった
    text: 「八潮」は、合併した3村の名前の部品を組み合わせた合成地名の分かりやすい例である。八條の「八」、潮止の「潮」、そして八幡の「八」は重なるため一つにまとめられ、「八潮村」が1956年に誕生した。もっとも、部品の側にはそれぞれ古い歴史がある。八條は古代の条里制の区画を示す条里地名で、この一帯には八條条里の遺構が残る。潮止は川の名残を思わせ、八幡は神社の名に由来する村名の型である。新しい合成地名の部品をたどると、千年単位の地名の層に届く。市制50周年記念誌がこの命名を誇らしげに記すのも頷ける話である。
    sources:
    - w1-yashio-city-50th
    - w1-yashio-jori
  relations:
  - pref/11
  unknowns:
  - 「潮止」「八幡」の各村名の語源（潮止は感潮域の末端か、八幡は八幡神社の鎮座によるか）は、確認した資料の範囲では明示されていない
  - 1956年の命名が公募によるものか協議によるものかは未確認
  updated: '2026-11-13'
- id: muni/11-加須市
  code: '112101'
  names:
    ja: 加須市
    reading: かぞし
    aliases:
    - 加須町
    - 加増
  user_terms:
  - 加須の名前の由来
  - かぞの語源
  - 加増から加須へ
  naming_type: 中心地名の継承
  formation: 合併新設
  prefecture: 埼玉県
  homonyms: []
  summary: 市名は、旧表記「加増（かそ）」に由来する地名で、元禄時代に「加須」の字に改められたとされる。語源には、新田開発で石高が加増されたことに因むという説のほか、利根川の河洲の転訛説、加津氏の姓に因む説がある。昭和29年（1954年）に市制を施行し、平成22年（2010年）に騎西町・北川辺町・大利根町と新設合併した。
  first_attestation:
    era: 江戸時代（元禄）以前
    year_western: null
    document: 旧表記「加増（かそ）」
    note: 『加須市の地名』（加須市史編さん室編、1976年）が紹介する旧表記で、元禄時代に「加須」へ改められたという
  claims:
  - text: 『加須市の地名』（加須市史編さん室編、1976年）が紹介する説として、古くは「加増（かそ）」と読み、新田として石高を加増されたことに因む地名が、元禄時代に「加須」へ改められたという説がある（Wikipedia『加須市』経由で確認）
    kind: fact
    level: E5
    status: contested
    sources:
    - m4-kazo-wiki
  - text: このほか、利根川本流の「河洲（かす）」が転じたという説や、光明寺を開基した加津内蔵丞長高の姓「加津」に因んだとする説も紹介されており、語源は定まっていない
    kind: fact
    level: E5
    status: contested
    sources:
    - m4-kazo-wiki
  - text: 明治22年（1889年）に加須町と久下村が合併して加須町となり、昭和29年（1954年）5月3日に市制を施行して加須市となった
    kind: fact
    level: E5
    status: established
    sources:
    - m4-kazo-wiki
  - text: 平成22年（2010年）3月23日、旧加須市・騎西町・北川辺町・大利根町が新設合併して新しい加須市が誕生し、同時に北埼玉郡は消滅した。新市名は小学生以上を対象とした公募で「加須」が2,519件と2位に大差をつけて1位だったことなどから決定された
    kind: fact
    level: E5
    status: established
    sources:
    - m4-kazo-wiki
  - text: 総務省の全国地方公共団体コードで、加須市のコードは112101と定められている（J-LISの埼玉県内市町村一覧による）
    kind: fact
    level: E2
    status: established
    sources:
    - k1-jlis-saitama
  column:
    title: 「加増」から「加須」へ
    text: かつての表記は「加増」。新田を開いて石高が増えた土地という、税の台帳のような名前だった。それが元禄の頃に「加須」と改められたという。2010年の合併では、新しい市の名前を公募したところ「加須」が2位の5倍以上の票を集めて1位になった。隣り合う騎西・大利根・北川辺の3町をのみ込んでも、名前は加須のまま。江戸時代に字を替えた古い名前は、平成の公募でも選ばれ続けた。
    sources:
    - m4-kazo-wiki
  relations:
  - pref/11
  unknowns:
  - 語源の定説はない（加増説・河洲説・加津説を併記した）
  - 『加須市の地名』（1976年）の原典は未読で、Wikipedia経由の確認にとどまる
  updated: '2026-11-13'
- id: muni/11-北本市
  code: '112330'
  names:
    ja: 北本市
    reading: きたもとし
    aliases:
    - 北本町
    - 北本宿村
    - 本宿村
    - 石戸村
    - 中丸村
  user_terms:
  - きたもと
  - 北本宿
  - 石戸蒲ザクラ
  - 北本トマト
  naming_type: 方位・位置による命名
  formation: 合併新設
  prefecture: 埼玉県
  homonyms: []
  summary: 中山道沿いの埼玉県中央部の市。「北本」は、宿場が鴻巣へ移った後の「本宿（元鴻巣）」の地に、県南の同音の元宿村と区別するため「北」を冠した「北本宿村」（1943年）に由来し、1959年の町制時に「宿」を取って北本町となった。1971年に市制を施行した。
  first_attestation:
    era: 昭和18年
    year_western: 1943
    document: 中丸村・石戸村の合併による北本宿村の発足
    note: 「北本」の名の初出。ただし核となる「本宿」の地名は、近世初期に宿場が鴻巣へ移転した後に残った本鴻巣村・本宿村に遡る。
  claims:
  - text: 近世初期、市域には中山道の宿場が置かれていたが、慶長年間に鴻巣へ移転したため、宿場のあった地は本鴻巣村から本宿村となり、間宿としての役割を果たしたことを北本市教育委員会の文化財計画が記している
    kind: fact
    level: E2
    status: established
    sources:
    - w1-kitamoto-city-bunkazai
  - text: 明治22年（1889年）に市域東部の9か村が合併して中丸村となり、西部の5か村が合併して石戸村となった
    kind: fact
    level: E2
    status: established
    sources:
    - w1-kitamoto-city-bunkazai
  - text: 昭和18年（1943年）に中丸村と石戸村が合併し、北本宿村が誕生した（いわゆる戦時合併）
    kind: fact
    level: E2
    status: established
    sources:
    - w1-kitamoto-city-bunkazai
    - w1-kitamoto-city-kankyo
  - text: 「北本宿」の「北」は、本宿の地名に付けられたもので、その理由は県南の旧浦和市（現さいたま市）に同音の「元宿村」が存在したため、両者で「北」と「南」を冠して区別したことによることを文化財計画が記している
    kind: fact
    level: E2
    status: established
    sources:
    - w1-kitamoto-city-bunkazai
  - text: 昭和34年（1959年）の町制施行の際、元の宿場を意味する「本宿」のうち「宿」の字が消えて北本町となり、厳密には町制施行直前に一時「北本村」と改称していた時期があった
    kind: fact
    level: E2
    status: established
    sources:
    - w1-kitamoto-city-bunkazai
  - text: 昭和46年（1971年）11月3日に市制を施行し、埼玉県で33番目の市として北本市が誕生した
    kind: fact
    level: E2
    status: established
    sources:
    - w1-kitamoto-city-kankyo
    - w1-kitamoto-city-bunkazai
  - text: 総務省の全国地方公共団体コードで、北本市の団体コードは112330と定められている
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 「北の本宿」と「南の元宿」―同音の村どうしの名付け合い
    text: 北本市の名の核は「本宿」である。江戸時代の初め、今の北本の地には中山道の宿場があったが、間もなく北の鴻巣へ移ってしまった。残された地は「もとの宿場」という意味で本鴻巣村、やがて本宿村と呼ばれた。問題は、埼玉県の南の浦和にも「元宿村（もとじゅく）」があったことである。読みが同じ二つの「もとじゅく」が同じ県内に並ぶため、1943年に合併で新村を作る際、北の本宿には「北」を、南の元宿には「南」の意識を冠して「北本宿村」としたという。1959年には「宿」が取れて「北本」となり、市名にまで昇格した。宿場を失った村の名が、方位の「北」と結びついて生き残った例である。
    sources:
    - w1-kitamoto-city-bunkazai
  relations:
  - pref/11
  unknowns:
  - 南側の元宿村がいつ「南元宿」を称したかなど、浦和側の命名の詳細は未確認
  - 本鴻巣村の成立時期と「本宿」表記の初出文書は未確認
  updated: '2026-11-13'
- id: muni/11-吉川市
  code: '112437'
  names:
    ja: 吉川市
    reading: よしかわし
    aliases:
    - 吉川町
    - 吉川村
    - 吉川郷
  user_terms:
  - よしかわ
  - なまずの里
  - 吉川美南
  - 吉川のなまず
  naming_type: 中心地名の継承
  formation: 合併新設
  prefecture: 埼玉県
  homonyms: []
  summary: 江戸川と中川に挟まれた埼玉県南東部の低地の市で、「なまずの里」として知られる。地名は中世の吉川郷に遡り、16世紀後半には隣の彦成郷と合わせて「二郷半領」と呼ばれる地域の名だった。1889年に吉川村、1915年に吉川町となり、1955年の合併を経て1996年に市制を施行した。「吉川」の語源は確定していない。
  first_attestation:
    era: 戦国時代（16世紀後半）
    year_western: null
    document: 吉川郷の呼称（二郷半領の構成郷として、市公式の歴史解説に紹介）
    note: 中世の郷名としての「吉川」。郷名を記した中世文書そのものの特定は未実施のため、市公式の紹介の形で記録する。
  claims:
  - text: 16世紀後半には、吉川郷・彦成郷の二郷とその南の50戸に満たない半郷を合わせて「二郷半領」と呼ぶようになり、吉川の古名として現在に伝えられていることを吉川市公式の歴史解説が記している
    kind: fact
    level: E2
    status: established
    sources:
    - w1-yoshikawa-city-history
  - text: 江戸時代には新田開発が進んで早稲米の産地となり、米を江戸へ積み出す中川の舟運によって吉川河岸・平沼河岸が物資の集積地として栄えた
    kind: fact
    level: E2
    status: established
    sources:
    - w1-yoshikawa-city-history
  - text: 明治22年（1889年）の町村制施行により吉川村・旭村・三輪野江村が誕生し、大正4年（1915年）に吉川村が町制を施行して吉川町となった
    kind: fact
    level: E2
    status: established
    sources:
    - w1-yoshikawa-city-plan
    - w1-yoshikawa-city-history
  - text: 昭和30年（1955年）に吉川町・三輪野江村・旭村が合併して新吉川町が誕生した（人口16,477人）
    kind: fact
    level: E2
    status: established
    sources:
    - w1-yoshikawa-city-history
  - text: 平成8年（1996年）4月1日に市制を施行し、吉川市が誕生した
    kind: fact
    level: E2
    status: established
    sources:
    - w1-yoshikawa-city-plan
  - text: ナマズは古くから吉川の郷土食として親しまれ、「なまずのたたき揚げ」が伝統的な食べ方として伝わり、市は「なまずの里」を掲げている
    kind: fact
    level: E2
    status: established
    sources:
    - w1-yoshikawa-city-namazu
  - text: 「吉川」という地名の語源については、確認した市公式資料の範囲では説明が示されておらず、確定できない
    kind: fact
    level: E2
    status: indeterminate
    sources:
    - w1-yoshikawa-city-history
  - text: 総務省の全国地方公共団体コードで、吉川市の団体コードは112437と定められている
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 語呂合わせで生まれた「なまずの日」
    text: 吉川といえばナマズである。江戸川と中川に挟まれた水郷の町では、ナマズは身近な川魚で、身をたたいて味噌で味付けして揚げる「なまずのたたき揚げ」が郷土の味として親しまれてきた。都市化で一時姿を消したが、市は「なまずの里」としてまちおこしに活用し、全国のナマズゆかりの自治体を集めた「全国なまずサミット」の第1回を2017年に開催した。その過程で、7月2日が「なまずの日」として記念日登録された。理由は語呂合わせで、702を「な・ま・ず」と読むからである。地名の吉川自体の由来はまだ霧の中だが、川魚の名は語呂合わせという現代的な命名で全国に広がった。
    sources:
    - w1-yoshikawa-city-namazu
  relations:
  - pref/11
  - muni/11-三郷市
  unknowns:
  - 「吉川」の語源（吉川という河川名・地形との関係など）は未確定で、専門辞典での確認が今後の課題
  - 吉川郷を記した中世文書の特定は未実施
  updated: '2026-11-13'
- id: muni/11-吉見町
  code: '113476'
  names:
    ja: 吉見町
    reading: よしみまち
    aliases:
    - 横見郡
    - 東吉見村
    - 西吉見村
    - 南吉見村
    - 北吉見村
  user_terms:
  - 吉見町の名前の由来
  - 吉見百穴のある町
  - 吉見観音の町
  - いちごの里よしみ
  naming_type: 中心地名の継承
  formation: 合併新設
  prefecture: 埼玉県
  homonyms: []
  summary: 埼玉県比企郡の町。名は古代武蔵国・横見（よこみ）郡に遡る古い地名で、平安中期以降は「吉見」とも書かれるようになった。町には「ヨクミユ（よく見ゆ）と言ったことに始まる」という伝説が伝えられる。明治22年（1889年）に東西南北の4つの吉見村が生まれ、昭和29年（1954年）の合併で吉見村、昭和47年（1972年）に吉見町となった。
  first_attestation:
    era: 平安時代中期
    year_western: null
    document: 『日本歴史地名大系』が紹介する、横見郡が「吉見郡」とも呼ばれるようになった平安中期以降の用例
    note: 郡名の表記の変化としての使用例。地名そのものの初出は古代の「横渟」に遡ると町公式は伝えるが、その原典は未確認
  claims:
  - text: 総務省の全国地方公共団体コードで、吉見町の団体コードは113476と定められている
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
    - w9-yoshimi-town-plan
  - text: 古代には町域のほぼ全域が武蔵国横見（よこみ）郡に属していたと考えられ、同郡は平安中期以降は「吉見郡」と呼ばれるようになったと『日本歴史地名大系』は説明する
    kind: fact
    level: E3
    status: established
    sources:
    - w9-yoshimi-kotobank-taikei
  - text: 町公式の解説では、古代においてはこの地は「横渟（よこぬ）」といい、さらには「横見」となり、現在の「吉見」になったとされる
    kind: fact
    level: E2
    status: established
    sources:
    - w9-yoshimi-town-kembunroku
  - text: 「吉見」という地名は、伝説によると「ヨクミユ」と言ったことに始まったといわれる
    kind: legend
    level: E2
    status: established
    sources:
    - w9-yoshimi-town-kembunroku
  - text: 明治22年（1889年）には横見郡内の村々が東吉見村・西吉見村・南吉見村・北吉見村の四か村となり、明治29年（1896年）に横見郡が比企郡に編入されて古代以来の郡名は消滅した
    kind: fact
    level: E2
    status: established
    sources:
    - w9-yoshimi-town-kembunroku
  - text: 昭和29年（1954年）に東西南北の4つの吉見村が合併して吉見村が誕生し、昭和47年（1972年）に町制を施行して吉見町となった
    kind: fact
    level: E2
    status: established
    sources:
    - w9-yoshimi-town-plan
  - text: 町には「吉見観音」の別名で知られる坂東三十三観音第11番札所の岩殿山安楽寺や、国指定史跡の横穴墓群「吉見百穴」があり、いずれも古くからの地名「吉見」を冠する名所として知られる
    kind: fact
    level: E2
    status: established
    sources:
    - w9-yoshimi-town-kembunroku
  column:
    title: 消えた郡名、残った村名
    text: 吉見の歴史の不思議は、郡の名前と村の名前のすれ違いにあります。古代以来この地は「横見郡」でしたが、平安時代の半ばからは「吉見郡」とも呼ばれるようになります。ところが江戸時代の郷帳や国絵図の頃には再び「横見」に戻り、明治29年（1896年）には横見郡自体が比企郡に吸収されて消えてしまいました。一方、その7年前の明治22年に生まれた4つの村は「吉見」の字を選んでいました。郡名としては一度は消えた「吉見」が、村の名前として残り、1954年の合併を経て今の町名になったのです。
    sources:
    - w9-yoshimi-town-kembunroku
    - w9-yoshimi-kotobank-taikei
  relations:
  - pref/11
  - muni/11-ときがわ町
  unknowns:
  - 「横渟」という古代の表記が現れる原典は未確認
  - 「ヨクミユ」伝説が記録された時期・資料は未確認
  - 1889年に4村が「吉見」の字を採用した経緯の記録は未確認
  updated: '2026-11-13'
- id: muni/11-和光市
  code: '112291'
  names:
    ja: 和光市
    reading: わこうし
    aliases:
    - 大和町
    - 新倉村
    - 白子村
    - 白子宿
  user_terms:
  - 和光市の名前の由来
  - 和光はなぜ和光というのか
  - 理研のまち
  - 和光市駅
  naming_type: 新規命名
  formation: 改称
  prefecture: 埼玉県
  homonyms: []
  summary: 市名は昭和45年（1970年）の市制施行に際し、住民公募で選ばれた新しい名前である。前身の大和町の「和」に栄光の「光」を合わせ、平和・栄光・前進を象徴するという。改称の背景には、神奈川県に大和市が既に存在したことがあった。市域の古い地名としては新座郡の新倉・白子があり、白子は川越街道の宿場として栄えた。
  first_attestation:
    era: 昭和45年
    year_western: 1970
    document: 市制施行に伴う改称（大和町から和光市へ）
    note: 市名「和光」そのものの初出で、公募による命名そのもの
  claims:
  - text: 昭和45年（1970年）10月31日、前身の大和町が和光町へ改称し、即日市制を施行して和光市が誕生した
    kind: fact
    level: E2
    status: established
    sources:
    - w2-wako-faq
  - text: 新しい市名は一般住民から公募された中から審査決定されたもので、「和光」とは平和、栄光、前進を象徴し、市が明るく住みよいまちに躍進するようにという願いが込められていると市は説明する
    kind: fact
    level: E2
    status: established
    sources:
    - w2-wako-faq
  - text: 市のデジタルミュージアムは、改称の背景として「大和の市名が他にあった」ことを挙げ、大和町の「和」を取って新市名とした経緯を伝える。既に神奈川県に大和市があったための同名回避であったとされる
    kind: fact
    level: E2
    status: established
    sources:
    - w2-wako-rekitama
    - w2-wako-wiki
  - text: 公募では「和光市」が最も多く寄せられ、次点には「新倉市」「美和市」「埼玉市」「本田市」「白子市」などの案があったとされる
    kind: fact
    level: E5
    status: established
    sources:
    - w2-wako-wiki
  - text: 前身の大和町は、昭和18年（1943年）に新倉村と白子村が合併して成立した町で、旧両村域がいまの和光市の核になっている
    kind: fact
    level: E2
    status: established
    sources:
    - w2-wako-rekitama
  - text: 江戸時代の市域は新座郡に属し、川越街道に白子宿が置かれて宿場として栄え、新倉には新河岸川の河岸も設けられていた
    kind: fact
    level: E5
    status: established
    sources:
    - w2-wako-wiki
  - text: 白子の地名の起こりは、地福寺にまつわる白衣童子の言い伝えから生まれたという話が残っている
    kind: legend
    level: E2
    status: established
    sources:
    - w2-wako-rekitama
  - text: 白子は新羅（しらぎ）の、新倉は新座すなわち新羅の転化であるとする説があるが、考古学的には実証されていない
    kind: fact
    level: E5
    status: indeterminate
    sources:
    - w2-wako-wiki
  - text: 理化学研究所は昭和42年（1967年）に東京都文京区から当地へ移転してきた研究機関であり、市名「和光」は研究所にちなむ命名ではなく、公募によって選ばれたものである
    kind: fact
    level: E5
    status: established
    sources:
    - w2-wako-wiki
    - w2-wako-faq
  column:
    title: 「本田市」「埼玉市」になりかけたまち
    text: 1970年の改称公募で最多だったのは「和光市」だが、候補には旧村名を継ぐ「新倉市」「白子市」のほか、市内に工場のあった本田技研にちなむ「本田市」、そして「埼玉市」まで挙がっていたという。もし「埼玉市」が選ばれていれば、さいたま市より30年早く県名を名乗る市が生まれていたことになる。選ばれなかった名前の顔ぶれに、当時のまちの姿が映っている。
    sources:
    - w2-wako-wiki
  relations:
  - pref/11
  - muni/14-大和市
  - muni/11-新座市
  unknowns:
  - 「白子」「新倉」の語源については新羅からの転化説が実証されておらず、専門辞典（角川日本地名大辞典等）での確認は未了
  - 市名公募の応募総数や審査の一次記録は未確認
  updated: '2026-11-13'
- id: muni/11-坂戸市
  code: '112399'
  names:
    ja: 坂戸市
    reading: さかどし
    aliases:
    - 坂戸宿
    - 坂戸町
    - 坂戸村
    - 元坂戸
  user_terms:
  - 坂戸市の名前の由来
  - 坂戸宿
  - 北坂戸
  - さかど
  naming_type: 中心地名の継承
  formation: 合併新設
  prefecture: 埼玉県
  homonyms: []
  summary: 市名は、日光脇往還の宿場町として栄えた坂戸宿以来の地名を受け継いだものである。坂戸宿は天正12年（1584年）に元坂戸の集落を移して開かれたと伝えられ、明治に坂戸村・坂戸町となり、昭和29年（1954年）の5町村合併を経て、昭和51年（1976年）に市制を施行した。「坂戸」という名自体の語源は、調べた公的資料では確かな説明が確認できていない。
  first_attestation:
    era: 天正12年
    year_western: 1584
    document: 坂戸宿の開設
    note: 宿場としての成立を伝える年。「坂戸」の名自体は移転元の元坂戸に既にあったが、その初出文書は未確認
  claims:
  - text: 古代の市域は入間郡麻羽郷（あさはごう）に属し、坂戸・勝呂・入西と旧川角村の一帯がその範囲であったと、県の沿革資料は伝える
    kind: fact
    level: E2
    status: established
    sources:
    - w2-sakado-pref
  - text: 坂戸宿は天正12年（1584年）に、河越城代の大道寺駿河守政繁が元坂戸（現在の北坂戸）にあった39軒の集落を移して開いたのが始まりと伝えられる
    kind: fact
    level: E4
    status: established
    sources:
    - w2-sakado-kaido
  - text: 江戸時代、坂戸は八王子から日光へ至る街道（日光脇往還）の宿場町として繁栄した
    kind: fact
    level: E2
    status: established
    sources:
    - w2-sakado-profile
  - text: 明治29年（1896年）12月に坂戸村が町制を施行して坂戸町となった
    kind: fact
    level: E2
    status: established
    sources:
    - w2-sakado-profile
  - text: 昭和29年（1954年）7月1日、坂戸町・三芳野村・勝呂村・入西村・大家村の5町村が合併して、新しい坂戸町となった
    kind: fact
    level: E2
    status: established
    sources:
    - w2-sakado-profile
  - text: 昭和51年（1976年）9月1日に市制を施行し、埼玉県で39番目、全国で644番目の市として坂戸市が誕生した
    kind: fact
    level: E2
    status: established
    sources:
    - w2-sakado-profile
  column:
    title: まちごと引っ越して生まれた宿場
    text: いまの坂戸の市街は、もともとの集落をそっくり移して作られた。天正12年（1584年）、河越城代の大道寺政繁が、北にあった元坂戸の39軒を移して新しい宿場を開いたという。元の場所は「元坂戸」と呼ばれ、現在の北坂戸に名残をとどめる。宿場はその後、坂戸神社の方向へと発展したため「さかさ宿」というあだ名まで生まれた。地名は移転についてきたが、集落の中心は移転で置き換わったのである。
    sources:
    - w2-sakado-kaido
  relations:
  - pref/11
  - muni/11-日高市
  unknowns:
  - 「坂戸」という名の語源は、市の公式資料・県の沿革資料など調べた範囲では説明がなく未確認（「坂の戸口」などの俗説は裏付けを確認できなかった）
  - 麻羽郷の比定は県の沿革資料による紹介で、一次文献の直接確認は未了
  updated: '2026-11-13'
- id: muni/11-宮代町
  code: '114421'
  names:
    ja: 宮代町
    reading: みやしろまち
    aliases:
    - 百間村
    - 須賀村
  user_terms:
  - 宮代町の名前の由来
  - みやしろ
  - 東武動物公園のある町
  - 姫宮神社と身代神社
  naming_type: 新規命名
  formation: 合併新設
  prefecture: 埼玉県
  homonyms: []
  summary: 町名は昭和30年（1955年）の百間村・須賀村の合併に際して公募で選ばれた新しい名前である。町は、「宮代」は旧百間村の鎮守・姫宮神社の「宮」と、旧須賀村の鎮守・身代神社の「代」を合わせた名だと説明する。両村の神社の名を一文字ずつ分け合った、対等合併らしい命名である。
  first_attestation:
    era: 昭和30年
    year_western: 1955
    document: 百間村・須賀村の合併による宮代町の発足（7月20日）
    note: 町名「宮代」そのものの初出で、公募による命名そのもの
  claims:
  - text: 昭和30年（1955年）7月20日、百間村と須賀村が合併して宮代町が誕生した
    kind: fact
    level: E2
    status: established
    sources:
    - w10-miyashiro-museum-70
  - text: 町名については公募が行われ、百間村側では宮代・笠原・宮戸・隅田・古川、須賀村側では新生・宮代・古川・宮戸・浦里の候補が挙がり、両村に共通して挙がっていた「宮代」が採用された
    kind: fact
    level: E2
    status: established
    sources:
    - w10-miyashiro-museum-70
  - text: 町の資料は、現町名の「宮代町」は、旧百間村の鎮守である姫宮神社の「宮」と、旧須賀村の鎮守である身代神社の「代」から名付けられたものと説明する
    kind: fact
    level: E2
    status: established
    sources:
    - w10-miyashiro-shiryo
  - text: 身代神社は旧須賀村の鎮守で、創建は鎌倉時代の仁治3年（1242年）と伝えられ、素戔嗚尊を祀る
    kind: fact
    level: E2
    status: established
    sources:
    - w10-miyashiro-shiryo
  - text: 合併に先立ち、埼玉県の試案に基づく杉戸町・百間村・須賀村など1町6村での合併協議が進められたが合意に至らず、昭和30年5月に百間村・須賀村の2村での協議が始まって合併に至った
    kind: fact
    level: E2
    status: established
    sources:
    - w10-miyashiro-museum-70
  - text: 江戸時代初期の当地は百間村・須賀村・蓮谷村・久米原村・和戸村・国納村の6か村からなり、その大部分は旗本領であった
    kind: fact
    level: E2
    status: established
    sources:
    - w10-miyashiro-history
  - text: 地方公共団体コードは114421である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 神社の名を分け合った町名
    text: 合併で生まれる新町名は、しばしば両町村の意地の張り合いの末に決まる。宮代町の場合は穏やかだった。旧百間村の鎮守・姫宮神社から「宮」、旧須賀村の鎮守・身代神社から「代」。公募の候補リストを見ると、「宮代」は両村のどちらからも挙がっていた。どちらの村の名前でもないが、どちらの村の神様の名前でもある。対等合併の落としどころとして、これほど収まりのよい名前も珍しい。
    sources:
    - w10-miyashiro-shiryo
    - w10-miyashiro-museum-70
  relations:
  - pref/11
  - muni/11-杉戸町
  unknowns:
  - 町名公募の応募総数や選考過程を示す一次記録は未確認
  - 姫宮神社・身代神社という神社名そのものの語源は未確認
  updated: '2026-11-13'
- id: muni/11-寄居町
  code: '114081'
  names:
    ja: 寄居町
    reading: よりいまち
    aliases:
    - 寄居宿
    - 古寄居村
    - 新寄居村
    - 寄居新組村
  user_terms:
  - 寄居町の名前の由来
  - よりい
  - 鉢形城の城下町
  - 玉淀
  naming_type: 中心地名の継承
  formation: 不明
  prefecture: 埼玉県
  homonyms: []
  summary: 荒川が秩父山地から関東平野へ出る谷口の町で、対岸の鉢形城の城下町として発展した。「寄居」は中世の城郭に付随する施設・集落を指す言葉だったという研究があり、鉢形城との関係で生まれた名と考えられている。一方、江戸時代の地誌は落城後に浪士たちが「寄り集まって住んだ」ことに由来すると記しており、町はこの二つの説明を併記している。
  first_attestation:
    era: 天正20年
    year_western: 1592
    document: 日下部定好寺領書立（極楽寺文書）にみえる「寄居之郷」
    note: 日本歴史地名大系が紹介する「寄居」の確かな用例の一つ。二次資料経由の確認
  claims:
  - text: 鉢形城の落城の後、甲州の侍や小田原の浪士などが寄り集まって居住したことが「寄居」の名の由来だという話が、江戸時代の『新編武蔵風土記稿』に記されて伝わっている
    kind: legend
    level: E2
    status: established
    sources:
    - w10-yorii-town-profile
    - w10-yorii-town-yoran
  - text: 町は公式プロフィールで、中世の城郭の周囲に築かれた施設・集落のことを「根古屋」「寄居」等と呼んだという研究成果も紹介し、鉢形城や花園城など多くの中世城郭が存在することから、その起源は戦国時代までさかのぼるのではないかと考えられるとする
    kind: fact
    level: E2
    status: established
    sources:
    - w10-yorii-town-profile
  - text: 日本歴史地名大系は「寄居とは中世の城郭の一形態で、本城に付随する部分のことと考えられており、対岸の鉢形城との関係から村名になったものとみられる」と解説する
    kind: fact
    level: E3
    status: established
    sources:
    - w10-yorii-kotobank-mura
  - text: 日本歴史地名大系によれば、天正20年（1592年）3月12日の書立（極楽寺文書）に「寄居之郷」とあるのが、確認できる「寄居」の用例の一つである
    kind: fact
    level: E2
    status: indeterminate
    sources:
    - w10-yorii-kotobank-mura
  - text: 日本歴史地名大系によれば、明暦元年（1655年）の検地により寄居村は古寄居村と新寄居村に分かれ、のち寄居新組村を加えた三か村が入組んだ村域をなした
    kind: fact
    level: E2
    status: established
    sources:
    - w10-yorii-kotobank-mura
  - text: 明治22年（1889年）に町村制により寄居町が成立し、昭和30年（1955年）2月11日に折原村・鉢形村・男衾村・用土村と合併して現在の寄居町となった
    kind: fact
    level: E5
    status: established
    sources:
    - w10-yorii-wiki
  - text: 地方公共団体コードは114081であり、寄居町は現在、大里郡で唯一の自治体である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
    - w10-yorii-wiki
  column:
    title: 「人が寄る町」の二つの由来
    text: 町の公式プロフィールは、起源の異なる二つの説をどちらも捨てていない。落城の浪士が寄り集まったという物語と、城に寄り添う集落を指す戦国時代の軍事用語だったという研究である。町は両者をまとめて「寄居とは、人が寄る町・人が集う町を象徴した歴史的な名前」と締めくくり、駅前の拠点施設には「Yotteco（よってこ）」という名まで付けた。語源論争を町の魅力に読み替える、上手い手である。
    sources:
    - w10-yorii-town-profile
    - w10-yorii-town-yoran
  relations:
  - pref/11
  - muni/11-嵐山町
  - muni/11-小川町
  - muni/11-東秩父村
  unknowns:
  - 「寄居」の用例とされる天正20年（1592年）の書立は専門辞典経由の確認で、原史料の直接確認は未了
  - 『和名類聚抄』の榛沢郡・男衾郡の郷名に「寄居」にあたるものがあったかは確認できていない
  updated: '2026-11-13'
- id: muni/11-富士見市
  code: '112356'
  names:
    ja: 富士見市
    reading: ふじみし
    aliases:
    - 富士見村
    - 富士見町
    - 鶴瀬村
    - 南畑村
    - 水谷村
  user_terms:
  - 富士見市の名前の由来
  - 富士山が見える市
  - ふじみ野市との違い
  - 水子貝塚のある市
  naming_type: 新規命名
  formation: 合併新設
  prefecture: 埼玉県
  homonyms: []
  summary: 市名は昭和31年（1956年）の合併で生まれた新しい名前で、武蔵野台地から富士山がよく見えることに由来する。鶴瀬村・南畑村・水谷村のいずれにも「富士見」という地名はなく、市章には富士とともに3か村の合併そのものが図案化されている。昭和47年（1972年）に市制を施行した。
  first_attestation:
    era: 昭和31年
    year_western: 1956
    document: 町村合併による富士見村の発足
    note: 市名「富士見」の初出は合併時の新名そのもの。旧3村に富士見という地名はなかった
  claims:
  - text: 昭和31年（1956年）9月30日、鶴瀬村・南畑村・水谷村の3村が合併して富士見村が発足した
    kind: fact
    level: E2
    status: established
    sources:
    - w2-fujimi-profile
  - text: 市の名は富士山がよく見えることに由来し、市章の公式説明も「富士山の見える市ということで市章の中央に富士をおき」とする
    kind: fact
    level: E2
    status: established
    sources:
    - w2-fujimi-profile
    - w2-fujimi-wiki
  - text: 市章（昭和41年制定）の周囲の円は、荒川・新河岸川・柳瀬川の3本の川と、旧3か村の合併を意味するものとして図案化されている
    kind: fact
    level: E2
    status: established
    sources:
    - w2-fujimi-profile
  - text: 昭和39年（1964年）4月1日に町制を施行して富士見町となり、昭和47年（1972年）4月10日に市制を施行して富士見市が発足した
    kind: fact
    level: E2
    status: established
    sources:
    - w2-fujimi-profile
  - text: 平成の大合併では、上福岡市・大井町・三芳町との合併が協議されたが、住民投票で富士見市は反対多数となり、合併は実現しなかった
    kind: fact
    level: E5
    status: established
    sources:
    - w2-fujimi-wiki
  - text: 市域東部の台地縁辺には縄文時代の水子貝塚（国指定史跡）があり、縄文時代には海が谷に沿って内陸深くまで進入し、市域の東半部にも海が広がっていた
    kind: fact
    level: E2
    status: established
    sources:
    - w2-fujimi-history
  column:
    title: 海が見えた土地が、富士山の見える土地になった
    text: 富士見の名の由来は「富士山がよく見えること」だが、縄文時代のこの土地から見えたのは山ではなく海だった。台地の縁にある水子貝塚は、当時ここまで入り込んでいた海のそばで暮らした人々の跡である。海が退き、台地が開けて初めて、遠く富士山を望む「富士見」の風景が生まれた。市章の真ん中の富士と、それを囲む3か村合併の円は、その新しい風景と新しい村の誕生を重ねた図案になっている。
    sources:
    - w2-fujimi-history
    - w2-fujimi-profile
  relations:
  - pref/11
  - muni/11-ふじみ野市
  unknowns:
  - 合併時に「富士見」の名が提案・選定された過程を示す一次記録は未確認
  - 旧3村（鶴瀬・南畑・水谷）の村名の語源は本レコードでは未調査
  updated: '2026-11-13'
- id: muni/11-小川町
  code: '113433'
  names:
    ja: 小川町
    reading: おがわまち
    aliases:
    - 小川村
    - 大河村
    - 竹沢村
    - 八和田村
  user_terms:
  - 小川町の名前の由来
  - おがわまち
  - 和紙の里
  - 細川紙
  - 小川和紙
  naming_type: 中心地名の継承
  formation: 合併新設
  prefecture: 埼玉県
  homonyms: []
  summary: 小川盆地の中心の町で、江戸時代から和紙（小川和紙）の産地と市場の町として栄えた小川村の名を受け継ぐ。文明6年（1474年）の書状に「小河」と見えるのが古い用例で、八王子道と川越秩父道が交わる谷口集落として「小川町」とも呼ばれた。昭和30年（1955年）に大河村・竹沢村・八和田村と合併して現在の小川町となった。
  first_attestation:
    era: 文明6年
    year_western: 1474
    document: 太田道灌書状写にみえる「在郷之地小河」
    note: 日本歴史地名大系が紹介する用例で、「小川」の前身にあたる表記とみられる。二次資料経由の確認
  claims:
  - text: 日本歴史地名大系は、小川村が八王子道と川越秩父道の交わる交通の要衝にあたり、一・六の日の六斎市が立てられて「小川町ともよばれた」と解説する
    kind: fact
    level: E3
    status: established
    sources:
    - w10-ogawa-kotobank-mura
  - text: 日本歴史地名大系によれば、文明6年（1474年）に太田道灌が上田上野介の「在郷之地小河」に一宿したことが書状写に残り、この「小河」が当地を指す古い用例となっている
    kind: fact
    level: E2
    status: indeterminate
    sources:
    - w10-ogawa-kotobank-mura
  - text: 明治22年（1889年）の町村制で小川町・大河村・竹沢村・八和田村が成立し、昭和30年（1955年）に旧4町村が合併して新たな小川町が成立、翌31年1月に寄居町の一部が編入されて現在の町域が確定した
    kind: fact
    level: E2
    status: established
    sources:
    - w10-ogawa-town-kyoiku
  - text: 江戸時代、市街地中心の小川村は秩父往還と八王子方面への道の交差点にあたる物資の集散地として繁栄し、特産の和紙は漉屋が426軒にも及ぶ一大生産地となった
    kind: fact
    level: E2
    status: established
    sources:
    - w10-ogawa-town-kyoiku
  - text: 小川町観光協会は、正倉院文書に宝亀5年（774年）に武蔵国から「武蔵国紙480張」が納められたという記録が残り、これが小川和紙に関わる最初の史料とされると紹介する
    kind: fact
    level: E4
    status: established
    sources:
    - w10-ogawa-kanko-washi
  - text: 小川和紙を代表する細川紙は、もとは紀州高野山の麓の細川村で漉かれた細川奉書の技術が、大阪商人・江戸の商人を通じて当地に伝えられたものと観光協会は説明する
    kind: fact
    level: E4
    status: established
    sources:
    - w10-ogawa-kanko-washi
  - text: 地方公共団体コードは113433である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 「ぴっかり千両」——紙を干す日の光
    text: 江戸時代後期の最盛期、小川の紙漉きからは「ぴっかり千両」という言葉が生まれたと観光協会は伝える。冬の晴れた日に紙を干せば村中が白く染まり、大きな儲けになった。日差しそのものが千両の値打ちだという、産地の自慢である。その細川紙は平成26年（2014年）、本美濃紙・石州半紙とともに「和紙：日本の手漉き和紙技術」としてユネスコ無形文化遺産に登録された。
    sources:
    - w10-ogawa-kanko-washi
    - w10-higashichichibu-pref-journal
  relations:
  - pref/11
  - muni/11-東秩父村
  - muni/11-嵐山町
  - muni/11-寄居町
  unknowns:
  - 「小川」の語源（盆地を流れるどの流れを指した名か）について、調べた公的・専門資料では確かな説明が確認できなかった
  - 和紙の漉屋の数について、町教育委員会資料は江戸時代に426軒、観光協会は江戸時代後期に750軒超とし、数える範囲の違いとみられるが確定できない
  updated: '2026-11-13'
- id: muni/11-小鹿野町
  code: '113654'
  names:
    ja: 小鹿野町
    reading: おがのまち
    aliases:
    - 巨香郷
    - 両神村
    - 長若村
  user_terms:
  - 小鹿野町の名前の由来
  - おがの
  - 歌舞伎の町
  - 両神山
  naming_type: 中心地名の継承
  formation: 合併新設
  prefecture: 埼玉県
  homonyms: []
  summary: 秩父盆地のほぼ中央の町で、「おがの」の名は平安時代の『和名類聚抄』に載る「巨香郷（おかのごう）」に始まると町は伝える。中世には武蔵武士の小鹿野氏が当地に館を構えた。江戸時代から続く小鹿野歌舞伎で知られ、平成17年（2005年）に両神村と合併して現在の小鹿野町となった。
  first_attestation:
    era: 平安時代
    year_western: null
    document: 『和名類聚抄』の秩父郡「巨香郷」
    note: 町公式資料が「おがの」の名の始まりとして紹介する記載。巨香郷を当地に比定するのは町の伝承的説明に基づく
  claims:
  - text: 町の地勢資料は、「おがの」の町名は平安時代に『和名類聚抄』へ載せられた「巨香郷（おかのごう）」に始まると伝えられ、由緒あるところから、明治22年以来、関係町村一致の意見をもって旧町名をそのまま受け継いできたと記す
    kind: fact
    level: E2
    status: established
    sources:
    - w10-ogano-town-chisei
  - text: 町の計画資料によれば、鎌倉時代には武蔵武士の小鹿野氏が当地に館を構えていた
    kind: fact
    level: E2
    status: established
    sources:
    - w10-ogano-town-kaso
  - text: 江戸時代の小鹿野は、秩父地域では大宮郷（現在の秩父市）に次ぐ市（いち）として繁栄し、江戸との交流も盛んに行われたと町の計画資料は記す
    kind: fact
    level: E2
    status: established
    sources:
    - w10-ogano-town-kaso
  - text: 昭和30年（1955年）4月1日に小鹿野町と長若村が合併し、翌31年3月31日に三田川村・倉尾村が合併、平成17年（2005年）10月1日に両神村と合併して現在の小鹿野町となった
    kind: fact
    level: E2
    status: established
    sources:
    - w10-ogano-town-chisei
  - text: 小鹿野歌舞伎は約220年前、江戸で修業を積んだ初代坂東彦五郎が帰郷後、近所の若者に歌舞伎を教えたことに始まると町は説明する
    kind: fact
    level: E2
    status: established
    sources:
    - w10-ogano-town-kabuki
  - text: 小鹿野歌舞伎は昭和50年に県指定無形文化財、昭和52年に県無形民俗文化財の指定を受け、子ども歌舞伎や女歌舞伎まで「町じゅうが役者」といわれる形で受け継がれている
    kind: fact
    level: E2
    status: established
    sources:
    - w10-ogano-town-kabuki
  - text: 地方公共団体コードは113654である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 消えなかった旧町名
    text: 昭和30年の合併でも平成17年の合併でも、「小鹿野」の名は一度も揺るがなかった。町の資料はその理由を「由緒あるところから、関係町村一致の意見をもって旧町名をそのまま受け継いできた」と誇らしげに記す。千年前の郷の名に始まるという由緒が、合併のたびに新名を公募する議論そのものを不要にしてきたのである。なお「巨香」から「小鹿野」への変化の途中経過は、今もよく分かっていない。
    sources:
    - w10-ogano-town-chisei
  relations:
  - pref/11
  - muni/11-横瀬町
  unknowns:
  - 『和名類聚抄』の巨香郷を現在の小鹿野に比定する根拠の詳細は、町資料の伝承的説明の範囲を超えて確認できていない
  - 「巨香」から「小鹿野」への表記と読みの転化過程、および「小鹿野」の字義の語源は未詳
  updated: '2026-11-13'
- id: muni/11-嵐山町
  code: '113425'
  names:
    ja: 嵐山町
    reading: らんざんまち
    aliases:
    - 菅谷村
    - 菅谷宿
    - 七郷村
    - 武蔵嵐山
  user_terms:
  - 嵐山町の名前の由来
  - らんざん
  - 武蔵嵐山
  - 武蔵の小京都
  - 嵐山渓谷
  naming_type: 中心地名の継承
  formation: 改称
  prefecture: 埼玉県
  homonyms: []
  summary: 町名は町内の景勝地・嵐山渓谷の名に由来する。昭和3年（1928年）に当地を訪れた林学者の本多静六が、槻川の渓谷と赤松林の景観が京都の嵐山に似ているとして「武蔵嵐山」と名付けた。旧・菅谷村は昭和42年（1967年）に嵐山村へ改称し、即日町制を施行して嵐山町となった。なお当町は京都の嵐山（あらしやま）とは別の自治体で、読みも音読みの「らんざん」である。
  first_attestation:
    era: 昭和3年
    year_western: 1928
    document: 本多静六による「武蔵嵐山」の命名（嵐山町公式サイトの説明）
    note: 地名「武蔵嵐山」の初出＝命名そのもの。町名としての採用は1967年
  claims:
  - text: 町は、現在使われている「武蔵嵐山」は昭和3年（1928年）に当地を訪れた本多静六林学博士により名付けられたもので、槻川橋より眺めた渓谷と周囲の赤松林の景観が京都の「嵐山（あらしやま）」に大変よく似ていることから、「武蔵国の嵐山」という意味で命名されたと説明する
    kind: fact
    level: E2
    status: established
    sources:
    - w10-ranzan-town-keikoku
  - text: 町によれば、この渓谷は「武蔵嵐山」と名付けられる前、秩父の長瀞岩畳に例えて「武蔵長瀞」と呼ばれていたこともあったという
    kind: fact
    level: E2
    status: established
    sources:
    - w10-ranzan-town-keikoku
  - text: 嵐山町観光協会（文章提供・嵐山町文化スポーツ課博物誌編さん室）は、本多が菅谷館跡から槻川に沿って歩く途中でこの景観に接し「これは武蔵嵐山だ」とつぶやいたことが現在の町名の由来であるとし、昭和5年（1930年）に朝日新聞社の「東日本新名物」で武蔵嵐山が紹介されたと伝える
    kind: fact
    level: E4
    status: established
    sources:
    - w10-ranzan-kanko
  - text: 東武東上線の菅谷駅が「武蔵嵐山駅」に改称された年について、町公式サイトは昭和11年（1936年）とし、観光協会は昭和10年（1935年）としており、1年のずれがある
    kind: fact
    level: E2
    status: contested
    sources:
    - w10-ranzan-town-keikoku
    - w10-ranzan-kanko
  - text: 明治22年（1889年）に菅谷村が成立し、昭和30年（1955年）に七郷村と新設合併して改めて菅谷村となり、昭和42年（1967年）4月15日に嵐山村と改称、即日町制を施行して嵐山町となった
    kind: fact
    level: E2
    status: established
    sources:
    - w10-ranzan-hakubutsushi
    - w10-ranzan-wiki
  - text: 京都の嵐山は訓読みの「あらしやま」であるのに対し当町は音読みの「らんざん」であり、町は「武蔵の小京都」として全国京都会議に加盟している
    kind: fact
    level: E5
    status: established
    sources:
    - w10-ranzan-wiki
  - text: 地方公共団体コードは113425である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 博士の一言が駅になり、町になった
    text: 1928年、林学の大家・本多静六の「これは武蔵嵐山だ」という一言が、まず渓谷の名前になり、新聞の「東日本新名物」に載って観光地の名になり、やがて駅の名前になり、39年後の1967年には自治体そのものの名前になった。昭和14年（1939年）には61歳の与謝野晶子が渓谷の旅館・松月楼に泊まり、「比企の渓」と題する29首を詠んでいる。学者の命名が名所を生み、名所が町の名を塗り替えた珍しい系譜である。
    sources:
    - w10-ranzan-kanko
    - w10-ranzan-town-keikoku
  relations:
  - pref/11
  - muni/11-小川町
  - muni/11-寄居町
  unknowns:
  - 1967年の改称・町制を決めた直接の理由や議論の経過を示す公式記録は未確認
  - 菅谷駅の「武蔵嵐山駅」への改称年は、町公式（1936年）と観光協会（1935年）で記述がずれている
  - 一般に流布する「国木田独歩が京都の嵐山に似ていると評した」という話は、町公式・観光協会の説明では確認できず、命名者は本多静六とされている
  updated: '2026-11-13'
- id: muni/11-川口市
  code: '112038'
  names:
    ja: 川口市
    reading: かわぐちし
    aliases:
    - 川口町
    - 川口宿
    - 小川口
  user_terms:
  - 川口市の名前の由来
  - 川口はなぜ川口というのか
  - 鋳物の町川口
  - 川口と鳩ヶ谷の合併
  naming_type: 中心地名の継承
  formation: 合併新設
  prefecture: 埼玉県
  homonyms: []
  summary: 市名は古くからの地名「川口」を受け継いだもので、川口市は、旧入間川（現在の荒川）と芝川が合流する場所であったことに由来すると説明する。鎌倉時代の『とはずがたり』などに記された「小川口」が現在の川口にあたるとされる。昭和8年（1933年）に川口町など1町3村の合併で市制を施行した。
  first_attestation:
    era: 鎌倉時代
    year_western: null
    document: 『とはずがたり』（「小川口」）
    note: 川口市は、鎌倉時代の作とされる『とはずがたり』と室町時代の『義経記』に記された「小川口」が現在の川口にあたるとしている（比定は市の説明による）
  claims:
  - text: 川口市は、「川口」という地名は旧入間川（現在の荒川）と芝川が合流する場所であったことに由来するといわれている、と説明している
    kind: fact
    level: E2
    status: established
    sources:
    - k1-kawaguchi-keikaku
  - text: 川口市によれば、鎌倉時代の作とされる「とはずがたり」、室町時代の作とされる「義経記」に記された「小川口」という地名が、現在の川口にあたるとされている
    kind: fact
    level: E2
    status: established
    sources:
    - k1-kawaguchi-keikaku
  - text: 江戸時代には「川口宿」が日光御成道の宿場町の一つとしてにぎわい、現在と同じ「川口」の名が使われていた
    kind: fact
    level: E2
    status: established
    sources:
    - k1-kawaguchi-keikaku
  - text: 昭和8年（1933年）に川口町・横曽根村・南平柳村・青木村の1町3村が合併し、川口市として市制が施行された
    kind: fact
    level: E2
    status: established
    sources:
    - k1-kawaguchi-keikaku
  - text: 川口の植木・苗木の栽培は、明暦3年（1657年）の江戸の大火で焼け野原となった江戸へ植木や草花を供給して以来発展したと市は説明し、安行地区の植木は川口を代表する産業の一つとなった
    kind: fact
    level: E2
    status: established
    sources:
    - k1-kawaguchi-keikaku
  - text: 昭和15年（1940年）に合併した鳩ヶ谷は昭和25年（1950年）に町として分離したが、平成23年（2011年）10月11日に鳩ヶ谷市と川口市が合併し、現在の川口市が形成された
    kind: fact
    level: E2
    status: established
    sources:
    - k1-kawaguchi-keikaku
  - text: 総務省の全国地方公共団体コードで、川口市のコードは112038と定められている（J-LISの埼玉県内市町村一覧による）
    kind: fact
    level: E2
    status: established
    sources:
    - k1-jlis-saitama
  column:
    title: 分かれて61年、鳩ヶ谷との再合併
    text: 川口市と鳩ヶ谷は、1940年に一度合併しながら、1950年に鳩ヶ谷が町として分離するという道を選んだ。その後鳩ヶ谷は市となり、川口とは別の自治体として61年間を歩んだ末、2011年10月11日に再び合併した。江戸時代には川口宿と鳩ヶ谷宿という、日光御成道に並ぶ二つの宿場だった土地が、離合集散を経て一つの市に戻ったことになる。川口の「川口」という名は、この間ずっと市の名として存続し続けた。
    sources:
    - k1-kawaguchi-keikaku
  relations:
  - pref/11
  unknowns:
  - 「小川口」を現在の川口に比定するのは市の説明によるもので、学術的な検討は確認できなかった
  - 合流地点説以外の語源説は、市の公式資料には見当たらなかった
  updated: '2026-11-13'
- id: muni/11-川島町
  code: '113468'
  names:
    ja: 川島町
    reading: かわじままち
    aliases:
    - 川島村
    - 川島領
    - 中山村
    - 三保谷村
  user_terms:
  - 川島町の名前の由来
  - かわじま
  - 川に囲まれた島
  - 輪中の町
  naming_type: 中心地名の継承
  formation: 合併新設
  prefecture: 埼玉県
  homonyms: []
  summary: 町は荒川・入間川・越辺川・市野川などに四方を囲まれ、町の計画自身が「川に囲まれた島そのもの」と表現する輪中の地にある。この一帯は川島領と呼ばれ、昭和29年（1954年）に川島領の6村が合併して川島村が誕生し、その名を受け継いだ。昭和47年（1972年）に町制を施行して川島町となった。
  first_attestation:
    era: 昭和29年
    year_western: 1954
    document: 川島領6村の合併による川島村の成立
    note: 自治体名としての「川島」の初出。前身の「川島領」という呼称自体の初出は未確認
  claims:
  - text: 町の環境基本計画は、本町が北は市野川、東は荒川、南は入間川、西は越辺川・都幾川に接しており、「まさに"川に囲まれた島"そのものといえます」と記す
    kind: fact
    level: E2
    status: established
    sources:
    - w10-kawajima-town-kankyo
  - text: 同計画は、昭和29年（1954年）に、川島領と呼ばれた中山・伊草・三保谷・出丸・八ツ保・小見野の6つの村が合併して川島村が誕生したと記しており、自治体名「川島」が「川島領」の名を受け継いだことを示す
    kind: fact
    level: E2
    status: established
    sources:
    - w10-kawajima-town-kankyo
  - text: 埼玉県の資料によれば、川島村は昭和47年（1972年）11月に町制を施行して川島町となった
    kind: fact
    level: E2
    status: established
    sources:
    - w10-kawajima-pref
  - text: 町の計画によれば、江戸時代の当地は川越藩の支配の中で農業生産が高まった一方、荒川の流れが現在の場所に変わったことでたびたび水害に悩まされるようになり、大囲堤の築造や河川改修によって徐々に水害を克服してきた
    kind: fact
    level: E2
    status: established
    sources:
    - w10-kawajima-town-kankyo
  - text: 川島町は四方を河川に囲まれた輪中となっており、「地名のとおり『川に囲まれた島』のような地形」と紹介される
    kind: fact
    level: E5
    status: established
    sources:
    - w10-kawajima-wiki
  - text: 地方公共団体コードは113468である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 水害と引き換えの肥沃な「島」
    text: 川島町の「島」は海の島ではない。荒川の流路が変わって以来、この低地は大雨のたびに水に囲まれる輪中だった。人々は大囲堤を築いて川と折り合いをつけながら水田を開いてきた。洪水の記憶と引き換えに得た肥沃な土の上に、いま「川の中の島」という地名が残っている。町域の標高は平均14.5メートルほどで、高低差はほとんどないという。
    sources:
    - w10-kawajima-town-kankyo
  relations:
  - pref/11
  unknowns:
  - 「川島領」という呼称がいつから使われたか（領としての成立時期）は未確認
  - 四方を川に囲まれた地形が「川島」の名の直接の由来であることを明示した、命名当時の公式記録は未確認であり、地形由来は町の地勢説明からの読み取りにとどまる
  updated: '2026-11-13'
- id: muni/11-川越市
  code: '112011'
  names:
    ja: 川越市
    reading: かわごえし
    aliases:
    - 河越
    - 河肥
    - 川越町
    - 河越荘
  user_terms:
  - 川越市の名前の由来
  - 川越はなぜ川越というのか
  - 小江戸川越
  - 河越と川越の違い
  naming_type: 旧行政区画名の継承
  formation: 単独発足
  prefecture: 埼玉県
  homonyms: []
  summary: 市名は中世の荘園・河越荘と、その領主だった河越氏の名に由来する古い地名を受け継いだもので、古くは「河越」と書かれ、「河肥」の表記もあった。語源には、入間川を越える地点に由来するという説と、「河肥」の字から肥沃な土地に由来するという説があり、定説はない。大正11年（1922年）に埼玉県内で初めて市制を施行した。
  first_attestation:
    era: 平安時代後期
    year_western: null
    document: 河越荘（入間川流域の荘園）の成立
    note: 平安時代後期に河越荘が成立し、その管理者（荘司）が河越氏を称した。文応元年（1260年）の養寿院銅鐘銘では「武蔵国河肥庄」と記される
  claims:
  - text: 現在の川越市域北西部の上戸には河越氏の館（河越館跡）があり、平安時代末期から鎌倉時代にかけて河越荘を領した河越氏は、鎌倉幕府でも重鎮の位置を占めた
    kind: fact
    level: E2
    status: established
    sources:
    - k1-kawagoe-yakata
  - text: 川越の語源には二つの対立する説がある。一つは入間川を越える地点に由来するという説、もう一つは文献に現れた当時の表記「河肥」から、入間川・小畔川などによって肥沃な土地であることに由来するという説で、郷土史料は「必ずしも定説があるとはいえない」と述べる
    kind: fact
    level: E4
    status: contested
    sources:
    - k1-kawagoe-minzoku
  - text: 川越市内南町の養寿院にある文応元年（1260年）の銅鐘の銘には「武蔵国河肥庄新日吉山王宮」とあり、鎌倉時代には「河肥」の表記が実際に使われていた
    kind: fact
    level: E4
    status: established
    sources:
    - k1-kawagoe-minzoku
  - text: 河越荘は後白河上皇が永暦元年（1160年）に京都東山に創建した新日吉社に寄進された荘園で、「河肥」の表記は寄進の文書で嘉字（縁起のよい字）が選ばれたためではないかという推測がある
    kind: fact
    level: E4
    status: inferred
    sources:
    - k1-kawagoe-minzoku
  - text: 江戸時代、川越は川越藩の城下町として栄え、新河岸川の舟運によって江戸と結ばれ、「小江戸」と呼ばれる繁栄を見せた
    kind: fact
    level: E2
    status: established
    sources:
    - k1-kawagoe-rekimachi
  - text: 明治22年（1889年）に川越町として成立し、大正11年（1922年）12月1日に埼玉県内で初めて市制が施行され、人口約31,000人の川越市が誕生した
    kind: fact
    level: E2
    status: established
    sources:
    - k1-kawagoe-rekimachi
  - text: 総務省の全国地方公共団体コードで、川越市のコードは112011と定められている（J-LISの埼玉県内市町村一覧による）
    kind: fact
    level: E2
    status: established
    sources:
    - k1-jlis-saitama
  column:
    title: 「河肥」という一文字の謎
    text: 川越の古い表記は「河越」だが、1260年の銅鐘には「河肥庄」と刻まれている。なぜ「肥」なのか。郷土の研究者は、河越荘が1160年創建の新日吉社へ寄進された際、中央の文書で「越」の代わりに嘉字の「肥」が選ばれたのではないかと推測する。ただし『吾妻鏡』では地名も河越氏の姓も常に「越」で書かれ、「肥」は見えないとも指摘されており、この一字は今も決着がついていない。なお、同じ「かわごえ」という読みの自治体に三重県の川越町があるが、別の土地の別の歴史を持つ地名である。
    sources:
    - k1-kawagoe-minzoku
  relations:
  - pref/11
  - muni/24-川越町
  unknowns:
  - 語源の定説はない（川を越える地点説／肥沃な土地説の両論を併記した）
  - 「河越」の名の確実な初出文書（平安時代の記録）は特定できなかった
  updated: '2026-11-13'
- id: muni/11-幸手市
  code: '112402'
  names:
    ja: 幸手市
    reading: さってし
    aliases:
    - 幸手宿
    - 幸手町
    - 薩手
  user_terms:
  - 幸手市の名前の由来
  - さって
  - 権現堂桜堤
  - 幸手宿
  naming_type: 中心地名の継承
  formation: 単独発足
  prefecture: 埼玉県
  homonyms: []
  summary: 市名は、日光道中と日光御成道が合流する宿場町・幸手宿以来の地名を受け継いだものである。読みの「さって」は、日本武尊が上陸したという「薩手が島」の伝承に結びつけられて語られる。利根川の支流・権現堂川の堤に植えられた桜並木「権現堂桜堤」で知られ、昭和61年（1986年）に市制を施行した。
  first_attestation:
    era: 江戸時代
    year_western: null
    document: 幸手宿（日光道中・日光御成道の宿場）
    note: 宿場名としての「幸手」は江戸時代に確認できるが、それ以前の用例や文書上の初出は未確認
  claims:
  - text: 江戸時代の幸手は、日光道中と将軍の日光参詣に使われた日光御成道が合流し、筑波道が分岐する地点の宿場町として繁栄し、現在の市街地の基盤が形成された
    kind: fact
    level: E2
    status: established
    sources:
    - w2-satte-history
  - text: 伊奈氏による利根川の付替え工事で権現堂川・江戸川などが整備され、権現堂河岸は江戸周辺と上流域を結ぶ舟運の要地として栄えた
    kind: fact
    level: E2
    status: established
    sources:
    - w2-satte-history
  - text: 日本武尊が東征に際して「薩手が島」に上陸し、田宮の雷電神社に農神を祭ったという言い伝えが残っており、「幸手」の名はその「薩手（さって）」に由来すると伝えられる
    kind: legend
    level: E5
    status: established
    sources:
    - w2-satte-wiki
  - text: 権現堂堤には1920年に延長6キロメートルにわたって3,000本のソメイヨシノが植えられ、関東の桜の名所となった。戦時中に伐採されたが、1949年に改めて植樹された
    kind: fact
    level: E2
    status: established
    sources:
    - w2-satte-gongendo
  - text: 享和2年（1802年）に権現堂堤が決壊した際、修復工事のなかで順礼の親子が自ら人柱になったという伝説が残り、順礼の碑（市指定文化財）がその親子を供養している
    kind: legend
    level: E2
    status: established
    sources:
    - w2-satte-history
  - text: 市内には、平将門の首が葬られたと伝えられる将門首塚があり、市の観光マップにも史跡として案内されている
    kind: legend
    level: E2
    status: established
    sources:
    - w2-satte-map
  - text: 明治22年（1889年）に幸手町が生まれ、1954年から1956年にかけての合併・分離を経て、昭和61年（1986年）に市制を施行して幸手市となった
    kind: fact
    level: E2
    status: established
    sources:
    - w2-satte-history
  column:
    title: 桜の名所の土手に眠る人柱伝説
    text: 幸手の春を彩る権現堂桜堤は、1920年に3,000本の桜が植えられて生まれた比較的新しい名所である。だがその土手には、もっと古い物語が眠っている。享和2年（1802年）、豪雨で決壊した権現堂堤の修復工事で、巡礼の親子が自ら人柱になったという伝説である。市はこの親子を供養する「順礼の碑」を文化財に指定している。花見客でにぎわう堤防は、かつて水と闘い続けた土地の記憶の上にある。
    sources:
    - w2-satte-gongendo
    - w2-satte-history
  relations:
  - pref/11
  unknowns:
  - 「幸手」の語源は薩手が島の伝承以外に確かな説を確認できておらず、専門辞典での確認と文書上の初出の特定は未了
  - 合併した旧村（行幸村・権現堂川村など）の村名の由来は本レコードでは未調査
  updated: '2026-11-13'
- id: muni/11-志木市
  code: '112283'
  names:
    ja: 志木市
    reading: しきし
    aliases:
    - 志木宿
    - 志木町
    - 引又
    - 舘村
  user_terms:
  - 志木市の名前の由来
  - 志木宿
  - 引又
  - いろは親水公園
  naming_type: 文献・故事から命名
  formation: 分村・分立
  prefecture: 埼玉県
  homonyms: []
  summary: 市名の源は、江戸時代の地誌『新編武蔵風土記稿』などに見える古い郷名「志木郷」である。明治7年（1874年）の合併で舘村と引又が村名を譲らず、命名を県に委ねたところ、県がこの郷名を採って「志木宿」と名付けた。引又は新河岸川の舟運と市場で栄えた土地で、明治22年（1889年）に志木町、昭和45年（1970年）に志木市となった。
  first_attestation:
    era: 江戸時代後期
    year_western: null
    document: 『新編武蔵風土記稿』などに見える「志木郷」
    note: 市公式が、県がこの郷名を採って志木宿と名付けたと伝えるもの。郷名自体の成立時期は未確認
  claims:
  - text: 明治7年（1874年）に舘村と引又宿が合併する際、双方が自分の名を村名とすることを主張して譲らなかったため、命名は県（当時の熊谷県）に委ねられた
    kind: fact
    level: E2
    status: established
    sources:
    - w2-shiki-origin
  - text: 県は『新編武蔵風土記稿』などに見える「志木郷」の名を採って、新しい村を「志木宿」と名付けたと市は伝える
    kind: fact
    level: E2
    status: established
    sources:
    - w2-shiki-origin
  - text: 前身の引又は舘村から分かれた村で、新河岸川の舟運の発達と引又市（市場）の繁盛によって発展し、町を称するまでに至った
    kind: fact
    level: E2
    status: established
    sources:
    - w2-shiki-origin
  - text: 新河岸川は古くは内川と呼ばれたが、寛永15年（1638年）の川越大火で焼失した仙波東照宮の復旧資材を運ぶため水路が整備されて新しい河岸場「新河岸」が作られ、川の名も新河岸川と呼ばれるようになったと市の歴史は伝える
    kind: fact
    level: E2
    status: established
    sources:
    - w2-shiki-history
  - text: 明治22年（1889年）、志木宿は町制を施行して志木町となった
    kind: fact
    level: E2
    status: established
    sources:
    - w2-shiki-origin
  - text: 昭和45年（1970年）10月26日に市制を施行し、志木市となった
    kind: fact
    level: E2
    status: established
    sources:
    - w2-shiki-origin
  - text: 市域の宗岡の地名については、周囲を開墾して真ん中に芝野を残したことから「中野」となったという説や、川の合流点にできた地形に由来する説などが紹介されている
    kind: fact
    level: E2
    status: contested
    sources:
    - w2-shiki-history
  column:
    title: 名前が決まらず、県に決めてもらったまち
    text: 明治7年（1874年）の合併で、古い村の舘村と、新河岸川の舟運で勢いづいた引又宿は、どちらも「自分の名こそ村名にふさわしい」と譲らなかった。決着がつかず、命名は県（熊谷県）の裁定に委ねられた。県が出した答えは、どちらの名でもなく、古い地誌に残る郷名「志木」だった。当事者同士では選べなかった第三の名が、そのまま今日の市名になっている。
    sources:
    - w2-shiki-origin
  relations:
  - pref/11
  - muni/11-新座市
  - muni/11-和光市
  unknowns:
  - 「志木郷」の郷名そのものの語源・成立時期は未確認
  - 県（熊谷県）が命名を決めた際の一次記録は未確認
  updated: '2026-11-13'
- id: muni/11-戸田市
  code: '112241'
  names:
    ja: 戸田市
    reading: とだし
    aliases:
    - 戸田村
    - 戸田町
    - 上戸田村
    - 下戸田村
    - 戸田の渡し
  user_terms:
  - 戸田市の名前の由来
  - 戸田ヶ原
  - 戸田の渡し
  - ボートのまち戸田
  naming_type: 中心地名の継承
  formation: 合併新設
  prefecture: 埼玉県
  homonyms: []
  summary: 市名は、中山道が荒川を渡る「戸田の渡し」の地として知られた戸田の名を受け継いだものである。近世には上戸田村・下戸田村があり、荒川沿いの草原「戸田ヶ原」はサクラソウの名所だった。明治22年（1889年）に戸田村が成立し、昭和41年（1966年）に市制を施行した。「戸田」という名自体の語源は、調べた公的資料では確かな説明が確認できていない。
  first_attestation:
    era: 江戸時代
    year_western: null
    document: 上戸田村・下戸田村（寛永6年の検地記録）
    note: 「戸田」の名は近世の村名・渡しの名として確認できるが、語源と初出は未確認
  claims:
  - text: 江戸時代、中山道と荒川が交差する場所には「戸田の渡し」が置かれ、参勤交代の大名行列が通過する際には周辺の村人が総出で渡しの仕事にあたるなど、交通の要衝として栄えた
    kind: fact
    level: E2
    status: established
    sources:
    - w2-toda-history
  - text: 寛永5年（1628年）には市域の笹目・早瀬付近が将軍家の鷹場に指定され、翌年には上戸田村・下戸田村などで検地が行われたと、市の年表資料は伝える
    kind: fact
    level: E2
    status: established
    sources:
    - w2-toda-fumiaruki
  - text: 「戸田ヶ原」は荒川沿いに広がっていた草原で、春には見渡す限りサクラソウが咲き、江戸時代にはサクラソウの名所として多くの花見客が訪れた
    kind: fact
    level: E2
    status: established
    sources:
    - w2-toda-gahara
  - text: 戸田ヶ原のサクラソウは大正時代末から摘み取りで減少し、1945年ごろに戸田ヶ原は姿を消したが、市は2007年からその自然再生に取り組んでいる
    kind: fact
    level: E2
    status: established
    sources:
    - w2-toda-gahara
  - text: 明治22年（1889年）に上戸田村・下戸田村・新曽村の区域をもって戸田村が成立し、昭和16年（1941年）に町制を施行した
    kind: fact
    level: E2
    status: established
    sources:
    - w2-toda-ayumi
    - w2-toda-wiki
  - text: 昭和32年（1957年）に戸田町と美笹村が合併し、昭和41年（1966年）に市制を施行して戸田市となった
    kind: fact
    level: E2
    status: established
    sources:
    - w2-toda-ayumi
    - w2-toda-wiki
  - text: 戸田ボートコース（戸田漕艇場）では、1964年の東京オリンピックで漕艇（ボート）競技が実施され、戸田は「ボートのまち」として知られる
    kind: fact
    level: E2
    status: established
    sources:
    - w2-toda-ayumi
  column:
    title: 消えた花の原を取り戻す
    text: 江戸時代、荒川沿いの戸田ヶ原は一面のサクラソウで知られ、花見の名所だった。浮世絵にも描かれた「戸田の渡し」を渡れば、そこは花の原だったのである。だがサクラソウは摘み取りで減り、まちが大きくなるなかで1945年ごろ戸田ヶ原は姿を消した。いま市は、ふるさとの原風景を取り戻そうと2007年から自然再生を続け、サクラソウの咲く湿地を少しずつよみがえらせている。
    sources:
    - w2-toda-gahara
    - w2-toda-history
  relations:
  - pref/11
  - muni/11-和光市
  unknowns:
  - 「戸田」という名の語源は、市の公式資料など調べた範囲では説明がなく未確認
  - 「戸田ヶ原」という呼称の初出や、近世における範囲の確定は未了
  updated: '2026-11-13'
- id: muni/11-所沢市
  code: '112089'
  names:
    ja: 所沢市
    reading: ところざわし
    aliases:
    - 野老沢
    - 所沢町
  user_terms:
  - 所沢市の名前の由来
  - 所沢と野老（トコロ）の関係
  - ところざわの語源
  - 所沢の市章の意味
  naming_type: 中心地名の継承
  formation: 単独発足
  prefecture: 埼玉県
  homonyms: []
  summary: 古くは植物の野老（トコロ）にちなむ「野老沢」と書かれた地名である。語源には、沢にトコロが自生していたことによるとする説と、低湿地を意味するアイヌ語「ト・オロ」に「野老」の字を当てたとする説があり、確定していない。市の紋章は今もトコロの葉を図案化したものである。
  first_attestation:
    era: 文明19年
    year_western: 1487
    document: 『廻国雑記』
    note: 「野老沢」の表記での初出級の用例。現在の「所沢」の漢字表記が定着した時期は未確認
  claims:
  - text: 「ところさわ」という地名は古くは野老沢と書かれ、文明19年（1487）の『廻国雑記』や文化12年（1815）の『武蔵野話』にその表記が見える
    kind: fact
    level: E2
    status: established
    sources:
    - l2-tokorozawa-library
  - text: 在原業平がこの地に寄ったとき、付近一帯が沢で野老（トコロ）が多く自生していたので「ここはトコロの沢か」と言ったのを伝え聞いて村名とした、という由来譚が伝えられる。ただしこの話は出所が明らかでなく、後世に地名の由来を説明するために作られた話とみる向きもある
    kind: legend
    level: E2
    status: established
    sources:
    - l2-tokorozawa-library
  - text: 一方で、沼地・低湿地を意味するアイヌ語の「ト・オロ」と、同じ地形を表す「沢」が重なって「ところさわ」と呼ばれていたところに「野老」の字が当てられたという説もあり、語源は確定していない
    kind: fact
    level: E2
    status: contested
    sources:
    - l2-tokorozawa-library
  - text: 昭和30年（1955）11月、市制施行5周年を記念して改められた現在の市章は、野老（トコロ）の葉を図案化し、周囲に「輪」「和」への願いを込めた3つの「ワ」をあしらったものである
    kind: fact
    level: E2
    status: established
    sources:
    - l2-tokorozawa-library
  - text: 昭和25年（1950）11月3日、所沢町が市制を施行して所沢市が誕生し、昭和30年（1955）4月に柳瀬村・三ケ島村を合併して現在の市域となった
    kind: fact
    level: E5
    status: established
    sources:
    - l2-tokorozawa-wikipedia
    - l2-tokorozawa-library
  - text: 総務省の全国地方公共団体コードで、所沢市の団体コードは112089と定められている
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 市章になった野老（トコロ）
    text: 所沢の語源とされる野老（トコロ）は、ヤマノイモ科のつる植物で、ひげ根を老人の髭に見立てて「野老」と書きます。所沢市はこの植物を市のシンボルに取り込みました。1955年に改められた市章はトコロの葉を図案化したもので、周りを「ワ」の字3つが囲みます。さらに市のマスコットも「トコろん」です。在原業平が名付け親だという言い伝えは作り話の疑いが強いものの、「沢にトコロが自生していた」という土地の記憶そのものは、市章とマスコットのかたちで今も生き続けています。
    sources:
    - l2-tokorozawa-library
  relations:
  - pref/11
  unknowns:
  - 「野老沢」から「所沢」へ漢字表記が定着した時期と経緯は、確認できていない
  - 律令期の所沢郷の有無など、1487年以前の用例は確認できていない
  updated: '2026-11-13'
- id: muni/11-新座市
  code: '112305'
  names:
    ja: 新座市
    reading: にいざし
    aliases:
    - 新座町
    - 大和田町
    - 大和田宿
    - 片山村
  user_terms:
  - 新座市の名前の由来
  - にいざ
  - 新座郡
  - 大和田宿
  naming_type: 旧行政区画名の継承
  formation: 合併新設
  prefecture: 埼玉県
  homonyms: []
  summary: 市名は、天平宝字2年（758年）に置かれた新羅郡に始まる歴史的な郡名「新座郡」に由来する。新羅郡は新倉郡を経て新座郡と名を変えたが、郡そのものは明治に消滅した。昭和30年（1955年）に大和田町と片山村が合併した際、この古い郡名を採って新座町とし、昭和45年（1970年）に新座市となった。
  first_attestation:
    era: 天平宝字2年
    year_western: 758
    document: 武蔵国新羅郡の設置
    note: 市名の源である郡名の始まり。市公式が伝えるもので、一次文献の直接確認は未了
  claims:
  - text: 天平宝字2年（758年）に武蔵国に新羅郡が設置され、市域はその郡下に属した。律令政府による新羅人の移住が行われた土地であると市の歴史は伝える
    kind: fact
    level: E2
    status: established
    sources:
    - w2-niiza-history
  - text: 新羅郡はその後、新倉郡、さらに新座郡と名称を変え、市名「新座」はこの歴史的名称に由来すると市は説明する
    kind: fact
    level: E2
    status: established
    sources:
    - w2-niiza-history
  - text: 江戸時代の大和田は柳瀬川の沖積低地に形成され、宿場や交通の要衝として栄えた
    kind: fact
    level: E2
    status: established
    sources:
    - w2-niiza-oowada
  - text: 近世には川越藩主・松平信綱による野火止台地の開発と野火止用水の開削が行われ、市域の新田開発が進んだ
    kind: fact
    level: E2
    status: established
    sources:
    - w2-niiza-history
  - text: 明治22年（1889年）に大和田町が成立し、昭和30年（1955年）3月に大和田町と片山村が合併して新座町が成立した
    kind: fact
    level: E2
    status: established
    sources:
    - w2-niiza-history
  - text: 昭和45年（1970年）11月1日に市制を施行して新座市となった
    kind: fact
    level: E2
    status: established
    sources:
    - w2-niiza-history
  column:
    title: 消えた郡の名が、町の名によみがえった
    text: 「新座」の源流は、758年に新羅からの移住者を受け入れて置かれた新羅郡にある。郡名は新倉郡、新座郡と姿を変え、明治29年（1896年）に郡そのものが北足立郡へ編入されて消えた。ところが約60年後の1955年、大和田町と片山村の合併で生まれる町の名として、忘れられていた郡名が掘り起こされた。古代の郡の名が、合併の新町の名として復活した例である。
    sources:
    - w2-niiza-history
    - w2-wako-wiki
  relations:
  - pref/11
  - muni/11-和光市
  - muni/11-志木市
  unknowns:
  - 新羅郡から新倉郡・新座郡への改称の時期と経緯は、一次文献（『続日本紀』等）での直接確認は未了
  - 「新座」の読みが現在の「にいざ」に定着した時期は未確認
  updated: '2026-11-13'
