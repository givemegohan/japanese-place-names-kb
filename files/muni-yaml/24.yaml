  naming_note: 2005年の合併で住民公募により選ばれた新名。大宮町・大内山村の「大」と紀勢町の「紀」を合わせた合成名であると町は説明する
  formation: 合併新設
  prefecture: 三重県
  homonyms: []
  summary: 三重県中南部、度会郡の町。2005年に大宮町・紀勢町・大内山村の合併で発足した。町名は「大宮・大内山の『大』と紀勢の『紀』の合成」と町は説明するが、三重県の合併資料が記録する決定理由は別で、「大内山川・宮川などの大きな川をイメージ」「紀州の玄関口として大きく発展」というものだった。町内には伊勢神宮の別宮・瀧原宮がある。町域の大半は旧伊勢国だが、錦地区のみ旧紀伊国に属した歴史を持つ。
  first_attestation:
    era: 平成17年
    year_western: 2005
    document: 大宮町・紀勢町・大内山村の新設合併による大紀町発足
    note: 住民公募によって生まれた新名であり、合併そのものが「大紀」の名の初出である
  claims:
  - text: 2005年2月14日に大宮町・紀勢町・大内山村が新設合併して大紀町が発足した
    kind: fact
    level: E4
    status: established
    sources:
    - x8-taiki-uub
  - text: 町名は大宮町・大内山村の「大」と紀勢町の「紀」を合わせた合成地名であると、大紀町公式サイトの説明として紹介されている
    kind: fact
    level: E2
    status: established
    sources:
    - x8-taiki-wiki
  - text: 三重県の合併資料によれば、町名は地域住民からの公募をもとに小委員会で1候補に絞り協議会で決定され、決定理由は「大内山川・宮川などの大きな川をイメージ」「紀州の玄関口として大きく発展」であった
    kind: fact
    level: E2
    status: established
    sources:
    - x7-minamiise-mie
  - text: 合成元の大宮町もまた合成名で、その「大」は大内山川に由来する
    kind: fact
    level: E5
    status: established
    sources:
    - x8-taiki-wiki
  - text: 合成元の紀勢町は、1957年2月1日に度会郡柏崎村と北牟婁郡錦町が合併して発足した
    kind: fact
    level: E5
    status: established
    sources:
    - x8-taiki-wiki
  - text: 町域の大半は旧伊勢国だが錦地区のみ旧紀伊国に属し、天正10年（1582年）に志摩国英虞郡から紀伊国牟婁郡へ編入された歴史を持つ
    kind: fact
    level: E5
    status: established
    sources:
    - x8-taiki-wiki
  - text: 大紀町の地方公共団体コードは244716である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 「大きな川」と「紀州の玄関口」
    text: 大紀町の名は、旧町名から一字ずつ取った合成名だと説明されることが多い。ところが三重県が残した合併資料を読むと、決定理由として書かれているのは別の言葉である。「大内山川・宮川などの大きな川をイメージ」「紀州の玄関口として大きく発展」。つまり「大」は大きな川の「大」、「紀」は紀州への玄関の「紀」という願いを込めた読み解きが、公式の理由として記録されている。実際、町の錦地区はかつて紀伊国に属し、伊勢と紀州の境目にあたる土地だった。合成名と願い名、二つの説明が重なっているのがこの町名の面白さである。
    sources:
    - x7-minamiise-mie
    - x8-taiki-wiki
  relations:
  - pref/24
  - muni/24-紀北町
  - muni/24-大台町
  unknowns:
  - 公募で「大紀町」が最多得票だったかなど、選定過程の票数等の詳細
  - 瀧原宮（伊勢神宮別宮）と町名・地域名「滝原」の関係を記す町公式資料
  updated: '2026-11-13'
- id: muni/24-尾鷲市
  code: '242098'
  names:
    ja: 尾鷲市
    reading: おわせし
    aliases:
