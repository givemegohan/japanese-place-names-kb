  naming_type: 文献から命名
  prefecture: 長野県
  homonyms: []
  summary: 長野県下伊那郡の村。1875年（明治8年）1月23日に17村が合併して発足し、1889年（明治22年）の町村制施行後も区域のまま現在に至る。村名は漢詩の「泰山丘阜」の語に由来するとされ、「泰（やす）」は安らかさ、「阜（おか）」は丘を意味し、読みも意味に沿った「やすおか」である。中世の村域は南山郷・今田郷と呼ばれていた。
  first_attestation:
    era: 明治8年
    year_western: 1875
    document: null
