  naming_type: 中心地名の継承
  formation: 不明
  prefecture: 大阪府
  homonyms: []
  summary: 『日本後紀』に延暦23年（804年）の「熊取野」での桓武天皇の遊猟が記されると町公式が紹介する、古い地名を受け継ぐ町。中世には熊取荘が成立した。語源には神功皇后の熊鷲討伐の伝承と、「木の間通り」が転じたとする音韻変化説がある。
  first_attestation:
    era: 延暦23年
    year_western: 804
    document: 『日本後紀』
    note: 町公式「歴史」が、桓武天皇の「熊取野」での遊猟記事を「熊取」の公式資料での初出として紹介する（二次資料経由の確認のため、主張のレベルはE2に格下げ）
  claims:
  - text: 町公式「歴史」は、『日本後紀』に延暦23年（804年）10月、桓武天皇が「熊取野」で遊猟したことが記されるとし、これを「熊取」の公式資料での初出として紹介する
    kind: fact
    level: E2
    status: established
    sources:
    - x11-kumatori-history
  - text: 神功皇后が羽白熊鷲を討ち取った場所であることが「熊取」の由来と伝わる
    kind: legend
    level: E4
    status: established
    sources:
    - upg-s2-kumatori-historia
  - text: 郷土随筆『かりそめのひとりごと』は、喬木の枝がはびこり木の下を通る道を「木の間通り（このまどおり）」と言い、それが略されて「コマトリ」となり、さらに誤って「クマトリ」になったという語源説を記す
    kind: fact
    level: E4
    status: contested
    sources:
    - x11-kumatori-kentei
  - text: 中世には熊取荘という荘園が成立し、「熊取」の名は荘園名としても用いられた
    kind: fact
    level: E2
    status: established
    sources:
    - x11-kumatori-history
    - upg-s2-kumatori-kotobank
  - text: 江戸時代、この一帯は「熊取谷」と呼ばれ、久保・小谷・小垣内・七山・野田・五門・紺屋・大久保の8村がいずれも岸和田藩領で、民政を担う「七人庄屋」のうち2人を熊取谷の中家・降井家が占めた
    kind: fact
    level: E4
    status: established
    sources:
    - x11-kumatori-kentei
  - text: 1889年（明治22年）4月1日に日根郡の8村が合併して熊取村が発足し、1951年（昭和26年）11月3日に町制を施行して熊取町となった
    kind: fact
    level: E3
    status: established
    sources:
    - x11-kumatori-history
    - upg-s2-kumatori-kotobank
  - text: 大阪府内の町村の中で最も人口の多い町である
    kind: fact
    level: E2
    status: established
    sources:
    - upg-s2-kumatori-chisou
  - text: 地方公共団体コードは273619である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 熊を取ったのか、木の間を通ったのか
    text: 「くまとり」の由来譚は対照的な二つがあります。一つは神功皇后が羽白熊鷲を討ち取ったという勇ましい伝承。もう一つは、木の枝が覆う道「木の間通り（このまどおり）」が「コマトリ」「クマトリ」と転じたという、郷土随筆『かりそめのひとりごと』の音の変化説です。確かな最古の層は804年の『日本後紀』の「熊取野」で、どちらの説もその用例より後の時代の説明づけということになります。
    sources:
    - x11-kumatori-history
    - x11-kumatori-kentei
    - x11-kumatori-wiki
  relations:
  - pref/27
  unknowns:
  - 「熊取」の語源は諸説あり確定していない（最古の用例は804年の「熊取野」）
  - 熊取荘の成立時期と領主の詳細は未確認
  updated: '2026-11-13'
- id: muni/27-田尻町
  code: '273627'
  names:
    ja: 田尻町
    reading: たじりちょう
    aliases:
    - 田尻村
  user_terms:
  - 田尻という名前の由来
  - 吉祥の地の町
  - 関西空港に近い町
  naming_type: 合成地名
  formation: 合併新設
  prefecture: 大阪府
  homonyms: []
  summary: 1889年（明治22年）に吉見村と嘉祥寺村が合併して生まれた田尻村を前身とする町。「田尻」は合併2村のどちらにもない新名で、その命名理由を示す公的記録は確認できていない。町は両地区から一字ずつ取った「吉祥の地」を地域の愛称にしている。
  first_attestation:
    era: 明治22年
    year_western: 1889
    document: 吉見村・嘉祥寺村の合併による田尻村の発足
    note: 「田尻」という名の初出はこの命名そのもの（合併2村のどちらにもない新名）
  claims:
  - text: 1889年（明治22年）に日根郡の吉見村と嘉祥寺村が合併して田尻村が誕生した。「田尻」は合併した2村のどちらにもない新名である
    kind: fact
    level: E2
    status: established
    sources:
    - x11-tajiri-kissho
  - text: 1953年（昭和28年）に町制を施行して田尻町となった
    kind: fact
    level: E4
    status: established
    sources:
    - x11-tajiri-kanko
  - text: 「田尻」は全国に分布する地形地名で、「田の末端・水の落ち口」を意味するとされる。ただし田尻村の命名が河川名などに由来するかどうかを示す記録は確認できていない
    kind: fact
    level: E5
    status: indeterminate
    sources:
    - x11-tajiri-namedic
  - text: 町は吉見地区の「吉」と嘉祥寺地区の「祥」を合わせ、この一帯を「吉祥の地」と名づけて地域づくりに用いている
    kind: fact
    level: E2
    status: established
    sources:
    - x11-tajiri-kissho
  - text: 宮城県の大崎市（旧・田尻町）とは、旧町名が同じだった縁で友好都市の関係にある
    kind: fact
    level: E2
    status: established
    sources:
    - upg-s2-osaki-tokei
  - text: 地方公共団体コードは273627である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 吉と祥で「吉祥の地」
    text: 田尻町は、合併した二つの地区の名から一字ずつをもらっています。吉見の「吉」と嘉祥寺の「祥」で「吉祥」。町はこの接点を「吉祥の地」と名づけ、地域の看板にしています。肝心の町名「田尻」自体の命名理由は記録が見つからない一方で、旧村名どうしを組み合わせた愛称の方がよく知られている、という逆転が面白いところです。なお宮城県の大崎市（旧・田尻町）とは旧町名同士の縁で友好都市になっています。
    sources:
    - x11-tajiri-kissho
    - x11-tajiri-wiki
  relations:
  - pref/27
  unknowns:
  - 「田尻」の命名理由（河川名由来説を含む）は公的資料で未確認
  - 吉見村・嘉祥寺村それぞれの地名の由来は未確認
  updated: '2026-11-13'
- id: muni/27-箕面市
  code: '272205'
  names:
    ja: 箕面市
    reading: みのおし
    aliases:
    - 蓑尾山
    - 箕尾山
    - 箕面山
  user_terms:
  - 箕面の名前の由来
  - 箕面の滝と地名の関係
  - みのお の読み方
  - 箕面市はいつできたの
  naming_type: 自然地名から
  formation: 合併新設
  prefecture: 大阪府
  homonyms: []
  summary: 箕面は箕面大滝で知られる山あいの地名で、その名は『扶桑略記』応和2年（962年）に「蓑尾山」と見えるのが初見とされ、大滝の姿が農具の「箕」に似ることに由来すると考えられている。1889年に箕面村など4村が発足し、1948年に箕面町、1956年12月1日に豊川村と合併して箕面市が誕生した。
  first_attestation:
    era: 平安時代
    year_western: 962
    document: 扶桑略記
    note: 『日本歴史地名大系』によれば、応和2年（962）四月条の「千観内供於摂州蓑尾山観音院」が初見。山名としての用例の初出
  claims:
  - text: 『日本歴史地名大系』によれば、箕面山と箕面滝が地名の起源で、初見は『扶桑略記』応和2年（962）四月条に「千観内供於摂州蓑尾山観音院」とある用例である（地方公共団体コードは272205）
    kind: fact
    level: E3
    status: established
    sources:
    - upg-s10-minoh-kotobank
    - b-cap-chiba-soumu-code
  - text: 大阪府営箕面公園の公式案内は、流れ落ちる滝の姿が農具の「箕」に似ていることから箕面大滝と呼ばれるようになり、地名の由来もここから来ていると言われると説明する
    kind: fact
    level: E2
    status: established
    sources:
    - upg-s10-minoh-park
  - text: 箕面寺（現在の瀧安寺）は、白雉元年（650年）に修験道の開祖とされる役行者によって開基されたと伝えられる
    kind: legend
    level: E2
    status: established
    sources:
    - l4-minoh-city-onko
  - text: 平安時代後期には、箕面の山中の聖の住処は歌謡集『梁塵秘抄』に歌われるほど全国的に知られていたと箕面市は紹介する
    kind: fact
    level: E2
    status: established
    sources:
    - l4-minoh-city-profile
  - text: 1889年（明治22年）の町村制施行により、箕面・萱野・止々呂美・豊川の4村が発足した
    kind: fact
    level: E2
    status: established
    sources:
    - l4-minoh-city-water
    - l4-minoh-city-onko
  - text: 1948年（昭和23年）に箕面村が町制を施行して箕面町となり萱野村・止々呂美村を合併し、1956年（昭和31年）12月1日に豊川村と合併して市制を施行し、大阪府内24番目の市となった
    kind: fact
    level: E2
    status: established
    sources:
    - l4-minoh-city-water
    - l4-minoh-city-onko
  - text: 1910年（明治43年）に箕面有馬電気軌道（現在の阪急箕面線）が開通したことが、箕面が観光地として発展する契機となったと箕面市の事業沿革は述べる
    kind: fact
    level: E2
    status: established
    sources:
    - l4-minoh-city-water
  column:
    title: 修験の山、歌に詠まれた箕面
    text: 箕面の滝のほとりは、古くから修験道の行場だった。箕面寺（瀧安寺）は役行者の開基と伝えられ、平安時代後期には山にこもる聖たちの住処として『梁塵秘抄』にも歌われたという。「箕面」の名が山と滝の名として文献に現れるのはちょうどその頃で、地名はまず信仰と景勝の名として広がっていった。紅葉の名所という現代の箕面の顔は、この古い霊場の延長線上にある。
    sources:
    - l4-minoh-city-profile
    - l4-minoh-city-onko
  relations:
  - pref/27
  unknowns:
  - 「水の尾（ミノヲ）」すなわち滝水そのものを表した名とする説は語源由来辞典の紹介にとどまり、公的・専門資料では確認できなかった
  - 語源由来辞典の挙げる「箕尾山」「箕面山」の用例の原典は特定できていない（『日本歴史地名大系』の示す初見は『扶桑略記』の「蓑尾山」で字が異なる）
  updated: '2026-11-13'
- id: muni/27-羽曳野市
  code: '272221'
  names:
    ja: 羽曳野市
    reading: はびきのし
    aliases:
    - 南大阪町
    - 羽曳原
    - 羽曳山
  user_terms:
  - 羽曳野という地名の由来
  - はびきの
  - 白鳥伝説の地
  - 古市古墳群・応神天皇陵のある市
  naming_type: 旧国名・広域地名の採用
  naming_note: 市制施行に際して日本武尊の白鳥伝説にちなむ古地名「羽曳野」を採用
  formation: 改称
  prefecture: 大阪府
  homonyms: []
  summary: 「羽曳野」は、日本武尊の白鳥伝説にちなむとされる古い広域地名である。『日本歴史地名大系』によれば、『日本書紀』は白鳥と化した日本武尊が河内の古市に降り立ったと記すにとどまるが、神社の縁起では白鳥が埴生の丘を羽を曳くがごとく西へ飛んだため、その丘を「羽曳野」と呼ぶようになったという。地名として文献で確認できるのは江戸時代中期の文書に見える「羽曳原」が古い。昭和34年（1959年）、南大阪町が市制を施行する際にこの古名を市名として採用した。
  first_attestation:
    era: 江戸時代中期
    year_western: null
    document: 埴生野新田関係文書（西山家文書）
    note: 『日本歴史地名大系』によれば「羽曳原」と見える。伝説の舞台は『日本書紀』景行天皇40年条の河内国古市だが、「羽曳野」の地名自体の形成時期は不明とされる
  claims:
  - text: 『日本歴史地名大系』は、羽曳野の名は日本武尊の白鳥伝説にちなむと説明している
    kind: fact
    level: E3
    status: established
    sources:
    - p3-habikino-kotobank
  - text: 『日本書紀』景行天皇40年条は、伊勢の能褒野陵に葬られた日本武尊が白鳥と化して大和・河内に飛び、降り立った大和の琴弾原と河内の古市に陵墓が造営されたと記し、書紀では白鳥はここで天に上るとされる一方、「羽曳野」と呼ぶようになった経緯は神社の縁起によって伝えられていると『日本歴史地名大系』は説明している
    kind: fact
    level: E3
    status: established
    sources:
    - p3-habikino-kotobank
  - text: 白鳥神社と堺市の大鳥神社の縁起によれば、白鳥は古市からさらに埴生の丘を羽を曳くがごとく西に飛び、和泉大鳥の地にとどまってやがて天高く飛び消え去ったため、古市西方の埴生の丘を「羽曳野」あるいは「羽曳山」と呼ぶようになったという
    kind: legend
    level: E3
    status: indeterminate
    sources:
    - p3-habikino-kotobank
  - text: 羽曳野市の白鳥神社は、「羽曳野」という地名は、白鳥に姿を変えた日本武尊が羽を曳くように天に昇ったという『日本書紀』のエピソードに由来すると説明している
    kind: legend
    level: E4
    status: indeterminate
    sources:
    - p3-habikino-shiratori
  - text: この白鳥にちなむ地名伝承の形成された時期は不明であるが、江戸時代中期の埴生野新田関係文書（西山家文書）の中に「羽曳原」と見えると『日本歴史地名大系』は記している
    kind: fact
    level: E3
    status: established
    sources:
    - p3-habikino-kotobank
  - text: 羽曳野市公式「羽曳野市略史」によれば、昭和31年（1956年）9月に古市・高鷲・丹比・埴生・西浦・駒ヶ谷の2町4村が合併して南大阪町が誕生した
    kind: fact
    level: E2
    status: established
    sources:
    - p3-habikino-ryakushi
  - text: 昭和34年（1959年）1月15日に南大阪町は市制を施行し、名称を羽曳野市としたと羽曳野市公式「羽曳野市略史」は記している
    kind: fact
    level: E2
    status: established
    sources:
    - p3-habikino-ryakushi
  - text: 市域には、墳丘長425mで我が国第2位の規模を誇る応神天皇陵古墳をはじめとする古市古墳群の古墳が多数現存すると羽曳野市の景観計画は記している
    kind: fact
    level: E2
    status: established
    sources:
    - p3-habikino-keikan
  - text: 羽曳野市の地方公共団体コードは272221である
    kind: fact
    level: E2
    status: established
    sources:
    - d-cap-jlis-osaka
  column:
    title: 白鳥が羽を曳いた丘
    text: ヤマトタケルの白鳥伝説には、三重の能褒野、奈良の琴弾原、そして河内の古市という3つの聖地があります。『日本書紀』では、白鳥は古市に降り立ち、そこで天に上って物語は終わります。しかし地元の神社の縁起では、物語には続きがありました。白鳥は古市を発つと、西の埴生の丘の上を、羽を曳くように低く飛んでいった——その姿が「羽曳野」の名になったというのです。1959年に市となったとき、街は「南大阪」という実務的な名を捨て、千年以上語り継がれたこの物語の名前を選びました。
    sources:
    - p3-habikino-kotobank
    - p3-habikino-shiratori
  relations:
  - pref/27
  - muni/27-松原市
  - muni/27-富田林市
  unknowns:
  - 市制施行時に「南大阪町」から「羽曳野市」へ改称した理由や選定過程を説明する市公式の一次資料は確認できなかった（古名の採用とみられるが経緯は未確認）
  - 「羽曳野」の地名が江戸時代中期の「羽曳原」より古い文献に現れる例は確認できなかった
  updated: '2026-11-13'
- id: muni/27-能勢町
  code: '273228'
  names:
    ja: 能勢町
    reading: のせちょう
    aliases:
    - 能勢郡
    - 能勢郷
  user_terms:
  - 能勢という名前の由来
  - 大阪府最北端の町
  - おおさかのてっぺん
  naming_type: 中心地名の継承
  formation: 編入合併
  prefecture: 大阪府
  homonyms: []
  summary: 713年（和銅6年）に置かれた能勢郡以来の古い地名を受け継ぐ町。1956年（昭和31年）に西能勢村・歌垣村・田尻村が合併し町制を施行して能勢町が発足した。「能勢」の語源そのものは確定していない。
  first_attestation:
    era: 和銅6年
    year_western: 713
    document: 摂津国河辺郡からの分立による能勢郡の設置
    note: 郡名「能勢」の初出とされる年。原典は未読のため、主張は二次資料経由として扱う
  claims:
  - text: 能勢郡は和銅6年（713年）に摂津国河辺郡から分けて置かれたとされる
    kind: fact
    level: E3
    status: established
    sources:
    - upg-s2-toyonogun-kotobank
  - text: 『日本歴史地名大系』は、『和名類聚抄』に能勢郡の郷として枳根郷・能勢郷・雄村郷が見えることを紹介する（原典は未読）
    kind: fact
    level: E3
    status: established
    sources:
    - upg-s2-toyonogun-kotobank
  - text: 奈良時代に郡衙が設けられ、中世以降は多田源氏の流れをくむ能勢氏が江戸時代を通じて能勢を治めた
    kind: fact
    level: E2
    status: established
    sources:
    - x11-nose-ayumi
  - text: 1956年（昭和31年）9月30日に西能勢村・歌垣村・田尻村が合併し、町制を施行して能勢町が発足した。1959年（昭和34年）には東郷村を編入した
    kind: fact
    level: E2
    status: established
    sources:
    - upg-s2-nose-70th
    - x11-nose-wiki
  - text: 町名「能勢」は、合併した村々の属した旧郡名であり、さらに郷名にも見える古い地名の継承である
    kind: fact
    level: E3
    status: established
    sources:
    - upg-s2-toyonogun-kotobank
    - upg-s2-nose-70th
  - text: 「能勢」という地名の語源は確定しておらず、古くは「野瀬」とも書かれたとされるにとどまる
    kind: fact
    level: E3
    status: indeterminate
    sources:
    - upg-s2-nose-kotobank
  - text: 地方公共団体コードは273228である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 能勢町にあった「田尻村」
    text: 1956年に能勢町へ合併した村の一つに「田尻村」がありました。大阪府の南、泉南郡の田尻町（1889年に吉見村・嘉祥寺村の合併で生まれた新名）とは無関係の同名です。同じ大阪府の中に、北の山あいの「田尻」と南の海辺の「田尻」が併存していた時期があるわけで、同名地名は府県をまたがなくても生まれることが分かります。
    sources:
    - x11-nose-wiki
    - x11-tajiri-kissho
  relations:
  - pref/27
  unknowns:
  - 「能勢」の語源（「野瀬」表記との関係を含む）は未確認
  - 713年の郡設置についての原典確認は未実施（二次資料経由）
  updated: '2026-11-13'
- id: muni/27-茨木市
  code: '272116'
  names:
    ja: 茨木市
    reading: いばらきし
    aliases:
    - 茨木村
  user_terms:
  - 茨木の名前の由来
  - いばらき か いばらぎ か
  - 茨木市はいつできたの
  - 茨城県と関係あるの
  naming_type: 中心地名の継承
  formation: 合併新設
  prefecture: 大阪府
  homonyms: []
  summary: 茨木は摂津国島下郡の地名で、茨木市統計書は地名の由来は明らかでないとし、記録上の初見を『勝尾寺文書』正治2年（1200）の「島下郡中条茨木村」とする。語源には諸説があるが定説はない。中世・近世には茨木城の城下町、西国街道の宿場として栄え、1948年に茨木町・春日村・三島村・玉櫛村が合併して市制を施行した。
  first_attestation:
    era: 鎌倉時代
    year_western: 1200
    document: 勝尾寺文書
    note: 茨木市統計書によれば、正治2年（1200）の『勝尾寺文書』の中に「島下郡中条茨木村」という地名が記されているのが記録上の初見
  claims:
  - text: 茨木市統計書は、地名「いばらき」のいわれは明らかではないとし、記録上の初見は鎌倉時代の正治2年（1200）の『勝尾寺文書』にある「島下郡中条茨木村」であるとする（地方公共団体コードは272116）
    kind: fact
    level: E2
    status: established
    sources:
    - l4-ibaraki-city-tokei
    - b-cap-chiba-soumu-code
  - text: 『日本歴史地名大系』によれば、茨木は勝尾寺文書に蕀切・茨切、『陰徳太平記』に蕀木とも書かれることから、イバラの木の繁茂地であったことに由来するといわれる。また『日本霊異記』上巻に島下郡の「味木里」が見え、味木（ウマキ）がウマラキを経てイバラキに転訛したものとする説（『大日本地名辞書』）もあるが、味木里については諸説がある
    kind: fact
    level: E3
    status: contested
    sources:
    - upg-s10-ibaraki-kotobank
  - text: 茨木神社の由緒書には、大同2年（807年）に坂上田村麻呂が茨を切り開いて「荊切の里」を作ったときに天石門別神社が鎮座されたと伝えられ、同様の話は『茨木村誌』（明治12年）や『大阪府全志』（大正11年）にも記されると、同神社の公式サイトが紹介する
    kind: legend
    level: E2
    status: established
    sources:
    - upg-s10-ibaraki-jinja
  - text: 市の中心部には中川清秀が整備した茨木城があり、城下町が形成されたと茨木市統計書は述べる
    kind: fact
    level: E2
    status: established
    sources:
    - l4-ibaraki-city-tokei
  - text: 茨木は西国街道が東西に通り参勤交代にも利用された地で、「椿の本陣」が知られると茨木市統計書は紹介する
    kind: fact
    level: E2
    status: established
    sources:
    - l4-ibaraki-city-tokei-h25
  - text: 1948年（昭和23年）に茨木町・春日村・三島村・玉櫛村の1町3村が合併して市制を施行し、大阪府内13番目の市となった
    kind: fact
    level: E2
    status: established
    sources:
    - l4-ibaraki-city-keikaku
    - l4-ibaraki-kotobank
  - text: 市名の読みは「いばらき」で「いばらぎ」とは読まず、茨木市立中央図書館のレファレンス回答によれば、『コンサイス日本地名事典』『市町村名語源辞典』『日本歴史地名大系』（大阪府の地名）などの専門辞典はいずれも読みを「いばらき（イバラキシ）」とする
    kind: fact
    level: E2
    status: established
    sources:
    - upg-s10-ibaraki-ndl
  column:
    title: 西国街道の「椿の本陣」
    text: 茨木の町を東西に貫いた西国街道は、京都と西国を結ぶ大動脈で、参勤交代の大名行列も行き交った。その宿場の本陣として知られるのが「椿の本陣」である。茨木市統計書がわざわざ名を挙げるほどの存在で、城下町であると同時に街道の宿場町でもあった茨木の二つの顔を今に伝える。地名の由来が「明らかではない」と市が正直に認める一方で、町の歩みそのものは街道と城にくっきりと刻まれている。
    sources:
    - l4-ibaraki-city-tokei-h25
    - l4-ibaraki-city-tokei
  relations:
  - pref/27
  unknowns:
  - 語源の定説はなく、茨木市公式資料も「明らかではない」と明記している
  - 坂上田村麻呂の「荊切」伝承は茨木神社の由緒書に記されると同神社公式が紹介するが、由緒書そのものの直接確認は未了。また田村麻呂と当地の関係については、同神社公式も「何ら資料がなく明らかではない」としている
  updated: '2026-11-13'
- id: muni/27-藤井寺市
  code: '272264'
  names:
    ja: 藤井寺市
    reading: ふじいでらし
    aliases:
    - 美陵町
    - 藤井寺道明寺町
    - 藤井寺町
  user_terms:
  - ふじいでら
  - 葛井寺
  - 西国五番札所
  - 古市古墳群
  - 美陵町
  naming_type: 中心地名の継承
  formation: 合併新設
  prefecture: 大阪府
  homonyms: []
  summary: 藤井寺市は大阪府東南部、古市古墳群の一角にある市である。市名は千手観音で知られる名刹・葛井寺（藤井寺）に由来し、寺の名が村名・町名を経て市名になった。1959年の合併で一時「美陵町」と名乗ったが、1966年の市制施行の日に「藤井寺市」へ改称し、古くからの寺の名が自治体名として復活した経緯を持つ。
  first_attestation:
    era: 平安時代
    year_western: 1096
    document: 藤井安基による再建と改名の伝承（藤井寺市公式の歴史解説）
    note: 「藤井寺」の名の成立について市公式が紹介する伝承に基づく年次であり、同時代史料による確認ではない。「葛井（フジイ）」の層は721年の葛井連改称に遡ると市公式は述べる。
  claims:
  - text: 市名は名刹「葛井寺」（フジイデラ）に由来すると市公式が説明する。寺の名が村名・町名を経て市名になった事例である
    kind: fact
    level: E2
    status: established
    sources:
    - x2-fujiidera-rekishi
  - text: 市公式によれば、養老5年（721）に百済王族の子孫である白猪史が河内国恵我長野邑（当地の旧名）に土地を賜わり「葛井連（フジイノムラジ）」と改めて本拠とした
    kind: fact
    level: E2
    status: established
    sources:
    - x2-fujiidera-rekishi
  - text: 寺伝では、葛井寺は聖武天皇の勅願によって創建され、神亀2年（725）に行基を導師として国宝の千手観音の開眼供養が行われたと伝える
    kind: legend
    level: E2
    status: indeterminate
    sources:
    - x2-fujiidera-rekishi
  - text: 永長元年（1096）、大和国の藤井安基が荒廃した葛井寺を再建し、その苗字をとって「藤井寺」と村名を改めたと市公式が紹介する
    kind: fact
    level: E2
    status: contested
    sources:
    - x2-fujiidera-rekishi
  - text: 1896年に長野村が藤井寺村に改称し、1928年に町制して藤井寺町となり、1959年に道明寺町と合併して藤井寺道明寺町、翌年に公募により「美陵町」と改称した
    kind: fact
    level: E2
    status: established
    sources:
    - x2-fujiidera-rekishi
  - text: 1966年11月1日に市制を施行し、同日に市名を「藤井寺市」と改称した
    kind: fact
    level: E2
    status: established
    sources:
    - x2-fujiidera-rekishi
  - text: 市制にあたっての市名「藤井寺」はアンケート調査によって制定されたと郷土史資料が伝える
    kind: fact
    level: E4
    status: established
    sources:
    - x2-fujiidera-fudoki
  - text: 総務省の全国地方公共団体コードで、藤井寺市の団体コードは272264と定められている
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 6年だけ存在した「美陵町」
    text: 藤井寺市には、名乗った期間がわずか6年という幻の自治体名がある。1959年に藤井寺町と道明寺町が合併した際、いったん「藤井寺道明寺町」という長い名になったが、翌1960年に公募によって「美陵町」と改められた。古墳の「陵」を思わせる新しい名だったが、1966年の市制施行にあたってアンケート調査が行われ、選ばれたのは合併前の旧町名であり千年以上の歴史を持つ寺の名「藤井寺」だった。新しく作られた名よりも、地名として根づいた寺の名の方が住民に選ばれた珍しい経緯である。
    sources:
    - x2-fujiidera-rekishi
    - x2-fujiidera-fudoki
  relations:
  - pref/27
  unknowns:
  - 721年の葛井連改称を記す同時代史料の有無
  - 1096年の藤井安基による改名伝承の典拠となった史料
  - 1966年の市名アンケートの候補と集計結果の詳細
  updated: '2026-11-13'
- id: muni/27-豊中市
  code: '272035'
  names:
    ja: 豊中市
    reading: とよなかし
    aliases:
    - 豊中村
    - 豊中町
  user_terms:
  - とよなか
  - 文教都市
  naming_type: 方位・位置による命名
  formation: 合併新設
  prefecture: 大阪府
  homonyms: []
  summary: 市名は1889年に生まれた「豊中村」の継承である。豊島郡の新免・南轟木・山ノ上・桜塚・岡町の5か村が合併した際、郡の中央にあたることから「豊中」と名付けたと伝えられる。1927年に町制、1936年に近隣3村との合併を伴って市制を施行した。
  first_attestation:
    era: 明治22年
    year_western: 1889
    document: 豊中村の成立（町村制による5か村の合併）
    note: 地名「豊中」そのものの初出。もとの郡名「豊島」は『古事記』（712年）にまで遡るが、「豊中」は明治の合併で生まれた新しい地名である。
  claims:
  - text: 豊中市公式は、「豊中」の地名は明治22年（1889年）4月に摂津国豊島郡の新免村・南轟木村・山ノ上村・桜塚村・岡町村の5か村が合併して豊中村が置かれたときに生まれ、豊島郡の中央にあたることから名付けたと伝えられると説明している。
    kind: fact
    level: E2
    status: established
    sources:
    - k4-toyonaka-history
  - text: 豊中市公式は、豊島の名が文献に見えるのは和銅5年（712年）に撰上された『古事記』中巻からで、神護景雲3年（769年）には称徳天皇が豊島の人15人に姓を授けた記録が『続日本紀』に見えると紹介している。
    kind: fact
    level: E2
    status: established
    sources:
    - k4-toyonaka-history
  - text: 明治29年（1896年）4月に豊島郡と能勢郡が合併して豊能郡となったため、豊中村は豊能郡豊中村となった。
    kind: fact
    level: E2
    status: established
    sources:
    - k4-toyonaka-history
  - text: 昭和2年（1927年）に町制を施行して豊中町となり、昭和11年（1936年）に豊中町・麻田村・桜井谷村・熊野田村が合併して豊中市が発足した。
    kind: fact
    level: E2
    status: established
    sources:
    - k4-toyonaka-history
  - text: 昭和22年（1947年）には中豊島村・南豊島村・小曽根村を編入した。
    kind: fact
    level: E2
    status: established
    sources:
    - k4-toyonaka-history
  - text: 豊中市の地方公共団体コードは272035である。
    kind: fact
    level: E2
    status: established
    sources:
    - d-cap-jlis-osaka
  column:
    title: 市章の中に隠れた「豊中」の文字
    text: 1939年に公募で制定された豊中市の市章は、一見すると幾何学模様だが、実は文字遊びになっている。豊中（トヨナカ）の頭文字「ト」を4個組み合わせて「トヨ（豊）」ともじり、全体の形を「中」と見立てて「豊中」と読ませるのだという。地名の由来が「郡の真ん中」という位置の説明だったまちは、その名前を図案の中にもう一度「真ん中」の字で閉じ込めたことになる。
    sources:
    - k4-toyonaka-youran
    - k4-toyonaka-history
  relations:
  - pref/27
  unknowns:
  - 「豊島郡の中央にあたることから名付けた」という命名理由は、市公式が「伝えられています」とする伝承レベルの説明であり、命名当時の公文書での裏付けは確認できなかった。
  updated: '2026-11-13'
- id: muni/27-豊能町
  code: '273210'
  names:
    ja: 豊能町
    reading: とよのちょう
    aliases:
    - 東能勢村
  user_terms:
  - 豊能という名前の由来
  - 東能勢村から改称した町
  - 能勢との違い
  naming_type: 新規命名
  formation: 合併新設
  prefecture: 大阪府
  homonyms: []
  summary: 1977年（昭和52年）に東能勢村が改称・町制施行して生まれた町。新町名は公募で選ばれ、最終候補の「阪北町」を退けて郡名「豊能郡」に由来する「豊能町」が採用された。隣接する能勢町（旧・能勢郡の名の継承）とは名の成立経路が異なる。
  first_attestation:
    era: 昭和52年
    year_western: 1977
    document: 東能勢村の改称・町制施行による豊能町の発足（1977年4月1日）
    note: 町名としての初出はこの改称そのもの。もとになった郡名「豊能」は1896年の豊能郡成立に遡る
  claims:
  - text: 1977年（昭和52年）4月1日に東能勢村が改称し町制を施行して、豊能町が発足した
    kind: fact
    level: E2
    status: established
    sources:
    - x11-toyono-estat
  - text: 新町名は公募され、応募者362名・候補91種類から「阪北町」と「豊能町」の2案に絞られたうえで、町の将来の発展等を考慮して「豊能町」が選ばれた
    kind: fact
    level: E4
    status: established
    sources:
    - x11-toyono-guide
  - text: もとになった「豊能」は郡名で、豊能郡は1896年（明治29年）4月1日に豊島郡と能勢郡が合併して成立し、郡名は両郡の頭文字を組み合わせたものである
    kind: fact
    level: E3
    status: established
    sources:
    - upg-s2-toyonogun-kotobank
    - x11-toyonogun-wiki
  - text: 前身の東能勢村は1889年（明治22年）に東部の5村の合併で成立し、1956年（昭和31年）9月30日に吉川村と合体合併して新しい東能勢村となった
    kind: fact
    level: E2
    status: established
    sources:
    - upg-s2-toyono-about
    - x11-toyono-wiki
  - text: 豊能町は能勢町とともに豊能郡を構成するが、町名の直接の由来は郡名「豊能」であり、旧能勢郡の名をそのまま継承した能勢町とは成立の経路が異なる（異なる層）
    kind: fact
    level: E4
    status: established
    sources:
    - upg-s2-toyonogun-kotobank
    - x11-toyono-guide
    - x11-toyono-estat
  - text: 公募の最終候補には、位置を示す名と解される「阪北町」も残っていた
    kind: fact
    level: E4
    status: established
    sources:
    - x11-toyono-guide
  - text: 地方公共団体コードは273210である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: あと一歩だった「阪北町」
    text: 1977年の町制施行にあたって、豊能町の名は公募で決まりました。362人の応募、91種類の候補から最後に残ったのは「豊能町」と「阪北町」の二つ。「阪北」は大阪の北という位置をそのまま名にする案で、採用されていれば町の名はまったく違う顔になっていました。選ばれたのは郡名を受け継ぐ「豊能」。88年前にできた郡の名が、村の改称を通じて町の名に生まれ変わった例です。
    sources:
    - x11-toyono-guide
  relations:
  - pref/27
  - muni/27-能勢町
  unknowns:
  - 公募で「豊能町」を提案した応募者が郡名を意識していたかどうかは未確認
  - 「東能勢」の名が1889年の村名として成立した経緯の詳細は未確認
  updated: '2026-11-13'
- id: muni/27-貝塚市
  code: '272086'
  names:
    ja: 貝塚市
    reading: かいづかし
    aliases:
    - 海塚
    - 貝塚町
  user_terms:
  - かいづか
  - 海塚
  - 願泉寺
  - 寺内町
  - つげ櫛
  naming_type: 中心地名の継承
  formation: 不明
  prefecture: 大阪府
  homonyms: []
  summary: 貝塚市は大阪府南部、大阪湾に面した市で、願泉寺を中心とする一向宗の寺内町として発展した。地名は元々「海塚」と書かれ、16世紀後半に寺内町がつくられた頃には「貝塚」の字が古文書に見えるようになっていたと市公式が述べる。ただし市公式自身が「市名のいわれに関する確証ある説は今のところありません」と明言しており、貝塚遺跡に由来する説も、市域に貝塚を伴う遺跡が確認できないため証明されていない。
  first_attestation:
    era: 室町時代
    year_western: 1431
    document: 近木庄高野御段銭田数散用状（高野山文書）
    note: 『日本歴史地名大系』によれば、永享3年（1431）の近木庄高野御段銭田数散用状（高野山文書）に「海塚」と記されたのが文献上の初出。当時の表記は「海塚」だったと市公式も述べる。
  claims:
  - text: 市公式は「市名のいわれに関する確証ある説は今のところありません」と明言しており、「貝塚」の語源に定説はない
    kind: fact
    level: E2
    status: indeterminate
    sources:
    - x2-kaizuka-iware
  - text: 市公式によれば、地名としての貝塚は元々「海塚」（かいづか）の字が使われていたが、16世紀後半に一向宗の自治都市である寺内町がつくられた時には「貝塚」の字が使われていたことが古文書からうかがえる
    kind: fact
    level: E2
    status: established
    sources:
    - x2-kaizuka-iware
  - text: 市公式の歴史年表によれば、1431年に「かいつか」の名が初めて記録にあらわれた
    kind: fact
    level: E2
    status: established
    sources:
    - x2-kaizuka-nenpyo
  - text: 貝塚という地名の起源について、『日本歴史地名大系』は、全国の他の同名の場所と同様に考古学的な貝塚と考えられ、遺跡は現存しないものの、かつてあったものが水没したものと推定されると述べる（貝塚市史による）。これに対し市公式は、市域に貝塚を伴う遺跡が発見されていないとして、貝塚遺跡に由来する説は証明できないとする立場であり、見解は分かれている
    kind: fact
    level: E3
    status: contested
    sources:
    - upg-s5-kaizuka-kotobank
    - x2-kaizuka-iware
  - text: 天正11年（1583）から同13年まで本願寺第11代顕如らがこの地に移住して本願寺が置かれ、のちに願泉寺と卜半家を中心とする寺内町が明治初めまで続いた
    kind: fact
    level: E2
    status: established
    sources:
    - x2-kaizuka-gansenji
  - text: 1889年（明治22年）に、市域には南郡の貝塚町・麻生郷村・島村・北近義村・南近義村と日根郡の木島村・西葛城村の7町村が成立した。1931年（昭和6年）にこのうち5町村（貝塚町・麻生郷村・島村・北近義村・南近義村）が合併して貝塚町となり、1935年に木島村、1939年に西葛城村を編入した
    kind: fact
    level: E2
    status: established
    sources:
    - x2-kaizuka-nenpyo
    - upg-s5-kaizuka-temps
  - text: 1943年5月1日に市制を施行して貝塚市となり、大阪府下で10番目の市となったと市公式が述べる
    kind: fact
    level: E2
    status: established
    sources:
    - x2-kaizuka-iware
  - text: 市章は貝塚町にあった名松「姫松」にちなむ松葉5本が結び合わされた意匠で、合併した5か町村の固い契りを願ったものと市公式が説明する
    kind: fact
    level: E2
    status: established
    sources:
    - x2-kaizuka-iware
  - text: 総務省の全国地方公共団体コードで、貝塚市の団体コードは272086と定められている
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 貝塚なのに、貝塚遺跡がない
    text: 「貝塚市」という名からは、縄文時代の貝塚遺跡が見つかった土地を想像しがちだが、実際は逆である。市の公式ページは語源について「確証ある説は今のところありません」と正直に記し、地名の元々の字は海の「海」を使う「海塚」だったと説明する。「貝塚」の字が表に出てくるのは16世紀後半、願泉寺を中心とする寺内町ができた頃の古文書からだという。しかも寺内町の外側の旧村は、今も「海塚」と書いて「うみづか」と呼ばれている。同じ読みに二つの字が併存し、貝の字を冠した市の側にも遺跡の裏付けがない。「貝塚」は、由来が未解決であること自体が市の公式見解になっている珍しい地名なのである。
    sources:
    - x2-kaizuka-iware
    - x2-kaizuka-wikipedia
  relations:
  - pref/27
  unknowns:
  - 「海塚」から「貝塚」へ表記が移った正確な時期と理由
  - 願泉寺の寺号や寺内町の形成と地名表記の関係
  updated: '2026-11-13'
- id: muni/27-門真市
  code: '272230'
  names:
    ja: 門真市
    reading: かどまし
    aliases:
    - 普賢寺荘
    - 門真荘
  user_terms:
  - 門真の名前の由来
  - かどま の意味
  - 門真市はいつできたの
  - パナソニックの門真
  naming_type: 中心地名の継承
  naming_note: 門真町の単独市制施行
  formation: 単独発足
  prefecture: 大阪府
  homonyms: []
  summary: 門真は河内平野の低湿地に開けた地名で、室町時代初期までは「普賢寺庄」と呼ばれ、室町時代末期から「門真」の名が使われ始めたとされる。「かどま」の意味には「門間」とする説と「潟沼」から転じたとする説がある。1939年に門真町となり、1956年に大和田村・四宮村・二島村を編入、1963年8月1日に市制を施行した。
  first_attestation:
    era: 室町時代
    year_western: null
    document: 門真荘関係の史料
    note: 門真市史料室の研究によれば、室町時代初期までは「普賢寺庄」と呼ばれ、室町時代末期から「門真」の地名が使われ始めた。戦国時代には「門真荘」の名も見える
  claims:
  - text: 門真市史料室の研究によれば、室町時代初期までこの一帯は「普賢寺庄」と呼ばれており、室町時代末期から「門真」の地名が使われ始めた（地方公共団体コードは272230）
    kind: fact
    level: E4
    status: established
    sources:
    - l4-kadoma-shishitsu
    - b-cap-chiba-soumu-code
  - text: 「かどま」の意味については、「門間」で、低湿地などで生産性の低い荘園が領主から免田として認められたことから来た名前とする説明を、同研究は吉田茂樹『日本地名事典』を引いて紹介する
    kind: fact
    level: E4
    status: contested
    sources:
    - l4-kadoma-shishitsu
  - text: 「潟沼（かたぬま）」から転じたとする説もあり、「門真」の語源は一つに定まっていない
    kind: fact
    level: E5
    status: contested
    sources:
    - l4-kadoma-wikipedia
  - text: 門真市の公式の歴史ページは、『古事記』『日本書紀』に、仁徳天皇が低湿地帯だったこの地方を淀川の氾濫から守るため、渡来人に「茨田堤」を築かせたと記されていることを紹介する
    kind: fact
    level: E2
    status: established
    sources:
    - l4-kadoma-city-rekishi
  - text: 江戸時代末期の現在の門真市域には、門真一番上・門真一番下・門真二番・門真三番・門真四番など19の村があり、1889年（明治22年）に門真村・大和田村・四宮村・二島村の4村にまとめられた
    kind: fact
    level: E4
    status: established
    sources:
    - l4-kadoma-shishitsu
  - text: 門真村は1939年（昭和14年）に町制を施行して門真町となり、1956年（昭和31年）9月30日に大和田村・四宮村・二島村を編入し、1963年（昭和38年）8月1日に市制を施行した
    kind: fact
    level: E2
    status: established
    sources:
    - l4-kadoma-city-tokei
  - text: 門真はもともと河内屈指の穀倉地帯で、河内蓮根が特産物として知られる農村地帯だったと門真市の市勢要覧は述べる
    kind: fact
    level: E2
    status: established
    sources:
    - l4-kadoma-city-shiori
  column:
    title: 番号で呼ばれた村々――門真一番上から四番まで
    text: 江戸時代末期、今の門真市域には19の村があった。そのうち中心部の村の名前が面白い。門真一番上、門真一番下、門真二番、門真三番、門真四番――まるで背番号のように「門真」に番号が振られていたのである。低湿地を開きながら集落が枝分かれしていった歴史が、この素っ気ない名前に刻まれている。1889年の町村制でこれらは門真村など4村に統合され、番号の村名は地図から消えた。
    sources:
    - l4-kadoma-shishitsu
  relations:
  - pref/27
  unknowns:
  - 「門間」説と「潟沼」説のいずれが正しいかは決められず、語源は未確定
  - 「門真」の初出とされる室町時代末期の具体的な文書の特定は未了
  updated: '2026-11-13'
- id: muni/27-阪南市
  code: '272329'
  names:
    ja: 阪南市
    reading: はんなんし
    aliases:
    - 阪南町
    - 南海町
  user_terms:
  - はんなん
  - 阪南町
  - 大阪の南
  - 尾崎
  - 箱作
  naming_type: 方位・位置による命名
  formation: 合併新設
  prefecture: 大阪府
  homonyms: []
  summary: 阪南市は大阪府の南端に位置する市である。「阪南」の名は古い地名ではなく、1956年に発足した南海町が1972年に東鳥取町と合併する際、「大阪の南」を意味する地域名を採用して生まれた昭和の新名である。1991年に市制を施行して阪南市となった。古代には和泉国日根郡鳥取郷に属し、『土佐日記』に詠まれた「箱の浦」の海岸を持つ。
  first_attestation:
    era: 昭和
    year_western: 1972
    document: 阪南町の発足（南海町と東鳥取町の合併）
    note: 自治体名としての「阪南」の成立年。大阪南部を指す略称としての「阪南」の使用はこれ以前に遡る可能性があるが、その初出は確認していない。
  claims:
  - text: 1956年9月30日、泉南郡尾崎町・西鳥取村・下荘村が合併して南海町が発足した
    kind: fact
    level: E2
    status: established
    sources:
    - x2-hannan-keikaku
    - x2-hannan-oitachi
    - upg-s5-hannan-nankai-geoshape
  - text: 市の総合計画も、1956年に東鳥取村を除く3町村が合併して南海町が成立した経緯を記している
    kind: fact
    level: E2
    status: established
    sources:
    - x2-hannan-keikaku
  - text: 1972年10月20日、南海町と東鳥取町が合併して阪南町が発足し、「阪南」の名が自治体名として生まれた
    kind: fact
    level: E2
    status: established
    sources:
    - upg-s5-hannan-cho-geoshape
    - x2-hannan-oitachi
  - text: 「阪南」は大阪府あるいは大阪市の南部（南大阪）を表す略称として使われてきた語であり、合併新町名はこの地域名称を採用したものとみられるが、選定の経緯を示す公式記録は確認できていない
    kind: fact
    level: E5
    status: indeterminate
    sources:
    - x2-hannan-ryakusho
  - text: 1991年10月1日に市制を施行して阪南市となった
    kind: fact
    level: E2
    status: established
    sources:
    - x2-hannan-oitachi
    - upg-s5-hannan-shi-geoshape
  - text: 市域は奈良時代には律令制度のもと和泉国日根郡鳥取郷に含まれていたと市の公式解説が述べる
    kind: fact
    level: E2
    status: established
    sources:
    - x2-hannan-oitachi
  - text: 市公式によれば、紀貫之『土佐日記』には現在の箱作付近の海岸「箱の浦」を通過した様子が歌とともに記されている
    kind: fact
    level: E2
    status: established
    sources:
    - x2-hannan-oitachi
  - text: 総務省の全国地方公共団体コードで、阪南市の団体コードは272329と定められている
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 隣り合う「泉南」と「阪南」
    text: 大阪府の南端には「泉南市」と「阪南市」という、字面のよく似た二つの市が隣り合っている。どちらも「南」を含む昭和の新名だが、生まれ方は対照的である。泉南は1896年に置かれた「泉南郡」の郡名を、1956年の合併町が受け継いだ名で、1970年に市になった。一方の阪南は、1956年にできた南海町が1972年に東鳥取町と合併する際、それまでの町名のどれでもない地域名「阪南」を新しく採用した名で、市制は1991年と泉南より21年遅い。北隣の泉南市と混同されやすいが、片方は郡名の継承、片方は合併の新命名という違いがある。
    sources:
    - x2-hannan-wikipedia
    - x2-sennan-rekishi
  relations:
  - pref/27
  - muni/27-泉南市
  - muni/27-泉大津市
  unknowns:
  - 1972年の合併に際して町名「阪南」が選ばれた手続き（公募の有無、候補名）の公式記録
  - 略称としての「阪南」の使用開始時期と初出
  - 「大阪府下36番目の市」「大阪府で最も新しい市」という位置づけの公的資料での裏付け
  updated: '2026-11-13'
- id: muni/27-高槻市
  code: '272078'
  names:
    ja: 高槻市
    reading: たかつきし
    aliases:
    - 高月
    - 高槻庄
  user_terms:
  - たかつき
  - 京と大阪の中間
  - 高山右近の城下町
  naming_type: 中心地名の継承
  formation: 単独発足
  prefecture: 大阪府
  homonyms: []
  summary: 市名は中世以来の地名の継承で、そのおこりは「高月」である。高槻市公式資料は「高月」の名が鎌倉時代から南北朝時代にかけて史上に現れるとし、戦国期には「高槻庄」と記された。「高槻」への転化は、高い槻（ケヤキ）の木にまつわるという説が伝えられる。1943年に市制を施行した。
  first_attestation:
    era: 鎌倉時代
    year_western: null
    document: 史料名不詳（高槻市公式資料は「高月」の名が鎌倉時代から南北朝時代に史上に現れるとするが、具体的な書名を示していない）
    note: 「高槻」の形では戦国期の「高槻庄」が古い用例として語源由来辞典に紹介されている。
  claims:
  - text: 高槻市公式の郷土史資料は、高槻の地名のおこりは「高月」で、その名が史上に現れるのは鎌倉時代から南北朝時代であること、南北朝から戦国時代には芥川城や高槻城をめぐる攻防の地であったことを記している。
    kind: fact
    level: E2
    status: established
    sources:
    - k4-takatsuki-kyodo
  - text: 戦国期には「高槻庄」の名が見え、「高月」から「高槻」に転じたのは、高い槻の木（ケヤキの呼称）の近くに本陣が立てられたことからといわれる。
    kind: fact
    level: E4
    status: contested
    sources:
    - k4-takatsuki-gogen
  - text: もとの「高月」の由来については、高くなった所を表す「タカ」と「ツキ」を重ねた地形由来説のほか、安満庄の神社名に由来する説、神武東征の説話に軍の旗印の月を結びつける説など、諸説が並立している。
    kind: fact
    level: E4
    status: contested
    sources:
    - k4-takatsuki-gogen
  - text: 江戸時代には慶安年間に封じられた永井直清以来、高槻藩永井家の城下町として発展し、高槻城は明治7年（1874年）に破却された。
    kind: fact
    level: E2
    status: established
    sources:
    - k4-takatsuki-kyodo
  - text: 昭和18年（1943年）1月1日、大阪府下で9番目の市として高槻市が市制を施行した。
    kind: fact
    level: E2
    status: established
    sources:
    - k4-takatsuki-kyodo
  - text: 平成15年（2003年）4月1日、大阪府内で2番目の中核市へ移行した。
    kind: fact
    level: E2
    status: established
    sources:
    - k4-takatsuki-kyodo
  - text: 高槻市の地方公共団体コードは272078である。
    kind: fact
    level: E2
    status: established
    sources:
    - d-cap-jlis-osaka
  column:
    title: 市章が宣言する「京と大阪の真ん中」
    text: 高槻市の市章は、大阪市の市章と京都市の市章を組み合わせ、その形で高槻の「高」をかたどったものだと市は説明する。淀川を挟んで両都のちょうど中間に位置するこのまちは、古来、京と大坂を結ぶ交通の要衝だった。地名の由来には確かな決着がついていない一方で、市章のほうは「両都の真ん中」という自己認識をはっきりと図案に刻んでいる。
    sources:
    - k4-takatsuki-shisho
    - k4-takatsuki-kyodo
  relations:
  - pref/27
  unknowns:
  - 「高月」の初出の具体的な史料名・年は、市公式資料にも示されておらず未確認である。
  - 「高槻」表記が定着した時期と経緯は、槻の木にまつわる伝承的説明以外に確認できなかった。
  updated: '2026-11-13'
- id: muni/27-高石市
  code: '272256'
  names:
    ja: 高石市
    reading: たかいしし
    aliases:
    - 高脚
    - 高石町
    - 高石村
  user_terms:
  - たかいし
  - 高師浜
  - 羽衣伝説
  - 天女のまち
  - 取石
  naming_type: 中心地名の継承
  formation: 単独発足
  prefecture: 大阪府
  homonyms: []
  summary: 高石市は大阪府南部、大阪湾に面した市である。地名は古代に遡り、『日本書紀』に「高石池」「高脚海」の記述が見られるとされ、「高脚」とも書かれた高石の地は『音に聞く高師浜』と和歌に詠われた白砂青松の名勝だった。ただし「高石」という語そのものの語源は、確認した公的資料では確定していない。村名・町名を継承し、1966年に市制を施行した。
  first_attestation:
    era: 垂仁天皇35年
    year_western: null
    document: 日本書紀
    note: 『日本歴史地名大系』によれば、地名の初見は垂仁天皇35年9月条の高石池築造の記事で、五十瓊敷命を河内国に遣わして作らせたとある。「高脚海」は同書持統天皇3年（689年）8月条に見える。高石池の所在は明らかでないと同書は述べる。
  claims:
  - text: 『日本歴史地名大系』によれば、『高石』の地名の初見は『日本書紀』垂仁天皇35年9月条で、五十瓊敷命を河内国に遣わして高石池を作らせたとあり、同書持統天皇3年（689年）8月条には河内国大鳥郡の『高脚海』が見える
    kind: fact
    level: E3
    status: established
    sources:
    - upg-s5-takaishi-kotobank
    - upg-s5-takashinohama-kotobank
  - text: 市公式は、高石の地が古く「高脚」とも書かれ、「音に聞く高師浜」と詠われた白砂青松の美しい所として知られ、持統天皇の御代の禁断漁猟区域の指定でも基準の地とされたほどだったと紹介する
    kind: fact
    level: E2
    status: established
    sources:
    - x2-takaishi-oitachi
  - text: 「高石」という語そのものの語源については、確認した公的・専門資料で裏付けのある定説が得られておらず、未確定である
    kind: fact
    level: E5
    status: indeterminate
    sources:
    - x2-takaishi-wikipedia
  - text: 市公式によれば、王仁の一族とされる工芸技術家がこの地に来て住み、大工村（現在の高師浜の一部）の村民の多くは大工を家業とし、明治維新まで京都御所の内匠寮の支配下にあったという
    kind: legend
    level: E2
    status: indeterminate
    sources:
    - x2-takaishi-oitachi
  - text: 1889年（明治22年）に大鳥郡の高石南村・高石北村・今在家村・新村が合併して高石村が発足し、1915年（大正4年）1月に町制して高石町となった
    kind: fact
    level: E2
    status: established
    sources:
    - upg-s5-takaishi-kyodo
    - x2-takaishi-hensei
  - text: 1953年4月1日に取石村を編入合併し、1966年11月1日に市制を施行して高石市となった
    kind: fact
    level: E2
    status: established
    sources:
    - x2-takaishi-hensei
  - text: 1953年に編入した取石の地域には、『万葉集』巻10に「妹が手を取石の池の波の間ゆ鳥が音異に鳴く秋過ぎぬらし」と詠まれた取石池があり、『日本歴史地名大系』はこの池を取石の開発に不可欠な用水源だったとする
    kind: fact
    level: E3
    status: established
    sources:
    - upg-s5-torishi-kotobank
  - text: 市は「天女の住まう街 高石」を掲げ、羽衣の天女伝説を市の魅力として発信している
    kind: fact
    level: E2
    status: established
    sources:
    - x2-takaishi-50th
  - text: 総務省の全国地方公共団体コードで、高石市の団体コードは272256と定められている
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 天女の住まう街
    text: 高石市は「天女の住まう街 高石」というキャッチフレーズを掲げている。羽衣伝説――天女が水浴びの間に羽衣を松に掛けたところを漁師に隠され、天に帰れなくなったという物語――の舞台の一つとして、この地の浜と松原が語られてきたからである。かつて高師浜は「音に聞く高師浜」と古歌に詠われるほどの白砂青松の名勝で、羽衣を掛けるにふさわしい松の浜として伝説を受け止めてきた。市制50周年の記念誌もこの伝説を市の魅力の筆頭に置く。地名「高石」の語源そのものは未詳でも、浜と松と天女の物語が、この市のもう一つの「名の由来」として生きている。
    sources:
    - x2-takaishi-50th
    - x2-takaishi-oitachi
  relations:
  - pref/27
  unknowns:
  - 「高石」の語源の確定（高い石に由来する等の説の史料的裏付け）
  - 高石神社と地名「高石」の関係を示す史料
  - 取石の地名が取石池にちなむという説明の専門資料での裏付け（大系は池が地域の開発に不可欠な用水源だったと述べるが、命名の由来とは明記していない）
  updated: '2026-11-13'
