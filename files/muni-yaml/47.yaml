prefecture_code: '47'
records:
- id: muni/47-うるま市
  code: '472131'
  names:
    ja: うるま市
    reading: うるまし
    aliases:
    - 具志川市
    - 石川市
    - ウルマ
  user_terms:
  - うるま
  - サンゴの島という意味の市名
  - 具志川と石川が合併した市
  - 勝連城跡のある市
  naming_type: 新規命名
  prefecture: 沖縄県
  homonyms: []
  summary: 平成17年（2005年）4月1日、具志川市・石川市・勝連町・与那城町の2市2町が合併して発足した、沖縄本島中部・東海岸の市。市名の「うるま」は、サンゴの島を意味する沖縄の古い言葉で、沖縄そのものを指す美称として使われてきた語であり、合併に際して全国公募の中から選ばれた。合併した旧市町の名はいずれも近世の間切名に遡るが、その詳しい由来は市の資料でも不明とされている。
  first_attestation:
    era: 平成17年
    year_western: 2005
    document: 合併協議会による新市名の決定（うるま市発足）
    note: 市名としての初出は2005年の合併時。語としての「うるま」はそれ以前から琉球・沖縄を指す語として使われ、首里王府の史料では和歌の辞書『呉竹集』を引いて琉球の意と説明されることが市勢要覧で紹介されている（原典は未確認）
  claims:
  - text: うるま市の地方公共団体コードは472131である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  - text: うるま市は平成17年（2005年）4月1日、旧具志川市・旧石川市・旧勝連町・旧与那城町の2市2町が合併して誕生した
    kind: fact
    level: E2
    status: established
    sources:
    - s5-uruma-20th
  - text: 新市名は全国から募集した5,233件・2,457種類の中から名称検討委員会で12種類まで選考し、最終的に合併協議会で「うるま市」に決定されたもので、最終候補には「暁市」「若夏市」などもあった
    kind: fact
    level: E2
    status: established
    sources:
    - s5-uruma-yoran
  - text: 市名の由来について市は、「サンゴの島」のことを「ウルマ（ウル＝サンゴ、マ＝島）」と呼び、美しい景観の沖縄の島々を示す言葉でもあることから「うるま市」と名付けられたと説明している
    kind: fact
    level: E2
    status: established
    sources:
    - s5-uruma-20th
    - s5-uruma-gaiyo
  - text: 「うるま」という言葉は、日本で平安時代には言葉の通じない遠い地という意味で使われていたようで、琉球の別称とされるようになったのは室町時代以降といわれていることが、市の市勢要覧で紹介されている
    kind: fact
    level: E2
    status: established
    sources:
    - s5-uruma-yoran
  - text: 合併した旧市町の名（石川・具志川・勝連・与那城）は近世より続く間切や集落の名称として『おもろさうし』や首里王府等の史料より確認できるが、詳しい地名の由来は不明となっていると市の資料は述べている
    kind: fact
    level: E2
    status: established
    sources:
    - s5-uruma-gaiyo
  - text: 市域の勝連城跡は、平成12年（2000年）に「琉球王国のグスク及び関連遺産群」の一つとして世界遺産に登録された
    kind: fact
    level: E2
    status: established
    sources:
    - s5-uruma-20th
  column:
    title: 国会議事堂を飾る「ウルマ石」
    text: 市名と同じ「うるま」を名に持つ石がある。旧勝連町平敷屋で採れるトラバーチン（石灰華）で、1929年に国会議事堂の建築資材の調査で沖縄を訪れた工学博士がその優秀さを見出し、「ウルマ石」と名付けて国会議事堂の玄関に使われたことが市の市勢要覧に紹介されている。「サンゴの島」という意味の古い言葉が、合併市の名前になる75年も前に、東京の国会議事堂の石材の名前として先に全国へ出ていたことになる。サンゴ礁の島に育まれた石灰岩の石と、「ウルマ」という言葉の取り合わせは、この土地の成り立ちをよく表している。
    sources:
    - s5-uruma-yoran
  relations:
  - pref/47
  unknowns:
  - 「うるま」の語源（ウル＝サンゴ、マ＝島という分解）は市の説明によるもので、琉球語学の専門資料では確認できなかった
  - 公募の応募総数以外の選考過程（12候補の顔ぶれの全体）は協議会の一次資料では確認できなかった
  - 旧間切名（具志川・石川・勝連・与那城）それぞれの地名の由来は、市の資料でも不明とされている
  updated: '2026-11-13'
- id: muni/47-南城市
  code: '472158'
  names:
    ja: 南城市
    reading: なんじょうし
    aliases:
    - 佐敷町
    - 知念村
    - 玉城村
    - 大里村
  user_terms:
  - なんじょう
  - ハートのまち
  - 斎場御嶽のある市
  - 尚巴志のふるさと
  naming_type: 合併新設
  prefecture: 沖縄県
  homonyms: []
  summary: 平成18年（2006年）1月1日、島尻郡の佐敷町・知念村・玉城村・大里村の1町3村が合併して発足した、沖縄本島南部の市。市名は2005年3月に合併協議会で決定されたもので、「南」は沖縄本島南部という位置を、「城」は市内に数多く残るグスク（城）を表し、市の側も「名称の由来にもなっている『城＝グスク』」と説明している。市域は尚巴志の出身地・佐敷や世界遺産の斎場御嶽を擁し、琉球の歴史の層が厚い。
  first_attestation:
    era: 平成18年
    year_western: 2006
    document: 南城市の発足（市名の決定は2005年3月の合併協議会）
    note: 「南城」は合併に際して作られた市名であり、それ以前の地名としての初出はない。構成要素の旧町村名（佐敷・知念・玉城・大里）は近世の間切名に遡る
  claims:
  - text: 南城市の地方公共団体コードは472158である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  - text: 南城市は2006年1月1日に佐敷町、知念村、玉城村、大里村の旧4町村が合併して誕生した
    kind: fact
    level: E2
    status: established
    sources:
    - s5-nanjo-yoran
  - text: 新市名は2005年3月に「南城市」と決定され、合併協定書への調印が行われた
    kind: fact
    level: E2
    status: established
    sources:
    - s5-nanjo-history
  - text: 市名の「城」はグスクを指し、琉球を統一した尚巴志ゆかりの佐敷城跡・島添大里城跡をはじめ按司たちが拠った数々のグスクを擁することが「南城市の名称の由来にもなっている」と市は説明している
    kind: fact
    level: E2
    status: established
    sources:
    - s5-nanjo-gusuku
  - text: 南城市は沖縄本島南部の東海岸に位置し、県都那覇市から南東へ約12kmにあって中城湾と太平洋に面している
    kind: fact
    level: E2
    status: established
    sources:
    - s5-nanjo-history
  - text: 市域には世界遺産「琉球王国のグスク及び関連遺産群」の一つである斎場御嶽（旧知念村域）があり、琉球開闢神話の舞台とされる久高島が属している
    kind: fact
    level: E2
    status: established
    sources:
    - s5-nanjo-yoran
  - text: 現在の組み合わせに先立ち、佐敷町・知念村・玉城村・与那原町の協議会が2004年12月に新市名を「東方市」と決めたものの、市庁舎の位置で意見がまとまらず協議会が解散し、大里村を加えた新たな協議会で「南城市」に決まったことが紹介されている
    kind: fact
    level: E5
    status: established
    sources:
    - s5-nanjo-zhwiki
  column:
    title: 幻の市名「東方市」
    text: 南城市は、あと少しで全く違う名前になるところだった。2004年、佐敷町・知念村・玉城村・与那原町の4町村の合併協議会は、新しい市の名前を「東方市」と決めた。ところが新市庁舎をどこに置くかで意見が折り合わず、協議会は解散してしまう。その後、顔ぶれを大里村に入れ替えた新しい協議会が2005年3月に選んだ名前が「南城市」である。「東方」も「南城」も方角を含む名前だが、最終的に残ったのは、尚巴志ら按司のグスクが点在する土地にふさわしい「城」の一字を含む方だった。庁舎の場所ひとつで自治体の名前が変わるという、平成の大合併らしい舞台裏である。
    sources:
    - s5-nanjo-zhwiki
    - s5-nanjo-history
  relations:
  - pref/47
  unknowns:
  - 新市名の公募の有無や応募件数、最終候補の顔ぶれは協議会の一次資料では確認できなかった
  - 「南城」の「南」が本島南部を指すことの明示的な命名理由は、市公式資料の文面では直接確認できなかった（位置の説明とグスクの説明からの読み取り）
  - 旧間切名（佐敷・知念・玉城・大里）それぞれの地名の由来は今回の調査範囲では確認できなかった
  updated: '2026-11-13'
- id: muni/47-名護市
  code: '472093'
  names:
    ja: 名護市
    reading: なごし
    aliases:
    - 名護町
    - 那古
    - 那五
  user_terms:
  - なご
  - ナグ（地元の方音）
  - やんばるの中心都市
  - 名護湾のまち
  naming_type: その他
  prefecture: 沖縄県
  homonyms: []
  summary: 沖縄本島北部の中心都市で、昭和45年（1970年）8月1日に名護町と屋部村・羽地村・屋我地村・久志村が合併して市制を施行した。「名護」は15世紀の朝鮮の地理書『海東諸国紀』に「那五」と記される古い地名で、地元の方音は「ナグ」。語源は名護湾の波の穏やかさに結びつける凪（なぎ）説のほか、平坦地とする説、砂浜の波の音とする説などがあり、専門辞典でも諸説併記で確定していない。
  first_attestation:
    era: 文明3年
    year_western: 1471
    document: 『海東諸国紀』
    note: 朝鮮で編まれた『海東諸国紀』に「那五」と記されるのが確認できる古い用例の一つであると『日本歴史地名大系』が紹介している（二次資料経由の確認）。その後、嘉靖41年（1562年）の琉球碑文には「那古」、『おもろさうし』には「なこ」と記される
  claims:
  - text: 名護市の地方公共団体コードは472093である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  - text: 名護市は昭和45年（1970年）8月1日、名護町と屋部・羽地・屋我地・久志の4村が合併して市制を施行した
    kind: fact
    level: E3
    status: established
    sources:
    - s5-nago-kotobank-shi
  - text: 「名護」の古い用例として、『海東諸国紀』には「那五」、首里城にあった嘉靖41年（1562年）の碑文には「那古」、『おもろさうし』には「なこ」、『琉球神道記』には「那呉」と記されることが『日本歴史地名大系』で紹介されている
    kind: fact
    level: E3
    status: established
    sources:
    - s5-nago-kotobank-magiri
  - text: 地名の意味については、名護湾の波の穏やかな様子、平坦地、砂浜で波の音の和やかなところなど諸説があり、定説は得られていないことが『日本歴史地名大系』で紹介されている
    kind: fact
    level: E3
    status: contested
    sources:
    - s5-nago-kotobank-magiri
  - text: 地元の方音は「ナグ」で、近世の名護村も「なぐ」と読まれており、和語の「なごむ（和む）」や「凪」に結びつける説明はこの音に基づいている
    kind: fact
    level: E3
    status: established
    sources:
    - s5-nago-kotobank-magiri
    - s5-nago-kotobank
  - text: 近世には国頭方に属する名護間切が置かれ、間切番所のある名護村がこの地域の中心だった
    kind: fact
    level: E3
    status: established
    sources:
    - s5-nago-kotobank-magiri
  - text: 市は、豊かな海の幸や海外文化をもたらすところをうたった古謡「おもろさうし」の「あきみよ」に由来する言葉「あけみお」を、「あけみおのまち・名護」としてまちの象徴に位置づけている
    kind: fact
    level: E2
    status: established
    sources:
    - s5-nago-plan
  column:
    title: 「ナゴ」か「ナグ」か――読みに残る琉球語
    text: 名護の地元での呼び名は、沖縄語で「ナグ」。近世の文書でも名護村は「なぐ」と読まれてきた。ところが自治体名の公式の読みは「なごし」で、本土の人が「和（なご）やか」「凪（なぎ）」と結びつけやすい音に寄せられている。面白いのは市内の名護城跡で、こちらは「ナゴグスク」ではなく「ナングスク」と読む通称が定着している。同じ「名護」の字でも、市の名前は和風に、城の名前は琉球風に読まれるという二重の読みが同居しているのである。地名の読みは、標準化される過程で元の音を少しずつ離れていくが、このまちではその途中の姿が今も見える。
    sources:
    - s5-nago-kotobank-magiri
    - s5-nago-kotobank
  relations:
  - pref/47
  unknowns:
  - 語源の諸説（凪・平坦地・波の音など）のうちどれが正しいかは、専門辞典でも確定していなかった
  - 『海東諸国紀』「那五」の原文は二次資料経由でしか確認できていない
  - 名護市教育委員会の地名調査資料など郷土資料による語源の検討は未確認である
  updated: '2026-11-13'
- id: muni/47-宜野湾市
  code: '472051'
  names:
    ja: 宜野湾市
    reading: ぎのわんし
    aliases:
    - 宜野湾村
    - 宜野湾間切
    - ジノーン
  user_terms:
  - ぎのわん
  - ジノーン（地元の方音）
  - 普天間基地のまち
  - ねたての都市
  naming_type: その他
  prefecture: 沖縄県
  homonyms: []
  summary: 沖縄本島中南部の市で、昭和37年（1962年）7月1日に宜野湾村が単独で市制を施行した。「宜野湾」は方音「ジノーン（じのーん）」に漢字を当てた表記で、古くは『おもろさうし』の「きのわん」に遡ると考えられ、近世には宜野湾間切の名として定着した。語の意味そのものの確定した語源は専門辞典にも示されていない。戦後は市域の中央を米軍普天間飛行場が占め、旧来の中心地だった字宜野湾は基地の敷地の中に消えた。
  first_attestation:
    era: null
    year_western: null
    document: 『おもろさうし』巻15
    note: 『日本歴史地名大系』は『おもろさうし』巻15に当地を指すと考えられる「きのわん」がみえると紹介する。文書で表記の確定する用例は元和7年（1621年）の知行目録（高嶺家文書）の「儀野湾村」である（いずれも二次資料経由の確認）
  claims:
  - text: 宜野湾市の地方公共団体コードは472051である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  - text: 宜野湾市は昭和37年（1962年）7月1日、宜野湾村が市制を施行して発足した
    kind: fact
    level: E2
    status: established
    sources:
    - s5-ginowan-plan
  - text: 地元の方音は「ジノーン（じのーん）」であり、「宜野湾」の漢字表記はこの琉球語の音に字を当てたものである
    kind: fact
    level: E3
    status: established
    sources:
    - s5-ginowan-kotobank-magiri
  - text: 『おもろさうし』巻15には当地を指すと考えられる「きのわん」がみえ、元和7年（1621年）3月16日の尚恭浦添王子朝良宛知行目録（高嶺家文書）には浦添間切のうちに「儀野湾村」と記されることが『日本歴史地名大系』で紹介されている
    kind: fact
    level: E3
    status: established
    sources:
    - s5-ginowan-kotobank-mura
    - s5-ginowan-kotobank-magiri
  - text: 康熙10年（1671年）、浦添・中城・北谷の各間切から14か村を割いて宜野湾間切が新設され、間切番所は宜野湾村に置かれた
    kind: fact
    level: E3
    status: established
    sources:
    - s5-ginowan-kotobank-magiri
    - s5-ginowan-city-gaiyo
  - text: 戦前の宜野湾村では字宜野湾（現在の普天間飛行場内）に村役場があり、琉球王国時代から村行政の中心地として発展していたが、戦後にその一帯は普天間飛行場の敷地となった
    kind: fact
    level: E2
    status: established
    sources:
    - s5-ginowan-soumu
  - text: 市は、古謡「おもろそうし」に表された言葉で「物事の根元」「共同体の中心」を意味する「ねたて」を、「ねたての都市ぎのわん」として市の合言葉にしている
    kind: fact
    level: E2
    status: established
    sources:
    - s5-ginowan-about
  column:
    title: 基地の中に消えた中心地「宜野湾」
    text: 「宜野湾」という地名の本来の中心は、今は地図の上でたどることが難しい。近世に間切番所が置かれ、戦前は村役場のあった字宜野湾は、現在の米軍普天間飛行場の敷地の中にある。戦後、集落は接収され、住民は周辺へ移った。かつてその中心地へ続く道には「ジノーンナンマチ（宜野湾並松）」と呼ばれる松並木があり、1932年には国の天然記念物に指定されるほど知られた景観だったが、これも戦禍と基地建設の中で失われた。市の中心は野嵩・普天間方面へ移り、「宜野湾」の名だけが、元の集落のあった場所から少し離れた市全体の名として残っている。地名とその原点の位置がずれてしまった典型的な例である。
    sources:
    - s5-ginowan-soumu
    - s5-ginowan-kotobank-magiri
  relations:
  - pref/47
  unknowns:
  - 「ジノーン」という語そのものの語源（「ジノー」の意味の分解を含む）は、専門辞典や市公式サイトでは確定した説明を確認できなかった。宜野湾市教育委員会『ぎのわんの地名』（2012年）の検討は未確認である
  - 『おもろさうし』の「きのわん」が宜野湾を指すかどうかは『日本歴史地名大系』も「考えられる」とする段階にとどまる
  - 普天間飛行場が市面積に占める割合は資料によって表現が異なり、今回は数値を採用しなかった
  updated: '2026-11-13'
- id: muni/47-宮古島市
  code: '472140'
  names:
    ja: 宮古島市
    reading: みやこじまし
    aliases:
    - 平良市
    - 宮古市（決定されかけた名称）
    - ミャーク
  user_terms:
  - みやこじま
  - ミャーク（宮古語の呼び名）
  - 宮古ブルーの島
  - 伊良部大橋のある市
  naming_type: 合併新設
  prefecture: 沖縄県
  homonyms: []
  summary: 平成17年（2005年）10月1日、平良市・城辺町・下地町・上野村・伊良部町の5市町村が新設合併して発足した、宮古列島の市。新市名は合併協議でいったん「宮古市」に決まったが、岩手県宮古市と同名になることを避けて最終的に島の名を含む「宮古島市」となった。「宮古」は方音「ミャーク」に対応する古い島名で、もともとは主島だけでなく列島全体の総称であり、文献上の初出は中国の『元史』にみえる「密牙古人」の記事と一般にいわれる。
  first_attestation:
    era: null
    year_western: null
    document: 『元史』
    note: 明代初期に編まれた『元史』に「波羅公管下密牙古人」が温州・永嘉へ漂着したという記事があり、「密牙古」を宮古の音訳と解釈して、一般にこれが文献における宮古（島）の初出とされる。解釈を含む話であり二次資料経由の確認にとどまるため、年は特定しない
  claims:
  - text: 宮古島市の地方公共団体コードは472140である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  - text: 宮古島市は平成17年（2005年）10月1日、平良市・城辺町・下地町・上野村・伊良部町の5市町村が合併して誕生した
    kind: fact
    level: E2
    status: established
    sources:
    - s5-miyakojima-koho20
  - text: 新市の名称は平成16年（2004年）11月17日の平良市・城辺町・伊良部町合併推進協議会でいったん「宮古市」に決定されていた
    kind: fact
    level: E2
    status: established
    sources:
    - s5-miyakojima-city-gappei
  - text: 名称は合併協議で最も難航した項目であり、協議会で「宮古市」と決めた後に住民側からアンケート実施の要請があり、協議会での無記名投票を経て住民アンケートを実施して最終決定に至った経過が合併事例資料に記録されている
    kind: fact
    level: E4
    status: established
    sources:
    - s5-miyakojima-jirei
  - text: 最終的には岩手県の宮古市と同名になることを避ける形で、島の名を入れた「宮古島市」で決着した経緯が紹介されている
    kind: fact
    level: E4
    status: established
    sources:
    - s5-miyakojima-uub-arc
  - text: 「宮古」の文献上の初出は一般に、中国で編まれた『元史』にみえる「波羅公管下密牙古人」の漂着記事とされ、「密牙古」は宮古の音を写したものと解釈されることが紹介されている
    kind: fact
    level: E5
    status: established
    sources:
    - s5-miyako-wiki-island
  - text: 1701年に成立した『中山世譜』には、平良・来間・大神・池間・水納・伊良部・多良間の七島を「総称之曰宮古島、又曰麻姑山」と記し、「宮古島」はもともと列島全体の総称で、主島自体は平良と呼ばれていたことが紹介されている
    kind: fact
    level: E5
    status: established
    sources:
    - s5-miyako-wiki-island
  - text: 方音は「ミャーク」で、『日本歴史地名大系』は宮古を主島・宮古島を中心とする島々の総称とし、麻姑山・都島・太平山などの別称も史料にみえると紹介している
    kind: fact
    level: E3
    status: established
    sources:
    - s5-miyako-kotobank
  column:
    title: 日本に二つの「宮古市」が生まれる寸前だった
    text: 2004年11月、宮古の合併協議会は新市の名前を「宮古市」と決めた。ところが日本にはすでに岩手県に宮古市がある。市の同名は法律で禁止されているわけではないが、混乱を避けるのが通例で、この決定は全国的な話題になった。名称問題は合併協議で最も難航した項目となり、住民アンケートまで行われた末、最終的に選ばれたのは「宮古島市」である。岩手の宮古市は港町の名、沖縄の宮古は島々の総称の名で、字は同じでも成り立ちは無関係だったが、同名回避の一字「島」が、結果として「島の市」であることをよく表す名前になった。なお宮古市と宮古島市は現在も別の市として併存しており、同名そのものではなく「同名になりかけた」事例として珍しい。
    sources:
    - s5-miyakojima-city-gappei
    - s5-miyakojima-jirei
    - s5-miyakojima-uub-arc
  relations:
  - pref/47
  - muni/03-宮古市
  unknowns:
  - 「宮古（ミャーク）」という語そのものの語源（何を意味する語だったか）は、専門辞典でも確定した説明を確認できなかった
  - 『元史』の「密牙古人」の記事の原文と年代は二次資料経由でしか確認できていない
  - 「宮古市」から「宮古島市」への変更を正式に決めた会議の日付と議事は、市の公式年表では確認できなかった
  updated: '2026-11-13'
- id: muni/47-沖縄市
  code: '472115'
  names:
    ja: 沖縄市
    reading: おきなわし
    aliases:
    - コザ市
    - 胡差
  user_terms:
  - 沖縄市はどうやってできた
  - コザって何
  - 沖縄市の名前の由来
  naming_type: 合併新設
  prefecture: 沖縄県
  homonyms: []
  summary: 1974年4月1日にコザ市と美里村の対等合併で誕生した新設の市名で、県内では那覇市に次ぐ第二の都市となった。前身のコザ市は、米軍嘉手納基地の門前町として発展した越来村が1956年に「コザ」へ改称して生まれた市で、「コザ」の語源には胡屋説と古謝説がある。1666年に分かれた越来・美里の両地域が308年ぶりに再び一つになった合併でもあった。
  first_attestation:
    era: 昭和49年
    year_western: 1974
    document: コザ市・美里村の合併協定（1973年12月27日調印）と1974年4月1日の沖縄市発足
    note: 市名としての成立。前身の「コザ」は1956年に越来村の改称で生まれた名で、戦後に通称として定着していたと沖縄県公文書館の資料は伝える
  claims:
  - text: 1974年（昭和49年）4月1日、コザ市と美里村の対等合併により沖縄市が誕生し、人口約9万6,000人を擁する県下第二の都市となった（地方公共団体コードは472115）
    kind: fact
    level: E2
    status: established
    sources:
    - l6-okinawa-yoran
    - l6-okinawa-koho40
    - b-cap-chiba-soumu-code
  - text: 沖縄市公式の要覧によれば、1666年に越来間切から美里間切が分離して以来、1974年の合併で両地域は308年ぶりに再び一つになった
    kind: fact
    level: E2
    status: established
    sources:
    - l6-okinawa-yoran
  - text: 前身の越来村は嘉手納基地の門前町として発展し、1956年（昭和31年）6月にコザ村へ改称、同年7月に市制を施行してコザ市となった。そのため「コザ村」として存在した期間は1か月足らずだった（沖縄県公文書館の紹介資料）
    kind: fact
    level: E2
    status: established
    sources:
    - l6-okinawa-archives
    - l6-okinawa-yoran
  - text: 沖縄県公文書館は、1956年の越来村からコザ村への名称変更に関する琉球政府文書を紹介し、「コザ」という名称は戦後に通称として定着していたと伝える
    kind: fact
    level: E2
    status: established
    sources:
    - l6-okinawa-archives
  - text: 前身名「コザ」の由来については、沖縄県立図書館のレファレンス回答が、参照した資料のうち2点は「胡屋」、1点は「古謝」を由来とするなど説が分かれることを紹介している
    kind: fact
    level: E2
    status: contested
    sources:
    - l6-okinawa-ndl-crd
  - text: 米軍統治下の1945年には、旧越来村一帯に「胡差（古謝）市」、旧美里村一帯に「前原市」が置かれたが、いずれも翌年には解かれて村に戻った（沖縄市要覧）
    kind: fact
    level: E2
    status: established
    sources:
    - l6-okinawa-yoran
  - text: 沖縄市は本土復帰（1972年）から2年後の1974年に誕生し、市は合併後に策定した長期計画で「国際文化観光都市」を宣言した（沖縄市要覧）
    kind: fact
    level: E2
    status: established
    sources:
    - l6-okinawa-yoran
  column:
    title: 1か月だけ存在した「コザ村」
    text: 沖縄市の前身・コザ市には、短命だったもう一つの姿がある。1956年6月、越来（ごえく）村は「コザ村」に改称されたが、その翌月には市制を施行してコザ市になってしまった。つまり「コザ村」は1か月足らずしか存在しなかった。公文書館に残る改称の文書には、戦後の門前町で「コザ」という呼び名がすでに定着していたことがうかがえる。そして1974年、コザ市は美里村と合併して「沖縄市」となり、その名もまた18年で姿を消した。二つの短い名前の上に、現在の市名が立っている。
    sources:
    - l6-okinawa-archives
    - l6-okinawa-yoran
  relations:
  - pref/47
  unknowns:
  - 新市名「沖縄市」の決定過程（候補案や選定理由）を示す一次資料は本調査では確認できなかった
  - 「コザ」の語源（胡屋説・古謝説）の決着は未了
  updated: '2026-11-13'
- id: muni/47-浦添市
  code: '472085'
  names:
    ja: 浦添市
    reading: うらそえし
    aliases:
    - うらおそい
    - 浦襲
  user_terms:
  - うらそえの由来
  - 浦添ってどう読むの
  - てだこのまち
  naming_type: 一部の地名
  prefecture: 沖縄県
  homonyms: []
  summary: 「浦添」は当て字で、もとは「うらおそい」とかな書きされていた。琉球の言語学者・伊波普猷は「浦々を支配する所」の意と解釈し、市公式・沖縄県公式の説明もこの説に沿う。浦添は首里に王都が移る以前の琉球の中心で、舜天・英祖・察度の王統が拠った地である。1908年に浦添間切から浦添村となり、1970年に市制を施行した。
  first_attestation:
    era: 江戸時代初期
    year_western: 1623
    document: おもろさうし
    note: 「うらおそい」とかな書きされた用例を伊波普猷『浦添考』が引く。『おもろさうし』は16世紀から1623年にかけて編纂された歌謡集。「浦添」の漢字表記は当て字で、本来の形は「うらおそい」
  claims:
  - text: 「浦添」の字は当て字であり、もとは「うらおそい」とかなで書かれ、『おもろさうし』や浦添ようどれの碑文にもその形が見えると、伊波普猷は『浦添考』で述べる
    kind: fact
    level: E3
    status: established
    sources:
    - l6-urasoe-iha
  - text: 伊波普猷は「うらおそい」を「浦（うら）」と「おそう（襲）」の名詞形に分け、「浦々を襲う、すなわち浦々を支配する所」の意であると解釈した
    kind: fact
    level: E3
    status: established
    sources:
    - l6-urasoe-iha
  - text: 浦添市公式・沖縄県公式の説明も、「うらおそい（浦襲）」は津々浦々を支配するという意味であり、それが転じて「うらそえ」となり「浦添」の字が当てられたとする
    kind: fact
    level: E2
    status: established
    sources:
    - l6-urasoe-about
    - l6-urasoe-pref
  - text: 浦添は首里に王都が移る以前の琉球の王都であり、舜天王・英祖王・察度王の王統が浦添城を中心に約250年にわたって本島中南部の中心だったと、浦添市公式資料は伝える
    kind: fact
    level: E2
    status: established
    sources:
    - l6-urasoe-guide
  - text: 1908年（明治41年）4月、浦添間切が浦添村に改められた（浦添市公式のあゆみ）
    kind: fact
    level: E2
    status: established
    sources:
    - l6-urasoe-ayumi-pre
  - text: 1970年（昭和45年）7月に浦添村が市制を施行して浦添市となった。米軍統治下での市制施行である（地方公共団体コードは472085）
    kind: fact
    level: E2
    status: established
    sources:
    - l6-urasoe-ayumi
    - b-cap-chiba-soumu-code
  - text: 英祖王は「てだこ（太陽の子）」と敬称され、その母が、太陽が懐に入る夢を見て英祖を身籠ったという伝承を、浦添市公式のプロフィールは紹介する
    kind: legend
    level: E2
    status: established
    sources:
    - l6-urasoe-profile
  column:
    title: 王都の名は「支配」の意味だった
    text: 浦添の名の底にある「うらおそい」は、「浦々を支配する所」という意味だったと伊波普猷は解いた。王都にふさわしい名である。実際、浦添は首里に都が移る前の琉球の中心で、舜天・英祖・察度の三代の王統がここを拠りにした。王都が首里へ移った後も、「支配の中心」を意味する名は土地に残り続け、読みが「うらおそい」から「うらそえ」へ和らぎ、「浦添」の字が当てられて現代の市名になった。王のいなくなった都の名が、六百年以上も使われ続けている。
    sources:
    - l6-urasoe-iha
    - l6-urasoe-guide
  relations:
  - pref/47
  unknowns:
  - 「うらおそい」より前の古名や、浦添ようどれ碑文の正確な年代の直接確認は未了
  - 伊波普猷の解釈以外の語源説の有無は本調査では確認できなかった
  updated: '2026-11-13'
- id: muni/47-石垣市
  code: '472077'
  names:
    ja: 石垣市
    reading: いしがきし
    aliases:
    - 石垣町
  user_terms:
  - 石垣島の由来
  - 日本最南端の市
  - 尖閣諸島がある市
  naming_type: 一部の地名
  prefecture: 沖縄県
  homonyms: []
  summary: 市名は島名「石垣」に由来する。『精選版日本国語大辞典』は「いしがき」を「信覚（しがき）の変化した語といわれる」とし、奈良時代初めに使者を送った信覚国を石垣島に比定する説を紹介する。地元の方言では今も「イシャナギィ」と呼ばれ、古い音の痕跡を残す。市域は石垣島全域と無人の尖閣諸島を含み、日本最西端・最南端の市である。1947年に石垣町が市制を施行した。
  first_attestation:
    era: 和銅7年
    year_western: 714
    document: 続日本紀
    note: 「信覚国」の記事。『精選版日本国語大辞典』は「いしがき」を信覚（しがき）の変化した語とし、信覚国を石垣島に比定する説を紹介する。前身名の初出として記録するもので、比定は説の段階にとどまる
  claims:
  - text: 『精選版日本国語大辞典』は「いしがき」について「信覚（しがき）の変化した語といわれる」とし、奈良時代の初めに使者をよこした信覚国は石垣島ともいわれる、とする
    kind: fact
    level: E3
    status: contested
    sources:
    - l6-ishigaki-kotobank-jima
  - text: 地元の方言では石垣を「イシャナギィ」といい、『日本歴史地名大系』も石垣村の読みを「いしやなぎい」とする
    kind: fact
    level: E3
    status: established
    sources:
    - l6-ishigaki-kotobank-jima
  - text: 王府時代の市域は石垣・大浜・宮良の3間切に分かれ、石垣間切には石垣・新川・名蔵・崎枝・川平・桴海の6か村があった（『日本歴史地名大系』「石垣市」）
    kind: fact
    level: E3
    status: established
    sources:
    - l6-ishigaki-kotobank-shi
  - text: 石垣市は石垣島全域と無人の尖閣諸島を含む、日本最西端・最南端の市である（『日本歴史地名大系』「石垣市」）
    kind: fact
    level: E3
    status: established
    sources:
    - l6-ishigaki-kotobank-shi
  - text: 尖閣諸島の字（あざ）名は2020年（令和2年）10月に、石垣市字登野城から「登野城尖閣」へ変更された（石垣市公式サイト）
    kind: fact
    level: E2
    status: established
    sources:
    - l6-ishigaki-city-senkaku
  - text: 1969年（昭和44年）には、当時の石垣市長が自ら尖閣諸島に上陸し、5島に行政標柱を建立した（石垣市議会の決議資料）
    kind: fact
    level: E2
    status: established
    sources:
    - l6-ishigaki-city-gikai
  - text: 1947年（昭和22年）7月10日、石垣町が市制を施行して石垣市となったとWikipediaは紹介する。米軍統治下の八重山民政府のもとでの市制施行だった（地方公共団体コードは472077）
    kind: fact
    level: E5
    status: established
    sources:
    - l6-ishigaki-wikipedia
    - b-cap-chiba-soumu-code
  column:
    title: 「イシャナギィ」に残る古い音
    text: 石垣の島の名は、標準語の音からは想像しにくい古い姿を方言に残している。地元の言葉では石垣は「イシャナギィ」。『精選版日本国語大辞典』が示す「信覚（しがき）から変化した」という説が正しければ、奈良時代に大和朝廷へ使者を送った「信覚国」の名が、1300年の歳月を経てこの方言の音の中に生きていることになる。比定はまだ説の段階だが、島の人々の日常の呼び名こそが、最も古い地名の記録なのかもしれない。
    sources:
    - l6-ishigaki-kotobank-jima
  relations:
  - pref/47
  unknowns:
  - 「信覚（しがき）」から「石垣」への音変化の過程を示す中世の用例は確認できなかった
  - 「石垣」の漢字が当てられた時期の特定は未了
  - 1947年の市制施行の正確な日付（7月10日）はWikipediaの整理に依拠し、公的資料での直接確認が未了
  updated: '2026-11-13'
- id: muni/47-糸満市
  code: '472107'
  names:
    ja: 糸満市
    reading: いとまんし
    aliases:
