  prefecture: 長野県
  homonyms: []
  summary: 諏訪郡の町。町名は旧富士見村に由来し、その村名は1874年の合併で生まれた際に付けられた。明治9年（1876年）に県へ提出された史料には、甲斐の国を隔てて二十里先の富士山を遠望できる絶佳の眺めを住民が愛でて「富士見村」と称したという由来が記されている。1955年に富士見・本郷・落合・境の4村が合併して富士見町となった。なお埼玉県の富士見市とは別の自治体である。
  first_attestation:
    era: 明治9年
    year_western: 1876
    document: 県へ提出された富士見村の沿革史料（富士見町歴史民俗資料館の解説が引用）
    note: 村名「富士見」の由来を記した最も古い説明。村自体の成立は明治7年（1874年）
  claims:
  - text: 富士見町歴史民俗資料館の解説によれば、町名の由来は旧富士見村の名から来ており、明治9年（1876年）に県へ提出された史料に「富岳巽に方り甲斐一國を距て廿里の遠望絶佳、詩客の感ずる處なり……因て居民の欲する處より富士見村と號す」と村名の由来が記されている
    kind: fact
    level: E2
    status: established
    sources:
    - v12-fujimi-museum-history
  - text: 富士見村は1874年（明治7年）に10か村が合併して成立した
    kind: fact
    level: E2
    status: established
    sources:
    - v12-fujimi-museum-history
  - text: 1955年（昭和30年）、富士見村・本郷村・落合村・境村の4か村が合併して富士見町が誕生した
    kind: fact
    level: E2
    status: established
    sources:
    - v12-fujimi-town-nenpyo
    - v12-fujimi-museum-history
  - text: 「富士見」は、そこから富士山が見える所を指す汎用地名で、鏡味完二・鏡味明克『地名の語源』は「そこから富士山がみえる所。駿河富士の可視圏内に分布」と説明すると、『日本歴史地名大系』ジャーナルのコラムが紹介する
    kind: fact
    level: E3
    status: established
    sources:
    - v12-fujimi-jk-column
  - text: 町域の八ケ岳西南麓は縄文時代中期の文化が展開した舞台で、井戸尻遺跡をはじめとする多くの集落跡が出土している
    kind: fact
    level: E2
    status: established
    sources:
    - v12-fujimi-museum-history
  - text: 富士見町の地方公共団体コードは203629である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 富士山が見える、ただそれだけの名
    text: 全国各地にある「富士見」という地名の中で、この町は由来が当時の文書に残っているのが面白い。1876年に県へ提出された史料の言葉は、「富士は東南にあって甲斐一国を隔て二十里、遠望絶佳、詩人の感ずるところ。常には農夫も耕す疲れを忘れる天然の風景である。よって住民の望むところから富士見村と号す」という趣旨である。内陸の信州から県境の山々を越えて見える富士への誇りが、そのまま村の名になり、町へと受け継がれた。
    sources:
    - v12-fujimi-museum-history
  relations:
  - pref/20
  unknowns:
  - 1874年の合併の際に「富士見村」と名付けた具体的な決定過程（提案者等）は、県提出史料の由来文以上のことは確認できなかった
  - 1874年に合併した10か村の個々の村名は、資料館の年表に明記がなく未確認
  updated: '2026-11-13'
- id: muni/20-小川村
  code: '205885'
  names:
    ja: 小川村
    reading: おがわむら
    aliases:
    - 小川庄
    - 南小川村
    - 北小川村
  user_terms:
  - 小川村
  - おがわ
  - 長野の小川村
  - 星ふる里
  - 日本で最も美しい村
  naming_type: 一部の地名（中世の荘園名「小川庄」以来の地名の継承）
  prefecture: 長野県
  homonyms: []
  summary: 上水内郡の村。村名は、平安時代に『延喜式』の神名帳へ登載されたと村公式が伝える小川神社や、鳥羽院に寄進されて皇室の荘園となった小川庄に遡る古い地名である。埼玉県の小川町とは読みが同じ「おがわ」で紛らわしいが成り立ちは無関係で、こちらは1889年に南小川村・北小川村の2村が分かれて生まれ、1955年に合併して1つの小川村に戻った。現行の「小川村」という自治体は全国でこの村のみである。
  first_attestation:
    era: 延長5年
    year_western: 927
    document: 『延喜式』神名帳
    note: 村公式の歴史ページが、小川神社が『延喜式』神名帳に登載されたことを伝える。神社の名としての用例であり、原文の直接確認はしていない
  claims:
  - text: 村公式の歴史ページは、延長5年（927年）の『延喜式』神名帳に小川神社が登載されており、この年代に村落が形成され住民によって宮の奉祀があった証しであるとする
    kind: fact
    level: E2
    status: established
    sources:
    - v12-ogawa-vill-history
  - text: 小川の地は戸隠三院との関わりが深く、顕光寺が小川庄を鳥羽院に寄進して皇室の荘園となり、天養2年（1145年）には荘内の争乱に対して鳥羽院から小川庄公文所へ下文（天養文書）が出されたと村公式が伝える
    kind: fact
    level: E2
    status: established
    sources:
    - v12-ogawa-vill-history
  - text: 村公式は、この時代の伝承に現れる「小川真人」が「小川」を称する緒口（きっかけ）になったと推考している
    kind: legend
    level: E2
    status: indeterminate
    sources:
    - v12-ogawa-vill-history
  - text: 江戸時代、この一帯は松代藩領となり、明治22年（1889年）の町村制施行により高府村・小根山村が合併して南小川村に、瀬戸川村・稲丘村が合併して北小川村になった
    kind: fact
    level: E2
    status: established
    sources:
    - v12-ogawa-vill-history
  - text: 昭和30年（1955年）4月1日、南小川村と北小川村が合併して現在の小川村となった
    kind: fact
    level: E2
    status: established
    sources:
    - v12-ogawa-vill-history
  - text: 村名「小川」を特定の川の名に直接結びつける説明は村公式の歴史ページには見られず、確認できる古い層は神社名・荘園名としての「小川」である
    kind: fact
    level: E2
    status: indeterminate
    sources:
    - v12-ogawa-vill-history
  - text: 小川村の地方公共団体コードは205885である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 皇室の荘園だった「小川」
    text: 小さな川の名のように見える「小川」は、村公式の歴史をたどると神社の名であり、荘園の名として現れる。小川庄は鳥羽院に寄進され、皇室の荘園として300年余りにわたって伝領されたという。天養2年（1145年）の争乱に際して出された下文は「天養文書」と呼ばれて残る。そして1955年、南と北に分かれていた2つの小川村は、66年ぶりに1つの小川村に戻った。
    sources:
    - v12-ogawa-vill-history
  relations:
  - pref/20
  - muni/11-小川町
  unknowns:
  - 「小川」の名が最初に何を指したのか（どの川を指したのか、神社名・荘園名のいずれが先か）を示す資料は確認できなかった
  - 小川神社の『延喜式』神名帳への登載は村公式の紹介によるもので、原典での直接確認はしていない
  updated: '2026-11-13'
- id: muni/20-小布施町
  code: '205419'
  names:
    ja: 小布施町
    reading: おぶせまち
    aliases:
    - 小布施村
  user_terms:
  - 小布施
  - おぶせ
  - 栗の町
  - 北斎の町
  - 小布施堂
  naming_type: 一部の地名（中世以来の地名「小布施」の継承）
  prefecture: 長野県
  homonyms: []
  summary: 上高井郡の町で、長野県で最も面積の小さい市町村である。地名「小布施」の初見は1329年の鎌倉幕府下知状案（守矢文書）で、『日本歴史地名大系』は村名の由来について古代の土豪・布勢（ふせい）氏の居住に求める説を有力とする。栗と葛飾北斎で知られるが、地名の古層は中世の荘郷の時代に遡る。1954年に小布施村が町制を施行し、同年都住村と合併して現在の小布施町となった。
  first_attestation:
    era: 嘉暦4年
    year_western: 1329
    document: 鎌倉幕府下知状案（守矢文書）
    note: 『日本歴史地名大系』「小布施村」項が「小布施」の初見として紹介する。原文の直接確認はしていない
  claims:
  - text: 『日本歴史地名大系』「小布施村」項は、村名は古代の土豪・布勢（ふせい）氏の居住説が有力であるとする
    kind: fact
    level: E3
    status: established
    sources:
    - v12-obuse-kotobank-taikei
  - text: 同項によれば「小布施」の初見は嘉暦4年（1329年）の鎌倉幕府下知状案（守矢文書）に見えるもので、当時この地は東条庄のうちに属していた
    kind: fact
    level: E3
    status: established
    sources:
    - v12-obuse-kotobank-taikei
  - text: 明治22年（1889年）に小布施村・福原村・大島村・山王島村・飯田村・北岡村・押羽村が合併して小布施村に、都住村・中松村・雁田村が合併して都住村となった
    kind: fact
    level: E2
    status: established
    sources:
    - v12-obuse-town-about
  - text: 昭和29年（1954年）2月に小布施村が町制を施行し、同年11月1日に都住村と合併して現在の小布施町となった
    kind: fact
    level: E2
    status: established
    sources:
    - v12-obuse-town-about
  - text: 小布施は松川の扇状地に形成された集落で、酸性の強い水質のもとで先人たちが栗の栽培を始め、室町時代にはすでに栽培されていたといわれ、江戸時代には幕府への献上栗として守られたと町公式が伝える
    kind: fact
    level: E2
    status: established
    sources:
    - v12-obuse-town-history
  - text: 江戸時代後期には千曲川の舟運で北信濃の商業の中心として栄え、豪農・豪商の蓄えた富を背景に葛飾北斎や小林一茶ら文人墨客が招かれて「小布施文化」が花開いた
    kind: fact
    level: E2
    status: established
    sources:
    - v12-obuse-nippon
  - text: 小布施町の地方公共団体コードは205419である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 栗と北斎より古い「布勢氏」の名
    text: 「小布施」といえば栗菓子と北斎館が思い浮かぶが、地名そのものは鎌倉時代の文書にすでに現れている。『日本歴史地名大系』が有力とするのは、古代の土豪・布勢（ふせい）氏の名に由来するという説である。なぜ「小」が付くのかは判然としないが、幕府に栗を献上した村も、北斎を招いた豪商の町も、すべてこの古い名の上に積み重なってきた。長野県で一番小さい町は、県内でも指折りの古い名前を持っている。
    sources:
    - v12-obuse-kotobank-taikei
  relations:
  - pref/20
  unknowns:
  - 布勢氏居住説を裏付ける一次史料や、「小」の字が付いた経緯は確認できなかった
  - 守矢文書（鎌倉幕府下知状案）の原文の直接確認はしていない
  updated: '2026-11-13'
- id: muni/20-小海町
  code: '203033'
  names:
    ja: 小海町
    reading: こうみまち
    aliases:
    - 小海村
    - 相木湖
  user_terms:
  - 小海
  - こうみ
  - 小海線の町
  - 松原湖のある町
  - 海尻
  naming_type: 一部の地名（平安時代にできた湖の名「小海」の継承）
  prefecture: 長野県
  homonyms: []
  summary: 南佐久郡の町。海のない信州に「小海」「海尻」「海ノ口」「海瀬」と海の付く地名が多いのは、887年の八ヶ岳の大崩落で千曲川や相木川がせき止められ、谷に湖の連なりができたためで、土村付近にできた湖「小海」が地名の起源であると町公式は説明する。1956年に小海村と北牧村が合併して小海町となり、翌年に東馬流の一部が編入されて現在の町域となった。
  first_attestation:
    era: 戦国時代（天正年間）
    year_western: null
    document: 古絵図（小海町公式資料が紹介）
    note: 戦国時代の古地図に湖と「小海村」の地名が記されていると町公式資料は伝える。湖の名「小海」の成立自体は平安時代の湖の形成に遡るとされるが、文献上の初出の特定には至っていない
  claims:
  - text: 小海町公式サイトは、仁和3年（887年）あるいは仁和4年（888年）に八ヶ岳（天狗岳）で大崩落が起き、千曲川が泥流でせき止められて海ノ口から海尻にかけて大きな湖ができたと説明する
    kind: fact
    level: E2
    status: established
    sources:
    - v12-koumi-town-yurai
  - text: 町公式は、同じ崩落で相木川もせき止められ、土村付近（現在の小海小学校付近）から相木の入口までにできた湖（相木湖）が、当時この地に入ってきた人々によって「小海」と名付けられたことが地名の起源であるとする
    kind: fact
    level: E2
    status: established
    sources:
    - v12-koumi-town-yurai
  - text: 崩落の原因について、町公式サイトの由来ページは八ヶ岳の水蒸気爆発による大崩落とする一方、町の資料「『小海』の由来」は仁和3年の巨大地震による岩なだれとするなど、町公式資料の間でも説明が異なる
    kind: fact
    level: E2
    status: contested
    sources:
    - v12-koumi-town-yurai
    - v12-koumi-town-pdf
  - text: 海ノ口の湖は寛弘8年（1011年）に決壊して消えたが、小海湖は戦国時代の古絵図にも湖と「小海村」の名が記されており、鎌倉時代の中頃（1300年頃）まで、あるいはそれ以上残っていたと町公式は伝える
    kind: fact
    level: E2
    status: established
    sources:
    - v12-koumi-town-yurai
    - v12-koumi-town-pdf
  - text: 小海の周辺には海尻・海ノ口・海瀬など「海」と名の付く地名や、松原湖をはじめとする湖沼が多く残っている
    kind: fact
    level: E2
    status: established
    sources:
    - v12-koumi-town-pdf
  - text: 昭和31年（1956年）9月に小海村と北牧村が合併して小海町が発足し、翌1957年4月に東馬流が編入されて現在の小海町となった。町章は北牧・小海・東馬流を合併して発足した新町を表すと町公式が説明する
    kind: fact
    level: E4
    status: established
    sources:
    - v12-koumi-toyosato
    - v12-koumi-town-yurai
  - text: 小海町の地方公共団体コードは203033である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 海のない県の「小海」
    text: 内陸県・長野に「海尻」「海ノ口」「海瀬」と海の付く地名が並ぶ理由は、平安時代の山崩れが川をせき止め、谷に湖の連なりを作ったことにあるという。湖の多くはやがて決壊・消滅したが、松原湖のように今も残るものがあり、小海湖の名は湖が消えた後も村の名、町の名として生き残った。町章は「小」と三つの「ウ」で小海（こ・う・み）を表すのだという。
    sources:
    - v12-koumi-town-yurai
    - v12-koumi-town-pdf
  relations:
  - pref/20
  unknowns:
  - 「小海」の名がいつ誰によって付けられたかを示す同時代の記録は確認できなかった
  - 887年（あるいは888年）の八ヶ岳崩落の原因（巨大地震か水蒸気爆発か）は町公式資料でも説明が分かれている
  updated: '2026-11-13'
- id: muni/20-小諸市
  code: '202088'
  names:
    ja: 小諸市
    reading: こもろし
    aliases:
    - 小室
    - おむろ
    - 小諸町
  user_terms:
  - こもろし
  - 小諸城の城下町
  - 懐古園のまち
  - 小諸の名前の由来
  naming_type: 一部の地名
  prefecture: 長野県
  homonyms: []
  summary: 小諸市は浅間山の南麓、千曲川沿いに広がる城下町で、「小諸」の名の初出は嘉暦4年（1329年）の鎌倉幕府下知状案とされる。語源については、『和名類聚抄』の大村郷に比定される地を「小村」と呼んだものが、村・室・諸と転訛したという説が『日本歴史地名大系』に紹介されている。江戸時代は牧野氏の城下町・北国街道の宿場町として栄え、1954年に1町5村の合併で市制を施行した。
  first_attestation:
    era: 嘉暦4年
    year_western: 1329
    document: 鎌倉幕府下知状案（守矢文書）
    note: 『日本歴史地名大系』の記載による。「佐久郡小諸 小諸太郎」とあるのが初出とされる（原典そのものの確認はしていない）
  claims:
  - text: 『日本歴史地名大系』によれば、「小諸」の名の初出は嘉暦4年（1329年）3月の鎌倉幕府下知状案（守矢文書）にみえる「佐久郡小諸 小諸太郎」である
    kind: fact
    level: E3
    status: established
    sources:
    - v2-komoro-kotobank
  - text: 同書は語源について、『和名類聚抄』に載る大村郷が現在の諸（もろ）地区に比定され、その辺りを「小村」と呼んだものが転訛して村から室、諸へと変わったという『北佐久郡志』の説を紹介する
    kind: fact
    level: E3
    status: contested
    sources:
    - v2-komoro-kotobank
  - text: 「小諸」は古くは「おむろ」とも読み、「小室」とも記された
    kind: fact
    level: E3
    status: established
    sources:
    - v2-komoro-kotobank
  - text: 小諸は江戸時代には牧野氏1万5,000石の城下町であり、北国街道の宿場町、佐久甲州街道の分岐点でもあって、信濃でも有数の商業の中心地だった（ブリタニカ国際大百科事典の解説による）
    kind: fact
    level: E3
    status: established
    sources:
    - v2-komoro-kotobank
  - text: 昭和29年（1954年）4月1日に、小諸町・三岡村・南大井村・北大井村・大里村・川辺村の1町5村の合併で市制を施行し、小諸市が発足した
    kind: fact
    level: E2
    status: established
    sources:
    - v2-komoro-gikai
  - text: 市街地西部の千曲川の断崖上にある小諸城跡の懐古園は、島崎藤村の『千曲川旅情の歌』によって知られる（ブリタニカ国際大百科事典の解説による）
    kind: fact
    level: E3
    status: established
    sources:
    - v2-komoro-kotobank
  - text: 小諸市の地方公共団体コードは202088である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 「小村」が「小諸」になるまで
    text: 小諸という不思議な響きの名は、もとは「小村」だったという。大村郷のあたりの小さな村を指す素朴な呼び名が、時代とともに音が崩れ、「小室（おむろ）」と書かれる時期を経て、やがて「小諸」の字が定着した。転訛の途中の姿が「おむろ」「小室」という読みと表記に残っているところが面白い。千曲川の崖の上に立つ小諸城の城下町として栄えたこの町は、その名自体が言葉の化石のような存在である。
    sources:
    - v2-komoro-kotobank
  relations:
  - pref/20
  unknowns:
  - 千曲川の中州（小諸島）に由来するという説は、本調査で確認した資料には見当たらなかった
  - 『北佐久郡志』の転訛説の原典そのものは確認できなかった（『日本歴史地名大系』経由の紹介による）
  - 守矢文書の下知状案の原文は確認できなかった
  updated: '2026-11-13'
- id: muni/20-小谷村
  code: '204862'
  names:
    ja: 小谷村
    reading: おたりむら
    aliases:
    - 於他里
  user_terms:
  - 小谷村
  - おたり
  - 栂池高原
  - 塩の道の村
  - 白馬の隣の村
  naming_type: 一部の地名（平安時代以来の地域名「おたり」の継承。漢字表記「小谷」は後世に当てられた）
  prefecture: 長野県
  homonyms: []
  summary: 北安曇郡の村。読みの「おたり」の初出は1190年の文書に記された「於他里」で、当時この地は千国庄のうちに属していた。「おたり」の語源には、麻の産地であったことによる「麻垂（おたり）」説と、「たり」は樽に通じて断崖状の深い谷の地形を指すという『日本歴史地名大系』の説があり、「小さな谷」という意味ではない。漢字の「小谷」は1488年が初見という後世の当て字である。現在の村は1958年に南小谷村・中土村・北小谷村が合併して成立した。
  first_attestation:
    era: 建久元年
    year_western: 1190
    document: 新見文書（僧某下文）
    note: 『日本歴史地名大系』「小谷」項が、六条院御領・千国御庄のうちに「於他里（おたり）」とあるのを「おたり」の初見として紹介する。漢字表記「小谷」の初見は長享2年（1488年）の諏訪社下社春宮造宮の記録と同項は伝える。原文の直接確認はしていない
  claims:
  - text: 『日本歴史地名大系』「小谷」項によれば、「おたり」の名の初見は建久元年（1190年）の新見文書に「於他里」とあるもので、現在の小谷村域は千国庄に属し、その政所が現・小谷村大字千国のうちに設けられていた
    kind: fact
    level: E3
    status: established
    sources:
    - v12-otari-kotobank-taikei
  - text: 漢字表記「小谷」の初見は長享2年（1488年）の諏訪社下社春宮の造宮記録であり、音の「おたり」が先にあって漢字は後から当てられた
    kind: fact
    level: E3
    status: established
    sources:
    - v12-otari-kotobank-taikei
  - text: 『日本歴史地名大系』は、小谷の「たり」は原始的な地名要素で「樽」に通じ、断崖状になっている谷の深い地形を指すといわれると紹介する
    kind: fact
    level: E3
    status: contested
    sources:
    - v12-otari-kotobank-taikei
  - text: 一方、地域の解説では、小谷を含む北安曇地方が古くから良質な麻の産地だったことから「麻垂（おたり）」が語源だという説が、村公式の紹介する説として取り上げられており、語源は確定していない
    kind: fact
    level: E4
    status: contested
    sources:
    - v12-otari-donnatoko
  - text: 村公式の文化財解説も、「おたり」が記録に現れるのは今から800年ほど前の平安時代末期で「於他里」と記されて登場するとしつつ、今の小谷の範囲を指しているのかは定かではないと留保する
    kind: fact
    level: E2
    status: established
    sources:
    - v12-otari-vill-bunkazai
  - text: 昭和33年（1958年）4月1日、南小谷村・中土村・北小谷村が合併して小谷村が成立した
    kind: fact
    level: E4
    status: established
    sources:
    - v12-otari-uub
  - text: 小谷村の地方公共団体コードは204862である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 「小さい谷」ではない、おたり
    text: 姫川の深い谷に沿う村なのに、名の読みは「こたに」でも「おだに」でもなく「おたり」。その音は平安時代の「於他里」から受け継がれ、漢字の「小谷」は室町時代になってから当てられた。つまり「小谷＝小さな谷」という理解は順序が逆で、深い谷そのものを指す古い言葉「たり」が残った姿だという説がある。日本海から塩を運んだ千国街道（塩の道）が通った谷あいの村に、800年前の音が今も生きている。
    sources:
    - v12-otari-kotobank-taikei
    - v12-otari-vill-bunkazai
  relations:
  - pref/20
  unknowns:
  - 「おたり」の語源は、麻垂説と地形語（たり＝樽）説などが併存し、確定していない
  - 1190年の「於他里」が現在の小谷村全域を指していたかどうかは、村公式も定かでないとする
  updated: '2026-11-13'
- id: muni/20-山ノ内町
  code: '205613'
  names:
    ja: 山ノ内町
    reading: やまのうちまち
    aliases:
    - 山の内
  user_terms:
  - 山ノ内
  - やまのうち
  - 志賀高原の町
  - 湯田中渋温泉郷
  - スノーモンキーの町
  naming_type: 合併新設（1955年の合併で新たに採用された町名。構成町村の名は採られなかった）
  prefecture: 長野県
  homonyms: []
  summary: 下高井郡の町。1955年に平穏町・穂波村・夜間瀬村が合併して発足し、構成町村のどの名でもない「山ノ内」が新たな町名に選ばれた。『日本歴史地名大系』は「町名の示すように山懐の盆地」と形容する山あいの町で、志賀高原と湯田中渋温泉郷を擁する。ただし、合併の際にこの名が選ばれた具体的な理由や経緯は、本バッチで確認した町公式・県・専門資料には明記されていなかった。
  first_attestation:
    era: null
    year_western: null
    document: null
    note: 町名としては1955年の合併が初出。それ以前にこの地域を指す地域名としての「山ノ内」の用例は、本バッチでは確認できなかった
  claims:
  - text: 昭和30年（1955年）4月1日、平穏町・穂波村・夜間瀬村が合併して山ノ内町が発足した
    kind: fact
    level: E2
    status: established
    sources:
    - v12-yamanouchi-town-profile
  - text: 合併前の3町村は、明治22年（1889年）の町村制施行の際に平穏村・夜間瀬村・穂波村として構成され、平穏村は昭和29年（1954年）4月に町制を施行して平穏町となっていた
    kind: fact
    level: E2
    status: established
    sources:
    - v12-yamanouchi-town-profile
  - text: 『日本歴史地名大系』「山ノ内町」項は、町を「町名の示すように山懐の盆地」と形容し、夜間瀬川・樽川の清流は志賀高原の山々に源を発し、随所に豊かな温泉が湧出すると記す
    kind: fact
    level: E3
    status: established
    sources:
    - v12-yamanouchi-kotobank-taikei
  - text: 町名「山ノ内」が1955年の合併の際に選ばれた理由（公募の有無や提案者など）を明記した公表資料は、本バッチで確認した町公式サイト・長野県の調査報告書・専門辞典には見当たらなかった
    kind: fact
    level: E2
    status: indeterminate
    sources:
    - v12-yamanouchi-town-profile
    - v12-yamanouchi-pref-survey
  - text: 町域の志賀高原は昭和55年（1980年）に志賀高原ユネスコエコパークに登録され、1998年の長野冬季オリンピックの開催を契機に道路網の整備が進んだ
    kind: fact
    level: E2
    status: established
    sources:
    - v12-yamanouchi-pref-survey
  - text: 山ノ内町の地方公共団体コードは205613である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 名前の理由が残っていない町
    text: 平穏（ひらお）・穂波（ほなみ）・夜間瀬（よませ）——合併した3町村の名はどれも残らず、選ばれたのは「山ノ内」という地形そのままの名だった。湯田中や渋の温泉、地獄谷のスノーモンキー、志賀高原のスキー場で全国に知られる町でありながら、町名の由来を町は公式には説明していない。「山の内側の盆地」という意味は誰にでも分かるのに、1955年に誰がなぜこの名を推したのかは、公表された記録に見当たらない。由来の分からない有名地というのも、調べてみると案外少ない。
    sources:
    - v12-yamanouchi-kotobank-taikei
    - v12-yamanouchi-town-profile
  relations:
  - pref/20
  unknowns:
  - 合併時（1955年）に「山ノ内」の名が選定された経緯・理由は、公表資料では確認できなかった
  - 近世以前にこの地域を指す「山ノ内」という地域名の用例は確認できなかった
  updated: '2026-11-13'
- id: muni/20-山形村
  code: '204501'
  names:
    ja: 山形村
    reading: やまがたむら
    aliases:
    - 山方三か村
    - 山県三村
  user_terms:
  - 山形村
  - やまがた
  - 長野の山形村
  - サラダ街道の村
  - 清水寺の村
  naming_type: 一部の地名（江戸時代の総称「山方三か村」の継承）
  prefecture: 長野県
  homonyms: []
  summary: 東筑摩郡の村で、松本市の南西にある。山形県・山形市とは全く無関係の別の地名である。江戸時代、山あいに位置する大池・小坂・竹田の3村は「山方三か村」と総称され、1874年（明治7年）にこの3村が合併して「山形村」と名乗った。以後、昭和・平成の大合併でも合併や境界変更がなく、2024年に開村150周年を迎えた、県内でも稀な歩みを持つ村である。
  first_attestation:
    era: 明治7年
    year_western: 1874
    document: 合併御布達書（明治7年10月22日付け）
    note: 「山形村」という自治体名の成立そのもの。山形村教育委員会『ふるさと検定ガイドブック』に布達書の文面が掲載されている。もとになった地域の総称「山方三か村」は江戸時代の呼び名である
  claims:
  - text: 江戸時代、大池村・小坂村・竹田村は「山方三か村」と総称されていたと、山形村教育委員会のガイドブックは伝える
    kind: fact
    level: E2
    status: established
    sources:
    - v12-yamagata-guidebook
  - text: 明治7年（1874年）10月22日、大池村・小坂村・竹田村が合併して「山形村」が誕生したと、村教育委員会のガイドブックと村のふるさと伝承館の記録はいう
    kind: fact
    level: E2
    status: established
    sources:
    - v12-yamagata-guidebook
    - v12-yamagata-denshokan
  - text: 山形村は1874年の成立以来、昭和・平成の大合併においても合併や境界変更がなく単独で存続し、令和6年（2024年）に開村150周年を迎えた
    kind: fact
    level: E2
    status: established
    sources:
    - v12-yamagata-guidebook
  - text: 名の表記には揺れがあり、村内の学校は当初「山県学校」と名乗って明治15年（1882年）に「山形学校」と改称しており、ガイドブックは合併前の3村を「山県三村」とも記している
    kind: fact
    level: E2
    status: established
    sources:
    - v12-yamagata-guidebook
  - text: 本村の名は「山方三か村」という地域の総称に由来するもので、城下町・山形を中心とする山形県・山形市の「山形」とは由来を異にする別の地名である
    kind: fact
    level: E2
    status: established
    sources:
    - v12-yamagata-guidebook
  - text: 山形村の地方公共団体コードは204501である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 山形違い——150年、合併しなかった村
    text: 「山形村」と聞くと東北を思い浮かべるが、この村は松本平の南西にある。「山方」とは山のある方、山あいを指す言葉で、藩政時代の3か村の総称がそのまま村名になった。1874年の誕生以来、一度も合併していないのは県内でも珍しく、2024年には開村150周年を迎えた。村の学校の名がはじめ「山県学校」で、後に「山形学校」に直されたという記録も残り、「やまがた」の表記が定まるまでの揺れを今に伝えている。
    sources:
    - v12-yamagata-guidebook
  relations:
  - pref/20
  - muni/06-山形市
  unknowns:
  - 「山方（山県）」から「山形」という漢字表記が選ばれた理由は、村の公式資料に明記がなく確認できなかった
  - 江戸時代より前にこの地を指した「山形」「山方」の用例は確認できなかった
  updated: '2026-11-13'
- id: muni/20-岡谷市
  code: '202045'
  names:
    ja: 岡谷市
    reading: おかやし
    aliases:
    - 平野村
    - 岡谷村
  user_terms:
  - おかやし
  - 製糸のまち
  - シルクのまち
  - 諏訪湖の西岸
  naming_type: 一部の地名
  prefecture: 長野県
  homonyms: []
  summary: 岡谷市は諏訪湖の西岸、天竜川の源流に位置する工業都市で、市名は旧岡谷村の名を受け継ぐ。1936年、製糸業で栄えながら恐慌に苦しむ平野村が、多角的工業都市として再出発するために、町制を経ずに村から一気に市制を施行して岡谷市となった。村のまま市制を施行した例は長野県で唯一である。
  first_attestation:
    era: （未確認）
    year_western: null
    document: （未確認）
    note: 岡谷村は明治7年（1874年）の合併で平野村の一部となった旧村として市公式資料に名がみえるが、それ以前の「岡谷」の初出は確認できなかった
  claims:
  - text: 明治7年（1874年）10月13日に、諏訪郡の岡谷村・小口村・小井川村・今井村・若宮新田村・小梅沢新田村・西堀村の7ヵ村が合併して平野村となった
    kind: fact
    level: E2
    status: established
    sources:
    - v2-okaya-intro
  - text: 昭和11年（1936年）4月1日に、諏訪郡平野村が改称・市制施行して岡谷市が発足した。村が町制を経ずに市制施行したのは長野県では唯一で、全国でも11例のみである
    kind: fact
    level: E2
    status: established
    sources:
    - v2-okaya-intro
  - text: 市名「岡谷」は、平野村を構成した7ヵ村の一つである岡谷村の名である
    kind: fact
    level: E2
    status: established
    sources:
    - v2-okaya-intro
  - text: 製糸業で栄えた平野村は当時「村として日本一人口が多かった」が、世界恐慌の打撃を受けて不況に苦しんでおり、多角的工業都市として再出発し人心の一新を図るため、町制を経ずに一気に市制施行を選んだ
    kind: fact
    level: E2
    status: established
    sources:
    - v2-okaya-intro
  - text: その後、昭和30年（1955年）に湊村・川岸村を、昭和32年（1957年）に長地村を合併した
    kind: fact
    level: E2
    status: established
    sources:
    - v2-okaya-intro
  - text: 岡谷市は諏訪湖の西岸に面し、諏訪湖唯一の流出河川である天竜川はここから発して遠く浜松に達する
    kind: fact
    level: E2
    status: established
    sources:
    - v2-okaya-intro
  - text: 岡谷市の地方公共団体コードは202045である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 「日本一人口の多い村」の賭け
    text: 1936年の岡谷市誕生の裏には、製糸の町の危機があった。平野村は生糸の輸出で栄え、村でありながら日本一の人口を抱えるほどだったが、世界恐慌で生糸価格が暴落し、村政は行き詰まった。そこで選ばれたのが、町を経ずに村から一足飛びに市になるという再出発だった。長野県で唯一、全国でも11例しかない異例の市制施行である。新しい市の名には、合併前の7ヵ村の一つ「岡谷」が選ばれた。危機を名付け替えで乗り切ろうとした、製糸の町の決断だった。
    sources:
    - v2-okaya-intro
  relations:
  - pref/20
  unknowns:
  - 「岡谷」という地名自体の語源（岡と谷の地形に由来するか等）を専門資料で確認できなかった
  - 岡谷村の名の初出文献を確認できなかった
  - 平野村の改称先として岡谷村の名が選ばれた経緯（選定過程の記録）を確認できなかった
  updated: '2026-11-13'
