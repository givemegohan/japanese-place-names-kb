    sources:
    - q5-naruto-meisho
  - text: 中心市街の撫養（むや）は古代からの港町で、『阿波国風土記』逸文には「牟夜戸」と見え、平城宮跡出土木簡にも「牟屋」と表れることが『日本歴史地名大系』に紹介されており、牟夜（牟屋）がのちの撫養である
    kind: fact
    level: E3
    status: established
    sources:
    - q5-muya-kotobank
  - text: 撫養の語源については、港に船をつなぐ意の「もやい」の転訛とする説と、古代の官道・南海道の水駅として設けられた「室屋」の転訛とする説がある
    kind: fact
    level: E3
    status: contested
    sources:
    - q5-muya-kotobank
  - text: 1967年（昭和42年）に大麻町を編入して現在の市域となり、市役所は旧撫養町の撫養町南浜に置かれている。市の中心は海峡沿いの鳴門町地区ではなく撫養にある
    kind: fact
    level: E2
    status: established
    sources:
    - q5-tokushima-pref-naruto
    - q5-naruto-city-history
  column:
    title: 2か月だけ存在した「鳴南市」
    text: 1947年の合併で生まれた市の最初の名前は「鳴南市（めいなんし）」だった。中心市街の撫養町と、渦潮観光で名を売る鳴門町。どちらの名を市名にするかで調整が難航し、「撫養鳴門市」という折衷案まで出た末の妥協が鳴南市だったと伝えられる。ところがこの名は市民に不評で、発足からわずか2か月で「鳴門市」に改称された。妥協の産物ではなく、誰もが知る海峡の名を選んだ方が早かった、という決着である。市役所はいまも撫養にあり、地図の上では「鳴門」の原点（海峡）と市の中心がずれている点も、この市の面白さである。
    sources:
    - q5-naruto-wiki
    - q5-naruto-city-history
  relations:
  - pref/36
  unknowns:
  - 海峡名「鳴門」の文献上の初出（「鳴戸」表記を含む）は確認できていない
  - 「鳴南市」の「南」の字が何を意味したのかは確定できる資料で確認できていない（徳島新聞の解説は「鳴門の南」の意味のようだと推測している）
  - 撫養の語源について「もやい」説と「室屋」説のどちらが正しいかは決着していない
  - 『日本書紀』『土佐日記』にいう「あはのみと」の具体的な条文は原典で確認していない（市公式解説の紹介による）
  updated: '2026-11-13'
