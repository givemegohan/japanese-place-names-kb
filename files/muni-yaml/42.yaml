prefecture_code: '42'
records:
- id: muni/42-五島市
  code: '422118'
  names:
    ja: 五島市
    reading: ごとうし
    aliases:
    - 福江市
    - 福江町
  user_terms:
  - 五島列島の市
  - 下五島の中心
  - 福江（旧市名）のまち
  - ごとう
  naming_type: 旧国名・広域地名の採用
  formation: 合併新設
  prefecture: 長崎県
  homonyms: []
  summary: 平成16年（2004年）8月1日、福江市と南松浦郡の富江町・玉之浦町・三井楽町・岐宿町・奈留町が新設合併して発足した市。市名は五島列島の名をそのまま採ったもので、列島は福江島・久賀島・奈留島・若松島・中通島の五つの主島を中心とすることから「五島」と呼ばれる。市域はこのうち南部の下五島にあたり、旧中心地の福江は五島藩（福江藩）の城下町だった。
  first_attestation:
    era: null
    year_western: null
    document: null
    note: 「五島」の確かな初出は確認できなかった。古くは平戸島とともに値嘉郷（ちかのさと）と呼ばれたことを『日本大百科全書』が紹介している
  claims:
  - text: 五島市の地方公共団体コードは422118である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  - text: 五島市は平成16年（2004年）8月1日、福江市・富江町・玉之浦町・三井楽町・岐宿町・奈留町の1市5町の新設合併で誕生した
    kind: fact
    level: E2
    status: established
    sources:
    - r6-goto-shisei
  - text: 新市名は最終候補の「五島」「下五島」「五島福江」「五島列島」「五島椿」の5点から「五島」に決定された
    kind: fact
    level: E4
    status: established
    sources:
    - r6-goto-uub
  - text: 五島列島は福江島・久賀島・奈留島・若松島・中通島の五つの主島と約200の属島からなり、この五つの主島を中心とする構成が「五島」の名の由来とされる
    kind: fact
    level: E3
    status: established
    sources:
    - r6-goto-kotobank
    - r6-goto-pref-gaiyo
  - text: 現在の五島市域は下五島にあたり、奈留島以北の上五島は南松浦郡新上五島町で、市名の「五島」は列島全体の名を採りながら市域は列島の南部にとどまる
    kind: fact
    level: E3
    status: established
    sources:
    - r6-goto-kotobank
  - text: 五島列島は古くは平戸島とともに値嘉郷（ちかのさと）と呼ばれ、大陸に最も近い位置から遣唐使の寄港地となるなど対外関係の要地だったと『日本大百科全書』は紹介する
    kind: fact
    level: E3
    status: established
    sources:
    - r6-goto-kotobank
  - text: 五島市は遣唐使船最後の寄港地として栄えた島であると市は紹介している
    kind: fact
    level: E2
    status: established
    sources:
    - r6-goto-shisei
  - text: 旧福江市は昭和29年（1954年）に福江町・奥浦村・崎山村・本山村・大浜村の合併で発足し、江戸時代は五島藩（福江藩）の城下町だった福江を中心とする
    kind: fact
    level: E3
    status: established
    sources:
    - r6-goto-kotobank
    - r6-goto-uub
  column:
    title: 候補に残った「五島椿」という名前
    text: 2004年の合併で新市名の最終候補に残ったのは、「五島」「下五島」「五島福江」「五島列島」と、島の花である椿を組み込んだ「五島椿」の5点だった。選ばれたのは最も簡素な「五島」で、列島全体の名を市名に掲げることになった。ただし市域は下五島のみで、上五島は新上五島町として別れたため、「五島市」は五島列島の全部ではなく南部を占める市の名として今日使われている。
    sources:
    - r6-goto-uub
    - r6-goto-kotobank
  relations:
  - pref/42
  - muni/42-新上五島町
  unknowns:
  - 「五島」という列島名の確かな初出（文献名と年代）は確認できなかった
  - 旧中心地「福江」という地名自体の語源は確認できなかった
  - 新市名の公募件数など選定過程の詳細は、合併協議会の一次資料では確認できなかった（変遷情報データベースの記録による）
  updated: '2026-11-13'
- id: muni/42-佐々町
  code: '423912'
  names:
    ja: 佐々町
    reading: さざちょう
    aliases: []
  user_terms:
  - さざ
  - 佐々川の町
  naming_type: 中心地名の継承
  formation: 合併新設
  prefecture: 長崎県
  homonyms: []
  summary: 長崎県北松浦郡の町で、佐々川が町の中央を貫流する。明治22年（1889年）に佐々村と市瀬村が合併して佐々村となり、昭和16年（1941年）1月1日に町制を施行した。かつては北松炭田の炭鉱で栄え、現在は佐世保市の近郊の町として人口を保っている。
  first_attestation:
    era: null
    year_western: null
    document: null
    note: 「佐々」の名が文献に現れる初出は確認できなかった。中世には宇野御厨のうちと想定され、志佐氏の勢力下にあったことが『日本歴史地名大系』に記される
  claims:
  - text: 総務省の全国地方公共団体コードで、佐々町の団体コードは423912と定められている
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  - text: 明治22年（1889年）4月に佐々村と市瀬村が合併して新しい佐々村となった
    kind: fact
    level: E2
    status: established
    sources:
    - r7-saza-town-gaiyo
    - r7-saza-pref-toukei
  - text: 昭和16年（1941年）1月1日に佐々村が町制を施行して佐々町となった
    kind: fact
    level: E2
    status: established
    sources:
    - r7-saza-town-gaiyo
  - text: 律令制下では松浦郡に属し、平安末期から鎌倉期には宇野御厨のうちであったと想定され、鎌倉期には志佐氏の勢力下にあった
    kind: fact
    level: E3
    status: established
    sources:
    - r7-saza-kotobank
  - text: 佐々川は町の中央を貫流して河口部の佐々浦に注ぐ川で、町はこの川の流域に開けている
    kind: fact
    level: E3
    status: established
    sources:
    - r7-saza-kotobank
    - r7-saza-pref-toukei
  - text: 「佐々」という地名の語源は、『日本歴史地名大系』の佐々町の項にも明示されておらず、現時点では確定できない
    kind: fact
    level: E3
    status: indeterminate
    sources:
    - r7-saza-kotobank
  column:
    title: 住民投票で消えた町名「さざなみ町」
    text: 平成の大合併では、佐々町と隣の小佐々町が合併し、両町の間を流れる佐々川の流れにちなんで新町名を「さざなみ町」とすることが決まっていた。しかし2005年の住民投票で合併そのものが否決され、「さざなみ町」は発足予定のまま実現しなかった。その後、小佐々町は2010年に佐世保市へ編入され、佐々町は単独の町として残った。地名の候補としてはよくできていただけに、幻の町名として語り継がれている。
    sources:
    - r7-saza-sazanami-wiki
  relations:
  - pref/42
  unknowns:
  - 「佐々」の語源と文献上の初出は確認できなかった
  - 佐々川の川名と集落名「佐々」のどちらが先に成立したかは確認できなかった
  updated: '2026-11-13'
- id: muni/42-佐世保市
  code: '422029'
  names:
    ja: 佐世保市
    reading: させぼし
    aliases: []
  user_terms:
  - 佐世保の名前の由来
  - 佐世保の軍港はいつできた
  - 村から一足とびに市になった
  - サセブの木って何
  naming_type: 中心地名の継承
  naming_note: 旧村名「佐世保」を継承し、村から直接市制を施行
  formation: 単独発足
  prefecture: 長崎県
  homonyms: []
  summary: 明治初期までは大村湾の奥の村にすぎなかった佐世保が、海軍鎮守府の設置で軍港都市として急成長し、1902年に村から一足とびに市制を施行した。「佐世保」という地名の由来には定説がなく、木の名に由来する説と、「狭瀬＋保（中世の行政単位）」とする説などが市史に併記されている。
  first_attestation:
    era: null
    year_western: null
    document: 「佐世保」という地名（「保」は中世の行政単位に由来するとの説がある）
    note: 地名の確実な初出年は確認できなかった。1902年の市制施行時点では佐世保村の村名として定着していた
  claims:
  - text: 1902年（明治35年）4月、佐世保村は村から一足とびに市制を施行して佐世保市となった。当時は7,700世帯・人口約45,800人に達していた（地方公共団体コードは422029）
    kind: fact
    level: E2
    status: established
    sources:
    - k6-sasebo-city-seigaiyou
    - b-cap-chiba-soumu-code
  - text: 急成長の契機は1886年（明治19年）の海軍鎮守府の設置決定と1889年（明治22年）の鎮守府開庁で、それまで佐世保は大村湾口よりさらに深奥の村にすぎなかったと佐世保市は説明する
    kind: fact
    level: E2
    status: established
    sources:
    - k6-sasebo-city-seigaiyou
  - text: 地名「佐世保」の由来については定説と呼ばれるものがなく、佐世保市立図書館は『佐世保市史』総説篇などに基づいて諸説を紹介している
    kind: fact
    level: E2
    status: established
    sources:
    - k6-sasebo-ndl-crd
  - text: 由来の一説として、この地に「サセブ」と呼ばれる木（和名シャシャンボ、古名サシブノキ）が繁茂していたからとする説が市史に記されている
    kind: fact
    level: E2
    status: contested
    sources:
    - k6-sasebo-ndl-crd
  - text: もう一つの説として、「佐世（サセ）」は狭い川瀬を意味する「狭瀬（サセ）」で、「保」は中世の行政単位の一つであるとする説がある
    kind: fact
    level: E2
    status: contested
    sources:
    - k6-sasebo-ndl-crd
  - text: 1945年（昭和20年）の空襲と終戦で軍港としての機能を失った後は、旧軍港の遺産を活用する平和産業港湾都市への転換が進められた
    kind: fact
    level: E2
    status: established
    sources:
    - k6-sasebo-city-seigaiyou
  column:
    title: 村から一足とびに市へ——軍港が作った都市
    text: 普通、市になるにはまず町になる段階を踏む。ところが佐世保は、1902年に村から直接、市になった。理由は単純で、海軍鎮守府が置かれてから十数年の間に、湾奥の寒村へ人が殺到したからである。地名の由来が定まらないのも、この都市の性格を映している。城下町のように長い時間をかけて名が育ったのではなく、軍港という国家事業が先に来て、まちが後から膨らんだ。その出発点の古い地名の記憶は、市史にも諸説併記の形でしか残らなかった。
    sources:
    - k6-sasebo-city-seigaiyou
    - k6-sasebo-ndl-crd
  relations:
  - pref/42
  unknowns:
  - 「佐世保」の文献上の確実な初出（中世文書での用例）は確認できなかった
  - 「佐世」という小字・人名との関係（佐世氏説の有無）は市史総説篇の直接確認が未了
  updated: '2026-11-13'
- id: muni/42-南島原市
  code: '422142'
  names:
    ja: 南島原市
    reading: みなみしまばらし
    aliases:
    - 有家町
    - 南有馬町
    - 深江町
  user_terms:
  - 島原半島の南の市
  - 原城跡のある市
  - 島原・天草一揆の地
  - そうめんのまち（手延そうめん）
  naming_type: 方位・位置による命名
  formation: 合併新設
  prefecture: 長崎県
  homonyms: []
  summary: 平成18年（2006年）3月31日、深江町・布津町・有家町・西有家町・北有馬町・南有馬町・口之津町・加津佐町の8町が対等合併して発足した市。市名は島原半島の南部に位置することによる方角地名で、新市名の最終候補は「原城」と「南島原」の2点だった。古代に高来郡、明治11年（1878年）以降は南高来郡に属した地域で、島原・天草一揆の原城跡を市域に持つ。
  first_attestation:
    era: 奈良時代
    year_western: 713
    document: 『肥前国風土記』
    note: 市名そのものの初出は平成18年（2006年）の発足時。ここでは市域を指す古い地名として、8世紀の『肥前国風土記』に記された「高来郡」の用例を市公式が紹介していることを記す（原文は未確認のため紹介形）
  claims:
  - text: 南島原市の地方公共団体コードは422142である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  - text: 南島原市は平成18年（2006年）3月31日、深江町・布津町・有家町・西有家町・北有馬町・南有馬町・口之津町・加津佐町の8町の対等合併で発足した
    kind: fact
    level: E2
    status: established
    sources:
    - r6-minamishimabara-city
  - text: 新市名は公募上位に「原城」「南島原」などが入り、最終候補は「原城（はらじょう）」と「南島原」の2点で、「南島原市」に決定された
    kind: fact
    level: E4
    status: established
    sources:
    - r6-minamishimabara-uub
  - text: 市名の「南島原」は、島原半島の南部に位置することによる方角の名で、半島北部の島原市とは別の市である
    kind: fact
    level: E4
    status: established
    sources:
    - r6-minamishimabara-uub
    - r6-minamishimabara-city
  - text: 市域は古代には高来郡に属し、市公式は8世紀の『肥前国風土記』に島原半島が「高来郡」と記されていることを紹介している
    kind: fact
    level: E2
    status: established
    sources:
    - r6-minamishimabara-city
  - text: 明治11年（1878年）の郡区町村編制で高来郡が南北に分かれ、市域は南高来郡となった
    kind: fact
    level: E2
    status: established
    sources:
    - r6-minamishimabara-city
  - text: 市域の南有馬町には寛永14年（1637年）の島原・天草一揆で一揆軍が籠城した原城跡があり、新市名の最終候補に「原城」が残った背景にはこの史跡の知名度がある
    kind: fact
    level: E2
    status: established
    sources:
    - r6-minamishimabara-city
    - r6-minamishimabara-uub
  column:
    title: あと一歩で「原城市」だった
    text: 2006年の合併で新市名の最終候補に残ったのは2点。「南島原」と、島原・天草一揆の舞台である「原城（はらじょう）」だった。公募の上位にも「有馬」「普賢」「南雲仙」など土地の名が並ぶ中で、選ばれたのは半島の南という位置を示す無難な方角地名のほうである。もし原城が選ばれていれば、市名そのものが一揆の記憶を背負う、全国でも珍しい市名になっていた。方角の名に落ち着いたことで、市は8町すべての住民が受け入れやすい名を得たともいえる。
    sources:
    - r6-minamishimabara-uub
    - r6-minamishimabara-city
  relations:
  - pref/42
  - muni/42-島原市
  - muni/42-雲仙市
  unknowns:
  - 旧中心地の「有家」「有馬」という地名自体の語源は確認できなかった
  - 新市名の最終決定が住民投票・協議会投票のいずれで行われたかは確認できなかった
  - 市名の選定理由を記した合併協議会の一次資料は確認できなかった（変遷情報データベースの記録による）
  updated: '2026-11-13'
- id: muni/42-壱岐市
  code: '422100'
  names:
    ja: 壱岐市
    reading: いきし
    aliases:
    - 一支国
    - 一大国
    - 伊伎島
    - 壱州
    - 郷ノ浦町
  user_terms:
  - 一支国の島
  - いき
  - 原の辻遺跡のある島
  - 壱州（いっしゅう）
  naming_type: 旧国名・広域地名の採用
  formation: 合併新設
  prefecture: 長崎県
  homonyms: []
  summary: 平成16年（2004年）3月1日、郷ノ浦町・勝本町・芦辺町・石田町が合併して発足した、壱岐島全域を市域とする市。市名は律令制の国名「壱岐」を継ぐもので、島は3世紀の史書に「一大国」（『梁書』『隋書』では「一支国」）として現れ、『古事記』には「伊伎島」と記される。対馬とともに邪馬台国へ向かう海の道の要衝だった。
  first_attestation:
    era: 3世紀後半
    year_western: null
    document: 『三国志』魏書東夷伝倭人条（魏志倭人伝）
    note: 「一大国」として現れるのが史料上の初見とされ、『梁書』『隋書』では「一支国」と記される（いずれもWikisourceの転写テキストで確認）
  claims:
  - text: 壱岐市の地方公共団体コードは422100である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  - text: 壱岐市は平成16年（2004年）3月1日、郷ノ浦町・勝本町・芦辺町・石田町の4町の合併で発足し、壱岐郡は消滅した
    kind: fact
    level: E2
    status: established
    sources:
    - r6-iki-city-ayumi
  - text: 文化庁の日本遺産ストーリーは、壱岐の原の辻遺跡を『魏志倭人伝』の一支国の「王都」と位置づけ、海上交易で栄えた国際交流の拠点だったと紹介している
    kind: fact
    level: E2
    status: established
    sources:
    - r6-heritage-kokkyo
  - text: 壱岐の史料上の初見は『三国志』魏志倭人伝の「一大国」とされ、『梁書』『隋書』では「一支国」と記される（いずれもWikisourceの転写テキストで確認）
    kind: fact
    level: E2
    status: established
    sources:
    - upg-ab4-sangokushi-wikisource
    - upg-ab4-ryosho-wikisource
    - upg-ab4-zuisho-wikisource
  - text: 古くは伊伎（『古事記』）・伊吉（『先代旧事本紀』国造本紀）・壱伎（『続日本紀』）などと表記が一定せず、『万葉集』にはユキと読む表記も見られるなど、表記と読みは長く定まらなかったと『日本歴史地名大系』「壱岐国」が紹介する
    kind: fact
    level: E3
    status: established
    sources:
    - upg-af6-iki-kotobank-taikei
  - text: 『古事記』上巻の国生み神話では、伊耶那岐・伊耶那美の二神が生んだ大八島の一つとして「伊伎島」が挙げられる（Wikisourceの転写テキストで確認）
    kind: fact
    level: E2
    status: established
    sources:
    - upg-z4-kojiki-wikisource
  - text: 江戸時代は平戸藩領だった壱岐は、明治4年（1871年）の廃藩置県で平戸県となり、同年11月に長崎県の管轄となった
    kind: fact
    level: E2
    status: established
    sources:
    - r6-iki-city-ayumi
  - text: 壱岐国の国府は石田郡にあったとされるが、所在地は確定しておらず遺跡も見つかっていない
    kind: fact
    level: E2
    status: indeterminate
    sources:
    - upg-af6-iki-kihonkousou
  column:
    title: 市の博物館は「一支国」の名を受け継ぐ
    text: 壱岐市の市名は律令国の「壱岐」だが、市立博物館の名は「一支国博物館」という。3世紀の史書でこの島を指したもう一つの古い名を、現代の施設が掲げているのである。『三国志』の通行本では「一大国」、他の史書では「一支国」と、古代の史料の間でも表記が揺れた島の名は、最終的に「壱岐」の二字に定着したが、「一支国」のほうも原の辻遺跡の往時の都の名として島に生き続けている。
    sources:
    - r6-iki-wiki
    - r6-heritage-kokkyo
  relations:
  - pref/42
  - muni/42-対馬市
  unknowns:
  - 「いき」の語源の確定説は確認できなかった
  - 合併時の市名選定の過程（公募の有無・候補名）は市公式資料で確認できなかった
  updated: '2026-11-13'
- id: muni/42-大村市
  code: '422053'
  names:
    ja: 大村市
    reading: おおむらし
    aliases: []
  user_terms:
  - 大村純忠の城下町
  - 長崎空港のある市
  - 大村湾の市
  naming_type: 中心地名の継承
  naming_note: 中世の地名「大村」に由来し、大村藩の城下町として継承された
  formation: 合併新設
  prefecture: 長崎県
  homonyms: []
  summary: 市名は中世の地名「大村」に由来し、名字の大村氏はこの地名を名乗った側である。1320年の文書に「当庄大村」と見え、鎌倉末期には大村を称する複数の家があった。994年に藤原直澄が入部して以来、大村氏は幕末まで同じ土地を治め、大村純忠は日本初のキリシタン大名として知られる。1942年に大村町と5村が合併して市制を施行した。
  first_attestation:
    era: 鎌倉時代
    year_western: 1320
    document: 東福寺領肥前国彼杵庄文書目録案（「当庄大村」）
    note: 『日本歴史地名大系』が紹介する中世文書による。これより古い用例の有無は未確認
  claims:
  - text: 『日本歴史地名大系』によれば、「大村」は中世より見える地名で、はじめ彼杵庄のうちとして現れ、元応2年（1320）の東福寺文書に「当庄大村」と見える
    kind: fact
    level: E3
    status: established
    sources:
    - r5-omura-kotobank
  - text: 『日本歴史地名大系』によれば、鎌倉末期の彼杵庄内には大村を名字とする勢力が複数確認でき、正応2年（1289）に元寇の恩賞を受けた大村家信もその一つで、名字は地名に由来すると考えられる
    kind: fact
    level: E3
    status: established
    sources:
    - r5-omura-kotobank
  - text: 『日本大百科全書（ニッポニカ）』によれば、正暦5年（994年）に藤原直澄が久原城に入部して以来、大村氏は幕末まで同じ土地を治め続け、大村藩2万8000石の城下町となった
    kind: fact
    level: E2
    status: established
    sources:
    - r5-omura-kotobank
  - text: 『日本大百科全書（ニッポニカ）』によれば、戦国時代の大村純忠はポルトガルとの交易を行って大村を繁栄させた
    kind: fact
    level: E2
    status: established
    sources:
    - r5-omura-kotobank
  - text: 大村市公式の市史によれば、大村純忠は日本初のキリシタン大名とされ、天正遣欧少年使節も大村とかかわりが深い
    kind: fact
    level: E2
    status: established
    sources:
    - r5-omura-city-shishi
  - text: 大村市公式の市史によれば、大村市は1942年（昭和17年）2月11日に大村町・萱瀬村・福重村・松原村・三浦村・鈴田村の1町5村が合併して誕生した
    kind: fact
    level: E2
    status: established
    sources:
    - r5-omura-city-shishi
  - text: 地方公共団体コードは422053である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 千年、領主が変わらなかった城下町
    text: 城下町はふつう、領主が替わるたびに姿を変える。だが大村は違った。994年に藤原直澄が入って以来、幕末までの約870年間、同じ大村氏がこの地を治め続けた。『日本大百科全書』が「領主の変わらない城下町はきわめてまれ」と評するゆえんである。その大村氏が名乗った「大村」は、もともと土地の名だった。1320年の文書に残る「当庄大村」が示すように、地名が先にあり、人がそれを名字にした。戦国期の大村純忠がキリシタン大名となり、南蛮貿易で大村湾の港を賑わせたのも、その千年続く地名の上でのことだった。
    sources:
    - r5-omura-kotobank
    - r5-omura-city-shishi
  relations:
  - pref/42
  unknowns:
  - 「大村」の語源（大きな村落にちなむ通称的な名か等）は専門資料で確認できなかった
  - 1320年より古い「大村」の用例があるかは未確認
  updated: '2026-11-13'
- id: muni/42-対馬市
  code: '422096'
  names:
    ja: 対馬市
    reading: つしまし
    aliases:
    - 津島
    - 対州
    - 厳原町
  user_terms:
  - 国境の島
  - つしま
  - 対州（たいしゅう）
  - 厳原（中心地の旧町名）
  naming_type: 島名の継承
  formation: 合併新設
  prefecture: 長崎県
  homonyms: []
  summary: 平成16年（2004年）3月1日、島内の厳原町・美津島町・豊玉町・峰町・上県町・上対馬町の6町が合併して発足した、対馬島全域を市域とする市。市名は律令制の国名であり島名でもある「対馬」を継いだもので、「対馬」は3世紀の『魏志倭人伝』に「対馬国」として現れる古い名である。古くは「津島」とも書かれ、朝鮮半島との国境の島として防人・対馬藩・朝鮮通信使の歴史を重ねてきた。
  first_attestation:
    era: 3世紀後半
    year_western: null
    document: 『三国志』魏書東夷伝倭人条（魏志倭人伝）
    note: 「対馬国」としての初出とされる。現存最古の版である紹煕本では「対海国」と表記されるとWikipedia「対馬国」が紹介している（原文そのものは未確認のため紹介形で記録）
  claims:
  - text: 対馬市の地方公共団体コードは422096である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  - text: 対馬市は平成16年（2004年）3月1日、厳原町・美津島町・豊玉町・峰町・上県町・上対馬町の島内6町の合併で成立し、対馬島の全域が一つの市となった
    kind: fact
    level: E3
    status: established
    sources:
    - r6-tsushima-kotobank
  - text: 新市名は公募の最終候補「対馬」「つしま」「国境（こっきょう）」の3点から「対馬」に決定された
    kind: fact
    level: E4
    status: established
    sources:
    - r6-tsushima-uub
  - text: 対馬は『魏志倭人伝』に「対馬国」として記され、文化庁の日本遺産ストーリーは、朝鮮半島から対馬・壱岐を経て邪馬台国を目指した中国の使節の航路を、その記述に重ねて紹介している
    kind: fact
    level: E2
    status: established
    sources:
    - r6-heritage-kokkyo
  - text: 『三国志』魏志倭人伝は対馬国について「所居は絶島、方可四百余里、土地は山険しく深林多く、道路は禽鹿の径のごとく、千余戸あり、良田なく海物に食して自活し、船に乗り南北市糴す」と記している（Wikisourceの転写テキストで確認）
    kind: fact
    level: E2
    status: established
    sources:
    - upg-ab4-sangokushi-wikisource
  - text: 対馬は古くは「津島」とも書かれたと『デジタル大辞泉』が補説する
    kind: fact
    level: E3
    status: established
    sources:
    - r6-tsushima-kotobank
  - text: 天智天皇3年（664年）に対馬に防人と烽（とぶひ）が置かれ、鎌倉時代中期から宗氏が島を支配して、室町・江戸時代を通じて朝鮮貿易の特権を握ったと『精選版日本国語大辞典』は紹介する
    kind: fact
    level: E3
    status: established
    sources:
    - r6-tsushima-kotobank
  - text: 「つしま」の語源については確定した説が専門辞典に見当たらず、「津島」の表記との関係を含め決められない
    kind: fact
    level: E5
    status: indeterminate
    sources:
    - r6-tsushima-kotobank
    - r6-tsushima-wiki-kuni
  column:
    title: 「国境市」になりかけた対馬市
    text: 2004年の合併で新市名の最終候補に残ったのは、「対馬」「つしま」、そして読みまで添えられた「国境（こっきょう）」の3点だった。朝鮮半島まで約50キロという位置を、そのまま市名にしようという案が最終段階まで残ったことになる。選ばれたのは3世紀の史書にまで遡る「対馬」で、市名は島の通称ではなく律令国の名を継ぐ形に落ち着いた。なお「国境の島」は現在、日本遺産「国境の島 壱岐・対馬・五島」の題名として生きている。
    sources:
    - r6-tsushima-uub
    - r6-heritage-kokkyo
  relations:
  - pref/42
  - muni/42-壱岐市
  unknowns:
  - 「つしま」の語源の確定説は確認できなかった
  - 対馬国府の厳原への比定は広く知られるが、出典範囲では公的資料で直接確認できなかったため主張に入れていない
  - 新市名公募の応募総数は確認できなかった（最終候補の記録は変遷情報データベースによる）
  updated: '2026-11-13'
- id: muni/42-小値賀町
  code: '423831'
  names:
    ja: 小値賀町
    reading: おぢかちょう
    aliases:
    - 小値賀島
    - 値賀島
  user_terms:
  - おぢか
  - 小値賀島
  - 値賀島
  - 五島の島町
  naming_type: 中心地名の継承
  formation: 合併新設
  prefecture: 長崎県
  homonyms: []
  summary: 長崎県北松浦郡の町で、五島列島北部の小値賀島を中心に大小17の島からなる。「値賀（ちか）」は古代に遡る名で、『古事記』の国生みでは五島列島が「知訶島」と生まれたとされ、『肥前国風土記』には近く見える島を「近島（値嘉）」と名付けたという説話が残る。大正15年（1926年）に3村が合併して小値賀村となり、昭和15年（1940年）に町制を施行した。
  first_attestation:
    era: 奈良時代
    year_western: 712
    document: 『古事記』上巻・国生みの段（「知訶島」）
    note: 五島列島全体を指す名としての初出であり、現在の小値賀島だけを指す名ではない。小値賀島単独の名の初出は、風土記の説話で第一の島を「小近（おちか）」と呼んだとする伝承の層に属する
  claims:
  - text: 総務省の全国地方公共団体コードで、小値賀町の団体コードは423831と定められている
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  - text: 『古事記』の国生み神話では、五島列島は「知訶島（ちかのしま）」の名で生まれた島とされ、その亦名を天之忍男というと、國學院大學の神名データベースが紹介している
    kind: fact
    level: E2
    status: established
    sources:
    - r7-ojika-kokugakuin-shinmei
  - text: 『肥前国風土記』の松浦郡の条（現存せず他書に伝わる逸文）には値嘉郷の名の起こりとして、景行天皇が志々伎の行宮から西の海を見て、遠くにあるのに近く見える島を「近島」というがよいと言って「値嘉」と名付けたとする話が記されていると、國學院大學の研究資料が紹介している
    kind: legend
    level: E2
    status: established
    sources:
    - r7-ojika-kokugakuin-manyo
  - text: 値嘉島の島々のうち小さい方を「小近（おちか、のち小値賀）」島、大きい方を「大近（おおちか、のち大値賀）」島と呼び、のちに小値賀・大値賀の表記が通用するようになった
    kind: fact
    level: E3
    status: established
    sources:
    - r7-ojika-kotobank-chika
  - text: 『延喜式』では日本の最西端として「西方遠値嘉」と記され、遣唐使の南路では博多大津を出て値嘉島の諸島で順風を待つ寄港地だったと、角川日本地名大辞典が記している
    kind: fact
    level: E3
    status: established
    sources:
    - r7-ojika-kakugawa
  - text: 大正15年（1926年）4月1日に笛吹村・前方村・柳村の3村が合併して小値賀村となった
    kind: fact
    level: E2
    status: established
    sources:
    - r7-nagasaki-toukei-enkaku
  - text: 昭和15年（1940年）2月11日に小値賀村が町制を施行して小値賀町となった
    kind: fact
    level: E2
    status: established
    sources:
    - r7-ojika-town-yoran
  - text: 平成の大合併では近隣自治体との合併を選択せず、単独で存続する道を選んだ
    kind: fact
    level: E2
    status: established
    sources:
    - r7-ojika-ndl-report
  column:
    title: 日本の西の果ての標識だった「値嘉」
    text: 平安時代の『延喜式』は日本の西の果てを「西方遠値嘉」と記した。値嘉島は遣唐使船が博多を出て順風を待つ最後の寄港地で、万葉集には山上憶良がこの地で詠んだ「値嘉の崎」の歌が残る。国生みの神話の「知訶島」から遣唐使の時代まで、値賀の名は日本列島の西端を示す標識であり続けた。現在の読み「おぢか」は、古代の「おちか」に由来する音の変化をそのまま残している。
    sources:
    - r7-ojika-kakugawa
    - r7-ojika-kokugakuin-manyo
  relations:
  - pref/42
  - muni/41-玄海町
  unknowns:
  - 小値賀島だけを指す「小近（おちか）」の名が現れる最古の文書は確認できなかった
  - 「おちか」から「おぢか」への音変化がいつ頃起きたかは確認できなかった
  updated: '2026-11-13'
- id: muni/42-島原市
  code: '422037'
  names:
    ja: 島原市
    reading: しまばらし
    aliases:
    - 嶋原
  user_terms:
  - 島原の乱の市
  - 島原城のある市
  - しまばらって何と読む
  naming_type: 中心地名の継承
  naming_note: 中世以来の地名「島原」を継承して市制を施行
  formation: 編入合併
  prefecture: 長崎県
  homonyms: []
  summary: 市名は中世から見える地名「島原」に由来する。16世紀にはキリシタン史料にも現れ、1618年から松倉重政が島原城を築いて城下町が形成された。1637年の島原の乱で名は全国に知られた。1940年に島原町・安中村・杉谷村が合併して市制を施行した。「島原」の語源に定説はない。
  first_attestation:
    era: 戦国時代
    year_western: null
    document: 永禄9年（1566）のルイス・デ・アルメイダ書簡など中世史料
    note: 『日本歴史地名大系』は地名が中世より見えると記すが、初出の特定はできなかった
  claims:
  - text: 『日本歴史地名大系』によれば、「島原」の地名は中世より見え、永禄9年（1566）に島原へ初めて宣教したアルメイダの書簡や文禄元年（1592）の布教機関の記録にも「島原」の名が現れる
    kind: fact
    level: E3
    status: established
    sources:
    - r5-shimabara-kotobank-mura
  - text: 島原市公式サイトによれば、城下町としての島原の歴史は元和4年（1618）から7年の歳月をかけ松倉重政が島原城を築城したときに始まり、以後は松平7万石の城下町として島原半島の中枢となった
    kind: fact
    level: E2
    status: established
    sources:
    - r5-shimabara-city-gaiyo
  - text: 島原市公式サイトによれば、寛永14年（1637）に松倉勝家の苛政とキリシタン弾圧に対する「島原の乱」が起こり、この地名は騒乱の名として全国に知られるようになった
    kind: fact
    level: E2
    status: established
    sources:
    - r5-shimabara-city-gaiyo
  - text: 島原市は1940年（昭和15年）4月1日に島原町・安中村・杉谷村が合併して市制を施行し、1955年（昭和30年）に三会村、2006年（平成18年）1月1日に有明町を編入した
    kind: fact
    level: E2
    status: established
    sources:
    - r5-shimabara-city-gaiyo
  - text: 島原市公式サイトによれば、寛政4年（1792）には眉山が大崩壊して津波が発生し、島原領内でも多数の死者が出る大災害となった
    kind: fact
    level: E2
    status: established
    sources:
    - r5-shimabara-city-gaiyo
  - text: 地方公共団体コードは422037である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 騒乱の名前になった城下町
    text: 「島原」という地名が全国に知れ渡ったのは、1637年の島原の乱によってである。築城からわずか20年ほどで、城下町の名は一揆の代名詞になった。さらに1792年には眉山が崩れて津波が対岸の肥後を襲い、「島原大変、肥後迷惑」という言い習わしまで生んだ。地名そのものの語源は今も判然としないが、半島全体が「島原半島」と呼ばれるようになったのは、この城下町の名の重みによる。1940年の市制施行時に懸賞で決められた市章は、4つの「マ」を配して「シマ」を表すという、名への愛着がうかがえる意匠だった。
    sources:
    - r5-shimabara-city-gaiyo
    - r5-shimabara-kotobank-mura
  relations:
  - pref/42
  unknowns:
  - 「島原」の語源（海に突き出た島のような原にちなむとする見方など）は専門辞典に確定的な説明がなく、定説を確認できなかった
  - 中世の初出とされる具体的な文書は特定できなかった
  updated: '2026-11-13'
- id: muni/42-川棚町
  code: '423220'
  names:
    ja: 川棚町
    reading: かわたなちょう
    aliases:
    - 河棚
  user_terms:
  - かわたな
  - 川棚川の町
  naming_type: 中心地名の継承
  formation: 合併新設
  prefecture: 長崎県
  homonyms: []
  summary: 長崎県東彼杵郡の町で、大村湾に面し川棚川が町の中央を流れる。中世の村名は「河棚村」とも書かれ、文化11年（1814年）に東川棚村と西川棚村が合併して川棚村となり、昭和9年（1934年）に町制を施行した。
  first_attestation:
    era: 中世
    year_western: null
    document: 河棚村の名（特定の初出文書は未確認）
    note: 『日本歴史地名大系』の河原城跡の項は現在地名の欄に中世の「河棚村」を示しており、中世には「河棚」の表記でこの地が呼ばれていたことがうかがえる
  claims:
  - text: 総務省の全国地方公共団体コードで、川棚町の団体コードは423220と定められている
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  - text: 文化11年（1814年）に東川棚村と西川棚村が合併して川棚村となった
    kind: fact
    level: E2
    status: established
    sources:
    - r7-kawatana-town-enkaku
  - text: 昭和9年（1934年）11月3日に川棚村が町制を施行して川棚町となった
    kind: fact
    level: E2
    status: established
    sources:
    - r7-nagasaki-toukei-enkaku
    - r7-kawatana-town-enkaku
  - text: 中世の村名は「河棚村」とも書かれ、川棚川の流域には川棚氏または河原氏の居城とされる河原城があった
    kind: fact
    level: E3
    status: established
    sources:
    - r7-kawatana-kotobank-kawara
  - text: 『肥前国風土記』の彼杵郡の条に見える、美しい玉を持つという篦簗（へらやな）の住む「川岸」は、川棚川の流域に比定されることがあると『日本歴史地名大系』が述べている
    kind: fact
    level: E3
    status: established
    sources:
    - r7-kawatana-kotobank-river
  - text: 昭和18年（1943年）に彼杵町小音琴郷の一部を編入し、昭和35年（1960年）と同37年（1962年）に波佐見町中山郷の一部を編入して現在の町域となった
    kind: fact
    level: E2
    status: established
    sources:
    - r7-kawatana-town-enkaku
  - text: 「川棚」という地名の語源を明示した公的・専門資料は確認できず、現時点では確定できない
    kind: fact
    level: E3
    status: indeterminate
    sources:
    - r7-kawatana-kotobank-river
  column:
    title: 風土記の「川岸」と玉の物語
    text: 『肥前国風土記』の彼杵郡の条には、この地に住む篦簗が美しい玉を持っていたという話が伝わる。『日本歴史地名大系』は、その舞台の「川岸」を川棚川の流域ともいうと紹介している。隣の東彼杵町にも、同じ風土記の条に出る「具足玉国」の献玉の物語が残っており、大村湾東岸のこの一帯は、古代の玉にまつわる伝承が集まる地域だったことが分かる。
    sources:
    - r7-kawatana-kotobank-river
    - r7-sonogi-rekishikan
  relations:
  - pref/42
  unknowns:
  - 「川棚」の語源（川沿いの棚田や台地に由来する説など）は裏付けのある資料で確認できなかった
  - 中世の「河棚」の表記が現れる最古の文書は確認できなかった
  updated: '2026-11-13'
- id: muni/42-平戸市
  code: '422070'
  names:
    ja: 平戸市
    reading: ひらどし
    aliases: []
  user_terms:
  - 西の都と呼ばれた港町
  - オランダ商館のある市
  - 潜伏キリシタンの島
  - ひらどって何と読む
  naming_type: 中心地名の継承
  naming_note: 2005年の新設合併で発足。市名は旧平戸市以来の「平戸」を継承
  formation: 合併新設
  prefecture: 長崎県
  homonyms: []
  summary: 市名は平戸島とその港町「平戸」に由来し、中世から松浦氏の拠点の湊として知られた。1550年のポルトガル船入港以来、オランダ・イギリス商館が置かれる国際港「西の都」として栄え、平戸藩の城下町となった。現在の平戸市は2005年に平戸市・生月町・田平町・大島村が新設合併して発足した。語源は「平たい門戸」とする説明があるが定説は未確定である。
  first_attestation:
    era: null
    year_western: null
    document: null
    note: 『日本歴史地名大系』は平戸湊が中世より湊として機能し松浦氏の拠点だったと記すが、「平戸」の初出文書は特定できなかった
  claims:
  - text: 「平戸」の語源について、国土交通省の平戸港資料は「平たい門戸」の意をもつ地名だと説明するが、専門辞典による語源の確定は確認できなかった
    kind: fact
    level: E2
    status: indeterminate
    sources:
    - r5-hirado-mlit-minato
  - text: 『日本歴史地名大系』によれば、平戸湊は中世より湊の機能があり、貿易の市として平戸松浦氏の拠点となっていた
    kind: fact
    level: E3
    status: established
    sources:
    - r5-hirado-kotobank-minato
  - text: 国土交通省の資料によれば、天文19年（1550）のポルトガル船入港に始まり、スペイン・オランダ・イギリスの船と商館が続き、長崎開港までの92年間、平戸は日本唯一の国際港として繁栄した
    kind: fact
    level: E2
    status: established
    sources:
    - r5-hirado-mlit-minato
  - text: 平戸市公式資料によれば、17世紀前半の平戸はオランダやイギリスの商館が置かれた開かれた国際都市で、「西の都」と呼ばれた
    kind: fact
    level: E2
    status: established
    sources:
    - r5-hirado-city-gikai
  - text: 平戸市公式資料によれば、2005年（平成17年）10月1日に平戸市・生月町・田平町・大島村の1市2町1村が合併し、新しい平戸市が誕生した
    kind: fact
    level: E2
    status: established
    sources:
    - r5-hirado-city-gikai
  - text: 初代の平戸市は1955年（昭和30年）1月1日に平戸町と中野村・獅子村・紐差村・中津良村・津吉村・志々伎村が新設合併し、市制を施行して発足した
    kind: fact
    level: E2
    status: established
    sources:
    - upg-ab4-nagasaki-gappei
  - text: 地方公共団体コードは422070である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 「西の都」と呼ばれた門戸の港
    text: 本土と平戸島のあいだの狭い海峡、平戸瀬戸を抜けると、奥に穏やかな入江が開ける。港の入口＝門戸にあたるこの地形が、「平戸」の名の由来とする説明がある。中世に松浦水軍の本拠となったこの港は、1550年にポルトガル船が入ってから約90年間、日本で唯一の国際貿易港だった。オランダ商館とイギリス商館が並び、ザビエルもここに上陸し、人々は平戸を「西の都」と呼んだ。1641年にオランダ商館が長崎の出島へ移されて国際港の時代は終わるが、港の名は藩名となり、やがて市の名として今に続いている。
    sources:
    - r5-hirado-mlit-minato
    - r5-hirado-city-gikai
  relations:
  - pref/42
  unknowns:
  - 「平戸」の語源は「平たい門戸」説のほかに諸説の検討ができておらず、専門辞典での確定は得られなかった
  - 「平戸」の初出とされる一次文献は特定できなかった
  updated: '2026-11-13'
- id: muni/42-新上五島町
  code: '424111'
  names:
    ja: 新上五島町
    reading: しんかみごとうちょう
    aliases: []
  user_terms:
  - しんかみごとう
  - 上五島
  - 五島列島の町
  naming_type: 新規命名
  formation: 合併新設
  prefecture: 長崎県
  homonyms: []
  summary: 長崎県南松浦郡の町で、五島列島の中通島・若松島などを町域とする。平成16年（2004年）8月1日に若松町・上五島町・新魚目町・有川町・奈良尾町の5町が合併して発足した。町名は地域名「上五島」に「新」を冠したもので、新町名の公募では「北五島」が1位だったが、最終候補の中から「新上五島」が選ばれた。
  first_attestation:
    era: 平成16年
    year_western: 2004
    document: 新上五島町の発足（合併による新町名として）
    note: 町名としての初出。地域名「上五島」自体はそれ以前から五島列島北東部を指す名として使われていた
  claims:
  - text: 総務省の全国地方公共団体コードで、新上五島町の団体コードは424111と定められている
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  - text: 平成16年（2004年）8月1日に若松町・上五島町・新魚目町・有川町・奈良尾町の5町が新設合併して新上五島町が発足した
    kind: fact
    level: E4
    status: established
    sources:
    - r7-shinkamigoto-uub
  - text: 五島列島は北東部を「上五島」、南西部を「下五島」と呼び分け、長崎県の資料では通常、旧奈良尾町以北または若松町以東を上五島、旧奈留町以南を下五島と称している
    kind: fact
    level: E2
    status: established
    sources:
    - r7-shinkamigoto-goto-gaiyo
  - text: 新町名の公募では「北五島」が1位となり、最終候補は海輝（かいき）・かみごとう・北五島・新上五島・つばきの5点だったが、合併協議会は「新上五島町」を新町名に決定した
    kind: fact
    level: E4
    status: established
    sources:
    - r7-shinkamigoto-uub
  - text: 明治22年（1889年）の町村制施行では上五島地域は8村で構成され、昭和の大合併によって若松町・上五島町・新魚目町などの町が生まれた
    kind: fact
    level: E2
    status: established
    sources:
    - r7-shinkamigoto-town
  - text: 前身の上五島町は昭和31年（1956年）に青方町と浜ノ浦村の合併で生まれ、2004年の合併で新上五島町の一部となった
    kind: fact
    level: E4
    status: established
    sources:
    - r7-shinkamigoto-uub
  column:
    title: 公募1位が敗れた町名
    text: 新上五島町の町名は、住民公募では「北五島」が最も多くの支持を集めた。しかし最終候補に残った5つの名の中から合併協議会が選んだのは「新上五島」だった。五島列島は古くから北東を「上五島」、南西を「下五島」と呼び分けており、公募1位の新造語よりも、地域で長く使われてきた「上五島」の名を残す選択がされた。「新」の一字は、1956年から存在した旧・上五島町と区別するための工夫でもある。
    sources:
    - r7-shinkamigoto-uub
    - r7-shinkamigoto-goto-gaiyo
  relations:
  - pref/42
  unknowns:
  - 「上五島」の「上」が何を基準にした呼称か（京都＝上方を基準とする説など）は、公的資料で裏付けが取れなかった
  - 「新」を冠した理由が旧上五島町との区別であることは状況から推測されるが、協議会の公式な決定理由の記録は確認できなかった
  updated: '2026-11-13'
- id: muni/42-時津町
  code: '423084'
  names:
    ja: 時津町
    reading: とぎつちょう
    aliases: []
  user_terms:
