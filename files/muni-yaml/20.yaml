- id: muni/20-南相木村
  code: '203068'
  names:
    ja: 南相木村
    reading: みなみあいきむら
    aliases:
    - 阿江木
    - 南阿江木
  user_terms:
  - みなみあいき
  - 南相木ダムのある村
  - 滝見の湯の村
  naming_type: 一部の地名（中世以来の郷名「相木（阿江木）」の継承と南北分立）
  prefecture: 長野県
  homonyms: []
  summary: 南佐久郡の山村。地名「相木」は古く「阿江木」と書かれ、中世にこの地を治めた相木（阿江木）氏に由来すると村は説明する。永禄8年（1565年）の諏訪大社文書に「北阿江木之郷」「南阿江木之郷」と見え、この頃までに南北へ分かれた。現在の村は1889年に単独で発足し、2015年には分立450周年を迎えた。
  first_attestation:
    era: 永禄8年
    year_western: 1565
    document: 諏訪大社文書「諏方上宮祭礼退転之所、令再興次第」
    note: 『日本歴史地名大系』が紹介する諏訪大社文書に「一貫文北阿江木之郷、一貫文南阿江木之郷」とあり、「阿江木」を南北に分けた表記の初見とされる。原文を直接確認していないため、主張側ではE3に格下げして扱う
  claims:
  - text: 村名の由来は中世にこの地を治めた相木（阿江木）氏であると南相木村公式が説明する
    kind: fact
    level: E2
    status: established
    sources:
    - v11-minamiaiki-vill-bunkazai
  - text: 『日本歴史地名大系』によれば、永禄8年（1565年）11月に武田信玄が諏訪社上社の祭礼再興を下知した文書（諏訪大社文書）に「一貫文北阿江木之郷、一貫文南阿江木之郷」と記されており、相木の地が南北に分かれるのはこの頃とみられる
    kind: fact
    level: E3
    status: established
    sources:
    - v11-minamiaiki-kotobank-taikei
  - text: 『日本歴史地名大系』は、阿江木（相木）氏が大井氏の配下であったことを、布施村（現北佐久郡望月町付近）の熊野神社にある文安2年（1445年）の木造棟札に「大檀那阿江木右衛門入道」の名が見えることから推測されると紹介する
    kind: fact
    level: E3
    status: established
    sources:
    - v11-minamiaiki-kotobank-taikei
  - text: 北相木村の村勢要覧の歴史年表は、阿江木氏が文明16年（1484年）に大井氏が敗れた後に独立し、延徳2年（1490年）頃に長倉から相木の地へ移ったとする
    kind: fact
    level: E2
    status: established
    sources:
    - v11-kitaaiki-yoran
  - text: 中世の村域は『吾妻鏡』文治2年（1186年）の条に八条院領と記された大井庄に属した地であったと『日本歴史地名大系』は記す
    kind: fact
    level: E3
    status: established
    sources:
    - v11-minamiaiki-kotobank-taikei
  - text: 明治22年（1889年）の町村制施行で南相木村は単独の自治体として発足し、2015年には永禄8年の南北分立から数えて450周年を迎えた
    kind: fact
    level: E5
    status: established
    sources:
    - v11-minamiaiki-wiki
  - text: 南相木村の地方公共団体コードは203068である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 450年続く「南北」の分け方
    text: 相木の地が南北に分かれたのは永禄8年（1565年）、武田信玄が諏訪社の祭礼費用の負担を命じた文書に「北阿江木」「南阿江木」と書き分けられた頃のことである。以来450年、南と北は別の村として歩み続け、2015年には南相木村が分立450周年を祝った。祭礼の負担区分がきっかけだったかもしれないが、「相木」の名は両村が分け合ったまま今に残る。村の中島地区にある常源寺は相木氏の菩提寺で、相木常喜が寄進したと伝わる軍配団扇が伝えられている。
    sources:
    - v11-minamiaiki-kotobank-taikei
    - v11-minamiaiki-vill-bunkazai
  relations:
  - pref/20
  - muni/20-北相木村
  unknowns:
  - 「あいき（阿江木）」という語そのものの語源。相木氏の発祥を小県郡依田荘とする説との関係も含め、専門資料では確定していない
  - 永禄8年より前に単一の「相木（阿江木）郷」を記した文書の特定
  updated: '2026-11-13'
- id: muni/20-南箕輪村
  code: '203858'
  names:
    ja: 南箕輪村
    reading: みなみみのわむら
    aliases: []
  user_terms:
  - みなみみのわ
  - 大芝高原の村
  - まっくんの村
  naming_type: 合併新設（1875年に6村が合併し、箕輪郷の南に位置することから命名）
  prefecture: 長野県
  homonyms: []
  summary: 上伊那郡、天竜川西岸の村。1875年に6村が合併した際、歴史的地名「箕輪郷」の南に位置することから「南箕輪村」と命名されたと村公式が説明する。箕輪郷は現在の箕輪町・南箕輪村・伊那市の一部にあたる中世以来の広域地名で、「箕輪」の語源は箕のような半円形の地形に由来するという説がある。
  first_attestation:
    era: 明治8年
    year_western: 1875
    document: null
    note: 村名「南箕輪村」の初出は明治8年（1875年）2月18日の6村合併による発足（村公式の沿革による）。地名の古層である「箕輪郷」は室町後期の諏訪社の記録に見えるとされる
  claims:
  - text: 明治8年（1875年）2月18日、久保村・大泉村・北殿村・南殿村・田畑村・神子柴村の6村が合併し、「箕輪郷の南に位置することから」南箕輪村と命名されたと村公式が説明する
    kind: fact
    level: E2
    status: established
    sources:
    - v11-minamiminowa-vill-150th
  - text: 村は1875年の発足以来、一度も合併・分村することなく現在に至り、2025年に村政150周年を迎えた
    kind: fact
    level: E2
    status: established
    sources:
    - v11-minamiminowa-vill-watashitachi
  - text: 箕輪郷は現在の箕輪町・南箕輪村と伊那市の西箕輪・手良一帯を指す歴史的地名で、その起源は平安中期の荘園「蕗原庄」に遡ると郷土研究で紹介されている
    kind: fact
    level: E4
    status: established
    sources:
    - v11-minamiminowa-blog-minowago
  - text: 「箕輪郷」の名は応仁3年（1469年）と文明9年（1477年）に編まれた諏訪社の記録『諏訪御符礼之古書』に見え、それ以前の記録には見えないため、箕輪郷は中世以降の成立とみるのが妥当と郷土研究は述べる
    kind: fact
    level: E4
    status: established
    sources:
    - v11-minamiminowa-blog-minowago
  - text: 「箕輪」の語源については、『日本国語大辞典』が「突出した丘の周囲を取り囲んだ村落が箕の形に似ているところからいう」とする一方、鏡味完二・鏡味明克の『地名の語源』は「曲流部や曲がった海岸・台地などの半円形の土地」で「水の輪」あるいは「箕のように輪になった地形」の意とし、対象とする地形の捉え方には諸説がある
    kind: fact
    level: E3
    status: contested
    sources:
    - v11-minowa-japanknowledge
  - text: 現在、「みのわ」を自治体名に採用しているのは箕輪町と南箕輪村の2件だけである
    kind: fact
    level: E4
    status: established
    sources:
    - v11-minamiminowa-blog-minowago
  - text: 南箕輪村の地方公共団体コードは203858である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 村の名は「郷の南」
    text: 南箕輪村の「南」は、箕輪郷という広域地名に対する位置を示す言葉だった。1875年、6つの村が合併したとき、新しい村はそのまま「箕輪郷の南の村」と名乗ったのである。郷そのものの名は北隣の箕輪町が継ぎ、南箕輪村は「郷の南部」という関係の名を受け継いだ。村では誕生日の2月18日を「南箕輪村の日」と定めている。150年間一度も合併しなかった村の名は、中世の郷の広がりを今に伝える標識でもある。
    sources:
    - v11-minamiminowa-vill-150th
    - v11-minamiminowa-blog-minowago
  relations:
  - pref/20
  - muni/20-箕輪町
  unknowns:
  - 「箕輪」という地名そのものの確定的な語源（箕形の地形に由来するという説が有力だが、対象とする地形の規模をめぐって諸説がある）
  - 箕輪郷の初出を『諏訪御符礼之古書』とする紹介について、本バッチでは郷土研究の引用に拠っており、原典での直接確認は未了
  updated: '2026-11-13'
