  - text: 読みの「ほうふ」は、「周防」の「防」と「国府」の「府」の組み合わせによるものとみられる
    kind: fact
    level: H
    status: inferred
    sources:
    - q3-hofu-taikei
    - q3-hofu-city-fire
  - text: 昭和11年（1936年）、防府町・中関町・華城村・牟礼村が合併して防府市が発足した
    kind: fact
    level: E3
    status: established
    sources:
    - q3-hofu-taikei
  column:
    title: 「国府」が縮んで「防府」に
    text: 律令制の国府が置かれた地は、多くの場合「府中」と呼ばれた。防府は一味違い、「周防」という国名の後ろの字と「国府」の「府」を組み合わせて「防府」と縮めた名である。市の公式説明は大化の改新（646年）の国府設置に命名を結びつけるが、専門辞典は慎重で、「防府」の用例として確認できるのは1524年の文書までで、いつからそう呼ばれたかは分からないとする。分かりやすい名前の由来ほど、記録の裏付けの年代には開きがある好例である。
    sources:
    - q3-hofu-taikei
    - q3-hofu-city-fire
  relations:
  - pref/35
  unknowns:
  - 「防府」の名称が使われ始めた正確な時期は、専門辞典でも分からないとされている
  - 大化2年（646年）に周防国が建てられたとする市公式の説明は、律令制の整備過程からみると単純化された面があり、当時の文書では裏付けられていない
  updated: '2026-11-13'
