  naming_type: 方位・位置による命名
  naming_note: 1954年に大長村・稲部村・神田村の合併で生まれた新名。員弁郡の「員」を採った命名と考えられるが、命名理由を明記した公的資料は未確認。1967年に町制施行
  formation: 合併新設
