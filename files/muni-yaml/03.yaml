  summary: 下閉伊郡最北の村で、北山崎・黒崎の断崖絶壁で知られる。村名の記録は室町時代に遡り、村公式によれば永正5年（1508）の馬焼印図に「ふたい」、正保元年（1644）の正保図絵図に「譜代」「譜代崎」が見え、承応3年（1654）の藤島家古文書で「普代村」の表記が明確になる。語源については県の由来一覧が「二井」「塞井」など4説を挙げるが定説はない。明治9年（1876）に普代村・黒崎村・堀内村が合併して現在の村の基礎ができた。
  first_attestation:
    era: 永正5年
