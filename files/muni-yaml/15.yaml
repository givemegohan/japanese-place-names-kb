  prefecture: 新潟県
  homonyms: []
  summary: 新潟県南西部の市で、市域の約8割を森林が占める。中心地はもと新井市だったが、2005年に妙高高原町・妙高村を編入する際、市名を市域の象徴である妙高山にちなんで「妙高市」に改めた。妙高山は「越後富士」と呼ばれる標高2,454mの信仰の山である。編入合併と同時に中心地とは別の名へ改称した珍しい事例である。
  first_attestation:
    era: null
    year_western: null
    document: null
    note: 市名としての「妙高」は2005年の改称による。由来となった妙高山の山名の初出は未確認で、名の成り立ちは「名香山」表記と須弥山の訳語という伝承的な説明による
  claims:
  - text: 2005年4月1日、新井市が妙高高原町・妙高村を編入すると同時に市名を「妙高市」に変更した編入合併であった（新潟県の合併資料）
    kind: fact
    level: E2
    status: established
    sources:
    - u5-myoko-pref
  - text: 前身の新井市は1954年11月1日に新井町ほか7村の合併で市制施行した市であり、2005年の編入・改称によって「新井市」の名は消えた
    kind: fact
    level: E2
    status: established
    sources:
    - u5-myoko-pref
  - text: 妙高山の名は、古く「越の中山」と呼ばれていた山が「名香山」と表記され、その後、仏教で世界の中心の山とされる須弥山（スメール）の訳語である「妙高」を当てたといわれている
    kind: fact
    level: E2
    status: contested
    sources:
    - u5-myoko-shizuoka
  - text: 妙高観光局は妙高山の名称について、「なかやま」に「名香山」の字を当てて音読みしたという説と、須弥山を漢訳して「妙高山」となったという説の二説を紹介している
    kind: fact
    level: E2
    status: contested
    sources:
    - u5-myoko-kanko
  - text: 妙高山は標高2,454mの成層火山で「越後富士」とも呼ばれ、古来、信仰の山として崇められてきた
    kind: fact
    level: E2
    status: established
    sources:
    - u5-myoko-shizuoka
    - u5-myoko-kanko
  - text: 旧妙高村の中心集落・関山は、信濃へ通じる北国街道の宿場町として発達した（『改訂新版世界大百科事典』）
    kind: fact
    level: E3
    status: established
    sources:
    - u5-myoko-kotobank
  column:
    title: 消えた市名「新井」と、山の名をもらった市
    text: 合併で市の名前が変わることは珍しくないが、妙高市の場合は少し違う。編入した側の新井市が、中心地の名を捨てて、山の名を名乗り直したのである。市役所は今も旧新井市の地にあるのに、市名は妙高山に由来する。もっとも「妙高」という山名自体も、須弥山という仏教の聖山の訳語を当てたと考えられる借り物の名で、名の由来が何重にも重なった市である。
    sources:
    - u5-myoko-pref
    - u5-myoko-shizuoka
  relations:
  - pref/15
  unknowns:
  - 旧中心地「新井」という地名自体の由来（新井宿の成立経緯を含む）は未確認
  - 妙高山の山名の文献上の初出は未確認
  - 改称の際に「妙高」が選ばれた協議の詳細（他候補の有無）は県の合併資料からは分からなかった
  updated: '2026-11-13'
- id: muni/15-小千谷市
  code: '152081'
  names:
    ja: 小千谷市
    reading: おぢやし
    aliases:
    - 小千谷町
    - 小地屋
    - 千屋郷
  user_terms:
  - 小千谷市の名前の由来
  - 小千谷はなぜ「おぢや」と読むのか
  - 小千谷縮のまち
  - 錦鯉発祥の地
  naming_type: 中心地名の継承
  formation: 編入合併
  prefecture: 新潟県
  homonyms: []
  summary: 市名の起こりは、平安時代の『和名類聚抄』に見える魚沼郡の郷「千屋郷（千谷郷）」とされる。戦国期に「小地屋」、江戸期に「小千谷」と記されるようになり、「ちや」の読みが「おぢや」へ転じた。近世には宿場町・河港として発展し、1954年3月10日に市制を施行した。
  first_attestation:
    era: 平安時代中期（10世紀）
    year_western: null
    document: 『和名類聚抄』魚沼郡の郷名
    note: 市公式が地名の起こりとして紹介する郷名。表記は資料により「千屋郷」「千谷郷」と揺れ、読みは「ちや」とされる
  claims:
  - text: 小千谷市公式は、地名の由来について、平安時代の『和名類聚抄』に見られる古代魚沼郡の4つの郷のひとつ「千屋郷」が起こりと言われるとしている
    kind: fact
    level: E2
    status: established
    sources:
    - n1-ojiya-city-profile
  - text: 語源由来辞典によれば、この郷は「千谷郷（ちやごう）」と読まれ、戦国期に「小地屋」、江戸期に「小千谷」と記されるようになった
    kind: fact
    level: E4
    status: established
    sources:
    - n1-ojiya-gogen
  - text: 語源については、「ちや」は茅葺き屋根の家屋（茅屋）が多くあったことに由来すると考えられる一方、「おぢ」を「落ち」（沢の落ち合う所・低湿地）とする説もあるが、読みの変遷からは「ちや」で考えるべきだと語源由来辞典は述べている
    kind: fact
    level: E4
    status: contested
    sources:
    - n1-ojiya-gogen
  - text: 近世になると小千谷は、街道が出会う立地から宿場町となり、信濃川水運の船着場、小千谷縮の生産地としても発展した（小千谷市公式）
    kind: fact
    level: E2
    status: established
    sources:
    - n1-ojiya-city-profile
  - text: 昭和29年（1954）3月10日、小千谷町が城川村・千田村を編入して市制を施行し小千谷市が誕生した。町村合併促進法の適用による新潟県の新市第1号で、県下8番目の市であった（小千谷市公式）
    kind: fact
    level: E2
    status: established
    sources:
    - n1-ojiya-city-ayumi
    - n1-ojiya-uub
  - text: 新潟県の市町村等団体コード一覧では、小千谷市の団体コードは152081とされている
    kind: fact
    level: E2
    status: established
    sources:
    - n1-niigata-code
  column:
    title: 「県下8番目」なのに「新市第1号」
    text: 1954年3月10日に誕生した小千谷市は、新潟県で8番目の市でした。ところが同時に「新潟県の新市第1号」でもありました。1953年に町村合併促進法が施行され、全国で合併による新市づくりが始まったとき、その法律の適用を受けて生まれた市としては県内第1号だったのです。小千谷町は早くから合併に積極的で、城川村・千田村との大同団結をまとめ上げました。「8番目の市」と「第1号の新市」という二つの顔が、この市の生まれ方を物語っています。
    sources:
    - n1-ojiya-city-ayumi
  relations:
  - pref/15
  unknowns:
  - 『和名類聚抄』の郷名の正確な表記（「千屋郷」か「千谷郷」か）は、原典での直接確認ができておらず資料間で揺れている
  - 「小」が付いた時期と理由（大きな「千谷」との区別などの説）は確認できなかった
  updated: '2026-11-13'
- id: muni/15-弥彦村
  code: '153427'
  names:
    ja: 弥彦村
    reading: やひこむら
    aliases:
    - 伊夜日子
    - 伊夜比古
    - 彌彦
  user_terms:
  - おやひこさまの村
  - 弥彦神社の門前町
  - 弥彦競輪のある村
  - 弥彦村の名前の由来
  naming_type: 中心地名の継承
  naming_note: 1901年の3村合併に際し、彌彦神社の門前町である弥彦の名を村名に採用
  formation: 合併新設
  prefecture: 新潟県
  homonyms: []
  summary: 弥彦は越後一宮・彌彦神社の門前町として栄えた地名で、「いやひこ」の名は『万葉集』の歌に既に詠まれている。古くは「伊夜日子」「伊夜比古」と書かれ、祭神は産業の神とされる天香山命である。村は1901年に弥彦村・桜井郷村・矢作村が合併して生まれ、神社の鎮まる中心地の名を村名に採った。以後120年以上、村域はほとんど変わっていない。
  first_attestation:
    era: 奈良時代（8世紀）
    year_western: null
    document: 『万葉集』巻十六
    note: 「いやひこ」を詠んだ歌2首が見える使用例の初出（彌彦神社公式の紹介による）。当時の表記は「伊夜日子」
  claims:
  - text: 総務省の全国地方公共団体コードで、弥彦村の団体コードは153427と定められている
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  - text: 彌彦神社公式によれば、『万葉集』巻十六には「いやひこ おのれ神さび」「いやひこ 神の麓に」と「いやひこ」を詠んだ歌が見える
    kind: fact
    level: E2
    status: established
    sources:
    - v6-yahiko-jinjya
  - text: 彌彦神社公式によれば、彌彦神社が初めて国史に見えるのは『続日本後紀』天長10年（833年）7月条の「越後國蒲原郡伊夜比古神 名神に預かる」という記載である
    kind: fact
    level: E2
    status: established
    sources:
    - v6-yahiko-jinjya
  - text: 日本交通公社の観光資源台帳によれば、彌彦神社は越後一ノ宮で『延喜式』神名帳には越後国の名神大社と記されており、古くから「おやひこさま」と呼ばれて親しまれてきた
    kind: fact
    level: E4
    status: established
    sources:
    - v6-yahiko-jtb
  - text: 弥彦村公式によれば、祭神の天香山命は日本海を渡って弥彦山西側の野積海岸（現・長岡市）に上陸し、住民に製塩や漁法を教えた後、この弥彦の地に鎮座されたと伝えられている
    kind: legend
    level: E2
    status: established
    sources:
    - v6-yahiko-vill
  - text: 弥彦村公式によれば、弥彦は彌彦神社の門前町として、また北国街道の宿場町として人々が行きかい栄えてきた
    kind: fact
    level: E2
    status: established
    sources:
    - v6-yahiko-vill
  - text: 明治34年（1901年）11月1日、弥彦村・桜井郷村・矢作村の3村が合併して新しい弥彦村が誕生し、以後今日までほとんどその形を変えることなく100余年が経過している
    kind: fact
    level: E2
    status: established
    sources:
    - v6-yahiko-vill
  column:
    title: 拍手は4回、「おやひこさま」の二年参り
    text: 彌彦神社の参拝作法は、普通の神社の「2礼2拍手1礼」ではなく「2礼4拍手1礼」です。大晦日から元旦にまたいで参詣する「二年参り」の人々で、門前町は年越しの賑わいを見せます。「いやひこ」の名は『万葉集』に詠まれ、神社は「おやひこさま」の愛称で千年以上も人々に親しまれてきました。村名の「弥彦」は、この神社の名がそのまま土地の名になったもの。山頂の御神廟から麓の門前町まで、村全体が神社の名に包まれています。
    sources:
    - v6-yahiko-jtb
    - v6-yahiko-jinjya
    - v6-yahiko-vill
  relations:
  - pref/15
  unknowns:
  - 「いやひこ」という音そのものの語源（神名の由来）は、確認した資料では確定できなかった
  - 表記が「伊夜比古」から現在の「弥彦」に改まった時期・経緯は確認できなかった
  - 1901年の合併時に村名の選定をめぐる議論があったかどうかは確認できなかった
  updated: '2026-11-13'
- id: muni/15-新潟市
  code: '151009'
  names:
    ja: 新潟市
    reading: にいがたし
    aliases:
    - 新潟町
    - 新潟区
    - 新潟湊
  user_terms:
  - 新潟市の名前の由来
  - 新潟市はなぜ新潟というのか
  - 開港5港の新潟
  - 新潟と沼垂の関係
  naming_type: 中心地名の継承
  formation: 単独発足
  prefecture: 新潟県
  homonyms: []
  summary: 市名は信濃川河口の港町「新潟町」の名をそのまま受け継いだものである。「新潟」は、古くからの湊である蒲原・沼垂に対して新しく開けた湊を意味する名と考えられている。明治22年（1889）の市制施行で新潟区から新潟市が発足し、市名は県名にもなった港町の名がそのまま市名となった。
  first_attestation:
    era: 永禄11年
    year_western: 1568
    document: 上杉輝虎（謙信）書状
    note: 市名の元になった港町名「新潟」の表記が確認できる初期の用例（新潟県立図書館の解説が紹介）。さらに古い用例として永正17年（1520）の『越後過去名簿』の「新方」がある
  claims:
  - text: 永禄11年（1568）の上杉輝虎（後の謙信）の手紙の中に「新潟」という表記が見え、これが港町名「新潟」の初期の確認例とされる
    kind: fact
    level: E2
    status: established
    sources:
    - c-niigata-lib
  - text: 「新」は、周辺の蒲原・沼垂という7〜8世紀の文献にも出てくる古い湊に比べて新しい湊であることを示すと考えられている
    kind: fact
    level: E2
    status: established
    sources:
    - c-niigata-lib
  - text: 新潟市公式は、延長5年（927）の『延喜式』に載る越後国の国津「蒲原津」を文献に現れる最初の新潟港としており、河口部の湊の歴史は平安時代に遡る
    kind: fact
    level: E2
    status: established
    sources:
    - c-cap-niigata-port
  - text: 新潟湊は江戸時代に北前船の日本海側最大級の寄港地として栄え、安政5年（1858）の修好通商条約では函館・横浜・神戸・長崎とともに開港5港の一つに指定された
    kind: fact
    level: E2
    status: established
    sources:
    - c-cap-niigata-shisei
  - text: 明治12年（1879）に新潟町ほかの区域をもって新潟区が置かれ、明治22年（1889）4月1日の市制施行により新潟区から新潟市が発足した
    kind: fact
    level: E2
    status: established
    sources:
    - c-cap-niigata-kita
  - text: 信濃川を挟んで対岸にあった沼垂町とは川の中州の帰属をめぐって争いが続き、元禄12年（1699）の幕府裁定（元禄の湊訴訟）で島の支配権は新潟町のものとなった
    kind: fact
    level: E2
    status: established
    sources:
    - c-cap-niigata-ryusaku
  - text: 大正3年（1914）4月1日、沼垂町が新潟市に編入され、対岸同士で競い合ってきた二つの湊町が一つの市になった
    kind: fact
    level: E4
    status: established
    sources:
    - c-cap-niigata-uub
  - text: 総務省の全国地方公共団体コードで、新潟市の団体コードは151009と定められている
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 対岸のライバル同士が、一つの市になった
    text: 信濃川の河口には、左岸の新潟町と右岸の沼垂町という二つの湊町が向かい合っていました。川が運ぶ土砂で中州ができては姿を変える土地で、両町は島の取り合いを繰り返し、元禄12年（1699）には幕府の裁定（元禄の湊訴訟）にまで発展しました。ところが大正3年（1914）、沼垂町は新潟市に編入されます。何世紀も川を挟んで競い合ったライバル同士が、同じ市の住民になったのです。今も信濃川の両岸に古い町並みの名残が残り、二つの湊の記憶を伝えています。
    sources:
    - c-cap-niigata-ryusaku
    - c-cap-niigata-uub
  relations:
  - pref/15
  unknowns:
  - 「新潟」の「新」が新しい潟そのものを指すのか、新しく作られた港町を指すのかは決着していない（県レコードでも対立として記録）
  - 蒲原津の正確な所在地は、現在の新潟市域の河口部に比定されるが地点の特定はできていない
  - 沼垂町編入（1914）の経緯について、市公式年表での直接確認は次回に回した（変遷情報サイトの整理に基づく）
  updated: '2026-11-13'
- id: muni/15-新発田市
  code: '152064'
  names:
    ja: 新発田市
    reading: しばたし
    aliases:
    - 新発田町
    - 新発田城下
  user_terms:
  - 新発田市の名前の由来
  - 新発田はなぜ「しばた」と読むのか
  - 城下町しばた
  - あやめ城のまち
  naming_type: 中心地名の継承
  formation: 単独発足
  prefecture: 新潟県
  homonyms: []
  summary: 市名は戦国期の国人・新発田氏の居城の地として知られた「新発田」の継承である。「しばた」という読みの語源には洲端（すばた）説や荒れ地の開墾説などがあり、定説はない。慶長3年（1598）に溝口秀勝が入封して城下町が形成され、以後270年にわたり溝口氏の城下町として栄えた。1947年に市制を施行した。
  first_attestation:
    era: 戦国時代
    year_western: null
    document: null
    note: 「新発田」の地名の文書上の初出は特定できなかった。中世から戦国期にかけて、この地を本拠とした新発田氏の名字として史料に現れる
  claims:
  - text: 日本歴史地名大系によれば、新発田氏は加地庄地頭佐々木氏の一族で、戦国期にはこの地の居城をめぐって上杉景勝と6年間に及ぶ新発田合戦を戦った
    kind: fact
    level: E3
    status: established
    sources:
    - n1-shibata-kotobank-castle
  - text: 「新発田（しばた）」の地名の由来には、この地方が海岸の洲の近くだったことから「洲端（すばた）」が転じたとする説、荒れ地を開墾してできた土地（田）によるとする説など、いくつかの説が伝えられており、定説はない（新発田市観光協会の紹介による）
    kind: fact
    level: E4
    status: contested
    sources:
    - n1-shibata-kanko
  - text: 慶長3年（1598）、新発田藩の初代藩主・溝口秀勝が入封し、新発田城の築城と城下町の形成が始まった
    kind: fact
    level: E2
    status: established
    sources:
    - n1-shibata-city-castle
    - n1-shibata-city-plan
  - text: 以後、廃藩置県まで国替えなく溝口氏12代・約270年にわたり治められ、新発田は城下町として栄えた
    kind: fact
    level: E2
    status: established
    sources:
    - n1-shibata-city-plan
  - text: 昭和22年（1947）に市制を施行して新発田市が発足した
    kind: fact
    level: E2
    status: established
    sources:
    - n1-shibata-city-suji
  - text: 平成15年（2003）に豊浦町、平成17年（2005）に紫雲寺町・加治川村と合併し、市域が広がった
    kind: fact
    level: E2
    status: established
    sources:
    - n1-shibata-city-suji
  - text: 新潟県の市町村等団体コード一覧では、新発田市の団体コードは152064とされている
    kind: fact
    level: E2
    status: established
    sources:
    - n1-niigata-code
  column:
    title: あやめ城と、屋根の上の3匹の鯱
    text: 新発田城には別名がいくつもあり、周囲の湿地に菖蒲（あやめ）がたくさん咲いていたことから「菖蒲（あやめ）城」とも呼ばれました。籠城のときには加治川の堤防を切って城の周りを水浸しにする設計だったため「浮舟城」、築城にまつわる話から「狐の尾引城」ともいいます。そして本丸三階櫓の屋根には、全国的に類例のない3匹の鯱が載っています。三階櫓と辰巳櫓は平成16年（2004）に復元され、今も城下町・新発田の象徴です。
    sources:
    - n1-shibata-city-ayame
    - n1-shibata-city-suji
  relations:
  - pref/15
  unknowns:
  - 「新発田」の文書上の初出（どの史料にいつ現れるか）は特定できなかった
  - 地名「新発田」と新発田氏の名字のどちらが先か（氏が地名を名乗ったのか、地名が氏に由来するのか）は資料で確認できなかった
  - 語源の諸説（洲端説・開墾説・アイヌ語説など）のうち、専門辞典が支持する説は確認できなかった
  updated: '2026-11-13'
- id: muni/15-村上市
  code: '152129'
  names:
    ja: 村上市
    reading: むらかみし
    aliases:
    - 村上町
    - 村上本町
  user_terms:
  - 村上市の名前の由来
  - 村上はなぜ村上というのか
  - 鮭のまち村上
  - 城下町村上
  naming_type: 中心地名の継承
  formation: 合併新設
  prefecture: 新潟県
  homonyms: []
  summary: 市名は臥牛山の村上城の城下町「村上町」の継承である。「村上」の地名は16世紀初めには見え、1597年の絵図にも「村上町」と記される。城主・村上頼勝が名付けたとする説が流布するが、地名は頼勝の入封以前から存在し、語源そのものは未確定である。1954年に市制を施行し、2008年の合併でも市名が継承された。
  first_attestation:
    era: 永正6年
    year_western: 1509
    document: 村上市『三面川の鮭文化』の年表
    note: 市の年表資料が「村上の地名が初めて見える」とする年（原史料名は未確認）。1597年の『越後国瀬波郡絵図』には「村上町、家数252軒」と明記される
  claims:
  - text: 村上市の年表資料（『三面川の鮭文化』）では、永正6年（1509）に「村上」の地名が初めて見えるとされている
    kind: fact
    level: E2
    status: established
    sources:
    - n1-murakami-city-sake
  - text: 慶長2年（1597）の『越後国瀬波郡絵図』には、臥牛山の城館とその山麓の町が描かれ、「村上町、家数252軒」と記されている（村上市歴史的風致維持向上計画）
    kind: fact
    level: E2
    status: established
    sources:
    - n1-murakami-city-fuchi
  - text: 村上城（旧称・本庄城）は16世紀前半には存在し、戦国時代は小泉荘の国人領主・本庄氏の本拠地であった
    kind: fact
    level: E2
    status: established
    sources:
    - n1-murakami-city-castle
    - n1-murakami-jo
  - text: 慶長3年（1598）に村上頼勝が9万石で入封し、大規模な城普請とともに城下町の整備を行った（村上市歴史的風致維持向上計画）
    kind: fact
    level: E2
    status: established
    sources:
    - n1-murakami-city-fuchi
  - text: 「慶長3年に村上頼勝が入って名称を村上と改めたのが村上藩の始まり」とする説があるが、村上家の史料が少なく不確かな点が多いうえ、「村上」の地名は頼勝の入封以前（1509年）から見えるため、この説をもって地名の起源とすることはできない
    kind: fact
    level: E5
    status: contested
    sources:
    - n1-murakami-wikipedia-han
    - n1-murakami-city-sake
  - text: 昭和29年（1954）3月31日、村上町・岩船町・瀬波町・山辺里村・上海府村が合併して村上市が発足した（市の計画資料も昭和29〜30年に村上市が成立したとする）
    kind: fact
    level: E2
    status: established
    sources:
    - n1-murakami-wikipedia-han
    - n1-murakami-city-fuchi1
  - text: 平成20年（2008）4月1日、旧村上市・荒川町・神林村・朝日村・山北町が合併して現在の村上市となった
    kind: fact
    level: E2
    status: established
    sources:
    - n1-murakami-city-fuchi2
  - text: 新潟県の市町村等団体コード一覧では、村上市の団体コードは152129とされている
    kind: fact
    level: E2
    status: established
    sources:
    - n1-niigata-code
  column:
    title: 鮭のまちの、世界初の試み
    text: 村上の三面川は鮭が遡上する川で、この地では鮭を「イヨボヤ」と呼び、塩引き鮭の文化が城下町に根づいています。江戸時代、村上藩士の青砥武平治は、鮭が生まれた川に戻る習性に目をつけ、三面川に人工の分流「種川（たねかわ）」を造ることを考案しました。これは世界で初めて成功した鮭の自然ふ化増殖の試みとされます。武平治は完成を見ることなく亡くなりましたが、その発想は村上の鮭文化の礎になりました。
    sources:
    - n1-murakami-city-sake
  relations:
  - pref/15
  unknowns:
  - 「村上」という地名そのものの語源（何をもって「村上」と名付けたか）は、専門資料で確認できなかった
  - 永正6年（1509）の「地名初見」の根拠となる原史料名は、市資料の年表の範囲では特定できなかった
  - 2008年合併時の市名決定の経緯（候補名・公募の有無）は未確認
  updated: '2026-11-13'
- id: muni/15-柏崎市
  code: '152056'
  names:
    ja: 柏崎市
    reading: かしわざきし
    aliases:
    - 柏崎町
    - かしはざき
  user_terms:
  - 柏崎市の名前の由来
  - 柏崎はなぜ柏崎というのか
  - 柏崎刈羽原発のまち
  - 謡曲「柏崎」のまち
  naming_type: 中心地名の継承
  formation: 編入合併
  prefecture: 新潟県
  homonyms: []
  summary: 市名は鵜川河口の港町・宿場町として中世から知られた「柏崎」の継承である。名はモチガシワの木が群生した岬の意と伝えられ、12世紀末の史料にも港として現れる。柏崎町は1940年に市制を施行し、県内5番目の市となった。現在の市域は2005年に高柳町・西山町を編入して広がった。
  first_attestation:
    era: 平安時代末期（12世紀）
    year_western: null
    document: 『准后記』（木曾義仲が「柏崎ノワタリ」への物資輸送を命じた記事）
    note: 『白川風土記』の引用として日本歴史地名大系が紹介するもので、原典の直接確認はしていない。ほかに建治2年（1276）の日蓮遺文「光日房御書」に、文永11年（1274）に日蓮が大風に流されて「かしはざき」に着いたことが記される
  claims:
  - text: 日本歴史地名大系は、柏崎の名はモチガシワの木が群生した岬の意であると伝える、としている
    kind: fact
    level: E3
    status: established
    sources:
    - n1-kashiwazaki-kotobank-machi
  - text: 『白川風土記』によると『准后記』に、木曾義仲が「柏崎ノワタリ」に物資の輸送を命じたとあり、12世紀末には柏崎が港として中央に知られていた（日本歴史地名大系の紹介による）
    kind: fact
    level: E3
    status: established
    sources:
    - n1-kashiwazaki-kotobank-machi
  - text: 建治2年（1276）の光日房御書によれば、文永11年（1274）に赦免された日蓮は佐渡を発ち寺泊へ向かう予定が大風に流され、「かしはざき」に着いたという（日本歴史地名大系の紹介による）
    kind: fact
    level: E3
    status: established
    sources:
    - n1-kashiwazaki-kotobank-machi
  - text: 謡曲「柏崎」で知られる領主・柏崎勝長（柏崎殿）の伝説が伝わり、市公式の沿革もこの伝説を、中世の柏崎が日本海有数の港であったことを裏づけるものとして紹介している
    kind: legend
    level: E2
    status: established
    sources:
    - n1-kashiwazaki-city-enkaku
  - text: 昭和15年（1940）7月1日、刈羽郡柏崎町が市制を施行して柏崎市が発足し、新潟県で5番目の市となった
    kind: fact
    level: E2
    status: established
    sources:
    - n1-kashiwazaki-museum
    - n1-kashiwazaki-uub
  - text: 平成17年（2005）の平成の大合併で刈羽郡高柳町・西山町を編入し、市域が広がった
    kind: fact
    level: E2
    status: established
    sources:
    - n1-kashiwazaki-museum
  - text: 新潟県の市町村等団体コード一覧では、柏崎市の団体コードは152056とされている
    kind: fact
    level: E2
    status: established
    sources:
    - n1-niigata-code
  column:
    title: 嵐に流されて柏崎へ――日蓮の漂着
    text: 文永11年（1274）、赦免された日蓮は佐渡を船出しました。寺泊に着くはずが大風に流され、たどり着いたのが「かしはざき」でした。この出来事は日蓮の書状（光日房御書）に記され、日本歴史地名大系も柏崎の古い用例として引いています。流刑地の佐渡と向かい合う港町・柏崎は、中世には北陸道の宿駅として、また日本海有数の港として中央の人々の紀行文にもたびたび現れる場所でした。
    sources:
    - n1-kashiwazaki-kotobank-machi
  relations:
  - pref/15
  unknowns:
  - 『准后記』の柏崎記事の正確な年と原文は未確認（『白川風土記』経由の紹介にとどまる）
  - 「モチガシワの群生した岬」という語源は「伝える」とされる言い伝えの域を出ず、裏づける古記録は確認できなかった
  updated: '2026-11-13'
- id: muni/15-津南町
  code: '154822'
  names:
    ja: 津南町
    reading: つなんまち
    aliases:
    - 津南郷
  user_terms:
  - 河岸段丘の町
  - 新潟県の最南端の町
  - 豪雪地帯の町
  - 津南町の名前の由来
  naming_type: 旧行政区画名の継承
  naming_note: 1955年の6村合併に際し、古くから一帯を指した郷名「津南郷」の名を町名に採用
  formation: 合併新設
  prefecture: 新潟県
  homonyms: []
  summary: 津南町は1955年に6村が合併して生まれた町だが、町名は合併の際に新しく作られた名ではない。『日本大百科全書』によれば、町名は「津南郷」と呼ばれていた古い郷名に由来する。信濃川と支流が刻んだ広大な河岸段丘の上に広がる、新潟県最南端の豪雪の町である。
  first_attestation:
    era: 江戸時代
    year_western: null
    document: 津南郷（中魚沼郡の郷名）
    note: 『日本大百科全書』が町名の由来とする郷名。具体的な初出の文書は確認できなかった
  claims:
  - text: 総務省の全国地方公共団体コードで、津南町の団体コードは154822と定められている
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  - text: 『日本大百科全書（ニッポニカ）』は、津南町の町名は「津南郷」とよばれていた郷名に由来すると解説している
    kind: fact
    level: E3
    status: established
    sources:
    - v6-tsunan-kotobank-nipponika
  - text: 津南町公式によれば、明治34年（1901年）の配置分合で外丸・上郷・芦ヶ崎・秋成・中深見・下船渡の6か村となり、昭和30年（1955年）1月1日にこの6か村が合併して津南町が誕生した
    kind: fact
    level: E2
    status: established
    sources:
    - v6-tsunan-town
  - text: 津南町公式によれば、津南町は新潟県の最南端にあって、千曲川が信濃川と名を変える長野県境にある
    kind: fact
    level: E2
    status: established
    sources:
    - v6-tsunan-town
  - text: 『日本歴史地名大系』によれば、町域は信濃川と志久見川・中津川・清津川の侵食によって形成された雄大な河岸段丘が広がる特殊な地形をなしている
    kind: fact
    level: E3
    status: established
    sources:
    - v6-tsunan-kotobank-taikei
  - text: 津南町公式によれば、河岸段丘を利用して先史時代より人々が生活を営んできたことがうかがわれ、町の各地に縄文時代の遺跡が見られる
    kind: fact
    level: E2
    status: established
    sources:
    - v6-tsunan-town
  - text: 現在、中魚沼郡を構成する自治体は津南町のみである
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 合併の新町名に見えて、実は江戸時代の郷の名前
    text: 「津南町」という名は、1955年の合併で生まれたいかにも新しそうな名前です。ところがこの一帯は、江戸時代から「津南郷」と呼ばれてきました。6つの村が合併するとき、選ばれたのは構成村の名前でも完全な新造語でもなく、村々を束ねてきた広域の古い名前でした。千曲川が信濃川に名を変える県境の段丘の上には、縄文時代から人々が暮らしてきた土地が広がっています。新しい町の看板に、古い郷の名前が蘇った例です。
    sources:
    - v6-tsunan-kotobank-nipponika
    - v6-tsunan-town
  relations:
  - pref/15
  unknowns:
  - 「津南郷」の「津」が何を指すのか（信濃川の渡し場など）は、確認した資料では確定できなかった
  - 「津南郷」の名の初出となる具体的な文書は確認できなかった
  - 1955年の合併協議で町名が決まった経緯を示す公的記録は確認できなかった
  updated: '2026-11-13'
- id: muni/15-湯沢町
  code: '154610'
  names:
    ja: 湯沢町
    reading: ゆざわまち
    aliases:
    - 湯沢村
  user_terms:
  - 越後湯沢
  - 雪国の舞台の町
  - スキーの町
  - 湯沢町の名前の由来
  naming_type: 中心地名の継承
  naming_note: 1955年の5村合併に際し、温泉地として知られた湯沢村の名を町名に採用
  formation: 合併新設
  prefecture: 新潟県
  homonyms: []
  summary: 「湯沢」は温泉（湯）の湧く沢に由来する古い地名で、約900年前に高橋半六が温泉を発見したという伝承が残る。近世には三国街道の宿場・湯沢宿として栄え、1955年に湯沢村など5村が合併して湯沢町となった。昭和に入って清水トンネルが開通し、川端康成の小説『雪国』の舞台として知られるようになったが、それは地名の由来とは別の、文学によって重なった層である。
  first_attestation:
    era: 江戸時代
    year_western: null
    document: 三国街道の宿場・湯沢宿
    note: 近世には三国街道の宿場町として湯沢宿が置かれていた。「湯沢」の名の文献上の確実な初出は確認できなかった。温泉の発見は承保2年（1075年）とする伝承がある
  claims:
  - text: 総務省の全国地方公共団体コードで、湯沢町の団体コードは154610と定められている
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  - text: 新潟県の公式ページは、約900年前に越後新発田の郷士・高橋半六が関東へ向かう途中に谷川で天然湧出の温泉を偶然発見したと伝える話を、湯沢温泉の宿・高半の由来として紹介している
    kind: legend
    level: E2
    status: established
    sources:
    - v6-yuzawa-pref
  - text: 湯沢町観光まちづくり機構によれば、わずかな平地を縫うように三国街道が通り、湯沢宿・三俣宿・二居宿・浅貝宿という四つの宿場が置かれていた
    kind: fact
    level: E4
    status: established
    sources:
    - v6-yuzawa-kanko
  - text: 昭和30年（1955年）3月31日、湯沢村・神立村・土樽村・三俣村・三国村の5村が合併して湯沢町が発足した
    kind: fact
    level: E4
    status: established
    sources:
    - v6-yuzawa-kanko
    - v6-yuzawa-wiki
  - text: 新潟県観光協会によれば、川端康成は『雪国』のあとがきで「雪国の場所は越後の湯沢温泉である」と明記しており、川端が初めて湯沢を訪れたのは1934年、清水トンネルは1931年に完成していた
    kind: fact
    level: E4
    status: established
    sources:
    - v6-yuzawa-niigata-kankou
  - text: 政府広報は、小説『雪国』冒頭に描かれる長いトンネルのモデルとされる清水トンネルと、湯沢町歴史民俗資料館「雪国館」を紹介し、湯沢を『雪国』の景色として取り上げている
    kind: fact
    level: E2
    status: established
    sources:
    - v6-yuzawa-gov
  - text: 湯沢町は「越後湯沢」の名でも知られ、JR上越新幹線・上越線の駅は「越後湯沢駅」と名乗り、温泉街は「越後湯沢温泉」と呼ばれる
    kind: fact
    level: E2
    status: established
    sources:
    - upg-ac1-yuzawa-jreast
    - upg-ac1-yuzawa-jreast-press
  column:
    title: 「湯の沢」の古い名に、『雪国』の新しい名が重なった
    text: 湯沢の地名の芯にあるのは、湯の湧く沢という温泉地そのものの名です。その歴史は、平安時代の温泉発見の伝承にまで遡ると語られてきました。大きく名を広めたのは昭和の出来事でした。1931年に清水トンネルが完成し、1934年に川端康成が湯沢を訪れ、1937年に小説『雪国』が刊行されます。「国境の長いトンネルを抜けると雪国であった」という冒頭の一文によって、湯沢は「雪国」の代名詞になりました。ただしそれは文学が町にもたらした新しい層であり、地名そのものの由来は、あくまで温泉の湯と沢にあります。
    sources:
    - v6-yuzawa-pref
    - v6-yuzawa-niigata-kankou
    - v6-yuzawa-kanko
  relations:
  - pref/15
  unknowns:
  - 「湯沢」の名が文献に現れる確実な初出は確認できなかった
  - 温泉発見の伝承（承保2年・1075年、高橋半六）の同時代の記録は確認できなかった
  - 1955年の合併で町名に「湯沢」を選んだ協議の記録は確認できなかった
  - 「越後湯沢」の呼称が秋田県湯沢市との区別に由来するかどうかは、公的・専門資料では確認できなかった
  updated: '2026-11-13'
- id: muni/15-燕市
  code: '152137'
  names:
    ja: 燕市
    reading: つばめし
    aliases:
    - 燕町
    - 津波目
  user_terms:
  - 燕市の名前の由来
  - 燕はなぜ「つばめ」と読むのか
  - 燕三条の燕
  - 金属洋食器のまち
  naming_type: 中心地名の継承
  formation: 合併新設
  prefecture: 新潟県
  homonyms: []
  summary: 市名の元になった地名は、古く「津波目（つばめ）」と書かれた。津は信濃川の河岸の船着場、目は中心地を意味し、米の集積地として栄えた場所だったと市公式は説く。「燕」の字に置き換わった時期と理由は明らかでなく、燕の群れと祠にまつわる言い伝えが伝説として残る。1954年に市制を施行し、2006年の合併でも「燕市」の名が選ばれた。
  first_attestation:
    era: 戦国時代
    year_western: null
    document: 水原憲家書状
    note: 燕市公式が「およそ510年前」の書状として紹介するもので、子・景家に「津波目の土地を与える」と記されていたという。書状の正確な年は未確認。「燕」表記の初出も未確認
  claims:
  - text: 燕市公式によれば、約510年前の水原憲家の書状に「おまえに津波目の土地を与える」とあり、燕は昔「津波目」と書かれていたことがわかる
    kind: fact
    level: E2
    status: established
    sources:
    - n1-tsubame-city-enkaku
  - text: 市公式の学説は、「津」は港（信濃川の河岸の船着場）、「目」は中心の意で、津波目は舟運の中継地として近くの村々の米が集まる中心地を意味したと解する
    kind: fact
    level: E2
    status: established
    sources:
    - n1-tsubame-city-enkaku
  - text: 約440年前、中ノ口川を流れてきた小さな祠（ほこら）が宮の浦で流れ止まり、その屋根や周囲にたくさんの燕が群れていたため、人々が拾い上げて守り神として祀り、この地が「燕の村」と呼ばれるようになったと伝えられている
    kind: legend
    level: E2
    status: established
    sources:
    - n1-tsubame-city-enkaku
  - text: 「津波目」がいつ頃、どうして「燕」という字に変わったかは、はっきりしていない（燕市公式の学説紹介による）
    kind: fact
    level: E2
    status: indeterminate
    sources:
    - n1-tsubame-city-enkaku
  - text: 昭和29年（1954）3月31日、西蒲原郡燕町・小池村・小中川村・松長村の合併により燕市が発足した
    kind: fact
    level: E2
    status: established
    sources:
    - n1-tsubame-city-enkaku
    - n1-tsubame-uub
  - text: 平成18年（2006）3月20日、燕市・吉田町・分水町が合併して新しい燕市が誕生し、新市の名称は合併協議会で「燕市」に決定されていた
    kind: fact
    level: E2
    status: established
    sources:
    - n1-tsubame-city-enkaku
  - text: 新潟県の市町村等団体コード一覧では、燕市の団体コードは152137とされている
    kind: fact
    level: E2
    status: established
    sources:
    - n1-niigata-code
  column:
    title: 「燕三条」という一つの名前
    text: 燕市と隣の三条市は、ともに金属加工で栄えた産地で、燕は「職人の町」、三条は「商人の町」と称され、互いに補い合ってきました。上越新幹線の駅名は両市にまたがる「燕三条駅」で、産地の総称も「燕三条」です。一時は両市の合併による「燕三条市」を目指す動きもありましたが、燕市の意向調査で反対が上回り、実現しませんでした。二つの市は今も別々の市のまま、一つの産地ブランドを共有しています。
    sources:
    - n1-tsubame-wikipedia
    - n1-sanjo-wikipedia
  relations:
  - pref/15
  - muni/15-三条市
  unknowns:
  - 水原憲家書状の正確な年代と所蔵先は、市公式ページの紹介の範囲を超えて確認できなかった
  - 「燕」表記への置き換えの時期・経緯は資料がなく未確認
  updated: '2026-11-13'
- id: muni/15-田上町
  code: '153613'
  names:
    ja: 田上町
    reading: たがみまち
    aliases:
    - 田上村
  user_terms:
  - あじさいの町
  - 新潟市の南に隣り合う町
  - 田上町の名前の由来
  naming_type: 中心地名の継承
  naming_note: 1901年の4村合併に際し、構成村の一つだった田上村の名を新村名に採用し、1973年の町制施行後も継承
  formation: 合併新設
  prefecture: 新潟県
  homonyms: []
  summary: 田上は1598年頃には地域の村の一つとして存在した古い地名である。明治22年（1889年）に田上・横場・保明・羽生田の4村となり、明治34年（1901年）11月1日に4村が合併して田上村となった。昭和48年（1973年）8月1日に町制を施行して田上町となり、合併でも町制でも名前は変わらなかった。現在は南蒲原郡を構成する唯一の町である。
  first_attestation:
    era: 慶長3年頃
    year_western: 1598
    document: 田上町公式「町制施行50周年について」
    note: 町公式が「今から425年前の1598年頃、田上地域で存在した村は田上・羽生田・湯川・川船河・坂田の5か村」と紹介する、村名としての使用例。中世以前の文書における用例は未確認
  claims:
  - text: 総務省の全国地方公共団体コードで、田上町の団体コードは153613と定められている
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  - text: 田上町公式によれば、今から425年前の1598年頃、田上地域で存在した村は田上・羽生田・湯川・川船河・坂田の5か村であった
    kind: fact
    level: E2
    status: established
    sources:
    - v6-tagami-town-50th
  - text: 『日本歴史地名大系』によれば、当町域は近世に入ると新発田藩領となり加茂組に組織され、町域中央部の田上村などは九ヶ村組合を結んで用水・排水を管理していた
    kind: fact
    level: E3
    status: established
    sources:
    - v6-tagami-kotobank-taikei
  - text: 田上町公式によれば、明治22年（1889年）に田上・横場・保明・羽生田の4村となり、明治34年（1901年）11月1日にその4村が合併して、現在の田上町の前身である田上村になった
    kind: fact
    level: E2
    status: established
    sources:
    - v6-tagami-town-50th
  - text: 田上町公式によれば、地の利のよさから住宅適地として転入世帯が増加し、昭和48年（1973年）に人口1万人突破が判明したことを契機として、同年8月1日に町制を施行し田上町となり、令和5年（2023年）に町制施行50周年を迎えた
    kind: fact
    level: E2
    status: established
    sources:
    - v6-tagami-town-50th
  - text: 田上町は現在、南蒲原郡を構成する唯一の町である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 名前が変わらなかった町制
    text: 田上の名は、1598年頃の地域の5か村の一つとしてすでに現れています。1901年の合併では、田上・羽生田・保明・横場の4村のうち「田上」が新しい村の名になり、1973年の町制施行でもそのまま「田上町」になりました。合併と町制という二つの大きな節目を越えて、400年以上同じ名前が受け継がれてきた町です。町は2023年に町制施行50周年を迎えました。
    sources:
    - v6-tagami-town-50th
  relations:
  - pref/15
  unknowns:
  - 「田上」の語源について、確認した公的・専門資料に明記した説明はなかった（田の上・段丘上の田など地形に結びつける解釈も裏付けは取れなかった）
  - 中世以前の文書における「田上」の用例は確認できなかった
  - 1901年の合併で新村名に「田上」を選んだ経緯を記した資料は確認できなかった
  updated: '2026-11-13'
- id: muni/15-粟島浦村
  code: '155861'
  names:
    ja: 粟島浦村
    reading: あわしまうらむら
    aliases:
    - 粟生島
    - 粟島浦
    - あおしま
  user_terms:
  - 新潟の離島の村
  - 一島一村の村
  - 粟島の名前の由来
  naming_type: 島名の継承
  naming_note: 島名「粟島」に近世以来の呼称「浦」を添えた村名。1889年以来、島全体を区域とする一島一村として存続
  formation: 単独発足
  prefecture: 新潟県
  homonyms: []
  summary: 村上市の沖合の日本海に浮かぶ粟島の全域を区域とする、一島一村の村。島は古く「粟生島」とも記され、「あおしま」とも呼ばれた。近世の旧高旧領取調帳には「粟島浦」とあり、村名は島名に「浦」を添えた形である。島は明治期に3度の大火に見舞われて古文書の大半が失われたため、江戸時代以前の歴史は伝承や地名・姓氏からの推論に頼る部分が大きい。
  first_attestation:
    era: 大同3年
    year_western: 808
    document: 『大同類聚方』
    note: 医書に島が「粟生」と記されたと紹介される使用例（原文は未確認）。なお『万葉集』巻十二に詠まれる「粟島」を当地にあてる説もあるが、『日本歴史地名大系』は「異論もあり未詳」とする
  claims:
  - text: 総務省の全国地方公共団体コードで、粟島浦村の団体コードは155861と定められている
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  - text: 『日本歴史地名大系』によれば、粟島は「粟生島」と記されることもあり、「あおしま」ともよばれた
    kind: fact
    level: E3
    status: established
    sources:
    - v6-awashima-kotobank
  - text: 『日本歴史地名大系』によれば、明治の旧高旧領取調帳には「粟島浦」とあり、村名「粟島浦村」は島名「粟島」に「浦」を添えた形である
    kind: fact
    level: E3
    status: established
    sources:
    - v6-awashima-kotobank
  - text: 『日本歴史地名大系』は、『万葉集』巻十二に「波の間ゆ雲居に見ゆる粟島の」と詠まれる「粟島」を当地にあてる説があるものの、異論もあり未詳とする
    kind: fact
    level: E3
    status: indeterminate
    sources:
    - v6-awashima-kotobank
  - text: 粟島の名の古い記録として、大同3年（808年）編纂の医書『大同類聚方』に「粟生」と記されたことが紹介されている
    kind: fact
    level: E5
    status: indeterminate
    sources:
    - v6-awashima-wiki
  - text: 環境省の調査報告によれば、粟島は明治期の3度の大火により歴史を語る文書・文献・資料が失われたため、江戸時代以前の状況については言葉や姓氏・地名・民俗・伝承からの推論によらざるを得ない
    kind: fact
    level: E2
    status: established
    sources:
    - v6-awashima-env
  - text: 粟島浦村公式によれば、村は粟島全域を区域とし、面積9.78km2、東西4.4km・南北6.1kmで、東岸に内浦、西岸に釜谷の集落がある一島一村である
    kind: fact
    level: E2
    status: established
    sources:
    - v6-awashima-vill
    - v6-awashima-kotobank
  - text: 明治22年（1889年）の町村制施行で粟島浦村が発足し、以後合併することなく存続している。平成の大合併でも合併せず、単独存続を選んだ
    kind: fact
    level: E4
    status: established
    sources:
    - upg-ac1-awashimaura-geoshape
    - upg-ac1-niigata-heisei-gappei
  column:
    title: 大火に焼かれた島の、名前の層
    text: 粟島の古い記録は明治の大火で失われ、島の名前の歴史は断片からたどるしかありません。それでも、大同年間の医書に記されたという「粟生」、『万葉集』の粟島を当地とする説（専門辞典は未詳とします）、そして近世の「粟島浦」と、表記の層が残っています。「粟」の語源そのものは今も確かめられていませんが、名前の層の重なりが、この小さな島の長い歴史を物語っています。
    sources:
    - v6-awashima-kotobank
    - v6-awashima-env
    - v6-awashima-wiki
  relations:
  - pref/15
  - muni/15-村上市
  unknowns:
  - 「粟」の語源（粟粒のように小さい島とする説や粟の栽培に結びつける説）は観光資料レベルの紹介にとどまり、専門資料では確認できなかった
  - 嘉禄3年（1227年）の藤原頼経下文に「色部・粟嶋」と見えるとする紹介があるが、専門辞典では未確認
  - 村の成立当初は「粟島浦」と称し「村」の字が付いた時期がはっきりしないとする資料もあり、改称時期は特定できなかった
  - 1889年の発足時の構成（内浦・釜谷の2集落の合併）はWikipediaのみで確認しており、公的・専門資料での裏付けは未確認
  updated: '2026-11-13'
- id: muni/15-糸魚川市
  code: '152161'
  names:
    ja: 糸魚川市
    reading: いといがわし
    aliases:
    - 糸魚川町
    - 糸井川
    - 奴奈川
  user_terms:
  - 糸魚川市の名前の由来
  - 糸魚川という川はあるのか
  - ヒスイのまち糸魚川
  - 奴奈川姫の里
  naming_type: 中心地名の継承
  formation: 合併新設
  prefecture: 新潟県
  homonyms: []
  summary: 市名は川の名に由来すると考えられてきたが、現在の市内に「糸魚川」という川は存在しない。古文書の表記は「沼川（奴奈川）」から「糸井川」（1387年）を経て「糸魚川」（1509年）へ移り変わり、語源には糸魚（イトヨ）説、新羅系帰化人の糸井造一族説など諸説あって決着していない。1954年に市制を施行し、2005年に能生町・青海町と合併した。
  first_attestation:
    era: 永正6年
    year_western: 1509
    document: 長尾為景書状・村山氏系図
    note: 「糸魚川」表記の用例（糸魚川市公式が『糸魚川市史』の調査として紹介）。より古くは至徳4年（1387）の市川頼房軍忠状に「糸井川」、延元2年（1337）の禰知盛継状などに「沼川（奴奈川）」とある
  claims:
  - text: 現在の糸魚川市内に「糸魚川」という名の河川は存在しない（糸魚川市公式）
    kind: fact
    level: E2
    status: established
    sources:
    - n1-itoigawa-city-iwaware
  - text: 糸魚川市公式が紹介する『糸魚川市史』の調査では、この地名の古文書用例は1337年などの「沼川（奴奈川）」、1387年の「糸井川」、1509年の「糸魚川」と移り変わっている
    kind: fact
    level: E2
    status: established
    sources:
    - n1-itoigawa-city-iwaware
  - text: 『糸魚川市史』の執筆者・青木重孝は、新羅から渡来して帰化した糸井造の一族がこの地に入ったことが名の起こりとする説を唱え、現在最も有力とされるが、市公式自身が史料のない推測の範囲であり、疑問点も指摘されているとしている
    kind: fact
    level: E2
    status: contested
    sources:
    - n1-itoigawa-city-iwaware
  - text: 糸魚（イトヨ）が市内の河川に多く棲んでいたことから名付けられたとする説があり、旧糸魚川町の町章を引き継いだ市の市章は、名産の糸魚（イトヨ）三尾を図案化したものである（糸魚川市公式）
    kind: fact
    level: E2
    status: established
    sources:
    - n1-itoigawa-city-iwaware
  - text: 弘法大師（空海）が竹管に糸を巻いて川に投じたところ、たちまち魚となって泳ぎ回ったという言い伝えが、糸魚川の名の由来として伝えられている
    kind: legend
    level: E2
    status: established
    sources:
    - n1-itoigawa-city-iwaware
  - text: 対立する軍がこの地で挑み合った「いどみ川」からの転化、あるいは「淀（よど）み川」「厭（いと）い川」からの転化という言い伝えもある
    kind: legend
    level: E2
    status: established
    sources:
    - n1-itoigawa-city-iwaware
  - text: 昭和29年（1954）6月1日、糸魚川町・浦本村・大野村・根知村など9町村が合併して糸魚川市が発足した
    kind: fact
    level: E4
    status: established
    sources:
    - n1-itoigawa-uub
  - text: 平成17年（2005）3月19日、糸魚川市・能生町・青海町が合併して現在の糸魚川市となった
    kind: fact
    level: E4
    status: established
    sources:
    - n1-itoigawa-uub
  - text: 新潟県の市町村等団体コード一覧では、糸魚川市の団体コードは152161とされている
    kind: fact
    level: E2
    status: established
    sources:
    - n1-niigata-code
  column:
    title: ヒスイと奴奈川姫の里
    text: 糸魚川の姫川流域は、縄文時代からヒスイ（硬玉）の産地でした。長者ケ原遺跡ではヒスイの加工や玉作りが行われ、その玉は遠く各地へ運ばれました。そしてこの地は、『古事記』に大国主命との歌謡の掛け合いが残る奴奈川姫（ぬなかわひめ）の国でもあります。「奴奈川」は糸魚川の古い名の一つで、姫の名は古い地名を今に伝えています。地名が糸井川・糸魚川へと姿を変えるはるか前から、この川沿いは物語のある土地でした。
    sources:
    - n1-itoigawa-city-nenpyo
    - n1-itoigawa-city-iwaware
  relations:
  - pref/15
  unknowns:
  - 「糸井川」の「井」がなぜ「魚」になったのかは、市公式も不明としており未解決
  - 糸井造一族説を裏づける史料はなく、語源は決着していない
  - 奴奈川（沼川）と糸魚川の指す範囲の違い（広域地名と狭域地名）の詳細は市史原典の確認が必要
  updated: '2026-11-13'
- id: muni/15-聖籠町
  code: '153079'
  names:
    ja: 聖籠町
    reading: せいろうまち
    aliases:
    - 聖籠山
    - 聖籠村
  user_terms:
  - せいろうと読む難読地名の町
  - 新潟東港のある町
  - さくらんぼの町
  - 聖籠町の名前の由来
  naming_type: 自然地名から
  naming_note: 宝積院の縁起に由来する山名「聖籠山」から生まれた地名を継承
  formation: 合併新設
  prefecture: 新潟県
  homonyms: []
  summary: 「聖籠（せいろう）」は難読地名として知られる。平安時代に高徳の僧（聖）が町内の宝積院のある山に堂舎を建てて籠ったことから、その山が「聖籠山」と呼ばれ、地名になったと伝えられる。慶長3年（1598年）の溝口氏の新田開発で聖籠村などが形成され、1906年・1955年の合併を経て、昭和52年（1977年）8月に町制を施行して聖籠町となった。
  first_attestation:
    era: 慶長3年
    year_western: 1598
    document: 聖籠町公式「聖籠町バイオマスタウン構想」
    note: 溝口侯の加治川治水と新田開発により聖籠村などの村落が誕生したと町公式が紹介する年。「聖籠山」の命名自体は平安時代の伝承に結びつけられるが、その文書上の初出は未確認
  claims:
  - text: 総務省の全国地方公共団体コードで、聖籠町の団体コードは153079と定められている
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  - text: 友好交流都市である三重県川越町の公式サイトによる聖籠町の紹介は、大同元年（806年）にこの地の山に僧侶が籠もったことから、人々が高徳の僧（聖）の籠もった山として「聖籠山」と名付け、「聖籠」の地名が生まれたと伝えている
    kind: legend
    level: E2
    status: established
    sources:
    - v6-seirou-kawagoe
  - text: 新潟県の地域文化データベース「新潟文化物語」は、地名は町内の宝積院の縁起に由来し、平安時代に僧侶（聖）が堂舎を建てて山に籠ったため、その山を「聖籠山」と呼んだとする
    kind: legend
    level: E4
    status: established
    sources:
    - v6-seirou-nstory
  - text: 聖籠町公式の計画によれば、慶長3年（1598年）に新発田へ入った溝口侯が加治川の治水事業と新田開発を行い、聖籠村・蓮野村・蓮潟村・藤井村・亀代村などの村落が誕生した
    kind: fact
    level: E2
    status: established
    sources:
    - v6-seirou-town-biomass
  - text: 聖籠町公式によれば、明治39年（1906年）の合併で聖籠村と亀代村の2村となり、昭和30年（1955年）3月に両村が合併して聖籠村となった
    kind: fact
    level: E2
    status: established
    sources:
    - v6-seirou-town-biomass
    - v6-seirou-town-ayumi
  - text: 聖籠町公式によれば、昭和52年（1977年）8月に町制を施行して聖籠町となり、新潟県で54番目の町であった
    kind: fact
    level: E2
    status: established
    sources:
    - v6-seirou-town-ayumi
  - text: 川越町の公式サイトによる聖籠町の紹介によれば、聖籠町はさくらんぼの生産量が新潟県内の約90%を占め第1位である
    kind: fact
    level: E2
    status: established
    sources:
    - v6-seirou-kawagoe
  column:
    title: 「聖」が「籠もった」山の名
    text: 「せいろう」という読みにくい名前は、山に籠って修行した高徳の僧の伝承から生まれたとされます。平安時代、僧が宝積院の山に堂舎を建てて籠ったため、人々はその山を「聖籠山」と呼びました。江戸初期に溝口氏の新田開発で生まれた聖籠村は、周辺の村々との合併を重ね、1977年に町になりました。今では新潟東港に臨む町であり、県内一のさくらんぼの産地としても知られています。
    sources:
    - v6-seirou-kawagoe
    - v6-seirou-nstory
    - v6-seirou-town-biomass
  relations:
  - pref/15
  unknowns:
  - 「聖籠山」という山名の文書上の初出は確認できなかった
  - 大同元年（806年）という由来伝承の年代の典拠となる古記録は確認できなかった
  - 「聖籠」が聖籠神社に由来するとする資料は確認できず、確認できたのは宝積院の縁起に結びつく「聖籠山」の伝承のみだった
  updated: '2026-11-13'
- id: muni/15-胎内市
  code: '152277'
  names:
    ja: 胎内市
    reading: たいないし
    aliases: []
  user_terms:
  - たいない
  - 胎内川
  - 胎内高原
  - 中条
  - 黒川
  naming_type: 自然地名から
  formation: 合併新設
  prefecture: 新潟県
  homonyms: []
  summary: 新潟県北部の市で、2005年に中条町・黒川村が合併して発足した。市名は市域の中心を流れる胎内川にちなみ、合併ガイドブックは胎内川を「母なる川」と呼んで新市のシンボルと説明する。川の名は鎌倉時代の古文書に万葉仮名で見えると紹介され、語源にはアイヌ語起源説もある。旧町村名の中条・黒川は鎌倉時代の地頭の分与に由来する別の層を持つ。
  first_attestation:
    era: 鎌倉時代
    year_western: 1241
    document: つふらの尼譲状
    note: 仁治元年（1241）の古文書に胎内川が「堂以乃可八（たいのかハ）」と見えるとWikipedia「胎内川」が紹介するもの。一次資料を直接確認していないため紹介として記録する
  claims:
  - text: 2005年9月1日に中条町・黒川村の新設合併で胎内市が発足し、市役所のある旧中条町が中心地となった
    kind: fact
    level: E2
    status: established
    sources:
    - u5-tainai-guidebook
  - text: 市名「胎内」は、市域の中心を流れる清流・胎内川が「正に母なる川『胎内』が新市のシンボルである」として名付けられたと、市の合併ガイドブックが説明する
    kind: fact
    level: E2
    status: established
    sources:
    - u5-tainai-guidebook
  - text: 胎内川の名は、仁治元年（1241）の古文書「つふらの尼譲状」に「堂以乃可八（たいのかハ）」と見え、弘長4年（1264）の譲状にも同表記が見えると紹介されている
    kind: fact
    level: E2
    status: established
    sources:
    - u5-tainai-wiki
  - text: 胎内川の語源について、藤井尚治『越佐地名考』（昭和6年、1931）はアイヌ語の「トイナイ」から出たと述べたが、後の研究には否定的な見解もあると紹介されている
    kind: fact
    level: E5
    status: contested
    sources:
    - u5-tainai-wiki
  - text: 旧町村名の中条・黒川は、鎌倉時代に地頭・和田氏の財産分与により、地域の中央を「中条（中条氏）」、北側を「北条（黒川氏）」と呼ぶようになったことに由来すると市の新市建設計画が説明する
    kind: fact
    level: E2
    status: established
    sources:
    - u5-tainai-kensetsu
  - text: 鎌倉時代の女武将・板額御前にまつわる史跡や逸話が、中条・黒川の両地域に残ると伝えられている
    kind: legend
    level: E2
    status: indeterminate
    sources:
    - u5-tainai-kensetsu
  column:
    title: 「たいのかハ」と書かれた川――万葉仮名の胎内川
    text: 鎌倉時代の譲状の中で、胎内川は「堂以乃可八」と万葉仮名で書かれていたという。「たいのかは」と読むこの表記は、「胎内」という漢字が当てられる前の川の音を伝える。やがて当てられた「胎内」の字は、母の胎内を思わせる字面となり、2005年の合併では市が自ら「母なる川」と呼び直した。音・字・意味が時代ごとに重なっていった川の名である。
    sources:
    - u5-tainai-wiki
    - u5-tainai-guidebook
  relations:
  - pref/15
  unknowns:
  - 胎内川の語源の確定説（アイヌ語起源説は否定的見解もあり未確定）
  - 「胎内」の漢字表記が定着した時期は未確認
  - 市名が公募によるものか協議会の決定によるものか、ガイドブックからは断定できなかった
  updated: '2026-11-13'
- id: muni/15-見附市
  code: '152111'
  names:
    ja: 見附市
    reading: みつけし
    aliases:
    - 見付
  user_terms:
  - みつけ
  - 新潟県の重心
  - 県内最小の市
  - 今町
  naming_type: 中心地名の継承
  formation: 編入合併
  prefecture: 新潟県
  homonyms: []
  summary: 新潟県のほぼ中央にある、県内で最も面積の小さい市。「見附」の名は戦国時代の古文書に「見付条」と見えるのが初出とされるが、城郭用語の「見附（見張り所）」から直接来たかどうかは確定していない。市の公式のあゆみによれば戦国時代には見附城があり、1954年に市制施行した。市内には新潟県の重心がある。
  first_attestation:
    era: 戦国時代
    year_western: 1519
    document: 山吉政久安堵状（上杉家文書）
    note: 『日本歴史地名大系』が「見附の名は永正16年（1519）4月19日の山吉政久安堵状（上杉家文書）に『見付条』とみえる」と紹介するもの。原文を直接確認したものではない
  claims:
  - text: 見附の名は永正16年（1519）4月19日の山吉政久安堵状（上杉家文書）に「見付条」と見えるのが確認できる初出である（『日本歴史地名大系』）
    kind: fact
    level: E3
    status: established
    sources:
    - u5-mitsuke-kotobank
  - text: 一般名詞としての「見附（見付）」は、城郭の要所に置かれた見張り所・升形を指す語である（『改訂新版世界大百科事典』）
    kind: fact
    level: E3
    status: established
    sources:
    - u5-mitsuke-imi
  - text: 地名「見附」が見張り所の意味から直接名付けられたかどうかを示す確定資料は確認できておらず、語源は未確定である
    kind: fact
    level: E2
    status: indeterminate
    sources:
    - u5-mitsuke-kotobank
    - u5-mitsuke-imi
  - text: 市公式のあゆみによれば、16世紀に「みつけ」の文字が確認され、戦国時代には「見附城」があった
    kind: fact
    level: E2
    status: established
    sources:
    - u5-mitsuke-city
  - text: 1954年3月31日に見附町が新潟村・葛巻村と上北谷村の一部を編入して市制施行し、1956年に今町を編入した
    kind: fact
    level: E2
    status: established
    sources:
    - u5-mitsuke-city
    - u5-mitsuke-uub
  - text: 見附市は新潟県内で面積が最も小さい市であり、県の重心（北緯37度31分19秒・東経138度54分50秒）が市内にある（市公式）
    kind: fact
    level: E2
    status: established
    sources:
    - u5-mitsuke-city
  column:
    title: 県のど真ん中にある、由来の分からない名
    text: 見附市には新潟県の重心点がある。県のほぼ中央という立地は、戦国時代にこの地が見張りの要所だったとしても不思議はない位置ではある。しかし「見附」という名が見張り所に由来するという確かな証拠は残っていない。初出が1519年の古文書という古い名でありながら、意味の層だけが取り残された地名である。県の重心という確かな事実と、名の由来の空白が同居している。
    sources:
    - u5-mitsuke-city
    - u5-mitsuke-kotobank
  relations:
  - pref/15
  unknowns:
  - 「見附」の語源（見張り所説は一般名詞の意味からの類推にとどまり、直接の裏づけは未確認）
  - 戦国時代の見附城の所在地と城主の詳細は未確認
  updated: '2026-11-13'
- id: muni/15-長岡市
  code: '152021'
  names:
    ja: 長岡市
    reading: ながおかし
    aliases:
    - 長岡町
  user_terms:
  - 長岡市の名前の由来
  - 長岡はなぜ長岡というのか
  - 長岡藩・河井継之助の長岡
  - 米百俵のまち
  - 長岡花火のまち
  naming_type: 中心地名の継承
  formation: 合併新設
  prefecture: 新潟県
  homonyms: []
  summary: 市名は江戸時代の長岡藩の城下町・長岡町を受け継いだものである。「長岡」の名は慶長年間に文書に現れ、堀直寄が信濃川近くのこの地に長岡城を築いて城下町を開いた。語源は「長い丘陵」に由来する説が有力とされるが、定説はない。明治39年（1906年）に市制を施行し、平成17〜22年（2005〜2010年）の3度の合併で市域が大きく広がった。
  first_attestation:
    era: 慶長10年
    year_western: 1605
    document: 「長岡渡し」に言及する文書（『日本歴史地名大系』の記述として紹介される）
    note: 城の完成（1616年）に先立ち、「長岡」の名が文書に現れる最初とされる例。渡し場の名としての使用
  claims:
  - text: 「長岡」の名が文書に出てくるのは慶長10年（1605年）のことで、蔵王堂渡しの渡し守に関わる文書に「長岡渡し」が見えるという
    kind: fact
    level: E4
    status: established
    sources:
    - l3-nagaoka-weblio
  - text: 蔵王堂城は信濃川のそばでたびたび水害を受けていたため、堀直寄は信濃川からやや離れた長岡に新たな城を築き、城下町を移そうとした
    kind: fact
    level: E3
    status: established
    sources:
    - l3-nagaoka-kotobank-castle
  - text: 元和2年（1616年）に堀直寄が長岡城を築き、のちに牧野氏が藩主となって、長岡は牧野氏の城下町・信濃川水運の町として発展した
    kind: fact
    level: E3
    status: established
    sources:
    - l3-nagaoka-kotobank-castle
    - l3-nagaoka-kotobank
  - text: 「長岡」の語源は定かではなく、『長岡市史』は千手・神田表町あたりの地が遠くから長い丘のように見えるからとする説、『越後往古城主付』は長岡京に似ているからとする説、『越後治乱記』は長岡縫殿介にちなんだとする説をそれぞれ伝える
    kind: fact
    level: E4
    status: contested
    sources:
    - l3-nagaoka-weblio
  - text: 明治39年（1906年）に長岡町が市制を施行して長岡市が誕生した
    kind: fact
    level: E3
    status: established
    sources:
    - l3-nagaoka-kotobank
  - text: 平成17年（2005年）4月1日、中之島町・越路町・三島町・山古志村・小国町の5町村を編入合併した
    kind: fact
    level: E2
    status: established
    sources:
    - l3-nagaoka-chukatsu
  - text: 平成18年（2006年）1月1日に栃尾市・与板町・和島村・寺泊町を、平成22年（2010年）3月31日に川口町を編入し、市域は新潟県の中央部を日本海側から福島県境近くまで横断する形となった
    kind: fact
    level: E2
    status: established
    sources:
    - l3-nagaoka-chukatsu
  - text: 総務省「地方公共団体コード一覧」では、長岡市のコードは152021とされる
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 市章は「不死鳥」
    text: 長岡市の市章は、昭和52年（1977年）の本庁舎完成を機に制定されたもので、限りなく発展する長岡市を「不撓不屈の不死鳥（フェニックス）」の姿に託して表現したという。戦災や震災のたびに復興を重ねてきた長岡にとって、不死鳥はまちの象徴として定着している。市名の由来とは別に、まちのアイデンティティを示す名前ならぬ「姿」の命名である。
    sources:
    - l3-nagaoka-shigikai
  relations:
  - pref/15
  unknowns:
  - 「長岡」の語源は諸説あり、いずれも伝承の域を出ない。『長岡市史』など一次の市史本文そのものは未読で、紹介経由の記録にとどまる
  - 慶長10年（1605年）の「長岡渡し」の文書そのものは未確認で、二次資料の紹介による
  updated: '2026-11-13'
- id: muni/15-関川村
  code: '155811'
  names:
    ja: 関川村
    reading: せきかわむら
    aliases:
    - 関川郷
    - 荒河保
  user_terms:
  - せきかわ
  - えちごせきかわ温泉郷
  - 下関の宿場町
  - 猫ちぐらの村
  naming_type: 合成地名
  naming_note: 関谷村の「関」と女川村の「川」を合わせた合成地名とみられる
  formation: 合併新設
  prefecture: 新潟県
  homonyms: []
  summary: 荒川中流の山間の村。1954年に関谷村と女川村が合併して生まれた新名で、「関」は米沢街道の宿場として栄えた中心集落・下関（上関）に由来する古い地名、「川」は女川村・女川に通じる字とみられる。村の中心の下関には豪農・豪商の屋敷が残り、中世には一帯は「荒河保」と呼ばれた。
  first_attestation:
    era: 近世
    year_western: null
    document: 『近世関川郷史料』（関川村教育委員会編、1978年）に収められる史料群
    note: 近世には一帯が「関川郷」と呼ばれたことが、村教育委員会編の史料集の題名にも残る。村名「関川」そのものの初出は1954年の合併による命名で、それ以前の地域名としての「関川」の確実な初出文書は特定できていない
  claims:
  - text: 昭和29年（1954年）8月1日、関谷村と女川村が合併して関川村が発足した
    kind: fact
    level: E2
    status: established
    sources:
    - v7-sekikawa-koho
    - v7-sekikawa-niigata-pref
  - text: 新村名「関川」は、関谷村の「関」と女川村の「川」を組み合わせた合成地名とみるのが自然である。村の広報は、新村名の由来が発足の経緯とともに『関川村史』に記録されていると紹介している
    kind: fact
    level: H
    status: inferred
    sources:
    - v7-sekikawa-koho
  - text: 関谷村は明治34年（1901年）11月1日に関村・七箇谷村・九箇谷村の合併で生まれ、その前身の関村は明治22年（1889年）4月1日に上関村・下関村など12か村の合併で発足した
    kind: fact
    level: E4
    status: established
    sources:
    - upg-ag1-sekikawa-uub-1901
    - upg-ag1-sekimura-uub
  - text: 「関」の字は上関・下関の集落名に由来する
    kind: fact
    level: E5
    status: established
    sources:
    - v7-sekikawa-wiki
  - text: 下関・上関は、米沢街道の宿駅であり荒川舟運の拠点として盛えた集落で、江戸〜明治期の豪商・豪農の屋敷並みが今に残る
    kind: fact
    level: E4
    status: established
    sources:
    - v7-sekikawa-kankou
    - v7-sekikawa-kotobank-taikei
  - text: 村域は中世には「荒河保」と呼ばれ、正応5年（1292年）には奥山荘との所領境界の論争が和解し、要所に境界を示すぼう示石が据えられたと、村観光協会の史跡解説が伝える
    kind: fact
    level: E4
    status: established
    sources:
    - v7-sekikawa-kankou
  - text: 当地には古代の関「桂の関」が置かれたと伝えられ、盤舟柵の前進基地に始まり奥山荘の成立の頃に設置されたと、現地の「桂の関由来碑」が説明する
    kind: legend
    level: E4
    status: indeterminate
    sources:
    - v7-sekikawa-kankou
  - text: 大里峠には、琵琶法師が大蛇に姿を変えられた女から関郷を水没させる企みを聞き、村人を救ったという大蛇伝説が伝わる
    kind: legend
    level: E4
    status: established
    sources:
    - v7-sekikawa-kankou
  - text: 関川村の地方公共団体コードは155811である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 大蛇がつなぐ水害の記憶――「大したもん蛇まつり」
    text: 関川村には大里峠の大蛇伝説が伝わる。琵琶法師が、大蛇に姿を変えられた女から関郷を水没させる企みを打ち明けられ、約束を破って村人に知らせたために消されてしまった、という物語である。この伝説は今も村の祭りに生きていて、毎年8月下旬の「関川村大したもん蛇まつり」では長さ82.8メートルの大蛇が村内を練り歩く。82.8という半端な数字は偶然ではなく、昭和42年（1967年）8月28日の羽越豪雨（8.28水害）の日付にちなむ。伝説の大蛇は、水害の記憶を村に留める役割も担っているのである。
    sources:
    - v7-sekikawa-kankou
    - v7-sekikawa-wiki
  relations:
  - pref/15
  unknowns:
  - 「関川村」という新村名の命名理由を明記した一次資料（合併協議の記録）。『関川村史』に記録があると村広報は紹介するが、紙媒体の同書を確認できていない
  - 「関」（上関・下関）という集落名の確実な初出文書と年代。関所に由来するかどうかも含め未確認
  - 「荒河保」の「荒河」が現在の荒川の古名かどうかは、資料では確定できなかった
  updated: '2026-11-13'
- id: muni/15-阿賀町
  code: '153851'
  names:
    ja: 阿賀町
    reading: あがまち
    aliases: []
  user_terms:
  - あが
  - あがまち
  - 奥阿賀
  - 阿賀野川の町
  naming_type: 文献・故事から命名
  naming_note: 公募と合併協議により、地域を流れる阿賀野川・地方名「阿賀」から命名
  formation: 合併新設
  prefecture: 新潟県
  homonyms: []
  summary: 阿賀野川中流の山間の町。2005年に津川町・鹿瀬町・三川村・上川村が合併して生まれた平成合併の新名で、町名は町の中央を流れる阿賀野川に由来する。公募で集まった候補から「東阿賀」との最終候補2点に絞られ、「阿賀」が選ばれた。「阿賀」は阿賀野川流域の上流〜中流域を指す地方名でもある。
  first_attestation:
    era: 平成17年
    year_western: 2005
    document: 阿賀町の発足（2005年4月1日の新設合併）
    note: 町名としての初出は2005年。地方名・川名としての「阿賀」「阿賀野」の文献上の初出は特定できていない
  claims:
  - text: 平成17年（2005年）4月1日、東蒲原郡の津川町・鹿瀬町・上川村・三川村の4町村が新設合併して阿賀町が発足した
    kind: fact
    level: E2
    status: established
    sources:
    - v7-aga-ndl
    - v7-aga-wiki
  - text: 新町名は公募によって集められ、上位には「奥阿賀」「東蒲原」「阿賀野」などもあったが、候補は絞り込まれ、最終候補2点「阿賀」「東阿賀」から「阿賀」が新町名に選ばれた
    kind: fact
    level: E4
    status: established
    sources:
    - v7-aga-uub
  - text: 町名は、地域を流れる阿賀野川にちなんで名付けられた。新潟県の合併記録によれば、法定合併協議会では東蒲原郡を縦貫する阿賀野川にちなんだ名前を新町名として支持する意見が大勢を占め、「阿賀町」に決定した
    kind: fact
    level: E2
    status: established
    sources:
    - upg-ac1-aga-gappeishi
  - text: 「阿賀」は新潟県の地方名でもあり、阿賀野川流域のうち上流〜中流の地域（東蒲原郡阿賀町および阿賀野市）を指し、その上流部は「奥阿賀」とも呼ばれる
    kind: fact
    level: E5
    status: established
    sources:
    - v7-aga-wiki
  - text: 阿賀野川は福島県側では阿賀川と呼ばれ、新潟県に入ると阿賀野川と名を変える
    kind: fact
    level: E2
    status: established
    sources:
    - v7-agano-mlit
  - text: 阿賀野川・阿賀川の「アガ」「阿賀野」の語源には定説がなく、国土交通省阿賀野川河川事務所はアイヌ語の「ワッカ」（清い川）説と「揚野」の当て字で開墾しても水田にならない小高い土地を指すとする説を紹介し、阿賀川河川事務所は仏教用語の「閼伽」（水の意味）が変化したとする説を紹介している
    kind: fact
    level: E2
    status: contested
    sources:
    - v7-agano-mlit
    - v7-agagawa-mlit
  - text: 町域を含む東蒲原郡域は、江戸時代は会津藩領で、明治維新後も若松県・福島県と所属が変わり、明治19年（1886年）に新潟県へ移管された（『日本歴史地名大系』「東蒲原郡」項が、明治初年の一時期を除いて明治19年まで会津の支配下に置かれたと記していることを、国立国会図書館のレファレンス事例が紹介している）
    kind: fact
    level: E2
    status: established
    sources:
    - upg-ac1-aga-ndl-crd
  - text: 阿賀町の地方公共団体コードは153851である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 新潟県なのに、明治の半ばまで福島県だった町
    text: 阿賀町はいま新潟県東蒲原郡の町だが、江戸時代は会津藩領で、明治維新後も若松県・福島県と所属が移り、明治19年（1886年）に新潟県へ移管された。文化も言葉も会津寄りである。阿賀野川を下れば新潟、遡れば会津若松という位置にあり、中心の津川は会津と越後を結ぶ舟運の拠点だった。合併で生まれた「阿賀」という町名は、県境にまたがる川そのものの名であり、どちらの県にも偏らない地域の名として選ばれたとも読める。県の所属は変わっても、川でつながる地域のまとまりは変わらなかったのである。
    sources:
    - v7-aga-wiki
    - v7-agano-mlit
    - upg-ac1-aga-ndl-crd
  relations:
  - pref/15
  - muni/15-阿賀野市
  unknowns:
  - 地方名「阿賀」および川名「阿賀川」の文献上の初出
  - 阿賀野川の語源は諸説あり定説がない（国土交通省の各河川事務所の紹介する説も一致しない）
  updated: '2026-11-13'
- id: muni/15-阿賀野市
  code: '152234'
  names:
    ja: 阿賀野市
    reading: あがのし
    aliases: []
  user_terms:
  - あがの
  - 瓢湖
  - 白鳥の湖
  - 水原
  - 五頭温泉郷
  naming_type: 合成地名
  formation: 合併新設
  prefecture: 新潟県
  homonyms: []
  summary: 新潟県北東部の市で、2004年に北蒲原郡の安田町・水原町・京ヶ瀬村・笹神村が新設合併して発足した。市名は市域の南西を流れる阿賀野川に由来するとされる。旧中心地の水原は江戸時代に代官所が置かれた行政の中心で、白鳥の飛来地・瓢湖で知られる。旧町村の名は地区名として残り、その一つ笹神は笹岡と神山の合成地名である。
  first_attestation:
    era: null
    year_western: null
    document: null
    note: 市名「阿賀野」は2004年の合併による新名。決定経緯は新潟県『新潟県における平成の市町村合併誌』に記録されている（公募・候補の絞り込み・決選投票と選定理由）
  claims:
  - text: 2004年4月1日に北蒲原郡の安田町・水原町・京ヶ瀬村・笹神村が新設合併して阿賀野市が市制施行した
    kind: fact
    level: E4
    status: established
    sources:
    - u5-agano-uub
  - text: 市名「阿賀野」は阿賀野川にちなんで名付けられた。新潟県の合併記録によれば、新市名は公募（812種1,889通）で集まった候補から10候補に絞られ、決選投票で「阿賀野」が選ばれた。選定理由は「阿賀野は全国的にも知名度があり、悠々とした大河に育まれて、その恵みを享受し発展してきた当地域を表現するにふさわしい名称」と記録されている
    kind: fact
    level: E2
    status: established
    sources:
    - upg-ac1-agano-gappeishi
  - text: 旧中心地の水原には江戸中期の1746年に幕府直轄領の代官所が設置され、明治初頭の水原県設置の頃まで周辺地域の行政の中心地であった（阿賀野市公式資料）
    kind: fact
    level: E2
    status: established
    sources:
    - u5-agano-bunkatsu
  - text: 水原の瓢湖は白鳥の飛来地として知られる
    kind: fact
    level: E2
    status: established
    sources:
    - u5-agano-bunkatsu
  - text: 旧笹神村は1956年9月30日に笹岡村と神山村が合併してできた合成地名であり、合併した四町村の名は今も地区名として残っている
    kind: fact
    level: E4
    status: established
    sources:
    - u5-agano-sasakami-uub
    - u5-agano-uub
  - text: 市役所は旧水原町の区域に置かれている
    kind: fact
    level: E4
    status: established
    sources:
    - u5-agano-uub
  column:
    title: 川の名をもらった市、四つの旧名が残る地区
    text: 阿賀野市の市名は川の名だが、市の中の暮らしの単位は今も安田・水原・京ヶ瀬・笹神という旧町村の名で呼ばれる。水原には代官所の置かれた行政の中心としての歴史があり、笹神という名自体が笹岡と神山の合成という、もう一回り古い合併の化石である。新市の名は一番大きな川から取り、地区の名は人の暮らしのほうに残ったという二層構造になっている。
    sources:
    - u5-agano-uub
    - u5-agano-bunkatsu
  relations:
  - pref/15
  unknowns:
  - 旧町村名の安田・京ヶ瀬それぞれの地名の由来は未確認
  updated: '2026-11-13'
- id: muni/15-魚沼市
  code: '152251'
  names:
    ja: 魚沼市
    reading: うおぬまし
    aliases:
    - 北魚沼郡
  user_terms:
  - うおぬま
  - 魚沼産コシヒカリ
  - 小出
  - 堀之内
  naming_type: 旧行政区画名の継承
  formation: 合併新設
  prefecture: 新潟県
  homonyms: []
  summary: 新潟県南東部の市で、2004年に北魚沼郡の6町村が合併して発足した。市名の「魚沼」は古代の郡名に遡り、『和名類聚抄』では「伊乎乃」の訓で見える。語源は「イホノ（庵野）」説などがあって確定していない。旧中心地の小出は魚野川水運の河港・三国街道の宿場町として栄えた歴史を持つ。
  first_attestation:
    era: 平安時代
    year_western: null
    document: 和名類聚抄（魚沼郡）
    note: 『日本歴史地名大系』によれば『和名抄』東急本は魚沼郡に「伊乎乃」の訓を付す。大宝2年（702）に越後国へ編入されたとする『続日本紀』の記載も同書が紹介するが、ここでは紹介として扱う
  claims:
  - text: 魚沼郡は『和名類聚抄』に「伊乎乃」と訓を付して見え、『延喜式』民部省には「イヲヌ」、同書神名帳には「イオノ」の訓が見える（『日本歴史地名大系』）
    kind: fact
    level: E3
    status: established
    sources:
    - u5-uonuma-kotobank
  - text: 魚沼郡は初め越中国に属し、大宝2年（702）3月に他の三郡とともに越後国に編入されたと、『続日本紀』同年3月17日条の記載として『日本歴史地名大系』が紹介する
    kind: fact
    level: E2
    status: established
    sources:
    - u5-uonuma-kotobank
  - text: 『和名類聚抄』は魚沼郡の郷として賀祢・那珂・剌上・千屋の四郷を記す（『日本歴史地名大系』）
    kind: fact
    level: E3
    status: established
    sources:
    - u5-uonuma-kotobank
  - text: 「魚沼」の語源は、開発途上の原野に仮小屋が多かったことを意味する「イホノ（庵野）」と考えられるという説があり、魚の多い川にちなむ説や沼が多い地とする説も併記されている
    kind: fact
    level: E4
    status: contested
    sources:
    - u5-uonuma-gogen
  - text: 市名は古代以来の魚沼郡の名を引き継ぐもので、2004年11月1日に北魚沼郡の堀之内町・小出町・湯之谷村・広神村・守門村・入広瀬村の6町村が新設合併して魚沼市が発足した
    kind: fact
    level: E4
    status: established
    sources:
    - u5-uonuma-uub
    - u5-uonuma-kotobank
  - text: 旧中心地の小出は鎌倉時代初期から魚野川水運の河港として成り、もとは破間川河口の「小出嶋」と呼ばれた船着場であった（魚沼市公式）
    kind: fact
    level: E2
    status: established
    sources:
    - u5-uonuma-city
  - text: 江戸時代の小出は魚沼八組の一つ小出嶋組の大割元が置かれ、三国街道の宿場町・縮布の市場として栄えた（魚沼市公式）
    kind: fact
    level: E2
    status: established
    sources:
    - u5-uonuma-city
  column:
    title: 「魚沼」という字が当てられるまで――イホノ・イオノ・イヲヌ
    text: 古代の文献の中で、この地の名の読みは安定していなかった。『和名類聚抄』は「伊乎乃（いほの／いおの）」、『延喜式』は「イヲヌ」「イオノ」と訓を振る。仮小屋の多い開け途上の原野を意味する「イホノ」だったという説が有力とされるが、のちに「魚沼」の字が定着すると、今度は魚の豊かな水郷という意味で読まれるようになった。現代の「魚沼産コシヒカリ」のブランドは、この後から当てられた字のイメージの上に成り立っている。
    sources:
    - u5-uonuma-kotobank
    - u5-uonuma-gogen
  relations:
  - pref/15
  unknowns:
  - 「魚沼」の語源の確定説（イホノ説・魚の川説・沼地説のいずれも決着していない）
  - 「魚沼」の漢字表記が定着した時期は未確認
  - 合併時に市名として「魚沼」を採用した協議の詳細は未確認
  updated: '2026-11-13'
