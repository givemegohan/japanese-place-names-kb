  - text: 1961年5月1日に川越村が町制施行して川越町となった
    kind: fact
    level: E5
    status: established
    sources:
    - x8-kawagoe-wiki
  - text: 町域の約半分は、江戸時代に桑名藩領だった頃の新田開発によって生まれた伊勢湾の干拓地である
    kind: fact
    level: E5
    status: established
    sources:
    - x8-kawagoe-wiki
  - text: 本町は三重郡の北東端にあり東は伊勢湾に臨む町で、城下町として発達した埼玉県川越市とは読みと漢字が同じでも成り立ちの異なる別自治体である
    kind: fact
    level: E3
    status: established
    sources:
    - x8-kawagoe-kotobank
    - x8-kawagoe-town
  - text: 1959年の伊勢湾台風を契機に地先の海面埋立事業が計画され、1973年に完成して中部電力川越火力発電所が立地した
    kind: fact
    level: E2
    status: established
    sources:
    - x8-kawagoe-pref
  - text: 川越町の地方公共団体コードは243442である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 川を越えた先の、発電所の町
    text: 埼玉県の川越といえば城下町の面影で知られるが、三重の川越はまったく違う顔を持つ。町名の由来は、1889年の合併で朝明川の北と南の村々が「川を越えて」一つになったという、町公式がはっきり書き残す素直な命名である。その土地の半分は江戸時代に干拓で生まれた新田で、1959年の伊勢湾台風の後には海面埋立が進み、やがて中部電力の川越火力発電所が立つ工業の町へと変わった。同じ「かわごえ」でも、片や川を越えて生まれ、海を埋めて育った町なのである。
    sources:
    - x8-kawagoe-town
    - x8-kawagoe-pref
  relations:
