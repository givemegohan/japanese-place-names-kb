records:
- id: muni/36-つるぎ町
  code: '364681'
  names:
    ja: つるぎ町
    reading: つるぎちょう
    aliases: []
  user_terms:
  - つるぎ
  - 剣山の町
  - 美馬郡つるぎ町
  - 貞光・半田・一宇
  naming_type: 自然地名から
  naming_note: 剣山にちなむとみられる新規のひらがな名
  formation: 合併新設
  prefecture: 徳島県
  homonyms: []
  summary: 美馬郡の町。2005年3月1日に半田町・貞光町・一宇村の3町村が新設合併して発足した（半田町と貞光町の2町合併ではなく、一宇村を含む3町村の合併である）。新町名「つるぎ」は構成町村のいずれの名でもない新規のひらがな名で、町の背後にそびえる剣山（つるぎさん、西日本第2位の高峰）にちなむ名とみられる。ただし、合併協議会が命名理由を明記した公式記録は確認できていない。
  first_attestation:
    era: 現代
    year_western: 2005
    document: 新町名の官報告示（2004年8月17日）
    note: 市区町村変遷情報によれば、新町名「つるぎ町」の官報告示は2004年8月17日で、地名としての使用は2005年3月1日の町発足に始まる
  claims:
  - text: 2005年（平成17年）3月1日、美馬郡の半田町・貞光町・一宇村の3町村が新設合併してつるぎ町が発足した
    kind: fact
    level: E4
    status: established
    sources:
    - q9-tsurugi-uub
  - text: 新町名「つるぎ町」の官報告示は2004年（平成16年）8月17日であり、合併協議は美馬郡合併協議会で行われた
    kind: fact
    level: E4
    status: established
    sources:
    - q9-tsurugi-uub
  - text: つるぎ町長の随想は、町について「西日本第二位の高峰『剣山』（標高1955ｍ）を借景にして、私のふるさと『つるぎ町』はある」と記しており、剣山が町の象徴的な存在であることが町自身の言葉で示されている
    kind: fact
    level: E4
    status: established
    sources:
    - q9-tsurugi-zck
  - text: 町章の色の意味は、青色が吉野川の清流、緑色が自然、白色が剣山を意味すると説明されており、町のアイデンティティが剣山と強く結び付けられている
    kind: fact
    level: E5
    status: established
    sources:
    - q9-tsurugi-wiki
  - text: 新町名「つるぎ」は構成3町村のいずれの名でもなく、町域の背後にそびえる剣山（つるぎさん）の名にちなんで新たに付けられたひらがな名とみられる。ただし、合併協議会が命名理由を明記した公式な記録は確認できなかった
    kind: fact
    level: H
    status: inferred
    sources:
    - q9-tsurugi-uub
    - q9-tsurugi-zck
  - text: 林野庁によれば、剣山そのものの名の由来にも、安徳天皇の宝剣からついたとも、石灰岩が侵食された山容が剣状だからとも、山頂付近の鶴岩・亀岩（鶴亀）と関係するともいわれ、諸説がある
    kind: fact
    level: E2
    status: contested
    sources:
    - q9-tsurugi-rinya
  - text: つるぎ町の地方公共団体コードは364681である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 霊峰の読みを、ひらがなで受け継いだ町名
    text: つるぎ町は、漢字を捨ててひらがなで名乗る町である。その名の由来とみられる剣山は、標高1,955ｍ、徳島県の最高峰で西日本第2位の高峰であり、古くから信仰の山として知られてきた。剣山という山名自体にも、平家の安徳天皇の宝剣を山に納めたからという伝説、石灰岩の山容が剣のようだからという説、鶴岩・亀岩の「鶴亀」に由来するという説など、諸説があるという（林野庁）。2005年、半田町・貞光町・一宇村の3町村が合併したとき、どの町村の名も残さず、背後の霊峰の読み「つるぎ」を新しい町の名に選んだ。町長の随想も、町を紹介する第一声に剣山を置いている。
    sources:
    - q9-tsurugi-zck
    - q9-tsurugi-rinya
    - q9-tsurugi-uub
  relations:
  - pref/36
  unknowns:
  - 新町名「つるぎ」の公式な命名理由（剣山にちなむことの明文）は、合併協議会資料・町公式サイトでは確認できなかった
  - 新町名の選定過程（公募の有無・候補名）は確認できなかった
  updated: '2026-11-13'
- id: muni/36-三好市
  code: '362085'
  names:
    ja: 三好市
    reading: みよしし
    aliases: []
  user_terms:
  - みよしし 徳島
  - 大歩危・祖谷のある市
  - 三好郡の合併市
  - 愛知県のみよし市とは違う三好市
  naming_type: 旧行政区画名の継承
  formation: 合併新設
  prefecture: 徳島県
  homonyms: []
  summary: 2006年3月1日に三好郡の三野町・池田町・山城町・井川町・東祖谷山村・西祖谷山村が合併して誕生した市で、市名には郡名「三好」がそのまま採用された。当初は三好郡全体での合併が検討されたが、東部の三好町・三加茂町は東みよし町として同日に分かれて発足した。戦国大名・三好長慶で知られる三好氏はこの三好郡を拠点とした一族で、氏の名は郡名に由来し、郡名のほうが先にあった。大歩危・小歩危や祖谷のかずら橋を市域に含む。
  first_attestation:
    era: null
    year_western: null
    document: null
    note: 市名「三好市」の初出は2006年の発足時である。元になった郡名「三好」の文献上の初出は、特定できなかった。
  claims:
  - text: 三好市は2006年3月1日、三好郡の三野町・池田町・山城町・井川町・東祖谷山村・西祖谷山村が合併して誕生した。
    kind: fact
    level: E2
    status: established
    sources:
    - q4-miyoshi-yoran
  - text: 合併した6町村はいずれも三好郡に属し、新市名には郡名「三好」がそのまま採用された。
    kind: fact
    level: E2
    status: established
    sources:
    - q4-tokushima-enkaku
    - q4-miyoshi-uub
  - text: もともと三好郡の8町村全体での合併が検討されたが合併の枠組みで折り合わず、西部6町村の「三好市」と、東部2町（三好町・三加茂町）の「東みよし町」に分かれて同じ日に発足した。
    kind: fact
    level: E4
    status: established
    sources:
    - q4-miyoshi-uub
  - text: 新市名は、三野町と井川町が加わった後に改めて公募され、上位案から候補5点（阿波池田・三好・あわ池田・阿波三好・四国池田）、最終候補2点（阿波池田・三好）に絞られた末に「三好市」に決まった（市区町村変遷情報による）。
    kind: fact
    level: E4
    status: established
    sources:
    - q4-miyoshi-uub
  - text: 新市名「三好市」の決定に対しては、中心地だった池田町で反対意見の動きが強まり、池田町議会で合併の見直しを求める意見が出された。
    kind: fact
    level: E5
    status: established
    sources:
    - q4-miyoshi-wiki
  - text: 三好長慶で知られる三好氏は、三好郡を本拠とした一族であり、氏の名は三好郡に住んだことに由来する。すなわち「三好」の名は三好氏にちなんで付けられたのではなく、郡名が先にあって氏がそれを名乗ったものである。
    kind: fact
    level: E3
    status: established
    sources:
    - upg-s11-miyoshiuji-kotobank
  - text: 愛知県西加茂郡三好町が市制移行にあたり「三好市」を名乗ることを打診したが、徳島の三好市は2007〜2008年度に反対の意思を伝えた。そのため愛知県側は、2010年に平仮名の「みよし市」として市制を施行した。
    kind: fact
    level: E4
    status: established
    sources:
    - upg-s11-miyoshi-uub-aichi
  - text: 三好市の地方公共団体コードは362085である。
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 「三好市」を譲らなかった市
    text: 全国でも珍しいのが、「三好」という名をめぐる二つの自治体の綱引きである。愛知県の三好町は町名も読みも徳島の三好市と同じで、市制を施行すれば当然「三好市」になるはずだった。しかし先行していた徳島の三好市が公式に反対を表明したため、愛知県側は異例の平仮名市名「みよし市」を選んだ。一方、徳島の三好市の足元でも、三好町と三加茂町は合併から離れて「東みよし町」となり、「三好」を名乗る自治体は三好市・東みよし町・みよし市・三次市（三好とは無関係）の4つが並ぶややこしい地図になった。「三好」はもともと郡の名で、戦国大名の三好氏さえその郡名を借りた側である。名の正統をめぐる小さな争いは、郡名の古さの裏返しでもある。
    sources:
    - q4-miyoshi-wiki
  relations:
  - pref/36
  - muni/36-東みよし町
  - muni/23-みよし市
  - muni/34-三次市
  unknowns:
  - 新市名の決定手続きは市区町村変遷情報に公募と候補名の記録があるが、合併協議会の一次資料そのものによる確認はできていない。また、池田町議会で合併の見直しを求める意見が出されたかどうかも、一次資料では確認できていない。
  - 郡名「三好」自体の語源と文献上の初出は確認できなかった。
  updated: '2026-11-13'
- id: muni/36-上勝町
  code: '363022'
  names:
    ja: 上勝町
    reading: かみかつちょう
    aliases: []
  user_terms:
  - かみかつ
  - ゼロ・ウェイストの町
  - 葉っぱビジネスの町
  - 日本で最も美しい村の町
  naming_type: 方位・位置による命名
  formation: 合併新設
  prefecture: 徳島県
  homonyms: []
  summary: 徳島県中部の勝浦郡の町。勝浦川の上流域の山間にあり、1955年に高鉾村・福原村が合併して発足した。町名の「上」は郡の上流部という位置を示す名とみられる。現在は料理のつまものを出荷する「葉っぱビジネス」と、2003年のゼロ・ウェイスト宣言で知られるが、これらは町名の由来とは別の近年の町の姿である。
  first_attestation:
    era: 昭和30年
    year_western: 1955
    document: 徳島県「市・郡沿革表」
    note: 1955年7月20日に高鉾村・福原村が合併して「上勝町」として発足したことが町名の初出にあたる
  claims:
  - text: 総務省の地方公共団体コード一覧で、上勝町の団体コードは363022と定められている
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  - text: 1955年7月20日、高鉾村・福原村が合併して上勝町が発足した
    kind: fact
    level: E2
    status: established
    sources:
    - q4-tokushima-enkaku
    - q10-nii-kamikatsu
  - text: 1889年10月1日の町村制施行で高鉾村・福原村が発足し、両村は1955年7月20日に合併して上勝町となるまで存続した。現在の町域はこの2村の区域からなる
    kind: fact
    level: E2
    status: established
    sources:
    - upg-s1-kamikatsu-takahoko-geoshape
    - upg-s1-kamikatsu-fukuhara-geoshape
  - text: 町域は勝浦川の上流域に広がり、徳島市から南西約40kmの山地に55の集落が点在する
    kind: fact
    level: E2
    status: established
    sources:
    - q10-kamikatsu-ronbun
  - text: 「上勝」という町名は、勝浦郡の上流部（北部）に位置することにちなむ位置名とみられるが、1955年の合併時にこの名が選ばれた経緯を示す公式記録は確認できていない
    kind: fact
    level: H
    status: inferred
    sources:
    - q10-kamikatsu-ronbun
  - text: 上勝町は徳島県で唯一、「日本で最も美しい村」連合に加盟している自治体である
    kind: fact
    level: E2
    status: established
    sources:
    - upg-s1-utsukushii-federation
  - text: 町が全国的に知られる「葉っぱビジネス」とゼロ・ウェイストの取り組みは近年の町の政策・産業であり、町名「上勝」の由来とは関係がない
    kind: fact
    level: E2
    status: established
    sources:
    - q10-kamikatsu-ronbun
    - q10-wiki-kamikatsu
  column:
    title: 上流の「上」が、環境の町の名になった
    text: 「上勝」の「上」は、勝浦川をさかのぼった郡の奥という位置を示す、飾らない地名である。その町が今では、料理に添える葉を商品化した「葉っぱビジネス」と、ごみを出さない暮らしを目指すゼロ・ウェイスト宣言で全国に知られる。名前の生まれた理由と町の現在の顔がこれほど離れている例も珍しく、地名は町のイメージより長生きすることの証しになっている。
    sources:
    - q10-kamikatsu-ronbun
    - q10-wiki-kamikatsu
  relations:
  - pref/36
  - muni/36-勝浦町
  unknowns:
  - 「上勝」の命名理由を示す1955年当時の合併協議等の公式記録は未確認
  - 郡名「勝浦」の語源と町名「上勝」の成立との関係は未確認
  updated: '2026-11-13'
- id: muni/36-上板町
  code: '364053'
  names:
    ja: 上板町
    reading: かみいたちょう
    aliases: []
  user_terms:
  - かみいた
  - 安楽寺のある町
  - 阿波藍と和三盆の町
  - 板野郡の西の町
  naming_type: 方位・位置による命名
  formation: 合併新設
  prefecture: 徳島県
  homonyms: []
  summary: 徳島県北東部、板野郡の町。吉野川の北岸にあり、1955年に板野郡の松島町・大山村と名西郡の高志村が郡を越えて合併して発足した。町名の「上」は板野郡の上流側（西部）という位置を示す名とみられる。江戸時代には阿波藍と阿波和三盆糖の産地として知られ、四国八十八箇所第6番札所の安楽寺がある。
  first_attestation:
    era: 昭和30年
    year_western: 1955
    document: 徳島県「市・郡沿革表」
    note: 1955年3月31日に松島町・大山村・名西郡高志村が合併して「上板町」として発足したことが町名の初出にあたる
  claims:
  - text: 総務省の地方公共団体コード一覧で、上板町の団体コードは364053と定められている
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  - text: 1955年3月31日、板野郡松島町・大山村と名西郡高志村が合併して上板町が発足した
    kind: fact
    level: E2
    status: established
    sources:
    - q4-tokushima-enkaku
    - q10-nii-kamiita
  - text: 1889年（明治22年）10月1日に、松島村・大山村・高志村が発足した
    kind: fact
    level: E2
    status: established
    sources:
    - upg-ae2-tokushima-hensen
    - q10-nii-kamiita
  - text: 板野郡はかつて板東郡と板西郡に分割されていた時期があり、『日本歴史地名大系』は、鎌倉時代前期までに両郡に分割され、寛文4年（1664年）に合併して板野郡が再置されたとする。一方、分割を902年、再合併を1644年とする紹介もあり、年次には資料間で食い違いがある
    kind: fact
    level: E3
    status: contested
    sources:
    - upg-s1-itano-gun-taikei
    - q10-wiki-kamiita
  - text: 「上板」という町名は、板野郡の西部（吉野川の上流側）に位置することにちなむ位置名とみられるが、1955年の合併時の命名経緯を示す公式記録は確認できていない
    kind: fact
    level: H
    status: inferred
    sources:
    - q10-wiki-kamiita
  - text: 町域は江戸時代に阿波藍の産地の一つであり、阿波和三盆糖の生産の中心地でもあった。阿波藍製造は文化庁の日本遺産「藍のふるさと阿波」の構成要素に位置づけられ、阿波三盆糖は上板地方を中心に生産が続いたと阿波学会の研究が記す
    kind: fact
    level: E2
    status: established
    sources:
    - upg-s1-ai-heritage
    - upg-s1-awa-sanpento
  - text: 四国八十八箇所第6番札所の安楽寺が町内に所在する
    kind: fact
    level: E3
    status: established
    sources:
    - upg-s1-henro-taikei
  column:
    title: 郡を越えた合併と、割れて戻った郡の名
    text: 上板町の合併は、板野郡の2町村に名西郡の高志村が加わる「越郡合併」だった。その舞台である板野郡自体も、かつて板東郡と板西郡に分かれていた時期があり、後に元の板野郡に戻ったという数奇な履歴を持つ。「上板」の「上」も、郡の中での位置を示す名であり、この町の名は郡の歴史の層の上に乗っている。
    sources:
    - q10-wiki-kamiita
    - q4-tokushima-enkaku
  relations:
  - pref/36
  - muni/36-板野町
  unknowns:
  - 「上板」の命名理由を示す1955年当時の公式記録は未確認
  - 郡名「板野」自体の語源は、角川日本地名大辞典・日本歴史地名大系等の専門資料での確認が未了
  updated: '2026-11-13'
- id: muni/36-佐那河内村
  code: '363219'
  names:
    ja: 佐那河内村
    reading: さなごうちそん
    aliases: []
  user_terms:
  - さなごうち
  - 徳島県で唯一の村
  - さくらももいちごの村
  - 合併しなかった村
  naming_type: 中心地名の継承
  formation: 単独発足
  prefecture: 徳島県
  homonyms: []
  summary: 徳島県東部、名東郡の村で、県内で唯一の「村」。1889年に上佐那河内村・下佐那河内村の区域をもって発足して以来、一度も合併せず区域が変わっていない。村内を園瀬川が北東へ流れる。村史は治安年間（1021〜1024年）に上・下佐那河内村と名付けられたと伝えるが、『日本歴史地名大系』は村名を佐那河内守にちなむとする『阿波志』の説を紹介しており、「佐那」の語源は確定していない。
  first_attestation:
    era: 平安時代（11世紀前半と伝わる）
    year_western: null
    document: 村史（佐那河内村の公式発信が紹介）
    note: 治安年間（1021〜1024年）に上佐那河内村・下佐那河内村と名付けられたと村史が伝えると村の公式発信が紹介するが、一次史料での直接確認はできていない。『日本歴史地名大系』は村名を佐那河内守にちなむとする『阿波志』の説を紹介する
  claims:
  - text: 総務省の地方公共団体コード一覧で、佐那河内村の団体コードは363219と定められている
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  - text: 1889年10月1日、上佐那河内村・下佐那河内村の区域をもって佐那河内村が発足し、以後、行政区画の変動がない
    kind: fact
    level: E2
    status: established
    sources:
    - q4-tokushima-enkaku
    - q10-wiki-sanagochi
  - text: 佐那河内村は徳島県で唯一の「村」である
    kind: fact
    level: E2
    status: established
    sources:
    - q4-tokushima-enkaku
    - q10-wiki-sanagochi
  - text: 村名の成立について、村史は後一条天皇の治安年間（1021〜1024年）に上佐那河内村・下佐那河内村と名付けられたと伝え、村の公式発信もそのように紹介する。一方『日本歴史地名大系』は、村名は佐那河内守がいたことにちなむとする『阿波志』の説を紹介し、村域が以西郡に属したのは中世から近世前期のこととする
    kind: fact
    level: E4
    status: contested
    sources:
    - upg-s1-sanagochi-furunavi
    - upg-s1-sanagochi-taikei
  - text: 村域は中世から近世前期には以西郡に属し、寛文4年（1664年）以降は名東郡に属した
    kind: fact
    level: E3
    status: established
    sources:
    - upg-s1-sanagochi-taikei
  - text: 村内を園瀬川が南西から北東へ流れ、その支流の嵯峨川がこれに合流する
    kind: fact
    level: E3
    status: established
    sources:
    - upg-s1-sanagochi-taikei
  - text: 村名の由来について『日本歴史地名大系』は、佐那河内守がいたことにちなむとする『阿波志』の説を紹介するが、「佐那」自体の語源を確定する説明は確認できていない
    kind: fact
    level: E3
    status: indeterminate
    sources:
    - upg-s1-sanagochi-taikei
  column:
    title: 県でたった一つ、130年以上変わらない「村」
    text: 徳島県の基礎自治体は24あるが、「村」を名乗るのは佐那河内村だけである。しかもこの村は1889年の町村制施行以来、一度も合併を経験せず、区域がそのまま現在まで続いている。昭和・平成の大合併の波を二度くぐり抜けた小さな村の名は、自治体の名としては県内で最も古い層に属する現役の名前といえる。
    sources:
    - q4-tokushima-enkaku
    - q10-wiki-sanagochi
  relations:
  - pref/36
  - muni/36-上勝町
  unknowns:
  - 「佐那」の語源は未確認（川名由来説の裏付けも取れていない）
  - 村名「佐那河内」の成立時期を示す一次史料は未確認
  - 「河内」が川の流域の内側を指す地形語かどうかは未確認
  updated: '2026-11-13'
- id: muni/36-勝浦町
  code: '363014'
  names:
    ja: 勝浦町
