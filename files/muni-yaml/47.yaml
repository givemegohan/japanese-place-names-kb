- id: muni/47-うるま市
  code: '472131'
  names:
    ja: うるま市
    reading: うるまし
    aliases:
    - 具志川市
    - 石川市
    - ウルマ
  user_terms:
  - うるま
  - サンゴの島という意味の市名
  - 具志川と石川が合併した市
  - 勝連城跡のある市
  naming_type: 新規命名
  formation: 合併新設
  prefecture: 沖縄県
  homonyms: []
  summary: 平成17年（2005年）4月1日、具志川市・石川市・勝連町・与那城町の2市2町が合併して発足した、沖縄本島中部・東海岸の市。市名の「うるま」は、サンゴの島を意味する沖縄の古い言葉で、沖縄そのものを指す美称として使われてきた語であり、合併に際して全国公募の中から選ばれた。合併した旧市町の名はいずれも近世の間切名に遡るが、その詳しい由来は市の資料でも不明とされている。
  first_attestation:
    era: 平成17年
    year_western: 2005
    document: 合併協議会による新市名の決定（うるま市発足）
    note: 市名としての初出は2005年の合併時。語としての「うるま」はそれ以前から琉球・沖縄を指す語として使われ、首里王府の史料では和歌の辞書『呉竹集』を引いて琉球の意と説明されることが市勢要覧で紹介されている（原典は未確認）
  claims:
  - text: うるま市の地方公共団体コードは472131である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  - text: うるま市は平成17年（2005年）4月1日、旧具志川市・旧石川市・旧勝連町・旧与那城町の2市2町が合併して誕生した
    kind: fact
    level: E2
    status: established
    sources:
    - s5-uruma-20th
  - text: 新市名は全国から募集した5,233件・2,457種類の中から名称検討委員会で12種類まで選考し、最終的に合併協議会で「うるま市」に決定されたもので、最終候補には「暁市」「若夏市」などもあった
    kind: fact
    level: E2
    status: established
    sources:
    - s5-uruma-yoran
  - text: 市名の由来について市は、「サンゴの島」のことを「ウルマ（ウル＝サンゴ、マ＝島）」と呼び、美しい景観の沖縄の島々を示す言葉でもあることから「うるま市」と名付けられたと説明している
    kind: fact
    level: E2
    status: established
    sources:
    - s5-uruma-20th
    - s5-uruma-gaiyo
  - text: 「うるま」という言葉は、日本で平安時代には言葉の通じない遠い地という意味で使われていたようで、琉球の別称とされるようになったのは室町時代以降といわれていることが、市の市勢要覧で紹介されている
    kind: fact
    level: E2
    status: established
    sources:
    - s5-uruma-yoran
  - text: 合併した旧市町の名（石川・具志川・勝連・与那城）は近世より続く間切や集落の名称として『おもろさうし』や首里王府等の史料より確認できるが、詳しい地名の由来は不明となっていると市の資料は述べている
    kind: fact
    level: E2
    status: established
    sources:
    - s5-uruma-gaiyo
  - text: 市域の勝連城跡は、平成12年（2000年）に「琉球王国のグスク及び関連遺産群」の一つとして世界遺産に登録された
    kind: fact
    level: E2
    status: established
    sources:
    - s5-uruma-20th
  column:
    title: 国会議事堂を飾る「ウルマ石」
    text: 市名と同じ「うるま」を名に持つ石がある。旧勝連町平敷屋で採れるトラバーチン（石灰華）で、1929年に国会議事堂の建築資材の調査で沖縄を訪れた工学博士がその優秀さを見出し、「ウルマ石」と名付けて国会議事堂の玄関に使われたことが市の市勢要覧に紹介されている。「サンゴの島」という意味の古い言葉が、合併市の名前になる75年も前に、東京の国会議事堂の石材の名前として先に全国へ出ていたことになる。サンゴ礁の島に育まれた石灰岩の石と、「ウルマ」という言葉の取り合わせは、この土地の成り立ちをよく表している。
    sources:
    - s5-uruma-yoran
  relations:
  - pref/47
  unknowns:
  - 「うるま」の語源（ウル＝サンゴ、マ＝島という分解）は市の説明によるもので、琉球語学の専門資料では確認できなかった
  - 公募の応募総数以外の選考過程（12候補の顔ぶれの全体）は協議会の一次資料では確認できなかった
  - 旧間切名（具志川・石川・勝連・与那城）それぞれの地名の由来は、市の資料でも不明とされている
  updated: '2026-11-13'
- id: muni/47-与那原町
  code: '473481'
  names:
    ja: 与那原町
    reading: よなばるちょう
    aliases:
    - 与那原
    - ゆなばる（沖縄語の現地読み）
  user_terms:
  - 与那原 大綱曳 テーク
  - 沖縄で一番小さい町
  - よなばる 読み方
  naming_type: 中心地名の継承
  naming_note: 大里間切・大里村の一字「与那原」の名を継承し、1949年に分離して町となった
  formation: 分村・分立
  prefecture: 沖縄県
  homonyms: []
  summary: 沖縄本島南部、中城湾に面する町で、沖縄本島で最も面積の小さい自治体である。町名は旧大里間切の与那原村（後の大里村の字）の名に由来し、『おもろさうし』に「よなはる」と歌われる古い地名である。戦前は軽便鉄道のターミナルを擁する港町として栄え、1949年に大里村から分離すると同時に町制を施行した。沖縄三大大綱引きの一つ「与那原大綱曳（テーク）」の町として知られる。
  first_attestation:
    era: 16世紀
    year_western: null
    document: 『おもろさうし』
    note: 財務省の広報誌は、与那原が『おもろさうし』に「ヨナハル」「ヨナハバマ」の名で登場すると紹介する。『おもろさうし』は1531年から1623年にかけて編纂された歌謡集で、個々の歌の成立年は特定できない。
  claims:
  - text: 町名は旧大里間切の与那原村（後の大里村の字・与那原）に由来する。与那原は1879年の廃藩置県後は大里間切に組み入れられ、1908年の町村制では大里村の一字となった
    kind: fact
    level: E2
    status: established
    sources:
    - s9-mof-finance
  - text: 与那原の名は、沖縄最古の歌謡集『おもろさうし』の中に「ヨナハル」「ヨナハバマ」の形で現れると、財務省の広報誌は紹介している
    kind: fact
    level: E2
    status: established
    sources:
    - s9-mof-finance
  - text: 語源については、『ブリタニカ国際大百科事典』が、町名は近世の大里間切与那原村により「海岸の砂（ヨナ）」に由来すると説明する。一方、「ハル（バル）」が開拓地・原を指すとする部分については、専門辞典での記載の確認が取れていない
    kind: fact
    level: E3
    status: indeterminate
    sources:
    - upg-t6-yonabaru-kotobank
  - text: 1949年（昭和24年）、与那原は大里村から分離し、同年4月に町制を施行して与那原町となった。分離と町制施行が同時という珍しい発足である
    kind: fact
    level: E2
    status: established
    sources:
    - s9-mof-finance
  - text: 与那原大綱曳は1500年代の尚永王の時代に始まるとされ、那覇・糸満と並ぶ沖縄三大大綱引きの一つで、綱を上下に地面へ打ち付けながら曳く独特の形式を持つ
    kind: fact
    level: E2
    status: established
    sources:
    - s9-mof-finance
    - s9-yonabaru-navi
  - text: 大綱曳の起源について『与那原町の民話』は、害虫が発生して稲が実らなかった年、姥捨て山に捨てられた老人の教えで、野山の草を集めて焼き、鐘やドラを打ち鳴らして大声を出しながら綱を曳いたところ害虫がいなくなった、という言い伝えを伝える
    kind: legend
    level: E2
    status: established
    sources:
    - s9-mof-finance
  - text: 町内には「東御廻り（あがりうまーい）」の拝所である御殿山や親川があり、与那原は王国時代の祭祀の道に位置する地だった
    kind: fact
    level: E2
    status: established
    sources:
    - s9-yonabaru-navi
  - text: 与那原町の面積は5.18平方キロメートルで、沖縄県の統計資料（国土地理院の面積調に基づく県内全41市町村の一覧）では県内で2番目に小さく、より小さいのは離島の渡名喜村（3.87平方キロメートル）のみである。したがって沖縄本島では最も小さい自治体である
    kind: fact
    level: E2
    status: established
    sources:
    - upg-t6-okinawa-toukeisho
    - upg-t6-yonabaru-kotobank
  - text: 自治体コードは473481である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 捨てられた老人の知恵が綱になった
    text: 与那原大綱曳の起源を伝える民話は、沖縄の姥捨て伝説と結びついている。昔、害虫が大発生して稲が実らなかった年、人々は山に捨てた老人に知恵を借りた。野山の草を集めて焼き、鐘やドラを打ち鳴らし、大声を上げながら綱を曳け。その通りにすると害虫は消えたという。綱引きが豊作祈願の行事として根づいた背景には、「捨てたはずの年長者の知恵に救われた」という物語がある。現在の大綱曳でも、綱を上下に地面へ叩きつける所作や、綱の上に支度（神人）を乗せる形式に、単なる力比べではない祈りの行事の面影が残る。
    sources:
    - s9-mof-finance
  relations:
  - pref/47
  - muni/47-南城市
  unknowns:
  - 『おもろさうし』のどの巻の歌に与那原が現れるかと、その歌の成立年
  - 「ハル（バル）＝開拓地・原」という語源説の後半部分について、専門辞典での記載の直接確認（「ヨナ＝海岸の砂」の部分はブリタニカ国際大百科事典で確認済み。なお同書は「サンゴ砂」とまでは記していない）
  updated: '2026-11-13'
- id: muni/47-与那国町
  code: '473821'
  names:
    ja: 与那国町
    reading: よなぐにちょう
    aliases:
    - 与那国村
    - ドゥナン
    - どぅなん
  user_terms:
  - ドゥナン
  - ドナン
  - どぅなん
  - 与那国島の名前の由来
  - 日本最西端の町
  - 台湾に一番近い町
  - ゆうなの島
  naming_type: 島名の継承
  formation: 分村・分立
  prefecture: 沖縄県
  homonyms: []
  summary: 町名は与那国島の島名に由来する一島一町の自治体である。島は地元の言葉（与那国語）で「どぅなん（ドゥナン）」と呼ばれ、「与那国」はそれに対応する標準語の名とされる。語源は諸説あり、池間栄三は海岸植物「ゆうな」（オオハマボウ）の群生地の意とする説を有力とする一方、富島壯英は米・砂を意味する「よね」に語源を求める結論を出しており、確定していない。日本最西端の自治体で、台湾まで約107kmしか離れていない。1914年に与那国村として発足し、1948年に町制を施行した。
  first_attestation:
    era: 文明9年
    year_western: 1477
    document: 李朝実録（朝鮮王朝実録）
    note: 1477年2月に朝鮮・済州島の住民3人が与那国島に漂着した事件の記録が、与那国島の文献への初出とされる。漂流民は八重山・宮古の島々を経て首里へ送られる途次、与那国島に最も長く滞在したとされる（学術論文およびWikipedia「与那国島」の紹介による）
  claims:
  - text: 与那国島は日本最西端の島であり、島の人々には「ドゥナン・チマ（Dunan Cima）」と呼ばれてきた。与那国町は日本最西端の市町村である
    kind: fact
    level: E2
    status: established
    sources:
    - s12-jmic-cosmology
    - s12-wiki-yonaguni-town
  - text: 島名「どぅなん」の語源は確定していない。池間栄三『与那国の歴史』は、海岸植物「ゆうな」（オオハマボウ）の群生地の意とする説を有力とし、石垣島で与那国を「ゆのおん」と呼ぶのは「ゆうな・ふん（ふんは群れの意）」の転訛で、与那国方言では語頭のヤ行が濁音化するため「ゆうな」が「どぅな」になったと説明し、この説はほぼ定説化しているとされる。これに対し富島壯英は諸説を検討した上で、「ゆうな」という樹木名自体が海岸の沖積地「ユナ」に生える木の意であり、その語源は米・砂を意味する「よね」に求めるべきで、「どぅなん」は与那・与那原・与那城など「与那」を冠する地名と同系統であると結論付け、祖納の原名「与那原（どぅなんばら）」をその起源と関係づけた
    kind: fact
    level: E2
    status: contested
    sources:
    - s12-okimu-tomishima
  - text: 与那国島付近は天候が不安定で海を渡るのが難しいため「渡難（どぅなん）」と呼ばれたともいわれるが、俗説とされる
    kind: legend
    level: E5
    status: indeterminate
    sources:
    - s12-wiki-yonaguni-island
  - text: 沖縄県立博物館・美術館の総合調査報告書は、サンアイ・イソバを15世紀末に与那国島に君臨したとされる人物とし、伝承では四人の男兄弟を村々に配置して自ら島を統治したと言われていると記す。字島仲には「女首長サンアイ・イソバ出生の地」が町指定史跡として存在し、イソバの生まれた地と伝わるが、イソバの実在は確認されていない
    kind: legend
    level: E2
    status: indeterminate
    sources:
    - upg-ag4-yonaguni-okimu-report
  - text: 1908年（明治41年）の島嶼町村制で石垣・大浜・宮良の3間切と与那国島を合わせて八重山村となり、1914年（大正3年）に八重山村が分村して与那国村が成立した
    kind: fact
    level: E3
    status: established
    sources:
    - l6-ishigaki-kotobank-shi
    - upg-t5-yonaguni-geoshape-son
  - text: 国立情報学研究所「歴史的行政区域データセットβ版」では、与那国町の有効期間は1948年12月1日からとされ、町役場の所在地は字与那国129とされる
    kind: fact
    level: E2
    status: established
    sources:
    - s12-yonaguni-geoshape
  - text: 1477年2月、朝鮮・済州島の住民3人が与那国島に漂着して約半年滞在した出来事は、朝鮮王朝の『李朝実録』に記録され、与那国島の文献上の初出とされる。島にはこの漂流者たちをめぐる口承（フガヌトゥ伝承）が与那国語で伝えられ、近年の学術研究で口承と実録の記述との対応が詳しく確認されている
    kind: fact
    level: E2
    status: established
    sources:
    - s12-jmic-drifters
  - text: 地方公共団体コードは473821である（総務省「地方公共団体コード一覧」で実測確認）
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 朝鮮の記録と島の口承が一致する島
    text: 与那国島が歴史の記録に初めて姿を見せるのは1477年、嵐で流された済州島の3人の漂着によってである。彼らの見聞は朝鮮王朝の公式記録『李朝実録』に残された。一方、島の側にも「フガヌトゥ（よそから来た人々）」と呼ばれる漂流者たちの物語が、与那国語の口承として何世紀も語り継がれ、カタカナで8万字に及ぶテキストとして記録された。近年の研究で、この口承と『李朝実録』の記述とが細部まで対応することが確かめられている。国境の島の最古の記録は、外の世界の公文書と、島の人々の記憶の、両方に残されているのである。
    sources:
    - s12-jmic-drifters
  relations:
  - pref/47
  unknowns:
  - 島名の語源は未確定である（池間栄三の「ゆうな」群生説と富島壯英の「よね（米・砂）」説が併存するため、本レコードではcontestedとして両論を記録した）
  - 町制施行日について、歴史的行政区域データセットβ版は1948年12月1日とする一方、12月10日とする資料もあり、町公式資料での確定は未了
  - 『球陽』など琉球側の史料における与那国の初出表記は未確認（富島論文は『球陽』の与那国関係記事を紹介するが、原文の直接確認は未了）
  updated: '2026-11-13'
- id: muni/47-中城村
  code: '473286'
  names:
    ja: 中城村
    reading: なかぐすくそん
    aliases:
    - 中城
    - 仲城（近世における間切名の表記）
  user_terms:
  - 中城城 世界遺産 なかぐすく 読み方
  - 護佐丸の城がある村
  - 中城村と北中城村の違い
  naming_type: 旧行政区画名の継承
  naming_note: 王国の間切名「中城間切」を継承し、1908年の町村制で村となった
  formation: 分村・分立
  prefecture: 沖縄県
  homonyms: []
  summary: 沖縄本島中部、中城湾に面する村。村名は琉球王国の間切名「中城間切」に由来する。14世紀に按司が築き、護佐丸が増築した中城グスク（中城城跡、世界文化遺産）の名が核にあり、17世紀には間切が世子の領地となって「中城王子」の称と結びつき、王族以外による「中城」の使用が禁じられるほど王家と深く結びついた名前である。1908年に中城村が発足し、1946年に北部が北中城村として分村した。
  first_attestation:
    era: 文明3年
    year_western: 1471
    document: 『海東諸国紀』の琉球国図
    note: 中城グスクが「中具足城」と記されたのが文献上の古い用例として、村の地域文化サイトが紹介するもの。グスク自体は14世紀の築城とされる。
  claims:
  - text: 村名は琉球王国の間切名「中城間切」に由来し、1908年（明治41年）の沖縄県及島嶼町村制の施行に際して中城間切が中城村となった
    kind: fact
    level: E2
    status: established
    sources:
    - s9-nakagusuku-bunka
    - s9-kitanakagusuku-fudo
  - text: 中城グスクは14世紀に先中城按司が築き始め、1440年ごろに読谷山按司だった護佐丸が移って三の郭（新城）と北の郭を増築したと、村の地域文化サイトは伝える
    kind: fact
    level: E2
    status: established
    sources:
    - s9-nakagusuku-bunka
  - text: 1471年に朝鮮で成立した『海東諸国紀』の琉球国図には、中城グスクが「中具足城」と記されていると村の地域文化サイトが紹介しており、これが「中城」の文献上の古い用例である
    kind: fact
    level: E2
    status: established
    sources:
    - s9-nakagusuku-bunka
  - text: 1458年の護佐丸・阿麻和利の乱では、護佐丸は尚泰久王の命を受けた阿麻和利の軍勢に滅ぼされた。護佐丸の最期については、王府の正史『中山世譜』や『球陽』に基づく資料は王府軍と戦わずに家族・部下と自害したと記す一方、子孫が19世紀後半に記した『異本毛氏先祖由来記』は戦った末の自害と伝え、史料によって伝え方が異なる
    kind: fact
    level: E2
    status: contested
    sources:
    - s9-nakagusuku-bunka
  - text: 17世紀に中城間切は世子（王の世継ぎ）の領地となり、世子は「中城王子」と呼ばれた。尚質王の代には王族以外の者が「中城」の文字と「なかぐすく」の呼称を使うことが禁じられ、他所で中城を名乗っていた集落や間切は改名を迫られたが、中部の中城間切は読みを保ったまま漢字を「仲城間切」と改めて存続した
    kind: fact
    level: E2
    status: established
    sources:
    - s9-nakagusuku-bunka
  - text: 1729年には中城間切番所が中城城跡の一の郭内に設置され（『球陽』によるという）、町村制施行後は村役場が城跡内に置かれるなど、城跡は長く行政の中心だった
    kind: fact
    level: E2
    status: established
    sources:
    - s9-nakagusuku-bunka
    - s9-kitanakagusuku-fudo
  - text: 1946年（昭和21年）5月20日、沖縄民政府の指令により旧中城村の北部が北中城村として分村した。沖縄戦の過程で米軍施設が置かれ、南北の交通が遮断されたことが契機とされる
    kind: fact
    level: E2
    status: established
    sources:
    - s9-kitanakagusuku-fudo
  - text: 自治体コードは473286である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 王家の専用名になった「中城」
    text: 中城という名前は、かつて王族だけのものだった。17世紀、王の世継ぎである世子が中城間切を領するようになると、世子は「中城王子」と呼ばれ、尚質王の代には王族以外の者が「中城」の二文字や「なかぐすく」の呼称を使うこと自体が禁じられた。各地で「中城」を名乗っていた集落や間切は名を改められ、たとえば現在の中城村域にあった旧・中城村は伊舎堂村と改められた。唯一存続した中部の中城間切も、読みは守ったものの漢字は「仲城」と改めさせられている。つまり今日の中城村の名は、王家の専用名の座から降りた後も読みだけは守り抜かれた名前であり、その漢字表記の揺れ（中城・仲城・中具足城）に歴史が刻まれている。
    sources:
    - s9-nakagusuku-bunka
  relations:
  - pref/47
  - muni/47-北中城村
  unknowns:
  - 「中城」の「中」が何を指すのか（中頭地方の中央に位置する城という理解が類推されるが、専門資料による語源の確定はできなかった）
  - 『海東諸国紀』の著者名について、村の地域文化サイトは「甲叔舟」と記すが、一般には申叔舟とされており、原典での確認が残る
  updated: '2026-11-13'
- id: muni/47-久米島町
  code: '473618'
  names:
    ja: 久米島町
    reading: くめじまちょう
    aliases:
    - 球美
  user_terms:
  - 久米島
  - くめじま
  - 球美の島
  - 久米島紬の島
  naming_type: 島名の継承
  formation: 合併新設
  prefecture: 沖縄県
  homonyms: []
  summary: 沖縄本島西方約100キロの久米島を中心とする町。島名「久米」は日本の史書に「球美」と現れる古い名で、琉球方言で米を意味する「クミ」に由来し米どころの島を指すと考えられている。近世は東の仲里間切と西の具志川間切の二間切に分かれていたが、2002年に両村が合併し、島名を町名とする久米島町が発足した。
  first_attestation:
    era: 奈良時代
    year_western: 714
    document: 『続日本紀』和銅7年（714年）条の「球美」
    note: 来朝した南島人の中にみえる「球美」が久米島を指すとされる。原典は未読のため、二次資料が『続日本紀』の記載として紹介する形で確認した
  claims:
  - text: 久米島町の地方公共団体コードは473618である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  - text: 沖縄県立博物館・美術館の久米島総合調査報告書は、久米島が日本の史書に登場するのは『続日本紀』和銅7年（714年）の記事で、奄美・信覚・球美等の人々が南島から来朝したことであると紹介している
    kind: fact
    level: E2
    status: established
    sources:
    - s10-kume-okimu
  - text: 「球美」の「クミ」は琉球方言で「米」を意味し、水に恵まれた米どころの久米島を指すと考えられるという解釈が学術論文（『上智経済論集』）でも示されているが、語源として確定した定説にはなっていない
    kind: fact
    level: E3
    status: indeterminate
    sources:
    - s10-kume-wiki
    - upg-ag7-kume-sophia
  - text: 日本歴史地名大系によれば島の方音は「クミジマ」で、精選版日本国語大辞典は古名として球美・玖美を挙げる
    kind: fact
    level: E3
    status: established
    sources:
    - s10-kume-kotobank
  - text: 久米島町観光協会は、久米島は古来、琉球列島の中でもっとも美しい島であることから「球美の島」とも呼ばれてきたと紹介している
    kind: fact
    level: E2
    status: established
    sources:
    - s10-kume-kanko-guide
  - text: 沖縄県立博物館・美術館の調査報告書によれば、近世の久米島は東の仲里間切と西の具志川間切の二間切からなり「久米の二間切」と呼ばれ、仲里間切はもと中城間切と称したが王子領との関係で名称の使用が制限され現在の名称になったと伝えられる
    kind: fact
    level: E2
    status: established
    sources:
    - s10-kume-okimu
  - text: 2002年（平成14年）4月に西部の具志川村と東部の仲里村が合併し、町制を施行して島名を町名とする久米島町となった
    kind: fact
    level: E3
    status: established
    sources:
    - s10-kumejima-kotobank
  - text: 沖縄県立博物館・美術館の調査報告書は、中国側の記録が久米島の山なみを亀の姿に見立てたことを紹介し、民俗学者の伊波普猷はその記述が久米島を指すとする説を唱えたとされる
    kind: fact
    level: E2
    status: indeterminate
    sources:
    - s10-kume-okimu
  column:
    title: 「球美の島」は亀の姿をしていたか
    text: 久米島は古来「球美の島」と呼ばれてきた。沖縄県立博物館・美術館の調査報告書によれば、海上から遠望する久米島は双子山の観を呈し、中国側の記録はその山なみを亀の姿に見立てたとされ、伊波普猷はその記述が久米島を指すとする説を唱えたという。また、おもろの詩人は島を「ふたまた」と呼んだとされる。米どころを意味するともいわれる「クミ」の名と、美しさをたたえる「球美」の字と、海から見た亀の姿という三つのイメージが、ひとつの島名に重なっている。
    sources:
    - s10-kume-kanko-guide
    - s10-kume-okimu
  relations:
  - pref/47
  unknowns:
  - 「久米（球美）」の語源はクミ＝米とする説が広く紹介されるが、専門の地名辞典で語源を確定した記述は確認できなかった
  - 『続日本紀』和銅7年条の原文そのものは未読で、「球美」の記事は二次資料経由の確認にとどまる
  - 仲里間切が中城間切から改称された時期は特定できなかった
  updated: '2026-11-13'
- id: muni/47-今帰仁村
  code: '473065'
  names:
    ja: 今帰仁村
    reading: なきじんそん
    aliases:
    - 今帰仁間切
  user_terms:
  - なきじん
  - なちじん（地元の方音）
  - 今帰仁城跡のある村
  - 世界遺産の村
  - 古宇利島のある村
  naming_type: 旧行政区画名の継承
  formation: 単独発足
  prefecture: 沖縄県
  homonyms: []
  summary: 本部半島の北半分を占める村で、世界遺産の今帰仁城跡を擁する。村名は琉球王国の行政区画「今帰仁間切」に由来する。「今帰仁」は1471年の『海東諸国紀』に「伊麻奇時利」と記された古い地名で、16世紀には「みやきせん」と呼ばれていた。地元の方音は「なちじん」。語源については定説がない。
  first_attestation:
    era: 文明3年
    year_western: 1471
    document: 『海東諸国紀』
    note: 今帰仁グスクを「伊麻奇時利城」と記すのが確認できる古い用例の一つであると『日本歴史地名大系』が紹介している（二次資料経由の確認）。今帰仁村の公式資料では「伊麻寄時利」と記す
  claims:
  - text: 今帰仁村の地方公共団体コードは473065である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  - text: 村名は琉球王国の行政区画である今帰仁間切を継承し、1908年の特別町村制施行により今帰仁村となった
    kind: fact
    level: E2
    status: established
    sources:
    - s6-nakijin-vill-bousai
  - text: 1471年の『海東諸国紀』は今帰仁グスクを「伊麻奇時利城」と記しており、「伊麻奇時利」はイマキジリと発音されたと考えられることが『日本歴史地名大系』で紹介されている
    kind: fact
    level: E3
    status: established
    sources:
    - s6-nakijin-kotobank-magiri
  - text: 「今帰仁」の語義に定説はなく、イマキを渡来者（新来者）とする説や、ナキズミ（魚の寄付く場所）とする説があることが『日本歴史地名大系』で紹介されている
    kind: fact
    level: E3
    status: contested
    sources:
    - s6-nakijin-kotobank-magiri
  - text: 16世紀には今帰仁は「みやきせん」と呼ばれ、『おもろさうし』巻13や1501年の玉陵の玉御殿碑文にその名が見えることが『日本歴史地名大系』で紹介されている
    kind: fact
    level: E3
    status: established
    sources:
    - s6-nakijin-kotobank-magiri
  - text: 『日本大百科全書（ニッポニカ）』は今帰仁の方音を「ナチジン」としており、地元の方音は公称の読み「なきじん」とは異なる
    kind: fact
    level: E3
    status: established
    sources:
    - upg-t6-nakijin-kotobank
  - text: 今帰仁城は三山時代の北山王の居城で、1422年に尚巴志が尚忠を山北監守として派遣し、以後も王府の監守（今帰仁按司）が置かれた
    kind: fact
    level: E2
    status: established
    sources:
    - s6-nakijin-vill-castle
  - text: 今帰仁城跡は2000年にユネスコの世界遺産「琉球王国のグスク及び関連遺産群」の構成資産として登録された
    kind: fact
    level: E2
    status: established
    sources:
    - s6-nakijin-vill-bousai
  column:
    title: 「イマキジリ」から「なちじん」へ――名前の音の旅
    text: 今帰仁の名前は、記録されるたびに姿を変えてきた。1471年、朝鮮で編まれた『海東諸国紀』はこの地のグスクを「伊麻奇時利」と記した。16世紀になると『おもろさうし』や玉陵の碑文の中で「みやきせん」とうたわれ、近世の帳簿では「今帰仁」の漢字が定着していく。そして今、地元の人々の口にのぼる音は「なちじん」で、公称の「なきじん」ともまた少し違う。漢字・かな・方音のあいだを五百年以上旅してきた地名の軌跡が、ここまでよく残っている例は珍しい。
    sources:
    - s6-nakijin-kotobank-magiri
    - s6-nakijin-vill-bousai
  relations:
  - pref/47
  - muni/47-本部町
  - muni/47-名護市
  unknowns:
  - 語源の諸説（渡来者説・魚来住説など）の検証は、専門研究の原典確認ができていないため決着していない
  - 『海東諸国紀』の「伊麻奇時利」の原文は二次資料経由でしか確認できておらず、表記は村公式資料の「伊麻寄時利」とも異なる
  - 古宇利島をはじめ村内の字名の由来は本レコードでは未調査である
  updated: '2026-11-13'
- id: muni/47-伊平屋村
  code: '473596'
  names:
    ja: 伊平屋村
    reading: いへやそん
    aliases:
    - 伊平屋島
    - 葉壁
    - 恵平也
  user_terms:
  - いへや
  - てるしのの島
  - 沖縄最北の村
  naming_type: 中心地名の継承
  formation: 分村・分立
  prefecture: 沖縄県
  homonyms: []
  summary: 沖縄県最北端の、伊平屋島と野甫島の2島からなる離島村。古書には「えひや」「恵平也」などの表記が見え、中国の冊封使は島を「葉壁山」と称したという。島名の語源は未詳である。第一尚氏の祖先が伊平屋の出身だったという伝承があり、尚巴志の王統のルーツの島とされるが、これは伝承の層として分けて記録する。1909年の村制で伊平屋村となったものの役場は伊是名島に置かれ、1939年の分村で現在の伊平屋村が誕生した。
  first_attestation:
    era: 14世紀前半
    year_western: null
    document: 伊江村公式「伊江村の歴史」年表
    note: 伊江村公式年表の1314〜1336年の条に「伊江島は伊平屋島とともに怕尼芝に占領され北山領となる」とあり、「伊平屋島」の名が現れる。幅のある年代のため西暦はnullとし、原典を直接確認していないため主張側ではE2として扱う
  claims:
  - text: 総務省「地方公共団体コード一覧」で、伊平屋村の団体コードは473596とされている
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  - text: 伊平屋村は伊平屋島と野甫大橋でつながれた野甫島の2つの島からなり、田名・前泊・我喜屋・島尻・野甫の5つの字に分かれる、沖縄県最北端の村であると伊平屋島観光協会は紹介している
    kind: fact
    level: E4
    status: established
    sources:
    - s7-iheya-kankou-about
  - text: 古書には伊平屋を「えひや」「恵平也」と記す表記が見え、中国の冊封使は伊平屋島を「葉壁山」と称したと、伊平屋島観光協会は紹介している
    kind: fact
    level: E4
    status: established
    sources:
    - s7-iheya-kankou-about
  - text: 「伊平屋」の語源は確認できる資料では明らかではなく、観光協会が紹介する「島の面積の大きさから取って伊平屋島と唱えられた」という説明も伝承の域を出ない
    kind: fact
    level: E4
    status: indeterminate
    sources:
    - s7-iheya-kankou-about
  - text: 『日本歴史地名大系』は、伊是名村をメージ（前地）というのに対して当村をクシジ（後地）というと記している
    kind: fact
    level: E3
    status: established
    sources:
    - s7-iheya-kotobank-taikei
  - text: 伊平屋村立歴史民俗資料館は、伊平屋が「米を産する最も佳なり」と中国の古文書に記されているように、古くから稲作が盛んだった島であると紹介している
    kind: fact
    level: E2
    status: established
    sources:
    - s7-iheya-vill-museum
  - text: 琉球の第一王統（第一尚氏）の祖先とされる屋蔵大主が伊平屋に住んだという伝承があり、伊平屋は第一尚氏の発祥の地とされると、伊平屋島観光協会は紹介している
    kind: legend
    level: E4
    status: established
    sources:
    - s7-iheya-kankou-about
  - text: 尚巴志の祖父にあたる鮫川大主は「葉壁」すなわち伊平屋の出身で、佐敷の場天の地に移住して尚思紹を生み、その子が尚巴志であるという伝承が『中山世鑑』などに伝えられると、学術論文は紹介している
    kind: legend
    level: E2
    status: established
    sources:
    - s7-iheya-hosaka
  - text: 1909年4月1日の村制施行で「伊平屋島」を「伊平屋村」と改称したが村役場は伊是名村字伊是名に置かれ、大正5年の分村請願以来の運動を経て、1939年7月1日に分村して現在の伊平屋村が誕生したと、伊平屋島観光協会は紹介している
    kind: fact
    level: E4
    status: established
    sources:
    - s7-iheya-kankou-about
  column:
    title: 「前地」と「後地」、そして分村までの百年
    text: 伊是名島を「前地（メージ）」というのに対して、伊平屋島は「後地（クシジ）」と呼ばれてきた。その「後れ」は行政にも及び、1909年に伊平屋村ができてからも村役場は伊是名島に置かれ、住民は用事のたびに海を渡った。大正時代に始まる分村運動は「百有余年の懸案」とまでいわれ、実ったのは1939年のことである。島の位置をいう古い呼び名が、そのまま島の近代史の苦労を物語っている。
    sources:
    - s7-iheya-kotobank-taikei
    - s7-iheya-kankou-about
  relations:
  - pref/47
  - muni/47-伊是名村
  - muni/47-伊江村
  unknowns:
  - 「伊平屋」の語源の確定
  - 中国の冊封使が伊平屋島を「葉壁山」と称したという記録の原典と年代の特定
  - 『中山世鑑』等における鮫川大主・屋蔵大主の伝承の原文を直接確認できていないこと
  updated: '2026-11-13'
- id: muni/47-伊是名村
  code: '473600'
  names:
    ja: 伊是名村
    reading: いぜなそん
    aliases:
    - 伊是名島
    - 前地（メージ）
  user_terms:
  - 伊是名島の由来
  - 尚円王が生まれた島
  - 伊平屋と伊是名の違い
  - いぜなってどう読むの
  naming_type: 中心地名の継承
  formation: 分村・分立
  prefecture: 沖縄県
  homonyms: []
  summary: 伊是名島を村域とする村。古くは伊平屋島と合わせて「ゑひや（伊平屋）」と総称され、伊是名側は「前地（メージ）」と呼ばれた。第二尚氏の始祖・尚円王（金丸）の出身地として知られ、沖縄本島北部にありながら島尻郡に属する。1908年に伊平屋村の一部となり、1939年に分立して伊是名村が成立した。島名「伊是名」の語源は確認できていない。
  first_attestation:
    era: 安土桃山時代
    year_western: 1587
    document: 首里大屋子宛の辞令書
    note: 「ゑひやのなかだ」と記される。仲田は伊是名島の集落名であるため、この「ゑひや」は伊平屋島単独ではなく伊平屋・伊是名両島を総括する行政区画の名と解される（『日本歴史地名大系』「伊平屋島」）。伊是名単独の名の初出は未確認
  claims:
  - text: 『おもろさうし』巻一七に「ゑひや」と見え、古琉球期には伊平屋島と伊是名島の両島を合わせて「ゑひや」と称した。1587年（万暦15年）の首里大屋子宛辞令書に見える「ゑひやのなかた」の仲田は伊是名島の村名であるため、この「ゑひや」は両島を合わせた行政単位の名であったと『日本歴史地名大系』は説明する
    kind: fact
    level: E3
    status: established
    sources:
    - upg-t2-izena-taikei-iheya
  - text: 伊是名村（伊是名島）側は「前地（メージ）」、伊平屋村（伊平屋島）側は「後地（クシジ）」と呼ばれてきた（『日本歴史地名大系』）
    kind: fact
    level: E3
    status: established
    sources:
    - upg-t2-izena-taikei-izena
  - text: 伊是名島は琉球国王・第二尚氏の始祖である尚円（金丸）の生まれた島として知られ、2015年（平成27年）には尚円生誕600周年祭が行われた
    kind: fact
    level: E2
    status: established
    sources:
    - upg-t2-izena-guidebook
    - upg-t2-izena-koho
  - text: 1896年（明治29年）に沖縄県の郡区制が施行された際、沖縄本島北部に位置する伊是名島・伊平屋島は、沖縄本島南部の島尻郡に属することになり、現在も島尻郡に属する（『日本歴史地名大系』）
    kind: fact
    level: E3
    status: established
    sources:
    - upg-t2-izena-taikei-iheya
  - text: 1939年（昭和14年）7月1日、伊平屋村から伊是名島側が分離して伊是名村が成立した（成立の日付は歴史的行政区域データセットによる）。近世の伊是名島には伊是名（いじな）・勢理客・仲田・諸見の村（シマ）があった（『日本歴史地名大系』）
    kind: fact
    level: E3
    status: established
    sources:
    - upg-t2-izena-geoshape
    - upg-t2-izena-taikei-iheya
  - text: 村は有人島の伊是名島と、無人島の具志川島・屋那覇島・降神（うるがみ）島から構成される
    kind: fact
    level: E2
    status: established
    sources:
    - upg-t2-izena-intro
  - text: 島には尚円（金丸）の生誕の地と伝える場所があり、臍の緒を埋めたとされる「みほそ所（御臍所）」など生誕にまつわる伝承地や、伊是名玉陵などの史跡が残るとされる
    kind: legend
    level: E2
    status: established
    sources:
    - upg-t2-izena-guidebook
  - text: 近世の村名としての伊是名は「いじな」と読まれた（『日本歴史地名大系』）。地方公共団体コードは473600である
    kind: fact
    level: E3
    status: established
    sources:
    - upg-t2-izena-taikei-iheya
    - b-cap-chiba-soumu-code
  column:
    title: 「前地」と呼ばれた王統発祥の島
    text: 伊是名島は、長く隣の伊平屋島とひとつの名で呼ばれてきた。『おもろさうし』は両島を「ゑひや」と詠み、近世の人々は手前（南）の伊是名を「前地（メージ）」、奥の伊平屋を「後地（クシジ）」と呼び分けた。第一尚氏の発祥が伊平屋、第二尚氏の始祖・尚円の生誕が伊是名とされ、両島は王統発祥の地として王府の直轄領になったと伝えられる。地理的には沖縄本島北部の沖合にありながら、本島南部の島尻郡に属するというねじれは、その聖域扱いの名残とされる。1939年にようやく伊是名は独立した村となり、島の古い名がそのまま村名になった。
    sources:
    - s8-iheya-izena-wiki
    - s8-izena-wiki
  relations:
  - pref/47
  - muni/47-伊平屋村
  unknowns:
  - 島名「伊是名（いじな）」の語源は確認できなかった
  - 伊是名単独の地名としての文献上の初出は未確認（1587年の辞令書の「ゑひや」は両島総括の名と解される）
  - 尚円の生誕にまつわる細部（御臍所・産湯の井戸など）は伝承であり、史料による裏付けの程度は未確認
  - 両島が王統発祥の地として王府直轄領とされたとする説明は村史系統の資料に基づくと見られるが、強い出典の本文はWebでは確認できなかった
  - 『おもろさうし』の「ゑひやの二はなれ」という語句と、1923年（大正12年）の地形図に「伊平屋前地」「伊平屋後地」と表記されていたことは、強い出典では確認できなかった
  updated: '2026-11-13'
- id: muni/47-伊江村
  code: '473154'
  names:
    ja: 伊江村
    reading: いえそん
    aliases:
    - 伊江島
  user_terms:
  - いえじま
  - イージマ
  - タッチューの島
  - 一島一村
  naming_type: 島名の継承
  formation: 単独発足
  prefecture: 沖縄県
  homonyms: []
  summary: 本部半島の北西約9キロの伊江島一島からなる一島一村の自治体。島名の現地読みは「イー（イージマ）」で、「伊江」はその音に字をあてたものとされる。語源にはイシ（石）の転・イリ（西）の転という説が紹介されるが確説はない。島のシンボルである城山は「伊江島タッチュー」と呼ばれるが、これは山の呼び名で、島名の古層とは別の層である。1908年の町村制で伊江島から伊江村に改称された。
  first_attestation:
    era: 14世紀前半
    year_western: null
    document: 伊江村公式「伊江村の歴史」年表
    note: 村公式年表の最古の記事は1314〜1336年の条で、伊江島が伊平屋島とともに北山の怕尼芝に占領され北山領となったとする。幅のある年代のため西暦はnullとし、『中山世鑑』等の原典での用例を直接確認していないため主張側ではE2として扱う
  claims:
  - text: 総務省「地方公共団体コード一覧」で、伊江村の団体コードは473154とされている
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  - text: 伊江村は沖縄本島北部の本部半島から北西9キロに位置する伊江島の「一島一村」の離島である
    kind: fact
    level: E2
    status: established
    sources:
    - s7-ie-suido
  - text: 伊江島は方音では「イージマ」といい、「伊江」はその音に字をあてたものであると『日本歴史地名大系』は記している
    kind: fact
    level: E3
    status: established
    sources:
    - s7-ie-kotobank-shima
  - text: 「伊江」の語源については、イシ（石）の転ともイリ（西）の転ともいわれると地名の由来を集めた一般サイトは紹介するが、確説はない
    kind: fact
    level: E5
    status: indeterminate
    sources:
    - s7-ie-chimei-folklore
  - text: 伊江村公式の歴史年表は、1314〜1336年に伊江島が伊平屋島とともに北山の怕尼芝に占領され北山領となったと記している
    kind: fact
    level: E2
    status: established
    sources:
    - s7-ie-vill-rekishi
  - text: 1701年に東江村・西江村・川平村が置かれ、明治8年になって東江村・西江村がそれぞれ二分され、川平を加えた集落構成になったと伊江村公式の歴史年表は記している
    kind: fact
    level: E2
    status: established
    sources:
    - s7-ie-vill-rekishi
  - text: 1908年の沖縄県及島嶼町村制施行により、東江上・東江前・西江上・西江前・川平の五ヵ字で、伊江島から伊江村と改称されたと『日本歴史地名大系』は記している
    kind: fact
    level: E3
    status: established
    sources:
    - s7-ie-kotobank-taikei
  - text: 島の東部中央にそびえる城山（グスクヤマ）は「伊江島タッチュー」と呼ばれ島のシンボルとなっているが、これは山の呼び名であり、島名「伊江」の由来とは別の層である
    kind: fact
    level: E2
    status: established
    sources:
    - s7-ie-suido
  column:
    title: タッチューは山の名前
    text: 本部半島からも望める標高172メートルの城山は「伊江島タッチュー」の愛称で親しまれ、フェリーが近づくとまずこの尖った山が目に入る。だが「タッチュー」は山の呼び名であって島の名ではない。島の名「伊江」は、方音「イー」の古い音に字をあてたもので、山の愛称とは生まれた層がまったく違う。島の顔である山と、島そのものの名は、分けて眺めると面白い。
    sources:
    - s7-ie-suido
    - s7-ie-kotobank-shima
  relations:
  - pref/47
  - muni/47-伊平屋村
  - muni/47-本部町
  unknowns:
  - 「伊江（イー）」の語源の確定（石・西の転という説が紹介されるにとどまる）
  - 『中山世鑑』など原典における伊江島の用例を直接確認できていないこと
  - 1908年以前、行政単位としての伊江島の扱いの詳細（間切に属さない島としての位置づけ）
  updated: '2026-11-13'
- id: muni/47-八重瀬町
  code: '473626'
  names:
    ja: 八重瀬町
    reading: やえせちょう
    aliases:
    - 八重瀬
  user_terms:
  - 八重瀬町 いつできた 合併
  - 八重瀬岳 由来
  - 東風平 具志頭 合併
  naming_type: 自然地名から
  naming_note: 2006年に東風平町と具志頭村の合併で新設。両町村にまたがる八重瀬岳の名を新町名に採用した
  formation: 合併新設
  prefecture: 沖縄県
  homonyms: []
  summary: 沖縄本島南部にある町で、2006年1月1日に東風平町と具志頭村の合併で誕生した。町名は両町村の境にそびえる八重瀬岳（標高163メートル、町内最高峰）にちなみ、合併協議会の公募で選ばれた。合併前の旧町村名を一切残さない新名称であり、町の建設計画資料は命名理由として「島尻のシンボル的な存在」で「地理的に分かりやすい」ことを挙げている。合併の協議は当初4町村で進められたが、南風原町の離脱を経て2町村の合併となった。
  first_attestation:
    era: 平成18年
    year_western: 2006
    document: 八重瀬町「新町建設計画」資料（合併・命名の経緯を記す町公式資料）
    note: 町名そのものの初出は2006年1月1日の町発足である。もとの山名「八重瀬岳」の初出と語源は未確認。
  claims:
  - text: 八重瀬町は2006年（平成18年）1月1日、島尻郡東風平町と具志頭村の合併により発足した
    kind: fact
    level: E2
    status: established
    sources:
    - s9-yaese-keikaku
  - text: 新町名「八重瀬」は、旧・東風平町と旧・具志頭村にまたがる八重瀬岳から採られた。町名は合併協議会による公募で決定された
    kind: fact
    level: E2
    status: established
    sources:
    - s9-yaese-keikaku
  - text: 町の建設計画資料は命名理由として、八重瀬岳が島尻のシンボル的な存在で地理的に分かりやすいこと、遺跡・史跡・自然・桜など地域のアピール力があること、互いに身近な存在で知名度があり響きがよいことを挙げている
    kind: fact
    level: E2
    status: established
    sources:
    - s9-yaese-keikaku
  - text: 新町名称候補選定委員会の委員長は、「八」の字は末広がりで幸せが幾重にも重なる意、「瀬」は物事に出会う時の意があり、両町村の合併は「八重に出会う絶好のタイミング」だったとする命名コメントを残している
    kind: fact
    level: E2
    status: established
    sources:
    - s9-yaese-keikaku
  - text: 合併の協議は当初、南風原町・東風平町・大里村・具志頭村の4町村で進められたが、2004年9月に南風原町が離脱して4町村の協議会は廃止され、その後、東風平町と具志頭村の2町村で改めて協議会が設けられた
    kind: fact
    level: E2
    status: established
    sources:
    - s9-yaese-keikaku
  - text: 八重瀬岳は標高163メートルで町内の最高峰であり、沖縄戦では日本軍の最後の防衛線が設定され、米軍からは「ビッグアップル（Big Apple）」と呼ばれた
    kind: fact
    level: E2
    status: established
    sources:
    - upg-t6-yaese-keikan
    - upg-t6-yaese-bigapple
  - text: 八重瀬岳は合併前の東風平町と具志頭村の両町村にまたがる山で、その東風平側に位置する富盛（ともり）と世名城（よなぐすく）は東風平町の大字だった
    kind: fact
    level: E2
    status: established
    sources:
    - upg-t6-yaese-keikan
    - s9-yaese-keikaku
  - text: 町は八重瀬岳周辺の一帯を「八重瀬城跡を中心に史跡、拝所が点在する」歴史資源の地域として位置づけており、「八重瀬」は山名であると同時に、城跡を含む一帯の地名として受け止められている
    kind: fact
    level: E2
    status: established
    sources:
    - s9-yaese-keikaku
  - text: 自治体コードは473626である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 4町村の夢と、残った2町村の山
    text: 八重瀬町の誕生には、実現しなかった大きな合併の影がある。2002年、南風原町・東風平町・大里村・具志頭村の4町村が合併協議会を立ち上げたが、合併は実現せず、協議会は2004年に解散した。残った東風平町と具志頭村だけで協議をやり直し、2006年に生まれたのが八重瀬町である。新町名の選定では、どちらか一方の旧町名を残すのではなく、境にそびえる八重瀬岳の名が公募で選ばれた。旧町村名を一切残さない名前は、対等合併の象徴だった。沖縄戦で日本軍最後の防衛線となり、米軍に「ビッグアップル」と呼ばれた山が、今度は二つの町村をつなぐ名前として選ばれたことになる。
    sources:
    - s9-yaese-keikaku
    - s9-yaesedake-wiki
  relations:
  - pref/47
  - muni/47-南風原町
  unknowns:
  - 山名「八重瀬（岳）」自体の語源と初出（「八重に重なる瀬」という地形由来かどうかを含め、確認できなかった）
  - 八重瀬城跡の「八重瀬」と山名との先後関係
  updated: '2026-11-13'
- id: muni/47-北中城村
  code: '473278'
  names:
    ja: 北中城村
    reading: きたなかぐすくそん
    aliases: []
  user_terms:
  - 日本一人口密度が高い村
  - きたなかぐすくの由来
  - 中城村との違い
  naming_type: 方位・位置による命名
  formation: 分村・分立
  prefecture: 沖縄県
  homonyms: []
  summary: 1946年、中城村が米軍施設によって南北に分断され行政運営に支障をきたしたため、北部の12行政区が分離して生まれた村。名は「中城」の北に位置することによる。もとの「中城」は近世の中城間切に由来する名で、世界遺産の中城城跡は、分村後の現在の村域では南側の中城村側にある。面積の小さい村だが、日本で最も人口密度が高い村として知られる。
  first_attestation:
    era: 近世（琉球王国時代）
    year_western: null
    document: （未確認）
    note: 前身の中城間切は近世琉球の行政区画として成立していたが、「中城」の文献上の初出は確認できなかった。村としての成立は1946年（昭和21年）
  claims:
  - text: 1908年（明治41年）4月1日に中城村が誕生し、終戦後、米軍施設により南北に分断され行政運営に支障をきたした
    kind: fact
    level: E2
    status: established
    sources:
    - upg-af8-nakagusuku-geoshape
    - upg-af8-kitanaka-machidukuri
  - text: 1946年（昭和21年）5月20日に中城村北部の12行政区が分離して北中城村が誕生した（歴史的行政区域データセットβ版も北中城村の有効期間を1946年5月20日からとする）
    kind: fact
    level: E2
    status: established
    sources:
    - s8-kitanakagusuku-wiki
    - s8-kitanakagusuku-geoshape
  - text: 沖縄語では「きたなかぐしく（/kitanakagushiku/）」といい、「中城」は城（グスク）を意味する語を含む名である
    kind: fact
    level: E5
    status: established
    sources:
    - s8-kitanakagusuku-wiki
  - text: 面積11.54km2の小さな村で「日本一人口密度の高い村」となっており、返還軍用地のライカム地区では大型商業施設の開業など市街地形成が進んでいると、北中城村商工会の経営発達支援計画（内閣府沖縄総合事務局）は記す
    kind: fact
    level: E2
    status: established
    sources:
    - s8-kitanakagusuku-ogb
  - text: 日本で最も人口密度が高い村であり、読谷村・東海村・中城村・西郷村に次いで全国で5番目に人口の多い村である
    kind: fact
    level: E5
    status: established
    sources:
    - s8-kitanakagusuku-wiki
  - text: 地方公共団体コードは473278である
    kind: fact
    level: E2
    status: established
    sources:
    - s8-kitanakagusuku-ogb
    - b-cap-chiba-soumu-code
  column:
    title: 「北」と付いた、分断から生まれた村名
    text: 北中城村の名は、方角を冠した分村名である。1946年、米軍施設に南北を断たれた中城村の北半分が独立し、「中城」の北という意味で「北中城」を名乗った。名の由来となった中城城（グスク）の城跡は、分かれた境界の南側、現在の中城村に残る。村の名の本体は隣村にあるという、読谷村の「字読谷」問題とよく似た構図である。もとの農村は、那覇に近い立地と軍用地返還地の開発によって住宅地化が進み、いまでは日本一人口密度の高い村になった。
    sources:
    - s8-kitanakagusuku-wiki
    - s8-kitanakagusuku-ogb
  relations:
  - pref/47
  - muni/47-中城村
  - muni/47-北谷町
  unknowns:
  - 分村時に南側が一時「南中城村」を名乗り1956年に「中城村」へ改称したという経緯は、出典を確認できなかった
  - 「中城」の名が中城城（グスク）に由来することの出典つき確認は未了
  - 中城城跡が現在の北中城村域でなく中城村側にあることの出典つき確認は未了（コラムでは一般的な理解として触れた）
  updated: '2026-11-13'
- id: muni/47-北大東村
  code: '473588'
  names:
    ja: 北大東村
    reading: きただいとうそん
    aliases:
    - 北大東島
  user_terms:
  - きただいとう
  - 北大東島
  - 大東島
  naming_type: 島名の継承
  formation: 単独発足
  prefecture: 沖縄県
  homonyms: []
  summary: 島名をそのまま村名とする村で、南大東村と対をなす。島名「大東」は、琉球の島言葉で東の大きな島を意味する「ウフアガリ」に漢字をあてたもので、沖縄本島の東方にある位置を指す。南北大東島は明治18年（1885年）に日本領土へ編入され、北大東島は明治36年（1903年）から玉置商会によって燐鉱採掘と甘蔗作で開拓されたが、町村は置かれず、昭和21年（1946年）6月12日に米軍政下の沖縄民政府告示で初めて村制が施行されて北大東村が発足した。村域は北大東島と無人の沖大東島（ラサ島）からなる。
  first_attestation:
    era: null
    year_western: null
    document: 『日本歴史地名大系』「大東諸島」
    note: 大系は「琉球王国時代からウフアガリジマ（大東島）とよばれ、南北大東島の二島をさしていた」と記すが、特定の文献における初出は確認できなかった。村名としての「北大東」は1946年の村制施行に始まる
  claims:
  - text: 北大東村の地方公共団体コードは473588である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  - text: 昭和21年（1946年）6月12日、「沖縄民政府告示第4号の1」により村制が始まり、北大東村が誕生したことが北大東村公式の島史年表に記されている
    kind: fact
    level: E2
    status: established
    sources:
    - s11-kitadaito-official-history
  - text: 『日本歴史地名大系』は、大東諸島は琉球王国時代から「ウフアガリジマ（大東島）」と呼ばれ、南北大東島の二島を指していたと記す
    kind: fact
    level: E3
    status: established
    sources:
    - s11-kotobank-daito-taikei
  - text: 『角川日本地名大辞典』は、大東諸島が沖縄本島の東方海上に位置することから方言で「東の大きな島」を意味するウフアガリ島と呼ばれ、それに「大東」という漢字をあてたものとする説を『島尻郡誌』を出典として紹介する
    kind: fact
    level: E3
    status: established
    sources:
    - s11-jlogos-kadokawa-okidaito
  - text: 明治18年（1885年）、南北大東島の二島に国標「沖縄県所轄」が建てられ、日本領土に編入された
    kind: fact
    level: E3
    status: established
    sources:
    - s11-kotobank-daito-taikei
  - text: 明治36年（1903年）、玉置商会は北大東島に社員を派遣して甘蔗8株を植え付け、開墾の意思を示したことが北大東村公式の年表と文化的景観の調査報告書に記されている
    kind: fact
    level: E2
    status: established
    sources:
    - s11-kitadaito-official-history
    - s11-kitadaito-landscape-report
  - text: 北大東島の燐鉱採掘は明治41年（1908年）に玉置商会が着手したが明治44年（1911年）に撤退し、東洋製糖のもとで大正7年（1918年）に再着手され、大正8年（1919年）に本格化した
    kind: fact
    level: E2
    status: established
    sources:
    - s11-kitadaito-landscape-report
  - text: 北大東村は北大東島と沖大東島からなり、無人の沖大東島は1島で字ラサを構成する
    kind: fact
    level: E3
    status: established
    sources:
    - s11-jlogos-kadokawa-okidaito
  column:
    title: 村のなかの「ラサ」という字
    text: 北大東村には「ラサ」という字がある。その実体は、村の中心である北大東島から南へ約150キロ離れた無人島、沖大東島そのもので、1島で1つの字を成している。「ラサ」は外国船がつけた名で、『日本歴史地名大系』によれば、文化4年（1807年）にフランス軍艦カノニエルがこの島を視認し、「平坦な」という意味でラサ島と命名したという。明治末から昭和19年（1944年）までこの島では燐鉱石が採掘され、戦後は米軍の射撃訓練場となって今も人は住んでいない。沖縄の村の字のなかに、遠く離れた無人島の、外国語由来の名が残っている。
    sources:
    - s11-kotobank-daito-taikei
    - s11-jlogos-kadokawa-okidaito
  relations:
  - pref/47
  - muni/47-南大東村
  unknowns:
  - 「大東島（ウフアガリ）」という呼称が特定の文献に初めて現れる年と文献は確認できなかった
  - 大東島を「北」と「南」に分けて呼ぶようになった時期（1885年の国標設置時か、その後の行政文書によるものか）は資料で特定できなかった
  - 玉置半右衛門が北大東島の燐鉱に着目した経緯を示す一次資料は確認できなかった
  updated: '2026-11-13'
- id: muni/47-北谷町
  code: '473260'
  names:
    ja: 北谷町
    reading: ちゃたんちょう
    aliases:
    - 北谷間切
    - きたたん
  user_terms:
  - ちゃたんの由来
  - アメリカンビレッジがある町
  - 北谷ってどう読むの
  naming_type: 中心地名の継承
  formation: 単独発足
  prefecture: 沖縄県
  homonyms: []
  summary: 古名は「きたたん」。1577年の辞令書に「きたたんおきて」と見えるのが現在確認できる最古の文字資料で、「北谷」の漢字は1609年の薩摩侵入以降に当てられたとされる。音は「きたたん」から「きちゃたん」「ちちゃたん」を経て「ちゃたん」へ変化した。町公式も「きたたん」の語源はよく分からないと明記する。1908年に北谷村となり、1980年に町制を施行した。西海岸の美浜地区にはアメリカンビレッジが立地する。
  first_attestation:
    era: 安土桃山時代
    year_western: 1577
    document: 辞令書
    note: 尚真王が地方役人「きたたんおきて」に給した辞令書。北谷町公式が現在確認できる最古の文字資料とする
  claims:
  - text: 現在確認できる最古の文字資料は1577年の辞令書に書かれた「きたたんおきて」であり、「きたたん」の語源はよく分からないと、北谷町公式は明記する
    kind: fact
    level: E2
    status: established
    sources:
    - s8-chatan-official
  - text: 「きたたん」から「きちゃたん」「ちちゃたん」を経て「ちゃたん」へと音が変化したことは語学上はっきりしており、正保国絵図（1649年）には「北谷間切」の脇に「キタタンマギリ」とかな書きがあると、北谷町公式は紹介する
    kind: fact
    level: E2
    status: established
    sources:
    - s8-chatan-official
  - text: 鹿児島方言で「タン」は谷の意を示すことから、「キタタン」に「北谷」の漢字が当てられた後に音が変化したと考えられていると、北谷町公式は紹介する
    kind: fact
    level: E2
    status: inferred
    sources:
    - s8-chatan-official
  - text: 北谷間切は当初、安仁屋・北谷・桑江・平安山・砂辺・野国・屋良・嘉手納・山内の9つのムラからなり、1671年（寛文11年）に宜野湾間切の創設に伴って安仁屋が宜野湾へ、山内が越来へ編入され、玉代勢・伝道・伊礼・浜川・野里が新設されて12ムラとなった（北谷町議会資料）
    kind: fact
    level: E2
    status: established
    sources:
    - s8-chatan-gikai
  - text: 1908年（明治41年）に北谷村となり、1948年（昭和23年）に嘉手納が分村し、1980年（昭和55年）4月1日に町制を施行して北谷町となった（北谷町議会資料）
    kind: fact
    level: E2
    status: established
    sources:
    - s8-chatan-gikai
  - text: 「北谷」の名は北谷間切の名を受け継ぐ。正保国絵図（1649年）には「北谷間切」の脇に「キタタンマギリ」とかなで記されている。「北谷」の漢字が当てられた時期について、町公式資料は特定していない（北谷町公式「北谷の歴史」）
    kind: fact
    level: E2
    status: established
    sources:
    - s8-chatan-official
  - text: 西海岸の美浜地区には美浜タウンリゾート・アメリカンビレッジがあり、現在も町の面積の約52.3%を基地が占有している（総務省「北谷町における戦災の状況」。情報提供は北谷町）
    kind: fact
    level: E2
    status: established
    sources:
    - upg-t2-chatan-soumu
  - text: 地方公共団体コードは473260である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 「きたたん」が「ちゃたん」になるまで
    text: 北谷と書いて「ちゃたん」と読む。この読みの元は「きたたん」で、1577年の辞令書に「きたたんおきて」と残る。薩摩侵入以降に「北谷」の漢字が当てられ、土地の音は「きたたん→きちゃたん→ちちゃたん→ちゃたん」と崩れていった。町公式サイトは「『きたたん』の語源はよく分かりません」と率直に書く。語源は不明でも、音の変化の道筋ははっきりしているのがこの地名のおもしろさである。いま西海岸の美浜に広がるアメリカンビレッジやサンセットビーチの賑わいは、この古い名の上に載った新しい層である。
    sources:
    - s8-chatan-official
    - s8-chatan-wiki
  relations:
  - pref/47
  - muni/47-嘉手納町
  - muni/47-北中城村
  unknowns:
  - 「きたたん」の語源は町公式も「よく分かりません」としており、も決定的な説は確認できなかった
  - 「北谷」の漢字が当てられた正確な時期は、1609年の薩摩侵入以降とされるが年次は未確認
  - 美浜アメリカンビレッジの開発基本指針の策定年（1994年とされる）や施設整備の完了年は、強い出典では確認できなかった
  updated: '2026-11-13'
- id: muni/47-南城市
  code: '472158'
  names:
    ja: 南城市
    reading: なんじょうし
    aliases:
    - 佐敷町
    - 知念村
    - 玉城村
    - 大里村
  user_terms:
  - なんじょう
  - ハートのまち
  - 斎場御嶽のある市
  - 尚巴志のふるさと
  naming_type: 方位・位置による命名
  formation: 合併新設
  prefecture: 沖縄県
  homonyms: []
  summary: 平成18年（2006年）1月1日、島尻郡の佐敷町・知念村・玉城村・大里村の1町3村が合併して発足した、沖縄本島南部の市。市名は2005年3月に合併協議会で決定されたもので、「南」は沖縄本島南部という位置を、「城」は市内に数多く残るグスク（城）を表し、市の側も「名称の由来にもなっている『城＝グスク』」と説明している。市域は尚巴志の出身地・佐敷や世界遺産の斎場御嶽を擁し、琉球の歴史の層が厚い。
  first_attestation:
    era: 平成18年
    year_western: 2006
    document: 南城市の発足（市名の決定は2005年3月の合併協議会）
    note: 「南城」は合併に際して作られた市名であり、それ以前の地名としての初出はない。構成要素の旧町村名（佐敷・知念・玉城・大里）は近世の間切名に遡る
  claims:
  - text: 南城市の地方公共団体コードは472158である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  - text: 南城市は2006年1月1日に佐敷町、知念村、玉城村、大里村の旧4町村が合併して誕生した
    kind: fact
    level: E2
    status: established
    sources:
    - s5-nanjo-yoran
  - text: 新市名は2005年3月に「南城市」と決定され、合併協定書への調印が行われた
    kind: fact
    level: E2
    status: established
    sources:
    - s5-nanjo-history
  - text: 市名の「城」はグスクを指し、琉球を統一した尚巴志ゆかりの佐敷城跡・島添大里城跡をはじめ按司たちが拠った数々のグスクを擁することが「南城市の名称の由来にもなっている」と市は説明している
    kind: fact
    level: E2
    status: established
    sources:
    - s5-nanjo-gusuku
  - text: 南城市は沖縄本島南部の東海岸に位置し、県都那覇市から南東へ約12kmにあって中城湾と太平洋に面している
    kind: fact
    level: E2
    status: established
    sources:
    - s5-nanjo-history
  - text: 市域には世界遺産「琉球王国のグスク及び関連遺産群」の一つである斎場御嶽（旧知念村域）があり、琉球開闢神話の舞台とされる久高島が属している
    kind: fact
    level: E2
    status: established
    sources:
    - s5-nanjo-yoran
  - text: 現在の組み合わせに先立ち、佐敷町・知念村・玉城村・与那原町の合併協議会は2004年（平成16年）10月26日に新市名を「東方市（あがりかたし）」と確認した。しかし新市の事務所の位置をめぐる対立で与那原町が離脱し、協議会は同年12月28日に廃止された。その後、大里村を加えた4町村の協議会が2005年（平成17年）3月22日に新市名を「南城市」と確認した（沖縄県公式の合併記録による）
    kind: fact
    level: E2
    status: established
    sources:
    - upg-parent-nanjo-okinawa-gappei
  column:
    title: 幻の市名「東方市」
    text: 南城市は、あと少しで全く違う名前になるところだった。2004年、佐敷町・知念村・玉城村・与那原町の4町村の合併協議会は、新しい市の名前を「東方市」と決めた。ところが新市庁舎をどこに置くかで意見が折り合わず、協議会は解散してしまう。その後、顔ぶれを大里村に入れ替えた新しい協議会が2005年3月に選んだ名前が「南城市」である。「東方」も「南城」も方角を含む名前だが、最終的に残ったのは、尚巴志ら按司のグスクが点在する土地にふさわしい「城」の一字を含む方だった。庁舎の場所ひとつで自治体の名前が変わるという、平成の大合併らしい舞台裏である。
    sources:
    - s5-nanjo-zhwiki
    - s5-nanjo-history
  relations:
  - pref/47
  unknowns:
  - 「南城市」の市名は、大里村を加えた協議会が2005年2月1日から25日まで公募を行ったことが県の合併記録で確認できるが、応募件数や最終候補の顔ぶれは協議会の一次資料では確認できなかった。「東方市」の選定過程の詳細も同様に未確認である
  - 「南城」の「南」が本島南部を指すことの明示的な命名理由は、市公式資料の文面では直接確認できなかった（位置の説明とグスクの説明からの読み取り）
  - 旧間切名（佐敷・知念・玉城・大里）それぞれの地名の由来は調査範囲では確認できなかった
  updated: '2026-11-13'
