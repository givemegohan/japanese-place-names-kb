- id: muni/04-名取市
  code: '042072'
  names:
    ja: 名取市
    reading: なとりし
    aliases:
    - 名取町
    - 名取郡
  user_terms:
  - 仙台空港のある市
  - 閖上（ゆりあげ）のある市
  - 名取熊野三社のまち
  - なとり
  naming_type: 一部の地名
  prefecture: 宮城県
  homonyms: []
  summary: 市名は、古代以来の郡名「名取郡」と、市と仙台市の境を流れる「名取川」の名を受け継ぐ。「名取」の文献上の初見は8世紀にさかのぼり、729年の荷札木簡や『続日本紀』の記事に現れるが、語源はアイヌ語説などがあり定まっていない。中世以降は名取川を「熊野川」に見立てる熊野信仰の拠点として知られた。現在の市は1955年に2町4村の合併で名取町として発足し、1958年に市制を施行した。
  first_attestation:
    era: 奈良時代（天平元年）
    year_western: 729
    document: 平城宮跡出土の荷札木簡（陸奥国名取郡から昆布を納めた荷札）
    note: 文献では『続日本紀』天平神護2年（766年）に「名取」、神護景雲3年（769年）に「名取郡」が見える
  claims:
  - text: 総務省の全国地方公共団体コードで、名取市の団体コードは042072と定められている
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  - text: 市域は旧名取郡に属し、市名は郡名であり川名でもある「名取」を受け継いでいる
    kind: fact
    level: E2
    status: established
    sources:
    - t4-natori-city-toukei
    - t4-natori-gun-wiki
  - text: 「名取」の文献上における初見は、『続日本紀』天平神護2年（766年）12月30日条にある名取竜麻呂の改姓記事であり、「名取郡」としては神護景雲3年（769年）3月13日条の記事が最も早いと紹介されている
    kind: fact
    level: E5
    status: established
    sources:
    - t4-natori-gun-wiki
  - text: 天平元年（729年）の日付をもち、陸奥国名取郡から昆布を納めたことを示す荷札の木簡が、平城宮跡から見つかっていると紹介されている
    kind: fact
    level: E5
    status: established
    sources:
    - t4-natori-gun-wiki
  - text: かつては『続日本紀』の和銅6年（713年）の記事にある「丹取郡」を「名取」の誤記とみて名取の初出とする説が有力だったが、現在では否定されていると紹介されている
    kind: fact
    level: E5
    status: contested
    sources:
    - t4-natori-gun-wiki
  - text: 「名取」の語源は定かでなく、川名についてはアイヌ語の「ナイトリベツ（渓谷）」に由来する説と、下流に入江があったことから「ニットリトン（静かな海）」に由来する説が紹介されており、いずれもアイヌ語起源とされる
    kind: fact
    level: E5
    status: contested
    sources:
    - t4-natori-kawa-wiki
  - text: 名取市公式の文化財解説によれば、名取では仙台湾を熊野灘、名取川を熊野川、高舘丘陵を熊野連山に模して、本宮・新宮・那智の熊野三社が他の地域と異なり別々に勧請され、東北太平洋沿いにおける熊野信仰布教の一大拠点であった
    kind: fact
    level: E2
    status: established
    sources:
    - t4-natori-city-bunkazai
  - text: 現在の名取市は、昭和30年（1955年）4月1日に阿武隈川・名取川の両水系に囲まれた2町4か村の合併により名取町として誕生し、昭和33年（1958年）10月1日に県下7番目の市として市制を施行した
    kind: fact
    level: E2
    status: established
    sources:
    - t4-natori-city-toukei
  column:
    title: 名取川は「熊野川」だった
    text: 中世から近世にかけての名取は、熊野信仰の東北への玄関口でした。市の公式解説によれば、仙台湾を熊野灘に、名取川を熊野川に、高舘丘陵を熊野連山に見立て、紀州の熊野三山にならって本宮・新宮・那智の三つの社が、それぞれ別の場所に勧請されました。三社が一か所にまとまらず別々に建つのは他の地域にはない名取ならではの姿で、まさに縮小版の熊野世界です。今も市内に残る名取熊野三社は、古代の郡名「名取」の上に、信仰の都・熊野の名が重ねられた歴史を伝えています。
    sources:
    - t4-natori-city-bunkazai
  relations:
  - pref/04
  - muni/04-岩沼市
  unknowns:
  - 「名取」の語源についてはアイヌ語説などが紹介されるのみで、定説は確認できなかった
  - 「名取川で獲れた鮎（年魚）を朝廷に献上して『名を取った』」という趣旨の語源説は、確認した自治体公式・専門資料では裏付けが得られなかった
  - 名取郡が設置された正確な年代は確認できなかった（7世紀設置と推定されるにとどまる）
  updated: '2026-11-13'
- id: muni/04-塩竈市
  code: '042030'
  names:
    ja: 塩竈市
    reading: しおがまし
    aliases:
    - 塩釜
