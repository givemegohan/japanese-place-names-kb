  summary: 加古郡の町。前身は『播磨国風土記』にも「阿閇津」「阿閇村」が見える古い地名「阿閇（あえ）」の村で、1889年に阿閇村として発足した。1962年4月1日、町制施行と同時に「播磨町」と改称した。新名は旧国名「播磨国」にちなむものとみられるが、改称当時の選定理由を示す資料は確認できていない。
