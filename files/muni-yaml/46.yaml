    - 英祢院
    - 莫祢
  user_terms:
  - あくね
  - 阿久根大島
  - 文旦の里
  - 漁港のまち
  naming_type: 中心地名の継承
  formation: 単独発足
  prefecture: 鹿児島県
  homonyms: []
  summary: 昭和27年（1952年）4月1日に阿久根町が単独で市制を施行し、県下6番目の市として発足した（昭和30年に三笠町と合併）。読みの「あくね」は古い地名で、平安時代末期には荘園の「英祢（あくね）院」と称され、後に「莫祢」とも書かれた。表記が現在の「阿久根」に改まったのは15世紀中期と市は伝えており、読みは千年近く保たれたまま漢字だけが何度も変わった地名である。
  first_attestation:
    era: 平安時代
    year_western: null
    document: null
    note: 市公式は平安時代末期に「英祢院」と称されたことを伝えるが、その根拠となる一次文書名は確認できなかった
  claims:
  - text: 阿久根市の地方公共団体コードは462063である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  - text: 阿久根市は昭和27年（1952年）4月に阿久根町が市制を施行して県下6番目の市として発足し、昭和30年（1955年）に隣接の三笠町と合併して現在の形態となった
    kind: fact
    level: E2
    status: established
    sources:
    - s4-akune-city-rekishi
  - text: 阿久根は平安時代末期には英祢（あくね）院と称され、その院司に任命されていた英祢氏によって統治されていたと市は伝えている
    kind: fact
    level: E2
    status: established
    sources:
    - s4-akune-city-rekishi
  - text: 「英祢」は後に「莫祢」とも書かれ、15世紀中期に現在の「阿久根」に変わったと市は伝えている
    kind: fact
    level: E2
    status: established
    sources:
    - s4-akune-city-rekishi
  - text: 「阿久根」への改称は1451年（宝徳3年）に島津用久によって行われたとする解説がある
    kind: fact
    level: E5
    status: established
    sources:
    - s4-akune-wiki
  - text: 語源については、「アク」は魚や漁業を意味する言葉、「ネ」は岩礁を表すという解釈が紹介されている
    kind: fact
    level: E5
    status: indeterminate
    sources:
    - s4-akune-wiki
  - text: 大正14年（1925年）に阿久根村が町制を施行して阿久根町となり、これが市制施行の直接の前身である
    kind: fact
    level: E5
    status: established
    sources:
    - s4-akune-wiki
  column:
    title: 読みは千年、漢字は三度
    text: 阿久根の読み「あくね」は、平安時代の荘園名「英祢院」の頃から続く古い音である。ところが漢字表記は安定しなかった。鎌倉時代には「莫祢」と書かれ、15世紀中期になってようやく「阿久根」に改まったと市は伝える。地名の漢字は時代ごとに読みに当てはめ直される「宛字」であることが多いが、阿久根はその典型で、音が先にあって字が後からついて回った。2025年現在も残る「英祢」「莫祢」の旧表記は、漁港として古くから開けたこの土地の歴史の古さを物語っている。
    sources:
    - s4-akune-city-rekishi
    - s4-akune-wiki
  relations:
  - pref/46
  - muni/46-出水市
  - muni/46-薩摩川内市
  unknowns:
  - 「あく＝灰」に由来するという説は、確認した市公式・専門辞典・Wikipediaのいずれにも見当たらなかった
  - 「英祢院」の根拠となる平安時代の一次文書名は確認できなかった
  - 語源の「アク＝魚・漁業、ネ＝岩礁」説はWikipedia以外の高次資料で裏付けが取れなかった
  updated: '2026-11-13'
- id: muni/46-霧島市
  code: '462187'
  names:
    ja: 霧島市
    reading: きりしまし
    aliases: []
  user_terms:
  - 霧島市はどうやってできた
  - 霧島神宮のまち
  - 霧島の名前の意味
  naming_type: 自然地名から
  formation: 合併新設
  prefecture: 鹿児島県
  homonyms: []
  summary: 2005年11月7日に国分市と6町が合併して誕生した新設の市名。市民公募3,887件の中で最も応募が多かった名前で、「霧島山を擁する市」として選ばれた。「霧島」という地名自体は承和4年（837年）の『続日本後紀』が初出とされ、語源には霧の島説と噴煙説があるが、市の公式資料も「推測の域を出ず確定できない」としている。
  first_attestation:
    era: 承和4年
    year_western: 837
    document: 続日本後紀
    note: 「霧島」の名の初出とされる記事。「諸縣郡霧嶋岑神」が官社になった記事を霧島市公式資料（郷土史資料）が紹介する。市名そのものは2005年の新設
  claims:
  - text: 2005年（平成17年）11月7日、国分市・溝辺町・横川町・牧園町・霧島町・隼人町・福山町の1市6町が合併して霧島市が誕生した（地方公共団体コードは462187）
    kind: fact
    level: E2
    status: established
    sources:
    - l6-kirishima-enkaku
    - b-cap-chiba-soumu-code
  - text: 新市の名称は市民公募で募った3,887件の中で最も多い名前であり、2004年（平成16年）2月12日に新市の名称を「霧島市」とすることが正式に決定された（霧島市公式の郷土史資料・沿革）
    kind: fact
    level: E2
    status: established
    sources:
    - l6-kirishima-na
    - l6-kirishima-enkaku
  - text: 霧島市公式資料は、市民アンケートの集計結果などから「霧島山を擁する市である」という意味で新市名が選ばれた、と説明する
    kind: fact
    level: E2
    status: established
    sources:
    - l6-kirishima-na
  - text: 「霧島」の文字の初出は承和4年（837年）の『続日本後紀』で、「諸縣郡霧嶋岑神」という神社が官社になった記事であると霧島市公式の郷土史資料は紹介する
    kind: fact
    level: E2
    status: established
    sources:
    - l6-kirishima-na
  - text: 「霧島」の名の由来については、このあたりの霧が深く、雲海から覗く連山が霧に浮かぶ島のように見えることにちなむとする説と、高千穂峰などの噴火の噴煙が霧に見えたことにちなむとする説があるが、市の公式資料は「どちらも推測の域を出ず確定できない」としている
    kind: fact
    level: E2
    status: contested
    sources:
    - l6-kirishima-na
  - text: 合併前の旧霧島町は、もとの東襲山村が1934年（昭和9年）の霧島山の国立公園指定を機に名の論議を経て、1935年（昭和10年）に霧島村と改称し、1958年（昭和33年）に町制を施行したものである（霧島町史第四編）
    kind: fact
    level: E2
    status: established
    sources:
    - l6-kirishima-townshi
  - text: 霧島市公式の郷土史資料は、『続日本紀』延暦7年（788年）の「大隅国贈於郡曽乃峯」の噴火記事を御鉢の噴火とし、霧島一帯の古名「贈於（そお）」の用例として紹介する
    kind: fact
    level: E2
    status: established
    sources:
    - l6-kirishima-na
  column:
    title: 公募1位は、山の名前だった
    text: 合併で新しい市名を決めるとき、通常は旧自治体のどれかの名が残ることが多い。霧島市の場合は違った。市民公募3,887件で最多だったのは、構成自治体のいずれの名でもなく、山の名「霧島」だった。そして実は、この山の名を自治体名にするのは二度目である。旧霧島町も、もとは東襲山村という名で、1935年に霧島山の国立公園指定をきっかけに「霧島」へ改名していた。70年を隔てて、同じ山の名が二度、自治体の名に選ばれたことになる。
    sources:
    - l6-kirishima-na
    - l6-kirishima-townshi
  relations:
  - pref/46
  unknowns:
  - 「霧島」の語源は市公式資料でも「推測の域を出ず確定できない」とされており未確定
  - 『続日本後紀』承和4年条の原文の直接確認は未了（市公式資料の紹介に基づく）
  updated: '2026-11-13'
- id: muni/46-鹿児島市
  code: '462012'
  names:
    ja: 鹿児島市
    reading: かごしまし
    aliases:
    - 麑嶋
    - 鹿児島郡
  user_terms:
  - 鹿児島市と桜島はどっちが先の名前
  - 鹿児島市の名前 鹿と関係あるの
  - 鹿児島市はいつできた 最初の市
  naming_type: 中心地名の継承
  formation: 合併新設
  prefecture: 鹿児島県
  homonyms: []
  summary: 市名は薩摩国鹿児島郡・城下町「鹿児島」に由来する。「鹿児島」はもともと桜島の古名だったとする見方が有力だが、その語源は鹿の子・火山を意味する「カグ」・水夫「カコ」・崖を意味する「カゴ」など諸説あり確定していない。1889年に旧城下の町々と近在の村々の合併で発足し、全国で最初に市制が施行された市の一つとなった。
  first_attestation:
    era: 天平宝字8年
    year_western: 764
    document: 続日本紀
    note: 桜島の噴火を記した記事に「麑島」とあるのが「鹿児島」の文献上の初見であると鹿児島県の資料は紹介する。指示対象は現在の桜島とされる。神名としての「鹿児島」は『日本三代実録』貞観2年（860年）条に確認できる
  claims:
  - text: 鹿児島市は1889年（明治22年）4月1日に市制が施行されて発足し、全国で最初に市制が施行された市の一つである
    kind: fact
    level: E2
    status: established
    sources:
    - f-cap-kagoshima-city-profile
  - text: 市勢要覧の総説に収められた表は、市制施行時の鹿児島市の構成を50町村と示している
    kind: fact
    level: E2
    status: established
    sources:
    - f-cap-kagoshima-city-sousetu
  - text: 「鹿児島」はもともと桜島の古名だったとする見方があり、鹿児島県公式が紹介し、『日本歴史地名大系』も妥当としている
    kind: fact
    level: E2
    status: established
    sources:
    - f-kagoshima-pref
    - f-kagoshima-kotobank
  - text: 鹿児島県の資料は、『続日本紀』天平宝字8年（764年）の桜島噴火の記事にみえる「麑島」を、「鹿児島」の文献上の初見として紹介している
    kind: fact
    level: E2
    status: established
    sources:
    - f-cap-kagoshima-pref-goroumon
  - text: 『日本三代実録』貞観2年（860年）3月条に、薩摩国の鹿児島神に従五位上を授けたことが記録されており、「鹿児島」の名は9世紀には神名として存在した
    kind: fact
    level: E2
    status: established
    sources:
    - f-cap-sandai-jitsuroku
    - f-kagoshima-kotobank
  - text: 鹿児島の語源について鹿児島県公式は、野生の鹿の子が多く生息していたから、火山を意味する「カグ」という言葉から、多くの水夫（かこ）が住んでいたから、などさまざまな説があるとして併記している
    kind: fact
    level: E2
    status: contested
    sources:
    - f-kagoshima-pref
  - text: 山幸彦（天津日高彦穂々出見尊）が海神の宮へ行く際に乗った舟が鹿児山で作られたことに由来するという、神話に結びつけた由来譚も伝えられている
    kind: legend
    level: E3
    status: established
    sources:
    - f-kagoshima-kotobank
  - text: 城下町としての鹿児島の都市的起源は、1602年（慶長7年）に島津家久が鶴丸城を構築し城下町を整備したことにあり、以来江戸時代を通じて島津氏の居城として藩政の中心となった
    kind: fact
    level: E2
    status: established
    sources:
    - f-cap-kagoshima-city-profile
  column:
    title: 名前は、湾の向こうの島から渡ってきた
    text: 鹿児島という名の最初の持ち主は、市街地ではなく対岸の火山の島——いまの桜島——だったとされる。島のほうが「桜島」と呼ばれるようになるのは江戸時代後期のことで、それまでは鹿児島とも向島とも呼ばれていた。半島側の城下町が「鹿児島」を名乗り続けた結果、名前は島から町へ渡り、島は別の名を得た。1914年の大噴火で桜島が大隅半島と陸続きになっても、この名の所属は元に戻らなかった。フェリーで15分の距離にある島と市が、名前の元と継ぎ手の関係にあるのが鹿児島の面白さである。
    sources:
    - f-kagoshima-pref
    - f-kagoshima-kotobank
  relations:
  - pref/46
  unknowns:
  - 「鹿児島」の語源は確定しておらず、崖説・火山説・水夫説・鹿の子説のいずれも決定的な証拠を欠く
  - 764年の「麑島」が桜島を指すことの厳密な検証は、県資料の紹介経由であり一次資料では確認していない
  - 桜島の名称統一（1698年・薩摩藩通達とされる）の一次資料は直接確認できていない
  updated: '2026-11-13'
- id: muni/46-鹿屋市
  code: '462039'
  names:
    ja: 鹿屋市
    reading: かのやし
    aliases:
    - 鹿屋町
    - 鹿屋郷
  user_terms:
  - かのや
  - 大隅半島の中心の市
  - 鹿屋航空基地のまち
  - ばらのまち
  naming_type: 中心地名の継承
  formation: 合併新設
  prefecture: 鹿児島県
  homonyms: []
  summary: 大隅半島の中央部に位置する市で、現在の鹿屋市は平成18年（2006年）1月1日に旧鹿屋市と輝北町・串良町・吾平町が合併して発足した2代目である。「鹿屋」の名は平安時代中期の『和名類聚抄』に大隅国姶羅郡の郷名として確認できる古い地名だが、語源は熊襲の首長・鹿文の名による説、茅（かや）が転じた説、鹿が多かったとする説が併記されるにとどまり、市の公式資料も「定かではありません」とする。なお鹿児島市の「鹿」と由来を共有するわけではない。
  first_attestation:
    era: 承平年間
    year_western: 935
    document: 『和名類聚抄』
    note: 平安時代中期（930年代）の『和名類聚抄』に大隅国姶羅郡の郷として「鹿屋」「串伎」がみえることが紹介されており、地名としての「鹿屋」の初出とされる。ただし二次資料経由の確認であり、原文は未確認
  claims:
  - text: 鹿屋市の地方公共団体コードは462039である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  - text: 現在の鹿屋市は平成18年（2006年）1月1日、鹿屋市・輝北町・串良町・吾平町の1市3町が合併して誕生した
    kind: fact
    level: E2
    status: established
    sources:
    - s5-kanoya-gaiyo
  - text: 初代の鹿屋市は昭和16年（1941年）5月27日に鹿屋町が市制を施行して発足した
    kind: fact
    level: E5
    status: established
    sources:
    - s5-kanoya-wiki
  - text: 平安時代中期の辞書『和名類聚抄』には、大隅国姶羅郡の郷として「鹿屋」「串伎」がみられ、地名としての「鹿屋」はこれが初出であると紹介されている
    kind: fact
    level: E2
    status: established
    sources:
    - s5-kanoya-wiki
  - text: 「鹿屋」の語源について、鹿屋市教育委員会『かのや風土記』は、熊襲の首長・鹿文（かや）の名による説と、大隅地方に多く生えた茅の名が「かのや」に転じた説などを挙げたうえで、いずれも「定かではありません」としている
    kind: fact
    level: E2
    status: contested
    sources:
    - s5-kanoya-fudoki
  - text: この地に鹿が多く棲んでいたので「鹿屋」と呼ぶようになったという説も、鹿屋市教育委員会『かのや風土記』が語源説の一つとして紹介している
    kind: legend
    level: E2
    status: established
    sources:
    - s5-kanoya-fudoki
  - text: 近世の鹿屋郷は肝属川上流の笠野原・鹿屋原の台地に挟まれた一帯で肝属郡に属し、鹿児島藩の外城の一つだったことが『日本歴史地名大系』で紹介されている
    kind: fact
    level: E3
    status: established
    sources:
    - s5-kanoya-kotobank-go
  - text: 鹿屋は古代の姶羅郡に属したが、近世には肝属郡の地となっており、同じ「鹿屋」でも所属する郡は時代によって異なる
    kind: fact
    level: E3
    status: established
    sources:
    - s5-kanoya-kotobank-go
    - s5-kanoya-wiki
  column:
    title: 鹿児島の「鹿」と鹿屋の「鹿」は無関係
    text: 鹿児島と鹿屋は、どちらも「鹿」の字を持ち、読みも「かごしま」「かのや」と似た響きを持つため、同じ語源ではと思われがちである。しかし県名「鹿児島」はもともと桜島の古名だったとする見方が有力で、鹿屋の方は熊襲の首長・鹿文の名、茅の転訛、鹿が多かった土地という全く別の諸説が語られる。つまり二つの「鹿」は、たまたま同じ字が宛てられた別々の地名である。同じ県の中で「鹿」つながりに見える地名が、由来では何の縁もないという点に、地名の当て字の面白さが表れている。
    sources:
    - s5-kanoya-fudoki
    - f-kagoshima-pref
  relations:
  - pref/46
  unknowns:
  - 語源の3説のうちどれが正しいかは、市の公式資料でも「定かではありません」とされ確定できなかった
  - 『和名類聚抄』の「鹿屋」の原文（漢字表記と万葉仮名の読み）は二次資料経由でしか確認できていない
  - 鹿屋城下が整備された近世以降の地名の広がりについては、市史の通史編そのものは未確認である
  updated: '2026-11-13'
- id: muni/46-龍郷町
  code: '465275'
  names:
    ja: 龍郷町
    reading: たつごうちょう
    aliases:
    - 龍郷村
  user_terms:
  - たつごう
  - 西郷隆盛が潜居した町
  - 奄美大島北部の町
  naming_type: 旧行政区画名の継承
  naming_note: 近世の行政区画「龍郷方」の名を村名・町名として継承
  formation: 合併新設
  prefecture: 鹿児島県
  homonyms: []
  summary: 奄美大島北部の町。名は近世の行政区画「龍郷方」に由来し、『日本歴史地名大系』によれば中心集落はタジゴ・タズゴウとも呼ばれ、古くは瀬獅子（シシキョ）と称したが享保13年（1728年）頃を境にその村号は用いられなくなった。1908年に3つの「方」の区域をもって龍郷村が発足し、1975年に町制を施行した。西郷隆盛が潜居した地としても知られるが、地名の古層はそれよりはるかに古い。
  first_attestation:
    era: 享保13年
    year_western: 1728
    document: 龍郷町誌（『日本歴史地名大系』が引用）
    note: 『日本歴史地名大系』が『龍郷町誌』に基づき、この頃を境に旧称「瀬獅子（シシキョ）」の村号が用いられなくなったと紹介する。「龍郷」の名が定着した時期の目安であり、それ以前の用例の始期は未確認
  claims:
  - text: 龍郷町の地方公共団体コードは465275である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  - text: 明治41年（1908年）4月1日、島嶼町村制の施行により、名瀬間切龍郷方、笠利間切赤木名方及び古見間切瀬名方の区域をもって龍郷村が発足した
    kind: fact
    level: E5
    status: established
    sources:
    - s5-tatsugo-wiki
  - text: 龍郷村は昭和50年（1975年）2月10日に町制を施行し、龍郷町となった
    kind: fact
    level: E4
    status: established
    sources:
    - s5-tatsugo-uub
  - text: 『日本歴史地名大系』は、龍郷は名瀬間切龍郷（たじご）方のうちにあり、タズゴウとも呼ばれたと紹介する
    kind: fact
    level: E3
    status: established
    sources:
    - s5-tatsugo-kotobank
  - text: 『日本歴史地名大系』は『龍郷町誌』に基づき、龍郷の古い名はシシキョまたはナガキョで、瀬獅子村・瀬志子村・瀬子郷村などの表記があったが、享保13年（1728年）頃を境にこの村号は用いられなくなったと紹介する
    kind: fact
    level: E3
    status: established
    sources:
    - s5-tatsugo-kotobank
  - text: 龍郷集落は昔「シシキョ・ナガシマ」「ヒヒキョ・ナガジマ」と呼ばれていたが、「ヒヒキョ」という言葉は「火が付く」という意味があり、たびたび火事が起こった時に縁起を担いで現在の名称に変えたという言い伝えがある
    kind: legend
    level: E2
    status: established
    sources:
    - s5-tatsugo-town
  - text: 西郷隆盛は龍郷で3年間にわたって謫居生活を送り、島の名家・龍家の愛加那との間に一男一女（菊次郎・菊子）をもうけたと龍郷町公式は紹介する
    kind: fact
    level: E2
    status: established
    sources:
    - s5-tatsugo-town
  - text: 近世の奄美大島は元禄年間に7間切14方となり、現在の龍郷町の町域は龍郷方・赤木名方・瀬名方の3方に跨がっている
    kind: fact
    level: E3
    status: established
    sources:
    - s5-tatsugo-jwu
  column:
    title: 「火が付く」名を捨てた集落――シシキョから龍郷へ
    text: 龍郷の中心集落は、古くは瀬獅子（シシキョ）と呼ばれていた。町公式の紹介する言い伝えでは、集落は「ヒヒキョ・ナガジマ」とも呼ばれたが、「ヒヒキョ」は「火が付く」を連想させ、火事のたびに縁起を担いで今の名に変えたという。『日本歴史地名大系』によれば、瀬獅子村・瀬志子村・瀬子郷村といった表記は享保13年（1728年）頃を境に使われなくなった。つまり龍郷という名は、西郷隆盛がこの地に潜居する130年以上も前に定着していたことになる。「西郷どんの町」の古層には、火事を忌んだ島の人々の改名の物語が横たわっている。
    sources:
    - s5-tatsugo-town
    - s5-tatsugo-kotobank
  relations:
  - pref/46
  - muni/46-奄美市
  unknowns:
  - 「龍郷」の漢字がなぜ選ばれたか、タジゴ・タツゴーという音そのものの語源は確認できなかった
  - 龍郷方が設置された年代は確認できなかった
  updated: '2026-11-13'
