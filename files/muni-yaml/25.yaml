prefecture_code: '25'
records:
- id: muni/25-大津市
  code: '252018'
  names:
    ja: 大津市
    reading: おおつし
    aliases:
    - 古津
    - 大津町
  user_terms:
  - 琵琶湖のほとりの県庁所在地
  - 大津宮のあった市
  - 京の外港だったまち
  naming_type: その他
  prefecture: 滋賀県
  homonyms: []
  summary: 市名は琵琶湖の港「大津」に由来する。667年に近江大津宮が置かれて都となったが、その廃絶後は「古津」と呼ばれ、794年の平安京遷都の詔で「先帝の旧都」として「大津」に復活した。以後は港町・宿場町の名として定着し、1898年の市制施行で大津市の名となった。
  first_attestation:
    era: 天智天皇6年
    year_western: 667
    document: 『日本書紀』天智天皇条（近江大津宮）
    note: 「大津」の名が都の宮号として現れる早い例。宮の廃絶後は「古津」と呼ばれ、794年に「大津」へ復した。原典は未読で、大津市の歴史文化資料等の紹介による二次確認にとどまる。
  claims:
  - text: 天智天皇6年（667年）に天智天皇は近江大津宮へ都を移し、大津には漏刻（水時計）や庠序（学校）を備えた都が置かれ、律令体制の基礎づくりが進められた。
    kind: fact
    level: E2
    status: established
    sources:
    - d-cap-otsu-rekibun
    - d-cap-otsu-ancient
  - text: 大津宮の廃絶後、この地は「古津」と呼ばれるようになったと百科事典は解説する。「古都の津」の意と解される。
    kind: fact
    level: E3
    status: established
    sources:
    - d-cap-otsu-furutsu
  - text: 古津と呼ばれるようになった理由には、672年の壬申の乱で大津宮が廃されたためとする説と、761年に瀬田川河口部の粟津が大津とされたため、旧来の大津が古津になったとする説がある。
    kind: fact
    level: E3
    status: contested
    sources:
    - d-cap-otsu-furutsu
  - text: 延暦13年（794年）、平安京遷都に際して出された詔には「近江国滋賀郡古津は先帝の旧都、今は輦下に接す。昔の号を追ひて大津と改称すべし」とあり、「大津」の名が復活したことが、『日本紀略』の記事や『日本後紀』逸文の引用を通じて確認できる。
    kind: fact
    level: E3
    status: established
    sources:
    - d-cap-otsu-furutsu
    - d-cap-heian-edict
  - text: 「大津」は辞典では「船が多く泊まる処」を意味する語としても立項されており、琵琶湖の水運の要衝であった当地の性格を表す名であった。
    kind: fact
    level: E3
    status: established
    sources:
    - d-cap-otsu-kotobank
  - text: 江戸時代の大津（大津宿・現在の大津・浜大津地区）は、東海道五十三次の宿場の中でも最大の人口を有するほどの賑わいを見せ、北国の物資が集散する港町の機能をあわせ持っていた。
    kind: fact
    level: E2
    status: established
    sources:
    - d-cap-otsu-chushin
  - text: 1898年10月1日に大津町へ市制が施行され、大津市が成立した。当時の面積は14.20平方キロ、人口は3万2446人であった。
    kind: fact
    level: E2
    status: established
    sources:
    - d-cap-otsu-databook
  - text: 大津宮の所在地は現在の大津市錦織一帯（近江大津宮錦織遺跡）とされ、往時の都の中心は現在の市街地の北部にあたる。
    kind: fact
    level: E2
    status: established
    sources:
    - d-cap-otsu-ancient
  - text: 天智天皇7年（668年）に崇福寺建立のための地ならしをしている際、銅鐸が発見されたという伝承や、石山寺建立の際に銅鐸が出土したという伝承が残されている。
    kind: legend
    level: E2
    status: established
    sources:
    - d-cap-otsu-rekibun
  - text: 大津市の地方公共団体コードは252018である。
    kind: fact
    level: E2
    status: established
    sources:
    - d-cap-jlis-shiga
  column:
    title: 消えた都の名前を取り戻した町
    text: 都が去った後の大津は、「古津」と呼ばれるようになってしまった。ところが794年、桓武天皇が平安京へ遷都した際の詔は、新京を平安京と名付け、国名を山背から山城へ改める話と並べて、近江の古津を「先帝の旧都」として「大津」に戻すことを命じていた。新都の命名と旧都の名の復活は、同じ一つの詔の中で同時に行われたのである。いまの大津市の名は、このとき取り戻された名前である。
    sources:
    - d-cap-otsu-furutsu
    - d-cap-heian-edict
  relations:
  - pref/25
  - muni/26-京都市
  unknowns:
  - 宮号「大津宮」が先にあったのか、港の地名「大津」が先にあったのかは、今回参照した資料では確定できなかった。
  - 『日本紀略』の古津改称記事は百科事典・辞典経由の確認で、原典は未読である。
  updated: '2026-11-13'
- id: muni/25-守山市
  code: '252077'
  names:
    ja: 守山市
    reading: もりやまし
    aliases:
    - 守山町
    - 守山宿
    - 守山村
  user_terms:
  - もりやま
  - 中山道の守山宿
  - 京発ち守山泊まり
  - ホタルのまち
  naming_type: 一部の地名
  prefecture: 滋賀県
  homonyms: []
  summary: 市名は中山道の宿場町「守山宿」以来の地名の継承である。語源は市公式も「不明」と明記しており、『古今和歌集』の紀貫之の歌に詠まれた「もる山」の用例、比叡山延暦寺の鬼門を守る東門院（守山寺）に由来する伝承、山守部起源説などが並び立つ。1955年・1957年の合併で現在の市域が形成され、1970年に市制を施行した。
  first_attestation:
    era: 平安時代
    year_western: 905
    document: 『古今和歌集』の紀貫之の歌（「しらつゆも時雨もいたくもる山は…」）を市公式が「もる山」の用例として紹介
    note: 市公式が挙げる早い用例で、「もる山」が当地の守山を指すかは確定していない。原典は未読で市公式の紹介による二次確認。
  claims:
  - text: 守山市公式は「地名の由来は不明」と明記したうえで、『古今和歌集』の紀貫之の歌「しらつゆも時雨もいたくもる山は したばのこらず色づけにけり」などで当地が「もる山」と称されていることを紹介している。
    kind: fact
    level: E2
    status: established
    sources:
    - p1-moriyama-city
  - text: 東門院が比叡山の東方にあたり「守山寺」の寺号を持つことを守山の起源とする伝承があると、守山市公式は伝えている。
    kind: legend
    level: E2
    status: established
    sources:
    - p1-moriyama-city
  - text: 守山の地名起源には、比叡山延暦寺の鬼門説や「山守部」起源説などがあると、守山市の中心市街地活性化基本計画は整理しているが、いずれも定説には至っていない。
    kind: fact
    level: E2
    status: contested
    sources:
    - p1-moriyama-keikaku
  - text: 江戸時代には中山道の守山宿として整備され、朝鮮通信使が東門院に宿泊するなど「京発ち守山泊まり」と呼ばれる賑わいを見せたと、守山市公式の歴史解説は述べている。
    kind: fact
    level: E2
    status: established
    sources:
    - p1-moriyama-history
  - text: 昭和30年（1955年）に守山町と小津・玉津・河西・速野の4カ村が合併し、昭和32年（1957年）に中洲村の大部分が合併して現在の市域が形成され、昭和45年（1970年）に市制を施行して守山市となった。
    kind: fact
    level: E2
    status: established
    sources:
    - p1-moriyama-history
  - text: 守山市の地方公共団体コードは252077である。
    kind: fact
    level: E2
    status: established
    sources:
    - d-cap-jlis-shiga
  column:
    title: 「京発ち守山泊まり」― 由来不明を公式が認める宿場町
    text: 中山道の宿場のなかでも守山宿は、京を発った旅人が最初に泊まる宿として「京発ち守山泊まり」の言葉で知られた。朝鮮通信使も宿泊した要衝である。その有名な名の由来について、市公式サイトはあっさりと「不明」と書く。貫之の歌の「もる山」、比叡山の鬼門を守る寺の名、古代の山守部。候補は並ぶが、どれも決め手に欠ける。分からないことを分からないと公式が明記する姿勢は、地名の由来を扱う資料としてむしろ信頼できる。
    sources:
    - p1-moriyama-city
    - p1-moriyama-history
  relations:
  - pref/25
  - muni/25-草津市
  unknowns:
  - 「守山」の語源は定説がなく、市公式も不明としている。鬼門説・山守部説はいずれも裏付けの確認ができなかった。
  - 『古今和歌集』の「もる山」が当地を指すかどうかは、市公式の紹介以上の確認ができなかった。
  - 「守山」の表記を持つ地名の文献上の初出（年・文書）は特定できなかった。
  updated: '2026-11-13'
- id: muni/25-彦根市
  code: '252026'
  names:
    ja: 彦根市
    reading: ひこねし
    aliases:
    - 彦根町
  user_terms:
  - ひこね
  - 井伊家の城下町
  - 彦根藩35万石
  naming_type: 一部の地名
  prefecture: 滋賀県
  homonyms: []
  summary: 市名は城下町「彦根」の継承である。彦根市公式は、地名の由来を、天照大神の御子とされる活津彦根命が活津彦根明神として彦根山に祀られたことに求める伝承で説明する。関ヶ原後に井伊家が入り彦根城を築いて藩35万石の城下町となり、1937年、彦根町に5か村が合併して市制を施行した。
  first_attestation:
    era: 不明
    year_western: null
    document: 未確認
    note: 市公式は地名の由来を彦根山の祭神にまつわる伝承で説明するのみで、「彦根」の文献上の初出は本レコードの調査では確認できなかった。
  claims:
  - text: 彦根市公式は、「彦根」の地名は、むかし天照大神の御子に天津彦根命・活津彦根命の二神がおられ、このうち活津彦根命が活津彦根明神として彦根山に祭られたことに由来しているとされていると説明している。
    kind: legend
    level: E2
    status: established
    sources:
    - k4-hikone-city
    - k4-hikone-kankyo
  - text: 戦国時代には石田三成が佐和山城主となって町は繁栄したが、関ヶ原の戦いの功で井伊直政が彦根の地に封ぜられ、その子直継が彦根城の築城を始め、直孝により完成されて、彦根藩35万石の城下町として発展した。
    kind: fact
    level: E2
    status: established
    sources:
    - k4-hikone-city
  - text: 明治22年（1889年）4月1日に彦根で町制が施行され、彦根町が置かれた。
    kind: fact
    level: E2
    status: established
    sources:
    - k4-hikone-city
  - text: 昭和12年（1937年）2月11日、彦根町に隣接の松原・北青柳・青波・千本・福満の5か村が合併して彦根市が誕生した（当時の人口39,335人、面積25.08平方キロメートル）。
    kind: fact
    level: E2
    status: established
    sources:
    - k4-hikone-city
  - text: その後も昭和17年（1942年）の南青柳村・磯田村の合併から昭和43年（1968年）の稲枝町合併まで、周辺町村の編入が続いて現在の市域となった。
    kind: fact
    level: E2
    status: established
    sources:
    - k4-hikone-city
  - text: 彦根市の地方公共団体コードは252026である。
    kind: fact
    level: E2
    status: established
    sources:
    - d-cap-jlis-shiga
  column:
    title: 神の名をいただいた山のふもとの城下町
    text: 彦根の由来として市が伝えるのは、山に祀られた神の名前である。天照大神の御子という活津彦根命が「活津彦根明神」として彦根山に祀られたことから、地名「彦根」が生まれたとされる。井伊家は関ヶ原の後、あえて三成の佐和山城を使わず、この彦根山に新しい城を築いた。神の名を持つ山のふもとに35万石の城下町が開かれたことで、「彦根」は近江の東の中心として定着していく。
    sources:
    - k4-hikone-city
    - k4-hikone-kankyo
  relations:
  - pref/25
  unknowns:
  - 「彦根」の文献上の初出（中世の荘園・地名資料など）は、今回の調査では確認できなかった。
  - 活津彦根命を彦根山に祀る祭祀がいつ始まったのかは、市公式の説明にも示されておらず未確認である。
  updated: '2026-11-13'
- id: muni/25-日野町
  code: '253839'
  names:
    ja: 日野町
    reading: ひのちょう
    aliases:
    - 日野御牧
    - 日野市
  user_terms:
  - 日野町 日野御牧
  - 日野商人の町
  - 蒲生氏郷の城下町
  naming_type: その他
  prefecture: 滋賀県
  homonyms:
  - muni/31-日野町
  summary: 「日野」の名は天喜4年（1056年）の文書に法成寺領「日野御牧」として現れるのが初出とされ、中世には市場町「日野市」を経て蒲生氏の城下町となり、近江商人（日野商人）の町として発展した。明治22年（1889年）に日野町が発足し、昭和30年（1955年）の合併でも名が継承された。鳥取県の日野町が郡名を採用した新設町であるのとは成立の事情が異なる。
  first_attestation:
    era: 天喜4年
    year_western: 1056
    document: 東大寺使神成則請文
    note: 藤原摂関家ゆかりの法成寺領「日野御牧」としての登場。町公式の文化財保存活用地域計画が「日野の由来」として紹介するもの
  claims:
  - text: 町公式資料によれば、「日野」という名称が初めて歴史に登場するのは天喜4年（1056年）で、「東大寺使神成則請文」の中に藤原摂関家ゆかりの法成寺領「日野御牧」として登場する
    kind: fact
    level: E2
    status: established
    sources:
    - h6-hino-shiga-keikaku
  - text: 応永33年（1426年）には、四本商人の一つである保内商人が伊勢との交易の拠点として「日野市」で商売を行った記録が残り、この「日野市」がのちに蒲生氏の城下町「日野町」へと発展した
    kind: fact
    level: E2
    status: established
    sources:
    - h6-hino-shiga-keikaku
  - text: 16世紀初頭、蒲生定秀が「日野市」付近に中野城を築いて城下町を整備し、日野は蒲生氏の支配の拠点となった。日野はのちに近江商人（日野商人）の発祥地として知られる
    kind: fact
    level: E2
    status: established
    sources:
    - h6-hino-shiga-keikaku
    - h6-hino-shiga-wiki
  - text: 昭和30年（1955年）3月16日、日野町・東桜谷村・西桜谷村・西大路村・鎌掛村・南比都佐村・北比都佐村の1町6村が合併して現在の日野町が誕生した。町名は1889年に発足した日野町の名の継承である
    kind: fact
    level: E2
    status: established
    sources:
    - h6-hino-shiga-keikaku
  - text: 鳥取県の日野町は昭和34年（1959年）に郡名「日野」を採って新設された町であり、滋賀の日野が中世の御牧・市場町以来の地名を継承してきた点で、名の継承経路が異なる（異なる層）
    kind: fact
    level: E2
    status: established
    sources:
    - h6-hino-shiga-keikaku
    - h6-hino-tottori-wiki
  - text: 「日野」という語そのものの語源（なぜ「日野」と呼ばれるようになったか）は、町公式資料も初出の紹介にとどまっており、確定していない
    kind: fact
    level: E2
    status: indeterminate
    sources:
    - h6-hino-shiga-keikaku
  column:
    title: 御牧からはじまる商人の町
    text: 日野の名は、平安時代の馬の放牧地「日野御牧」として史料に現れます。それが中世には「日野市」という市場町の名となり、戦国期には蒲生氏郷の父祖の城下町となり、江戸時代には近江商人・日野商人を生む在郷町になりました。御牧→市場→城下町→商人の町と、名前は同じ「日野」のまま、中身が何度も入れ替わってきた町です。特産の「日野菜」（漬物で知られるカブ）も、この町の名を全国に運んだものの一つです。
    sources:
    - h6-hino-shiga-keikaku
    - h6-hino-shiga-wiki
  relations:
  - pref/25
  - muni/31-日野町
  unknowns:
  - 「日野」の語源（日野御牧の名の由来）は未確定
  - 日野御牧の範囲と現在の町域との対応の詳細は未確認
  updated: '2026-11-13'
- id: muni/25-東近江市
  code: '252131'
  names:
    ja: 東近江市
    reading: ひがしおうみし
    aliases:
    - 八日市市
  user_terms:
  - ひがしおうみ
  - 近江の東
  - 八日市大凧のまち
  - 五個荘の近江商人
  naming_type: 合併新設
  prefecture: 滋賀県
  homonyms: []
  summary: 市名は旧国名「近江」に方角の「東」を冠した広域名である。2005年2月11日に八日市市・永源寺町・五個荘町・愛東町・湖東町が新設合併して誕生し、2006年に能登川町・蒲生町を編入した。中心市街の八日市は市場町に由来する旧市名で、市の紋章も「東（east）のeと『近』」をモチーフにしている。
  first_attestation:
    era: 平成17年
    year_western: 2005
    document: 東近江市公式統計書の沿革（2005年2月11日の合併による設置）
    note: 「東近江」は2005年の合併で作られた新しい市名であり、それ以前の用例はない。旧国名「近江」の語としての初出は別問題として扱う。
  claims:
  - text: 東近江市は、平成17年（2005年）2月11日に八日市市・永源寺町・五個荘町・愛東町・湖東町が合併して誕生したと、東近江市公式の統計書は記している。
    kind: fact
    level: E2
    status: established
    sources:
    - p1-higashiomi-city
  - text: 平成18年（2006年）1月1日に、神崎郡能登川町と蒲生郡蒲生町が東近江市へ編入され、現在の市域となった（総務省告示による）。
    kind: fact
    level: E2
    status: established
    sources:
    - p1-higashiomi-reiki
  - text: 市名「東近江」は、旧国名「近江」の東部に位置することにちなんで付けられた広域名であると説明される。
    kind: fact
    level: E5
    status: established
    sources:
    - p1-higashiomi-wiki
  - text: 市の紋章は「東（east）の『e』と『近』」をモチーフにデザインされており、市名の2つの要素がそのまま市のシンボルになっていると、東近江市統計書は説明している。
    kind: fact
    level: E2
    status: established
    sources:
    - p1-higashiomi-city
  - text: 合併前の中心市であった八日市市は、市場町として発達した八日市を中心とする市で、市域は額田王と大海人皇子の相聞歌の舞台となった蒲生野や、永源寺・百済寺などの古刹を抱えると、東近江市人口ビジョンは述べている。
    kind: fact
    level: E2
    status: established
    sources:
    - p1-higashiomi-city
  - text: 東近江市の地方公共団体コードは252131である。
    kind: fact
    level: E2
    status: established
    sources:
    - d-cap-jlis-shiga
  column:
    title: 「近江」の東という名 ― 広域名を名乗った平成合併
    text: 平成の大合併で生まれた市名には、旧国名に方角を付けるタイプが各地にある。東近江市もその一つで、特定の旧市町の名（八日市）を捨て、地域全体を指す言葉を選んだ。市役所は旧八日市市に置かれたが、名は「近江の東」。中核の地名を残すか、広域の名を新しく掲げるか。合併協議のたびに繰り返されるこの選択で、東近江は後者を選んだ市である。
    sources:
    - p1-higashiomi-city
    - p1-higashiomi-wiki
  relations:
  - pref/25
  - muni/25-近江八幡市
  unknowns:
  - 市名「東近江」の選定過程（公募の有無・得票・対抗候補）は、市の公式資料では確認できなかった。
  - 旧中心地名「八日市」の語源（市場が開かれた日に由来するとされる点）の一次・専門資料による裏付けは、今回は確認できなかった。
  updated: '2026-11-13'
- id: muni/25-栗東市
  code: '252085'
  names:
    ja: 栗東市
    reading: りっとうし
    aliases:
    - 栗東町
  user_terms:
  - りっとう
  - 栗太郡の東
  - トレセンのあるまち
  - JRA栗東トレーニング・センター
  naming_type: 合併新設
  prefecture: 滋賀県
  homonyms: []
  summary: 市名は「栗太郡の東」に由来する方角合成地名である。1954年、栗太郡の東側にあった治田・金勝・葉山・大宝の4村が合併した際に、郡名の「栗」と方角の「東」を合わせて「栗東町」と名付けられた。平成の大合併のなかで周辺市町と合併せず、2001年に単独で市制を施行して栗東市となり、同時に栗太郡は消滅した。
  first_attestation:
    era: 昭和29年
    year_western: 1954
    document: 栗東歴史民俗博物館の解説が伝える栗東町の誕生（1954年の4村合併）
    note: 「栗東」は1954年の合併で新しく作られた町名であり、それ以前の用例はない。名の由来は市の博物館・広報が一貫して「栗太郡の東」と説明する。
  claims:
  - text: 「栗東」という名前は「栗太郡の東」に由来していると、栗東歴史民俗博物館（栗東市公式）は説明している。
    kind: fact
    level: E2
    status: established
    sources:
    - p1-ritto-hakubutsukan
  - text: 昭和29年（1954年）に、栗太郡の東側にあった治田・金勝・葉山・大宝の4つの村が合併して、栗東町が誕生した。
    kind: fact
    level: E2
    status: established
    sources:
    - p1-ritto-hakubutsukan
  - text: 合併前の4村は明治22年（1889年）の町村制で生まれた村で、治田村の名は古代・中世の庄園「治田庄」に由来するなど、それぞれ歴史的地名を引き継いでいたと、栗東市広報は解説している。
    kind: fact
    level: E2
    status: established
    sources:
    - p1-ritto-koho
  - text: 平成の大合併の時期にあっても栗東町は周辺の市町と合併することなく、平成13年（2001年）10月1日に単独で市制を施行して栗東市となった。21世紀に入ってから単独で市制を施行した町村は全国でも14のみで、珍しい事例であると市広報は述べている。
    kind: fact
    level: E2
    status: established
    sources:
    - p1-ritto-koho
  - text: 栗東町が市制を施行したことで、郡内に残る唯一の自治体を失った栗太郡は消滅した。かつての栗太郡は現在の大津市の瀬田川以東・草津市全域・守山市の一部までを含む広い郡であったと市広報は説明している。
    kind: fact
    level: E2
    status: established
    sources:
    - p1-ritto-koho
  - text: 栗東市の地方公共団体コードは252085である。
    kind: fact
    level: E2
    status: established
    sources:
    - d-cap-jlis-shiga
  column:
    title: 郡の名を方角で継いだ町 ― 栗太郡の最期の姿
    text: 「栗東」は、古代から続く由緒ある地名ではない。1954年、郡の東側の4つの村が合併するとき、所属する栗太郡の「栗」に方角の「東」を付けた、行政的で合理的な命名である。ところがこの即席の名前は、やがて郡そのものより長生きすることになった。2001年に栗東町が市になると、郡内に唯一残っていた自治体がいなくなり、千年以上の歴史を持つ栗太郡は消滅した。郡名の「栗」の一文字は、今も市名のなかに残っている。
    sources:
    - p1-ritto-hakubutsukan
    - p1-ritto-koho
  relations:
  - pref/25
  - muni/25-草津市
  - muni/25-守山市
  unknowns:
  - 1954年の合併の際に「栗東」の名がどのような手続き（公募・協議）で選ばれたのかは、市の博物館・広報の解説では確認できなかった。
  - 栗太郡の「栗太」自体の語源は本レコードの調査対象外で、未確認である。
  updated: '2026-11-13'
- id: muni/25-湖南市
  code: '252115'
  names:
    ja: 湖南市
    reading: こなんし
    aliases:
    - 石部町
    - 甲西町
  user_terms:
  - こなん
  - 琵琶湖の南の市
  - 石部宿のまち
  - うつくし松のまち
  naming_type: 合併新設
  prefecture: 滋賀県
  homonyms: []
  summary: 市名は「琵琶湖の南」を意味する広域地名「湖南」から採られた。2004年10月1日、甲賀郡の石部町と甲西町が合併して誕生した市で、もとは甲賀郡7町の合併協議から離れて2町で合併した経緯を持つ。新市名は公募で「湖南」が上位に入り、候補の中から選ばれた。なお市域は琵琶湖に接していない。
  first_attestation:
    era: 平成16年
    year_western: 2004
    document: 湖南市広報が伝える2004年10月1日の合併による市の誕生
    note: 市名としての「湖南」の初出は2004年の合併。広域地名としての「湖南」の使用例はそれ以前からあるが、その初出は本調査では確認できなかった。
  claims:
  - text: 甲西町と石部町が合併し、平成16年（2004年）10月に湖南市が誕生したと、湖南市広報は「琵琶湖の南に甲西町と石部町の2町が合併し」と伝えている。
    kind: fact
    level: E2
    status: established
    sources:
    - p1-konan-city
  - text: 市名の「湖南」は、大津市南部から旧甲賀郡にかけてを指す広域地名であり、市名はこの広域名から採られた。ただし湖南市自体は琵琶湖とは接していない。
    kind: fact
    level: E5
    status: established
    sources:
    - p1-konan-wiki
  - text: 新市名の公募では、湖南のほか阿星・美松・南近江・南びわこなどが候補に並び、最終候補5点の中から「湖南」が選ばれたと、市区町村変遷情報データベースは伝えている。
    kind: fact
    level: E5
    status: established
    sources:
    - p1-konan-uub
  - text: 石部町と甲西町は、もともと甲賀郡7町による合併研究会に参加していたが、2001年12月に7町の合併協議会への不参加を表明し、2町での合併に進んだ経緯がある。
    kind: fact
    level: E5
    status: established
    sources:
    - p1-konan-uub
  - text: 合併した石部町は東海道51番目の宿場・石部宿の町、甲西町は1955年に三雲村・岩根村が合併して生まれた町（名は甲賀郡の西の意）であった。
    kind: fact
    level: E5
    status: established
    sources:
    - p1-konan-uub
  - text: 湖南市の地方公共団体コードは252115である。
    kind: fact
    level: E2
    status: established
    sources:
    - d-cap-jlis-shiga
  column:
    title: 湖に接していない「湖南市」
    text: 「湖南」は琵琶湖の南という意味の広域名だが、湖南市そのものは琵琶湖に1メートルも接していない。市域は野洲川沿いの内陸にあり、湖岸は隣の守山市や草津市に譲っている。それでも公募では阿星山にちなむ「阿星」や「南近江」「南びわこ」といった候補を抑えて「湖南」が選ばれた。実体よりも、地域のイメージを指す言葉の方が、新しい市の看板として相応しいと判断されたのである。
    sources:
    - p1-konan-wiki
    - p1-konan-uub
  relations:
  - pref/25
  - muni/25-甲賀市
  - muni/25-栗東市
  unknowns:
  - 市名の最終決定（協議会での選定理由の公式文言）は、市の公式資料では確認できなかった。
  - 広域地名としての「湖南」の初出・使用開始時期は確認できなかった。
  updated: '2026-11-13'
- id: muni/25-甲賀市
  code: '252093'
  names:
    ja: 甲賀市
    reading: こうかし
    aliases:
    - 甲賀町
    - 甲賀郡
  user_terms:
  - こうか
  - 甲賀忍者の里
  - 信楽焼のまち
  - 甲賀流
  naming_type: 合併新設
  prefecture: 滋賀県
  homonyms: []
  summary: 市名は旧甲賀郡の名を引き継いだものである。「甲賀」は6世紀末には「かふか／かうか」と呼ばれていた地名に、奈良時代に縁起の良い漢字「甲賀」があてられて定着したと市公式資料は説明する。甲賀流忍者や信楽焼で知られる郡域の5町（水口・土山・甲賀・甲南・信楽）が2004年に合併して甲賀市となり、読みは「こうか」に決められた。
  first_attestation:
    era: 6世紀末
    year_western: null
    document: 『日本書紀』に見える百済系豪族「鹿深臣」の記述を、甲賀市公式資料が「かふか」の早い用例として紹介
    note: 原典は未読で、市公式資料の紹介による二次確認。「甲賀」の漢字表記の定着は奈良時代とされる。
  claims:
  - text: 甲賀市公式資料は、『日本書紀』の中に百済系豪族「鹿深臣（かふかのおみ）」の記述があり、すでに6世紀末にはこの地が「かふか」あるいは「かうか」と呼ばれていたと考えられると紹介している。
    kind: fact
    level: E2
    status: established
    sources:
    - p1-koka-city
  - text: 奈良時代には「かうか」に縁起の良い漢字をあてて「甲可」や「甲賀」と記していたが、やがて「甲賀」に定着し、近江国を構成する「甲賀郡」と呼ばれるようになったと、甲賀市公式資料は説明している。
    kind: fact
    level: E2
    status: established
    sources:
    - p1-koka-city
  - text: 「甲賀」は千年以上の時を経て、平成16年（2004年）に水口・土山・甲賀・甲南・信楽の5つの町が合併して成立した新しい市の名称にも引き継がれたと、甲賀市公式資料は述べている。合併の日は2004年10月1日である。
    kind: fact
    level: E2
    status: established
    sources:
    - p1-koka-city
  - text: 合併にあたって旧5町はいずれも甲賀郡に属しており、新市名は郡名をそのまま継ぐ形になった。合併前の中心的な町であった水口町は東海道の宿場町、水口城の城下町として栄えた。
    kind: fact
    level: E2
    status: established
    sources:
    - p1-koka-city
  - text: 「甲賀」の読みには「こうか」と「こうが」の2通りがあり、合併後の市名の読みを決めるために決選投票が行われ、「こうか」が選ばれたと伝えられる。
    kind: fact
    level: E5
    status: established
    sources:
    - p1-koka-wiki
  - text: 甲賀市の地方公共団体コードは252093である。
    kind: fact
    level: E2
    status: established
    sources:
    - d-cap-jlis-shiga
  column:
    title: 「こうか」か「こうが」か ― 読みを投票で決めた市名
    text: 甲賀忍者で知られる「甲賀」には、実は「こうか」と「こうが」という2つの読みが併存してきた。地域によっても家によっても読みが分かれるこの地名が市の名になるにあたり、2004年の合併では読みそのものが決選投票にかけられ、「こうか」に決まったという。漢字は千年以上前から変わらないのに、その読みが21世紀の投票で決まる。地名とは、文字と音の両方を引き継ぐ営みなのだと分かる事例である。
    sources:
    - p1-koka-wiki
    - p1-koka-city
  relations:
  - pref/25
  - muni/25-湖南市
  unknowns:
  - 読みの決選投票の具体的な経緯（実施主体・得票など）は、Wikipedia以外の資料で確認できなかった。
  - 「かふか」の語源そのもの（鹿深の意味）は、市公式資料でも説明がなく未確認である。
  - 新市名の公募で「甲賀」以外の候補がどこまで残ったかは、公式資料で確認できなかった。
  updated: '2026-11-13'
- id: muni/25-米原市
  code: '252140'
  names:
    ja: 米原市
    reading: まいばらし
    aliases:
    - 米原町
    - 米原（まいはら）
  user_terms:
  - まいばら
  - まいはら
  - 新幹線の米原駅
  - 伊吹山のふもとの市
  naming_type: 合併新設
  prefecture: 滋賀県
  homonyms: []
  summary: 市名は旧米原町の名を引き継いだものである。2005年に旧坂田郡の山東町・伊吹町・米原町が合併して発足し、同年近江町を編入した。読みは旧町の「まいはら」ではなく、新幹線停車駅として全国に知られた駅名の「まいばら」が市名の読みに採用された。「米原」の語源には、蘆荻の荒地で人が迷った「迷原」が転じたとする説が伝えられる。
  first_attestation:
    era: 未確認
    year_western: null
    document: 未確認
    note: 「米原」の地名の文献上の初出は本調査では特定できなかった。市名としての採用は2005年2月14日。読みは古くから「まいはら」「まいばら」の両様があったとされる。
  claims:
  - text: 米原市は山東町・伊吹町・米原（まいはら）町・近江町の旧坂田郡4町が合併してできた市であり、2005年2月14日に3町で発足し、同年10月1日に近江町を編入したと、米原市公式は説明している。
    kind: fact
    level: E2
    status: established
    sources:
    - p1-maibara-city
  - text: 新市の名称については合併時に公募で募集したところ「米原市」を候補とする意見が多く、また新幹線の停車駅があり全国的にも知名度のあることから「米原」を採用したと、米原市公式のFAQは述べている。
    kind: fact
    level: E2
    status: established
    sources:
    - p1-maibara-city
  - text: 市名の読みは、旧米原町の読み「まいはら」ではなく、知名度の高い米原駅に合わせて「まいばら」が採用された。
    kind: fact
    level: E5
    status: established
    sources:
    - p1-maibara-wiki
  - text: 北陸自動車道の米原インターチェンジの読みは、もとは「まいばら」であったが2001年ごろに当時の町名に合わせて「まいはら」に変更されたため、市制後は自治体名「まいばら」と高速道路の「まいはら」が再び食い違う形になっている。
    kind: fact
    level: E5
    status: established
    sources:
    - p1-maibara-wiki
  - text: 「米原」の地名の由来については、周辺一帯が蘆荻（アシ・オギ）の生い茂る荒地であった頃に道に迷う行人が多かったことから「迷原」と呼ばれ、やがて田が開拓されて「米原」と改められたという説を、『角川日本地名大辞典』が取り上げていると伝えられる。
    kind: legend
    level: E5
    status: established
    sources:
    - p1-maibara-wiki
  - text: 米原市の地方公共団体コードは252140である。
    kind: fact
    level: E2
    status: established
    sources:
    - d-cap-jlis-shiga
  column:
    title: 駅に読みを譲った町 ― まいはらとまいばら
    text: 「米原」は、町としては「まいはら」、駅としては「まいばら」と、長く2つの読みが並び立ってきた。2005年に市になるとき、選ばれたのは駅の読み「まいばら」だった。新幹線が停まる駅名の知名度が、土地本来の読みを上回ったのである。ところが高速道路の米原インターチェンジは、2001年にわざわざ町名に合わせて「まいはら」に直したばかりだったため、市と高速道路で読みが再び食い違うという、珍しいねじれが残った。
    sources:
    - p1-maibara-wiki
    - p1-maibara-city
  relations:
  - pref/25
  - muni/25-長浜市
  - muni/25-彦根市
  unknowns:
  - 「米原」の地名の文献上の初出（年・文書）は確認できなかった。
  - 「迷原」説は『角川日本地名大辞典』の記述をWikipedia経由で確認したにとどまり、辞典そのものの直接確認はできていない。
  - 1889年の米原駅開業時に駅名の読みが「まいばら」に決まった理由は、資料では確認できなかった。
  updated: '2026-11-13'
