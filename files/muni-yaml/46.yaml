  naming_type: 旧行政区画名の継承
  formation: 合併新設
  prefecture: 鹿児島県
  homonyms: []
  summary: 平成22年（2010年）3月23日、姶良郡の加治木町・姶良町・蒲生町が新設合併して発足した市で、鹿児島県内では平成の大合併の最後に生まれた市である。市名は3町共通の郡名「姶良郡」に由来するが、この郡名には取り違えの歴史がある。市域は江戸時代に始羅郡と呼ばれた土地で、古代大隅国の姶羅郡は現在の鹿屋市付近の別郡だったものが混同され、明治期に「姶良」の表記が正式名として定着した。
  first_attestation:
    era: 江戸時代
    year_western: null
    document: null
    note: 市域を指す郡名としては江戸時代の「始羅郡」が実体で、「姶良」の表記は古代の姶羅郡（鹿屋市付近）との混同を経て明治期に統一されたもの。始羅・姶羅それぞれの文献上の確かな初出は確認できなかった
  claims:
  - text: 姶良市の地方公共団体コードは462250である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  - text: 姶良市は平成22年（2010年）3月23日、姶良郡加治木町・姶良町・蒲生町の新設合併で発足した
    kind: fact
    level: E4
    status: established
    sources:
    - s4-aira-uub
  - text: 市名は3町に共通する郡名「姶良郡」に由来し、1955年に発足した旧姶良町も「三町村の郷土に共通するという理由」から郡名を町名に採用していた
    kind: fact
    level: E2
    status: established
    sources:
    - s4-aira-kagoshima-u
  - text: 現在の姶良郡の地域は江戸時代には始羅郡（しらぐん）と呼ばれており、古代の大隅国に存在した姶羅郡（あいらぐん）とは別の郡である
    kind: fact
    level: E5
    status: established
    sources:
    - s4-airagun-wiki
  - text: 古代の姶羅郡は現在の鹿屋市付近を指し中世までに肝属郡へ編入された郡で、始羅郡がこれと混同されたため明治期に「姶良」へ表記が統一された
    kind: fact
    level: E5
    status: established
    sources:
    - s4-airagun-wiki
  - text: 姶良市は鹿児島湾の奥側に位置し、巨大噴火で形成された姶良カルデラの北西側の外輪山にあたる位置にある
    kind: fact
    level: E5
    status: established
    sources:
    - s4-aira-wiki
  - text: 「姶良カルデラ」という名称は地名の姶良に由来し、松本唯一が1933年に「姶良火山」の名を提唱、1943年に正式に命名したもので、地名のほうがカルデラの名より先である
    kind: fact
    level: E2
    status: established
    sources:
    - s4-aira-caldera-kagoshima-u
  column:
    title: 取り違えられて定着した郡名
    text: 「姶良」という名は、本来よその郡の名前だった。古代の大隅国にあった姶羅郡は、現在の鹿屋市あたりの郡で、中世までに消えた。一方、現在の姶良市一帯は江戸時代まで始羅郡と呼ばれていたが、読みの似た両者が混同され、明治期に表記が「姶良」に統一されてしまった。つまり姶良市は、別の場所の古代の郡名を「借りた」土地に、1955年に共通の名として郡名を採用し、2010年に市名にした、という重なった経緯を持つ。姶良カルデラという世界的に知られる地学用語も、源をたどればこの取り違えの先に生まれた地名から名付けられている。
    sources:
    - s4-airagun-wiki
    - s4-aira-caldera-kagoshima-u
  relations:
  - pref/46
  - muni/46-鹿屋市
  - muni/46-霧島市
  unknowns:
  - 始羅郡・姶羅郡の混同と表記統一の経緯はWikipedia以外の高次資料で裏付けが取れなかった
  - 「始羅」「姶良」の語自体の語源は確認できなかった
  - 2010年の市名選定過程（公募の有無等）は一次資料で確認できなかった
  updated: '2026-11-13'
