- id: muni/46-東串良町
  code: '464821'
  names:
    ja: 東串良町
    reading: ひがしくしらちょう
    aliases:
    - 東串良村
    - 串良郷
    - 久西良
  user_terms:
  - ひがしくしら
  - 串良の東側の町
  naming_type: 中心地名の継承
  formation: 改称
  prefecture: 鹿児島県
  homonyms: []
  summary: 鹿児島県肝属郡の町。地名「串良（くしら）」は、神の使いが「髪梳の神がいた」と報告したことから隼人の言葉で「久西良の郷」と呼ばれるようになったという命名譚が伝えられる古い郷名である。江戸時代は東・西を合わせた串良郷（外城）として統治され、1889年の町村制で郷が東西に分かれて東半が東串良村となり、1932年10月1日に町制を施行して東串良町となった。西半の西串良村は串良町と改称し2006年に鹿屋市へ合併したが、東串良町は単独の町として残った。
  first_attestation:
    era: 不明
    year_western: null
    document: 農林水産省資料が引用する『大隅風土記』の記事（「久西良の郷」の命名譚）
    note: 原典の成立年代・現存状況は確認できていないため、伝承としての最古層として記録する。「串良」の表記による文献上の初出は未確認
  claims:
  - text: 総務省「地方公共団体コード一覧」で、東串良町の団体コードは464821とされている
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  - text: 『大隅風土記』の記事として、国造りの神が出した使いが帰って「髪梳（かみくし）の神がありました」と申し上げたので、神はその村を髪梳きの村と言うように仰せられ、隼人のことばで「久西良（くしら）の郷」というようになったという命名譚を、農林水産省の地域資料が引用している
    kind: legend
    level: E2
    status: indeterminate
    sources:
    - s2-kushira-maff
  - text: 江戸時代、現在の東串良町と旧串良町の区域は薩摩藩の直轄領であり、串良郷（外城）として一体に統治され、地頭仮屋は後の串良町役場周辺に置かれたとWikipediaは紹介している
    kind: fact
    level: E5
    status: established
    sources:
    - s2-kushira-wiki
  - text: 明治初年の串良郷は、新川西村・川東村・川西村・岩弘村・池之原村（現・東串良町）と上小原村・下小原村・岡崎村・細山田村・有里村（現・鹿屋市）からなっていたと、『角川日本地名大辞典』に基づく郷構成としてWikipediaは紹介している
    kind: fact
    level: E5
    status: established
    sources:
    - s2-kimotsuki-gun-wiki
  - text: 1889年4月1日の町村制施行で串良郷は東西に分けられ、東側が東串良村、西側が西串良村として発足したとWikipediaは紹介している
    kind: fact
    level: E5
    status: established
    sources:
    - s2-kimotsuki-gun-wiki
    - s2-kushira-wiki
  - text: 東串良村は1889年4月1日から1932年10月1日まで存続し、同日に東串良町となったことを、国立情報学研究所「歴史的行政区域データセットβ版」は記録している（西串良村は同年5月15日に町制施行し串良町と改称した）
    kind: fact
    level: E2
    status: established
    sources:
    - s2-higashikushira-geoshape
    - s2-kimotsuki-gun-wiki
  - text: 平成の大合併では、東串良町は肝属東部の合併協議に参加したが、2003年12月に町議会が合併協議会からの離脱決議を可決するなどして協議はまとまらず、東串良町は単独の町として存続したと、市区町村変遷情報データベースは記録している
    kind: fact
    level: E4
    status: established
    sources:
    - s2-kimotsuki-uub
  column:
    title: 東西に分かれた串良、二つの運命
    text: 1889年、串良郷はまん中で東西に割れた。西半分の西串良村は1932年に町制を施行する際、「西」を捨てて串良町と名乗り、本家の名を継いだ。ところがその串良町は2006年、鹿屋市との合併で消え、今は「鹿屋市串良町」という大字の冠として残るだけである。一方、東半分の東串良村は同じ1932年に東串良町となり、「東」を付けた側の名のまま、今も独立した町として続いている。本家を名乗った西が消え、分家のような「東」が残るという、逆転した結末になった。
    sources:
    - s2-kushira-wiki
    - s2-higashikushira-geoshape
    - s2-kimotsuki-gun-wiki
  relations:
  - pref/46
  - muni/46-肝付町
  - muni/46-鹿屋市
  unknowns:
  - 『和名類聚抄』の大隅国肝属郡に串良郷が収録されているかは確認できなかった
  - 『大隅風土記』と呼ばれる原典の成立年代・書誌は確認できなかった
  - 「串良」の語源について、命名譚以外の学術的な説明は確認できなかった
  updated: '2026-11-13'
