  column:
    title: 「そお」と読めるようになるまで
    text: 曽於市の「曽於」は、初見では読めない難読地名の一つだが、もとの表記はさらに難しかった。古代から近代まで郡名は「囎唹」と書かれ、『和名類聚抄』では「ソヲ」と読まれた。旁が「曾」である「曽於」の表記に改まり、読みも「そお」へと移ったのは後世のことである。この地はまた、古代に朝廷へ抵抗した熊襲（くまそ）の故地とも関連づけて語られることがあり、「球磨囎唹」を熊襲と結びつける説もある。2005年の合併で3町は、新しい造語ではなく千年以上の歴史を持つ郡名をそのまま市名に選んだ。
