  - 志布志市志布志町志布志
  naming_type: 中心地名の継承
  formation: 合併新設
  prefecture: 鹿児島県
  homonyms: []
  summary: 平成18年（2006年）1月1日、曽於郡の志布志町・有明町・松山町が新設合併して発足した市。市名は中心町だった旧志布志町の名を継承した。「志布志」は「志」の字を重ねた名で、天智天皇が布を献上した里人の厚い志に感激して名付けたという伝承で知られるが、文献上の初出は鎌倉末期（1316年）の寄進文書とされる。市役所のある大字は「志布志町志布志」で、「志」が何重にも連なる住所表記でも有名である。
  first_attestation:
    era: 鎌倉時代
    year_western: 1316
    document: 宝満寺再興に際する寄進文書（志布志津の一角を寄進した文書）
    note: 志布志市観光特産品協会が「文献上に初めて現れる」用例として紹介するもの。文書そのものは未確認のため、主張は紹介の形で記録した
  claims:
  - text: 志布志市の地方公共団体コードは462217である
    kind: fact
    level: E2
    status: established
