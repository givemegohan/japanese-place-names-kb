  naming_type: 旧国名・広域地名の採用
  naming_note: 旧国名「筑後」をそのまま市名に採用したもの
  formation: 合併新設
  prefecture: 福岡県
  homonyms: []
  summary: 福岡県南部、筑後平野の市。1954年4月1日、八女郡羽犬塚町・水田村・古川村・岡山村の一部が合併して誕生し、旧国名「筑後」を市名とした。中心地の羽犬塚は薩摩街道の宿場町で、羽の生えた犬「羽犬」の伝説を伝える。なお古代の筑後国の国府の跡（筑後国府跡）は市内ではなく隣の久留米市にあり、国名を名乗る市と国府の跡地は一致しない。
  first_attestation:
    era: 律令制下
    year_western: null
    document: null
    note: 「筑後」は筑紫国が筑前・筑後に分かれて生まれた旧国名だが、その初出文献は特定できなかった。市名としての「筑後」の初出は1954年の合併による
  claims:
  - text: 筑後市の地方公共団体コードは402117である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  - text: 1954年4月1日、八女郡羽犬塚町・水田村・古川村と岡山村の大字前津・長浜の区域をもって筑後市が置かれた（総理府告示第255号・福岡県告示第253号。発足時の人口は37,139人）
    kind: fact
    level: E2
    status: established
    sources:
    - r3-chikugo-reiki
    - r3-chikugo-ayumi
  - text: 1955年3月に三潴郡西牟田町が筑後市に合併した
    kind: fact
    level: E2
    status: established
    sources:
    - r3-chikugo-ayumi
  - text: 羽犬塚町ほかの合併で「筑後市」が発足することは1954年3月の時点で隣接する八女郡福島町側にも知られており、八女側が市名案「筑後福島市」を再検討する理由の一つになったと福岡共同公文書館は伝える
    kind: fact
    level: E2
    status: established
    sources:
    - r3-yame-kobunsyokan
  - text: 市章は1954年10月に公募によって制定され、「ちくご」の「ち」を図案化したものである
    kind: fact
    level: E2
    status: established
    sources:
    - r3-chikugo-gikai-yoran
  - text: 中心地の羽犬塚は薩摩街道の宿場町で、久留米藩の三宿の一つに数えられた
    kind: fact
    level: E4
    status: established
    sources:
    - r3-chikugo-localhistoria
  - text: 羽犬塚の地名は、豊臣秀吉の九州遠征の際に羽の生えた怪犬に出くわして退治し塚に葬ったという伝説、あるいは秀吉の愛犬が病死したため塚を立てて弔ったという伝説に由来すると、筑後市観光協会は伝える
    kind: legend
    level: E4
    status: contested
    sources:
    - r3-chikugo-kanko-hainuzuka
  - text: 筑後国府跡は筑後市内ではなく久留米市合川町にあり、国指定史跡となっている
    kind: fact
    level: E2
    status: established
    sources:
    - r3-kurume-kokufu
  column:
    title: 羽の生えた犬と、国名を名乗る市
    text: 中心地・羽犬塚の名は、羽の生えた犬の伝説で知られる。秀吉が怪犬を退治して葬った塚とも、速い愛犬を弔った塚ともいう。そんな小さな地名を押しのけて市名になったのは、旧国名の「筑後」だった。ところが古代の筑後国の国府は、隣の久留米市にある。国名を名乗る市、国府のあった市、羽犬の眠る町——「筑後の中心」は、時代ごとに少しずつ場所を変えてきた。
    sources:
    - r3-chikugo-kanko-hainuzuka
    - r3-kurume-kokufu
  relations:
  - pref/40
  unknowns:
  - 1954年の合併で中心地の名を採らず「筑後市」が選ばれた理由・経緯は、市の公式資料では確認できなかった
  - 羽犬塚の史料上の初見（天正14年の上井覚兼の日記に「灰塚」と見えるという紹介）や「駅馬塚」の転訛とする説は、専門資料での裏付けが取れなかった
  - 国名「筑後」の初出文献は確認できなかった
  updated: '2026-11-13'
- id: muni/40-筑紫野市
  code: '402176'
  names:
    ja: 筑紫野市
    reading: ちくしのし
    aliases:
    - 筑紫野町
    - 二日市町
  user_terms:
  - 筑紫野はなぜ筑紫野というの
  - 旧二日市町のあたり
  - 二日市温泉のまち
  - 万葉の里ちくしの
  naming_type: 旧国名・広域地名の採用
  formation: 合併新設
  prefecture: 福岡県
  homonyms: []
  summary: 昭和30年（1955年）3月1日、二日市町・山口村・筑紫村・山家村・御笠村の5町村が合併して筑紫野町が発足し、昭和47年（1972年）4月1日に市制施行して筑紫野市となった。「筑紫野」は構成町村のいずれの名でもない新町名で、市はその由来となる「筑紫」について、『古事記』の国生み神話に「筑紫島」とみえる古代九州の総称であることを説明する。中心地の二日市は長崎街道の宿場町で、二日市温泉で知られる。
  first_attestation:
    era: 昭和30年
    year_western: 1955
    document: 合併による筑紫野町の発足
    note: 町名「筑紫野」としての初出。もとの語「筑紫」は『古事記』上巻の国生み神話に「筑紫島」としてみえる古い名だが、「筑紫野」という地名の古代・中世の用例は確認できていない
  claims:
  - text: 筑紫野市の地方公共団体コードは402176である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  - text: 昭和30年（1955年）3月1日に二日市町・山口村が筑紫村・山家村・御笠村と合併して筑紫野町となり、昭和47年（1972年）4月1日に筑紫野町は市制を施行して筑紫野市となった
    kind: fact
    level: E2
    status: established
    sources:
    - upg-p11-chikushino-city-gaiyo
    - upg-p11-fukuoka-gappei
  - text: 市のパンフレットは、「筑紫野市の由来となる『筑紫（つくし）』は、『古事記』の国生み神話の中に『筑紫（筑紫島）、身ひとつにして面四つ（筑紫国、豊国、肥国、熊曾国）』とあり、古代九州の総称であることがうかがえる」と説明している
    kind: fact
    level: E2
    status: established
    sources:
    - r4-chikushino-pamphlet
  - text: 市域は福岡平野と筑後平野の接点に位置する交通の要衝で、周辺には大宰府の防衛施設である水城・大野城・基肄城が築かれたと市公式の歴史解説は伝える
    kind: fact
    level: E2
    status: established
    sources:
    - r4-chikushino-rekishi
  - text: 江戸時代には長崎街道の二日市宿や、筑前六宿の山家宿・原田宿が市域に置かれ、多くの人やモノが往来して筑紫野の原型が作られたと市公式の歴史解説は伝える
    kind: fact
    level: E2
    status: established
    sources:
    - r4-chikushino-rekishi
  - text: 市の木の椿は、『古事記』や『万葉集』の歌によく歌われている花として選ばれ、市は椿を「万葉の里・筑紫野」のシンボルとしている
    kind: fact
    level: E2
    status: established
    sources:
    - r4-chikushino-pamphlet
  column:
    title: 中心地の名を採らなかった合併
    text: 昭和30年（1955年）の合併の中心は、宿場町として栄えた二日市町だった。ところが新町の名は「二日市」ではなく、どの構成町村の名でもない「筑紫野」が選ばれた。筑紫は古代の九州そのものを指した大きな名である。二日市は今も市内の地名・駅名として残り、二日市温泉の名で親しまれるが、自治体の看板はより古く大きな地名に譲った。中心地の名を捨てて地域の古名を掲げた、平成の大合併以前の先行例である。
    sources:
    - r4-chikushino-wikipedia-futsukaichi
    - r4-chikushino-pamphlet
  relations:
  - pref/40
  unknowns:
  - 昭和30年（1955年）の合併時に「筑紫野」の名が選ばれた具体的な経緯（公募の有無、候補名、「万葉集にちなんだ」という説の典拠）は、公的・専門資料では確認できなかった
  - 中心地名「二日市」の由来（市（いち）の開かれた日にちなむという通説）について、専門資料による裏付けは未確認
  updated: '2026-11-13'
- id: muni/40-築上町
  code: '406473'
  names:
    ja: 築上町
    reading: ちくじょうまち
    aliases:
    - 椎田町
