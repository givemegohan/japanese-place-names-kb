prefecture_code: '28'
records:
- id: muni/28-たつの市
  code: '282294'
  names:
    ja: たつの市
    reading: たつのし
    aliases:
    - 龍野市
  user_terms:
  - たつの
  - 龍野
  - 赤とんぼの里
  - 揖保乃糸
  - 醤油のまち
  naming_type: 中心地名の継承
  formation: 合併新設
  prefecture: 兵庫県
  homonyms: []
  summary: たつの市は兵庫県南西部、揖保川流域の市である。2005年に龍野市・新宮町・揖保川町・御津町が合併して発足し、市名は公募と合併協議会の決定により、旧市名「龍野」の読み「たつの」を平仮名表記で継承した。選定理由には、童謡「赤とんぼ」の里としての全国的な知名度と、平仮名による温かい市のイメージが挙げられた。「龍野」の名そのものは、『播磨国風土記』の故事に現れる「立野」に起源が求められている。
  first_attestation:
    era: 奈良時代
    year_western: null
    document: 播磨国風土記
    note: 市公式の保存活用計画は、風土記が伝える故事の中の「立野」を「龍野」の地名の起源とする。「龍野」の漢字表記そのものの初出は別途確認していない。
  claims:
  - text: 2005年10月1日、龍野市・新宮町・揖保川町・御津町の1市3町が新設合併して「たつの市」が発足した。当初予定された3月の合併は、太子町の中途脱退に伴う事務調整のため10月にずれ込んだ
    kind: fact
    level: E2
    status: established
    sources:
    - x2-tatsuno-gappei
  - text: 市名は公募が行われ、新市名候補選定小委員会が公募作品から最終候補3作品を選定したうえで、合併協議会が満場一致で「たつの市」に決定した
    kind: fact
    level: E2
    status: established
    sources:
    - x2-tatsuno-gappei
  - text: 選定理由として、「『たつの』は、童謡の里として全国的に知名度も高く、ひらがなにすることで温かい市のイメージが生まれる」ことや、住民の一体感の醸成と新しい市としての飛躍への期待が挙げられた
    kind: fact
    level: E2
    status: established
    sources:
    - x2-tatsuno-gappei
  - text: 「童謡の里」は、童謡「赤とんぼ」の作詞者である三木露風の生誕地が旧龍野市であることに拠る
    kind: fact
    level: E2
    status: established
    sources:
    - x2-tatsuno-gappei
  - text: 旧龍野市は、1948年に龍野町と小宅村が合併した龍野町を母体に、1951年の1町4村の町村合併で成立した
    kind: fact
    level: E2
    status: established
    sources:
    - x2-tatsuno-dekigoto
  - text: 市の保存活用計画は『播磨国風土記』を引き、野見宿禰が出雲との往来の途中にこの地で病没し、出雲から来た人々が川石を手渡しで運び上げて墓を作るために野に立ち並んだという故事から、付近が「立野」と呼ばれ、これが「龍野」の地名の由来となっていると説明する
    kind: legend
    level: E2
    status: indeterminate
    sources:
    - x2-tatsuno-denken
  - text: 新市の事務所は旧龍野市役所（龍野市誉田町）に置かれ、本庁方式が採用された
    kind: fact
    level: E2
    status: established
    sources:
    - x2-tatsuno-gappei
  - text: 総務省の全国地方公共団体コードで、たつの市の団体コードは282294と定められている
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 「赤とんぼ」の里だから、平仮名になった
    text: 平成の大合併では、旧市名の漢字をそのまま新市名にする例が多かった。たつの市が選んだのは、読みはそのままに表記だけを平仮名にする道だった。決め手の一つが童謡「赤とんぼ」である。作詞者・三木露風の生誕地である旧龍野市は「童謡の里」として知られ、「たつの」という響き自体に全国区の知名度があった。合併協議会の選定理由は、平仮名にすることで「温かい市のイメージ」が生まれることにも触れている。由緒ある漢字「龍野」を捨てるのではなく、その音と物語を受け継ぎながら字面だけを柔らかくする。地名の継承と刷新を両立させた命名として、この事例は日本都市センターの合併事例集にも記録されている。
    sources:
    - x2-tatsuno-gappei
  relations:
  - pref/28
  unknowns:
  - 市名公募の応募総数と最終候補3作品の具体的な名称
  - 「龍野」の漢字表記の初出文書
  - 『播磨国風土記』の「立野」の故事と後世の「龍野」表記の結びつきを示す中世以降の用例
  updated: '2026-11-13'
- id: muni/28-三木市
  code: '282154'
  names:
    ja: 三木市
    reading: みきし
    aliases:
    - 三木町
  user_terms:
  - みき
  - 三木金物
  - 金物のまち
  - 三木合戦
  - 別所長治
  naming_type: 中心地名の継承
  formation: 合併新設
  prefecture: 兵庫県
  homonyms: []
  summary: 三木市は兵庫県南部、美嚢川流域にある金物の町である。市名「三木」は、戦国時代の三木合戦や三木城で知られるが、地名そのものはずっと古く、中世の三木庄、近世の三木町の庄名・町名を継承する。語源には、水の清い地を指す「美奈木」からの転訛説と、神功皇后への御酒奉納にちなむ伝承とがあり、決着していない。1954年に三木町・口吉川町・別所村・細川村の合併で発足した。
  first_attestation:
    era: 中世
    year_western: null
    document: 三木庄
    note: 『日本歴史地名大系』が市名の源泉として中世の三木庄を挙げる（レファレンス協同データベースの回答経由）。三木庄そのものの初出文書・年次は特定できていない。
  claims:
  - text: レファレンス協同データベースの回答によれば、『日本歴史地名大系』は「市名は中世の三木庄、近世の三木町の庄名・町名を継承する」と記しており、「三木」の地名は三木城や三木合戦より古く、中世の荘園名に遡る
    kind: fact
    level: E2
    status: established
    sources:
    - x2-miki-crd
  - text: 語源の一説では、水の流れの清いところを指す「美奈木（ミナギ）」という地名が「美嚢（ミノウ）」を経て「三木」に転訛したとされ、『播磨国風土記』を受けた『播磨鑑』や『三木市史』などがこの説を紹介する
    kind: fact
    level: E2
    status: contested
    sources:
    - x2-miki-crd
  - text: 大兄伊射報和気命（のちの履中天皇）が志染の地に寄った際に「美奈木」と命名したともいわれると、レファレンス回答は伝承として紹介する
    kind: legend
    level: E2
    status: indeterminate
    sources:
    - x2-miki-crd
  - text: 別の伝承では、神功皇后がこの地に立ち寄った際に酒壺（御酒＝ミキ）を奉ったところから「ミキ」と呼ばれるようになり、のちに「三木」の字が当てられたという
    kind: legend
    level: E2
    status: indeterminate
    sources:
    - x2-miki-crd
  - text: 15世紀末に別所氏によって三木城が築かれて以降、三木は城下町として町の基盤が形成された
    kind: fact
    level: E2
    status: established
    sources:
    - x2-miki-keikan
  - text: 天正6年（1578）3月から天正8年（1580）1月にかけての三木合戦で町は荒廃したが、羽柴秀吉の手により復興し、その後は金物問屋を核として「三木金物」が発展した
    kind: fact
    level: E2
    status: established
    sources:
    - x2-miki-keikan
    - x2-miki-shiseki
  - text: 昭和29年（1954）に美嚢郡三木町・口吉川町・別所村・細川村が合併して三木市が発足し、同年に志染村を編入、平成17年（2005）に吉川町を合併した
    kind: fact
    level: E2
    status: established
    sources:
    - x2-miki-keikan
  - text: 総務省の全国地方公共団体コードで、三木市の団体コードは282154と定められている
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 「三木合戦」より古い地名「三木」
    text: 三木といえば、羽柴秀吉が兵糧攻めで落とした三木城と別所長治の名がまず思い浮かぶ。しかし地名の歴史は合戦より何百年も古い。『日本歴史地名大系』は市名の由来を「中世の三木庄、近世の三木町の庄名・町名を継承する」と簡潔に記す。つまり秀吉も長治も、すでに「三木」と呼ばれていた土地に城を構えたのである。語源については、水の清い地を指した「美奈木」が「美嚢」を経て「三木」に転じたという説と、神功皇后に御酒を奉ったから「ミキ」になったという伝承が併存する。金物の町として発展した近世以降の知名度に比べ、地名そのものの生い立ちは静かに未解決のまま残されている。
    sources:
    - x2-miki-crd
    - x2-miki-keikan
  relations:
  - pref/28
  unknowns:
  - 三木庄の初出文書と年次
  - 「美奈木」転訛説と御酒奉納説のいずれが有力かを示す専門的な検討
  - 「美奈木」「美嚢」表記の初出
  updated: '2026-11-13'
- id: muni/28-三田市
  code: '282197'
  names:
    ja: 三田市
    reading: さんだし
    aliases:
    - 三田村
    - 三田町
  user_terms:
  - 三田の名前の由来
  - さんだ
  - 北摂三田ニュータウン
  - 三田牛の三田
  naming_type: 中心地名の継承
  formation: 合併新設
  prefecture: 兵庫県
  homonyms: []
  summary: 三田は武庫川流域の農村地帯の中心地名で、確認できる最古の用例は寛正7年（1466）の古文書に見える「三田村」である。「さんだ」の語源は「さん」と「た（田）」に分けられるものの「さん」の意味は解明されておらず、市の市史編さんでも定説はないとされる。江戸時代には三田藩九鬼氏の城下町として栄え、1958年に合併を経て三田市が誕生した。
  first_attestation:
    era: 室町時代
    year_western: 1466
    document: 清水寺文書（古文書）
    note: 三田市史だよりが紹介する寛正7年（1466）の古文書に見える「三田村」が、現在確認できる最古の用例
  claims:
  - text: 地方公共団体コードは282197である
    kind: fact
    level: E2
    status: established
    sources:
    - d-cap-jlis-hyogo
  - text: 三田市史だよりによれば、現在確認できる最古の用例は寛正7年（1466）の古文書（清水寺文書）に見える「三田村」で、「三田」の用例は意外に時代が下る
    kind: fact
    level: E2
    status: established
    sources:
    - p4-sanda-shishi-dayori
  - text: 「さんだ」は「さん」と「だ（田）」に分解でき後半は田を意味すると考えられるが、「さん」の意味は解明されておらず、数字の「三」と読む理解についても音読みと訓読みの組み合わせになる異例さを市史編さん担当が指摘している
    kind: fact
    level: E2
    status: indeterminate
    sources:
    - p4-sanda-shishi-dayori
  - text: 地名辞典類では「みた」と読む三田が古い時代から見えるのに対し、「さんだ」の地名はおおよそ室町時代以降の記録に残ると三田市史だよりは述べる
    kind: fact
    level: E2
    status: established
    sources:
    - p4-sanda-shishi-dayori
  - text: 江戸時代の三田は三田藩九鬼氏3万6千石の城下町であり、周辺の豊かな農村地域から供給される米や材木の集散地として繁栄したと三田市は紹介する
    kind: fact
    level: E2
    status: established
    sources:
    - p4-sanda-city-gaiyo
  - text: 明治初めには一時「三田県」が置かれ、その後兵庫県に編入された
    kind: fact
    level: E2
    status: established
    sources:
    - p4-sanda-city-gaiyo
  - text: 1956年から1957年にかけての町村合併を経て、1958年（昭和33年）7月1日に三田市が誕生した
    kind: fact
    level: E2
    status: established
    sources:
    - p4-sanda-city-kids
  - text: 1969年（昭和44年）に北摂ニュータウン（現在の神戸三田国際公園都市）の計画が発表され、その後の開発で大阪・神戸の通勤圏の住宅都市として市街地が拡大した
    kind: fact
    level: E2
    status: established
    sources:
    - p4-sanda-city-soukei
  column:
    title: 「三」の意味が分からない
    text: 三田の「さん」は何を意味するのか。市の市史編さんが地名辞典類を調べたところ、「みた」と読む地名は「御」や「美」が田を修飾する形に分解できるのに対して、「さんだ」の「さん」は謎のままだったという。数字の「三」だとすれば、「三ノ宮」のように「の」が入るのが普通で、音読みの「サン」と訓読みの「タ」をつなぐ読み方も異例だ。左右対称で親しみやすい八画の地名だが、その意味を探るのは意外と難しい、と市史だよりは結んでいる。
    sources:
    - p4-sanda-shishi-dayori
  relations:
  - pref/28
  unknowns:
  - 「さん」の語源の定説は確認できなかった
  - 南北朝時代の記録に「三田城」の名が見えると市の概要は述べるが、その史料名までは特定できなかった
  updated: '2026-11-13'
- id: muni/28-上郡町
  code: '284815'
  names:
    ja: 上郡町
    reading: かみごおりちょう
    aliases:
    - 上郡村
    - 上河原村
  user_terms:
  - 上郡という名前の由来
  - かみごおりの読み方
  - 赤穂郡の町
  naming_type: 中心地名の継承
  formation: 合併新設
  prefecture: 兵庫県
  homonyms: []
  summary: 江戸時代から続く上郡村の名を受け継ぐ町。『日本歴史地名大系』によれば慶長国絵図に「上かうり村」と見え、当初「上河原村」といったという伝承がある。1913年に町制を施行し、1955年の合併で現在の上郡町となった。
  first_attestation:
    era: 慶長期
    year_western: null
    document: 『慶長国絵図』
    note: 『日本歴史地名大系』が「上かうり村」と見えることを紹介する。慶長国絵図の成立は1596〜1615年頃と幅があるため year_western は null とする
  claims:
  - text: 『日本歴史地名大系』は、慶長年間の国絵図に「上かうり村」と見えることを記す
    kind: fact
    level: E3
    status: established
    sources:
    - x11-kamigori-kotobank
  - text: 『赤穂郡誌』の伝承として、竹万の住民が移住して開発し、当初「上河原村」といったが、後に上郡村と改称したと『日本歴史地名大系』が紹介する
    kind: legend
    level: E3
    status: established
    sources:
    - x11-kamigori-kotobank
  - text: 江戸時代に上郡村が存在し、1889年（明治22年）に上郡村・井上村・大持村・山野里村・竹万村の区域で新しい上郡村が発足した
    kind: fact
    level: E2
    status: established
    sources:
    - x11-kamigori-plan
  - text: 古代、この地には山陽道が通り高田駅家・野磨駅家が置かれ、赤穂郡の政治・文化の中心地だった
    kind: fact
    level: E2
    status: established
    sources:
    - x11-kamigori-plan
  - text: 1913年（大正2年）4月1日に上郡村が町制を施行して（旧）上郡町となり、1955年（昭和30年）3月25日に高田村・鞍居村・船坂村・赤松村の一部と合併して新しい上郡町が誕生した
    kind: fact
    level: E2
    status: established
    sources:
    - x11-kamigori-nenpyo
  - text: 「上郡」の名は、千種川の上流部・赤穂郡の上部に位置することにちなむ位置地名と考えられるが、その命名を明示する資料は確認できなかった
    kind: fact
    level: H
    status: inferred
    sources:
    - x11-kamigori-kotobank
  - text: 地方公共団体コードは284815である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 「上河原村」だった頃
    text: 上郡村は、もとは「上河原村」と呼ばれていたという伝承があります。『赤穂郡誌』が伝え、『日本歴史地名大系』が紹介する話では、竹万の住民が移り住んで開いた土地で、川原の上の方という地形そのままの名だったものが、やがて「上郡村」に改まったとされます。慶長国絵図に「上かうり村」とあるのが文献上の姿で、伝承の「川原」の名は、郡の中心地らしい今の名より前の、開拓地らしい素朴な名だったことになります。
    sources:
    - x11-kamigori-kotobank
  relations:
  - pref/28
  unknowns:
  - 「上郡」の命名理由を明示する資料は未確認
  - 「上河原村」から「上郡村」への改称の時期は未確認
  updated: '2026-11-13'
- id: muni/28-丹波市
  code: '282235'
  names:
    ja: 丹波市
    reading: たんばし
    aliases:
    - たには
    - 丹州
  user_terms:
  - たんば
  - 丹波の黒豆の産地
  - 兵庫丹波
  naming_type: 旧国名・広域地名の採用
  formation: 合併新設
  prefecture: 兵庫県
  homonyms: []
  summary: 2004年に氷上郡の6町が合併して誕生した市。市名は市域が旧丹波国の一部であったことに由来し、市名公募で最多だった「氷上」ではなく2位の「丹波」が協議会で選ばれた。「丹波」の古い読みは「たには」で、語源は「田庭（平らかに広い地）」説が有力とされる。一つの市が旧国名を名乗った影響は大きく、後に篠山市が「丹波篠山市」へ改称する動きにもつながった。
  first_attestation:
    era: 飛鳥時代
    year_western: null
    document: 藤原宮跡出土木簡ほか
    note: 藤原宮跡（694〜710年に都が置かれた）出土の木簡では、例外を除いて「丹波」の表記が用いられ、大宝令の制定・施行とともに表記が「丹波」に統一されたと考えられると、『世界大百科事典』「丹波国」項が紹介する。読みは古く「たには」で、『和名類聚抄』は「太迩波」と訓むと『日本歴史地名大系』「丹波国」項が紹介する
  claims:
  - text: 丹波市は平成16年（2004）11月1日に、氷上郡の柏原町・氷上町・青垣町・春日町・山南町・市島町の6町が合併して誕生し、氷上郡は消滅した
    kind: fact
    level: E2
    status: established
    sources:
    - upg-u1-hyogo-ichiran
  - text: 市名「丹波」は、市域がかつて丹波国の一部であったことに由来する
    kind: fact
    level: E5
    status: established
    sources:
    - x3-wiki-tamba
  - text: 新市名の公募では「氷上」が最多で「丹波」は2位、「ひかみ」が3位だったが、氷上郡合併協議会は最終候補5点の中から「丹波市」を選定した
    kind: fact
    level: E4
    status: established
    sources:
    - x3-uub-tamba
  - text: この選定に対して篠山市（当時）など周辺自治体から見直しを求める声が上がったが、協議会は旧国名を新市名に採用している事例はほかにもあるなどとして見直さなかった
    kind: fact
    level: E4
    status: established
    sources:
    - upg-u1-senkyo-tamba
  - text: 丹波篠山市は、丹波市の誕生後に「丹波篠山」の特産品が丹波市のものと誤解される事態が起きたことなどを背景に、2019年5月1日に篠山市から丹波篠山市へ改称した
    kind: fact
    level: E2
    status: established
    sources:
    - p4-tambasasayama-city-plan
  - text: 『和名類聚抄』は「丹波」を「太迩波（たには）」と訓み、「丹波」は古く「たには」と呼ばれたと、『日本歴史地名大系』「丹波国」項が紹介する
    kind: fact
    level: E3
    status: established
    sources:
    - upg-u1-kotobank-tanbakoku
  - text: 「丹波」の語源には、『倭訓栞』の「谷端」説と『諸国名義考』の「田庭（平らかに広い地）」説があり、『日本歴史地名大系』は地理的景観からみて後者をとるべきかとする
    kind: fact
    level: E3
    status: contested
    sources:
    - upg-u1-kotobank-tanbakoku
  - text: 藤原宮跡出土の木簡では例外を除いて「丹波」の表記が用いられており、大宝令の制定・施行とともに「丹波」の表記に統一されたと考えられると、『世界大百科事典』「丹波国」項が紹介する
    kind: fact
    level: E3
    status: established
    sources:
    - upg-u1-kotobank-tanbakoku
  - text: 総務省の全国地方公共団体コードで、丹波市の団体コードは282235と定められている
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 公募1位を退けて「国名」を名乗った市と、隣の市の15年越しの応答
    text: 丹波市の市名公募でいちばん多かったのは、郡名だった「氷上」でした。ところが合併協議会が選んだのは2位の「丹波」。旧国名を一つの市がそのまま名乗る形に、旧丹波国を共にする篠山市など周辺自治体は反発しましたが、名前は変わりませんでした。その余波は15年後に現れます。篠山市は、「丹波篠山」の黒豆などの特産品が丹波市のものと間違われる事態が起きたとして、2019年に「丹波篠山市」へと改称しました。公募1位にならなかった国名が、隣の市の改称まで引き起こした——市名の力をよく示す出来事です。
    sources:
    - x3-uub-tamba
    - x3-wiki-tamba
    - p4-tambasasayama-city-plan
  relations:
  - pref/28
  - muni/28-丹波篠山市
  - muni/26-福知山市
  unknowns:
  - 合併協議会が「丹波」を選んだ理由の公式文言は、協議会の公式記録そのものでは未確認で、Wikipediaの記述によった
  - 「丹波」の語源については『日本歴史地名大系』と『世界大百科事典』の記述を確認したが、『角川日本地名大辞典26』など他の専門辞典の原典確認は未了である
  updated: '2026-11-13'
- id: muni/28-丹波篠山市
  code: '282219'
  names:
    ja: 丹波篠山市
    reading: たんばささやまし
    aliases:
    - 篠山市
    - 篠山町
    - 笹山
  user_terms:
  - 丹波篠山の名前の由来
  - たんばささやま
  - 篠山市から改名した市
  - 丹波篠山黒豆の産地
  naming_type: 自然地名から
  formation: 改称
  prefecture: 兵庫県
  homonyms: []
  summary: 現在の市名は、合併によらず市名だけを変更した珍しい改称の結果である。もとの「篠山」は篠山盆地の小山（古くは佐佐山・笹山とも記された）の名に由来し、1609年に篠山城が築かれて城下町となった。1999年に多紀郡4町の合併で篠山市が誕生したが、2004年に隣接して丹波市が誕生して以降「丹波篠山」ブランドの混同が問題となり、2018年の住民投票を経て2019年5月1日に「丹波篠山市」へ改称した。
  first_attestation:
    era: 室町時代
    year_western: 1430
    document: 目代蔵人太夫感状
    note: 丹波篠山市の地名考によれば、「篠山」の名が史料に初めて現れるのは永享2年（1430）の感状で、永享元年（1429）の「丹州篠山合戦」が記される
  claims:
  - text: 地方公共団体コードは282219である
    kind: fact
    level: E2
    status: established
    sources:
    - d-cap-jlis-hyogo
  - text: 丹波篠山市の地名考によれば、「篠山」の由来は丹波国日置荘黒岡村にあった小山を聖なる山と称したことによるとされ、古くは「佐佐山」「笹山」とも記された
    kind: fact
    level: E4
    status: established
    sources:
    - p4-tambasasayama-chimeiko
  - text: 「篠山」の名が史料に初めて現れるのは永享2年（1430）の「目代蔵人太夫感状」で、永享元年（1429）の「丹州篠山合戦」が記されている
    kind: fact
    level: E4
    status: established
    sources:
    - p4-tambasasayama-chimeiko
  - text: 慶長14年（1609年）、徳川家康の命により松平康重が笹山（篠山）に新城を築き、いわゆる天下普請によって篠山城とその城下町が形成された
    kind: fact
    level: E2
    status: established
    sources:
    - p4-tambasasayama-joato
    - p4-kotobank-sasayamajo
  - text: 1999年（平成11年）4月、多紀郡の篠山町・西紀町・丹南町・今田町が合併して篠山市が誕生した
    kind: fact
    level: E2
    status: established
    sources:
    - p4-tambasasayama-city-plan
  - text: 2004年（平成16年）に隣接して丹波市が誕生すると、「丹波の黒豆」など「丹波篠山」の特産品ブランドが丹波市のものと誤解される問題が大きくなったと、当時の篠山市長はインタビューで説明している
    kind: fact
    level: E4
    status: established
    sources:
    - p4-nikkei-sasayama
  - text: 2018年（平成30年）11月に市名変更の是非を問う住民投票と市長の出直し選挙が同時に行われ、住民投票では賛成票が過半数を占めた
    kind: fact
    level: E4
    status: established
    sources:
    - p4-nikkei-sasayama
  - text: 令和元年（2019年）5月1日、合併を伴わない改称として、市名が「篠山市」から「丹波篠山市」に変更された
    kind: fact
    level: E2
    status: established
    sources:
    - p4-tambasasayama-city-plan
  column:
    title: 改元と同じ日に生まれた市名
    text: 「丹波篠山市」への改称日は、平成から令和への改元の日と同じ2019年5月1日だった。きっかけは隣にできた丹波市である。丹波篠山黒大豆や丹波栗で知られる「丹波篠山」の産地表示がどちらを指すのか曖昧になったとして、県から表示を差し控えるよう指導が来たことまで市長は明かしている。2017年に農協・商工会・観光協会が改称を要望し、賛否を問う住民投票では市民の意見が二つに割れたが、賛成が過半数を占めた。合併のためではなく「もとの名前を取り戻す」ための改称である。
    sources:
    - p4-nikkei-sasayama
  relations:
  - pref/28
  unknowns:
  - 「篠山（笹山）」の語源について、角川日本地名大辞典など専門辞典の本文による裏付けは未了
  - 住民投票の正確な得票数は、市の公式資料では確認できなかった
  updated: '2026-11-13'
- id: muni/28-伊丹市
  code: '282073'
  names:
    ja: 伊丹市
    reading: いたみし
    aliases:
    - 伊多美
  user_terms:
  - 伊丹の名前の由来
  - 伊丹空港の伊丹はどこの伊丹
  - 伊丹市はいつできたの
  - 伊丹酒と丹醸
  naming_type: 中心地名の継承
  formation: 合併新設
  prefecture: 兵庫県
  homonyms: []
  summary: 伊丹の地名は治承4年（1180）の『山槐記』に「伊多美」と見えるのが古い用例で、「伊丹」の表記は嘉元元年（1303）の文書に現れる。語源には諸説あるが定説はない。近世には近衛家領の伊丹郷町として酒造が栄え、伊丹の酒は「丹醸」と呼ばれた。1940年に伊丹町と稲野村が合併して市制を施行した。
  first_attestation:
    era: 平安時代
    year_western: 1180
    document: 山槐記
    note: 治承4年（1180）11月23日の『山槐記』の中山忠親の記録に「伊多美武者所某」と見えるのが古い用例で、「伊丹」の字が現れるのは嘉元元年（1303）の多田神社文書
  claims:
  - text: 地名の初見は、治承4年（1180）11月23日の『山槐記』（中山忠親の日記）に「伊多美武者所某」と見える用例である
    kind: fact
    level: E1
    status: established
    sources:
    - upg-itami-sankaiki
    - upg-itami-apedia
  - text: 「伊丹」の表記は、嘉元元年（1303）の多田神社文書に現れる
    kind: fact
    level: E4
    status: established
    sources:
    - l4-itami-localhistoria
  - text: 「伊丹」の語源については諸説があるが、定説は存在しない
    kind: fact
    level: E5
    status: indeterminate
    sources:
    - l4-itami-wikipedia
  - text: 歴史地名の研究によれば、地名の方向性から、古くは古代・中世にその北部が摂関家の摂津国荘園内郷として成立し、南北朝時代の頃に郷名・郷町として確立したことがうかがえる
    kind: fact
    level: E4
    status: established
    sources:
    - l4-itami-localhistoria
  - text: 14世紀初めごろに伊丹氏が現れて伊丹城を本拠とし、天正2年（1574年）に荒木村重が伊丹城を有岡城と改名したと伊丹市は紹介する
    kind: fact
    level: E2
    status: established
    sources:
    - l4-itami-city-page
    - upg-itami-apedia
  - text: 1315年（正和4年）には、伊丹左衛門三郎親盛が六波羅の命を受けて幕府の使者となったことが史料に見える
    kind: fact
    level: E2
    status: established
    sources:
    - upg-itami-apedia
  - text: 伊丹氏は、1574年（天正2年）に荒木村重に攻められて伊丹城が落城し、滅亡したと伝えられる
    kind: fact
    level: E2
    status: established
    sources:
    - upg-itami-apedia
  - text: 近世の伊丹は近衛家領の郷町で酒造業が栄え、作られた日本酒は「伊丹酒」「丹醸」として江戸で愛飲されたと伊丹市は紹介する
    kind: fact
    level: E2
    status: established
    sources:
    - l4-itami-city-rekishi
  - text: 1940年（昭和15年）に伊丹町と稲野村が合併して伊丹市が誕生し、全国で174番目の市となった
    kind: fact
    level: E2
    status: established
    sources:
    - l4-itami-city-chushin
  - text: 大阪国際空港は伊丹市・豊中市・池田市にまたがり、空港面積の約7割が伊丹市にある。「伊丹空港」の通称で呼ばれ、運営会社の関西エアポートは英語名を「Osaka Itami Airport」として公式に用いている
    kind: fact
    level: E2
    status: established
    sources:
    - upg-itami2-kotobank
    - upg-itami2-kansai-airports
  - text: 市内最大のため池である昆陽池は、天平年間（729〜749年）ごろに僧行基が築造したと伝えられる
    kind: legend
    level: E3
    status: indeterminate
    sources:
    - upg-itami2-kotobank
  column:
    title: 「丹醸」と呼ばれた伊丹の酒
    text: 江戸時代、伊丹は近衛家の領地で、酒づくりの町として名を馳せた。伊丹の酒は「伊丹酒」「丹醸（たんじょう）」と称されて江戸へ下り、江戸の人々に愛飲された。酒の都としての繁栄は俳諧文化も育み、上島鬼貫らを輩出した伊丹の文芸の土壌となった。いま「伊丹」の名を最も広く伝えるのは空港の通称だが、もとの伊丹は酒と俳諧の町の名である。
    sources:
    - l4-itami-city-rekishi
    - l4-itami-city-page
  relations:
  - pref/28
  unknowns:
  - 「伊丹」の語源は諸説あるが定説はなく、諸説の内容自体も専門文献による確認が未了
  updated: '2026-11-13'
- id: muni/28-佐用町
  code: '285013'
  names:
    ja: 佐用町
    reading: さようちょう
    aliases:
    - さよちょう
  user_terms:
  - 佐用は「さよう」と読む
  - さよちょうとの違い
  - 佐用都比売の町
  naming_type: 中心地名の継承
  formation: 合併新設
  prefecture: 兵庫県
  homonyms: []
  summary: 『播磨国風土記』の佐用都比売の伝承に結びつく古い郡名を受け継ぐ町。読みはもともと「さよ」で、1955年の合併で新・佐用町が「さようちょう」と称してから「さよう」が広まった。現在の町は2005年に4町の新設合併で発足した。
  first_attestation:
    era: 奈良時代
    year_western: null
    document: 『播磨国風土記』
    note: 佐用都比売の伝承と「五月夜郡」の名が見える。郡名としての「佐用」の確実な初出は未確認のため year_western は null とする
  claims:
  - text: 『播磨国風土記』の伝承では、佐用都比売（玉津日女命）が兄の伊和大神と国の占有を争い、鹿の腹を裂いてその血に種を蒔いて一夜で稲の苗を育て、五月夜（さつきよ）に植えたところ、兄神が「五月夜に植えたな」と言って去ったため、その地を「五月夜郡（さつきよのこおり）」と名付け、女神も佐用都比売と名を変えたとされる。二次資料が風土記の記載として紹介するもの
    kind: legend
    level: E2
    status: established
    sources:
    - x11-sayo-wiki
  - text: 町内には、佐用都比売を祀る式内社・佐用都比売神社が鎮座する
    kind: fact
    level: E4
    status: established
    sources:
    - upg-u10-sayo-harima-united
  - text: 「佐用」の読みはもともと「さよ」だったが、1955年（昭和30年）3月1日の合併で新しい佐用町が「さようちょう」と称したことから、郡の読みも「さようぐん」と読まれることが多くなった
    kind: fact
    level: E5
    status: established
    sources:
    - x11-sayogun-wiki
  - text: 佐用郡は1896年（明治29年）に岡山県（美作国）吉野郡の一部を編入しており、郡域は播磨国と美作国にまたがった時期がある
    kind: fact
    level: E2
    status: established
    sources:
    - upg-u10-sayo-okayama-opac
    - upg-u10-sayo-kotobank-machi
  - text: 現在の佐用町は2005年（平成17年）10月1日に佐用町・上月町・南光町・三日月町の4町が新設合併して発足した
    kind: fact
    level: E3
    status: established
    sources:
    - upg-u10-sayo-kotobank-machi
  - text: 地方公共団体コードは285013である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 「さよ」が「さよう」になった町
    text: 佐用町は「さようちょう」と読みますが、古い読みは「さよ」でした。『播磨国風土記』の女神・佐用都比売の名に連なる古い呼び名が、1955年の合併で新しい佐用町が「さよう」を名乗ったことを境に、郡の読みまで含めて「さよう」に寄っていったのです。地名の読みは、合併のような行政の節目で静かに変わることがある、という好例です。
    sources:
    - x11-sayogun-wiki
    - x11-sayo-wiki
  relations:
  - pref/28
  unknowns:
  - 郡名「佐用」の確実な初出は未確認（『播磨国風土記』では「五月夜郡」とされ、女神の名として「佐用」が現れる）
  - 1955年の合併で読みを「さよう」とした経緯の公式記録は未確認
  updated: '2026-11-13'
- id: muni/28-加古川市
  code: '282103'
  names:
    ja: 加古川市
    reading: かこがわし
    aliases:
    - 賀古
  user_terms:
  - 加古川の名前の由来
  - 賀古郡って何
  - 加古川市はいつできたの
  - 川の名前が市の名前になった例
  naming_type: 自然地名から
  naming_note: 河川名「加古川」を市名とした
  formation: 合併新設
  prefecture: 兵庫県
  homonyms: []
  summary: 加古川は、流域の古代の郡名「賀古（かこ）」に由来する市名で、河川「加古川」の名がそのまま市名になった。「賀古」は『播磨国風土記』にすでに見え、風土記は郡名の由来譚を伝える。1950年6月15日、加古川町・神野村・野口村・平岡村・尾上村が合併して加古川市が設置された。
  first_attestation:
    era: 奈良時代
    year_western: 713
    document: 播磨国風土記
    note: 和銅6年（713年）の編纂開始とされる『播磨国風土記』の賀古郡の条に「賀古」の名が見え、市域は古代の賀古郡にあたる
  claims:
  - text: 兵庫県立歴史博物館によれば、『播磨国風土記』の賀古郡の条には郡名の由来譚が記され、現在の加古川市域はこの賀古郡にあたる（地方公共団体コードは282103）
    kind: fact
    level: E2
    status: established
    sources:
    - l4-kakogawa-rekihaku
    - b-cap-chiba-soumu-code
  - text: 『播磨国風土記』賀古郡の条は、景行天皇が日岡に立ったとき「この丘は鹿児（かこ）の姿のようだ」と言ったことが賀古の名の由来であると伝える（風土記の現代語訳に基づく）
    kind: legend
    level: E2
    status: established
    sources:
    - l4-kakogawa-harima-column
  - text: 『播磨国風土記』には、賀古郡のほか賀古駅・賀古松原・印南川などの地名も賀古郡一帯にまつわって現れると兵庫県立歴史博物館は紹介する
    kind: fact
    level: E2
    status: established
    sources:
    - l4-kakogawa-rekihaku
  - text: 加古川市の市名は、市域を流れる一級河川「加古川」に由来し、市の章も加古川をモチーフとしていると加古川市議会の議会概要は述べる
    kind: fact
    level: E2
    status: established
    sources:
    - l4-kakogawa-city-gikai
  - text: 兵庫県告示第340号（昭和25年6月12日）により、1950年（昭和25年）6月15日から加古郡加古川町・神野村・野口村・平岡村・尾上村を廃止し、その区域をもって加古川市を設置することが告示された
    kind: fact
    level: E1
    status: established
    sources:
    - l4-kakogawa-city-reiki
  - text: 江戸時代には加古川宿が置かれて西国街道の宿場町として発展した
    kind: fact
    level: E2
    status: established
    sources:
    - upg-u11-kakogawa-shoubo
  column:
    title: 市章の文字遊び――「括弧川」と「囲い川」
    text: 加古川市の議会概要は、市章に関する面白い屋号・屋内の名前を紹介している。その名も「（ ）川（括弧川）」と「川を囲う（囲川）」。いずれも「かこがわ」と読ませる文字遊びで、どちらも河川加古川がモチーフだ。古代の郡名「賀古」から川の名が生まれ、その川の名が市の名と市章のモチーフになった街ならではの、名前にまつわる遊び心である。
    sources:
    - l4-kakogawa-city-gikai
  relations:
  - pref/28
  unknowns:
  - 古代の郡名「賀古」から河川名「加古川」へ移る過程の一次確認は未了
  - 市名選定の経緯（当時検討された合併構想を含む）は加古川市史での確認が今後の課題
  updated: '2026-11-13'
- id: muni/28-加東市
  code: '282286'
  names:
    ja: 加東市
    reading: かとうし
    aliases:
    - 賀東郡
    - 賀茂郡
  user_terms:
  - かとう
  - 北播磨の市
  - 社町があったところ
  naming_type: 旧行政区画名の継承
  formation: 合併新設
  prefecture: 兵庫県
  homonyms: []
  summary: 2006年に加東郡の社町・滝野町・東条町の3町が合併して誕生した市で、市名は郡名「加東」の継承である。「加東」の古層は古代の賀茂郡にあり、平安時代後期に賀茂郡が東西に分かれて賀茂東（賀東）が加東郡になったと推定されている。郡名をそのまま市名に継いだことで、加東郡は消滅した。
  first_attestation:
    era: 平安時代
    year_western: 1192
    document: 官宣旨案（浄土寺文書）
    note: 建久3年（1192）の官宣旨案に「賀東郡内大部庄」とみえるのが、「賀東（＝加東）」の古い用例として『日本歴史地名大系』が紹介するもの。表記は「賀東」で、古代にはこの一帯は賀茂郡に属した
  claims:
  - text: 加東市は平成18年（2006）3月20日に、加東郡の社町・滝野町・東条町の3町が合併して誕生し、加東郡は消滅した
    kind: fact
    level: E2
    status: established
    sources:
    - upg-u1-hyogo-ichiran
  - text: 新市名は、公募の上位10点に入っていた「加東」など最終候補4点（加東・かとう・北播磨・東播磨）の中から「加東市」に決まった
    kind: fact
    level: E4
    status: established
    sources:
    - x3-uub-katou
  - text: 合併に先立って西脇市から合併の申入れがあったが、3町はこれを断り、加東郡3町での合併を選んだ
    kind: fact
    level: E4
    status: established
    sources:
    - x3-uub-katou
  - text: 『日本歴史地名大系』は、古代の加東郡域は賀茂郡の一部で、平安時代後期に賀茂郡が賀茂東と賀茂西に分かれ、そこから加東郡と加西郡が成立したと推定する
    kind: fact
    level: E3
    status: contested
    sources:
    - x3-kotobank-katogun
  - text: 同大系は、建久3年（1192）の官宣旨案（浄土寺文書）に「賀東郡内大部庄」とみえると紹介し、中世には「加東」は「賀東」と書かれた
    kind: fact
    level: E2
    status: established
    sources:
    - x3-kotobank-katogun
  - text: 同大系は、『和名類聚抄』に載る賀茂郡の九郷のうち、穂積・川内・住吉・川合・大神の五郷が後の加東郡側に相当すると考えられると紹介する
    kind: fact
    level: E2
    status: established
    sources:
    - x3-kotobank-katogun
  - text: 加東郡の郡役所は社村（のちの社町）に置かれ、合併後の加東市役所も旧社町に置かれている
    kind: fact
    level: E5
    status: established
    sources:
    - x3-wiki-katogun
    - x3-uub-katou
  - text: 総務省の全国地方公共団体コードで、加東市の団体コードは282286と定められている
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 賀茂郡が割れて、加東と加西が生まれた
    text: 加東市の「加東」と、隣の加西市の「加西」は、もとは一つの郡から生まれた対の名前です。古代、この一帯は賀茂郡でした。それが平安時代の後期に東と西に分かれ、賀茂東・賀茂西となり、やがて「賀」の字が「加」に置き換わって加東郡・加西郡になったと専門辞典は推定します。2005〜06年の合併では東西両方がそれぞれ郡名をそのまま市名に継ぎ（加西市は1967年に先行）、「加東」「加西」の対は市の名前として今も並んで立っています。ちなみに加東市の新市名公募には、古層の名「加茂（かも）」も候補に入っていました。
    sources:
    - x3-kotobank-katogun
    - x3-uub-katou
  relations:
  - pref/28
  - muni/28-加西市
  - muni/28-西脇市
  unknowns:
  - 「加東は加古川の東の意」という説明は、参照した専門辞典では確認できず、賀茂郡の東西分割によるという推定が専門資料の説である
  - 新市名選定の合併協議会公式記録は未確認で、候補の経緯は自治体沿革データベースの紹介によった
  updated: '2026-11-13'
- id: muni/28-加西市
  code: '282201'
  names:
    ja: 加西市
    reading: かさいし
    aliases:
    - 加西町
    - 賀西
  user_terms:
  - 加西の名前の由来
  - かさい
  - 加西郡だった市
  - 北条の加西
  naming_type: 旧行政区画名の継承
  formation: 合併新設
  prefecture: 兵庫県
  homonyms: []
  summary: 加西市の名は郡名「加西郡」による。加西郡は古代の賀茂郡が平安時代後期に東西に分かれて成立した郡で、「賀西」とも記された。中心地の北条は近世以来の町場で、1955年に北条町・泉町・加西町の3町がそろい、1967年にこの3町が合併して加西市が誕生した。市制の成立と同時に加西郡は消滅した。
  first_attestation:
    era: 平安時代
    year_western: 1059
    document: 播磨国東大寺領畠注進状（東大寺文書）
    note: 日本歴史地名大系によれば、康平2年（1059）の同文書に「（賀）西郡阿居郷桑原田」と見えるのが加西郡の古い用例
  claims:
  - text: 地方公共団体コードは282201である
    kind: fact
    level: E2
    status: established
    sources:
    - d-cap-jlis-hyogo
  - text: 日本歴史地名大系によれば、加西郡は古代の賀茂郡の一部で、平安時代後期に同郡が東西に分かれて加東郡・加西郡が成立したと考えられる
    kind: fact
    level: E3
    status: established
    sources:
    - p4-kotobank-kasai-gun
  - text: 康平2年（1059年）の播磨国東大寺領畠注進状には「（賀）西郡」と見え、近世の慶長国絵図では「賀西郡」とも記された
    kind: fact
    level: E3
    status: established
    sources:
    - p4-kotobank-kasai-gun
  - text: 日本大百科全書によれば、加西市の市名は郡名による
    kind: fact
    level: E3
    status: established
    sources:
    - p4-kotobank-kasai
  - text: 1955年（昭和30年）に、北条町（北条町・富田村・賀茂村・下里村の合併）、泉町（多加野村・西在田村・在田村の合併）、加西町（九会村・富合村の合併）が相次いで成立した
    kind: fact
    level: E2
    status: established
    sources:
    - p4-kasai-city-rekishi
  - text: 1967年（昭和42年）4月1日、北条町・泉町・加西町の3町が合併して加西市が誕生し、県内で21番目の市制施行となった
    kind: fact
    level: E2
    status: established
    sources:
    - p4-kasai-city-rekishi
  - text: 加西市の成立により、加西郡は消滅した
    kind: fact
    level: E3
    status: established
    sources:
    - p4-kotobank-kasai
  column:
    title: 郡の東西で生まれた「加東」と「加西」
    text: 加西の「西」は方角である。もとの賀茂郡が平安時代に東西へ分かれ、東は加東郡、西は賀西（加西）郡になった。「賀」の字が「加」に置き換わって定着し、やがて郡名がそのまま市の名になった。1967年の市制で加西郡そのものは消滅したが、郡の名前は市名として生き続けている。東隣には2006年に生まれた加東市があり、平安時代の分郡の記憶が現代の地図の上に今も並んで残っている。
    sources:
    - p4-kotobank-kasai-gun
    - p4-kotobank-kasai
  relations:
  - pref/28
  unknowns:
  - 賀茂郡そのものの語源（賀茂氏や鴨神との関係など）については、専門辞典の本文での確認が未了
  updated: '2026-11-13'
- id: muni/28-南あわじ市
  code: '282243'
  names:
    ja: 南あわじ市
    reading: みなみあわじし
    aliases:
    - 南淡町
    - 西淡町
  user_terms:
  - 南あわじの名前の由来
  - みなみあわじ
  - 淡路島の南の市
  - 玉ねぎの南あわじ
  naming_type: 合成地名
  formation: 合併新設
  prefecture: 兵庫県
  homonyms: []
  summary: 南あわじ市は2005年、三原郡の4町（緑町・西淡町・三原町・南淡町）が合併して誕生した。市名は淡路島の南部に位置することを示す「南」と島名「あわじ」の合成で、合併協議会で決定された。合併前の旧町にも西淡町・南淡町という方角地名があり、「淡」に方角を付ける命名はこの地域に以前からあった。
  first_attestation:
    era: 平成
    year_western: 2005
    document: 緑町・西淡町・三原町・南淡町合併協議会の決定
    note: 市名そのものの初出は2005年1月11日の合併による市制施行時。協議の経過は南あわじ市公式サイト「合併までのあゆみ」に記録される
  claims:
  - text: 地方公共団体コードは282243である
    kind: fact
    level: E2
    status: established
    sources:
    - d-cap-jlis-hyogo
  - text: 2005年（平成17年）1月11日、三原郡の緑町・西淡町・三原町・南淡町が合併して南あわじ市が誕生した
    kind: fact
    level: E2
    status: established
    sources:
    - p4-minamiawaji-ja
    - p4-minamiawaji-city-gappei
  - text: 新市の名称は4町の合併協議会の協議で決められ、合併の期日（平成17年1月11日）とともに「南あわじ市」とすることが確認された
    kind: fact
    level: E2
    status: established
    sources:
    - p4-minamiawaji-city-gappei
  - text: 合併前の旧町には、淡路の西部を指す西淡町、南部を指す南淡町という方角地名がすでに使われていた
    kind: fact
    level: E2
    status: established
    sources:
    - p4-minamiawaji-city-gappei
  - text: 『古事類苑』の引く旧記によれば、淡路国は津名郡と三原郡の2郡からなり、南あわじ市を構成した4町はいずれも三原郡に属していた
    kind: fact
    level: E2
    status: established
    sources:
    - p4-kojiruien-awaji
  - text: 國學院大學の地名データベースによれば、『古事記』の国生み神話で最初に生まれた「淡道之穂之狭別島」が淡路島に比定され、「アハヂ」は阿波国へ行く道の意味とされる
    kind: fact
    level: E2
    status: established
    sources:
    - p4-kokugakuin-awaji
  column:
    title: 「南」と「西」に分かれていた淡路の南
    text: 合併前の三原郡には、西淡町と南淡町という、よく似た名前の町が並んでいた。どちらも「淡路の西」「淡路の南」という位置を示す方角地名である。2005年の合併で4町が一つになると、新市名はその命名法を島全体の規模に広げた「南あわじ」になった。ひらがなの「あわじ」に方角の「南」を冠する形は、旧町名の伝統を受け継ぎながら、新しい市全体を指す名として選ばれたものである。
    sources:
    - p4-minamiawaji-city-gappei
    - p4-minamiawaji-ja
  relations:
  - pref/28
  - muni/28-淡路市
  - muni/28-洲本市
  unknowns:
  - 新市名の候補に挙がった他の名称や、公募など選定方法の詳細は合併協議会資料の一部しか確認できなかった
  updated: '2026-11-13'
- id: muni/28-多可町
  code: '283657'
  names:
    ja: 多可町
    reading: たかちょう
    aliases:
    - 託賀郡
  user_terms:
  - 多可という名前の由来
  - 敬老の日発祥の地
  - 空が高いという地名
  naming_type: 新規命名
  formation: 合併新設
  prefecture: 兵庫県
  homonyms: []
  summary: 2005年（平成17年）に多可郡の中町・加美町・八千代町が新設合併して生まれた町で、新町名には3町に共通する旧郡名「多可」を採用した。郡名は『播磨国風土記』に「託賀郡」と見える古い名で、大男が「空が高い」と言ったという命名伝説が伝えられる。
  first_attestation:
    era: 奈良時代
    year_western: null
    document: 『播磨国風土記』
    note: 郡名は「託賀郡」と記される。現在の「多可」の表記の初出は未確認のため year_western は null とする
  claims:
  - text: 多可町役場の定住サイトは、『播磨国風土記』に、瀬戸内の方からやって来た大男が「ここへ来たら空が高いなあ」と言ったので「たか」という地名になったという伝説が残ると紹介する
    kind: legend
    level: E2
    status: established
    sources:
    - x11-taka-teiju
  - text: 『播磨国風土記』では、この郡は「託賀郡」と記される
    kind: fact
    level: E3
    status: established
    sources:
    - upg-u10-taka-kotobank-gun
  - text: 2005年（平成17年）11月1日に多可郡の中町・加美町・八千代町が新設合併して多可町が誕生した
    kind: fact
    level: E4
    status: established
    sources:
    - x11-taka-uub
  - text: 新町名には、合併した3町に共通する旧郡名「多可」が採用された。合併後、多可郡は多可町のみで構成される
    kind: fact
    level: E4
    status: established
    sources:
    - x11-taka-uub
    - x11-takagun-wiki
  - text: 合併に先立ち、2002年（平成14年）に西脇市を含む5市町合併の住民発議があったが、加美町・八千代町が否決し、黒田庄町は西脇市へ、多可郡3町での合併にまとまった
    kind: fact
    level: E4
    status: established
    sources:
    - x11-taka-uub
  - text: 「敬老の日」は、1947年（昭和22年）に多可郡野間谷村（現・多可町八千代区）で行われた敬老行事をきっかけに国民の祝日となった
    kind: fact
    level: E2
    status: established
    sources:
    - x11-taka-mext
  - text: 地方公共団体コードは283657である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 空が高い、という地名
    text: 『播磨国風土記』に残る多可の命名伝説は、拍子抜けするほど素朴です。瀬戸内の方から山を越えてきた大男が「ここへ来たら空が高いなあ」と言った——それが「たか」の始まりだとか。盆地に開けた空の広さを、大男の背の高さと視点で語るあたりに、古代の地名譚らしいおおらかさがあります。この町はもう一つ、「敬老の日」発祥の地としても知られます。
    sources:
    - x11-taka-teiju
    - x11-taka-mext
  relations:
  - pref/28
  unknowns:
  - 「多可」の表記がいつ「託賀」から改まったかは未確認
  - 風土記の大男伝説の舞台が現在の町域のどこにあたるかは未確認
  updated: '2026-11-13'
