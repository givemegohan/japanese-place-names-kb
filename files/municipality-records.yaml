  homonyms: []
  summary: 市名は城下町「甲府」の名を受け継いだもので、甲府市公式は「甲府とは『甲斐の府中』の略」と説明する。永正16年（1519）に武田信虎が躑躅ヶ崎に居館を移して城下町をつくったときに名付けたといわれ、名称が広く定着したのは近世になってからとされる。明治22年（1889）に市制が施行された。
  first_attestation:
    era: 永正16年
    year_western: 1519
    document: 躑躅ヶ崎の城下町建設に伴う命名（甲府市公式解説）
    note: 市公式は1519年の信虎の城下町建設時に名付けたと伝えるが、「甲府」表記の同時代の初出文書は特定できていない。名称の定着は近世以降と市公式も述べる
  claims:
  - text: 甲府市公式は「甲府とは『甲斐の府中』の略です」と説明している
    kind: fact
    level: E2
    status: established
    sources:
    - c-cap-kofu-city
  - text: 府中とは国の政治・経済・文化の中心地を意味する言葉であり、「甲府」の名は甲斐国の中心地という位置づけを負っている
    kind: fact
    level: E2
    status: established
    sources:
    - c-cap-kofu-city
  - text: 永正16年（1519）、武田信虎が躑躅ヶ崎（現在の武田神社境内）に居館を移し城下町をつくったときに「甲府」と名付けたといわれている
    kind: fact
    level: E2
    status: established
    sources:
    - c-cap-kofu-city
  - text: 「甲府」という名称が定着したのは近世になってからのようだと、市公式も留保している
    kind: fact
    level: E2
    status: established
    sources:
    - c-cap-kofu-city
  - text: 市制は明治22年（1889）7月1日に施行され、当時の人口は3万1,128人だった。市役所の開庁は10月になってからだった
    kind: fact
    level: E2
    status: established
    sources:
    - c-cap-kofu-city
  - text: 現在の市制施行記念日は施行日（7月1日）ではなく、開庁や当時の祝祭日にちなんで10月17日とされている
    kind: fact
    level: E2
    status: established
    sources:
    - c-cap-kofu-city
  - text: 総務省の全国地方公共団体コードで、甲府市の団体コードは192015と定められている
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 市の誕生日が2回ある
    text: 甲府市の市制施行記念日は10月17日です。ところが実際に市制が施行されたのは、明治22年（1889）7月1日でした。事務手続きや諸機関の整備のため市役所の開庁が10月にずれ込んだうえ、7月は農繁期で人出も見込めず、10月17日は当時の祝祭日「神嘗祭」にあたる吉日でもあったため、この日が記念日になったのだと市は説明します。初の市制祭は3日間にわたって盛大に行われたそうです。「市の誕生日」が施行日と記念日でずれているのは、制度と実際の暮らしの時間のずれが記念日に刻まれた例と言えます。
    sources:
    - c-cap-kofu-city
  relations:
  - pref/19
  unknowns:
  - 「甲府」表記の同時代（戦国期）の初出文書は特定できておらず、1519年の命名は市の伝承的な説明にとどまる
  - 律令期の甲斐国府は現在の甲府市ではなく笛吹市付近に比定されており、「甲斐の府中」という名が指す中心地は時代とともに移動している。この位置のずれの検証は本バッチでは未了
  - 武田信玄自身が「甲府」の名を用いた同時代史料の有無は未確認
  updated: '2026-11-13'
- id: muni/20-南牧村
  code: '203050'
  names:
    ja: 南牧村
    reading: みなみまきむら
    aliases: []
  user_terms:
  - みなみまきむら
  - 南牧村 長野 読み方
  - 野辺山の村
  naming_type: 合併新設
  prefecture: 長野県
  homonyms:
  - muni/10-南牧村
  summary: 明治22年（1889年）に海尻・海ノ口・広瀬・平沢と大明村の一部（板橋）が合併して発足した村。千曲川上流・八ヶ岳東麓の高原の村で、野辺山原の秣場や馬市場に象徴される馬と放牧の歴史を持つ。群馬県の南牧村とは漢字が同じでも読みが異なり、こちらは「みなみまき」と読む。1889年の命名理由そのものを記した資料は確認できていない。
  first_attestation:
    era: 明治22年
    year_western: 1889
    document: 町村制施行による南牧村の発足（1889年4月1日）
    note: 自治体名としての初出。村公式の年表には1886年の馬市場の開設を「南牧村に馬市場ができる」と記す箇所があり、「南牧」の名が発足前から地域を指して使われた可能性もあるが、確定はできない
  claims:
  - text: 明治22年（1889年）4月1日、海尻村・海ノ口村・広瀬村・平沢村の区域と大明村の区域のうち板橋の区域をもって南牧村が発足した
    kind: fact
    level: E2
    status: established
    sources:
    - h6-minamimaki-official-history
    - h6-minamimaki-wiki
  - text: 村公式の歴史は、大明村を「馬産・蕎麦・炭焼き・木材搬出等を収入源とする山間の集落」と紹介し、明治19年（1886年）には南牧村に馬市場ができたとする年表を載せる
    kind: fact
    level: E2
    status: established
    sources:
    - h6-minamimaki-official-history
  - text: 日本歴史地名大系によれば、野辺山原は江戸時代を通じて板橋・平沢（現南牧村）や川上村の樋沢など諸村の入会林野で、大部分が秣場（馬の飼料を採る草地）として利用されていた
    kind: fact
    level: E3
    status: established
    sources:
    - h6-nanmoku-kotobank
  - text: 読みは「みなみまき」で、県境の向こうにある群馬県甘楽郡の南牧村の読み「なんもく」とは異なる（異なる層）。共通するのは「南牧」という漢字表記だけで、成立年も経緯も別である
    kind: fact
    level: E2
    status: established
    sources:
    - h6-minamimaki-official-history
    - h6-nanmoku-gunma-pref
  - text: 「牧」の字は、秣場や馬市場に象徴される当地の放牧・馬産の歴史と響き合うが、1889年の合併時に「南牧」と命名した理由そのものを記した資料は確認できておらず、村名と放牧の直接の因果は未確定である
    kind: fact
    level: E3
    status: indeterminate
    sources:
    - h6-minamimaki-official-history
    - h6-nanmoku-kotobank
  column:
    title: 馬の村だった「みなみまき」
    text: 南牧村の公式の歴史をたどると、馬の話が繰り返し出てきます。大明村は馬産を収入源とし、明治19年には馬市場が開かれ、明治中期にはアメリカから乳牛や優良な種馬を輸入して牧場経営が試みられたこともありました（これは失敗に終わったそうです）。野辺山原は長く諸村の秣場でした。「牧」という字が村名に入っているのは、偶然とは思えない土地の記憶です。ただし、それがそのまま命名理由だと断言できる資料はまだ見つかっていません。
    sources:
    - h6-minamimaki-official-history
    - h6-nanmoku-kotobank
  relations:
  - pref/20
  - muni/10-南牧村
  unknowns:
  - 明治22年の合併時に「南牧」と命名した理由の一次記録は未確認
  - 「南牧」の地名としての初出（1886年の馬市場の記事より前に遡れるか）は未確認
  updated: '2026-11-13'
- id: muni/20-川上村
  code: '203041'
  names:
    ja: 川上村
    reading: かわかみむら
    aliases:
    - 川上郷
  user_terms:
  - 川上村 千曲川の源流
  - 御所平の村
  - レタスの村
  naming_type: 合併新設
  prefecture: 長野県
  homonyms:
  - muni/29-川上村
  summary: 千曲川の最上流部に位置する村。地域名としては戦国期の文書に「川上郷」が見え、明治22年（1889年）に八つの旧村の区域をもって川上村が発足した。村名は最上流部という立地と旧郷名の継承で説明される。奈良県の川上村とは「大河の最上流部」という命名の構造だけが共通し、川も歴史も無関係である。大字「御所平」には保元の乱にまつわる皇子の伝承が残る。
  first_attestation:
    era: 天正2年
    year_western: 1574
    document: 大井文書
    note: 日本歴史地名大系が紹介する「川上郷」の用例（郷名としての初出）。村名そのものの成立は1889年
  claims:
  - text: 日本歴史地名大系によれば、天正2年（1574年）の大井文書に「平賀之事」とある十二郷の中に「川上郷」の名が見える
    kind: fact
    level: E3
    status: established
    sources:
    - h6-kawakami-kotobank
  - text: 村は千曲川の最上流部に位置し、村域は梓山・秋山・居倉・川端下・原・大深山・御所平・樋沢の旧八か村からなる
    kind: fact
    level: E3
    status: established
    sources:
    - h6-kawakami-kotobank
  - text: 明治22年（1889年）4月1日、居倉村・原村・御所平村・大深山村・秋山村・梓山村・川端下村の区域と大明村の区域のうち樋沢の区域をもって川上村が発足した
    kind: fact
    level: E5
    status: established
    sources:
    - h6-kawakami-nagano-wiki
  - text: 村名「川上」は、千曲川の最上流部にあたる立地と、戦国期以来の地域名「川上郷」の継承によって説明される
    kind: fact
    level: E3
    status: inferred
    sources:
    - h6-kawakami-kotobank
    - h6-kawakami-nagano-yoran
  - text: 奈良県の川上村も「川の上流部」の名という点は共通するが、対象の川は吉野川であり、戦国期の「川上郷」のような旧郷名の用例は奈良側では確認していない（共通する層＝命名の構造、異なる層＝川と地域史）
    kind: fact
    level: E3
    status: established
    sources:
    - h6-kawakami-kotobank
  - text: 保元の乱（1156年）で敗れた崇徳上皇の皇子・重仁親王が、信濃の村上基国を頼って川上村の御所平・御殿窪に安住したという伝承があり、大字「御所平」の名はその名残と語られる。作家の佐藤春夫は『佐久の内裏』で、この伝承と「佐久川上村御所平要図」という史料を取り上げた
    kind: legend
    level: E4
    status: established
    sources:
    - h6-kawakami-shigehito-legend
    - h6-kawakami-nagano-wiki
  column:
    title: 御所平に眠る皇子の伝説
    text: 川上村の大字に「御所平」という、いかにも皇族ゆかりの名があります。伝承では、保元の乱で敗れた崇徳上皇の皇子・重仁親王が、信濃の武士・村上基国を頼って千曲川を遡り、この御所平の御殿窪に住んだとされます。再起を図りながら若くして病に倒れたとも語られ、近くの南相木村には御陵山の名まで残ります。昭和には佐藤春夫が小説『佐久の内裏』にこの伝承を書きました。史実として確認できる話ではありませんが、「川の最上流の村」に皇子の落人伝説が根づいたこと自体が、この土地の記憶の形です。
    sources:
    - h6-kawakami-shigehito-legend
  relations:
  - pref/20
  - muni/29-川上村
  unknowns:
  - 「川上郷」の範囲と現在の村域がどの程度一致するかは未確認
  - 重仁親王伝承について、村公式資料（村史・村勢要覧）がどう扱っているかは未確認
  updated: '2026-11-13'
- id: muni/20-池田町
  code: '204811'
  names:
    ja: 池田町
    reading: いけだまち
    aliases:
    - 池田町村
    - 池田郷
  user_terms:
  - 池田町 長野
  - いけだまち
  - 北安曇郡の池田町
  - ハーブの町 池田
  naming_type: 一部の地名
  prefecture: 長野県
  homonyms:
  - muni/01-池田町
  - muni/18-池田町
  - muni/21-池田町
  summary: 長野県北安曇郡の町。中世の池田郷の名を継承し、『親元日記』寛正6年（1465）の記事に「矢原庄池田郷」と見えるのが確認できる早い記録である。江戸時代は松本藩の池田組に属し、明治8年（1875）に池田町村、大正4年（1915）に町制施行で池田町となった。4つの池田町のうち唯一「いけだまち」と読む。
  first_attestation:
    era: 寛正6年
    year_western: 1465
    document: 『親元日記』寛正6年5月18日条（「矢原庄池田郷」）
    note: 日本歴史地名大系が紹介する形で確認した二次確認であり、原典は未読
  claims:
  - text: 池田郷は『親元日記』寛正6年（1465）5月18日の記事に「矢原庄池田郷」と見え、中世の郷名として確認できる
    kind: fact
    level: E3
    status: established
    sources:
    - h2-kotobank-ikedamachi
  - text: 江戸時代を通じて松本藩領の池田組に属し、明治8年（1875）に池田町村となった
    kind: fact
    level: E3
    status: established
    sources:
    - h2-kotobank-ikedamachi
  - text: 大正4年（1915）に町制を施行して池田町となり、昭和30年（1955）に会染村と合併して現在の池田町となった
    kind: fact
    level: E2
    status: established
    sources:
    - h2-ikeda-nagano-gaiyo
  - text: 原初の池田の集落は、東南の「馬の口」と呼ばれる場所の近くにあったと伝えられる
    kind: legend
    level: E3
    status: indeterminate
    sources:
    - h2-kotobank-ikedamachi
  - text: 「池田」という名の語源については、確認した公式・専門資料の範囲では説明が見当たらず、確定できない
    kind: fact
    level: E3
    status: indeterminate
    sources:
    - h2-kotobank-ikedamachi
    - h2-ikeda-nagano-gaiyo
  - text: 同名の比較（異なる層）：中世の郷名の継承であり、荘園名に遡る福井県・岐阜県の池田町、人名に由来する北海道池田町とは成り立ちが異なる
    kind: fact
    level: E3
    status: established
    sources:
    - h2-kotobank-ikedamachi
  - text: 同名の比較（異なる層）：読みは「いけだまち」で、他の3つの池田町（すべて「いけだちょう」）と異なる、4件中で唯一の「まち」読みである
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 1465年の日記に残る、郷の名のままの町
    text: 池田郷の名は、室町時代の日記『親元日記』の1465年の記事にすでにある。荘園の名でも人名でもなく、在地の小さな郷の名が、村・町と姿を変えながら550年以上そのまま使われ続けてきた。しかも全国4つの池田町の中で、ここだけが「ちょう」ではなく「まち」と読む。古い地名ほど静かに残る、という好例である。
    sources:
    - h2-kotobank-ikedamachi
    - b-cap-chiba-soumu-code
  relations:
  - pref/20
  - muni/01-池田町
  - muni/18-池田町
  - muni/21-池田町
  unknowns:
  - 「池田」の語源（池と田の地形名に由来するか等）は、確認した資料の範囲では説明がなく未確認
  - 池田郷の成立時期（1465年より前の記録）は未確認
  updated: '2026-11-13'
- id: muni/20-長野市
  code: '202011'
  names:
    ja: 長野市
    reading: ながのし
    aliases:
    - 長野町
    - 長野村
    - 善光寺町
  user_terms:
  - 長野市の名前の由来
  - 長野市はなぜ長野というのか
  - 善光寺と長野市の関係
  - 長野市の市制が遅かった理由
  naming_type: 一部の地名
  prefecture: 長野県
  homonyms: []
  summary: 市名は善光寺の門前町を含む長野村・長野町の名を受け継いだものである。「長野」は扇状地の長い緩やかな傾斜地を指す地形由来の地名と説明される。明治4年（1871）に県庁が長野村へ移って村名が県名になり、市制の施行は明治30年（1897）と県庁所在地としては遅めだった。
  first_attestation:
    era: 慶長6年
    year_western: 1601
    document: 善光寺文書（大久保長安等連署証文）
    note: 慶長6年9月16日付の証文に「信州水内郡之内長野」とある。1570年の武田信玄書状に初出を求める説もあるが字句の読みが定まらないため、確実な用例としてこちらを採った（県レコードと同一の記録）
  claims:
  - text: 慶長6年（1601）9月16日の大久保長安等連署証文（善光寺文書）に「信州水内郡之内長野」とあり、善光寺領の確定に関わる文書の中で「長野」が確認できる
    kind: fact
    level: E2
    status: established
    sources:
    - c-jstage-nagano
  - text: 元亀元年（1570）の武田信玄の書状に長野の初出を見る説もあるが、その字句は「艮野」とも読まれ、1601年初出説と併存している
    kind: fact
    level: E3
    status: contested
    sources:
    - c-jstage-nagano
  - text: 「長野」は、善光寺平に裾花川などがつくった扇状地のような、長く緩やかな傾斜地を指す地形由来の地名と説明される
    kind: fact
    level: E2
    status: established
    sources:
    - c-suzaka-city
  - text: 江戸時代、現・長野市中心部は地籍上は水内郡長野村であり、その町場の部分が善光寺の門前町として善光寺町と呼ばれた
    kind: fact
    level: E2
    status: established
    sources:
    - c-ndl-nagano
  - text: 明治4年（1871）6月、中野県の県庁が長野村の西方寺へ移され、県名が長野県と改称されたため、村名「長野」がそのまま県名になった
    kind: fact
    level: E2
    status: established
    sources:
    - c-nagano-shishi
  - text: 明治30年（1897）4月1日、長野町が市制を施行して長野市が誕生した。県庁所在地になってから市になるまでに26年を要している
    kind: fact
    level: E2
    status: established
    sources:
    - c-nagano-shishi
    - c-cap-nagano-uub
  - text: 総務省の全国地方公共団体コードで、長野市の団体コードは202011と定められている
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 一つのまちに、二つの名前
    text: 江戸時代のいまの長野市中心部には、二つの名前が重なっていました。地籍のうえでは水内郡「長野村」、しかし実際に人々が暮らし参詣客でにぎわう町場は、善光寺の門前町として「善光寺町」と呼ばれていたのです。明治4年（1871）に県庁の引っ越し先になったのは長野村で、県の名前は「長野県」になりました。一方、まちの知名度でいえば善光寺の方が圧倒的でした。村の名前が県名になり、門前町のにぎわいがそのまま都市の土台になる――長野市は、その二つの名前の重なりから生まれた県庁所在地です。
    sources:
    - c-ndl-nagano
    - c-nagano-shishi
  relations:
  - pref/20
  unknowns:
  - 1570年の武田信玄書状の該当字句（長野か艮野か）の確定には原本の画像確認が必要で未了（県レコードと同一の未確認事項）
  - 長野村から長野町が成立した年次（町制の経緯）については本バッチでは市公式資料まで確認できていない
  - 「長野＝長い傾斜地」とする地形語源説の言語学的な検証水準は、専門地名辞典まで確認できていない
  updated: '2026-11-13'
- id: muni/20-高山村
  code: '205435'
  names:
    ja: 高山村
    reading: たかやまむら
    aliases: []
  user_terms:
  - 高山村 長野 合成地名
  - 高井と山田の村
  - 一茶ゆかりの里
  naming_type: 合併新設
  prefecture: 長野県
  homonyms:
  - muni/10-高山村
  summary: 昭和31年（1956年）に高井村と山田村が合併して生まれた村で、村名は高井の「高」と山田の「山」を合わせた合成地名とされる。群馬県の高山村も合成地名だが材料は尻高・中山で、字面の一致は偶然である。村内には御牧に由来するとされる「牧」「駒場」の地名も残る。
  first_attestation:
    era: 昭和31年
    year_western: 1956
    document: 高井村・山田村の合併による高山村の発足（1956年9月30日）
    note: 自治体名としての初出（合併時の合成地名）
  claims:
  - text: 昭和31年（1956年）9月30日、高井村と山田村が合併して高山村が発足した
    kind: fact
    level: E5
    status: established
    sources:
    - h6-takayama-nagano-wiki
  - text: 合成地名の一覧資料では、長野県上高井郡高山村は「高井村＋山田村」の合成地名とされる。すなわち高井の「高」と山田の「山」を合わせた名である
    kind: fact
    level: E5
    status: established
    sources:
    - h6-takayama-gosei-list
  - text: 群馬県の高山村も合成地名という点は共通するが、材料は尻高村と中山村であり、「高山」という結果の字面だけが偶然一致する（共通する層＝命名方式、異なる層＝元の村名と成立年）
    kind: fact
    level: E5
    status: established
    sources:
    - h6-takayama-gosei-list
    - h6-takayama-gosei-kitagawa
  - text: 合併前の高井村は明治22年に高井村・牧村の区域をもって発足し、山田村は中山村・奥山田村の区域をもって発足した村で、旧村名は現在の大字（高井・牧など）に残る
    kind: fact
    level: E5
    status: established
    sources:
    - h6-takayama-nagano-wiki
  - text: 村内には「牧」「駒場」の地名があり、奈良時代末に皇室の馬を飼育する御牧が各地に置かれたことと関係するとされる
    kind: fact
    level: E5
    status: established
    sources:
    - h6-takayama-nagano-wiki
  column:
    title: 同じレシピ、違う材料
    text: 高井村の「高」と山田村の「山」。群馬県高山村の尻高＋中山とまったく同じ作り方で、まったく同じ「高山村」ができました。面白いのは、この村の旧村域にはもう一つ「牧村」という村があり、いまも大字「牧」が残っていることです。御牧（皇室の馬の放牧地）に由来するとされる地名で、県境の向こうの二つの「南牧村」とも、馬と牧をめぐる地名の集まりとして眺めると一続きの風景に見えてきます。
    sources:
    - h6-takayama-nagano-wiki
    - h6-takayama-gosei-list
  relations:
  - pref/20
  - muni/10-高山村
  unknowns:
  - 昭和31年の合併時の命名経緯を記した村公式資料は未確認（合成地名の説明は一覧資料とWikipediaによる）
  - 「高井」「山田」という旧村名自体の語源は今回未調査
  updated: '2026-11-13'
- id: muni/20-高森町
  code: '204030'
  names:
    ja: 高森町
    reading: たかもりまち
    aliases:
    - 市田村
    - 山吹村
  user_terms:
  - 長野の高森町の由来
  - 本高森山から名付けた町
  - 下伊那の高森町
  naming_type: 合併新設
  prefecture: 長野県
  homonyms:
  - muni/43-高森町
  summary: 下伊那郡の町で、昭和32年（1957）7月1日に市田村と山吹村の合併で発足した。町名は「両村を山頂で結ぶ本高森山に由来して」付けられたことが町の公式要覧に明記される、山名採用型の合併新名である。同名の熊本県高森町は江戸期の高森手永に遡る古い地名の継承であり、同じ「高森」でも名前の年齢がまったく異なる。
  first_attestation:
    era: 昭和32年
    year_western: 1957
    document: 高森町の発足（市田村・山吹村の合併、本高森山に由来する命名）
    note: 地名としての「高森」の初出は命名そのもの。山名「本高森山」はそれ以前から存在したが、その山名自体の由来は未確認
  claims:
  - text: 昭和32年（1957）7月1日に市田村と山吹村が合併し、両村を山頂で結ぶ本高森山に由来して、町名を高森町とした
    kind: fact
    level: E2
    status: established
    sources:
    - h5-takamori-nagano-handbook
  - text: 市田村は1889年（明治22年）に下市田・上市田・吉田・出原・大島山・牛牧の6か村が合併して発足した村であり、合併前の町域に「高森」を名乗る自治体はなかった
    kind: fact
    level: E2
    status: established
    sources:
    - h5-takamori-nagano-handbook
  - text: 異なる層として、同名の熊本県高森町は江戸時代に行政区画「高森手永」が置かれ、1889年の町村制ですでに高森町が存在した古い地名であり、1957年に山名から新しく名付けられた長野の高森とは、名前の古さが対照的である
    kind: fact
    level: E2
    status: established
    sources:
    - h5-takamori-kumamoto-enkaku
  - text: 共通する層として、両町とも「森」を含む名が山地の地形と結びついた町であり、昭和の大合併期に現在の町として発足した点は共通する
    kind: fact
    level: E2
    status: established
    sources:
    - h5-takamori-nagano-handbook
    - h5-takamori-kumamoto-kaso
  - text: 総務省の全国地方公共団体コードで、高森町の団体コードは204030と定められている
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 二つの村を「山頂で結ぶ」山の名前
    text: 長野の高森町の名前の決め方は、町の公式資料に美しい一文で残っています。「両村を山頂で結ぶ本高森山に由来して、町名を高森町としました」。本高森山の山頂は市田村と山吹村の境界にあり、合併する二つの村はもともと一つの山で結ばれていた、というわけです。どちらか一方の村の名前を選ぶのではなく、二つの村の真上にある山の名前を共有の名にしたところに、対等合併の知恵が見えます。
    sources:
    - h5-takamori-nagano-handbook
  relations:
  - pref/20
  - muni/43-高森町
  unknowns:
  - 命名の選定過程（公募だったか、候補名に何があったか）は未確認
  - 山名「本高森山」の「高森」自体の由来（いつ、なぜ高森と呼ばれるようになったか）は未確認
  updated: '2026-11-13'
- id: muni/21-岐阜市
  code: '212016'
  names:
    ja: 岐阜市
    reading: ぎふし
    aliases:
    - 岐阜町
    - 井口
    - 井ノ口
  user_terms:
  - 岐阜市の名前の由来
  - 岐阜は信長が付けた名前か
  - 岐山と曲阜の意味
  - 沢彦の3つの案
  naming_type: 一部の地名
  prefecture: 岐阜県
  homonyms: []
  summary: 市名は城下町「岐阜」の名を受け継いだもので、その岐阜は永禄10年（1567）に織田信長が稲葉山城下の井口を改めた名とされる。沢彦宗恩の進言による命名という話は後世の編纂物『安土創業録』に基づいており、信長以前から禅僧の間で「岐阜」の語が使われていた例もあって、命名の経緯には諸説がある（県レコードと同一の記録）。明治22年（1889）に市制が施行されて岐阜市となった。
  first_attestation:
    era: 永禄10年
    year_western: 1567
    document: 信長公記
    note: 井口を岐阜と改めた公称としての初出。語そのものは信長以前の禅僧の用例が指摘されている（県レコードと同一の記録）
  claims:
  - text: 永禄10年（1567）、織田信長は稲葉山城を攻略して居城を清須から移した
    kind: fact
    level: E2
    status: established
    sources:
    - c-gifu-ken
  - text: 『信長公記』は、信長が稲葉山の城下の井口（井ノ口）を岐阜と改めたと記しており、改名自体は当事者に近い記録で裏付けられる
    kind: fact
    level: E1
    status: established
    sources:
    - c-cap-nobunaga-koki
    - c-gifu-ken
  - text: 尾張・政秀寺の禅僧沢彦宗恩が「岐山・岐陽・岐阜」の3案を進言し、信長が「岐阜」を選んだとする話は『安土創業録』に基づくもので、同書は後世の編纂物であり同時代の記録ではない
    kind: fact
    level: E2
    status: contested
    sources:
    - c-gifu-ken
    - c-cap-azuchi-sogyoroku
  - text: 「岐」は、中国で周の文王が岐山より興って天下を定めた故事にちなむと岐阜県公式は説明する
    kind: fact
    level: E2
    status: established
    sources:
    - c-gifu-ken
  - text: 「阜」を孔子の生誕地である曲阜にちなむとする説明も広く流布するが、県公式の説明は岐山の故事を中心としており、曲阜説は諸説の一つと位置づけられる
    kind: fact
    level: E3
    status: contested
    sources:
    - c-gifu-ken
    - c-gifu-city-gaiyo
  - text: 岐阜市の資料は、応仁元年（1467）の瑞龍寺建立に際する賛に「岐阜」の字句が見えることや、快川紹喜が「岐陽」の語を用いたことを挙げ、信長以前から禅僧の間でこの地の雅称が使われていたとする
    kind: fact
    level: E2
    status: established
    sources:
    - c-gifu-city-gaiyo
  - text: 明治22年（1889）7月1日、市制町村制の施行で岐阜の56の町の区域を合わせて岐阜市が発足した
    kind: fact
    level: E4
    status: established
    sources:
    - c-cap-gifu-uub
  - text: 総務省の全国地方公共団体コードで、岐阜市の団体コードは212016と定められている
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 天下統一の出発点に、中国の故事を重ねた男
    text: 永禄10年、美濃を手に入れた信長は、井ノ口という小さな地名を捨てて「岐阜」と改め、ほどなく「天下布武」の印を使い始めます。沢彦進言説によれば、「岐」は周の文王が岐山から興って天下を平定した故事へのなぞらえで、命名はそのまま天下への宣言でした。もっとも「岐阜」の語自体は、それ以前から金華山周辺を詠む禅僧の雅称として存在したとも言われます。信長の才覚は、無から名前を発明したことではなく、すでにあった由緒ある言葉を拾い上げ、自分の旗印に変えたところにあったのかもしれません。岐阜のまちは、その改名の瞬間から都市としての歩みを始めたと言えます。
    sources:
    - c-gifu-ken
    - c-gifu-city-gaiyo
  relations:
  - pref/21
  unknowns:
  - 沢彦宗恩の進言を裏付ける同時代史料は確認されておらず、『安土創業録』の記事の信憑性は確定していない（県レコードと同一の未確認事項）
  - 1467年の賛の「岐阜鐘秀」という字句が地名として使われたのか、単なる美称かは解釈が分かれる
  - 「阜＝曲阜」説の出典となる初期の文献は特定できていない
  - 岐阜市の市制施行日（1889年7月1日）について、市公式の概況資料での直接確認は次回に回した
  updated: '2026-11-13'
- id: muni/21-池田町
  code: '214043'
  names:
    ja: 池田町
    reading: いけだちょう
    aliases:
    - 池田村
    - 温知村
    - 池田荘
  user_terms:
  - 池田町 岐阜
  - 揖斐郡の池田町
  - 池田温泉のある町
  naming_type: その他（旧村名の復活による改称）
  prefecture: 岐阜県
  homonyms:
  - muni/01-池田町
  - muni/18-池田町
  - muni/20-池田町
  summary: 岐阜県揖斐郡の町。町域は古代から中世にかけて美濃国の池田荘に属した。明治の池田村は1950年に本郷村と合併して温知村となったが、1954年5月1日の町制施行と同時に池田町へ改称され、旧村名「池田」が復活した。4つの池田町のうち、合併新名を捨てて旧名に戻した経緯が特徴である。
  first_attestation:
    era: 中世
    year_western: null
    document: 荘園名「池田荘」（美濃国）としての記録
    note: 室町時代に美濃国守護・土岐頼忠の本拠が置かれた。具体的な初出年は今回の調査では特定できていない
  claims:
  - text: 町域は古代から中世にかけて池田荘に属し、室町時代には美濃国守護の土岐頼忠が本拠を置いた
    kind: fact
    level: E3
    status: established
    sources:
    - h2-kotobank-ikeda
    - h2-ikeda-gifu-shiryo
  - text: 1950年に池田村と本郷村が合併して温知村となり、1954年5月1日に「温知村を池田村とし、池田村を池田町とする」手続きで、町制施行と同時に池田町となった
    kind: fact
    level: E2
    status: established
    sources:
    - h2-ikeda-gifu-kankyo
  - text: 1954年の改称は、合併でいったん姿を消した旧村名「池田」の復活であり、その名は池田荘の地を指した古い地域名に遡る。ただし改称理由の明文は確認できておらず、この説明は経緯からの類推である
    kind: fact
    level: H
    status: inferred
    sources:
    - h2-ikeda-gifu-kankyo
    - h2-kotobank-ikeda
  - text: 同名の比較（共通する層）：福井県池田町も中世の「池田荘」に遡る点で共通する。ただし美濃国と越前国今立郡の池田荘は別の荘園であり、直接の関係はない
    kind: fact
    level: E3
    status: established
    sources:
    - h2-kotobank-ikeda
    - h2-kotobank-ikedacho
  - text: 同名の比較（異なる層）：北海道池田町の人名由来、長野県池田町の郷名のまっすぐな継承とは異なり、岐阜県池田町は「合併新名（温知）から旧名への復活改称」という経緯を持つ。読みは「いけだちょう」
    kind: fact
    level: E2
    status: established
    sources:
    - h2-ikeda-gifu-kankyo
    - b-cap-chiba-soumu-code
  - text: 中心集落の池野は近世に市場町として発展し、町名のもとになった池田村の中心でもあった
    kind: fact
    level: E3
    status: established
    sources:
    - h2-kotobank-ikedacho
  column:
    title: わずか4年で消えた「温知村」
    text: 1950年の合併で生まれた温知村は、「温故知新」を思わせる雅な新名だった。だが4年後、町制施行の機会に村は「池田村」を名乗り直し、そのまま池田町になった。合併で新しい名を作っても、土地の古い名のほうがしっくりくる——昭和の合併で全国に生まれた新名が次々に旧名へ戻った現象の、小さく分かりやすい実例である。
    sources:
    - h2-ikeda-gifu-kankyo
    - h2-ikeda-gifu-shiryo
  relations:
  - pref/21
  - muni/01-池田町
  - muni/18-池田町
  - muni/20-池田町
  unknowns:
  - 美濃国池田荘の初出文書・成立時期は未確認
  - 1954年の改称を決めた際の公式な理由の記録は未確認（旧村名の復活とする説明は経緯からの類推）
  updated: '2026-11-13'
- id: muni/22-森町
  code: '224618'
  names:
    ja: 森町
    reading: もりまち
    aliases:
    - 森町村
    - 三木の里
  user_terms:
  - 森町 静岡
  - 遠州の小京都
  - 三木の里 森町
  - 周智郡の町
  naming_type: 一部の地名
  prefecture: 静岡県
  homonyms:
  - muni/01-森町
  summary: 静岡県周智郡の町。町の説明では「森町という名前の村ができたのは鎌倉時代中頃」とされ、中世の村名を継承する。明治22年（1889）の町村制で森町として発足し、昭和30〜31年（1955〜56）の合併で現在の町域となった。古代の周智郡や小國神社の記録は古いが、「森」の名自体は中世以降のものである。
  first_attestation:
    era: 鎌倉時代中頃
    year_western: null
    document: 森の村の成立を伝える町公式の説明
    note: 具体的な文書名・年は町の説明では示されていない
  claims:
  - text: 町公式の説明によれば、「森町という名前の村ができたのは鎌倉時代中頃」で、それ以前の古代の資料に「森」の名は確認できない
    kind: fact
    level: E2
    status: established
    sources:
    - h2-mori-shizuoka-yurai
  - text: 周智郡と小國神社は『続日本後紀』承和7年（840）の記事に現れる古代以来の名だが、『和名類聚抄』に載る周智郡の5郷（大田・上山・野中・土器・井伊）に「森」はなく、「森」の名は中世のものである
    kind: fact
    level: E2
    status: established
    sources:
    - h2-mori-shizuoka-zusetsu
    - h2-mori-shizuoka-yurai
  - text: 明治22年（1889）の町村制施行で三倉村・天方村・森町・一宮村・園田村・飯田村が発足し、昭和30年（1955）に天方村・一宮村・園田村・飯田村が森町と合併、翌年に三倉村が合併して現在の森町となった
    kind: fact
    level: E2
    status: established
    sources:
    - h2-mori-shizuoka-keikan
  - text: 別名「三木の里」は、「森」の字が木を3つ重ねた形であることにちなむ
    kind: fact
    level: E2
    status: established
    sources:
    - h2-mori-shizuoka-yurai
  - text: 同名の比較（異なる層）：北海道森町が江戸時代の漁村名（アイヌ語オニウシに対応する和名）に由来するのに対し、静岡県森町は中世の村名の継承であり、名の古さが大きく異なる
    kind: fact
    level: E2
    status: established
    sources:
    - h2-mori-shizuoka-yurai
    - h2-mori-hok-tokei
  - text: 同名の比較（共通する層）：読みは北海道森町と同じ「もりまち」である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 遠州の小京都と「三木の里」
    text: 大正12年（1923）、地理学者の志賀重昂は森町を訪れて「遠州森町は如何にも小京都である」と称えたと観光協会は伝える。小國神社・天宮神社という古社を抱え、秋葉街道の宿場として栄えた町の佇まいが評価されたものだ。もう一つの愛称「三木の里」は、森の字が木を3つ重ねた形という、漢字の形そのものへの着目から生まれた。名の由来が分からなくても、字の形から新しい物語が生まれる例である。
    sources:
    - h2-mori-kanko
    - h2-mori-shizuoka-yurai
  relations:
  - pref/22
  - muni/01-森町
  unknowns:
  - 「森」の村名の具体的な初出文書は未確認（町の説明は鎌倉時代中頃とするが文書名を示していない）
  - 森の名の由来（森林の姿によるか、神社の森によるか等）を特定する資料は未確認
  updated: '2026-11-13'
- id: muni/22-清水町
  code: '223417'
  names:
    ja: 清水町
    reading: しみずちょう
    aliases:
    - 清水村
  user_terms:
  - 清水町 静岡
  - 柿田川の清水町
  - 駿東郡の清水町
  - 湧水の町 清水
  naming_type: その他（湧水にちなむ新規命名）
  prefecture: 静岡県
  homonyms:
  - muni/01-清水町
  summary: 静岡県駿東郡の町。明治22年（1889）に12か村と徳倉村が合併して清水村となり、昭和38年（1963）に町制施行した。合併前の構成村に「清水」はなく、町名は日本歴史地名大系が「町名の由来ともなった湧水」と記す柿田川の清らかな湧水にちなむ新規命名である。
  first_attestation:
    era: 明治22年
    year_western: 1889
    document: 町村制施行による清水村の成立
    note: 合併前の構成村に「清水」の名はなく、湧水にちなむ新名として付けられた
  claims:
  - text: 日本歴史地名大系は、狩野川（古くは泉川とも呼ばれた）に注ぐ湧水の川・柿田川を「町名の由来ともなった湧水」と記す
    kind: fact
    level: E3
    status: established
    sources:
    - h2-kotobank-shimizu
  - text: 明治22年（1889）に12か村と徳倉村が合併して清水村となり、昭和38年（1963）に町制を施行して清水町となった
    kind: fact
    level: E2
    status: established
    sources:
    - h2-shimizu-shizuoka-plan
  - text: 柿田川は富士山に降った雨や雪が伏流水となって湧き出す川で、湧水量は日量約100万トンとされ、環境省の名水百選に選ばれている
    kind: fact
    level: E2
    status: established
    sources:
    - h2-kakita-meisui
  - text: 同名の比較（共通する層と異なる層）：「清水（清らかな水）」に由来する点は北海道清水町と共通するが、こちらは土地の湧水をそのまま名にした和名であり、アイヌ語（ペケレベツ）の意訳である北海道清水町とは出発点が異なる
    kind: fact
    level: E3
    status: established
    sources:
    - h2-kotobank-shimizu
    - h2-shimizu-hok-history
  - text: 同じ静岡県内には旧清水市（現在の静岡市清水区）という別の大きな「清水」があり、県内でも同名の地名が重なっている
    kind: fact
    level: E3
    status: established
    sources:
    - h2-kotobank-shimizu
  - text: 同名の比較（共通する層）：読みは北海道清水町と同じ「しみずちょう」である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 名は看板に偽りなし——県内最小の町と日本有数の湧水
    text: 清水町の面積は静岡県の市町村で最も小さい部類だが、その小さな町域に、1日約100万トンもの水が湧く柿田川が流れる。「清らかな水」という名は、誇張でも願望でもなく、町の真ん中を流れる川そのものの描写だった。1889年、合併した村々がどの村の名でもない中立の新名として「清水」を選んだのは、水の恵みこそが共通の財産だったからだろう。
    sources:
    - h2-kakita-meisui
    - h2-shimizu-shizuoka-plan
  relations:
  - pref/22
  - muni/01-清水町
  unknowns:
  - 1889年の合併時に「清水」の名を選んだ経緯を示す議事記録等は未確認
  - 柿田川が「町名の由来ともなった湧水」とする以上の、命名者や選定過程は未確認
  updated: '2026-11-13'
- id: muni/22-静岡市
  code: '221007'
  names:
    ja: 静岡市
    reading: しずおかし
    aliases:
    - 静岡
    - 駿府
    - 府中
  user_terms:
  - 静岡市の名前の由来
  - 静岡市はなぜ静岡というのか
  - 駿府から静岡への改名
  - 静岡市と清水市の合併
  naming_type: 合併新設
  prefecture: 静岡県
  homonyms: []
  summary: 現在の静岡市は、平成15年（2003）に旧静岡市と清水市の新設合併で発足した自治体だが、市名自体は明治2年（1869）に生まれた「静岡」の継承である。もとの「府中（駿府）」は各地にある紛らわしい名だとして政府から改名を求められ、藩内から上申した「静」「静城」「静岡」の3案の中から「静岡」が選ばれた。
  first_attestation:
    era: 明治2年
    year_western: 1869
    document: 静岡藩への改称（藩知事任命時）
    note: 命名そのものの初出。明治2年6月の徳川家達の藩知事任命の際に「静岡」が初めて使用されたと県公式は説明する（県レコードと同一の記録）
  claims:
  - text: 駿府は「駿河府中」の略であり、律令期以来の国府所在地を指す、特定の土地固有ではない普通名詞的な名称だった
    kind: fact
    level: E2
    status: established
    sources:
    - c-shizuoka-ken
  - text: 明治2年（1869）、新政府は「府中」という名称は紛らわしいとして、駿府藩（府中藩）に対して地名の変更を求めた
    kind: fact
    level: E2
    status: established
    sources:
    - c-shizuoka-ken
    - c-shizuoka-lib
  - text: 藩内で検討して「静」「静城」「静岡」の3案を考案して政府に報告し、そのうち「静岡」が採用されて、同年6月の藩知事任命の際に初めて使用された
    kind: fact
    level: E2
    status: established
    sources:
    - c-shizuoka-ken
    - c-shizuoka-lib
  - text: 「シズオカ」の「シズ」は、駿府の北西にある賤機山（しずはたやま）に由来すると言われているが、同時代の命名記録で直接確認されたものではない
    kind: fact
    level: E2
    status: contested
    sources:
    - c-shizuoka-ken
  - text: いったん「賤ヶ丘」と決まった名を、藩校頭取の向山黄村が「賤」の字を嫌って「静」に改めるよう進言したとする逸話が伝わるが、その史料的裏付けは確認されていない
    kind: legend
    level: E4
    status: contested
    sources:
    - c-shizuoka-weblio
  - text: 明治22年（1889）に市制を施行して静岡市が発足し、周辺の町村を編入しながら市域を広げてきた
    kind: fact
    level: E2
    status: established
    sources:
    - c-cap-shizuoka-city
  - text: 平成15年（2003）4月1日、旧静岡市と清水市が合併して新しい静岡市が発足した
    kind: fact
    level: E2
    status: established
    sources:
    - c-cap-shizuoka-city
  - text: 平成17年（2005）4月1日、静岡市は政令指定都市に移行した
    kind: fact
    level: E4
    status: established
    sources:
    - c-cap-shizuoka-uub
  - text: 総務省の全国地方公共団体コードで、静岡市の団体コードは221007と定められている
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 城下町と港町、二つの中心が一つの市に
    text: 静岡市には、生まれの違う二つの中心があります。一つは駿府城の城下町だった旧静岡市。もう一つは、明治32年（1899）に開港場となった清水港を擁する旧清水市です。2003年、この二つが合併して新しい静岡市が生まれ、2005年には政令指定都市になりました。市名に残ったのは城下町側の「静岡」で、清水の名は区名（清水区）と港の名に残っています。1869年に「府中」から改名して生まれた若い地名が、130年余りを経て、港町まで含む大きな市の名前になったのです。
    sources:
    - c-cap-shizuoka-city
    - c-cap-shizuoka-uub
  relations:
  - pref/22
  unknowns:
  - 「シズ＝賤機山」説を裏付ける同時代の命名経緯記録は確認できていない（県レコードと同一の未確認事項）
  - 向山黄村の進言説については、向山自身の史料や伝記・墓誌にも言及がないと指摘されており、裏付けは未確認
  - 政令指定都市への移行（2005）の経緯について、市公式の沿革ページでの直接確認は未了
  updated: '2026-11-13'
- id: muni/23-名古屋市
  code: '231002'
  names:
    ja: 名古屋市
    reading: なごやし
    aliases:
    - 名古屋
    - 那古野
    - 名護屋
    - 浪越
  user_terms:
  - 名古屋市の名前の由来
  - 名古屋はなぜ名古屋というのか
  - 那古野となごやの関係
  - 名古屋の語源の諸説
  naming_type: 一部の地名
  prefecture: 愛知県
  homonyms: []
  summary: 市名は尾張の中心地「名古屋（なごや）」の名を受け継いだもので、その古い表記「那古野」は平安時代末期の荘園名「那古野荘」として現れる。「なごや」の語源は諸説あって確定していない。近世初めに名古屋城の城下町が開かれてから「名古屋」の表記が定着し、明治22年（1889）に市制が施行された。
  first_attestation:
    era: 平安時代末期
    year_western: null
    document: 旧広橋家本『江家次第』裏書（尾張国那古野庄領家職相伝系図）
    note: 荘園名「那古野荘」としての初見。具体的な年代は特定できないため西暦年は null とした（『日本歴史地名大系』の説明を愛知県図書館のレファレンス回答が紹介）
  claims:
  - text: 『日本歴史地名大系』は、平安時代末期の荘園名「那古野荘」が史料上の初見であり、旧広橋家本『江家次第』裏書の那古野庄領家職相伝系図に現れるとする
    kind: fact
    level: E2
    status: established
    sources:
    - c-cap-nagoya-ndl
  - text: 中世には那古野のほか名護屋・浪越などとも記され、読みは「なごや」であったとされる
    kind: fact
    level: E2
    status: established
    sources:
    - c-cap-nagoya-ndl
  - text: 「なごや」の語源については、気候・風土がなごやかな地とする説、ナゴ（霧）の多い原野とする説、海辺の漁村（魚子屋）とする説など諸説があり、確定していない
    kind: fact
    level: E2
    status: contested
    sources:
    - c-cap-nagoya-ndl
  - text: 慶長15年（1610）、徳川家康が那古野台地に名古屋城の築城工事を始め、清洲の士民が移り住む「清洲越し」によって城下町ができあがった
    kind: fact
    level: E2
    status: established
    sources:
    - c-cap-nagoya-city
  - text: 近世の初め、名古屋城下が開かれた頃から「名古屋」と「名護屋」が併用されたが、しだいに「名古屋」に定まったと『日本歴史地名大系』は説明する
    kind: fact
    level: E2
    status: established
    sources:
    - c-cap-nagoya-ndl
  - text: 廃藩置県で名古屋県が置かれ、翌・明治5年（1872）に愛知県と改称された。市名は県名（郡名由来）ではなく、城下町以来の地名「名古屋」をそのまま受け継いだものである
    kind: fact
    level: E2
    status: established
    sources:
    - c-cap-nagoya-city
    - c-cap-nagoya-ndl
  - text: 明治22年（1889）10月1日に市制が施行されて名古屋市が誕生し、名古屋市はこの日を市制施行日としている
    kind: fact
    level: E2
    status: established
    sources:
    - c-cap-nagoya-promo
  - text: 総務省の全国地方公共団体コードで、名古屋市の団体コードは231002と定められている
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 「なごの」と「なごや」の分かれ道
    text: いま名古屋市内には「那古野」という町名があり、「なごの」と読みます。ところが愛知県図書館の調査では、明治22年（1889）に成立した愛知郡那古野村は、県令の別表で「なごや」と読んだことが確認でき、「なごの」という読みがいつ始まったのかを示す史料は見つかっていないといいます。つまり中世以来「なごや」だったはずの那古野は、明治のどこかで「なごの」へ読みがずれ、その一方で「名古屋（なごや）」の表記と読みが市の名前として固定されました。同じ出発点から、読みと表記が別々の道を歩んだ例です。
    sources:
    - c-cap-nagoya-ndl
  relations:
  - pref/23
  unknowns:
  - 「なごや」の語源は諸説のいずれとも決められていない
  - 「那古野」を「なごの」と読むようになった時期を示す史料は、愛知県図書館の調査でも発見されていない
  - 那古野荘の正確な範囲（現在の市域のどの部分か）の比定は、『新修名古屋市史』の推定の域を出ない
  - 名古屋城下開府の際に「名古屋」の字を選んだ主体と経緯を示す同時代記録は未確認
  updated: '2026-11-13'
- id: muni/23-美浜町
  code: '234460'
  names:
    ja: 美浜町
    reading: みはまちょう
    aliases:
    - 河和町
    - 野間町
  user_terms:
  - 愛知の美浜町の由来
  - 知多半島の美浜町はなぜ美浜か
  - 河和と野間が合併した町
  naming_type: 合併新設
  prefecture: 愛知県
  homonyms:
  - muni/18-美浜町
  - muni/30-美浜町
  summary: 知多半島南部の町で、昭和30年（1955）に河和町と野間町が合併して発足し、1957年に上野間地区が加わった。町名は『角川日本地名大辞典』が「海に面して美しい砂浜が見えることに由来する」瑞祥地名と紹介する。同名の福井県・和歌山県の美浜町とは同時期の合併新設町という共通点を持つが、町同士の合併だった点と二段階で町域が固まった点が異なる。
  first_attestation:
    era: 昭和30年
    year_western: 1955
    document: 美浜町の発足（河和町・野間町の合併）
    note: 町名は合併時に新たに付けられたもので、名前の初出は命名そのもの
  claims:
  - text: 昭和30年（1955）4月、河和・野間の両町が合併し、美浜町として発足した
    kind: fact
    level: E2
    status: established
    sources:
    - h5-aichi-mihama-gaiyo
  - text: 昭和32年（1957）3月に小鈴谷町の上野間地区が合併し、現在の美浜町域となった
    kind: fact
    level: E2
    status: established
    sources:
    - h5-aichi-mihama-gaiyo
  - text: 明治初期に15の村に分かれていた町域は、幾度かの合併を経て河和町と野間町になっていた
    kind: fact
    level: E2
    status: established
    sources:
    - h5-aichi-mihama-soukei
  - text: 『角川日本地名大辞典』愛知県は、町名の由来について、海に面しており美しい砂浜が見えることに由来する（瑞祥地名）と紹介している
    kind: fact
    level: E3
    status: established
    sources:
    - h5-aichi-mihama-wiki
  - text: 町域は伊勢湾と三河湾に囲まれた知多半島南部にあり、東西の両側が海に面する
    kind: fact
    level: E2
    status: established
    sources:
    - h5-aichi-mihama-soukei
  - text: 共通する層として、同名の福井県美浜町・和歌山県美浜町も1954年の合併で生まれた新設町であり、3町はいずれも「美しい浜」にちなむ命名と説明される、昭和の大合併期の同名町である
    kind: fact
    level: E2
    status: established
    sources:
    - h5-fukui-mihama-70th
    - h2-hidaka-wakayama-manabi
  - text: 異なる層として、愛知の美浜は合併の相手が村ではなく町同士（河和町・野間町）であり、発足の2年後に上野間地区が加わる二段階の成立だった点が、単一の合併で発足した福井・和歌山の美浜町と異なる
    kind: fact
    level: E2
    status: established
    sources:
    - h5-aichi-mihama-gaiyo
  - text: 総務省の全国地方公共団体コードで、美浜町の団体コードは234460と定められている
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 半島の両側が海、「美しい浜」は二つある
    text: 愛知の美浜町は、知多半島の南端近くで伊勢湾と三河湾の両方に面しています。西の伊勢湾側には野間の海岸、東の知多湾（三河湾）側には河和の港と砂浜があり、「海に面して美しい砂浜が見える」という辞典の説明は、半島のどちらの側から見ても成り立ちます。1955年に河和町と野間町という、別々の海に開いた二つの町が一つになったからこそ、半島全体を指す「美しい浜」という大きな名前が選ばれたとも読めます。
    sources:
    - h5-aichi-mihama-soukei
    - h5-aichi-mihama-wiki
  relations:
  - pref/23
  - muni/18-美浜町
  - muni/30-美浜町
  unknowns:
  - 命名が公募だったか、命名者や候補名など1955年当時の選定過程を示す町の公式記録は未確認
  - 『角川日本地名大辞典』愛知県の該当記述の原文（直接確認）は未了で、ここではそれを引用する二次資料経由の確認にとどまる
  updated: '2026-11-13'
- id: muni/24-明和町
  code: '244422'
  names:
    ja: 明和町
    reading: めいわちょう
    aliases:
    - 神郷町
    - 三和町
    - 斎明村
  user_terms:
  - 三重の明和町の由来
  - 斎宮のある明和町
  - 神郷町という幻の町名
  naming_type: 合併新設
  prefecture: 三重県
  homonyms:
  - muni/10-明和町
  summary: 多気郡の町で、1958（昭和33）年に三和町と斎明村が合併して成立した。合併の激論の末に町名が決まらず、暫定名「神郷町」として合併を行い、合併決議後の公募で「明和」が決まって発足と同時に改称したという、異例の経緯を持つ。「明和」の字は斎明村の「明」と三和町の「和」の合成と説明される。同名の群馬県明和町も公募命名だが、そちらは理念を掲げた瑞祥地名で、字の出どころの論理が異なる。
  first_attestation:
    era: 昭和33年
    year_western: 1958
    document: 公募による新町名「明和」の決定（神郷町の発足と同時の改称）
    note: 合併自体は暫定名「神郷町」で行われ、「明和」の初出は合併決議後の公募決定による改称である
  claims:
  - text: 昭和30年（1955）に大淀町・上御糸村・下御糸村が合併して三和町に、斎宮村と明星村が合併して斎明村になった
    kind: fact
    level: E2
    status: established
    sources:
    - h5-meiwa-mie-rekimachi
  - text: 昭和33年（1958）9月、三和町と斎明村の合併は、県の仲裁を要する激論の末に町名が決まらず、仮に「神郷町」として合併を行うことで決着した
    kind: fact
    level: E2
    status: established
    sources:
    - h5-meiwa-mie-rekimachi
  - text: 合併決議の後に新町名を公募した結果「明和」と決まり、神郷町発足と同時に明和町と改称したため、神郷町は実質的に発足の瞬間だけの暫定名となった
    kind: fact
    level: E2
    status: established
    sources:
    - h5-meiwa-mie-rekimachi
  - text: 町の文化財計画は「神郷」を「斎明村と三和町が合併し、明和町になるまでの暫定町名」と定義し、「斎明」は斎宮村と明星村が合併してできた地名であると定義している
    kind: fact
    level: E2
    status: established
    sources:
    - h5-meiwa-mie-bunka
  - text: 町名「明和」は、斎明村から「明」を、三和町から「和」をとって名付けられたと説明される
    kind: fact
    level: E4
    status: established
    sources:
    - h5-meiwa-mie-weblio
  - text: 共通する層として、同名の群馬県明和町も1950年代の合併で新名を公募により決めており、「公募で生まれた明和」という点は両町に共通する
    kind: fact
    level: E2
    status: established
    sources:
    - h5-meiwa-gunma-yurai
  - text: 異なる層として、群馬の明和が「明朗にして平和なる理想郷」という理念を表す瑞祥地名として選ばれたのに対し、三重の明和は前身2町村の名の字（斎明の「明」と三和の「和」）を組み合わせた合成名であり、暫定名「神郷町」を経た経緯も三重だけのものである
    kind: fact
    level: E2
    status: established
    sources:
    - h5-meiwa-mie-rekimachi
    - h5-meiwa-gunma-yurai
  - text: 総務省の全国地方公共団体コードで、明和町の団体コードは244422と定められている
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 発足の瞬間だけ存在した町名「神郷町」
    text: 1958年の合併は、町の場所をめぐる激論の末に県の仲裁でようやくまとまりましたが、新しい町の名前だけは決まりませんでした。そこで暫定的に「神郷町」として合併を行い、名前は後から公募することにしたのです。公募で「明和」と決まると、神郷町は発足と同時に明和町へ改称されました。つまり神郷町は、書類の上でのみ一瞬存在した「幻の町名」です。伊勢神宮の斎王の宮・斎宮の地であるこの地域で、「神」の字を持つ暫定名が生まれ、すぐに消えたことも、偶然にせよ象徴的です。
    sources:
    - h5-meiwa-mie-rekimachi
    - h5-meiwa-mie-bunka
  relations:
  - pref/24
  - muni/10-明和町
  unknowns:
  - 公募の応募総数や「明和」以外の候補名の一覧は未確認
  - 暫定名「神郷」の選定理由（伊勢神宮・斎宮との関係を意図したものか）は資料に明記がなく未確認
  - 「明は斎明、和は三和」の字配分を記した町史の原文の直接確認は未了（辞書サイト経由の確認にとどまる）
  updated: '2026-11-13'
- id: muni/24-朝日町
  code: '243434'
  names:
    ja: 朝日町
    reading: あさひちょう
    aliases:
    - 朝日村
  user_terms:
  - 朝日町の名前の由来
  - 三重の朝日町は天武天皇の故事
  - 読み方が「あさひちょう」の朝日町
  - 朝日町は山形と富山と三重にある
  naming_type: その他
  prefecture: 三重県
  homonyms:
  - muni/06-朝日町
  - muni/16-朝日町
  summary: 明治22年（1889年）に朝明郡の小向・柿・埋縄・縄生の村々をもって発足した朝日村が前身で、昭和29年（1954年）10月17日に単独で町制を施行して朝日町となった。町公式は、大海人皇子（後の天武天皇）が壬申の乱の際にこの近辺で朝日を拝んだという故事にあやかって命名されたと伝える。『日本書紀』には朝明郡迹太川のほとりで天照太神を望拝した記事があるが、迹太川を現在の朝明川とする比定には異説がある。
  first_attestation:
    era: 明治22年
    year_western: 1889
    document: 朝日村の発足（町村制施行、1889年4月1日）
    note: 自治体名としての「朝日」の初出。故事そのものの記録は『日本書紀』巻第二十八（720年成立）にさかのぼるとされる
  claims:
  - text: 明治22年（1889年）4月1日、町村制の施行により、朝明郡の小向村・柿村・埋縄村・当新田の区域の一部および縄生村の区域の一部をもって朝日村が発足した
    kind: fact
    level: E2
    status: established
    sources:
    - h4-mie-asahi-wikipedia
  - text: 町公式の「朝日町のあらまし」は、大海人皇子（後の天武天皇）が壬申の乱（672年）でこの近辺を通過した際に朝日を拝んだと言われており、この故事にあやかり明治22年（1889年）に「朝日村」が誕生し、昭和29年に町制施行で「朝日町」となったと伝える
    kind: legend
    level: E2
    status: established
    sources:
    - h4-mie-asahi-aramashi
  - text: 『朝日町史』（1974年）に基づく命名経緯の紹介によれば、村名について朝明郡長は「山添村」としたが、村側が申請した「朝明村」は郡と同名であるとして退けられ、舘通因に相談したところ天武天皇が縄生・小向の辺りで朝日を拝まれたという故事があると聞き、これに因んで「朝日村」として申請し、許可されるに至ったとされる
    kind: fact
    level: E2
    status: established
    sources:
    - h4-mie-asahi-wikipedia
  - text: 『日本書紀』巻第二十八には、大海人皇子が「朝明郡迹太川の辺（ほとり）で天照太神を望拝した」という趣旨の記事があり、故事には古典籍の裏付けがある。ただし故事の舞台を現在の朝日町内とするのは迹太川を現在の朝明川に比定する前提に立ち、この比定には異説があって確定していない
    kind: fact
    level: E2
    status: contested
    sources:
    - h4-mie-asahi-wikipedia
  - text: 昭和29年（1954年）10月17日、朝日村は合併せず単独で町制を施行して朝日町となった。町村合併促進法のもとで同村は合併の対象だったが、産業面のほか交通・文化に恵まれていたことから単独町制を選んだと町の広報は説明する
    kind: fact
    level: E2
    status: established
    sources:
    - h4-mie-asahi-koho
  - text: 【異なる層】3つの朝日町のうち三重の例だけが「朝日（太陽）」を直接の由来とし、山の名から取って公式に明示する富山県朝日町とも、大朝日岳の麓にありながら命名理由の明示がない山形県朝日町とも、命名の型が異なる
    kind: fact
    level: E2
    status: established
    sources:
    - h4-toyama-asahi-gaiyo
    - h4-yamagata-asahi-gikai
  column:
    title: 却下された2つの名前
    text: 「朝日村」の前には2つの落選案があった。郡長が推した「山添村」、村が申請した「朝明村」は郡と同じ名で却下。困って地元の碩学・舘通因に相談すると、『日本書紀』にある天武天皇の故事を教えてくれた。こうして生まれた「朝日村」は、以来130年以上、一度も合併せずに「朝日町」として続いている。
    sources:
    - h4-mie-asahi-wikipedia
  relations:
  - pref/24
  - muni/06-朝日町
  - muni/16-朝日町
  unknowns:
  - 迹太川の比定について、現在の朝明川とする説への異説の具体的内容は、久志本鉄也「壬申紀『迹太川』小考」（2013年）などの原典確認が必要
  - 『朝日町史』（1974年）原文での命名経緯の直接確認は未実施（Wikipediaが同書を引く紹介によって記録した）
  updated: '2026-11-13'
- id: muni/24-津市
  code: '242012'
  names:
    ja: 津市
    reading: つし
    aliases:
    - 安濃津
    - 津町
  user_terms:
  - 県庁所在地の津
  - 藤堂高虎の城下町
  - 日本三津の港町
  naming_type: 一部の地名
  prefecture: 三重県
  homonyms: []
  summary: 市名は「港」を意味する「津」に由来する。古代・中世の港「安濃津」の名が短縮され、江戸時代には藤堂家の城下町「津」として定着し、1889年の市制施行でそのまま市名となった。2006年の10市町村合併でも「津市」の名は継承された。
  first_attestation:
    era: 嘉保3年
    year_western: 1096
    document: 『中右記』嘉保3年12月9日条（裏書）
    note: 「安乃津」と表記され、地震・津波の被害記事として安濃津が文書に現れる早い確認例（『日本歴史地名大系』の整理による二次確認）。「津」単独の呼称は中世後期以降に現れる。
  claims:
  - text: 「津」は本来「港」を意味する言葉であり、津市議会の資料は、市の名が海上交通・交易の拠点を表す港に由来すると説明する。
    kind: fact
    level: E2
    status: established
    sources:
    - d-cap-tsu-gikai
  - text: 地名の歴史は安濃郡の港「安濃津」に始まると『日本歴史地名大系』は解説する。
    kind: fact
    level: E3
    status: established
    sources:
    - d-cap-tsu-kotobank
  - text: 安濃津は『中右記』嘉保3年（1096年）の裏書に「安乃津」と見えて地震・津波の記事があり、『兵範記』には「安濃津」、『玉葉』には「阿乃之津」とあるなど、平安時代後期以降の文書に散見する。
    kind: fact
    level: E3
    status: established
    sources:
    - d-cap-tsu-kotobank
  - text: 安濃津は博多津・坊津とともに日本三津とうたわれ、対外貿易の港町として栄えた。
    kind: fact
    level: E2
    status: established
    sources:
    - d-cap-tsu-gikai
  - text: 鎌倉後期には「津湊」とも呼ばれ、大永2年（1522年）の文書に「津四郷」、慶長13年（1608年）の藤堂高虎の文書に「津町中」とあるなど、近世には「津」の呼称が主流となって安濃津の用例は少なくなった。
    kind: fact
    level: E3
    status: established
    sources:
    - d-cap-tsu-kotobank
  - text: 江戸時代、津は藤堂高虎が安濃津城を改修した津城の城下町（32万3900石）として栄え、市名はこの城下町「津」を継ぐものである。
    kind: fact
    level: E2
    status: established
    sources:
    - d-cap-tsu-gikai
    - d-cap-tsu-castle
  - text: 1889年4月1日、全国の30市とともに日本で最初の市制が施行され、津市が誕生した。当時の人口は約2万7000人、面積は7.9平方キロであった。
    kind: fact
    level: E2
    status: established
    sources:
    - d-cap-tsu-mayor
    - d-cap-tsu-gikai
  - text: 2006年1月1日に津市・久居市・河芸町・芸濃町・美里村・安濃町・香良洲町・一志町・白山町・美杉村の10市町村が合併して新しい津市が誕生し、市名「津」は継承された。
    kind: fact
    level: E2
    status: established
    sources:
    - d-cap-tsu-gikai
  - text: 聖徳太子が四方に四天王寺を建立する企ての中で、当地の四天王寺を東の難波の四天王寺に対応させたという話が伝わるが、『日本歴史地名大系』はこの話を伝説の域を出ないとする。
    kind: legend
    level: E3
    status: established
    sources:
    - d-cap-tsu-kotobank
  - text: 津市の地方公共団体コードは242012である。
    kind: fact
    level: E2
    status: established
    sources:
    - d-cap-jlis-mie
  column:
    title: 「安濃津市」になりかけた津市
    text: 1889年の市制施行にあたって、津には「安濃津市」という名称案があった。古代以来の港のフルネームを復活させる案である。しかし実際に選ばれたのは、城下町として定着していた短い「津」の方だった。安濃津から津へという短縮は、鎌倉時代の「津湊」や近世の「津町中」といった用例が示すとおり、何百年もかけて進んだ流れの到着点だったといえる。
    sources:
    - d-cap-tsu-kotobank
  relations:
  - pref/24
  unknowns:
  - 郡名・郷名としての「安濃」自体の語源は、今回参照した範囲では確認できなかった。
  - 古代の安濃津の港湾施設の正確な範囲は、今回の調査では発掘成果まで確認していない。
  - 『中右記』の裏書記事は『日本歴史地名大系』経由の確認で、原典は未読である。
  updated: '2026-11-13'
- id: muni/25-大津市
  code: '252018'
  names:
    ja: 大津市
    reading: おおつし
    aliases:
    - 古津
    - 大津町
  user_terms:
  - 琵琶湖のほとりの県庁所在地
  - 大津宮のあった市
  - 京の外港だったまち
  naming_type: その他
  prefecture: 滋賀県
  homonyms: []
  summary: 市名は琵琶湖の港「大津」に由来する。667年に近江大津宮が置かれて都となったが、その廃絶後は「古津」と呼ばれ、794年の平安京遷都の詔で「先帝の旧都」として「大津」に復活した。以後は港町・宿場町の名として定着し、1898年の市制施行で大津市の名となった。
  first_attestation:
    era: 天智天皇6年
    year_western: 667
    document: 『日本書紀』天智天皇条（近江大津宮）
    note: 「大津」の名が都の宮号として現れる早い例。宮の廃絶後は「古津」と呼ばれ、794年に「大津」へ復した。原典は未読で、大津市の歴史文化資料等の紹介による二次確認にとどまる。
  claims:
  - text: 天智天皇6年（667年）に天智天皇は近江大津宮へ都を移し、大津には漏刻（水時計）や庠序（学校）を備えた都が置かれ、律令体制の基礎づくりが進められた。
    kind: fact
    level: E2
    status: established
    sources:
    - d-cap-otsu-rekibun
    - d-cap-otsu-ancient
  - text: 大津宮の廃絶後、この地は「古津」と呼ばれるようになったと百科事典は解説する。「古都の津」の意と解される。
    kind: fact
    level: E3
    status: established
    sources:
    - d-cap-otsu-furutsu
  - text: 古津と呼ばれるようになった理由には、672年の壬申の乱で大津宮が廃されたためとする説と、761年に瀬田川河口部の粟津が大津とされたため、旧来の大津が古津になったとする説がある。
    kind: fact
    level: E3
    status: contested
    sources:
    - d-cap-otsu-furutsu
  - text: 延暦13年（794年）、平安京遷都に際して出された詔には「近江国滋賀郡古津は先帝の旧都、今は輦下に接す。昔の号を追ひて大津と改称すべし」とあり、「大津」の名が復活したことが、『日本紀略』の記事や『日本後紀』逸文の引用を通じて確認できる。
    kind: fact
    level: E3
    status: established
    sources:
    - d-cap-otsu-furutsu
    - d-cap-heian-edict
  - text: 「大津」は辞典では「船が多く泊まる処」を意味する語としても立項されており、琵琶湖の水運の要衝であった当地の性格を表す名であった。
    kind: fact
    level: E3
    status: established
    sources:
    - d-cap-otsu-kotobank
  - text: 江戸時代の大津（大津宿・現在の大津・浜大津地区）は、東海道五十三次の宿場の中でも最大の人口を有するほどの賑わいを見せ、北国の物資が集散する港町の機能をあわせ持っていた。
    kind: fact
    level: E2
    status: established
    sources:
    - d-cap-otsu-chushin
  - text: 1898年10月1日に大津町へ市制が施行され、大津市が成立した。当時の面積は14.20平方キロ、人口は3万2446人であった。
    kind: fact
    level: E2
    status: established
    sources:
    - d-cap-otsu-databook
  - text: 大津宮の所在地は現在の大津市錦織一帯（近江大津宮錦織遺跡）とされ、往時の都の中心は現在の市街地の北部にあたる。
    kind: fact
    level: E2
    status: established
    sources:
    - d-cap-otsu-ancient
  - text: 天智天皇7年（668年）に崇福寺建立のための地ならしをしている際、銅鐸が発見されたという伝承や、石山寺建立の際に銅鐸が出土したという伝承が残されている。
    kind: legend
    level: E2
    status: established
    sources:
    - d-cap-otsu-rekibun
  - text: 大津市の地方公共団体コードは252018である。
    kind: fact
    level: E2
    status: established
    sources:
    - d-cap-jlis-shiga
  column:
    title: 消えた都の名前を取り戻した町
    text: 都が去った後の大津は、「古津」と呼ばれるようになってしまった。ところが794年、桓武天皇が平安京へ遷都した際の詔は、新京を平安京と名付け、国名を山背から山城へ改める話と並べて、近江の古津を「先帝の旧都」として「大津」に戻すことを命じていた。新都の命名と旧都の名の復活は、同じ一つの詔の中で同時に行われたのである。いまの大津市の名は、このとき取り戻された名前である。
    sources:
    - d-cap-otsu-furutsu
    - d-cap-heian-edict
  relations:
  - pref/25
  - muni/26-京都市
  unknowns:
  - 宮号「大津宮」が先にあったのか、港の地名「大津」が先にあったのかは、今回参照した資料では確定できなかった。
  - 『日本紀略』の古津改称記事は百科事典・辞典経由の確認で、原典は未読である。
  updated: '2026-11-13'
- id: muni/25-日野町
  code: '253839'
  names:
    ja: 日野町
    reading: ひのちょう
    aliases:
    - 日野御牧
    - 日野市
  user_terms:
  - 日野町 日野御牧
  - 日野商人の町
  - 蒲生氏郷の城下町
  naming_type: その他
  prefecture: 滋賀県
  homonyms:
  - muni/31-日野町
  summary: 「日野」の名は天喜4年（1056年）の文書に法成寺領「日野御牧」として現れるのが初出とされ、中世には市場町「日野市」を経て蒲生氏の城下町となり、近江商人（日野商人）の町として発展した。明治22年（1889年）に日野町が発足し、昭和30年（1955年）の合併でも名が継承された。鳥取県の日野町が郡名を採用した新設町であるのとは成立の事情が異なる。
  first_attestation:
    era: 天喜4年
    year_western: 1056
    document: 東大寺使神成則請文
    note: 藤原摂関家ゆかりの法成寺領「日野御牧」としての登場。町公式の文化財保存活用地域計画が「日野の由来」として紹介するもの
  claims:
  - text: 町公式資料によれば、「日野」という名称が初めて歴史に登場するのは天喜4年（1056年）で、「東大寺使神成則請文」の中に藤原摂関家ゆかりの法成寺領「日野御牧」として登場する
    kind: fact
    level: E2
    status: established
    sources:
    - h6-hino-shiga-keikaku
  - text: 応永33年（1426年）には、四本商人の一つである保内商人が伊勢との交易の拠点として「日野市」で商売を行った記録が残り、この「日野市」がのちに蒲生氏の城下町「日野町」へと発展した
    kind: fact
    level: E2
    status: established
    sources:
    - h6-hino-shiga-keikaku
  - text: 16世紀初頭、蒲生定秀が「日野市」付近に中野城を築いて城下町を整備し、日野は蒲生氏の支配の拠点となった。日野はのちに近江商人（日野商人）の発祥地として知られる
    kind: fact
    level: E2
    status: established
    sources:
    - h6-hino-shiga-keikaku
    - h6-hino-shiga-wiki
  - text: 昭和30年（1955年）3月16日、日野町・東桜谷村・西桜谷村・西大路村・鎌掛村・南比都佐村・北比都佐村の1町6村が合併して現在の日野町が誕生した。町名は1889年に発足した日野町の名の継承である
    kind: fact
    level: E2
    status: established
    sources:
    - h6-hino-shiga-keikaku
  - text: 鳥取県の日野町は昭和34年（1959年）に郡名「日野」を採って新設された町であり、滋賀の日野が中世の御牧・市場町以来の地名を継承してきた点で、名の継承経路が異なる（異なる層）
    kind: fact
    level: E2
    status: established
    sources:
    - h6-hino-shiga-keikaku
    - h6-hino-tottori-wiki
  - text: 「日野」という語そのものの語源（なぜ「日野」と呼ばれるようになったか）は、町公式資料も初出の紹介にとどまっており、確定していない
    kind: fact
    level: E2
    status: indeterminate
    sources:
    - h6-hino-shiga-keikaku
  column:
    title: 御牧からはじまる商人の町
    text: 日野の名は、平安時代の馬の放牧地「日野御牧」として史料に現れます。それが中世には「日野市」という市場町の名となり、戦国期には蒲生氏郷の父祖の城下町となり、江戸時代には近江商人・日野商人を生む在郷町になりました。御牧→市場→城下町→商人の町と、名前は同じ「日野」のまま、中身が何度も入れ替わってきた町です。特産の「日野菜」（漬物で知られるカブ）も、この町の名を全国に運んだものの一つです。
    sources:
    - h6-hino-shiga-keikaku
    - h6-hino-shiga-wiki
  relations:
  - pref/25
  - muni/31-日野町
  unknowns:
  - 「日野」の語源（日野御牧の名の由来）は未確定
  - 日野御牧の範囲と現在の町域との対応の詳細は未確認
  updated: '2026-11-13'
- id: muni/26-京都市
  code: '261009'
  names:
    ja: 京都市
    reading: きょうとし
    aliases:
    - 平安京
    - 京
    - 京師
  user_terms:
  - 千年の都
  - 平安京のあった市
  - 古都
  naming_type: その他
  prefecture: 京都府
  homonyms: []
  summary: 市名は都の名「京都」の継承である。その基盤は794年に桓武天皇が命名した平安京で、1000年余り都であり続けた歴史の上に「京都」の名が成り立っている。1889年の市制施行により京都市が誕生した。
  first_attestation:
    era: 延暦13年
    year_western: 794
    document: 『日本後紀』逸文（延暦13年11月8日の詔）
    note: 都の名「平安京」の命名そのものを伝える詔文。本文は散逸し、逸文としての引用経由で確認した。都市名「京都」が固有名詞として定着するのはこれより後の時代である。
  claims:
  - text: 延暦13年（794年）10月22日に桓武天皇が新京へ移り、同月28日に遷都の詔が下された。
    kind: fact
    level: E2
    status: established
    sources:
    - d-cap-kyoto-nenpyo
  - text: 同年11月8日、新京は「平安京」と名付けられ、あわせて国名が「山背国」から「山城国」に改められた。
    kind: fact
    level: E2
    status: established
    sources:
    - d-cap-kyoto-nenpyo
  - text: 『日本後紀』の逸文として伝わるこの詔には「此の国は山河襟帯し、自然に城をなす。此の勝によりて新号を制むべし」と地形を評した上で、「子来の民、謳歌の輩、異口同辞に号して平安京と曰ふ」と、集まった人々が口々に平安京と呼んだことが記される形になっている（辞典の引用による確認）。
    kind: fact
    level: E3
    status: established
    sources:
    - d-cap-heian-edict
  - text: 平安京は唐の長安を手本とした東西約4.5キロ、南北約5.2キロの条坊制の都で、大内裏から南の羅城門まで朱雀大路（現在の千本通）がまっすぐ通された。
    kind: fact
    level: E2
    status: established
    sources:
    - d-cap-kyoto-kodomo
  - text: 平安京は延暦13年（794年）に定められてから明治のはじめまで1000年余りの間、日本の政治・経済・文化の中心として発展した。
    kind: fact
    level: E2
    status: established
    sources:
    - d-cap-kyoto-fu-tokei
  - text: 1889年4月1日、市制施行により京都市が誕生したが、東京・大阪とともに市制特例が適用され、市長は置かれず京都府知事が市長の職務を兼務した。
    kind: fact
    level: E2
    status: established
    sources:
    - d-cap-kyoto-jichi
    - d-cap-kyoto-aramashi
  - text: 市制特例の撤廃を求める運動の末、1898年10月15日に初代市長が就任して市役所が開庁した。京都市はこの日を自治記念日としている。
    kind: fact
    level: E2
    status: established
    sources:
    - d-cap-kyoto-jichi
  - text: 平安京の中心だった大内裏は現在の市街地の北西寄りにあたり、朱雀大路は現在の千本通にあたるなど、都の骨格は現在の町並みに残っている。一方で右京は湿地が多く人が住みにくかったため、人々は左京へ移り、都市の発展は東側に偏った。
    kind: fact
    level: E2
    status: established
    sources:
    - d-cap-kyoto-kodomo
  - text: 京都市の地方公共団体コードは261009である。
    kind: fact
    level: E2
    status: established
    sources:
    - d-cap-jlis-kyoto
  column:
    title: 一つの詔が動かした三つの名前
    text: 794年11月8日の詔は、一度に三つの名前を動かした。新京は「平安京」と名付けられ、国名は「山背国」から「山城国」へ改められ、そして近江の「古津」は先帝の旧都として「大津」に戻された。いま京都市の名に残っているのは宮都の名「平安京」ではなく、都そのものを指す「京都」の方だが、その出発点はこの日の命名にある。
    sources:
    - d-cap-kyoto-nenpyo
    - d-cap-heian-edict
  relations:
  - pref/26
  - muni/25-大津市
  unknowns:
  - 『日本後紀』の詔文は散逸した本文の逸文としての引用経由でしか確認しておらず、伝存形態の詳細は未確認である。
  - 平安京の選地にまつわる将軍塚の伝承などは、今回参照した市公式資料では確認できなかったため収録していない。
  - 「京都」が固有名詞として平安京を指すようになった過程の詳細は、都道府県レコード（pref/26）側の調査に委ね、本レコードでは平安京の命名と市制施行以降を中心に記録した。
  updated: '2026-11-13'
- id: muni/27-大阪市
  code: '271004'
  names:
    ja: 大阪市
    reading: おおさかし
    aliases:
    - 大坂
    - 小坂
  user_terms:
  - 天下の台所
  - 大坂のまち
  - 商都
  naming_type: 一部の地名
  prefecture: 大阪府
  homonyms: []
  summary: 市名は城下町・大坂の名の継承である。地名「大坂」は蓮如の御文章を最古の用例として本願寺の寺内町とともに広まり、江戸時代を通じて「大坂」表記が主流だったが、明治10年ごろ「大阪」の表記に落ち着いた。その過程の途上で、1889年に大阪市が発足した。
  first_attestation:
    era: 明応5年
    year_western: 1496
    document: 蓮如『御文』（御文章）
    note: 大阪市公式が「文献に残る最古」とする「攝州東成郡生玉之庄内大坂」の用例。明応7年（1498年）の蓮如の消息を初見とする資料もあり、年には揺れがある（pref/27でも対立として記録）。
  claims:
  - text: 大阪市公式は、市名のいわれには諸説がありはっきりしないとしつつ、文献に残る最古の「大坂」は、室町時代に石山本願寺を建てた蓮如の御文章に書かれた「攝州東成郡生玉之庄内大坂」であると説明する。
    kind: fact
    level: E2
    status: established
    sources:
    - d-cap-osaka-city-name
  - text: 当時の文献には「大坂」とも「小坂」とも記され、いずれもオサカと発音されていたと思われると大阪市公式は説明する。
    kind: fact
    level: E2
    status: established
    sources:
    - d-cap-osaka-city-name
  - text: 江戸時代には「大坂」が多く使われ「大阪」も混用されてきたが、明治10年ごろになって、ようやく「大阪」に落ち着いた。
    kind: fact
    level: E2
    status: established
    sources:
    - d-cap-osaka-city-name
  - text: もともと「坂」と「阪」は同字で、「阪」から「坂」の字が生まれたとされ、1868年に大阪府が設置されてからも両表記は混用されていたが、明治10年代には「大阪」が一般的になった。
    kind: fact
    level: E2
    status: established
    sources:
    - d-cap-osaka-ndl
  - text: 「坂の字は土に反る（土に帰る）ので不吉として忌み、『阪』を用いるようになった」という説明が流布しているが、これは文化5年（1808年）の『摂陽落穂集』が「坂は不吉な文字として忌み嫌う人もおり、阪をもちいる人もいた」と記す言い伝えに由来するもので、改字を命じた公的記録によるものではない。
    kind: legend
    level: E2
    status: contested
    sources:
    - d-cap-osaka-ndl
  - text: 1889年4月1日、大阪府の東区・南区・西区・北区の4つの区の区域に市制が施行され、大阪市が誕生した。この年に全国で39の市が成立している。
    kind: fact
    level: E2
    status: established
    sources:
    - d-cap-osaka-tayori
  - text: 市制特例により当初の大阪市には市役所ができず、府の知事が市長の職務を行い、府の書記官が助役の職務を行った。
    kind: fact
    level: E2
    status: established
    sources:
    - d-cap-osaka-tayori
  - text: 1898年10月、市制特例の廃止を受けて田村太兵衛が初代大阪市長に就任した。
    kind: fact
    level: E2
    status: established
    sources:
    - d-cap-osaka-nenpyo
  - text: 「大坂」の語源そのものについては、大阪市公式も「いろいろな説がありはっきりとしていません」と述べており、確定していない。
    kind: fact
    level: E2
    status: indeterminate
    sources:
    - d-cap-osaka-city-name
  - text: 大阪市の地方公共団体コードは271004である。
    kind: fact
    level: E2
    status: established
    sources:
    - d-cap-jlis-osaka
  column:
    title: 府も市も、名前の表記が固まる前に生まれた
    text: 大阪府の設置は1868年、大阪市の誕生は1889年。ところが「大阪」という表記が一般的になったのは明治10年代のこととされる。つまり府も市も、「大坂」と書くか「大阪」と書くかがまだ定まらないうちに発足していたことになる。しかも字の古さでいえば、もともと坂と阪は同字で、阪から坂が生まれたというから、表記の移行は「新しい字への変更」というより「古い字への回帰」に近い。
    sources:
    - d-cap-osaka-ndl
    - d-cap-osaka-tayori
  relations:
  - pref/27
  - muni/26-京都市
  unknowns:
  - 「大坂」の語源は大阪市公式も確定していないとしており、本レコードでも諸説の決着には至らなかった。
  - 蓮如の用例の年（1496年か1498年か）は資料により異なり、原典での確定には至っていない。
  updated: '2026-11-13'
- id: muni/27-太子町
  code: '273813'
  names:
    ja: 太子町
    reading: たいしちょう
    aliases: []
  user_terms:
  - 太子町 聖徳太子のお墓
  - 叡福寺のある町
  - 王陵の谷の町
  naming_type: 合併新設
  prefecture: 大阪府
  homonyms:
  - muni/28-太子町
  summary: 昭和31年（1956年）に磯長村と山田村が合併した際、聖徳太子にちなんで命名された町。町内には聖徳太子御廟（叡福寺）があり、天皇陵が集まる「王陵の谷」の中心に位置する。兵庫県の太子町も聖徳太子ゆかりを理由とする命名で、この層は共通するが、大阪側の根拠は太子の墓所そのものが町内にあることにある。
  first_attestation:
    era: 昭和31年
    year_western: 1956
    document: 磯長村・山田村の合併による太子町の発足（1956年9月30日）
    note: 町名としての初出。地名「太子」自体は旧磯長村の大字名として先行する
  claims:
  - text: 町公式プロフィールによれば、昭和31年（1956年）9月30日に磯長村と山田村が合併し、「聖徳太子にちなんで太子町と名付けられた」
    kind: fact
    level: E2
    status: established
    sources:
    - h6-taishi-osaka-profile
  - text: 町内には聖徳太子御廟（叡福寺）があり、敏達・用明・推古・孝徳の各天皇陵とあわせて「梅鉢御陵」と総称され、一帯は天皇・皇族級の古墳が集中する「王陵の谷」と呼ばれる
    kind: fact
    level: E2
    status: established
    sources:
    - h6-taishi-osaka-profile
  - text: 旧磯長村の大字には「太子」があり、現在も太子町の大字として残る。町名は、合併地に先行するこの地名の側からも受け継がれた形になっている
    kind: fact
    level: E5
    status: established
    sources:
    - h6-taishi-osaka-wiki
  - text: 兵庫県の太子町も、聖徳太子ゆかりの町であることを理由に昭和26年（1951年）の合併で命名されており、「聖徳太子にちなむ合併時の命名」という層は共通する（共通する層）
    kind: fact
    level: E2
    status: established
    sources:
    - h6-taishi-osaka-profile
    - h6-taishi-hyogo-wiki
  - text: 両町の違いは根拠の置きどころにあり、大阪側は聖徳太子の御廟（墓所）そのものが町内にあるのに対し、兵庫側は太子が寄進を受けた荘園（鵤荘）と斑鳩寺の伝承が根拠である（異なる層）
    kind: fact
    level: E2
    status: established
    sources:
    - h6-taishi-osaka-profile
    - h6-taishi-hyogo-ikaruga
  - text: 飛鳥時代、この一帯は大和の「遠つ飛鳥」に対して「近つ飛鳥」と呼ばれ、推古天皇によって整備された大道（のちの竹内街道）が通っていた
    kind: fact
    level: E2
    status: established
    sources:
    - h6-taishi-osaka-profile
  column:
    title: 王陵の谷の真ん中で
    text: 太子町は「天皇のお墓だらけの町」です。敏達・用明・推古・孝徳の4天皇陵と聖徳太子御廟を合わせて「梅鉢御陵」と呼び、一帯は「王陵の谷」と呼ばれます。飛鳥の都に近い「近つ飛鳥」として、皇族の墓所が集中的に営まれた土地でした。1956年の命名は、この御廟の存在を町の看板に据えたもの。兵庫県の太子町が「太子ゆかりの荘園」を看板にするのと並べると、同じ聖徳太子でも「墓」と「荘園」という対照が見えてきます。
    sources:
    - h6-taishi-osaka-profile
  relations:
  - pref/27
  - muni/28-太子町
  unknowns:
  - 大字「太子」の名がいつ・どのように御廟にちなんで付けられたかの記録は未確認
  - 1956年の合併時に他の候補名があったかどうかは未確認
  updated: '2026-11-13'
- id: muni/28-太子町
  code: '284645'
  names:
    ja: 太子町
    reading: たいしちょう
    aliases:
    - 鵤荘
  user_terms:
  - 太子町 斑鳩寺の町
  - 鵤荘の町
  - 太子町 兵庫 由来
  naming_type: 合併新設
  prefecture: 兵庫県
  homonyms:
  - muni/27-太子町
  summary: 昭和26年（1951年）に斑鳩町・石海村・太田村が合併して生まれた町で、町名は聖徳太子ゆかりの町であることから付けられた。その根拠は、推古14年（606年）に聖徳太子が寄進を受けたと伝わる荘園「鵤荘」と、その中核寺院・斑鳩寺である。大阪府の太子町も聖徳太子にちなむ命名だが、根拠が御廟の所在地である点が異なる。
  first_attestation:
    era: 昭和26年
    year_western: 1951
    document: 斑鳩町・石海村・太田村の合併による太子町の誕生（1951年4月1日）
    note: 町名としての初出。合併前の町名「斑鳩町」も聖徳太子ゆかりの名だった
  claims:
  - text: 昭和26年（1951年）4月1日、斑鳩町と石海村・太田村が合併して太子町が誕生した（昭和30年には龍田村を編入）
    kind: fact
    level: E5
    status: established
    sources:
    - h6-taishi-hyogo-wiki
  - text: 町名は、聖徳太子ゆかりの町であることから付けられた
    kind: fact
    level: E5
    status: established
    sources:
    - h6-taishi-hyogo-wiki
  - text: 町公式資料によれば、推古14年（606年）、聖徳太子は推古天皇の御前で勝鬘経を講話した功により播磨国揖保郡の水田百町を寄進され、その地を「鵤荘」と名付けて伽藍を建てたのが斑鳩寺の始まりで、斑鳩寺はのちに法隆寺に寄付され、その荘園として栄えた
    kind: fact
    level: E2
    status: established
    sources:
    - h6-taishi-hyogo-ikaruga
  - text: 『日本書紀』推古14年条には、聖徳太子が法華経の講義を行ったため天皇から播磨国の水田100町を与えられ、斑鳩寺（法隆寺）領として納めたとあり、この地は「鵤荘」と呼ばれて現在の町域に当たるとされる
    kind: fact
    level: E5
    status: established
    sources:
    - h6-taishi-hyogo-wiki
  - text: 大阪府の太子町も聖徳太子にちなむ合併時の命名という点は共通するが、根拠は御廟（墓所）の所在地であることであり、兵庫側の荘園・寺院の伝承とは異なる（異なる層）。また兵庫側は合併前の町名も「斑鳩町」で、二代続けて太子ゆかりの名を選んでいる
    kind: fact
    level: E5
    status: established
    sources:
    - h6-taishi-hyogo-wiki
    - h6-taishi-osaka-profile
  - text: 町内の檀特山の山頂にある大きな岩のくぼみは、応神天皇の御沓・御杖の跡、または聖徳太子が馬に乗って登り修行をした時についた蹄の跡と言い伝えられている
    kind: legend
    level: E5
    status: established
    sources:
    - h6-taishi-hyogo-wiki
  column:
    title: 二代続けて太子の名を選んだ町
    text: 1951年の合併で太子町が生まれる前、この土地の中心は「斑鳩町」でした。斑鳩も聖徳太子を象徴する名（法隆寺のある大和の斑鳩）です。つまりこの町は、斑鳩町から太子町へ、二代続けて聖徳太子ゆかりの名を選び続けたことになります。その土台は、606年に太子が水田百町を寄進されて「鵤荘」と名付けたと伝わる荘園と、法隆寺領として千年近く続いた斑鳩寺の歴史です。大阪の太子町が「太子の墓の町」なら、こちらは「太子の荘園の町」です。
    sources:
    - h6-taishi-hyogo-wiki
    - h6-taishi-hyogo-ikaruga
  relations:
  - pref/28
  - muni/27-太子町
  unknowns:
  - 1951年の合併時に「太子町」の名を選んだ協議の記録（候補名の有無など）は未確認
  - 鵤荘の範囲と現在の町域がどの程度一致するかは資料により幅がある
  updated: '2026-11-13'
- id: muni/28-神戸市
  code: '281000'
  names:
    ja: 神戸市
    reading: こうべし
    aliases:
    - 神戸村
    - 神戸区
    - かんべ
  user_terms:
  - 生田神社のまち
  - 兵庫津の隣の港町
  - 開港で育った港町
  naming_type: 一部の地名
  prefecture: 兵庫県
  homonyms: []
  summary: 市名は生田神社の神戸（かんべ）の集落名に由来する。神社に属して神社を支えた民戸の居住地が「神戸村」となり、1868年の開港で港町として発展し、1889年に神戸市が発足した。読みはもとの「かんべ」から「こうべ」へ変化した。
  first_attestation:
    era: 神功皇后摂政元年（伝承）
    year_western: null
    document: 『日本書紀』神功皇后条
    note: 生田神社の創祀を伝える記事で、神戸の地名伝承の起点とされる。ただし地名「神戸」そのものの文書上の初出ではなく、その年代は未確認である。
  claims:
  - text: 「神戸」の名称は生田神社の神戸（かんべ）に由来すると辞典類は解説する。神戸（かんべ）とは、神社に属して租・庸・調や雑役を神社に納めた民戸（神封戸）のことである。
    kind: fact
    level: E3
    status: established
    sources:
    - d-cap-kobe-kotobank
  - text: 神戸市の資料も、古代、神領で神社を支えていた家のことを「かんべ」（神戸）といい、神戸の地名は生田神社の「かんべ」に由来すると伝わると説明する。
    kind: fact
    level: E2
    status: established
    sources:
    - d-cap-kobe-ikuta
  - text: 地名の読みは、もとの「かんべ」から「かうべ」を経て、現在の「こうべ」へと変化した。
    kind: fact
    level: E3
    status: established
    sources:
    - d-cap-kobe-kotobank
  - text: 修好通商条約で開港が定められたのは兵庫津だったが、実際の開港場と外国人居留地は神戸村に置かれ、慶応3年12月7日（西暦1868年1月1日）に開港した。
    kind: fact
    level: E2
    status: established
    sources:
    - d-cap-kobe-port
    - d-cap-kobe-archives
  - text: 1879年の郡区制実施に伴い、兵庫・神戸に坂本村を加えた「神戸区」が置かれ、現在の神戸市の原型となる行政単位が形成された。
    kind: fact
    level: E2
    status: established
    sources:
    - d-cap-kobe-archives
  - text: 1889年4月1日、神戸区に荒田村と葺合村を加えて神戸市が誕生した。
    kind: fact
    level: E2
    status: established
    sources:
    - d-cap-kobe-archives
  - text: 開港前の神戸村は、現在の神戸市中央区の元町通三丁目から生田川へかけての一帯にあたる小さな村であった。
    kind: fact
    level: E4
    status: established
    sources:
    - d-cap-kobe-motomachi
  - text: 生田神社は、神功皇后により布引の滝付近にある砂山に祀られたことが始まりと『日本書紀』に記される伝承があり、799年の大洪水により砂山が崩壊したため、現在の地に移されたと伝えられる。
    kind: legend
    level: E2
    status: established
    sources:
    - d-cap-kobe-ikuta
  - text: 神戸市の地方公共団体コードは281000である。
    kind: fact
    level: E2
    status: established
    sources:
    - d-cap-jlis-hyogo
  column:
    title: 「神戸」は「かんべ」だった
    text: 「神戸」という字面からは「神の戸」を想像しがちだが、もとの読みは「かんべ」である。神社に属し、神社の維持にあたった家々を神戸（神封戸）といい、生田神社の神戸の集落がそのまま地名になった。読みは「かうべ」を経て「こうべ」に変わったが、字は古代の制度の名をそのまま残している。開港地として世界に知られるようになった港町の名前は、実は律令時代の神社の戸籍に由来する。
    sources:
    - d-cap-kobe-kotobank
    - d-cap-kobe-ikuta
  relations:
  - pref/28
  unknowns:
  - 地名「神戸」が文書に現れる初出の年代は、今回参照した市公式・辞典資料では特定できなかった。
  - 生田神社の神戸がどの程度の規模の集落をなし、いつ「神戸村」として定着したかなど、成立過程の詳細は未確認である。
  updated: '2026-11-13'
- id: muni/29-奈良市
  code: '292010'
  names:
    ja: 奈良市
    reading: ならし
    aliases:
    - 奈良町
    - 平城
    - 南都
    - 那羅
  user_terms:
  - 平城京のあった市
  - 南都と呼ばれたまち
  - 古都奈良の中心
  naming_type: 一部の地名
  prefecture: 奈良県
  homonyms: []
  summary: 市名は古都「奈良」の地名の継承である。もとの「ナラ」の地は現在の京都府境の丘陵一帯だったと推測され、平城京・南都・奈良町を経て地域の名として定着し、1898年に奈良町へ市制が施行されて奈良市となった。「なら」の語源には地形説・古代朝鮮語説などの諸説がある。
  first_attestation:
    era: 崇神天皇の条（伝承）
    year_western: null
    document: 『日本書紀』崇神天皇条
    note: 「那羅山」の名が見える伝説的記事で、奈良市公式資料が「奈良のはじまり」として紹介する起点。年代を特定できる史実の初出ではない。「那良」の表記は『古事記』（712年）にも見える。
  claims:
  - text: 奈良市は1898年（明治31年）に奈良町へ市制が施行されて成立した。
    kind: fact
    level: E2
    status: established
    sources:
    - d-cap-nara-chiiki
  - text: 奈良町は1889年の市制町村制の施行により、添上郡のうち江戸時代以来の奈良各町と周辺の村々を合わせて成立した町である。
    kind: fact
    level: E2
    status: established
    sources:
    - d-cap-nara-chiiki
  - text: 記紀（『古事記』・『日本書紀』）など古代の文献の記述から、もともとの「ナラ」の地は今日の京都府との境に広がる丘陵一帯だったと推測でき、現在の奈良市の中心部とは位置がずれている。
    kind: fact
    level: E2
    status: established
    sources:
    - d-cap-nara-plan
  - text: 「ナラ」の語源には、古代人の住居に適したなだらかな丘陵地を意味する平地（なるじ）、平（なら）などの地形語に由来するとする説がある。
    kind: fact
    level: E2
    status: contested
    sources:
    - d-cap-nara-plan
    - d-cap-nara-genjo
  - text: 「ナラ」の語源には、渡来人の居住地を古代の朝鮮で国を意味する「ナラ」と名付けたことから起こったとする説もあり、奈良市自身も由来には諸説あると説明している。
    kind: fact
    level: E2
    status: contested
    sources:
    - d-cap-nara-plan
  - text: 「ナラ」には那羅・奈良・奈羅・楢・平城・乃楽・寧楽などの漢字があてられ、奈良時代の官用には主に「平城」と記述され、平安時代以降は「奈良」が広く用いられるようになった。
    kind: fact
    level: E2
    status: established
    sources:
    - d-cap-nara-genjo
  - text: 和銅3年（710年）に藤原京から平城京へ都が移され、70年あまりの間、平城京は古代日本の都として栄えた。
    kind: fact
    level: E2
    status: established
    sources:
    - d-cap-nara-ayumi
  - text: 都が移った後、奈良の町は平城京の「外京」と呼ばれる地域を中心に形成され、残された東大寺・興福寺などの門前に人が集まって「まち」ができ、のちに奈良は「南都」と呼ばれるようになった。
    kind: fact
    level: E2
    status: established
    sources:
    - d-cap-nara-naramachi
  - text: 『日本書紀』崇神天皇の条には、大彦命と彦国葺の軍が武埴安彦の軍を迎え撃つため陣を布いたとき、兵士たちが草木を踏みならしたので、その山を那羅山といったという伝説が載せられている。
    kind: legend
    level: E2
    status: established
    sources:
    - d-cap-nara-genjo
  - text: 奈良市の地方公共団体コードは292010である。
    kind: fact
    level: E2
    status: established
    sources:
    - d-cap-jlis-nara
  column:
    title: 「ナラ」のふるさとは、いまの市街地の北にある
    text: 奈良市の総合計画は、記紀の記述から、もともとの「ナラ」の地を「今日の京都府との境に広がる丘陵一帯」と推測している。平城京が置かれた盆地の中心より北、現在の奈良市の縁にあたる一帯である。名前はそこから南へ広がり、平城京、南都、奈良町を経て、市の名前になった。地名の原点と現在の中心がずれている、日本でも典型的な例の一つである。
    sources:
    - d-cap-nara-plan
    - d-cap-nara-naramachi
  relations:
  - pref/29
  unknowns:
  - 「ナラ」の語源は諸説あり定説はなく、本レコードでは奈良市の説明に沿って地形説と古代朝鮮語説を併記した。楢の木に由来する説は今回の市公式資料では確認できなかった。
  - もとの「ナラ」の範囲の推測は記紀の記述に基づくもので、考古学的な確定には至っていない。
  updated: '2026-11-13'
- id: muni/29-川上村
  code: '294527'
  names:
    ja: 川上村
    reading: かわかみむら
    aliases: []
  user_terms:
  - 川上村 吉野川の源流
  - 水源地の村
  - 後南朝の村
  naming_type: 合併新設
  prefecture: 奈良県
  homonyms:
  - muni/20-川上村
  summary: 吉野川（紀の川）の最上流部に位置する村で、日本歴史地名大系は「吉野川の川上の村」と位置づける。明治22年（1889年）に23村の区域をもって発足した。長野県の川上村とは「大河の最上流部」という命名の構造だけが共通し、川も歴史も無関係である。村には惟高親王の木地伝承、義経伝説、後南朝の史跡と伝承が濃く残る。
  first_attestation:
    era: 明治22年
    year_western: 1889
    document: 町村制施行による川上村の発足（1889年4月1日）
    note: 村名として確認できる初出。地域名としての「川上」の古い用例は未確認
  claims:
  - text: 日本歴史地名大系は川上村を「吉野川の川上の村」と位置づける。村名は吉野川の最上流部にあたる立地によるものである
    kind: fact
    level: E3
    status: established
    sources:
    - h6-kawakami-kotobank
  - text: 明治22年（1889年）4月1日、東川村・西河村・大滝村・寺尾村・北塩谷村・迫村・高原村・人知村・白屋村・井戸村・武木村・下多古村・上多古村・神之谷村・柏木村・北和田村・中奥村・上谷村・大迫村・伯母谷村・入之波村・白川渡村・碇村の23村の区域をもって川上村が発足した
    kind: fact
    level: E5
    status: established
    sources:
    - h6-kawakami-nara-wiki
  - text: 長野県の川上村も大河（千曲川）の最上流部の村であり、両村の名は「大きな川の川上（上流）」という普通名詞的な命名の構造を共有するが、対象の川も地域の歴史も無関係である（共通する層＝命名の構造のみ）
    kind: fact
    level: E3
    status: established
    sources:
    - h6-kawakami-kotobank
  - text: 村は吉野杉を育てる吉野林業の中心地で、村自身は吉野川源流の「水源地の村づくり」（川上宣言）を掲げている
    kind: fact
    level: E2
    status: established
    sources:
    - h6-kawakami-nara-wiki
    - h6-kawakami-nara-official
  - text: 木地師（轆轤師）の祖とされる惟高親王が、貞観9年（867年）に高原地区に入って木地の製法を教えたといわれている
    kind: legend
    level: E2
    status: established
    sources:
    - h6-kawakami-nara-official
  - text: 白屋地区には、もと「白谷」と称していた地名を、源義経が八幡神社に矢を奉納したことから「白矢」と改めたという言い伝えが残されている
    kind: legend
    level: E2
    status: established
    sources:
    - h6-kawakami-nara-official
  column:
    title: 南朝の夢を見続ける村
    text: 川上村は後南朝の舞台でした。村公式の歴史によれば、南北朝の合一後も皇位の約束を守られなかった南朝の皇子たちがこの山深い村に潜幸し、嘉吉3年（1443年）に崩御したとされます。その皇子・自天王を偲ぶ「朝拝式」は、560年あまり経った今も毎年2月5日に続いているといいます。吉野川の源流の村が、都から最も遠い場所で、都の記憶を最も長く守ってきた――「川上」という素朴な名の奥にある、もう一つの顔です。
    sources:
    - h6-kawakami-nara-official
  relations:
  - pref/29
  - muni/20-川上村
  unknowns:
  - 「川上」という地域名の初出（中世に吉野川上流部を指す呼称があったか）は未確認
  - 村内にある丹生川上神社上社の社名と村名の先後関係・影響関係は未確認
  updated: '2026-11-13'
- id: muni/29-川西町
  code: '293610'
  names:
    ja: 川西町
    reading: かわにしまち
    aliases:
    - 川西村
  user_terms:
  - 川西町の名前の由来
  - 奈良の川西町は結崎ネブカと貝ボタンの町
  - 面塚の伝説の町
  - 川西町は山形と奈良にある
  naming_type: その他
  prefecture: 奈良県
  homonyms:
  - muni/06-川西町
  summary: 明治22年（1889年）に結崎・下永・吐田・唐院・梅戸・保田の6村が合併して川西村が誕生し、昭和50年（1975年）4月に町制を施行して川西町となった。町は大和盆地のほぼ中央にあり、4つの河川が集まって大和川に注ぐ地点に位置するが、「川西」がどの川の西を指すのか、命名理由を記した町の公表資料は確認できなかった。「最上川の西側」と公式に明言する山形県川西町とは対照的に、由来未確認の同名地名である。
  first_attestation:
    era: 明治22年
    year_western: 1889
    document: 川西村の発足（町村制施行。川西町公式「町の歴史」）
    note: 自治体名としての「川西」の初出
  claims:
  - text: 明治22年（1889年）に結崎・下永・吐田・唐院・梅戸・保田の6ヶ村が合併して川西村が誕生し、昭和50年（1975年）4月に町制が施行されて川西町がスタートした
    kind: fact
    level: E2
    status: established
    sources:
    - h4-nara-kawanishi-rekishi
  - text: 町公式は、川西町が大和盆地のほぼ中央に位置し、4つの河川が一同に集結して大和川に注ぐ水辺の町であると説明する
    kind: fact
    level: E2
    status: established
    sources:
    - h4-nara-kawanishi-gaiyo
  - text: 「川西」がどの川の西側を指すのかは、町公式の歴史・概要の両ページに説明がなく、今回の調査では確認できなかった。町域の大部分は大和川の南にあたるため、単純な方位の名とも断定できない
    kind: fact
    level: E2
    status: indeterminate
    sources:
    - h4-nara-kawanishi-rekishi
    - h4-nara-kawanishi-gaiyo
  - text: 町内の面塚には「空から能面とネギが降ってきた」という伝説が残り、その能面を葬った場所とも考えられていると奈良県町村会は紹介する。伝説に残るネギは、現在は特産品「結崎ネブカ」として親しまれている
    kind: legend
    level: E4
    status: established
    sources:
    - h4-nara-chousonkai
  - text: 結崎は、観阿弥・世阿弥を輩出した「結崎座」をルーツとする能楽・観世流発祥の地と伝えられ、面塚には昭和11年（1936年）に観世流宗家による揮毫の「観世発祥之地」の碑が建てられたと奈良県町村会は紹介する
    kind: fact
    level: E4
    status: established
    sources:
    - h4-nara-chousonkai
  - text: 【異なる層】山形県川西町は「最上川の西側に位置することから、川西町と名づけられました」と町公式が由来を明示するのに対し、奈良県川西町は同名でありながら命名理由の公表資料が確認できず、由来の確かさで対照をなす
    kind: fact
    level: E2
    status: established
    sources:
    - h4-yamagata-kawanishi-gaiyo
    - h4-nara-kawanishi-rekishi
  column:
    title: 空から面とネギが降ってきた町
    text: 奈良の川西町には、空から能面とネギが降ってきたという伝説がある。面は面塚に葬られたとされ、ネギは「結崎ネブカ」として今も町の特産品だ。結崎は観阿弥・世阿弥を生んだ結崎座の本拠で、観世流発祥の地と伝えられる。町の名の由来は分からなくても、町の物語はこんなに豊かである。
    sources:
    - h4-nara-chousonkai
  relations:
  - pref/29
  - muni/06-川西町
  unknowns:
  - 「川西」の命名理由と、どの川の西を指すのかは、町の公表資料と地名辞典のオンライン抜粋では未確認（『日本歴史地名大系』奈良県巻や町史の確認が必要）
  - 1889年の合併前の各村（結崎・下永・吐田・唐院・梅戸・保田）の地名の由来は本バッチの対象外
  updated: '2026-11-13'
- id: muni/30-和歌山市
  code: '302015'
  names:
    ja: 和歌山市
    reading: わかやまし
    aliases:
    - 若山
  user_terms:
  - 紀州徳川家の城下町
  - 和歌浦のまち
  - 和歌山城のある市
  naming_type: その他
  prefecture: 和歌山県
  homonyms: []
  summary: 市名は和歌山城の城下町名の継承である。紀の川河口の漁村「若山」に豊臣秀長が築城した際、秀吉が名勝・和歌浦にちなんで「和歌山」と命名したと市の資料は伝える。紀州徳川家の城下町として栄え、1889年に旧城下町を継承する形で和歌山市が発足した。
  first_attestation:
    era: 天正13年
    year_western: 1585
    document: 羽柴秀吉書状（「和歌山」の初出として県・市の資料が紹介）
    note: 書状そのものは都道府県レコード（pref/30）側で市長コラム経由により確認しており、本レコードでは市の沿革資料の紹介による確認にとどまる。
  claims:
  - text: 紀の川河口に点在していた島々が出水のたびに流出される土砂によって陸続きとなり、そこに「若山」という小漁村が生まれた。
    kind: fact
    level: E2
    status: established
    sources:
    - d-cap-wakayama-tokei
  - text: 天正13年（1585年）、豊臣秀吉が紀伊の国を統一し、その命を受けた豊臣秀長が若山の中央部、吹上の峰（岡山、現在の虎伏山）に築城した。
    kind: fact
    level: E2
    status: established
    sources:
    - d-cap-wakayama-tokei
    - d-cap-wakayama-jo
  - text: 「和歌山」の命名については、秀吉は古代からの名勝地「和歌浦」にちなんで「和歌山」と命名したと和歌山市の沿革資料は説明し、和歌山県教育センターの郷土学習資料は、秀吉が和歌浦に相対する山に築くその城を「和歌山城」と命名したことに由来するといわれている、と伝える。
    kind: fact
    level: E2
    status: contested
    sources:
    - d-cap-wakayama-tokei
    - d-cap-wakayama-kyoiku
  - text: 命名のもととなった和歌浦は、城の築かれた山と相対する位置にある景勝地で、現在の市街地の南、和歌浦湾に面している。
    kind: fact
    level: E2
    status: established
    sources:
    - d-cap-wakayama-kyoiku
    - d-cap-wakayama-tokei
  - text: 元和5年（1619年）、徳川頼宣が紀州和歌山55万5千石で和歌山城に入城し、徳川御三家の一つ「紀州徳川家」の城下町として繁栄した。
    kind: fact
    level: E2
    status: established
    sources:
    - d-cap-wakayama-tokei
  - text: 明治22年（1889年）に市制町村制が実施され、旧城下町を継承する形で和歌山市が発足し、以後県庁所在地として発展した。
    kind: fact
    level: E2
    status: established
    sources:
    - d-cap-wakayama-fuchi
  - text: 市名「和歌山」は、城の名・城下町名として定着した名の継承であり、県名も同じ城下町名「和歌山」に由来する。
    kind: fact
    level: E2
    status: established
    sources:
    - d-cap-wakayama-tokei
  - text: 和歌山市公式は、日前宮や、神武東征神話で天皇の兄・彦五瀬命が死んだ湊といわれる雄ノ湊、その兄を葬ったと伝えられる竃山など、記紀神話の舞台が市内にたくさん見えるとしつつ、これらの神話は史実ではなく虚構の話であると明記している。
    kind: legend
    level: E2
    status: established
    sources:
    - d-cap-wakayama-ayumi
  - text: 和歌山市の地方公共団体コードは302015である。
    kind: fact
    level: E2
    status: established
    sources:
    - d-cap-jlis-wakayama
  column:
    title: 漁村「若山」に「和歌」を載せた命名
    text: もとの漁村の名前は「若山」だった。市の沿革資料によれば、秀吉は築城にあたって、古代以来の名勝「和歌浦」の「和歌」を採って「和歌山」と命名したという。歌枕として知られた景勝地の名声を、新しい城と町に移植する命名だった。この名は城下町から県へ、そして市へと受け継がれ、400年以上使われ続けている。
    sources:
    - d-cap-wakayama-tokei
    - d-cap-wakayama-kyoiku
  relations:
  - pref/30
  unknowns:
  - 秀吉による命名を直接示す同時代の命令文書は確認できておらず、命名の説明は市・県の資料が「伝える」形のものであるため、主張は contested とした。
  - 漁村「若山」の名自体の由来（「若の浦」との関係など）は、今回参照した資料では確認できなかった。
  updated: '2026-11-13'
- id: muni/30-広川町
  code: '303623'
  names:
    ja: 広川町
    reading: ひろがわちょう
    aliases:
    - 広町
    - 南広村
    - 津木村
  user_terms:
  - 和歌山の広川町の由来
  - 稲むらの火の広川町
  - 広川という川の名前の町
  naming_type: 合併新設
  prefecture: 和歌山県
  homonyms:
  - muni/40-広川町
  summary: 有田郡の町で、昭和30年（1955）に広町・南広村・津木村の合併で発足した。町の由来は公式に「旧三か町村を流れて海に注ぐ当地最大の河川『広川』の名称を採ったもの」と説明される、川名採用型の合併新名である。読みは1996年に「ひろかわちょう」から「ひろがわちょう」へ変更された。同名の福岡県広川町も川名にちなむが、そちらは1889年以来3村すべてが名乗った既存地名の継承であり、成立の仕組みが正反対に近い。
  first_attestation:
    era: 昭和30年
    year_western: 1955
    document: 広川町の発足（1町2村の合併、川名の採用）
    note: 町名としての初出は1955年の命名。川名「広川」自体はそれ以前からの河川名で、町域は古く「広庄」と呼ばれた
  claims:
  - text: 昭和30年（1955）4月1日に広町・南広村・津木村の1町2村が合併して広川町が発足した
    kind: fact
    level: E2
    status: established
    sources:
    - h5-hirogawa-wakayama-gaiyo
  - text: 町の由来について町は、旧三か町村を流れて海に注ぐ当地最大の河川「広川」の名称を採ったものと説明している
    kind: fact
    level: E2
    status: established
    sources:
    - h5-hirogawa-wakayama-gaiyo
  - text: 県の郷土学習資料も、3町村を通じて流れる広川の名前をとって町名を広川町に決定したと記す
    kind: fact
    level: E2
    status: established
    sources:
    - h5-wakayama-manabi-hirogawa
  - text: 『日本歴史地名大系』は広川を「全長20km、有田郡内2位の河川」と記す
    kind: fact
    level: E3
    status: established
    sources:
    - h5-hirogawa-kotobank
  - text: 町の概要によれば、文献では広川町全域は古代末期から中世初期にかけて「広庄」と呼ばれていた
    kind: fact
    level: E2
    status: established
    sources:
    - h5-hirogawa-wakayama-gaiyo
  - text: 1996（平成8）年に町名の読みが「ひろかわ」から「ひろがわ」に変更された
    kind: fact
    level: E3
    status: established
    sources:
    - h5-hirogawa-kotobank
  - text: 共通する層として、同名の福岡県広川町も「広川」という川の名にちなむ町名であり、両町とも町の中心地帯を同名の川が流れる
    kind: fact
    level: E2
    status: established
    sources:
    - h5-hirogawa-fukuoka-masterplan
  - text: 異なる層として、和歌山では合併前の自治体名に「広川」は一つもなく（広町・南広村・津木村）、川名を新たに町名に採ったのに対し、福岡では1889年以来、上・中・下の3村すべてが「広川」を名乗っており、町名は既存地名の継承である。また読みも和歌山は「ひろがわちょう」、福岡は「ひろかわまち」と異なる
    kind: fact
    level: E2
    status: established
    sources:
    - h5-hirogawa-fukuoka-enkaku
  - text: 地方公共団体情報システム機構（J-LIS）のコード一覧で、広川町の団体コードは303623とされている
    kind: fact
    level: E2
    status: established
    sources:
    - d-cap-jlis-wakayama
  column:
    title: 川の名前をもらった町、「稲むらの火」のふるさと
    text: 広川町は1955年に川の名前をもらって生まれましたが、その川のほとりの広村は、それより約100年前の1854年、安政の大地震と大津波の舞台でした。醤油職人の濱口梧陵は、津波から村人を逃がすため、刈り取ったばかりの稲むらに火を放って高台へ誘導したと伝えられ、小泉八雲が「稲むらの火」として世界に紹介しました。梧陵が私財を投じて築いた広村堤防は今も町に残ります。町名は新しいのに、土地の記憶は幕末にまで遡る。それが広川町の地名の二層構造です。
    sources:
    - h5-hirogawa-wakayama-goryo
    - h5-hirogawa-wakayama-gaiyo
  relations:
  - pref/30
  - muni/40-広川町
  unknowns:
  - 川名「広川」そのものの語源（川幅の広さに由来するか等）を記した資料は未確認
  - 中世の「広庄」の「広」と川名「広川」の関係は未確認
  updated: '2026-11-13'
- id: muni/30-日高町
  code: '303828'
  names:
    ja: 日高町
    reading: ひだかちょう
    aliases:
    - 内原村
    - 志賀村
    - 比井崎村
  user_terms:
  - 日高町 和歌山
  - 日高郡の日高町
  - 日高川の郡の日高
  naming_type: 合併新設
  prefecture: 和歌山県
  homonyms:
  - muni/01-日高町
  summary: 和歌山県日高郡の町。昭和29年（1954）に内原村・志賀村・比井崎村が合併し、「日高地方の中心的存在になるようにとの願いをこめて」日高町と命名された。その背後にある日高郡は古代律令制以来の郡名で、日高川という川の名も郡名による。明治新設の日高国に由来する北海道日高町とは、国名系と郡名系という対照をなす。
  first_attestation:
    era: 大宝3年
    year_western: 703
    document: 『続日本紀』（「飯高」として）
    note: 地元の郷土史料が紹介する形での確認で、原文は未読。天平宝字8年（764）の条には日高郡の文字があるとも紹介される
  claims:
  - text: 昭和29年（1954）に内原村・志賀村・比井崎村が合併して日高町が発足し、町名は「日高地方の中心的存在になるようにとの願いをこめて」命名された
    kind: fact
    level: E2
    status: established
    sources:
    - h2-hidaka-wakayama-manabi
  - text: 地元の郷土史料は、『続日本紀』大宝3年（703）の条に「飯高」（日高のこと）の名が見え、天平宝字8年（764）の条に日高郡の文字があると紹介する
    kind: fact
    level: E4
    status: established
    sources:
    - h2-hidaka-wakayama-chimei
  - text: 「日高」の語源は確定していない。『紀伊続風土記』は名義を「日の高く天の真秀に坐して照り輝く」と説明する一方、喜田貞吉は「ヒダ」を大和民族以外の人々を指す語、「カ」を所在地を示す語と解する説を唱えた
    kind: fact
    level: E3
    status: contested
    sources:
    - h2-kotobank-hidakagun
    - h2-hidaka-wakayama-chimei
  - text: 日高川の川名は、郡の名（日高郡）による。つまり郡名が先にあり、川の名がそれに付いた
    kind: fact
    level: E3
    status: established
    sources:
    - h2-kotobank-hidakagawa
  - text: 日高郡は紀伊国の郡として古代以来続き、現在も日高町・御坊市・美浜町・由良町・印南町・日高川町を含む郡として残る
    kind: fact
    level: E3
    status: established
    sources:
    - h2-kotobank-hidakagun
  - text: 同名の比較（異なる層）：和歌山の日高は古代の日高郡という郡名の継承であり、北海道の日高（明治2年・1869年に新設された日高国に由来する地方名）とは出発点が異なる。国名系（北海道）と郡名系（和歌山）の対照である
    kind: fact
    level: E2
    status: established
    sources:
    - h2-hidaka-wakayama-manabi
    - h2-hidaka-hok-gyokaku
  - text: 同名の比較（共通する層）：読みは北海道日高町と同じ「ひだかちょう」である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 郡の名が、川の名になり、町の名になった
    text: ふつう川の名が郡や町の名になるものだが、日高では順序が逆で、郡名「日高」が先にあり、日高川の名は郡名によるのだという。その日高川は、安珍・清姫の伝説と道成寺で知られる川でもある。1300年以上続く郡の名は、1954年の合併で町の名にもなった。「日高地方の中心に」という願いを込めた命名は、古代の郡名に新しい役割を与えたものだった。
    sources:
    - h2-kotobank-hidakagawa
    - h2-hidaka-wakayama-manabi
    - h2-kotobank-hidakagun
  relations:
  - pref/30
  - muni/01-日高町
  unknowns:
  - 「日高」の語源は未確定（紀伊続風土記の名義説明と喜田貞吉の語源説などがあり対立）
  - 『続日本紀』大宝3年条の「飯高」が日高を指すことは郷土史料の紹介による確認で、原文は未読
  updated: '2026-11-13'
- id: muni/30-美浜町
  code: '303810'
  names:
    ja: 美浜町
    reading: みはまちょう
    aliases:
    - 松原村
    - 和田村
    - 三尾村
  user_terms:
  - 和歌山の美浜町の由来
  - 煙樹ヶ浜のある美浜町
  - 公募で決まった町名 美浜
  naming_type: 合併新設
  prefecture: 和歌山県
  homonyms:
  - muni/18-美浜町
  - muni/23-美浜町
  summary: 日高郡の町で、昭和29年（1954）に松原村・和田村・三尾村の合併で誕生した。町名は一般公募により名付けられ、自慢の煙樹ヶ浜と松林を指す「美しい浜のある町」という願いが込められたことが、県の郷土学習資料に明記されている。同名の福井県・愛知県の美浜町と「美しい浜」型の命名で共通するが、公募の経緯が公的資料に残るのは3町のうち和歌山だけである。
  first_attestation:
    era: 昭和29年
    year_western: 1954
    document: 公募による命名と美浜町の発足（3村の合併・町制施行）
    note: 町名は合併時の公募で新たに付けられたもので、名前の初出は命名そのもの
  claims:
  - text: 1954（昭和29）年10月1日に松原村・和田村・三尾村の3村が合併して、美浜町が誕生した
    kind: fact
    level: E2
    status: established
    sources:
    - h2-hidaka-wakayama-manabi
  - text: 町名はその時に一般公募により名付けられた
    kind: fact
    level: E2
    status: established
    sources:
    - h2-hidaka-wakayama-manabi
  - text: 命名には、地域の誰もが自慢とする煙樹ヶ浜と松林を指して「美しい浜のある町」という町民の願いが込められた
    kind: fact
    level: E2
    status: established
    sources:
    - h2-hidaka-wakayama-manabi
  - text: 共通する層として、同名の福井県美浜町・愛知県美浜町も1954〜55年の合併で生まれた新設町であり、3町はいずれも「美しい浜」にちなむ命名と説明される
    kind: fact
    level: E2
    status: established
    sources:
    - h5-fukui-mihama-70th
    - h5-aichi-mihama-gaiyo
  - text: 異なる層として、命名が公募だったことと、その理由（煙樹ヶ浜への願い）が県の郷土学習資料に明記されている点で、命名理由の説明が分かれたり選定過程が未確認だったりする福井・愛知の美浜町と、記録の残り方が異なる
    kind: fact
    level: E2
    status: established
    sources:
    - h2-hidaka-wakayama-manabi
  - text: 総務省の全国地方公共団体コードで、美浜町の団体コードは303810と定められている
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 「美しい浜のある町」を、町民の願いとして公募した
    text: 和歌山の美浜町の名前は、1954年の合併のときに一般公募で決まりました。県の郷土学習資料は、町民が自慢とする煙樹ヶ浜と松林を挙げ、「美しい浜のある町 美浜町」という願いを込めた名付けだったと伝えています。同名の美浜町が全国に3つある中で、なぜその名にしたのかを公募の言葉で説明できるのはこの町だけです。煙樹ヶ浜は今も松林が続く町の象徴で、名前と風景がそのまま重なっています。
    sources:
    - h2-hidaka-wakayama-manabi
  relations:
  - pref/30
  - muni/18-美浜町
  - muni/23-美浜町
  unknowns:
  - 公募の応募総数・候補名・選考経過を示す一次記録（町史・合併協議会記録）の確認は未了
  - 三尾地区の「アメリカ村」（カナダ移民の歴史）と町名の関係の有無は未確認（町名は煙樹ヶ浜に由来するとされ、移民史との直接の結びつきは資料にない）
  updated: '2026-11-13'
- id: muni/31-南部町
  code: '313891'
  names:
    ja: 南部町
    reading: なんぶちょう
    aliases: []
  user_terms:
  - 南部町の名前の由来
  - 南部町はなぜ南部という名前
  - 西伯町と会見町が合併した町
  naming_type: 合併新設
  prefecture: 鳥取県
  homonyms:
  - muni/02-南部町
  - muni/19-南部町
  summary: 2004年に西伯町と会見町が合併して発足した新名。町議会の公式概要は「南部」という名称について、古くから周辺地域一帯の住民に親しまれた由緒ある地域名であることと、「南」の字の暖かいイメージが新町の方向性に合致したことを理由として明記する。南部氏とは無関係で、青森県・山梨県の南部町とは由来を異にする。
  first_attestation:
    era: 平成16年
    year_western: 2004
    document: 自治体名としての「南部町」（西伯町・会見町合併による）
    note: 地域名としての「南部」の古い用例や指していた範囲は、確認した公式資料では示されず未確認
  claims:
  - text: 2004年10月1日に西伯町と会見町が合併して南部町が誕生した
    kind: fact
    level: E2
    status: established
    sources:
    - h3-tottori-gaiyo
  - text: 町議会の概要は「『南部』という名称は、古くからこの周辺地域一帯の住民にも親しまれ、歴史的にも文化的にも伝統と由緒ある名称であるとともに、南の文字が持つ暖かいイメージが新町の方向性と合致しています」と説明する
    kind: fact
    level: E2
    status: established
    sources:
    - h3-tottori-gikai
  - text: 青森県・山梨県の南部町の「南部」が南部氏に由来するのに対し、本町の「南部」は合併前の両町を含む周辺地域の旧来の地域名を新町名に採用したもので、氏族名とは別系統である
    kind: fact
    level: E2
    status: established
    sources:
    - h3-tottori-gikai
    - h3-yamanashi-yukari
  - text: 読みは青森県・山梨県の南部町と同じ「なんぶちょう」で、3町は読みまで一致するが、由来は一致しない
    kind: fact
    level: E2
    status: established
    sources:
    - h3-tottori-gikai
    - b-cap-chiba-soumu-code
  - text: 総務省「地方公共団体コード一覧」では本町のコードは313891とされる
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 「南」の字が持つ暖かさ
    text: 新町名の理由に「南の文字が持つ暖かいイメージ」を挙げるのは、平成期の合併新名としては率直な部類です。古くから親しまれた地域名という由緒と、字のイメージという2つの理由が公式資料に併記されている点が、この町の命名の記録として特徴的です。
    sources:
    - h3-tottori-gikai
  relations:
  - pref/31
  - muni/02-南部町
  - muni/19-南部町
  unknowns:
  - 「南部」という地域名が具体的にいつ頃から、どの範囲を指して使われたか
  - 合併協議会での新町名の候補一覧と選定過程の詳細
  updated: '2026-11-13'
- id: muni/31-日野町
  code: '314021'
  names:
    ja: 日野町
    reading: ひのちょう
    aliases: []
  user_terms:
  - 日野町 日野郡の町
  - 根雨と黒坂の合併した町
  - 日野川の町
  naming_type: 合併新設
  prefecture: 鳥取県
  homonyms:
  - muni/25-日野町
  summary: 昭和34年（1959年）に根雨町と黒坂町が合併して生まれた町で、町名は所属する郡の名「日野郡」を採ったもの。「日野」の名自体は『出雲国風土記』にまで遡るとされる古い地名で、郡名・日野川の名として受け継がれてきた。滋賀県の日野町が地名そのものを中世から継承してきたのとは経路が異なる。日野川の語源は諸説あり定まっていない。
  first_attestation:
    era: 天平5年
    year_western: 733
    document: 出雲国風土記（仁多郡条）
    note: 「日野」の地名の史料上の初見とされるもの（日野町の解説による二次的な紹介）。言及される範囲は現在の町域と必ずしも一致しない
  claims:
  - text: 「日野」の地名の史料上の初見は『出雲国風土記』（733年）とされ、仁多郡の条で言及されている。その後『倭名類聚抄』には、日野郡の一郷として記載されている
    kind: fact
    level: E5
    status: established
    sources:
    - h6-hino-tottori-wiki
  - text: 昭和34年（1959年）5月1日、日野郡根雨町・黒坂町が合併して日野町が発足した。町名は郡名「日野」をそのまま自治体名にした形である
    kind: fact
    level: E5
    status: established
    sources:
    - h6-hino-tottori-wiki
  - text: 日野川の語源は定説がなく、『出雲国風土記』大原郡斐伊郷条にある樋速日子命の故事から、国境の鳥髪山（船通山）を境に、出雲国を流れるのが斐伊川、伯耆国を流れるのが日野川だとする説がある。日野川は「簸之川」とも書かれた
    kind: fact
    level: E5
    status: contested
    sources:
    - h6-hinogawa-wiki
  - text: 日野神社の所在地や日野氏の居住地に由来する説もあるが、『日野郡史』によると川の名前が先であることが明白で、この説の信憑性は低いとされる
    kind: fact
    level: E5
    status: contested
    sources:
    - h6-hinogawa-wiki
  - text: 滋賀県日野町は中世の「日野御牧」以来の地名を町名として継承してきたのに対し、鳥取県日野町は1959年に郡名を採用して命名された町であり、「日野」の名の継承経路が異なる（異なる層）
    kind: fact
    level: E5
    status: established
    sources:
    - h6-hino-tottori-wiki
    - h6-hino-shiga-keikaku
  - text: ヤマタノオロチが住む「ひの川」は、島根県の斐伊川ではなく鳥取県の日野川だという説が伝えられている
    kind: legend
    level: E5
    status: established
    sources:
    - h6-hinogawa-wiki
  column:
    title: 二つの「ヒの川」と一つの郡名
    text: 鳥髪山（船通山）という国境の山を挟んで、西へ流れれば「斐伊川」、東へ流れれば「日野川」。どちらも読みの頭は「ヒ」で、語源をたどると『出雲国風土記』の樋速日子命の故事に行き着くという説があります。日野町という町名は1959年の合併で生まれた新しい名ですが、その材料になった郡名「日野」は、風土記の時代からこの地域に貼りついてきた古い名です。新しく作られた町名と、千年以上続く地名の、二層構造になっています。
    sources:
    - h6-hinogawa-wiki
    - h6-hino-tottori-wiki
  relations:
  - pref/31
  - muni/25-日野町
  unknowns:
  - 日野郡・日野川の名の由来は諸説のままで、確定できる資料は未確認
  - 『出雲国風土記』仁多郡条の「日野」への言及箇所の原文確認は未実施
  updated: '2026-11-13'
- id: muni/31-鳥取市
  code: '312011'
  names:
    ja: 鳥取市
    reading: とっとりし
    aliases: []
  user_terms:
  - 鳥取の名前の由来
  - 鳥取砂丘のある市の名前
  - 因幡の城下町の名前
  naming_type: 藩名
  prefecture: 鳥取県
  homonyms: []
  summary: 市名は鳥取藩の城下町・鳥取町を引き継ぐ。「鳥取」は因幡国邑美郡の古代郷名で、久松山麓の平野部にいた鳥取部（ととりべ）という職業集団に由来すると市は説明する。明治22年（1889年）10月1日に市制を施行し、平成16年（2004年）の合併で現在の鳥取市となった。
  first_attestation:
    era: 承平年間
    year_western: null
    document: 和名類聚抄
    note: 因幡国邑美郡の郷名「鳥取」の記載。鳥取市公式資料の紹介経由で参照し、原文は未読。職業集団としての鳥取部そのものは、それ以前の『日本書紀』に説話として見える
  claims:
  - text: 鳥取市の地方公共団体コードは312011である（総務省「全国地方公共団体コード」市区町村コード一覧による）
    kind: fact
    level: E2
    status: established
    sources:
    - e-cap-soumu-code-list
  - text: 「鳥取」は因幡国邑美郡鳥取郷という古代の郷名に由来し、『倭名抄（和名類聚抄）』に記載された郷名が中世・近世・近代へと受け継がれてきたと鳥取市は説明する
    kind: fact
    level: E2
    status: established
    sources:
    - e-tottori-city-history
    - e-cap-wamyosho
  - text: 鳥取郷は久松山麓一帯の平野部であったと考えられ、この地に「鳥取部」という古代の部民（職業集団）がいたことが郷名の由来といわれている
    kind: fact
    level: E2
    status: established
    sources:
    - e-tottori-city-history
  - text: 鳥取は江戸時代、鳥取藩池田家32万石の城下町として栄えた
    kind: fact
    level: E2
    status: established
    sources:
    - e-cap-tottori-city-enkaku
  - text: 鳥取市は明治22年（1889年）10月1日に市制を施行した
    kind: fact
    level: E2
    status: established
    sources:
    - e-cap-tottori-city-enkaku
    - e-tottori-city-history
  - text: 平成16年（2004年）11月1日、国府町・福部村・河原町・用瀬町・佐治村・気高町・鹿野町・青谷町との合併により、人口20万人を超える新「鳥取市」が誕生した
    kind: fact
    level: E2
    status: established
    sources:
    - e-tottori-city-history
    - e-cap-tottori-city-enkaku
  - text: 『日本書紀』垂仁天皇の条には、言葉を発しなかった誉津別王（本牟智和気御子）が白鳥を見て初めて声を上げ、天湯河板挙がその鳥を追って捕らえた功により鳥取造の姓を賜り鳥取部が定められた、という起源説話が記されている
    kind: legend
    level: E2
    status: established
    sources:
    - e-hannan-city-tottori
    - e-cap-nihonshoki
  column:
    title: 郷・城下町・市が同じ場所で重なる鳥取
    text: 鳥取の名前は、移動していない。古代の鳥取郷は久松山麓一帯の平野部にあったと鳥取市は説明するが、その同じ山麓に戦国期の鳥取城が築かれ（天正元年・1573年に山名豊国が天守櫓を築いて「城下町鳥取」が生まれたと市の沿革は記す）、江戸時代には池田家32万石の城下町が広がった。古代の郷名が、城下町名・藩名・県名を経て、そのまま市名として現在の中心市街地に残っている例であり、名前と場所が一緒に千年以上受け継がれてきたことが鳥取の地名の特徴である。
    sources:
    - e-tottori-city-history
    - e-cap-tottori-city-enkaku
  relations:
  - pref/31
  unknowns:
  - 鳥取郷の正確な範囲（久松山麓一帯の平野部とされるが、郷域を特定できる一次文書は確認していない）
  - 『日本書紀』の白鳥説話と因幡国鳥取郷の成立を直接結ぶ同時代資料は確認できておらず、両者の関係は未確認（県レコード pref/31 と同じ論点）
  updated: '2026-11-13'
- id: muni/32-松江市
  code: '322016'
  names:
    ja: 松江市
    reading: まつえし
    aliases: []
  user_terms:
  - 松江の名前の由来
  - 松江城の城下町の名前
  - 宍道湖のほとりの市の名前
  - 松山と間違えやすい市の名前
  naming_type: 新規命名
  prefecture: 島根県
  homonyms: []
  summary: 市名は慶長16年（1611年）、堀尾吉晴が亀田山に松江城を築き、中世以来の町場だった白潟と末次を合わせて「松江」と称したことに始まると松江市は説明する。ただし命名を記した根本史料は残っておらず、命名者や「唐の松江」にあやかったとする由来には諸説があり、市の史料調査も定説はないと結論づけている。愛媛県の松山市とは読みが似るが、成立の事情はまったく異なる。
  first_attestation:
    era: 慶長16年
    year_western: 1611
    document: 松江城の完成に伴う城下町の命名（松江市公式「生いたち」）
    note: 命名の出来事としての初出。命名そのものを記した同時代の根本史料は確認されておらず、命名の伝えは『懐橘談』（1653年）などの近世史料による
  claims:
  - text: 松江市の地方公共団体コードは322016である（総務省「全国地方公共団体コード」市区町村コード一覧による）
    kind: fact
    level: E2
    status: established
    sources:
    - e-cap-soumu-code-list
  - text: 松江市公式サイトは、地名の由来は慶長16年（1611年）に堀尾吉晴が亀田山に城を築き、白潟と末次の二つの郷をあわせて松江と称したことにはじまると説明する
    kind: fact
    level: E2
    status: established
    sources:
    - e-cap-matsue-city-gaiyo
  - text: 命名を記した根本的な史料は残っておらず、『松江市史』でも名称由来は特段取り上げられておらず、定説はないと松江市の史料調査コラムは整理している
    kind: fact
    level: E2
    status: established
    sources:
    - e-cap-matsue-city-chosa26
  - text: 松江藩儒・黒澤石斎が承応2年（1653年）に書いた『懐橘談』は、白潟と末次を併せたこの地が唐の松江に地形が似て鱸魚（すずき）・蓴菜（じゅんさい）が多いことから、先の国守・堀尾忠氏が富田城から城を移して「松江」と名付けた、と伝える
    kind: fact
    level: E2
    status: contested
    sources:
    - e-cap-matsue-city-chosa26
    - e-cap-kaikitsudan
  - text: 命名者については近世史料の間で一致せず、『懐橘談』の堀尾忠氏のほか、小瀬甫庵とするもの、堀尾吉晴の命を受けた圓城寺開山・春龍和尚とする『雲陽誌』などがあり、諸説が併存する
    kind: fact
    level: E2
    status: contested
    sources:
    - e-cap-matsue-city-chosa26
  - text: 開府以前から「松江」という言葉が見えたとする説もあり、『太平記』などに「松江」の表記があるが、それが地名ではなく形容詞だという見方もあり、城下町以前の地名としての「松江」の存在は確定していない
    kind: fact
    level: E2
    status: indeterminate
    sources:
    - e-cap-matsue-city-chosa26
  - text: 城下町に取り込まれた白潟（意宇郡）と末次（島根郡）は中世以来の町場・港町で、新しい城下町はこの水陸の要衝を併せる形で形成された
    kind: fact
    level: E2
    status: established
    sources:
    - e-cap-matsue-city-chosa26
  - text: 松江市は明治22年（1889年）4月に市制を施行した（当時の市域は4.78平方キロメートル、人口は35,513人だった）
    kind: fact
    level: E2
    status: established
    sources:
    - e-cap-matsue-city-gaiyo
  - text: 平成17年（2005年）3月31日に八束郡の7町村と、平成23年（2011年）8月1日に東出雲町と合併し、現在の市域となった
    kind: fact
    level: E2
    status: established
    sources:
    - e-cap-matsue-city-gaiyo
  - text: 愛媛県松山市（まつやま）とは読みが似るが別の自治体であり、「松江」が堀尾氏の城下町命名に由来するのに対し、「松山」は加藤嘉明が名付けた城名に由来するなど、成立の事情は異なる
    kind: fact
    level: E2
    status: established
    sources:
    - e-cap-matsue-city-gaiyo
    - e-cap-matsuyama-city-riyu
  column:
    title: 命名者は誰か ― 定説のない「松江」
    text: 「松江」の命名をめぐっては、市の史料調査担当者が近世史料と明治以降の著述を総ざらいしても、なお定説にたどり着かなかった。藩儒の『懐橘談』は堀尾忠氏が「唐の松江」に似た地形と鱸・蓴菜の産することから名付けたとし、別の史料は小瀬甫庵や和尚・春龍の命名とし、藩儒・桃節山にいたっては「古くから唱えられた名をこの時に城下の称号として定めたのだろう。疑いを残して博識の君子を待つ」と結んでいる。松江市の調査コラムもこの節山の留保に妥当性を見ており、堀尾吉晴が新しい城下町に当時の「中国風好み」を取り入れて命名した可能性が高いとしつつ、旧来の呼称の拾い上げも否定できないとする。大きな城下町の名前でさえ、命名の一次史料が残らないことがあるという好例である。
    sources:
    - e-cap-matsue-city-chosa26
  relations:
  - pref/32
  - muni/38-松山市
  unknowns:
  - 命名者（堀尾吉晴・忠氏・忠晴のいずれか、小瀬甫庵、春龍和尚など）と命名の正確な年次を決める同時代史料は確認できていない
  - 開府以前の「松江」の用例（『太平記』『大江広元日記』とされるもの）が地名を指すかどうかは未確認で、大江広元日記については市の調査でも確認できていない
  - コラムの材料は市の調査コラムに依拠しており、近世史料そのものは未読である
  updated: '2026-11-13'
- id: muni/32-美郷町
  code: '324485'
  names:
    ja: 美郷町
    reading: みさとちょう
    aliases: []
  user_terms:
  - 美郷町の名前の由来
  - 島根の美郷町は江の川の町
  - 美郷町は秋田と島根と宮崎にある
  naming_type: 合併新設
  prefecture: 島根県
  homonyms:
  - muni/05-美郷町
  - muni/45-美郷町
  summary: 平成16年（2004年）10月1日に邑智町と大和村が合併して誕生した新名。町公式は、両町村を貫く江の川と中国山地の織りなす風景が「ふるさとの原風景」を思い起こさせることから、自然豊かな美しい故郷をいつまでも残したいという住民の願いと、「みさと」という響きの温もりを命名の理由に挙げる。秋田県・宮崎県の美郷町と願いは共通するが、根拠とする川と山はそれぞれの土地のものである。
  first_attestation:
    era: 平成16年
    year_western: 2004
    document: 美郷町の発足（2004年10月1日）
    note: 自治体としての発足をもって名称の初出とする。合併協議における選定過程の一次記録は未確認
  claims:
  - text: 平成16年（2004年）に邑智郡の邑智町と大和村が合併して美郷町が誕生した。町章も同じ平成16年10月に制定されている
    kind: fact
    level: E2
    status: established
    sources:
    - h4-shimane-misato-gaiyo
  - text: 町公式は町名の由来として、合併前の2町村を江の川が貫流し、その両岸に中国山地が織りなす四季折々の豊かな自然と美しい街並みが広がる様子が、日本の古き良きふるさとの原風景を思い起こさせることを挙げる
    kind: fact
    level: E2
    status: established
    sources:
    - h4-shimane-misato-gaiyo
  - text: 「美郷（みさと）」には、この自然豊かな美しい故郷（ふるさと）をいつまでも残しておきたいという住民の願いが込められており、「みさと」という響きが持つ温もりも、人情豊かなこの地域をよく表すものとして新町の名称に決定された理由とされる
    kind: fact
    level: E2
    status: established
    sources:
    - h4-shimane-misato-gaiyo
  - text: 【共通する層】秋田県・宮崎県の美郷町も平成の大合併の新名で、「美しい故郷でありたい」という願いを込めた命名という点は共通する
    kind: fact
    level: E2
    status: established
    sources:
    - h4-akita-gappei-kiroku
    - h4-shimane-misato-gaiyo
  - text: 【異なる層】島根の公式説明は江の川と中国山地という固有の風景に根ざし、「みさと」の音の温もりまで理由に含める点に特徴がある。秋田のような公募・投票による選定の記録は、公表資料では確認できない
    kind: fact
    level: E2
    status: established
    sources:
    - h4-shimane-misato-gaiyo
    - h4-akita-gappei-kiroku
  column:
    title: 響きまで理由に入った名前
    text: 島根の美郷町の公式説明が面白いのは、意味だけでなく「みさと」という響きの温もりまで命名理由に数えていることだ。江の川の両岸に広がる原風景を「いつまでも残したい」という願いと、音の柔らかさ。平成の大合併では各地で新しい町名が作られたが、ここまで音の印象を表に出して説明する例は珍しい。
    sources:
    - h4-shimane-misato-gaiyo
  relations:
  - pref/32
  - muni/05-美郷町
  - muni/45-美郷町
  unknowns:
  - 合併協議会での名称選定過程（公募の有無・対抗候補など）の公表資料は未確認
  - 旧邑智町・大和村それぞれの地名の由来は本バッチの対象外で未確認
  updated: '2026-11-13'
- id: muni/33-岡山市
  code: '331007'
  names:
    ja: 岡山市
    reading: おかやまし
    aliases: []
  user_terms:
  - 岡山の名前の由来
  - 岡山城・烏城のある市の名前
  - 桃太郎の市の名前の意味
  naming_type: 藩名
  prefecture: 岡山県
  homonyms: []
  summary: 市名は岡山藩の城下町・岡山に由来する。「岡山」はもともと現在の岡山城のある小高い丘の名で、宇喜多秀家がその丘に岡山城を築いて城下町を広げるにつれて町全体の名となり、藩名・市名・県名へと広がった。岡山市は明治22年（1889年）6月1日に市制を施行した。
  first_attestation:
    era: 文禄3年
    year_western: 1594
    document: 宇喜多秀家書状
    note: 「岡山」が城下町の地名として呼ばれ始めた時期の推測とされる年（県レコード pref/33 と同じ扱い）。丘の名としての「岡山」の文書上の初出は特定できていない
  claims:
  - text: 岡山市の地方公共団体コードは331007である（総務省「全国地方公共団体コード」市区町村コード一覧による）
    kind: fact
    level: E2
    status: established
    sources:
    - e-cap-soumu-code-list
  - text: 「岡山」は、もともと現在の岡山城のある場所に存在した小高い丘を指して呼んだ名であった
    kind: fact
    level: E2
    status: established
    sources:
    - e-okayama-city-yuraihi
  - text: 戦国時代、岡山の西隣の石山にあった石山城を元亀元年（1570年）に宇喜多直家が手に入れ、天正元年（1573年）に同城へ移って本拠とした
    kind: fact
    level: E2
    status: established
    sources:
    - e-okayama-city-yuraihi
    - e-okayama-city-jouhistory
  - text: 宇喜多秀家は豊臣秀吉の指示により旭川の流れを変え、石山の東の岡山へ本丸を移して岡山城の築城と本格的な城下町の建設を進めた
    kind: fact
    level: E2
    status: established
    sources:
    - e-okayama-city-yuraihi
  - text: 岡山城の天守閣は慶長2年（1597年）に完成し、築城の後、城は「岡山城」、城下町は「岡山」の呼称が定着した
    kind: fact
    level: E2
    status: established
    sources:
    - e-okayama-city-yuraihi
    - e-okayama-city-jouhistory
  - text: 岡山市は明治22年（1889年）6月1日に市制を施行した
    kind: fact
    level: E2
    status: established
    sources:
    - e-cap-okayama-city-hensen
  - text: 吉備の鬼ノ城で悪事を働いた異国の王子・温羅を、朝廷から派遣された吉備津彦命が成敗したという温羅伝説は、桃太郎伝説のモデルになったと言われている
    kind: legend
    level: E2
    status: established
    sources:
    - e-okayama-pref-pr
  column:
    title: 三つの丘から一つの市名へ
    text: 岡山の城下は、岡山・石山・天神山という三つの小高い丘にまたがって造られた。その中で町の代表名に選ばれたのは、本丸が置かれた「岡山」だった。丘の名が城の名になり、城下町全体の名になり、藩の名になり、明治22年（1889年）の市制ではそのまま市名になった。最初は旭川沿いの一つの丘を指す言葉にすぎなかったものが、川の流路を付け替えるほどの築城工事を経て、70万人都市の名前になったのである。
    sources:
    - e-okayama-city-yuraihi
    - e-okayama-city-jouhistory
  relations:
  - pref/33
  unknowns:
  - 丘の名としての「岡山」の文書上の初出は今回特定できていない
  - 「岡山」が城下町名として使われ始めた時期を文禄3年（1594年）ごろとする推測は、秀家の書状に基づくとされるが、書状そのものは未確認
  updated: '2026-11-13'
- id: muni/34-広島市
  code: '341002'
  names:
    ja: 広島市
    reading: ひろしまし
    aliases: []
  user_terms:
  - 広島の名前の由来
  - 毛利輝元が名付けた市の名前
  - デルタの島という意味の市の名前
  - 福島と広島の名前の関係
  naming_type: 藩名
  prefecture: 広島県
  homonyms: []
  summary: 市名は広島藩の城下町・広島に由来する。もとは太田川デルタの五ケ浦・五ケ村と呼ばれた地で、天正17年（1589年）に毛利輝元が築城に着手した際に「広島」と命名した。語源には大江広元の「広」と福島元長の「島」を合わせたとする説と、デルタの島々に由来する説があり、県は諸説があるとしている。広島市は明治22年（1889年）4月に市制を施行した。
  first_attestation:
    era: 天正17年
    year_western: 1589
    document: 広島城築城に伴う毛利輝元の命名（広島市公式年表）
    note: 命名の出来事としての初出で、広島市公式年表は天正17年（1589年）4月とする。命名を直接記した同時代文書は今回特定できていない。なお築城地の旧称「五ケ浦」は応永4年（1397年）の文書に見える
  claims:
  - text: 広島市の地方公共団体コードは341002である（総務省「全国地方公共団体コード」市区町村コード一覧による）
    kind: fact
    level: E2
    status: established
    sources:
    - e-cap-soumu-code-list
  - text: 天正17年（1589年）4月、毛利輝元が五ケ（五ケ村）で築城に着手し、この地を「広島」と命名した
    kind: fact
    level: E2
    status: established
    sources:
    - e-cap-hiroshima-city-nenpyo
    - e-hiroshima-city-history
  - text: 命名の由来の一説として、毛利氏の祖先である大江広元の「広」と、この地の戦国時代の武士である福島元長の「島」を合わせたものとする説が紹介されている
    kind: fact
    level: E2
    status: contested
    sources:
    - e-hiroshima-pref-profile
  - text: もう一つの説として、広くデルタの島々が合わされたという自然の地形に由来するとする説があり、広島県は諸説があるとしている
    kind: fact
    level: E2
    status: contested
    sources:
    - e-hiroshima-pref-profile
  - text: 「島」の由来とされる福島元長は戦国時代の地元の武士であり、関ヶ原の戦いの後に広島の領主となった福島正則とは別人で、正則の広島城入城は慶長6年（1601年）のことで、天正17年の命名には関与し得ない
    kind: fact
    level: E2
    status: established
    sources:
    - e-hiroshima-pref-profile
    - e-cap-hiroshima-city-nenpyo
  - text: 築城以前、この地は五ケ浦・五ケ村と呼ばれ、応永4年（1397年）に五ケ浦の地名が文書（厳島神社文書）にあらわれる
    kind: fact
    level: E2
    status: established
    sources:
    - e-cap-hiroshima-city-nenpyo
    - e-hiroshima-city-history
  - text: 築城地は太田川が運んだ土砂で形成されたデルタで、砂洲や自然堤防の上に漁撈を主業とする人々が生活を営んでいた
    kind: fact
    level: E2
    status: established
    sources:
    - e-hiroshima-city-history
  - text: 広島市は明治22年（1889年）4月に市制を施行した（当時の人口は8万3,387人）
    kind: fact
    level: E2
    status: established
    sources:
    - e-cap-hiroshima-city-nenpyo
  column:
    title: 五ケ浦から広島へ ― デルタに生まれた城下町
    text: 「広島」の舞台は、太田川が瀬戸内海に注ぐ河口のデルタだった。築城前、この一帯は五ケ浦・五ケ村と呼ばれ、砂洲の上に漁撈を営む人々が暮らしていた。毛利輝元が1589年にここへ築城し「広島」と命名したことで、五つの集落の地は一つの城下町として再出発する。市名の由来をめぐるもう一つの説が「デルタの島々」に名前の起源を求めるのも、この土地の成り立ちを考えれば自然な発想である。つまり広島という名は、合成説を採るにせよ地形説を採るにせよ、川が運んだ土の上に新しく築かれた町の名として生まれた。
    sources:
    - e-cap-hiroshima-city-nenpyo
    - e-hiroshima-city-history
  relations:
  - pref/34
  unknowns:
  - 1589年の命名を直接記した同時代の一次文書は今回特定できておらず、命名の経緯は後世の伝えによる
  - 大江広元＋福島元長の合成説とデルタ地形説のどちらが正しいかは、資料上決められない（県レコード pref/34 と同じ論点）
  updated: '2026-11-13'
- id: muni/34-府中市
  code: '342084'
  names:
    ja: 府中市
    reading: ふちゅうし
    aliases:
    - 府中町
  user_terms:
  - 広島の府中の名前の由来
  - 備後国府があった市
  - 府中市はなぜ2つあるの
  naming_type: その他（国府所在地を指す普通名詞的地名の継承）
  prefecture: 広島県
  homonyms:
  - muni/13-府中市
  summary: 市名は、8世紀ごろに備後国府が置かれ、備後国の政治・経済・文化の中心であったことに由来すると市は説明する。長らく国府の存在は推定の域を出なかったが、発掘調査の裏づけが進み、備後国府跡は平成28年（2016年）に国の史跡となった。昭和29年（1954年）3月31日に芦品郡府中町と周辺5村が合併して市制を施行し、東京都府中市の成立（翌4月1日）より1日早く生まれた。
  first_attestation:
    era: 承平年間（931〜938年）
    year_western: null
    document: 和名類聚抄
    note: 文化庁が「和名類聚抄に国府在とみえる葦田郡に属するため国府所在地と推定されてきた」と紹介する、国府所在地推定の文献上の根拠。「府中」の語そのものの初出ではない
  claims:
  - text: 府中市公式プロフィールは、市名の由来を、8世紀ごろにこの地に備後国府が置かれ、備後国の政治・経済・文化の中心であったことに求めている
    kind: fact
    level: E2
    status: established
    sources:
    - h1-fuchu-hiroshima-profile
  - text: 文化庁は、備後国府について、和名類聚抄に国府在とみえる葦田郡に属するため国府所在地と推定されており、昭和42年度（1967年度）以降の発掘調査によって考古学的な裏づけが与えられたと紹介している
    kind: fact
    level: E2
    status: established
    sources:
    - h1-bingo-kokufu-db
  - text: 備後国府跡は平成28年（2016年）に国の史跡に指定されたが、国府の中心建物である国庁はまだ見つかっておらず、元町に所在したと推定されている
    kind: fact
    level: E2
    status: established
    sources:
    - h1-fuchu-hiroshima-roots
  - text: 昭和29年（1954年）3月、芦品郡府中町と岩谷村など周辺5村（計6カ町村）が合併して市制を施行し府中市が誕生した。その後、平成16年（2004年）に甲奴郡上下町を編入合併した
    kind: fact
    level: E2
    status: established
    sources:
    - h1-fuchu-hiroshima-youran
    - h1-jk-chimei-61
  - text: （共通する層）東京都府中市とは読み・表記が同一で、ともに律令制の国府（こちらは備後国府、相手は武蔵国府）の所在地に由来する「府中」である点で共通する
    kind: fact
    level: E3
    status: established
    sources:
    - h1-jk-chimei-61
  - text: （異なる層）両市の成立は広島県府中市が1954年3月31日、東京都府中市が翌4月1日と1日違いであり、全国で表記が同一の市名は府中市と伊達市の2組だけであると日本歴史地名大系ジャーナルは指摘する
    kind: fact
    level: E3
    status: established
    sources:
    - h1-jk-chimei-61
  - text: （府中町との関係）同じ広島県内にある府中町（安芸郡）は、同じ「府中」でも安芸国府に由来する別の系譜の地名であり、備後国府に由来するこの府中市とは国も成立事情も異なる
    kind: fact
    level: E2
    status: established
    sources:
    - h1-fuchucho-outline
    - h1-fuchucho-kotobank
  - text: 備後国府跡の一角は、その地に吉田寺があったという伝承に基づき「伝吉田寺地区」と呼ばれ、令和元年（2019年）に史跡の追加指定を受けた
    kind: legend
    level: E2
    status: established
    sources:
    - h1-fuchu-hiroshima-roots
  column:
    title: 掘って確かめた国府
    text: 備後国府は、和名類聚抄の記述と「府中」という地名が残ることから、長らく「この辺りにあったはずだ」と推定されてきた存在でした。それが変わったのは発掘調査が本格化してからで、昭和42年（1967年）以降の継続的な発掘が文献の記述を裏づけ、平成28年（2016年）に備後国府跡は国の史跡になりました。ただし中心建物の国庁はいまだ見つかっておらず、元町にあったと推定される段階です。地名が先に残り、遺跡が後から追いついた、という順序そのものが、この町の由来の面白さです。
    sources:
    - h1-bingo-kokufu-db
    - h1-fuchu-hiroshima-roots
  relations:
  - pref/34
  - muni/13-府中市
  - muni/34-府中町
  unknowns:
  - 備後国庁の正確な位置（元町に所在したと推定されるが未発見）
  - 「府中」という語の文献上の初出の特定は未了
  - 国府が置かれた正確な時期（市公式は「8世紀ごろ」とする）
  updated: '2026-11-13'
- id: muni/34-府中町
  code: '343021'
  names:
    ja: 府中町
    reading: ふちゅうちょう
    aliases:
    - 府中村
  user_terms:
  - 府中町は国府と関係があるの
  - 安芸国府はどこにあった
  - 広島市に囲まれた町
  naming_type: その他（国府所在地を指す普通名詞的地名の継承）
  prefecture: 広島県
  homonyms: []
  summary: 町名は、昔この地に安芸国の国府が置かれていたところといわれることに由来し、古代安芸国の政治文化の中心地であったと考えられている。ただし安芸国府の当初の所在地については、もともと府中にあったとする説と、最初は東広島市西条にあり後に移ったとする説が対立している。自治体としては江戸時代の府中村の区域をほぼ引き継ぎ、明治22年（1889年）に府中村、後に町制を施行して府中町となった。両府中市とは表記は違うが、「国府→府中」という同じ命名の系譜にある。
  first_attestation:
    era: 承平年間（931〜938年）
    year_western: null
    document: 和名類聚抄（和名抄）
    note: 府中町の教育資料が「和名抄の記載から、少なくとも平安中期には府中に国府があったことが分かる」と紹介するもの。ただし国府の当初所在地には西条説があり、位置づけは対立を含んでいる
  claims:
  - text: 府中町公式は、府中という名が示すように、昔この地に安芸の国府が置かれていたところといわれ、古代安芸国の政治文化の中心地であったと思われると説明している
    kind: fact
    level: E2
    status: established
    sources:
    - h1-fuchucho-outline
  - text: 安芸国府の所在地については、もともと府中にあったという説と、最初は東広島市の西条にあり後に府中へ移ったという説があり、府中町の教育資料も両説を併記している
    kind: fact
    level: E2
    status: contested
    sources:
    - h1-fuchucho-edu
  - text: 府中町の教育資料は、『和名抄』の記載から、少なくとも平安中期から府中に国府があったことが分かると述べている
    kind: fact
    level: E2
    status: established
    sources:
    - h1-fuchucho-edu
  - text: 日本歴史地名大系は広島県の府中町を「もと安芸国府の地」と解説し、広島市に囲まれた町であるとしている
    kind: fact
    level: E3
    status: established
    sources:
    - h1-fuchucho-kotobank
  - text: 府中町は周囲を広島市に囲まれ、安芸郡の飛び地という全国的にも特徴のある形態をしており、町域は江戸時代の府中村とほぼ同じ区域のまま明治22年（1889年）の町村制施行により府中村となり、後に町制を施行して府中町となった
    kind: fact
    level: E2
    status: established
    sources:
    - h1-fuchucho-outline
  - text: （両府中市との関係）表記は「府中町」で両府中市と異なるが、由来する国府は安芸国府であり、武蔵国府（東京都府中市）・備後国府（広島県府中市）とは別の国の国府である。3者はいずれも「国府の所在地＝府中」という同じ命名の系譜に属する
    kind: fact
    level: E2
    status: established
    sources:
    - h1-fuchucho-outline
    - h1-jk-chimei-61
  - text: 町域を通っていた古代の官道（山陽道）の峠道には、畑賀から府中の安芸駅へ向かう途中の甲越峠が「国府越え」の意味の名であると町の教育資料は伝えている
    kind: legend
    level: E2
    status: established
    sources:
    - h1-fuchucho-edu
  column:
    title: 広島市に囲まれた、国府の町
    text: 府中町は、四方を広島市に囲まれた安芸郡の飛び地という、全国でも珍しい形をした町です。県庁所在地の大都市にすっぽり囲まれながら独立した町であり続けている背景には、古代に安芸国の国府が置かれた中心地だったという、この土地の格があります。町内の峠道「甲越峠」は「国府越え」に由来する名と伝えられ、駅家だった安芸駅の記憶とともに、国府への道の名残を残しています。東京都府中市・広島県府中市とは字も読みも似ていますが、こちらは安芸国府の府中。一つの県の中に、別々の国に由来する「府中」が2つあることになります。
    sources:
    - h1-fuchucho-outline
    - h1-fuchucho-edu
  relations:
  - pref/34
  - muni/13-府中市
  - muni/34-府中市
  unknowns:
  - 安芸国府の当初所在地は西条説と府中説が対立し未決着であり、国庁の具体的な位置も未確認
  - 町制施行の年（昭和12年・1937年とする紹介が多い）について、町公式資料での一次確認は未了
  - 安芸駅（駅家）の正確な位置は未確認
  updated: '2026-11-13'
- id: muni/35-山口市
  code: '352039'
  names:
    ja: 山口市
    reading: やまぐちし
    aliases: []
  user_terms:
  - 山口の名前の由来
  - 西の京と呼ばれる市の名前
  - 大内氏の城下町の名前
  naming_type: 一部の地名
  prefecture: 山口県
  homonyms: []
  summary: 市名は中世以来の地名「山口」を引き継ぐ。「山口」の初見は建長6年（1254年）の金鼓銘とされ、14世紀に大内弘世が本拠を移して京に模した城下町を築いたことで都市として発展した。語源は山地への入り口とする説などがあるが、専門辞典は「想像に過ぎない」としており定説はない。山口市は昭和4年（1929年）に市制を施行した。
  first_attestation:
    era: 建長6年
    year_western: 1254
    document: 円政寺旧蔵金鼓銘
    note: 「防州山口月輪山円政寺天神宮」の銘が地名「山口」の初見とされる（『日本歴史地名大系』山口町条による）。円政寺は当時、椹野川の北側にあった寺で、のちに萩へ移転している
  claims:
  - text: 山口市の地方公共団体コードは352039である（総務省「全国地方公共団体コード」市区町村コード一覧による）
    kind: fact
    level: E2
    status: established
    sources:
    - e-cap-soumu-code-list
  - text: 「山口」の地名の初見は、建長6年（1254年）の円政寺旧蔵金鼓銘の「防州山口月輪山円政寺天神宮」であることがよく知られている
    kind: fact
    level: E3
    status: established
    sources:
    - e-cap-yamaguchi-kotobank-machi
    - e-cap-enseiji-kongo
  - text: 「山口」の語源には、山口盆地の北を流れ椹野川の支流である一ノ坂川に沿って長門国阿武郡の山地に分け入る入り口にあたるからとする説がある
    kind: fact
    level: E3
    status: indeterminate
    sources:
    - e-cap-yamaguchi-kotobank-machi
    - e-yamaguchi-ndl-ref
  - text: 別の説として、東鳳翩山の銀鉱に入る山の口にあたる天花辺りの地名が一般的な呼称になったとする説があるが、『日本歴史地名大系』はこれらの説を「想像に過ぎない」としている
    kind: fact
    level: E3
    status: indeterminate
    sources:
    - e-cap-yamaguchi-kotobank-machi
    - e-yamaguchi-ndl-ref
  - text: 大内氏はそれまで仁保川沿いの御堀氷上を本拠としていたが、大内弘世の時代に山口へ本拠を移した。江戸時代に復元された山口古図には、山口が京に似て四神相応の地であるので延文5年（1360年）に京に倣って町割をした旨が記されている
    kind: fact
    level: E3
    status: established
    sources:
    - e-cap-yamaguchi-kotobank-machi
  - text: 大内弘世は京都の文化に感銘を受け、盆地の地形が京都に似た山口に京に模した街づくりを行い、山口は「西の京」と呼ばれるようになったと山口市は伝えている
    kind: fact
    level: E2
    status: established
    sources:
    - e-yamaguchi-city-ouchi
  - text: 大内氏の始まりは、百済国聖明王の第3王子である琳聖太子が周防国に着岸し、聖徳太子より周防国大内県を賜ったことに始まると伝えられている
    kind: legend
    level: E2
    status: established
    sources:
    - e-yamaguchi-city-ouchi
  - text: 山口市は昭和4年（1929年）に、当時の山口町が吉敷村と合併して市制を施行した
    kind: fact
    level: E2
    status: established
    sources:
    - e-cap-yamaguchi-city-gaiyo
  - text: 平成17年（2005年）10月に山口市・小郡町・秋穂町・阿知須町・徳地町の1市4町が合併し、平成22年（2010年）1月に阿東町と合併して、県内最大の市域を有するまちになった
    kind: fact
    level: E2
    status: established
    sources:
    - e-cap-yamaguchi-city-gaiyo
  column:
    title: 本拠はもと川向こうにあった ― 御堀氷上から山口へ
    text: 大内氏の本拠は、初めから山口だったわけではない。それまでの一族は周防国衙への往来に便利な仁保川沿いの御堀氷上に拠っていた。弘世の時代、日本海側の確保と石見への進出が課題になると、交通路にあたり鴻ノ峰や天花などの要害を控えた山口の地が選ばれた。山口古図が伝える「延文5年（1360年）、京に倣って町割をした」という記述は江戸時代の復元図に残る伝えだが、「山口」の名そのものは1254年の金鼓銘にすでに見えており、城下町の建設より1世紀以上前からこの盆地の名として使われていたことになる。都市の成立と地名の成立は、ここでも別の年代を持つ。
    sources:
    - e-cap-yamaguchi-kotobank-machi
    - e-yamaguchi-city-ouchi
  relations:
  - pref/35
  unknowns:
  - 「山口」の語源は専門辞典でも諸説が「想像に過ぎない」とされており、定説は確認できていない
  - 大内弘世が山口へ移った正確な年次は当時の文献には伝えられておらず、延文5年（1360年）の町割は山口古図（江戸時代の復元図）の記述による
  - 円政寺金鼓銘そのものは未読で、初見の情報は『日本歴史地名大系』の記述経由である
  updated: '2026-11-13'
- id: muni/36-徳島市
  code: '362018'
  names:
    ja: 徳島市
    reading: とくしまし
    aliases: []
  user_terms:
  - 徳島の名前の由来
  - 阿波おどりの市の名前
  - 渭津から徳島に改名した市の名前
  naming_type: 藩名
  prefecture: 徳島県
  homonyms: []
  summary: 市名は徳島藩の城下町・徳島に由来する。天正13年（1585年）、蜂須賀家政が猪山（現在の城山）に徳島城を築く際、それまで「渭津（いのつ）」と呼ばれた地を「徳島」と改めた。誰が名付けたか、「徳」の字をなぜ選んだかを示す文献は確認されておらず、縁起を担いだ命名とする郷土史家の推定がある。徳島市は明治22年（1889年）10月1日に誕生した。
  first_attestation:
    era: 天正13年
    year_western: 1585
    document: 徳島城築城に伴う改名（徳島市立徳島城博物館の解説）
    note: 地名の命名そのものとしての初出。改名を記した同時代の一次文書は今回特定できていない
  claims:
  - text: 徳島市の地方公共団体コードは362018である（総務省「全国地方公共団体コード」市区町村コード一覧による）
    kind: fact
    level: E2
    status: established
    sources:
    - e-cap-soumu-code-list
  - text: 天正13年（1585年）、豊臣秀吉の四国平定により蜂須賀家政が阿波国を与えられ、徳島城を築いて居城とした
    kind: fact
    level: E2
    status: established
    sources:
    - e-tokushima-pref-gaiyo
  - text: 城地は秀吉の命により猪山（現在の城山）と定められたと徳島市立徳島城博物館は伝えている
    kind: fact
    level: E2
    status: established
    sources:
    - e-tokushima-city-history01
  - text: 築城当時、城の周囲の地は「渭津（いのつ）」と呼ばれていたが、築城と城下町の開設にあたって「徳島」と地名を改めた
    kind: fact
    level: E2
    status: established
    sources:
    - e-tokushima-city-history05
    - e-tokushima-city-history01
  - text: 「徳島」という地名を誰が命名したかを、文献・古文書は明らかにしてくれない。郷土史家・河野幸夫は、「徳」は富田庄の「富」と同意の嘉字（よい意味の字）であり、東に福島という地名もあることから、家政が福島に対して徳島と縁起をかついで名付けたのではないかと推定しているが、決め手はないとされている
    kind: fact
    level: E2
    status: inferred
    sources:
    - e-tokushima-city-history05
  - text: 徳島は江戸時代を通じて、阿波・淡路両国25万7千石を領した蜂須賀氏の城下町として栄えた
    kind: fact
    level: E2
    status: established
    sources:
    - e-tokushima-pref-gaiyo
  - text: 明治22年（1889年）10月1日、かつて御山下と称した朱引地内の33か町村とこれに接続する4郷町村に市制が施行され、徳島市が誕生した。当時の徳島市の人口は6万861人で、その年に市制を施行した市の中で全国10位の規模だった
    kind: fact
    level: E2
    status: established
    sources:
    - e-cap-tokushima-city-hensan
  - text: 市制施行の際、市内の町村名はすべて「町」に統一され、10月1日は後に徳島市の置市記念日とされた
    kind: fact
    level: E2
    status: established
    sources:
    - e-cap-tokushima-city-hensan
  column:
    title: 福島の隣に徳島を ― 縁起を担いだ命名か
    text: 「徳島」の名付け親は分からない。しかし手がかりは地名の配置にある。城下の東には「福島」という地名があった。郷土史家・河野幸夫は、富田庄の「富」と同じく縁起のよい字である「徳」を選び、福島に対して徳島と対にして名付けたのではないか、と推定した。徳島城博物館の連載はこの推定を紹介しながら「決め手はない」と正直に結んでいる。命名の理由が残らなかった城下町は多いが、徳島の場合は「分からない」と明示した上で、もっともらしい推定の根拠まで示されている点が読みどころである。
    sources:
    - e-tokushima-city-history05
  relations:
  - pref/36
  unknowns:
  - 「徳島」の命名者と、「徳」の字が選ばれた理由を示す確かな記録は確認できていない
  - 「渭津」から「徳島」への改名を記した同時代の一次文書は今回特定できていない
  updated: '2026-11-13'
- id: muni/37-高松市
  code: '372013'
  names:
    ja: 高松市
    reading: たかまつし
    aliases: []
  user_terms:
  - 高松の名前の由来
  - うどんの市の名前の意味
  - 高松城の城下町の名前
  - 高松郷と高松城の関係
  naming_type: 一部の地名
  prefecture: 香川県
  homonyms: []
  summary: 市名の源は、讃岐国香川郡の古代郷名「高松郷」にある。天正16年（1588年）、生駒親正が玉藻浦の笑原郷（のはら）の地に高松城を築く際、著名だった高松郷の名を取って城と城下町の名とした。高松郷そのものは現在の古高松地区にあたり、名の原点と城下町の位置は市域の東西でずれている。高松市は明治23年（1890年）に市制を施行した。
  first_attestation:
    era: 承平年間
    year_western: null
    document: 和名類聚抄
    note: 讃岐国香川郡の郷名「高松」の記載とされる（語源由来辞典による）。原文は未読。城下町名としての使用は天正16年（1588年）の築城から
  claims:
  - text: 高松市の地方公共団体コードは372013である（総務省「全国地方公共団体コード」市区町村コード一覧による）
    kind: fact
    level: E2
    status: established
    sources:
    - e-cap-soumu-code-list
  - text: 「高松」の地名は平安前期の『和名抄（和名類聚抄）』に「高松郷」で見えるのが古く、高松市は市名の由来が平安時代中期の史書に見える「高松郷」（現在の古高松地区）に発すると説明する
    kind: fact
    level: E2
    status: established
    sources:
    - e-cap-takamatsu-gogen
    - e-cap-takamatsu-city-plan
    - e-cap-wamyosho
  - text: 近世の高松城下町が発達した地は、律令時代には香川郡笑原郷（のはら）といわれた地であり、高松市公式の高松城跡解説は築城地の旧地名を「野原」と表記する
    kind: fact
    level: E2
    status: established
    sources:
    - e-cap-takamatsu-kotobank
    - e-cap-takamatsu-city-castle
  - text: 天正16年（1588年）、生駒親正は築城の際、屋島合戦などで中央にも知られた高松郷の名を取って高松城とし、その城下町名としたことから、城下町としての高松の地名が始まった
    kind: fact
    level: E3
    status: established
    sources:
    - e-cap-takamatsu-kotobank
    - e-cap-takamatsu-city-profile
  - text: 明治23年（1890年）に市制を施行し高松市となった
    kind: fact
    level: E3
    status: established
    sources:
    - e-cap-takamatsu-kotobank
  - text: 生駒氏の転封後、寛永19年（1642年）に松平頼重が東讃12万石を与えられて入部し、以後松平11代の城下町として明治を迎えた
    kind: fact
    level: E2
    status: established
    sources:
    - e-cap-takamatsu-city-castle
    - e-cap-takamatsu-city-profile
  - text: 高松郷の語源については、海の近くに高い松の林があったことが地名の由来といわれている
    kind: legend
    level: E3
    status: indeterminate
    sources:
    - e-cap-takamatsu-gogen
  column:
    title: 名の原点は城下の東にあった ― 高松郷と玉藻浦
    text: 高松という名前には「原点のずれ」がある。名の出どころである古代の高松郷は、現在の高松市東部の古高松地区にあたる。一方、生駒親正が1588年に城を築いたのは、その西方の玉藻浦で、律令時代には笑原郷（のはら）と呼ばれた別の地だった。親正は自分の城地の旧名ではなく、屋島合戦で中央にも知られた由緒ある郷名「高松」を借りてきて、城と新しい城下町に看板として掲げたのである。市名の地図上の原点は、城のある場所ではなく、東の古高松に置くべきだということになる。
    sources:
    - e-cap-takamatsu-city-plan
    - e-cap-takamatsu-kotobank
    - e-cap-takamatsu-gogen
  relations:
  - pref/37
  unknowns:
  - 高松郷の正確な郷域と、笑原郷との境界を特定できる一次文書は確認していない
  - 「高い松の林」説のほか高松郷の語源の定説は確認できていない
  - 『和名類聚抄』の高松郷の記載そのものは未読で、語源由来辞典などの紹介経由である
  updated: '2026-11-13'
- id: muni/38-松前町
  code: '384011'
  names:
    ja: 松前町
    reading: まさきちょう
    aliases:
    - 正木
  user_terms:
  - 松前町は「まさき」と読むのはなぜ
  - 松前町（愛媛）の名前の由来
  - 正木城があった町
  naming_type: その他（「まさき」の音を継ぎ、表記を「松前」に改めたという言い伝えに基づく）
  prefecture: 愛媛県
  homonyms:
  - muni/01-松前町
  summary: 読みは「まさき」。愛媛県の市町要覧によれば、慶長8年（1603年）に加藤嘉明が正木（まさき）城から勝山に居城を移して「松山城」と命名した際、「松山（城）の前」の意で「松前（まさき）」に改字したといわれている。ただし同要覧は「他にも諸説あり詳細は不明」と明記しており、確定した由来ではない。昭和30年（1955年）3月31日に旧松前町・岡田村・北伊予村が合併して現在の松前町となった。北海道松前町とは漢字が同じだけで、読みも由来も無関係である。
  first_attestation:
    era: 慶長8年
    year_western: 1603
    document: 加藤嘉明の居城移転に伴う改字の言い伝え
    note: 「松前」の表記が始まったとされる年。ただし愛媛県市町要覧自身が「諸説あり詳細は不明」と留保しており、一次文書による確定ではない。「正木」の地名自体は中世以来のものである
  claims:
  - text: 愛媛県の市町要覧は、町名の由来について、慶長8年（1603年）に加藤嘉明が正木（まさき）城から勝山（現松山市）に居城を移し「松山城」と命名した際に、松山（城）の前の意で「松前（まさき）」に改字したといわれていると紹介している
    kind: fact
    level: E2
    status: contested
    sources:
    - h1-matsumae-ehime-yoran
  - text: 同じく愛媛県の市町要覧は、この改字説について「他にも諸説あり詳細は不明」と明記しており、県の公式資料の水準でも由来は確定していない
    kind: fact
    level: E2
    status: contested
    sources:
    - h1-matsumae-ehime-yoran
  - text: 読みは「まさき」であり、「松前」の表記に「まさき」と読ませるのは、もとの地名「正木（まさき）」の音を継いだものと位置づけられている
    kind: fact
    level: E2
    status: established
    sources:
    - h1-matsumae-ehime-yoran
  - text: 正木城は加藤嘉明の居城であり、嘉明は慶長8年（1603年）に正木城から勝山へ居城を移した
    kind: fact
    level: E2
    status: established
    sources:
    - h1-matsumae-ehime-yoran
  - text: 昭和30年（1955年）3月31日、旧松前町・岡田村・北伊予村が合併して、現在の松前町となった
    kind: fact
    level: E2
    status: established
    sources:
    - h1-matsumae-ehime-yoran
  - text: （異なる層）北海道松前町とは漢字表記が同じだけで、読み（まさき／まつまえ）も、由来（正木の改字の言い伝え／アイヌ語地名と松前藩の系譜）も異なる、無関係の地名である
    kind: fact
    level: E2
    status: established
    sources:
    - h1-matsumae-ehime-yoran
    - h1-matsumae-jtb
  - text: 加藤嘉明が松山城を命名したとき、もとの居城の地を「松山の前」として「松前」と書き改めたという話は、地元で言い伝えとして語られている
    kind: legend
    level: E2
    status: established
    sources:
    - h1-matsumae-ehime-yoran
  column:
    title: 「まつまえ」とは読まない松前
    text: 同じ「松前」という漢字でも、北海道の町は「まつまえ」、愛媛の町は「まさき」と読みます。愛媛の「まさき」は、もとの地名「正木（まさき）」の音をそのまま残し、字だけを替えたものと伝えられます。言い伝えでは、加藤嘉明が新しい城を「松山城」と名付けたとき、古い城下を「松山の前」と位置づけて「松前」の字をあてた、とされます。ただし愛媛県の公式資料自身が「諸説あり詳細は不明」と書く話です。読み方が違えば郵便も間違えようがない、というのは同名地名の中では珍しい幸運かもしれません。
    sources:
    - h1-matsumae-ehime-yoran
  relations:
  - pref/38
  - muni/01-松前町
  unknowns:
  - 改字説を裏づける一次文書は未確認（愛媛県市町要覧も「詳細は不明」とする）
  - 「諸説あり」とされる他の説の具体的な内容は、市町要覧の範囲では未確認
  - 「正木」の地名の初出文書の特定は未了
  updated: '2026-11-13'
- id: muni/38-松山市
  code: '382019'
  names:
    ja: 松山市
    reading: まつやまし
    aliases: []
  user_terms:
  - 松山の名前の由来
  - 松山城のある市の名前
  - 道後温泉のある市の名前
  - 松江と間違えやすい市の名前
  naming_type: 新規命名
  prefecture: 愛媛県
  homonyms: []
  summary: 市名は松山城の城名に由来する。城が築かれた山はもともと勝山と呼ばれていたが、慶長7年（1602年）に築城に着手した加藤嘉明が翌慶長8年（1603年）に「松山城」と名付け、城名が町・市の名になった。命名理由には松の木に由来する説と、松平家の「松」を取ったとする説があり、市は2説を併記している。松山市は明治22年（1889年）12月15日に市制を施行した。島根県の松江市とは読みが似るが別の自治体である。
  first_attestation:
    era: 慶長8年
    year_western: 1603
    document: 松山城の命名（松山市公式「松山という名がつけられた理由」）
    note: 城名としての命名。築城着工は慶長7年（1602年）で、山そのものは勝山と呼ばれていた
  claims:
  - text: 松山市の地方公共団体コードは382019である（総務省「全国地方公共団体コード」市区町村コード一覧による）
    kind: fact
    level: E2
    status: established
    sources:
    - e-cap-soumu-code-list
  - text: 松山の名は、慶長7年（1602年）に加藤嘉明が築城にかかり、翌慶長8年（1603年）に松山城と名づけたことに始まる
    kind: fact
    level: E2
    status: established
    sources:
    - e-cap-matsuyama-city-gaiyo
    - e-cap-matsuyama-city-riyu
  - text: 松山城が築かれたのは、標高132メートル・周囲約4キロメートルの独立丘陵である勝山を中心とする地で、城の完成は嘉明の転封後、寛永4年（1627年）に第2代城主・蒲生忠知によって成されたと伝えられる
    kind: fact
    level: E2
    status: established
    sources:
    - e-cap-matsuyama-city-castle
  - text: 命名の理由の一説として、お城のある山に多くの松の木が植えられていたことが挙げられている
    kind: fact
    level: E2
    status: contested
    sources:
    - e-cap-matsuyama-city-riyu
  - text: もう一説として、徳川家の一族である松平家の「松」の字を取って付けられたとする説があり、松山市はその典拠を奥平貞虎編『予陽郡郷俚諺集』とする。ただしこれは江戸時代の俚諺集に基づく後世の説明で、命名した加藤嘉明との関係を示す同時代資料は確認されていない
    kind: fact
    level: E2
    status: contested
    sources:
    - e-cap-matsuyama-city-riyu
  - text: 明治6年（1873年）に愛媛県庁が設置されて県都となり、明治22年（1889年）12月15日に市制を施行した
    kind: fact
    level: E2
    status: established
    sources:
    - e-cap-matsuyama-city-gaiyo
  - text: 島根県松江市（まつえ）とは読みが似るが別の自治体であり、「松山」が加藤嘉明の名付けた城名に由来するのに対し、「松江」は堀尾氏が白潟・末次を合わせて称した城下町名に由来するなど、成立の事情は異なる
    kind: fact
    level: E2
    status: established
    sources:
    - e-cap-matsuyama-city-riyu
    - e-cap-matsue-city-gaiyo
  column:
    title: 勝山から松山へ ― 山の名前が市の名前になった
    text: 松山城の山は、城ができる前は「勝山」と呼ばれていた。加藤嘉明が1602年に築城を始め、翌年に城を「松山城」と名付けたことで、山の名も町の名も「松山」に切り替わった。もとの「勝山」も縁起のよい名だったはずだが、新しい城主は新しい名を選んだ。松山市の公式解説は命名理由を2説併記する。山に松が多かったという素朴な説と、松平家の「松」を取ったという説である。後者は江戸時代の俚諺集が出典で、命名の当事者である嘉明との結びつきは薄い。「なぜ松なのか」は、今も決着していない。
    sources:
    - e-cap-matsuyama-city-riyu
    - e-cap-matsuyama-city-castle
  relations:
  - pref/38
  - muni/32-松江市
  unknowns:
  - 命名理由の2説（松の木説・松平家の「松」説）のどちらが正しいかは資料上決められず、特に松平説は松平氏が松山の城主となる時期との関係を含め同時代資料での裏付けが確認できていない
  - 加藤嘉明が「松山」と名付けた経緯を記した同時代の一次文書は今回特定できていない
  updated: '2026-11-13'
- id: muni/39-高知市
  code: '392014'
  names:
    ja: 高知市
    reading: こうちし
    aliases: []
  user_terms:
  - 高知の名前の由来
  - 河中から高知に変わった理由
  - 坂本龍馬のふるさとの市の名前
  naming_type: 一部の地名
  prefecture: 高知県
  homonyms: []
  summary: 市名は山内氏の城下町・高知に由来し、その名は二度の改名を経ている。山内一豊が大高坂山に築城して「河中（こうち）」と名付けたが、水害を連想させる字を嫌った2代藩主・忠義が慶長15年（1610年）に僧・空鏡に改めさせて「高智」とし、のちに「高知」の表記が定着した。高知市は明治22年（1889年）4月1日に旧城下49町から誕生した。
  first_attestation:
    era: 慶長15年
    year_western: 1610
    document: 山内氏時代史初稿
    note: 「河中」から「高智」への改字を記す藩政史料として高知市が紹介するもの。前身の「河中」の命名は慶長8年（1603年）の一豊入城時とされる
  claims:
  - text: 高知市の地方公共団体コードは392014である（総務省「全国地方公共団体コード」市区町村コード一覧による）
    kind: fact
    level: E2
    status: established
    sources:
    - e-cap-soumu-code-list
  - text: 慶長6年（1601年）に土佐へ入国した山内一豊は大高坂山に築城を開始し、慶長8年（1603年）に入城して山の名を河中山と改めた
    kind: fact
    level: E2
    status: established
    sources:
    - e-kochi-city-rekishi
  - text: 「河中」の名は、城下が北の江ノ口川と南の鏡川という二つの川に挟まれた「中」に位置することに由来する
    kind: fact
    level: E3
    status: established
    sources:
    - e-kochi-kotobank
  - text: 『山内氏時代史初稿』の慶長15年（1610年）9月の条に「山内忠義、竹林寺ノ僧空鏡ヲシテ河中山ノ文字ヲ改メシメ高智ト称ス」とあり、2代藩主忠義が僧・空鏡に命じて河中山を高智山に改名した
    kind: fact
    level: E2
    status: established
    sources:
    - e-kochi-city-rekishi
    - e-kochi-city-shiryo
  - text: 改名の理由は、「河中」という字が水害の多い地を連想させ縁起が悪いためであったと伝えられている
    kind: fact
    level: E2
    status: established
    sources:
    - e-kochi-city-rekishi
    - e-kochi-kotobank
  - text: のちに「高智」の「智」が「知」に置き換わり「高知」と書かれるようになり、城名から地名へ広がった
    kind: fact
    level: E3
    status: established
    sources:
    - e-kochi-kotobank
  - text: 明治22年（1889年）4月1日に市制が施行され、旧城下49町から高知市が誕生した（当時の人口は21,823人、初代市長は一圓正興）
    kind: fact
    level: E2
    status: established
    sources:
    - e-cap-kochi-city-tokei
  column:
    title: 旧城下49町、そのまま市になる
    text: 高知市の誕生日は明治22年（1889年）4月1日である。高知市統計書の参考資料は「市町村制施行。高知市誕生（旧城下49町、人口21,823人）」と記す。つまり高知市は、山内氏の城下町をほぼそのままの範囲で引き継いで発足した。城下町はすでに「高知」の名を持っていたから、新しい市に新しい名前は要らなかった。河中→高智→高知という改名の歴史を背負った名前が、城の町から近代の市へと、そのまま受け渡されたのである。
    sources:
    - e-cap-kochi-city-tokei
    - e-kochi-city-rekishi
  relations:
  - pref/39
  unknowns:
  - 「高智」の「智」が「知」に置き換わった正確な時期と経緯は今回特定できていない（県レコード pref/39 と同じ論点）
  - 「高智」が文殊菩薩の浄土にちなむとする説明は伝承的な色彩が強く、同時代資料での裏付けは確認できていない
  updated: '2026-11-13'
- id: muni/40-川崎町
  code: '406058'
  names:
    ja: 川崎町
    reading: かわさきまち
    aliases:
    - 川崎村
    - 東川崎村
    - 西川崎村
  user_terms:
  - 川崎町の名前の由来
  - 福岡の川崎町はなぜ川崎
  - 田川郡の炭鉱町
  naming_type: その他
  prefecture: 福岡県
  homonyms:
  - muni/04-川崎町
  summary: 明治期に東川崎村・西川崎村が合併して生まれた川崎村を前身とし、1937年に安真木村と合併、1938年に町制を施行して川崎町となった。「川崎」の名は村名として先行していたが、その語源は確認した資料では説明されない。宮城県川崎町とは成立の経緯が異なり、共通の命名理由は立証できない。
  first_attestation:
    era: 明治時代（明治20年）
    year_western: 1887
    document: 東川崎村・西川崎村の合併による川崎村の成立
    note: 東・西川崎の村名自体はこれ以前から存在するが、「川崎」の初出・語源は未確認
  claims:
  - text: 明治20年（1887年）4月に東川崎村と西川崎村が合併して川崎村となり、明治22年（1889年）には川崎・田原・池尻が合併して新たな川崎村が誕生したと沿線紹介資料が伝える
    kind: fact
    level: E4
    status: established
    sources:
    - h3-kawasaki-f-hitahiko
  - text: 昭和12年（1937年）に南部の安真木村と北部の川崎村が合併し、昭和13年（1938年）から町制を施行して川崎町となった
    kind: fact
    level: E2
    status: established
    sources:
    - h3-kawasaki-f-town
    - h3-kawasaki-f-yoran
  - text: 『日本歴史地名大系』は、町域中部を中元寺川が北流し、古代律令制下では和名抄の位登郷に含まれていたとみられると紹介する
    kind: fact
    level: E3
    status: established
    sources:
    - h3-kawasaki-kotobank
  - text: 明治末期以降、古河大峰・三井田川などの炭鉱を有する炭鉱町として発達したが、昭和30年代後半にすべて閉山されたと百科事典の解説にある
    kind: fact
    level: E3
    status: established
    sources:
    - h3-kawasaki-f-kotobank
  - text: 宮城県川崎町とは「川崎村」を前身とする点は共通する。ただし宮城では1889年の構成5村に「川崎」がなく宿場名「川崎宿」が先行したのに対し、福岡では東・西川崎という村名が先行する点が異なる。両町とも「川崎」の語源そのものは未確認で、共通の命名理由は立証できない
    kind: fact
    level: E3
    status: established
    sources:
    - h3-kawasaki-m-uub
    - h3-kawasaki-m-juku
    - h3-kawasaki-f-hitahiko
  - text: 総務省「地方公共団体コード一覧」では本町のコードは406058とされる
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 川崎村が二度生まれた町
    text: この町の前身「川崎村」は、1887年に東・西川崎の合併で一度生まれ、1889年の町村制施行でもう一度、田原・池尻を加えて生まれ直しています。さらに1937年の安真木村との合併でも名は「川崎」のまま残り、翌年に町になりました。合併のたびに残り続けた名ですが、その最初の語源だけが記録に残っていません。
    sources:
    - h3-kawasaki-f-hitahiko
    - h3-kawasaki-f-town
  relations:
  - pref/40
  - muni/04-川崎町
  unknowns:
  - 東・西川崎村の初出と「川崎」の語源（中元寺川との関係を含む）
  - 1887年・1889年の合併の法的根拠の一次確認
  updated: '2026-11-13'
- id: muni/40-広川町
  code: '405442'
  names:
    ja: 広川町
    reading: ひろかわまち
    aliases:
    - 上広川村
    - 中広川村
    - 下広川村
  user_terms:
  - 福岡の広川町の由来
  - 八女の広川町 なぜ広川か
  - 上広川 中広川 下広川
  naming_type: 一部の地名
  prefecture: 福岡県
  homonyms:
  - muni/30-広川町
  summary: 八女郡の町で、読みは「ひろかわまち」。「広川」は1889（明治22）年の町村制で上広川村・中広川村・下広川村の3村がそろって名乗った、町村制以前の広川村に遡る既存の地名である。昭和30年（1955）に上・中両村の合併で広川町が発足し、同年12月に下広川村の一部が編入された。同名の和歌山県広川町が合併時に川名を新たに採用した新名であるのと対照的に、こちらは古い地名の継承・統一である。
  first_attestation:
    era: 明治22年
    year_western: 1889
    document: 町村制施行による上広川村・中広川村・下広川村の発足
    note: 「広川」は下広川村を構成した広川村のように、町村制以前から存在した村名・川名に遡る。町としての初出は1955年
  claims:
  - text: 昭和30年（1955）4月1日に上広川村と中広川村が新設合併して広川町が発足し、同年12月1日に下広川村の一部が編入されて現在の町域となった
    kind: fact
    level: E2
    status: established
    sources:
    - h5-hirogawa-fukuoka-masterplan
  - text: 明治22年（1889）の町村制施行により、町域には上広川村・中広川村・下広川村が発足した
    kind: fact
    level: E2
    status: established
    sources:
    - h5-hirogawa-fukuoka-enkaku
  - text: 下広川村は明治8年以来の広川村・藤田村・一条村を区域としており、「広川」という村名は町村制以前から存在した
    kind: fact
    level: E2
    status: established
    sources:
    - h5-hirogawa-fukuoka-enkaku
  - text: 下広川村の区域は全域が広川町に入ったのではなく、一部は筑後市と筑邦町へ分かれて編入された
    kind: fact
    level: E2
    status: established
    sources:
    - h5-hirogawa-fukuoka-ayumi
  - text: 町域は発心山に源を発する広川がつくる広川谷の盆地にあり、町名と同じ川が流れ下って筑後川に注ぐ
    kind: fact
    level: E2
    status: established
    sources:
    - h5-hirogawa-fukuoka-masterplan
  - text: 共通する層として、同名の和歌山県広川町も「広川」という川の名にちなむ町名であり、両町とも町の中心地帯を同名の川が流れる
    kind: fact
    level: E2
    status: established
    sources:
    - h5-hirogawa-wakayama-gaiyo
  - text: 異なる層として、福岡の「広川」は合併で新しく作られた名ではなく、1889年以来3村が共有してきた地名を引き継いで一つの町名に統一したものである。和歌山のように川名を新たに町名へ採用した事例とは成り立ちが逆であり、読みも「ひろかわまち」と異なる
    kind: fact
    level: E2
    status: established
    sources:
    - h5-hirogawa-fukuoka-enkaku
    - h5-hirogawa-kotobank
  - text: 地方公共団体情報システム機構（J-LIS）のコード一覧で、広川町の団体コードは405442とされている
    kind: fact
    level: E2
    status: established
    sources:
    - h5-jlis-fukuoka
  column:
    title: 上・中・下、川の流れで分かれていた三つの「広川」
    text: 福岡の広川町の前身は、川の上流から下流へ、上広川村・中広川村・下広川村と並んでいました。同じ川の流域に暮らしながら、1889年以来ずっと別々の村だったのです。1955年4月にまず上と中が合併して広川町になり、下は同年12月にようやく一部が町へ加わりましたが、残りは筑後市や筑邦町へと分かれました。一つの川の名前を分け合っていた三つの村が、一つの町に結び直されたのが、この町の成り立ちです。
    sources:
    - h5-hirogawa-fukuoka-enkaku
    - h5-hirogawa-fukuoka-ayumi
  relations:
  - pref/40
  - muni/30-広川町
  unknowns:
  - 川名「広川」の語源（広い川原・氾濫原に由来するか等）の町史・地名辞典での確認は未了
  - 町村制以前の「広川村」の成立時期、近世の村名としての初出は未確認
  updated: '2026-11-13'
- id: muni/40-福岡市
  code: '401307'
  names:
    ja: 福岡市
    reading: ふくおかし
    aliases:
    - 博多
    - 福崎
    - 那の津（那津）
  user_terms:
  - 福岡市と博多市はなぜ分かれていたの
  - 福岡と博多 どっちが古い地名
  - 那の津ってどこ
  - 市名は福岡なのに駅名は博多なのはなぜ
  naming_type: 新規命名
  prefecture: 福岡県
  homonyms: []
  summary: 市名「福岡」は、1601年に黒田長政が博多の西隣に築いた城下町の名で、長政が先祖ゆかりの備前福岡にちなんで命名したと地誌が伝える。その下には、古代の港「那津（那の津）」と中世以来の貿易港「博多」という古い地名の層があり、1889年の市制施行では福岡と博多が一つの市となり、市名を福岡とするか博多とするかが争われた。
  first_attestation:
    era: 慶長6年
    year_western: 1601
    document: 福岡城・城下町の命名（経緯は『筑前国続風土記』等に記録）
    note: 市名「福岡」そのものの起源。地名の層としては、8世紀の記録に現れる「博多」、さらに古い「那津」が下に重なる
  claims:
  - text: 市名「福岡」は、1601年（慶長6年）に黒田長政が那珂川西岸の福崎の地に築いた城下町の名に由来し、1889年（明治22年）の市制施行でそのまま市名となった
    kind: fact
    level: E2
    status: established
    sources:
    - f-fukuoka-city
    - f-fukuoka-ndl
  - text: 『筑前国続風土記』は、長政が黒田氏先祖ゆかりの備前国邑久郡福岡にちなんで「福岡」と名付けたと記すと、福岡市史関係資料と国立国会図書館レファレンスが紹介している
    kind: fact
    level: E2
    status: established
    sources:
    - f-cap-chikuzen-fudoki-zoku
    - f-fukuoka-ndl
    - f-fukuoka-city
  - text: 命名の動機については、備前福岡由来説に対し、築城地の旧名「福崎」の丘陵地にちなむとする説もあり、完全には決着していない
    kind: fact
    level: E3
    status: contested
    sources:
    - f-fukuoka-ndl
  - text: 那珂川を挟んだ東側の博多は、もともと博多湾岸一帯を指す広い地名で、中世以降は国際貿易の中心となった都市部分を指すようになったと福岡市史コラムは説明する
    kind: fact
    level: E2
    status: established
    sources:
    - f-fukuoka-city
  - text: 「博多」の文献上の初出は、『続日本紀』（797年完成）の天平宝字3年（759年）の記事にみえる「博多大津」であると福岡市（博多港の歴史）が紹介している
    kind: fact
    level: E2
    status: established
    sources:
    - f-cap-fukuoka-city-port
  - text: さらに古い層として、港は「那津（那の津）」と呼ばれ、『日本書紀』宣化天皇元年（536年）条には、那津の口に穀物を集める官家（那津官家）を造った記事があることを福岡市博物館が紹介している
    kind: fact
    level: E2
    status: established
    sources:
    - f-cap-fukuoka-museum-nanotsu
  - text: 1889年の市制施行後も、市会では「博多市」への改称が争われ、僅差で「福岡」が維持された話が有名であると福岡市史コラムは伝える
    kind: fact
    level: E2
    status: established
    sources:
    - f-fukuoka-city
  - text: 博多の名は、駅名として残ったほか、1972年（昭和47年）に福岡市が政令指定都市へ移行した際、行政区名「博多区」として復活した
    kind: fact
    level: E2
    status: established
    sources:
    - f-fukuoka-city
  - text: 「ハカタ」の語源は確定しておらず、福岡市史コラムも湾岸の地形に由来するという見方を紹介するにとどまる
    kind: fact
    level: E2
    status: indeterminate
    sources:
    - f-fukuoka-city
  column:
    title: 市名は福岡、駅名は博多——妥協が生んだ二つの顔
    text: 1889年、福岡と博多は一つの市になったが、市名をどちらにするかは最後までもめた。人口では博多が福岡を上回っていた時期もあり、翌年の市会でも改称案が争われたと福岡市史は伝える。決着の落としどころとして、同年に開業した九州鉄道の駅名は「福岡駅」ではなく「博多駅」とされた。市役所のある市は福岡、九州最大のターミナル駅は博多、空港は福岡空港——このねじれは、那珂川を挟んで並立した武家の町と商人の町の、400年越しの力関係の化石である。
    sources:
    - f-fukuoka-city
  relations:
  - pref/40
  unknowns:
  - 「ハカタ」の語源（地形由来とされるが具体的な原義）は確定していない
  - 『日本書紀』の「那津」と『続日本紀』の「博多大津」が完全に同一の港を指すかについては検討を要すると専門事典が指摘しており、本KBでは断定しない
  - 福岡命名を命じた長政自身の同時代文書の現存は本調査では確認できず、命名経緯は後世の地誌と家譜に依拠する
  updated: '2026-11-13'
- id: muni/41-佐賀市
  code: '412015'
  names:
    ja: 佐賀市
    reading: さがし
    aliases:
    - 佐嘉
  user_terms:
  - 佐賀市と佐嘉はどう違う
  - 佐賀城下町はいつできた
  - 佐賀市の名前はどこから
  naming_type: その他（佐賀郡・城下町「佐賀」の名を継承して市制を施行）
  prefecture: 佐賀県
  homonyms: []
  summary: 市名は肥前国佐賀郡（古くは佐嘉郡）と、その郡内に育った城下町「佐賀」に由来する。郡名の由来は『肥前国風土記』が伝える「栄の国」伝説と「賢女」伝説が著名だが、いずれも伝承であり、「さが」の語源に定説はない。1889年に佐賀城下町を中心として市制が施行された。
  first_attestation:
    era: 奈良時代（風土記編纂期）
    year_western: null
    document: 肥前国風土記
    note: 「佐嘉郡」の名と由来譚が記録された最古級の資料。風土記自体は713年の編纂命令に基づく
  claims:
  - text: 市名「佐賀」は佐賀郡・城下町の名に由来し、1889年（明治22年）4月1日の市制施行で、佐賀城下町を中心とした佐賀市が誕生した
    kind: fact
    level: E2
    status: established
    sources:
    - f-cap-saga-city-profile
    - f-cap-saga-city-plan
  - text: 『肥前国風土記』佐嘉郡条には、郡名の由来として2つの異なる由緒が併記されている
    kind: fact
    level: E2
    status: established
    sources:
    - f-cap-hizen-fudoki
    - f-saga-city-fudoki
  - text: 風土記の一説では、村に生えた樟（楠）の大木が朝夕の影で隣郡の山々を蔽うほど栄え、日本武尊が「此の国は栄の国と謂うべし」と述べたため栄郡と号し、後に佐嘉郡に改めたと伝える
    kind: legend
    level: E2
    status: established
    sources:
    - f-cap-hizen-fudoki
    - f-saga-city-fudoki
  - text: 風土記のもう一説では、佐嘉川の荒ぶる神を鎮める方策を説いた土蜘蛛の大山田女・狭山田女が「賢女（さかしめ）」と讃えられ、賢女郡と号したものが訛って佐嘉郡になったと伝える
    kind: legend
    level: E2
    status: established
    sources:
    - f-cap-hizen-fudoki
    - f-saga-city-fudoki
  - text: 「さが」の語源については、満潮時に逆流する川にちなむ「逆川」説、傾斜地を指す「坂」説、砂丘地を指す「洲処（すが）」の転訛説などがあり、定説は定まっていない
    kind: fact
    level: E3
    status: contested
    sources:
    - f-saga-city-fudoki
  - text: 表記は古く「佐嘉」が正式で「佐賀」も並行して使われ、明治初年に「佐賀」へ統一されたが、統一の年を1870年とする資料と1872年とする資料がある
    kind: fact
    level: E2
    status: contested
    sources:
    - f-saga-city-fudoki
  - text: 戦国期に龍造寺氏の城下町として発展した佐賀は、1608年（慶長13年）に鍋島直茂が藩主となって佐賀城の総普請が始まり、鍋島氏の城下町として整備された
    kind: fact
    level: E2
    status: established
    sources:
    - f-cap-saga-city-profile
  - text: 現在の市域は、2005年（平成17年）に諸富町・大和町・富士町・三瀬村と、2007年（平成19年）に川副町・東与賀町・久保田町と合併して拡大したもので、1889年の市域は佐賀平野中央部の城下町周辺にとどまっていた
    kind: fact
    level: E2
    status: established
    sources:
    - f-cap-saga-city-plan
  column:
    title: 「佐嘉」と「佐賀」、千年並んだ二つの表記
    text: 佐賀の表記は、奈良時代の『肥前国風土記』以来「佐嘉」が正式とされながら、「佐賀」も古代から並行して使われ続けた。どちらも読みは「さが」で、意味の違いはほとんど意識されないまま千年以上が過ぎ、統一されたのは明治初年のことである（年については1870年説と1872年説がある）。いまもJRの駅は「佐賀駅」だが、佐賀県のゆるキャラ的な話題や老舗の屋号には「佐嘉」の字が残る。表記の統一が遅れた分だけ、古い字のほうにも愛着が残った土地柄といえる。
    sources:
    - f-saga-city-fudoki
  relations:
  - pref/41
  unknowns:
  - 「佐嘉」から「佐賀」への表記統一の正確な年月は資料間で一致せず、本調査では特定できなかった
  - 風土記の2つの由来譚のうち、どちらが実際の郡名成立に近いかは資料上判断できない
  - 「さが」の語源は確定していない
  updated: '2026-11-13'
- id: muni/42-長崎市
  code: '422011'
  names:
    ja: 長崎市
    reading: ながさきし
    aliases:
    - 長埼
    - 永埼
  user_terms:
  - 長崎市の名前は長い岬から
  - 長崎氏って誰
  - 長崎はいつ開港したの
  - 長崎市はいつできた
  naming_type: その他（港町「長崎」の名をそのまま市名とした）
  prefecture: 長崎県
  homonyms: []
  summary: 市名は港町「長崎」に由来する。地名の起源には、長崎港に突き出した「長い岬」にちなむ説と、在地豪族・長崎氏にちなむ説があり、長崎市関連資料も両説を併記する。1571年の開港で貿易港として発展し、1889年に旧幕府直轄地を中心とした区域で市制が施行された。
  first_attestation:
    era: 嘉禎3年
    year_western: 1237
    document: 福田文書等にみえる長崎小太郎重綱の知行記録（研究経由）
    note: 鎌倉初期に「長埼浦」の地頭職を知行した長崎氏の存在が確認できる時点。地名自体はこれ以前から存在した可能性が高い
  claims:
  - text: 市名「長崎」は港町の名に由来し、1889年（明治22年）4月1日に市制が施行されたときの市域は、旧幕府直轄地を中心とした区域であった
    kind: fact
    level: E2
    status: established
    sources:
    - f-cap-nagasaki-city-fuuchi
    - f-cap-nagasaki-city-chronology
  - text: 地名「長崎」の由来には、諏訪神社付近から長崎港へ突き出した長い岬の地形にちなむとする説がある
    kind: fact
    level: E2
    status: contested
    sources:
    - f-nagasaki-city-magazine
    - f-nagasaki-city-profile
  - text: もう一つの説は、室町時代に移住してきた豪族・長崎氏（永崎氏）の名に由来するとするもので、長崎市関連資料は岬説と長崎氏説の2説を併記している
    kind: fact
    level: E2
    status: contested
    sources:
    - f-nagasaki-city-magazine
  - text: 鎌倉初期の嘉禎3年（1237年）頃、長崎小太郎重綱が長埼浦の地頭職を知行する御家人であったことが、後の研究で判明している
    kind: fact
    level: E2
    status: established
    sources:
    - f-nagasaki-city-magazine
  - text: 野母崎半島を指す「長か岬（ながかみさき）」が方言で「なんかみさき」と転訛して「長崎」になったという説明は、地元で語られる俗説として伝えられている
    kind: legend
    level: E4
    status: established
    sources:
    - f-nagasaki-city-magazine
  - text: 長崎の発展は元亀2年（1571年）のポルトガル船入港と開港を画期とし、大村純忠のもとで岬の周辺に6町の町建てが進んだ
    kind: fact
    level: E2
    status: established
    sources:
    - f-nagasaki-city-magazine
    - f-nagasaki-city-profile
  - text: 開港当時の長崎の領主格であった長崎甚左衛門純景は長崎氏の後裔で、大村純忠の娘を妻とし、自らもキリシタンとなった
    kind: fact
    level: E2
    status: established
    sources:
    - f-nagasaki-city-magazine
  - text: 現在の市域は、2005年（平成17年）に香焼・伊王島・高島・野母崎・三和・外海の6町、2006年（平成18年）に琴海町と合併して拡大したもので、開港時の町域とは大きく異なる
    kind: fact
    level: E2
    status: established
    sources:
    - f-nagasaki-city-profile
  column:
    title: 町の中心は、岬の付け根から先端へ移った
    text: 開港前の長崎の中心は、諏訪神社の鎮座する森崎——岬の付け根あたりの集落だった。ところが1571年の開港とともに、大村純忠は岬の先のほうに横瀬浦町・平戸町・外浦町・大村町・文治町・嶋原町という6つの新しい町を建て、貿易の拠点をそちらへ寄せた。現在の県庁・市役所通りのあたりがその6町に相当する。つまり「長崎」という町の重心は、開港の瞬間に岬を少し下った場所へ引っ越したのであり、古い中心は神社の門前として残った。
    sources:
    - f-nagasaki-city-magazine
    - f-cap-nagasaki-magazine2
  relations:
  - pref/42
  unknowns:
  - 「長崎」の語が文献に現れる正確な初出（表記は永埼・長埼など）は本調査では一次史料で直接確認できておらず、1237年の知行記録は研究紹介経由の確認である
  - 岬由来説と長崎氏由来説の先後関係（地名が先か苗字が先か）は確定していない
  updated: '2026-11-13'
- id: muni/43-小国町
  code: '434248'
  names:
    ja: 小国町
    reading: おぐにまち
    aliases:
    - 小国郷
    - 北小国村
  user_terms:
  - 小国町の名前の由来
  - 国小なりの伝説
  - 小国郷とはどこ
  naming_type: その他
  prefecture: 熊本県
  homonyms:
  - muni/06-小国町
  summary: 阿蘇の北側に広がる小国郷の名の継承。中世の文書に「小国之分」と見える地域で、1889年に北小国村・南小国村に分かれ、1935年に北小国村が町制施行と同時に「小国町」へ改称した。町公式は地名の起こりとして、健磐竜命にまつわる「臣が国小なり」という言葉から「小国」が生まれたという伝説を、『小国郷史』由来の話として伝える。
  first_attestation:
    era: 室町時代（文明16年）
    year_western: 1484
    document: 阿蘇家文書「阿蘇十二社同霜宮最花米注文」（「小国之分」）
    note: 『日本歴史地名大系』の記載として阿蘇ペディアが紹介するもの。原典は未読のため紹介として記録する。より古い用例として『豊後国風土記』の「小国の峯」が南小国町の町名由来（熊本県資料）に紹介されるが、原文での確認は未了
  claims:
  - text: 阿蘇神社の祭神・健磐竜命が阿蘇山上から放った矢の落ちた御矢の原（現在の宮原）の地主・大河片澄が、巡視に来た二神を迎えて「臣が国、小なりと雖も、青山四方を巡りて住み吉の国なり」と申し上げた。その言葉の中の「国小なり」から「小国」の地名が生まれたという話が、『小国郷史』からの引用として町公式・熊本県資料に伝えられる
    kind: legend
    level: E2
    status: established
    sources:
    - h3-oguni-k-town
    - h3-oguni-k-pref
  - text: 文明16年（1484年）の阿蘇家文書「阿蘇十二社同霜宮最花米注文」に「小国之分」の記載があり、郷内の二十数か村の名が見えることを『日本歴史地名大系』が紹介していると阿蘇ペディアが伝える
    kind: fact
    level: E4
    status: established
    sources:
    - h3-oguni-k-asopedia
  - text: 中世の小国郷は阿蘇本社領に属し、満願寺・宮原・上田・北里などの村が含まれていたと阿蘇ペディアが伝える
    kind: fact
    level: E4
    status: established
    sources:
    - h3-oguni-k-asopedia
  - text: 明治3年（1870年）に旧25か村が9か村となり、明治22年（1889年）の町村制施行で北小国村（6か村）と南小国村（3か村）に分かれた
    kind: fact
    level: E2
    status: established
    sources:
    - h3-oguni-k-town
  - text: 北小国村は昭和10年（1935年）4月1日に町制を施行し「小国町」と改称した。町公式は、人口11,000人余で県内で唯一の人口1万人以上の村だったことなどを、その背景として記す
    kind: fact
    level: E2
    status: established
    sources:
    - h3-oguni-k-town
  - text: 山形県小国町とは、山に囲まれた盆地の郷名「小国」を継ぐ点で共通する。異なるのは、本町では「国小なり」の言葉に由来するという伝説が『小国郷史』以来の説明として公式に伝えられている点で、山形側には対応する命名伝説が確認できない
    kind: fact
    level: E3
    status: established
    sources:
    - h3-oguni-k-town
    - h3-oguni-jk
  - text: 総務省「地方公共団体コード一覧」では本町のコードは434248とされる
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 矢が落ちた原と「御矢の原」
    text: 伝説で健磐竜命の矢が落ちたとされる「御矢の原」は、現在の宮原にあたると町は説明します。宮原は今も町の中心地で、役場や商店が集まります。地名の伝説が現在の中心地と結びついて語り継がれているのが、この町の伝承の特徴です。
    sources:
    - h3-oguni-k-town
    - h3-oguni-k-pref
  relations:
  - pref/43
  - muni/06-小国町
  unknowns:
  - 「小国郷」の文書上の初出の確定（『豊後国風土記』の「小国の峯」の原文確認を含む）
  - 伝説とは別に、歴史地名としての「小国」の成立理由を専門資料がどう説明するか
  updated: '2026-11-13'
- id: muni/43-熊本市
  code: '431001'
  names:
    ja: 熊本市
    reading: くまもとし
    aliases:
    - 隈本
  user_terms:
  - 熊本は昔は隈本だったの
  - 清正が熊の字に変えた理由
  - 隈本城と熊本城は同じ場所
  - 熊本市はいつできた
  naming_type: その他（城下町名の継承。ただし表記は近世初頭に「隈本」から「熊本」へ改められた）
  prefecture: 熊本県
  homonyms: []
  summary: 市名は城下町「熊本」に由来し、その旧表記は「隈本」である。隈本の名は南北朝時代の軍忠状に確認でき、1607年の熊本城完成の頃に「隈」から「熊」へ表記が改められたとされる。改字の理由として語られる「畏を嫌った」という説明は伝承の域を出ない。1889年に市制が施行された。
  first_attestation:
    era: 観応2年
    year_western: 1351
    document: 伊東氏祐軍忠状
    note: 「隈本在陣」とあり、「隈本」の初見とされる（熊本市の講座資料による）。「隈本城」の初見は永和3年（1377年）の大嶋堅軍忠状
  claims:
  - text: 市名「熊本」は城下町の名に由来し、熊本市は1889年（明治22年）の市制施行以来、周辺町村との合併を繰り返して発展してきた
    kind: fact
    level: E2
    status: established
    sources:
    - f-cap-kumamoto-city-plan
  - text: 「隈本」の初見は観応2年（1351年）の伊東氏祐軍忠状の「隈本在陣」で、「隈本城」の初見は永和3年（1377年）の大嶋堅軍忠状である
    kind: fact
    level: E2
    status: established
    sources:
    - f-cap-kumamoto-city-lecture
  - text: 中世の隈本城は茶臼山の一角に築かれた城で、現在の熊本城の本丸一帯とは位置が少しずれており、近世の城とは区別して「古城」と呼ばれている
    kind: fact
    level: E2
    status: established
    sources:
    - f-cap-kumamoto-city-lecture
    - f-kumamoto-kotobank
  - text: 1607年（慶長12年）の熊本城完成の頃、「隈本」から「熊本」への表記変更が行われたとされる
    kind: fact
    level: E2
    status: established
    sources:
    - f-kumamoto-maff
  - text: 加藤清正が「隈」の字に「畏（おそれる）」の字を含むことを嫌い、武将の居城にふさわしくないとして「熊」の字に改めた、と広く伝えられている
    kind: legend
    level: E2
    status: established
    sources:
    - f-kumamoto-maff
  - text: 「隈」は川の屈曲部や山の奥まった場所を指す地形語であり、隈本も地形に由来する地名とする見方が地名学では示されている
    kind: fact
    level: E3
    status: contested
    sources:
    - f-kumamoto-kotobank
  - text: 隈本の由来として、菊池氏の祖・菊池則隆が鞍岳から眺めた山並みの「隈取り」にちなんで隈本・隈府と名付けたとする伝承が語られている
    kind: legend
    level: E4
    status: established
    sources:
    - f-kumamoto-kikuchi
  - text: 熊本市は2012年（平成24年）4月1日に政令指定都市へ移行し、九州では福岡市・北九州市に次ぐ政令市となった
    kind: fact
    level: E2
    status: established
    sources:
    - f-cap-kumamoto-city-plan
  column:
    title: 清正は「くまもと城」を二つ造った
    text: 熊本城と聞いて思い浮かべる天守は加藤清正の新城だが、清正はそれ以前に、中世の隈本城を取り込んだ「古城」も造っている。熊本市の講座資料は「清正は新旧二つの『くまもと城』を造った」と整理する。中世の隈本城は茶臼山の一角にあり、新城の本丸とは場所がずれる。地名のほうも同じで、「隈本」の舞台は古城の側、「熊本」の舞台は新城の側というように、字の交代と城の交代がほぼ重なって起きた。だから熊本の中心市街を歩くと、中世と近世の二つの「くまもと」が同じ丘の上に重なっている。
    sources:
    - f-cap-kumamoto-city-lecture
  relations:
  - pref/43
  unknowns:
  - 加藤清正が隈本から熊本への改字を命じたことを示す同時代の正式文書の現存は、本調査では確認できなかった
  - 「隈本」の語源（地形由来か、その他か）は確定していない
  updated: '2026-11-13'
- id: muni/43-美里町
  code: '433489'
  names:
    ja: 美里町
    reading: みさとまち
    aliases: []
  user_terms:
  - 美里町の名前の由来
  - 中央町と砥用町が合併した町
  - 美里町は公募で決まった名前
  naming_type: 合併新設
  prefecture: 熊本県
  homonyms:
  - muni/04-美里町
  - muni/11-美里町
  summary: 2004年に中央町と砥用町が合併した際、全国公募と合併協議会の投票で決まった新町名。町公式・県資料には「いつまでも美しいふる里であって欲しい」という理由文が残り、「美しい里」型の命名であることが公式に確認できる。最終候補には「石橋町」「宇城東町」などもあった。
  first_attestation:
    era: 平成16年
    year_western: 2004
    document: 自治体名としての「美里町」（中央町・砥用町合併協議会の第18回協議会の投票で決定）
    note: 合併前の両町域に「美里」という地名があったかは未確認
  claims:
  - text: 平成16年（2004年）11月1日に中央町と砥用町が合併して美里町が誕生した。町名は全国から公募した中から選考し、「いつまでも美しいふる里でありますように」等の理由から美里町となったと町の公式ページが説明する
    kind: fact
    level: E2
    status: established
    sources:
    - h3-kumamoto-misato-town
  - text: 熊本県の市町村史資料によれば、最終候補は「あけぼの町」「石橋町」「宇城東町」「砥央町」「美里町」の5点で、第18回合併協議会の投票により「美里町」に決定した
    kind: fact
    level: E2
    status: established
    sources:
    - h3-kumamoto-misato-pref
  - text: 投票結果は美里町7票、宇城東町5票、石橋町4票、砥央町4票、あけぼの町1票だったと町の広報が伝える
    kind: fact
    level: E2
    status: established
    sources:
    - h3-kumamoto-misato-koho
  - text: 「美里」が候補に推された理由として「いつまでも美しいふる里であって欲しい」「山紫水明のごとき眺望」「山と水に恵まれ、人情味豊かで美しいふる里にしたい」などが県資料に記録されている
    kind: fact
    level: E2
    status: established
    sources:
    - h3-kumamoto-misato-pref
  - text: 3町とも合併新名で「美しい里」と読める字面は共通する。本町は理由文が公式に残り「美しい里」型の命名と確認できる点で、理由の確認できない宮城県美里町と異なる。埼玉県美里町は「平和な農村」への願いとして説明され、字義の中心がやや異なる
    kind: fact
    level: E2
    status: established
    sources:
    - h3-kumamoto-misato-town
    - h3-saitama-mayor
  - text: 総務省「地方公共団体コード一覧」では本町のコードは433489とされる
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 投票結果まで残る命名
    text: 最終候補5点と得票数（美里町7・宇城東町5・石橋町4・砥央町4・あけぼの町1）が町広報と県資料に残っており、全国公募から投票までの過程をたどることができます。「美しいふる里」という理由文とあわせ、平成期の合併新名としては記録の残り方が丁寧な部類です。
    sources:
    - h3-kumamoto-misato-pref
    - h3-kumamoto-misato-koho
  relations:
  - pref/43
  - muni/04-美里町
  - muni/11-美里町
  unknowns:
  - 公募の応募総数
  - 合併前の両町域に「美里」という字名・小地名があったか
  updated: '2026-11-13'
- id: muni/43-高森町
  code: '434281'
  names:
    ja: 高森町
    reading: たかもりまち
    aliases:
    - 高森手永
    - 色見村
    - 草部村
    - 野尻村
  user_terms:
  - 熊本の高森町の由来
  - 阿蘇の高森町 なぜ高森か
  - 高森殿の杉のある町
  naming_type: 一部の地名
  prefecture: 熊本県
  homonyms:
  - muni/20-高森町
  summary: 阿蘇郡の町。地名「高森」は江戸時代に細川藩の行政区画「高森手永」が置かれた古い地名で、1889年の町村制ですでに高森町が存在した。昭和30年（1955）の合併でも旧高森町の名がそのまま継承されており、合併新名ではなく既存地名の存続である。語源については「高貴なる阿蘇大神が一時、宮居を定めた森」に由来するという伝承が『日本大百科全書』に紹介されており、伝説として分離して記録する。同名の長野県高森町は1957年に本高森山から採った新名で、成り立ちが逆である。
  first_attestation:
    era: 明治22年
    year_western: 1889
    document: 町村制施行による高森町の発足
    note: 自治体としての初出は1889年だが、地名「高森」は江戸時代の行政区画「高森手永」に遡り、町村制以前から使われていた
  claims:
  - text: 江戸時代、町域は肥後細川藩の南郷郡代の管下にあり、高森手永と野尻手永に分かれて支配されていた
    kind: fact
    level: E2
    status: established
    sources:
    - h5-takamori-kumamoto-enkaku
  - text: 明治22年（1889）の町村制施行により、高森町・色見村・草部村・野尻村の1町3村になった
    kind: fact
    level: E2
    status: established
    sources:
    - h5-takamori-kumamoto-enkaku
  - text: 昭和30年（1955）4月に旧高森町・色見村・草部村が合併して新しい高森町が誕生し、昭和32年（1957）8月には野尻村が編入された
    kind: fact
    level: E2
    status: established
    sources:
    - h5-takamori-kumamoto-kaso
  - text: 町名の由来について、当地方の伝承として「高貴なる阿蘇大神が一時、宮居を定めた森」に由来すると伝えられている
    kind: legend
    level: E3
    status: established
    sources:
    - h5-takamori-kotobank
  - text: 町内では、戦国時代に高森一帯を治めた高森城主・高森伊予守惟居を指す「高森殿」の名が残り、「高森殿の杉」が観光地となっている
    kind: fact
    level: E4
    status: established
    sources:
    - h5-takamori-kanko-sugi
  - text: 異なる層として、同名の長野県高森町は1957年に両村を結ぶ本高森山から新たに名付けられた合併新名であるのに対し、熊本の高森は江戸期以来の地名で、合併では旧高森町の名がそのまま継承された
    kind: fact
    level: E2
    status: established
    sources:
    - h5-takamori-nagano-handbook
  - text: 共通する層として、両町とも「森」を含む名が山地の地形と結びついた町であり、昭和の大合併期に現在の町として発足した点は共通する
    kind: fact
    level: E2
    status: established
    sources:
    - h5-takamori-kumamoto-kaso
    - h5-takamori-nagano-handbook
  - text: 熊本県の地方公共団体コード一覧で、高森町の団体コードは434281とされている
    kind: fact
    level: E2
    status: established
    sources:
    - h5-kumamoto-codes
  column:
    title: 神の森と、「高森殿」の杉
    text: 熊本の高森には、地名をめぐる物語が二つ重なっています。一つは『日本大百科全書』が伝える「高貴なる阿蘇大神が一時、宮居を定めた森」という伝承で、「高森」を神の森として語る層です。もう一つは歴史の層で、戦国時代に高森城を拠点に一帯を治めた高森伊予守惟居は「高森殿」と呼ばれ、その名を残す「高森殿の杉」が今も観光地になっています。神話の森と戦国の殿様。古い地名には、こうして何層もの物語が積み重なります。
    sources:
    - h5-takamori-kotobank
    - h5-takamori-kanko-sugi
  relations:
  - pref/43
  - muni/20-高森町
  unknowns:
  - 「高森」の語源を確定する中世の文書（高森郷・高森村などの記載）の確認は未了であり、伝承以外の定説は本調査で確認できなかった
  - 高森手永の設置年など、江戸時代初期の行政区画としての「高森」の詳細は未確認
  updated: '2026-11-13'
- id: muni/44-大分市
  code: '442011'
  names:
    ja: 大分市
    reading: おおいたし
    aliases:
    - 府内
    - 碩田
  user_terms:
  - 大分市は昔は府内だったの
  - 大分市はいつできた 1963年合併
  - 碩田と大分の関係
  - 鶴崎はなぜ大分市になった
  naming_type: 合併新設
  prefecture: 大分県
  homonyms: []
  summary: 現在の大分市は1963年に旧大分市・鶴崎市など6市町村が合併して発足した新設市で、名は豊後国大分郡の郡名「大分」を継いだ。「大分」は『日本書紀』『豊後国風土記』の碩田（おおきた）の故事に結びつけられるが、地形に由来するとする対立説もある。近世までの中心地の名は、国府にちなむ「府内」だった。
  first_attestation:
    era: 古代（日本書紀・景行天皇紀）
    year_western: null
    document: 日本書紀
    note: 「碩田國に到りたまふ…碩田、此れをば於保岐陀と云う」とあり、音「おおきた」の最古級の記録。景行天皇の年代自体は伝承上のもので実年代は特定できない。市名としての「大分」の直接の起点は1911年の大分町の市制施行である
  claims:
  - text: 現在の大分市は、1963年（昭和38年）3月10日に旧大分市・鶴崎市・大南町・大分町・大在村・坂ノ市町が合併して発足した
    kind: fact
    level: E2
    status: established
    sources:
    - f-cap-oita-city-chronology
  - text: 最初の「大分市」は、1911年（明治44年）に大分町が市制を施行して成立した
    kind: fact
    level: E2
    status: established
    sources:
    - f-cap-oita-city-chronology
  - text: 市名「大分」は豊後国大分郡の郡名に由来し、大分県の県名も同じ郡名から採られている
    kind: fact
    level: E2
    status: established
    sources:
    - f-oita-pref
  - text: 『日本書紀』と『豊後国風土記』には景行天皇の言葉として碩田の命名が記され、この「碩田（おおきた）」が後に「大分」と書かれるようになったと大分県公式は説明する
    kind: fact
    level: E2
    status: established
    sources:
    - f-cap-bungo-fudoki
    - f-oita-pref
  - text: 景行天皇が巡幸先で土地を眺めて「碩田」と命名したという物語そのものは、記紀・風土記に共通する天皇命名譚であり、史実の命名行為としてではなく伝承として扱うべき性格のものである
    kind: legend
    level: E2
    status: established
    sources:
    - f-cap-bungo-fudoki
    - f-oita-pref
  - text: 語源については、「キダ（段）」と「分」から、谷や川、山によって大きく刻み分けられた土地を表す言葉とする地形説も大分市歴史資料館が紹介しており、碩田の故事と併存している
    kind: fact
    level: E2
    status: contested
    sources:
    - f-cap-oita-city-exhibition
  - text: 近世までの中心地は「府内」と呼ばれた。大分郡には豊後国の国府が置かれ、その名残は近世の府内城・府内藩の名に残った
    kind: fact
    level: E2
    status: established
    sources:
    - f-cap-oita-city-history-env
  - text: 国府の中心と推定される大規模な官衙遺跡は大分川流域の台地上で見つかっており、近世の府内城下が大分川河口側に形成されたことと合わせ、古代の中心と近世以降の中心市街地とは位置がずれている
    kind: fact
    level: E2
    status: established
    sources:
    - f-cap-oita-city-history-env
  column:
    title: 「府内」から「大分」へ、中心の名前が交代した街
    text: 大分の中心市街は、江戸時代までずっと「府内」と呼ばれてきた。国府のある土地という意味の、全国各地にあった普通名詞的な地名である。ところが明治になると表舞台に立ったのは郡名の「大分」のほうで、1911年の市制施行で大分市が成立し、府内は城の名や学校名などに残るだけになった。さらに1963年には、江戸時代は別の支配を受けた港町・鶴崎などと合併して新・大分市が発足する。「国府の府内」「郡名の大分」「合併都市の大分市」と、中心の呼び名が時代ごとに交代してきた街である。
    sources:
    - f-cap-oita-city-history-env
    - f-cap-oita-city-chronology
  relations:
  - pref/44
  unknowns:
  - 「碩田」から「大分」への表記変更がいつ、どの文書で確認できるかは本調査では特定できなかった
  - 「府内」の呼称が文献に現れる初出は本調査では確認できなかった
  - 1963年の合併で市名を「大分市」とすることに決まった経緯（候補名の有無など）は本調査では確認できなかった
  updated: '2026-11-13'
- id: muni/45-宮崎市
  code: '452017'
  names:
    ja: 宮崎市
    reading: みやざきし
    aliases:
    - 宮埼
  user_terms:
  - 宮崎市の名前の由来 宮って何の宮
  - 宮崎市はいつできた 1924年
  - 神武天皇と宮崎市の関係
  naming_type: 合併新設
  prefecture: 宮崎県
  homonyms: []
  summary: 市は1924年に宮崎町・大淀町・大宮村が合併して発足し、中心町だった宮崎町の名を採った。「宮崎」は日向国宮崎郡の郡名で、『和名類聚抄』に確認できる。語源は神社の前を意味する「宮前」説が有力とされるが、「宮」にあたる神社の特定は確定しておらず、神武天皇の宮居伝承も並んで語られる。
  first_attestation:
    era: 承平年間
    year_western: null
    document: 和名類聚抄
    note: 日向国宮崎郡を収載し、諸本に「宮埼」「宮崎」の表記と「三也佐伎（みやさき）」の訓がみえる。成立は934年頃
  claims:
  - text: 宮崎市は1924年（大正13年）4月1日、宮崎郡宮崎町・大淀町・大宮村の廃置分合により市制を施行して発足し、名は中心町だった宮崎町の名を継いだ
    kind: fact
    level: E2
    status: established
    sources:
    - f-cap-miyazaki-city-history
  - text: 『和名類聚抄』に日向国宮崎郡の名が見え、諸本では「宮埼」とも「宮崎」とも記され、「三也佐伎」の訓がある
    kind: fact
    level: E3
    status: established
    sources:
    - f-cap-wamyosho
    - f-miyazaki-kotobank
  - text: 郡名の語源として有力なのは「宮（神社）の前」を意味する「宮前（みやさき）」が転じたとする説で、「宮」にあたる神社は宮崎郡内の式内社・江田神社とする見方がある
    kind: fact
    level: E3
    status: contested
    sources:
    - f-miyazaki-ndl
  - text: この地が神武天皇の宮居の地であったことから「宮崎」と呼ぶようになったという古老伝が、『日向旧跡見聞録』や『太宰管内志』に記録されている
    kind: legend
    level: E3
    status: established
    sources:
    - f-miyazaki-kotobank
  - text: 神武天皇の宮居伝承の候補地として、皇宮屋（宮崎市下北方町）や奈古神社の前である「宮前」が挙げられている
    kind: legend
    level: E2
    status: established
    sources:
    - f-miyazaki-ndl
  - text: 宮崎町は1873年（明治6年）の宮崎県設置で県庁所在地となり、1876年の鹿児島県への合併と1883年（明治16年）の宮崎県再置を経て、県都の町として発展した
    kind: fact
    level: E2
    status: established
    sources:
    - f-miyazaki-ndl
    - f-cap-miyazaki-city-history
  - text: 現在の市域は、2006年（平成18年）に佐土原町・田野町・高岡町、2010年（平成22年）に清武町を編入合併して大きく広がったもので、1924年の発足時の市域は大淀川下流の平野部にとどまっていた
    kind: fact
    level: E2
    status: established
    sources:
    - f-cap-miyazaki-city-history
  column:
    title: 「宮の前」の宮は、どの神社なのか
    text: 「宮前（みやさき）」説を採るなら、次に問われるのは「その宮はどの神社か」である。候補には、式内社の江田神社、神武天皇を祀る宮崎神宮、その前身とされる奈古神社などが挙がり、神武の宮居跡とされる皇宮屋も市内に伝わる。宮崎神宮の社殿が現在の形に整うのは近代以降で、古代の郡名の由来をそのまま結びつけるには慎重さが要る。地名の側から見ると、「宮崎」は神社の門前という地形・位置の名だった可能性と、建国神話の舞台という物語の名である可能性が、いまも並んで立っている。
    sources:
    - f-miyazaki-ndl
    - f-miyazaki-kotobank
  relations:
  - pref/45
  unknowns:
  - 「宮前」説で「宮」にあたる神社の特定（江田神社・奈古神社・宮崎神宮の前身等）は確定していない
  - 宮崎町から1924年の新市名決定に至る経緯（他候補の有無）は本調査では確認できなかった
  updated: '2026-11-13'
- id: muni/45-美郷町
  code: '454311'
  names:
    ja: 美郷町
    reading: みさとちょう
    aliases: []
  user_terms:
  - 美郷町の名前の由来
  - 宮崎の美郷町は南郷・西郷・北郷が合併した町
  - 美郷町は秋田と島根と宮崎にある
  naming_type: 合併新設
  prefecture: 宮崎県
  homonyms:
  - muni/05-美郷町
  - muni/32-美郷町
  summary: 平成18年（2006年）1月1日に南郷村・西郷村・北郷村が対等合併して誕生した新名。旧3村はいずれも名に「郷」を含んでおり、新名「美郷」はその共通の「郷」を受け継ぎながら「美しい郷」を掲げた形になっている。ただし命名理由を明示した町の公表資料は今回の調査では見つからず、理由が公式に説明されている秋田県・島根県の美郷町とは異なる。
  first_attestation:
    era: 平成18年
    year_western: 2006
    document: 美郷町の発足（2006年1月1日）
    note: 自治体としての発足をもって名称の初出とする
  claims:
  - text: 平成18年（2006年）1月1日、東臼杵郡の南郷村・西郷村・北郷村が対等合併して美郷町が誕生した。平成17年（2005年）2月22日に合併協定が調印され、同年9月2日付けの官報に総務大臣の告示がなされた
    kind: fact
    level: E2
    status: established
    sources:
    - h4-miyazaki-misato-profile
  - text: 旧3村はいずれも明治22年（1889年）の町村制施行で生まれ、南郷村は上渡川村・中渡川村・鬼神野村・神門村・水清谷村の5村、西郷村は山三ヶ村・小原村・田代村・立石村の4村、北郷村は宇納間村・入下村・黒木村の3村が合併して発足した
    kind: fact
    level: E2
    status: established
    sources:
    - h4-miyazaki-misato-keikaku
  - text: 【異なる層】3つの旧村名はいずれも「郷」の字を含んでおり（南郷・西郷・北郷）、新名「美郷」はこの「郷」を3村の共通項として受け継いだ形になっている。旧町村名に「郷」を含む事情は、秋田・島根の美郷町にはない
    kind: fact
    level: E2
    status: established
    sources:
    - h4-miyazaki-misato-profile
  - text: 本町の命名理由を明示した町の公表資料（合併協議の記録・町史等）は、今回の公開資料調査では見つからなかった。移住情報サイトの町提供文では「美しい山々と清流に恵まれた美しい郷、それが美郷町です」と語られるが、これは町の紹介文であって命名理由の説明ではない
    kind: fact
    level: E2
    status: indeterminate
    sources:
    - h4-miyazaki-misato-join
    - h4-miyazaki-misato-profile
  - text: 【共通する層】秋田県・島根県の美郷町と同様、平成の大合併において旧町村名のどれでもない新しい名を掲げた新設合併の町である
    kind: fact
    level: E2
    status: established
    sources:
    - h4-akita-gappei-kiroku
    - h4-shimane-misato-gaiyo
  column:
    title: 三つの「郷」が一つになった
    text: 南郷・西郷・北郷。合併した3村は、方位こそ違えど全員が「郷」の字を背負っていた。新町の名が「美郷」になったとき、「郷」は3村の共通項として残り、頭に「美」が付いた。命名理由の公式な記録は見つからなかったが、名前の形そのものが3村の歩みを物語っている。
    sources:
    - h4-miyazaki-misato-profile
  relations:
  - pref/45
  - muni/05-美郷町
  - muni/32-美郷町
  unknowns:
  - 新町名「美郷」の選定過程と命名理由を明示した公表資料は未確認（合併協議会の記録や町史の確認が必要）
  - 旧3村の名（南郷・西郷・北郷）の由来そのものは未確認
  updated: '2026-11-13'
- id: muni/46-鹿児島市
  code: '462012'
  names:
    ja: 鹿児島市
    reading: かごしまし
    aliases:
    - 麑嶋
    - 鹿児島郡
  user_terms:
  - 鹿児島市と桜島はどっちが先の名前
  - 鹿児島市の名前 鹿と関係あるの
  - 鹿児島市はいつできた 最初の市
  naming_type: 合併新設
  prefecture: 鹿児島県
  homonyms: []
  summary: 市名は薩摩国鹿児島郡・城下町「鹿児島」に由来する。「鹿児島」はもともと桜島の古名だったとする見方が有力だが、その語源は鹿の子・火山を意味する「カグ」・水夫「カコ」・崖を意味する「カゴ」など諸説あり確定していない。1889年に旧城下の町々と近在の村々の合併で発足し、全国で最初に市制が施行された市の一つとなった。
  first_attestation:
    era: 天平宝字8年
    year_western: 764
    document: 続日本紀
    note: 桜島の噴火を記した記事に「麑島」とあるのが「鹿児島」の文献上の初見であると鹿児島県の資料は紹介する。指示対象は現在の桜島とされる。神名としての「鹿児島」は『日本三代実録』貞観2年（860年）条に確認できる
  claims:
  - text: 鹿児島市は1889年（明治22年）4月1日に市制が施行されて発足し、全国で最初に市制が施行された市の一つである
    kind: fact
    level: E2
    status: established
    sources:
    - f-cap-kagoshima-city-profile
  - text: 市勢要覧の総説に収められた表は、市制施行時の鹿児島市の構成を50町村と示している
    kind: fact
    level: E2
    status: established
    sources:
    - f-cap-kagoshima-city-sousetu
  - text: 「鹿児島」はもともと桜島の古名だったとする見方があり、鹿児島県公式が紹介し、『日本歴史地名大系』も妥当としている
    kind: fact
    level: E2
    status: established
    sources:
    - f-kagoshima-pref
    - f-kagoshima-kotobank
  - text: 鹿児島県の資料は、『続日本紀』天平宝字8年（764年）の桜島噴火の記事にみえる「麑島」を、「鹿児島」の文献上の初見として紹介している
    kind: fact
    level: E2
    status: established
    sources:
    - f-cap-kagoshima-pref-goroumon
  - text: 『日本三代実録』貞観2年（860年）3月条に、薩摩国の鹿児島神に従五位上を授けたことが記録されており、「鹿児島」の名は9世紀には神名として存在した
    kind: fact
    level: E2
    status: established
    sources:
    - f-cap-sandai-jitsuroku
    - f-kagoshima-kotobank
  - text: 鹿児島の語源について鹿児島県公式は、野生の鹿の子が多く生息していたから、火山を意味する「カグ」という言葉から、多くの水夫（かこ）が住んでいたから、などさまざまな説があるとして併記している
    kind: fact
    level: E2
    status: contested
    sources:
    - f-kagoshima-pref
  - text: 山幸彦（天津日高彦穂々出見尊）が海神の宮へ行く際に乗った舟が鹿児山で作られたことに由来するという、神話に結びつけた由来譚も伝えられている
    kind: legend
    level: E3
    status: established
    sources:
    - f-kagoshima-kotobank
  - text: 城下町としての鹿児島の都市的起源は、1602年（慶長7年）に島津家久が鶴丸城を構築し城下町を整備したことにあり、以来江戸時代を通じて島津氏の居城として藩政の中心となった
    kind: fact
    level: E2
    status: established
    sources:
    - f-cap-kagoshima-city-profile
  column:
    title: 名前は、湾の向こうの島から渡ってきた
    text: 鹿児島という名の最初の持ち主は、市街地ではなく対岸の火山の島——いまの桜島——だったとされる。島のほうが「桜島」と呼ばれるようになるのは江戸時代後期のことで、それまでは鹿児島とも向島とも呼ばれていた。半島側の城下町が「鹿児島」を名乗り続けた結果、名前は島から町へ渡り、島は別の名を得た。1914年の大噴火で桜島が大隅半島と陸続きになっても、この名の所属は元に戻らなかった。フェリーで15分の距離にある島と市が、名前の元と継ぎ手の関係にあるのが鹿児島の面白さである。
    sources:
    - f-kagoshima-pref
    - f-kagoshima-kotobank
  relations:
  - pref/46
  unknowns:
  - 「鹿児島」の語源は確定しておらず、崖説・火山説・水夫説・鹿の子説のいずれも決定的な証拠を欠く
  - 764年の「麑島」が桜島を指すことの厳密な検証は、県資料の紹介経由であり一次資料では確認していない
  - 桜島の名称統一（1698年・薩摩藩通達とされる）の一次資料は本調査では直接確認できていない
  updated: '2026-11-13'
- id: muni/47-那覇市
  code: '472018'
  names:
    ja: 那覇市
    reading: なはし
    aliases:
    - 那波
    - 奈波
    - 浮島
  user_terms:
  - 那覇の名前の由来 漁場って本当
  - ナーファ ナファ 那覇の読み方
  - 首里と那覇はどう違う
  - 那覇市はいつできた
  naming_type: その他（港町「那覇」の名を継承し、那覇区への市制施行により市となった）
  prefecture: 沖縄県
  homonyms: []
  summary: 市名は琉球王国の貿易港「那覇」に由来する。「なは」の語源については、島袋源七が提唱し伊波普猷が支持した「ナバ（漁場）」説が通説とされてきたが、反論もあり確定していない。王国の記録が伝える茸の形の石にちなむ命名伝承とは別系統の話として分けて扱う。王都・首里の外港だった那覇は、1879年に県庁が置かれて県都となり、1921年に市制が施行された。
  first_attestation:
    era: 文明3年
    year_western: 1471
    document: 海東諸国紀
    note: 朝鮮の申叔舟が琉球の港を「那波」と記したものが、確認できる古い記録の一つ。当時この地が「ナバ」と呼ばれていた可能性を示すと『沖縄県の地名』は記す（国立国会図書館レファレンスが紹介）
  claims:
  - text: 市名「那覇」は港町の名に由来し、1921年（大正10年）5月20日、特別区制が廃されて一般市制が施行され、那覇区が那覇市となった
    kind: fact
    level: E2
    status: established
    sources:
    - f-cap-naha-city-ayumi
  - text: 王国時代の那覇は、那覇川（現在の国場川）と安里川の注ぐ湾に浮かぶ島「浮島」であり、1451年（享徳3年）に尚金福王が長虹堤を築いて首里側と結び、那覇四町（西町・東町・若狭町・泉崎）を形成したと那覇市公式は説明する
    kind: fact
    level: E2
    status: established
    sources:
    - f-cap-naha-city-ayumi
  - text: 王都は首里に置かれ、那覇はその外港・商都として発展したが、1879年（明治12年）の廃藩置県で県庁が那覇に置かれ、政治・経済・文化の中心は首里から那覇へ移った
    kind: fact
    level: E2
    status: established
    sources:
    - f-cap-naha-city-ayumi
  - text: 『海東諸国紀』に「那波」とあって、15〜16世紀にはこの地が「ナバ」と唱えられていた可能性が高いと、『沖縄県の地名』（日本歴史地名大系・沖縄県編）は記している
    kind: fact
    level: E2
    status: established
    sources:
    - f-cap-kaidoushokki
    - f-cap-naha-ndl
  - text: 「ナバ」の意味について、島袋源七が提唱し伊波普猷が支持・立証した漁場説が通説とされてきたが、海に面しない「ナバ」系の地名もあることなどから一仮説にとどまるとする批判的な見解もあり、語源は確定していない
    kind: fact
    level: E2
    status: contested
    sources:
    - f-cap-naha-ndl
  - text: 『琉球国由来記』巻八「那覇由来記」は、呉姓我那覇の屋敷の中に茸（世俗にナバという）の形に似た石があり、人々がこの地を「ナハ」と呼ぶようになり、後に字を「那覇」に改めたと伝える
    kind: legend
    level: E2
    status: established
    sources:
    - f-cap-ryukyu-yuraiki
    - f-cap-naha-ndl
  - text: 那覇市公式は、那覇の読みは現地の「ナーファ」「ナファ」から転訛したもので、それまでナハ・ナファ・ナワ・ナバなどと呼ばれていた読みが、1934年（昭和9年）3月に日本放送語審査委員会の決定で「ナハ」に統一されたと説明している
    kind: fact
    level: E2
    status: established
    sources:
    - f-cap-naha-city-name
  - text: 現在の市域は、1954年（昭和29年）に首里市・小禄村、1957年（昭和32年）に真和志市を合併して形成されたもので、王国期の那覇（浮島とその周辺）とは範囲が大きく異なる
    kind: fact
    level: E2
    status: established
    sources:
    - f-cap-naha-city-siryou
  column:
    title: 王都ではない港町が、県都になった
    text: 琉球王国の中心は、丘の上の王都・首里だった。那覇はその足元に浮かぶ「浮島」の港町で、冊封使や交易船を迎える玄関口だったが、政治の中心ではなかった。その力関係が逆転したのは1879年、廃藩置県で県庁が那覇に置かれてからである。首里城は象徴として残り、行政・経済の実務は港町へ移った。現在の那覇市は1950年代に首里市などを合併しており、いま市域に含まれる首里は「もとの王都を後から市域に迎えた」形になっている。港町の名前が、王都を含む市の名前になったわけである。
    sources:
    - f-cap-naha-city-ayumi
    - f-cap-naha-city-siryou
  relations:
  - pref/47
  unknowns:
  - 「ナバ／ナハ」の語源は確定しておらず、漁場説も仮説の域を出ないとする批判的見解がある
  - 漢字表記「那覇」の厳密な初出は本調査では特定できなかった（確認できる古い用例は『海東諸国紀』の「那波」である）
  - 『琉球国由来記』の怪石伝承は、茸の形の石そのものが戦前に那覇の東町にあったとする伝えもあるが、史実としての検証はできないため伝承として扱う
  updated: '2026-11-13'
