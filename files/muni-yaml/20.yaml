  summary: 長野県北安曇郡の村。安曇野の北部に位置する。1874年（明治7年）に鼠穴・細野・神戸新田・松川・板取の5村が合併して発足し、1889年（明治22年）の町村制施行でもその区域のまま再発足して、以来合併を経験していない。村名は合併した村の一つに既にあった「松川村」の名を継いだもの。下伊那郡の松川町（1956年に片桐松川から命名）とは同じ県内の別の自治体である。
  first_attestation:
