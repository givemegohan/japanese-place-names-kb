  user_terms:
  - 紫波
  - しわ
  - 高水寺城
  - もち米の町
  - 紫波中央駅
  naming_type: その他（古代の郡名「しわ（志波・斯波）」を継承し、表記は明治以降に「紫波」に定着）
  prefecture: 岩手県
  homonyms: []
  summary: 紫波郡の町で、現在の町は昭和30年（1955）に日詰町など1町8村が合併して誕生した。地名は古代の斯波郡（紫波郡）に遡る古い郡名で、表記は志波・子波・斯波・志和などと時代によって揺れ、「紫波」の文字が一般に用いられるようになったのは明治以後と町は伝える。読みも本来は「しは」で、「しわ」は後世の変化とされる。語源は県の由来一覧が段丘の崖の転など7説を挙げるが、定説はない。
  first_attestation:
    era: null
    year_western: null
    document: null
    note: 町公式プロフィールは、9世紀前半にこの地が斯波郡（紫波郡）として治められるようになったとするが、郡名「しわ」の文献初出そのものは本バッチでは特定できなかった
  claims:
  - text: 紫波町公式プロフィールによれば、現在の紫波町は昭和30年（1955）に1町8カ村が合併して誕生した
    kind: fact
    level: E2
    status: established
    sources:
    - z7-shiwa-town-profile
  - text: 町公式プロフィールによれば、この地は9世紀前半に坂上田村麻呂を中心とする都からの軍隊によって攻められ、斯波郡（紫波郡）として治められるようになった
    kind: fact
    level: E2
    status: established
    sources:
    - z7-shiwa-town-profile
  - text: 町の広報に連載された「ふるさと物語」によれば、「しわ」の地名には時代によって志波・子波・斯波・斯和・志和・紫波などさまざまな文字が当てられ、「紫波」の文字が一般に用いられるようになったのは明治以後である
    kind: fact
    level: E2
    status: established
    sources:
    - z7-shiwa-furusato3
  - text: 同じく「ふるさと物語」によれば、本来の呼び方は「しは」であったが、ある時代から「しわ」とも呼ばれるようになり、江戸期には「志和」の文字で表されるのが一般的になっていたとされる
    kind: fact
    level: E2
    status: established
    sources:
    - z7-shiwa-furusato3
  - text: 岩手県の「町村名の由来」は紫波の語源として、北上川流域の河岸段丘のツバ（崖）の転とする説、シワ（たわんで曲がったところ）とする説、大和朝廷の勢力範囲のシハ（終末・末端）とする説、志和稲荷神社によるとする説など7説を挙げており、語源は確定していない
    kind: fact
    level: E2
    status: contested
    sources:
    - z6-iwate-bunka-chimei
  - text: かつてはアイヌ語のシワカウシュ（大川）に由来すると類推する考え方があったが、町の「ふるさと物語」は、今日ではほとんど問題にされていないとする
    kind: fact
    level: E2
    status: established
    sources:
    - z7-shiwa-furusato3
  - text: 約400年前、高水寺城の城主・斯波孫三郎が、北上川の川底の赤い大石のために紫色に見える川波を見て「川に立つ波むらさきに似て」と歌ったことから、それまでの「斯波」の文字を「紫波」に改めたという伝えがある
    kind: legend
    level: E2
    status: established
    sources:
    - z7-shiwa-furusato3
  - text: 紫波町の地方公共団体コードは033219である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 幕府に問い質された郡の表記
    text: 天保6年（1835）、盛岡藩の江戸役人が幕府に呼び出され、思わぬ問い質しを受けた。「元禄元年に書き上げた高辻帳には紫波郡と書いてあるのに、今度のものには志波郡と記してあるのはどうしてか」。町の「ふるさと物語」が伝える逸話である。「しわ」という音に当てる文字は、志波・子波・斯波・斯和・志和・紫波と時代ごとに揺れ続け、江戸時代の役人さえその不統一に困らされていたことが分かる。結局、「紫波」の表記が一般化するのは明治以後になってからだった。音は千年以上続いているのに、文字の方は最後まで落ち着かなかった地名である。
    sources:
    - z7-shiwa-furusato100
    - z7-shiwa-furusato3
  relations:
  - pref/03
  unknowns:
  - 郡名「しわ」の文献初出（六国史や『和名類聚抄』における表記）は、本バッチでは特定できなかった
  - 県一覧の挙げる7説のいずれが語源かは決着しておらず、定説はない
  updated: '2026-11-13'
- id: muni/03-花巻市
  code: '032051'
  names:
    ja: 花巻市
    reading: はなまきし
    aliases:
    - 花巻町
    - 花巻城下
  user_terms:
  - 花巻の名前の由来
  - 花巻に定説はないのか
  - 鳥谷ヶ崎城と花巻城
  naming_type: その他（由来未定の古地名の継承）
  prefecture: 岩手県
  homonyms: []
  summary: 花巻の地名の由来に定説はなく、花巻市は『花巻市史』掲載の3説――「花の牧」と呼ばれる名馬の牧場があったとする説、北上川の渦に花びらが浮かぶ光景によるとする説、アイヌ語「パナマッケ（川下に開けた土地）」によるとする説――を併記している。昭和29年（1954年）に旧花巻市が成立し、平成18年（2006年）に大迫町・石鳥谷町・東和町と合併して現在の市となった。
  first_attestation:
    era: 弘仁2年
    year_western: 811
    document: 『日本後紀』（花巻市公式FAQが三郡設置の記述として紹介）
    note: 和我・稗縫（稗貫）・斯波の三郡設置の記載で、郡名「稗縫」の初出。「花巻」の表記そのものの初出は未確認。
  claims:
  - text: 花巻の地名の由来についての定説はなく、花巻市は、市教育委員会編『花巻市史』第1巻に掲載された3説を公式FAQで紹介している。
    kind: fact
    level: E2
    status: indeterminate
    sources:
    - l1-hanamaki-faq
  - text: 3説の第1は、この地に「花の牧」といわれる名馬を産する牧場があったとする説である。
    kind: fact
    level: E2
    status: contested
    sources:
    - l1-hanamaki-faq
  - text: 第2は、北上川の流れの中にできた渦に花びらが浮かんで美しい光景であったとする説である。
    kind: fact
    level: E2
    status: contested
    sources:
    - l1-hanamaki-faq
  - text: 第3は、アイヌ語「パナマッケ」（川下に開けた土地の意）に由来するとする説である。
    kind: fact
    level: E2
    status: contested
    sources:
    - l1-hanamaki-faq
  - text: 花巻城の前身は稗貫氏の居城・鳥谷ヶ崎城で、天正18年（1590年）の豊臣秀吉による奥州仕置きで稗貫氏は領地を没収されて南部氏の領有となり、間もなく旧鳥谷ヶ崎城から花巻城へと姿を変えたと考えられている。
    kind: fact
    level: E2
    status: established
    sources:
    - l1-hanamaki-castle
  - text: 花巻市公式FAQは、弘仁2年（811年）の『日本後紀』に和我・稗縫（稗貫）・斯波の三郡設置の記述があることを紹介しており、この地域の郡名は9世紀初頭の文献に現れる。
    kind: fact
    level: E2
    status: established
    sources:
    - l1-hanamaki-faq
  - text: 昭和29年（1954年）4月1日、花巻町・矢沢村・太田村・湯口村・湯本村・宮野目村が合併して旧花巻市が成立し、平成18年（2006年）1月1日、旧花巻市・大迫町・石鳥谷町・東和町が合併して現在の花巻市となった。
    kind: fact
    level: E4
    status: established
    sources:
    - l1-hanamaki-uub
  - text: 総務省「地方公共団体コード一覧」では、花巻市のコードは032051とされる。
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 「花」の正体は藪の中
    text: 花巻という美しい地名の由来は、専門家にも決められていない。名馬を産した「花の牧」、川の渦に浮かぶ花びら、アイヌ語の「パナマッケ」。市史が挙げる3説は、牧場と川とアイヌ語という全く違う方向を向いている。市の公式FAQはどれか一つを選ばず、「定説はありません」と明記して3説を並べる。分からないことを分からないまま並べて見せる姿勢が、この地名の記録としては最も誠実な形である。
    sources:
    - l1-hanamaki-faq
  relations:
  - pref/03
  unknowns:
  - 「花巻」の表記が文献に現れる初出は未確認。
  - 3説それぞれについて『花巻市史』第1巻が挙げる原典の確認は未実施。
  updated: '2026-11-13'
