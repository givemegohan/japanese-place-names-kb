  - muni/24-四日市市
  unknowns:
  - 1889年の合併に参加した村の確定リスト（『日本歴史地名大系』は九村とし、町公式の説明は村名を一部のみ挙げる）
  - 「川越」の地名が1889年以前に小地名として存在したかどうか
  updated: '2026-11-13'
