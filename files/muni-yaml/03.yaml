    note: 普代村公式「村の概要」が「閉伊（北方）ふたい」の記録として紹介するもの。原資料そのものは本バッチでは未確認のため、村公式の紹介として扱う
  claims:
  - text: 普代村公式によれば、永正5年（1508）の馬焼印図の中に「閉伊（北方）ふたい」の記録があり、これが村名に関わる古い記録である
    kind: fact
