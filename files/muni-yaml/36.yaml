  summary: 1947年（昭和22年）3月に板野郡撫養町・瀬戸町・鳴門町・里浦村が合併して発足した市。発足時の市名は妥協案の「鳴南市」だったが市民に不評で、わずか2か月後の同年5月に、渦潮で知られる鳴門海峡の名を取って「鳴門市」に改称した。中心市街の撫養は古代からの港町で、古くは牟夜（むや）と呼ばれた地である。
