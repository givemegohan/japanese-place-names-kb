prefecture_code: '46'
records:
- id: muni/46-いちき串木野市
  code: '462195'
  names:
    ja: いちき串木野市
    reading: いちきくしきのし
    aliases:
    - 串木野市
    - 市来町
    - 櫛木野
  user_terms:
  - 串木野
  - いちき
  - マグロのまち
  - さつま揚げ発祥の地
  naming_type: 合併新設
  prefecture: 鹿児島県
  homonyms: []
  summary: 平成17年（2005年）10月11日、串木野市と日置郡市来町が新設合併して発足した市。市名は旧市来町の「市来（いちき）」を平仮名にし、旧串木野市の「串木野」をそのまま連ねた合成地名で、平仮名と漢字を組み合わせた全国的にも珍しい形式である。「串木野」は近世の外城名に遡り、旧表記に「櫛木野」がある。「市来」は平安時代に市来院が置かれた古い地名である。
  first_attestation:
    era: null
    year_western: null
    document: null
    note: 「いちき串木野」という市名自体は2005年の合併で生まれた命名そのものが初出。構成要素では「市来」が平安時代の市来院に、「串木野」が近世の串木野郷に遡るが、各語の文献上の確かな初出は今回特定できなかった
  claims:
  - text: いちき串木野市の地方公共団体コードは462195である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  - text: いちき串木野市は平成17年（2005年）10月11日、串木野市と日置郡市来町の新設合併で発足した
    kind: fact
    level: E2
    status: established
    sources:
    - s4-ichiki-city-ayumi
    - s4-ichiki-uub
  - text: 新市名は公募により決定され、旧市来町の「市来」と旧串木野市の「串木野」を連ねた合成地名である
    kind: fact
    level: E4
    status: established
    sources:
    - s4-ichiki-jlogos
  - text: 串木野は昭和25年（1950年）に市制を施行した旧市で、「串木野」の旧表記として「櫛木野」がある
    kind: fact
    level: E3
    status: established
    sources:
    - s4-kushikino-kotobank
  - text: 串木野郷は江戸時代の鹿児島藩の外城の一つで、上名村・下名村・荒川村・羽島村の四か村からなっていた
    kind: fact
    level: E3
    status: established
    sources:
    - s4-kushikinogou-kotobank
  - text: 「串木野」の語源については、冠岳神社の祭神・櫛御気命にちなむという説、葦の生い茂る所を意味するアイヌ語に由来するという説、神が臥木（ふしき）で仮宿した故事に由来するという説などが伝えられ、定説はない
    kind: fact
    level: E4
    status: contested
    sources:
    - s4-ichiki-jlogos
  - text: 市来には平安時代に市来院（倉院）が置かれており、昭和5年（1930年）に西市来村が町制施行と同時に市来町と改称した
    kind: fact
    level: E3
    status: established
    sources:
    - s4-ichiki-kotobank
  - text: 「市来」は「市が立つ里」の意味であるという解釈が地名解説で紹介されている
    kind: fact
    level: E5
    status: indeterminate
    sources:
    - s4-ichiki-folklore
  column:
    title: 平仮名と漢字を連ねた市名
    text: 合併した両市町の名前をどちらも残すため、「市来」を平仮名の「いちき」にして「串木野」の前に連ねたのが「いちき串木野市」である。平仮名部分と漢字部分が同居する市名は全国でも例が少なく、旧市来町域の住民にとっては、自治体名としては消えた「市来」の読みだけが市名の先頭に残った形になった。なお旧串木野市の「串木野」には「櫛木野」という旧表記があり、現在の表記自体も歴史の中で定着したものである。
    sources:
    - s4-ichiki-jlogos
    - s4-kushikino-kotobank
  relations:
  - pref/46
  - muni/46-日置市
  unknowns:
  - 「串木野」「市来」それぞれの文献上の確かな初出（出典名と年代）は特定できなかった
  - 新市名の公募件数や最終候補の一覧は、合併協議会の一次資料では確認できなかった
  - 「市来」を平仮名表記にした決定理由の公式記録は確認できなかった
  updated: '2026-11-13'
- id: muni/46-伊佐市
  code: '462241'
  names:
    ja: 伊佐市
    reading: いさし
    aliases:
    - 大口市
    - 菱刈町
    - 伊佐郡
  user_terms:
  - 大口
  - 菱刈
  - いさ
  - 鹿児島の北海道
  naming_type: 合併新設
  prefecture: 鹿児島県
  homonyms: []
  summary: 平成20年（2008年）11月1日、大口市と伊佐郡菱刈町が新設合併して発足した市。市名は両市町を含む旧郡名「伊佐郡」に由来する。ただしこの伊佐郡は近世初頭に中世の牛屎院・答院の地域を合わせて成立した郡であり、古代薩摩国の郡の一つだった伊作郡（現在の日置市域）とは字面が似るだけで別の郡である。合併は一度、住民投票の結果で不成立になった経緯がある。
  first_attestation:
    era: null
    year_western: null
    document: null
    note: 「伊佐郡」は近世初頭の成立と『日本歴史地名大系』が紹介するが、「伊佐」の語そのものの初出・語源は確認できなかった
  claims:
  - text: 伊佐市の地方公共団体コードは462241である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  - text: 伊佐市は平成20年（2008年）11月1日、大口市と伊佐郡菱刈町の新設合併で発足した
    kind: fact
    level: E2
    status: established
    sources:
    - s4-isa-city-keikaku
    - s4-isa-kotobank
  - text: 市名「伊佐」は、両市町を含む旧郡名である伊佐郡の名を引き継いだものである
    kind: fact
    level: E3
    status: established
    sources:
    - s4-isa-kotobank
    - s4-isa-uub
  - text: 薩摩国の伊佐郡は近世初頭に成立した郡で、中世の牛屎院・答院の地域を合わせたものであり、薩摩半島中央西部にあった古代の伊作郡とは郡域もまったく異なる別の郡である
    kind: fact
    level: E3
    status: established
    sources:
    - s4-isagun-kotobank
  - text: 明治30年（1897年）に北伊佐郡と大隅国菱刈郡が合併して伊佐郡が再発足し、その郡域は現在の伊佐市の全域にあたっていた
    kind: fact
    level: E5
    status: established
    sources:
    - s4-isagun-wiki
  - text: 合併協議は一度不成立に終わっており、旧伊佐地区合併協議会は平成17年（2005年）5月10日に解散し、平成18年（2006年）8月28日に協議会が再設置されて合併に至った
    kind: fact
    level: E4
    status: established
    sources:
    - s4-isa-uub
    - s4-isa-isalove
  - text: 旧菱刈町域には金・銀を産出する菱刈鉱山があり、日本大百科全書は伊佐市の産業として鉱山への言及を含む
    kind: fact
    level: E3
    status: established
    sources:
    - s4-isa-kotobank
  column:
    title: 一度は否決された「伊佐市」
    text: 「伊佐市」という名前は、実は一度お蔵入りした名前である。2000年代初頭に大口市と菱刈町は合併協議会を立ち上げ、新市名を「伊佐市」と決めたが、菱刈町で行われた住民投票で反対が賛成を上回り、協議会は2005年に解散した。その後2006年に協議会が再び立ち上げられ、新市名は前回と同じ「伊佐市」として合意され、2008年にようやく市が発足した。郡名という、どちらの自治体の名前でもない「中立の名」が、二度にわたって選ばれたことになる。
    sources:
    - s4-isa-isalove
    - s4-isa-uub
  relations:
  - pref/46
  unknowns:
  - 「伊佐」という語自体の語源は専門資料で確認できなかった
  - 新市名の公募・選定過程の詳細（候補一覧等）は合併協議会の一次資料では確認できなかった
  - 1897年の伊佐郡再発足についてはWikipedia以外の高次資料で裏付けが取れなかった
  updated: '2026-11-13'
- id: muni/46-出水市
  code: '462080'
  names:
    ja: 出水市
    reading: いずみし
    aliases:
    - 出水町
    - 米ノ津町
  user_terms:
  - ツルの渡来地
  - 出水兵児のふるさと
  - いずみ
  naming_type: 一部の地名
  prefecture: 鹿児島県
  homonyms: []
  summary: 鹿児島県北端の市で、昭和29年（1954年）4月1日に出水町・米ノ津町が合併して発足し、平成18年（2006年）3月13日に野田町・高尾野町と合併して現在の市域となった。「出水」は薩摩国の郡名として『和名類聚抄』に見える古い地名で、市は、出水平野の扇状地の扇端に湧水が豊かだったことに地名が由来するといわれると説明する。ツルの渡来地として知られる。
  first_attestation:
    era: 平安時代
    year_western: null
    document: 『和名類聚抄』
    note: 薩摩国出水郡として見えることを二次資料が紹介する。原文を直接確認していないため紹介形で記録する
  claims:
  - text: 出水市の地方公共団体コードは462080である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  - text: 「出水」という地名は、扇状地の扇端部のいたるところに湧水が見られた、その湧水の豊かさに由来するといわれていると、出水市郷土誌に基づく市の環境基本計画は記す
    kind: fact
    level: E2
    status: established
    sources:
    - s3-izumi-city-env
  - text: 現在の出水市域は『和名類聚抄』に見える薩摩国出水郡の地であり、江戸時代には薩摩藩の出水郷が置かれ、その武士団は「出水兵児（いずみへこ）」と呼ばれたとWikipediaは紹介する
    kind: fact
    level: E5
    status: established
    sources:
    - s3-izumi-wiki
  - text: 昭和29年（1954年）4月1日に出水町と米ノ津町が合併して出水市が発足し、同年10月に大川内村を編入、平成18年（2006年）3月13日に野田町・高尾野町と合併して新・出水市となったとWikipediaは紹介する
    kind: fact
    level: E5
    status: established
    sources:
    - s3-izumi-wiki
  - text: 出水平野の背後の山麓部には扇状地が発達して地表水は少なく、雨水は伏流水となり、中心部の地下水位は地表から2〜3mと浅いことが出水地域の特徴であると市は説明する
    kind: fact
    level: E2
    status: established
    sources:
    - s3-izumi-city-env
  - text: ツルの渡来地は国の特別天然記念物「鹿児島県のツルおよびその渡来地」に指定され、出水市はツルの里として全国に名を知られている
    kind: fact
    level: E2
    status: established
    sources:
    - s3-izumi-city-env
  column:
    title: 湧き水の平野に、ツルが冬を越しに来る
    text: 出水平野は、川が山を出たところに広がる扇状地である。扇状地では降った雨が地下に潜り、扇の末端で湧き水となって現れる。出水の市街地の地下水位は地表からわずか2〜3mと浅く、かつては扇端のいたるところに湧水が見られた。その水の豊かさが「出水」という名になったといわれる。冬、この水の豊かな平野にシベリアから1万羽を超えるツルが渡ってくる。古代の郡名として残った「出水」は、水が出る土地という意味を千年にわたって裏切り続けていない。
    sources:
    - s3-izumi-city-env
  relations:
  - pref/46
  unknowns:
  - 『和名類聚抄』における「出水郡」の読み（訓）は確認できなかった
  - 「出水」の名が付けられた主体と正確な年代は確認できなかった
  updated: '2026-11-13'
- id: muni/46-南さつま市
  code: '462209'
  names:
    ja: 南さつま市
    reading: みなみさつまし
    aliases:
    - 加世田市
    - 南薩摩
  user_terms:
  - 南薩
  - 加世田
  - 坊津
  - みなみさつま
  naming_type: 合併新設
  prefecture: 鹿児島県
  homonyms: []
  summary: 平成17年（2005年）11月7日、加世田市・笠沙町・大浦町・坊津町・金峰町の1市4町が新設合併して発足した、薩摩半島南西部の市。市名は公募で最も多く寄せられた「南さつま」で、最終候補には読みがまったく同じ「南薩摩」も残り、漢字表記でなく平仮名表記が選ばれた。「さつま」は旧国名・薩摩の平仮名表記であり、市域は薩摩国の南部（南薩）にあたる。
  first_attestation:
    era: null
    year_western: null
    document: null
    note: 「南さつま」という市名自体は2005年の合併で生まれた命名そのものが初出。旧中心地名「加世田」は近世の郷名に遡るが、その確かな初出は今回確認できなかった
  claims:
  - text: 南さつま市の地方公共団体コードは462209である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  - text: 南さつま市は平成17年（2005年）11月7日、加世田市・笠沙町・大浦町・坊津町・金峰町の1市4町の新設合併で発足した
    kind: fact
    level: E2
    status: established
    sources:
    - s4-minamisatsuma-city-youran
  - text: 本市は薩摩半島の南西部に位置し、南側と西側は東シナ海に面する
    kind: fact
    level: E2
    status: established
    sources:
    - s4-minamisatsuma-city-gaiyo
  - text: 新市名は公募で「南さつま」が最も多く寄せられ、最終候補は読みが同じ「南薩摩（みなみさつま）」と「南さつま」の2点で、平仮名表記の「南さつま」が選ばれた
    kind: fact
    level: E4
    status: established
    sources:
    - s4-minamisatsuma-uub
  - text: 旧中心の加世田市は昭和29年（1954年）7月15日、加世田町と万世町が合併して発足した市であった
    kind: fact
    level: E4
    status: established
    sources:
    - s4-kasedashi-uub
  - text: 市域の坊津は古くからの良港で知られ、一帯は国の名勝『坊津』に指定されている
    kind: fact
    level: E2
    status: established
    sources:
    - s4-minamisatsuma-city-gaiyo
  column:
    title: 読みが同じ2つの最終候補
    text: 南さつま市の市名決定は、最終候補が「南薩摩」と「南さつま」という、読みがまったく同じ2案に絞られた珍しい決選だった。争われたのは意味ではなく表記であり、結果は漢字の重厚さよりも平仮名のやわらかさを取った「南さつま」の勝利だった。公募の上位には「南薩」「薩南」「川辺」「加世田」なども並んでおり、旧郡名や旧市名を推す声も少なくなかったことがうかがえる。
    sources:
    - s4-minamisatsuma-uub
  relations:
  - pref/46
  - muni/46-南九州市
  - muni/46-枕崎市
  - muni/46-日置市
  unknowns:
  - 市名の命名理由を述べた合併協議会・市公式の一次説明は確認できなかった（公募結果と候補の変遷は変遷情報データベースによる）
  - 旧中心地名「加世田」の語源と確かな初出は確認できなかった
  updated: '2026-11-13'
- id: muni/46-南九州市
  code: '462233'
  names:
    ja: 南九州市
    reading: みなみきゅうしゅうし
    aliases:
    - 知覧町
    - 川辺町
    - 頴娃町
  user_terms:
  - 知覧
  - 川辺
  - みなみきゅうしゅう
  - 知覧茶のまち
  naming_type: 合併新設
  prefecture: 鹿児島県
  homonyms: []
  summary: 平成19年（2007年）12月1日、揖宿郡頴娃町・川辺郡知覧町・川辺町の3町が新設合併して発足した市。市名は九州の南部に位置することに由来する方角地名で、県名も旧国名も含まない。読みの「みなみきゅうしゅう」は9文字で自治体名の読みとしては日本最長とされる一方、市域が九州南部の一部にすぎないことから「広域地名の僭称」との批判も受けている。
  first_attestation:
    era: null
    year_western: null
    document: null
    note: 「南九州」という市名自体は2007年の合併で生まれた命名そのものが初出。広域地域名としての「南九州」はそれ以前から一般に使われていた
  claims:
  - text: 南九州市の地方公共団体コードは462233である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  - text: 南九州市は平成19年（2007年）12月1日、旧頴娃町・旧知覧町・旧川辺町の3町の新設合併で発足した
    kind: fact
    level: E2
    status: established
    sources:
    - s4-minamikyushu-city-koho
    - s4-minamikyushu-uub
  - text: 市名「南九州」は、市が九州島の南部に位置することに由来する方角地名である
    kind: fact
    level: E5
    status: established
    sources:
    - s4-minamikyushu-wiki
  - text: 新市名は公募の上位案から絞り込まれ、最終候補の「南薩（なんさつ）」と「南九州」の2点から「南九州」が選ばれた
    kind: fact
    level: E4
    status: established
    sources:
    - s4-minamikyushu-uub
  - text: 市名の読み仮名「みなみきゅうしゅう」は9文字となり、日本の自治体名の読みとしては最長である
    kind: fact
    level: E5
    status: established
    sources:
    - s4-minamikyushu-wiki
  - text: 地名研究者の今尾恵介は、九州南部のうちの一部地域にすぎない本市が「南九州」を名乗ることを「僭称地名」の筆頭格として批判している
    kind: fact
    level: E5
    status: contested
    sources:
    - s4-minamikyushu-wiki
  - text: この合併で川辺郡と揖宿郡はともに消滅し、市役所は旧知覧町役場に置かれた
    kind: fact
    level: E4
    status: established
    sources:
    - s4-minamikyushu-uub
    - s4-minamikyushu-wiki
  column:
    title: 候補にあった「平和」という市名
    text: 南九州市の新市名公募の上位10点には、「薩南」「南薩」といった地域名に混じって「平和（へいわ）」という案が入っていた。旧知覧町には特攻隊の出撃基地だった知覧特攻平和会館があり、平和への願いを市名に託そうという発想だったとみられる。最終候補は「南薩」と「南九州」に絞られ、選ばれたのは九州全体を背負う大きな名だった。その大胆さゆえ「僭称」との批判も受けるが、読みの長さ日本一という記録とともに、この市名は平成の大合併が生んだ最も議論を呼ぶ命名の一つになっている。
    sources:
    - s4-minamikyushu-uub
    - s4-minamikyushu-wiki
  relations:
  - pref/46
  - muni/46-南さつま市
  - muni/46-枕崎市
  - muni/46-指宿市
  unknowns:
  - 市名の選定理由を述べた合併協議会・市公式の一次説明は確認できなかった（公募結果と候補の変遷は変遷情報データベースとWikipediaによる）
  - 「平和」が候補に入った理由（知覧の特攻平和会館との関係）は推測の域を出ず、公式記録では確認できなかった
  updated: '2026-11-13'
- id: muni/46-垂水市
  code: '462144'
  names:
    ja: 垂水市
    reading: たるみずし
    aliases:
    - 垂水町
  user_terms:
  - 桜島の対岸の市
  - 鹿児島湾フェリーの玄関口
  - たるみず
  naming_type: 一部の地名
  prefecture: 鹿児島県
  homonyms: []
  summary: 大隅半島西岸、桜島の対岸にある市。昭和30年（1955年）に垂水町・牛根村・新城村が合併して垂水町となり、昭和33年（1958年）10月1日に市制を施行した。「垂水」は中世後期から見える地名で、古語の「たるみ」は垂れ落ちる水・滝を意味する。江戸時代には市来・中俣の両村一帯が垂水村と称された。
  first_attestation:
    era: 室町時代
    year_western: 1474
    document: 雲遊雑記伝（行脚僧の雑録）
    note: 『日本歴史地名大系』が紹介する文明6年（1474年）の記録に、下大隅の石井氏と「垂水の丹波守」との関係が見える。同大系は「垂水」を中世後期から見える地名とする
  claims:
  - text: 垂水市の地方公共団体コードは462144である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  - text: 昭和30年（1955年）に垂水町と牛根・新城の2村が合併し、昭和33年（1958年）に市制を施行した
    kind: fact
    level: E3
    status: established
    sources:
    - s3-tarumizu-kotobank
  - text: 「垂水」は中世後期から見える地名で、下大隅郡に含まれ、江戸時代の市来・中俣両村が垂水村と称されたことから、この両村一帯に比定される
    kind: fact
    level: E3
    status: established
    sources:
    - s3-tarumizu-kotobank
  - text: 「たるみ（垂水）」は垂れ落ちる水・滝を意味する古語で、『万葉集』に「石走る垂水の水をむすびて飲みつ」の用例があると『精選版日本国語大辞典』は紹介する
    kind: fact
    level: E3
    status: established
    sources:
    - s3-tarumizu-kotobank
  - text: 蒲生氏系図は、保安4年（1123年）ごろに舜清が垂水に下向して垂水城を拠点にしたと伝える
    kind: fact
    level: E3
    status: established
    sources:
    - s3-tarumizu-kotobank
  - text: 垂水市は鹿児島湾に面し、鹿児島市（鴨池港）との間に大型カーフェリーが就航する大隅半島の表玄関である
    kind: fact
    level: E3
    status: established
    sources:
    - s3-tarumizu-kotobank
  column:
    title: 「垂水」は滝のこと――万葉の古語が残る地名
    text: 「たるみず」と読むこの地名の核は、古語の「たるみ」である。垂れ落ちる水、すなわち滝を意味し、『万葉集』にも「石走（いはばし）る垂水の水」と歌われた。だから「垂水」は特定の固有名詞というより、水の垂れる地形を指す普通名詞の地名で、神戸市垂水区や大阪府吹田市にも同名の地名が残る。鹿児島の垂水は中世後期から記録に見え、シラス台地の崖から水の湧く大隅半島西岸の地形と響き合う。桜島を正面に望む小さな市の名は、千二百年前の歌の言葉をいまに伝えている。
    sources:
    - s3-tarumizu-kotobank
  relations:
  - pref/46
  unknowns:
  - この地が「垂水」と呼ばれるようになった具体的な理由（どの滝や水源を指したか）は確認できなかった
  updated: '2026-11-13'
- id: muni/46-奄美市
  code: '462225'
  names:
    ja: 奄美市
    reading: あまみし
    aliases:
    - 名瀬市
  user_terms:
  - 奄美大島の中心都市
  - 世界自然遺産の島の市
  - あまみ
  naming_type: 合併新設
  prefecture: 鹿児島県
  homonyms: []
  summary: 平成18年（2006年）3月20日、名瀬市・住用村・笠利町が合併して発足した。市名は奄美大島の名「奄美」をそのまま採ったもので、合併協議は当初1市2町3村で始まったが、瀬戸内町・宇検村・大和村が離脱して3市町村での発足となった。「奄美」は古く「海見」「阿麻弥」とも表記され、県の資料は琉球国の始祖アマミクの降臨によるという伝承を紹介する。旧中心地・名瀬の語源には定説がない。
  first_attestation:
    era: null
    year_western: null
    document: null
    note: 鹿児島県の資料は古い表記として「海見」「阿麻弥」「奄美」を挙げるが、初出の文献名と年代は確認できなかった
  claims:
  - text: 奄美市の地方公共団体コードは462225である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  - text: 奄美市は平成18年（2006年）3月20日、名瀬市・住用村・笠利町が合併して誕生した
    kind: fact
    level: E2
    status: established
    sources:
    - s3-amami-city-tanjo
  - text: 合併協議は当初1市2町3村で始まったが、平成16年（2004年）に住民投票の結果により瀬戸内町が、平成17年（2005年）に宇検村・大和村が協議会を離脱し、最終的に1市1町1村の合併となった
    kind: fact
    level: E2
    status: established
    sources:
    - s3-amami-city-tanjo
  - text: 「奄美」は奄美大島および奄美諸島全域を指す名で、古くは「海見」「阿麻弥」「奄美」と表記されていたと鹿児島県は紹介する
    kind: fact
    level: E2
    status: established
    sources:
    - f-kagoshima-pref
  - text: 奄美地区は慶長14年（1609年）の島津氏による琉球侵攻以前は琉球（沖縄）国に属していた
    kind: fact
    level: E2
    status: established
    sources:
    - f-kagoshima-pref
  - text: 旧中心地である名瀬の名の由来については、魚瀬（ナゼ）からきたとする説、空地（ナージ）からきたとする説、大島の中地（ナージ）からきたとする説があるが、定説はないと鹿児島県は紹介する
    kind: fact
    level: E2
    status: contested
    sources:
    - f-kagoshima-pref
  - text: 「奄美」の名の由来は、琉球国の始祖「阿麻弥久（アマミク）」がこの地に降臨したことによるといわれる
    kind: legend
    level: E2
    status: established
    sources:
    - f-kagoshima-pref
  column:
    title: 島の名前をそのまま市名に――6市町村の協議から3市町村の発足へ
    text: 奄美市の合併協議は、奄美大島の全6市町村（1市2町3村）で始まった。だが住民投票で瀬戸内町が離脱し、宇検村・大和村も続いて、残ったのは名瀬市・笠利町・住用村の3市町村だった。2006年に生まれた新市の名は、島そのものの名「奄美」。県の資料によれば、この名は古く「海見」「阿麻弥」とも書かれ、琉球の始祖アマミクが降臨した地という伝承を持つ。市域は島の約4割にとどまるが、市名は島全体の名を掲げることになった。沖縄の文化圏に属しながら鹿児島県にあるという、この島の二重の帰属も「奄美」という古い名の中に折り重なっている。
    sources:
    - s3-amami-city-tanjo
    - f-kagoshima-pref
  relations:
  - pref/46
  unknowns:
  - 「奄美」の語源の定説は確認できなかった（県公式資料はアマミク降臨の伝承を紹介するのみ）
  - 「阿麻弥」「海見」表記の初出の文献と年代は確認できなかった
  - 新市名「奄美市」の選定過程（公募の有無など）は市公式ページでは確認できなかった
  updated: '2026-11-13'
- id: muni/46-姶良市
  code: '462250'
  names:
    ja: 姶良市
    reading: あいらし
    aliases:
    - 姶良町
    - 加治木町
    - 蒲生町
    - 始羅郡
  user_terms:
  - あいら
  - 加治木
  - 蒲生
  - 姶良カルデラ
  naming_type: 合併新設
  prefecture: 鹿児島県
  homonyms: []
  summary: 平成22年（2010年）3月23日、姶良郡の加治木町・姶良町・蒲生町が新設合併して発足した市で、鹿児島県内では平成の大合併の最後に生まれた市である。市名は3町共通の郡名「姶良郡」に由来するが、この郡名には取り違えの歴史がある。市域は江戸時代に始羅郡と呼ばれた土地で、古代大隅国の姶羅郡は現在の鹿屋市付近の別郡だったものが混同され、明治期に「姶良」の表記が正式名として定着した。
  first_attestation:
    era: 江戸時代
    year_western: null
    document: null
    note: 市域を指す郡名としては江戸時代の「始羅郡」が実体で、「姶良」の表記は古代の姶羅郡（鹿屋市付近）との混同を経て明治期に統一されたもの。始羅・姶羅それぞれの文献上の確かな初出は今回確認できなかった
  claims:
  - text: 姶良市の地方公共団体コードは462250である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  - text: 姶良市は平成22年（2010年）3月23日、姶良郡加治木町・姶良町・蒲生町の新設合併で発足した
    kind: fact
    level: E4
    status: established
    sources:
    - s4-aira-uub
  - text: 市名は3町に共通する郡名「姶良郡」に由来し、1955年に発足した旧姶良町も「三町村の郷土に共通するという理由」から郡名を町名に採用していた
    kind: fact
    level: E2
    status: established
    sources:
    - s4-aira-kagoshima-u
  - text: 現在の姶良郡の地域は江戸時代には始羅郡（しらぐん）と呼ばれており、古代の大隅国に存在した姶羅郡（あいらぐん）とは別の郡である
    kind: fact
    level: E5
    status: established
    sources:
    - s4-airagun-wiki
  - text: 古代の姶羅郡は現在の鹿屋市付近を指し中世までに肝属郡へ編入された郡で、始羅郡がこれと混同されたため明治期に「姶良」へ表記が統一された
    kind: fact
    level: E5
    status: established
    sources:
    - s4-airagun-wiki
  - text: 姶良市は鹿児島湾の奥側に位置し、巨大噴火で形成された姶良カルデラの北西側の外輪山にあたる位置にある
    kind: fact
    level: E5
    status: established
    sources:
    - s4-aira-wiki
  - text: 「姶良カルデラ」という名称は地名の姶良に由来し、松本唯一が1933年に「姶良火山」の名を提唱、1943年に正式に命名したもので、地名のほうがカルデラの名より先である
    kind: fact
    level: E2
    status: established
    sources:
    - s4-aira-caldera-kagoshima-u
  column:
    title: 取り違えられて定着した郡名
    text: 「姶良」という名は、本来よその郡の名前だった。古代の大隅国にあった姶羅郡は、現在の鹿屋市あたりの郡で、中世までに消えた。一方、現在の姶良市一帯は江戸時代まで始羅郡と呼ばれていたが、読みの似た両者が混同され、明治期に表記が「姶良」に統一されてしまった。つまり姶良市は、別の場所の古代の郡名を「借りた」土地に、1955年に共通の名として郡名を採用し、2010年に市名にした、という重なった経緯を持つ。姶良カルデラという世界的に知られる地学用語も、源をたどればこの取り違えの先に生まれた地名から名付けられている。
    sources:
    - s4-airagun-wiki
    - s4-aira-caldera-kagoshima-u
  relations:
  - pref/46
  - muni/46-鹿屋市
  - muni/46-霧島市
  unknowns:
  - 始羅郡・姶羅郡の混同と表記統一の経緯はWikipedia以外の高次資料で裏付けが取れなかった
  - 「始羅」「姶良」の語自体の語源は確認できなかった
  - 2010年の市名選定過程（公募の有無等）は一次資料で確認できなかった
  updated: '2026-11-13'
