    note: 「木島郷」の名と地頭・木島氏の活動が、木島平村公式の村史では『市河文書』に見えると紹介される。郷名としての用例の側の初出級であり、村史を介した確認のため年は特定しない。
  claims:
  - text: 鎌倉時代には岳北地方に志久見・犬飼（犬甘）・毛見・木島等の郷が文献に現れ、木島郷の地頭は木島氏で、その活動は『市河文書』に見えると木島平村公式の村史が紹介する
    kind: fact
    level: E2
    status: established
    sources:
    - x1-kijimadaira-sonshi
  - text: 慶長7年（1602年）の森忠政の検地帳には上木島・計見・高石・平沢・馬曲・鴨原・中村・内山・和栗の9カ村の名が記され、元禄11年（1698年）には「木島平18カ村」の入会権が幕府によって認められたと村公式の村史が記し、近世に「木島平」が一帯の総称であったことが裏づけられる
    kind: fact
    level: E2
    status: established
    sources:
    - x1-kijimadaira-sonshi
  - text: 村名は、中世に「木島郷」があり、近世にこの一帯が「木島平」と呼ばれていたことに由来すると、木島平村公式ウェブサイトの説明として紹介されている
    kind: fact
