  - 沖縄本島最南端の市
  naming_type: その他
  prefecture: 沖縄県
  homonyms: []
  summary: 沖縄本島最南端の市で、昭和46年（1971年）12月1日に市制を施行した。本土復帰の前年、米軍統治下での発足である。「糸満」は近世の帳簿類に「いとまむ村」と記され、1713年の『琉球国由来記』で「糸満村」の表記が見える古い地名。方音は「イチュマン」。語源は漁師のまちにふさわしく「イト（優れたの意）＋アマ（海人）＝優れた漁師」とする説が糸満町史の編集者によって本命とされたが、他の学者の説もあって確定していない。
  first_attestation:
    era: 慶安2年
    year_western: 1649
    document: 『絵図郷村帳』
    note: 慶安2年（1649年）の『絵図郷村帳』と翌年の『琉球国高極帳』では「いとまむ村」と表記され、康熙52年（1713年）の『琉球国由来記』では「糸満村」となっていることが紹介されている（二次資料経由の確認）
  claims:
  - text: 糸満市の地方公共団体コードは472107である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  - text: 糸満市は昭和46年（1971年）12月1日に市制を施行した、本土復帰の前年にあたる米軍統治下での発足である
    kind: fact
    level: E3
    status: established
    sources:
    - s5-itoman-kotobank
    - s5-itoman-kukuru
  - text: 前身の糸満町は明治41年（1908年）の町村制施行時に兼城間切の糸満村が町制を施行して生まれ、昭和36年（1961年）に兼城村・高嶺村・三和村と合併して新しい糸満町となった
    kind: fact
    level: E3
    status: established
    sources:
    - s5-itoman-kotobank
    - s5-itoman-city-ayumi
  - text: 「糸満」の表記は、慶安2年（1649年）の『絵図郷村帳』と翌年の『琉球国高極帳』では「いとまむ村」、康熙52年（1713年）の『琉球国由来記』では「糸満村」となっていることが紹介されている
    kind: fact
    level: E5
    status: established
    sources:
    - s5-itoman-wiki
  - text: 語源について、糸満町史の編集委員だった玉城貫は、第一・優れたなどの意味を持つ「イト」と海人の「アマ」を合わせた言葉で「優れた漁師」という意味だとする説を本命としたことが紹介されている
    kind: fact
    level: E5
    status: contested
    sources:
    - s5-itoman-wiki
  - text: 民俗学者の宮良當壯は「イユ・トゥイ・アマミ」（魚を捕る海人の集団）の約転であろうとする説を唱え、金関丈夫も別の語源を唱えるなど諸説があり、定説は得られていないことが紹介されている
    kind: fact
    level: E5
    status: contested
    sources:
    - s5-itoman-wiki
  - text: 井戸を掘る際に糸を食べている蟹が現れたことが「糸満」の名の起こりだという話が伝えられている
    kind: legend
    level: E5
    status: established
    sources:
    - s5-itoman-wiki
  - text: 方音は「イチュマン」で、糸満の漁師（海人）は戦前から日本近海のみならず海外にまで進出したことで知られる
    kind: fact
    level: E3
    status: established
    sources:
    - s5-itoman-kotobank
  column:
    title: 町史の編集委員が激怒した「エイトマン説」
    text: 糸満の語源には、変わった俗説がある。昔、8人の異人がこの地に漂着したから「エイトマン」と呼ばれ、それが訛って糸満になった、というものである。ところが糸満町史の編集にあたった玉城貫は、この説を著書で「学問を愚弄するもの」とまで言って切り捨てた。玉城自身の本命は、「イト（優れた）＋アマ（海人）」で「優れた漁師」という、漁師のまちの誇りを込めた解釈である。漂着した異人の数から名前を説明したくなる素朴な語源遊びと、それを許さなかった地元の史家の矜持との対比が、この地名の語られ方の面白さをよく示している。
    sources:
    - s5-itoman-wiki
  relations:
  - pref/47
  unknowns:
  - 語源の諸説はいずれもWikipedia経由で糸満市史・糸満町史の記述として紹介されたもので、市史そのものは未確認である
  - 「糸を巻く」「糸を引く」といった漁の糸そのものに結びつける語源説は、井戸掘りの蟹の伝承以外には確認できなかった
  - 『おもろさうし』など近世以前の古い史料における「いとまむ」の用例は確認できなかった
  updated: '2026-11-13'
- id: muni/47-豊見城市
  code: '472123'
  names:
    ja: 豊見城市
    reading: とみぐすくし
    aliases:
    - 豊見城村
    - 豊見城間切
    - とよみ城
  user_terms:
  - とみぐすく
  - 響（とよ）むまち
  - 村から直接市になったまち
  - 那覇のベッドタウン
  naming_type: その他
  prefecture: 沖縄県
  homonyms: []
  summary: 沖縄本島南部、那覇市に隣接する市で、平成14年（2002年）4月1日に豊見城村が合併を経ず単独で市制を施行した。村から直接市になった珍しい例である。「豊見城（とみぐすく）」は琉球のグスクの名に由来し、南山王の従弟・汪応祖が築いた城を「とよみ城」と美称したことに始まると市は説明する。「とよむ」とは名声が高く鳴り響くさまを表す古琉球の美称で、その音が時代を経て「とみ」へ転じたとされる。
  first_attestation:
    era: null
    year_western: null
    document: 『球陽』
    note: 琉球王府の史書『球陽』（18世紀の編纂）が、14世紀前半の三山対立期の記事として南山王に従った地方の中に「豊見城」の名を記していることが市の資料で紹介されている。事象の年代と文献の成立が大きく離れているため、初出の年は特定しない
  claims:
  - text: 豊見城市の地方公共団体コードは472123である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  - text: 豊見城市は平成14年（2002年）4月1日、豊見城村が合併を経ずに単独で市制を施行して発足した、市制施行の要件である人口50,000人を達成しての施行だった
    kind: fact
    level: E2
    status: established
    sources:
    - s5-tomigusuku-plan4
  - text: 前身の豊見城村は明治41年（1908年）の島嶼町村制により、豊見城間切の11字をもって誕生した
    kind: fact
    level: E2
    status: established
    sources:
    - s5-tomigusuku-shiryo
  - text: 琉球の歴史書『球陽』によれば、14世紀の前半に沖縄本島で三山の対立が明確になったとき、南山王に従った地方の中に「豊見城」の名が記されていることが市の資料で紹介されている
    kind: fact
    level: E2
    status: established
    sources:
    - s5-tomigusuku-shiryo
  - text: 地名の起こりとして、南山王の従弟・汪応祖（ワンオウソ）が漫湖を眺望する丘陵上にグスクを築き、「とよみ城（ぐすく）」と称したことが伝えられている
    kind: legend
    level: E2
    status: established
    sources:
    - s5-tomigusuku-plan
    - s5-tomigusuku-shiryo
  - text: 「とよむ（鳴響む）」とは『おもろそうし』に記載もある美称の一つで、名声の高いさまを表しており、時代を経て「とよみ」が「とみぐすく」という読みに転じたと市は説明している
    kind: fact
    level: E2
    status: established
    sources:
    - s5-tomigusuku-plan
  - text: 近世の豊見城間切は現在の市域以外に那覇市・糸満市・八重瀬町の一部をも含む大きな領域をもっていた
    kind: fact
    level: E2
    status: established
    sources:
    - s5-tomigusuku-shiryo
  column:
    title: 合併しないで「村」からいきなり「市」へ
    text: 平成の大合併では、多くの自治体が合併して市になった。しかし豊見城市は2002年、合併を一切せず、豊見城村が単独のまま市制を施行した。那覇市に隣接する立地で宅地開発が進み、市制の要件である人口5万人に村のまま到達したためである。村から直接市になるのは全国的にも珍しく、沖縄県内では初めてのケースだった。その市名は、14世紀の南山の時代に築かれたグスクの名をそのまま受け継いだもの。人口増加率と年少人口の多さで知られる新しい住宅都市が、県内最古級の城の名前を背負っているという取り合わせが、この市の面白さである。
    sources:
    - s5-tomigusuku-plan4
    - s5-tomigusuku-shiryo
  relations:
  - pref/47
  unknowns:
  - 『球陽』の「豊見城」の記事の原文は二次資料経由でしか確認できていない
  - 「とよみ」が「とみ」へ転じた時期や過程は、市の資料にも詳述がなく確認できなかった
  - 豊見城村が単独市制を選択した当時の議論の詳細（合併協議の有無を含む）は確認できなかった
  updated: '2026-11-13'
- id: muni/47-那覇市
  code: '472018'
  names:
    ja: 那覇市
    reading: なはし
    aliases:
    - 那波
    - 奈波
    - 浮島
  user_terms:
  - 那覇の名前の由来 漁場って本当
  - ナーファ ナファ 那覇の読み方
  - 首里と那覇はどう違う
  - 那覇市はいつできた
  naming_type: その他（港町「那覇」の名を継承し、那覇区への市制施行により市となった）
  prefecture: 沖縄県
  homonyms: []
  summary: 市名は琉球王国の貿易港「那覇」に由来する。「なは」の語源については、島袋源七が提唱し伊波普猷が支持した「ナバ（漁場）」説が通説とされてきたが、反論もあり確定していない。王国の記録が伝える茸の形の石にちなむ命名伝承とは別系統の話として分けて扱う。王都・首里の外港だった那覇は、1879年に県庁が置かれて県都となり、1921年に市制が施行された。
  first_attestation:
    era: 文明3年
    year_western: 1471
    document: 海東諸国紀
    note: 朝鮮の申叔舟が琉球の港を「那波」と記したものが、確認できる古い記録の一つ。当時この地が「ナバ」と呼ばれていた可能性を示すと『沖縄県の地名』は記す（国立国会図書館レファレンスが紹介）
  claims:
  - text: 市名「那覇」は港町の名に由来し、1921年（大正10年）5月20日、特別区制が廃されて一般市制が施行され、那覇区が那覇市となった
    kind: fact
    level: E2
    status: established
    sources:
    - f-cap-naha-city-ayumi
  - text: 王国時代の那覇は、那覇川（現在の国場川）と安里川の注ぐ湾に浮かぶ島「浮島」であり、1451年（享徳3年）に尚金福王が長虹堤を築いて首里側と結び、那覇四町（西町・東町・若狭町・泉崎）を形成したと那覇市公式は説明する
    kind: fact
    level: E2
    status: established
    sources:
    - f-cap-naha-city-ayumi
  - text: 王都は首里に置かれ、那覇はその外港・商都として発展したが、1879年（明治12年）の廃藩置県で県庁が那覇に置かれ、政治・経済・文化の中心は首里から那覇へ移った
    kind: fact
    level: E2
    status: established
    sources:
    - f-cap-naha-city-ayumi
  - text: 『海東諸国紀』に「那波」とあって、15〜16世紀にはこの地が「ナバ」と唱えられていた可能性が高いと、『沖縄県の地名』（日本歴史地名大系・沖縄県編）は記している
    kind: fact
    level: E2
    status: established
    sources:
    - f-cap-kaidoushokki
    - f-cap-naha-ndl
  - text: 「ナバ」の意味について、島袋源七が提唱し伊波普猷が支持・立証した漁場説が通説とされてきたが、海に面しない「ナバ」系の地名もあることなどから一仮説にとどまるとする批判的な見解もあり、語源は確定していない
    kind: fact
    level: E2
    status: contested
    sources:
    - f-cap-naha-ndl
  - text: 『琉球国由来記』巻八「那覇由来記」は、呉姓我那覇の屋敷の中に茸（世俗にナバという）の形に似た石があり、人々がこの地を「ナハ」と呼ぶようになり、後に字を「那覇」に改めたと伝える
    kind: legend
    level: E2
    status: established
    sources:
    - f-cap-ryukyu-yuraiki
    - f-cap-naha-ndl
  - text: 那覇市公式は、那覇の読みは現地の「ナーファ」「ナファ」から転訛したもので、それまでナハ・ナファ・ナワ・ナバなどと呼ばれていた読みが、1934年（昭和9年）3月に日本放送語審査委員会の決定で「ナハ」に統一されたと説明している
    kind: fact
    level: E2
    status: established
    sources:
    - f-cap-naha-city-name
  - text: 現在の市域は、1954年（昭和29年）に首里市・小禄村、1957年（昭和32年）に真和志市を合併して形成されたもので、王国期の那覇（浮島とその周辺）とは範囲が大きく異なる
    kind: fact
    level: E2
    status: established
    sources:
    - f-cap-naha-city-siryou
  column:
    title: 王都ではない港町が、県都になった
    text: 琉球王国の中心は、丘の上の王都・首里だった。那覇はその足元に浮かぶ「浮島」の港町で、冊封使や交易船を迎える玄関口だったが、政治の中心ではなかった。その力関係が逆転したのは1879年、廃藩置県で県庁が那覇に置かれてからである。首里城は象徴として残り、行政・経済の実務は港町へ移った。現在の那覇市は1950年代に首里市などを合併しており、いま市域に含まれる首里は「もとの王都を後から市域に迎えた」形になっている。港町の名前が、王都を含む市の名前になったわけである。
    sources:
    - f-cap-naha-city-ayumi
    - f-cap-naha-city-siryou
  relations:
  - pref/47
  unknowns:
  - 「ナバ／ナハ」の語源は確定しておらず、漁場説も仮説の域を出ないとする批判的見解がある
  - 漢字表記「那覇」の厳密な初出は本調査では特定できなかった（確認できる古い用例は『海東諸国紀』の「那波」である）
  - 『琉球国由来記』の怪石伝承は、茸の形の石そのものが戦前に那覇の東町にあったとする伝えもあるが、史実としての検証はできないため伝承として扱う
  updated: '2026-11-13'
