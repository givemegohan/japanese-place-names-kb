  summary: 三重県北部、三重郡の町で、伊勢湾に面する。読みも漢字も同じ埼玉県川越市とは全く別の自治体であり、川越の名は1889年に朝明川北部の村々と南部の豊田村・高松村が合併した際に「川を越えて一つになった」ことによると町公式が説明する。町域の約半分は江戸時代の干拓による新田地帯で、1961年に町制施行した。
