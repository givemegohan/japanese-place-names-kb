    year_western: null
    document: null
    note: 「軽米」の文献初出は本バッチでは特定できなかった。江戸時代には八戸藩の軽米通代官所が置かれていたことが専門資料で確認できる
  claims:
  - text: 『ブリタニカ国際大百科事典』は、軽米の町名はアイヌ語に由来するといわれると説明する
    kind: fact
    level: E3
    status: contested
    sources:
    - z7-karumai-kotobank
  - text: 岩手県の「町村名の由来」は軽米の語源として、アイヌ語の「カル・モイ（うねり曲がった流域）」「カル・オマイ（フキの葉がとれるところ・回り道のあるところ）」などの説を挙げる
    kind: fact
    level: E2
    status: contested
    sources:
    - z6-iwate-bunka-chimei
  - text: 同一覧はそのほかにも、カルは「刈」で焼畑用語から崖を意味するとする説、カレ（涸）とする説、「軽馬医」で馬医がいたところとする説、「離る間井（ガルマイ）」で水走りの境の村落とする説など、計7説を挙げており、語源は確定していない
    kind: fact
    level: E2
    status: contested
    sources:
    - z6-iwate-bunka-chimei
  - text: 『ブリタニカ国際大百科事典』によれば、軽米は1925年に町制を施行し、1955年に小軽米・晴山の2村と合体して現在の町域となった
    kind: fact
    level: E3
    status: established
    sources:
    - z7-karumai-kotobank
  - text: 同書によれば、中心地区の軽米は九戸街道に沿う宿場町として発展し、藩政時代には付近で砂鉄を産し、鉄瓶や鍋などをつくる鋳物業者が多く集まった
    kind: fact
    level: E3
    status: established
    sources:
    - z7-karumai-kotobank
  - text: 『日本歴史地名大系』の関連解説によれば、江戸時代の軽米は九戸郡の西半に設定された八戸藩の行政区域「軽米通」の中心で、軽米通代官所が置かれた
    kind: fact
    level: E3
    status: established
    sources:
    - z7-karumai-kotobank
  - text: 軽米町の地方公共団体コードは035017である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 語源が7つある町
    text: 軽米ほど語源の候補が多い町名も珍しい。岩手県の由来一覧は、焼畑用語の「刈」から崖を意味するという説、カレ（涸）説、崖地の前方という説、アイヌ語の「カル・モイ（うねり曲がった流域）」「カル・オマイ（フキの葉がとれるところ）」、水走りの境をいう「離る間井（ガルマイ）」、馬医がいたという「軽馬医」説まで、7説を並べている。馬産地・九戸街道の宿場町として馬と縁の深い土地柄を思えば「軽馬医」も捨てがたく、アイヌ語説には地名研究の王道の重みがある。決め手がないまま説が積み重なっていくこと自体が、この地名の古さと、多くの人が由来を知りたがってきた証しである。
    sources:
    - z6-iwate-bunka-chimei
    - z7-karumai-kotobank
  relations:
  - pref/03
  unknowns:
  - 語源の定説はなく、7説のいずれとも確定できない
  - 「軽米」の文献初出は特定できていない
  - 中世の軽米氏や軽米城と地名との関係は、本バッチでは確認できなかった
  updated: '2026-11-13'
- id: muni/03-遠野市
  code: 032085
  names:
    ja: 遠野市
    reading: とおのし
    aliases:
    - 遠野町
    - 遠野郷
  user_terms:
  - 遠野物語のふるさと
  - 民話のまち
  - 河童のまち
  - 座敷童子の里
  naming_type: その他
  prefecture: 岩手県
  homonyms: []
  summary: 「遠野」は岩手県内陸の盆地の地名で、語源は確定していない。岩手県の資料は、閉伊の奥を意味する「遠閉伊」の野原とする説、山間の遠い野とする説、アイヌ語のト（沼）ヌプ（野）とする説など5説を併記する。地名そのものの層とは別に、1910年に柳田國男が遠野出身の佐々木喜善の語りを編んだ『遠野物語』を刊行し、遠野は河童や座敷童子の伝わる「民話のふるさと」として知られるようになった。市は1954年に遠野町と7村の合併で発足し、2005年に宮守村と合併した。
  first_attestation:
    era: null
    year_western: null
    document: null
    note: 「遠野」の名の初出となる文書は確認できなかった。県の文化情報大事典も語源の諸説を併記するにとどまる
  claims:
  - text: 総務省の全国地方公共団体コードで、遠野市の団体コードは032085と定められている
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  - text: 岩手県の文化情報大事典「市名の由来」は、遠野の語源として、閉伊の先・閉伊の奥を意味する汎称「遠閉伊」の野原とする説、山間の遠い野とする説、アイヌ語のト（沼）ヌプ（野）とする説、東方の野（東野）とする説、撓野（タワノ）の転訛でたわんだ地形の盆地とする説を併記しており、定説は示されていない
    kind: fact
    level: E2
    status: contested
    sources:
    - a-cap-morioka-bunka
  - text: 遠野は近世、遠野南部家（1万2千5百石）の城下町として、内陸と沿岸を結ぶ町として発展した
    kind: fact
    level: E2
    status: established
    sources:
    - t4-tono-soumu-doc
  - text: 昭和29年（1954年）12月1日、遠野町・青笹村・上郷村・小友村・綾織村・附馬牛村・松崎村・土淵村が合併して遠野市が生まれた
    kind: fact
    level: E5
    status: established
    sources:
    - t4-tono-wiki
  - text: 平成17年（2005年）10月1日、遠野市と宮守村が合併して新しい遠野市が誕生した
    kind: fact
    level: E2
    status: established
    sources:
    - t4-tono-soumu-doc
  - text: 『遠野物語』は柳田國男が明治43年（1910年）に発表した説話集で、遠野地方出身の佐々木喜善が語った伝承を柳田が筆記・編纂したものである
    kind: fact
    level: E2
    status: established
    sources:
    - t4-tono-chuo-paper
  - text: 『遠野物語』により、遠野は河童や座敷童子などが登場する民話・伝説のふるさととして広く知られるようになった
    kind: fact
    level: E5
    status: established
    sources:
    - t4-tono-wiki
  column:
    title: 地名を全国区にしたのは、一冊の本だった
    text: 「遠野」という地名の由来は、今もって決着がついていません。ところがこの地名が日本中で知られるようになった理由ははっきりしています。1910年、のちに民俗学の祖と呼ばれる柳田國男が、遠野出身の青年・佐々木喜善から聞いた話を編んで『遠野物語』を出したことです。当初は350部だけの小さな出版でしたが、河童や座敷童子、神隠しの物語は読む人を魅了し、遠野は「民話のふるさと」として知られるようになりました。遠野市は刊行100年の2010年、発行日の6月14日を「遠野物語の日」と定めています。地名の古い層と、近代に本が重ねた新しい層——遠野の知名度は、この二層からできています。
    sources:
    - t4-tono-chuo-paper
    - t4-tono-wiki
  relations:
  - pref/03
  - muni/03-釜石市
  unknowns:
  - 「遠野」の語源は県の資料でも5説併記のままで、初出となる古文書も確認できなかった
  - 『遠野物語』の舞台とされる「遠野郷」の範囲と現在の市域の正確な対応は、確認した資料では特定できなかった
  updated: '2026-11-13'
- id: muni/03-野田村
  code: '035033'
  names:
    ja: 野田村
    reading: のだむら
    aliases: []
  user_terms:
  - 野田塩の村
  - 野田湾
  - のだ
  naming_type: 一部の地名
  prefecture: 岩手県
  homonyms: []
  summary: 岩手県九戸郡の、三陸海岸の野田湾に面した村。「のだ」の語源は定説がなく、岩手県の地名解説は、宇部川・明内川流域の湿地を指す「ヌダ（沼田）」の転訛説、「野のある土地」説、方言で無風の波をいう「のだ」説を併記する。江戸時代から製塩が盛んで、塩を牛の背に載せて内陸へ運んだ「野田塩ベコの道」で知られる。現在の村は1889年に野田村と玉川村が合併して成立した。
  first_attestation:
    era: null
    year_western: null
    document: null
    note: 本調査では「野田」の名の文献上の初出を確認できなかった。県の地名解説は語源説のみを示し、初出文献を挙げていない
  claims:
  - text: 総務省の全国地方公共団体コードで、野田村の団体コードは035033と定められている
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  - text: 岩手県の地名解説は、「のだ」の語源として、村内を流れる宇部川・明内川流域の湿地・湿田を指す「ヌダ（沼田）」が転じたものとする説を紹介している
    kind: fact
    level: E2
    status: contested
    sources:
    - z6-iwate-bunka-chimei
  - text: 同じく岩手県の地名解説は、「野のある土地」とする説と、方言で無風の波を意味する「のだ」による説も併せて紹介しており、語源は一つに定まっていない
    kind: fact
    level: E2
    status: contested
    sources:
    - z6-iwate-bunka-chimei
  - text: 明治22年（1889年）2月16日に野田村と玉川村（現在の玉川地区）が合併し、現在の野田村が成立した
    kind: fact
    level: E2
    status: established
    sources:
    - z8-noda-vill
  - text: 野田村では江戸時代から製塩が盛んとなり、塩は牛の背に載せられて遠く内陸地方まで運ばれ、その運搬路は「野田塩ベコの道」と呼ばれた
    kind: fact
    level: E2
    status: established
    sources:
    - z8-noda-vill
  - text: 村は九戸郡に属し、東は三陸海岸の野田湾に面している
    kind: fact
    level: E2
    status: established
    sources:
    - z8-noda-vill
  column:
    title: 塩を運んだ牛の道
    text: 海の村の名産は、海水から作る塩だった。江戸時代から野田では製塩が盛んで、できあがった塩は牛の背に載せられ、山を越えて遠く内陸まで運ばれた。その運搬路は今も「野田塩ベコの道」と呼ばれ、一部を歩くイベントが行われている。「のだ」の語源は今も定まらないが、村の暮らしの記憶は塩と牛の道に残っている。
    sources:
    - z8-noda-vill
  relations:
  - pref/03
  unknowns:
  - 「野田」の名の文献上の初出は未確認
  - ヌダ（沼田）転訛説の言語学的な裏付けは未確認
  - 野田湾の名と村名「野田」の先後関係は未確認
  updated: '2026-11-13'
- id: muni/03-金ケ崎町
  code: 033812
  names:
    ja: 金ケ崎町
    reading: かねがさきちょう
    aliases:
    - 金ケ崎村
  user_terms:
  - かねがさき
  - 金ケ崎要害の町
  - 鳥海柵の町
  naming_type: 一部の地名
  prefecture: 岩手県
  homonyms: []
  summary: 岩手県胆沢郡の内陸の町。「かねがさき」の語源は定説がなく、岩手県の地名解説は「矩（かね）が崎」＝直角に曲がった州崎とする説と、「川根が崎」の略で扇状地の出崎とする説を併記する。近世には南部領と伊達領の境に位置し、伊達氏の拠点「金ケ崎要害」の城下として栄えた。1925年に町制を施行し、1955年に永岡村と合併して現在の町となった。
  first_attestation:
    era: null
    year_western: null
    document: null
    note: 江戸時代の金ケ崎要害に「金ケ崎」の名は見えるが、それ以前の文献上の初出は本調査では確認できなかった
  claims:
  - text: 総務省の全国地方公共団体コードで、金ケ崎町の団体コードは033812と定められている
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  - text: 岩手県の地名解説は、「かねがさき」の語源として、「矩（カネ）が崎」で直角に曲がった州崎のこととする説を紹介している
    kind: fact
    level: E2
    status: contested
    sources:
    - z6-iwate-bunka-chimei
  - text: 同じく岩手県の地名解説は、「川根が崎」の略で扇状地の出崎を指すとする説も併せて紹介しており、語源は定まっていない
    kind: fact
    level: E2
    status: contested
    sources:
    - z6-iwate-bunka-chimei
  - text: 近世の金ケ崎は伊達領の北限・南部領との境の地で、旧奥州街道沿いに伊達氏の拠点「金ケ崎要害」が置かれ、その武家町の景観が残る城内諏訪小路地区は国の重要伝統的建造物群保存地区に選定されている
    kind: fact
    level: E2
    status: established
    sources:
    - z8-kanegasaki-town
  - text: 町内には前九年合戦（1051〜1062年）の舞台となった国指定史跡「鳥海柵（とのみのさく）跡」が残り、安倍宗任の柵とされる
    kind: fact
    level: E2
    status: established
    sources:
    - z8-kanegasaki-town
  - text: 大正14年（1925年）9月1日に町制を施行して金ケ崎町となった
    kind: fact
    level: E5
    status: established
    sources:
    - z8-kanegasaki-wiki
  - text: 昭和30年（1955年）3月1日に金ケ崎町と永岡村が合併し、新しい金ケ崎町として誕生した
    kind: fact
    level: E2
    status: established
    sources:
    - z8-kanegasaki-town
  column:
    title: 二つの藩の境の町
    text: 金ケ崎は、北の南部領と南の伊達領の境にあった。町には両領の境を示す「南部領伊達領境塚」が残り、奥州街道沿いには伊達氏の北の拠点「金ケ崎要害」が築かれた。城下の武家町・城内諏訪小路の景観は今も色濃く残る。境の地であったことが、この町の歴史の色を決めている。
    sources:
    - z8-kanegasaki-town
  relations:
  - pref/03
  unknowns:
  - 「金ケ崎」の名の文献上の初出は未確認
  - 「矩が崎」説と「川根が崎」説のいずれが正しいかは未確定
  updated: '2026-11-13'
- id: muni/03-釜石市
  code: '032115'
  names:
    ja: 釜石市
    reading: かまいしし
    aliases:
    - 釜石町
    - 釜石村
  user_terms:
  - 鉄と魚のまち
  - 近代製鉄発祥の地
  - ラグビーのまち
  - 橋野高炉のある市
  naming_type: その他
  prefecture: 岩手県
  homonyms: []
  summary: 「釜石」は、1189年には郷の名として歴史に現れる古い地名で、語源は確定していない。岩手県の資料は、釜をつくる石を多く産する説、アイヌ語に求める2説、釜に似た石の説など6説を併記し、「釜の形の石」説もその一つにすぎない。「釜」の字面から製鉄に結びつけられがちだが、地名は近代製鉄よりはるかに古く、1857年に大島高任が高炉で出銑に成功して釜石が「近代製鉄発祥の地」となったのは近世末の出来事である。市制は1937年で、岩手県下2番目の市だった。
  first_attestation:
    era: 文治5年
    year_western: 1189
    document: null
    note: 釜石市の概況が、釜石は文治5年に阿曽沼広綱へ与えられた遠野十二郷の上十六郷の一郷として歴史に登場したと紹介するもので、根拠となった文書名は特定できなかった
  claims:
  - text: 総務省の全国地方公共団体コードで、釜石市の団体コードは032115と定められている
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  - text: 岩手県の文化情報大事典「市名の由来」は、釜石の語源として、釜をつくる石を多く産することからとする説、アイヌ語の「クマ・ウシ」（魚を干す場所）とする説、同じくアイヌ語の「カマ・ウシ」（平岩のあるところ）とする説、釜に似た石とする説、甲子川の釜状の石とする説、釜渕の釜とする説の6説を併記しており、定説は示されていない
    kind: fact
    level: E2
    status: contested
    sources:
    - a-cap-morioka-bunka
  - text: 釜石市によれば、釜石が歴史に登場するのは文治5年（1189年）で、源頼朝に功のあった阿曽沼広綱に遠野十二郷が与えられ、釜石はその上十六郷の一郷であった
    kind: fact
    level: E2
    status: established
    sources:
    - t4-kamaishi-city-gaikyo
  - text: 安政4年（1857年）、盛岡藩士の大島高任は大橋地区に洋式高炉を築いて鉄鉱石精練による出銑に成功し、これにより釜石は我が国の近代製鉄業発祥の地となった
    kind: fact
    level: E2
    status: established
    sources:
    - t4-kamaishi-city-history
  - text: 釜石市は、釜石は「鉄と魚のまち」として発展してきたが、とりわけ「鉄」による影響が大きなものであったと位置づけている
    kind: fact
    level: E2
    status: established
    sources:
    - t4-kamaishi-city-history
  - text: 明治22年（1889年）に釜石村と平田村が合併して釜石町となり、昭和12年（1937年）には岩手県下で2番目に市制を施行して釜石市となり、昭和30年（1955年）に隣接の4か村を合併して現在の釜石市となった
    kind: fact
    level: E2
    status: established
    sources:
    - t4-kamaishi-city-gaikyo
  column:
    title: 「釜」の字にだまされてはいけない——地名は鉄より約670年古い
    text: 「釜石」という字面を見ると、鉄を溶かす釜にちなむ製鉄の地名のように思えます。ところが釜石という名は、1189年にはすでに郷の名として歴史に現れています。大島高任が高炉で出銑に成功して「近代製鉄発祥の地」になるのは1857年で、地名のほうが約670年も先にあったのです。県の資料が挙げる語源は6説あり、「釜に似た石」という説もその一つにすぎません。製鉄のイメージが強いために後から鉄と結びつけて理解されがちな、注意の要る地名です。
    sources:
    - t4-kamaishi-city-gaikyo
    - a-cap-morioka-bunka
    - t4-kamaishi-city-history
  relations:
  - pref/03
  - muni/03-遠野市
  unknowns:
  - 「釜石」の語源は6説併記のままで、1189年の用例の根拠となった文書名も特定できなかった
  - 「釜石」の表記がいつから現在の漢字で定着したかは確認できなかった
  updated: '2026-11-13'
- id: muni/03-陸前高田市
  code: '032107'
  names:
    ja: 陸前高田市
    reading: りくぜんたかたし
    aliases:
    - 高田町
  user_terms:
  - 奇跡の一本松のまち
  - 高田松原
  - たがだ（地元の発音）
  - 陸前海岸の市
  naming_type: その他
  prefecture: 岩手県
  homonyms: []
  summary: 市名は、旧国名「陸前」と中心地名「高田」の二層からなる。「陸前」は明治初年に陸奥国が分割されて成立した陸前国の名で、1955年の合併の際に、中心となった高田町の名に冠して「陸前高田」と命名された。「高田」の由来は確定せず、気仙郡総鎮守・氷上山の神田にちなむ説などが併記される。公式の読みは「りくぜんたかた」だが、地元では鼻濁音化して「たがだ」「たかだ」と発音される。市は2011年の東日本大震災で甚大な被害を受け、「奇跡の一本松」が復興の象徴となった。
  first_attestation:
    era: 昭和30年
    year_western: 1955
    document: 陸前高田市の発足（昭和30年1月1日）
    note: 市名としての初出。中心地名「高田」自体の初出となる文書は確認できなかった
  claims:
  - text: 総務省の全国地方公共団体コードで、陸前高田市の団体コードは032107と定められている
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  - text: 市名の「陸前」は旧国名で、市域は旧陸前国気仙郡に属していた
    kind: fact
    level: E5
    status: established
    sources:
    - t4-rikuzen-wiki
  - text: 岩手県の文化情報大事典「市名の由来」は、昭和30年（1955年）の合併に際し、合併の中心となった高田町の「高田」に「陸前」を冠称として陸前高田と命名されたと説明する
    kind: fact
    level: E2
    status: established
    sources:
    - a-cap-morioka-bunka
  - text: 同じく県の大事典は「高田」の由来として、気仙郡総鎮守の氷上山の神田を「高田」と称したことからとする説、あたりの平地より高いところにある田の意味であるとする説、「田方」で田地のことであるとする説を併記しており、定説は示されていない
    kind: fact
    level: E2
    status: contested
    sources:
    - a-cap-morioka-bunka
  - text: 陸前高田市は1955年（昭和30年）1月1日、気仙郡の高田町・気仙町・広田町・小友村・竹駒村・矢作村・横田村・米崎村の3町5村が新設合併して発足した
    kind: fact
    level: E2
    status: established
    sources:
    - t4-rikuzen-mlit
  - text: 市域の属する気仙郡の名は、弘仁2年（811年）の『続日本紀』に初めて見られると紹介されている
    kind: fact
    level: E4
    status: established
    sources:
    - t4-rikuzen-ymif
  - text: 市の読みは1955年の市制以来「りくぜんたかた」であるが、地元住民や周辺市町村では、か行とた行の音が鼻濁音化した「たがだ」、または最後の「た」だけが濁音化する「たかだ」と発音される
    kind: fact
    level: E5
    status: established
    sources:
    - t4-rikuzen-wiki
  - text: 2011年の東日本大震災では津波により市街地と高田松原が大きな被害を受け、復興と防災・減災の取り組みが続けられている
    kind: fact
    level: E5
    status: established
    sources:
    - t4-rikuzen-wiki
  column:
    title: 公式は「たかた」、地元は「たがだ」
    text: 陸前高田市の公式の読みは、1955年の市制以来「りくぜんたかた」です。けれど地元では、東北地方の方言の特徴である鼻濁音で「たがだ」と呼ばれ、あるいは最後だけ濁って「たかだ」と発音されます。2011年の東日本大震災では、市街地を見守ってきた高田松原の松林が津波でなぎ倒され、ただ一本だけ残った松が「奇跡の一本松」と呼ばれて復興の象徴になりました。旧国名と中心地名を重ねた市名には、震災と復興の記憶の層もまた重なっています。
    sources:
    - t4-rikuzen-wiki
  relations:
  - pref/03
  - muni/03-大船渡市
  unknowns:
  - 中心地名「高田」の初出となる文書は確認できなかった
  - 氷上山の神田にちなむという「高田」の由来説の典拠となる古い記録は確認できなかった
  - 「陸前」を冠することにした合併協議の具体的な経緯（他の候補名の有無など）は、市公式資料で確認できなかった
  updated: '2026-11-13'
- id: muni/03-雫石町
  code: '033014'
  names:
    ja: 雫石町
    reading: しずくいしちょう
    aliases:
    - 滴石
    - 雫石村
  user_terms:
  - しずくいし
  - 雫石スキー場
  - 小岩井農場のある町
  naming_type: 一部の地名（中世の「滴石」が戦国期に「雫石」と表記を改められた地名の継承）
  prefecture: 岩手県
  homonyms: []
  summary: 岩手県岩手郡の町。中世には「滴石」と表記され、12世紀末頃に戸沢氏が移り住んで滴石の姓を名乗ったと伝わる。戦国期に斯波氏が「滴石」を「雫石」に改めた。語源には、川底に沈む石が多い土地を指す「沈く石（シズクイシ）」説と、雫石神社の湧き水「たんたん」にちなむ説がある。1889年に雫石村が成立し、1940年の町制を経て1954年に西山村などと合併した。
  first_attestation:
    era: 12世紀末
    year_western: null
    document: 諸記録（雫石町公式「雫石の歴史」が紹介）
    note: 戸沢氏初代衡盛が移り住み戸沢（滴石）の姓を名乗ったとする記録が町公式の歴史に紹介される。当初の表記は「滴石」。具体的な文献名は特定できなかった
  claims:
  - text: 総務省の全国地方公共団体コードで、雫石町の団体コードは033014と定められている
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  - text: 中世にはこの地は「滴石」と表記され、雫石町公式の歴史によれば、諸記録では12世紀末頃に戸沢氏初代の衡盛が移り住み、戸沢（滴石）の姓を名乗ったとされる
    kind: fact
    level: E2
    status: established
    sources:
    - z8-shizukuishi-town-history
  - text: 戦国時代に滴石に入った斯波氏は、「滴石」を「雫石」に改め、自らも雫石氏を名乗って雫石城を復興した
    kind: fact
    level: E2
    status: established
    sources:
    - z8-shizukuishi-town-history
  - text: 岩手県の地名解説は、「しずくいし」の語源として、雫石川や葛根田川などに沈む石（シズクイシ）が多く、川底に石が多いところを指すとする説を紹介している
    kind: fact
    level: E2
    status: contested
    sources:
    - z6-iwate-bunka-chimei
  - text: 同じく岩手県の地名解説は、「滴石」は雫石神社の湧き水「たんたん」にちなむとする説も併せて紹介している
    kind: fact
    level: E2
    status: contested
    sources:
    - z6-iwate-bunka-chimei
  - text: 明治22年（1889年）に雫石村が成立し、昭和15年（1940年）12月23日に町制を施行して雫石町となり、昭和29年（1954年）4月1日に西山村などが合併した
    kind: fact
    level: E5
    status: established
    sources:
    - z8-shizukuishi-wiki
  column:
    title: 「滴石」から「雫石」へ
    text: この町の名は、もとは「滴石」と書かれた。中世の記録に現れるこの土地を、戦国時代に領した斯波氏が「雫石」と改め、自らも雫石氏を名乗ったという。水のしたたりを思わせる「雫」の字への置き換えは、武将の美意識の表れだったのかもしれない。町には雫石神社の湧き水「たんたん」を名の由来とする説も伝わり、水にまつわる名であることは一貫している。
    sources:
    - z8-shizukuishi-town-history
    - z6-iwate-bunka-chimei
  relations:
  - pref/03
  unknowns:
  - 「滴石」の名が見える中世資料の具体的な文献名は未確認
  - 斯波氏が「雫石」に改めた正確な年次は未確認
  - 語源の「沈く石」説と雫石神社の湧き水説の先後・優劣は未確定
  updated: '2026-11-13'
