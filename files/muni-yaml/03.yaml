  naming_type: その他（岩の間から湧き出る泉という湧水・地形に由来する自然地名）
  prefecture: 岩手県
  homonyms: []
  summary: 下閉伊郡の町で、日本三大鍾乳洞の一つに数えられる龍泉洞で知られる。町名の由来は、岩手県の由来一覧が「岩の間から湧き出る泉」と説明し、『ブリタニカ国際大百科事典』も「岩層から水が出ることによる」とする。現在の中心町場は江戸時代の享保16年（1731）に千本町として市が開かれたのが始まりで、後に岩泉町と改称した。大正11年（1922）に岩泉村が町制を施行し、昭和31〜32年（1956〜57）の合併・編入で現在の町域の基礎ができた。
  first_attestation:
    era: 享保16年
    year_western: 1731
    document: 千本町の開設記録（『日本歴史地名大系』「岩泉町」項が紹介）
    note: 現在の中心町場が千本町として開かれた年で、その後に岩泉町へ改称した。「岩泉」の語そのものの文献初出は特定できていない
  claims:
  - text: 岩手県の「町村名の由来」は、岩泉の由来を「岩の間から湧き出る泉」と説明する
    kind: fact
    level: E2
    status: established
    sources:
    - z6-iwate-bunka-chimei
  - text: 『ブリタニカ国際大百科事典』も、岩泉の町名は岩層から水が出ることによると説明する
    kind: fact
    level: E3
    status: established
    sources:
    - z7-iwaizumi-kotobank
  - text: 『日本歴史地名大系』によれば、現在の岩泉の町場は享保16年（1731）に千本町と称して三斎市が開設されたのが始まりで、その後に岩泉町と改称した
    kind: fact
    level: E3
    status: established
    sources:
    - z7-iwaizumi-kotobank
  - text: 岩泉町勢要覧によれば、明治22年（1889）の町村制でこの地域に岩泉村が置かれ、大正11年（1922）8月1日に町制を施行して岩泉町となった
    kind: fact
    level: E2
    status: established
    sources:
    - z7-iwaizumi-seiyouran
  - text: 『ブリタニカ国際大百科事典』によれば、岩泉町は1956年に近隣町村と合体し、翌1957年に小川村を編入した
    kind: fact
    level: E3
    status: established
    sources:
    - z7-iwaizumi-kotobank
  - text: 町内にある龍泉洞は、「岩泉湧窟およびコウモリ」として知られる鍾乳洞で、岩の間から湧く水のイメージとともに町の象徴となっている
    kind: fact
    level: E3
    status: established
    sources:
    - z7-iwaizumi-kotobank
  - text: 岩泉町の地方公共団体コードは034835である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 千本町から岩泉町へ
    text: 岩泉の中心の町場は、はじめから「岩泉」だったわけではない。享保16年（1731）、この地に千本町と称する新しい町場がつくられ、毎月三の日の三斎市が開かれた。ところが小本街道沿いの門村にも同じ三の日の市が立っていたため商物が集まらず、3年後に市日を四の日に変えてようやく町場として成り立ったという。その後、町場は岩泉町と改称した。岩の間から湧き出る泉という地名が、市の立つ町場の名として受け継がれたことになる。町内随一の景勝・龍泉洞（岩泉湧窟）の水のイメージとも重なり、「岩」と「泉」の名は町の顔になっている。
    sources:
    - z7-iwaizumi-kotobank
    - z6-iwate-bunka-chimei
  relations:
  - pref/03
  unknowns:
  - 「岩泉」の語そのものの文献初出は特定できていない
  - 千本町から岩泉町への改称の正確な年は、本バッチでは確認できなかった
  - 語源について「岩の間から湧き出る泉」以外の説が存在するかは未確認である
  updated: '2026-11-13'
- id: muni/03-平泉町
  code: 034029
  names:
