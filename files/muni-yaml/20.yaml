  homonyms:
  - muni/29-川上村
  summary: 千曲川の最上流部に位置する村。地域名としては戦国期の文書に「川上郷」が見え、明治22年（1889年）に八つの旧村の区域をもって川上村が発足した。村名は最上流部という立地と旧郷名の継承で説明される。奈良県の川上村とは「大河の最上流部」という命名の構造だけが共通し、川も歴史も無関係である。大字「御所平」には保元の乱にまつわる皇子の伝承が残る。
  first_attestation:
    era: 天正2年
    year_western: 1574
    document: 大井文書
    note: 日本歴史地名大系が紹介する「川上郷」の用例（郷名としての初出）。村名そのものの成立は1889年
  claims:
  - text: 日本歴史地名大系によれば、天正2年（1574年）の大井文書に「平賀之事」とある十二郷の中に「川上郷」の名が見える
    kind: fact
    level: E3
    status: established
    sources:
    - h6-kawakami-kotobank
  - text: 村は千曲川の最上流部に位置し、村域は梓山・秋山・居倉・川端下・原・大深山・御所平・樋沢の旧八か村からなる
    kind: fact
    level: E3
    status: established
    sources:
    - h6-kawakami-kotobank
  - text: 明治22年（1889年）4月1日、居倉村・原村・御所平村・大深山村・秋山村・梓山村・川端下村の区域と大明村の区域のうち樋沢の区域をもって川上村が発足した
    kind: fact
    level: E5
    status: established
    sources:
    - h6-kawakami-nagano-wiki
  - text: 村名「川上」は、千曲川の最上流部にあたる立地と、戦国期以来の地域名「川上郷」の継承によって説明される
    kind: fact
    level: E3
    status: inferred
    sources:
    - h6-kawakami-kotobank
    - h6-kawakami-nagano-yoran
  - text: 奈良県の川上村も「川の上流部」の名という点は共通するが、対象の川は吉野川であり、戦国期の「川上郷」のような旧郷名の用例は奈良側では確認していない（共通する層＝命名の構造、異なる層＝川と地域史）
    kind: fact
    level: E3
    status: established
    sources:
    - h6-kawakami-kotobank
  - text: 保元の乱（1156年）で敗れた崇徳上皇の皇子・重仁親王が、信濃の村上基国を頼って川上村の御所平・御殿窪に安住したという伝承があり、大字「御所平」の名はその名残と語られる。作家の佐藤春夫は『佐久の内裏』で、この伝承と「佐久川上村御所平要図」という史料を取り上げた
    kind: legend
    level: E4
    status: established
    sources:
    - h6-kawakami-shigehito-legend
    - h6-kawakami-nagano-wiki
  column:
    title: 御所平に眠る皇子の伝説
    text: 川上村の大字に「御所平」という、いかにも皇族ゆかりの名があります。伝承では、保元の乱で敗れた崇徳上皇の皇子・重仁親王が、信濃の武士・村上基国を頼って千曲川を遡り、この御所平の御殿窪に住んだとされます。再起を図りながら若くして病に倒れたとも語られ、近くの南相木村には御陵山の名まで残ります。昭和には佐藤春夫が小説『佐久の内裏』にこの伝承を書きました。史実として確認できる話ではありませんが、「川の最上流の村」に皇子の落人伝説が根づいたこと自体が、この土地の記憶の形です。
    sources:
    - h6-kawakami-shigehito-legend
  relations:
  - pref/20
  - muni/29-川上村
  unknowns:
  - 「川上郷」の範囲と現在の村域がどの程度一致するかは未確認
  - 重仁親王伝承について、村公式資料（村史・村勢要覧）がどう扱っているかは未確認
  updated: '2026-11-13'
- id: muni/20-平谷村
  code: '204099'
  names:
    ja: 平谷村
    reading: ひらやむら
    aliases:
    - 比良屋
    - 波合村
  user_terms:
  - 平谷村
  - ひらや
  - 長野県で一番人口の少ない村
  - ひまわりの湯の村
  naming_type: 一部の地名（近世以来の地名「平谷（比良屋）」の継承）
  prefecture: 長野県
  homonyms: []
  summary: 下伊那郡の村で、長野県で最も人口の少ない自治体である。地名の古い表記は「比良屋」で、天文2年（1533年）に京都・理性院の僧が立ち寄ったとする記録が、村公式の伝える平谷の初出である。村の中心は標高900m前後に広がる比較的平坦な谷あいの地で、江戸時代は信州と三河を結ぶ三州街道の中馬の宿場として栄えた。現在の村は1934年に波合村が分村して成立した。
  first_attestation:
    era: 天文2年
    year_western: 1533
    document: 理性院の古記録（厳助法師の来訪を伝える文献）
    note: 平谷村公式サイトの歴史ページが、「比良屋」という表記での平谷の文献初出として紹介する。原文の直接確認はしていない
  claims:
  - text: 平谷村公式サイトの歴史ページは、平谷が文献に登場する最初は、天文2年（1533年）に京都の真言宗の古刹・理性院の厳助法師が飯田からの帰りに「比良屋」に立ち寄ったとする文献であるとする
    kind: fact
    level: E2
    status: established
    sources:
    - v12-hiraya-vill-history
  - text: 『日本大百科全書（ニッポニカ）』は、1934年（昭和9年）に波合村が浪合村（現・阿智村）と平谷村に別れて、平谷村が成立したとする
    kind: fact
    level: E3
    status: established
    sources:
    - v12-hiraya-kotobank-nipponika
  - text: 戦国時代、武田信玄によって伊那街道が軍用道路として開発され平谷宿が生まれ、平谷には滝之沢御関所が置かれたと村公式は伝える
    kind: fact
    level: E2
    status: established
    sources:
    - v12-hiraya-vill-history
  - text: 江戸から明治にかけて、平谷は幕府の伝馬制度による宿駅として、また荷物運搬の「中馬」の馬宿が発達して、宿場町として栄えた
    kind: fact
    level: E2
    status: established
    sources:
    - v12-hiraya-vill-history
  - text: 『信長公記』には天正10年（1582年）の武田氏追討の途上で、織田信長が根羽村から平谷を越え、飯田へ進んだと記されていることを、『日本歴史地名大系』が出典として紹介されている
    kind: fact
    level: E4
    status: established
    sources:
    - v12-hiraya-donnatoko
  - text: 「平谷（比良屋）」の名が、山々に囲まれた中に広がる平らな谷という地形を指すと考えられるが、語源を明記した村公式・専門資料は本バッチでは確認できなかった
    kind: fact
    level: H
    status: inferred
    sources:
    - v12-hiraya-vill-history
  - text: 平谷村の地方公共団体コードは204099である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 県内最少の村の、500年近い名
    text: 人口は県内で最も少ない300人台。それでも「平谷」の名の文献初出は1533年まで遡り、織田信長も軍勢を率いて越えた峠の村である。江戸時代には信州と三河を結ぶ中馬の宿場として、馬追いの行き交う音が絶えなかったという。1,500m級の山々に囲まれながら、村の中心には標高900mほどの平坦地が広がる——深い山の中に突然ひらける「平らな谷」が、そのまま村の名になったとみられる。
    sources:
    - v12-hiraya-vill-history
    - v12-hiraya-kotobank-nipponika
  relations:
  - pref/20
  unknowns:
  - 「比良屋」から「平谷」へ表記が変わった時期と理由は確認できなかった
  - 地名「ひらや」の語源を明示した専門資料は確認できなかった
  updated: '2026-11-13'
- id: muni/20-御代田町
  code: '203238'
  names:
    ja: 御代田町
    reading: みよたまち
    aliases:
    - 御代田村
    - 小田井宿
  user_terms:
  - 御代田
  - みよた
  - 浅間山のふもとの町
  - 軽井沢の隣の町
  - 龍神まつりの町
  naming_type: 新規命名（1875年の合併時に、構成4村の名に共通する「田」と明治の「御代」を組み合わせて命名したと伝わる）
  prefecture: 長野県
  homonyms: []
  summary: 北佐久郡の町。町名は、1875年（明治8年）に前田原・池田新田・児玉新田・小田井の4村が合併して生まれた御代田村に由来する。郷土資料に基づく地域の説明では、合併した4村の名に共通する「田」の字を取り、明治維新の「御代」に因んで「御代田」と名付けたとされ、「代（よ）」の音は4か村の「四（よん）」にも通じるという。1956年に御代田村・小沼村・伍賀村が合併して御代田町となった。
  first_attestation:
    era: 明治8年
    year_western: 1875
    document: 4か村の合併による御代田村の成立
    note: 命名そのものが「御代田」の初出。由来の説明は御代田町公民館『御代田物語』（1980年）など郷土資料に基づく地域の伝承的説明で、合併当時の一次記録は確認していない
  claims:
  - text: 1875年（明治8年）に、近世以来の前田原村・池田新田・児玉村・小田井村が合併して御代田村となった
    kind: fact
    level: E5
    status: established
    sources:
    - v12-miyota-wiki-mura
  - text: 御代田の名の由来について、御代田町公民館『御代田物語』など郷土資料に基づく地域の説明は、合併した4つの村の名にある「田」を取り、明治維新の「御代」に因んで「御代田」と名付けたといい、「代（よ）」は4か村の「四（よん）」にも通じると添える
    kind: fact
    level: E4
    status: established
    sources:
    - v12-miyota-essay
  - text: 昭和31年（1956年）9月30日に小沼村・御代田村・伍賀村が合併し、御代田町が発足した
    kind: fact
    level: E2
    status: established
    sources:
    - v12-miyota-town-nenpyo
  - text: 町域の小田井には中山道の小田井宿が置かれ、本陣・脇本陣・問屋などが設けられた
    kind: fact
    level: E2
    status: established
    sources:
    - v12-miyota-town-enkaku
  - text: 奈良時代・平安時代には、この地に朝廷直営の牧場である御牧「塩野牧」が置かれ、官道「東山道」が通るなど佐久地方の中枢部として賑わったと、町公式の沿革は伝える
    kind: fact
    level: E2
    status: established
    sources:
    - v12-miyota-town-enkaku
  - text: 御代田町の地方公共団体コードは203238である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 「御代」と「田」と「四」の言葉遊び
    text: 御代田という名は、明治の新しい「御代」への期待と、合併した4つの村（前田原・池田新田・児玉新田・小田井）に共通する「田」の字を組み合わせた命名だと郷土資料は伝える。おまけに「代」は「よ」と読み、4か村の「四（よん）」にも通じるという言葉遊びまで添えられている。1875年の命名に込められた洒落が、浅間山のふもとの町の名として、およそ150年を生き続けている。
    sources:
    - v12-miyota-essay
  relations:
  - pref/20
  unknowns:
  - 1875年の命名を示す一次記録（合併文書等）は確認しておらず、由来は郷土資料に基づく伝承的な説明にとどまる
  - 御代田村成立（1875年）の経緯については、主にWikipediaの記述（典拠は角川日本地名大辞典・『北佐久郡志 町村篇』等）に依った
  updated: '2026-11-13'
- id: muni/20-朝日村
  code: '204510'
  names:
    ja: 朝日村
    reading: あさひむら
    aliases: []
  user_terms:
  - 松本盆地の南にある村
  - 東筑摩郡の村
  - 朝日が一番先にあたる村
  naming_type: 新規命名
  prefecture: 長野県
  homonyms: []
  summary: 長野県東筑摩郡の村。松本盆地南部の西山麓の高地に位置する。1889年（明治22年）の町村制施行で小野沢・針尾・古見・西洗馬の4村の区域をもって発足し、以来合併を経験していない。村名は、この地域に朝日が一番先に当たることと、旭日のように輝かしく発展することへの祈念から付けられたと村公式資料が伝える。新潟県にも朝日村があったが2008年に村上市へ編入されて消滅し、現行の同名自治体はない。
  first_attestation:
    era: 明治22年
    year_western: 1889
    document: null
    note: 村名「朝日」は1889年の町村制施行に伴う命名そのものが初出。旧4村の名の継承ではない。
  claims:
  - text: 村名の由来について、朝日村公式の村勢要覧は「松本盆地南部の西山麓高地にあって、この村の地域が朝日が一番先にあたること、旭日のように輝かしく発展することを祈念してつけられたといわれている」と説明する
    kind: fact
    level: E2
    status: established
    sources:
    - x1-asahi-yoran
  - text: 1889年（明治22年）4月1日の町村制施行により、小野沢村・針尾村・古見村・西洗馬村の区域をもって朝日村が発足し、現在に至る
    kind: fact
    level: E5
    status: established
    sources:
    - x1-asahi-wiki
  - text: 朝日村の前身として、針尾・小野沢・古見・西洗馬の合併による山本村が明治7年（1874年）に発足したが、1884年（明治17年）に元の村々に分村した
    kind: fact
    level: E5
    status: established
    sources:
    - x1-asahi-wiki
  - text: 朝日村は平成元年（1989年）に開村100周年を迎えており、1889年の発足以来の村であることが村勢要覧の村木・村花制定の経緯から確認できる
    kind: fact
    level: E2
    status: established
    sources:
    - x1-asahi-yoran
  - text: 村章のデザインの円は「朝日（太陽）」を示すと村勢要覧が説明し、村名の意味がシンボルにも反映されている
    kind: fact
    level: E2
    status: established
    sources:
    - x1-asahi-yoran
  - text: 地方公共団体コードは204510である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 朝日が一番先に当たる村
    text: 松本盆地の南、西山麓の高地にある朝日村は、盆地に朝日が差すとき一番先に光が当たる場所だと村の要覧は説明する。夜明けの光と「旭日のように発展を」という願いが、1889年の命名に重ねられた。村はそれ以来一度も合併せず、全国に複数あった「朝日村」のうち現行自治体として残るのはこの村だけになった（新潟県の朝日村は2008年に村上市へ編入された）。朝日村公式「2017 朝日村村勢要覧」に基づく。
    sources:
    - x1-asahi-yoran
    - x1-asahi-wiki
  relations:
  - pref/20
  unknowns:
  - 山本村の発足年について、Wikipedia日本語版は「1875年（明治7年）10月25日」と元号と西暦が矛盾する表記をしており、発足の正確な日付は確認できていない（明治7年＝1874年であることは確か）
  - 命名を決めた主体（旧村側の協議か県の裁定か）を示す一次資料は確認できていない
  updated: '2026-11-13'
- id: muni/20-木島平村
