  prefecture: 北海道
  homonyms: []
  summary: 市名はアイヌ語の河川名「サッポロ」の継承で、新しく作られた名ではない。語源は「サッ・ポロ・ペッ（乾いた・大きな・川）」説と「サリ・ポロ・ペッ（その葦原が・広大な・川）」説が対立し、市の公式解説も両説を併記する。明治2年（1869年）に開拓使本府が置かれて都市ができ、大正11年（1922年）に札幌区から市制施行した。もとのサツホロは現在の都心ではなく、市北端の茨戸付近で石狩川に注ぐ川の合流点を指す地名だった。
  first_attestation:
    era: 寛文10年
    year_western: 1670
    document: 寛文拾年狄蜂起集書
    note: 仮名表記「さつほろ」としての最古級の記録として郷土史研究が挙げるもの。寛文9年（1669年）の津軽藩士の報告書『石狩地形の事』を最古とする資料もあり、初出の特定には幅がある
  claims:
  - text: 札幌市は公式解説で、語源としてアイヌ語の「サッ・ポロ・ペッ」（乾いた・大きな・川）とする説と「サリ・ポロ・ペッ」（その葦原が・広大な・川）とする説の2つを併記している
    kind: fact
    level: E2
    status: established
    sources:
    - a-cap-sapporo-city
  - text: 2説のどちらが語源かは確定しておらず、乾いた扇状地側を見るか下流の湿地側を見るかで解釈が分かれるため、札幌市自身も両説を並べて紹介している
    kind: fact
    level: E2
    status: contested
    sources:
    - a-cap-sapporo-city
  - text: 郷土史研究によれば、「さつほろ」の最も古い記録は寛文10年（1670年）の『寛文拾年狄蜂起集書』で、元禄13年（1700年）の『松前嶋郷帳』には「志やつほろ」とある
    kind: fact
    level: E4
    status: established
    sources:
    - a-cap-sapporo-teine
  - text: もとのサッポロ川は現在の豊平川に相当し、石狩川への合流点（サッポロブト）は現在の市北端・茨戸の下茨戸橋付近にあったと郷土史研究は特定する。地名の原点は今の都心ではなく市北端にある
    kind: fact
    level: E4
    status: established
    sources:
    - a-cap-sapporo-teine
  - text: 文化年間初め（1801年頃）の大洪水でサッポロ川の流路が大きく変わり、元の川はフシコサッポロ（古いサッポロ川）と呼ばれて明治初めに篠路川と改められ、流れを変えた川の方が豊平川と名付けられた、と郷土史研究は述べている
    kind: fact
    level: E4
    status: established
    sources:
    - a-cap-sapporo-teine
  - text: 明治2年（1869年）に開拓使が設置され、判官・島義勇のもとで札幌本府の建設が始まった。市名に選ばれたのは、この既存のアイヌ語地名である
    kind: fact
    level: E2
    status: established
    sources:
    - a-cap-sapporo-city
  - text: 大正11年（1922年）8月1日に札幌区が市制を施行して札幌市となり、昭和47年（1972年）に政令指定都市へ移行した
    kind: fact
    level: E2
    status: established
    sources:
    - a-cap-sapporo-city
  - text: 茨戸に住んでいたアイヌの能登酉雄の談話として、昔の大洪水のあと丸木舟で漕ぎ着いた土地が乾いて広い土地だったので「サッポロ」と呼ぶようになった、という話が伝えられている
    kind: legend
    level: E2
    status: established
    sources:
    - a-cap-sapporo-sugata
  column:
    title: 川が引っ越して、名前が都心に残った
    text: 「札幌」という名前はもともと川の名前で、その川口は今の市北端・茨戸にありました。ところが1801年頃の大洪水で川は流路を大きく変え、元の川は「フシコサッポロ（古いサッポロ川）」と呼ばれてやがて篠路川に改名され、新しい流れの方が豊平川になりました。一方、開拓使の本府が置かれたのは川の扇状地の上、現在の都心です。つまり名前の原点（茨戸）と、名前を受け継いだ都市の中心（大通周辺）は、市の中で10キロ以上離れていることになります。
    sources:
    - a-cap-sapporo-teine
    - a-cap-sapporo-city
  relations:
  - pref/01
  unknowns:
  - 語源2説（サッ・ポロ・ペッ／サリ・ポロ・ペッ）の決着（市公式も両論併記のまま）
  - 初出を『寛文拾年狄蜂起集書』（1670年）とするか『石狩地形の事』（1669年）とするか、資料により異なる
  - 漢字表記「札幌」がいつ・誰によって定着したかの一次確認は未実施
  updated: '2026-11-13'
- id: muni/01-松前町
  code: '013315'
  names:
    ja: 松前町
    reading: まつまえちょう
    aliases:
    - 福山町
    - 福山
  user_terms:
  - 松前町（北海道）の名前の由来
  - 福山という旧名の城下町
  - 松前藩の城下町はどこ
  naming_type: その他（城下町名「福山」から、地域名・藩名として知られた「松前」への改称）
  prefecture: 北海道
  homonyms:
  - muni/38-松前町
  summary: 江戸時代は松前藩の城下町・福山として蝦夷地の政治・経済の中心だった地で、明治33年（1900年）に福山町となり、昭和15年（1940年）に松前町と改称した。「松前」の語源については、町公式サイトがアイヌ語の「マツ・オマイ」「マト・マイ」（婦人の居るところ）によるという説を紹介する。愛媛県松前町とは同じ漢字だが、読み（まつまえ／まさき）も由来も全く異なる。
  first_attestation:
    era: 昭和15年
    year_western: 1940
    document: 町名改称（福山町から松前町へ）
    note: 町名としての「松前」の始まり。地域名・藩名としての「松前」は近世を通じて使われたが、地名としての文献上の初出の特定は本バッチでは未了
  claims:
  - text: 松前町公式サイトは、町名の由来として、古い表記「万堂宇満伊犬（まどうまいぬ）」を挙げ、アイヌ語の「マツ・オマイ」「マト・マイ」（婦人の居るところ）というところからきたという説を紹介している
    kind: fact
    level: E2
    status: established
    sources:
    - h1-matsumae-hokkaido-town
  - text: 全国観光資源台帳は、町名はアイヌ語のマツオマナイ（半島の意）、またはマツオマイ（婦人のいるところの意）からの転訛とされるとしており、アイヌ語語源の内部でも解釈が分かれている
    kind: fact
    level: E3
    status: contested
    sources:
    - h1-matsumae-jtb
  - text: 江戸時代、この地は松前藩の城下町であり、蝦夷地の政治・経済の中心であった
    kind: fact
    level: E3
    status: established
    sources:
    - h1-matsumae-jtb
  - text: 明治33年（1900年）に福山町となり、昭和15年（1940年）に松前町と改称した。昭和29年（1954年）には周辺3村を合併した
    kind: fact
    level: E3
    status: established
    sources:
    - h1-matsumae-jtb
  - text: 松前城はもともと福山城と名付けられたが、備後福山城と混同するので、松前城と呼ぶことも許されたと、北海道立図書館のレファレンス事例は北海道大百科事典を引いて紹介している
    kind: fact
    level: E2
    status: established
    sources:
    - h1-matsumae-crd
  - text: （異なる層）愛媛県松前町とは同じ漢字表記だが、読みが異なり（まつまえ／まさき）、由来も、アイヌ語地名と松前藩の系譜に連なる北海道側と、「正木」の改字という言い伝えに基づく愛媛側とで全く異なる
    kind: fact
    level: E3
    status: established
    sources:
    - h1-matsumae-jtb
    - h1-matsumae-ehime-yoran
  - text: アイヌ語の語源解釈として、この地名は先住民の住む地（蝦夷）に和人の女性も住むという珍しさを表したものだという言い伝えが、町公式サイトに紹介されている
    kind: legend
    level: E2
    status: established
    sources:
    - h1-matsumae-hokkaido-town
  column:
    title: もうひとつの福山との混同を避けて
    text: 松前城は、完成した安政元年（1854年）には福山城と名付けられました。ところが備後国（現在の広島県）にも福山城があったため混同のもとになり、「松前城」と呼ぶことも許されたと北海道立図書館のレファレンス事例は伝えています。城下の町も長く「福山」を名乗り、松前町になったのは昭和15年（1940年）のことです。奇しくも、その備後福山の近くには、備後国府に由来する広島県府中市があります。「福山違い」と「府中」が、北と西の地名の糸でつながっているわけです。
    sources:
    - h1-matsumae-crd
    - h1-matsumae-jtb
  relations:
  - pref/01
  - muni/38-松前町
  unknowns:
  - アイヌ語語源の確定（「婦人の居るところ」系の説と「半島」説が併存）
  - 昭和15年（1940年）に福山町から松前町へ改称した理由の一次確認は未了
  - 地名「松前」の文献上の初出（松前氏による改姓以前の用例の有無を含む）は未特定
  updated: '2026-11-13'
- id: muni/01-森町
  code: '013455'
  names:
    ja: 森町
    reading: もりまち
    aliases:
    - 森村
    - オニウシ
  user_terms:
  - 森町 北海道
  - もりまち 北海道
  - イカめしの森町
  - 北海道で唯一のまち
  naming_type: 一部の地名
  prefecture: 北海道
  homonyms:
  - muni/22-森町
  summary: 北海道渡島地方の町。古くアイヌ語でオニウシ（樹木の多くある所）と呼ばれた地に江戸時代の漁村「森」が生まれ、安政5年（1858）に鷲ノ木村から分立して森村が成立した。明治35年（1902）の合併を経て、大正10年（1921）の町制施行で森町となった。町は「北海道で唯一の『まち』」を掲げる。
  first_attestation:
    era: 安政5年
    year_western: 1858
    document: 鷲ノ木村からの分立による森村の成立
    note: 村名としての初出。地名としては江戸時代の漁村名に遡る
  claims:
  - text: この地は古くアイヌ語でオニウシ（樹木の多くある所）と呼ばれていた
    kind: fact
    level: E2
    status: established
    sources:
    - h2-mori-hok-tokei
  - text: 江戸時代に漁村が形成され、安政5年（1858）に森村と尾白内村が鷲ノ木村から分立して成立し、その後いったん鷲ノ木村に合体した時期を経て、慶応3年（1867）に改めて一村として独立した
    kind: fact
    level: E2
    status: established
    sources:
    - h2-mori-hok-tokei
  - text: 明治35年（1902）に周辺の村々との合併で新たな森村となり、大正10年（1921）に町制を施行して森町となった
    kind: fact
    level: E2
    status: established
    sources:
    - h2-mori-hok-tokei
  - text: 町は「北海道で唯一の『まち』（町＝まちと読む町）」をキャッチフレーズに掲げている
    kind: fact
    level: E2
    status: established
    sources:
    - h2-mori-hok-ayumi
  - text: 同名の比較（異なる層）：「森」はアイヌ語オニウシ（樹木の多い所）に対応する土地の姿を写した和名で、成立は江戸時代の漁村に遡る。中世の村名を継承する静岡県森町とは、同じ「森」でも時代の深さと成り立ちが異なる
    kind: fact
    level: E2
    status: established
    sources:
    - h2-mori-hok-tokei
    - h2-mori-shizuoka-yurai
  - text: 同名の比較（共通する層）：読みは静岡県森町と同じ「もりまち」である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: オニウシを「森」と書いた翻訳地名
    text: アイヌ語のオニウシは「樹木の多くある所」。和人はその意味をそのまま漢字に置き換えて「森」とした。音ではなく意味を訳した地名は、北海道では珍しくない。しかもこの町は、北海道の町で唯一「ちょう」ではなく「まち」と読むことを町の看板にしている。静岡県にも「もりまち」がある以上、正確には「道内で唯一」という話だが、その自負が町の個性になっている。
    sources:
    - h2-mori-hok-tokei
    - h2-mori-hok-ayumi
  relations:
  - pref/01
  - muni/22-森町
  unknowns:
  - 漁村名「森」が文献に現れる最初の年は未確認
  - アイヌ語オニウシと和名「森」の対応付けがいつ・誰によって行われたかは未確認
  updated: '2026-11-13'
- id: muni/01-池田町
  code: '016446'
  names:
    ja: 池田町
    reading: いけだちょう
    aliases:
    - 凋寒村
    - 川合村
    - 池田農場
  user_terms:
  - 池田町 北海道
  - 十勝の池田町
  - ワインの町 池田
  - 池田農場があった町
  naming_type: その他（人名に由来する命名）
  prefecture: 北海道
  homonyms:
  - muni/18-池田町
  - muni/20-池田町
  - muni/21-池田町
  summary: 北海道十勝地方の町。もとの地名はアイヌ語のセイ・オロ・サムに由来する凋寒（しぼさむ）で、明治29年（1896）に旧鳥取藩主家の当主・池田仲博が池田農場を開設したことから、農場名・駅名を経て大正15年（1926）の町制施行時に池田町となった。全国に4つある池田町のうち、唯一人名に由来する。
  first_attestation:
    era: 大正15年
    year_western: 1926
    document: 川合村の町制施行に伴う池田町への改称
    note: 「池田」の名自体は明治29年（1896）の池田農場、明治37年（1904）の池田駅に先行する
  claims:
  - text: この地はもとアイヌ語でセイ・オロ・サム（貝殻のある所）と呼ばれ、和人側では凋寒（しぼさむ）と表記された
    kind: fact
    level: E2
    status: established
    sources:
    - h2-ikeda-hok-gikai
  - text: 明治29年（1896）、旧鳥取藩主池田家の当主・池田仲博が池田農場を開設し、3年後の明治32年（1899）に一帯は池田農場直営となった
    kind: fact
    level: E2
    status: established
    sources:
    - h2-ikeda-hok-history
    - h2-ikeda-hok-gikai
  - text: 凋寒村は大正2年（1913）に、十勝川と利別川の合流点に位置することから川合村と改称された
    kind: fact
    level: E2
    status: established
    sources:
    - h2-ikeda-hok-gikai
  - text: 明治37年（1904）に十勝線（現・根室本線）の駅が池田農場内に開設され池田駅と名付けられ、大正15年（1926）の町制施行の際、川合村はこの駅名を町名として池田町となった
    kind: fact
    level: E3
    status: established
    sources:
    - h2-kotobank-ikedacho
    - h2-ikeda-hok-gikai
  - text: 同名の比較（異なる層）：4つの池田町のうち北海道池田町だけが人名（池田仲博）に由来し、福井県・岐阜県の池田荘、長野県の池田郷といった中世以来の地名の継承ではない
    kind: fact
    level: E2
    status: established
    sources:
    - h2-ikeda-hok-history
  - text: 同名の比較（異なる層）：読みは「いけだちょう」で、4つの池田町のうち「いけだまち」と読む長野県池田町とは読みが異なる
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 凶字を捨てて二度改名し、人名が町名になった
    text: 「凋寒（しぼさむ）」という村名は、冬の寒さに凋む姿を思わせ、移住者募集の妨げになるとして、まず川の合流点にちなむ「川合」に改められた。ところが最終的に選ばれたのは、開拓農場の主の姓だった。農場ができ、駅ができ、駅名が地域の顔になるうちに、「池田」は人名から地名へと転じた。池田町が現在「ワインの町」として知られるのも、この農場開拓以来の開墾の歴史の延長にある。
    sources:
    - h2-ikeda-hok-gikai
    - h2-ikeda-hok-history
  relations:
  - pref/01
  - muni/18-池田町
  - muni/20-池田町
  - muni/21-池田町
  unknowns:
  - 「凋寒」の当て字の選定経緯は未確認
  - 池田駅の命名手続きを示す一次記録は未確認
  updated: '2026-11-13'
- id: muni/01-清水町
  code: '016365'
  names:
    ja: 清水町
    reading: しみずちょう
    aliases:
    - 清水村
    - ペケレベツ
  user_terms:
  - 清水町 北海道
  - 十勝の清水町
  - 十勝清水
  - ペケレベツだった町
  naming_type: その他（アイヌ語地名の意訳による改称）
  prefecture: 北海道
  homonyms:
  - muni/22-清水町
  summary: 北海道十勝地方の町。「清水」はアイヌ語のペケレベツ（明るく清らかな川）の意訳で、駅名と行政名の不一致の不便を避けるため、昭和2年（1927）に清水村と改称され、昭和11年（1936）に町制施行した。駅のほうは1934年に十勝清水駅へ先に改称されており、現在は町自体も「十勝清水町」への改称が検討されている。
  first_attestation:
    era: 昭和2年
    year_western: 1927
    document: 清水村への改称（9月25日）
    note: 意訳の元になったアイヌ語地名ペケレベツは、明治32年（1899）の駅逓開設の頃の地名として用いられている
  claims:
  - text: 「清水」は、アイヌ語のペケレベツ（明るく清らかな川）の意訳である
    kind: fact
    level: E2
    status: established
    sources:
    - h2-shimizu-hok-history
  - text: 明治32年（1899）にペケレベツ駅逓が開設されたが、駅逓名と行政区画の名が一致しない不便があったため、昭和2年（1927）9月25日に清水村と改称され、昭和11年（1936）に町制を施行して清水町となった
    kind: fact
    level: E2
    status: established
    sources:
    - h2-shimizu-hok-history
  - text: 昭和31年（1956）に御影村が合併し、現在の町域の基礎ができた
    kind: fact
    level: E3
    status: established
    sources:
    - h2-kotobank-shimizu
  - text: 鉄道の駅は1934年（昭和9年）に清水駅から十勝清水駅へ改称されており、地名の区別のための「十勝」の冠称は駅名が先行した
    kind: fact
    level: E2
    status: established
    sources:
    - h2-shimizu-hok-history
  - text: 同名の比較（共通する層と異なる層）：静岡県清水町も「清水（清らかな水）」に由来する点は共通する。ただし北海道清水町はアイヌ語ペケレベツの意訳、静岡県清水町は柿田川の湧水そのものにちなむ和名であり、出発点が異なる
    kind: fact
    level: E2
    status: established
    sources:
    - h2-shimizu-hok-history
    - h2-kotobank-shimizu
  - text: 同名の比較（共通する層）：読みは静岡県清水町と同じ「しみずちょう」である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 駅が先に名乗った「十勝」、町も追うか
    text: 1934年、駅は混同を避けて「十勝清水駅」になった。ところが町の名は「清水町」のまま残り、時を経て今度は町自身が「十勝清水町」への改称を検討している。町の町民説明会資料によれば、道外の人の多くが清水町を知らず、静岡県の清水町（や旧清水市）と混同されるという調査結果が示された。アイヌ語を訳した由緒ある名を取るか、見つけてもらえる名を取るか——改称の是非は住民投票で決める方針とされる。
    sources:
    - h2-shimizu-hok-setsumei
    - h2-shimizu-hok-history
  relations:
  - pref/01
  - muni/22-清水町
  unknowns:
  - ペケレベツの語義について町公式は「明るく清らかな川」とするが、アイヌ語の語構成に基づく学術的な裏付けは未確認
  - 改称前（1927年以前）の自治体名と駅逓との行政上の関係の詳細は未確認
  updated: '2026-11-13'
- id: muni/02-南部町
  code: '024457'
  names:
    ja: 南部町
    reading: なんぶちょう
    aliases:
    - 南部村
  user_terms:
  - 南部町の名前の由来
  - 南部藩発祥の地はどこ
  - 南部氏はどこから来た
  naming_type: 合併新設
  prefecture: 青森県
  homonyms:
  - muni/19-南部町
  - muni/31-南部町
  summary: 町名は南部氏に由来する。甲斐国南部郷で「南部」を姓とした南部三郎光行が糠部郡を拝領してこの地に入ったことが町の説明する始まりで、2006年の合併では前身の旧南部町（1959年町制）の名が新町名に継がれた。山梨県南部町とは同じ南部氏を介して発祥地と移転先の関係にあり、鳥取県南部町の「南部」とは由来を異にする。
  first_attestation:
    era: 鎌倉時代（建久2年）
    year_western: 1191
    document: 南部三郎光行の糠部郡拝領と現在の南部町相内地区への入部（南部町の計画が紹介）
    note: 「南部」という名そのものは甲斐国南部郷に先行する。奥州側で「南部」が地名として定着するのは南部氏の入部以降であり、拝領を伝える一次文書の直接確認は未了
  claims:
  - text: 2006年1月1日、名川町・南部町・福地村の新設合併により発足した。新町名「南部町」は2004年12月24日の第4回合併協議会で決定された
    kind: fact
    level: E2
    status: established
    sources:
    - h3-aomori-pref-gappei
  - text: 町の計画は、町名の由来となった南部氏について、初代の南部三郎光行が軍功により糠部郡を拝領し、建久2年（1191年）に現在の南部町相内地区へ入部して翌年平良ヶ崎城を築いたと説明する
    kind: fact
    level: E2
    status: established
    sources:
    - h3-aomori-town-plan
  - text: 1955年4月20日に平良崎村と向村が合併して南部村となり、1959年に町制を施行して旧南部町となった。2006年の新町名はこの旧町名の継承である
    kind: fact
    level: E2
    status: established
    sources:
    - h3-aomori-town-plan
  - text: 町は、聖寿寺館を中心に三戸南部氏が糠部を治めた歴史を「南部藩発祥の地」として公式に紹介している
    kind: fact
    level: E2
    status: established
    sources:
    - h3-aomori-town-history
  - text: 山梨県南部町とは南部氏を介してつながる共通の層を持つ。光行が甲斐の南部を与えられて「南部」を姓としたのが山梨側であり、その一族が奥州へ移った先が青森側で、両町は発祥地と移転先の関係にある
    kind: fact
    level: E2
    status: established
    sources:
    - h3-yamanashi-yukari
    - h3-aomori-town-plan
  - text: 鳥取県南部町の「南部」は南部氏とは無関係に、古くから親しまれた地域名を合併時に採用したもので、本町の「南部」とは同字でも由来の系統が異なる
    kind: fact
    level: E2
    status: established
    sources:
    - h3-tottori-gikai
  - text: 総務省「地方公共団体コード一覧」では本町のコードは024457とされる
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 「発祥の地」は甲斐にも奥州にもある
    text: 南部氏の姓の発祥は甲斐の南部郷（山梨県南部町）ですが、氏が大名として根を下ろしたのは奥州の糠部で、青森県南部町は聖寿寺館のある地を「南部藩発祥の地」と位置づけています。同じ一族をめぐって「発祥の地」が2県に併存するのは、姓が生まれた場所と藩として発祥した場所が別だからです。
    sources:
    - h3-yamanashi-yukari
    - h3-aomori-town-history
  relations:
  - pref/02
  - muni/19-南部町
  - muni/31-南部町
  unknowns:
  - 「南部」の語が奥州側の地名として文書に現れる最古の用例
  - 建久2年（1191年）の入部を伝える一次史料の特定
  - 2006年の合併で旧町名を新町名とした選定理由の公式文
  updated: '2026-11-13'
- id: muni/02-青森市
  code: '022012'
  names:
    ja: 青森市
    reading: あおもりし
    aliases:
    - 青森町
  user_terms:
  - 青森市の名前の由来
  - 青森は港町の名前
  - 青森市はいつできた
  - 青森の丘の名前
  naming_type: 一部の地名
  prefecture: 青森県
  homonyms: []
  summary: 市名は江戸時代前期に弘前藩が開いた港町「青森」の継承である。青森市は、もと沿岸部に浜松が覆われた小高い丘が古くから「青森」と呼ばれていたことに由来すると説明し、県は船の目印になった青々とした森による命名を前面に出す。明治4年（1871年）に青森町が県庁所在地となり、明治31年（1898年）4月1日に市制施行した。
  first_attestation:
    era: 寛永2〜3年
    year_western: null
    document: 弘前藩の開港関係記録（連署奉書・黒印状）
    note: 港町の成立・命名の時期。県レコード（pref/02）と同様に1624〜1626年の異同があり単年に確定できない
  claims:
  - text: 青森市は、名の由来を「かつての沿岸部に浜松が覆われた小高い丘があり、そこが古くから『青森』と呼ばれていたことに由来するといわれている」と説明している。つまり藩が港町を名付ける前から、この一帯の小地名として「青森」があったとする説明である
    kind: fact
    level: E2
    status: established
    sources:
    - a-cap-aomori-city
  - text: 一方で青森県は、現在の青森市本町付近に青々と茂る森があり港に入る船の目印になっていたため「青森」と呼ばれるようになったと説明しており、命名の説明の力点は市と県で異なる
    kind: fact
    level: E2
    status: contested
    sources:
    - a-cap-aomori-city
    - a-aom-pref-qa
  - text: 寛永2年（1625年）、弘前藩2代藩主・津軽信枚は陸奥湾に面した現在の青森市中心部に新しい港町を作ることにし、寛永3年（1626年）4月6日に家臣の森山弥七郎へまちづくりを命じた、と青森市は述べている
    kind: fact
    level: E2
    status: established
    sources:
    - a-cap-aomori-city
  - text: 目印となった森は現在の青森市本町・県立郷土館周辺にあったとされ、港町の原点は現在の市中心部とほぼ重なる
    kind: fact
    level: E2
    status: established
    sources:
    - a-aom-pref-qa
  - text: 港町・青森は碁盤目状に作られ、その町割りは今と変わらないと青森市は述べている
    kind: fact
    level: E2
    status: established
    sources:
    - a-cap-aomori-city
  - text: 明治4年（1871年）に青森町は青森県の県庁所在地となり、明治31年（1898年）4月1日に青森町から青森市になった。市名は港町名の継承である
    kind: fact
    level: E2
    status: established
    sources:
    - a-cap-aomori-city
  column:
    title: 町が生まれる前からあった名前
    text: 青森市の説明で面白いのは、「青森」が藩の発明ではないことです。松の生えた小高い丘が、港町ができる前から土地の人々に「青森」と呼ばれていた――藩はその呼び名をそのまま新しい港町の名前に採用しました。小地名→港町→県庁所在地→県名と、「青森」は3段階も出世した名前ですが、その第一歩は役所の命名ではなく、土地の日常の呼び方だったことになります。
    sources:
    - a-cap-aomori-city
  relations:
  - pref/02
  unknowns:
  - 丘の小地名「青森」が開港以前の文書に現れるかの確認は未実施（市の説明は「古くから呼ばれていた」という伝聞の形）
  - 開港・命名の年（1624年・1625年・1626年の異同）の決着は県レコードと同じく未確定
  updated: '2026-11-13'
- id: muni/03-盛岡市
  code: 032018
  names:
    ja: 盛岡市
    reading: もりおかし
    aliases:
    - 不来方
    - 古志方
    - 森ヶ岡
    - 森岡
    - 盛岡町
  user_terms:
  - 盛岡の名前の由来
  - 不来方って何と読む
  - 盛岡は誰が名付けた
  - 森岡から盛岡になった理由
  naming_type: 新規命名
  prefecture: 岩手県
  homonyms: []
  summary: 市名は南部氏の城下町「盛岡」の継承である。この地の古名は「不来方（こずかた）」で、森ヶ岡・森岡を経て「盛岡」になったとされるが、改名の主体と時期は資料により異なる。岩手県の大事典は藩主・南部氏が「盛り上がり、栄える岡」の願いを込めて命名したとする一方、専門文献は2代藩主・利直が「森ヶ岡」と改め、元禄4年（1691年）に4代・重信の代で「盛岡」になったと伝える。明治22年（1889年）に全国39市の一つとして市制施行した。
  first_attestation:
    era: 慶長年間〜元禄4年
    year_western: null
    document: 城下町名としての「盛岡」（改称の主体・年は資料により異なる）
    note: 「盛岡」表記の成立年は、慶長年間に利直が改めたとする説と元禄4年（1691年）とする説が対立し、単年に確定できない
  claims:
  - text: 盛岡の古名は「不来方（こずかた）」「古志方」と呼ばれ、はじめ「森ヶ岡」、のちに「森岡」と呼ばれた、と岩手県の文化情報大事典は紹介している
    kind: fact
    level: E2
    status: established
    sources:
    - a-cap-morioka-bunka
  - text: 同大事典は、藩主・南部氏が「盛り上がり、栄える岡」という意味を込めて「盛岡」と命名したとする説を挙げ、別説として「杜の多い岡から転じた」とする説も併記している
    kind: fact
    level: E2
    status: contested
    sources:
    - a-cap-morioka-bunka
  - text: 専門文献（日本歴史地名大系系の解説）は、盛岡藩2代藩主・南部利直が不来方の用字を嫌い「森ヶ岡」と改称し、いつの頃からか「森岡」となり、4代藩主・重信の代の元禄4年（1691年）に「盛岡」と改められたと伝えられる、とする。改名が慶長年間の利直による一度の命名か、約100年かけての段階的変化かは資料により異なる
    kind: fact
    level: E3
    status: contested
    sources:
    - a-cap-morioka-kotobank
  - text: 旧名「不来方」は現在の盛岡城跡一帯を指す地名で、南部氏の本拠となる以前からこの地の呼び名だった
    kind: fact
    level: E3
    status: established
    sources:
    - a-cap-morioka-kotobank
  - text: 城下町は2代藩主・利直の時代に建設が大きく進み、その町割りは現在でも盛岡の中心市街地の基本的な骨格になっている、と盛岡市は説明している
    kind: fact
    level: E2
    status: established
    sources:
    - a-cap-morioka-city
  - text: 明治22年（1889年）の市町村制施行により、全国39都市の一つとして、人口2万9190人・面積4.47平方キロメートルの盛岡市が誕生した、と盛岡市は述べている
    kind: fact
    level: E2
    status: established
    sources:
    - a-cap-morioka-city
  column:
    title: 「盛岡」になるまで3回名前が変わった
    text: 不来方→森ヶ岡→森岡→盛岡。盛岡の名前は、約100年のあいだに少しずつ字を替えて今の形に近づいた可能性があります。「不来方（来ない方）」は城の名としては確かに縁起が悪く、「森」も「盛」に替わって、最後は「盛り上がり栄える岡」という願いを読み込める名前になりました。一度の命名で決まったのではなく、縁起の良い字へ少しずつ寄せていった跡――その過程自体が、この城下町の自己イメージの変化を物語っています（段階的変化とするのは専門文献の説に基づきます）。
    sources:
    - a-cap-morioka-bunka
    - a-cap-morioka-kotobank
  relations:
  - pref/03
  unknowns:
  - 改称の主体・年の決着（利直が慶長年間に「盛岡」と命名したとする説明と、元禄4年（1691年）に重信の代で盛岡となったとする専門文献の説が対立）
  - 古名「不来方（こずかた）」自体の語源は未確認
  - 「杜の多い岡」説の出典の所在は未確認
  updated: '2026-11-13'
- id: muni/04-仙台市
  code: 041009
  names:
    ja: 仙台市
    reading: せんだいし
    aliases:
    - 千代
    - 仙臺
    - 仙台町
  user_terms:
  - 仙台の名前の由来
  - 政宗が千代を仙台に変えた理由
  - 仙台は中国の詩から来た名前
  - 千代と仙台は読みが同じ
  naming_type: 新規命名
  prefecture: 宮城県
  homonyms: []
  summary: 市名は伊達政宗が慶長5年（1600年）に旧名「千代」を「仙台（仙臺）」と改めた命名の継承である。「千代」は、この地に祭られていた千体仏にちなむ「千体」の雅名とする説がよく知られ、「仙台」の字は唐の詩人・韓翃の詩句「仙臺初見五城樓」から採ったと考えられている。読み（せんだい）は変えず字だけを格上げした改名で、明治22年（1889年）に市制施行した。
  first_attestation:
    era: 慶長5年
    year_western: 1600
    document: 政宗による改称（仙台市公式年表に「千代を仙台と改め縄張りを行う」とある）
    note: 命名・改称そのものの年。旧名「千代」の文書上の初出は別途未確認
  claims:
  - text: 仙台市の公式年表は、慶長5年（1600年）に伊達政宗が「千代」を「仙台」と改め、仙台城の縄張りを行い、翌慶長6年（1601年）に普請を開始したとする
    kind: fact
    level: E2
    status: established
    sources:
    - a-cap-sendai-city
  - text: 改称後も読みは「せんだい」のままで、変わったのは漢字表記だけである
    kind: fact
    level: E2
    status: established
    sources:
    - a-cap-sendai-city
    - a-cap-sendai-lib
  - text: 仙台市民図書館のレファレンスによれば、もともとこの地に祭られていた千体仏にちなんで「千体」の字が当てられ、いつのころからかその雅名である「千代」の文字が使われるようになった、と『仙台事物起原考』は伝えている
    kind: fact
    level: E2
    status: established
    sources:
    - a-cap-sendai-lib
  - text: 「仙台」の字の由来は、中国の唐の詩人・韓翃（かんゆう）の七言律詩の起句「仙臺初見五城樓」から採ったものと考えられている、と同じレファレンスは紹介している
    kind: fact
    level: E2
    status: established
    sources:
    - a-cap-sendai-lib
  - text: 「千代（せんだい）」の語源にはこのほか、川に囲まれた山の手を「川内（かわうち）」と称したことから音読で「せんだい」と呼ばれて「千代」の字が生まれたとする説、アイヌ語の「sep-nay（広い川）」を語源とする説もあり、諸説が並立している
    kind: fact
    level: E2
    status: contested
    sources:
    - a-cap-sendai-lib
  - text: 明治22年（1889年）に市制を施行して仙台市が誕生し（当時の人口8万6352人）、平成元年（1989年）に東北初の政令指定都市となった、と仙台市は述べている
    kind: fact
    level: E2
    status: established
    sources:
    - a-cap-sendai-ayumi
  column:
    title: 詩の一節を、城下町の名前に
    text: 「仙臺」は唐の詩人・韓翃の詩に詠まれた、仙人の住むという高台の名です。政宗は読みを一切変えず、「千代」という日本の名前に中国の詩の字を当てはめました。音は土地のまま、字だけを天下に通用する教養の言葉に替える――読みを保ったまま漢字だけを格上げするこの手法は、岐阜（信長）や福島の改名とも通じる、戦国大名好みの命名術です。政宗の漢詩の素養が、そのまま都市の名前になっている例といえます。
    sources:
    - a-cap-sendai-lib
  relations:
  - pref/04
  unknowns:
  - 韓翃の詩句から採ったとする説の一次裏付け（政宗自身の文書での確認は未実施。『仙台事物起原考』を引く図書館レファレンス経由の情報）
  - 旧名「千代」の文書上の初出と、千体仏を祭った場所の特定は未確認
  - 「川内」説・アイヌ語説との優劣の決着
  updated: '2026-11-13'
- id: muni/04-川崎町
  code: 043249
  names:
    ja: 川崎町
    reading: かわさきまち
    aliases:
    - 川崎村
    - 川崎宿
  user_terms:
  - 川崎町の名前の由来
  - 宮城の川崎町はなぜ川崎
  - 笹谷街道の宿場町
  naming_type: その他
  prefecture: 宮城県
  homonyms:
  - muni/40-川崎町
  summary: 1889年の町村制施行で前川村・今宿村・小野村・川内村・本砂金村の5村が合併して生まれた新村名「川崎村」が前身。構成村のいずれも「川崎」ではなかった一方、前川村内には笹谷街道の中心宿駅「川崎宿」が先行して存在した。村名がこの宿場名に由来するかを含め、「川崎」の命名理由は確認した資料では明示されない。1948年に町制を施行して川崎町となった。
  first_attestation:
    era: 近世
    year_western: null
    document: 川崎宿（前川村内、笹谷街道の中心宿駅）として『日本歴史地名大系』に立項される地名
    note: 宿名の初出年と命名理由は未確認。自治体名としては1889年の川崎村が初出
  claims:
  - text: 明治22年（1889年）の町村制施行に際し、柴田郡の前川村・今宿村・小野村・川内村・本砂金村の5村が新設合併して川崎村となった。構成した5村のいずれも「川崎」という名ではなかった
    kind: fact
    level: E4
    status: established
    sources:
    - h3-kawasaki-m-uub
  - text: 『日本歴史地名大系』は、前川村に笹谷街道の中心宿駅である川崎宿があり、街道が仙台城下方面への道と奥州街道方面への道とに分岐する要地だったと紹介する
    kind: fact
    level: E3
    status: established
    sources:
    - h3-kawasaki-m-juku
  - text: 新村名「川崎」が先行する宿場名「川崎宿」に由来するかどうかは、確認した資料に明記がなく確定できない
    kind: fact
    level: E3
    status: indeterminate
    sources:
    - h3-kawasaki-m-juku
    - h3-kawasaki-m-uub
  - text: 昭和23年（1948年）5月3日に川崎村が町制を施行して川崎町となった。町の計画によれば、江戸時代に形成された前川村・今宿村・小野村・川内村・本砂金村・支倉村の6村が、明治22年の町村制施行と昭和30年（1955年）の合併を経て現在の町域となった
    kind: fact
    level: E2
    status: established
    sources:
    - h3-kawasaki-m-school
    - h3-kawasaki-m-townplan
  - text: 『日本歴史地名大系』は、町域は蔵王連峰北部の東麓にあたり、太郎川・北川・前川の三川が東流して東端で碁石川となり、仙台市域で名取川に合流すると記す
    kind: fact
    level: E3
    status: established
    sources:
    - h3-kawasaki-kotobank
  - text: 福岡県川崎町とは「川崎村」を前身とする点は共通する。ただし福岡では東川崎村・西川崎村という村名が先行したのに対し、宮城では構成村に「川崎」がなく宿場名が先行する点が異なる。両町とも「川崎」の語源そのものは未確認で、共通の命名理由は立証できない
    kind: fact
    level: E3
    status: established
    sources:
    - h3-kawasaki-f-hitahiko
    - h3-kawasaki-m-uub
    - h3-kawasaki-m-juku
  - text: 総務省「地方公共団体コード一覧」では本町のコードは043249とされる
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 村の名前にない「川崎」
    text: 1889年に合併した5つの村の名は、前川・今宿・小野・川内・本砂金。新村名の「川崎」はそのどれでもありませんでした。一方、地域の中心だったのは笹谷街道の宿場「川崎宿」（現在の前川地区）です。宿場の名が村名に選ばれた可能性は高いものの、理由を記した資料は見つかっておらず、この町の名前の謎として残ります。
    sources:
    - h3-kawasaki-m-juku
    - h3-kawasaki-m-uub
  relations:
  - pref/04
  - muni/40-川崎町
  unknowns:
  - 「川崎」という地名の語源（どの川の、どのような地形を指すのか）
  - 川崎宿の成立年と初出文書
  - 1889年に新村名として「川崎」を選んだ理由の記録
  updated: '2026-11-13'
- id: muni/04-美里町
  code: '045055'
  names:
    ja: 美里町
    reading: みさとまち
    aliases: []
  user_terms:
  - 美里町の名前の由来
  - 小牛田町と南郷町が合併した町
  - 遠田市にならなかった理由
  naming_type: 合併新設
  prefecture: 宮城県
  homonyms:
  - muni/11-美里町
  - muni/43-美里町
  summary: 2006年に小牛田町と南郷町の新設合併で生まれた新町名。当初は涌谷町を含む3町合併で新市名「遠田市」に決まっていたが、涌谷町の離脱で2町合併となり、名称も「美里町」に決め直された経緯がある。県の合併記録に命名理由は記されておらず、「美しい里」型の佳名として選ばれたかどうかは公式資料では確認できない。
  first_attestation:
    era: 平成18年
    year_western: 2006
    document: 自治体名としての「美里町」（小牛田町・南郷町合併協議会で確認）
    note: 合併前の両町域に「美里」という地名があったかどうかは未確認
  claims:
  - text: 当初の3町（小牛田町・涌谷町・南郷町）合併では、公募で集まった名称の中から小委員会が候補を絞り、2004年2月の第10回協議会の投票で新市名を「遠田市」と決定していたと宮城県の合併記録が伝える
    kind: fact
    level: E2
    status: established
    sources:
    - h3-miyagi-gappei-shosai
  - text: 涌谷町で2004年12月12日に行われた合併の是非を問う住民投票は反対54.9%となり、涌谷町は協議会を離脱して3町協議会は解散した
    kind: fact
    level: E2
    status: established
    sources:
    - h3-miyagi-gappei-shosai
  - text: 2町による合併協議会（2005年2月4日設立）の第5回協議会で新町の名称を「美里町」とすることなどが確認され、2006年1月1日に小牛田町・南郷町を廃して美里町が設置された
    kind: fact
    level: E2
    status: established
    sources:
    - h3-miyagi-gappei-ichiran
    - h3-miyagi-gappei-gaiyo
  - text: 県がまとめた新町の概要・合併記録には「美里」の選定理由が記されておらず、この名が「美しい里」を意味する佳名として選ばれたのか、旧地名等に由来するのかは、確認した公式資料では判明しない
    kind: fact
    level: E2
    status: indeterminate
    sources:
    - h3-miyagi-gappei-gaiyo
  - text: 埼玉県・熊本県の美里町と同様に合併で生まれた新名で、「美しい里」と読める字面を持つ点は共通する。しかし埼玉では公募・全世帯投票の経緯と理由の説明が、熊本では公募の理由文が公式に残るのに対し、宮城では理由文が確認できない点が異なる
    kind: fact
    level: E2
    status: established
    sources:
    - h3-saitama-mayor
    - h3-kumamoto-misato-pref
    - h3-miyagi-gappei-gaiyo
  - text: 総務省「地方公共団体コード一覧」では本町のコードは045055とされる
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 消えた「遠田市」と決め直された名前
    text: 美里町の名前は、最初から「美里」だったわけではありません。3町合併の段階では郡名にちなむ「遠田市」が新市名に決まっていました。涌谷町の住民投票で枠組みが崩れ、2町で仕切り直した協議会が改めて選んだのが「美里町」です。経緯の記録は県資料に詳しく残る一方、なぜ「美里」なのかという理由文は残っていません。
    sources:
    - h3-miyagi-gappei-shosai
    - h3-miyagi-gappei-ichiran
  relations:
  - pref/04
  - muni/11-美里町
  - muni/43-美里町
  unknowns:
  - 「美里」の具体的な選定理由（公募の有無・候補名・理由文）
  - 合併前の両町域に「美里」という字名・小地名があったか
  updated: '2026-11-13'
- id: muni/05-秋田市
  code: 052019
  names:
    ja: 秋田市
    reading: あきたし
    aliases:
    - 久保田町
    - 窪田
    - 秋田町
  user_terms:
  - 秋田市の名前の由来
  - 秋田市はもと久保田だった
  - 秋田城と秋田市は場所が違う
  - 久保田藩が秋田藩になった
  naming_type: 藩名
  prefecture: 秋田県
  homonyms: []
  summary: 市名は「秋田藩」への藩名改称を介して付けられた。城下町はもともと「窪田（くぼた）」と呼ばれた地に築かれた久保田で、明治4年（1871年）1月13日に久保田藩が秋田藩と改称されると城下町も秋田町となり、明治22年（1889年）に市制施行して秋田市となった。「秋田」自体は天平5年（733年）に秋田城が置かれた高清水岡（現在の秋田市寺内）以来の古い地名で、その原点は城下町（千秋公園周辺）とは市内で数キロずれる。
  first_attestation:
    era: 明治4年
    year_western: 1871
    document: 秋田市公式年表（秋田郡久保田町が明治4年1月13日に秋田町へ改称）
    note: 町名としての「秋田」の始まり。地名「秋田」そのものの初出（658年の「齶田」）は pref/05 のレコードに記録
  claims:
  - text: 秋田市の公式年表は、秋田郡久保田町が明治4年（1871年）1月13日に「秋田町」へ改称されたことを示している
    kind: fact
    level: E2
    status: established
    sources:
    - a-cap-akita-nenpyo
  - text: 秋田市は、明治4年の改称によって久保田から秋田となり県庁所在地となった、と市の広報は述べており、町名の変更は久保田藩から秋田藩への藩名改称と同年の動きである
    kind: fact
    level: E2
    status: established
    sources:
    - a-cap-akita-koho
    - a-cap-akita-nenpyo
  - text: 城下町は、佐竹義宣が国替えで移ってきた当時「窪田（くぼた）」と称した寒村に、慶長9年（1604年）に久保田城を築いて建設された、と市の広報は伝えている。つまり城下町の本来の名は「秋田」ではなく「窪田・久保田」だった
    kind: fact
    level: E2
    status: established
    sources:
    - a-cap-akita-koho
  - text: 「秋田」の名の起点は、天平5年（733年）に高清水の丘（現在の秋田市寺内）に置かれた出羽柵（のちの秋田城）であり、城下町のあった千秋公園周辺とは市内で数キロ離れている、と市の広報は述べている
    kind: fact
    level: E2
    status: established
    sources:
    - a-cap-akita-koho
  - text: 明治22年（1889年）の市制施行当時の秋田市は、人口約2万9000人、面積約6.9平方キロメートルだった、と市の広報は伝えている
    kind: fact
    level: E2
    status: established
    sources:
    - a-cap-akita-koho
  - text: その後、秋田市は町村合併を重ねて市域を広げ、平成9年（1997年）4月1日に中核市へ移行した、と市の広報は述べている
    kind: fact
    level: E2
    status: established
    sources:
    - a-cap-akita-koho
  column:
    title: 名前が北から引っ越してきた
    text: 秋田市の名前の動きは少し変わっています。「秋田」はもともと市の北側・寺内の秋田城の名前でした。城下町は南の窪田（久保田）に別にでき、260年以上「久保田」と呼ばれ続けます。ところが明治4年、藩の名前が「秋田藩」に変わると、町も一夜にして「秋田町」に。古代の城の名前が、藩名という形を経て、近代の市名として城下町に引っ越してきた――秋田市は、名前と町の原点が市の中でずれている代表例です。
    sources:
    - a-cap-akita-koho
    - a-cap-akita-nenpyo
  relations:
  - pref/05
  unknowns:
  - 藩名改称（久保田藩→秋田藩）の朝命の文書名と、町名変更が藩名改称と連動したことを示す一次文書の確認は未実施
  - 「窪田」から「久保田」への表記変更がいつ起きたかは未確認
  updated: '2026-11-13'
- id: muni/05-美郷町
  code: 054348
  names:
    ja: 美郷町
    reading: みさとちょう
    aliases: []
  user_terms:
  - 美郷町の名前の由来
  - 美郷町は合併でできた町
  - 奥羽町という候補があった町
  - 美郷町は秋田と島根と宮崎にある
  naming_type: 合併新設
  prefecture: 秋田県
  homonyms:
  - muni/32-美郷町
  - muni/45-美郷町
  summary: 平成16年（2004年）11月1日に千畑町・六郷町・仙南村の新設合併で誕生した新名。公募と合併協議会の選考を経て「奥羽町」と最後まで競い、「奥羽山脈の麓にあって、自然に恵まれ、暮らす人の心もさらに美しい故郷を目指したい」という願いを込めて全会一致で決まった。島根県・宮崎県の美郷町も平成の大合併の新名で「美しい故郷」の願いは共通するが、選定の過程と、願いを託した風景はそれぞれ異なる。
  first_attestation:
    era: 平成15年
    year_western: 2003
    document: 千畑町・六郷町・仙南村合併協議会における新町名称の決定（第9回合併協議会、2003年10月16日）
    note: 名称としての初出は合併協議会による決定。自治体としての発足は2004年11月1日
  claims:
  - text: 平成16年（2004年）11月1日、仙北郡の千畑町・六郷町・仙南村が新設合併して美郷町が誕生し、「平成の大合併」で秋田県内のトップを切った
    kind: fact
    level: E2
    status: established
    sources:
    - h4-akita-misato-ayumi
  - text: 新町の名称は公募で募り、応募数を公表しない方針のもとで合併協議会が選考した。第8回合併協議会で31の名称が選ばれ、現町村名を除いて再投票した結果、「美郷町」と「奥羽町」が上位となった
    kind: fact
    level: E2
    status: established
    sources:
    - h4-akita-gappei-kiroku
  - text: 第9回合併協議会において「奥羽山脈の麓にあって、自然に恵まれ、暮らす人の心もさらに美しい故郷を目指したいという願いを込めることのできる『美郷町』がふさわしい」として、話し合いにより全会一致で「美郷町（みさとちょう）」に決定した
    kind: fact
    level: E2
    status: established
    sources:
    - h4-akita-gappei-kiroku
  - text: 3町村は古くから産業・行政・交流などの面で密接なつながりがあり、地域への「共通の郷土意識」が培われてきたと町公式は説明する
    kind: fact
    level: E2
    status: established
    sources:
    - h4-akita-misato-ayumi
  - text: 【共通する層】島根県・宮崎県の美郷町も平成の大合併で生まれた新名であり、「美しい故郷（ふるさと）でありたい」という願いを名に込めた点は3町に共通する
    kind: fact
    level: E2
    status: established
    sources:
    - h4-shimane-misato-gaiyo
    - h4-akita-gappei-kiroku
  - text: 【異なる層】秋田の決定には、公募から投票で絞り込む手続きが記録として残り、「奥羽町」という対抗候補が最後まで残った点に特徴がある。願いを託した風景も、奥羽山脈の麓の仙北平野というこの土地固有のものである
    kind: fact
    level: E2
    status: established
    sources:
    - h4-akita-gappei-kiroku
  column:
    title: あと一歩で「奥羽町」だった
    text: 公募で集まった名前は31案まで絞られ、最後に残ったのは「美郷町」と「奥羽町」だった。どちらも奥羽山脈を背にする土地らしい名前だが、協議会が選んだのは、山の名そのものではなく「美しい故郷を目指す」という未来への願いを言葉にした方である。投票の傾きが違えば、秋田県には今も「奥羽町」があったことになる。
    sources:
    - h4-akita-gappei-kiroku
  relations:
  - pref/05
  - muni/32-美郷町
  - muni/45-美郷町
  unknowns:
  - 公募で寄せられ第8回合併協議会で選ばれた31案の全容は未確認
  - 旧3町村（千畑町・六郷町・仙南村）それぞれの地名の由来は本バッチの対象外で未確認
  updated: '2026-11-13'
- id: muni/06-小国町
  code: '064017'
  names:
    ja: 小国町
    reading: おぐにまち
    aliases:
    - 小国郷
    - 小国本村
  user_terms:
  - 小国町の名前の由来
  - 置賜小国と最上小国の違い
  - 小国郷とはどこ
  naming_type: その他
  prefecture: 山形県
  homonyms:
  - muni/43-小国町
  summary: 戦国期以降の文書に見える地域総称「小国」の継承。四方を山に囲まれた小国盆地一帯は中世以来「小国」「小国郷」と呼ばれ、1889年に小国本村・南小国村・北小国村・津川村へ再編、1942年に小国本村が町制を施行、1954年の合体合併で現在の小国町となった。熊本県小国町のような命名伝説は確認できず、地域総称としての用例が中心である。
  first_attestation:
    era: 戦国時代（天文7年）
    year_western: 1538
    document: 段銭古帳（「小国御太領」「おくに 上こほり山かた」）
    note: 『日本歴史地名大系』が紹介する用例で、原典は未読のため紹介として記録する
  claims:
  - text: 『日本歴史地名大系』は「小国」を戦国期以降に見える地名とし、中世には下長井のうち現在の小国町域の大部分を指し、近世にも小国盆地を中心とする地域の総称として広く用いられたと紹介する
    kind: fact
    level: E3
    status: established
    sources:
    - h3-oguni-y-kotobank
  - text: 同書は、天文7年（1538年）の段銭古帳に「小国御太領」「おくに 上こほり山かた」と見え、当地が伊達氏の直轄領と小国城主・上郡山氏の領地に分かれていたことを紹介する
    kind: fact
    level: E3
    status: established
    sources:
    - h3-oguni-y-kotobank
  - text: 町の計画は、当地が「古くから小国郷と呼ばれてきた」とし、四方を1000メートル級の山々に囲まれ他地域と隔絶した地形を「文字どおりの『小国』」を形づくるものと説明する
    kind: fact
    level: E2
    status: established
    sources:
    - h3-oguni-y-plan
  - text: 明治22年（1889年）に小国郷を構成した59か村が小国本村・南小国村・北小国村・津川村に再編され、昭和17年（1942年）に小国本村が町制を施行、昭和29年（1954年）に南小国村・北小国村と合体合併した
    kind: fact
    level: E2
    status: established
    sources:
    - h3-oguni-y-plan-r3
  - text: 熊本県小国町とは、山々に囲まれた盆地の郷名「小国」を継ぐ点で共通する。平凡社の地名コラムは、〈オグニ〉という名が山に囲まれた盆地状の地に広く付き、漢字では「小国」を宛てることが多いと指摘する。一方、熊本側には「国小なり」の言葉に由来するという伝説が公式に伝えられるが、山形側に固有の命名伝説は確認できない
    kind: fact
    level: E3
    status: established
    sources:
    - h3-oguni-jk
    - h3-oguni-k-town
  - text: 総務省「地方公共団体コード一覧」では本町のコードは064017とされる
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 置賜小国・最上小国・庄内小国
    text: 山形県内には「小国」と呼ばれる地域が複数あり、地元では最上郡や鶴岡市の小国と区別して、ここの小国を「置賜小国」と呼びます。山に囲まれた盆地ごとに同じ名が生まれるのは、〈オグニ〉が固有名詞というより地形を表す普通名詞に近い名だったからだと、地名コラムは説明します。
    sources:
    - h3-oguni-jk
  relations:
  - pref/06
  - muni/43-小国町
  unknowns:
  - なぜこの地が「小国」と呼ばれ始めたのかという命名理由そのもの
  - 段銭古帳の書誌・所蔵先の確認
  - 「小国郷」という呼称の初出
  updated: '2026-11-13'
- id: muni/06-山形市
  code: '062014'
  names:
    ja: 山形市
    reading: やまがたし
    aliases:
    - 山形町
    - 山方郷
  user_terms:
  - 山形市の名前の由来
  - 山形市はいつできた市
  - 山方郷と山形市
  - 最上と呼ばれた土地
  naming_type: 藩名
  prefecture: 山形県
  homonyms: []
  summary: 市名は山形藩の城下町名の継承である。地名の核は『和名類聚抄』に現在の山形市の南側を指すとされる「山方郷」で、「山方」の表記は南北朝時代に斯波兼頼がこの地を拠点としてから「山形」として文書に再び現れるようになった。明治9年（1876年）に現在の山形県が成立して県庁所在地となり、明治22年（1889年）に最初に市制が施行された31市の一つとなった。なぜ「山方」と呼ばれたかは県公式も不明とする。
  first_attestation:
    era: 承平年間
    year_western: null
    document: 和名類聚抄
    note: 「山方郷」としての記載。県レコード（pref/06）と共通の起点で、『和名類聚抄』の成立年代（931〜938年頃）から単年は置かない
  claims:
  - text: 山形県は、山形の名は平安時代の『和名類聚抄』に今の山形市の南側を「山方郷」と記したことに由来があると言われている、と説明している
    kind: fact
    level: E2
    status: established
    sources:
    - a-yam-pref
  - text: なぜこの地を山方と言ったかは不明であると、山形県の公式解説は明言している。「山の方にある土地」という単純な地形呼称とする見方も、定説としては確認できない
    kind: fact
    level: E2
    status: indeterminate
    sources:
    - a-yam-pref
  - text: 「山方」の地名はいったん資料から見えなくなり、南北朝時代に斯波兼頼がこの地を政治の拠点として安定させると、土地売買の文書などに「山形」の表記が改めて現れるようになった、と山形県は述べている
    kind: fact
    level: E2
    status: established
    sources:
    - a-yam-pref
  - text: 山形市は、延文元年（1356年）に羽州探題として入部した斯波兼頼がこの地に城を築き城下町を整えて発展の礎を置き、のちに最上義光の時代に飛躍した、と市の沿革で説明している
    kind: fact
    level: E2
    status: established
    sources:
    - a-cap-yamagata-city
  - text: 明治維新によって山形には統一された山形県の県庁が置かれ、明治22年（1889年）4月1日に大阪市や横浜市などとともに日本で最初に市制が施行された31市のうちの1市として市制を施行した（当時の人口2万8400人）、と山形市は述べている
    kind: fact
    level: E2
    status: established
    sources:
    - a-cap-yamagata-city
  - text: 山形市は、かつてこの一帯が「最上（もがみ）」と呼ばれていたことも市の沿革で紹介している。地方の名（最上）と都市の名（山方・山形）は、別の系統の呼び名として併存していた
    kind: fact
    level: E2
    status: established
    sources:
    - a-cap-yamagata-city
  column:
    title: 「最上」と呼ばれた土地の、もう一つの名前
    text: 山形市の沿革は「山形は、古くは最上と呼ばれていた」と書き出します。川と地方を指す「最上」に対し、「山方」は今の市街の南あたりを指す、より小さな地名でした。平安時代の辞書に載ったきり姿を消していた「山方」が、南北朝時代に城下町とともに「山形」と字を替えて戻ってくる――消えかけた小さな地名が、城下町・藩・県・市と大きくなるにつれて地方全体の名前になったのが山形です。
    sources:
    - a-cap-yamagata-city
    - a-yam-pref
  relations:
  - pref/06
  unknowns:
  - 「山方」と呼ばれた理由の確定（県公式も不明と明言）
  - 市名が藩名の継承か城下町名の継承かの厳密な選定経緯（県レコードと同じ未確認事項で、1871年の山形県設置時の命名理由の一次文書は未確認）
  - 「山方」から「山形」への表記変更が起きた具体的な文書・年は未確認
  updated: '2026-11-13'
- id: muni/06-川西町
  code: 063827
  names:
    ja: 川西町
    reading: かわにしまち
    aliases: []
  user_terms:
  - 川西町の名前の由来
  - 山形の川西町は最上川の西
  - 川西町は山形と奈良にある
  naming_type: 合併新設
  prefecture: 山形県
  homonyms:
  - muni/29-川西町
  summary: 昭和30年（1955年）に小松町・大塚村・犬川村・中郡村・玉庭村・吉島村の1町5村が合併して成立した。町公式は「最上川の西側に位置することから、川西町と名づけられました」と由来を明示しており、大きな川に対する方位で土地を示す、明快な位置地名である。奈良県川西町は命名理由が確認できておらず、同名でも由来の確かさが対照的である。
  first_attestation:
    era: 昭和30年
    year_western: 1955
    document: 川西町の成立（1955年の合併。川西町公式「川西町の概要」）
    note: 自治体としての「川西町」の初出。旧町村名の継承ではなく合併に際しての新名
  claims:
  - text: 川西町は昭和30年（1955年）に小松町・大塚村・犬川村・中郡村・玉庭村・吉島村の1町5村が合併して誕生した町である
    kind: fact
    level: E2
    status: established
    sources:
    - h4-yamagata-kawanishi-gaiyo
  - text: 町公式は「最上川の西側に位置することから、川西町と名づけられました」と明記しており、町名が最上川に対する位置（西側）に由来することが公式に確定している
    kind: fact
    level: E2
    status: established
    sources:
    - h4-yamagata-kawanishi-gaiyo
  - text: 「川西町」という名は、合併した旧町村のいずれの名でもなく、1955年の合併に際して土地の位置から新しく付けられた名である
    kind: fact
    level: E2
    status: established
    sources:
    - h4-yamagata-kawanishi-gaiyo
  - text: 【共通する層】奈良県川西町も「川西」という同じ構成の名を持ち、両町とも大きな川を持つ土地の町である。ただし由来の型が同じかどうかは、奈良側の裏付けが得られてから判断する
    kind: fact
    level: E2
    status: established
    sources:
    - h4-yamagata-kawanishi-gaiyo
    - h4-nara-kawanishi-gaiyo
  - text: 【異なる層】奈良県川西町については、町公式資料に村名・町名の由来の明示がなく、「川西」がどの川の西を指すのかも確認できていない。山形側の明快な位置由来とは対照的である
    kind: fact
    level: E2
    status: established
    sources:
    - h4-nara-kawanishi-rekishi
    - h4-yamagata-kawanishi-gaiyo
  column:
    title: 名刺のような町名
    text: 「最上川の西側だから川西町」。由来の説明が一行で終わる町名は、地図を開けば誰でも納得できる。1955年の合併で生まれた新しい町に、旧町村のどれかの名ではなく、土地の位置そのものを名乗らせる。対等な合併の名付けとして、分かりやすい選択だった。
    sources:
    - h4-yamagata-kawanishi-gaiyo
  relations:
  - pref/06
  - muni/29-川西町
  unknowns:
  - 合併協議における町名の選定過程（他の候補名の有無）は未確認
  - 「川西」という地域の呼称が1955年の合併以前からあったかどうかは未確認
  updated: '2026-11-13'
- id: muni/06-朝日町
  code: '063231'
  names:
    ja: 朝日町
    reading: あさひまち
    aliases: []
  user_terms:
  - 朝日町の名前の由来
  - 山形の朝日町は大朝日岳のふもと
  - 朝日町は山形と富山と三重にある
  naming_type: 合併新設
  prefecture: 山形県
  homonyms:
  - muni/16-朝日町
  - muni/24-朝日町
  summary: 昭和29年（1954年）11月1日に宮宿町・西五百川村・大谷村が合併して誕生した。町は磐梯朝日国立公園の主峰・大朝日岳の東部山麓に位置し、奈良時代には朝日岳への山岳信仰の隆盛とともに集落が発達したと町議会概要は述べる。ただし町名が大朝日岳に由来すると明示した町の公表資料は今回の調査では確認できず、「名峰朝日岳にちなんで」と公式に明記する富山県朝日町とは事情が異なる。
  first_attestation:
    era: 昭和29年
    year_western: 1954
    document: 朝日町の成立（1954年11月1日の合併。朝日町議会概要「歴史と文化」）
    note: 自治体としての「朝日町」の初出。それ以前の地域名・山名としての「朝日」の用例の特定は未確認
  claims:
  - text: 昭和29年（1954年）11月1日、宮宿町・西五百川村・大谷村の1町2村が合併して朝日町となった。宮宿町は、もとの東五百川村が昭和3年（1928年）に町制を施行したものである
    kind: fact
    level: E2
    status: established
    sources:
    - h4-yamagata-asahi-gikai
  - text: 町は磐梯朝日国立公園の主峰大朝日岳の東部山麓地域に位置し、町の中心部を最上川が約21kmにわたって南北に流れ、面積の76%ほどが山林で占められている
    kind: fact
    level: E2
    status: established
    sources:
    - h4-yamagata-asahi-gikai
  - text: 町議会概要は、奈良時代に入ると朝日岳などの山岳信仰の隆盛とともに集落が発達したと述べており、「朝日」の名は山岳信仰の対象としての朝日岳の名として、この地域に古くから結びついていた
    kind: fact
    level: E2
    status: established
    sources:
    - h4-yamagata-asahi-gikai
  - text: 町名「朝日」が大朝日岳・朝日連峰に由来するかは地理的には自然な見方だが、町の公式サイト・議会概要に命名理由の明示はなく、今回の調査では断定できる資料が得られなかった
    kind: fact
    level: E2
    status: indeterminate
    sources:
    - h4-yamagata-asahi-gikai
  - text: 【異なる層】富山県朝日町は町公式が「名峰朝日岳にちなんで『朝日町』と名付けられ」と命名由来を明示しているのに対し、山形県朝日町には同様の明示が確認できない。三重県朝日町は山ではなく天武天皇の故事にあやかった命名であり、3町の「朝日」は由来の型も確かさもそれぞれ異なる
    kind: fact
    level: E2
    status: established
    sources:
    - h4-toyama-asahi-gaiyo
    - h4-mie-asahi-aramashi
  - text: 【共通する層】3町とも「朝日」を名に持ち、このうち山形・富山の2町はともに「朝日岳」と呼ばれる山を擁する山麓の町という地理的な共通点を持つ
    kind: fact
    level: E2
    status: established
    sources:
    - h4-yamagata-asahi-gikai
    - h4-toyama-asahi-gaiyo
  column:
    title: 由来の説明がない「朝日」
    text: 富山県朝日町は「朝日岳にちなんで」とはっきり書くのに、山形の朝日町は公式資料のどこにも命名理由を書いていない。大朝日岳の麓という立地から「山の名をもらったのだろう」と思いたくなるが、記録がない以上、このKBはそう書かない。地名の由来調査では、この「言いたくなる一言」を我慢できるかどうかが正確さの分かれ目になる。
    sources:
    - h4-yamagata-asahi-gikai
    - h4-toyama-asahi-gaiyo
  relations:
  - pref/06
  - muni/16-朝日町
  - muni/24-朝日町
  unknowns:
  - 1954年の合併時における町名選定理由を記した資料（合併協議の記録・町史）は未確認
  - 地域の古い呼称「五百川郷」と町名「朝日」との関係は未確認
  updated: '2026-11-13'
- id: muni/06-金山町
  code: '063614'
  names:
    ja: 金山町
    reading: かねやままち
    aliases:
    - 金山村
  user_terms:
  - 金山町の名前の由来
  - 山形の金山町は宿場町だった
  - 金山町は山形と福島にある
  naming_type: その他
  prefecture: 山形県
  homonyms:
  - muni/07-金山町
  summary: 明治22年（1889年）に成立した金山村が大正14年（1925年）1月に町制を施行して以来、合併を経験していない町。中心集落の金山は近世、金山内町・金山七日町・金山十日町の「金山三ヵ村」で羽州街道の宿場町「金山町」を形成していた。地名の由来についてブリタニカ国際大百科事典は「金銀の鉱山が多かったことに由来するといわれる」と伝えるが、断定できる資料は確認できていない。中世以来の広域名「金山谷」を背景に持つ福島県の金山町とは成り立ちが異なる。
  first_attestation:
    era: 明治22年
    year_western: 1889
    document: 金山村の成立（町村制施行）
    note: 自治体名としての初出。集落名としての「金山」は近世の郷帳類に「金山三ヵ村」として見えるが、用例の年次の特定は未確認
  claims:
  - text: 金山町は大正14年（1925年）1月に町制を施行した。町公式年表はこの町制施行を起点に現在まで続いており、明治22年（1889年）の金山村成立以来、合併による自治体の再編は行われていない
    kind: fact
    level: E2
    status: established
    sources:
    - h4-yamagata-kaneyama-ayumi
  - text: 日本歴史地名大系によれば、近世には金山内町・金山七日町・金山十日町の3村が「金山三ヵ村」と通称され、羽州街道の宿場町を形成して「金山町」と呼ばれ、金山郷の交通・商業の中心地だった
    kind: fact
    level: E3
    status: established
    sources:
    - h4-kotobank-kaneyama
  - text: ブリタニカ国際大百科事典小項目事典は「地名は金銀の鉱山が多かったことに由来するといわれる」とし、町の西部に谷口銀山の名残りがあることを併記する。ただし由来そのものは「といわれる」の形で伝えられるにとどまり、断定する資料は確認できていない
    kind: fact
    level: E3
    status: indeterminate
    sources:
    - h4-kotobank-kaneyama
  - text: 【異なる層】福島県金山町の「金山」は中世以来の広域地域名「金山谷」に由来する層が濃いのに対し、山形県金山町の「金山」は宿場町として栄えた中心集落の名がそのまま自治体名になったもので、同名でも成り立ちが異なる
    kind: fact
    level: E3
    status: established
    sources:
    - h4-kotobank-kaneyamadani
    - h4-kotobank-kaneyama
  - text: 【共通する層】両町の名の核は近世以前からの地域の呼称にさかのぼり、昭和の大合併で新しく作られた名ではない点は共通する
    kind: fact
    level: E3
    status: established
    sources:
    - h4-kotobank-kaneyama
    - h4-fukushima-kaneyama-profile
  column:
    title: 宿場町の名前がそのまま残った町
    text: 江戸時代、金山の集落は内町・七日町・十日町という3つの町からなる宿場町で、市場が立つ商業の中心だった。1889年に村になり、1925年に町になってからも名前は変わらず、昭和・平成の合併の波もこの町は単独で越えた。自治体の名前が江戸時代の宿場町の呼び名と地続きなのは、全国でもそう多くない。
    sources:
    - h4-kotobank-kaneyama
    - h4-yamagata-kaneyama-ayumi
  relations:
  - pref/06
  - muni/07-金山町
  unknowns:
  - 「金銀の鉱山が多かった」ことを示す具体的な鉱山の記録（谷口銀山の操業実態を含む一次資料）は未確認
  - 1889年の金山村成立当時の構成村の確認は未実施
  updated: '2026-11-13'
- id: muni/07-伊達市
  code: '072133'
  names:
    ja: 伊達市
    reading: だてし
    aliases:
    - 伊達町
    - 伊達郡
  user_terms:
  - 福島の伊達市の名前の由来
  - 伊達郡とは何か
  - 伊達市が2つあるのはなぜ
  naming_type: 合併新設
  prefecture: 福島県
  homonyms:
  - muni/01-伊達市
  summary: 平成18年（2006年）1月1日、伊達郡の伊達町・梁川町・保原町・霊山町・月舘町の5町が合併して誕生した市で、市名は5町が所属していた旧伊達郡の郡名を継承した。伊達郡は文治5年（1189年）に伊達朝宗（常陸入道念西）が恩賞として与えられ、この地に移って伊達氏を名乗った土地であり、仙台藩伊達氏の名字の発祥地である。北海道伊達市とは同名だが、こちらは中世以来の地名の継承であり、移住者の姓にちなんだ北海道側とは経路が異なる。それでも両市は、同じ伊達氏の系譜という点で結びついている。
  first_attestation:
    era: 文治5年
    year_western: 1189
    document: 奥州合戦後の論功行賞による伊達郡の給与
    note: 日本歴史地名大系ジャーナルが国史大辞典等を引いて紹介する、伊達朝宗が伊達郡を与えられ伊達氏を名乗った画期。郡名「伊達」自体はこれ以前から存在したが、その初出文書の特定は本バッチでは未了
  claims:
  - text: 市名は、合併した5町が所属していた旧伊達郡の郡名を継承したものである
    kind: fact
    level: E3
    status: established
    sources:
    - h1-jk-chimei-62
  - text: 旧陸奥国伊達郡は文治5年（1189年）の奥州合戦の後、戦功をあげた常陸入道念西に恩賞として与えられ、念西はこの地に移って伊達氏を名乗った。これが仙台藩伊達氏の始祖・伊達朝宗であると、日本歴史地名大系ジャーナルは国史大辞典・日本歴史地名大系を引いて紹介している
    kind: fact
    level: E3
    status: established
    sources:
    - h1-jk-chimei-62
  - text: 伊達市公式の子ども向け解説も、伊達朝宗が信夫郡と伊達郡を治めるようになったことが「伊達市」の名前のルーツであると説明している
    kind: fact
    level: E2
    status: established
    sources:
    - h1-date-fukushima-kids
  - text: 平成18年（2006年）1月1日、伊達郡に属していた伊達・梁川・保原・霊山・月舘の5町が合併して市制を施行し、伊達市が誕生した
    kind: fact
    level: E3
    status: established
    sources:
    - h1-jk-chimei-62
  - text: （異なる層）北海道伊達市（1972年市制）とは同名だが、福島側は郡名に由来する中世以来の地名の継承であり、明治の移住者の姓にちなんで命名された北海道側とは由来の経路が異なる
    kind: fact
    level: E3
    status: established
    sources:
    - h1-jk-chimei-62
  - text: （名称決定の経緯）新市名については、従来は既存の市と同一・類似の名称を避けるとされていたため公募から「伊達市」は当初除外されたが、「伊達市」の名称を望む住民の声が多かったことや総務省が柔軟な姿勢を示したことなどから、最終的に「伊達市」に決定したと市公式ページは説明している
    kind: fact
    level: E2
    status: established
    sources:
    - h1-date-fukushima-name
  - text: （共通する層）北海道伊達市の由来である亘理伊達家は伊達氏の一門であり、その名字の起源はこの伊達郡にあるため、宗家の始祖の地である福島側が同名の使用を打診した相手は、遠縁の分家筋の市であった
    kind: fact
    level: E3
    status: established
    sources:
    - h1-jk-chimei-62
  - text: 伊達朝宗が居館を構えたのは、現在の市役所の西方にある「高子岡」の地であるという言い伝えがある
    kind: legend
    level: E3
    status: established
    sources:
    - h1-jk-chimei-62
  column:
    title: 一度は候補から外された名前
    text: 2006年の合併当初、新市名の本命は郡名を継ぐ「伊達市」でした。ところが「既存市と同一の市名は避ける」という長年の指導のため、公募では「伊達市」が除外され、「だて市」「あぶくま市」などの候補が並びます。その間に総務省の姿勢が軟化し、合併協議会は北海道伊達市の意向も確認。最終的には、まず「だて市」を選び、そこから表記を「伊達市」に改める追加議案を可決するという迂回路で、望みどおりの名前が実現しました。日本歴史地名大系ジャーナルはこの経緯を「かなりアクロバティックな手段」と評しています。
    sources:
    - h1-jk-chimei-62
    - h1-date-fukushima-name
  relations:
  - pref/07
  - muni/01-伊達市
  unknowns:
  - 伊達郡の名そのものの初出（古代の郡の設置時期や和名類聚抄での確認）は未了
  - 高子岡の朝宗居館伝承の考古学的な裏づけは未確認
  - 合併協議会での名称決定の詳細な議事（市公式は協議会だより・議事録への参照を示すが、本バッチでは未読）
  updated: '2026-11-13'
- id: muni/07-昭和村
  code: '074462'
  names:
    ja: 昭和村
    reading: しょうわむら
    aliases:
    - 野尻村
    - 大芦村
  user_terms:
  - 福島の昭和村の由来
  - 昭和村はなぜ昭和という名前か
  - 昭和にできた村 昭和村
  naming_type: 合併新設
  prefecture: 福島県
  homonyms:
  - muni/10-昭和村
  summary: 大沼郡の村で、1927（昭和2）年11月23日に野尻村と大芦村の合併で誕生した。昭和の大合併期（1953〜61年）ではなく、改元の翌年に「昭和時代に入って誕生した村」として元号そのものを村名にした、年号あやかり命名の村である。同名の群馬県昭和村は1958年の合併成立で、成立が31年違い、命名の文脈も異なる。
  first_attestation:
    era: 昭和2年
    year_western: 1927
    document: 昭和村の発足（野尻村・大芦村の合併）
    note: 元号「昭和」を村名そのものとした命名が初出。大正から昭和への改元（1926年12月）の約1年後に生まれた村である
  claims:
  - text: 1927年（昭和2年）11月23日に野尻村と大芦村が合併し、昭和村となった
    kind: fact
    level: E2
    status: established
    sources:
    - h5-showa-fk-soka
  - text: 村名は、昭和時代に入って誕生した村であることから、昭和村という名前になったといわれている
    kind: fact
    level: E2
    status: established
    sources:
    - h5-showa-fk-soka
  - text: 村の第6次振興計画も、1927（昭和2）年に野尻村と大芦村が合併して誕生し、2017（平成29）年に90周年を迎えた村であると記す
    kind: fact
    level: E2
    status: established
    sources:
    - h5-showa-fk-plan
  - text: 1889年（明治22年）の町村制では、旧野尻組の13か村が大芦村と野尻村の2村に分かれており、昭和村はこの2村の合併で生まれた
    kind: fact
    level: E4
    status: established
    sources:
    - h5-showa-fk-kanko
  - text: 『日本歴史地名大系』は、村域が野尻川の流域に広がり、近世の野尻は沼田街道の宿駅であったこと、からむし織の原料生産が村の生業の核であったことを記す
    kind: fact
    level: E3
    status: established
    sources:
    - h5-showa-kotobank
  - text: 異なる層として、同名の群馬県昭和村は昭和33年（1958）11月1日の合併で誕生しており、福島の昭和村とは成立が31年違いである。福島が改元直後に元号へあやかった命名なのに対し、群馬は昭和の大合併期の成立で、同じ「昭和」でも生まれた文脈が異なる
    kind: fact
    level: E2
    status: established
    sources:
    - h5-showa-gunma-plan
  - text: 共通する層として、両村とも合併で旧村名を継承せず、元号と同字の新名「昭和」を採った村である
    kind: fact
    level: E2
    status: established
    sources:
    - h5-showa-fk-soka
    - h5-showa-gunma-plan
  - text: 総務省の全国地方公共団体コードで、昭和村の団体コードは074462と定められている
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 「令和なのに、昭和。」1927年生まれの村はもうすぐ100歳
    text: 村の観光協会のキャッチコピーは「令和なのに、昭和。」です。村名の「昭和」は単なる懐かしさの記号ではなく、この村が1927年、元号が昭和に改まった翌年に、時代の名前そのものを名乗って生まれたことの証しです。2027年には村の誕生から100年を迎えます。一方で村の暮らしは、苧麻（からむし）を育てて織物の原料を出荷する古い生業が核にあり、名前の新しさと生業の古さの対比が、この村の地名の面白さです。
    sources:
    - h5-showa-fk-kanko
    - h5-showa-fk-plan
    - h5-showa-kotobank
  relations:
  - pref/07
  - muni/10-昭和村
  unknowns:
  - 「昭和村」という村名の発案者や、合併当時の村議会・町村合併記録など命名の一次記録の所在は未確認
  - 姉妹都市・草加市の説明は「いわれています」という伝聞の形であり、村史における命名理由の公式記述の直接確認は未了
  updated: '2026-11-13'
- id: muni/07-福島市
  code: '072010'
  names:
    ja: 福島市
    reading: ふくしまし
    aliases:
    - 福島町
    - 杉目郷
  user_terms:
  - 福島市の名前の由来
  - 福島市はなぜ市制が遅かった
  - 福島城と福島市
  - 吹島の伝説と福島市
  naming_type: 藩名
  prefecture: 福島県
  homonyms: []
  summary: 市名は福島城とその城下町・福島町の名の継承である。「福島」は文禄2年（1593年）頃に木村吉清が杉目城を福島城と改めたのが始まりとされ、改名の主体には蒲生氏郷とする伝承も併存する。福島町は明治40年（1907年）に全国59番目の市として市制施行した。県庁所在地としては市制施行が遅い方で、城の改名から市になるまで300年以上を「町」として過ごした。
  first_attestation:
    era: 文禄2年頃
    year_western: 1593
    document: 福島城への改称（『福島県史』『図説福島市史』が伝える）
    note: 県レコード（pref/07）と共通の起点。年は「頃」付きで、文禄元年（1592年）説も併存する
  claims:
  - text: 「福島」の名は文禄2年（1593年）頃、木村吉清によって福島城として使われたのが初めてだといわれている、と福島県は『福島県史』『図説福島市史』を引いて説明している
    kind: fact
    level: E2
    status: established
    sources:
    - a-fuk-pref
    - a-fuk-city
  - text: 木村吉清は大森城から杉目城へ居城と城下の機能を移し、杉目城を福島城と改名したと、福島市は説明している
    kind: fact
    level: E2
    status: established
    sources:
    - a-fuk-city
  - text: 改称年については文禄元年（1592年）とする説もあり、福島市は文禄2年頃を本説としつつ元年説を併記している
    kind: fact
    level: E2
    status: contested
    sources:
    - a-fuk-city
  - text: 改名の主体については、蒲生氏郷が本拠の黒川を若松に改めたのにならい、支城の杉目を縁起の良い「福島」に改めたと伝える資料もあり、木村吉清が改めたとする説明と伝承が併存する
    kind: fact
    level: E2
    status: contested
    sources:
    - a-fuk-pref
    - a-fuk-city
  - text: 福島の中心街一帯はかつて信夫の里の杉目郷と呼ばれ、応永20年（1413年）頃に伊達持宗が杉目城（大仏城）を築いたことが町になる転機となった、と福島県は説明している
    kind: fact
    level: E2
    status: established
    sources:
    - a-fuk-pref
  - text: 福島市は、明治40年（1907年）に全国で59番目の市制を施行し、人口3万人余りの福島市が誕生したと市勢概要で述べている。信夫郡福島町からの市制施行である
    kind: fact
    level: E2
    status: established
    sources:
    - a-cap-fukushima-city
  - text: 昔、信夫郡一帯は見渡す限りの湖で真ん中に信夫山があり、吾妻おろしが吹き付けるその島は「吹島（ふくしま）」と呼ばれた、と伝説集『信夫伊達風土記』は伝える
    kind: legend
    level: E2
    status: established
    sources:
    - a-fuk-pref
    - a-cap-shinobu-fudoki
  - text: やがて湖が干上がって集落が生まれ、「吹」は風が吹き付けることを嫌って「福」に替えられ、「福島」と呼ぶようになった、と『信夫伊達風土記』の伝説は続ける
    kind: legend
    level: E2
    status: established
    sources:
    - a-fuk-pref
    - a-cap-shinobu-fudoki
  column:
    title: 県庁所在地なのに「59番目の市」だった福島
    text: 福島市が市になったのは明治40年（1907年）、全国で59番目です。1889年に市制が始まってからも、県庁所在地でありながら18年間「福島町」のままでした。城の名前が生まれてから数えると314年、町はゆっくり育ちました。「福島」という名前の格（藩の城の名）と、自治体としての格（市）がそろうまでには、意外な時間差があったのです。
    sources:
    - a-cap-fukushima-city
    - a-fuk-city
  relations:
  - pref/07
  unknowns:
  - 「福島」の名付けの正確な理由（県公式に「詳細な由来は不明」。縁起担ぎ説も伝承の域を出ない）
  - 県庁所在地でありながら市制施行が1907年まで遅れた理由についての公式説明は未確認
  - 『信夫伊達風土記』自体の成立・書誌の確定は未確認（県レコードと同じ）
  updated: '2026-11-13'
- id: muni/07-金山町
  code: '074454'
  names:
    ja: 金山町
    reading: かねやままち
    aliases:
    - 金山村
  user_terms:
  - 金山町の名前の由来
  - 福島の金山町は金山谷の町
  - 沼沢湖の大蛇伝説の町
  - 金山町は山形と福島にある
  naming_type: 合併新設
  prefecture: 福島県
  homonyms:
  - muni/06-金山町
  summary: 昭和30年（1955年）3月31日に川口村・本名村・沼沢村・横田村が合併して金山村となり、昭和33年（1958年）4月1日に町制を施行した。町域の東部は江戸時代に「金山谷」と呼ばれ、この名は中世から見える広域地域名で、現在の金山町・三島町・昭和村などにまたがっていた。1955年の新村名がこの「金山谷」から採られたと明示する資料は見つかっていないが、4村はすべてその範囲に含まれる。宿場町の集落名を受け継いだ山形県金山町とは成り立ちが異なる。
  first_attestation:
    era: 天文13年
    year_western: 1544
    document: 『異本塔寺長帳』天文13年条（日本歴史地名大系「金山谷」が用例として紹介）
    note: 広域名「金山谷」の文献上の用例を二次資料経由の紹介で記録したもの。自治体名としての「金山」は1955年の金山村発足が初出
  claims:
  - text: 昭和30年（1955年）3月31日、川口村・本名村・沼沢村・横田村の4村が合併して金山村となり、昭和33年（1958年）4月1日に町制を施行して金山町となった
    kind: fact
    level: E2
    status: established
    sources:
    - h4-fukushima-kaneyama-profile
    - h4-fukushima-youran
  - text: 町公式は、江戸時代には町域の東部が「金山谷」、西部が「伊北郷」と呼ばれ、尾瀬を含む広大な幕府直轄地である天領「南山御蔵入」の一角だったと説明する
    kind: fact
    level: E2
    status: established
    sources:
    - h4-fukushima-kaneyama-profile
  - text: 日本歴史地名大系によれば、「金山谷」は中世から見える広域地域名で、現在の大沼郡昭和村・三島町・金山町と旧西山村の地域を指し、『異本塔寺長帳』天文13年（1544年）条に「会津金山谷川口村烏山ニ築城」とあることが紹介されている
    kind: fact
    level: E3
    status: established
    sources:
    - h4-kotobank-kaneyamadani
  - text: 文亀元年（1501年）12月27日の蘆名盛高加判売券（山内文書）では、この地域が「神山」と表記されており、日本歴史地名大系は、「金山」の誤記か、古くは「神山谷」と用いてのちに改めたものか、定かでないとする
    kind: fact
    level: E3
    status: contested
    sources:
    - h4-kotobank-kaneyamadani
  - text: 1955年に合併した4村はすべて「金山谷」の範囲内にあり、新村名「金山」はこの広域名から採られたと考えられる。根拠は4村の位置と金山谷の範囲の一致だが、村名選定の理由を明示した当時の資料は確認できていないため、類推として区別する
    kind: fact
    level: H
    status: inferred
    sources:
    - h4-kotobank-kaneyamadani
    - h4-fukushima-kaneyama-profile
  - text: 福島県市町村要覧は、町東部の沼沢湖を「県内で唯一ヒメマスが棲息し、大蛇伝説が残る神秘の湖」と紹介している
    kind: legend
    level: E2
    status: established
    sources:
    - h4-fukushima-youran
  - text: 【異なる層】山形県金山町の「金山」は羽州街道の宿場町として栄えた中心集落の名の継承であるのに対し、福島県金山町の「金山」は中世以来の広域名「金山谷」を背景に持つ点で、成り立ちが異なる
    kind: fact
    level: E3
    status: established
    sources:
    - h4-kotobank-kaneyama
    - h4-kotobank-kaneyamadani
  column:
    title: 村の名前より大きな「金山」
    text: 1955年に合併した4つの村は、どれも「金山」という名を持っていなかった。採用された「金山」は、村々を包むもっと大きな地域の名前、中世から続く「金山谷」の一部である。自分の村の名ではなく谷全体の名を新しい村の名にする点で、この命名は山形の金山町と好対照をなす。あちらは「集落の名が残った町」、こちらは「地域の名をいただいた町」である。
    sources:
    - h4-kotobank-kaneyamadani
    - h4-fukushima-kaneyama-profile
  relations:
  - pref/07
  - muni/06-金山町
  unknowns:
  - 1955年の村名選定理由を明示した当時の資料（合併協議の記録・町史）は未確認
  - 「金山谷」の「金山」の語源（鉱山との関係など）は、専門文献のオンライン抜粋では未確認
  updated: '2026-11-13'
- id: muni/08-水戸市
  code: 082015
  names:
    ja: 水戸市
    reading: みとし
    aliases:
    - 江戸
    - 三戸
    - 水戸町
  user_terms:
  - 水戸の名前の由来
  - 水戸はなぜ水戸と呼ぶ
  - 水の門戸って本当
  - 水戸黄門の水戸
  - 茨城県庁がある市
  naming_type: 一部の地名
  prefecture: 茨城県
  homonyms: []
  summary: 水戸の名は、水の出入口を意味する古い言葉「みと」に由来すると水戸市は説明する。那珂川と千波湖の間に突き出した台地がそう呼ばれたもので、文書上の早い用例は室町時代とされる。江戸時代には水戸徳川家の城下町として定着し、現在の市名に継承された。
  first_attestation:
    era: 室町時代（応永年間・1394〜1428年頃と推定）
    year_western: null
    document: 吉田薬王院文書
    note: 水戸市の歴史文化資料が「水戸」の早い用例として紹介する文書。文書の成立年代は推定によるため、西暦は幅を持たせて null とした
  claims:
  - text: 水戸市公式によれば、海や川の水の出入口は古くから「みと」または「みなと」と呼ばれており、水戸の場合も那珂川と桜川・千波湖の間に突き出た台地から「みと」と呼ばれたことに由来するとされている
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-mito-kids
    - b-cap-mito-promo
  - text: 水戸市の歴史文化資料によれば、「水戸」という地名の早い用例は、応永年間（1394〜1428年）のものと推定される吉田薬王院文書に現れたものである
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-mito-bunka
  - text: 水戸市の歴史文化資料によれば、その後しばらくは同じく海水の出入口を意味する「江戸」と併用されることが多く、天正19年（1591年）に佐竹氏が水戸城を本拠とした頃から「水戸」もしくは「三戸」が用いられ、やがて「水戸」が定着したと考えられている
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-mito-bunka
  - text: 水戸市公式によれば、水戸市は茨城県の県庁所在地であり、県内唯一の中核市である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-mito-promo
    - b-cap-mito-profile
  - text: 水戸の語源は市の公式説明では「水の出入口」を意味する普通名詞「みと」に求められているが、それを裏付ける中世以前の一次資料は本バッチでは確認できておらず、市の資料自体も「由来するとされています」という伝聞の形で述べている
    kind: fact
    level: E2
    status: indeterminate
    sources:
    - b-cap-mito-kids
  - text: 総務省の全国地方公共団体コードで、水戸市のコードは082015と定められている（J-LISの茨城県内市町村一覧による）
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-mito-jlis
  column:
    title: 水戸と江戸、同じ意味だった2つの地名
    text: 水戸市の資料によれば、「水戸」と「江戸」はどちらも海水の出入口を意味する言葉で、室町時代以降しばらくは同じ土地を指して併用されることが多かったという。さらに「三戸」という表記まであった。やがて「江戸」は将軍のお膝元として、「水戸」は徳川御三家の城下町として、それぞれ別の名前として定着した。同じ意味から出発した2つの地名が、日本の政治の中心とその「副将軍」の城下に育ったのは対照的である。
    sources:
    - b-cap-mito-bunka
  relations:
  - pref/08
  unknowns:
  - 水戸市が市制を施行した年月日と当時の経緯は、本バッチでは市公式資料で確認できなかったため主張に含めていない
  - 吉田薬王院文書の原文は未読で、「水戸」の用例の確認は水戸市の歴史文化資料の紹介経由に留まる
  - 室町時代より前の「水戸」の用例は確認できなかった
  updated: '2026-11-13'
- id: muni/09-宇都宮市
  code: 092011
  names:
    ja: 宇都宮市
    reading: うつのみやし
    aliases:
    - 池辺郷
  user_terms:
  - 宇都宮の名前の由来
  - うつのみやはなぜ宇都宮と書く
  - 一宮が訛ったって本当
  - 餃子の市の名前の由来
  - 二荒山神社と宇都宮
  naming_type: 一部の地名
  prefecture: 栃木県
  homonyms: []
  summary: 宇都宮は下野国一宮・二荒山神社の門前で育った地名である。宇都宮市公式は、藤原宗円が同社の社号「宇都宮」を氏としたことに由来すると説明し、神社側は「一宮（いちのみや）」の転訛説を一説として伝える。平安末期以降は宇都宮氏の城下町、明治には県庁所在地となり、現在の市名に継承された。
  first_attestation:
    era: 平安時代（延長5年）
    year_western: 927
    document: 延喜式神名帳
    note: 下野国河内郡の二荒山神社が名神大社として記載されたもの。地名「宇都宮」そのものの初出ではなく、由来の核となる神社の格式を示す一次文献の記載で、二荒山神社公式が紹介している
  claims:
  - text: 宇都宮市公式によれば、「宇都宮」の地名は、藤原宗円が二荒山神社の社号「宇都宮」を氏とし、鎌倉幕府の中枢にあって治政をあげたことに由来するといわれている
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-utsu-city
  - text: 二荒山神社公式は、平安から鎌倉時代には各国で最も格式が高い神社が一之宮と呼ばれ、二荒山神社も下野国一之宮と呼ばれたことから、宇都宮という地名はこの「イチノミヤ」が訛って「ウツノミヤ」になったという一説があると伝えている
    kind: fact
    level: E2
    status: contested
    sources:
    - b-cap-utsu-jinja
  - text: 二荒山神社公式によれば、延長5年（927年）に完成した『延喜式』神名帳には「下野國河内郡一座大 二荒山神社 名神大」と記載があり、同社は栃木県内唯一の名神大社である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-utsu-jinja
  - text: 宇都宮市教育委員会の資料によれば、『和名類聚抄』には河内郡内の郷の1つとして池辺郷が書かれており、二荒山神社前の釜川沿いにあった鏡ケ池の周辺に発達した大きな村が池辺郷と考えられている
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-utsu-city-edu
  - text: 蝦夷平定のため初めてこの地に足を踏み入れた豊城入彦命が宇都宮の開祖といわれ、これを祀った二荒山神社の門前町として宇都宮が栄えたと、宇都宮市公式が伝えている
    kind: legend
    level: E2
    status: established
    sources:
    - b-cap-utsu-city
  - text: 仁徳天皇の代に毛野国が上下の二国に分けられ、豊城入彦命の四世孫・奈良別王が下毛野国の国造に任じられたとき、祖神の豊城入彦命を祀ったのが二荒山神社の始まりで、承和5年（838年）に現在の地へ遷座されたと、二荒山神社公式が伝えている
    kind: legend
    level: E2
    status: established
    sources:
    - b-cap-utsu-jinja
  - text: 宇都宮市公式によれば、明治17年（1884年）に栃木県庁が置かれ、明治22年（1889年）に町制、明治29年（1896年）に市制が施行された
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-utsu-city
  - text: 総務省の全国地方公共団体コードで、宇都宮市のコードは092011と定められている（J-LISの栃木県内市町村一覧による）
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-utsu-jlis
  column:
    title: イチノミヤがウツノミヤに？
    text: 宇都宮の由来には、市の公式説明と神社の説明で少し違う話が伝わる。市は「藤原宗円が二荒山神社の社号『宇都宮』を自分の氏にしたのが始まり」とし、神社は「下野国一之宮の『イチノミヤ』が訛って『ウツノミヤ』になった一説がある」とする。イチノミヤからウツノミヤへの音の変化は大きく、鵜呑みにはできないが、どちらの話も出発点が「宮＝二荒山神社」である点は一致している。地名の中心に千年以上同じ神社があること自体が、この町の特徴である。
    sources:
    - b-cap-utsu-city
    - b-cap-utsu-jinja
  relations:
  - pref/09
  unknowns:
  - 「宇都宮」の文字列が現れる最古の文書は本バッチでは特定できなかった
  - 藤原宗円が宇都宮を称した正確な時期と、その根拠となる文書は本バッチでは未確認
  - 一宮転訛説について、音韻変化を裏付ける学術的な検証は本バッチでは確認できなかった
  updated: '2026-11-13'
- id: muni/10-前橋市
  code: '102016'
  names:
    ja: 前橋市
    reading: まえばしし
    aliases:
    - 厩橋
    - 駅家郷
  user_terms:
  - 前橋の名前の由来
  - 厩橋って何と読む
  - 前橋はもともと別の名前だった
  - 群馬県庁がある市
  - まやはしと前橋
  naming_type: その他
  prefecture: 群馬県
  homonyms: []
  summary: 前橋の旧名は「厩橋（まやはし）」で、車川にかかる「駅家（うまや）の橋」が地名になったと前橋市は伝える。「前橋」への改称は江戸時代初期の前橋藩主・酒井忠清の頃（1648〜1652年）というのが市の公式見解で、明治25年（1892年）の市制施行以来、この名が市名として継承されている。
  first_attestation:
    era: 平安時代中期（10世紀）
    year_western: null
    document: 和名類聚抄
    note: 群馬郡の駅家（うまや）郷など、前橋の前身と市が見なす地名が現れる時代の資料。前橋市勢要覧が「前橋の地名が出てくるのは10世紀平安中期」と紹介するもので、「厩橋」の文字列そのものの初出ではない
  claims:
  - text: 前橋市公式によれば、前橋は古くは「厩橋（まやはし）」と称した
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-mae-city
  - text: 前橋市公式によれば、「厩橋」の名は、現在利根川が流れているあたりに車川と称する流れがあり、そこにかかっていた橋を「駅家（うまや）の橋」と呼んだことから、自然に地名になったと伝えられている
    kind: fact
    level: E2
    status: contested
    sources:
    - b-cap-mae-city
    - b-cap-mae-youran
  - text: 前橋市公式によれば、「厩橋」が「前橋」に改められたのは西暦1648年から1652年、前橋藩第4代藩主の酒井忠清が城主であった頃だと言われている
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-mae-city
  - text: 前橋市勢要覧によれば、群馬（くるま）の郡、駅家（うまや）の郷、群馬（くるま）の駅など、前橋の地名が出てくるのは10世紀の平安中期である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-mae-sisei
  - text: 前橋市公式によれば、厩橋城は文明年間（1470年代）に築かれたとされ、この城は戦国時代に上杉・武田・北条の攻防の的となった
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-mae-city
    - b-cap-mae-youran
  - text: 前橋市公式によれば、慶応3年（1867年）に松平氏が再び前橋に迎えられて前橋藩が復活したが、まもなく明治維新となった。これは厩橋から前橋への改名の時期とは別の出来事である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-mae-city
  - text: 前橋市公式によれば、明治14年（1881年）に県庁が前橋に置かれ、明治22年（1889年）に町制を施行し、明治25年（1892年）には県内最初・関東で4番目・全国で41番目に市制を施行した
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-mae-city
  - text: 総務省の全国地方公共団体コードで、前橋市のコードは102016と定められている（J-LISの地方公共団体コード一覧による）
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-mae-jlis
  column:
    title: 消えた「厩」の字
    text: 前橋の旧名「厩橋」は、馬の駅（駅家）に由来する実務的な地名だった。それがなぜ「前橋」に変わったのか、理由は前橋市の公式資料には書かれていない。時期についても、市は1648年から1652年という幅のある言い方をしている。なお、江戸末期の慶応3年（1867年）に松平氏が前橋に戻った出来事は、改名ではなく藩の復活であり、改名とは時代も主も異なる。はっきりしているのは、大老・酒井忠清が藩主だった時代に、城下の名が馬の駅の橋を意味する「厩橋」から「前橋」へ置き換わったということまでである。
    sources:
    - b-cap-mae-city
  relations:
  - pref/10
  unknowns:
  - 厩橋から前橋への改名の理由（「厩」の字を忌んだとする類の説明）は、市の公式資料では確認できなかった
  - 改名の正確な年は1648〜1652年の幅があり、本バッチでは確定できなかった
  - 「厩橋」の文字列の文書上の初出は本バッチでは特定できなかった
  updated: '2026-11-13'
- id: muni/10-南牧村
  code: '103837'
  names:
    ja: 南牧村
    reading: なんもくむら
    aliases: []
  user_terms:
  - なんもくむら
  - 南牧村 群馬 読み方
  - 南牧村は二つある
  naming_type: 合併新設
  prefecture: 群馬県
  homonyms:
  - muni/20-南牧村
  summary: 昭和30年（1955年）に磐戸村・月形村・尾沢村の3村が合併して生まれた村で、村の中央を南牧川が流れる。県境の向こうにある長野県の南牧村とは漢字が同じでも読みが違い、こちらは「なんもく」と読む。村名そのものの語源（南牧川・地域名「南牧」の由来）は、確認した公式資料・地名辞典では明示されていない。
  first_attestation:
    era: 昭和30年
    year_western: 1955
    document: 磐戸村・月形村・尾沢村の合併による南牧村の発足（1955年3月15日村制施行）
    note: 自治体名としての初出。地域名・川名としての「南牧」の初出は未確認
  claims:
  - text: 昭和30年（1955年）3月15日、磐戸村・月形村・尾沢村の3か村の合併により南牧村が誕生した
    kind: fact
    level: E2
    status: established
    sources:
    - h6-nanmoku-gunma-pref
  - text: 村のほぼ中央を南牧川が流れ、集落のほとんどは南牧川とその支流に沿って発展している。日本歴史地名大系・ブリタニカ小項目事典もこの村を南牧川流域の村として記述する
    kind: fact
    level: E2
    status: established
    sources:
    - h6-nanmoku-gunma-pref
    - h6-nanmoku-kotobank
  - text: 読みは「なんもく」で、県境の向こうにある長野県南佐久郡の南牧村の読み「みなみまき」とは異なる。同じ漢字表記でも読みが違うため、両村はまず読みで区別される（異なる層）
    kind: fact
    level: E2
    status: established
    sources:
    - h6-nanmoku-gunma-pref
    - h6-minamimaki-official-history
  - text: 両村は県境を挟んで近接しており、Wikipediaの両村の記事はともに相手の村の読みの違いを注記している（共通する層は「南牧」という漢字表記のみ）
    kind: fact
    level: E5
    status: established
    sources:
    - h6-nanmoku-gunma-wiki
    - h6-minamimaki-wiki
  - text: 村名「南牧」が何に由来するか（南牧川の名が先か、地域名が先か、「牧」が放牧とどう関係するか）は、確認した県公式資料・地名辞典では明示されておらず、語源は未確定である
    kind: fact
    level: E3
    status: indeterminate
    sources:
    - h6-nanmoku-kotobank
    - h6-nanmoku-gunma-pref
  column:
    title: 県境の両側で読みが分かれた「南牧村」
    text: 国道254号を下仁田方面へ走ると「南牧村」の標識が見えますが、あれは群馬の「なんもく」です。一方、八ヶ岳の麓にある長野の南牧村は「みなみまき」。県境を挟んで近接する二つの村は漢字が完全に同じで、読みだけが違うため、ドライバーが標識を見て混乱した体験記が残るほどです。郵便や宅配の宛先でも県名の書き添えが欠かせない、全国でも珍しい同名ペアです。
    sources:
    - h6-nanmoku-futatsu-essay
    - h6-nanmoku-gunma-wiki
  relations:
  - pref/10
  - muni/20-南牧村
  unknowns:
  - 南牧川および地域名「南牧」の初出と語源（公式資料・地名辞典で確認できず）
  - 昭和30年の合併時に「南牧」の名を選んだ経緯の記録は未確認
  updated: '2026-11-13'
- id: muni/10-明和町
  code: '105228'
  names:
    ja: 明和町
    reading: めいわちょう
    aliases:
    - 明和村
  user_terms:
  - 群馬の明和町の由来
  - 明和村から明和町になった町
  - 理想郷という意味の明和
  naming_type: 合併新設
  prefecture: 群馬県
  homonyms:
  - muni/24-明和町
  summary: 邑楽郡の町で、昭和30年（1955）に千江田村・梅島村・佐貫村の合併で「明和村」として誕生した。新村名は3か村への公募で決まり、「明朗にして平和なる理想郷の象徴」として選ばれた瑞祥地名である。平成10年（1998）の町制施行では慣れ親しんだ村名を残し「明和町」となった。同名の三重県明和町も公募命名だが、そちらは前身町村名の字の合成で、命名の論理が異なる。
  first_attestation:
    era: 昭和30年
    year_western: 1955
    document: 公募による「明和村」の命名（3村の合併）
    note: 名前としての初出は1955年の明和村。町としての初出は1998年10月1日の町制施行で、村名をそのまま引き継いだ
  claims:
  - text: 昭和30年（1955）、旧千江田村・梅島村・佐貫村が合併して明和村が誕生した
    kind: fact
    level: E2
    status: established
    sources:
    - h5-meiwa-gunma-koho
  - text: 新村名は3か村に公募され、応募総数は215通、村名は89種類にのぼった
    kind: fact
    level: E2
    status: established
    sources:
    - h5-meiwa-gunma-yurai
  - text: 審査の結果、「明朗にして平和なる理想郷の象徴」として「明和村」の名称が決められたと、町は由来を説明している
    kind: fact
    level: E2
    status: established
    sources:
    - h5-meiwa-gunma-yurai
  - text: 平成10年（1998）10月1日の町制施行にあたり、43年間慣れ親しんだ村名を廃止するには忍びないとして、新しい町名は「明和町」と決まった
    kind: fact
    level: E2
    status: established
    sources:
    - h5-meiwa-gunma-yurai
  - text: 共通する層として、同名の三重県明和町も1950年代の合併で新町名を公募により決めており、「公募で生まれた明和」という点は両町に共通する
    kind: fact
    level: E2
    status: established
    sources:
    - h5-meiwa-mie-rekimachi
  - text: 異なる層として、群馬の明和は特定の旧村名の字を採った合成名ではなく「明朗」「平和」という理念そのものを名にした瑞祥地名であり、また1955年から1998年まで43年間は「明和村」だった点で、発足時から町だった三重の明和町と履歴が異なる
    kind: fact
    level: E2
    status: established
    sources:
    - h5-meiwa-gunma-yurai
    - h5-meiwa-mie-weblio
  - text: 総務省の全国地方公共団体コードで、明和町の団体コードは105228と定められている
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 89種類の候補から選ばれた「理想郷」の名前
    text: 1955年の合併で新しい村の名前を決めるとき、群馬の明和は3か村の住民に公募しました。条件は、3か村に共通する感じであること、簡潔で印象が明朗なこと、新鮮味のあること。集まった215通・89種類の中から選ばれたのが「明和」で、その理由は「明朗にして平和なる理想郷の象徴」と記録されています。村名に村の理想そのものを書き込む、昭和の大合併期らしい瑞祥命名です。そして43年後、町になるときも町民はこの名を手放さず、「廃止するには忍びない」と残しました。
    sources:
    - h5-meiwa-gunma-yurai
  relations:
  - pref/10
  - muni/24-明和町
  unknowns:
  - 公募で「明和」に次ぐ候補だった村名（次点の候補）は未確認
  - 「明和村」の名称を応募したのが誰か（個人名）は未確認
  updated: '2026-11-13'
- id: muni/10-昭和村
  code: '104485'
  names:
    ja: 昭和村
    reading: しょうわむら
    aliases:
    - 久呂保村
    - 糸之瀬村
  user_terms:
  - 群馬の昭和村の由来
  - 昭和村はなぜ昭和という名前か 群馬
  - こんにゃくいもの村 昭和村
  naming_type: 合併新設
  prefecture: 群馬県
  homonyms:
  - muni/07-昭和村
  summary: 利根郡の村で、昭和33年（1958）11月1日に久呂保村と糸之瀬村の合併で誕生した、昭和の大合併期の村である。村名が元号「昭和」と同字であることは明らかだが、命名理由を明記した村公式・県の公的資料は本調査では確認できず、理由は未詳として残す。同名の福島県昭和村は1927年の成立で改元あやかりの命名が説明されており、対照的である。
  first_attestation:
    era: 昭和33年
    year_western: 1958
    document: 昭和村の発足（久呂保村・糸之瀬村の合併）
    note: 村名の初出は1958年の合併による命名そのもの。ただし命名理由の公的記録は本調査で未確認
  claims:
  - text: 昭和33年（1958）11月1日に久呂保村と糸之瀬村が合併して昭和村が誕生した
    kind: fact
    level: E2
    status: established
    sources:
    - h5-showa-gunma-plan
  - text: 昭和36年（1961）8月1日には、利根村の大字生越が境界変更により昭和村へ編入された
    kind: fact
    level: E2
    status: established
    sources:
    - h5-showa-gunma-plan
  - text: 前身の久呂保村は1889年（明治22年）に森下村・橡久保村・川額村の合併で、糸之瀬村は糸井村・貝野瀬村の合併で発足した村である
    kind: fact
    level: E2
    status: established
    sources:
    - h5-showa-gunma-plan
  - text: 県の市町村要覧は、昭和村の団体コードを104485、村制施行の日を昭和33年11月1日と記す
    kind: fact
    level: E2
    status: established
    sources:
    - h5-showa-gunma-youran
  - text: 村名「昭和」の命名理由は、村公式の総合計画や県の市町村要覧・市町村名変遷表には記されておらず、本調査では命名理由を明記した公的資料を確認できなかった
    kind: fact
    level: E2
    status: indeterminate
    sources:
    - h5-showa-gunma-plan
    - h5-showa-gunma-youran
  - text: 異なる層として、同名の福島県昭和村は昭和2年（1927）に成立し、「昭和時代に入って誕生した村」という改元あやかりの命名理由が公的資料で説明されるのに対し、群馬の昭和村は昭和の大合併期（1958）の成立で、理由も記録されていない
    kind: fact
    level: E2
    status: established
    sources:
    - h5-showa-fk-soka
    - h5-showa-gunma-plan
  - text: 共通する層として、両村とも合併で旧村名を継承せず、元号と同字の新名「昭和」を採った村である
    kind: fact
    level: E2
    status: established
    sources:
    - h5-showa-fk-soka
    - h5-showa-gunma-plan
  - text: 平成の大合併では、村は「自主自立の道」を選択し、合併せずに単独の村として存続した
    kind: fact
    level: E2
    status: established
    sources:
    - h5-showa-gunma-plan
  column:
    title: 「昭和の日」が、村の行事になる村
    text: 群馬の昭和村では、県の市町村要覧の行事一覧に「『昭和の日』記念イベント（4月）」が載っています。村名が元号そのものなので、4月29日の「昭和の日」が、そのまま村のアイデンティティを祝う日になるのです。こんにゃくいもの大鍋が名物のこのイベントも含め、村は「昭和」という名を積極的に使い続けています。ただし、1958年の合併時に誰がなぜこの名を選んだのかは、公表された資料ではまだ分かりません。名の使い方は華やかでも、名の由来の記録は静かです。
    sources:
    - h5-showa-gunma-youran
    - h5-showa-gunma-plan
  relations:
  - pref/10
  - muni/07-昭和村
  unknowns:
  - 村名「昭和」の命名理由・発案者・選定過程は公表資料で未確認であり、『昭和村誌』など村史の直接確認が今後の課題
  - 同名の福島県昭和村との交流事業の有無など、2つの昭和村の関係史は未確認
  updated: '2026-11-13'
- id: muni/10-高山村
  code: '104281'
  names:
    ja: 高山村
    reading: たかやまむら
    aliases: []
  user_terms:
  - 高山村 群馬 合成地名
  - 中山と尻高の村
  - 三国街道の宿場の村
  naming_type: 合併新設
  prefecture: 群馬県
  homonyms:
  - muni/20-高山村
  summary: 明治22年（1889年）に中山村と尻高村が合併して生まれた村で、村名は尻高の「高」と中山の「山」を合わせた合成地名である。長野県にも高山村があり、そちらも合成地名だが、材料は高井村と山田村で、字面の一致は偶然である。旧村名は現在の大字「中山」「尻高」に残る。
  first_attestation:
    era: 明治22年
    year_western: 1889
    document: 町村制施行による高山村の誕生（1889年4月1日）
    note: 自治体名としての初出（合併時の合成地名）
  claims:
  - text: 明治22年（1889年）4月1日、西群馬郡の尻高村と中山村が合併して高山村が誕生した（明治29年に吾妻郡へ編入）
    kind: fact
    level: E2
    status: established
    sources:
    - h6-takayama-gunma-official
    - h6-takayama-gunma-pref
  - text: 地名研究の講演資料（北川和秀）は、明治22年の群馬県の新地名の分類で高山村を「合併した町村名を合成」した例に挙げ、「尻高と中山の各一字をとって合成したもの」と説明する
    kind: fact
    level: E3
    status: established
    sources:
    - h6-takayama-gosei-kitagawa
  - text: 合成地名の一覧資料でも、群馬県吾妻郡高山村は「尻高村＋中山村」の合成地名として挙げられている
    kind: fact
    level: E5
    status: established
    sources:
    - h6-takayama-gosei-list
  - text: 長野県の高山村も合成地名という点は共通するが、材料は高井村の「高」と山田村の「山」で、群馬側の尻高・中山とは無関係である（共通する層＝合成地名という命名方式、異なる層＝元の村名）
    kind: fact
    level: E5
    status: established
    sources:
    - h6-takayama-gosei-list
    - h6-takayama-nagano-wiki
  - text: 合併前の旧村名は、現在の大字「中山」「尻高」として村内に残っている
    kind: fact
    level: E2
    status: established
    sources:
    - h6-takayama-gunma-pref
  - text: 村は近世に越後と江戸を結ぶ三国街道の宿場として栄えた土地で、繁栄は街道が廃止される明治初期まで続いた
    kind: fact
    level: E2
    status: established
    sources:
    - h6-takayama-gunma-official
  column:
    title: 「足して二で割る」合成地名
    text: 明治22年の大合併では、新しい村名の付け方にいくつかの型がありました。地名研究者はその一つを「足して二で割る」方式と呼びます。高山村はその典型で、尻高の「高」と中山の「山」を一字ずつ取って「高山」。隣の県の長野県高山村も、高井の「高」と山田の「山」で同じ結果になりました。作り方は同じでも材料が違えば別の村――二つの高山村は、明治の命名の型そのものを比べられる好例です。
    sources:
    - h6-takayama-gosei-kitagawa
    - h6-takayama-gosei-list
  relations:
  - pref/10
  - muni/20-高山村
  unknowns:
  - 合成の際に「高山」の字順・読みを決めた経緯の記録は未確認
  - 「中山」「尻高」という旧村名自体の語源は今回未調査
  updated: '2026-11-13'
- id: muni/11-さいたま市
  code: '111007'
  names:
    ja: さいたま市
    reading: さいたまし
    aliases:
    - 浦和市
    - 大宮市
    - 与野市
  user_terms:
  - さいたま市はなぜひらがな
  - さいたま市の名前の決め方
  - 埼玉とさいたま市の違い
  - 浦和と大宮が合併した市
  - 県名の発祥の地はどこ
  naming_type: 合併新設
  prefecture: 埼玉県
  homonyms: []
  summary: さいたま市は平成13年（2001年）5月1日に浦和市・大宮市・与野市が合併して誕生した新設市で、市名は市民公募を経て、県名と同じ「さいたま」をひらがな表記で採用した。ただし県名の原点である古代の埼玉（さきたま）は現在の行田市埼玉にあり、新市の市名が指す古代の土地は現在のさいたま市の市域にはないという、位置と読みの双方のずれを抱えている。
  first_attestation:
    era: 平成13年
    year_western: 2001
    document: 浦和市・大宮市・与野市の合併による市制施行（新市名称の公募と決定）
    note: 合併新設市の命名そのものが「さいたま市」という自治体名の初出。「さいたま」の語自体は古代の埼玉（さきたま）に遡るが、表記はひらがな、読みは現代の県名の読みを採った
  claims:
  - text: さいたま市公式によれば、平成13年（2001年）5月1日、浦和市・大宮市・与野市の3市が合併し、人口103万人を擁する「さいたま市」が誕生した
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-saitama-20th
  - text: さいたま市公式FAQによれば、新市名については平成12年（2000年）1月10日から40日間公募が実施され、平仮名の「さいたま市」、漢字の「埼玉市」、「彩都市」、「さきたま市」、「関東市」の5つの案が候補に選ばれた
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-saitama-faq
  - text: さいたま市公式FAQによれば、応募総数は67,396人で、うち漢字の「埼玉市」と平仮名の「さいたま市」の2案を合わせて10,938人の応募があり、ひらがなの採用理由として、誰からも埼玉県の県庁所在地と分かること、漢字の埼玉県と区別すること、市名から受ける感じをやさしく柔らかくすることが挙げられている
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-saitama-faq
  - text: さいたま市公式FAQは新市名の決定理由の1つに『続日本紀』や『万葉集』にもその名が散見される歴史ある名であることを挙げる一方、埼玉県名発祥之碑の碑文によれば、古代の表記は前玉（さきたま）で、正倉院文書の神亀3年（726年）の山背国戸籍帳などに武蔵国前玉郡と見える。つまり古代の読みは「さきたま」であり、市の名が採った「さいたま」は後世の読みである
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-saitama-faq
    - b-saitama-hasshohi
  - text: 埼玉県名発祥之碑の碑文によれば、埼玉郡は律令による国郡制度発足当初から置かれた郡とみられ、その原点の地は現在の行田市埼玉である。したがって「埼玉」の原点は、さいたま市の市域（旧浦和市・大宮市・与野市）にはなく、北へ離れた行田市にある
    kind: fact
    level: E2
    status: established
    sources:
    - b-saitama-hasshohi
  - text: さいたま市公式によれば、平成15年（2003年）4月に政令指定都市へ移行し、平成17年（2005年）4月に岩槻市と合併して現在の市域となった
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-saitama-20th
  - text: さいたま市公式によれば、さいたま市の地方公共団体コードは111007である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-saitama-code
  column:
    title: 「埼玉」の原点は、さいたま市にはない
    text: さいたま市の名は県名から採られたが、その県名の原点は行田市埼玉（さきたま）にある。古代、そこは前玉・埼玉と呼ばれた土地で、さきたま古墳群が残り、「埼玉県名発祥之碑」も行田市に建つ。2001年の合併で生まれた新市は、この由緒ある名を借りたが、読みは古代の「さきたま」ではなく現代の「さいたま」、表記は漢字ではなくひらがなを選んだ。公募の候補には「さきたま市」も残っていたが、採用されたのは県庁所在地と一目で分かる「さいたま市」だった。名の故郷と名を受け継いだ都市が、読みも場所もずれているのがこの市名の面白さである。
    sources:
    - b-saitama-hasshohi
    - b-cap-saitama-faq
  relations:
  - pref/11
  unknowns:
  - 新市名の候補5案がどのような選定過程（合併協議会での審議等）を経て1案に絞られたかの詳細は、本バッチでは公式資料で確認できなかった
  - 県庁所在地だった浦和市の名が新市名に残らなかった経緯についての公式説明は、本バッチでは確認できなかった
  updated: '2026-11-13'
- id: muni/11-美里町
  code: '113816'
  names:
    ja: 美里町
    reading: みさとまち
    aliases:
    - 美里村
  user_terms:
  - 美里町の名前の由来
  - 美里村はどうやって決まった
  - 児玉郡の美里町
  naming_type: 合併新設
  prefecture: 埼玉県
  homonyms:
  - muni/04-美里町
  - muni/43-美里町
  summary: 1954年に東児玉村・松久村・大沢村が合併した際、住民公募と全世帯投票で選ばれた新村名「美里村」が前身で、1984年に町制を施行して美里町となった。町長の公式コラムは、この名に「将来も平和な農村として発展したい」という意味が込められたと説明する。3つの美里町の中で命名が最も古く、理由が公式に説明される点で宮城県美里町と異なる。
  first_attestation:
    era: 昭和29年
    year_western: 1954
    document: 新村名「美里村」の決定（三村合併促進協議会の候補選出と村内全世帯の投票による）
    note: 村名としての初出。これ以前に「美里」という小地名が域内にあったかは未確認
  claims:
  - text: 昭和29年（1954年）に東児玉村・松久村・大沢村が合併して美里村が誕生し、昭和59年（1984年）10月に町制を施行して美里町となった
    kind: fact
    level: E2
    status: established
    sources:
    - h3-saitama-enkaku
  - text: 合併後の新村名は住民公募とし、三村合併促進協議会で「美里村」「山里村」「三栗村」の候補を投票で選出したうえで、村内全世帯に選んでもらい「美里村」に決まったと町長コラムが伝える
    kind: fact
    level: E2
    status: established
    sources:
    - h3-saitama-mayor
  - text: 町長コラムは「住民の大部分が農業を営んでおり、将来も平和な農村として発展したいという意味が込められています」と命名の意味を説明する
    kind: fact
    level: E2
    status: established
    sources:
    - h3-saitama-mayor
  - text: 3町とも「美しい里」と読める字面の合併新名という点は共通する。ただし本町は1954年と命名が最も古く、公式の説明は字義の「美しい里」そのものより「平和な農村として発展したい」という願いに置かれている。熊本県美里町は「美しいふる里」への願いを理由文に明記し、宮城県美里町は理由が確認できない
    kind: fact
    level: E2
    status: established
    sources:
    - h3-saitama-mayor
    - h3-kumamoto-misato-town
  - text: 総務省「地方公共団体コード一覧」では本町のコードは113816とされる
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 落選した「三栗村」と「山里村」
    text: 最終候補に残ったのは「美里村」「山里村」「三栗村」の3つで、決め方は協議会の投票で候補を絞ったうえでの全世帯投票でした。落選した候補名まで具体的に記録が残っている例は、合併新名の記録として貴重です。
    sources:
    - h3-saitama-mayor
  relations:
  - pref/11
  - muni/04-美里町
  - muni/43-美里町
  unknowns:
  - 公募の応募総数と各候補の得票数
  - 1954年以前に「美里」という小地名が域内にあったか
  updated: '2026-11-13'
- id: muni/12-千葉市
  code: '121002'
  names:
    ja: 千葉市
    reading: ちばし
    aliases:
    - 千葉郡
  user_terms:
  - 千葉市の名前の由来
  - 千葉はなぜ千葉と書く
  - 千葉開府900年とは
  - 千葉常重と千葉市
  - 千葉氏のまち
  naming_type: 一部の地名
  prefecture: 千葉県
  homonyms: []
  summary: 千葉は古代の下総国千葉郡の郡名で、『万葉集』の防人の歌や墨書土器に約1,300年前の用例が見える。大治元年（1126年）に千葉常重がこの地に本拠を移し、地名を名字として千葉を名乗って城下の基礎を作り、明治に県庁が置かれ、大正10年（1921年）の市制施行で地名がそのまま市名に継承された。語源は、草木の生い茂る豊かな土地に好字を当てたとする市の説明があるが、諸説あるとされる。
  first_attestation:
    era: 奈良時代（8世紀）
    year_western: null
    document: 万葉集
    note: 千葉郡の防人が詠んだ歌に地名「千葉」が登場すると千葉市が紹介する、使用例の初出級資料。あわせて発掘された墨書土器の用例も市が紹介し、約1,300年の歴史が確認できるという
  claims:
  - text: 千葉市公式によれば、「千葉」という地名は古代からあり、『万葉集』で千葉郡の防人が詠んだ歌に登場するほか、発掘された墨書土器によっても、「千葉」という地名が約1,300年の歴史をもつことが確認できる
    kind: fact
    level: E2
    status: established
    sources:
    - b-chiba-city-900
  - text: 千葉市公式によれば、千葉の地名の由来は諸説あるが、草木の生い茂る豊かな土地であったことから、その意味を表す好字（たくさんを意味する「千」と、草木を意味する「葉」）を当てて「千葉」と表記したのだと考えられている
    kind: fact
    level: E2
    status: contested
    sources:
    - b-chiba-city-900
  - text: 千葉市公式によれば、平安時代後期の大治元年（1126年）6月1日、千葉常重が大椎（現在の緑区大椎町）から現在の中央区亥鼻付近に本拠を移し、千葉を名乗ったことにより、千葉の都市としての歴史が始まったと言われている
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-shi-portal
  - text: 千葉市広報によれば、この1126年の本拠移転は中世の史料『千学集抜粋』の記述によるもので、大治元年6月1日に千葉常重が現在の中央区亥鼻付近に本拠を定めてまちが成立したとされている
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-kaifu-dayori
  - text: 千葉市公式によれば、常重の子・千葉常胤は1180年に房総へ逃れてきた源頼朝をいち早く助けて鎌倉幕府の成立に大きく貢献し、千葉氏は東北から九州に至る広大な所領を持つ屈指の御家人に成長した
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-shi-portal
  - text: 千葉市議会の市政概要によれば、千葉市の市章は開祖・千葉氏の月星の紋章に千葉の「千」を入れたもので、大正10年（1921年）に市制施行を記念して制定された
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-sisei
  - text: 総務省の全国地方公共団体コードで、千葉市のコードは121002と定められている（総務省の地方公共団体コード一覧による）
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: まちを作った一族と、同じ名前の市
    text: 千葉市は2026年に「千葉開府900年」を迎えた。大治元年（1126年）に千葉常重が本拠を移して以来、都市の名と支配した一族の名が同じ「千葉」であり続けている。千葉市の担当者は「都市を作った人物である『千葉氏』と、現在の都市の名前である『千葉市』が同じであることは、大都市としては非常に珍しい」と書いている。市の紋章にも千葉氏の月星紋に「千」の字を入れたものが使われており、市名・市章・開府の記念年まで、一族の名がまちのアイデンティティとして生き続けている。
    sources:
    - b-cap-chiba-kyokucho
    - b-cap-chiba-sisei
  relations:
  - pref/12
  unknowns:
  - 「千葉」の語源について、市のいう好字説以外の説の具体的内容は、本バッチでは専門文献（『角川日本地名大辞典』等）で確認できなかった
  - 『万葉集』の千葉郡防人の歌の正確な巻・歌番号は、本バッチでは特定できなかった
  - 千葉市が市制を施行した正確な月日は、本バッチで確認した市公式資料の範囲では明記されていなかった
  updated: '2026-11-13'
- id: muni/13-府中市
  code: '132063'
  names:
    ja: 府中市
    reading: ふちゅうし
    aliases:
    - 府中町
    - 府中宿
  user_terms:
  - 東京の府中の名前の由来
  - 武蔵国府があった市
  - 府中市はなぜ2つあるの
  naming_type: その他（国府所在地を指す普通名詞的地名の継承）
  prefecture: 東京都
  homonyms:
  - muni/34-府中市
  summary: 市名は、奈良時代から平安時代にかけて武蔵国の国府が置かれた地であることに由来し、「国府の中」という意味で「府中」と名付けられたと市は説明する。江戸時代には甲州街道の府中宿として栄え、昭和29年（1954年）4月1日に府中町・多磨村・西府村の合併で府中市が誕生した。広島県府中市とは、律令制の国府所在地に由来する点で共通するが、国（武蔵国／備後国）と成立事情は別である。
  first_attestation:
    era: 承平年間（931〜938年）
    year_western: null
    document: 和名類聚抄
    note: 武蔵国府が多麻郡に在ることを記す記録として、府中市教育委員会の保存管理計画が挙げるもの。「府中」という語そのものの初出を示す記録ではない
  claims:
  - text: 府中市教育委員会は、市名は武蔵国の国府の所在地であったことにちなみ、「国府の中」という意味で「府中」という地名がつけられたと説明している
    kind: fact
    level: E2
    status: established
    sources:
    - h1-fuchu-tokyo-plan
    - h1-fuchu-tokyo-remains
  - text: 府中市の保存管理計画は、平安時代中期の『和名類聚抄』に武蔵国府が「多麻郡」に在ると記されていることを紹介し、これをもとに国府所在地の検討が重ねられてきたとする
    kind: fact
    level: E2
    status: established
    sources:
    - h1-fuchu-tokyo-plan
  - text: 国府の厳密な中心（国庁）の位置は現在も明らかになっておらず、大國魂神社東側の「京所」と呼ばれる一帯にあることはまず間違いないと府中市は述べている
    kind: fact
    level: E2
    status: established
    sources:
    - h1-fuchu-tokyo-remains
  - text: 江戸時代には甲州街道の宿場町「府中宿」として栄え、明治以降は郡役所が置かれるなど多摩地域の中心であった
    kind: fact
    level: E2
    status: established
    sources:
    - h1-fuchu-tokyo-history
  - text: 昭和29年（1954年）4月1日、北多摩郡府中町と多磨村・西府村の1町2村が合併して府中市が誕生した
    kind: fact
    level: E2
    status: established
    sources:
    - h1-fuchu-tokyo-history
    - h1-jk-chimei-61
  - text: （共通する層）広島県府中市とは読み・表記が同一で、ともに律令制の国府（こちらは武蔵国府、相手は備後国府）の所在地に由来する「府中」である点で共通する
    kind: fact
    level: E3
    status: established
    sources:
    - h1-jk-chimei-61
  - text: （異なる層）両市の成立は広島県府中市が1954年3月31日、東京都府中市が翌4月1日と1日違いであり、全国で表記が同一の市名は府中市と伊達市の2組だけであると日本歴史地名大系ジャーナルは指摘する
    kind: fact
    level: E3
    status: established
    sources:
    - h1-jk-chimei-61
  - text: 大國魂神社の例大祭「くらやみ祭」は、国府の祭りを起源とする伝統を受け継ぐ祭りであると伝えられている
    kind: legend
    level: E2
    status: established
    sources:
    - h1-fuchu-tokyo-vision
  column:
    title: 1日違いで生まれた、2つの府中市
    text: 広島県府中市と東京都府中市は、1954年3月31日と4月1日、わずか1日違いで誕生しました。日本歴史地名大系ジャーナルによれば、当時は既存市と同名の市を避ける空気があったものの、武蔵国府と備後国府という古代以来の由緒を背負う両府中町は、どちらも名前を譲らなかったのではないかと筆者は推測しています（この動機づけは筆者の想像として紹介されています）。国府の中心にあった大國魂神社は武蔵国の総社で、その例大祭「くらやみ祭」は今も国府の祭りの伝統を伝えるとされます。同じ名前は偶然ではなく、「国の都」が日本各地に置かれたことの名残なのです。
    sources:
    - h1-jk-chimei-61
    - h1-fuchu-tokyo-vision
  relations:
  - pref/13
  - muni/34-府中市
  - muni/34-府中町
  unknowns:
  - 武蔵国庁の正確な位置（大國魂神社東側の京所一帯とされるが、市公式も「まだ明らかになっていない」と明記）
  - 「府中」という語の文献上の初出の特定は未了（本レコードの初出は国府所在地の記録としての和名類聚抄）
  - 1954年の市制施行時に同名回避の指導が実際にあったかどうかは、日本歴史地名大系ジャーナルも筆者の推測としており未確定
  updated: '2026-11-13'
- id: muni/13-新宿区
  code: '131041'
  names:
    ja: 新宿区
    reading: しんじゅくく
    aliases:
    - 内藤新宿
    - 四谷区
    - 牛込区
    - 淀橋区
  user_terms:
  - 新宿の名前の由来
  - 内藤新宿とは何か
  - 新宿区はいつできた
  - 都庁はなぜ新宿にある
  - 都庁所在地は新宿区か東京か
  naming_type: 一部の地名
  prefecture: 東京都
  homonyms: []
  summary: 新宿は、甲州街道に新しく設けられた宿場「内藤新宿」に由来する。元禄11年（1698年）、高遠藩主内藤家の屋敷地に宿場が開かれ、その「新しい宿」が地名になった。昭和22年（1947年）に四谷区・牛込区・淀橋区が合併して新宿区が成立し、平成3年（1991年）には東京都庁が西新宿に移転して、都庁が所在する特別区となっている。
  first_attestation:
    era: 元禄11年
    year_western: 1698
    document: 内藤新宿の開設（新宿区公式「区名の由来」ほかが紹介）
    note: 宿場の設置そのものが命名の出来事。宿場があったのは現在の新宿駅の位置ではなく、新宿通り沿いの現在の新宿一・二丁目あたりで、中心の位置は現在の繁華街と少しずれている
  claims:
  - text: 新宿区公式によれば、甲州街道は日本橋から最初の宿場である高井戸までの距離が長く旅人が難儀していたため、名主・高松喜六らの願いにより、その中間の地に宿場の設置が認められた
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-shinjuku-city
  - text: 新宿区の資料によれば、元禄11年（1698年）に新しい宿場の設置が認められ、内藤氏が幕府に返上した屋敷地に置かれたことから「内藤新宿」と呼ばれ、これが新宿の地名の起こりとなっている
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-shinjuku-doboku
    - b-cap-shinjuku-gaiyo
  - text: 新宿区の資料によれば、内藤新宿の宿場町は現在の新宿一・二丁目の新宿通りにほぼ沿った形で広がっており、南側には内藤家下屋敷（現在の新宿御苑）があった。つまり宿場の中心は、現在の新宿駅周辺ではなく東寄りにあった
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-shinjuku-doboku
  - text: 国立国会図書館の展示によれば、内藤新宿は江戸四宿の1つで、明治18年（1885年）に日本鉄道の新宿駅が、もとの宿場の中心から数百メートル離れた場所に開設された
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-shinjuku-ndl
  - text: 新宿区公式によれば、現在の新宿区は昭和22年（1947年）3月15日に、かつての四谷区・牛込区・淀橋区が統合して成立した
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-shinjuku-gaiyo
  - text: 東京都公式FAQによれば、東京都庁は平成3年（1991年）4月1日に、千代田区丸の内（現在の東京国際フォーラムの場所）から現在の新宿区西新宿に移転した。新宿区は市ではなく地方自治法上の特別区であり、本レコードで「都庁所在地」と呼ぶのは、都庁（本庁舎）が物理的に所在する基礎自治体という意味である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-tokyo-syozaichi
  - text: 総務省の全国地方公共団体コードで、新宿区のコードは131041と定められている（J-LISの東京都内市町村一覧による）
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-shinjuku-jlis
  column:
    title: 宿場と駅は、数百メートルずれている
    text: 「新宿」の中心は、時代とともに西へ動いてきた。内藤新宿の宿場町は今の新宿一・二丁目、新宿通り沿いにあり、その南には内藤家の下屋敷（現在の新宿御苑）が広がっていた。1885年にできた鉄道の新宿駅は、宿場の中心から数百メートル離れた場所に置かれ、繁華街の重心は駅のほうへ移った。現在の都庁も西新宿にある。地名は江戸の宿場から受け継いだが、地名の指す「中心」は300年で少しずつ西へずれ続けたことになる。
    sources:
    - b-cap-shinjuku-doboku
    - b-cap-shinjuku-ndl
  relations:
  - pref/13
  unknowns:
  - 「内藤新宿」の文字列が現れる最古の文書は、本バッチでは特定できなかった
  - 東京都は「都庁所在地」という概念自体に公式の定義を置いておらず、都公式FAQも「都庁の所在地」（住所）に答える形のため、「新宿区が都庁所在地である」と断定する一次的な根拠は存在しない。本レコードでは都庁の物理的所在地をもって扱った
  - 内藤新宿の開設が元禄11年（1698年）か元禄12年（1699年）かは資料により表記の揺れがあり（新宿区広報は1699年開設とする）、本バッチでは区の概要資料の1698年を採用したが、設置認可と開設の段階差の可能性がある
  updated: '2026-11-13'
- id: muni/14-横浜市
  code: '141003'
  names:
    ja: 横浜市
    reading: よこはまし
    aliases:
    - 横浜村
    - 横浜新田
  user_terms:
  - 横浜の名前の由来
  - 横浜はなぜ横浜と呼ぶ
  - 横に長い浜って本当
  - 開港前の横浜村
  - 神奈川県なのに県庁は横浜
  naming_type: 一部の地名
  prefecture: 神奈川県
  homonyms: []
  summary: 横浜は、入り江に横に長く突き出た砂浜を指した地名だと横浜市の論考は説明する。その砂浜にあった横浜村は戸数100戸ほどの漁村だったが、安政6年（1859年）の開港で国際港のまちとなり、明治22年（1889年）の市制施行で村の名がそのまま市名に継承された。
  first_attestation:
    era: 江戸時代
    year_western: null
    document: 横浜村（横浜市中区の歴史年表が紹介する村名）
    note: 「横浜」の名が現れる最古の文書は本バッチでは未特定。18世紀には横浜新田と洲干を合わせた横浜村として存在し、安政元年（1854年）の日米和親条約の交渉地として国際的な記録に現れる
  claims:
  - text: 横浜市の調査季報に収録された論考によれば、かつての大岡川が注いでいた洲乾湊（すがんみなと）が江戸湾に接する部分に、石川郷の台地から横に長く突き出た砂浜があり、それが元々の「横浜」であった
    kind: fact
    level: E2
    status: contested
    sources:
    - b-cap-yoko-kiyou
  - text: 横浜市中区の歴史年表によれば、18世紀になると洲干（洲乾）の付け根に隣接する海岸が埋め立てられて横浜新田が造成され、この横浜新田と洲干を合わせて横浜村といい、その頃は100戸ほどの寒村であった
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-yoko-naka-nenpyo
  - text: 横浜市の開港150周年基本計画によれば、安政元年（1854年）、日米和親条約の締結場所として一寒村に過ぎなかった横浜村が選ばれた
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-yoko-kaiko-plan
  - text: 横浜市公式によれば、日米修好通商条約では神奈川に開港場が置かれることとされたが、実際に開港したのは神奈川宿の東南約4キロにあった横浜であり、安政6年（1859年）7月1日（旧暦6月2日）に横浜が開港した。条約が名指した地名と、実際に開かれた港の地名にはずれがある
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-yoko-kaiko-plan
    - b-cap-yoko-kaiko150
  - text: 横浜市中区の歴史年表によれば、明治22年（1889年）に市制が施行され、横浜市が誕生した
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-yoko-naka-nenpyo
  - text: 横浜市公式によれば、開港前の横浜は戸数100戸ほどの小さな村であり、開港を契機に海外の窓口として技術・文化・人が集まる港を中心に発展し、現在の大都市が築かれた
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-yoko-kaiko150
  - text: 総務省の全国地方公共団体コードで、横浜市のコードは141003と定められている（J-LISの神奈川県内市町村一覧による）
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-yoko-jlis
  column:
    title: 条約には「神奈川」と書かれたのに
    text: 1858年の日米修好通商条約が開港場として名指したのは「神奈川」だった。ところが幕府が実際に開港場を整えたのは、東海道の宿場町・神奈川宿から約4キロ離れた寒村の横浜である。街道の往来と外国人を切り離す狙いがあったとされるこの置き換えの結果、港の名は「横浜」が世界に知られ、県の名には条約どおりの「神奈川」が残った。横浜市と神奈川県という、港と県で名前が食い違う現在の姿は、この1859年のずれがそのまま化石になったものといえる。
    sources:
    - b-cap-yoko-kaiko-plan
    - b-cap-yoko-kiyou
  relations:
  - pref/14
  unknowns:
  - 「横浜」の名が現れる最古の文書は本バッチでは特定できなかった。室町時代の用例が指摘されることがあるが、一次資料で確認できていない
  - 「横に長い浜」説以外の語源説は、本バッチでは専門文献で確認できなかった
  - 開港場を神奈川から横浜に置いた幕府の判断理由については諸説があり、本バッチでは市の公式資料の範囲を超えて断定していない
  updated: '2026-11-13'
- id: muni/15-新潟市
  code: '151009'
  names:
    ja: 新潟市
    reading: にいがたし
    aliases:
    - 新潟町
    - 新潟区
    - 新潟湊
  user_terms:
  - 新潟市の名前の由来
  - 新潟市はなぜ新潟というのか
  - 開港5港の新潟
  - 新潟と沼垂の関係
  naming_type: 一部の地名
  prefecture: 新潟県
  homonyms: []
  summary: 市名は信濃川河口の港町「新潟町」の名をそのまま受け継いだものである。「新潟」は、古くからの湊である蒲原・沼垂に対して新しく開けた湊を意味する名と考えられている。明治22年（1889）の市制施行で新潟区から新潟市が発足し、市名は県名にもなった港町の名がそのまま市名となった。
  first_attestation:
    era: 永禄11年
    year_western: 1568
    document: 上杉輝虎（謙信）書状
    note: 市名の元になった港町名「新潟」の表記が確認できる初期の用例（新潟県立図書館の解説が紹介）。さらに古い用例として永正17年（1520）の『越後過去名簿』の「新方」がある
  claims:
  - text: 永禄11年（1568）の上杉輝虎（後の謙信）の手紙の中に「新潟」という表記が見え、これが港町名「新潟」の初期の確認例とされる
    kind: fact
    level: E2
    status: established
    sources:
    - c-niigata-lib
  - text: 「新」は、周辺の蒲原・沼垂という7〜8世紀の文献にも出てくる古い湊に比べて新しい湊であることを示すと考えられている
    kind: fact
    level: E2
    status: established
    sources:
    - c-niigata-lib
  - text: 新潟市公式は、延長5年（927）の『延喜式』に載る越後国の国津「蒲原津」を文献に現れる最初の新潟港としており、河口部の湊の歴史は平安時代に遡る
    kind: fact
    level: E2
    status: established
    sources:
    - c-cap-niigata-port
  - text: 新潟湊は江戸時代に北前船の日本海側最大級の寄港地として栄え、安政5年（1858）の修好通商条約では函館・横浜・神戸・長崎とともに開港5港の一つに指定された
    kind: fact
    level: E2
    status: established
    sources:
    - c-cap-niigata-shisei
  - text: 明治12年（1879）に新潟町ほかの区域をもって新潟区が置かれ、明治22年（1889）4月1日の市制施行により新潟区から新潟市が発足した
    kind: fact
    level: E2
    status: established
    sources:
    - c-cap-niigata-kita
  - text: 信濃川を挟んで対岸にあった沼垂町とは川の中州の帰属をめぐって争いが続き、元禄12年（1699）の幕府裁定（元禄の湊訴訟）で島の支配権は新潟町のものとなった
    kind: fact
    level: E2
    status: established
    sources:
    - c-cap-niigata-ryusaku
  - text: 大正3年（1914）4月1日、沼垂町が新潟市に編入され、対岸同士で競い合ってきた二つの湊町が一つの市になった
    kind: fact
    level: E4
    status: established
    sources:
    - c-cap-niigata-uub
  - text: 総務省の全国地方公共団体コードで、新潟市の団体コードは151009と定められている
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 対岸のライバル同士が、一つの市になった
    text: 信濃川の河口には、左岸の新潟町と右岸の沼垂町という二つの湊町が向かい合っていました。川が運ぶ土砂で中州ができては姿を変える土地で、両町は島の取り合いを繰り返し、元禄12年（1699）には幕府の裁定（元禄の湊訴訟）にまで発展しました。ところが大正3年（1914）、沼垂町は新潟市に編入されます。何世紀も川を挟んで競い合ったライバル同士が、同じ市の住民になったのです。今も信濃川の両岸に古い町並みの名残が残り、二つの湊の記憶を伝えています。
    sources:
    - c-cap-niigata-ryusaku
    - c-cap-niigata-uub
  relations:
  - pref/15
  unknowns:
  - 「新潟」の「新」が新しい潟そのものを指すのか、新しく作られた港町を指すのかは決着していない（県レコードでも対立として記録）
  - 蒲原津の正確な所在地は、現在の新潟市域の河口部に比定されるが地点の特定はできていない
  - 沼垂町編入（1914）の経緯について、市公式年表での直接確認は次回に回した（変遷情報サイトの整理に基づく）
  updated: '2026-11-13'
- id: muni/16-富山市
  code: '162019'
  names:
    ja: 富山市
    reading: とやまし
    aliases:
    - 富山町
    - 外山郷
    - 富山城下
  user_terms:
  - 富山市の名前の由来
  - 富山市はなぜ富山というのか
  - 外山と富山の違い
  - 富山市が2005年に合併した経緯
  naming_type: 合併新設
  prefecture: 富山県
  homonyms: []
  summary: 現在の富山市は、平成17年（2005）に旧富山市と周辺6町村の新設合併で発足した自治体だが、市名自体は明治22年（1889）の市制施行以来のもので、富山藩の城下町「富山」の名を受け継いでいる。その「とやま」は室町期の郷名「外山郷」に遡り、「富山」の字は戦国期以降に広がった。
  first_attestation:
    era: 応永5年
    year_western: 1398
    document: 吉見詮頼寄進状
    note: 「富山」ではなく「外山郷（越中国外山郷地頭職）」という表記での初見（富山市郷土博物館蔵）
  claims:
  - text: 応永5年（1398）5月3日の吉見詮頼寄進状に「越中国外山郷地頭職」とあり、「とやま」の文献上の初見は「外山」の表記だった
    kind: fact
    level: E2
    status: established
    sources:
    - c-toyama-joka
  - text: 「外山」の語源については、呉羽山の外側に位置することによるとする説のほか、深山に対する外山とする説などもあり、確定していない
    kind: fact
    level: E3
    status: contested
    sources:
    - c-toyama-weblio
  - text: もとは藤井村と称された地が、真言宗の藤井山富山（ふせん）寺にちなんで富山と改称したという伝承が『三州志』などに伝えられる
    kind: legend
    level: E3
    status: established
    sources:
    - c-toyama-joka
  - text: 「富山」という表記は戦国時代に現れ、江戸時代には「外山」と「富山」の両表記が使われた
    kind: fact
    level: E2
    status: established
    sources:
    - c-toyama-weblio
  - text: 明治22年（1889）4月1日に市制が施行されて富山市が誕生した。当時の人口は約5万7千人で、日本海側では金沢に次ぐ規模であり、明治29年の調べでは全国14位の人口だった
    kind: fact
    level: E2
    status: established
    sources:
    - c-cap-toyama-museum
  - text: 初代富山市長には、旧富山藩主・前田家の前田則邦（富山藩9代藩主の孫）が任命され、藩政期との人的な連続があった
    kind: fact
    level: E2
    status: established
    sources:
    - c-cap-toyama-museum
  - text: 現在の富山市は、平成17年（2005）4月1日に旧富山市・大沢野町・大山町・八尾町・婦中町・山田村・細入村の7市町村が新設合併して発足した自治体であり、市名は1889年以来の「富山市」を受け継いだ
    kind: fact
    level: E4
    status: established
    sources:
    - c-cap-toyama-uub
  - text: 総務省の全国地方公共団体コードで、富山市の団体コードは162019と定められている
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 藩主の孫が、初代市長になった
    text: 明治22年（1889）に富山市が誕生したとき、初代市長に選ばれたのは旧富山藩主・前田家の前田則邦でした。当時の市長は市民の直接選挙ではなく、市会が推した候補から内務大臣が任命する仕組みで、則邦は富山藩9代藩主の孫にあたります。廃藩置県から18年、まちの顔は藩主の家系から選ばれたのです。しかも当時の富山市は人口約5万7千人、日本海側では金沢に次ぐ大都市で、人口では全国14位（明治29年）という存在感がありました。
    sources:
    - c-cap-toyama-museum
  relations:
  - pref/16
  unknowns:
  - 「外山」から「富山」へ字が替わった正確な時期と理由は確定していない（県レコードでも未確認として記録）
  - 外山郷の成立時期は特定できていない
  - 2005年の新設合併の経緯（合併協議の公式記録）については市公式資料での直接確認は未了
  updated: '2026-11-13'
- id: muni/16-朝日町
  code: '163431'
  names:
    ja: 朝日町
    reading: あさひまち
    aliases: []
  user_terms:
  - 朝日町の名前の由来
  - 富山の朝日町は朝日岳にちなむ
  - 朝日町は山形と富山と三重にある
  naming_type: 合併新設
  prefecture: 富山県
  homonyms:
  - muni/06-朝日町
  - muni/24-朝日町
  summary: 昭和29年（1954年）8月に泊町・大家庄村・山崎村・南保村・五箇荘村・宮崎村・境村の1町6村が合併して誕生した。町公式は「名峰朝日岳にちなんで『朝日町』と名付けられ」と由来を明示しており、3つの朝日町のうち唯一、山名由来が公式に確定している例である。同じ昭和29年の合併で生まれた山形県朝日町にも朝日岳（大朝日岳）があるが、そちらには由来の明示がない。
  first_attestation:
    era: 昭和29年
    year_western: 1954
    document: 朝日町の成立（1954年8月の合併。朝日町公式「朝日町の概要」）
    note: 自治体としての「朝日町」の初出。由来の元である朝日岳の山名自体の初出は未確認
  claims:
  - text: 昭和29年（1954年）8月、泊町・山崎村・大家庄村・南保村・五箇庄村・宮崎村・境村の1町6村が合併し、朝日町が誕生した
    kind: fact
    level: E2
    status: established
    sources:
    - h4-toyama-asahi-gaiyo
  - text: 町公式は「名峰朝日岳にちなんで『朝日町』と名付けられ」と明記しており、町名が朝日岳に由来することが公式に確定している
    kind: fact
    level: E2
    status: established
    sources:
    - h4-toyama-asahi-gaiyo
  - text: 【共通する層】山形県朝日町も同じ昭和29年（1954年）の合併で生まれ、朝日連峰の主峰・大朝日岳を擁する山麓の町である。2つの朝日町は、同じ年に生まれ、同じ読みの山の名と結びつく点で共通する
    kind: fact
    level: E2
    status: established
    sources:
    - h4-yamagata-asahi-gikai
    - h4-toyama-asahi-gaiyo
  - text: 【異なる層】ただし山名由来を公式に明示しているのは富山側だけで、山形側には同様の明示が確認できない。また三重県朝日町の「朝日」は山名ではなく、大海人皇子（天武天皇）が朝日を拝んだという故事にあやかったもので、命名の型が異なる
    kind: fact
    level: E2
    status: established
    sources:
    - h4-toyama-asahi-gaiyo
    - h4-yamagata-asahi-gikai
    - h4-mie-asahi-aramashi
  - text: 命名の背景にある泊は、江戸時代には加賀藩の統治下で境に関所が置かれた街道筋の宿場町として栄えたと町公式は説明する
    kind: fact
    level: E2
    status: established
    sources:
    - h4-toyama-asahi-gaiyo
  column:
    title: 朝日岳は2つある
    text: 富山の朝日岳と、山形の大朝日岳は、別の山である。なのに山麓の町はどちらも「朝日町」を名乗り、しかも同じ1954年に生まれた。富山側は「名峰朝日岳にちなんで」と公式に宣言していて、山への誇りがそのまま町の名になっている。同名の町が並ぶと紛らわしいが、山の名を誇る気持ちは両町に共通しているのだろう。
    sources:
    - h4-toyama-asahi-gaiyo
    - h4-yamagata-asahi-gikai
  relations:
  - pref/16
  - muni/06-朝日町
  - muni/24-朝日町
  unknowns:
  - 朝日岳の山名自体の由来（なぜ「朝日」と呼ばれるか）の確かな資料は未確認
  - 1954年11月20日の野中村編入の町公式資料での再確認は未実施
  updated: '2026-11-13'
- id: muni/17-金沢市
  code: '172014'
  names:
    ja: 金沢市
    reading: かなざわし
    aliases:
    - 金沢
    - 金沢御坊
    - 金沢町
    - 尾山
  user_terms:
  - 金沢市の名前の由来
  - 金沢は芋掘り藤五郎の話は本当か
  - 金洗いの沢とは
  - 金沢御坊と金沢の関係
  naming_type: 一部の地名
  prefecture: 石川県
  homonyms: []
  summary: 市名は城下町「金沢」の名を受け継いだもので、その初見は天文15年（1546）の『天文日記』に見える「金沢坊舎（金沢御堂）」とされる。まちは一向一揆の拠点・金沢御坊の門前から起こり、前田利家の入城後は加賀藩の城下町として発展した。砂金を洗った沢に由来するという芋掘り藤五郎の話は伝説として伝えられる。
  first_attestation:
    era: 天文15年
    year_western: 1546
    document: 天文日記
    note: 天文15年10月条の「加州金澤坊舎（金沢御堂）」が地名「金沢」の早い例とされる（『日本歴史地名大系』の説明を金沢市立図書館のレファレンス回答が紹介）。日付を10月25日とする資料と10月29日とする資料がある
  claims:
  - text: 『日本歴史地名大系』は、『天文日記』天文15年（1546）10月条に見える「金沢坊舎（金沢御堂）」を地名「金沢」の早い例として挙げている
    kind: fact
    level: E2
    status: established
    sources:
    - c-cap-kanazawa-ndl
  - text: 天文15年（1546）に金沢御堂（金沢御坊）が建立され、一向一揆の拠点とそのまわりのまちが金沢の起こりとされる
    kind: fact
    level: E2
    status: established
    sources:
    - c-cap-kanazawa-plan
  - text: 金沢御堂の廃絶後も「金沢」の名は城名や城下町の総名として引き継がれたと『日本歴史地名大系』は説明する
    kind: fact
    level: E2
    status: established
    sources:
    - c-cap-kanazawa-ndl
  - text: 芋掘り藤五郎が小立野台地の沢で芋の泥を洗ったら砂金が出たという物語が伝わり、『角川日本地名大辞典』は地名の由来を「小立野台地で砂金採掘を行った『金洗沢』によるといわれる」と記す
    kind: legend
    level: E2
    status: established
    sources:
    - c-cap-kanazawa-ndl
  - text: 城下の総名については、前田利家の時代に「尾山」と称され、文禄元年（1592）頃から再び「金沢」を号したとする記録（『金沢古蹟志』『越登賀三州志』等）があり、金沢の名が一時「尾山」に置き換わった時期があったと伝えられる
    kind: fact
    level: E2
    status: contested
    sources:
    - c-cap-kanazawa-ndl
  - text: 天正11年（1583）に前田利家が金沢城へ入城し、以後、金沢は加賀藩前田家の城下町として発展した
    kind: fact
    level: E2
    status: established
    sources:
    - c-cap-kanazawa-plan
  - text: 明治22年（1889）の市制施行以来、金沢市は近隣町村との編入・合併を重ねて市域を拡大してきた
    kind: fact
    level: E2
    status: established
    sources:
    - c-cap-kanazawa-city
  - text: 総務省の全国地方公共団体コードで、金沢市の団体コードは172014と定められている
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 金を洗った沢と、芋を掘る藤五郎
    text: 金沢の由来として一番有名なのは、芋掘り藤五郎の話でしょう。貧しい藤五郎が小立野の沢で芋についた土を洗っていると、きらきら光る砂金が混じっていて、その沢は「金洗いの沢」と呼ばれるようになり、金沢の名になった――という筋書きです。この話は江戸時代の『藤五物語』などに伝わり、『石川県史』にも収められています。ただし、史料で確かめられる「金沢」の初めは、天文15年（1546）の金沢御坊の記録です。伝説は伝説として面白く、でも地名の歴史は御坊の門前町から始まる。その両方を並べて眺めるのが、この地名の正しい楽しみ方だと思います。
    sources:
    - c-cap-kanazawa-ndl
  relations:
  - pref/17
  unknowns:
  - 『天文日記』天文15年10月条の日付は資料により25日・29日の両説があり、原本での確定は未了
  - 「金洗沢」の実在した地点（小立野台地のどの沢か）の特定はできていない
  - 「尾山」から「金沢」へ戻した正確な時期と経緯は、後世の地誌類の記述に依る部分が大きい
  updated: '2026-11-13'
- id: muni/18-池田町
  code: '183822'
  names:
    ja: 池田町
    reading: いけだちょう
    aliases:
    - 上池田村
    - 下池田村
    - 池田村
    - 池田荘
  user_terms:
  - 池田町 福井
  - 池田荘があった町
  - かずら橋のある池田町
  naming_type: 一部の地名
  prefecture: 福井県
  homonyms:
  - muni/01-池田町
  - muni/20-池田町
  - muni/21-池田町
  summary: 福井県今立郡の町。町名は中世の荘園「池田荘」の名による。その名は上池田村・下池田村という村名を経て、1955年の合併で池田村、1964年の町制で池田町となった。4つの池田町のうち、岐阜県池田町と並んで荘園名に遡る層を持つ。
  first_attestation:
    era: 中世
    year_western: null
    document: 荘園名「池田荘」としての記録
    note: 池田荘に関する池田氏発給文書（寄進状・安堵状など）が残ることが福井県史に記される。具体的な初出年は今回の調査では特定できていない
  claims:
  - text: 町名は、中世にこの地にあった荘園「池田荘」の名による
    kind: fact
    level: E3
    status: established
    sources:
    - h2-kotobank-ikedacho
  - text: 今立郡池田荘では、在地領主の池田氏が星崎城を拠点とし、天文年間に朝倉氏に滅ぼされるまで、寄進状・安堵状などの文書を発給した
    kind: fact
    level: E2
    status: established
    sources:
    - h2-fukui-kenshi
  - text: 池田氏の出自については、摂津国池田荘の出身であるとも考えられているが、確定していない
    kind: fact
    level: E2
    status: contested
    sources:
    - h2-fukui-kenshi
  - text: 1955年に上池田村と下池田村が合併して池田村となり、1964年の町制施行で池田町となった
    kind: fact
    level: E3
    status: established
    sources:
    - h2-kotobank-ikedacho
  - text: 同名の比較（共通する層）：岐阜県池田町も中世の「池田荘」に遡る点で共通する。ただし越前国今立郡の池田荘と美濃国の池田荘は別の荘園であり、直接の関係はない
    kind: fact
    level: E3
    status: established
    sources:
    - h2-kotobank-ikedacho
    - h2-kotobank-ikeda
  - text: 同名の比較（異なる層）：北海道池田町の人名由来や長野県池田町の郷名の継承とは異なり、荘園名が上池田・下池田という村名を経て町名になった。読みは「いけだちょう」
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
    - h2-kotobank-ikedacho
  column:
    title: 池田氏が、池田荘にやってきた
    text: 福井県史によれば、この地を治めた池田氏は、摂津国池田荘の出身であるとも考えられているという。つまり「池田」という姓の武士が、たまたま同じ「池田」という名の荘園の領主になった可能性がある。姓と地名のどちらが先かははっきりしないが、同名の偶然が重なって、荘園の名は21世紀の町名にまで生き延びた。
    sources:
    - h2-fukui-kenshi
  relations:
  - pref/18
  - muni/01-池田町
  - muni/20-池田町
  - muni/21-池田町
  unknowns:
  - 池田荘の成立時期と初出文書は未確認
  - 上池田村・下池田村の成立時期は未確認
  updated: '2026-11-13'
- id: muni/18-福井市
  code: '182010'
  names:
    ja: 福井市
    reading: ふくいし
    aliases:
    - 福井町
    - 北ノ庄
    - 北庄
    - 福居
  user_terms:
  - 福井市の名前の由来
  - 福の井は本当か
  - 北ノ庄から福井への改名
  - 福居と福井の違い
  naming_type: 一部の地名
  prefecture: 福井県
  homonyms: []
  summary: 市名は福井藩の城下町「福井」の名を受け継いだものである。もとの地名「北ノ庄」は寛永元年（1624）の松平忠昌の代に改められたが、まず「福居」と改められ元禄頃に「福井」となったとする説が有力で、天守台の井戸「福の井」に由来するとする説は県立図書館の検証では誤りと位置づけられている。明治22年（1889）に市制が施行されて福井市となった。
  first_attestation:
    era: 寛永元年
    year_western: 1624
    document: 越前国名跡考
    note: 寛永元年7月19日の松平忠昌入城の頃より改められたとする後世の地誌の記事。改められた字が直ちに「福井」だったか「福居」だったかには対立がある（県レコードと同一の記録）
  claims:
  - text: 現在の福井市中心部は室町時代から北の庄（北ノ庄）と呼ばれ、柴田勝家の城づくりからまちづくりが始まり、結城秀康の入封後は福井藩の城下町として整備された
    kind: fact
    level: E2
    status: established
    sources:
    - c-cap-fukui-enkaku
  - text: 福井市の公式沿革は、地名について「北庄から福居となり、3代藩主忠昌のとき、福井と改められた」と略述している
    kind: fact
    level: E2
    status: established
    sources:
    - c-cap-fukui-enkaku
  - text: 改名の時期については、1624年に直ちに「福井」となったとする説明と、まず「福居」と改められ1700年頃に「福井」となったとする説が対立しており、福井県立図書館のレファレンス回答は後者を有力とする
    kind: fact
    level: E2
    status: contested
    sources:
    - c-ndl-fukui
  - text: 天守台の井戸「福の井」が福井の名の由来だとする説は広く語られるが、『福井県の地名』等に基づくレファレンス回答はこの説を誤りと位置づけている
    kind: legend
    level: E2
    status: contested
    sources:
    - c-ndl-fukui
  - text: 「福の井」自体は福井城天守台に現存する井戸であり、県が史跡の案内資料で紹介している実在の遺構である
    kind: fact
    level: E2
    status: established
    sources:
    - c-fukui-fukunoi
  - text: 明治22年（1889）に市制が施行されて福井市が発足した
    kind: fact
    level: E2
    status: established
    sources:
    - c-cap-fukui-enkaku
  - text: 総務省の全国地方公共団体コードで、福井市の団体コードは182010と定められている
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 井戸は本物、由来は別物
    text: 福井城の天守台には「福の井」と呼ばれる井戸が今も残っていて、市の公式沿革も「北庄から福居となり、忠昌のときに福井と改められた」と手短に説明します。ところが県立図書館や県文書館の検証では、忠昌が改めたのはまず「福居」で、「福井」の表記が定まるのは1700年頃とみるのが有力とされ、福の井由来説は誤りとされています。福井市の名前は、実在の井戸の分かりやすさに引っ張られてきた面があるのです。井戸は本物でも、由来の話は別――市のレコードでも県のレコードでも、この線引きは崩さずに記録しています。
    sources:
    - c-ndl-fukui
    - c-fukui-fukunoi
  relations:
  - pref/18
  unknowns:
  - 「福居」から「福井」への表記移行の正確な時期を示す同時代文書は特定できていない（県レコードと同一の未確認事項）
  - 改名の理由とされる「北の字が敗北に通じるため」という説明の同時代史料での裏付けは未了
  - 福井市の公式沿革の略述（忠昌のときに福井）と県側資料の有力説（1700年頃に福井）の間の説明の差は、市・県の公表資料の間でも解消されていない
  updated: '2026-11-13'
- id: muni/18-美浜町
  code: '184420'
  names:
    ja: 美浜町
    reading: みはまちょう
    aliases:
    - 耳村
    - 山東村
    - 南西郷村
    - 北西郷村
  user_terms:
  - 福井の美浜町の由来
  - 美浜町はなぜ美浜という名前か
  - 原発のある美浜町
  naming_type: 合併新設
  prefecture: 福井県
  homonyms:
  - muni/23-美浜町
  - muni/30-美浜町
  summary: 昭和29年（1954）に若狭湾に面した4村の合併で生まれた新設町。町名の説明は「各村に美しい浜があることから」とする地名資料と、「弥美の『美』と砂浜の『浜』の合成」とする説に分かれており、命名理由は確定していない。同名の愛知県・和歌山県の美浜町とは、同時期の合併で生まれた「美しい浜」型の命名という点で響き合うが、成立事情はそれぞれ別である。
  first_attestation:
    era: 昭和29年
    year_western: 1954
    document: 美浜町の発足（町村合併・町制施行）
    note: 町名は合併時に新たに付けられたもので、それ以前に「美浜」を名乗る自治体はなかった。名前の初出は命名そのもの
  claims:
  - text: 昭和29年（1954）2月11日に旧耳村・山東村・南西郷村・北西郷村の4か村が合併し、美浜町が誕生した
    kind: fact
    level: E2
    status: established
    sources:
    - h5-fukui-mihama-70th
  - text: 町域は若狭湾に面し、白い砂浜の水晶浜や三方五湖の久々子湖を抱える海岸の町である
    kind: fact
    level: E2
    status: established
    sources:
    - h5-fukui-mihama-intro
  - text: 町名は、合併各村がいずれも若狭湾に面して美しい浜があることから名付けられたと、地名研究サイト「丹後の地名」は説明する
    kind: fact
    level: E4
    status: contested
    sources:
    - h5-fukui-mihama-tango
  - text: 一方で、町名は「弥美（みみ）の『美』と砂浜の『浜』を合成した」とする説明もあり、命名の由来は資料によって説明が分かれる
    kind: fact
    level: E5
    status: contested
    sources:
    - h5-fukui-mihama-wiki
  - text: 共通する層として、同名の愛知県美浜町（1955年成立）・和歌山県美浜町（1954年成立）も昭和の大合併期に合併で生まれた新設町であり、旧自治体名「美浜」を継承した町は3町のうち一つもない
    kind: fact
    level: E2
    status: established
    sources:
    - h5-aichi-mihama-gaiyo
    - h2-hidaka-wakayama-manabi
  - text: 異なる層として、愛知・和歌山では「美しい浜」にちなむ命名が辞典・県資料で明示されるのに対し、福井では旧地名の字の合成とする説が併存し、3町の中で命名理由の確定度が最も低い
    kind: fact
    level: E4
    status: contested
    sources:
    - h5-fukui-mihama-tango
    - h5-fukui-mihama-wiki
  - text: 総務省の全国地方公共団体コードで、美浜町の団体コードは184420と定められている
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 名前の理由は割れても、「美（うま）し美浜」と名乗り続ける町
    text: 福井の美浜町は、町名の由来の説明が資料によって分かれる珍しい町です。それでも町自身は、キャッチフレーズに「美（うま）し美浜」を掲げ、「美」の字を「美しい」と「うまい（おいしい）」の両方に読ませています。平成17年（2005）には鯖のへしこを看板にした「へしこの町」を宣言しました。由来の確定は今後の町史確認に残りますが、「美」という一文字を海の景色と食の両方に広げて使い続ける町の姿勢は、命名の不確かさを補って余りある自己紹介になっています。
    sources:
    - h5-fukui-mihama-intro
  relations:
  - pref/18
  - muni/23-美浜町
  - muni/30-美浜町
  unknowns:
  - 町名の命名理由について町の公式サイト・町勢要覧は明記しておらず、「美しい浜」説と「弥美＋砂浜」合成説のどちらが『美浜町誌』等の町史の記述かは未確認
  - 合成説の「弥美（みみ）」が何を指す地名か（合併村の一つ耳村（みみ）との関係を含む）は未確認
  - 命名が公募だったかどうかなど、1954年当時の選定過程の記録は未確認
  updated: '2026-11-13'
- id: muni/19-南部町
  code: '193666'
  names:
    ja: 南部町
    reading: なんぶちょう
    aliases:
    - 南部郷
    - 南部村
  user_terms:
  - 南部町の名前の由来
  - 南部氏発祥の地
  - 南部三郎光行の地名
  naming_type: 合併新設
  prefecture: 山梨県
  homonyms:
  - muni/02-南部町
  - muni/31-南部町
  summary: 甲斐国南部郷の地で、南部三郎光行がこの地を与えられて「南部の地名を姓とした」ことが町の説明する南部氏の始まり。現在の町は1955年に発足した旧南部町と富沢町が2003年に合併して生まれ、旧南部町の名を継いだ。青森県南部町とは発祥地と移転先の関係にあり、鳥取県南部町とは由来を共有しない。
  first_attestation:
    era: 鎌倉時代初期
    year_western: null
    document: 南部郷（甲斐国巨摩郡。光行が領して南部氏を称した地と町公式が説明する）
    note: 郷名としての文書上の初出年は未確認。明治初年の町村再編では、旧南部町の区域を構成した11村の中に南部村があったことが町の概要に見える
  claims:
  - text: 町の観光サイトは、本町が南部氏発祥の地であり、加賀美遠光の三男・南部三郎光行がこの地を領して「南部の地名を姓とした」ことに始まると説明する。町の総合計画も、南部氏の名称の由来は光行がこの地を与えられて南部氏と称したことに始まると記す
    kind: fact
    level: E2
    status: established
    sources:
    - h3-yamanashi-yukari
    - h3-yamanashi-plan
  - text: 町の概要は、源頼朝に従い戦功のあった光行が南部を与えられてこの地を領し、その後奥州に移って糠部五郡を与えられ南部藩を築いたと記す
    kind: fact
    level: E2
    status: established
    sources:
    - h3-yamanashi-gaiyou
  - text: 昭和30年（1955年）に南部町と富沢町が誕生し、平成15年（2003年）3月1日に両町が合併して新「南部町」が発足した。現在の町名は旧南部町の名の継承である
    kind: fact
    level: E2
    status: established
    sources:
    - h3-yamanashi-gaiyou
  - text: 青森県南部町とは同じ南部氏を介する共通の層を持つが、こちらは姓の由来となった地そのものであり、青森側は一族の移転先である点で異なる
    kind: fact
    level: E2
    status: established
    sources:
    - h3-yamanashi-yukari
    - h3-yamanashi-gaiyou
  - text: 鳥取県南部町の「南部」は南部氏と関係のない地域名の採用であり、本町の「南部」とは由来を共有しない
    kind: fact
    level: E2
    status: established
    sources:
    - h3-tottori-gikai
  - text: 総務省「地方公共団体コード一覧」では本町のコードは193666とされる
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 姓になった地名
    text: 地名がそのまま大名の姓になった例は少なくありませんが、南部町の場合、その姓が後に奥州の大藩の名となり、発祥地と移転先の両方に同じ「南部町」が残りました。町は「南部氏発祥の地」を掲げ、光行ゆかりの地を観光資源として紹介しています。
    sources:
    - h3-yamanashi-yukari
    - h3-yamanashi-gaiyou
  relations:
  - pref/19
  - muni/02-南部町
  - muni/31-南部町
  unknowns:
  - 南部郷の文書上の初出
  - 光行が南部を与えられた正確な年
  - 2003年の合併時に旧町名「南部」を新町名とした選定理由の公式文
  updated: '2026-11-13'
