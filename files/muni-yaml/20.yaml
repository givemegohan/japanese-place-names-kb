  - muni/18-池田町
  - muni/21-池田町
  summary: 長野県北安曇郡の町。中世の池田郷の名を継承し、『親元日記』寛正6年（1465）の記事に「矢原庄池田郷」と見えるのが確認できる早い記録である。江戸時代は松本藩の池田組に属し、明治8年（1875）に池田町村、大正4年（1915）に町制施行で池田町となった。4つの池田町のうち唯一「いけだまち」と読む。
  first_attestation:
    era: 寛正6年
    year_western: 1465
    document: 『親元日記』寛正6年5月18日条（「矢原庄池田郷」）
    note: 日本歴史地名大系が紹介する形で確認した二次確認であり、原典は未読
  claims:
  - text: 池田郷は『親元日記』寛正6年（1465）5月18日の記事に「矢原庄池田郷」と見え、中世の郷名として確認できる
    kind: fact
    level: E3
    status: established
    sources:
    - h2-kotobank-ikedamachi
  - text: 江戸時代を通じて松本藩領の池田組に属し、明治8年（1875）に池田町村となった
    kind: fact
    level: E3
    status: established
    sources:
    - h2-kotobank-ikedamachi
  - text: 大正4年（1915）に町制を施行して池田町となり、昭和30年（1955）に会染村と合併して現在の池田町となった
    kind: fact
    level: E2
    status: established
    sources:
    - h2-ikeda-nagano-gaiyo
  - text: 原初の池田の集落は、東南の「馬の口」と呼ばれる場所の近くにあったと伝えられる
    kind: legend
    level: E3
    status: indeterminate
    sources:
    - h2-kotobank-ikedamachi
  - text: 「池田」という名の語源については、確認した公式・専門資料の範囲では説明が見当たらず、確定できない
    kind: fact
    level: E3
    status: indeterminate
    sources:
    - h2-kotobank-ikedamachi
    - h2-ikeda-nagano-gaiyo
  - text: 同名の比較（異なる層）：中世の郷名の継承であり、荘園名に遡る福井県・岐阜県の池田町、人名に由来する北海道池田町とは成り立ちが異なる
    kind: fact
    level: E3
    status: established
    sources:
    - h2-kotobank-ikedamachi
  - text: 同名の比較（異なる層）：読みは「いけだまち」で、他の3つの池田町（すべて「いけだちょう」）と異なる、4件中で唯一の「まち」読みである
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 1465年の日記に残る、郷の名のままの町
    text: 池田郷の名は、室町時代の日記『親元日記』の1465年の記事にすでにある。荘園の名でも人名でもなく、在地の小さな郷の名が、村・町と姿を変えながら550年以上そのまま使われ続けてきた。しかも全国4つの池田町の中で、ここだけが「ちょう」ではなく「まち」と読む。古い地名ほど静かに残る、という好例である。
    sources:
    - h2-kotobank-ikedamachi
    - b-cap-chiba-soumu-code
  relations:
  - pref/20
  - muni/01-池田町
  - muni/18-池田町
  - muni/21-池田町
  unknowns:
  - 「池田」の語源（池と田の地形名に由来するか等）は、確認した資料の範囲では説明がなく未確認
  - 池田郷の成立時期（1465年より前の記録）は未確認
  updated: '2026-11-13'
- id: muni/20-茅野市
  code: '202142'
  names:
    ja: 茅野市
    reading: ちのし
    aliases:
    - ちの町
    - 永明村
  user_terms:
  - ちのし
  - 縄文のビーナスのまち
  - 八ヶ岳の玄関口
  - 茅野の名前の由来
  naming_type: 一部の地名
  prefecture: 長野県
  homonyms: []
  summary: 茅野市は八ヶ岳山麓の市で、市名「茅野」は茅（かや）の生える野という意味で、もとは旧村の一地名だった。1905年に開設された茅野駅の名が全国的に知られるようになり、駅名が町名となり、やがて市の名になった。1948年には永明村が「ちの町」と改称し、日本で最初の平仮名の自治体名となった時期がある。縄文時代の国宝土偶「縄文のビーナス」「仮面の女神」を出土した遺跡の地でもある。
  first_attestation:
    era: 明治38年
    year_western: 1905
    document: 中央本線 茅野駅の開設
    note: 地名としての初出ではなく、「茅野」の名が駅名として全国に知られる契機となった年。もとは旧村の一地名とされるが、その初出は未確認
  claims:
  - text: 茅野市統計書の「市名の由来」によれば、「茅野」は茅（かや）の生える野という意味で、もとは旧村の一地名だった
    kind: fact
    level: E2
    status: established
    sources:
    - v2-chino-tokei
  - text: 明治38年（1905年）に鉄道中央本線が開通して茅野駅が開設されて以来、駅名が全国的に有名になったことなどから、駅名を町名にし、その後市の名前になった（茅野市統計書の「市名の由来」による）
    kind: fact
    level: E2
    status: established
    sources:
    - v2-chino-tokei
  - text: 昭和23年（1948年）5月3日に永明村が町制を施行し、「ちの町」と改称した。これは日本で最初の平仮名の自治体名とされる
    kind: fact
    level: E2
    status: established
    sources:
    - v2-chino-tokei
  - text: 同じ改称の際に、駅前の地区の区称は「茅野町」と改められており、漢字の「茅野」は駅と駅前地区の名として残った
    kind: fact
    level: E2
    status: established
    sources:
    - v2-chino-tokei
  - text: 昭和30年（1955年）2月1日に1町8ヵ村が合併して茅野町となり、昭和33年（1958年）8月1日の市制施行により茅野市が誕生した
    kind: fact
    level: E2
    status: established
    sources:
    - v2-chino-tokei
  - text: 棚畑遺跡から昭和61年（1986年）に発掘された土偶「縄文のビーナス」は、平成7年（1995年）6月に縄文時代の土偶として初めて国宝に指定された
    kind: fact
    level: E2
    status: established
    sources:
    - v2-chino-tokei
  - text: 中ッ原遺跡から平成12年（2000年）に出土した土偶「仮面の女神」も、平成26年（2014年）8月に国宝に指定された
    kind: fact
    level: E2
    status: established
    sources:
    - v2-chino-tokei
  - text: 茅野市の地方公共団体コードは202142である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 日本で最初のひらがなの町名
    text: 1948年、永明村は町制を施行するにあたって、名を平仮名で「ちの町」とした。日本で最初の平仮名の自治体名とされる、大胆な改称だった。ところが合併を経て1955年に町名が決まる段になると、採用されたのは漢字の「茅野町」だった。決め手は、1905年の開設以来、全国に知られていた「茅野駅」の名である。平仮名の革新性よりも、駅名の知名度が勝った。それでも「ちの町」の7年間は、自治体の名の付け方の歴史に残る実験だった。
    sources:
    - v2-chino-tokei
  relations:
  - pref/20
  unknowns:
  - 「茅野」という地名としての初出文献を確認できなかった（旧村の一地名とされるにとどまる）
  - 茅野駅の駅名が旧村名から取られた際の選定記録を確認できなかった
  - 「茅の生える野」以外の語源説を確認できなかった
  - 尖石遺跡など縄文遺跡と地名との関係は確認できなかった（地名の層とは別に記録すべき考古学的事項）
  updated: '2026-11-13'
- id: muni/20-諏訪市
  code: '202061'
  names:
    ja: 諏訪市
    reading: すわし
    aliases:
    - 洲羽
    - 須波
    - 諏方
    - 上諏訪町
  user_terms:
  - 諏訪の名前の由来
  - すわし
  - お諏訪さまのまち
  - 諏訪湖のまち
  - 御柱のまち
  naming_type: その他（郡名・湖名・神社名に共通する古地名の継承）
  prefecture: 長野県
  homonyms: []
  summary: 「諏訪」は、諏訪湖・諏訪郡・諏訪大社に共通する古い地名で、古くは洲羽・須波・諏方などと書かれた。『古事記』の国譲り神話では、建御名方神が「州羽の海」で降参した土地とされ、その神を祀る諏訪大社の上社本宮が現在の諏訪市に鎮座する。市としては昭和16年（1941年）に上諏訪町・豊田村・四賀村の合併で市制を施行し、その際、町名ではなく地域全体の名「諏訪」が市名となった。
  first_attestation:
    era: 古代（8世紀）
    year_western: null
    document: 古事記
    note: 建御名方神が降参した地を「科野の国州羽の海」と記す国譲り神話の記事として、全国観光資源台帳が紹介するもの（原典そのものの確認はしていない）。漢字表記「諏訪」が定着した時期は未確認
  claims:
  - text: 『古事記』によると、父の大国主神と兄の事代主神が穏やかに国譲りをしたのに対し一人抵抗した建御名方神は、最後に科野（しなの）の国州羽の海（すわのうみ）で降参し、この地を出ないことで許されたと記される
    kind: legend
    level: E2
    status: established
    sources:
    - n3-suwa-jtb
  - text: 諏訪大社は諏訪湖を隔てて南北に上社と下社が鎮座し、上社は諏訪市の本宮と茅野市の前宮、下社は下諏訪町の春宮と秋宮に分かれる4社を合わせて諏訪大社となる、信濃国一之宮である
    kind: fact
    level: E2
    status: established
    sources:
    - n3-suwa-jtb
  - text: 諏訪大社の祭神は出雲系の神である建御名方神と妻の八坂刀売神で、上社は建御名方神の神裔という神（じん）氏が大祝を世襲して祀り、のちに諏訪氏と称して諏訪地方の祭政に携わった
    kind: fact
    level: E2
    status: established
    sources:
    - n3-suwa-jtb
  - text: 「諏訪」は、洲羽、須波、諏方などと書かれた古い時代もあった
    kind: fact
    level: E2
    status: established
    sources:
    - n3-suwa-yoran
  - text: 諏訪市議会の要覧は、現在の「諏訪」の字について、中国の太湖を詠じた詩の中に「雲諏波訪（雲諏い波訪う）」という景色の良さを形容する語があり、諏訪湖が太湖によく似ているためにこの詩語を取って「諏訪」と書くようになったという説を紹介している
    kind: fact
    level: E2
    status: contested
    sources:
    - n3-suwa-yoran
  - text: 昭和16年（1941年）8月10日に上諏訪町・豊田村・四賀村が合併し、諏訪市として市制を施行した（全国184番目、県下6番目）。その後、昭和30年（1955年）に中洲村・湖南村が合併し、現在の諏訪市となった
    kind: fact
    level: E2
    status: established
    sources:
    - n3-suwa-yoran
  - text: 諏訪市の地方公共団体コードは202061である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 湖を挟んで4つの社、16本の御柱
    text: 諏訪大社は一つの社ではない。諏訪湖の南東に上社（本宮・前宮）、北西に下社（春宮・秋宮）が向き合い、4社を合わせて一つの大社をなす。そして4社それぞれに4本ずつ、合計16本の御柱（おんばしら）が立っている。祭神の建御名方神は『古事記』では出雲から逃れて州羽の海で降参した神とされ、上社の大祝は、その神の子孫と称して生き神として祀られてきた。「諏訪」という一つの名が、湖と、郡と、神社と、そして市の名として重なり合っているのが、この地域の名前の積み重なりである。
    sources:
    - n3-suwa-jtb
  relations:
  - pref/20
  - muni/20-下諏訪町
  unknowns:
  - 「諏訪」の語源そのものは定かでない。市議会要覧が紹介する太湖の詩語説は市の紹介する説であり、専門辞典による裏付けは本バッチでは確認できなかった
  - 漢字表記「諏訪」がいつ定着したかは、本バッチでは確認できなかった
  updated: '2026-11-13'
- id: muni/20-軽井沢町
  code: '203211'
  names:
    ja: 軽井沢町
    reading: かるいざわまち
    aliases:
    - 軽井沢宿
    - 東長倉村
    - かるいさわ
  user_terms:
  - 軽井沢の名前の由来
  - 軽井沢のアイヌ語説は本当か
  - かるいさわ と かるいざわ の違い
  - 軽井沢の語源の諸説
  naming_type: 一部の地名
  prefecture: 長野県
  homonyms: []
  summary: 町名は碓氷峠のふもとの集落・宿場の名「軽井沢」の継承である。古くは「かるいさわ」と読まれ、明治以降に避暑地として知られるようになると「かるいざわ」に変化したとされる。語源は今日でもはっきりしておらず、渇れた沢とする説、柳田国男の「背負う」説、アイヌ語説など諸説が対立したままで、専門の論文も定説なしと評価している。大正時代に東長倉村が町制を施行して軽井沢町となった。
  first_attestation:
    era: 応永2年
    year_western: 1395
    document: 真楽寺金剛力士像の墨書銘（『信濃史料』第7巻収録）
    note: 北佐久郡軽井沢の文献上の初出として地名研究の江良武の論文が紹介するもの。「軽井沢」の名の成立は中世とみるのが妥当と論文は論じる
  claims:
  - text: 軽井沢は古くは「かるいさわ」と呼ばれ、明治以降に避暑地として広まり外国人の往来が盛んになると、発音しやすい「かるいざわ」へ変化していったといわれている
    kind: fact
    level: E4
    status: established
    sources:
    - k3-karuizawa-kanko
  - text: この地名がいつ何から起こったのかは今日でもはっきりしていないと軽井沢観光協会は述べ、「凍り冷わ（こおりさわ）」から転じたという説、「軽石沢」から来たという説、水が枯れた「かれ沢」から来たという説などを挙げている
    kind: fact
    level: E4
    status: contested
    sources:
    - k3-karuizawa-kanko
  - text: 地名研究者の江良武は、北佐久郡軽井沢の文献上の初出として応永2年（1395）の真楽寺金剛力士像後頭部の墨書銘に旦那名として見える例を挙げ、軽井沢地名の成立は中世とみてよいと論じている
    kind: fact
    level: E3
    status: established
    sources:
    - k3-karuizawa-era
  - text: 「karuはアイヌ語で軽石、iは大いなる、sawaは沢であるから『軽石の大沢』の意である」とするアイヌ語説が辞典類に紹介されているが、江良は、こうした音の類似性という直感に基づく諸説は論理に乏しいと評している
    kind: fact
    level: E3
    status: contested
    sources:
    - k3-karuizawa-era
  - text: 柳田国男は、峠では荷物を馬からおろして自分で背負って登らねばならず、中古時代に背負うことを「かるう」といったことから「かるう沢」が「かるい沢」に転じたとする説を唱えた。この説は論議の中心となって批判も受け、今日では水の枯れた沢に由来する渇沢説が有力になっているように思われると江良は述べる
    kind: fact
    level: E3
    status: contested
    sources:
    - k3-karuizawa-era
    - k3-karuizawa-kanko
  - text: 江戸時代には五街道の一つである中山道に軽井沢宿が設置され、宿場として栄えた
    kind: fact
    level: E4
    status: established
    sources:
    - k3-karuizawa-kanko
  - text: 大正時代に東長倉村が町制を施行し、軽井沢町と改称して現在に至っている
    kind: fact
    level: E4
    status: established
    sources:
    - k3-karuizawa-kanko
  - text: 総務省の全国地方公共団体コードで、軽井沢町の団体コードは203211と定められている
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 荷物を背負って越えた峠のふもと
    text: 碓氷峠は中山道最大の難所で、馬の背に荷を載せたままでは越えられず、ふもとで荷をおろし、人が背負って登ったといいます。柳田国男はここに目をつけ、背負うことを意味した古い言葉「かるう」から「かるう沢」、やがて「軽井沢」になったと考えました。地名研究の江良武はこの説への批判を整理したうえで、軽井沢型の地名の多くが街道沿いの居住地名であることは、命名が農業ではなく交通に関係したことを暗示すると指摘しています。語源の決着はついていませんが、「峠の交通が生んだ名前」という見立て自体は、軽井沢が宿場として育った歴史とよく響き合います。
    sources:
    - k3-karuizawa-era
    - k3-karuizawa-kanko
  relations:
  - pref/20
  unknowns:
  - 語源は諸説が対立したままで、専門の論文も「どれも特に有力な説とはいえない」水準の評価にとどまる
  - 1395年より前の用例の有無は確認できていない
  - 東長倉村が町制を施行して軽井沢町となった正確な年月日は、本バッチで確認した観光協会の資料では年次まで示されていない
  - アイヌ語説を最初に唱えた文献とその根拠の詳細は、論文の要約的な紹介の範囲を超えて確認できていない
  updated: '2026-11-13'
- id: muni/20-長野市
  code: '202011'
  names:
    ja: 長野市
    reading: ながのし
    aliases:
    - 長野町
    - 長野村
    - 善光寺町
  user_terms:
  - 長野市の名前の由来
  - 長野市はなぜ長野というのか
  - 善光寺と長野市の関係
  - 長野市の市制が遅かった理由
  naming_type: 一部の地名
  prefecture: 長野県
  homonyms: []
  summary: 市名は善光寺の門前町を含む長野村・長野町の名を受け継いだものである。「長野」は扇状地の長い緩やかな傾斜地を指す地形由来の地名と説明される。明治4年（1871）に県庁が長野村へ移って村名が県名になり、市制の施行は明治30年（1897）と県庁所在地としては遅めだった。
  first_attestation:
    era: 慶長6年
    year_western: 1601
    document: 善光寺文書（大久保長安等連署証文）
    note: 慶長6年9月16日付の証文に「信州水内郡之内長野」とある。1570年の武田信玄書状に初出を求める説もあるが字句の読みが定まらないため、確実な用例としてこちらを採った（県レコードと同一の記録）
  claims:
  - text: 慶長6年（1601）9月16日の大久保長安等連署証文（善光寺文書）に「信州水内郡之内長野」とあり、善光寺領の確定に関わる文書の中で「長野」が確認できる
    kind: fact
    level: E2
    status: established
    sources:
    - c-jstage-nagano
  - text: 元亀元年（1570）の武田信玄の書状に長野の初出を見る説もあるが、その字句は「艮野」とも読まれ、1601年初出説と併存している
    kind: fact
    level: E3
    status: contested
    sources:
    - c-jstage-nagano
  - text: 「長野」は、善光寺平に裾花川などがつくった扇状地のような、長く緩やかな傾斜地を指す地形由来の地名と説明される
    kind: fact
    level: E2
    status: established
    sources:
    - c-suzaka-city
  - text: 江戸時代、現・長野市中心部は地籍上は水内郡長野村であり、その町場の部分が善光寺の門前町として善光寺町と呼ばれた
    kind: fact
    level: E2
    status: established
    sources:
    - c-ndl-nagano
  - text: 明治4年（1871）6月、中野県の県庁が長野村の西方寺へ移され、県名が長野県と改称されたため、村名「長野」がそのまま県名になった
    kind: fact
    level: E2
    status: established
    sources:
    - c-nagano-shishi
  - text: 明治30年（1897）4月1日、長野町が市制を施行して長野市が誕生した。県庁所在地になってから市になるまでに26年を要している
    kind: fact
    level: E2
    status: established
    sources:
    - c-nagano-shishi
    - c-cap-nagano-uub
  - text: 総務省の全国地方公共団体コードで、長野市の団体コードは202011と定められている
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 一つのまちに、二つの名前
    text: 江戸時代のいまの長野市中心部には、二つの名前が重なっていました。地籍のうえでは水内郡「長野村」、しかし実際に人々が暮らし参詣客でにぎわう町場は、善光寺の門前町として「善光寺町」と呼ばれていたのです。明治4年（1871）に県庁の引っ越し先になったのは長野村で、県の名前は「長野県」になりました。一方、まちの知名度でいえば善光寺の方が圧倒的でした。村の名前が県名になり、門前町のにぎわいがそのまま都市の土台になる――長野市は、その二つの名前の重なりから生まれた県庁所在地です。
    sources:
    - c-ndl-nagano
    - c-nagano-shishi
  relations:
  - pref/20
  unknowns:
  - 1570年の武田信玄書状の該当字句（長野か艮野か）の確定には原本の画像確認が必要で未了（県レコードと同一の未確認事項）
  - 長野村から長野町が成立した年次（町制の経緯）については本バッチでは市公式資料まで確認できていない
  - 「長野＝長い傾斜地」とする地形語源説の言語学的な検証水準は、専門地名辞典まで確認できていない
  updated: '2026-11-13'
- id: muni/20-須坂市
  code: '202070'
  names:
    ja: 須坂市
    reading: すざかし
    aliases:
    - 須坂村
    - 須坂町
  user_terms:
  - すざかし
  - 蔵の町
  - 製糸の町
  - 須坂の名前の由来
  naming_type: 一部の地名
  prefecture: 長野県
  homonyms: []
  summary: 須坂市は千曲川東岸、扇状地の上に広がる市で、江戸時代は須坂藩の陣屋町、明治から大正にかけては製糸業で栄えた町である。「須坂」の語源には定説がなく、戦国武将の須田氏にゆかりがあるという説や、坂田地区に残る古地名「砂田」との関係を説く見方がある。須坂村は1876年に須坂町となり、1954年に県内7番目の市として市制を施行した。
  first_attestation:
    era: （未確認）
    year_western: null
    document: （未確認）
    note: 須坂村・須坂藩の名は近世の資料にみえるが、「須坂」の地名の初出は本調査では確認できなかった
  claims:
  - text: 須坂は江戸時代に須坂藩堀氏の陣屋町として発展し、明治9年（1876年）に須坂村から須坂町に改称した
    kind: fact
    level: E2
    status: established
    sources:
    - v2-suzaka-gaiyo
    - v2-suzaka-monjo
  - text: 昭和29年（1954年）4月1日に市制を施行して須坂市が誕生し、その後、昭和30年（1955年）に井上村・高甫村を、昭和46年（1971年）に東村を編入して現在の市域となった
    kind: fact
    level: E2
    status: established
    sources:
    - v2-suzaka-monjo
    - v2-suzaka-gaiyo
  - text: 「須坂」の語源には定説がない。須田氏は一説に須坂の地名につながるゆかりのある家とされるが、須田氏自体の発祥にも定説はない（長野県立歴史館の研究者の講演録を須坂市が公開するもの）
    kind: fact
    level: E2
    status: contested
    sources:
    - v2-suzaka-suda
  - text: 同じ講演では、坂田地区に残る古い地名「砂田」が須田氏の発祥ではないかという説が紹介され、「須田」のような名は扇状地によくある地名だと説明された
    kind: fact
    level: E2
    status: contested
    sources:
    - v2-suzaka-suda
  - text: 須坂の中心市街地は、千曲川の支流である鮎川・百々川・八木沢川・松川が押し出した大きな扇状地の上に形成されており、鎌倉・室町時代には井上氏・須田氏・高梨氏などの武士がこの地を支配した
    kind: fact
    level: E2
    status: established
    sources:
    - v2-suzaka-gaiyo
  - text: 明治時代に水車動力による生糸製造が盛んになり、大正時代には製糸業が全盛期を迎えて「世界に知られた生糸の町」となり、蔵造りの商家の町並みが残る
    kind: fact
    level: E2
    status: established
    sources:
    - v2-suzaka-gaiyo
  - text: 須坂市の地方公共団体コードは202070である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 「須坂」の「す」は砂だったのか
    text: 須坂の語源は、いまだに決着していない。手がかりの一つは、戦国時代にこの地で活躍した須田氏である。長野県立歴史館の研究者は講演で、須田氏の発祥には定説がないとしたうえで、坂田地区に残る古い地名「砂田」がその発祥ではないかという説を紹介した。須坂は川が運んだ砂の扇状地の町であり、「すだ」「すざか」のような音は、砂地の地名として扇状地によく現れるという。川の洲と坂に由来するという分かりやすい説明も広く流布しているが、公的な資料で裏付けられたものではない。砂なのか洲なのか、答えはまだ扇状地の中に埋もれている。
    sources:
    - v2-suzaka-suda
    - v2-suzaka-gaiyo
  relations:
  - pref/20
  unknowns:
  - 「須坂」の語源の定説は確認できなかった（千曲川の「洲」と扇状地の「坂」に由来するという通説も、公的資料では裏付けが取れなかった）
  - 「須坂」の地名の初出文献を確認できなかった
  - 須坂藩の陣屋町として「須坂」の名が定着した過程を、市史の記述で確認できなかった
  updated: '2026-11-13'
- id: muni/20-飯山市
  code: '202134'
  names:
    ja: 飯山市
    reading: いいやまし
    aliases:
    - 飯山町
  user_terms:
  - いいやま
  - 北信州いいやま
  - 豪雪地帯の市
  - 寺のまち飯山
  naming_type: 一部の地名
  prefecture: 長野県
  homonyms: []
  summary: 長野県最北部の市で、地名は戦国時代に上杉謙信が築いた飯山城の城名として定着した。江戸時代は飯山藩の城下町、明治以降は飯山町として続き、1954年に飯山町と周辺6村が合併して飯山市となった。「飯山」の語源そのものは未詳であり、城名としての層と、日本有数の豪雪地帯という土地の性格は分けて理解する必要がある。
  first_attestation:
    era: 永禄7年
    year_western: 1564
    document: null
    note: 地名「飯山」の文書上の初出は特定できていない。1564年の飯山城築城が、城名としての「飯山」の確実な用例として確認できる画期であり、初出そのものではない
  claims:
  - text: 総務省の全国地方公共団体コードで、飯山市の団体コードは202134と定められている
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  - text: 飯山市の基本計画書によれば、飯山城は永禄7年（1564）に上杉謙信が武田氏への前線基地として本格的に築城し、本市の都市形成はこの飯山城を中心に城下町としてなされた
    kind: fact
    level: E2
    status: established
    sources:
    - v3-iiyama-jouyama-plan
  - text: 同計画書によれば、江戸時代の飯山は飯山藩の城下町で、享保2年（1717）から本多氏が9代151年にわたり藩主を務めた
    kind: fact
    level: E2
    status: established
    sources:
    - v3-iiyama-jouyama-plan
  - text: 政府の特区計画によれば、昭和29年（1954）8月に飯山町・秋津村・柳原村・外様村・常盤村・瑞穂村・木島村の1町6村が合併して飯山市が誕生し、昭和31年（1956）に太田村・岡山村を編入して現在の姿となった
    kind: fact
    level: E2
    status: established
    sources:
    - v3-iiyama-tokku-plan
  - text: 市名は、城下町以来の中心地である飯山町の名をそのまま継承したものである
    kind: fact
    level: E2
    status: established
    sources:
    - v3-iiyama-tokku-plan
    - v3-iiyama-jouyama-plan
  - text: 同じ特区計画によれば、飯山は古くから山国信州と日本海を結ぶ交通の要所として栄え、塩・魚などの海産物の集散地であった
    kind: fact
    level: E2
    status: established
    sources:
    - v3-iiyama-tokku-plan
  - text: 同じ特区計画によれば、飯山には江戸時代から続く寺町文化があり、名僧・正受老人の正受庵をはじめとする寺社の景観が市の文化を形作っている
    kind: fact
    level: E2
    status: established
    sources:
    - v3-iiyama-tokku-plan
  - text: 飯山市は日本有数の豪雪地帯であり、豪雪地帯対策特別措置法に基づく「特別豪雪地帯」の指定を受けている
    kind: fact
    level: E5
    status: established
    sources:
    - v3-wiki-iiyama
  column:
    title: 城の名と雪のまち
    text: 飯山の名は城から生まれました。戦国の境目に築かれた飯山城の城下町がまちの骨格となり、江戸時代を通じて藩庁の置かれた「飯山」が地域の中心の名として定着しました。一方で、この土地を語るもう一つの顔が雪です。日本有数の豪雪地帯で「特別豪雪地帯」の指定を受ける飯山では、雪国らしい連帯と協調の精神が市民性として語られ、城下町に集まった寺々がつくる「寺のまち」の景観とあわせて、現在の飯山の個性になっています。城名の層と豪雪の層は、同じ「飯山」でも由来の異なる二つの物語です。
    sources:
    - v3-iiyama-jouyama-plan
    - v3-iiyama-tokku-plan
    - v3-wiki-iiyama
  relations:
  - pref/20
  unknowns:
  - 「飯山」という地名の語源（なぜ「飯」の字が当てられたか）は、市の公式資料でも示されておらず、今回の調査範囲では確認できなかった
  - 地名「飯山」の文書上の初出（中世文書における用例）は特定できなかった
  - 飯山城の築城以前に「飯山」という地名が存在したかどうかは未確認
  updated: '2026-11-13'
- id: muni/20-飯田市
  code: '202053'
  names:
    ja: 飯田市
    reading: いいだし
    aliases:
