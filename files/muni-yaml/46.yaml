    - s5-uken-uub
    - s5-uken-wiki
    - s5-kagoshima-oshima-gaikyo
  - text: 村の初名「焼内」は村が抱える焼内湾の名で、琉球国の時代には屋喜内（焼内）間切が置かれていたとされる
    kind: fact
    level: E5
    status: indeterminate
    sources:
    - s5-uken-wiki
  - text: 村は焼内湾を取り囲むように点在する14の集落からなる
    kind: fact
    level: E5
    status: established
    sources:
    - s5-uken-wiki
  column:
    title: 9年だけ名乗った「焼内村」――湾の名から古い区画の名へ
    text: 宇検村は、発足からの約9年間「焼内村」だった。焼内は村が抱える深い入江・焼内湾の名で、琉球国の時代の屋喜内間切以来の呼び名である。ところが1917年、村は「宇検村」に改称した。宇検は、江戸時代に14か村を束ねた行政区画「宇検方」の名であり、その役場は一貫して宇検集落に置かれていた。新しい行政の名として湾の地形名を掲げた村が、わずか9年で古くからの区画の名に回帰したことになる。奄美大島で現行の村名が一度変えられた例は少なく、この改称は宇検という名の土地への根付きの強さを示している。
    sources:
    - s5-uken-wiki
    - s5-uken-plan
    - s5-kagoshima-oshima-gaikyo
  relations:
  - pref/46
  - muni/46-瀬戸内町
  unknowns:
  - 「宇検」という名の語源（なぜ「検」の字なのか）は、公的・専門資料では確認できなかった。田検・芦検など「検」の付く集落名との関係も未確認
  - 1917年の改称の理由を明示した資料は確認できなかった
  - 焼内村から宇検村への改称日は資料により8月15日と11月1日に分かれる（claimsに両論併記）
  updated: '2026-11-13'
- id: muni/46-屋久島町
  code: '465054'
  names:
    ja: 屋久島町
    reading: やくしまちょう
    aliases:
    - 屋久町
    - 上屋久町
    - 下屋久村
    - 上屋久村
  user_terms:
  - やくしま
  - 縄文杉の島
  - 世界遺産の島の町
  naming_type: 新規命名
  formation: 合併新設
  prefecture: 鹿児島県
  homonyms: []
  summary: 屋久島と口永良部島の全域を占める町で、平成19年（2007年）10月1日に上屋久町と屋久町が合併して発足した。新町名は、どちらの旧町名にも入っていなかった島そのものの名「屋久島」を採用したもので、島の名は『日本書紀』に「掖久」と現れるほど古い。旧屋久町は下屋久村（1889年設立）が1959年に町制・改称したもの、旧上屋久町は上屋久村が1958年に町制したものである。
  first_attestation:
    era: 推古天皇24年
    year_western: 616
    document: 『日本書紀』
    note: 「掖久（やく）」の人の来朝を記す記事が島名の初出とされる。ただし『隋書』大業3年（607年）の「夷邪久」を最初とする説もあり、それが屋久島を指すかどうかには諸説がある（いずれもWikipedia「屋久島」の紹介による）
  claims:
  - text: 屋久島町の地方公共団体コードは465054である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  - text: 平成19年（2007年）10月1日に熊毛郡上屋久町と熊毛郡屋久町が合併して熊毛郡屋久島町となった
    kind: fact
    level: E2
    status: established
    sources:
    - s3-soumu-gapei-kagoshima
  - text: 旧屋久町は1889年（明治22年）に設立された下屋久村が1959年（昭和34年）に町制を施行して屋久町となったものであると町は紹介する
    kind: fact
    level: E2
    status: established
    sources:
    - s3-yakushima-kyuyaku
  - text: 旧上屋久町は上屋久村が1958年（昭和33年）に町制を施行して上屋久町となったものであると町は紹介する
    kind: fact
    level: E2
    status: established
    sources:
    - s3-yakushima-kyukami
  - text: 屋久島が文献に現れる最初は中国の『隋書』大業3年（607年）の「夷邪久」の記述とされるが、これが屋久島を指す説と南島全般を指す説とがあるとWikipedia「屋久島」は紹介する
    kind: fact
    level: E5
    status: contested
    sources:
    - s3-yakushima-wiki
  - text: 『日本書紀』には推古24年（616年）に掖久・夜勾・掖玖の人がやってきた記事があり、『続日本紀』には文武3年（699年）の多褹・掖玖・菴美・度感からの来貢と、大宝2年（702年）に多禰国が成立したことが記されているとWikipedia「屋久島」は紹介する
    kind: fact
    level: E5
    status: established
    sources:
    - s3-yakushima-wiki
  - text: 屋久島町は屋久島および口永良部島の全域を行政区域とする町であるとWikipedia「屋久島町」は紹介する
    kind: fact
    level: E5
    status: established
    sources:
    - s3-yakushimacho-wiki
  - text: 上屋久村・下屋久村はもと馭謨郡に属し、1896年（明治29年）に熊毛郡の所属となったとWikipedia「熊毛郡」は紹介する
    kind: fact
    level: E5
    status: established
    sources:
    - s3-kumage-wiki
  column:
    title: 合併で初めて「島の名前」が町名になった
    text: 屋久島には長く2つの町があった。北部の上屋久町と南部の屋久町である。どちらの名にも「屋久」は入っていたが、「屋久島」という島そのものの名を名乗る自治体はなかった。2007年の合併で新町の名に選ばれたのは、この島の名そのものだった。「掖久」として『日本書紀』に現れて以来、少なくとも1400年近く同じ音で呼ばれてきた島の名が、ようやく自治体の名前になったのである。なお縄文杉や世界自然遺産は島の自然の層であって、町名の由来ではない。
    sources:
    - s3-soumu-gapei-kagoshima
    - s3-yakushima-kyuyaku
    - s3-yakushima-kyukami
  relations:
  - pref/46
  - muni/46-西之表市
  - muni/46-南種子町
  unknowns:
  - 合併協議会で新町名「屋久島町」がどのような候補・手続き（公募の有無など）で決まったかを示す資料は確認できなかった
  - 「屋久（掖久）」という島名自体の語源は、確認した資料の範囲では明らかにできなかった
  - 『日本書紀』『続日本紀』の当該記事は二次資料経由の確認にとどまり、原文を直接確認していない
  updated: '2026-11-13'
- id: muni/46-徳之島町
  code: '465305'
  names:
    ja: 徳之島町
    reading: とくのしまちょう
    aliases:
