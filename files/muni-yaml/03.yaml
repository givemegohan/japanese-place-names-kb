    status: contested
    sources:
    - z7-hirono-yuraiyura
  - text: 岩手県の「町村名の由来」は、旧中心地である種市の名の由来として、「撓根津（タワネツ）」の転訛で種市岳の裾野の舟繋場とする説、「種井池」の意味で種を漬ける流れや池とする説、種子や種牡馬などを売る市が立ったことによるとする説の3説を挙げる
    kind: fact
    level: E2
    status: contested
    sources:
    - z6-iwate-bunka-chimei
  - text: 岩手県内の地名を長年調べてきた地名研究者の宍戸敦は、種市の「種」は大野海成段丘の棚状の地形を表す「棚」に由来するのではないかと説明している
    kind: fact
    level: E4
    status: contested
    sources:
    - z7-hirono-menkoi
  - text: 洋野町の地方公共団体コードは035076である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 「野」は大野の「野」ではなかった
    text: 合併で生まれた町名には、旧町村の名前から一字ずつ取る「合成型」が多い。洋野町も一見すると、太平洋の「洋」と大野村の「野」を合わせた合成名に見える。ところが町役場の説明は少し違う。新町名は全国公募で募り、沿岸の種市町の広々とした「海」と、内陸の大野村のなだらかな「野原」のイメージから決まったという。「野」は大野の字を切り取ったのではなく、野原の広がりを表す言葉として選ばれたとされる。結果として旧大野村の面影を残す形にはなったが、成り立ちとしてはイメージ先行の瑞祥地名である。見た目の合成と実際の命名理由がずれる例として、合併地名の面白さをよく示している。
    sources:
    - z7-hirono-menkoi
    - z7-hirono-yuraiyura
  relations:
  - pref/03
  unknowns:
  - 公募の応募総数や最終候補の顔ぶれは、本バッチでは公的資料で確認できなかった
  - 読み「ひろの」の決定経緯（音読みの組み合わせか、既存の読みの流用か）は未確認である
  updated: '2026-11-13'
- id: muni/03-滝沢市
  code: '032166'
  names:
    ja: 滝沢市
    reading: たきざわし
    aliases:
    - 滝沢村
  user_terms:
  - 日本一の村だったところ
  - チャグチャグ馬コのまち
  - 盛岡のベッドタウン
  - 岩手山のふもとの市
  naming_type: 一部の地名
  prefecture: 岩手県
  homonyms: []
  summary: 市名は、1889年の合併で生まれた滝沢村の名をそのまま受け継いだもので、村名は構成地区の中で最も区域の広かった滝沢地区の名。さらにその「滝沢」は、石ケ森と谷地山の間を流れる渓流が滝となって流れる「滝の沢」という流れの名に由来すると市は説明する。滝沢村は長く「日本一人口の多い村」として知られ、2014年1月1日に町制を経ず単独で市制を施行して滝沢市となった。
  first_attestation:
    era: null
    year_western: null
    document: null
    note: 「滝沢」の名の初出となる古文書は確認できなかった。市公式は「滝の沢」という流れの名に由来すると説明する
  claims:
  - text: 総務省の全国地方公共団体コードで、滝沢市の団体コードは032166と定められている
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  - text: 滝沢市は、滝沢の由来について、石ケ森と谷地山の間に渓流があり、それが急流となり浅瀬となり滝となって流れているところが数か所あるので「滝の沢」と名づけられ、この流れの名前から「滝沢」と呼ばれたと説明している
    kind: fact
    level: E2
    status: established
    sources:
    - t4-takizawa-city-chimei
  - text: 明治22年（1889年）の町村制実施に際し、滝沢・鵜飼・大沢・篠木・大釜の5つの地区（村）が合併したが、その中で最も区域の広かった滝沢の名を採って滝沢村となり、平成26年（2014年）の市制施行でも「滝沢」の名が継承された
    kind: fact
    level: E2
    status: established
    sources:
    - t4-takizawa-city-chimei
    - t4-takizawa-city-gaiyo
  - text: 総務省の告示により、岩手郡滝沢村を滝沢市とする処分が平成26年（2014年）1月1日に施行され、滝沢村は町制を経ることなく村のまま市制を施行した
    kind: fact
    level: E2
    status: established
    sources:
    - t4-takizawa-soumu-press
  - text: 滝沢村は市制施行以前の10年以上の期間、人口5万人を超える日本一人口の多い村であり、2002年に豊見城村が市制を施行して豊見城市となった後、その地位にあった
    kind: fact
    level: E5
    status: established
    sources:
    - t4-takizawa-wiki
  - text: 岩手県内での単独市制は、1958年（昭和33年）の江刺市（現在の奥州市）以来55年1か月ぶりのことであった
    kind: fact
    level: E5
    status: established
    sources:
    - t4-takizawa-wiki
  - text: 大釜地区の名は、前九年の役に源義家がこの地に陣営を設け、大釜を据え付けて兵馬に食糧を与えたことから生まれたという
    kind: legend
    level: E2
    status: established
    sources:
    - t4-takizawa-city-chimei
  - text: 篠木地区の名は、803年に坂上田村麻呂が蝦夷征伐の後に家来の斉藤五郎兼光に「この地にとどまり、寒暑を凌（しの）いで鎮撫の任にあたれ」と言い残したことから、「凌ぎ」が「篠木」になったという
    kind: legend
    level: E2
    status: established
    sources:
    - t4-takizawa-city-chimei
  column:
    title: 「日本一の村」の勲章を捨てた決断
    text: 滝沢村は、人口5万人を超えながら「村」であり続けた、日本一人口の多い村でした。その称号は村民にとって一つの勲章でしたが、2014年1月1日、村はその勲章を捨てて市制を施行しました。町制という段階を経ない、村から市への直接の移行です。移行後は「住民自治日本一の市」を掲げたと報じられています。「日本一の村」の座は沖縄県の読谷村に移りましたが、1889年に最も広い地区の名を採って生まれた「滝沢」という名そのものは、村から市へそのまま受け継がれています。
    sources:
    - t4-takizawa-jbpress
    - t4-takizawa-wiki
  relations:
  - pref/03
  - muni/03-盛岡市
  unknowns:
  - 「滝の沢」という流れの名がいつ頃から呼ばれていたかを示す古い記録は確認できなかった
  - 「滝沢」の地名の文献上の初出は確認できなかった
  - 村から直接市制を施行した事例が全国で滝沢が何例目にあたるかは、公式資料で確認できなかった（同様の経路として2002年の豊見城市がある）
  updated: '2026-11-13'
- id: muni/03-田野畑村
  code: 034843
  names:
    ja: 田野畑村
    reading: たのはたむら
    aliases:
    - 田野畑
    - 田野畠
    - 田端村
  user_terms:
  - 田野畑
  - たのはた
  - 北山崎の村
  - 三閉伊一揆の村
  naming_type: その他（畑地の広がる土地を表す地名とされる）
  prefecture: 岩手県
  homonyms: []
  summary: 下閉伊郡の村で、北山崎・鵜の巣断崖の景勝で知られる。村名は正保国絵図に「田野畠村」と見え、岩手県の由来一覧は語源として「畑のある土地」「撓わの畑（盆地の畑）」の2説を挙げる。明治22年（1889）に田野畑村・沼袋村・浜岩泉村が合併して現在の田野畑村が誕生し、その後合併を経ずに続いている。元禄期の郷帳では村の石高が畑方のみであったという記録も、名の由来を考える手がかりである。
  first_attestation:
    era: 正保元年頃
    year_western: 1644
    document: 正保国絵図
    note: 『日本歴史地名大系』が「田野畠村」と見えると紹介するもの（二次資料経由）。なお寛永21年（1644）の「雑書」に見える「田端村」も当村のことかとされる
  claims:
  - text: 『日本歴史地名大系』によれば、正保国絵図に「田野畠村」と見え、元禄の十郡郷帳によれば当村の石高は畑方のみであった
    kind: fact
    level: E3
    status: established
    sources:
    - z7-tanohata-kotobank
  - text: 同書は、寛永21年（1644）の「雑書」に見える「田端村」は当村のことかとする
    kind: fact
    level: E3
    status: indeterminate
    sources:
    - z7-tanohata-kotobank
  - text: 岩手県の「町村名の由来」は、田野畑の語源として「畑のある土地」とする説を挙げる
    kind: fact
    level: E2
    status: contested
    sources:
    - z6-iwate-bunka-chimei
  - text: 同一覧はもう一説として、「撓（た）わの畑」、すなわち盆地の畑の意味とする説を挙げる
    kind: fact
    level: E2
    status: contested
    sources:
    - z6-iwate-bunka-chimei
  - text: 田野畑村公式によれば、明治22年（1889）4月に田野畑・沼袋・浜岩泉の3村が合併し、現在の田野畑村が誕生した
    kind: fact
    level: E2
    status: established
    sources:
    - z7-tanohata-vill-enkaku
  - text: 村は幕末の弘化4年（1847）と嘉永6年（1853）に起きた三閉伊一揆の指導者を出した地として知られ、村公式の歴史紹介でも取り上げられている
    kind: fact
    level: E2
    status: established
    sources:
    - z7-tanohata-vill-enkaku
  - text: 田野畑村の地方公共団体コードは034843である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 名前に「田」があるのに、石高は畑だけだった
    text: 「田野畑」という名は、田と野と畑がそろった豊かな農村を連想させる。ところが『日本歴史地名大系』が引く元禄十郡郷帳の記録では、当時の田野畑村の石高は畑方のみで、田の分がなかったという。海岸段丘が海に落ち込む地形の村では、水田よりも畑が生活の中心だったことがうかがえる。県の由来一覧が挙げる「畑のある土地」「盆地の畑（撓わの畑）」という2説も、この畑中心の土地柄とよく響き合う。村名の三文字は理想の風景ではなく、実際に耕してきた土地の姿を映しているのかもしれない。
    sources:
    - z7-tanohata-kotobank
    - z6-iwate-bunka-chimei
  relations:
  - pref/03
  unknowns:
  - 語源は県一覧の2説とも地形説明の域を出ず、文献による確定はできていない
  - 「田野畑」の表記（畠から畑へ）が定着した時期は、本バッチでは確認できなかった
  updated: '2026-11-13'
- id: muni/03-盛岡市
  code: 032018
  names:
    ja: 盛岡市
    reading: もりおかし
    aliases:
    - 不来方
    - 古志方
    - 森ヶ岡
    - 森岡
    - 盛岡町
  user_terms:
  - 盛岡の名前の由来
  - 不来方って何と読む
  - 盛岡は誰が名付けた
  - 森岡から盛岡になった理由
  naming_type: 新規命名
  prefecture: 岩手県
  homonyms: []
  summary: 市名は南部氏の城下町「盛岡」の継承である。この地の古名は「不来方（こずかた）」で、森ヶ岡・森岡を経て「盛岡」になったとされるが、改名の主体と時期は資料により異なる。岩手県の大事典は藩主・南部氏が「盛り上がり、栄える岡」の願いを込めて命名したとする一方、専門文献は2代藩主・利直が「森ヶ岡」と改め、元禄4年（1691年）に4代・重信の代で「盛岡」になったと伝える。明治22年（1889年）に全国39市の一つとして市制施行した。
  first_attestation:
    era: 慶長年間〜元禄4年
    year_western: null
    document: 城下町名としての「盛岡」（改称の主体・年は資料により異なる）
    note: 「盛岡」表記の成立年は、慶長年間に利直が改めたとする説と元禄4年（1691年）とする説が対立し、単年に確定できない
  claims:
  - text: 盛岡の古名は「不来方（こずかた）」「古志方」と呼ばれ、はじめ「森ヶ岡」、のちに「森岡」と呼ばれた、と岩手県の文化情報大事典は紹介している
    kind: fact
    level: E2
    status: established
    sources:
    - a-cap-morioka-bunka
  - text: 同大事典は、藩主・南部氏が「盛り上がり、栄える岡」という意味を込めて「盛岡」と命名したとする説を挙げ、別説として「杜の多い岡から転じた」とする説も併記している
    kind: fact
    level: E2
    status: contested
    sources:
    - a-cap-morioka-bunka
  - text: 専門文献（日本歴史地名大系系の解説）は、盛岡藩2代藩主・南部利直が不来方の用字を嫌い「森ヶ岡」と改称し、いつの頃からか「森岡」となり、4代藩主・重信の代の元禄4年（1691年）に「盛岡」と改められたと伝えられる、とする。改名が慶長年間の利直による一度の命名か、約100年かけての段階的変化かは資料により異なる
    kind: fact
    level: E3
    status: contested
    sources:
    - a-cap-morioka-kotobank
  - text: 旧名「不来方」は現在の盛岡城跡一帯を指す地名で、南部氏の本拠となる以前からこの地の呼び名だった
    kind: fact
    level: E3
    status: established
    sources:
    - a-cap-morioka-kotobank
  - text: 城下町は2代藩主・利直の時代に建設が大きく進み、その町割りは現在でも盛岡の中心市街地の基本的な骨格になっている、と盛岡市は説明している
    kind: fact
    level: E2
    status: established
    sources:
    - a-cap-morioka-city
  - text: 明治22年（1889年）の市町村制施行により、全国39都市の一つとして、人口2万9190人・面積4.47平方キロメートルの盛岡市が誕生した、と盛岡市は述べている
    kind: fact
    level: E2
    status: established
    sources:
    - a-cap-morioka-city
  column:
    title: 「盛岡」になるまで3回名前が変わった
    text: 不来方→森ヶ岡→森岡→盛岡。盛岡の名前は、約100年のあいだに少しずつ字を替えて今の形に近づいた可能性があります。「不来方（来ない方）」は城の名としては確かに縁起が悪く、「森」も「盛」に替わって、最後は「盛り上がり栄える岡」という願いを読み込める名前になりました。一度の命名で決まったのではなく、縁起の良い字へ少しずつ寄せていった跡――その過程自体が、この城下町の自己イメージの変化を物語っています（段階的変化とするのは専門文献の説に基づきます）。
    sources:
    - a-cap-morioka-bunka
    - a-cap-morioka-kotobank
  relations:
  - pref/03
  unknowns:
  - 改称の主体・年の決着（利直が慶長年間に「盛岡」と命名したとする説明と、元禄4年（1691年）に重信の代で盛岡となったとする専門文献の説が対立）
  - 古名「不来方（こずかた）」自体の語源は未確認
  - 「杜の多い岡」説の出典の所在は未確認
  updated: '2026-11-13'
- id: muni/03-矢巾町
  code: '033227'
  names:
    ja: 矢巾町
    reading: やはばちょう
    aliases:
    - 矢巾
    - 矢幅
    - 矢巾村
  user_terms:
  - 矢巾
  - やはば
  - 徳丹城
  - 盛岡のベッドタウン
  - 矢幅駅
  naming_type: その他（古くからの地名「やはば」による。語源は諸説あり）
  prefecture: 岩手県
  homonyms: []
  summary: 紫波郡の町で、盛岡市の南に隣接するベッドタウンである。地名「やはば」は古くからあり、現在も町内に南矢幅・北矢幅の大字名が「矢幅」の表記で残る。語源には、前九年の役で源頼義が矢羽根を集めさせたとする伝承と、「谷端場・谷端間」で段差のある湿地の法面をいうとする地形説がある。昭和30年（1955）に煙山・徳田・不動の3村が合併して矢巾村となり、昭和41年（1966）に町制を施行した。町内には延暦22年（803）に築かれた城柵・徳丹城の跡がある。
  first_attestation:
    era: null
    year_western: null
    document: null
    note: 「やはば（矢幅）」の文献初出は本バッチでは特定できなかった。町内には延暦22年（803）に築かれた徳丹城跡があり、古代からの軍事・交通の要地であった
  claims:
  - text: 岩手県の「町村名の由来」は矢巾の語源として、前九年の役で源頼義が安倍貞任を討つため、矢をつくる矢羽根（ヤバネ）を集めさせたことによるとする言い伝えを挙げる
    kind: legend
    level: E2
    status: established
    sources:
    - z6-iwate-bunka-chimei
  - text: 同一覧はもう一説として、「谷端場」「谷端間」の意味で、段差のある湿地の法面のこととする地形由来の説を挙げる
    kind: fact
    level: E2
    status: contested
    sources:
    - z6-iwate-bunka-chimei
  - text: 『日本大百科全書』によれば、1955年（昭和30）に煙山・徳田・不動の3村が合併して矢巾村となり、1966年に町制を施行して矢巾町となった
    kind: fact
    level: E3
    status: established
    sources:
    - z7-yahaba-kotobank
  - text: 同書によれば、町内の徳丹城跡は延暦22年（803）に胆沢城の前進基地として築かれた城柵で、国の史跡に指定されている
    kind: fact
    level: E3
    status: established
    sources:
    - z7-yahaba-kotobank
  - text: 町役場は大字南矢幅に所在し、「矢幅」の表記は「矢巾」とは別に、現在も町内の大字名として残っている
    kind: fact
    level: E5
    status: established
    sources:
    - z7-yahaba-wiki
  - text: 矢巾町の地方公共団体コードは033227である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 矢羽根を集めた里、という言い伝え
    text: 矢巾の名の由来として町で最もよく語られるのは、前九年の役（1051〜62）の言い伝えである。源頼義が安倍貞任を討つため、この地で矢に使う羽根（矢羽根）を集めさせたことから「やはば」になったという。矢を入れる筒を「矢巾」と書くことも、この物語と結びつけて理解されてきた。一方で県の由来一覧には、湿地の段差の法面をいう「谷端場・谷端間」の転だとする、地味だが地形に即した説も併記されている。合戦の物語と土地の形、どちらの層で読むかで「やはば」の姿は変わる。なお町の大字には今も「南矢幅」「北矢幅」と「矢幅」の字が残っており、表記の歴史の層も目に見える形で残されている。
    sources:
    - z6-iwate-bunka-chimei
