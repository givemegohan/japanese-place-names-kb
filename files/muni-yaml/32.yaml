prefecture_code: '32'
records:
- id: muni/32-出雲市
  code: '322032'
  names:
    ja: 出雲市
    reading: いずもし
    aliases:
    - 出雲町
  user_terms:
  - 出雲の名前の由来
  - 八雲立つってどういう意味
  - 出雲の名付け親はスサノオなの
  - 出る雲という意味の地名なの
  naming_type: 一部の地名
  prefecture: 島根県
  homonyms: []
  summary: 市名は古代の国名・郡名「出雲」の継承。年代の分かる初見は持統天皇6年（692年）の鰐淵寺の造像銘に見える「出雲国」で、由来そのものは記されていない。『出雲国風土記』は八束水臣津野命の「八雲立つ」を、記紀はスサノオの歌を命名と結びつけるが、語源は未確定。昭和16年（1941年）に市制を施行した。
  first_attestation:
    era: 持統天皇6年
    year_western: 692
    document: 鰐淵寺銅造観音菩薩立像台座銘
    note: 島根県古代文化センターの研究員が、年代の分かる「出雲」の初見として挙げる壬辰年（692年）の造像銘で、「出雲国」とある。藤原宮跡出土の木簡にも「出雲評」と見える。いずれも由来そのものは記されていない
  claims:
  - text: 出雲市の地方公共団体コードは322032である（総務省「地方公共団体コード一覧」による）
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  - text: 年代の分かる「出雲」の初見は、壬辰年（692年）造立の鰐淵寺銅造観音菩薩立像の台座銘に見える「出雲国」で、藤原宮跡出土の木簡にも「出雲評」とある
    kind: fact
    level: E2
    status: established
    sources:
    - k5-izumo-kodai-center
  - text: 『出雲国風土記』（天平5年・733年成立）の総記は、国引きの神である八束水臣津野命が「八雲立つ出雲」と言ったことが国名の由来であるとする
    kind: legend
    level: E2
    status: established
    sources:
    - e-shimane-pref-fudoki
    - k5-izumo-kodai-center
  - text: 一方、『古事記』『日本書紀』では、スサノオが須我の地で雲の立つのを見て「八雲立つ 出雲八重垣」の歌を詠んだことが命名と結びつけられており、古典の間でも命名の主が異なる
    kind: legend
    level: E2
    status: established
    sources:
    - k5-izumo-kodai-center
  - text: 「出る雲」の意とする解釈は江戸時代以来の通説だが研究者には異論もあり、島根県の観光案内は夕つ方説・五面（いつも）説・アイヌ語説・外国地名説・厳藻（いつも）説などの諸説を列挙している
    kind: fact
    level: E2
    status: indeterminate
    sources:
    - k5-izumo-kodai-center
    - k5-izumo-kankou-navi
  - text: 昭和16年（1941年）2月11日に今市町など9町村が合併して出雲町が発足し、同年11月3日に出雲町が市制を施行して出雲市となった
    kind: fact
    level: E4
    status: established
    sources:
    - k5-izumo-uub
  - text: 平成17年（2005年）3月22日に旧出雲市・平田市・大社町・佐田町・多伎町・湖陵町が新設合併して現在の出雲市が発足し、平成23年（2011年）10月1日に斐川町を編入した
    kind: fact
    level: E2
    status: established
    sources:
    - k5-izumo-city-koho
  column:
    title: 名付け親が本によって違う
    text: 「出雲」の名付け親は、読む本によって違う。中央で編まれた『古事記』『日本書紀』では須我の地に立ったスサノオ、その地の国造が編んだ『出雲国風土記』では国引きの神・八束水臣津野命である。ただし、どちらの物語も核にあるのは「八雲立つ」という言葉で、雲の立つ土地というイメージは共通している。島根県古代文化センターの研究員は、この食い違い自体が、出雲という名の古さと重みを物語るとみている。
    sources:
    - k5-izumo-kodai-center
  relations:
  - pref/32
  unknowns:
  - 語源は確定していない（「出る雲」説が通説だが異論があり、実証されていない）
  - 692年の造像銘以前に「出雲」の名がいつ成立したかは不明
  updated: '2026-11-13'
- id: muni/32-大田市
  code: '322059'
  names:
    ja: 大田市
    reading: おおだし
    aliases:
    - 大田町
    - 邑郷
  user_terms:
  - おおだ
  - 石見銀山のまち
  - 世界遺産のまち
  naming_type: 一部の地名
  prefecture: 島根県
  homonyms:
  - muni/13-大田区
  summary: 市名は、古代の安濃郡邑（おおだ）郷に起源をもつ旧大田町の名を、1954年の市制施行にあたって継承したもの。市域の南には世界遺産・石見銀山の中心地だった大森の町並みがあるが、銀山の支配の中心「大森」と市の中心「大田」は別の場所であり、市名は銀山に由来しない。2005年には銀山の外港だった温泉津町などを合併した。
  first_attestation:
    era: 平安時代（『和名類聚抄』成立の10世紀）
    year_western: null
    document: 『和名類聚抄』の安濃郡邑郷
    note: 『日本歴史地名大系』が市名の起源として引くもので、「大田」の名の側の初出にあたる。原文は未確認のため、主張は大系の紹介として記録する。
  claims:
  - text: 『日本歴史地名大系』は、大田市の市名は『和名類聚抄』の安濃郡邑（おおだ）郷に起源をもち、昭和29年（1954年）の市制施行にあたり旧大田町の町名をそのまま継承したと説明する。
    kind: fact
    level: E3
    status: established
    sources:
    - q1-oda-jiten
  - text: 1954年（昭和29年）1月1日、大田町・久手町の2町と6村が合併して大田市が発足した。
    kind: fact
    level: E5
    status: established
    sources:
    - q1-oda-uub
  - text: 石見銀山の本格的な開発は1526年に始まり、17世紀には代官所のある大森が支配の中心となった。大森は現在の大田市大森町で、市制施行時の市の中心だった大田町から南へ離れた山間の鉱山町であり、市名「大田」とは由来を異にする。
    kind: fact
    level: E2
    status: established
    sources:
    - q1-oda-bunkazai
  - text: 市制から2年後の1956年（昭和31年）に大森町と五十猛村・大屋村・祖式村が編入され、石見銀山の中心地・大森がこのとき大田市の市域に入った。
    kind: fact
    level: E3
    status: established
    sources:
    - q1-oda-jiten
  - text: 2005年（平成17年）に温泉津町・仁摩町と合併して現在の大田市となり、石見銀山の外港として栄えた温泉津の町並みも市域に含まれることになった。
    kind: fact
    level: E2
    status: established
    sources:
    - q1-oda-bunkazai
  column:
    title: 銀山の玄関口なのに、銀山の名ではない
    text: 大田市と聞くと多くの人が石見銀山を思い浮かべる。ところが市名の「大田」は、銀山とは無関係に古代の邑郷から続く農村地帯の名前である。銀山の中心は市域南部の大森で、代官所を中心に武家屋敷と町家が並ぶ鉱山町だった。鉄道の駅と市役所のある大田は、もともと山陰道の宿場町・市場町として育った別の中心である。2005年の合併で銀山の外港・温泉津も加わり、市は「山の銀山・大森」「海の積出港・温泉津」「宿場町・大田」という三つの顔を持つことになった。観光の玄関口の名が銀山由来でないことは、この市の成り立ちの多様さを示している。
    sources:
    - q1-oda-jiten
    - q1-oda-bunkazai
  relations:
  - pref/32
  - muni/13-大田区
  unknowns:
  - 邑（おおだ）郷の「おおだ」という地名そのものの語源は確認できなかった
  - 1956年（昭和31年）の大森町編入に至る合併協議の経緯は確認できなかった
  updated: '2026-11-13'
- id: muni/32-安来市
  code: '322067'
  names:
    ja: 安来市
    reading: やすぎし
    aliases:
    - 安来町
    - 安来郷
  user_terms:
  - やすぎ
  - 安来節のまち
  - どじょうすくいのまち
  - 月山富田城の城下町
  naming_type: 一部の地名
  prefecture: 島根県
  homonyms: []
  summary: 市名は古代の安来郷にさかのぼる中心地「安来」の名を継いだもの。市の統計書は市名の由来として、スサノオノミコトが「吾が御心は安平（やす）けくなりぬ」と言ったことから安来になったという『出雲国風土記』に結びつく伝承を紹介している。戦国時代には尼子氏の本拠・月山富田城の城下町として栄え、1954年に市制、2004年に広瀬町・伯太町と合併した。
  first_attestation:
    era: 天平5年
    year_western: 733
    document: 『出雲国風土記』の意宇郡安来郷
    note: 安来市の統計書が市名の由来を「出雲国風土記より」として紹介することから、風土記の安来郷を名の側の初出とみる。風土記原文の直接確認はしていないため、主張は市の資料の紹介形で記録する。
  claims:
  - text: 安来市の統計書は、市名の由来として、スサノオノミコトがこの地に来て「吾が御心は安平（やす）けくなりぬ」と言ったことから「安来（やすぎ）」というようになったと伝え、『出雲国風土記』に由来する話として紹介している。
    kind: legend
    level: E2
    status: established
    sources:
    - q1-yasugi-tokei
  - text: 当地域は古くは出雲国意宇郡に属し、のちに能義郡として一つの行政区となったと、安来市の統計書は沿革を説明する。
    kind: fact
    level: E2
    status: established
    sources:
    - q1-yasugi-tokei
  - text: 戦国時代には月山富田城を本拠とする尼子氏が中国地方に勢力を広げ、安来はその城下町・港町として発展し、江戸時代には和鉄や蔵米の集散地となった。
    kind: fact
    level: E2
    status: established
    sources:
    - q1-yasugi-tokei
  - text: 1954年（昭和29年）4月1日に安来町などが合併して安来市が発足し、平成16年（2004年）10月1日に広瀬町・伯太町と合併して現在の安来市となった。
    kind: fact
    level: E2
    status: established
    sources:
    - q1-yasugi-tokei
  - text: 「安来節」と「どじょうすくい踊り」は安来の名を全国に知らしめた民謡・芸能で、市は「安来節のまち」を掲げている。
    kind: fact
    level: E2
    status: established
    sources:
    - q1-yasugi-tokei
  column:
    title: 風土記の神の言葉が、そのまま市の自己紹介になった
    text: 自治体が市名の由来を語るとき、多くは中世の文書や合併の経緯を持ち出す。安来市の統計書は違う。「スサノオノミコトが『吾が御心は安平けくなりぬ』と言ったことから安来になった」という、『出雲国風土記』に結びつく伝承を、市名の由来としてまっすぐに掲げている。風土記には各地の地名の由来譚が収められており、安来もその一つとして神の言葉に名を託した土地だった。史実として立証できる語源ではないが、1300年近く語り継がれた由来譚が今も公式資料の冒頭にあること自体、この土地と風土記の結びつきの深さを物語る。
    sources:
    - q1-yasugi-tokei
  relations:
  - pref/32
  unknowns:
  - 「やすぎ」という読み・地名の言語学的な語源（風土記の由来譚以外）は、今回参照した公的資料では確認できなかった
  - 『出雲国風土記』安来郷の条の原文は直接確認しておらず、市の統計書の紹介に拠っている
  updated: '2026-11-13'
- id: muni/32-松江市
  code: '322016'
  names:
    ja: 松江市
    reading: まつえし
    aliases: []
  user_terms:
  - 松江の名前の由来
  - 松江城の城下町の名前
  - 宍道湖のほとりの市の名前
  - 松山と間違えやすい市の名前
  naming_type: 新規命名
  prefecture: 島根県
  homonyms: []
  summary: 市名は慶長16年（1611年）、堀尾吉晴が亀田山に松江城を築き、中世以来の町場だった白潟と末次を合わせて「松江」と称したことに始まると松江市は説明する。ただし命名を記した根本史料は残っておらず、命名者や「唐の松江」にあやかったとする由来には諸説があり、市の史料調査も定説はないと結論づけている。愛媛県の松山市とは読みが似るが、成立の事情はまったく異なる。
  first_attestation:
    era: 慶長16年
    year_western: 1611
    document: 松江城の完成に伴う城下町の命名（松江市公式「生いたち」）
    note: 命名の出来事としての初出。命名そのものを記した同時代の根本史料は確認されておらず、命名の伝えは『懐橘談』（1653年）などの近世史料による
  claims:
  - text: 松江市の地方公共団体コードは322016である（総務省「全国地方公共団体コード」市区町村コード一覧による）
    kind: fact
    level: E2
    status: established
    sources:
    - e-cap-soumu-code-list
  - text: 松江市公式サイトは、地名の由来は慶長16年（1611年）に堀尾吉晴が亀田山に城を築き、白潟と末次の二つの郷をあわせて松江と称したことにはじまると説明する
    kind: fact
    level: E2
    status: established
    sources:
    - e-cap-matsue-city-gaiyo
  - text: 命名を記した根本的な史料は残っておらず、『松江市史』でも名称由来は特段取り上げられておらず、定説はないと松江市の史料調査コラムは整理している
    kind: fact
    level: E2
    status: established
    sources:
    - e-cap-matsue-city-chosa26
  - text: 松江藩儒・黒澤石斎が承応2年（1653年）に書いた『懐橘談』は、白潟と末次を併せたこの地が唐の松江に地形が似て鱸魚（すずき）・蓴菜（じゅんさい）が多いことから、先の国守・堀尾忠氏が富田城から城を移して「松江」と名付けた、と伝える
    kind: fact
    level: E2
    status: contested
    sources:
    - e-cap-matsue-city-chosa26
    - e-cap-kaikitsudan
  - text: 命名者については近世史料の間で一致せず、『懐橘談』の堀尾忠氏のほか、小瀬甫庵とするもの、堀尾吉晴の命を受けた圓城寺開山・春龍和尚とする『雲陽誌』などがあり、諸説が併存する
    kind: fact
    level: E2
    status: contested
    sources:
    - e-cap-matsue-city-chosa26
  - text: 開府以前から「松江」という言葉が見えたとする説もあり、『太平記』などに「松江」の表記があるが、それが地名ではなく形容詞だという見方もあり、城下町以前の地名としての「松江」の存在は確定していない
    kind: fact
    level: E2
    status: indeterminate
    sources:
    - e-cap-matsue-city-chosa26
  - text: 城下町に取り込まれた白潟（意宇郡）と末次（島根郡）は中世以来の町場・港町で、新しい城下町はこの水陸の要衝を併せる形で形成された
    kind: fact
    level: E2
    status: established
    sources:
    - e-cap-matsue-city-chosa26
  - text: 松江市は明治22年（1889年）4月に市制を施行した（当時の市域は4.78平方キロメートル、人口は35,513人だった）
    kind: fact
    level: E2
    status: established
    sources:
    - e-cap-matsue-city-gaiyo
  - text: 平成17年（2005年）3月31日に八束郡の7町村と、平成23年（2011年）8月1日に東出雲町と合併し、現在の市域となった
    kind: fact
    level: E2
    status: established
    sources:
    - e-cap-matsue-city-gaiyo
  - text: 愛媛県松山市（まつやま）とは読みが似るが別の自治体であり、「松江」が堀尾氏の城下町命名に由来するのに対し、「松山」は加藤嘉明が名付けた城名に由来するなど、成立の事情は異なる
    kind: fact
    level: E2
    status: established
    sources:
    - e-cap-matsue-city-gaiyo
    - e-cap-matsuyama-city-riyu
  column:
    title: 命名者は誰か ― 定説のない「松江」
    text: 「松江」の命名をめぐっては、市の史料調査担当者が近世史料と明治以降の著述を総ざらいしても、なお定説にたどり着かなかった。藩儒の『懐橘談』は堀尾忠氏が「唐の松江」に似た地形と鱸・蓴菜の産することから名付けたとし、別の史料は小瀬甫庵や和尚・春龍の命名とし、藩儒・桃節山にいたっては「古くから唱えられた名をこの時に城下の称号として定めたのだろう。疑いを残して博識の君子を待つ」と結んでいる。松江市の調査コラムもこの節山の留保に妥当性を見ており、堀尾吉晴が新しい城下町に当時の「中国風好み」を取り入れて命名した可能性が高いとしつつ、旧来の呼称の拾い上げも否定できないとする。大きな城下町の名前でさえ、命名の一次史料が残らないことがあるという好例である。
    sources:
    - e-cap-matsue-city-chosa26
  relations:
  - pref/32
  - muni/38-松山市
  unknowns:
  - 命名者（堀尾吉晴・忠氏・忠晴のいずれか、小瀬甫庵、春龍和尚など）と命名の正確な年次を決める同時代史料は確認できていない
  - 開府以前の「松江」の用例（『太平記』『大江広元日記』とされるもの）が地名を指すかどうかは未確認で、大江広元日記については市の調査でも確認できていない
  - コラムの材料は市の調査コラムに依拠しており、近世史料そのものは未読である
  updated: '2026-11-13'
