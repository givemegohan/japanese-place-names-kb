  - text: 1947年（昭和22年）3月15日、板野郡撫養町・瀬戸町・鳴門町・里浦村の3町1村が合併して鳴南市が発足し、同年5月15日に鳴門市へ改称した
    kind: fact
    level: E2
    status: established
    sources:
    - q5-naruto-city-history
    - q5-tokushima-pref-naruto
  - text: 新市名は中心市街の撫養町と渦潮観光の鳴門町との間で調整が難航し、「撫養鳴門市」の折衷案も出た末に「鳴南市」とすることで妥協したが、市民から不評だったため、合併後初の市議会で改称が決まり2か月で鳴門市に改称された（『鳴門市史 現代編』に基づく徳島新聞の解説による）
