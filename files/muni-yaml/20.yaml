    - x1-matsukawamura-donnatoko
  - text: 1889年（明治22年）4月1日の町村制施行により同区域をもって松川村が発足（当時の人口2,496人・戸数501戸、村役場は細野に置かれた）
    kind: fact
    level: E5
    status: established
    sources:
    - x1-matsukawamura-wiki
  - text: 松川村は明治22年の町村制施行以来、一度も合併等を経験していないと、村役場作成の移住募集資料が紹介する
    kind: fact
    level: E2
    status: established
    sources:
