  summary: 平成17年（2005年）7月1日、曽於郡の末吉町・財部町・大隅町が新設合併して発足した市。市名は3町が属した郡名「曽於郡」をそのまま採用したものである。「曽於」は大隅国の古い郡名に遡り、『和名類聚抄』には「囎唹（そを）」の形でみえる。江戸・明治期の文書でも長く「囎唹郡」の表記が使われ、「曽於」の表記と「そお」という読みは後世のものである。
