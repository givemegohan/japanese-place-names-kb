    - b-cap-chiba-soumu-code
  - text: 志布志市は平成18年（2006年）1月1日、曽於郡の志布志町・有明町・松山町が新設合併して発足した
    kind: fact
    level: E2
    status: established
    sources:
    - s4-shibushi-city
    - s4-shibushi-kotobank
  - text: 市名は合併前の中心町であった志布志町の名を引き継いだものである
    kind: fact
    level: E5
    status: established
    sources:
    - s4-shibushi-wiki
  - text: 「志布志」の文献上の初出は鎌倉末期の1316年、宝満寺再興の折に志布志津の一角を宝満寺に寄進した文書であると志布志市観光特産品協会は紹介している
    kind: fact
    level: E4
    status: established
    sources:
    - s4-shibushi-kanko
  - text: 平安時代、この地域は救仁院と呼ばれ、前川の河口部は荘園・島津荘の港（水門）としての役割を果たしていたと同協会は紹介している
    kind: fact
    level: E4
    status: established
    sources:
    - s4-shibushi-kanko
  - text: この地を訪れた天智天皇が、布を献上した土地の女性と、その召使いの女性の厚い志に感激し、「上下より布を志す、誠にこれは上下の志布志である」と述べて一帯を志布志と呼ぶようになったという伝承がある
    kind: legend
    level: E4
    status: established
    sources:
    - s4-shibushi-kanko
    - s4-shibushi-wiki
  - text: 市の南部の志布志湾に面する志布志港は、中核国際港湾に指定されている
    kind: fact
    level: E5
    status: established
    sources:
    - s4-shibushi-wiki
  column:
    title: 「志」が四つ重なる住所
    text: 志布志市の市役所の住所は「志布志市志布志町志布志二丁目」。「しぶしし・しぶしちょう・しぶし」と同じ音が三段に重なり、漢字では「志」の字が4つ連なる。合併前の旧志布志町の中心地名をそのまま残した結果生まれた表記で、早口言葉のような住所として全国に知られる。もとをたどれば、布を献じた人々の「志」に天皇が感激したという伝説の名であり、言葉遊びのような現代の住所表記の底には、7世紀の天皇にまつわる物語が横たわっている（伝承はあくまで伝承として、市もそのように紹介している）。
    sources:
    - s4-shibushi-kanko
    - s4-shibushi-wiki
  relations:
  - pref/46
  - muni/46-曽於市
  - muni/45-串間市
  unknowns:
  - 「志布志」の語源について、伝説以外の言語学的な解釈は専門辞典で確認できなかった
  - 1316年の寄進文書は観光特産品協会の紹介経由でのみ確認しており、文書そのものは未確認である
  - 2006年の市名選定過程の一次資料は確認できなかった
  updated: '2026-11-13'
- id: muni/46-指宿市
  code: '462101'
  names:
    ja: 指宿市
    reading: いぶすきし
    aliases:
    - 湯豊宿
  user_terms:
  - 指宿の読み方と由来
  - なぜ指宿と書くの
