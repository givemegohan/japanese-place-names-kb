  - text: 松川町は昭和31年（1956年）9月20日に大島村と上伊那郡上片桐村の2村が合併して発足し、昭和34年（1959年）に生田村と高森町の一部を編入合併したと町公式の総合計画が記す。下伊那郡と上伊那郡をまたぐ合併であった
    kind: fact
