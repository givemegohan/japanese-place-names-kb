    sources:
    - r3-yukuhashi-kids
  - text: 1954年10月10日、京都郡行橋町と蓑島・今元・仲津・泉・今川・稗田・延永・椿市の8村が合併して市制を施行し、行橋市は県下18番目の市となった
    kind: fact
    level: E2
    status: established
    sources:
    - r3-yukuhashi-koho
  - text: 市の花コスモスは花びらが8枚であることから、合併した8村を表すものとして市は紹介している
    kind: fact
    level: E2
    status: established
    sources:
    - r3-yukuhashi-koho
  column:
    title: 三つの村から、二文字だけ借りた名前
    text: 1889年に合併したのは行事・大橋・宮市の3村だった。ところが新しい村の名前は「行橋」——行事の「行」と大橋の「橋」だけで、宮市の文字は入らなかった。行事と大橋は、長峡川を挟んで向かい合う古くからの商業の中心地で、人口もこの2地区に集中していた。読みの「ゆくはし」も、行事の読みの流れを引くという。名前は合併の記念碑であると同時に、まちの重心がどこにあったかの記録でもある。
    sources:
    - r3-yukuhashi-shishi
    - r3-yukuhashi-kids
  relations:
  - pref/40
  unknowns:
  - 構成元の行事・大橋・宮市それぞれの地名の由来は確認できなかった
  - 合成に際して宮市の文字が採用されなかった理由は、『行橋市史』の総説では説明されていない
  updated: '2026-11-13'
- id: muni/40-豊前市
  code: '402141'
  names:
    ja: 豊前市
    reading: ぶぜんし
    aliases:
    - 宇島市
    - 八屋町
    - 宇島町
  user_terms:
  - 豊前はなぜ豊前というの
  - 4日だけの宇島市
  - 旧八屋町のあたり
  - 宇島港のまち
  naming_type: 旧国名・広域地名の採用
  naming_note: 合併直後の改称で旧国名「豊前」を採用したもの
  formation: 合併新設
  prefecture: 福岡県
  homonyms: []
  summary: 昭和30年（1955年）4月10日、築上郡の八屋町・山田村・千束村など9町村の合併により「宇島市」として発足したが、わずか4日後の4月14日に旧国名にちなむ「豊前市」へ改称された。「宇島市」は4日間だけ存在した市名である。市の中心は旧八屋町に置かれている。
  first_attestation:
    era: 昭和30年
    year_western: 1955
    document: 宇島市から豊前市への改称（昭和30年4月14日）
    note: 市名「豊前市」としての初出。「豊前」の語自体は旧国名（豊前国）として古代に遡るが、国府は現在の豊前市域にはなく、市名は地域の総称として新たに採用されたものである
  claims:
  - text: 豊前市の地方公共団体コードは402141である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  - text: 昭和30年（1955年）4月10日、八屋町・山田村・千束村・三毛門村・黒土村・横武村・合河村・岩屋村・角田村の9町村が合併し、市制施行により「宇島市」が誕生した
    kind: fact
    level: E2
    status: established
    sources:
    - upg-p11-buzen-city-nenkan
    - upg-p11-fukuoka-gappei
  - text: 当初の合併市名を「宇島市」としたことに対し、旧八屋町の住民が反発して分町を主張し、千束村・横武村が合併から離脱したとWikipediaは伝えるが、豊前市と福岡県の公式の沿革では千束村・横武村は合併した9町村に含まれており、経緯の説明は資料によって食い違う
    kind: fact
    level: E2
    status: contested
    sources:
    - r4-buzen-wikipedia
    - upg-p11-buzen-city-nenkan
  - text: 「宇島市」は発足から4日後の4月14日に「豊前市」へ改称された
    kind: fact
    level: E2
    status: established
    sources:
    - upg-p11-buzen-city-nenkan
  - text: 改称先の「豊前」は、この地域を含む旧国名（豊前国）の名である
    kind: fact
    level: E2
    status: established
    sources:
    - upg-p11-buzen-city-rekishi-kousou
    - upg-p11-buzen-city-nenkan
  column:
    title: 4日間だけ存在した「宇島市」
    text: 昭和30年（1955年）4月10日に誕生した宇島市は、日本の市制史上でも指折りの短命な市名だった。港町・宇島の名を市名にしたことには反発があったと伝えられ、発足からわずか4日後の4月14日、構成町村のいずれの名でもない旧国名「豊前」へ改称された。旧国名による「中立命名」の決着は、昭和の大合併期の市名決定の難しさを今に伝える。なお、反発の末に2村が合併から離脱したとする語りもあるが、市の公式年表ではその2村は合併した9町村に含まれており、経緯の細部は資料によって食い違う。
    sources:
    - r4-buzen-wikipedia
  relations:
  - pref/40
  unknowns:
  - 市名への反発や千束村・横武村の離脱といった改称前後の経緯は、市の公式年表の記録（千束村・横武村は合併した9町村に含まれる）と食い違い、詳細は未確認
  - 「豊前」の名を誰が候補に挙げたかなど、改称決定の内幕は未確認
  updated: '2026-11-13'
- id: muni/40-赤村
  code: '406091'
  names:
    ja: 赤村
    reading: あかむら
    aliases:
    - 上赤村
    - 下赤村
    - 内田村
  user_terms:
  - あか
  - 赤
  - 福岡県に二つある村
  - 我鹿八幡神社
  naming_type: 中心地名の継承
  naming_note: 旧村名「赤」の継承
  formation: 合併新設
  prefecture: 福岡県
  homonyms: []
  summary: 田川郡の村で、福岡県に二つある村の一つ。1889年の町村制施行により赤村が発足した。以後、市町村合併も町制施行もしたことがなく、筑豊地域では唯一の存在である。色の漢字一字だけを名前に使う市町村は全国で赤村だけと言われる。「赤」の語源は未詳だが、村内の我鹿（あか）八幡神社に結びつける説が紹介されている。
  first_attestation:
    era: 明治時代
    year_western: 1887
    document: 上赤村・下赤村・山浦村の合併による赤村の発足
    note: 「赤」の地名自体は、上赤村・下赤村という村名としてこれ以前から存在した。「赤」の初出文献と語源は確認できなかった
  claims:
  - text: 1889年4月1日の町村制施行により赤村が発足し、その区域は現在まで続いている
    kind: fact
    level: E2
    status: established
    sources:
    - r5-aka-geoshape
  - text: 赤村は福岡県に二つある村の一つであり、筑豊地域では町村制施行以降に市町村合併も町制施行もしたことのない唯一の村である
    kind: fact
    level: E2
    status: established
    sources:
    - h5-jlis-fukuoka
    - r5-aka-geoshape
  - text: 歴史的行政区域データセットによれば、赤村の行政区域は1889年4月1日以降継続しており、行政区域コードは40609である
    kind: fact
    level: E2
    status: established
    sources:
    - r5-aka-geoshape
  - text: 昭和の大合併では、大任村（現・大任町）から合併を申し入れられたがこれを拒み、香春町・勾金村・採銅所村との1町3村合併を目指したものの香春町が拒んだため合併に至らなかった
    kind: fact
    level: E5
    status: established
    sources:
    - r5-aka-wiki
  - text: 村名「赤」の由来には、『日本書紀』安閑天皇紀にみえる我鹿屯倉の「我鹿」を「あか」と読むことに結びつける説がある。我鹿屯倉は現在の赤村一帯に比定され、村内には「我鹿」と書いて「あか」と読む我鹿八幡神社があるが、由来の確証は得られていない
    kind: fact
    level: E3
    status: indeterminate
    sources:
    - upg-p2-aka-aga-kotobank
  - text: 内田三連橋梁は国の登録有形文化財であり、第二石坂トンネルは九州最古の鉄道トンネルとされ、未成に終わった国鉄油須原線の路盤を使った観光トロッコ「赤村トロッコ油須原線」がある
    kind: fact
    level: E2
    status: established
    sources:
    - upg-p2-aka-kunishitei
    - upg-p2-aka-acros
  - text: 赤村の地方公共団体コードは406091である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 合併を二度断った村――残った「赤」一字
    text: 赤村は、合併の誘いを断り続けてきた村である。昭和の大合併では、隣の大任村（現・大任町）からの申し入れを拒み、香春町などとの1町3村合併も相手方の拒否で流れた。平成の大合併の波も越え、赤村は福岡県に残る二つの村の一つとして残った。色の漢字一字をそのまま名前にする市町村は全国でも赤村だけと言われる。その「赤」の由来は定かでないが、村の我鹿八幡神社は「我鹿」と書いて「あか」と読み、「赤は色ではなかった」とする説も紹介されている。一字の名の奥に、まだ解かれていない物語がある。
    sources:
    - r5-aka-wiki
    - r5-aka-note
  relations:
  - pref/40
  unknowns:
  - 「赤」の語源（赤土に由来する説、我鹿に由来する説など）は確定できなかった
  - 「赤」の初出文献は確認できなかった
  updated: '2026-11-13'
- id: muni/40-遠賀町
  code: '403849'
  names:
    ja: 遠賀町
    reading: おんがちょう
    aliases:
    - 遠賀村
  user_terms:
  - 遠賀
  - おんが
  - 遠賀川
  naming_type: 旧行政区画名の継承
  naming_note: 1929年の島門村・浅木村の合併に際し、郡名「遠賀」を新村名に採用した
  formation: 合併新設
  prefecture: 福岡県
  homonyms: []
  summary: 遠賀郡の町で、町名は郡名「遠賀」の転用である。「遠賀」のもとは遠賀川河口の丘陵を指した「岡（ヲカ）」で、『日本書紀』の岡県・岡水門に端を発し、『延喜式』で「遠賀」と書かれるようになった。読みが「おか」から「おんが」に転じたのは、室町期に御牧郡と改められた郡名が1664年に遠賀郡へ戻された後のことといわれる。
  first_attestation:
    era: 奈良時代
    year_western: 720
    document: 『日本書紀』（岡県・岡水門）
    note: 町公式が「遠賀」の由来の端緒とする記載。現在の二字表記「遠賀」そのものの初出ではなく、元の地名「岡」の用例である。「遠賀」の表記は『延喜式』など奈良・平安期の文献に見える
  claims:
  - text: 遠賀町の地方公共団体コードは403849である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  - text: 町公式は、「遠賀」という地名の由来は『日本書紀』に詠まれた「岡県・岡水門」や『万葉集』の「水茎の岡の水門」に端を発していると説明する
    kind: fact
    level: E2
    status: established
    sources:
    - r6-onga-town-yurai
  - text: 町誌によれば、遠賀地方の最も古い地名表記である「岡」「塢舸」「崗」の語源は地形に由来し、ヲは高い所、カは処で「岡」「丘」の意であり、その後『続日本紀』が「遠珂」、『延喜式』が「遠賀」というように文字が変化した
    kind: fact
    level: E2
    status: established
    sources:
    - r6-onga-choshi
  - text: 町誌によれば、遠賀郡は室町時代初期に「御牧郡」と改称されるまで「遠賀」と呼ばれて「ヲカ」と読まれ、「オンガ」と読むようになったのは寛文4年（1664年）に御牧郡を旧名の遠賀郡に戻して以降のことといわれる
    kind: fact
    level: E2
    status: established
    sources:
    - r6-onga-choshi
  - text: 江戸時代の国学者・伊藤常足は『太宰管内志』で「遠賀は広き岡のあるに依れり」と説明しており、町誌がこれを紹介している
    kind: fact
    level: E2
    status: established
    sources:
    - r6-onga-choshi
  - text: 町誌によれば、古代の遠賀川河口周辺は崗津（岡津）と呼ばれ、瀬戸内海経由で朝鮮・中国へ向かう船の中継泊地として海上交通の要衝であった
    kind: fact
    level: E2
    status: established
    sources:
    - r6-onga-choshi
  - text: 1929年（昭和4年）4月1日に島門村と浅木村が合併して遠賀村が誕生し、1964年（昭和39年）4月1日に遠賀郡では最後となる町制を実施して遠賀町となった
    kind: fact
    level: E2
    status: established
    sources:
    - r6-onga-town-yurai
  column:
    title: ヲカがオンガになるまで
    text: 遠賀はずっと「ヲカ」だった。ところが室町時代の初め、郡名は「御牧郡」に改められてしまう。江戸時代の寛文4年（1664年）に旧名の遠賀郡へ戻されたのだが、その頃から読みは「オンガ」へと転じていったと町誌はいう。漢字は元に戻っても、読みは戻らなかったわけである。遠賀川も遠賀郡も遠賀町も、この「戻って変わった」名を分かち合っている。
    sources:
    - r6-onga-choshi
    - r6-onga-town-yurai
  relations:
  - pref/40
  - muni/40-鞍手町
  unknowns:
  - 『日本書紀』の「岡県」の用例を原文で直接確認したわけではなく、町公式・町誌の紹介による
  - 「御牧郡」への改称の正確な年次と理由は、参照した町誌の記述では特定できなかった
  updated: '2026-11-13'
- id: muni/40-那珂川市
  code: '402311'
  names:
    ja: 那珂川市
    reading: なかがわし
    aliases:
    - 那珂川町
  user_terms:
  - 那珂川はなぜ那珂川というの
  - 福岡でいちばん新しい市
  - 旧那珂川町
  - 裂田溝（さくたのうなで）のまち
  naming_type: 自然地名から
  formation: 合併新設
  prefecture: 福岡県
  homonyms: []
  summary: 平成30年（2018年）10月1日、筑紫郡那珂川町が単独で市制を施行して発足した、福岡県では21年ぶりの新しい市。市名は市を貫流する那珂川に由来し、町自体は昭和31年（1956年）に南畑村・岩戸村・安徳村が合併して誕生した。この川には古代の用水路・裂田溝が今も残り、安徳の地名には安徳天皇の行宮伝承が結びついて伝えられる。
  first_attestation:
    era: 昭和31年
    year_western: 1956
    document: 町村合併による筑紫郡那珂川町の発足（昭和31年4月1日）
    note: 町名としての初出。川名「那珂川」自体はこれより古く、古代の筑前国には那珂郡も置かれたが、川名の初出と語源は確認できていない
  claims:
  - text: 那珂川市の地方公共団体コードは402311である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  - text: 明治22年（1889年）に南畑村・岩戸村・安徳村の三村が誕生し、昭和31年（1956年）4月1日にこの三村が合併して筑紫郡那珂川町が誕生したと市公式の沿革は伝える
    kind: fact
    level: E2
    status: established
    sources:
    - r4-nakagawa-city-gaiyo
  - text: 平成27年（2015年）の国勢調査で人口5万人を突破し、平成30年（2018年）10月1日、福岡県内では21年ぶりの単独市制施行により那珂川市が誕生した
    kind: fact
    level: E2
    status: established
    sources:
    - r4-nakagawa-gikai-yoran
  - text: 那珂川は背振連山に源を発し、市の中央を南北に貫流して博多湾に注ぐ川であり、町名・市名はこの川に由来する
    kind: fact
    level: E2
    status: established
    sources:
    - r4-nakagawa-city-gaiyo
  - text: 市内には、那珂川の「一の井手」から安徳・五郎丸・松木を通って今光に至る総延長約5.5kmの人工用水路「裂田溝（さくたのうなで）」が残り、市は『日本書紀』にゆかりを持つ古い用水路と説明している
    kind: fact
    level: E2
    status: established
    sources:
    - r4-nakagawa-sakuta
  - text: 合併前の安徳村の地である安徳台には、壇ノ浦へ向かう途中の安徳天皇と平家一門を迎えた居館（行宮）が置かれたと伝えられ、「安徳」の名の起こりとされる
    kind: legend
    level: E4
    status: established
    sources:
    - r4-nakagawa-antoku-kyodo
  column:
    title: 幼い帝を悼みつづける村の名
    text: 那珂川市の一角、安徳台には、寿永の乱のさなか九州に下向した安徳天皇と平家一門の居館が置かれたという伝承がある。やがて壇ノ浦で8歳の生涯を閉じた幼帝を悼み、地元では安徳宮を祀り、命日には「天皇さまこもり」の行事が今も続けられているという。昭和31年（1956年）に南畑・岩戸と合併して那珂川町が生まれたとき、「安徳」の名は村の名としては消えたが、地区の名と伝承は残った。市名は川の名に譲られたが、市内には帝の名を負う古い地名が静かに生きている。
    sources:
    - r4-nakagawa-antoku-kyodo
    - r4-nakagawa-city-gaiyo
  relations:
  - pref/40
  unknowns:
  - 川名「那珂川」の語源と初出は、公的・専門資料では確認できなかった（古代の筑前国那珂郡の「那珂」との関係も含め未確定）
  - 昭和31年（1956年）の合併に際して川名を町名に採用した決定過程の詳細は、公表資料では確認できなかった
  updated: '2026-11-13'
