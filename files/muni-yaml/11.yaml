  user_terms:
  - 日高市の名前の由来
  - 高麗神社のある市
  - 巾着田
  - 遠足の聖地
  naming_type: 合成地名
  formation: 編入合併
  prefecture: 埼玉県
  homonyms: []
  summary: 市名は、昭和30年（1955年）の合併で生まれた合成名である。日和田山の「日」と、高麗・高麗川・高萩と合併した村々に共通する「高」を合わせたと伝えられる。その土地の古層は深く、霊亀2年（716年）に高句麗系の人々を移して置かれた武蔵国高麗郡の故地で、高麗神社と高麗川にその名を残す。平成3年（1991年）に市制を施行した。
  first_attestation:
    era: 昭和30年
    year_western: 1955
    document: 日高町の発足（高麗村・高麗川村の新設合併）
    note: 市名「日高」の初出は合併時の命名そのもの。土地の古い名としては高麗郡（716年設置）が遡る先になる
  claims:
  - text: 市の歴史は、『続日本紀』霊亀2年（716年）の項に、駿河・甲斐・相模・上総・下総・常陸・下野の七か国の高麗人1799人を移して高麗郡を設置したと書かれていることを紹介する
    kind: fact
    level: E2
    status: established
    sources:
    - w2-hidaka-history
  - text: 高麗郡には高麗郷と上総郷の2郷が置かれ、その範囲は現在の日高市と飯能市を中心とした範囲と推測されている
    kind: fact
    level: E2
    status: established
    sources:
    - w2-hidaka-history
  - text: 高麗郡の長とされる高麗王若光は高麗明神として高麗神社に祀られ、その宮司は若光の子孫が代々勤めている
    kind: fact
    level: E2
    status: established
    sources:
    - w2-hidaka-history
  - text: 明治22年（1889年）に高麗村・高麗川村・高萩村の3村に統合され、昭和30年（1955年）2月11日に高麗村と高麗川村が合併して日高町が発足、翌年9月20日に高萩村を編入した
    kind: fact
    level: E5
    status: established
    sources:
    - w2-hidaka-wiki
  - text: 「日高」の名は合併の際の公募で選ばれ、日和田山の「日」と「高麗」の「高」をとって合わせたものとする説が有力とされる
    kind: fact
    level: E2
    status: established
    sources:
    - w2-hidaka-hokkaido
  - text: 平成3年（1991年）10月1日に市制を施行して日高市となった
    kind: fact
    level: E5
    status: established
    sources:
    - w2-hidaka-wiki
  - text: 高麗川が大きく蛇行してできた巾着田はヒガンバナの名所として知られ、高麗郷一帯の人気から市は2017年に「遠足の聖地」を宣言した
    kind: fact
    level: E5
    status: established
    sources:
    - w2-hidaka-wiki
  column:
    title: 駅も川も「高麗」なのに、なぜ「日高」なのか
    text: 日高市を訪れると、駅は高麗川駅と高麗駅、川は高麗川、社は高麗神社と、「高麗」だらけである。にもかかわらず市名は「日高」。合併の公募で選ばれたこの名は、高麗・高麗川・高萩という「高」の字を持つ村々と、市のシンボル日和田山の「日」を組み合わせた合成名だと伝えられる。北海道の日高地方（古代の「日高見国」にちなむ）と違って、埼玉の日高は昭和の合併が生んだ新しい名だが、その下には716年の高麗郡という古い層が横たわっている。
    sources:
    - w2-hidaka-hokkaido
    - w2-hidaka-history
  relations:
  - pref/11
  - muni/11-坂戸市
  unknowns:
  - 「日高」の命名の公募記録などの一次資料は未確認で、由来の説明は伝承レベルの紹介にとどまる
  - 高麗郡の郡衙の所在地など、古代の中心地の比定は未了
  updated: '2026-11-13'
- id: muni/11-春日部市
  code: '112143'
  names:
    ja: 春日部市
    reading: かすかべし
    aliases:
    - 粕壁町
    - 粕壁宿
    - 春日部町
    - 糟壁
  user_terms:
  - 春日部と粕壁の違い
  - かすかべの名前の由来
  - 春日部はなぜ春日部と書くのか
  - クレヨンしんちゃんのまち
  naming_type: 表記・読みの変更
  naming_note: 旧表記「粕壁」から、武家・春日部氏ゆかりの古い表記「春日部」を1944年に復活させた
  formation: 合併新設
  prefecture: 埼玉県
  homonyms: []
  summary: 読みは一貫して「かすかべ」だが、漢字表記は揺れてきた。もともとの表記は「春日部」で、南北朝時代の記録には下総国春日部郷が見える。戦国時代から江戸時代にかけて糟壁・粕壁と書かれるようになり、日光街道の宿場は粕壁宿と呼ばれた。昭和19年（1944年）の合併で春日部氏ゆかりの古い表記「春日部」が復活し、昭和29年（1954年）に市制を施行。平成17年（2005年）に庄和町と合併した際も、市名は「春日部」のままだった。
  first_attestation:
    era: 建武3年
    year_western: 1336
    document: 後醍醐天皇綸旨（春日部重行への下総国春日部郷地頭職の安堵）
    note: 春日部市郷土資料館が「かすかべ」の確かな記録として挙げるもの（同館ブログの内容を整理した地域メディアの紹介による）
  claims:
  - text: 春日部市郷土資料館によれば、「春日部」はもともとの古い表記であり、戦国時代から江戸時代にかけて「糟ケ辺」「糟壁」と書かれるようになり、17世紀後半以降は「粕壁」という表記が増えていった。これらは「かすかべ」という音に漢字を当てたものと考えられ、江戸時代の宿場町は「粕壁宿」と表記された
    kind: fact
    level: E2
    status: established
    sources:
    - m4-kasukabe-hogolog
  - text: 春日部市公式資料によれば、昭和19年（1944年）の戦時合併で内牧村と粕壁町が合併し、春日部氏ゆかりの名をとって春日部町が成立した。郷土資料館も、後醍醐天皇を支えた南朝方の武士・春日部氏の苗字であったため「春日部」の表記が選択されたようだとし、最も古い表記が復活したともいえると述べる
    kind: fact
    level: E2
    status: established
    sources:
    - m4-kasukabe-ayumi
    - m4-kasukabe-hogolog
  - text: 春日部市郷土資料館によれば、「粕壁」という表記については、宿場町の土蔵が荒壁だったから、あるいは造り酒屋の酒粕に由来するという説もあるが、実際のところはよく分かっていない
    kind: fact
    level: E2
    status: established
    sources:
    - m4-kasukabe-hogolog
  - text: 地名「かすかべ」の語源については、安閑天皇の皇后・春日山田皇女に仕えた御名代部（みなしろべ）に由来するという説があるが、その部が当地に置かれた証拠はない。また武士の春日部氏に由来するという説については、郷土資料館は「地名が先にあり、一族がそれを名乗った」として成り立たないと整理しており、語源に定説はない
    kind: fact
    level: E5
    status: contested
    sources:
    - m4-kasukabe-mag
  - text: 春日部市公式資料によれば、昭和29年（1954年）に春日部市が誕生し、平成17年（2005年）10月に春日部市と庄和町が合併して新しい春日部市が誕生した。この合併でも市名は変更されず、読みも表記も「かすかべ／春日部」のままだった
    kind: fact
    level: E2
    status: established
    sources:
    - m4-kasukabe-ayumi
  - text: 総務省の全国地方公共団体コードで、春日部市のコードは112143と定められている（J-LISの埼玉県内市町村一覧による）
    kind: fact
    level: E2
    status: established
    sources:
    - k1-jlis-saitama
  column:
    title: 同じ読み、2つの漢字が同居するまち
    text: 春日部市内を歩くと、「粕壁東」という住所や「粕壁小学校」の校名に出会う。書き間違いではない。市域全体を指す名は「春日部」、江戸時代の宿場町だった区域の地名は「粕壁」で、今も使い分けられているのだ。1944年に市の名が古い「春日部」に戻った後も、宿場の「粕壁」は地区の名として生き残った。読みは同じ「かすかべ」。2つの漢字が、1つの町の2つの時代を担っている。
    sources:
    - m4-kasukabe-hogolog
  relations:
  - pref/11
  unknowns:
  - 「かすかべ」の語源は定説なし（御名代部説は証拠がなく、春日部氏説は郷土資料館が否定している）
  - 1336年の綸旨以前の「春日部」の用例は確認できていない
  - 「粕壁」の字の起こり（荒壁説・酒粕説）は郷土資料館も不明としている
  updated: '2026-11-13'
- id: muni/11-朝霞市
  code: '112275'
  names:
    ja: 朝霞市
    reading: あさかし
    aliases:
    - 膝折村
    - 膝折宿
    - 朝霞町
    - 内間木村
  user_terms:
  - 朝霞市の名前の由来
  - 膝折
  - 朝霞駐屯地
  - あさか
  naming_type: 人名に由来
  formation: 改称
  prefecture: 埼玉県
  homonyms: []
  summary: 市名は、昭和7年（1932年）の町制施行に際して旧名「膝折」から改めた名である。駒沢から東京ゴルフ倶楽部が移転してくるのを機に、その名誉会長だった皇族・朝香宮鳩彦王の宮号をいただき、畏れ多いとして一字を変えて「朝霞」とした。旧名の膝折は川越街道の宿場・膝折宿以来の名で、昭和42年（1967年）に市制を施行した。
  first_attestation:
    era: 文明10年
    year_western: 1478
    document: 『太田道灌書状写』（松平文庫所蔵文書）の膝折宿
    note: 旧名「膝折」の古い用例として紹介されるもの。市名「朝霞」自体は1932年の命名
  claims:
  - text: 旧名「膝折」は、逃れてきた武将の馬がこの地で膝を折って息絶えたことに由来するという言い伝えで語られる
    kind: legend
    level: E5
    status: established
    sources:
    - w2-asaka-wiki
  - text: 膝折宿は川越街道の宿場町で、その名は文明10年（1478年）に太田道灌が着陣した所として書状に記述があるとされる
    kind: fact
    level: E5
    status: established
    sources:
    - w2-asaka-wiki
  - text: 昭和5年（1930年）、東京府駒沢にあった東京ゴルフ倶楽部のゴルフ場が膝折村に移転することになり、これをきっかけに村名の改称と町制施行の機運が高まった
    kind: fact
    level: E2
    status: established
    sources:
    - w2-asaka-naritachi
  - text: 昭和7年（1932年）5月1日、町制施行と同時に朝霞町が誕生した。改称にあたっては、東京ゴルフ倶楽部の名誉会長であった朝香宮殿下の名をいただき、「朝霞」とすることになったと市は説明する
    kind: fact
    level: E2
    status: established
    sources:
    - w2-asaka-naritachi
  - text: 宮号「朝香」をそのまま使用するのは畏れ多いということで一字変えて「朝霞」となったとされ、「膝折」という名前自体に縁起が悪いという印象があったことも改名の背景にあった
    kind: fact
    level: E5
    status: established
    sources:
    - w2-asaka-wiki
  - text: 東京ゴルフ倶楽部から発せられた町名改称の許可書は、市の指定文化財として大切に保管されている
    kind: fact
    level: E2
    status: established
    sources:
    - w2-asaka-naritachi
  - text: 東京ゴルフ倶楽部朝霞コースは昭和16年（1941年）に閉場し、その跡地の大部分は現在の陸上自衛隊朝霞駐屯地となっている
    kind: fact
    level: E4
    status: established
    sources:
    - w2-asaka-golf
  - text: 昭和30年（1955年）4月1日に朝霞町と内間木村が合併し、昭和42年（1967年）3月15日に市制を施行して朝霞市となった
    kind: fact
    level: E2
    status: established
    sources:
    - w2-asaka-nenpyo
  column:
    title: ゴルフ場が連れてきた皇族の名前
    text: 「膝折」という名は、馬が膝を折ったという言い伝えを持つ一方、どこか縁起の悪い響きがあった。そこへ国内屈指のゴルフ倶楽部が移転してくる。村は町制施行の機会に改名を決め、倶楽部の名誉会長だった皇族・朝香宮の宮号を請うた。宮号をそのまま使うのは畏れ多いと一字変えた「朝霞」が新しい町の名になり、倶楽部からの改称許可書はいま市の文化財になっている。スポーツ施設の移転が市名を生んだ、全国でも珍しい成り立ちである。
    sources:
    - w2-asaka-naritachi
    - w2-asaka-wiki
  relations:
  - pref/11
  - muni/11-和光市
  - muni/11-志木市
  - muni/11-新座市
  unknowns:
  - 「膝折」の由来とされる武将の馬の話は言い伝えの域を出ず、史実としての裏付けは確認できていない
  - 改称許可書そのものの文面の直接確認は未了
  updated: '2026-11-13'
- id: muni/11-本庄市
  code: '112119'
  names:
    ja: 本庄市
    reading: ほんじょうし
    aliases:
    - 本庄町
  user_terms:
  - 本庄市の名前の由来
  - 本庄氏と児玉党
  - 本庄はなぜ本庄というのか
  naming_type: 中心地名の継承
  formation: 分村・分立
  prefecture: 埼玉県
  homonyms: []
  summary: 市名は中世の武士団に由来するとされる地名「本庄」を受け継いだものである。武蔵七党最大の児玉党の本宗家・庄氏から分かれた本庄氏が当地に土着したことが地名の由来とされるが、本庄氏の系譜には諸説があり断定はできない。昭和29年（1954年）に市制を施行し、平成18年（2006年）に児玉町と新設合併した。
  first_attestation:
    era: 鎌倉時代（13世紀）
    year_western: null
    document: 本庄時家の名乗り（本庄氏の成立）
    note: 庄家長の四男・時家が本庄氏を名乗り北堀に館を築いたとされる時期。系譜には諸説があり、確実な初出とは言えない
  claims:
  - text: 地名の由来は、武蔵七党最大の武士団・児玉党の本宗家である庄氏から派生した本庄氏が、この地に土着したことにあるとされる。12世紀頃に庄家弘が現在の栗崎の地に館を築き、13世紀頃に本庄時家が本庄氏を名乗って北堀の地に館を築いたという。ただし本庄氏の由来や系譜は研究途上で諸説あり、断定はできないとされる
    kind: fact
    level: E5
    status: contested
    sources:
    - m4-honjo-wiki
  - text: 一方で、市名の由来を本庄城に求める説明もある。本庄実忠が1556年に築いた本庄城の名にちなむとする見方である
    kind: fact
    level: E5
    status: contested
    sources:
    - m4-honjo-wiki
  - text: 市域には、4世紀中頃まで遡る県内最古級かつ最大（全長約60m）の前方後方墳である鷺山古墳や、大久保山古墳群など古墳時代の遺跡が多く、古代から児玉地域の中心の一つだった
    kind: fact
    level: E5
    status: established
    sources:
    - m4-honjo-wiki
  - text: 昭和29年（1954年）7月1日、本庄町・藤田村・仁手村・旭村・北泉村が合併して本庄市となり、平成18年（2006年）1月10日に旧本庄市と児玉町が新設合併して現在の本庄市となった
    kind: fact
    level: E5
    status: established
    sources:
    - m4-honjo-wiki
  - text: 総務省の全国地方公共団体コードで、本庄市のコードは112119と定められている（J-LISの埼玉県内市町村一覧による）
    kind: fact
    level: E2
    status: established
    sources:
    - k1-jlis-saitama
  column:
    title: 県内最古級の古墳が眠る児玉の中心地
    text: 本庄の名が武士の名字として現れるはるか前、この地は古代児玉の中心だった。旧児玉町域の鷺山古墳は4世紀中頃の前方後方墳で、県内最古級かつ最大とされる。本庄台地には大久保山古墳群をはじめ巨大な古墳が集中する。「本庄」という中世の名の下には、古墳時代からの重みのある土地の歴史が折り重なっている。
    sources:
    - m4-honjo-wiki
  relations:
  - pref/11
  unknowns:
  - 本庄氏の系譜と地名由来は諸説あり未確定（本庄城由来とする説明も併記した）
  - 市の公式資料による由来説明は確認できなかった
  updated: '2026-11-13'
- id: muni/11-杉戸町
  code: '114642'
  names:
    ja: 杉戸町
    reading: すぎとまち
    aliases:
    - 杉戸宿
    - 清地村
    - 倉松村
  user_terms:
  - 杉戸町の名前の由来
  - すぎと
  - 杉戸宿
  - 日光街道の宿場町
  naming_type: 中心地名の継承
  formation: 合併新設
  prefecture: 埼玉県
  homonyms: []
  summary: 日光街道の宿場町・杉戸宿の名を受け継ぐ町である。「杉戸」は「杉津」「杉渡」の意で、当時の利根川（現在の大落古利根川）の渡し場だったとも考えられると専門辞典は解説する。元和2年（1616年）に人馬の継立を命じられて杉戸宿が始まり、明治22年（1889年）に杉戸町となり、昭和30年（1955年）の合併で現在の杉戸町となった。
  first_attestation:
    era: 江戸時代初期
    year_western: null
    document: 『武蔵田園簿』『元禄郷帳』にみえる「杉戸町」
    note: 日本歴史地名大系が紹介する近世の用例。地名自体はそれ以前に遡るとみられるが、初出の特定は未了
  claims:
  - text: 日本歴史地名大系は「杉戸は『杉津』『杉渡』の意で、利根川の渡場であったとも考えられる」と解説し、川の渡し場にちなむ名である可能性を示す
    kind: fact
    level: E3
    status: indeterminate
    sources:
    - w10-sugito-kotobank-juku
  - text: 日本歴史地名大系によれば、『武蔵田園簿』や『元禄郷帳』にはすでに「杉戸町」と記され、幕府領として幕末に至ったとみられる
    kind: fact
    level: E2
    status: established
    sources:
    - w10-sugito-kotobank-juku
  - text: 町によれば、杉戸宿は江戸幕府が元和2年（1616年）に日光街道に設置したといわれる宿場で、日本橋から日光まで21ある宿場の5番目にあたる
    kind: fact
    level: E2
    status: established
    sources:
    - w10-sugito-town-machiaruki
  - text: 町の総合振興計画によれば、明治22年（1889年）に杉戸宿が隣接の清地村・倉松村と合併して杉戸町となり、昭和30年（1955年）に旧杉戸町・高野村・堤郷村・田宮村が合併して新たな杉戸町が誕生した
    kind: fact
    level: E2
    status: established
    sources:
    - w10-sugito-town-plan
  - text: 同計画によれば、その後、昭和31年に本島地区が幸手町から杉戸町に編入され、昭和32年には泉村を編入合併し、現在の町域となった
    kind: fact
    level: E2
    status: established
    sources:
    - w10-sugito-town-plan
  - text: 地方公共団体コードは114642である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 宿場開き400年の町
    text: 2016年、杉戸宿は誕生からちょうど400年を迎えた。町はこれを機に宿場のルーツを調べ直し、「杉戸宿まち歩きガイドブック」にまとめた。本陣跡や問屋場跡、蘭学者の渡辺崋山も絵に残した弁天池など、街道の記憶は町並みのあちこちに残っている。渡し場の名が宿場の名になり、宿場の名がそのまま町の名になった四百年である。
    sources:
    - w10-sugito-town-machiaruki
  relations:
  - pref/11
  - muni/11-宮代町
  unknowns:
  - 「杉津・杉渡」説は専門辞典が「考えられる」とする推定であり、他の語源説（杉の多い土地の意など）との優劣は決められない
  - 中世の杉戸村（上杉戸・下杉戸）が分かれた過程など、宿場以前の地名の詳細は未確認
  updated: '2026-11-13'
- id: muni/11-東松山市
  code: '112127'
  names:
    ja: 東松山市
    reading: ひがしまつやまし
    aliases:
    - 松山町
    - 松山
  user_terms:
  - 東松山市の名前の由来
  - なぜ東松山なのか
  - 幻の松山市
  - 松山城下町
  naming_type: 中心地名の継承
  naming_note: 「松山市」を申請したが先行する愛媛県松山市と同一名になるため認められず、「東」を冠した
  formation: 単独発足
  prefecture: 埼玉県
  homonyms: []
  summary: 市の中心は武蔵松山城の城下町だった松山町で、市名はその「松山」に由来する。昭和29年（1954年）の市制施行にあたり「松山市」とすることを申請したが、既に市制を施行していた愛媛県松山市と同一の市名になるため自治庁に認められず、東の松山という意味で「東松山市」となった。
  first_attestation:
    era: 昭和29年
    year_western: 1954
    document: 市制施行時の市名（東松山市）
    note: 市名としての初出。「松山」の地名自体は中世の松山城とその城下町に遡る
  claims:
  - text: 現在の中心部は、1333年に上杉氏麾下の上田友直によって築城されたとされる松山城の城下町として発展した松山町だった。なお松山城の跡自体は、現在の比企郡吉見町域にある
    kind: fact
    level: E5
    status: established
    sources:
    - m4-higashimatsuyama-wiki
  - text: 昭和29年（1954年）7月1日に市制を施行する際、当初は松山町から採った「松山市」とする予定で申請したが、自治庁は既存の愛媛県松山市と同一の市名を認めず、愛媛の松山市に対して東の松山市という意味で「東松山市」が市名となった
    kind: fact
    level: E5
    status: established
    sources:
    - m4-higashimatsuyama-wiki
  - text: この東松山市の経緯は、昭和45年（1970年）に同一の市名は認めない旨の自治事務次官通知が出される先駆けとなり、その後も東久留米市・東大和市といった「東」を冠する市名が続いた
    kind: fact
    level: E5
    status: established
    sources:
    - m4-higashimatsuyama-wiki
  - text: 現在でも市内には埼玉県立松山高等学校・埼玉県立松山女子高等学校や松山神社など、「東」を冠しない「松山」の名を残す施設があり、高齢者を中心に当市を慣習的に「松山」と呼ぶ人もいる
    kind: fact
    level: E5
    status: established
    sources:
    - m4-higashimatsuyama-wiki
  - text: 総務省の全国地方公共団体コードで、東松山市のコードは112127と定められている（J-LISの埼玉県内市町村一覧による）
    kind: fact
    level: E2
    status: established
    sources:
    - k1-jlis-saitama
  column:
    title: 幻の「松山市」
    text: 1954年、松山町は「松山市」になるはずだった。先行事例もあったが、自治庁は愛媛県の松山市と重なる名を認めず、妥協の産物として「東松山市」が生まれた。全国で同じ市名は存在しないという今の常識は、この頃に固まったものだ。市内には今も「松山高校」「松山女子高」など、東の付かない松山が残っている。地元の人の口から「松山に行く」と聞いたら、それは四国ではなくこの町のことだと思っていい。
    sources:
    - m4-higashimatsuyama-wiki
  relations:
  - pref/11
  - muni/38-松山市
  unknowns:
  - 「松山」という地名そのものの語源（松山城の名の由来）は未確認
  - 市名申請をめぐる自治庁との折衝の一次資料は未確認で、二次資料による
  updated: '2026-11-13'
- id: muni/11-東秩父村
  code: '113697'
  names:
    ja: 東秩父村
    reading: ひがしちちぶむら
    aliases:
    - 大河原村
    - 槻川村
    - 外秩父
  user_terms:
  - 東秩父村の名前の由来
  - ひがしちちぶ
  - 埼玉県唯一の村
  - 和紙の里ひがしちちぶ
  - 細川紙
  naming_type: 方位・位置による命名
  formation: 合併新設
  prefecture: 埼玉県
  homonyms: []
  summary: 埼玉県で唯一の村。昭和31年（1956年）に大河原村と槻川村が合併して生まれた。「東秩父」の名は、秩父郡に属しながら秩父盆地から山を隔てた東側にあるという位置に由来する。分水嶺の東側にありながら秩父郡に属したこの一帯は、古く「外秩父」とも呼ばれた地域で、広域行政の結びつきは秩父側より比企郡側が強い。
  first_attestation:
    era: 昭和31年
    year_western: 1956
    document: 大河原村・槻川村の合併による東秩父村の新設（8月1日）
    note: 村名「東秩父」そのものの初出で、合併新設に伴う命名
  claims:
  - text: 埼玉県校外教育協会の研究紀要（東秩父村立東秩父中学校）は、東秩父村は埼玉県内で唯一の村で、「秩父盆地から山を隔てた東側にあることから名づけられた」と記す
    kind: fact
    level: E2
    status: established
    sources:
    - w10-higashichichibu-pref-journal
  - text: 村の公式概要も、村が秩父郡に属しているものの秩父盆地から山を隔てた東側にあることから、広域行政においては秩父地方ではなく隣接する比企郡の自治体とともに比企広域市町村圏組合を構成すると説明する
    kind: fact
    level: E2
    status: established
    sources:
    - w10-higashichichibu-vill-profile
  - text: 昭和31年（1956年）8月1日、秩父郡大河原村と槻川村が合併して東秩父村が新設された。大河原村は安戸村・御堂村・奥沢村から、槻川村は大内沢村・坂本村・皆谷村・白石村から、明治22年（1889年）に成立した村である
    kind: fact
    level: E5
    status: established
    sources:
    - w10-higashichichibu-wiki
  - text: 平成18年（2006年）2月1日に都幾川村と玉川村が合併してときがわ町となって以降、東秩父村は埼玉県内で唯一の村である
    kind: fact
    level: E5
    status: established
    sources:
    - w10-higashichichibu-wiki
  - text: 村は隣接する小川町とともに細川紙の産地であり「和紙の里」として知られ、その製法技術は昭和53年（1978年）に国の重要無形文化財に指定された
    kind: fact
    level: E2
    status: established
    sources:
    - w10-higashichichibu-pref-journal
  - text: 江戸時代、荒川水系と入間川水系の分水嶺の東側にあった秩父郡の村々は「外秩父」と呼ばれ、大河原村・槻川村の前身の村々もその東側に位置していた
    kind: fact
    level: E5
    status: indeterminate
    sources:
    - w10-higashichichibu-sotochichibu
  - text: 地方公共団体コードは113697である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 秩父を名乗り、比企と暮らす村
    text: 村の名前は「東秩父」だが、消防もごみ処理も、広域行政は山の東側の比企郡の仲間と一緒である。秩父盆地とは尾根ひとつ隔てただけで、暮らしの向きはまるで違う。その「ねじれ」こそが、この地名の由来そのものだ。県内に村が一つだけになった今では、「埼玉県唯一の村」という肩書きも、この村のアイデンティティになっている。
    sources:
    - w10-higashichichibu-vill-profile
    - w10-higashichichibu-wiki
  relations:
  - pref/11
  - muni/11-小川町
  - muni/11-寄居町
  unknowns:
  - 1956年の合併時に新村名「東秩父」が選ばれた過程（候補案や公募の有無）を示す記録は未確認
  - 「外秩父十八村」の数え方と当村域の村々の対応関係は、資料により幅がある
  updated: '2026-11-13'
- id: muni/11-松伏町
  code: '114651'
  names:
    ja: 松伏町
    reading: まつぶしまち
    aliases:
    - 松伏領村
    - 松伏村
    - 松伏領
    - 金杉村
  user_terms:
  - 松伏町の名前の由来
  - まつぶし
  - 伏せ松の伝説
  - 石川民部の町
  naming_type: 中心地名の継承
  formation: 合併新設
  prefecture: 埼玉県
  homonyms: []
  summary: 町名は、江戸時代の村名であり領名でもある「松伏」を受け継ぐ。明治22年（1889年）に松伏村など5か村で松伏領村が成立し、昭和31年（1956年）に松伏村へ改称、昭和44年（1969年）に町制を施行した。「松伏」の語源としては、この地を開拓した豪農・石川家の松が伏せ松の形をしていたことに由来するという話が、郷土資料に伝わっている。
  first_attestation:
    era: 江戸時代
    year_western: null
    document: 武蔵国松伏領・松伏村（松伏町公式の歴史概要）
    note: 領名・村名としての「松伏」の近世の用例。初出の特定は未了
  claims:
  - text: 町の歴史概要によれば、江戸時代、現在の町域のうち松伏・田島・大川戸・上赤岩・下赤岩の5か村は武蔵国松伏領に属し、金杉村・築比地村・魚沼村の3か村は下総国庄内領に属した
    kind: fact
    level: E2
    status: established
    sources:
    - w10-matsubushi-town-history
  - text: 町の紹介によれば、明治22年（1889年）に松伏村・大川戸村・田島村・上赤岩村・下赤岩村の5か村が合併して松伏領村となり、昭和30年（1955年）に金杉村と合体合併して改めて松伏領村が誕生、昭和31年（1956年）に松伏村へ村名変更し、昭和44年（1969年）に町制を施行して松伏町となった
    kind: fact
    level: E2
    status: established
    sources:
    - w10-matsubushi-town-intro
  - text: この地方を開拓した石川家の祖が遠州曽根の松を移植したところ、それが伏せ松の形をしていたところから「松伏」と呼ばれるようになった、と郷土資料に伝えられている
    kind: legend
    level: E4
    status: established
    sources:
    - w10-matsubushi-walking
  - text: 郷土資料は別説として、「マツブシ」の「ブシ」は河岸段丘や谷あいに見られる小平地のことではないかという説も紹介する
    kind: fact
    level: E4
    status: indeterminate
    sources:
    - w10-matsubushi-walking
  - text: 町によれば、松伏村の石川民部家は新田開発や寺院の整備に尽力した世襲の名主の家で、江戸川の開鑿や改修にも関わった
    kind: fact
    level: E2
    status: established
    sources:
    - w10-matsubushi-town-history
  - text: 地方公共団体コードは114651である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 一本の松が領の名になったという話
    text: 松伏の語源とされる「伏せ松」の主は、千町歩を超える田畑を持ったともいう大地主で世襲名主の石川民部家である。将軍の日光社参や江戸川の工事に尽力して苗字帯刀を許されたこの家の松の姿が、そのまま領全体の名前になったという。真偽は定かでないが、江戸時代のこの地域が一軒の豪農を中心に回っていたことは、町の公式の歴史からも読み取れる。なお町の木は、町名にちなんで「松」が選ばれている。
    sources:
    - w10-matsubushi-walking
    - w10-matsubushi-wiki-ishikawa
    - w10-matsubushi-town-intro
  relations:
  - pref/11
  unknowns:
  - 伏せ松説を裏付ける近世の一次史料は未確認で、郷土資料に伝わる伝承の域を出ない
  - 「松伏」の名が領名として定着した時期や、松伏村という村名の初出は未確認
  updated: '2026-11-13'
- id: muni/11-桶川市
  code: '112313'
  names:
    ja: 桶川市
    reading: おけがわし
    aliases:
    - 桶川宿
    - 桶川町
    - 桶皮郷
    - 桶川郷
  user_terms:
  - 桶川市の名前の由来
  - 桶川宿
  - 桶川臙脂
  - べに花の郷
  naming_type: 中心地名の継承
  formation: 単独発足
  prefecture: 埼玉県
  homonyms: []
  summary: 市名は、中世以来の郷名「おけがわ」を受け継いだものである。文献上の最古の用例は1352年の文書の「桶皮郷」で、漢字は当て字と推測され、語源には「沖側」説と「起き川」説があるが定まっていない。江戸時代には中山道の桶川宿として栄え、紅花の集散地として「桶川臙脂」の名を知られた。昭和45年（1970年）に市制を施行した。
  first_attestation:
    era: 観応3年
    year_western: 1352
    document: 足利尊氏の下文に記された「桶皮郷菅谷村」
    note: 文献上最古の用例とされるもの。ただしこの菅谷村は現在の上尾市菅谷を指すと見られ、郷の広がりは現在の市域と重ならない部分がある
  claims:
  - text: 「おけがわ」の文献上の最古の用例は、観応3年（1352年）の足利尊氏の家臣への下文に記された「桶皮郷菅谷村」とされる。ただし、この菅谷村は現在の上尾市菅谷を指すと見られる
    kind: fact
    level: E5
    status: established
    sources:
    - w2-okegawa-wiki
  - text: 「桶皮」の表記が見られるのはこの文書のみで、「桶川」「桶皮」のどちらも当て字によるものと推測される
    kind: fact
    level: E5
    status: established
    sources:
    - w2-okegawa-wiki
  - text: 地名の由来ははっきりしないが、広々とした田畑を意味する「オキ」の方向である「沖側」が訛ったという説と、芝川・鴨川などの水源があることから川が起こる所すなわち「起き川」になったという説の、2つの仮説が云われている
    kind: fact
    level: E5
    status: contested
    sources:
    - w2-okegawa-wiki
  - text: 桶川宿は中山道の江戸から6番目の宿場で、農産物の集散地・宿場町として栄えた
    kind: fact
    level: E2
    status: established
    sources:
    - w2-okegawa-kids
  - text: 江戸時代、桶川周辺で栽培されていた紅花は「桶川臙脂」としてその名を知られ、最上地方に次いで2番目の収穫高を誇り、宿場の発展に重要な役割を果たした
    kind: fact
    level: E5
    status: established
    sources:
    - w2-okegawa-wiki
  - text: 明治22年（1889年）に桶川宿と隣接する3村により桶川町が成立し、昭和30年（1955年）に加納村・川田谷村と合併、昭和45年（1970年）11月3日に市制を施行して桶川市となった
    kind: fact
    level: E5
    status: established
    sources:
    - w2-okegawa-wiki
  column:
    title: 「桶川」に、桶は関係ない？
    text: 「桶川」という字面からは桶職人や桶の産地を連想しがちだが、最古の文献に現れる表記は「桶皮」である。どちらも音に漢字を当てた当て字と推測され、「桶」の字に意味はないらしい。残っているのは「おけがわ」という音だけで、その意味は「沖側」説と「起き川」説のどちらとも決めがたい。しかも最古の用例が指す菅谷村は現在の上尾市にあり、郷の中心はいまの市域から少しずれている。名前の音だけが700年近く旅をしてきた地名である。
    sources:
    - w2-okegawa-wiki
  relations:
  - pref/11
  - muni/11-上尾市
  unknowns:
  - 語源の2仮説はいずれも推測の域を出ず、専門辞典（角川日本地名大辞典・日本歴史地名大系）での確認は未了
  - 1352年の下文の原文の直接確認は未了
  updated: '2026-11-13'
- id: muni/11-横瀬町
  code: '113611'
  names:
    ja: 横瀬町
    reading: よこぜまち
    aliases:
    - 横瀬村
    - 横瀬郷
    - 芦ヶ久保村
  user_terms:
  - 横瀬町の名前の由来
  - よこぜ
  - 武甲山の町
  - 芦ヶ久保の氷柱
  naming_type: 中心地名の継承
  formation: 合併新設
  prefecture: 埼玉県
  homonyms: []
  summary: 武甲山の北東麓、横瀬川沿いの町で、中世の横瀬郷の名を受け継ぐ。暦応3年（1340年）の譲状に「秩父郡内横瀬郷」と見えるのが確かな用例で、丹党に属する横瀬氏の本貫地だった。「横瀬」の語源は、川の瀬が当地の中央を横に流れていることに由来するといわれるが、専門資料での裏付けは得られていない。昭和59年（1984年）に町制を施行した。
  first_attestation:
    era: 暦応3年
    year_western: 1340
    document: 安保光泰譲状（安保文書）にみえる「秩父郡内横瀬郷」
    note: 日本歴史地名大系が紹介する確かな用例。二次資料経由の確認
  claims:
  - text: 日本歴史地名大系によれば、暦応3年（1340年）正月24日の安保光泰譲状（安保文書）に、惣領に譲与した所領のうちとして「秩父郡内横瀬郷」が記されている
    kind: fact
    level: E2
    status: established
    sources:
    - w10-yokoze-kotobank-mura
  - text: 日本歴史地名大系は、中世の当地は横瀬郷と呼ばれ、丹党に属する横瀬氏の本貫地であったと解説する
    kind: fact
    level: E3
    status: established
    sources:
    - w10-yokoze-kotobank-mura
  - text: 日本歴史地名大系によれば、横瀬川が村内を貫流し、天正20年（1592年）の年貢請取状や明暦元年（1655年）の検地帳にも「横瀬郷」の呼称が用例として残る
    kind: fact
    level: E2
    status: established
    sources:
    - w10-yokoze-kotobank-mura
  - text: 「横瀬」の地名は、川（瀬）が当地の中央を横に流れていることに由来するといわれるが、出典を明示した専門資料では確認できていない
    kind: fact
    level: E5
    status: indeterminate
    sources:
    - w10-yokoze-gogen
  - text: 明治22年（1889年）に横瀬村が成立し、昭和30年（1955年）2月11日に芦ヶ久保村と合併して改めて横瀬村となり、昭和59年（1984年）10月1日に町制を施行して横瀬町となった
    kind: fact
    level: E5
    status: established
    sources:
    - w10-yokoze-wiki
  - text: 地方公共団体コードは113611である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 武甲山の石灰岩と横瀬川
    text: 町の中心を横瀬川が貫き、その南に石灰岩の武甲山がそびえる。武甲山の石灰岩の採掘は秩父地域の近代産業を支え、横瀬駅は登山と産業の玄関口になった。いま町を訪れる人の目当ては、冬の芦ヶ久保の氷柱や寺坂の棚田である。「横の瀬」の名が指す川の風景は、山に抱かれた町の骨格であり続けている。
    sources:
    - w10-yokoze-kotobank-mura
    - w10-yokoze-wiki
  relations:
  - pref/11
  - muni/11-小鹿野町
  unknowns:
  - 「横に流れる川の瀬」に由来するという語源説について、町史等の出典を明示した裏付けは未確認
  - 横瀬郷の範囲や横瀬氏の系譜の詳細は、専門研究での確認が未了
  updated: '2026-11-13'
- id: muni/11-毛呂山町
  code: '113263'
  names:
