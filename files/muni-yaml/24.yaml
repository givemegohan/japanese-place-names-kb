  homonyms: []
  summary: 三重県北部、員弁郡唯一の町。1954年に大長村・稲部村・神田村が合併して東員村が発足し、1967年に町制施行した（合併は1967年ではない）。「東員」の名は、員弁郡の郡名の「員」に、郡の東部という位置を重ねた命名と考えられるが、命名理由を明記した公的資料は確認できていない。2003年に郡内の他町がいなべ市となったため、員弁郡で唯一の町となった。
  first_attestation:
    era: 昭和29年
    year_western: 1954
    document: 大長村・稲部村・神田村の合併による東員村発足
    note: 合併新名としての初出。「員弁」の郡名そのものは古代に遡るが、「東員」の用例はこの合併が最初とみられる
  claims:
  - text: 1954年11月3日に大長村・稲部村・神田村が合併して東員村が発足した
