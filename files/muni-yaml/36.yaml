  - text: 藍園・住吉の両村が合併し、1955年4月に藍住町が発足した
    kind: fact
    level: E2
    status: established
    sources:
    - q11-aizumi-agri
  - text: 藍園村は藍玉製造の中心地であり、藍の栽培から藍玉製造までの一式の用具「阿波藍栽培加工用具」が重要有形民俗文化財に指定されている
    kind: fact
    level: E2
    status: established
    sources:
    - q11-aizumi-bunka
  - text: 吉野川の氾濫がもたらす肥沃な堆積土と水利を活かし、この一帯は江戸時代から近代にかけて阿波藍の大産地として栄えた
    kind: fact
    level: E2
    status: established
    sources:
    - q11-aizumi-bunka
    - q11-aizumi-mlit
  - text: 徳島市・鳴門市のベッドタウンとして人口が増えてきた町で、徳島県内で最も人口の多い町である
    kind: fact
    level: E2
    status: established
    sources:
    - q11-aizumi-agri
    - upg-s6-aizumi-prefpop
  column:
    title: 藍の本場は藍園村よ
    text: 「藍の本場は 藍園村よ 広いでんだい 藍ばかり」。藍の葉を干す作業の労働歌「藍こなし歌」に、旧藍園村はこう歌われた。1955年に住吉村と合併して生まれた藍住町の名は、一見すると単なる頭文字の合成だが、その一文字目は藍で財を成した村の看板そのものだった。
    sources:
    - q11-aizumi-mlit
  relations:
  - pref/36
  unknowns:
  - 住吉村の名の由来（住吉神社との関係は未確認）
  - 藍園の「園」の語源
  updated: '2026-11-13'
