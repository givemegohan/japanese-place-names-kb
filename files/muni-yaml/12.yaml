  naming_type: 学校名・駅名などから
  naming_note: 土睦村の「睦」と瑞沢村の「沢」を合わせた合成名
  formation: 合併新設
  prefecture: 千葉県
  homonyms: []
  summary: 長生郡の町。1955年7月20日に長生郡土睦村と夷隅郡瑞沢村（さらに長南町の一部）が郡をまたいで合併して睦沢村が生まれ、1983年に町制を施行した。村名・町名の「睦沢」は、土睦の「睦」と瑞沢の「沢」を合わせた合成名である。土睦・瑞沢の旧村名は今も町内の地区の呼び名などに残る。
  first_attestation:
    era: 昭和30年
    year_western: 1955
    document: null
    note: 合併による新村名のため、「睦沢」の初出は1955年7月20日の睦沢村発足そのもの
  claims:
  - text: 昭和30年（1955年）7月20日、土睦村・瑞沢村と長南町の一部（森・長楽寺）が合併して睦沢村が発足した
    kind: fact
    level: E2
    status: established
    sources:
    - w12-mutsuzawa-meti
    - w12-mutsuzawa-wiki
  - text: 合併した土睦村は長生郡、瑞沢村は夷隅郡に属しており、郡を異にする村同士の合併だった
    kind: fact
    level: E2
    status: established
    sources:
    - upg-r5-mutsuzawa-geoshape-dochin
    - upg-r5-mutsuzawa-geoshape-mizusawa
  - text: 睦沢村は昭和58年（1983年）4月1日に町制を施行し、睦沢町となった
    kind: fact
    level: E2
    status: established
    sources:
    - w12-mutsuzawa-meti
  - text: 新しい村名「睦沢」は、土睦村の「睦」と瑞沢村の「沢」を一字ずつ取って合わせた合成名である
    kind: fact
    level: E5
    status: established
    sources:
    - w12-mutsuzawa-wiki
  - text: 土睦村は明治22年（1889年）に、下之郷村・上之郷村・大谷木村・北山田村・北山田寺崎新田・上市場村・寺崎村・岩井村・川島村・小滝村・河須ヶ谷村の11か村が合併して成立した
    kind: fact
    level: E4
    status: established
    sources:
    - upg-r11-chonan-uub-s
  - text: 瑞沢村の名は、村内を流れる瑞沢川に由来する
    kind: fact
    level: E5
    status: established
    sources:
    - w12-mutsuzawa-mizusawa-wiki
  - text: 旧村名は睦沢町立土睦小学校・瑞沢小学校の校名に残っていたが、両校は2018年3月に閉校し、同年4月に統合のうえ旧土睦小学校の校地に睦沢小学校が開校した
    kind: fact
    level: E2
    status: established
    sources:
    - upg-r5-mutsuzawa-town-schoolplan
    - upg-r5-mutsuzawa-cgec
  - text: 睦沢町の地方公共団体コードは124222で、読みは「むつざわまち」である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
    - w12-mutsuzawa-zck
  column:
    title: 二つの村の名を縫い合わせる
    text: 「睦沢」という名は、合併の設計図そのものである。土睦村は1889年に11か村が寄り合ってできた村で、その名自体が「村々が睦まじく」という合併の記念だった。瑞沢村は村を流れる瑞沢川から名を取り、川の名は今も町を流れている。1955年、郡まで違うこの2村が一緒になるとき、新しい名は土睦の「睦」と瑞沢の「沢」を縫い合わせた。どちらか一方の名を残すのでも、全く新しい名を作るのでもなく、一字ずつ分け合う――昭和の合併で数多く生まれた合成名の中でも、対等合併の意思表示として分かりやすい事例である。
    sources:
    - w12-mutsuzawa-dochin-wiki
    - w12-mutsuzawa-mizusawa-wiki
    - w12-mutsuzawa-meti
  relations:
  - pref/12
  - muni/12-白子町
  - muni/12-大多喜町
  unknowns:
  - 1955年の合併協議で新村名「睦沢」がどのように決まったか（協議会の記録など）の詳細は、町公式資料で確認できなかった
  - 「土睦」の「土」の字の由来（11村合併の際に「土」を冠した理由）は未確認
  - 瑞沢川の名自体の由来は未確認
  updated: '2026-11-13'
