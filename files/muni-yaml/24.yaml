records:
- id: muni/24-いなべ市
  code: '242144'
  names:
    ja: いなべ市
    reading: いなべし
    aliases:
    - 員弁
    - 員弁町
    - いなべ
  user_terms:
  - いなべ
  - 員弁
  - いなべ市の名前の由来
  - ひらがなの市名
  - 難読地名
  naming_type: 旧行政区画名の継承
  naming_note: 郡名「員弁」を平仮名表記で採用
  formation: 合併新設
  prefecture: 三重県
  homonyms: []
  summary: 市名「いなべ」は、合併した4町が属していた員弁郡の郡名「員弁（いなべ）」を、難読のため平仮名表記にして採用したもの。平成15年（2003年）12月1日に北勢町・員弁町・大安町・藤原町が合併して発足し、平成の大合併で生まれた三重県最初の市となった。郡名「員弁」そのものは、古代にこの地にいた豪族・猪名部氏（いなべし）に由来すると『日本歴史地名大系』は説明する。
  first_attestation:
    era: 平安時代（10世紀）
    year_western: null
    document: 『和名類聚抄』の伊勢国員弁郡
    note: 『日本歴史地名大系』が「郡名としては『和名抄』以来一貫して『員弁』の字を用い『いなべ』と読ませている」と紹介するもの。原文は未読のため紹介形で記録する
  claims:
  - text: 平成15年（2003年）12月1日、員弁郡の北勢町・員弁町・大安町・藤原町の4町が合併していなべ市が発足し、県内14番目の市となった（平成の大合併による三重県最初の市）
    kind: fact
    level: E2
    status: established
    sources:
    - r1-inabe-city-gaiyo
  - text: 市名は郡名の「員弁」を採ったが、「員弁」の漢字が難読であることから平仮名の「いなべ」が採用された
    kind: fact
    level: E5
    status: established
    sources:
    - r1-inabe-wiki
  - text: 合併決定直前に実施された住民アンケートの市名の設問は、既に「いなべ市」か「その他」かの二者択一だった
    kind: fact
    level: E5
    status: established
    sources:
    - r1-inabe-wiki
  - text: 員弁の郡名は、古代この地の豪族であった猪名部氏（為奈部・伊奈部とも書く）によるものであると『日本歴史地名大系』は説明する
    kind: fact
    level: E3
    status: established
    sources:
    - r1-inabe-kotobank-taikei
  - text: 郡名の表記は『和名類聚抄』以来一貫して「員弁」の字が用いられ、「いなべ」と読ませてきたと『日本歴史地名大系』は紹介する
    kind: fact
    level: E3
    status: established
    sources:
    - r1-inabe-kotobank-taikei
  - text: 猪名部氏は『日本書紀』や『新撰姓氏録』に木工技術集団として現れる氏族で、系譜上は物部氏の一族とされると『日本歴史地名大系』は紹介する
    kind: fact
    level: E3
    status: established
    sources:
    - r1-inabe-kotobank-taikei
  - text: 合併に参加しなかった東員町は今も員弁郡の町として残っており、いなべ市と郡名の読みを分かち合っている
    kind: fact
    level: E2
    status: established
    sources:
    - k4-ise-jlis
  - text: いなべ市の地方公共団体コードは242144である
    kind: fact
    level: E2
    status: established
    sources:
    - r1-inabe-city-gaiyo
  column:
    title: 難読だから、ひらがなで
    text: 「員弁」は読める人の方が少ないだろう。いなべ市は合併にあたって由緒ある郡名をそのまま使うことを選び、ただし表記だけは誰もが読める平仮名にした。面白いのは、千年のあいだ「員弁」と書き続けてきたその字を、郡名としては『和名類聚抄』の時代から一貫して使ってきたという点である。なお合併直前のアンケートで市名を問う設問は「いなべ市」か「その他」かの二択で、事実上「いなべ」は決まっていた。隣の東員町は合併に参加せず、今も「員弁郡」の名を残している。
    sources:
    - r1-inabe-kotobank-taikei
    - r1-inabe-wiki
  relations:
  - pref/24
  - muni/24-桑名市
  - muni/24-四日市市
  unknowns:
  - 市名の平仮名採用を合併協議会の一次資料（議事録・広報）で直接確認することはできなかった
  - 猪名部氏が伊勢の員弁の地に定着した経緯の詳細は、大系の紹介の範囲を超えて確認できていない
  - 「いなべ」という読み自体の音韻的由来（猪名部の転訛とする説明の当否）は未確認
  updated: '2026-11-13'
- id: muni/24-亀山市
  code: '242101'
  names:
    ja: 亀山市
    reading: かめやまし
    aliases:
    - 亀山
    - 伊勢亀山
    - 亀山町
  user_terms:
  - 亀山
  - かめやま
  - 亀山市の名前の由来
  - 亀山城の城下町
  - 東海道の宿場町
  naming_type: 藩名・城名から
  naming_note: 旧亀山町の名を継承
  formation: 不明
  prefecture: 三重県
  homonyms: []
  summary: 市名は、亀山城の城下町「亀山」をそのまま受け継ぐ。南北朝時代に平重盛の子孫と伝えられる関氏がこの地に亀山城を構えたと市の資料は伝え、江戸時代には城下町と東海道五十三次46番目の宿場町として栄えた。丹波亀山（現在の京都府亀岡市）が明治2年（1869年）に「亀岡」へ改称したのに対し、伊勢の亀山は「亀山」の名を保ち続け、現在の亀山市に至る。「亀山」の語源は確定していない。
  first_attestation:
    era: ''
    year_western: null
    document: ''
    note: 「亀山」の文献上の初出は特定できなかった。中世には関氏の城として「亀山」の名が見えるが、初出文書の確認は今後の課題
  claims:
  - text: 南北朝時代、平重盛の子孫と伝えられる関氏がこの地に亀山城を構え、江戸時代には城下町として栄えたと、亀山市の公式資料は紹介している
    kind: fact
    level: E2
    status: established
    sources:
    - r1-kameyama-city-plan
  - text: 現在に遺る亀山城は天正18年（1590年）に岡本宗憲が築城したもので、別名を「粉蝶城」といい、多門櫓は寛永9年（1632年）ごろの築造とみられる
    kind: fact
    level: E2
    status: established
    sources:
    - r1-kameyama-city-plan
  - text: 亀山は東海道五十三次の46番目の宿場町（亀山宿）として栄え、宿場の面影を残す家並みが残る
    kind: fact
    level: E2
    status: established
    sources:
    - r1-kameyama-city-plan
  - text: ヤマトヒメがまつった鈴鹿小山宮（忍山神社）のあった山を「かみやま（神山）」と呼ぶようになり、それがなまって「亀山」と呼ぶようになったという言い伝えを、亀山市教育委員会の副読本が紹介している
    kind: legend
    level: E2
    status: established
    sources:
    - r1-kameyama-fukudokuhon
  - text: 百済から来た僧・日羅が献上した三匹の亀を、山城・丹波（現在の亀岡市）・伊勢（現在の亀山市）で逃がし、その地がそれぞれ「亀山」と呼ばれるようになったという言い伝えを、亀山市歴史博物館が「亀山のむかしばなし」として紹介している
    kind: legend
    level: E2
    status: established
    sources:
    - p2-kameyama-mie-museum
  - text: 「亀山」の語源については複数の説があるものの、はっきりしたことは分かっていないと市の教育委員会資料も述べており、確定していない
    kind: fact
    level: E2
    status: indeterminate
    sources:
    - r1-kameyama-fukudokuhon
  - text: 明治2年（1869年）に改称したのは丹波亀山の側であり、丹波亀山は「亀岡」となったのに対し、伊勢亀山は「亀山」の名を保ち続けた
    kind: fact
    level: E2
    status: established
    sources:
    - p2-kameoka-bunkazai-plan
  - text: 昭和29年（1954年）10月、亀山町・昼生村・井田川村・川崎村・野登村が合併して旧亀山市が誕生した
    kind: fact
    level: E2
    status: established
    sources:
    - r1-kameyama-city-plan
  - text: 平成17年（2005年）1月11日、旧亀山市と関町が合併して現在の亀山市となった
    kind: fact
    level: E2
    status: established
    sources:
    - r1-kameyama-city-plan
  - text: 亀山市の地方公共団体コードは242101である
    kind: fact
    level: E2
    status: established
    sources:
    - k4-ise-jlis
  column:
    title: 間違えて取り壊された天守
    text: 亀山城の天守は、城主の堀尾忠晴が「丹波亀山城の天守と間違えて取り壊した」と伝えられている（市の資料が伝承として紹介）。日本に二つあった「亀山城」の混同が招いた悲劇というわけである。その混同は明治になっても続き、明治2年（1869年）には丹波の亀山が改称を命じられて「亀岡」になった。一方の伊勢亀山は名前を変えず、現在の亀山市に至る。同じ名を持つ二つの城下町の運命は、ここで分かれた。
    sources:
    - r1-kameyama-city-plan
    - p2-kameoka-bunkazai-plan
  relations:
  - pref/24
  - muni/26-亀岡市
  - muni/24-鈴鹿市
  unknowns:
  - 「亀山」の語源について「亀の形をした山」に由来するという説明は、専門辞典（角川日本地名大辞典・日本歴史地名大系）で確認できなかった
  - 「亀山」の文献上の初出（文書名・年次）は未確認
  - 2005年の合併時に市名を検討した経緯の詳細（候補案の有無など）は未確認
  updated: '2026-11-13'
- id: muni/24-伊勢市
  code: '242039'
  names:
    ja: 伊勢市
    reading: いせし
    aliases:
    - 宇治山田市
    - 宇治山田町
  user_terms:
  - いせ
  - 神都
  - 宇治山田
  - お伊勢参りのまち
  naming_type: 中心地名の継承
  naming_note: 1955年に宇治山田市から改称した名を、2005年の新設合併でも継承した
  formation: 合併新設
  prefecture: 三重県
  homonyms: []
  summary: 市名「伊勢」は、古代の国名であり伊勢神宮の名でもある。このまちはもともと内宮の鳥居前町「宇治」と外宮の鳥居前町「山田」を合わせた宇治山田町（1889年）・宇治山田市（1906年）であったが、1955年1月1日に周辺4村の合併とともに「伊勢市」へ改称した。2005年11月1日には二見町・小俣町・御薗村との新設合併で新たな伊勢市が発足し、名はそのまま継承された。つまり2005年は改称の年ではなく、改称は1955年に行われている。
  first_attestation:
    era: 昭和30年
    year_western: 1955
    document: 市名変更条例（昭和29年12月25日条例第18号）による宇治山田市から「伊勢市」への改称
    note: 市名としての「伊勢市」の初出。地名・国名としての「伊勢」は古代に遡り、『伊勢国風土記』逸文には国名の由来とする伊勢津彦の伝承が残る。2005年の合併はこの名の継承である。
  claims:
  - text: 明治22年（1889年）の町村制施行により、宇治と山田を合わせて宇治山田町が誕生した。宇治は伊勢神宮内宮の鳥居前町、山田は外宮の鳥居前町を指し、宇治山田は両町の名を合わせた合成地名である。
    kind: fact
    level: E2
    status: established
    sources:
    - k4-ise-gappei
    - k4-ise-weblio
  - text: 明治39年（1906年）9月1日、宇治山田町が市制を施行して宇治山田市となった。
    kind: fact
    level: E2
    status: established
    sources:
    - k4-ise-gappei
  - text: 昭和30年（1955年）1月1日、宇治山田市は度会郡豊浜村・北浜村・城田村・四郷村を合併するとともに、「伊勢市」に改称した。
    kind: fact
    level: E2
    status: established
    sources:
    - k4-ise-gappei
  - text: この改称は、市の条例（昭和29年12月25日条例第18号）で「本市の名称『宇治山田市』を『伊勢市』に変更する」と定められ、三重県知事の許可（昭和29年12月22日、三重県告示第1046号）を得て、昭和30年1月1日から施行された。
    kind: fact
    level: E1
    status: established
    sources:
    - k4-ise-reiki
  - text: 『伊勢国風土記』逸文には、神武天皇の勅を受けた天日別命が、この地の神・伊勢津彦と争って国を平定したという話が伝わり、国名「伊勢」の由来とする伝承となっている。
    kind: legend
    level: E3
    status: established
    sources:
    - k4-ise-fudoki
  - text: 平成17年（2005年）11月1日、伊勢市・二見町・小俣町・御薗村の4市町村の合併（新設）が実現し、新たな「伊勢市」が誕生した。2005年の出来事は改称ではなく、1955年以来の市名の継承を伴う合併である。
    kind: fact
    level: E2
    status: established
    sources:
    - k4-ise-gappei
  - text: 伊勢市の地方公共団体コードは242039である。
    kind: fact
    level: E2
    status: established
    sources:
    - k4-ise-jlis
  column:
    title: 二つの鳥居前町が「神都」の名を名乗るまで
    text: 宇治山田という市名は、内宮と外宮、二つの鳥居前町の妥協の産物だった。どちらの町の名も捨てずに並べた合成地名は、1889年から66年間使われた。しかし全国の参拝者にとってこのまちはあくまで「伊勢」であり、1955年元日、周辺の村々を合併する節目に、市は条例をもって名を「伊勢市」に改めた。半世紀後の2005年の大合併でも、議論の末に残ったのはやはり「伊勢」だった。二つの町の名の記憶は、今も宇治山田駅の駅名の中に生きている。
    sources:
    - k4-ise-gappei
    - k4-ise-reiki
  relations:
  - pref/24
  unknowns:
  - 1955年の改称の直接の動機（1953年の神宮式年遷宮との関係や知名度の考慮など）は、確認した市の公式資料・例規には明記されておらず、未確認である。
  - 2005年の合併で新市の名称を「伊勢市」と定めた協議の詳細は、「合併の記録」概要版からは確認できなかった。
  updated: '2026-11-13'
- id: muni/24-伊賀市
  code: '242161'
  names:
    ja: 伊賀市
    reading: いがし
    aliases:
    - 上野市
    - 伊賀上野
    - 伊賀国
  user_terms:
  - 伊賀市の名前の由来
  - 忍者の里の市
  - 伊賀上野ってどこ
  - 芭蕉のふるさと
  naming_type: 旧国名・広域地名の採用
  naming_note: 旧国名を公募で採用
  formation: 分村・分立
  prefecture: 三重県
  homonyms: []
  summary: 市名「伊賀」は旧国名で、平成16年（2004年）の合併の際に公募の最終候補（伊賀・いが・畿央）から選ばれた。合併前の中心市は上野市で、その「上野」は伊賀国阿拝郡の古い地名であり、近世に藤堂高虎が城下町を開いた地である。伊賀国は天武天皇9年（680年）に伊勢国から分かれて成立したとされる。
  first_attestation:
    era: 飛鳥時代
    year_western: 680
    document: 伊賀国の成立（伊勢国4郡を割いて分立）
    note: 市の公式計画書が「成立したとされる」と伝えるもの。「伊賀」の名自体は天武天皇元年（672年）の壬申の乱の記録にも現れると同計画書は述べるが、原典は未読
  claims:
  - text: 平成16年（2004年）11月1日、上野市・阿山郡伊賀町・島ヶ原村・阿山町・大山田村・名賀郡青山町の1市3町2村が合併して伊賀市が誕生した
    kind: fact
    level: E2
    status: established
    sources:
    - n6-iga-city-plan
  - text: 新市名は公募され、上位案には伊賀・伊賀上野・いが・新伊賀・芭蕉・忍者・伊賀の里・畿央・忍・西三重が挙がり、最終候補の「伊賀」「いが」「畿央」のなかから「伊賀市」が選ばれた
    kind: fact
    level: E4
    status: established
    sources:
    - n6-iga-henkaku
  - text: 合併協議には当初名張市も参加していたが、平成15年（2003年）の住民投票で合併反対が多数を占めたため名張市は離脱し、6市町村での合併となった
    kind: fact
    level: E4
    status: established
    sources:
    - n6-iga-henkaku
  - text: 「伊賀」は旧国名であり、伊賀国は天武天皇9年（680年）に伊勢国4郡を割いて成立したとされる
    kind: fact
    level: E2
    status: established
    sources:
    - n6-iga-city-plan
  - text: 市の公式計画書は、壬申の乱（672年）に大海人皇子が伊賀国名張郷に入り伊賀駅家を焚いたと伝え、「伊賀」の名が古代の記録に現れることを示している
    kind: fact
    level: E2
    status: established
    sources:
    - n6-iga-city-plan
  - text: 合併前の中心市・上野市の「上野」は、伊賀国阿拝郡（のち阿山郡）の地名で、明治22年（1889年）に城下町の町々を集めて上野町が発足した
    kind: fact
    level: E5
    status: established
    sources:
    - n6-iga-uenomachi-wiki
  - text: 近世に藤堂高虎が上野盆地の中央部に城下町を作ったのが、現在の市の中心市街地の原型である
    kind: fact
    level: E2
    status: established
    sources:
    - n6-iga-city-plan
  - text: 昭和16年（1941年）、上野町・小田村・三田村・城南村・新居村・長田村・花之木村の1町6村が合併して上野市が誕生した
    kind: fact
    level: E2
    status: established
    sources:
    - n6-iga-city-plan
  - text: 東京の上野という地名は、藤堂高虎が江戸の忍岡に屋敷を構えた際、その一帯の地形が故郷の伊賀上野に似ていたため「上野」と呼ばれるようになったという説がある
    kind: legend
    level: E4
    status: contested
    sources:
    - n6-iga-ueno-bunkazai
  - text: 総務省の地方公共団体コード一覧では、伊賀市のコードは242161である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: あわや「忍者市」に「芭蕉市」
    text: 2004年の合併で新市名を公募したところ、候補には土地の個性を前面に出した名がずらりと並んだ。「忍者」「忍（しのび）」「芭蕉」——伊賀流忍者と、俳聖・松尾芭蕉の生誕地という二大ブランドがそのまま市名になりかけたのである。最終候補は「伊賀」「いが」「畿央」の3つに絞られ、選ばれたのは最も古くて最も広い、旧国名の「伊賀」だった。一方、当初は一緒に合併するはずだった名張市は住民投票の結果離脱している。市名選びの舞台裏には、地域の誇りと合併の現実の両方が顔をのぞかせている。
    sources:
    - n6-iga-henkaku
  relations:
  - pref/24
  - muni/24-名張市
  unknowns:
  - 「伊賀」という国名の語源そのものは、確認した資料では特定できなかった
  - 旧上野市の「上野」という地名の語源（なぜ「上野」と呼ばれたか）は、専門辞典での確認が取れていない
  - 公募の応募総数や「伊賀」の得票数は未確認
  updated: '2026-11-13'
- id: muni/24-南伊勢町
  code: '244724'
  names:
    ja: 南伊勢町
    reading: みなみいせちょう
    aliases:
    - 旧南勢町
    - 旧南島町
  user_terms:
  - 南伊勢
  - みなみいせ
  - 伊勢志摩
  - 五ヶ所浦
  - 度会郡の町
  naming_type: 方位・位置による命名
  formation: 合併新設
  prefecture: 三重県
  homonyms: []
  summary: 三重県度会郡、伊勢市の南に位置する町。2005年10月1日に南勢町と南島町が合併して発足した。町名は旧伊勢国の南部にあり伊勢市の南隣に位置することから名付けられたとされ、旧町名をそのまま使わない新名称である。リアス式海岸に集落が点在し、町域の約6割が伊勢志摩国立公園に含まれる。
  first_attestation:
    era: 平成17年
    year_western: 2005
    document: 南勢町・南島町の合併による南伊勢町の発足（南伊勢町公式『南伊勢町の概要』）
    note: 合併に伴う新名としての初出
  claims:
  - text: 2005年（平成17年）10月1日に、南勢町と南島町が合併して南伊勢町が誕生した
    kind: fact
    level: E2
    status: established
    sources:
    - x7-minamiise-gaiyo
  - text: 三重県の市町村合併資料では、南伊勢町は「旧町村の名称を使用しない町の名称」の一つに数えられており、両旧町名のどちらも継承しない新名称である
    kind: fact
    level: E2
    status: established
    sources:
    - x7-minamiise-mie
  - text: 町名は、かつての伊勢国の南部にあり、また伊勢市の南隣に位置することから名付けられたと説明される
    kind: fact
    level: E5
    status: established
    sources:
    - x7-minamiise-wiki
  - text: 前身の南勢町は1955年2月11日に五ヶ所町・穂原村・南海村・宿田曾村などの合併で、南島町は1955年4月1日に吉津町・島津村・鵜倉村・中島村の合併で発足した
    kind: fact
    level: E4
    status: established
    sources:
    - x7-minamiise-uub
  - text: 現在の町域は元は志摩国英虞郡の一部だったが、天正10年（1582）に伊勢国の守護大名・北畠氏により伊勢国度会郡に編入された
    kind: fact
    level: E5
    status: established
    sources:
    - x7-minamiise-wiki
  - text: 町域はリアス式海岸に38の集落が点在し、約6割が伊勢志摩国立公園に指定されている。町は自らを「伊勢の南玄関」と紹介する
    kind: fact
    level: E2
    status: established
    sources:
    - x7-minamiise-gaiyo
  - text: 南伊勢町の地方公共団体コードは244724である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 名古屋にもあった「南伊勢町」
    text: 合併で生まれた真新しい名前かと思いきや、「南伊勢町」という地名は、かつて名古屋市中区にも存在した。現在の三重県南伊勢町が2005年に生まれるずっと前から、伊勢湾を挟んだ愛知県側に、同名の町名があったことになる。その名古屋の南伊勢町は今では地図から消え、「南伊勢町」を名乗るのは三重県度会郡の町だけになった。新しいはずの名前が、実は遠く離れた土地で一足先に生まれて消えていたという、静かな入れ替わりである。
    sources:
    - x7-minamiise-wiki
  relations:
  - pref/24
  unknowns:
  - 新町名「南伊勢」の選定過程（公募の有無・候補となった他名称）は、町公式資料では確認できなかった
  - 旧南勢町の「南勢」、旧南島町の「南島」という1955年当時の町名の由来は、確認できなかった
  updated: '2026-11-13'
- id: muni/24-名張市
  code: '242080'
  names:
    ja: 名張市
    reading: なばりし
    aliases:
    - 名張
    - 那婆理
    - 奈波利
    - 隠
    - 名墾
    - 名張町
  user_terms:
  - なばり
  - 名張
  - 名張市の名前の由来
  - 隠（なばり）の山
  - 万葉の里
  naming_type: 中心地名の継承
  naming_note: 名張町の名を継承
  formation: 合併新設
  prefecture: 三重県
  homonyms: []
  summary: 市名「名張（なばり）」は、『古事記』に「那婆理」と現れるほど古い地名である。那婆理・奈波利・名墾・隠などと表記が揺れたのち、和銅6年（713年）の二字佳名の詔で「名張」に統一されたと名張市の公式レターは伝える。古代には畿内の東端を画する境の地で、語源は確定していない。昭和29年（1954年）、名張町ほか3村の合併で名張市が発足した。
  first_attestation:
    era: 奈良時代（712年成立の文献への収載）
    year_western: null
    document: 『古事記』安寧天皇条の「那婆理の稲置」
    note: 名張市公式の歴史レターが文献上の初出として紹介するもの。那婆理は現在の箕曲中村・瀬古口を中心とする地域を指したとされる。原典は未読のため紹介形で記録する
  claims:
  - text: 「なばり」の文献上の初めは『古事記』安寧天皇条で、伊賀の須知・那婆理・三野の稲置の祖とする伝承が記されていると、名張市の公式歴史レターは紹介している
    kind: fact
    level: E2
    status: established
    sources:
    - r1-nabari-history-letter
  - text: 『日本書紀』孝徳天皇大化2年（646年）正月条では、畿内の範囲の東限が「名張の横河（名張川）」よりこちら側と定められたと、市公式レターは紹介している
    kind: fact
    level: E2
    status: established
    sources:
    - r1-nabari-history-letter
  - text: 「なばり」の表記は那婆理・奈波利・名墾・隠などと揺れたが、和銅6年（713年）の二字佳名の詔によって「名張」の二字に統一された
    kind: fact
    level: E2
    status: established
    sources:
    - r1-nabari-history-letter
  - text: 「隠（なばり）」は大和から見て隠れた土地、「名墾」は開墾地に結ぶ解釈が市の資料で紹介されるが、名張市史の執筆者も推測にとどめており、「なばり」の語源は確定していない
    kind: fact
    level: E2
    status: indeterminate
    sources:
    - r1-nabari-history-letter
  - text: 『万葉集』には「沖つ藻の隠（なばり）の山」を詠んだ歌が収められ、名張駅前にその万葉歌碑が建てられている
    kind: fact
    level: E2
    status: established
    sources:
    - r1-nabari-history-letter
  - text: 昭和29年（1954年）3月、名賀郡名張町・滝川村・箕曲村・国津村が合併して名張市が発足し、中心町だった名張町の名を市名とした
    kind: fact
    level: E2
    status: established
    sources:
    - r1-nabari-city-start
  - text: 平成の伊賀地域の合併協議には当初名張市も参加していたが、平成15年（2003年）の住民投票で合併反対が多数を占めたため離脱し、残る6市町村で伊賀市が発足した
    kind: fact
    level: E4
    status: established
    sources:
    - n6-iga-henkaku
  - text: 名張市の地方公共団体コードは242080である
    kind: fact
    level: E2
    status: established
    sources:
    - k4-ise-jlis
  column:
    title: 畿内の東のはての「隠れた」地
    text: 『日本書紀』の改新の詔では、畿内の東の境は名張川（横河）とされた。川の北側（東国側）は「名張」、南側（畿内側）は「隠」と書き分けたのではないか、という解釈を市の歴史レターは紹介している。「隠（なばり）」とは大和の都から見て山陰に入る土地という感覚で、『万葉集』にも「隠の山」を越える夫を思う歌が残る。壬申の乱の際には大海人皇子がこの名張川を渡ったと考えられている。境の川を越える場所、それが名張だった。
    sources:
    - r1-nabari-history-letter
  relations:
  - pref/24
  - muni/24-伊賀市
  unknowns:
  - 「なばり」と夏見（名張市内の地名）との関係を説く専門資料は確認できなかった
  - 『古事記』『日本書紀』の該当記事は原典未読で、市公式レターの紹介に拠っている
  - 「名張」の読みが「なばり」に定着した過程の詳細は未確認
  updated: '2026-11-13'
- id: muni/24-四日市市
  code: '242021'
  names:
    ja: 四日市市
    reading: よっかいちし
    aliases:
    - 四日市町
    - 四ケ市
  user_terms:
  - 四日市市の名前の由来
  - 四日に市が立ったって本当
  - よっかいちの読み方
  naming_type: その他
  naming_note: 定期市の開催日に由来する地名
  formation: 単独発足
  prefecture: 三重県
  homonyms: []
  summary: 市名は、毎月4日・14日・24日に定期市が立ったことに由来すると、江戸時代の記録に基づき『日本歴史地名大系』が解説する地名である。確認できる古い用例は文明5年（1473年）の文書に宛所として見える「四ケ市庭浦」で、江戸時代には東海道の宿場町として栄えた。明治30年（1897年）に市制を施行した。
  first_attestation:
    era: 室町時代
    year_western: 1473
    document: 外宮庁宣（『文明年中宮司引付』神宮文庫蔵）の宛所「四ケ市庭浦」
    note: 『日本歴史地名大系』が紹介する用例。原典そのものは未読のため、辞典経由の記載として記録する
  claims:
  - text: 地名の由来は、毎月四日・十四日・二十四日に市が立ったことによると、享和元年（1801年）の「四日市町諸色明細帳」の記述を『日本歴史地名大系』が紹介している
    kind: fact
    level: E3
    status: established
    sources:
    - n6-yokkaichi-kotobank
  - text: 文明5年（1473年）6月の外宮庁宣の宛所に「四ケ市庭浦」と見えることが、四日市の名の古い用例として『日本歴史地名大系』に紹介されている
    kind: fact
    level: E3
    status: established
    sources:
    - n6-yokkaichi-kotobank
  - text: 四日市市は公式サイトで、室町時代に定期市が開かれるようになったことが「四日市」の名の由来といわれていると説明している
    kind: fact
    level: E2
    status: established
    sources:
    - n6-yokkaichi-city120
  - text: 江戸時代には東海道五十三次の43番目の宿場町となり、参勤交代や伊勢参宮の往来で栄えた
    kind: fact
    level: E2
    status: established
    sources:
    - n6-yokkaichi-city120
  - text: 明治30年（1897年）に市制を施行した
    kind: fact
    level: E3
    status: established
    sources:
    - n6-yokkaichi-kotobank
  - text: 『日本歴史地名大系』の見出しが読みを「よつかいちし」とするように、古くは「よつかいち」と読まれ、現在の読みは「よっかいち」である
    kind: fact
    level: E3
    status: established
    sources:
    - n6-yokkaichi-kotobank
  - text: 平成17年（2005年）2月7日に三重郡楠町を編入した
    kind: fact
    level: E3
    status: established
    sources:
    - n6-yokkaichi-kotobank
  - text: 総務省の地方公共団体コード一覧では、四日市市のコードは242021である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 市の立つ日が、そのまま町の名になった
    text: 「四日市」は、毎月四のつく日に市が立つ場所、という意味の名前である。1473年の文書にはすでに「四ケ市庭浦」と宛所に書かれており、少なくとも室町時代には定期市の地として知られていた。市（いち）の日付を名に持つ地名は各地にあり（廿日市や六日市など）、いずれも「その日に市場が開かれる場所」という、暮らしに直結した命名である。四日市の場合、市の日が月の3回（4日・14日・24日）もあったことが、交易の拠点としての力の大きさを物語っている。
    sources:
    - n6-yokkaichi-kotobank
    - n6-yokkaichi-city120
  relations:
  - pref/24
  - muni/24-鈴鹿市
  - muni/24-桑名市
  unknowns:
  - 定期市がいつ始まったか（1473年の用例以前の開始時期）は未確認
  - 「四ケ市庭浦」の「庭浦」が指す具体的な場所と現在の市街地との位置関係は、詰めていない
  updated: '2026-11-13'
- id: muni/24-多気町
  code: '244414'
  names:
    ja: 多気町
    reading: たきちょう
    aliases: []
  user_terms:
  - たきちょう
  - 多気
  - 多気郡の町
  - 丹生の水銀の町
  naming_type: 旧行政区画名の継承
  naming_note: 古代の郡名・郷名「多気」の継承。1955年の発足時に郡名を町名とし、2006年の合併でも郡名であることを理由に旧多気町の名が維持された
  formation: 編入合併
  prefecture: 三重県
  homonyms: []
  summary: 三重県中部、多気郡の町。町名は古代の郡名「多気」の継承で、1955年に相可町・佐奈村・津田村の合併で発足し、2006年に勢和村と合併して現在の町域となった。平成の合併で県が記録した決定理由は「歴史的に由緒がある」「郡名」であること。「多気」の語源そのものには竹の地とする説など諸説がある。町域の丹生は、東大寺大仏の金メッキに使われた水銀の産地として知られる。
  first_attestation:
    era: 承平年間
    year_western: null
    document: 『和名類聚抄』
    note: 934年頃の成立とされる同書に伊勢国「多気郡多気郷」の表記が見えることを、Wikipedia「多気町」が紹介するもの。原典そのものは確認できていないため、二次資料経由の紹介として記録する
  claims:
  - text: 1955年3月31日に相可町・佐奈村・津田村が新設合併して多気町が発足し、1959年4月15日に西外城田村を編入した
    kind: fact
    level: E4
    status: established
    sources:
    - x8-taki-uub
  - text: 2006年1月1日に勢和村と新設合併し、改めて多気町が発足して現在の町域となった
    kind: fact
    level: E4
    status: established
    sources:
    - x8-taki-uub
  - text: 三重県の合併資料は、多気町を「旧町名」を用いた町とし、2006年の合併で町名が決まった理由を「歴史的に由緒がある」「郡名」と記録している
    kind: fact
    level: E2
    status: established
    sources:
    - x7-minamiise-mie
  - text: 『和名類聚抄』には伊勢国「多気郡多気郷」の表記が見えると、Wikipedia「多気町」が紹介している
    kind: fact
    level: E5
    status: established
    sources:
    - x8-taki-wiki
  - text: 「多気」の語源には、竹の生育する地域で「竹郡」と呼ばれ後に「多気」の字が当てられて読みが「たき」に変わったとする説、古語の「多木（食物の多くできる土地）」とする説、動詞「たぎる」による説などがあり、定説は確立していない
    kind: fact
    level: E5
    status: contested
    sources:
    - x8-taki-wiki
  - text: 町域の丹生は「丹（に）を生む場所」の意とされ、奈良時代に東大寺大仏の金メッキに丹生の水銀約2tが使われた
    kind: fact
    level: E2
    status: established
    sources:
    - x8-taki-pref
  - text: 多気町の地方公共団体コードは244414である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 大仏を金色に染めた水銀の里・丹生
    text: 多気町の丹生地区は、その名のとおり「丹（に）を生む場所」で、朱の原料となる辰砂、水銀鉱石の産地だった。三重県の資料によれば、奈良時代、東大寺の大仏を金色に仕上げる金メッキには丹生の水銀が約2tも使われ、中世には日本で唯一の「水銀座」がここに形成されたという。伊勢神宮に近い山あいの町が、奈良の大仏の輝きを下支えしていたことになる。「多気」という郡名のほうの由来は今も諸説のままだが、この町の地下が日本の古代史を支えたことだけは、確かな記録として残っている。
    sources:
    - x8-taki-pref
  relations:
  - pref/24
  - muni/24-大台町
  unknowns:
  - 「多気」の語源の確定。竹郡説・多木説・たぎる説はいずれも二次資料経由でしか確認できていない
  - 1955年の発足時に郡名「多気」を町名とした経緯を記す町公式の命名資料
  updated: '2026-11-13'
