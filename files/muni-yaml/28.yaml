  prefecture: 兵庫県
  homonyms: []
  summary: 神崎郡の町。2005年11月7日に神崎町と大河内町が合併して発足した。新町名「神河」は、886点の公募作品の中から、合併協議会の投票で「美里」との決選を制して選ばれた。「神崎の『神』と大河内の『河』」という字の構成が一般に連想されるが、協議会の公式記録に命名理由の明示はない。
  first_attestation:
    era: 平成
    year_western: 2005
    document: 神崎町・大河内町合併協議会だより第13号（2005年3月1日発行）
    note: 新町名「神河町」の決定（2005年1月22日の第16回合併協議会）を報じた合併協議会の広報紙
  claims:
  - text: 2005年（平成17年）11月7日、神崎町と大河内町が合併して神河町が発足した
    kind: fact
    level: E2
    status: established
    sources:
    - x12-kamikawa-senryaku
    - x12-kamikawa-kpu
  - text: 新町の名称は公募され、886点の作品が寄せられた。「神河町」は17名が応募した作品だった
    kind: fact
    level: E2
    status: established
    sources:
    - x12-kamikawa-dayori13
  - text: 最終選考は合併協議会委員の無記名投票で行われ、第一次選考で「神河」18票・「美里」14票などとなり、決選投票で「神河」17票対「美里」7票で「神河町」に決定した（2005年1月22日、第16回合併協議会）
    kind: fact
    level: E2
    status: established
    sources:
    - x12-kamikawa-dayori13
  - text: 最終候補に残った5作品は、神河・秀峰（しゅうほう）・埴岡（はにおか）・美里（みさと）・わかばだった
    kind: fact
    level: E2
    status: established
    sources:
    - x12-kamikawa-dayori13
  - text: 「神河」の字は、神崎町の「神」と大河内町・市川水系の「河」を組み合わせたものと一般に解されるが、合併協議会だよりには命名の理由や字の由来の説明は記されていない
    kind: fact
    level: H
    status: inferred
    sources:
    - x12-kamikawa-dayori13
  - text: 合併相手の大河内町は1955年（昭和30年）3月31日に寺前村・長谷村が合併して発足した町で、その名は、この地域が中世に「大河内荘」と称されていたことに由来する（『日本大百科全書（ニッポニカ）』による）
    kind: fact
    level: E3
    status: established
    sources:
    - upg-u4-kamikawa-kotobank-okawachi
    - x12-inagawa-yoran
    - x12-kamikawa-kpu
  - text: 旧神崎町域を含む一帯は古代の神前（かむさき）郡にあたり、『播磨国風土記』神前郡条は、伊和大神の子・建石敷命が神前山に坐したことから郡名がついたと語る。現在の郡名「神崎」は、この「神前」の表記が変わったもの
    kind: legend
    level: E2
    status: established
    sources:
    - x12-kobe-u-fukusaki-report
  - text: 神河町の地方公共団体コードは284467である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 決選投票は「神河」17対「美里」7
    text: 新町名は、住民らから寄せられた886点の公募作の中から選ばれた。絞り込まれた5候補は「神河」「美里」「埴岡」「秀峰」「わかば」。合併協議会の委員による投票で、最後は「神河」と「美里」の一騎打ちになり、17対7で「神河町」に決まった。なお合併そのものについても大河内町では住民投票が行われ、「神崎町と二町合併をする」が1,796票で最多だった。市川町を加えた三町合併案も848票を集めたが、実現しなかった。
    sources:
    - x12-kamikawa-dayori13
  relations:
  - pref/28
  unknowns:
  - 「神河」の命名理由（字の構成の意図）を公式に説明した資料は、合併協議会だより第13号を含め確認できなかった
  - 旧神崎町の名が郡名「神崎」に由来することの明示的な資料は未確認
  updated: '2026-11-13'
- id: muni/28-福崎町
  code: '284432'
  names:
    ja: 福崎町
    reading: ふくさきちょう
    aliases: []
  user_terms:
  - 福崎
  - ふくさき
  - 柳田國男の生まれた町
  - 八千種
  - 神崎郡福崎町
  naming_type: その他
  naming_note: 1889年の福崎村発足以来の名。地名の由来は未確認
  formation: 編入合併
  prefecture: 兵庫県
  homonyms: []
  summary: 神崎郡の町。1889年に福崎村として発足し、1925年に町制を施行、1956年に田原村・八千種村を編入した。町域は古代の播磨国神前郡にあたり、『播磨国風土記』の里々に比定される地域を含むが、「福崎」という地名そのものの語源は、確認できた町公式・学術資料では説明されていない。民俗学者・柳田國男の生誕地として知られる。
  first_attestation:
    era: 明治
    year_western: 1889
    document: 町村制施行による福崎村の発足
    note: 自治体名としての初出。地名「福崎」自体の初出・語源は未確認で、1889年以前の小地名としての存在も確認できなかった
  claims:
  - text: 歴史的行政区域データセットによれば、福崎村の存続期間は1889年4月1日から1925年12月1日までで、同日に町制を施行して福崎町となった
    kind: fact
    level: E2
    status: established
    sources:
    - x12-fukusaki-geoshape
    - x12-fukusaki-school
  - text: 1956年（昭和31年）5月3日、田原村・八千種村を編入して現在の福崎町となった
    kind: fact
    level: E2
    status: established
    sources:
    - x12-inagawa-yoran
  - text: 町域は古代の播磨国神前郡にあたり、神戸大学の調査報告書は、町域が『播磨国風土記』神前郡条の高岡里・川辺里・多駝里などにあたるとする
    kind: fact
    level: E2
    status: established
    sources:
    - x12-kobe-u-fukusaki-report
  - text: 『播磨国風土記』神前郡条の冒頭は、伊和大神の子・建石敷命が山崎村の神前山に鎮座したことから「神前（かむさき）」の名がついたと語る。町公式資料もこの記述を紹介している
    kind: legend
    level: E2
    status: established
    sources:
    - x12-kobe-u-fukusaki-report
    - x12-fukusaki-school
  - text: 風土記の多駝里条にみえる「八千軍野」は、天日桙命（あめのひぼこのみこと）の軍が八千あったことに由来するという地名起源説話で、その比定地は現在の福崎町八千種とみるのが通説であると神戸大学の報告書は述べる
    kind: legend
    level: E2
    status: established
    sources:
    - x12-kobe-u-fukusaki-report
  - text: 1894年（明治27年）に播但鉄道が開通して福崎駅が置かれると、駅前に町場が形成されて郡内でも中心的な商業地として栄え、この人口増加を背景に1925年の町制施行に至った
    kind: fact
    level: E2
    status: established
    sources:
    - x12-fukusaki-school
  - text: 「福崎」という地名そのものの語源については、町公式資料・神戸大学の調査報告書を確認した範囲では説明が見当たらなかった
    kind: fact
    level: E2
    status: indeterminate
    sources:
    - x12-fukusaki-school
    - x12-kobe-u-fukusaki-report
  - text: 福崎町の地方公共団体コードは284432である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 天日桙命の軍「八千」が地名になった八千種
    text: 福崎町の大字「八千種（やちくさ）」は、『播磨国風土記』の地名起源説話の舞台とされる。渡来の神・天日桙命の軍が八千もあったので、その野を「八千軍野」と呼んだという。八千種はこの八千軍野の比定地とみるのが通説で、古代の物語が今の住所に姿を変えて残っている。同じ風土記の神前郡条は、隣の市川町・神河町にもまたがる郡名「神前（かむさき）」の由来も語っており、この一帯は風土記の物語の密度がひときわ濃い地域である。
    sources:
    - x12-kobe-u-fukusaki-report
    - x12-fukusaki-school
  relations:
  - pref/28
  unknowns:
  - 「福崎」の語源・初出は未確認。『福崎町史』など専門資料での確認が今後の課題
  - 英語版Wikipediaは1925年の町制施行に際して富岡村と合併したと記すが、町公式資料・歴史的行政区域データセットは単独の町制施行を示しており、この点は確認できなかった
  updated: '2026-11-13'
- id: muni/28-稲美町
  code: '283819'
  names:
    ja: 稲美町
    reading: いなみちょう
    aliases:
    - 印南野
  user_terms:
  - 稲美
  - いなみ
  - 印南野
  - 万葉集の印南野の町
  - 加古郡稲美町
  naming_type: 新規命名
  naming_note: 1955年の合併新町名。古名「印南野」の読み「いなみ」に新しい漢字を当てたとみられる
  formation: 合併新設
  prefecture: 兵庫県
  homonyms: []
  summary: 加古郡の町。1955年3月31日に加古村・母里村・天満村が合併して発足した。町域は古く「印南野（いなみの）」と呼ばれた台地で、『万葉集』に印南野を詠んだ歌が13首あると町は紹介する。新町名「稲美」の読み「いなみ」は、この古名の読みと一致する。大きな川のない台地のため池の景観でも知られる。
  first_attestation:
    era: 奈良時代
    year_western: null
    document: 『万葉集』
    note: 現町名そのものではなく、読みの元になった古名「印南野（いなみの）」の初出資料として掲げる。町公式資料によれば、万葉集には「印南野」「印南野原」「いなみ」を詠み込んだ歌が13首ある。編纂年には諸説があるため year_western は空欄とした
  claims:
  - text: 1955年（昭和30年）3月31日、加古村・母里村・天満村の3村が合併して稲美町が発足した
    kind: fact
    level: E2
    status: established
    sources:
    - x12-inami-ayumi
    - x12-inami-geoshape
  - text: 町公式資料は、町域が「印南野（いなみの）」の台地にあり、『万葉集』には「印南野」「印南野原」「いなみ」の名を詠み込んだ歌が13首あると紹介する
    kind: fact
    level: E2
    status: established
    sources:
    - x12-inami-ayumi
  - text: 『日本歴史地名大系』は、古名「印南野」の読みを「いなみの」とし、その範囲に現在の稲美町を含むと記す。町名「稲美」の読み「いなみ」は、この古名の読みと重なる
    kind: fact
    level: E3
    status: established
    sources:
    - upg-u4-inami-kotobank-inamino
  - text: 新町名「稲美」は、古名「印南野」の読み「いなみ」を引き継ぎ、「稲」「美」の新しい漢字を当てた名とみられる。ただし、命名の経緯を明示した公式資料は確認できなかった
    kind: fact
    level: H
    status: inferred
    sources:
    - x12-inami-ayumi
  - text: 町の年表は、726年（神亀3年）に聖武天皇の印南野行幸があったことを記す
    kind: fact
    level: E2
    status: established
    sources:
    - x12-inami-ayumi
  - text: 印南野台地には大きな川がなく、近世に至るまで野原の姿をとどめていた。人々は水不足と闘いながら、ため池を築いて開墾を進めた
    kind: fact
    level: E2
    status: established
    sources:
    - x12-inami-ayumi
  - text: 前身の一つ加古村は、1889年に発足した加古新村が1948年（昭和23年）10月1日に改称したものである
    kind: fact
    level: E2
    status: established
    sources:
    - x12-inagawa-yoran
  - text: 稲美町の地方公共団体コードは283819である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 万葉の「印南野」と、川のない町の水の歴史
    text: 『万葉集』に13首も詠まれた「印南野」。その読み「いなみ」は、1955年に生まれた新町名「稲美」に受け継がれた。もっとも、この台地には大きな川が一本もない。人々は雨水をためる池を掘り続けて土地を開き、水をめぐる争い（水論）も繰り返された。今も町内に大小のため池が点在する景観は、万葉の歌の舞台であると同時に、水と闘ってきた農の歴史の姿でもある。
    sources:
    - x12-inami-ayumi
    - upg-u4-inami-kotobank-inamino
  relations:
  - pref/28
  unknowns:
  - 「稲美」の命名理由（なぜ「稲」「美」の字が選ばれたか）を明示した資料は未確認
  - 古名「印南」自体の語源（印南郡・印南浦との関係を含む）は確認できなかった
  updated: '2026-11-13'
- id: muni/28-芦屋市
  code: '282065'
  names:
    ja: 芦屋市
    reading: あしやし
    aliases:
    - 精道村
    - 芦屋村
  user_terms:
  - 芦屋の名前の由来
  - あしや
  - 高級住宅地の芦屋
  - 精道村という旧名
  naming_type: 中心地名の継承
  formation: 合併新設
  prefecture: 兵庫県
  homonyms:
  - muni/40-芦屋町
  summary: 芦屋は、六甲山南麓の海辺の低湿地に広がった芦原（葦原）を意味する地形地名で、古代の歌書にも「芦屋の浦」「芦屋の灘」として現れる。ただし古代の「芦屋」は現在の市域に限らない一帯の総称だった。1889年に発足した精道村では「精道」の名が普及せず、1940年の市制施行の際、旧大字名で世間に知られた「芦屋」が市名に選ばれた。
  first_attestation:
    era: 古代
    year_western: null
    document: 『万葉集』『伊勢物語』などの歌書・物語
    note: 芦屋市史が紹介する形での用例。当時は六甲山南麓の臨海低湿地一帯の総称を指し、現在の芦屋市域に限る名ではなかったと市史は述べる
  claims:
  - text: 地方公共団体コードは282065である
    kind: fact
    level: E2
    status: established
    sources:
    - d-cap-jlis-hyogo
  - text: 芦屋市史によれば、「芦屋」は海辺や河辺の低湿地の芦原・葦原を意味する、地形に関係の深い地名である
    kind: fact
    level: E2
    status: established
    sources:
    - p4-ashiya-shishi
  - text: 芦屋市史は、「芦屋（葦の屋）」の名が『万葉集』『伊勢物語』『後拾遺和歌集』『千載和歌集』『新古今和歌集』などの歌書や物語に現れる古い地名だが、古代には六甲山南麓の臨海低湿地一帯の総称であり、のちに芦屋川河口の狭い地域の名になったと紹介する
    kind: fact
    level: E2
    status: established
    sources:
    - p4-ashiya-shishi
  - text: 1889年（明治22年）4月1日、芦屋村・打出村・三条村・津知村の4か村が合併して精道村が発足した
    kind: fact
    level: E2
    status: established
    sources:
    - p4-ashiya-kouhou
  - text: 「精道」の村名は普及せず、鉄道の駅や郵便局などの施設は「芦屋」を冠していたと芦屋市史は述べる
    kind: fact
    level: E2
    status: established
    sources:
    - p4-ashiya-shishi
  - text: 1940年（昭和15年）11月10日、精道村は町制を経ずに市制を施行して芦屋市となり、全国で173番目の市となった
    kind: fact
    level: E2
    status: established
    sources:
    - p4-ashiya-seido
  column:
    title: 「精道市」にならなかった理由
    text: 1940年の市制施行にあたり、村名のままなら「精道市」になるところだった。しかし精道村の公文書には、「芦屋」の名は全国はもとより海外にまで知られ、村民ですら精道村を「芦屋」と呼び、市内の国鉄・阪急・阪神の駅、警察署、郵便局、女学校の名称はすべて「芦屋」を冠して「精道」を冠するものはない、といった理由が記されていた。51年間使われた村名よりも、古くから人々に親しまれた地名の方が強いという判断である。今も「精道」は町名と小学校名にかろうじて名残をとどめる。
    sources:
    - p4-ashiya-seido
    - p4-ashiya-shishi
  relations:
  - pref/28
  - muni/40-芦屋町
  unknowns:
  - 『万葉集』など歌書における「芦屋」の具体的な歌と所在巻数までは市史本文で特定できなかった
  - 福岡県芦屋町との由来の異同は相手側レコードで別途確認する
  updated: '2026-11-13'
- id: muni/28-西宮市
  code: '282049'
  names:
    ja: 西宮市
    reading: にしのみやし
    aliases:
    - 西宮町
  user_terms:
  - 西宮の名前の由来
  - えべっさんの神社から来た地名
  - 広田神社と西宮の関係
  - 西宮はなぜ「西」の宮なのか
  naming_type: 学校名・駅名などから
  naming_note: 神社名「西宮」の継承
  formation: 単独発足
  prefecture: 兵庫県
  homonyms: []
  summary: 市名は西宮神社にちなむ。「西宮」はもともと式内社・広田神社とその摂社（戎社）を指す言葉で、最古の史料は元永2年（1119年）の『長秋記』に見える「西宮社」。神社を指した名が荘園・門前町へと広がり、やがて市名になった。大正14年（1925年）に市制を施行した。
  first_attestation:
    era: 元永2年
    year_western: 1119
    document: 長秋記（源師時）
    note: 広田社への参詣の際に「西宮社」に奉幣したとあるのが最古の史料で、この時点では地名ではなく神社（西宮神社）を指す。平安時代には広田神社そのものの別称としても「西宮」が使われた
  claims:
  - text: 西宮市の地方公共団体コードは282049である（総務省「地方公共団体コード一覧」による）
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  - text: 地名「西宮」は西宮神社にちなみ、その最古の史料は元永2年（1119年）の源師時『長秋記』で、広田社参詣の際に「西宮社」に奉幣した記事である
    kind: fact
    level: E3
    status: established
    sources:
    - k5-nishinomiya-kotobank-hyakka
  - text: 西宮社はもと式内社・広田神社の摂社（戎社）で、鎌倉時代以降に独立して発展した
    kind: fact
    level: E3
    status: established
    sources:
    - k5-nishinomiya-kotobank-hyakka
  - text: 『伊呂波字類抄』や『簾中抄』の段階では広田神社そのものが「西宮」と呼ばれるに至っており、「西宮」は当初は神社を指す言葉だった
    kind: fact
    level: E3
    status: established
    sources:
    - k5-nishinomiya-kotobank-hyakka
  - text: 廣田神社公式によれば、都から見て西方にある重要な神社であったため中世の貴族が広田神社を「西宮」と別称し、呼称が広田神郷（荘園）全体を指す地名となり、近世には戎社のある浜南宮周辺、すなわち旧西宮町の地名となった
    kind: fact
    level: E2
    status: established
    sources:
    - k5-hirota-jinja-yurai
  - text: 西宮神社の祭神は、鳴尾の沖で漁師の網にかかって引き上げられた神を祀ったことに始まるという伝承がある
    kind: legend
    level: E2
    status: established
    sources:
    - k5-nishinomiya-city-shoshi
  - text: 大正14年（1925年）4月1日に市制を施行して西宮市が発足した
    kind: fact
    level: E2
    status: established
    sources:
    - k5-nishinomiya-sakurafm
  column:
    title: 神社の名前がまちの名前になるまで
    text: 「西宮」が指す範囲は、時代とともに一段ずつ広がっていった。はじめは広田神社の摂社である戎社（西宮社）を指し、やがて広田神社そのものの別称として使われ、荘園である広田神郷全体の名となり、近世には戎社の門前にできた町の名になった。1925年に市制が施行されると、その町名がそのまま市名になる。神社の一社の名が、千年かけて一つの市の名に育った例である。
    sources:
    - k5-hirota-jinja-yurai
    - k5-nishinomiya-kotobank-hyakka
  relations:
  - pref/28
  unknowns:
  - 「西宮」の呼称が地名として定着した正確な時期は特定できない
  - 西宮社（戎社）の創建年代は不明
  updated: '2026-11-13'
- id: muni/28-西脇市
  code: '282138'
  names:
    ja: 西脇市
    reading: にしわきし
    aliases:
    - 津万村
    - 都麻郷
  user_terms:
  - にしわき
  - 日本のへそ
  - 播州織のまち
  naming_type: 方位・位置による命名
  formation: 合併新設
  prefecture: 兵庫県
  homonyms: []
  summary: 1952年に西脇町など1町3村が合併して市制施行し、2005年に黒田庄町と新設合併した市。「西脇」は1917年に津万村が町制施行する際に採用した名で、その由来は、加古川の支流が西の谷に入る山脇の地であること、あるいは古名・都麻（津万）郷の西側であることによると市は説明する。東経135度と北緯35度の交点が市内にあり、「日本のへそ」を名乗る。
  first_attestation:
    era: 大正時代
    year_western: 1917
    document: 西脇市「新・西脇市誕生までのあゆみ」ほか市の沿革資料
    note: 自治体名としての「西脇」は、大正6年（1917）11月1日に津万村が町制施行して西脇町と改称したのが初出とされる。それ以前の地名としての用例は未確認である
  claims:
  - text: 西脇市の合併記録は、「西脇」の名の由来について、加古川の支流が西の谷に入る山脇の地にあることから名付けられたとの説と、現在の西脇区が古来の呼び名であった都麻（津万）郷の西側であることから名付けられたとの説を、有力な説として紹介する
    kind: fact
    level: E2
    status: contested
    sources:
    - x3-nishiwaki-gappei
  - text: 大正6年（1917）11月1日に津万村が町制施行し、西脇町と改称した
    kind: fact
    level: E2
    status: established
    sources:
    - x3-nishiwaki-gappei
    - x3-nishiwaki-ayumi
  - text: 昭和27年（1952）4月1日に西脇町・日野村・重春村・比延庄村の1町3村が合併して西脇市が誕生した（県内14番目の市で、播磨内陸部では初の市だった）
    kind: fact
    level: E2
    status: established
    sources:
    - x3-nishiwaki-ayumi
    - x3-nishiwaki-gappei
  - text: 平成17年（2005）10月1日に、西脇市と多可郡黒田庄町が新設合併して現在の西脇市となった
    kind: fact
    level: E2
    status: established
    sources:
    - x3-nishiwaki-gappei
  - text: 1954年に加西郡芳田村の編入で市域が広がった
    kind: fact
    level: E2
    status: established
    sources:
    - x3-nishiwaki-gappei
  - text: 東経135度と北緯35度が市内で交差しており、西脇市はこの交点を「日本のへそ」として宣言している
    kind: fact
    level: E2
    status: established
    sources:
    - x3-nishiwaki-gappei
  - text: 総務省の全国地方公共団体コードで、西脇市の団体コードは282138と定められている
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 「日本のへそ」は東経135度と北緯35度の交点
    text: 西脇市のもう一つの顔が「日本のへそ」です。日本標準時の基準となる東経135度の子午線と、北緯35度の緯線が、市内のちょうど一点で交わります。この交点があることから市は「日本のへそ」を宣言し、へそ公園や日時計の広場が整備されました。もともと西脇は、織物の播州織で栄えた内陸のまち。その名「西脇」も、谷川が西へ入る山脇の地形を写した名か、古い郷の名「都麻」の西という位置を示す名か、二つの説が市自身の記録に併記されています。
    sources:
    - x3-nishiwaki-gappei
  relations:
  - pref/28
  - muni/28-加東市
  - muni/28-加西市
  unknowns:
  - 「西脇」の2つの由来説のどちらが正しいかは、市の記録でも併記されたままで決着していない
  - 1917年の町制施行時に「西脇」の名を選んだ経緯（公募か協議か）の一次記録は未確認である
  updated: '2026-11-13'
- id: muni/28-豊岡市
  code: '282090'
  names:
    ja: 豊岡市
    reading: とよおかし
    aliases:
    - 豊岡町
    - 豊岡県
  user_terms:
  - 豊岡の名前の由来
  - とよおか
  - コウノトリの豊岡
  - かばんのまち豊岡
  - 城崎温泉のある市
  naming_type: 中心地名の継承
  formation: 合併新設
  prefecture: 兵庫県
  homonyms: []
  summary: 豊岡の名は、近世初期に形成が始まった城下町「豊岡」に由来すると日本歴史地名大系は説明する。1580年に宮部氏が神武山に城を築いて以来の城下町で、江戸時代は京極氏が治め、明治初年には但馬・丹後などを管轄する豊岡県の県庁が置かれた。現在の市は1950年の市制を経て、2005年に城崎町など5町と合併して生まれた。
  first_attestation:
    era: 安土桃山時代
    year_western: null
    document: 未確認
    note: 「豊岡」は近世初期の城下町名として成立したと日本歴史地名大系は述べるが、文献上の初出の特定はできなかった
  claims:
  - text: 地方公共団体コードは282090である
    kind: fact
    level: E2
    status: established
    sources:
    - d-cap-jlis-hyogo
  - text: 日本歴史地名大系によれば、市名「豊岡」は近世初期に形成が始まった城下町豊岡に由来する
    kind: fact
    level: E3
    status: established
    sources:
    - p4-kotobank-toyooka
  - text: 「豊岡」の語源については、日本歴史地名大系や国語辞典にも字義を説明する記述は見当たらず、定説は確認できない
    kind: fact
    level: E3
    status: indeterminate
    sources:
    - p4-kotobank-toyooka
    - p4-kotobank-toyooka-dict
  - text: 豊岡市公式の歴史解説によれば、1580年に羽柴秀吉の武将宮部善祥房が神武山に城を築き城下町の形成に着手したのが、豊岡のまちの始まりであるといわれている
    kind: fact
    level: E2
    status: established
    sources:
    - p4-toyooka-city-rekishi
  - text: 1668年（寛文8年）に京極高盛が丹後田辺城から移封されて以来、豊岡は京極氏3万5千石の城下町として発展した
    kind: fact
    level: E2
    status: established
    sources:
    - p4-toyooka-city-rekishi
    - p4-kotobank-toyooka-dict
  - text: 明治4年（1871年）の廃藩置県で但馬8郡・丹後5郡・丹波3郡を管轄する豊岡県が設置され豊岡はその県庁所在地となったが、明治9年（1876年）に豊岡県は解体され兵庫県と京都府に分割された
    kind: fact
    level: E2
    status: established
    sources:
    - p4-toyooka-city-rekishi
  - text: 1950年（昭和25年）に豊岡町と五荘村・新田村・中筋村が合併して、最初の豊岡市が誕生した
    kind: fact
    level: E2
    status: established
    sources:
    - p4-toyooka-city-rekishi
  - text: 2005年（平成17年）4月1日、旧豊岡市と城崎町・竹野町・日高町・出石町・但東町が合併して現在の豊岡市が誕生した
    kind: fact
    level: E2
    status: established
    sources:
    - p4-toyooka-city-machi
    - p4-estat-toyooka
  column:
    title: 県庁のあったまち ― 豊岡県の5年間
    text: 明治4年（1871年）から明治9年（1876年）までのわずか5年ほど、豊岡は「豊岡県」の県庁所在地だった。その管轄は現在の兵庫県北部（但馬）にとどまらず、丹後全域と丹波の一部にまで及ぶ広大なものだった。府県の再編で豊岡県は姿を消し、但馬は兵庫県、丹後は京都府へ分かれたが、「豊岡」の名は町名・市名として残り、平成の合併でも新市の名前として選ばれ続けた。県名としては消えた名前が、市名としては生き延びた例である。
    sources:
    - p4-toyooka-city-rekishi
    - p4-kotobank-toyooka-dict
  relations:
  - pref/28
  unknowns:
  - 「豊岡」の語源について、「豊かな岡」といった字義説を含め専門的な典拠は確認できなかった
  - 『和名類聚抄』所載の城崎郡・気多郡の郷名の中に「豊岡」に当たるものがあるかは確認できなかった
  updated: '2026-11-13'
- id: muni/28-赤穂市
  code: '282120'
  names:
    ja: 赤穂市
    reading: あこうし
    aliases:
    - 赤穂町
    - あかほ
  user_terms:
  - 赤穂の名前の由来
  - あこう
  - あかほ
  - 忠臣蔵の赤穂
  - 赤穂の塩の町
  naming_type: 旧行政区画名の継承
  formation: 単独発足
  prefecture: 兵庫県
  homonyms: []
  summary: 赤穂は播磨国の郡名に由来する古い地名で、天平19年（747）の文書に「赤穂郡」が見える。読みは古く「あかほ」で、『和名類聚抄』も「阿加保」とする。語源には、千種川の河原に赤い穂のタデが生えていたという説が地元で伝えられる。江戸時代は浅野氏らの城下町となり赤穂事件で知られ、1951年に市制を施行した。読みは後に「あこう」へ改められた。
  first_attestation:
    era: 奈良時代
    year_western: 747
    document: 大安寺伽藍縁起并流記資財帳
    note: 日本歴史地名大系によれば、天平19年（747）の同文書に大安寺の墾田として「赤穂郡十町」と見えるのが古い用例
  claims:
  - text: 地方公共団体コードは282120である
    kind: fact
    level: E2
    status: established
    sources:
    - d-cap-jlis-hyogo
  - text: 日本歴史地名大系によれば、天平19年（747）の大安寺伽藍縁起并流記資財帳に「赤穂郡十町」と見え、同年の勅旨（東大寺要録）にも「播磨国赤穂郡五十戸」とあって、「赤穂郡」の名は奈良時代にさかのぼる
    kind: fact
    level: E3
    status: established
    sources:
    - p4-kotobank-ako-gun
  - text: 『播磨国風土記』は現存する部分に赤穂郡の条を欠いており、古代の赤穂を伝える文献史料は乏しい
    kind: fact
    level: E3
    status: established
    sources:
    - p4-kotobank-ako-gun
  - text: 『和名類聚抄』（東急本）での郡名の読みは「阿加保」で、地名の読みは古く「あかほ」だった
    kind: fact
    level: E3
    status: established
    sources:
    - p4-kotobank-ako-gun
  - text: 地元で伝えられる語源として、千種川の河原一面に赤い穂のタデが生えていたことに由来するという説がある
    kind: fact
    level: E4
    status: contested
    sources:
    - p4-kobe-ako
  - text: 江戸時代の赤穂は浅野氏の城下町として発展し、浅野長矩の刃傷事件による改易と赤穂義士で知られ、製塩（赤穂塩）の町でもあった
    kind: fact
    level: E3
    status: established
    sources:
    - p4-kotobank-ako
  - text: 1951年（昭和26年）、赤穂町・坂越町・高雄村が合併と同時に市制を施行して赤穂市が誕生した
    kind: fact
    level: E2
    status: established
    sources:
    - p4-ako-city-plan
  - text: 読みは長く「あかほ」で、大正時代の駅名標にも「ばんしうあかほ」とあったが、後に「あこう」に改められ、市の広報紙の題字も「あかほ」から「あこう」に変更された経緯が地元紙の調査でたどれる
    kind: fact
    level: E4
    status: established
    sources:
    - p4-kobe-ako
  column:
    title: 「あかほぎし」が「あこうぎし」になるまで
    text: 忠臣蔵の舞台として知られる赤穂だが、かつて読みは「あかほ」で、「赤穂義士」も「あかほぎし」と呼ばれていたという。大正時代の播州赤穂駅の看板にも「ばんしうあかほ」の文字が残る。ところが現在の正式な読みは「あこう」で、市の広報紙も題字が「あかほ」から「あこう」に改められた歴史を持つ。地名の文字は奈良時代の文書から変わらないのに、読みだけが千年あまりをかけて静かに移り変わった例である。
    sources:
    - p4-kobe-ako
    - p4-kotobank-ako-gun
  relations:
  - pref/28
  unknowns:
  - 「赤穂」の語源の定説（赤いタデの穂説のほか、赤土や入江に結びつける説を含む専門的な検討）は確認できなかった
  - 読みを「あこう」に改めた正確な年月日と告示は、市の公式資料では確認できなかった
  updated: '2026-11-13'
- id: muni/28-養父市
  code: '282227'
  names:
    ja: 養父市
    reading: やぶし
    aliases:
    - 夜夫郡
    - 養父郡
  user_terms:
  - やぶ
  - 但馬の市
  - 八鹿町があったところ
  naming_type: 旧行政区画名の継承
  formation: 合併新設
  prefecture: 兵庫県
  homonyms: []
  summary: 2004年に養父郡の八鹿町・養父町・大屋町・関宮町の4町が合併して誕生した市で、市名は郡名「養父」の継承である。「養父」は奈良時代の資料に「夜夫郡」とも「養父郡」とも書かれた古い名で、『播磨国風土記』には「夜夫郡（やぶぐん）」とある。読みの「やぶ」は、円山川沿いの草木の繁る景観を表した名と市は推定する。
  first_attestation:
    era: 奈良時代
    year_western: 717
    document: 『播磨国風土記』
    note: 養父市公式が紹介するところでは、霊亀3年（717）以前の成立とされる『播磨国風土記』に「夜夫郡（やぶぐん）」と表記されたのが古い用例。「養父」の表記は天平9年（737）の『但馬国正税帳』に「養父郡養父神」と見える
  claims:
  - text: 養父市は平成16年（2004）4月1日に、養父郡の八鹿町・養父町・大屋町・関宮町の4町が合併して誕生し、養父郡は消滅した
    kind: fact
    level: E2
    status: established
    sources:
    - upg-u1-hyogo-ichiran
  - text: 新市名の最終候補は「養父」と「但馬（たじま）」の2点で、「養父市」に決定した
    kind: fact
    level: E4
    status: established
    sources:
    - x3-uub-yabu
  - text: 養父市公式は、天平9年（737）の『但馬国正税帳』に「養父郡養父神」という文字があると紹介する
    kind: fact
    level: E2
    status: established
    sources:
    - x3-yabu-bunkazai
  - text: 同市公式は、『播磨国風土記』ではこの郡が「夜夫郡（やぶぐん）」と表記されたと紹介する
    kind: fact
    level: E2
    status: established
    sources:
    - x3-yabu-bunkazai
  - text: 同市公式は、天平勝宝7年（755）5月の平城宮跡出土木簡に「但馬国養父郡老佐（小佐）郷、赤米五斗、村長、語部広麻呂」と記された荷札があると紹介する
    kind: fact
    level: E2
    status: established
    sources:
    - x3-yabu-bunkazai
  - text: 同市公式は、『和名類聚抄』の養父郡には養父郷を含む10郷があったこと、『肥前国風土記』には別の養父について犬がほえるのをやめたので「やぶ」となったという伝承があることを紹介し、「やぶ」の地名は円山川付近の草木の繁る景観を表した名と推定する
    kind: fact
    level: E2
    status: contested
    sources:
    - x3-yabu-bunkazai
  - text: 総務省の全国地方公共団体コードで、養父市の団体コードは282227と定められている
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 「夜夫」と書いて「やぶ」と読んだ郡
    text: 養父市の「養父」は、漢字だけ見ると「ようふ」と読みたくなりますが、読みは「やぶ」。奈良時代の『播磨国風土記』では、この郡は「夜夫郡（やぶぐん）」と書かれていました。「夜夫」も「養父」も、音「やぶ」に字を当てた表記なのです。「やぶ」とは何か——市は、円山川のほとりの草木の繁る景観、つまり「薮」を表した名と推定しています。面白いのは、遠く離れた『肥前国風土記』にも「養父」があり、そちらには「犬がほえるのをやめたので『やぶ』」という伝承が残ることです。同じ読みの地名が、別の土地で別の物語を持っている好例です。
    sources:
    - x3-yabu-bunkazai
  relations:
  - pref/28
  - muni/28-朝来市
  unknowns:
  - 「やぶ」の語源は市の推定（円山川沿いの薮の景観）にとどまり、専門辞典での確認は未了である
  - 「養父」の字が選ばれた理由（養父神社との関係を含む）は、市公式の文化財解説でも説の紹介にとどまり未確定である
  updated: '2026-11-13'
- id: muni/28-香美町
  code: '285854'
  names:
    ja: 香美町
    reading: かみちょう
    aliases: []
  user_terms:
  - 香美
  - かみ
  - 香住と村岡と美方が合併した町
  - 香住ガニの町
  - 兵庫の香美町
  naming_type: 合成地名
  naming_note: 「香住」の「香」と「美方」などの「美」を合わせた合成名
  formation: 合併新設
  prefecture: 兵庫県
  homonyms: []
  summary: 美方郡の町。2005年4月1日に香住町・美方町・村岡町の3町が合併して誕生し、城崎郡は消滅した。町名は「香住町」の「香」と、「美方町」「七美郡」などの「美」を合わせたものとされる。高知県の香美市（旧香美郡）とは同字だが無関係である。
  first_attestation:
    era: 平成
    year_western: 2005
    document: 総務大臣の廃置分合告示（2005年1月下旬）
    note: 合併協議会広報第10号によれば、総務大臣の告示により廃置分合の効力が発生し、2005年4月1日に香美町が誕生した
  claims:
  - text: 2005年（平成17年）4月1日、城崎郡香住町、美方郡美方町・村岡町の3町が合併して香美町が誕生し、城崎郡は消滅した
    kind: fact
    level: E2
    status: established
    sources:
    - x12-kami-soumu
    - x12-kami-ndl
    - x12-kami-wiki
  - text: 町名は「香住町」の「香」と、「美方町」や旧郡名「七美郡」の「美」を合わせたものとされる。美方町・村岡町・香住町合併協議会の会議資料に収録された新町名称の公募作品（第一次選定10作品）の理由にも、「香住の『香』と美方の『美』」とする説明と、村岡・美方町が昔の七美郡の「美」によるとする説明が記されている
    kind: fact
    level: E2
    status: established
    sources:
    - upg-ag5-kami-gappei-kyogikai
  - text: 高知県の香美市は、2006年に旧香美郡の土佐山田町・香北町・物部村が合併して生まれ、市名は旧郡名「香美」を引き継いだものである（香美市広報による）。兵庫県の香美町は2005年に但馬の3町の合併で生まれた自治体であり、両者は同字であるが由緒を異にする無関係の自治体である
    kind: fact
    level: E2
    status: established
    sources:
    - r2-kami-koho
    - x12-kami-soumu
  - text: 合併に先立ち、2004年10月に3町の町長が兵庫県知事へ廃置分合申請書を提出し、2005年1月下旬の総務大臣の告示を経て、4月1日の香美町誕生へと進んだ
    kind: fact
    level: E2
    status: established
    sources:
    - x12-kami-kyogikai
  - text: 旧香住町は、1889年に美含郡香住村として発足し、1925年10月1日に町制を施行して香住町となった
    kind: fact
    level: E2
    status: established
    sources:
    - x12-inagawa-yoran
  - text: 旧美方町は、1955年（昭和30年）4月1日に小代村・射添村が合併して発足した町である
    kind: fact
    level: E2
    status: established
    sources:
    - x12-inagawa-yoran
  - text: 合併広報は、新町の面積を369.08平方キロメートルとし、町の規模では県下6番であると伝えた
    kind: fact
    level: E2
    status: established
    sources:
    - x12-kami-kyogikai
  - text: 香美町の地方公共団体コードは285854である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 高知の香美市とは、まったくの無関係
    text: 「香美町」と聞いて高知県の香美市を思い浮かべる人もいるが、両者は同字なだけで成り立ちは無関係である。兵庫の香美は、日本海側の香住町の「香」と、山側の美方町・旧郡名に含まれる「美」を合わせた平成の合成名。合併した村岡町の名は町名には残らなかったが、旧町域は地域自治区「村岡区」として名を留めている。なお読みは「かみ」で、高知の香美市と同じである。
    sources:
    - x12-kami-wiki
  relations:
  - pref/28
  unknowns:
  - 町名の最終選定の経緯の詳細は未確認（命名の考え方は合併協議会の会議資料に収録された公募作品の理由で確認できる。合併協議会広報第10号に命名理由の明示はない）
  - 村岡町の名が新町名に採用されなかった経緯も未確認
  - 旧香住村の発足時（1889年）の構成村（境村・一日市村・若松村・香住村など10村）の内訳は、Wikipediaの記述のみで強い出典の裏付けは未確認
  - 旧美方町の名が美方郡の郡名によったことはWikipediaのみで、専門資料での裏付けは未確認
  updated: '2026-11-13'
- id: muni/28-高砂市
  code: '282162'
  names:
    ja: 高砂市
    reading: たかさごし
    aliases:
    - 高砂津
    - 高砂の泊
  user_terms:
  - たかさご
  - 謡曲『高砂』の地
  - 相生の松のある市
  naming_type: 中心地名の継承
  formation: 合併新設
  prefecture: 兵庫県
  homonyms: []
  summary: 1954年に高砂町など4町村が合併して市制施行した市で、市名は中心地・高砂町の継承である。「高砂」はもともと「砂の高く丘のようになった所」をいう普通名詞で、加古川河口の砂地の港町の名になった。謡曲『高砂』の舞台として全国に知られ、高砂神社の「相生の松」は尉と姥の伝承で知られる。古代から中世の「高砂」の範囲は現在の加古川市域にも及んでいた。
  first_attestation:
    era: 平安時代
    year_western: 1102
    document: 丹波国司下文（東寺百合文書）
    note: 『日本歴史地名大系』が紹介するところでは、康和4年（1102）の丹波国司下文に「高砂津」と見えるのが確実な古い用例の一つ。「高砂」はもともと砂丘・砂の高まりをいう普通名詞だった
  claims:
  - text: 『日本歴史地名大系』によると、古代から中世の地名「高砂」は加古川の河口部の、現高砂町から加古川市尾上町付近にあった地名で、港として栄えた
    kind: fact
    level: E3
    status: established
    sources:
    - x3-kotobank-takasago
  - text: 同大系は、康和4年（1102）の丹波国司下文（東寺百合文書）に「高砂津」とみえると紹介する
    kind: fact
    level: E2
    status: established
    sources:
    - x3-kotobank-takasago
  - text: 「高砂」は本来「砂の高く丘のようになった所・高い砂丘」をいう普通名詞であり（精選版日本国語大辞典）、地名「高砂」も加古川河口の砂地の地形にちなむ名とみられる
    kind: fact
    level: E3
    status: contested
    sources:
    - x3-kotobank-takasago
  - text: 高砂市は1954年に、高砂町・荒井村・曽根町などが合併して市制施行し誕生した
    kind: fact
    level: E3
    status: established
    sources:
    - x3-kotobank-takasago
  - text: 高砂市公式は、高砂は万葉の昔から白砂青松の地として知られ、「松どころ」として和歌や漢詩にしばしば登場し、高砂の名が全国へ広まっていったと紹介する
    kind: fact
    level: E2
    status: established
    sources:
    - x3-takasago-meisho
  - text: 謡曲『高砂』は世阿弥作の脇能物で、高砂と住吉の松の精が現れて松の長寿と人の世をことほぐ曲であり、結婚披露宴の「高砂の席」の由来にもなっている
    kind: fact
    level: E3
    status: established
    sources:
    - x3-kotobank-takasago
  - text: 高砂神社の相生の松について、市公式は、根が一つで雌雄の幹が左右に分かれた松であり、ある日、尉と姥の二神が現れて「神霊をこの木に宿し、世に夫婦の道を示さん」と告げたことから霊松として信仰を集めた、という伝承を紹介する
    kind: legend
    level: E2
    status: established
    sources:
    - x3-takasago-meisho
  - text: 高砂神社の社伝では、神功皇后が外征の帰途にこの地で大己貴命を祀ったのが神社の始まりで、創建まもなく境内に生え出たのが相生の松だと伝えられている
    kind: legend
    level: E2
    status: established
    sources:
    - x3-takasago-meisho
  - text: 総務省の全国地方公共団体コードで、高砂市の団体コードは282162と定められている
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 「高砂や」——砂丘の地名が、夫婦和合の象徴になるまで
    text: 結婚式で歌われる謡曲『高砂』。「高砂の松」は長寿と夫婦和合の象徴ですが、「高砂」という言葉のもとは「砂が高く丘のようになった所」という地形の普通名詞でした。加古川河口の砂地の港町がその名を持ち、世阿弥の謡曲が全国に広めたのです。高砂神社に立つ「相生の松」は、一つの根から雌雄の幹が分かれた松で、尉と姥の二神が姿を現したという伝承を持ちます。なお、この「相生の松」は高砂市内にあるもので、西隣の相生市の市名の由来（「大浦」に相模の字を当てたという説）とは別の層の話です。混同されやすい対の地名ですが、成り立ちはそれぞれ独立しています。
    sources:
    - x3-kotobank-takasago
    - x3-takasago-meisho
  relations:
  - pref/28
  - muni/28-相生市
  unknowns:
  - 『和名類聚抄』の加古郡に「高砂郷」があったかは未確認で、確実な古い用例は1102年の「高砂津」までしか遡れなかった
  - 高砂の語源を砂丘地形と結びつける説明は辞典の普通名詞の定義からの類推を含むため、statusをcontestedとした
  updated: '2026-11-13'
