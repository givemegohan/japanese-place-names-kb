    - 国府津
  user_terms:
  - 塩釜（表記ゆれ）
  - 鹽竈神社の門前町
  - 寿司のまち
  - しおがま
  naming_type: 一部の地名
  prefecture: 宮城県
  homonyms: []
  summary: 市名の「塩竈」は、もとは地名ではなく、海水を煮て塩をつくるかまど（竈）を指す普通名詞だったと市は説明する。国府の港「国府津」とも呼ばれた一帯は、陸奥国総鎮守・鹽竈神社の門前町として栄え、「塩竈」の名が地名として定着した。表記は歴史的に揺れたが、1941年の市制施行で旧字体の「竈」を含む「塩竈」に統一され、今も公用文でこの字が使われる。製塩の伝統は鹽竈神社の藻塩焼神事に受け継がれている。
  first_attestation:
    era: 平安時代初期
    year_western: null
    document: 『弘仁式主税帳』
    note: 「塩竈」の名が初めて現れる文献とされる（Wikipedia「塩竈市」の紹介による。原典での直接確認はしていない）
  claims:
  - text: 総務省の全国地方公共団体コードで、塩竈市の団体コードは042030と定められている
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  - text: 塩竈市は地名の由来について、海水を煮て塩をつくるかまど（竈）のことを「塩竈」といい、もともとは地名ではなく製塩用のかまどを指す名詞だったが、この竈のある場所として有名になり、それがそのまま地名になっていったと説明する
    kind: fact
    level: E2
    status: established
    sources:
    - t4-shiogama-city-kamado
  - text: 市の説明によれば、塩竈は国府津（国府の港の意）とも呼ばれていたが、塩竈神社が陸奥国の総鎮守として信仰を集めるようになり、国府津よりも塩竈の方が地名として定着していった
    kind: fact
    level: E2
    status: established
    sources:
    - t4-shiogama-city-minichishiki
  - text: 「塩竈」の名が初めて現れる文献は、平安時代初期の『弘仁式主税帳』であると紹介されている
    kind: fact
    level: E5
    status: established
    sources:
    - t4-shiogama-wiki
  - text: 「しおがま」の地名表記は「塩竈」「塩釜」「鹽竈」「鹽釜」と様々だったが、1941年の市制施行より表記を「塩竈」に統一したと紹介されている
    kind: fact
    level: E5
    status: established
    sources:
    - t4-shiogama-wiki
  - text: 塩竈市によれば、市名の「竈」と「釜」の両方の使用が認められているが、21画で書き方の難しい漢字である「竈」を、市役所の公用文では用いることになっている
    kind: fact
    level: E2
    status: established
    sources:
    - t4-shiogama-city-kamado
  - text: 塩竈市は昭和16年（1941年）11月23日に市制を施行し、県内3番目の市となった
    kind: fact
    level: E2
    status: established
    sources:
    - t4-shiogama-city-shiryo
  - text: 鹽竈神社では藻塩焼神事が行われ、海藻を用いる伝統的な製塩法で作る藻塩は、地名の由来ともなった製塩の伝統を今に伝えている
    kind: fact
    level: E2
    status: established
    sources:
    - t4-shiogama-city-minichishiki
    - t4-shiogama-city-shiryo
  column:
    title: 21画の「竈」を守る市
    text: 塩竈市の「竈」は21画もある難しい字です。市は、書き順まで示した案内ページを用意してこの字を守っています。歴史的には「塩釜」「鹽竈」など表記が揺れましたが、1941年の市制施行のときに「塩竈」に統一され、市の公用文では今も「竈」が使われます。一方で駅名や郵便局名には「塩釜」が残り、市内では二つの表記が並び立っています。もともとは塩を煮るかまどを指す普通名詞だった言葉が、神社の門前町として定着し、難しい旧字体ごと市の名前として生き続けているのです。
    sources:
    - t4-shiogama-city-kamado
    - t4-shiogama-wiki
  relations:
  - pref/04
  - muni/04-多賀城市
  unknowns:
  - 『弘仁式主税帳』における「塩竈」の表記は、原典で直接確認していない
  - この地で製塩が始まった時期は、確認した資料では特定できなかった
  - 「国府津」の読み「こうづ」と表記の初出については、市のミニ知識の説明以上には確認できなかった
  updated: '2026-11-13'
- id: muni/04-多賀城市
  code: 042099
  names:
    ja: 多賀城市
    reading: たがじょうし
    aliases:
    - 多賀城町
    - 多賀城村
  user_terms:
  - 史都多賀城
  - 古代東北の都
  - 多賀城碑のある市
  - たがじょう
  naming_type: その他
  prefecture: 宮城県
  homonyms: []
  summary: 市名は、奈良・平安時代に陸奥国の国府と鎮守府が置かれた古代の城柵「多賀城」に因む。多賀城は724年に大野東人によって創建されたと多賀城碑の碑文に刻まれ、11世紀中頃まで東北の政治・文化・軍事の中心だった。近代の自治体は1889年に13村の統合で多賀城村となり、1951年の町制を経て1971年に市制を施行した。滋賀県の多賀町とは同名に近いが、由来も成り立ちも異なる別の自治体である。
  first_attestation:
    era: 天平宝字6年
    year_western: 762
    document: 多賀城碑の碑文
    note: 碑文に神亀元年（724年）の多賀城創建が記される。六国史には多賀城創建の記載がない
  claims:
  - text: 総務省の全国地方公共団体コードで、多賀城市の団体コードは042099と定められている
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  - text: 市の名称は古代陸奥国府「多賀城」に因み、多賀城市は市の礎が神亀元年（724年）に陸奥国の国府として、また東北全域の政治・軍事の拠点として創建された多賀城に由来すると説明する
    kind: fact
    level: E2
    status: established
    sources:
    - t4-tagajo-city-saiyou
    - t4-tagajo-wiki
  - text: 多賀城市の資料によれば、多賀城は神亀元年（724年）に大野東人によって創建され、陸奥国の国府が置かれ、奈良時代には鎮守府もあわせ置かれて、平安時代の中頃まで東北地方の政治・文化・軍事の中心地としての役割を果たした
    kind: fact
    level: E2
    status: established
    sources:
    - t4-tagajo-city-suido
  - text: 多賀城の創建については六国史に記載がなく、多賀城碑に神亀元年（724年）に大野朝臣東人が設置したと刻まれており、この記載が発掘調査の結果と合致して考古学的にも裏付けられていることが、市の文化財資料で説明されている
    kind: fact
    level: E2
    status: established
    sources:
    - t4-tagajo-city-bunkazai
  - text: 天平宝字6年（762年）に多賀城の修造を記念して建立された多賀城碑は、多胡碑・那須国造碑とともに日本三古碑の一つに数えられ、令和6年（2024年）8月に国宝に指定された
    kind: fact
    level: E2
    status: established
    sources:
    - t4-tagajo-city-suido
    - t4-tagajo-city-saiyou
  - text: 多賀城跡は国の特別史跡「多賀城跡附寺跡」に指定され、奈良県の平城宮跡、福岡県の大宰府跡と並ぶ日本三大史跡の一つに数えられている
    kind: fact
    level: E2
    status: established
    sources:
    - t4-tagajo-city-suido
  - text: 古代末から中世初期には、陸奥国府を継承した「多賀国府」が多賀城を中心とする地域に存在したことが文献から知られるが、その遺構としては確定していない
    kind: fact
    level: E2
    status: indeterminate
    sources:
    - t4-tagajo-city-bunkazai
  - text: 近代の自治体としては、明治22年（1889年）に13の村を統合して多賀城村となり、昭和26年（1951年）7月に町制を施行し、昭和46年（1971年）11月1日に県下9番目の市として市制を施行した
    kind: fact
    level: E2
    status: established
    sources:
    - t4-tagajo-city-suishitsu
    - t4-tagajo-wiki
  column:
    title: 千三百年の名を継ぐ市
    text: 多賀城市の名の源である古代の多賀城は、724年の創建から数えて2024年に1300年を迎えました。その創建を今に伝えるのは、都の正史ではなく、762年に現地に建てられた多賀城碑の碑文です。この碑は日本三古碑の一つとして長く敬われ、2024年8月には国宝に指定されました。市が県下9番目の市となったのは1971年のことですが、人々はそれより千年以上前から、この土地を「多賀城のある場所」と呼び続けてきました。自治体の名前が古代の政庁の名をそのまま継ぐ例は、全国でも珍しいものです。
    sources:
    - t4-tagajo-city-bunkazai
    - t4-tagajo-city-saiyou
  relations:
  - pref/04
  - muni/04-塩竈市
  unknowns:
  - 地名「多賀」自体の語源は、確認した公式・専門資料では確定していなかった
  - 中世の「多賀国府」の中心地の遺構は確定していない
  - 1889年の多賀城村の命名経緯（13村のうち多賀城跡に最も近い村名があったのか等）は、確認した資料では分からなかった
  updated: '2026-11-13'
- id: muni/04-大和町
  code: '044211'
  names:
    ja: 大和町
    reading: たいわちょう
    aliases: []
  user_terms:
  - たいわ
  - 七ツ森の町
  - 吉岡（中心地区の旧町名）
  - 大和市と間違えやすい町
  naming_type: 合併新設
  prefecture: 宮城県
  homonyms:
  - muni/14-大和市
  summary: 宮城県黒川郡の町。1955年に吉岡町・宮床村・吉田村・鶴巣村・落合村が合併して発足した新設の町名で、郷土資料は「大同団結を願っての命名」と伝える。中心地区は近世に奥州街道の宿場として栄えた吉岡で、古代には多賀城以北の関門の位置を占めた。読みは「たいわ」で、神奈川県大和市（やまと）とは読みも由来も異なる別の自治体である。
  first_attestation:
    era: 昭和30年
    year_western: 1955
    document: 大和町公式資料「町の沿革」
    note: 1955年4月20日の合併で新町村名『大和町』として発足したことを町公式資料が記す。命名そのものの初出
  claims:
  - text: 総務省の全国地方公共団体コードで、大和町の団体コードは044211と定められている
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  - text: 1955年4月20日、吉岡町・宮床村・吉田村・鶴巣村・落合村が合併し、新町村名『大和町』として発足した
    kind: fact
    level: E2
    status: established
    sources:
    - z9-taiwa-town-enkaku
  - text: 町名「大和」は、合併にあたって「大同団結」を願って命名されたと郷土資料が伝える
    kind: fact
    level: E4
    status: established
    sources:
    - z9-date-essay
  - text: 黒川郡が国史に記録されたのは、天平14年の陸奥の奏言に「黒川以北1郡」とあるのをもって最初とする、と大和町公式資料は『続日本紀』系統の記録を紹介している
    kind: fact
    level: E2
    status: established
    sources:
    - z9-taiwa-town-enkaku
  - text: 中心地区の吉岡は、近世には奥州街道（現在の国道4号）の宿場町として栄えた
    kind: fact
    level: E4
    status: established
    sources:
    - z9-date-essay
  - text: 落合地区の舞野の観音堂は、大同3年（808年）に坂上田村麻呂が勧請したものと伝えられている
    kind: legend
    level: E2
    status: established
    sources:
    - z9-taiwa-town-enkaku
  - text: 神奈川県大和市は「やまと」と読む別の自治体であり、大和町（たいわ）の1955年の命名経緯とは関係がない
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
    - z9-date-essay
  column:
    title: 「大」の字が並ぶ黒川郡
    text: 黒川郡には、大和町・大郷町・大衡村と、「大」の字で始まる町村が三つも隣り合っている。大和は1955年の合併で「大きく和する」願いを込めた新名、大衡は中世以来の地名、大郷は1954年の合併名と、同じ「大」でも生まれ方はまったく違う。地図の上で三つの「大」が並ぶ眺めは、命名の時代の違いをそのまま映している。
    sources:
    - z9-date-essay
    - z9-taiwa-town-enkaku
  relations:
  - pref/04
  - muni/04-大衡村
  - muni/04-大郷町
  - muni/14-大和市
  unknowns:
  - 「大和」の命名理由について、合併協議の一次記録（議事録等）での直接確認はできていない（郷土資料の「大同団結」説に拠る）
  - 命名に際して他の候補名があったかどうかは未確認
  updated: '2026-11-13'
- id: muni/04-大崎市
  code: '042153'
  names:
    ja: 大崎市
    reading: おおさきし
    aliases:
    - 古川市
  user_terms:
  - 大崎市か古川市かで揉めた話
  - 大崎耕土とは何か
  - 大崎という地名の由来
  naming_type: 合併新設
  prefecture: 宮城県
  homonyms: []
  summary: 平成18年（2006年）3月31日、古川市と松山町・三本木町・鹿島台町・岩出山町・鳴子町・田尻町の1市6町が合併して誕生した。市名は古くからの広域名「大崎」を採用したものだが、決定後に再選された古川市長が「古川市」への変更を求める異例の申し入れを行い、合併協議会が名称を変更しないと決めて、ようやく「大崎市」が実現した。
  first_attestation:
    era: 平成18年
    year_western: 2006
    document: 大崎市の新設（1市6町の合併・市制施行）
    note: 市名としての初出。「大崎」という広域名は中世の大崎氏の支配地に遡る
  claims:
  - text: 宮城県の合併記録によれば、平成18年（2006年）3月31日、古川市・松山町・三本木町・鹿島台町・岩出山町・鳴子町・田尻町の1市6町が新設合併して大崎市が誕生した
    kind: fact
    level: E2
    status: established
    sources:
    - m1-osaki-pref
  - text: 合併協議会は「大崎地方合併協議会」と称されており、「大崎」は合併前からこの地域を指す広域名として行政上も使われてきた、と県の合併記録は示す
    kind: fact
    level: E2
    status: established
    sources:
    - m1-osaki-pref
  - text: 市域に広がる肥沃な平野は「大崎耕土」と呼ばれ、その伝統的な水管理システムは平成29年（2017年）に世界農業遺産に認定された、と大崎市議会要覧は述べる
    kind: fact
    level: E2
    status: established
    sources:
    - m1-osaki-youran
  - text: 中世には江合川・鳴瀬川の一帯が「大崎」と呼ばれており、奥州管領・奥州探題を務めた斯波氏一族の大崎氏がこの地を支配したことが、「大崎」という地域名の定着の背景にある
    kind: fact
    level: E5
    status: established
    sources:
    - m1-osaki-wiki
  - text: 平成16年（2004年）11月2日、市長選で再選された古川市長が合併協議会に対し、合併期日の延期と、新市名を「大崎市」から「古川市」に変更することを申し入れた、と県の合併記録は述べる
    kind: fact
    level: E2
    status: established
    sources:
    - m1-osaki-pref
  - text: 同年12月19日の第28回協議会で、新市名は変更しないこと、合併期日を平成18年3月31日とすることが決定され、「大崎市」の名が維持された、と県の合併記録は述べる
    kind: fact
    level: E2
    status: established
    sources:
    - m1-osaki-pref
  - text: 地方公共団体コードは042153である（総務省「地方公共団体コード一覧」）
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 消えかけた「大崎市」
    text: 新市名「大崎市」は、一度決まったあとで最大の構成市・古川から覆されかけました。2004年の古川市長選で「大崎市」に反対する現職が再選されると、市長は協議会に「古川市への変更」を正式に申し入れます。合併そのものの延期まで求めたこの申し入れに、協議会は「名称は変更しない」と答え、合併期日だけを1年遅らせて折り合いました。広域の名か、中心市の名か。大崎の名前は、その綱引きの末に残った名前です。
    sources:
    - m1-osaki-pref
  relations:
  - pref/04
  unknowns:
  - 市名「大崎」の当初の決定手続き（公募の有無や候補案）は、県の合併記録の今回確認範囲では未確認
  - 「大崎」の語源そのもの（地形に由来する名か、荘園名か）についての専門的な検討は未確認
  updated: '2026-11-13'
- id: muni/04-大河原町
  code: '043214'
  names:
    ja: 大河原町
    reading: おおがわらまち
    aliases:
    - 大河原宿
  user_terms:
  - おおがわら
  - 一目千本桜の町
  - 仙南の中心地
  naming_type: 一部の地名
  prefecture: 宮城県
  homonyms: []
  summary: 宮城県柴田郡の町で、白石川の流域に広がる。町名の由来は素朴に思える「大きな川の原」ではなく、「多くの河が合流する（逢う）原」を意味する「逢河原」から「大河原」へ変化したものと町史の説が紹介されている。その地には大河原宿が置かれ、人の交流の場となった。1889年に4か村の合併で大河原町として発足した。
  first_attestation:
    era: 明治22年
    year_western: 1889
    document: 町村制施行による大河原町の発足（Wikipediaが紹介）
    note: 自治体名としての発足年。地名「大河原」自体は、それ以前の大河原宿の名に遡る
  claims:
  - text: 総務省の全国地方公共団体コードで、大河原町の団体コードは043214と定められている
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  - text: 町名の由来は「大きな川を有する原」ではなく、「多くの河が合流する（逢う）原」という意味であり、「逢河原」から「大河原」へと変化したものだと、Wikipediaは『大河原町史』を踏まえて紹介している
    kind: fact
    level: E5
    status: established
    sources:
    - z9-ogawara-wiki
  - text: 大河原の地には「大河原宿」が設置され、人や物の交流の場となって今日の大河原の基礎がつくられたとされる
    kind: fact
    level: E5
    status: established
    sources:
    - z9-ogawara-wiki
  - text: 1889年4月1日、大河原村・小山田村・大谷村・福田村の4か村が合併して大河原町が発足した
    kind: fact
    level: E5
    status: established
    sources:
    - z9-ogawara-wiki
  - text: 1956年9月30日に金ヶ瀬村と合併し、新制の大河原町が発足した
    kind: fact
    level: E5
    status: established
    sources:
    - z9-ogawara-wiki
  - text: 2000年代の柴田郡などの合併協議では新市名が「柴田市」に決まったが、大河原町民の間に合併協議への不信感が生まれ、協議会は廃止された
    kind: fact
    level: E5
    status: established
    sources:
    - z9-ogawara-wiki
  column:
    title: あと一歩で「柴田市」だった
    text: 平成の大合併の協議では、大河原町を含む枠組みで新市名が「柴田市」にまで決まっていた。ところが合併後の市役所仮庁舎が柴田町役場に決まったことなどから大河原町民の不信感が高まり、協議会は解散した。「柴田」という古い郡名は1956年に柴田町が先に名乗っていたこともあり、大河原にとって郡名は「自分たちの名」にはならなかったのである。
    sources:
    - z9-ogawara-wiki
  relations:
  - pref/04
  - muni/04-柴田町
  - muni/04-村田町
  unknowns:
  - 「逢河原」説の根拠となる『大河原町史』の記述を直接確認できていない（Wikipedia経由の紹介形にとどめる）
  - 「大河原」という地名の文献上の初出（中世文書等）は未確認
  updated: '2026-11-13'
- id: muni/04-大衡村
  code: '044245'
  names:
    ja: 大衡村
    reading: おおひらむら
    aliases: []
  user_terms:
  - おおひら
  - 宮城県唯一の村
  - 昭和万葉の森のある村
  - 王城寺原演習場の村
  naming_type: 一部の地名
  prefecture: 宮城県
  homonyms: []
  summary: 宮城県黒川郡の村で、県内で唯一の「村」。読みは「おおひら」。1889年に5村が合併した際、中央にあった大衡村の名を継いだ。「大衡」は中世以来の地名で、大衡館を居館とした大衡氏の名にも見える。語源については、平坦な大地が広がり「大平」と称したことに由来するという郷土資料の説があるが、確定していない。
  first_attestation:
    era: 戦国時代
    year_western: null
    document: 『古城書立之覚』（『日本歴史地名大系』が引く）
    note: 大衡館の館主・大衡治部大輔が天正年中まで居住したと伝える記事を専門辞典が紹介する。二次資料経由の紹介形
  claims:
  - text: 総務省の全国地方公共団体コードで、大衡村の団体コードは044245と定められている
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  - text: 大衡村は宮城県内で唯一の村である（県内の他の基礎自治体はすべて市または町）
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  - text: 1889年に5村が合併して誕生し、5村の中央にあった「大衡村」が村名の由来となった
    kind: fact
    level: E4
    status: established
    sources:
    - z9-ohira-jtb
  - text: 現在の大衡にあたる地には大衡館があり、その館主は天正年中（1573〜92年）まで黒川安芸守の臣・大衡治部大輔の居住であったと『古城書立之覚』に伝えられる、と『日本歴史地名大系』は紹介している
    kind: fact
    level: E3
    status: established
    sources:
    - z9-ohira-kotobank
  - text: 大衡氏は、「源家足利黒川系図」によると黒川景氏の子・宗氏を大衡治部大輔とする一族であると『日本歴史地名大系』は紹介している
    kind: fact
    level: E3
    status: established
    sources:
    - z9-ohira-kotobank
  - text: 村名の由来は、平坦な大地が広がり「大平（おおひら）」と称したことによると郷土資料が伝えるが、「大衡」の字がなぜ当てられたかは確定していない
    kind: fact
    level: E4
    status: contested
    sources:
    - z9-date-essay
  column:
    title: 県でたった一つの「村」と万葉
    text: 宮城県の基礎自治体の中で「村」を名乗るのは大衡村だけである。その村が力を入れてきたのが万葉のイメージで、村内には万葉集に詠まれた植物を集めた「昭和万葉の森」や「万葉クリエートパーク」が整備されている。「おおひら」という響きと、平らかな大地に万葉の歌の風景を重ねる村づくりが、この小さな村の個性になっている。
    sources:
    - z9-ohira-jtb
  relations:
  - pref/04
  - muni/04-大和町
  - muni/04-大郷町
  unknowns:
  - 「大衡」の語源・字義は専門辞典でも確定しておらず、「大平」説の典拠の直接確認もできていない
  - 1889年合併時の5村の構成と村名決定の経緯の詳細は未確認
  updated: '2026-11-13'
- id: muni/04-大郷町
  code: 044229
  names:
    ja: 大郷町
    reading: おおさとちょう
    aliases:
    - 大郷村
  user_terms:
  - おおさと
  - 道の駅おおさとの町
  - 支倉常長メモリアルパークのある町
  naming_type: 合併新設
  prefecture: 宮城県
  homonyms: []
  summary: 宮城県黒川郡の町。1954年に大谷村・粕川村・大松沢村が合併して大郷村として発足し、1959年に町制を施行して大郷町となった。町名の由来については、品井沼が大きく谷に入り込んでいたという「大谷郷」に由来すると郷土資料が伝える。町域にはかつて仙台藩最大の湖・品井沼が広がっていた。
  first_attestation:
    era: 昭和29年
    year_western: 1954
    document: 大郷村の発足（1954年7月1日の3村合併）
    note: 自治体名としての初出。もとになったとされる大谷郷の文献上の初出は未確認
  claims:
  - text: 総務省の全国地方公共団体コードで、大郷町の団体コードは044229と定められている
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  - text: 1954年7月1日、大谷村・粕川村・大松沢村が合併して大郷村が発足した
    kind: fact
    level: E5
    status: established
    sources:
    - z9-osato-wiki
  - text: 1959年4月1日に町制を施行し、大郷町となった
    kind: fact
    level: E5
    status: established
    sources:
    - z9-osato-wiki
  - text: 町名「大郷」の由来は、品井沼が大きく谷に入り込んでいたという大谷郷にあると郷土資料が伝える
    kind: fact
    level: E4
    status: contested
    sources:
    - z9-date-essay
  - text: 町域には仙台藩領内で最大の湖だった品井沼が広がっていたが、江戸時代からの干拓によって消滅した
    kind: fact
    level: E5
    status: established
    sources:
    - z9-osato-wiki
  - text: 町内には支倉常長メモリアルパークがあり、「おおさと常長公まつり」が開かれている
    kind: fact
    level: E5
    status: established
    sources:
    - z9-osato-wiki
  column:
    title: 消えた大湖・品井沼
    text: 大郷町の名の由来とされる大谷郷は、かつての大湖・品井沼と結びつけて語られる。品井沼は仙台藩領内で最大の湖で、松島町や旧鹿島台町にまで広がっていたが、江戸時代から続けられた干拓で姿を消し、跡地は吉田川沿いの美田になった。町の名の由来をたどると、水の風景が陸の風景に変わった土地の記憶に行き着く。
    sources:
    - z9-osato-wiki
    - z9-date-essay
  relations:
  - pref/04
  - muni/04-大和町
  - muni/04-大衡村
  unknowns:
  - 「大谷郷」という郷名の文献上の初出と、大郷村命名時の公式な理由づけは未確認（郷土資料の説に拠る）
  - 合併時の新村名の候補や選定過程は未確認
  updated: '2026-11-13'
- id: muni/04-女川町
  code: 045811
  names:
    ja: 女川町
    reading: おながわちょう
    aliases:
    - 女川村
    - 女川組
  user_terms:
  - おながわ
  - サンマの町
  - 女川原発のある町
  - シーパルピア女川の町
  naming_type: 一部の地名
  prefecture: 宮城県
  homonyms: []
  summary: 宮城県牡鹿郡の町で、牡鹿半島の付け根に位置し女川湾に面する。町名の由来として、平安時代に安倍貞任の一族の婦女子を安野平に避難させたことから、そこから流れる小川を「女川」と呼ぶようになったという伝承が町の公式記録に記されている。もとは20の浜の総称「女川組」だった地域が、1889年に女川村、1926年に女川町となった。現在は牡鹿郡で唯一の町である。
  first_attestation:
    era: 明治22年
    year_western: 1889
    document: 町村制施行による女川村の発足（女川町公式記録）
    note: 町全域を「女川」と称した最初。それ以前は20の浜の総称「女川組」として江戸時代を通じて呼ばれていた
  claims:
  - text: 総務省の全国地方公共団体コードで、女川町の団体コードは045811と定められている
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  - text: 町全域が「女川」と称されるようになったのは1889年の町村制施行で女川村となってからであり、それ以前は20の浜が「女川組」と総称されていた
    kind: fact
    level: E2
    status: established
    sources:
    - z9-onagawa-kirokushi
  - text: 現在の女川町は、1926年4月1日の町制施行により誕生した
    kind: fact
    level: E2
    status: established
    sources:
    - z9-onagawa-kirokushi
  - text: 平安中期、町の西方背後にある黒森山の奥地・安野平に、奥州を支配していた安倍貞任の一族の婦女子を源氏方の軍との戦いに際して避難させたことから、ここから流れる小川を「女川」と呼ぶようになり、のちに地名になったと伝えられている
    kind: legend
    level: E2
    status: established
    sources:
    - z9-onagawa-kirokushi
  - text: 2005年に牡鹿町が石巻市へ合併したことにより、女川町は牡鹿郡で唯一の町となった
    kind: fact
    level: E2
    status: established
    sources:
    - z9-onagawa-kirokushi
  - text: 女川港はサンマなどの水揚げで知られる漁港であり、町内には女川原子力発電所が立地する
    kind: fact
    level: E5
    status: established
    sources:
    - z9-onagawa-wiki
  column:
    title: 伝説の舞台は今も地名に残る
    text: 「女川」の名の由来とされる安倍貞任の婦女子の避難先「安野平」は、町の公式記録が伝える伝説の舞台である。女川という名はもともと一つの川の名だったのが、やがて20の浜の総称「女川組」となり、村の名、町の名へと広がっていった。サンマと原発で知られる現代の町の名の奥には、前九年合戦の時代にまで遡る物語が横たわっている。
    sources:
    - z9-onagawa-kirokushi
  relations:
  - pref/04
  unknowns:
  - 安倍貞任の一族避難の伝承以外に、「女川」の語源を説明する専門辞典（角川日本地名大辞典等）の見解は未確認
  - 川の名としての「女川」の文献上の初出は未確認
  updated: '2026-11-13'
- id: muni/04-富谷市
  code: '042161'
  names:
    ja: 富谷市
    reading: とみやし
    aliases:
    - 富谷町
    - 富谷村
    - 富谷新町
    - 十宮
  user_terms:
  - とみや
  - 富谷宿のある市
  - 仙台のベッドタウン
  - ブルーベリーのまち
  naming_type: 一部の地名
  prefecture: 宮城県
  homonyms: []
  summary: 宮城県中部、仙台市の北隣にある市。1889年（明治22年）に旧富谷村を中心に周辺の村々が合併して黒川郡富谷村が発足し、1963年（昭和38年）の町制を経て、2016年（平成28年）10月10日に合併を経ない単独市制で富谷市となった。「富谷」の名は、江戸時代に奥州街道の宿場「富谷宿」が置かれた旧富谷村の村名に由来する。村名自体は、かつて十の宮があったことから「十宮（とみや）」と書いたものを「富谷」に書き改えたと『安永風土記』が伝える。
  first_attestation:
    era: 江戸時代
    year_western: null
    document: 安永風土記
    note: 仙台藩の地誌『安永風土記』が、村名の由来として「熊谷に宮十社があったので『とみや』と称し、十宮と書いたがのちに富谷と書き改めた」と伝えるのが、今回確認できた由来の最古級の記録。「富谷」表記そのものの初出年は未確認
  claims:
  - text: 富谷市の地方公共団体コードは042161である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  - text: 1889年（明治22年）4月1日、町村制の施行により旧富谷村を含む周辺の村々の区域をもって黒川郡富谷村が発足した
    kind: fact
    level: E4
    status: established
    sources:
    - t5-tomiya-jtb
  - text: 富谷村は1963年（昭和38年）に町制を施行して富谷町となり、2016年（平成28年）10月10日に単独で市制を施行して富谷市となった。1889年の発足以来、一度も合併を経ていない
    kind: fact
    level: E2
    status: established
    sources:
    - t5-tomiya-pref
    - t5-tomiya-jtb
  - text: 『日本歴史地名大系』は『安永風土記』の記述として、村名はかつて村内の熊谷に宮十社があったので「とみや」と称して「十宮」と書いたが、のちに「富谷」と書き改めたと紹介する
    kind: fact
    level: E3
    status: established
    sources:
    - t5-tomiya-kotobank
  - text: 富谷村は慶長年間（1596〜1615年）から寛永11年（1634年）まで伊達宗清（政宗の三男）の知行地であった
    kind: fact
    level: E3
    status: established
    sources:
    - t5-tomiya-kotobank
  - text: 元和4年（1618年）、吉岡黒川氏の家老だった内ヶ崎筑後（のち織部）が伊達政宗から宿場の開設を命じられ、元和6年（1620年）に政宗の黒印状をもって富谷宿が正式に発足した
    kind: fact
    level: E4
    status: established
    sources:
    - t5-tomiya-shinmachi
  - text: 富谷宿は仙台以北の奥州街道の宿場で、七北田宿と吉岡宿の中間に新たに置かれた宿場であったため「富谷新町」とも呼ばれ、富谷茶の産地として奥道中歌にも詠まれた
    kind: fact
    level: E4
    status: established
    sources:
    - t5-tomiya-jtb
    - t5-tomiya-shinmachi
  - text: 伊達政宗が鷹狩りの際に愛鷹が死んだため、甕（かめ）に入れて丁重に埋葬したという言い伝えが残り、市内にはその「甕杉」が存在すると伝えられる
    kind: legend
    level: E5
    status: established
    sources:
    - t5-tomiya-wiki
  column:
    title: 合併しないで市になったまち
    text: 富谷は1889年（明治22年）の町村制以来、一度も合併を経験していない。昭和の合併促進期には県から黒川郡10か町村の合併案が示されたが、富谷村はこれを断念し「自立自存」を決議した。平成の大合併でも仙台市との合併などが議論されたが、人口5万人到達の見通しが立つと「合併しない宣言」を出し、2016年（平成28年）10月10日、町単独の市制施行にこぎつけた。一方で地名の古層は江戸初期に遡る。元和4年（1618年）に政宗の命で開かれた富谷宿は2020年に開宿400年を迎え、「富谷茶」の復活栽培も始まっている。村名の由来とされる「十宮→富谷」の書き改めは、縁起のよい字への改字という日本地名に多いパターンの一例である。
    sources:
    - t5-tomiya-pref
    - t5-tomiya-jtb
    - t5-tomiya-shinmachi
  relations:
  - pref/04
  unknowns:
  - 「富谷（十宮）」という地名の初出の文献と年は、今回の調査では特定できなかった（『安永風土記』の由来説明が確認できた最古級の記録）
  - 宮十社（十の宮）が実在した神社群かどうかは、『安永風土記』の伝承の域を出ず、考古学・文献上の裏付けは確認できなかった
  updated: '2026-11-13'
- id: muni/04-山元町
  code: '043621'
  names:
    ja: 山元町
    reading: やまもとちょう
    aliases: []
  user_terms:
  - やまもと
  - 東北の湘南
  - 山下・坂元の町
  naming_type: 合併新設
  prefecture: 宮城県
  homonyms: []
  summary: 宮城県亘理郡の町で、県の最東南端、太平洋に面する。1955年に山下村と坂元村が合併して発足した合成地名で、両村の名から成る。旧坂元村の「坂元」は『和名類聚抄』に見える坂本郷に遡り、江戸時代初めの村割りの際に「坂本」から表記を改めたものと伝えられる。旧山下村は1889年に7か村の合併で発足した。
  first_attestation:
    era: 承平年間
    year_western: 934
    document: 『和名類聚抄』の曰理（亘理）郡・坂本郷
    note: 町域（旧坂元村）の史料上の初出としてWikipediaが紹介する。「山元」の名自体は1955年の合併で生まれた
  claims:
  - text: 総務省の全国地方公共団体コードで、山元町の団体コードは043621と定められている
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  - text: 1955年2月1日、町村合併促進法に基づき山下村と坂元村が合併して「山元町」となった
    kind: fact
    level: E2
    status: established
    sources:
    - z9-yamamoto-town-gaiyo
    - z9-yamamoto-timr
  - text: 町名「山元」は、合併した山下村と坂元村の名を合わせた合成地名である
    kind: fact
    level: E5
    status: established
    sources:
    - z9-yamamoto-gousei
    - z9-yamamoto-town-gaiyo
  - text: 山下村は1889年4月1日に、八手庭村・大平村・小平村・鷲足村・山寺村・浅生原村・高瀬村の7か村が合併して発足した
    kind: fact
    level: E2
    status: established
    sources:
    - z9-yamamoto-town-gaiyo
  - text: 坂元は『和名類聚抄』に見える曰理郡の坂本郷に遡り、正保元年（1644年）の村割で坂本郷が坂元本郷と真庭村に分かれた際、「坂本本郷」では本の字が重なって紛らわしいため「坂本」から「坂元」へ表記を改めたと『山元町誌』に基づき紹介されている
    kind: fact
    level: E5
    status: established
    sources:
    - z9-sakamoto-wiki
  - text: 『和名類聚抄』には曰理（亘理）郡の四郷として坂本・菱沼・亘理・望多が挙げられており、これが山元町域が史料上に現れた最初であるとされる
    kind: fact
    level: E5
    status: established
    sources:
    - z9-yamamoto-wiki
  column:
    title: 「本」が重なるので字を変えた
    text: 山元町を構成する旧坂元村の名は、もとは坂本だった。1644年の村割りで「坂本本郷」と名乗ると「本」の字が重なって紛らわしい、という実務的な理由で「坂元」に改めたと町誌は伝える。さらにその坂本は、10世紀の『和名類聚抄』に郷名として載る古い名である。1955年の合成地名「山元」の後ろ半分には、千年を超える地名の履歴が折りたたまれている。
    sources:
    - z9-sakamoto-wiki
  relations:
  - pref/04
  unknowns:
  - 「山下村」の名の由来（1889年の7か村合併時の命名理由）は未確認
  - 合成地名「山元」の決定過程（合併協議での候補や選定理由）の一次記録は未確認
  updated: '2026-11-13'
- id: muni/04-岩沼市
  code: '042111'
  names:
    ja: 岩沼市
    reading: いわぬまし
    aliases:
    - 岩沼町
    - 岩沼郷
    - 武隈
  user_terms:
  - いわぬま
  - 竹駒神社の門前町
  - 仙台空港に近い市
  - 武隈の松のまち
  naming_type: 一部の地名
  prefecture: 宮城県
  homonyms: []
  summary: 宮城県南部、阿武隈川下流の北岸にある市。古くは歌枕に詠まれた「武隈（たけくま）」の地で、近世の岩沼郷もかつて武隈と呼ばれた。「岩沼」の呼称が現れるのは天正（1573〜92年）の末年になってからで、鵜ヶ崎城（岩沼城）の城下町、奥州街道の宿場町、日本三稲荷の一つとされる竹駒神社の門前町としてこの地方の中心地となった。1955年（昭和30年）に岩沼町・玉浦村・千貫村が合併して岩沼町となり、1971年（昭和46年）に市制を施行した。
  first_attestation:
    era: 天正年間
    year_western: null
    document: null
    note: 『日本歴史地名大系』が「岩沼の呼称は天正（1573〜92年）末年になってあらわれる」と述べるのが、今回確認できた最古級の言及。初出の具体的な文書は未確認。古称「武隈」は『後撰集』などに詠まれた「武隈の松」の比定地として平安時代の和歌に遡る
  claims:
  - text: 岩沼市の地方公共団体コードは042111である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  - text: 1955年（昭和30年）4月1日、岩沼町・玉浦村・千貫村の3町村が合併して岩沼町が発足し、1971年（昭和46年）に市制を施行して岩沼市となった
    kind: fact
    level: E2
    status: established
    sources:
    - t5-iwanuma-gikai
    - t5-iwanuma-kotobank-city
  - text: 『日本歴史地名大系』は、近世の岩沼郷はかつて「武隈（たけくま）」といったとし、「岩沼」の呼称は天正（1573〜92年）の末年になって現れると述べる
    kind: fact
    level: E3
    status: established
    sources:
    - t5-iwanuma-kotobank-city
  - text: 岩沼は『後撰集』などに詠まれた歌枕「武隈の松」の比定地とされ、当地に陸奥国府があったという説もあるが真偽は不明である
    kind: fact
    level: E3
    status: indeterminate
    sources:
    - t5-iwanuma-kotobank-go
  - text: 岩沼の地名の由来について、岩沼市議会の紹介は、鵜ヶ崎城下の池を岩沼と呼んだことから出たともいわれると伝える
    kind: fact
    level: E2
    status: indeterminate
    sources:
    - t5-iwanuma-gikai
  - text: 岩沼は鵜ヶ崎城（岩沼城）の城下町、奥州街道の宿場町、竹駒神社の門前町として栄え、この地方の中心地であった
    kind: fact
    level: E3
    status: established
    sources:
    - t5-iwanuma-kotobank-go
  - text: 竹駒神社は承和9年（842年）、陸奥守として赴任した小野篁が伏見稲荷を勧請したのが始まりと伝えられ、「竹駒」の名は当地の古称「武隈」の転訛とされる
    kind: fact
    level: E4
    status: established
    sources:
    - t5-iwanuma-jtb-takekoma
  - text: 小野篁が多賀城へ赴任する途中、南長谷の橋で箱の中の白狐が八回鳴いて森へ消えたため、その森に社を建てて「武隈明神」と名付けたという伝説が、市の公式解説でも伝説として紹介されている
    kind: legend
    level: E2
    status: established
    sources:
    - t5-iwanuma-city-hajimari
  column:
    title: 歌枕「武隈の松」と芭蕉
    text: 岩沼の古称「武隈」は、平安時代の歌集に詠まれた「武隈の松」で知られる歌枕の地。一本の根元から二股に分かれる松は「二木（ふたき）の松」とも呼ばれ、西行や松尾芭蕉も訪れた。芭蕉は『おくのほそ道』の旅で岩沼を通り、竹駒神社の二ノ鳥居近くには「桜より松は二木を三月越し」と詠んだ句碑が残る。市の名前としては武隈は近世初めに「岩沼」へ交替したが、神社の名「竹駒」は武隈の音の転訛として今に古称を伝えている。
    sources:
    - t5-iwanuma-kotobank-go
    - t5-iwanuma-jtb-takekoma
  relations:
  - pref/04
  unknowns:
  - 「岩沼」という呼称の初出の具体的な文書・年は、今回の調査では特定できなかった（『日本歴史地名大系』の「天正末年に現れる」が確認できた範囲）
  - 岩沼に陸奥国府があったとする説の真偽は、『日本歴史地名大系』も「不明」とし、確認できなかった
  - 城下の池に由来するという地名説の典拠（いつの記録に基づくか）は確認できなかった
  updated: '2026-11-13'
- id: muni/04-川崎町
  code: 043249
  names:
    ja: 川崎町
    reading: かわさきまち
    aliases:
    - 川崎村
    - 川崎宿
  user_terms:
  - 川崎町の名前の由来
  - 宮城の川崎町はなぜ川崎
  - 笹谷街道の宿場町
  naming_type: その他
  prefecture: 宮城県
  homonyms:
  - muni/40-川崎町
  summary: 1889年の町村制施行で前川村・今宿村・小野村・川内村・本砂金村の5村が合併して生まれた新村名「川崎村」が前身。構成村のいずれも「川崎」ではなかった一方、前川村内には笹谷街道の中心宿駅「川崎宿」が先行して存在した。村名がこの宿場名に由来するかを含め、「川崎」の命名理由は確認した資料では明示されない。1948年に町制を施行して川崎町となった。
  first_attestation:
    era: 近世
    year_western: null
    document: 川崎宿（前川村内、笹谷街道の中心宿駅）として『日本歴史地名大系』に立項される地名
    note: 宿名の初出年と命名理由は未確認。自治体名としては1889年の川崎村が初出
  claims:
  - text: 明治22年（1889年）の町村制施行に際し、柴田郡の前川村・今宿村・小野村・川内村・本砂金村の5村が新設合併して川崎村となった。構成した5村のいずれも「川崎」という名ではなかった
    kind: fact
    level: E4
    status: established
    sources:
    - h3-kawasaki-m-uub
  - text: 『日本歴史地名大系』は、前川村に笹谷街道の中心宿駅である川崎宿があり、街道が仙台城下方面への道と奥州街道方面への道とに分岐する要地だったと紹介する
    kind: fact
    level: E3
    status: established
    sources:
    - h3-kawasaki-m-juku
  - text: 新村名「川崎」が先行する宿場名「川崎宿」に由来するかどうかは、確認した資料に明記がなく確定できない
    kind: fact
    level: E3
    status: indeterminate
    sources:
    - h3-kawasaki-m-juku
    - h3-kawasaki-m-uub
  - text: 昭和23年（1948年）5月3日に川崎村が町制を施行して川崎町となった。町の計画によれば、江戸時代に形成された前川村・今宿村・小野村・川内村・本砂金村・支倉村の6村が、明治22年の町村制施行と昭和30年（1955年）の合併を経て現在の町域となった
    kind: fact
    level: E2
    status: established
    sources:
    - h3-kawasaki-m-school
    - h3-kawasaki-m-townplan
  - text: 『日本歴史地名大系』は、町域は蔵王連峰北部の東麓にあたり、太郎川・北川・前川の三川が東流して東端で碁石川となり、仙台市域で名取川に合流すると記す
    kind: fact
    level: E3
    status: established
    sources:
    - h3-kawasaki-kotobank
  - text: 福岡県川崎町とは「川崎村」を前身とする点は共通する。ただし福岡では東川崎村・西川崎村という村名が先行したのに対し、宮城では構成村に「川崎」がなく宿場名が先行する点が異なる。両町とも「川崎」の語源そのものは未確認で、共通の命名理由は立証できない
    kind: fact
    level: E3
    status: established
    sources:
    - h3-kawasaki-f-hitahiko
    - h3-kawasaki-m-uub
    - h3-kawasaki-m-juku
  - text: 総務省「地方公共団体コード一覧」では本町のコードは043249とされる
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 村の名前にない「川崎」
    text: 1889年に合併した5つの村の名は、前川・今宿・小野・川内・本砂金。新村名の「川崎」はそのどれでもありませんでした。一方、地域の中心だったのは笹谷街道の宿場「川崎宿」（現在の前川地区）です。宿場の名が村名に選ばれた可能性は高いものの、理由を記した資料は見つかっておらず、この町の名前の謎として残ります。
    sources:
    - h3-kawasaki-m-juku
    - h3-kawasaki-m-uub
  relations:
  - pref/04
  - muni/40-川崎町
  unknowns:
  - 「川崎」という地名の語源（どの川の、どのような地形を指すのか）
  - 川崎宿の成立年と初出文書
  - 1889年に新村名として「川崎」を選んだ理由の記録
  updated: '2026-11-13'
- id: muni/04-村田町
  code: '043222'
  names:
    ja: 村田町
    reading: むらたまち
    aliases:
    - 村田村
    - 村田郷
  user_terms:
  - むらた
  - 蔵の町
  - みちのく宮城の小京都
  naming_type: 一部の地名
  prefecture: 宮城県
  homonyms: []
  summary: 宮城県柴田郡の町。もとは村田館の城下に発達した町場で、江戸時代の資料に「村田郷」と見える古い地名である。江戸時代後期には村田商人が紅花交易で繁栄し、その土蔵の町並みが「蔵の町」として残る。1889年に村田村、1895年に村田町となった。「村田」の語源そのものは、確認した資料では確定した説明がない。
  first_attestation:
    era: 安永7年
    year_western: 1778
    document: 『柴田郡村田郷風土記御用書出』
    note: 村田郷としてのまとまった記録（村田町教育委員会の保存計画が引く）。村田館は鎌倉後期から南北朝時代頃の築造と推測され、地名は中世に遡る可能性がある
  claims:
  - text: 総務省の全国地方公共団体コードで、村田町の団体コードは043222と定められている
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  - text: 村田の町場は村田館の東に見下ろす位置に発達し、安永7年（1778年）の『柴田郡村田郷風土記御用書出』には、荒町・本町・南町の三町を合わせた宿場「村田町」の姿が記されている
    kind: fact
    level: E2
    status: established
    sources:
    - z9-murata-hozon
  - text: 村田館は、鎌倉後期から南北朝時代頃の陶器片が出土していることから、この頃に築かれたものと推測されている
    kind: fact
    level: E2
    status: established
    sources:
    - z9-murata-hozon
  - text: 1889年に村田郷は近隣の3つの村と合併して「村田村」となり、1895年には「村田町」となった
    kind: fact
    level: E2
    status: established
    sources:
    - z9-murata-hozon
  - text: 江戸時代後期、村田の商人は京都・大阪・江戸との紅花交易で繁栄し、帰り荷に上方の物資を仕入れる「鋸商い」を行って、上方と仙南地方を結ぶ中継商業地となった
    kind: fact
    level: E2
    status: established
    sources:
    - z9-murata-hozon
  - text: 村田商人の土蔵が続く蔵の町並みは、2014年に宮城県で初めて国の重要伝統的建造物群保存地区に選定され、「みちのく宮城の小京都」として親しまれている
    kind: fact
    level: E2
    status: established
    sources:
    - z9-miyagi-sennan
  - text: 「村田」という地名の語源については、今回確認した町の公的資料・保存計画では説明が示されておらず、未詳である
    kind: fact
    level: E2
    status: unknown
    sources:
    - z9-murata-hozon
  column:
    title: 紅花を運んだ蔵の町
    text: 村田の町並みを形づくったのは紅花だった。村田商人は最上・置賜方面の紅花を集めて上方へ送り、帰り荷には京・大坂の物資を満載して戻る「鋸商い」で財を成した。その富が、漆喰の土蔵と豪勢な門構えを持つ商家の町並みを残した。村田という短い地名の背後には、仙台と山形、上方を結んだ交易路の結節点としての歴史がある。
    sources:
    - z9-murata-hozon
    - z9-miyagi-sennan
  relations:
  - pref/04
  - muni/04-柴田町
  - muni/04-大河原町
  unknowns:
  - 「村田」の語源（専門辞典『角川日本地名大辞典』『日本歴史地名大系』の村田郷の項を含む）は未確認
  - 村田郷の文献上の初出（中世文書）は未確認
  updated: '2026-11-13'
- id: muni/04-東松島市
  code: '042145'
  names:
    ja: 東松島市
    reading: ひがしまつしまし
    aliases:
    - 矢本町
    - 鳴瀬町
  user_terms:
  - ひがしまつしま
  - ブルーインパルスの基地の市（松島基地）
  - 奥松島のある市
  - 矢本・鳴瀬の合併市
  naming_type: 合併新設
  prefecture: 宮城県
  homonyms: []
  summary: 宮城県東部、松島湾の東側に位置する市。2005年（平成17年）4月1日に桃生郡の矢本町と鳴瀬町が新設合併して発足した。市名「東松島」は合併協議会が全国公募をもとに選んだ新市名で、日本三景・松島の東に位置する地域であることを示す名と解される。もともと市域には松島町は含まれず、「松島」を名乗るのは湾の景観を共有する地域としてである。市役所は旧矢本町役場に置かれ、中心地の矢本は中世以来の地名である。
  first_attestation:
    era: 平成16年
    year_western: 2004
    document: 矢本町・鳴瀬町合併協議会（第9回協議会）の決定
    note: 「東松島市」の市名そのものの決定（2004年1月16日）であり命名の初出。基層の中心地名「矢本」は、『安永風土記』が由来を伝える古い地名
  claims:
  - text: 東松島市の地方公共団体コードは042145である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  - text: 2005年（平成17年）4月1日、桃生郡矢本町と鳴瀬町を廃し、その区域をもって東松島市が新設合併により発足し、事務所は旧矢本町役場の位置に置かれた
    kind: fact
    level: E2
    status: established
    sources:
    - t5-higashimatsushima-pref
  - text: 新市の名称は、平成16年（2004年）1月16日に開かれた矢本町・鳴瀬町合併協議会の第9回協議会において「東松島市」に決定した
    kind: fact
    level: E2
    status: established
    sources:
    - t5-higashimatsushima-pref
  - text: 新市名は全国に公募され、5,019件・2,004種類の名称が寄せられたうえで、候補選定小委員会において8つの候補に絞られた
    kind: fact
    level: E2
    status: established
    sources:
    - t5-higashimatsushima-toshi
  - text: 新市名の最終候補は「あおい」「青空」「奥松島」「滝山」「東松島」「松海（まつみ）」「未来」「桃生（ものう）」の8点であったと変遷情報データベースが記録する
    kind: fact
    level: E5
    status: established
    sources:
    - t5-higashimatsushima-uub
  - text: 旧矢本町と旧鳴瀬町はいずれも1955年（昭和30年）5月3日に成立した町で、矢本町は旧矢本町・赤井村・大塩村、鳴瀬町は野蒜村・小野村・宮戸村の合併による
    kind: fact
    level: E5
    status: established
    sources:
    - t5-higashimatsushima-uub
  - text: 中心地の「矢本」は、もとは矢本村で、1889年（明治22年）に大曲村・小松村と合併して鷹来村の大字となり、1940年（昭和15年）に鷹来村が町制を施行して矢本町となったことで町名として復活した
    kind: fact
    level: E5
    status: established
    sources:
    - t5-yamoto-wiki
  - text: 『安永風土記』によれば「矢本」の由来は、平泉で戦死した源義経が蓄養していた八羽の鷹が矢本の丘陵地に飛来して住み着いたため「八居」と名付けられ、それが時代とともに谷本、矢本と変化したことによるとされる
    kind: legend
    level: E5
    status: established
    sources:
    - t5-yamoto-wiki
  column:
    title: 落ちた候補名が町名になった「あおい」
    text: 東松島市の市名公募には2,004種類もの案が集まり、最終候補には「青空」「未来」といった情緒的な名や、旧郡名の「桃生（ものう）」、野蒜・宮戸の景観にちなむ「奥松島」などが残った。選ばれたのは地理を素直に示す「東松島」だったが、落選した候補の筆頭格「あおい」も消え去りはしなかった。2016年（平成28年）、市内の区画整理事業で新しい町名が必要になった際、その名は大字「あおい」として採用された。市名にはならなかった案が、10年余を経て地名として地図に載った珍しい例である。
    sources:
    - t5-higashimatsushima-uub
    - t5-yamoto-wiki
  relations:
  - pref/04
  unknowns:
  - 「東松島」が最終候補の中から選ばれた公式の選定理由文（「松島の東に位置する」等の説明）は、県・協議会の公表資料では確認できなかった
  - 中心地名「矢本」の中世以前の文献上の初出は、今回の調査では特定できなかった（『安永風土記』の由来説明が確認できた最古級の記録）
  - 旧鳴瀬町の名の由来である鳴瀬川の語源は、今回の調査範囲では確認できなかった
  updated: '2026-11-13'
- id: muni/04-松島町
  code: '044016'
  names:
    ja: 松島町
    reading: まつしままち
    aliases:
    - 松島村
  user_terms:
  - まつしま
  - 日本三景
  - 松島海岸
  - 松島の月
  naming_type: 一部の地名
  prefecture: 宮城県
  homonyms: []
  summary: 宮城県宮城郡の町で、日本三景の一つに数えられる景勝地・松島をそのまま町名とする。「松島」は、松におおわれた260余りの島々が浮かぶ湾そのものの名で、平安時代から歌枕の地として知られ、霊場としても栄えた。1889年に10か村の区域で松島村が発足し、1928年に町制を施行して松島町となった。
  first_attestation:
    era: 平安時代
    year_western: null
    document: 歌枕としての松島
    note: 松島は古来より歌枕の地として有名だったと瑞巌寺公式が述べ、平安時代から歌枕として知られたとする解説もある。具体的な最古の和歌・文献の特定は未確認
  claims:
  - text: 総務省の全国地方公共団体コードで、松島町の団体コードは044016と定められている
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  - text: 松島湾には260余りの島々があり、松島は平安時代から歌枕の地として知られていた
    kind: fact
    level: E4
    status: established
    sources:
    - z9-matsushima-jcca
  - text: 松島は景観の素晴らしさと月の美しさから、古来より歌枕の地として有名であったと、国宝・瑞巌寺の公式サイトは述べている
    kind: fact
    level: E2
    status: established
    sources:
    - z9-matsushima-zuiganji
  - text: 瑞巌寺の前身は、9世紀初頭に慈覚大師円仁によって開創された天台宗延福寺であると伝わっている
    kind: legend
    level: E2
    status: established
    sources:
    - z9-matsushima-zuiganji
  - text: 「瑞巌寺」という呼称の初出は、慶長13年（1608年）に鋳造された大鐘の銘文「山を号して松島と曰い、寺を名づけて瑞岩（巌）と曰う」であり、翌1609年に伊達政宗による復興工事が完了した
    kind: fact
    level: E2
    status: established
    sources:
    - z9-matsushima-zuiganji
  - text: 松尾芭蕉は1689年（元禄2年）に塩釜から船を借りて松島に到達し、その絶景を『おくのほそ道』に記した
    kind: fact
    level: E4
    status: established
    sources:
    - z9-matsushima-jcca
  - text: 1889年4月1日の町村制施行により、松島村・高城本郷・桜渡戸村・磯崎村・初原村・根廻村・手樽村・幡谷村・竹谷村・北小泉村の区域をもって松島村が発足し、1928年1月1日に町制を施行して松島町となった
    kind: fact
    level: E5
    status: established
    sources:
    - z9-matsushima-wiki
  column:
    title: 芭蕉の句ではない「松島や ああ松島や」
    text: 「松島や ああ松島や 松島や」は松尾芭蕉の作として広く知られるが、芭蕉の『おくのほそ道』にも曾良の旅日記にもこの句はない。実際の作者は江戸時代後期の狂歌師・田原坊で、1820年頃の案内書『松島図誌』に載った「松島や さて松島や 松島や」が原形とされる。芭蕉が松島で句を詠めなかったという話と結びついて、作者がすり替わってしまったのである。雄島にはこの句の碑まであるが、それも後世の誤伝の産物である。
    sources:
    - z9-matsushima-basho-wiki
  relations:
  - pref/04
  unknowns:
  - 「松島」の名の文献上の初出（具体的な和歌集・記録の特定）は未確認
  - 専門辞典（日本歴史地名大系等）による「松島」の語源説明は未確認（島々の景観そのものに由来する記述的地名とみられるが、典拠の確認を要する）
  updated: '2026-11-13'
- id: muni/04-柴田町
  code: '043231'
  names:
    ja: 柴田町
    reading: しばたまち
    aliases: []
  user_terms:
  - しばた
  - 船岡の一目千本桜
  - 船岡城の町
  naming_type: 合併新設
  prefecture: 宮城県
  homonyms: []
  summary: 宮城県柴田郡の町。1956年に船岡町と槻木町が合併して誕生した町名で、合併促進協議会が、所属する郡の名であり『延喜式』『和名抄』などの古書に見える陸奥国の古い郡名「柴田」を新町名に選んだ。「柴田郡」の史料初見は『続日本紀』養老5年（721年）の記事とされ、和名抄では「之波多（しはた）」と訓まれた。語源そのものは確定していない。
  first_attestation:
    era: 養老5年
    year_western: 721
    document: 『続日本紀』（『日本歴史地名大系』が紹介）
    note: 柴田郡のうち二郷を分けて刈田郡を置いた記事が「柴田郡」の史料初見と専門辞典が紹介する。二次資料経由の紹介形
  claims:
  - text: 総務省の全国地方公共団体コードで、柴田町の団体コードは043231と定められている
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  - text: 1956年4月1日、船岡町と槻木町が合併して柴田町が誕生した
    kind: fact
    level: E2
    status: established
    sources:
    - z9-shibata-town-history
  - text: 新町名を「柴田町」とした理由について、合併促進協議会は、「柴田」が『延喜式』『和名抄』などの古書に見える地名で陸奥国の古くからの郡名であること、歴史的・地理的・社会的にこれ以上適切な名称はないこと、住民の自然な要望であることを挙げた、と柴田町公式は伝えている
    kind: fact
    level: E2
    status: established
    sources:
    - z9-shibata-town-history
  - text: 『続日本紀』養老5年（721年）10月14日条に、柴田郡のうち二郷を分けて刈田郡を置いたと見えるのが「柴田郡」の史料初見であり、郡の設置はさらに遡ると思われる、と『日本歴史地名大系』は紹介している
    kind: fact
    level: E3
    status: established
    sources:
    - z9-shibata-kotobank
  - text: 『和名類聚抄』東急本郡部は柴田を「之波太（しはた）」と訓み、『拾芥抄』も「シハタ」とする一方、『吾妻鏡』では「芝田郡」とも書かれた
    kind: fact
    level: E3
    status: established
    sources:
    - z9-shibata-kotobank
  - text: 「柴田」の語源は確定しておらず、かつて「しはた」と訓まれ「芝田」とも書かれたという表記・読みの履歴が残るのみである
    kind: fact
    level: E3
    status: indeterminate
    sources:
    - z9-shibata-kotobank
  column:
    title: 協議会長の名も「柴田」だった
    text: 1956年の合併で新町名「柴田町」を決めた合併促進協議会の会長は、柴田倫之助という人だった。郡名としての柴田は奈良時代の文献にまで遡る由緒ある名であり、協議会は「これ以上適切な名称はない」と太鼓判を押した。会長の姓と決まった町名が偶然同じ文字だったことは、古い郡名がそのまま自治体名として蘇った場面に、小さな偶然の彩りを添えている。
    sources:
    - z9-shibata-town-history
  relations:
  - pref/04
  - muni/04-大河原町
  - muni/04-村田町
  - muni/04-川崎町
  unknowns:
  - 「柴田」の語源（「芝田」との関係を含む）について、専門資料で確定した説明は未確認
  - 『延喜式』における柴田郡・柴田神社の記載内容の直接確認は未了（町公式の言及に拠る）
  updated: '2026-11-13'
- id: muni/04-栗原市
  code: '042137'
  names:
    ja: 栗原市
    reading: くりはらし
    aliases:
    - 栗原郡
  user_terms:
  - 栗原市は郡の名前をそのまま使ったのか
  - 栗原郡はどうなったのか
  - 栗原の名前の由来
  naming_type: 合併新設
  prefecture: 宮城県
  homonyms: []
  summary: 平成17年（2005年）4月1日、栗原郡の10町村すべてが合併して誕生した、郡全域がそのまま市になった例である。市名「栗原」は、公募で集めた案から小委員会が5候補に絞り、合併協議会委員の投票で決定された。選定理由には、郡の合併であること、住民が長く慣れ親しんだ名であること、歴史的に古くからある名であることが挙げられた。
  first_attestation:
    era: 平成17年
    year_western: 2005
    document: 栗原市の新設（10町村の合併・市制施行）
    note: 市名としての初出。「栗原」の名自体は古代以来の郡名に遡るが、その語源は未確認
  claims:
  - text: 政府統計の廃置分合情報によれば、平成17年（2005年）4月1日、築館町・若柳町・栗駒町・高清水町・一迫町・瀬峰町・鶯沢町・金成町・志波姫町・花山村の10町村が合併して栗原市が新設され、栗原郡は廃止された
    kind: fact
    level: E2
    status: established
    sources:
    - m1-kurihara-estat
  - text: 構成10町村はすべて栗原郡に属し、市を一つも含まない郡全域の合併であった
    kind: fact
    level: E2
    status: established
    sources:
    - m1-kurihara-estat
    - m1-kurihara-toshi
  - text: 日本都市センターの調査報告によれば、新市の名称は、合併協議会に小委員会を設置して名称案を公募し、応募された中から5候補を小委員会で選定したうえで、合併協議会委員による投票を実施して決定された
    kind: fact
    level: E3
    status: established
    sources:
    - m1-kurihara-toshi
  - text: 選定理由として「栗原郡10町村の合併であることから」「栗原地域に住んでいる人々が長い間、慣れ親しんできた、馴染みやすい名前であること」「歴史的にも古くから『栗原』の名称があることから」が挙げられた、と同報告は記す
    kind: fact
    level: E3
    status: established
    sources:
    - m1-kurihara-toshi
  - text: 地方公共団体コードは042137である（総務省「地方公共団体コード一覧」）
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 市のない郡が、そのまま市になった
    text: 栗原の合併には、もともと「市」が一つもありませんでした。10の町村が対等に合併するとき、中心地の名（築館や若柳）を採れば他の町村が反発しかねません。そこで選ばれたのが、10町村すべてに共通する一番大きな傘、すなわち郡の名前でした。千年以上続いた「栗原郡」は合併で消えましたが、その名は市の名前として生き残ったのです。
    sources:
    - m1-kurihara-toshi
    - m1-kurihara-estat
  relations:
  - pref/04
  unknowns:
  - 「栗原」という郡名自体の語源（「栗の原」に求める説明の典拠）は今回確認できていない
  - 公募の応募総数と、最終候補5案の内訳は、都市センター報告の今回確認範囲では未確認
  - 栗原郡の設置時期など郡史の詳細は本レコードでは未確認
  updated: '2026-11-13'
- id: muni/04-気仙沼市
  code: '042056'
  names:
    ja: 気仙沼市
    reading: けせんぬまし
    aliases:
    - 気仙沼町
    - 気仙沼本郷
  user_terms:
  - 気仙沼はアイヌ語なのか
  - 計仙麻とは何か
  - 気仙沼の「沼」はどこにあるのか
  naming_type: 一部の地名
  prefecture: 宮城県
  homonyms: []
  summary: 市名は、古代の「計仙麻（けせま）」の系譜を引く地名「気仙沼」の継承である。語源はアイヌ語の「ケセ・モイ（終端の湾）」とする説が有力とされる。昭和28年（1953年）に気仙沼町・鹿折町・松岩村が合併して市制を施行した。
  first_attestation:
    era: 延長5年
    year_western: 927
    document: 『延喜式』神名帳（牡鹿郡・計仙麻神社、桃生郡・計仙麻大島神社）
    note: 日本歴史地名大系が紹介する「けせま」の古い記録。『日本三代実録』に「計仙麻」の地名記事があるとする紹介もあるが、今回は原典を確認できていない
  claims:
  - text: 日本歴史地名大系は、気仙沼の地名はアイヌ語のケセモイ・ケセムイから来ており、「湾内の奥」もしくは「アイヌの勢力の及ぶはずれの港」の意味とする説がある、と述べる
    kind: fact
    level: E3
    status: contested
    sources:
    - m1-kesennuma-kotobank
  - text: 同大系によれば、『延喜式』神名帳には牡鹿郡に計仙麻神社、桃生郡に計仙麻大島神社が見え、古代においては陸前高田市から牡鹿郡に至る沿海部を広く「けせま」と呼んだと考えられる
    kind: fact
    level: E3
    status: established
    sources:
    - m1-kesennuma-kotobank
  - text: 慶長5年（1600年）の葛西大崎船止日記・漆請取日記（伊達家文書）には、仮名で「けせぬま」と記されている、と同大系は紹介する
    kind: fact
    level: E3
    status: established
    sources:
    - m1-kesennuma-kotobank
  - text: 世界大百科事典は、気仙沼の地名は『延喜式』に記された計仙麻神に由来するといわれる、とする
    kind: fact
    level: E3
    status: established
    sources:
    - m1-kesennuma-kotobank2
  - text: 昭和28年（1953年）に気仙沼町・鹿折町・松岩村が合体して気仙沼市が誕生し、昭和30年（1955年）に新月村・大島村・階上村を加えた、と日本歴史地名大系は述べる
    kind: fact
    level: E3
    status: established
    sources:
    - m1-kesennuma-kotobank
  - text: 平成18年（2006年）3月に唐桑町と合併し、平成21年（2009年）に本吉町を編入した
    kind: fact
    level: E3
    status: established
    sources:
    - m1-kesennuma-kotobank2
  - text: 地方公共団体コードは042056である（総務省「地方公共団体コード一覧」）
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 「終端の湾」という名の港町
    text: アイヌ語説によれば、「ケセ」は果て・末端、「モイ」は入り江で、気仙沼は「アイヌの勢力の及ぶ最果ての湾」という意味になります。古代の朝廷側の記録に残る「計仙麻（けせま）」という当て字は、その音を写し取ったものと考えられています。やがて音は「けせんぬま」へと延び、「沼」の字が残りました。市名の「沼」は湖沼ではなく、湾の奥の入り江を指す古い地名の名残です。
    sources:
    - m1-kesennuma-kotobank
  relations:
  - pref/04
  unknowns:
  - 『日本三代実録』に「計仙麻」の地名の記述があるとする紹介があるが、該当記事の原典確認は未実施
  - ケセ・モイ説と計仙麻神由来説の関係（どちらが先か）の専門的な決着は未確認
  - 「気仙沼」の表記が定着した時期の特定は未確認
  updated: '2026-11-13'
- id: muni/04-涌谷町
  code: '045012'
  names:
    ja: 涌谷町
    reading: わくやまち
    aliases:
    - 元涌谷村
  user_terms:
  - わくや
  - 日本初の産金の地
  - 黄金山神社の町
  - みちのくGOLD浪漫
  naming_type: 一部の地名
  prefecture: 宮城県
  homonyms: []
  summary: 宮城県遠田郡の町。天平21年（749年）にこの地を含む小田郡から黄金が産出したと報告され、日本初の産金として東大寺大仏の鍍金を支えたことで知られる。「涌谷」の語源は確定していないが、町公式の歴史解説は、砂金の洗い取りで大勢の人々でにぎわい「谷（沢）が湧きかえる」ことに由来するという説を紹介している。1889年に城下の馬場谷地村が単独で町制を施行して涌谷町となり、その後元涌谷村・箟岳村と合併して現在に至る。
  first_attestation:
    era: 明治22年
    year_western: 1889
    document: 町村制施行による涌谷町の発足（馬場谷地村の単独町制）
    note: 自治体名としての発足。地名「涌谷」は中世以来の城下の名に遡るが、文献上の初出は未確認
  claims:
  - text: 総務省の全国地方公共団体コードで、涌谷町の団体コードは045012と定められている
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  - text: 天平21年（749年）春、陸奥国は小田郡から黄金が産出したことを報告し、国守・百済王敬福は自ら黄金900両（約13kg）を携えて献上した。聖武天皇はこれを日本初の産金として慶祝し、大伴家持はその喜びを歌に詠んだ
    kind: fact
    level: E2
    status: established
    sources:
    - z9-wakuya-bunkazai
  - text: この産金は『続日本紀』に「陸奥国始めて黄金を貢る」と記された、と涌谷町公式の歴史解説は紹介している
    kind: fact
    level: E2
    status: established
    sources:
    - z9-wakuya-town-history
  - text: 産金の地である黄金山産金遺跡は国史跡で、産出した砂金は東大寺大仏の鍍金（金メッキ）の材料に用いられた
    kind: fact
    level: E2
    status: established
    sources:
    - z9-wakuya-bunkazai
  - text: 「涌谷」の地名は、砂金の洗い取り作業をするため大勢の人々で「谷（沢）が湧（涌）きかえる」ことに由来しているのだという説を、涌谷町公式の歴史解説の筆者は主張している
    kind: fact
    level: E2
    status: inferred
    sources:
    - z9-wakuya-town-history
  - text: 中世に領地替えをされた涌谷伊達家の統治や城下町の賑わいが、涌谷の町の原型である
    kind: fact
    level: E2
    status: established
    sources:
    - z9-wakuya-bunkazai
  - text: 1889年4月1日の町村制施行の際、馬場谷地村が単独で町制を施行して涌谷町となり、1948年に元涌谷村と、1955年に箟岳村と合併して、現在の涌谷町となった
    kind: fact
    level: E5
    status: established
    sources:
    - z9-wakuya-wiki
  column:
    title: 奈良の大仏を金色に染めた砂金
    text: 天平21年（749年）、東大寺の大仏は鋳造の目途が立ちながら、鍍金に使う金が決定的に不足していた。その年の2月、最果ての陸奥国・小田郡から黄金が見つかったという知らせが届く。国守の百済王敬福が携えてきた金は900両、必要量の4分の1にも満たなかったが、「日本初の産金」の報せに聖武天皇は神仏へ慶祝し、大伴家持は喜びを歌にした。涌谷の箟岳丘陵の砂金は、やがて平泉の黄金文化をも支えていくことになる。
    sources:
    - z9-wakuya-bunkazai
    - z9-wakuya-town-history
  relations:
  - pref/04
  unknowns:
  - 「涌谷」の語源は「谷が湧きかえる」説のほかに諸説の有無を含め、専門辞典での確認が未了で確定していない
  - 地名「涌谷」の文献上の初出（中世文書における涌谷城・涌谷氏の表記等）は未確認
  updated: '2026-11-13'
- id: muni/04-登米市
  code: 042129
  names:
    ja: 登米市
    reading: とめし
    aliases:
    - 登米町（とよま）
    - 登米郡
  user_terms:
  - 登米はなぜ「とめ」と読むのか
  - とよまと登米市はどう違うのか
  - 登米の名前は遠山村から来たのか
  naming_type: 合併新設
  prefecture: 宮城県
  homonyms: []
  summary: 平成17年（2005年）に登米郡8町と本吉郡津山町の9町が合併して誕生した。市名は古い郡名「登米」の継承だが、採用された読みは古来の「とよま」ではなく、明治11年（1878年）に郡名の読みとして改められた「とめ」である。「とよま」の語源は、『続日本紀』宝亀5年（774年）の「遠山村」に由来すると大槻文彦が指摘した。
  first_attestation:
    era: 宝亀5年
    year_western: 774
    document: 『続日本紀』（陸奥国遠山村の記事）
    note: 語源とされる「遠山村」の記録で、大槻文彦が登米郡の地に比定した。「登米」の表記自体の初出級の記録は『和名類聚抄』の登米郡・登米郷（止与米）
  claims:
  - text: 登米公民館の紹介によれば、国語学者の大槻文彦は『復軒雑纂』で、『続日本紀』宝亀5年（774年）10月の条に見える蝦夷の拠点「陸奥国遠山村」が後の登米郡の地であろうと述べ、「遠山」は「とよま」と同音であることを指摘した。これが「とよま」の語源とされている
    kind: fact
    level: E4
    status: established
    sources:
    - m1-tome-kominkan
  - text: 『和名類聚抄』には、登米郡に登米・行方の二郷があり、登米は「止与米（とよま）」と訓むことが記されている、と登米公民館は紹介する
    kind: fact
    level: E4
    status: established
    sources:
    - m1-tome-kominkan
  - text: 明治11年（1878年）、郡区町村編制法によって行政区画としての登米郡が発足した際、郡名の読みが「とよま」から「とめ」に改められ、以後、町の名は「とよま」、郡や行政に関わる名は「とめ」という二つの読みが並び立つようになった
    kind: fact
    level: E4
    status: established
    sources:
    - m1-tome-historia
  - text: 宮城県の合併記録によれば、平成17年（2005年）4月1日、迫町・登米町・東和町・中田町・豊里町・米山町・石越町・南方町・津山町の9町が新設合併し、新市の名称は「登米市（とめし）」とされた
    kind: fact
    level: E2
    status: established
    sources:
    - m1-tome-pref
  - text: 登米（とよま）の町は中世には葛西氏の城下、近世には伊達一門の居館の地であった、と登米公民館は述べる
    kind: fact
    level: E4
    status: established
    sources:
    - m1-tome-kominkan
  - text: 地方公共団体コードは042129である（総務省「地方公共団体コード一覧」）
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 「とよま」と「とめ」、一つの地名に二つの読み
    text: 登米は、日本でも珍しい「読みが割れた」地名です。土地の人々が古くから呼んできた「とよま」は町の名として残り、明治に郡役所の文書が持ち込んだ「とめ」が郡名・行政の読みとして広がりました。2005年の合併では、市の読みに選ばれたのは後者の「とめ」。いま市内では「登米市（とめし）」の中に「登米町（とよままち）」が大字として生き続け、二つの読みが同じ地図の上に並んでいます。
    sources:
    - m1-tome-historia
    - m1-tome-kominkan
  relations:
  - pref/04
  unknowns:
  - 「遠山村＝登米郡の地」という比定は大槻文彦の指摘に基づくもので、『続日本紀』原典との照合は未実施
  - 2005年の合併で読みに「とめ」を採った理由の明文は、県の合併記録には見当たらなかった
  - 「とめ」の読みが県の役人の読み癖に始まるとする大槻文彦の説明の原文確認は未実施
  updated: '2026-11-13'
- id: muni/04-白石市
  code: '042064'
  names:
    ja: 白石市
    reading: しろいしし
    aliases:
    - 白石町
    - 白いし
    - 増岡
    - 白石村
  user_terms:
  - しろいし
  - 白石城の城下町
  - 片倉小十郎のまち
  - 宮城蔵王の玄関口
  naming_type: 一部の地名
  prefecture: 宮城県
  homonyms:
  - muni/41-白石町
  summary: 宮城県最南部、蔵王連峰の東麓にある城下町。地名「白石」は中世に刈田郡の郷村名として現れ、『天文段銭古帳』の「白いし」が初見とされる。在地領主の白石氏は地名に因んで氏としたと伝えられ、戦国期には伊達氏の重臣層をなした。慶長7年（1602年）に片倉景綱が白石城に入って以来、260余年にわたり片倉氏の城下町として続き、1954年（昭和29年）に白石町ほか1町6村の合併で白石市が発足した。なお「白石」の語源そのものは専門辞典でも解明されていない。
  first_attestation:
    era: 天文年間
    year_western: null
    document: 天文段銭古帳
    note: 角川日本地名大辞典が「『天文段銭古帳』に『白いし』と見えるのが初見」と紹介するもの（紹介形で記録）。古代の刈田郡四郷（篤借・刈田・坂田・三田）には「白石」は含まれず、地名の成立は中世と考えられる
  claims:
  - text: 白石市の地方公共団体コードは042064である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  - text: 1954年（昭和29年）4月1日、白石町・越河村・斎川村・大平村・大鷹沢村・白川村・福岡村の1町6村が合併して白石市が発足し、1957年（昭和32年）3月31日に小原村を編入して現在の市域となった
    kind: fact
    level: E2
    status: established
    sources:
    - t5-shiroishi-city-tochi
  - text: 角川日本地名大辞典は、「白石」の初見は『天文段銭古帳』に見える「白いし」であると紹介する
    kind: fact
    level: E3
    status: established
    sources:
    - t5-shiroishi-kakugawa
  - text: 『伊達正統世次考』は「白石氏世々刈田郡白石邑に住す。よって氏とす」と記し、地名の「白石」が先にあって白石氏がそれに因んで氏としたとされる
    kind: fact
    level: E3
    status: established
    sources:
    - t5-shiroishi-kakugawa
  - text: 白石市公式資料は、『続日本紀』によれば養老5年（721年）10月に柴田郡の2郷を割いて刈田郡が置かれたと紹介し、当時の刈田四郷は篤借・刈田・坂田・三田であったとする
    kind: fact
    level: E2
    status: established
    sources:
    - t5-shiroishi-city-tochi
  - text: 天正19年（1591年）に蒲生氏郷の領有となると白石の地名は改められたとみえ、内閣文庫蔵の高目録帳には白石にあたる地が「増岡」と記されている
    kind: fact
    level: E3
    status: established
    sources:
    - t5-shiroishi-kakugawa
  - text: 慶長7年（1602年）に片倉景綱が白石城に入城して以来、明治維新まで260余年にわたり片倉氏の居城となり、一国一城令の後も仙台藩は仙台城と白石城の二城を許された
    kind: fact
    level: E2
    status: established
    sources:
    - t5-shiroishi-city-scene
    - t5-shiroishi-city-castle
  - text: 市内の沢端町には「神石白石」と呼ばれる石があり、「白石」の地名の由来に結びつけて語られることがあるが、専門辞典に語源の裏付けは見当たらない
    kind: legend
    level: E4
    status: indeterminate
    sources:
    - t5-shiroishi-local
  column:
    title: 白石の名が運んだ先――札幌市白石区
    text: 戊辰戦争で奥羽越列藩同盟（白石同盟）の本拠地となった白石城。敗戦後、旧片倉家中の多くは北海道へ渡る道を選んだ。彼らが札幌の東部に入植して開いた村が「白石村」で、現在の札幌市白石区の地名の起こりである。つまり北海道の「白石」は宮城県白石の旧藩士たちが持ち運んだ地名で、北海道の区名と宮城県の市名は、移住という人の移動でつながっている。なお白石自身も、明治の初めに一時「白石県」の県庁所在地になったことがあるが、まもなく角田県に改められ消えた。
    sources:
    - t5-shiroishi-city-rekishi
    - t5-shiroishi-city-tochi
    - t5-shiroishi-kanko
  relations:
  - pref/04
  - muni/41-白石町
  unknowns:
  - 「白石」という地名の語源（白い石・神石などに求める説明）は、専門辞典・市公式資料のいずれでも裏付けが確認できなかった
  - 『天文段銭古帳』自体の成立年・原典は未読のため、初出の主張は角川日本地名大辞典の紹介形にとどめた
  updated: '2026-11-13'
- id: muni/04-石巻市
  code: '042021'
  names:
    ja: 石巻市
    reading: いしのまきし
    aliases:
    - 石巻町
  user_terms:
  - 石巻の名前の由来
  - 巻石とは何か
  - 伊寺水門と石巻
  naming_type: その他（古地名の継承）
  prefecture: 宮城県
  homonyms: []
  summary: 石巻の由来には、御島の「巻石」に川の水が当たって渦を巻くことによるとする説と、『日本書紀』の「伊寺水門（いしのみなと）」に求める村岡良弼以来の説とがあり、定説は定まっていない。元和9年（1623年）の北上川開削で港町として開け、昭和8年（1933年）に市制を施行、平成17年（2005年）に1市6町の合併で現在の市となった。
  first_attestation:
    era: 天保10年
    year_western: 1839
    document: 村岡良弼『地理志科』
    note: 石巻の由来を論じた古い文献の一つ。「石巻」の使用例自体の初出は未確認で、古代にさかのぼらないとする見解がある。
  claims:
  - text: 石巻の地名の由来として、住吉公園前にある御島（島）の北側の松の下にある「巻石」に、川の水が当たって渦を巻くことから名付けられたとする説が、国土交通省北上川下流河川事務所と石巻市建設部の資料で紹介されている。
    kind: fact
    level: E2
    status: contested
    sources:
    - l1-ishinomaki-mlit
  - text: 江戸時代後期の地理学者・村岡良弼は天保10年（1839年）の『地理志科』で、『日本書紀』仁徳天皇条の「伊寺水門（いしのみなと）」を石巻の由来とし、石巻は伊寺の牧（放牧地）であったと説いた。一方で、「石巻」の地名は古代までさかのぼらないとの見解もある。
    kind: fact
    level: E5
    status: contested
    sources:
    - l1-ishinomaki-name-wiki
  - text: 石巻市公式「石巻漁港の概要」は、上毛野田道将軍が「伊寺水門」で戦死したと記録されており、「伊寺水門」が石巻の古名であると伝えられているとする。
    kind: legend
    level: E2
    status: established
    sources:
    - l1-ishinomaki-city
  - text: 元和9年（1623年）、伊達政宗が川村孫兵衛に命じて北上川の新河道を開削して本流を導入してから水運が開け、石巻は港町として繁栄した。
    kind: fact
    level: E2
    status: established
    sources:
    - l1-ishinomaki-city
    - l1-ishinomaki-mlit
  - text: 明治22年（1889年）に石巻町が成立し、昭和8年（1933年）4月1日に単独で市制を施行して石巻市となった。
    kind: fact
    level: E5
    status: established
    sources:
    - l1-ishinomaki-wiki
  - text: 平成17年（2005年）4月1日、旧石巻市・河北町・雄勝町・河南町・桃生町・北上町・牡鹿町の1市6町が合併して新しい石巻市となった。
    kind: fact
    level: E5
    status: established
    sources:
    - l1-ishinomaki-wiki
  - text: 総務省「地方公共団体コード一覧」では、石巻市のコードは042021とされる。
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 渦を巻く石か、古代の水門か
    text: 石巻の由来は二つの物語に分かれる。一つは目の前に実在する石の話。御島のほとりの「巻石」に北上川の水が当たって渦を巻く、その姿が名になったという。もう一つは『日本書紀』の「伊寺水門」に古代の港を求める話で、江戸後期の学者・村岡良弼が唱えた。ただし「石巻」という名自体は古代までさかのぼらないとの見解もあり、古代説は地名の古さではなく伝承の古さを語るものかもしれない。実在の石と古代の書物、どちらを原点と見るかで町の物語が変わる。
    sources:
    - l1-ishinomaki-mlit
    - l1-ishinomaki-name-wiki
  relations:
  - pref/04
  unknowns:
  - 「石巻」の表記の文献上の初出は未確認。
  - 巻石説がいつ誰によって唱えられたか、その典拠は特定できていない。
  - 1933年の市制施行と2005年の合併の経緯について、市公式年表での再確認は未実施。
  updated: '2026-11-13'
- id: muni/04-美里町
  code: '045055'
  names:
    ja: 美里町
    reading: みさとまち
    aliases: []
  user_terms:
  - 美里町の名前の由来
  - 小牛田町と南郷町が合併した町
  - 遠田市にならなかった理由
  naming_type: 合併新設
  prefecture: 宮城県
  homonyms:
  - muni/11-美里町
  - muni/43-美里町
  summary: 2006年に小牛田町と南郷町の新設合併で生まれた新町名。当初は涌谷町を含む3町合併で新市名「遠田市」に決まっていたが、涌谷町の離脱で2町合併となり、名称も「美里町」に決め直された経緯がある。県の合併記録に命名理由は記されておらず、「美しい里」型の佳名として選ばれたかどうかは公式資料では確認できない。
  first_attestation:
    era: 平成18年
    year_western: 2006
    document: 自治体名としての「美里町」（小牛田町・南郷町合併協議会で確認）
    note: 合併前の両町域に「美里」という地名があったかどうかは未確認
  claims:
  - text: 当初の3町（小牛田町・涌谷町・南郷町）合併では、公募で集まった名称の中から小委員会が候補を絞り、2004年2月の第10回協議会の投票で新市名を「遠田市」と決定していたと宮城県の合併記録が伝える
    kind: fact
    level: E2
    status: established
    sources:
    - h3-miyagi-gappei-shosai
  - text: 涌谷町で2004年12月12日に行われた合併の是非を問う住民投票は反対54.9%となり、涌谷町は協議会を離脱して3町協議会は解散した
    kind: fact
    level: E2
    status: established
    sources:
    - h3-miyagi-gappei-shosai
  - text: 2町による合併協議会（2005年2月4日設立）の第5回協議会で新町の名称を「美里町」とすることなどが確認され、2006年1月1日に小牛田町・南郷町を廃して美里町が設置された
    kind: fact
    level: E2
    status: established
    sources:
    - h3-miyagi-gappei-ichiran
    - h3-miyagi-gappei-gaiyo
  - text: 県がまとめた新町の概要・合併記録には「美里」の選定理由が記されておらず、この名が「美しい里」を意味する佳名として選ばれたのか、旧地名等に由来するのかは、確認した公式資料では判明しない
    kind: fact
    level: E2
    status: indeterminate
    sources:
    - h3-miyagi-gappei-gaiyo
  - text: 埼玉県・熊本県の美里町と同様に合併で生まれた新名で、「美しい里」と読める字面を持つ点は共通する。しかし埼玉では公募・全世帯投票の経緯と理由の説明が、熊本では公募の理由文が公式に残るのに対し、宮城では理由文が確認できない点が異なる
    kind: fact
    level: E2
    status: established
    sources:
    - h3-saitama-mayor
    - h3-kumamoto-misato-pref
    - h3-miyagi-gappei-gaiyo
  - text: 総務省「地方公共団体コード一覧」では本町のコードは045055とされる
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 消えた「遠田市」と決め直された名前
    text: 美里町の名前は、最初から「美里」だったわけではありません。3町合併の段階では郡名にちなむ「遠田市」が新市名に決まっていました。涌谷町の住民投票で枠組みが崩れ、2町で仕切り直した協議会が改めて選んだのが「美里町」です。経緯の記録は県資料に詳しく残る一方、なぜ「美里」なのかという理由文は残っていません。
    sources:
    - h3-miyagi-gappei-shosai
    - h3-miyagi-gappei-ichiran
  relations:
  - pref/04
  - muni/11-美里町
  - muni/43-美里町
  unknowns:
  - 「美里」の具体的な選定理由（公募の有無・候補名・理由文）
  - 合併前の両町域に「美里」という字名・小地名があったか
