  - 時津街道
  naming_type: 中心地名の継承
  formation: 合併新設
  prefecture: 長崎県
  homonyms: []
  summary: 長崎県西彼杵郡の町で、長崎市の北に接し大村湾（時津港）に面する。町公式によれば起源は明らかでないが、鎌倉時代には「時津」と呼ばれていたとされる。明治5年（1872年）に時津村・西時津村・日並村が合併して時津村となり、昭和26年（1951年）12月1日に町制を施行した。江戸時代には長崎街道の海路「時津街道」の起点として栄えた。
  first_attestation:
    era: 鎌倉時代
    year_western: null
    document: 「時津」の用例（特定の初出文書は未確認）
    note: 時津町公式サイトは「町の起源ははっきりしないが、鎌倉時代には『時津』と呼ばれていたようだ」と紹介している。具体的な初出文書の特定には至らなかった
  claims:
  - text: 総務省の全国地方公共団体コードで、時津町の団体コードは423084と定められている
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  - text: 町の起源は明らかではないが、鎌倉時代には「時津」と呼ばれていたようだと、時津町公式サイトが説明している
    kind: fact
    level: E2
    status: established
    sources:
    - r7-togitsu-town-gaiyo
  - text: 中世には時津氏一族が荘官あるいは地頭として活躍し、室町時代には大村領に属した
    kind: fact
    level: E2
    status: established
    sources:
    - r7-togitsu-town-gaiyo
  - text: 明治5年（1872年）に時津村・西時津村・日並村の3村が合併して時津村となった
    kind: fact
    level: E2
    status: established
    sources:
    - r7-togitsu-town-gaiyo
  - text: 昭和26年（1951年）12月1日に時津村が町制を施行して時津町となった
    kind: fact
    level: E2
    status: established
    sources:
    - r7-togitsu-town-gaiyo
  - text: 江戸時代には長崎と彼杵を結ぶ海路の街道「時津街道」が開かれ、時津港は交通の要衝だった
    kind: fact
    level: E2
    status: established
    sources:
    - r7-togitsu-yoran
  - text: 「時津」の語源について、町公式サイト自身が「時津の名称の由来ははっきりはしません」と明記しており、確定できない
    kind: fact
    level: E2
    status: indeterminate
    sources:
    - r7-togitsu-town-gaiyo
  column:
    title: 二十六聖人が最後の夜を過ごした港
    text: 1597年、豊臣秀吉の禁教令で捕らえられた日本二十六聖人は、京都から長崎へ護送される道のりの最後に時津港へ船で到着し、船上で最後の夜を過ごした。翌朝、一行は時津から殉教地の西坂の丘へ歩いたという。長崎街道の海路の起点だった時津港は、長崎の歴史を象徴する出来事の舞台でもあった。町名の由来は分からなくても、港の記憶は町の誇りとして語り継がれている。
    sources:
    - r7-togitsu-yoran
  relations:
  - pref/42
  unknowns:
  - 「時津」の語源は町公式も未詳としており、確定できなかった
  - 「時津」の初出となる中世文書の特定はできなかった
  - 古く「ときつ」とも読まれた読みが「とぎつ」に定着した時期は確認できなかった
  updated: '2026-11-13'
- id: muni/42-東彼杵町
  code: '423211'
  names:
    ja: 東彼杵町
    reading: ひがしそのぎちょう
    aliases: []
  user_terms:
  - ひがしそのぎ
  - そのぎ茶の町
  - 千綿駅
  naming_type: 旧行政区画名の継承
  formation: 合併新設
  prefecture: 長崎県
  homonyms: []
  summary: 長崎県東彼杵郡の町で、大村湾の東岸に位置する。昭和34年（1959年）5月1日に彼杵町と千綿村が合併して発足し、町名は郡名「東彼杵」から採られた。「彼杵（そのぎ）」は古代の彼杵郡に遡る古い名で、その語源には『肥前国風土記』の「具足玉国（そないだまのくに）」の転訛とする説をはじめ諸説がある。
  first_attestation:
    era: 奈良時代
    year_western: 713
    document: 『肥前国風土記』彼杵郡の条（郡名「彼杵」として）
    note: 『肥前国風土記』は元々の一部のみが伝わり、彼杵郡の条は他書の引用（逸文）で知られる。東彼杵町歴史民俗資料館は風土記を奈良時代に元明天皇の命で編纂された地誌と説明している
  claims:
  - text: 総務省の全国地方公共団体コードで、東彼杵町の団体コードは423211と定められている
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  - text: 昭和34年（1959年）5月1日に彼杵町と千綿村が新設合併して東彼杵町が発足した
    kind: fact
    level: E2
    status: established
    sources:
    - upg-ab4-nagasaki-gappei
    - upg-ab4-geoshape-higashisonogi
  - text: 町名は郡名「東彼杵郡」から採られたもので、彼杵郡は明治11年（1878年）に東彼杵郡と西彼杵郡に分かれた
    kind: fact
    level: E5
    status: established
    sources:
    - r7-sonogi-wiki
  - text: 『肥前国風土記』の彼杵郡の条には、景行天皇の巡幸の際に土蜘蛛らが白・青・赤の3つの玉を献じ、天皇が当地を「具足玉国（そないだまのくに）」と名付けよと命じたという話が伝わり、「そのぎ」はこの「そない」が転訛したものとする説がある
    kind: legend
    level: E4
    status: established
    sources:
    - r7-sonogi-folklore
  - text: 「彼杵」の由来にはこのほか、『大村郷村記』に伝わる安全寺大御堂への「杵の天降り」の伝説にちなむとする説、彼杵宿の大楠を「彼木（そのき）」と呼んだことにちなむとする説がある
    kind: legend
    level: E4
    status: contested
    sources:
    - r7-sonogi-folklore
  - text: 語源としてはソ（麻）を栽培する里を意味する「麻の木（そのき）」に由来するとする説もあり、「彼杵」の語源は諸説あって定説はない
    kind: fact
    level: E4
    status: contested
    sources:
    - r7-sonogi-folklore
  - text: 東彼杵町歴史民俗資料館は、『肥前国風土記』の具足玉国の物語を展示コーナー「具足王国」として紹介している
    kind: fact
    level: E2
    status: established
    sources:
    - r7-sonogi-rekishikan
  column:
    title: 三色の玉を献じた「具足玉国」
    text: 『肥前国風土記』が伝える彼杵の物語は劇的である。九州を巡幸した景行天皇の前に土蜘蛛の八十枉津日女らが現れ、白・青・赤の3つの美しい玉を献じた。これらを合わせれば世に絶えない宝になるとして、天皇はこの国を「具足玉国（そないだまのくに）」と名付けよと命じたという。「そのぎ」という読みにくい地名の背後には、この玉の物語が隠れているとされる。町の歴史民俗資料館は今もこの伝承を「具足王国」と名付けて展示している。
    sources:
    - r7-sonogi-folklore
    - r7-sonogi-rekishikan
  relations:
  - pref/42
  unknowns:
  - 「彼杵（そのぎ）」の語源は諸説あり、定説は確認できなかった
  - 1878年の東西彼杵郡への分割を一次資料で確認することはできなかった
  - 「そのき」から「そのぎ」への読みの変化の時期は確認できなかった
  updated: '2026-11-13'
- id: muni/42-松浦市
  code: '422088'
  names:
    ja: 松浦市
    reading: まつうらし
    aliases:
    - 志佐町
    - 松浦郡
  user_terms:
  - まつうら
  - 松浦党の本拠地
  - アジフライの聖地
  - 鷹島（元寇の海底遺跡）のある市
  naming_type: 旧行政区画名の継承
  naming_note: 合併に際し郡名「松浦」を市名に採用したもの
  formation: 編入合併
  prefecture: 長崎県
  homonyms: []
  summary: 昭和30年（1955年）3月31日、志佐町・新御厨町・調川町が新設合併し、同時に市制を施行して発足した市で、同年4月に今福町を編入、平成18年（2006年）には福島町・鷹島町と合併して現在の市域となった。合併した町の中に「松浦町」はなく、市名は肥前国松浦郡の郡名から採られた。松浦郡は中世の海の武士団「松浦（まつら）党」の本拠で、氏と党の読みは「まつら」、市の読みは「まつうら」と異なる。
  first_attestation:
    era: null
    year_western: null
    document: null
    note: 「松浦郡」の確かな初出は確認できなかった。市公式資料は、当地が律令制下で肥前国松浦郡の区域だったと紹介するにとどまる
  claims:
  - text: 松浦市の地方公共団体コードは422088である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  - text: 松浦市は昭和30年（1955年）3月31日に志佐町・新御厨町・調川町が新設合併して市制を施行し発足し、同年4月に今福町を編入した
    kind: fact
    level: E2
    status: established
    sources:
    - r6-matsuura-city-plan
  - text: 平成18年（2006年）1月1日、松浦市・福島町・鷹島町が新設合併して現在の松浦市となった
    kind: fact
    level: E2
    status: established
    sources:
    - r6-matsuura-city-plan
  - text: 発足時の合併構成町に「松浦町」は含まれておらず、市名の「松浦」は当地が属した松浦郡の郡名に由来する
    kind: fact
    level: E2
    status: established
    sources:
    - r6-matsuura-city-plan
  - text: 律令制下の当地は肥前国松浦郡の区域で、平安時代後期に嵯峨源氏の流れを汲む源久が松浦郡宇野御厨の検校となって松浦久を名乗り、そのもとで松浦水軍として知られる武士団「松浦党」が結成されたと市の公式資料は紹介している
    kind: fact
    level: E2
    status: established
    sources:
    - r6-matsuura-city-plan
  - text: 松浦氏・松浦党の読みは「まつら」で、市名の読み「まつうら」とは異なる
    kind: fact
    level: E2
    status: established
    sources:
    - r6-matsuura-city-plan
  - text: 2006年の合併で市域に入った鷹島の沖は元寇の古戦場と伝えられ、鷹島神崎遺跡は平成24年（2012年）に日本で初めての海底遺跡として国史跡に指定された
    kind: fact
    level: E2
    status: established
    sources:
    - r6-matsuura-city-plan
  - text: 「松浦」という地名自体の語源は、出典範囲では確定した説を確認できなかった
    kind: fact
    level: E2
    status: indeterminate
    sources:
    - r6-matsuura-city-plan
  column:
    title: 「まつら党」と「まつうら市」—読みの違う松浦
    text: 松浦市を調べると、市の公式資料の中で武士団は一貫して「松浦（まつら）党」と振り仮名付きで書かれている。中世の松浦氏は地名を名乗り「まつら」と読んだが、現在の市の読みは「まつうら」である。同じ漢字の地名と氏が、時代を経て読みを違えたまま並び立っている。市は「アジフライの聖地」を名乗る一方で、まつうら党の名を冠した交流組織もあり、二つの読みが今も地域の中で使い分けられている。
    sources:
    - r6-matsuura-city-plan
  relations:
  - pref/42
  - muni/42-平戸市
  unknowns:
  - 「松浦」の語源（松浦川との関係を含む）は確認できなかった
  - 1955年の市制時に郡名「松浦」を市名に選んだ選定過程の一次資料は確認できなかった
  - 松浦郡の文献上の初出（『和名類聚抄』の用例など）は原文・専門辞典で直接確認できなかった
  updated: '2026-11-13'
- id: muni/42-波佐見町
  code: '423238'
  names:
    ja: 波佐見町
    reading: はさみちょう
    aliases:
    - 波佐美
    - 波佐見村
    - 上波佐見町
    - 下波佐見村
  user_terms:
  - 波佐見焼の町の名前の由来
  - 波佐見はなぜ「はさみ」と読むのか
  - 波佐見の地名の起源
  naming_type: 中心地名の継承
  formation: 合併新設
  prefecture: 長崎県
  homonyms: []
  summary: 波佐見は中世の文書にみえる彼杵庄内の古い地名で、近世は大村藩領の波佐見村だった。明治期に上波佐見村・下波佐見村に分かれ、1934年に上波佐見村が町制施行、1956年に両者が合併して波佐見町が誕生した。地名の語源は確定しておらず、町公式は山に挟まれた地形をいう「狭間」から変化したとも言われると紹介する。江戸時代以来の窯業（波佐見焼）の名が全国的に知られるが、それは地名の由来とは別の層である。
  first_attestation:
    era: 鎌倉時代（正安3年）
    year_western: 1301
    document: 鎮西探題御教書案（青方文書）
    note: 『日本歴史地名大系』が紹介する「波佐見左衛門太郎（親平）」という人名としての用例。原典は未読のため紹介として記録する。地名に直接かかわる用例としては嘉暦4年（1329）の東福寺領肥前国彼杵庄文書目録にみえる波佐見彦次郎ら一族の名がある
  claims:
  - text: 波佐見は中世よりみえる彼杵（そのき）庄内の地名で、正安3年（1301）6月19日の鎮西探題御教書案（青方文書）に「波佐見左衛門太郎（親平）」とあることを『日本歴史地名大系』が紹介している
    kind: fact
    level: E3
    status: established
    sources:
    - r8-hasami-kotobank
  - text: 元応2年（1320）の鎮西探題裁許状案では「波佐美左衛門太郎入道」と「波佐美」の表記もみえ、嘉暦4年（1329）の東福寺領肥前国彼杵庄文書目録には波佐見彦次郎・波佐見次郎忠平など当地を拠点とする一族の名がみえることを同大系が紹介している
    kind: fact
    level: E3
    status: established
    sources:
    - r8-hasami-kotobank
  - text: 町公式は「波佐見」という地名の由来について諸説あるとしたうえで、山々に挟まれた地形を示す「狭間（ハザマ）」から変化したとも言われていると紹介する
    kind: fact
    level: E2
    status: indeterminate
    sources:
    - r8-hasami-town-history
  - text: 近世には大村藩領の波佐見村となり、明治3年（1870）に上波佐見村・下波佐見村に分かれたと町公式は説明する
    kind: fact
    level: E2
    status: contested
    sources:
    - r8-hasami-town-history
    - r8-nagasaki-yogyo-nenpyo
  - text: 一方、長崎県の窯業関連年表は天和年間（1681〜1684）に「波佐見村が上・下波佐見村へ」と記しており、上・下への区分が江戸時代にさかのぼるとする点で町公式の説明と異なる
    kind: fact
    level: E2
    status: contested
    sources:
    - r8-nagasaki-yogyo-nenpyo
  - text: 昭和9年（1934）に上波佐見村が町制を施行して上波佐見町となり、昭和31年（1956）に下波佐見村と合併して現在の波佐見町が誕生した
    kind: fact
    level: E2
    status: established
    sources:
    - r8-hasami-town-history
  - text: 波佐見焼の始まりについては、慶長の役ののち慶長4年（1599）に李朝陶工の李祐慶らが始めたという言い伝えがあり、長崎県の窯業年表も「言い伝え」として記録している。これは地名自体の由来とは別の、窯業の層である
    kind: legend
    level: E2
    status: established
    sources:
    - r8-nagasaki-yogyo-nenpyo
  - text: 総務省「地方公共団体コード一覧」では本町のコードは423238とされる
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 「伊万里焼」「有田焼」の陰に隠れた名前
    text: 波佐見で焼かれた磁器は、江戸時代には積出港である伊万里の名を取って「伊万里焼」、明治時代以降は積出駅の有田の名を取って「有田焼」と称されてきました。長崎県の窯業講座資料は、「伊万里焼」「有田焼」の中には実は多くの「波佐見焼」が含まれていると指摘します。庶民向けの日用食器「くらわんか茶碗」の一大産地でありながら、表に出る名前は港や駅の名前だった――地名が商品名に埋もれた町でもあります。
    sources:
    - r8-nagasaki-yogyo-koza
  relations:
  - pref/42
  unknowns:
  - 「波佐見」の語源は確定しておらず、「狭間」変化説以外の諸説の詳細は未確認
  - 正安3年の文書の「波佐見」は人名（名字）としての用例であり、地名そのものの初出とは断定できない
  - 1956年の合併の正確な月日は、確認した町公式ページでは明記されていなかった
  updated: '2026-11-13'
- id: muni/42-西海市
  code: '422126'
  names:
    ja: 西海市
    reading: さいかいし
    aliases:
    - 西海町
    - 西海村
  user_terms:
  - さいかい
  - 西彼杵半島の北の市
  - 西海国立公園のまち
  - 道の駅さいかい
  naming_type: 新規命名
  formation: 合併新設
  prefecture: 長崎県
  homonyms: []
  summary: 平成17年（2005年）4月1日、西彼杵郡の西彼町・西海町・大島町・崎戸町・大瀬戸町が新設合併して発足した市。市名は公募と協議を経て「西海」に決まったが、この名は1955年に面高村・七釜村の合併で生まれた西海村に遡り、同年3月に指定された西海国立公園を記念して名付けられたとされる。「西海」という地名は国立公園の指定を契機に生まれた、比較的新しい名である。
  first_attestation:
    era: 昭和30年
    year_western: 1955
    document: null
    note: 「西海」は昭和30年（1955年）4月1日の西海村発足で自治体名として現れたのが確認できる初出で、それ以前の地名としての用例は確認できなかった
  claims:
  - text: 西海市の地方公共団体コードは422126である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  - text: 西海市は平成17年（2005年）4月1日、西彼町・西海町・大島町・崎戸町・大瀬戸町の5町の新設合併で発足した
    kind: fact
    level: E4
    status: established
    sources:
    - r6-saikai-uub
  - text: 新市名は公募上位に「西海」が入り、最終候補の「西海」「西彼杵」「西そのぎ」の3点から「西海市」に決定され、市役所は旧大瀬戸町役場に置かれた
    kind: fact
    level: E4
    status: established
    sources:
    - r6-saikai-uub
  - text: 合併前の西海町は、昭和30年（1955年）4月1日に面高村と七釜村が合併して発足した西海村が、昭和32年（1957年）3月31日に瀬川村を編入し、昭和44年（1969年）1月1日に町制を施行したものである（長崎県の市町村の合併一覧および歴史的行政区域データセットによる）
    kind: fact
    level: E2
    status: established
    sources:
    - upg-ab4-nagasaki-gappei
    - upg-ab4-geoshape-saikai
  - text: 「西海」という名は、昭和30年（1955年）3月16日の西海国立公園の指定を記念して、西海村の発足時に名付けられたものであるとWikipedia「西海町」は紹介している（参考文献として『角川日本地名大辞典』42長崎県を挙げる）
    kind: fact
    level: E2
    status: established
    sources:
    - r6-saikai-wiki-cho
  - text: 旧西海町の横瀬浦は永禄5年（1562年）に平戸に続いてポルトガル船が来航し、大村純忠の庇護のもと南蛮貿易港として開港したが、翌1563年に後藤貴明らの反乱に乗じた豊後商人の焼き討ちで焼失し、貿易港はその後福田を経て長崎へ移ったと、学術論文がフロイスの『日本史』等の文献に基づいて紹介している
    kind: fact
    level: E2
    status: established
    sources:
    - upg-ab4-niu-yokoseura
  column:
    title: 国立公園の指定から2週間で生まれた地名
    text: 「西海」という名の始まりは1955年である。同年3月16日に西海国立公園が指定され、その直後の4月1日、面高村と七釜村が合併して生まれた新しい村は、公園の指定を記念して「西海村」と名付けられた。半世紀後の2005年、5町の合併で生まれる新市の名を公募すると「西海」が候補の中心に残り、そのまま市名になった。国立公園の名前が村の名になり、町の名になり、やがて市の名にまで昇格した例である。
    sources:
    - r6-saikai-wiki-cho
    - r6-saikai-uub
  relations:
  - pref/42
  - muni/42-佐世保市
  unknowns:
  - 西海国立公園指定を記念した命名という説明は、『角川日本地名大辞典』に基づくとされる二次情報経由の確認にとどまり、辞典原文では確認していない
  - 2005年の新市名選定で「西海」が選ばれた理由の公式説明（協議会議事録等）は確認できなかった
  - 西海村発足以前に「西海」が地域名として使われていたかは確認できなかった
  updated: '2026-11-13'
- id: muni/42-諫早市
  code: '422045'
  names:
    ja: 諫早市
    reading: いさはやし
    aliases:
    - 伊佐早
  user_terms:
  - いさはやの由来
  - 眼鏡橋のまち
  - 諫早ってどう読むの
  naming_type: 人名に由来
  naming_note: 領主の姓に合わせて「伊佐早」から改称
  formation: 合併新設
  prefecture: 長崎県
  homonyms: []
  summary: もとの地名は「伊佐早」で、建久8年（1197）の文書に「伊佐早村」が初出する。天正15年（1587）にこの地を与えられた龍造寺氏が姓を「諫早」と改めるのに伴い、地名も「伊佐早」から「諫早」に改められたと市の公式資料は伝える。1940年に市制を施行し、2005年の合併でも名が継承された。
  first_attestation:
    era: 建久8年
    year_western: 1197
    document: 八幡宇佐神宮神領大鏡
    note: 「伊佐早村」の初出（諫早市史・市勢要覧総説による）。現在の「諫早」の表記は、近世に龍造寺（諫早）氏の姓に合わせて改められたもの
  claims:
  - text: 建久8年（1197）の『八幡宇佐神宮神領大鏡』の中に「伊佐早村」が初めて登場すると、諫早市の市史・市勢要覧総説は記す
    kind: fact
    level: E2
    status: established
    sources:
    - l6-isahaya-city-shishi
  - text: 伊佐早村は宝治元年（1247）には「伊佐早庄」として登場し、正和3年（1314）の『深江文書』によれば仁和寺仏母院領になったとされる
    kind: fact
    level: E2
    status: established
    sources:
    - l6-isahaya-city-shishi
  - text: 天正15年（1587）の豊臣秀吉による九州仕置では、西郷氏の本拠であった伊佐早が龍造寺家晴に与えられた（『日本歴史地名大系』「諫早郷」）
    kind: fact
    level: E3
    status: established
    sources:
    - l6-isahaya-kotobank
  - text: その後、龍造寺氏は姓を「諫早」に改め、土地の名も「伊佐早」から「諫早」へ改められたと諫早市公式サイトは伝える。長崎県の資料は、姓を改めたのは2代目の龍造寺直孝であるとする
    kind: fact
    level: E2
    status: established
    sources:
    - l6-isahaya-city-travel
    - l6-isahaya-pref-nagasaki
  - text: 1940年（昭和15年）9月1日、諫早町・小栗村・小野村・有喜村・真津山村・本野村・長田村が合併して市制を施行し、諫早市が誕生した（長崎県の市町村の合併一覧による。地方公共団体コードは422045）
    kind: fact
    level: E2
    status: established
    sources:
    - upg-ab4-nagasaki-gappei
    - b-cap-chiba-soumu-code
  - text: 2005年（平成17年）3月1日、旧諫早市に多良見町・森山町・飯盛町・高来町・小長井町が合わさる1市5町の合併で新・諫早市が誕生し、新市章も旧1市5町を表す六つの輪で構成された
    kind: fact
    level: E2
    status: established
    sources:
    - l6-isahaya-city-shishi
  - text: 「伊佐早」という名そのものの語源については、諫早市の市史・市勢要覧総説にも定説の提示がなく、確定できなかった
    kind: fact
    level: E2
    status: indeterminate
    sources:
    - l6-isahaya-city-shishi
  column:
    title: 勝者が名を変えたまち――伊佐早から諫早へ
    text: 諫早は、征服した側が自分の姓に合わせて地名の字を変えた、珍しいタイプの地名である。天正15年（1587）、西郷氏を滅ぼしてこの地に入った龍造寺氏が姓を「諫早」と改めると、土地の名も「伊佐早」から「諫早」に書き換えられた。読みの「いさはや」はそのままに、字だけが新しい領主に合わせて取り替えられたわけで、以来この地は維新まで諫早家に治められた。初出から400年近く「伊佐早」だった名が、戦国末の政変で現在の姿になった。
    sources:
    - l6-isahaya-city-travel
    - l6-isahaya-pref-nagasaki
    - l6-isahaya-city-shishi
  relations:
  - pref/42
  unknowns:
  - 「伊佐早」の語源は定説がなく未確定（市史にも語源説の提示がない）
  - 「諫早」への改称が具体的に何年に行われたかは、2代直孝の代とされるものの年次は未確認
  updated: '2026-11-13'
- id: muni/42-長与町
  code: '423076'
  names:
    ja: 長与町
    reading: ながよちょう
    aliases:
    - 長与浦
    - 長与村
  user_terms:
  - 長与の名前の由来
  - 長与はなぜ「ながよ」と読むのか
  - 長与専斎の出身地
  naming_type: 中心地名の継承
  formation: 合併新設
  prefecture: 長崎県
  homonyms: []
  summary: 長与は中世の文書に「長与浦」とみえる彼杵庄の古い地名で、当地を名字の地とする長与氏の本拠だった。1889年に9郷をもって長与村が発足し、1969年に町制を施行して長与町となった。語源は確定しておらず、神功皇后が「長い夜だなぁ」と言ったという言い伝えや、長い入江の地形によるとも言われる。
  first_attestation:
    era: 鎌倉時代（嘉暦4年）
    year_western: 1329
    document: 東福寺領肥前国彼杵庄文書目録（正慶乱離志裏文書）
    note: 『日本歴史地名大系』が紹介する「長与浦」の用例。原典は未読のため紹介として記録する。人名としては正和3年（1314）の訴陳状に「長与民部次郎」がみえる
  claims:
  - text: 長与は中世よりみえる彼杵（そのき）庄戸町浦のうちの地名で、嘉暦4年（1329）7月3日の東福寺領肥前国彼杵庄文書目録に「長与浦」とみえることを『日本歴史地名大系』が紹介している
    kind: fact
    level: E3
    status: established
    sources:
    - r8-nagayo-kotobank
  - text: 正和3年（1314）から元亨3年（1323）にかけての彼杵庄の訴陳状には長与民部次郎の名がみえ、長与左衛門三郎入道・長与覚道房らを含めて、当地名を名字の地とする長与氏の存在が知られると同大系は述べる
    kind: fact
    level: E3
    status: established
    sources:
    - r8-nagayo-kotobank
  - text: 言い伝えによれば、神功皇后が三韓征伐の帰路にこの地に着き、琴ノ尾岳で一夜を過ごした際、寒くて寝付けず「長い夜だなぁ」と言われたことが「長与」になったといわれる
    kind: legend
    level: E5
    status: indeterminate
    sources:
    - r8-nagayo-blog
  - text: 地形が「長い入江」になっているところから「長与」になったとも言われるが、これも言い伝えの域を出ない
    kind: legend
    level: E5
    status: indeterminate
    sources:
    - r8-nagayo-blog
  - text: 明治22年（1889）4月の町村制施行により、岡・斉藤・嬉里・丸田・高田・吉無田・三根・平木場・本川内の9郷をもって自治体としての長与村が誕生した
    kind: fact
    level: E2
    status: established
    sources:
    - r8-nagayo-town-plan
  - text: 昭和44年（1969）1月1日、西彼杵郡長与村が町制を施行して長与町となった
    kind: fact
    level: E2
    status: established
    sources:
    - r8-nagasaki-henko
  - text: 総務省「地方公共団体コード一覧」では本町のコードは423076とされる
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 「長い夜」の伝説と名字の地・長与
    text: 神功皇后が寒さに眠れず「長い夜だなぁ」と言ったという伝説は、語呂合わせの由来譚らしい軽さがあります。一方で史料に残るのは、ここを本拠にした長与氏の一族の名前です。近代日本の医療・衛生行政の基礎を築いた長与専斎はこの長与の出身で、名字と地名がそのまま結びついた例として知られます。伝説の「長い夜」と、文書に残る「名字の地」、二つの層が重なった地名です。
    sources:
    - r8-nagayo-kotobank
    - r8-nagayo-blog
  relations:
  - pref/42
  unknowns:
  - 「長与」の語源の確定説は確認できず、神功皇后伝説と入江地形説はいずれも言い伝えにとどまる
  - 中世以前（鎌倉時代以前）の「長与」の記録は未確認
  updated: '2026-11-13'
- id: muni/42-長崎市
  code: '422011'
  names:
    ja: 長崎市
    reading: ながさきし
    aliases:
    - 長埼
    - 永埼
  user_terms:
  - 長崎市の名前は長い岬から
  - 長崎氏って誰
  - 長崎はいつ開港したの
  - 長崎市はいつできた
  naming_type: 中心地名の継承
  naming_note: 港町「長崎」の名をそのまま市名とした
  formation: 単独発足
  prefecture: 長崎県
  homonyms: []
  summary: 市名は港町「長崎」に由来する。地名の起源には、長崎港に突き出した「長い岬」にちなむ説と、在地豪族・長崎氏にちなむ説があり、長崎市関連資料も両説を併記する。1571年の開港で貿易港として発展し、1889年に旧幕府直轄地を中心とした区域で市制が施行された。
  first_attestation:
    era: 嘉禎3年
    year_western: 1237
    document: 福田文書等にみえる長崎小太郎重綱の知行記録（研究経由）
    note: 鎌倉初期に「長埼浦」の地頭職を知行した長崎氏の存在が確認できる時点。地名自体はこれ以前から存在した可能性が高い
  claims:
  - text: 市名「長崎」は港町の名に由来し、1889年（明治22年）4月1日に市制が施行されたときの市域は、旧幕府直轄地を中心とした区域であった
    kind: fact
    level: E2
    status: established
    sources:
    - f-cap-nagasaki-city-fuuchi
    - f-cap-nagasaki-city-chronology
  - text: 地名「長崎」の由来には、諏訪神社付近から長崎港へ突き出した長い岬の地形にちなむとする説がある
    kind: fact
    level: E2
    status: contested
    sources:
    - f-nagasaki-city-magazine
    - f-nagasaki-city-profile
  - text: もう一つの説は、室町時代に移住してきた豪族・長崎氏（永崎氏）の名に由来するとするもので、長崎市関連資料は岬説と長崎氏説の2説を併記している
    kind: fact
    level: E2
    status: contested
    sources:
    - f-nagasaki-city-magazine
  - text: 鎌倉初期の嘉禎3年（1237年）頃、長崎小太郎重綱が長埼浦の地頭職を知行する御家人であったことが、後の研究で判明している
    kind: fact
    level: E2
    status: established
    sources:
    - f-nagasaki-city-magazine
  - text: 野母崎半島を指す「長か岬（ながかみさき）」が方言で「なんかみさき」と転訛して「長崎」になったという説明は、地元で語られる俗説として伝えられている
    kind: legend
    level: E4
    status: established
    sources:
    - f-nagasaki-city-magazine
  - text: 長崎の発展は元亀2年（1571年）のポルトガル船入港と開港を画期とし、大村純忠のもとで岬の周辺に6町の町建てが進んだ
    kind: fact
    level: E2
    status: established
    sources:
    - f-nagasaki-city-magazine
    - f-nagasaki-city-profile
  - text: 開港当時の長崎の領主格であった長崎甚左衛門純景は長崎氏の後裔で、大村純忠の娘を妻とし、自らもキリシタンとなった
    kind: fact
    level: E2
    status: established
    sources:
    - f-nagasaki-city-magazine
  - text: 現在の市域は、2005年（平成17年）に香焼・伊王島・高島・野母崎・三和・外海の6町、2006年（平成18年）に琴海町と合併して拡大したもので、開港時の町域とは大きく異なる
    kind: fact
    level: E2
    status: established
    sources:
    - f-nagasaki-city-profile
  column:
    title: 町の中心は、岬の付け根から先端へ移った
    text: 開港前の長崎の中心は、諏訪神社の鎮座する森崎——岬の付け根あたりの集落だった。ところが1571年の開港とともに、大村純忠は岬の先のほうに横瀬浦町・平戸町・外浦町・大村町・文治町・嶋原町という6つの新しい町を建て、貿易の拠点をそちらへ寄せた。現在の県庁・市役所通りのあたりがその6町に相当する。つまり「長崎」という町の重心は、開港の瞬間に岬を少し下った場所へ引っ越したのであり、古い中心は神社の門前として残った。
    sources:
    - f-nagasaki-city-magazine
    - f-cap-nagasaki-magazine2
  relations:
  - pref/42
  unknowns:
  - 「長崎」の語が文献に現れる正確な初出（表記は永埼・長埼など）は一次史料で直接確認できておらず、1237年の知行記録は研究紹介経由の確認である
  - 岬由来説と長崎氏由来説の先後関係（地名が先か苗字が先か）は確定していない
  updated: '2026-11-13'
- id: muni/42-雲仙市
  code: '422134'
  names:
    ja: 雲仙市
    reading: うんぜんし
    aliases:
    - 温泉岳
    - 温泉
    - 小浜町
    - 吾妻町
  user_terms:
  - 雲仙普賢岳のまち
  - うんぜん
  - 雲仙温泉のある市
  - 平成新山が見える市
  naming_type: 自然地名から
  formation: 合併新設
  prefecture: 長崎県
  homonyms: []
  summary: 平成17年（2005年）10月11日、国見町・瑞穂町・吾妻町・愛野町・千々石町・小浜町・南串山町の7町が新設合併して発足した市。市名は雲仙岳・雲仙温泉の「雲仙」を採ったものだが、この「雲仙」はもともと「温泉」と書いて「うんぜん」と読んだ名で、昭和9年（1934年）の国立公園指定を機に表記が「雲仙」に改められた。山号「温泉山」は大宝元年（701年）に行基が開いた寺に遡ると環境省資料は紹介している。
  first_attestation:
    era: 大宝元年
    year_western: 701
    document: 大乗院満明寺の山号「温泉（うんぜん）山」
    note: 「温泉」と書いて「うんぜん」と読む名の初出として環境省の国立公園管理計画書が紹介するもの。「雲仙」という表記は昭和9年（1934年）の国立公園指定を機に用いられるようになった
  claims:
  - text: 雲仙市の地方公共団体コードは422134である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  - text: 雲仙市は平成17年（2005年）10月11日、国見町・瑞穂町・吾妻町・愛野町・千々石町・小浜町・南串山町の7町の新設合併で発足し、市役所は当面、旧吾妻町役場に置かれた
    kind: fact
    level: E4
    status: established
    sources:
    - r6-unzen-uub
  - text: 新市名「雲仙市」の是非を問う住民アンケート（平成15年10月）では賛成が84.1％を占め、合併協議の中で早期に市名が固まっていた
    kind: fact
    level: E4
    status: established
    sources:
    - r6-unzen-uub
  - text: 雲仙の歴史は大宝元年（701年）に僧・行基が大乗院満明寺を開基して山号を温泉（うんぜん）山と号したことに始まると、環境省の雲仙天草国立公園管理計画書は紹介している
    kind: fact
    level: E2
    status: established
    sources:
    - r6-unzen-env
  - text: 「温泉」という書き表し方は、昭和9年（1934年）3月16日に雲仙が日本で最初の国立公園の一つに指定されたことを機に「雲仙」へ改められた
    kind: fact
    level: E2
    status: established
    sources:
    - r6-unzen-env
  - text: 和銅6年（713年）の『肥前国風土記』には高来郡の名の起こりと温泉の湧出が記されていたことが、同管理計画書に紹介されている
    kind: fact
    level: E2
    status: established
    sources:
    - r6-unzen-env
  - text: 昭和31年（1956年）に天草地域が国立公園へ編入されて「雲仙天草国立公園」となり、雲仙と天草は一つの国立公園の名で結ばれている
    kind: fact
    level: E2
    status: established
    sources:
    - r6-unzen-env
  column:
    title: 「温泉」が「雲仙」になった1934年
    text: 雲仙温泉の名は、長く「温泉」と書いて「うんぜん」と読む、読みと表記のずれた名だった。それが変わったのは1934年、日本で最初の国立公園の一つに選ばれたときである。環境省の資料によれば、公園の指定を機に「温泉」の書き表し方は「雲仙」へ改められた。いわば看板の掛け替えが先にあり、その71年後、合併で生まれた新市は新しいほうの表記「雲仙」をそのまま市名に迎えた。市名の由来を辿ると山や温泉の古さではなく、近代の国立公園行政に行き着く例である。
    sources:
    - r6-unzen-env
    - r6-unzen-uub
  relations:
  - pref/42
  - muni/42-島原市
  - muni/43-天草市
  unknowns:
  - 「うんぜん」という読み自体の語源（なぜ温泉を「うんぜん」と読んだか）は確認できなかった
  - 合併協議会における市名の公募件数・候補の一覧は確認できなかった（住民アンケートの結果は変遷情報データベースによる）
