  - text: 村章は「マ」の字と「川」を組み合わせた図案であり、名の文字そのものがシンボルに使われている
    kind: fact
    level: E5
    status: established
    sources:
    - x1-matsukawamura-wiki
  - text: 村域を流れる主な川は高瀬川・乳川・中房川などであり、「松川」という名の川は村内にない。旧・松川村の名が何に由来するかは資料で確認できていない
    kind: fact
    level: E5
    status: indeterminate
    sources:
    - x1-matsukawamura-wiki
  - text: 地方公共団体コードは204820である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 同じ県に二つの「まつかわ」
    text: 長野県には「まつかわ」が二つある。北安曇郡の松川村と下伊那郡の松川町だ。村のほうは1874年の合併で生まれ、合併した村の一つに既にあった古い地名をそのまま名乗り続けた。町のほうは1956年の合併で、中央アルプスから流れる片桐松川という川の名を新しく採った。同じ読みでも、村は「継いだ名」、町は「選んだ名」という対照がある。松川村役場の移住資料と松川町公式の総合計画に基づく。
    sources:
