  prefecture: 長野県
  homonyms: []
  summary: 南佐久郡の町。平成17年（2005年）に佐久町と八千穂村が合併して発足し、町名は佐久町の「佐久」と八千穂村の「穂」を取って命名された。もとの佐久町は昭和30年（1955年）に海瀬村・栄村の合併で生まれ、その名は一般公募で選ばれた。八千穂村は昭和31年（1956年）に畑八村・穂積村の合併で生まれた村である。
  first_attestation:
    era: 平成17年
    year_western: 2005
    document: 佐久穂町の発足（2005年3月20日）
    note: 町名としての初出
  claims:
  - text: 平成17年（2005年）3月20日、佐久町と八千穂村が合併して佐久穂町が発足した
    kind: fact
    level: E2
    status: established
    sources:
    - v10-sakuho-wam
    - v10-sakuho-wiki
  - text: 町名「佐久穂」は、佐久町と八千穂村の両町村の文字を取って命名された
    kind: fact
    level: E2
    status: established
    sources:
    - v10-sakuho-wam
  - text: 新しい自治体名の候補では、「八千穂町」という案が2位を占めたとされる
    kind: fact
    level: E5
    status: established
    sources:
    - v10-sakuho-yachiho-wiki
  - text: 旧佐久町は、昭和30年（1955年）2月1日に海瀬村と栄村が合併して発足し、その町名は一般公募によるものであった
    kind: fact
    level: E5
    status: established
    sources:
    - v10-sakuho-saku-wiki
  - text: 旧八千穂村は、昭和31年（1956年）9月30日に畑八村と穂積村が合併して発足した
    kind: fact
    level: E5
    status: established
    sources:
    - v10-sakuho-yachiho-wiki
  - text: 八千穂村では、合併の是非を問う住民投票で一度は反対が賛成をわずかに上回ったが、説明会を開いたうえでの再投票では賛成が上回り、合併が決議されたとされる
    kind: fact
    level: E5
    status: established
    sources:
    - v10-sakuho-yachiho-wiki
  - text: 町域のうち旧佐久町地域には、佐久市（もと臼田町）の飛地である平林がある
    kind: fact
    level: E5
    status: established
    sources:
    - v10-sakuho-wiki
  - text: 佐久穂町の地方公共団体コードは203092である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 2位は「八千穂町」だった
    text: 「佐久穂」という名は、佐久町の「佐久」と八千穂村の「穂」をつないだ合成名だが、新町名の候補では「八千穂町」が2位だったという。八千穂側には、村の名をそのまま町の名にしたいという声が根強かったことがうかがえる。しかも八千穂村では、合併を問う住民投票で一度は反対が上回り、再投票でようやく賛成が逆転した末の合併だった。両町村の文字を1字ずつ残した「佐久穂」の3文字には、対等合併の落としどころとしての苦心が凝縮されている。
    sources:
    - v10-sakuho-wam
    - v10-sakuho-yachiho-wiki
  relations:
  - pref/20
  - muni/20-佐久市
  - muni/20-北相木村
  unknowns:
