  naming_type: 中心地名の継承
  naming_note: 旧村名「苅田」の継承
  formation: 合併新設
  prefecture: 福岡県
  homonyms: []
  summary: 京都郡の町。読みは難読の「かんだ」。1889年に苅田村として発足し、1924年に町制を施行、1955年に小波瀬村・白川村と対等合併して現在の町域となった。町内には神田町という町名が残るが、「かんだ」の読みが神田に由来し字を苅田に改めたという説は検証できなかった。1975年度以降地方交付税の不交付団体であり続け、北九州空港は町内の埋立地に立地する。
  first_attestation:
    era: 明治時代
    year_western: 1889
    document: 町村制による苅田村の発足（1889年4月1日）
    note: 「苅田」はこれ以前から存在した地名とみられるが、初出文献は確認できなかった
  claims:
  - text: 1889年4月1日に苅田村・小波瀬村・白川村が発足し、1924年8月1日に苅田村が町制を施行して苅田町となった
    kind: fact
    level: E2
    status: established
    sources:
    - upg-p2-kanda-geoshape
  - text: 1955年1月1日に苅田町・小波瀬村・白川村が合併し、苅田町となった
    kind: fact
    level: E2
    status: established
    sources:
    - upg-p2-kanda-geoshape
    - upg-p2-kanda-mayor
  - text: 町内には神田町1〜3丁目という町名が現存する。町名「苅田」の読み「かんだ」と神田との関係は確認できていない
    kind: fact
    level: E2
    status: established
    sources:
    - upg-p2-kanda-nta
  - text: 平尾台の青龍窟には、景行天皇が洞窟を住処とする土蜘蛛を退治したという伝説が伝わる
    kind: legend
    level: E2
    status: indeterminate
    sources:
    - upg-p2-kanda-chosonkai-seiryu
    - upg-p2-kanda-chusho
  - text: 苅田町は1975年度（昭和50年度）以降、地方交付税の不交付団体であり続けており、福岡県内の不交付団体は苅田町のみである
    kind: fact
    level: E2
    status: established
    sources:
    - upg-p2-kanda-pref-kofu
  - text: 苅田町の地方公共団体コードは406210である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 町の中に残る「神田」と、空港のある町
    text: 「苅田（かんだ）」という読みの手がかりは、町の中に今もある。苅田町には字「神田（かんだ）」が現存し、1960年の町名整理では神田を含む区域から神田町1〜3丁目が生まれた。音は「かんだ」で共通するのに、町名は「苅田」、字は「神田」。読みが先にあって字が分かれたのか、それとも別の経緯かは、まだ確かめられていない。一方で苅田町は1975年度から半世紀近く地方交付税を受け取らない「不交付団体」であり続け、2006年開港の北九州空港は町内の埋立地に立つ。難読の名と、空港と工場の町という現代の顔との落差が、この町の面白さである。
    sources:
    - r5-kanda-wiki
  relations:
  - pref/40
  unknowns:
  - 「苅田（かんだ）」の読みの由来（神田からの転訛という説を含む）は検証できなかった
  - 「苅田」表記の初出文献は確認できなかった
  updated: '2026-11-13'
