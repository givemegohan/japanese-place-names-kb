  prefecture: 沖縄県
  homonyms: []
  summary: もとの名は読谷山（ゆんたんざん）。『おもろさうし』には「よんたむさ」「よんたもさ」と記され、袋中上人の『琉球往来』は「四方田狭」の宛字を当てたと伝わる。1908年に読谷山村となり、1946年に読谷村へ改称した。2014年に岩手県滝沢村が市制を施行したことで、日本一人口の多い村となった。
  first_attestation:
    era: 16〜17世紀（琉球王国時代）
    year_western: null
    document: おもろさうし
    note: 読谷山は「よんたむさ」「よんたもさ」と記される（読谷村史編集室の紹介による）。『おもろさうし』の成立は1531年から1623年にかけて
  claims:
  - text: もとは沖縄語でこの地域を「ゆんたんざ（読谷山）」と呼び、現在の村の沖縄語名は「ゆんたんじゃ（/juntandʒa/）」「ゆんだんざ（/juntandza/）」である
    kind: fact
    level: E5
    status: established
    sources:
    - s8-yomitan-wiki
  - text: 読谷村史編集室によれば、『おもろさうし』では読谷山は「よんたむさ」「よんたもさ」と記され、ほかに地理に由来する中山地域の遠い北方を意味する「大北」とも呼ばれた
    kind: fact
    level: E2
    status: established
    sources:
    - s8-yomitan-sonsi
  - text: 袋中上人が著した『琉球往来』の中で読谷山は「狭間に広がる田」すなわち「四方田狭」と宛てられており、これが地名由来を考えるヒントになると読谷村史編集室は紹介する
    kind: fact
    level: E2
    status: inferred
    sources:
    - s8-yomitan-sonsi
  - text: 1673年（寛文13年）に恩納間切が創設された際、読谷山間切の主邑だった古読谷山（山田の古名）が恩納間切へ編入されたため、読谷村には間切名と同名の字（字読谷）が存在しない
    kind: fact
    level: E2
    status: established
    sources:
    - s8-yomitan-sonsi
  - text: 1908年（明治41年）に読谷山間切が読谷山村に改称され、1946年（昭和21年）12月に村名が「読谷村」に変更された（読谷村公式の沿革）
    kind: fact
    level: E2
    status: established
    sources:
    - s8-yomitan-official
  - text: 1442年頃、読谷山按司・護佐丸が座喜味城を築城したと、読谷村公式の沿革は伝える
    kind: fact
    level: E2
    status: established
    sources:
    - s8-yomitan-official
  - text: 2014年（平成26年）1月1日に岩手県岩手郡滝沢村が市制を施行したことにより、読谷村が日本国内で人口最大の村となった
    kind: fact
    level: E4
    status: established
    sources:
    - upg-t2-yomitan-shimpo
  - text: 地方公共団体コードは473243である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 読谷村に「字読谷」がない理由
    text: 多くの間切には、間切名を冠した同名の字（同村）があった。北谷には字北谷があり、宜野湾には字宜野湾がある。ところが読谷村には字読谷がない。読谷村史編集室の説明によれば、1673年に国頭方恩納間切が創設された折、読谷山間切の主邑だった古読谷山（現在の恩納村山田の古名）を含む8か村が恩納間切へ編入されてしまったためだという。村の中心だった集落と、その名の本体が、現在の村域の外に出てしまった珍しい例である。残った村は1946年に「読谷山」から「読谷」へ名を短くし、日本一人口の多い村になった今も、その名を名乗り続けている。
    sources:
    - s8-yomitan-sonsi
  relations:
  - pref/47
  - muni/47-恩納村
  - muni/47-嘉手納町
  unknowns:
  - 「ゆんたん（読谷）」の語源の決定的な説明は確認できなかった（『琉球往来』の「四方田狭」の宛字がヒントとされるにとどまる）
  - 『おもろさうし』における「よんたむさ」の正確な巻・おもろ番号は未確認
  updated: '2026-11-13'
- id: muni/47-豊見城市
  code: '472123'
  names:
    ja: 豊見城市
    reading: とみぐすくし
    aliases:
    - 豊見城村
    - 豊見城間切
    - とよみ城
  user_terms:
  - とみぐすく
  - 響（とよ）むまち
  - 村から直接市になったまち
  - 那覇のベッドタウン
  naming_type: 藩名・城名から
  formation: 単独発足
  prefecture: 沖縄県
  homonyms: []
  summary: 沖縄本島南部、那覇市に隣接する市で、平成14年（2002年）4月1日に豊見城村が合併を経ず単独で市制を施行した。村から直接市になった珍しい例である。「豊見城（とみぐすく）」は琉球のグスクの名に由来し、南山王の従弟・汪応祖が築いた城を「とよみ城」と美称したことに始まると市は説明する。「とよむ」とは名声が高く鳴り響くさまを表す古琉球の美称で、その音が時代を経て「とみ」へ転じたとされる。
  first_attestation:
    era: null
    year_western: null
    document: 『球陽』
    note: 琉球王府の史書『球陽』（18世紀の編纂）が、14世紀前半の三山対立期の記事として南山王に従った地方の中に「豊見城」の名を記していることが市の資料で紹介されている。事象の年代と文献の成立が大きく離れているため、初出の年は特定しない
  claims:
  - text: 豊見城市の地方公共団体コードは472123である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  - text: 豊見城市は平成14年（2002年）4月1日、豊見城村が合併を経ずに単独で市制を施行して発足した、市制施行の要件である人口50,000人を達成しての施行だった
    kind: fact
    level: E2
    status: established
    sources:
    - s5-tomigusuku-plan4
  - text: 前身の豊見城村は明治41年（1908年）の島嶼町村制により、豊見城間切の11字をもって誕生した
    kind: fact
    level: E2
    status: established
    sources:
    - s5-tomigusuku-shiryo
  - text: 琉球の歴史書『球陽』によれば、14世紀の前半に沖縄本島で三山の対立が明確になったとき、南山王に従った地方の中に「豊見城」の名が記されていることが市の資料で紹介されている
    kind: fact
    level: E2
    status: established
    sources:
    - s5-tomigusuku-shiryo
  - text: 地名の起こりとして、南山王の従弟・汪応祖（ワンオウソ）が漫湖を眺望する丘陵上にグスクを築き、「とよみ城（ぐすく）」と称したことが伝えられている
    kind: legend
    level: E2
    status: established
    sources:
    - s5-tomigusuku-plan
    - s5-tomigusuku-shiryo
  - text: 「とよむ（鳴響む）」とは『おもろそうし』に記載もある美称の一つで、名声の高いさまを表しており、時代を経て「とよみ」が「とみぐすく」という読みに転じたと市は説明している
    kind: fact
    level: E2
    status: established
    sources:
    - s5-tomigusuku-plan
  - text: 近世の豊見城間切は現在の市域以外に那覇市・糸満市・八重瀬町の一部をも含む大きな領域をもっていた
    kind: fact
    level: E2
    status: established
    sources:
    - s5-tomigusuku-shiryo
  column:
    title: 合併しないで「村」からいきなり「市」へ
    text: 平成の大合併では、多くの自治体が合併して市になった。しかし豊見城市は2002年、合併を一切せず、豊見城村が単独のまま市制を施行した。那覇市に隣接する立地で宅地開発が進み、市制の要件である人口5万人に村のまま到達したためである。村から直接市になるのは全国的にも珍しく、沖縄県内では初めてのケースだった。その市名は、14世紀の南山の時代に築かれたグスクの名をそのまま受け継いだもの。人口増加率と年少人口の多さで知られる新しい住宅都市が、県内最古級の城の名前を背負っているという取り合わせが、この市の面白さである。
    sources:
    - s5-tomigusuku-plan4
    - s5-tomigusuku-shiryo
  relations:
  - pref/47
  unknowns:
  - 『球陽』の「豊見城」の記事の原文は二次資料経由でしか確認できていない
  - 「とよみ」が「とみ」へ転じた時期や過程は、市の資料にも詳述がなく確認できなかった
  - 豊見城村が単独市制を選択した当時の議論の詳細（合併協議の有無を含む）は確認できなかった
  updated: '2026-11-13'
- id: muni/47-那覇市
  code: '472018'
  names:
    ja: 那覇市
    reading: なはし
    aliases:
    - 那波
    - 奈波
    - 浮島
  user_terms:
  - 那覇の名前の由来 漁場って本当
  - ナーファ ナファ 那覇の読み方
  - 首里と那覇はどう違う
  - 那覇市はいつできた
  naming_type: 中心地名の継承
  naming_note: 港町「那覇」の名を継承し、那覇区への市制施行により市となった
  formation: 単独発足
  prefecture: 沖縄県
  homonyms: []
  summary: 市名は琉球王国の貿易港「那覇」に由来する。「なは」の語源については、島袋源七が提唱し伊波普猷が支持した「ナバ（漁場）」説が通説とされてきたが、反論もあり確定していない。王国の記録が伝える茸の形の石にちなむ命名伝承とは別系統の話として分けて扱う。王都・首里の外港だった那覇は、1879年に県庁が置かれて県都となり、1921年に市制が施行された。
  first_attestation:
    era: 文明3年
    year_western: 1471
    document: 海東諸国紀
    note: 朝鮮の申叔舟が琉球の港を「那波」と記したものが、確認できる古い記録の一つ。当時この地が「ナバ」と呼ばれていた可能性を示すと『沖縄県の地名』は記す（国立国会図書館レファレンスが紹介）
  claims:
  - text: 市名「那覇」は港町の名に由来し、1921年（大正10年）5月20日、特別区制が廃されて一般市制が施行され、那覇区が那覇市となった
    kind: fact
    level: E2
    status: established
    sources:
    - f-cap-naha-city-ayumi
  - text: 王国時代の那覇は、那覇川（現在の国場川）と安里川の注ぐ湾に浮かぶ島「浮島」であり、1451年（享徳3年）に尚金福王が長虹堤を築いて首里側と結び、那覇四町（西町・東町・若狭町・泉崎）を形成したと那覇市公式は説明する
    kind: fact
    level: E2
    status: established
    sources:
    - f-cap-naha-city-ayumi
  - text: 王都は首里に置かれ、那覇はその外港・商都として発展したが、1879年（明治12年）の廃藩置県で県庁が那覇に置かれ、政治・経済・文化の中心は首里から那覇へ移った
    kind: fact
    level: E2
    status: established
    sources:
    - f-cap-naha-city-ayumi
  - text: 『海東諸国紀』に「那波」とあって、15〜16世紀にはこの地が「ナバ」と唱えられていた可能性が高いと、『沖縄県の地名』（日本歴史地名大系・沖縄県編）は記している
    kind: fact
    level: E2
    status: established
    sources:
    - f-cap-kaidoushokki
    - f-cap-naha-ndl
  - text: 「ナバ」の意味について、島袋源七が提唱し伊波普猷が支持・立証した漁場説が通説とされてきたが、海に面しない「ナバ」系の地名もあることなどから一仮説にとどまるとする批判的な見解もあり、語源は確定していない
    kind: fact
    level: E2
    status: contested
    sources:
    - f-cap-naha-ndl
  - text: 『琉球国由来記』巻八「那覇由来記」は、呉姓我那覇の屋敷の中に茸（世俗にナバという）の形に似た石があり、人々がこの地を「ナハ」と呼ぶようになり、後に字を「那覇」に改めたと伝える
    kind: legend
    level: E2
    status: established
    sources:
    - f-cap-ryukyu-yuraiki
    - f-cap-naha-ndl
  - text: 那覇市公式は、那覇の読みは現地の「ナーファ」「ナファ」から転訛したもので、それまでナハ・ナファ・ナワ・ナバなどと呼ばれていた読みが、1934年（昭和9年）3月に日本放送語審査委員会の決定で「ナハ」に統一されたと説明している
    kind: fact
    level: E2
    status: established
    sources:
    - f-cap-naha-city-name
  - text: 現在の市域は、1954年（昭和29年）に首里市・小禄村、1957年（昭和32年）に真和志市を合併して形成されたもので、王国期の那覇（浮島とその周辺）とは範囲が大きく異なる
    kind: fact
    level: E2
    status: established
    sources:
    - f-cap-naha-city-siryou
  column:
    title: 王都ではない港町が、県都になった
    text: 琉球王国の中心は、丘の上の王都・首里だった。那覇はその足元に浮かぶ「浮島」の港町で、冊封使や交易船を迎える玄関口だったが、政治の中心ではなかった。その力関係が逆転したのは1879年、廃藩置県で県庁が那覇に置かれてからである。首里城は象徴として残り、行政・経済の実務は港町へ移った。現在の那覇市は1950年代に首里市などを合併しており、いま市域に含まれる首里は「もとの王都を後から市域に迎えた」形になっている。港町の名前が、王都を含む市の名前になったわけである。
    sources:
    - f-cap-naha-city-ayumi
    - f-cap-naha-city-siryou
  relations:
  - pref/47
  unknowns:
  - 「ナバ／ナハ」の語源は確定しておらず、漁場説も仮説の域を出ないとする批判的見解がある
  - 漢字表記「那覇」の厳密な初出は特定できなかった（確認できる古い用例は『海東諸国紀』の「那波」である）
  - 『琉球国由来記』の怪石伝承は、茸の形の石そのものが戦前に那覇の東町にあったとする伝えもあるが、史実としての検証はできないため伝承として扱う
  updated: '2026-11-13'
- id: muni/47-金武町
  code: '473146'
  names:
    ja: 金武町
    reading: きんちょう
    aliases:
    - 金武間切
    - 金武村
  user_terms:
  - きん
  - チン
  - タコライスの町
  - キャンプハンセンの町
  naming_type: 旧行政区画名の継承
  formation: 単独発足
  prefecture: 沖縄県
  homonyms: []
  summary: 沖縄本島中央部の東海岸、国頭郡の町。「金武」の地名がいつ発生したのかは定かではないが、1501年の玉陵碑文に「きんのあんし（金武の按司）」とあり、この頃には金武間切が置かれていたと考えられている。中世から近世の金武間切は現在の恩納村・宜野座村・名護市の一部を含む広大な領域だった。伝統的な読みは方言の「ちん」で、公式読みの「きん」とは層が異なる。1908年に金武村、1980年に金武町となった。
  first_attestation:
    era: 明応10年
    year_western: 1501
    document: 玉陵碑文
    note: 金武町公式の指定文化財資料が、玉陵碑文（1501年）に尚真王第六男の尚享仁が「きんのあんし」と記されることを紹介するもの。原碑文を直接確認していないため、主張側ではE2として扱う
  claims:
  - text: 総務省「地方公共団体コード一覧」で、金武町の団体コードは473146とされている
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  - text: 「金武」の地名がいつ発生したのかは定かではないと、金武町公式の指定文化財資料は明記している
    kind: fact
    level: E2
    status: indeterminate
    sources:
    - s7-kin-bunkazai
  - text: 玉陵碑文（1501年）に尚真王第六男の尚享仁が「きんのあんし（金武の按司）」と記されており、この時点で金武間切が創設されていたと考えられていると、金武町公式の指定文化財資料は紹介している
    kind: fact
    level: E2
    status: established
    sources:
    - s7-kin-bunkazai
  - text: 『おもろさうし』巻一七の一に「きんのよのぬし（金武の世の主）」の名がみえ、彼が支配していた領域が金武間切となったと推測されると、『日本歴史地名大系』は記している
    kind: fact
    level: E3
    status: established
    sources:
    - s7-kin-kotobank-taikei
  - text: 金武間切の伝統的な読みは「ちん」で、方言でも金武は「ちん」と呼ばれており、現在の公式読み「きん」とは異なる読みの層がある
    kind: fact
    level: E3
    status: established
    sources:
    - s7-kin-kotobank-taikei
  - text: 中世の金武間切は国頭方の五箇間切の一つで、現在の恩納村から宜野座村、名護市の久志・辺野古を含む広大な領域にまたがっていたと、金武町の総合計画は記している
    kind: fact
    level: E2
    status: established
    sources:
    - s7-kin-sougoukeikaku
  - text: 1673年（尚貞5年）に金武間切の中から恩納・瀬良垣・安富祖・名嘉真の四村を割いて恩納間切が創設され、金武間切は屋嘉・伊芸・金武・漢那・惣慶・宜野座・古知屋の七箇字の範囲となったと、金武町の総合計画は記している
    kind: fact
    level: E2
    status: established
    sources:
    - s7-kin-sougoukeikaku
  - text: 廃藩置県を経て金武間切は金武村となり、復帰後の1980年に町制を施行して金武町が誕生したと、金武町観光協会は紹介している
    kind: fact
    level: E4
    status: established
    sources:
    - s7-kin-kankou
  column:
    title: 「きん」と読むか「ちん」と読むか
    text: 金武の伝統的な読みは「ちん」で、間切も「ちんまぎり」と呼ばれてきた。公式読みの「きん」は近代以降の漢字音によるもので、同じ漢字に二つの読みの層が重なっている。南北に広がっていた頃の金武間切の威勢は、琉歌「仲間節」に「仲間からかいとて、久志辺野古までも金武の御前がなし」と歌われた。なお金武湾はペリーの「日本遠征記」にバロー湾（BARROW BAY）と記されている。
    sources:
    - s7-kin-kotobank-taikei
    - s7-kin-sougoukeikaku
  relations:
  - pref/47
  - muni/47-宜野座村
  - muni/47-恩納村
  unknowns:
  - 「金武」の語源と地名の発生時期（町公式資料も定かではないとする）
  - 玉陵碑文の原文を直接確認できていないこと
