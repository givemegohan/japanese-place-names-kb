  prefecture: 鹿児島県
  homonyms: []
  summary: 昭和24年（1949年）に単独で市制を施行した市で、平成の大合併でも他市町と合併しなかった。市名は近世の浦の名「枕崎浦」に遡り、江戸時代の市域は薩摩国川辺郡の鹿篭郷だった。「枕崎」の名の由来として『枕崎市史』は、箱枕に入った金仏が鹿籠浦の瀬崎に漂着した故事にちなむと伝える。カツオ漁と鰹節の町として知られるが、地名の「枕」は鰹節の形ではなく、この漂着の故事に結びつけて語られている。
  first_attestation:
    era: 江戸時代
    year_western: 1800
    document: 諸郷村附並浦附（寛政12年書写）
    note: 『日本歴史地名大系』が鹿籠郷の浦として「枕崎浦」がみえる用例として紹介するもの。それ以前の用例は確認できなかった
  claims:
  - text: 枕崎市の地方公共団体コードは462047である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  - text: 枕崎市は昭和24年（1949年）に枕崎町が単独で市制を施行して発足した
    kind: fact
    level: E3
    status: established
    sources:
    - s4-makurazaki-kotobank
  - text: 枕崎町は大正12年（1923年）の町制施行で誕生し、それ以前の村は東南方村と称していた
    kind: fact
    level: E2
    status: established
    sources:
    - s4-makurazaki-city-nenpyo
  - text: 江戸時代、市域は薩摩国川辺郡の鹿籠（鹿篭）郷に属し、枕崎はその浦の一つで、寛政12年（1800年）書写の諸郷村附並浦附に「枕崎浦」とみえる
    kind: fact
    level: E3
    status: established
    sources:
    - s4-makurazakiura-kotobank
  - text: 市名の由来として『枕崎市史』は、かつて箱枕に入った金仏が鹿籠浦の瀬崎（せざき）に漂着したという故事にちなむと伝えている
    kind: legend
    level: E3
    status: established
    sources:
    - s4-makurazaki-kotobank
  - text: 枕崎はカツオ漁と鰹節製造で知られ、「枕崎鰹節」は令和7年（2025年）に地理的表示（GI）保護制度へ登録された
    kind: fact
    level: E2
    status: established
    sources:
    - s4-makurazaki-maff-gi
  column:
    title: 「枕」は鰹節の形ではなかった
    text: カツオの町・枕崎の「枕」は、鰹節の形が枕に似ているから、と思われがちである。しかし『枕崎市史』が伝える由来は別の話で、箱枕に入った金仏が鹿籠浦の瀬崎（せざき）に漂着した故事にちなむという。つまり順序としては、港の名「枕崎」が先にあり、後にこの地が鰹節の一大産地になった。鰹節が枕の形をしているのは偶然の符合だが、その符合のおかげで「枕崎＝鰹節の形」という分かりやすい俗説が生まれやすい土地でもある。市史の伝える故事自体も伝説の層として読むべきもので、事実として確定した語源ではない。
    sources:
    - s4-makurazaki-kotobank
    - s4-makurazaki-maff-gi
  relations:
