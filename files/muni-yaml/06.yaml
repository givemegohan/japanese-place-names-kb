prefecture_code: '06'
records:
- id: muni/06-上山市
  code: '062073'
  names:
    ja: 上山市
    reading: かみのやまし
    aliases:
    - 上大山
    - 上ノ山
    - 上野山
  user_terms:
  - かみのやま温泉
  - 上山城の城下町
  - 上山市の名前の由来
  naming_type: 一部の地名
  prefecture: 山形県
  homonyms: []
  summary: 山形盆地の南にある城下町・温泉の市で、市名は旧町名「上山（かみのやま）」の継承である。「かみのやま」の起源には、古代の山方郷に対する「上ノ山方」の意とする説、古名「上大山」に由来するとみる推定など諸説があり確定していない。室町時代に上山氏が入って城下町が形成され、江戸時代は上山藩の城下町・羽州街道の宿場町として栄えた。1954年に上山町など6町村が合体して上山市となった。
  first_attestation:
    era: 安元2年
    year_western: 1176
    document: 『八条院領目録』
    note: 初見とされる大山庄の庄域に上山盆地が含まれ、後の上大山庄に当市域が含まれたと推定される段階であり、「上山」の語そのものの初出ではない（『日本歴史地名大系』の紹介による）
  claims:
  - text: 『日本歴史地名大系』は、「かみのやま」の地名の起源には諸説があるとし、古代の山方（やまがた）郷に対して「上ノ山方」の意とする説（『大日本地名辞書』）、『上山温泉記』の神山説、『上山見聞随筆』の四神相応説を挙げる
    kind: fact
    level: E3
    status: contested
    sources:
    - t6-kaminoyama-kotobank
  - text: 安元2年（1176）に初見する大山庄（『八条院領目録』）の庄域に上山盆地も含まれ、のちに上下に分かれた大山庄のうち上大山庄に当市域が含まれたと推定され、地名起源の一つともされる（『日本歴史地名大系』）
    kind: fact
    level: E3
    status: contested
    sources:
    - t6-kaminoyama-kotobank
  - text: 上山市の公式資料は、「かみのやま」の地名は古くは「上大山（かみのおおやま）」といわれ、その後「上の山・上野山」などと書かれ、呼ばれてきたと説明する
    kind: fact
    level: E2
    status: established
    sources:
    - t6-kaminoyama-city-plan
  - text: 『ブリタニカ国際大百科事典』は、地名は今の山形に対して「上の山形」といわれていたことに由来するという説を紹介する
    kind: fact
    level: E3
    status: contested
    sources:
    - t6-kaminoyama-kotobank
  - text: 室町時代初期に最上満長が当地を領して「上山殿」と称され、天文4年（1535）に上山義忠が月岡城（上山城）を築城し、前川の流路を変えて城下町として整備したのが現在の市街地の原形である
    kind: fact
    level: E3
    status: established
    sources:
    - t6-kaminoyama-kotobank
    - t6-kaminoyama-city-plan
  - text: 上山温泉の鶴脛（つるはぎ）の湯は、長禄2年（1458）に僧月秀が、鶴が傷を癒やしているのを見て発見したと伝えられる
    kind: legend
    level: E3
    status: established
    sources:
    - t6-kaminoyama-kotobank
  - text: 上山市は1954年（昭和29年）10月1日に上山町・西郷村・本庄村・東村・宮生村・中川村が合体して発足し、1957年に山元村を編入した
    kind: fact
    level: E3
    status: established
    sources:
    - t6-kaminoyama-kotobank
  - text: 上山市の総務省地方公共団体コードは062073である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 市章になった、伝説の鶴
    text: かみのやま温泉の開湯は、長禄2年（1458）に僧月秀が鶴の傷を癒す姿を見て湯を発見したという伝説で語られる。この鶴は市のシンボルにもなっていて、上山市の市章は「上山」の文字に、かみのやま温泉のルーツともいえる鶴を象ったデザインだと市は説明する。城下町・宿場町・温泉町という三つの顔を持つ町の、最も古い物語が鶴の伝説なのである。
    sources:
    - t6-kaminoyama-kotobank
    - t6-kaminoyama-city-suji
  relations:
  - pref/06
  unknowns:
  - 「かみのやま」の語源は諸説が併存し確定していない。最上川の上流という位置に由来するという単純な説明は、専門辞典では確認できなかった
  - 「上山」の語そのものの文献上の初出（年・文書）は未確認
  updated: '2026-11-13'
- id: muni/06-南陽市
  code: 062138
  names:
    ja: 南陽市
    reading: なんようし
    aliases:
    - 赤湯町
    - 宮内町
    - 和郷村
  user_terms:
  - 赤湯温泉の市
  - 鶴の恩返しの里
  - 南陽市の名前の由来
  naming_type: 文献から命名
  prefecture: 山形県
  homonyms: []
  summary: 1967年に赤湯町・宮内町・和郷村が合併してできた市で、市名「南陽」は在地の地名ではなく、当時の山形県知事が贈った古典由来の名である。中国の古地名「南陽」と、『太平記』にも出てくる不老長生の霊泉「南陽の菊水」にちなみ、「北に丘陵、南に沃野、まことに住み良いところ」という土地柄を表す名として選ばれた。旧中心地の赤湯は温泉、宮内は熊野大社で知られる。
  first_attestation:
    era: 昭和42年
    year_western: 1967
    document: 命名そのもの（合併による市制施行）
    note: 「南陽」は1967年4月1日の市制施行時に新市名として誕生した借用名で、在地の古地名ではない。名の典拠は中国の古地名と古典の故事にある
  claims:
  - text: 南陽市は1967年（昭和42年）4月1日に、赤湯町・宮内町・和郷村の2町1村が合併して誕生し、山形県内で13番目の一番若い市となった（南陽市公式「プロフィール」）
    kind: fact
    level: E2
    status: established
    sources:
    - t6-nanyo-city-profile
  - text: 新市名については様々な意見が出されたが、「南陽」は当時の山形県知事・安孫子藤吉から贈られた名前である（南陽市公式）
    kind: fact
    level: E2
    status: established
    sources:
    - t6-nanyo-city-profile
  - text: 知事は命名の意味として、「南陽」は古来中国で用いられた地名で、「北に丘陵、南に沃野、まことに住み良いところ」と土地柄を表現し、不老長生の霊泉「菊水」の流れる河南省の南陽が代表であると説いた（南陽市公式）
    kind: fact
    level: E2
    status: established
    sources:
    - t6-nanyo-city-profile
  - text: 「南陽の菊水」は『太平記』にも出てくる故事で、国民にも古来から深い関心を呼ぶ名であることが、命名を後押しする理由として知事によって挙げられた（南陽市公式）
    kind: fact
    level: E2
    status: established
    sources:
    - t6-nanyo-city-profile
  - text: 合併した赤湯町・宮内町・和郷村のいずれの名も新市名には採用されず、在地の地名ではない第三の名が選ばれた
    kind: fact
    level: E2
    status: established
    sources:
    - t6-nanyo-city-profile
  - text: 旧中心地の一つ「赤湯」の名は、寛治7年（1093）に源義家の弟義綱が湯を発見し、傷ついた家来たちを湯に入れるとたちまち傷が治り、血で深紅に染まった湯から「赤湯」と呼ばれるようになったという伝説に由来すると伝えられる
    kind: legend
    level: E2
    status: established
    sources:
    - t6-nanyo-city-akayu
  - text: 南陽市公式は赤湯温泉の由来には諸説があるとし、寛治7年（1093年）の説のほか、鎌倉時代初期の説、正和元年（1312年）の説を挙げている
    kind: fact
    level: E2
    status: contested
    sources:
    - t6-nanyo-city-akayu-yurai
  - text: 市名が同じという由縁から中国河南省南陽市との交流が始まり、1988年（昭和63年）10月6日に両市は友好都市を締結した
    kind: fact
    level: E2
    status: established
    sources:
    - t6-nanyo-city-koryu
  - text: 南陽市の総務省地方公共団体コードは062138である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 知事が贈った、中国生まれの市名
    text: 合併した3町村のどの名も使わないと決めたとき、新市名「南陽」を贈ったのは当時の山形県知事だった。典拠は中国の古地名で、『太平記』に語られる不老長生の霊泉「南陽の菊水」の故事まで引いた、格調高い命名である。面白いのはその後で、名の「本家」である中国河南省の南陽市と、同じ名を持つという縁から1988年に友好都市が結ばれた。借り物の名前が、やがて本物同士の姉妹都市関係を生んだ珍しい例である。
    sources:
    - t6-nanyo-city-profile
    - t6-nanyo-city-koryu
  relations:
  - pref/06
  unknowns:
  - 合併協議の場で「南陽」以外にどのような市名候補が挙がり、どのような経緯で知事の贈名に決着したかの詳細は、公式資料では確認できなかった
  - 宮内・和郷といった旧地名そのものの語源は未調査（本レコードでは市名の層を中心に記録した）
  updated: '2026-11-13'
- id: muni/06-天童市
  code: '062103'
  names:
    ja: 天童市
    reading: てんどうし
    aliases:
    - 成生
  user_terms:
  - 将棋駒のまち天童
  - 人間将棋の天童
  - 天童市の名前の由来
  naming_type: 一部の地名
  prefecture: 山形県
  homonyms: []
  summary: 将棋駒の産地として知られる市で、市名は旧町名「天童」の継承である。「天童」の由来については、天から童子が舞い降りたという行基伝説、南北朝時代の武将・北畠天童丸に由来するという説、アイヌ語源説などが言われるが、天童市自身が「定かではありません」と明記している。14世紀後半に天童氏が舞鶴山に城を築いて城下町が形成され、1958年に市制を施行した。
  first_attestation:
    era: null
    year_western: null
    document: null
    note: 「天童」の地名としての確実な初出は未確認。南北朝時代の「北畠天童丸」という人名に由来するという説がある段階にとどまる
  claims:
  - text: 天童市の統計書は、「天童」の地名については、アイヌ語源説や僧行基にまつわる2人の護法童子伝説、南北朝時代の北畠天童丸住居説などに由来するといわれているが「定かではありません」と明記する
    kind: fact
    level: E2
    status: indeterminate
    sources:
    - t6-tendo-city-tokei
  - text: 『ブリタニカ国際大百科事典』は、地名は南北朝時代に北畠天童丸が根拠地としたことに由来するという説を紹介する
    kind: fact
    level: E3
    status: contested
    sources:
    - t6-tendo-kotobank
  - text: 舞鶴山の山頂で念仏を唱えていた行基のもとへ、天から護衛童子と摩竭童子の2人の童子が舞い降り、山を天童山と名付けたことから、その四方の里が天童と呼ばれるようになったという伝説が、天童市の公式ページで「名前の由来（伝説）」として紹介されている
    kind: legend
    level: E2
    status: established
    sources:
    - t6-tendo-city-yurai
  - text: 1375年に里見頼直が舞鶴山に天童城を築いて本拠を移し、この一族が天童氏を称した。以後、天童は最上氏一族・天童氏の城下町として発展したが、天正12年（1584年）に天童氏は最上義光に追放された
    kind: fact
    level: E3
    status: established
    sources:
    - t6-tendo-city-hayawakari
    - t6-tendo-kotobank
  - text: 市域の旧中心地の一つ成生（なりう）は、10世紀頃に藤原摂関家の荘園・成生荘が成立した土地で、「天童」より古い地名の層を持つ
    kind: fact
    level: E2
    status: established
    sources:
    - t6-tendo-city-tokei
  - text: 将棋駒づくりは、江戸時代に下級武士の内職として始められたものが地場産業として発展したものである（『ブリタニカ国際大百科事典』）
    kind: fact
    level: E3
    status: established
    sources:
    - t6-tendo-kotobank
  - text: 天童市は1954年に天童町・成生村・蔵増村・津山村・田麦野村・山口村・寺津村が合体し、1958年（昭和33年）に市制を施行、1962年に豊栄村を編入した
    kind: fact
    level: E3
    status: established
    sources:
    - t6-tendo-kotobank
  - text: 天童市の総務省地方公共団体コードは062103である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 市役所が「定かではありません」と書く地名
    text: 天童の名の由来は、市の統計書がはっきり「定かではありません」と書く珍しいケースである。候補は三つ。天から二人の童子が舞い降りたという行基の伝説、南北朝の武将・北畠天童丸の居城説、そしてアイヌ語源説。どれも決め手を欠くが、その伝説の舞台である舞鶴山では毎春、甲冑姿の人間が将棋の駒になる「人間将棋」が行われる。由来が一つに決まらないことも、この町の物語の豊かさの一部である。
    sources:
    - t6-tendo-city-tokei
    - t6-tendo-city-yurai
  relations:
  - pref/06
  unknowns:
  - 「天童」の語源・初出は確定しておらず、市公式資料自体が「定かではない」としている。アイヌ語源説の具体的な語形も確認できなかった
  - 北畠天童丸の実在と天童居城についても、確かな史料は残っていないとされる
  updated: '2026-11-13'
- id: muni/06-寒河江市
  code: '062065'
  names:
    ja: 寒河江市
    reading: さがえし
    aliases:
    - 寒河江荘
    - 寒河江庄
  user_terms:
  - さくらんぼの里さがえ
  - 寒河江の名前の由来
  - さがえ
  naming_type: 一部の地名
  prefecture: 山形県
  homonyms: []
  summary: 最上川の西岸、山形盆地の西端にある市で、市名は平安時代の荘園「寒河江荘」に遡る地名の継承である。鎌倉時代に大江広元が地頭職を得て、その子孫は荘名を名字として寒河江氏を称し、城下町が発展した。「寒川の江」が転じたという民間語源が伝えられる。1954年に寒河江町ほかが合併して市制を施行した。
  first_attestation:
    era: 平安時代
    year_western: null
    document: null
    note: 寒河江庄は平安時代後期から見える摂関家領の荘園とされるが、「寒河江」の語の文献上の初出（年・文書）は今回確認できなかった。寒河江市の沿革では天仁元年（1108）に関白藤原忠実が地頭に任ぜられたことを起点とする
  claims:
  - text: 寒河江荘は平安時代の中期に成立した摂関家領の荘園であり、寒河江市の沿革では天仁元年（1108）に関白藤原忠実が地頭に任ぜられたことを市の成立の起点とする
    kind: fact
    level: E2
    status: established
    sources:
    - t6-sagae-city-kyoiku
    - t6-sagae-city-zeimu
  - text: 鎌倉初期に大江広元が寒河江荘の地頭職を得て、その子孫は荘名を名字の地として寒河江氏を称した。寒河江は鎌倉時代から天正12年（1584）まで大江氏の城下町として発展した
    kind: fact
    level: E3
    status: established
    sources:
    - t6-sagae-kotobank-uji
    - t6-sagae-kotobank
  - text: 「寒河江」は、古代に関東地方から入植してきた寒川の農民が定住した当地は入江が多かったため、初めは「寒川の江」と呼ばれ、次第に「さがえ」と呼ばれるようになった、といわれている（『ブリタニカ国際大百科事典』が紹介する民間語源）
    kind: legend
    level: E3
    status: contested
    sources:
    - t6-sagae-kotobank
  - text: 市域の平野部を寒河江川が東流し、最上川に合流する。荘名・地名と川名のどちらが先かは、今回の調査では確認できなかった
    kind: fact
    level: E3
    status: established
    sources:
    - t6-sagae-kotobank
  - text: 寒河江市は1954年（昭和29）8月1日に寒河江町・西根村・柴橋村・高松村・醍醐村が合併して発足し、同年11月に白岩町・三泉村を編入した
    kind: fact
    level: E2
    status: established
    sources:
    - t6-sagae-city-zeimu
  - text: 寒河江市の総務省地方公共団体コードは062065である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 地名が名字になった寒河江
    text: 寒河江は、地名がそのまま武士の名字になった例である。鎌倉幕府の重臣・大江広元が寒河江荘の地頭となり、その子孫は「寒河江氏」を名乗ってこの地を治め続けた。一方で「寒河江」の語そのものの由来ははっきりせず、寒川の入江にちなむ「寒川の江」説が言い伝えとして紹介されるにとどまる。荘園・名字・城下町と積み重なった層の厚さが、この地名の履歴である。
    sources:
    - t6-sagae-kotobank-uji
    - t6-sagae-kotobank
  relations:
  - pref/06
  unknowns:
  - 「寒河江」の語の確実な初出（文献・年次）は確認できなかった
  - 川名「寒河江川」と荘名・地名「寒河江」の先後関係は未確認
  updated: '2026-11-13'
- id: muni/06-小国町
  code: '064017'
  names:
    ja: 小国町
    reading: おぐにまち
    aliases:
    - 小国郷
    - 小国本村
  user_terms:
  - 小国町の名前の由来
  - 置賜小国と最上小国の違い
  - 小国郷とはどこ
  naming_type: その他
  prefecture: 山形県
  homonyms:
  - muni/43-小国町
  summary: 戦国期以降の文書に見える地域総称「小国」の継承。四方を山に囲まれた小国盆地一帯は中世以来「小国」「小国郷」と呼ばれ、1889年に小国本村・南小国村・北小国村・津川村へ再編、1942年に小国本村が町制を施行、1954年の合体合併で現在の小国町となった。熊本県小国町のような命名伝説は確認できず、地域総称としての用例が中心である。
  first_attestation:
    era: 戦国時代（天文7年）
    year_western: 1538
    document: 段銭古帳（「小国御太領」「おくに 上こほり山かた」）
    note: 『日本歴史地名大系』が紹介する用例で、原典は未読のため紹介として記録する
  claims:
  - text: 『日本歴史地名大系』は「小国」を戦国期以降に見える地名とし、中世には下長井のうち現在の小国町域の大部分を指し、近世にも小国盆地を中心とする地域の総称として広く用いられたと紹介する
    kind: fact
    level: E3
    status: established
    sources:
    - h3-oguni-y-kotobank
  - text: 同書は、天文7年（1538年）の段銭古帳に「小国御太領」「おくに 上こほり山かた」と見え、当地が伊達氏の直轄領と小国城主・上郡山氏の領地に分かれていたことを紹介する
    kind: fact
    level: E3
    status: established
    sources:
    - h3-oguni-y-kotobank
  - text: 町の計画は、当地が「古くから小国郷と呼ばれてきた」とし、四方を1000メートル級の山々に囲まれ他地域と隔絶した地形を「文字どおりの『小国』」を形づくるものと説明する
    kind: fact
    level: E2
    status: established
    sources:
    - h3-oguni-y-plan
  - text: 明治22年（1889年）に小国郷を構成した59か村が小国本村・南小国村・北小国村・津川村に再編され、昭和17年（1942年）に小国本村が町制を施行、昭和29年（1954年）に南小国村・北小国村と合体合併した
    kind: fact
    level: E2
    status: established
    sources:
    - h3-oguni-y-plan-r3
  - text: 熊本県小国町とは、山々に囲まれた盆地の郷名「小国」を継ぐ点で共通する。平凡社の地名コラムは、〈オグニ〉という名が山に囲まれた盆地状の地に広く付き、漢字では「小国」を宛てることが多いと指摘する。一方、熊本側には「国小なり」の言葉に由来するという伝説が公式に伝えられるが、山形側に固有の命名伝説は確認できない
    kind: fact
    level: E3
    status: established
    sources:
    - h3-oguni-jk
    - h3-oguni-k-town
  - text: 総務省「地方公共団体コード一覧」では本町のコードは064017とされる
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 置賜小国・最上小国・庄内小国
    text: 山形県内には「小国」と呼ばれる地域が複数あり、地元では最上郡や鶴岡市の小国と区別して、ここの小国を「置賜小国」と呼びます。山に囲まれた盆地ごとに同じ名が生まれるのは、〈オグニ〉が固有名詞というより地形を表す普通名詞に近い名だったからだと、地名コラムは説明します。
    sources:
    - h3-oguni-jk
  relations:
  - pref/06
  - muni/43-小国町
  unknowns:
  - なぜこの地が「小国」と呼ばれ始めたのかという命名理由そのもの
  - 段銭古帳の書誌・所蔵先の確認
  - 「小国郷」という呼称の初出
  updated: '2026-11-13'
- id: muni/06-尾花沢市
  code: '062120'
  names:
    ja: 尾花沢市
    reading: おばなざわし
    aliases:
    - 尾羽根沢
  user_terms:
  - 銀山温泉のあるまち
  - 尾花沢スイカ
  - おばなざわ
  naming_type: 一部の地名
  prefecture: 山形県
  homonyms: []
  summary: 銀山温泉と尾花沢スイカで知られる豪雪の市で、市名は旧町名「尾花沢」の継承である。「尾花沢」の語源は市の公式にも示されておらず、尾花（ススキ）の群生する沢という説のほか、鷲・鷹の尾羽根の租税に由来する説、アイヌ語説、粘土（はに）のある沢とする説などが言われる。1954年に1町4村が合併し、1959年に市制を施行した。
  first_attestation:
    era: 奈良時代
    year_western: 737
    document: 続日本紀
    note: 天平9年（737）に大野東人が玉野の大室駅に到着した記事が市域の正史への初出とされるが、地名「尾花沢」自体の初出ではない。「尾花沢」の語の初出は未確認
  claims:
  - text: 天平9年（737年）に陸奥出羽按察使の大野東人が玉野の大室駅に到着したことが、尾花沢市域が正史（『続日本紀』）に現れる最初の記事であると尾花沢市は位置づけている
    kind: fact
    level: E2
    status: established
    sources:
    - t6-obanazawa-city-kaso
  - text: 「尾花沢」の語源については市の公式サイトにも説明がなく、尾花（ススキ）が群生し沢が入り組んだ地であったことからとする説のほか、アイヌ語に由来する説、平安時代の調として鷲や鷹の尾羽根を納めた産地「尾羽（おばね）」が尾羽根沢を経て尾花沢になったとする説、「お（接頭語）＋はに（粘土）＋さわ（沢）」の転で「粘土のある沢」とする説などが紹介されており、定説はない
    kind: fact
    level: E4
    status: contested
    sources:
    - t6-obanazawa-folklore
  - text: 市東部の銀山温泉の名は、江戸時代に銀鉱山として栄えた延沢銀山に由来し、開湯後は銀山温泉と呼ばれるようになった（環境省の国民保養温泉地計画書）
    kind: fact
    level: E2
    status: established
    sources:
    - t6-obanazawa-env-ginzan
  - text: 元禄2年（1689年）、松尾芭蕉は『おくのほそ道』の行脚で尾花沢に10日間滞在し、豪商・鈴木清風の宅などに宿泊した
    kind: fact
    level: E2
    status: established
    sources:
    - t6-obanazawa-city-kaso
  - text: 尾花沢市は1954年（昭和29）に尾花沢町・福原村・宮沢村・玉野村・常盤村の1町4村が合併して新しい尾花沢町となり、1959年（昭和34）4月10日に市制を施行して県下12番目の市となった
    kind: fact
    level: E2
    status: established
    sources:
    - t6-obanazawa-city-kaso
  - text: 尾花沢市の総務省地方公共団体コードは062120である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 羽根か、花か、粘土か
    text: 尾花沢の語源候補は、字面の印象とは裏腹に多彩である。ススキの尾花が群生する沢という素直な説に加え、貢納品だった鷹や鷲の「尾羽根」の産地だったとする説、アイヌ語説、そして地質に目を向けた「粘土（はに）のある沢」説。市自身は由来を公式に示しておらず、決着はついていない。雪深い盆地の町に、芭蕉が10日も留まったという事実の確かさと並べて読むと、地名の曖昧さがかえって印象に残る。
    sources:
    - t6-obanazawa-folklore
    - t6-obanazawa-city-kaso
  relations:
  - pref/06
  unknowns:
  - 「尾花沢」の語の文献上の初出と、語源の定説は確認できなかった（市公式にも由来の説明がない）
  - 「尾羽根沢」から「尾花沢」への変遷を示す具体的な史料は未確認
  updated: '2026-11-13'
- id: muni/06-山形市
  code: '062014'
  names:
    ja: 山形市
    reading: やまがたし
    aliases:
    - 山形町
    - 山方郷
  user_terms:
  - 山形市の名前の由来
  - 山形市はいつできた市
  - 山方郷と山形市
  - 最上と呼ばれた土地
  naming_type: 藩名
  prefecture: 山形県
  homonyms: []
  summary: 市名は山形藩の城下町名の継承である。地名の核は『和名類聚抄』に現在の山形市の南側を指すとされる「山方郷」で、「山方」の表記は南北朝時代に斯波兼頼がこの地を拠点としてから「山形」として文書に再び現れるようになった。明治9年（1876年）に現在の山形県が成立して県庁所在地となり、明治22年（1889年）に最初に市制が施行された31市の一つとなった。なぜ「山方」と呼ばれたかは県公式も不明とする。
  first_attestation:
    era: 承平年間
    year_western: null
    document: 和名類聚抄
    note: 「山方郷」としての記載。県レコード（pref/06）と共通の起点で、『和名類聚抄』の成立年代（931〜938年頃）から単年は置かない
  claims:
  - text: 山形県は、山形の名は平安時代の『和名類聚抄』に今の山形市の南側を「山方郷」と記したことに由来があると言われている、と説明している
    kind: fact
    level: E2
    status: established
    sources:
    - a-yam-pref
  - text: なぜこの地を山方と言ったかは不明であると、山形県の公式解説は明言している。「山の方にある土地」という単純な地形呼称とする見方も、定説としては確認できない
    kind: fact
    level: E2
    status: indeterminate
    sources:
    - a-yam-pref
  - text: 「山方」の地名はいったん資料から見えなくなり、南北朝時代に斯波兼頼がこの地を政治の拠点として安定させると、土地売買の文書などに「山形」の表記が改めて現れるようになった、と山形県は述べている
    kind: fact
    level: E2
    status: established
    sources:
    - a-yam-pref
  - text: 山形市は、延文元年（1356年）に羽州探題として入部した斯波兼頼がこの地に城を築き城下町を整えて発展の礎を置き、のちに最上義光の時代に飛躍した、と市の沿革で説明している
    kind: fact
    level: E2
    status: established
    sources:
    - a-cap-yamagata-city
  - text: 明治維新によって山形には統一された山形県の県庁が置かれ、明治22年（1889年）4月1日に大阪市や横浜市などとともに日本で最初に市制が施行された31市のうちの1市として市制を施行した（当時の人口2万8400人）、と山形市は述べている
    kind: fact
    level: E2
    status: established
    sources:
    - a-cap-yamagata-city
  - text: 山形市は、かつてこの一帯が「最上（もがみ）」と呼ばれていたことも市の沿革で紹介している。地方の名（最上）と都市の名（山方・山形）は、別の系統の呼び名として併存していた
    kind: fact
    level: E2
    status: established
    sources:
    - a-cap-yamagata-city
  column:
    title: 「最上」と呼ばれた土地の、もう一つの名前
    text: 山形市の沿革は「山形は、古くは最上と呼ばれていた」と書き出します。川と地方を指す「最上」に対し、「山方」は今の市街の南あたりを指す、より小さな地名でした。平安時代の辞書に載ったきり姿を消していた「山方」が、南北朝時代に城下町とともに「山形」と字を替えて戻ってくる――消えかけた小さな地名が、城下町・藩・県・市と大きくなるにつれて地方全体の名前になったのが山形です。
    sources:
    - a-cap-yamagata-city
    - a-yam-pref
  relations:
  - pref/06
  unknowns:
  - 「山方」と呼ばれた理由の確定（県公式も不明と明言）
  - 市名が藩名の継承か城下町名の継承かの厳密な選定経緯（県レコードと同じ未確認事項で、1871年の山形県設置時の命名理由の一次文書は未確認）
  - 「山方」から「山形」への表記変更が起きた具体的な文書・年は未確認
  updated: '2026-11-13'
- id: muni/06-川西町
  code: 063827
  names:
    ja: 川西町
    reading: かわにしまち
    aliases: []
  user_terms:
  - 川西町の名前の由来
  - 山形の川西町は最上川の西
  - 川西町は山形と奈良にある
  naming_type: 合併新設
  prefecture: 山形県
  homonyms:
  - muni/29-川西町
  summary: 昭和30年（1955年）に小松町・大塚村・犬川村・中郡村・玉庭村・吉島村の1町5村が合併して成立した。町公式は「最上川の西側に位置することから、川西町と名づけられました」と由来を明示しており、大きな川に対する方位で土地を示す、明快な位置地名である。奈良県川西町は命名理由が確認できておらず、同名でも由来の確かさが対照的である。
  first_attestation:
    era: 昭和30年
    year_western: 1955
    document: 川西町の成立（1955年の合併。川西町公式「川西町の概要」）
    note: 自治体としての「川西町」の初出。旧町村名の継承ではなく合併に際しての新名
  claims:
  - text: 川西町は昭和30年（1955年）に小松町・大塚村・犬川村・中郡村・玉庭村・吉島村の1町5村が合併して誕生した町である
    kind: fact
    level: E2
    status: established
    sources:
    - h4-yamagata-kawanishi-gaiyo
  - text: 町公式は「最上川の西側に位置することから、川西町と名づけられました」と明記しており、町名が最上川に対する位置（西側）に由来することが公式に確定している
    kind: fact
    level: E2
    status: established
    sources:
    - h4-yamagata-kawanishi-gaiyo
  - text: 「川西町」という名は、合併した旧町村のいずれの名でもなく、1955年の合併に際して土地の位置から新しく付けられた名である
    kind: fact
    level: E2
    status: established
    sources:
    - h4-yamagata-kawanishi-gaiyo
  - text: 【共通する層】奈良県川西町も「川西」という同じ構成の名を持ち、両町とも大きな川を持つ土地の町である。ただし由来の型が同じかどうかは、奈良側の裏付けが得られてから判断する
    kind: fact
    level: E2
    status: established
    sources:
    - h4-yamagata-kawanishi-gaiyo
    - h4-nara-kawanishi-gaiyo
  - text: 【異なる層】奈良県川西町については、町公式資料に村名・町名の由来の明示がなく、「川西」がどの川の西を指すのかも確認できていない。山形側の明快な位置由来とは対照的である
    kind: fact
    level: E2
    status: established
    sources:
    - h4-nara-kawanishi-rekishi
    - h4-yamagata-kawanishi-gaiyo
  column:
    title: 名刺のような町名
    text: 「最上川の西側だから川西町」。由来の説明が一行で終わる町名は、地図を開けば誰でも納得できる。1955年の合併で生まれた新しい町に、旧町村のどれかの名ではなく、土地の位置そのものを名乗らせる。対等な合併の名付けとして、分かりやすい選択だった。
    sources:
    - h4-yamagata-kawanishi-gaiyo
  relations:
  - pref/06
  - muni/29-川西町
  unknowns:
  - 合併協議における町名の選定過程（他の候補名の有無）は未確認
  - 「川西」という地域の呼称が1955年の合併以前からあったかどうかは未確認
  updated: '2026-11-13'
- id: muni/06-新庄市
  code: '062057'
  names:
    ja: 新庄市
    reading: しんじょうし
    aliases:
    - 新城
    - 新荘
    - 沼田
  user_terms:
  - 新庄まつりのまち
  - 新庄藩の城下町
  - しんじょう
  naming_type: 一部の地名
  prefecture: 山形県
  homonyms: []
  summary: 新庄藩戸沢氏6万石の城下町を起源とする最上地域の中心市で、市名は旧町名「新庄」の継承である。地名は古く「新城」と書かれ、清水城に対する新しい城に由来するという説と、新しく開かれた荘「新荘」に由来するという説がある。表記は寛文年間頃から「新庄」に定まった。1949年に市制を施行した。
  first_attestation:
    era: null
    year_western: null
    document: null
    note: 市名のもととなった地名は古く「新城」と書かれ、寛文年間（1661〜73）頃から「新庄」の字があてられるようになったと『日本歴史地名大系』が記すが、「新城」の初出の年次・文書は未確認
  claims:
  - text: 市名のもととなった地名は、古くは「新城」の字があてられたが、寛文年間（1661〜73年）頃から「新庄」の文字があてられるようになった（『日本歴史地名大系』）
    kind: fact
    level: E3
    status: established
    sources:
    - t6-shinjo-kotobank
  - text: 元和8年（1622年）に戸沢政盛が新庄藩主となり、寛永元年（1624年）に新荘・清水・升形の三つの古城のうち新荘を城地と定めた。新庄城は寛永2年（1625年）の完成と伝えられ、新庄藩は戸沢氏11代・約250年にわたって続いた
    kind: fact
    level: E2
    status: established
    sources:
    - t6-shinjo-city-han
  - text: 新庄の名の起こりには、清水城（現在の大蔵村）に対して新しい城であったため「新城」と呼ばれたという説と、南北朝時代に小田島氏が東根の本荘に対して新しく開いた村（荘園）という意味で「新荘」と呼ばれるようになったという説の二つが、新庄駅の駅名由来の掲示で紹介されている
    kind: fact
    level: E4
    status: contested
    sources:
    - t6-shinjo-kaido-ekimei
  - text: 新庄市は1889年（明治22年）の町村制施行で成立した新庄町を前身とし、1948年（昭和23年）に稲舟村を合併、1949年（昭和24）4月1日に市制を施行して県内5番目の市となり、1955年に萩野村、1956年に八向村を合併した
    kind: fact
    level: E2
    status: established
    sources:
    - t6-shinjo-city-tokei
  - text: 新庄市の総務省地方公共団体コードは062057である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 新しい城か、新しい荘か
    text: 新庄の「新」は何に対して新しいのか。二つの答えがある。川向かいの古い清水城に対して新しく築かれた城だから「新城」。あるいは、東根の本荘に対して新しく開かれた荘だから「新荘」。戸沢政盛が城地を選んだときの文書には「新荘」とあり、古くは「新城」とも書かれたという。城と荘、二つの層が重なったまま「新庄」の二文字に収まったのが、この地名の面白さである。
    sources:
    - t6-shinjo-kaido-ekimei
    - t6-shinjo-city-han
    - t6-shinjo-kotobank
  relations:
  - pref/06
  unknowns:
  - 「新城」「新荘」の語の初出の年次と文書は確認できなかった。「新しい城」説と「新しい荘」説のどちらが正しいかも未確定
  - 戸沢入部以前の地名（沼田等）と「新城・新荘」の関係の細部は未確認
  updated: '2026-11-13'
- id: muni/06-朝日町
  code: '063231'
  names:
    ja: 朝日町
    reading: あさひまち
    aliases: []
  user_terms:
  - 朝日町の名前の由来
  - 山形の朝日町は大朝日岳のふもと
  - 朝日町は山形と富山と三重にある
  naming_type: 合併新設
  prefecture: 山形県
  homonyms:
  - muni/16-朝日町
  - muni/24-朝日町
  summary: 昭和29年（1954年）11月1日に宮宿町・西五百川村・大谷村が合併して誕生した。町は磐梯朝日国立公園の主峰・大朝日岳の東部山麓に位置し、奈良時代には朝日岳への山岳信仰の隆盛とともに集落が発達したと町議会概要は述べる。ただし町名が大朝日岳に由来すると明示した町の公表資料は今回の調査では確認できず、「名峰朝日岳にちなんで」と公式に明記する富山県朝日町とは事情が異なる。
  first_attestation:
    era: 昭和29年
    year_western: 1954
    document: 朝日町の成立（1954年11月1日の合併。朝日町議会概要「歴史と文化」）
    note: 自治体としての「朝日町」の初出。それ以前の地域名・山名としての「朝日」の用例の特定は未確認
  claims:
  - text: 昭和29年（1954年）11月1日、宮宿町・西五百川村・大谷村の1町2村が合併して朝日町となった。宮宿町は、もとの東五百川村が昭和3年（1928年）に町制を施行したものである
    kind: fact
    level: E2
    status: established
    sources:
    - h4-yamagata-asahi-gikai
  - text: 町は磐梯朝日国立公園の主峰大朝日岳の東部山麓地域に位置し、町の中心部を最上川が約21kmにわたって南北に流れ、面積の76%ほどが山林で占められている
    kind: fact
    level: E2
    status: established
    sources:
    - h4-yamagata-asahi-gikai
  - text: 町議会概要は、奈良時代に入ると朝日岳などの山岳信仰の隆盛とともに集落が発達したと述べており、「朝日」の名は山岳信仰の対象としての朝日岳の名として、この地域に古くから結びついていた
    kind: fact
    level: E2
    status: established
    sources:
    - h4-yamagata-asahi-gikai
  - text: 町名「朝日」が大朝日岳・朝日連峰に由来するかは地理的には自然な見方だが、町の公式サイト・議会概要に命名理由の明示はなく、今回の調査では断定できる資料が得られなかった
    kind: fact
    level: E2
    status: indeterminate
    sources:
    - h4-yamagata-asahi-gikai
  - text: 【異なる層】富山県朝日町は町公式が「名峰朝日岳にちなんで『朝日町』と名付けられ」と命名由来を明示しているのに対し、山形県朝日町には同様の明示が確認できない。三重県朝日町は山ではなく天武天皇の故事にあやかった命名であり、3町の「朝日」は由来の型も確かさもそれぞれ異なる
    kind: fact
    level: E2
    status: established
    sources:
    - h4-toyama-asahi-gaiyo
    - h4-mie-asahi-aramashi
  - text: 【共通する層】3町とも「朝日」を名に持ち、このうち山形・富山の2町はともに「朝日岳」と呼ばれる山を擁する山麓の町という地理的な共通点を持つ
    kind: fact
    level: E2
    status: established
    sources:
    - h4-yamagata-asahi-gikai
    - h4-toyama-asahi-gaiyo
  column:
    title: 由来の説明がない「朝日」
    text: 富山県朝日町は「朝日岳にちなんで」とはっきり書くのに、山形の朝日町は公式資料のどこにも命名理由を書いていない。大朝日岳の麓という立地から「山の名をもらったのだろう」と思いたくなるが、記録がない以上、このKBはそう書かない。地名の由来調査では、この「言いたくなる一言」を我慢できるかどうかが正確さの分かれ目になる。
    sources:
    - h4-yamagata-asahi-gikai
    - h4-toyama-asahi-gaiyo
  relations:
  - pref/06
  - muni/16-朝日町
  - muni/24-朝日町
  unknowns:
  - 1954年の合併時における町名選定理由を記した資料（合併協議の記録・町史）は未確認
  - 地域の古い呼称「五百川郷」と町名「朝日」との関係は未確認
  updated: '2026-11-13'
- id: muni/06-村山市
  code: 062081
  names:
    ja: 村山市
    reading: むらやまし
    aliases:
    - 楯岡
    - 村山郷
  user_terms:
  - バラのまち村山
  - 村山の名前の由来
  - むらやま
  naming_type: 合併新設
  prefecture: 山形県
  homonyms: []
  summary: 最上川中流の市で、市名は1954年の合併の際に新たに選ばれた。「村山」はこの地方の総称であり、古来の村山郡・村山郷に由来する。当時の中心地「楯岡」も候補に上がったが、合併各村との協議で、村山地区の中核都市への意気込みを込めて「村山」が選ばれたと市は説明している。
  first_attestation:
    era: null
    year_western: null
    document: null
    note: 市名は1954年の新設。もととなった「村山」は古来の郡名・郷名とされるが、その初出の文献・年次は今回確認できなかった
  claims:
  - text: 村山市統計資料の「地名由来」は、1954年の合併に際し名称には当時の経済の中心地であった楯岡の名が候補に上がったが、合併他村との協議を経て、この地方の総称を生かし村山地区の中核都市へという意気込みと期待感をもって「村山」と名付けられた、と説明する
    kind: fact
    level: E2
    status: established
    sources:
    - t6-murayama-city-tokei
  - text: 市名の「村山」は古来の村山郡・村山郷に由来する（『日本歴史地名大系』）
    kind: fact
    level: E3
    status: established
    sources:
    - t6-murayama-kotobank
  - text: 村山市は1954年（昭和29）11月1日に楯岡町・西郷村・大倉村・大久保村・冨本村・戸沢村の1町5村が合併して市制を施行し、同年12月1日に袖崎村、1955年1月1日に大高根村を合併した
    kind: fact
    level: E2
    status: established
    sources:
    - t6-murayama-city-ayumi
  - text: 中心地の楯岡は、応永年間（1394年〜）に最上満家の末弟・満国が楯山に居城を築いて「楯岡殿」と呼ばれたことに始まるとされ、明治11年（1878年）には楯岡村に北村山郡役所が置かれて地域の政治経済の中心となった
    kind: fact
    level: E2
    status: established
    sources:
    - t6-murayama-city-kaso
  - text: 村山市の総務省地方公共団体コードは062081である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 中心地の名をやめて、地方の総称を選んだ
    text: 合併で新しい市名を決めるとき、中心地の名をそのまま使うのが普通のやり方である。村山でも「楯岡」が候補だった。しかし選ばれたのは、合併する村々のどれか一つの地名ではなく、郡に遡るこの地方全体の総称「村山」だった。市の統計資料はその理由を「村山地区の中核都市へという意気込みと期待感」と率直に記している。一地域の名を、合併に参加した全員の名にした選択である。
    sources:
    - t6-murayama-city-tokei
  relations:
  - pref/06
  unknowns:
  - 「村山」の郡名・郷名としての初出（文献・年次）と、郡名そのものの語源は確認できなかった
  - 1954年の合併協議で「楯岡」以外の候補名があったかは未確認
  updated: '2026-11-13'
- id: muni/06-東根市
  code: '062111'
  names:
    ja: 東根市
    reading: ひがしねし
    aliases:
    - 東根町
    - 東根村
  user_terms:
  - ひがしね
  - さくらんぼ東根
  - 果樹王国ひがしね
  - 東根温泉
  naming_type: 一部の地名
  prefecture: 山形県
  homonyms: []
  summary: 村山盆地の東部、奥羽山脈の麓に広がる果樹の市。「東根」は中世の小田島荘に現れる古い地名で、市公式は、盆地の中央にあったとされる湖「藻が湖」の東の山麓で最も早く拓けた地を東根と呼んだと説明する。1954年に町村合併で東根町となり、1958年に市制を施行した。
  first_attestation:
    era: 観応3年
    year_western: 1352
    document: 足利尊氏文書（「出羽国小田島荘東根孫五郎跡」を鎌倉宝戒寺に寄進）
    note: 市公式が紹介する記録上の初見。文書そのものは未読のため、紹介した自治体資料の形で記録する。
  claims:
  - text: 東根市公式は市名の由来について、村山盆地の真ん中に「藻が湖（もがうみ）」という大きな湖があり、この湖の東に連なる奥羽山脈の麓に最も早く拓けたところを東根と呼び、この地名が付けられたと説明している
    kind: fact
    level: E2
    status: established
    sources:
    - w1-higashine-city
  - text: 村山盆地にはかつて藻が湖と呼ばれる大きな湖があったと伝えられている
    kind: legend
    level: E2
    status: indeterminate
    sources:
    - w1-higashine-city
  - text: 観応3年（1352）の足利尊氏の文書に「出羽国小田島荘東根孫五郎跡」を鎌倉宝戒寺に寄進したと記されることが、東根の名の記録上の初見であることを市公式が紹介している
    kind: fact
    level: E2
    status: established
    sources:
    - w1-higashine-city
  - text: 正平11年（1356）に東根城を築いた小田島長義が寄進した普光寺の梵鐘に「東根境致」と刻まれており、これが東根の名の金石文としての最古の用例であることを市公式が紹介している
    kind: fact
    level: E2
    status: established
    sources:
    - w1-higashine-city
  - text: 明治22年（1889年）の町村制施行により東根村・東郷村・高崎村・大富村・小田島村・長瀞村の6村が成立し、明治29年（1896年）に東根村が町制を施行して東根町となった
    kind: fact
    level: E2
    status: established
    sources:
    - w1-higashine-city
  - text: 昭和29年（1954年）に6町村が合併して東根町となり、昭和33年（1958年）11月3日に市制を施行して東根市となった
    kind: fact
    level: E2
    status: established
    sources:
    - w1-higashine-city
  - text: 東根小学校の校庭にある日本一の大ケヤキは、小田島長義が本城を築くときすでに天空を覆うほどの大木としてそびえていたと伝えられている
    kind: legend
    level: E2
    status: indeterminate
    sources:
    - w1-higashine-city
  - text: 総務省の全国地方公共団体コードで、東根市の団体コードは062111と定められている
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 消えた湖「藻が湖」と日本一の大ケヤキ
    text: 東根市の公式の由来説明には、村山盆地の真ん中に「藻が湖（もがうみ）」という大きな湖があったという伝承が登場する。その湖の東の山麓で最も早く拓けた土地が「東根」だったというのである。湖そのものの実在は確かめられていないが、盆地の低湿地が古くから開拓されてきた土地の記憶を映しているのかもしれない。もう一つの語り草が、東根小学校の校庭にそびえる樹齢1500年以上ともいわれる大ケヤキである。室町時代に東根城を築いた小田島長義の頃にすでに大木だったと伝えられ、国の特別天然記念物に指定されている。地名の古さは、1352年の文書と1356年の梵鐘の銘という確かな記録で裏づけられている。
    sources:
    - w1-higashine-city
  relations:
  - pref/06
  unknowns:
  - 「東根」の語源について『角川日本地名大辞典』『日本歴史地名大系』等の専門辞典の説は未確認（市公式の藻が湖説以外の検討は今後の課題）
  - 藻が湖とされる湖の実在と範囲は未確認
  updated: '2026-11-13'
- id: muni/06-米沢市
  code: '062022'
  names:
    ja: 米沢市
    reading: よねざわし
    aliases:
    - 米澤
  user_terms:
  - 米沢の名前の由来
  - 上杉の城下町
  - 米沢牛のふるさと
  naming_type: 一部の地名
  prefecture: 山形県
  homonyms: []
  summary: 市公式資料によれば地名は中世後期から見られ、語源には「米のなる沢」説と「米井(よねい)」説がある。長井氏・伊達氏・上杉氏が本拠とした城下町で、1889年に最初期の市の一つとなった。
  first_attestation:
    era: 中世後期
    year_western: null
    document: 米沢市「市勢要覧2025」(「米沢の地名は中世後期から見られる」)
    note: 具体的な初出史料の名は市公式資料に示されていない。米沢城は暦仁元年(1238年)に長井時広が築いたと伝えられ、少なくとも鎌倉時代後半には「米沢」が城とその周辺の名として成立していたとみられる。
  claims:
  - text: 米沢市市勢要覧は「米沢の地名は中世後期から見られる」とする。
    kind: fact
    level: E2
    status: established
    sources:
    - m2-yonezawa-yoran
  - text: 地名の由来には、ヨネ(米)のなるサワ(草の生える湿地)とする説と、白い水が湧く米井(よねい)があることからきたとする説がある(米沢市市勢要覧)。
    kind: fact
    level: E2
    status: contested
    sources:
    - m2-yonezawa-yoran
  - text: 米沢城は暦仁元年(1238年)に長井時広が築いたと伝えられ、以後伊達氏・上杉氏の本拠となった。
    kind: fact
    level: E5
    status: established
    sources:
    - m2-yonezawa-castle-wiki
  - text: 鎌倉時代に地頭が置かれてまちが形成され、米沢は伊達氏が212年間、上杉氏が272年間本拠とした城下町として栄えた。城下町の基礎は直江兼続が築いた(米沢市資料)。
    kind: fact
    level: E2
    status: established
    sources:
    - m2-yonezawa-yoran
  - text: 明治22年(1889年)4月1日、米沢市は日本で最初に市制を施行した31市の一つとして発足し、昭和28〜30年(1953〜55年)に周辺10村と合併した(米沢市市勢要覧)。
    kind: fact
    level: E2
    status: established
    sources:
    - m2-yonezawa-yoran
  - text: 米沢市の地方公共団体コードは062022である(総務省「地方公共団体コード一覧」)。
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 城下町を設計した家老・直江兼続
    text: 米沢の城下町の基礎を築いたのは、上杉景勝の家老・直江兼続とされる。景勝が会津から米沢へ移った慶長6年(1601年)以降、兼続は城下の整備と殖産に力を注ぎ、以後の上杉氏272年の治世の土台を作った。「米沢」という地名が城下町の名として定着していくのはこの時期である。
    sources:
    - m2-yonezawa-yoran
  relations:
  - pref/06
  unknowns:
  - 地名「米沢」の具体的な初出史料(文書名・年次)は市公式資料に示されておらず未特定
  - 語源の「米のなる沢」説と「米井」説のいずれが有力かについての定説は確認できていない
  updated: '2026-11-13'
- id: muni/06-酒田市
  code: 062049
  names:
    ja: 酒田市
    reading: さかたし
    aliases:
    - 坂田
    - 酒田町
    - 酒田湊
  user_terms:
  - 酒田の名前の由来
  - 酒田はもともと何と読んだのか
  - 三十六人衆と酒田の始まり
  naming_type: その他（「さかた」への当て字。元の意味は未確定）
  prefecture: 山形県
  homonyms: []
  summary: 「酒田」は、最上川河口の地形に付けられた「さかた」という名に後から当てられた当て字で、その地形が消滅したため「さかた」の元の意味は分からなくなっていると『荘内地名辞典』は述べる。「さ潟」と解する説は候補の一つだが決着していない。中世末に最上川南岸の袖の浦から北岸の砂潟の地へ町が移り、港町として発展。昭和8年（1933年）に市制を施行し、平成17年（2005年）に八幡町・松山町・平田町と合併した。
  first_attestation:
    era: 室町時代初期
    year_western: null
    document: 『義経記』
    note: 「酒田の湊」の表記が見えることを土木学会誌の酒田特集が紹介する。『義経記』の成立年代には幅があるため年は特定しない。
  claims:
  - text: 大沼浩『荘内地名辞典』は「さかた」を「酒田と当て字の地名」とし、最上川河口にあった一つの地形に名付けられたもので、名付けは出羽国が置かれた8世紀以降であろうが、その地形は後に消滅し、「さかた」の意味は不明となったと述べる。
    kind: fact
    level: E4
    status: indeterminate
    sources:
    - l1-sakata-jiten
  - text: 同辞典は、「さかた」を「さ潟」と解することが考えられるものの、潟が潟湖かどうかは分からず、「さ」に砂・沙・狭を当てる解釈や、「さ」は何の意味もない発語とする説もあって、選択することは難しいとする。
    kind: fact
    level: E4
    status: contested
    sources:
    - l1-sakata-jiten
  - text: 酒田商工会議所の観光ガイドは、町の移転先となった最上川北岸の地が「砂潟」と呼ばれる砂原地であったと述べる。
    kind: fact
    level: E4
    status: established
    sources:
    - l1-sakata-cci-honmachi
  - text: 土木学会誌の酒田特集は、室町時代初期に成立した『義経記』に「酒田の湊」と見えること、また『吾妻鏡』に坂田三郎の名が見えることを紹介する。
    kind: fact
    level: E3
    status: established
    sources:
    - l1-sakata-jcca
  - text: 酒田市公式の略年表によれば、明応元年（1492年）に宮野浦から現酒田への移転が始まり、大永元年（1521年）に三十六人衆が本町でまちづくりを始め、寛文12年（1672年）に河村瑞賢が西廻り航路を整備し、明治2年（1869年）に酒田県が置かれた。
    kind: fact
    level: E2
    status: established
    sources:
    - l1-sakata-nenpyo
  - text: 酒田発祥の伝説として、文治5年（1189年）の奥州藤原氏滅亡の際、藤原秀衡の後室または妹とされる徳尼公が36人の遺臣に守られて最上川南岸の袖の浦（宮野浦、「向う酒田」）に落ち延びたのが酒田の始まりと伝わる。遺臣たちは「三十六人衆」と呼ばれ、のちに町の礎を築いたとされる。
    kind: legend
    level: E4
    status: established
    sources:
    - l1-sakata-cci-guide
  - text: 旧酒田市は昭和8年（1933年）に市制を施行し、平成17年（2005年）11月1日に八幡町・松山町・平田町と合併して新しい酒田市となった。
    kind: fact
    level: E3
    status: established
    sources:
    - l1-sakata-kotobank
  - text: 総務省「地方公共団体コード一覧」では、酒田市のコードは062049とされる。
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 意味の消えた名前
    text: 酒田の「さかた」は、名前が指していた地形そのものが消えてしまったために、意味が分からなくなった地名である。『荘内地名辞典』は、河口の地形に付けられた名が残り、酒の字が当てられただけだと率直に書く。「砂潟」の砂原に町が移った記憶は残るが、それがそのまま語源かどうかは辞典も断定しない。意味は失われても、名は『義経記』の「酒田の湊」以来、港町とともに800年近く生き続けてきた。
    sources:
    - l1-sakata-jiten
    - l1-sakata-cci-honmachi
  relations:
  - pref/06
  unknowns:
  - 「さかた」の原義は地名辞典の段階でも未確定であり、本バッチでも決着しなかった。
  - 『義経記』原文における「酒田の湊」の箇所の直接確認は未実施。
  - 2005年の合併協定書における市名決定の条項（「新市の名称は、酒田市とする」）の原文確認は未実施。
  updated: '2026-11-13'
- id: muni/06-金山町
  code: '063614'
  names:
    ja: 金山町
    reading: かねやままち
    aliases:
    - 金山村
  user_terms:
  - 金山町の名前の由来
  - 山形の金山町は宿場町だった
  - 金山町は山形と福島にある
  naming_type: その他
  prefecture: 山形県
  homonyms:
  - muni/07-金山町
  summary: 明治22年（1889年）に成立した金山村が大正14年（1925年）1月に町制を施行して以来、合併を経験していない町。中心集落の金山は近世、金山内町・金山七日町・金山十日町の「金山三ヵ村」で羽州街道の宿場町「金山町」を形成していた。地名の由来についてブリタニカ国際大百科事典は「金銀の鉱山が多かったことに由来するといわれる」と伝えるが、断定できる資料は確認できていない。中世以来の広域名「金山谷」を背景に持つ福島県の金山町とは成り立ちが異なる。
  first_attestation:
    era: 明治22年
    year_western: 1889
    document: 金山村の成立（町村制施行）
    note: 自治体名としての初出。集落名としての「金山」は近世の郷帳類に「金山三ヵ村」として見えるが、用例の年次の特定は未確認
  claims:
  - text: 金山町は大正14年（1925年）1月に町制を施行した。町公式年表はこの町制施行を起点に現在まで続いており、明治22年（1889年）の金山村成立以来、合併による自治体の再編は行われていない
    kind: fact
    level: E2
    status: established
    sources:
    - h4-yamagata-kaneyama-ayumi
  - text: 日本歴史地名大系によれば、近世には金山内町・金山七日町・金山十日町の3村が「金山三ヵ村」と通称され、羽州街道の宿場町を形成して「金山町」と呼ばれ、金山郷の交通・商業の中心地だった
    kind: fact
    level: E3
    status: established
    sources:
    - h4-kotobank-kaneyama
  - text: ブリタニカ国際大百科事典小項目事典は「地名は金銀の鉱山が多かったことに由来するといわれる」とし、町の西部に谷口銀山の名残りがあることを併記する。ただし由来そのものは「といわれる」の形で伝えられるにとどまり、断定する資料は確認できていない
    kind: fact
    level: E3
    status: indeterminate
    sources:
    - h4-kotobank-kaneyama
  - text: 【異なる層】福島県金山町の「金山」は中世以来の広域地域名「金山谷」に由来する層が濃いのに対し、山形県金山町の「金山」は宿場町として栄えた中心集落の名がそのまま自治体名になったもので、同名でも成り立ちが異なる
    kind: fact
    level: E3
    status: established
    sources:
    - h4-kotobank-kaneyamadani
    - h4-kotobank-kaneyama
  - text: 【共通する層】両町の名の核は近世以前からの地域の呼称にさかのぼり、昭和の大合併で新しく作られた名ではない点は共通する
    kind: fact
    level: E3
    status: established
    sources:
    - h4-kotobank-kaneyama
    - h4-fukushima-kaneyama-profile
  column:
    title: 宿場町の名前がそのまま残った町
    text: 江戸時代、金山の集落は内町・七日町・十日町という3つの町からなる宿場町で、市場が立つ商業の中心だった。1889年に村になり、1925年に町になってからも名前は変わらず、昭和・平成の合併の波もこの町は単独で越えた。自治体の名前が江戸時代の宿場町の呼び名と地続きなのは、全国でもそう多くない。
    sources:
    - h4-kotobank-kaneyama
    - h4-yamagata-kaneyama-ayumi
  relations:
  - pref/06
  - muni/07-金山町
  unknowns:
  - 「金銀の鉱山が多かった」ことを示す具体的な鉱山の記録（谷口銀山の操業実態を含む一次資料）は未確認
  - 1889年の金山村成立当時の構成村の確認は未実施
  updated: '2026-11-13'
- id: muni/06-長井市
  code: 062090
  names:
    ja: 長井市
    reading: ながいし
    aliases:
    - 長井町
    - 長井荘
  user_terms:
  - ながい
  - 水と緑と花のながい
  - 山の港町
  - 黒獅子の里
  naming_type: 一部の地名
  prefecture: 山形県
  homonyms: []
  summary: 山形県南西部、長井盆地に位置し、最上川・置賜白川・置賜野川の3河川が合流する「水の集まる所」の市。地名は平安時代の郷名「長井」に遡り、鎌倉時代には置賜一円を指す「長井荘（長井の庄）」の名に広がった。江戸時代には最上川舟運の集積地「山の港町」として栄え、1954年に1町5村の合併で市制を施行した。
  first_attestation:
    era: 平安時代中期
    year_western: null
    document: 『和名類聚抄』地名部（置賜郡の郷名「長井」）
    note: 市の文化財計画が『和名類聚抄』の記載として紹介するもの。原文は未読のため、紹介した公的資料の形で記録し、西暦年は特定しない。
  claims:
  - text: 平安時代中期に編纂された『和名類聚抄』地名部の置賜郡に「長井」という郷名が見えることを、長井市の文化財保存活用地域計画が紹介している
    kind: fact
    level: E2
    status: established
    sources:
    - w1-nagai-city-bunkazai
  - text: 愛知県の西光寺の地蔵菩薩像から発見された胎内印仏の銘に「長井荘」とあることから、遅くとも鎌倉時代初期にはこの地が長井と呼ばれていたと市の文化財計画が述べている
    kind: fact
    level: E2
    status: established
    sources:
    - w1-nagai-city-bunkazai
  - text: 長井市公式は地名の由来を「長井の『井』は水の集まる所」と説明し、朝日山系を源とする置賜野川、飯豊山系を源とする置賜白川、市の南北を貫流する最上川の3河川がまちを囲むように流れる地形と結びつけている
    kind: fact
    level: E2
    status: established
    sources:
    - w1-nagai-city-rekishi
    - w1-nagai-city-bunkazai
  - text: 文治5年（1189年）に鎌倉幕府の御家人・大江時広が地頭となり、置賜一円は「長井の庄」と改められ、時広はその名を冠して長井時広と名乗ったことを市公式の沿革が記している
    kind: fact
    level: E2
    status: established
    sources:
    - w1-nagai-city-rekishi
  - text: 元禄7年（1694年）に西村久左衛門によって最上川の舟運が開かれると、長井は米沢藩の物資運搬の集積地となり、絹織物などを扱う豪商が現れる「山の港町」として栄えた
    kind: fact
    level: E2
    status: established
    sources:
    - w1-nagai-city-rekishi
  - text: 昭和29年（1954年）11月15日に長井町・長井村・西根村・平野村・豊田村・伊佐沢村の1町5村が合併して長井市が誕生した
    kind: fact
    level: E2
    status: established
    sources:
    - w1-nagai-city-aramashi
  - text: 千年ほど前、源頼義がこの地で戦勝を祝って軍士に獅子舞をさせたことが、市内の約40の神社に伝わる黒獅子舞の始まりであると伝えられている
    kind: legend
    level: E2
    status: indeterminate
    sources:
    - w1-nagai-city-rekishi
  - text: 総務省の全国地方公共団体コードで、長井市の団体コードは062090と定められている
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 「水の集まる所」が藩の玄関口になった
    text: 長井の「井」は水の集まる所を意味すると市は説明する。朝日山系の野川、飯豊山系の白川、そして最上川。三つの川が集まる地形は、ときに水害の地でもあったが、元禄7年（1694年）に最上川の舟運が開かれると一転して強みになった。米沢藩の米や特産品は長井の舟場に集められ、酒田を経て京都・大坂へ運ばれた。山あいの盆地の町が「山の港町」と呼ばれ、豪商の屋敷が建ち並んだ。地名が指す水の地形が、そのまま町の繁栄の条件になった例である。
    sources:
    - w1-nagai-city-rekishi
  relations:
  - pref/06
  unknowns:
  - 『和名類聚抄』の「長井」郷の訓や位置比定など、原文レベルでの確認は未実施
  - 「長井」の語源について専門辞典（『角川日本地名大辞典』等）の検討は未確認で、市公式の「水の集まる所」説以外の説の存否は今後の課題
  updated: '2026-11-13'
- id: muni/06-鶴岡市
  code: '062031'
  names:
    ja: 鶴岡市
    reading: つるおかし
    aliases:
    - 鶴ヶ岡
    - 大宝寺
    - 鶴岡町
  user_terms:
  - 鶴岡の名前の由来
  - 鶴ヶ岡城とは何か
  - 鶴岡と海亀の関係
  - 鶴岡は誰が名付けたか
  naming_type: その他
  prefecture: 山形県
  homonyms: []
  summary: 「鶴岡」は、慶長8年（1603年）に最上義光が居城・大宝寺城を「鶴ヶ岡城」と改名したときに生まれた地名だと鶴岡市公式は明記する。酒田浜に大きな海亀が上がったことを吉兆として、亀ヶ崎城など3城を同時に改名したうちの一つという。後に庄内藩主となった酒井忠勝は名付け主ではなく、鶴ヶ岡を居城として城下を整えた側である。
  first_attestation:
    era: 慶長8年
    year_western: 1603
    document: 最上義光による大宝寺城の「鶴ヶ岡城」への改名（鶴岡市公式の概要・沿革）
    note: 「鶴岡」の地名の成立時点として市公式が示すもの。改名の動機（海亀の上陸）は市の計画書が「といわれる」と伝える伝承的な説明を含む。
  claims:
  - text: 鶴岡市公式「鶴岡市の概要（令和7年度）」によれば、「鶴岡」という地名は、慶長8年（1603年）に最上義光が大宝寺城を「鶴ヶ岡城」と改名したときにできたものである。
    kind: fact
    level: E2
    status: established
    sources:
    - k2-tsuruoka-city-gaiyo
    - k2-tsuruoka-city-enkaku
  - text: 鶴岡市の歴史的風致維持向上計画によれば、義光は慶長8年（1603年）、酒田浜に巨大な海亀が上がったことをめでたいことの前兆として、東禅寺城を亀ヶ崎城、大宝寺城を鶴ヶ岡城、尾浦城を大山城と改名したといわれる。長寿の象徴である鶴と亀を対にした、瑞祥を願う同時改名だったことがうかがえる。
    kind: fact
    level: E2
    status: established
    sources:
    - k2-tsuruoka-fuchi
  - text: 「鶴ヶ岡」の名付け主は酒井氏ではない。江戸時代に入った元和8年（1622年）に最上氏が領地を没収されると、譜代大名の酒井忠勝が庄内藩主として入部し、既に鶴ヶ岡と名付いていた城を居城として新たに城を築き、城下町を整備して現在の鶴岡の基礎を築いた。
    kind: fact
    level: E2
    status: established
    sources:
    - k2-tsuruoka-city-gaiyo
    - k2-tsuruoka-city-enkaku
  - text: 鶴ヶ岡城の前身である大宝寺は、平安時代末期には出羽国田川郡の大泉荘の中心地であり、鎌倉時代以降は武藤（大宝寺）氏の拠点として栄えた地である。「大宝寺」の名は現在も鶴岡市内の地名として残る。
    kind: fact
    level: E2
    status: established
    sources:
    - k2-tsuruoka-city-gaiyo
  - text: 大正13年（1924年）10月1日、鶴岡町が市制を施行して鶴岡市となった。
    kind: fact
    level: E4
    status: established
    sources:
    - k2-uub-tsuruoka
  - text: 平成17年（2005年）10月1日、鶴岡市・藤島町・羽黒町・櫛引町・朝日村・温海町の1市4町1村が合併して新・鶴岡市が発足し、面積は東北地方で最も広い市となった。
    kind: fact
    level: E2
    status: established
    sources:
    - k2-tsuruoka-city-enkaku
  - text: 総務省「地方公共団体コード一覧」では、鶴岡市のコードは062031とされる（当初想定された062026ではなく062031であることを一覧で確認した）。
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 海亀が運んできた「鶴」の字
    text: 鶴岡に鶴が群れていたから鶴岡なのではない。1603年、庄内の浜に巨大な海亀が上がった。領主の最上義光はこれを吉兆と受け取り、領内の3つの城をいっせいに改名した。酒田の城は亀そのものの「亀ヶ崎城」、尾浦の城は「大山城」、そして大宝寺の城には亀と対になる長寿の瑞獣「鶴」を充てて「鶴ヶ岡城」とした。つまり鶴岡の鶴は、実在の鳥ではなく、海亀への返礼として選ばれた縁起の文字である。亀の相方として呼ばれた鶴の名が、城が消えた後も400年以上、庄内の中心都市の名前として残った。
    sources:
    - k2-tsuruoka-city-gaiyo
    - k2-tsuruoka-fuchi
  relations:
  - pref/06
  unknowns:
  - 海亀の上陸を吉兆としたという改名の動機は、市の計画書が「といわれる」と記す伝承的な説明であり、当時の一次史料での確認は未了。
  - 庄内藩の石高について市の資料間で表記が異なる（概要は13万8千石、沿革は14万石）ため、本レコードでは石高の数値を使っていない。
  updated: '2026-11-13'
