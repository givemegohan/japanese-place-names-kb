  naming_type: 旧行政区画名の継承
  formation: 単独発足
  prefecture: 沖縄県
  homonyms: []
  summary: 沖縄本島北部、西海岸にある村で、村名は琉球王国の行政区画「大宜味間切」を継承する。その起源は1673年に羽地・国頭の両間切から村々を分けて設けられた田港間切で、17世紀末に大宜味間切と改称された。地元の方音は「ウジミ」、近世の資料では「いぎみ」と読まれた。「宜味」の語源は確定していない。
  first_attestation:
    era: 康熙52年
    year_western: 1713
    document: 『琉球国由来記』
    note: 集落名「大宜味村」の確認できる早い用例で、『日本歴史地名大系』が「絵図郷村帳・琉球国高究帳に村名はみえない」としたうえで紹介している（二次資料経由の確認）。間切名としての「大宜味」は、これに先立つ17世紀末の改称による
  claims:
  - text: 大宜味村の地方公共団体コードは473022である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  - text: 村名は琉球王国の行政区画である大宜味間切を継承し、1908年の沖縄県島しょ町村制施行により間切が大宜味村となった
    kind: fact
    level: E2
    status: established
    sources:
    - s6-ogimi-vill-enkaku
  - text: 大宜味間切の起源は1673年、羽地間切から2村、国頭間切から11村を分かち、13村をもって創設された田港間切である
    kind: fact
    level: E2
    status: established
    sources:
    - s6-ogimi-vill-enkaku
    - s6-ogimi-kotobank-chimei
  - text: 田港間切から大宜味間切への改称の年は、村公式の沿革では1695年（大宜味村など4村の新設と同時）とされる一方、村教育委員会の文化財調査報告書は1682年としており、資料によって異なる
    kind: fact
    level: E2
    status: contested
    sources:
    - s6-ogimi-vill-enkaku
    - s6-ogimi-bunka-pdf
  - text: 集落としての大宜味村は1695年に新設された村の一つとされ、『絵図郷村帳』や『琉球国高究帳』には見えず、1713年編纂の『琉球国由来記』に村名が見えることが『日本歴史地名大系』で紹介されている
    kind: fact
    level: E3
    status: established
    sources:
    - s6-ogimi-kotobank-chimei
    - s6-ogimi-bunka-pdf
  - text: 地元の方音は「ウジミ」で、近世の間切名は「いぎみ」と読まれていたことが専門辞典で紹介されている
    kind: fact
    level: E3
    status: established
    sources:
    - s6-ogimi-kotobank
    - s6-ogimi-kotobank-chimei
  - text: 「宜味」の語源については、確認した村公式資料や専門辞典に確定した説明が見当たらず、語義は未詳である
    kind: fact
    level: E3
    status: indeterminate
    sources:
    - s6-ogimi-kotobank-chimei
  - text: 塩屋湾で旧暦7月に行われる海神祭「ウンジャミ（ウンガミ）」は国の重要無形民俗文化財に指定されている
    kind: fact
    level: E3
    status: established
    sources:
    - s6-ogimi-kotobank-chimei
    - s6-ogimi-kotobank
  column:
    title: 三つの読みを持つ村――おおぎみ・ウジミ・いぎみ
    text: 大宜味には読み方が三つある。公称は「おおぎみ」、地元の方音は「ウジミ」、そして近世の資料では間切の名は「いぎみ」と読まれた。音が同じでも漢字の当て方には揺れがあり、間切を治めた二つの総地頭家は「大宜味御殿」と「大宜見殿内」と、わざわざ違う字で書き分けられていたという。読みの標準化は「おおぎみ」に一本化されたが、その向こうには島の言葉の音と、それを漢字に写し取ろうとした人々の工夫の跡が残っている。
    sources:
    - s6-ogimi-kotobank
    - s6-ogimi-kotobank-chimei
    - s6-ogimi-bunka-pdf
  relations:
  - pref/47
  - muni/47-国頭村
  - muni/47-東村
  - muni/47-名護市
  unknowns:
  - 「宜味」の語源は専門辞典でも確定しておらず未詳である
  - 前身の間切名の表記は、村公式資料では「田港間切」、『日本歴史地名大系』では「田湊間切」と異なり、どちらが正式な表記かは原史料で確認できていない
  - 大宜味間切への改称年（1682年説・1695年説）の対立は、王府の原史料を確認できていないため決着していない
  - 『大宜味村史』（1978〜79年）など村史の直接確認は未了である
