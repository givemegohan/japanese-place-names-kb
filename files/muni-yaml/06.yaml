    label: 東根市公式「東根市の歴史」（市名の由来として、村山盆地中央にあったとされる藻が湖の東に連なる奥羽山脈の麓で最も早く拓けた地を東根と呼んだと説明すること、観応3年（1352）の足利尊氏文書「出羽国小田島荘東根孫五郎跡」が記録上の初見であること、正平11年（1356）に小田島長義が寄進した普光寺梵鐘の銘「東根境致」が金石文としての最古の用例であること、1889年に6村が成立し1896年に東根村が町制、1954年に合併して東根町となり1958年11月3日に市制を施行したことを記す）
