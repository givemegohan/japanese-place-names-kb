  updated: '2026-11-13'
- id: muni/36-阿南市
  code: '362042'
  names:
    ja: 阿南市
    reading: あなんし
    aliases: []
  user_terms:
  - あなん 徳島
  - LEDのまち阿南
  - 那賀川の工業都市
  - 長野県の阿南町とは違う阿南市
  naming_type: 旧国名・広域地名の採用
  formation: 編入合併
  prefecture: 徳島県
  homonyms:
  - muni/20-阿南町
  summary: 1958年5月1日に那賀郡の富岡町と橘町が合併して市制を施行した市。「阿南」は、阿波国を阿南・阿北・阿西と呼びならわしてきた言い方に由来し、県南の代表にふさわしい名として選ばれたと図書館のレファレンス回答は伝える。2006年に那賀川町・羽ノ浦町を編入して現在の市域となった。長野県下伊那郡にも同名の阿南町があるが、由来は無関係である。
  first_attestation:
    era: 昭和33年
    year_western: 1958
    document: 富岡町と橘町の合併による阿南市の市制施行
    note: 「阿南」という呼び名自体は、それ以前から阿波の南部を指す地域呼称として使われていたと図書館の回答は述べるが、その初出の文書は確認できなかった。
  claims:
  - text: 阿南市立那賀川図書館のレファレンス回答によれば、「阿南市」の名称は、阿波国を阿南・阿北・阿西と呼びならわしていたことから名付けたもので、県南の代表たるにふさわしいとされた。
    kind: fact
    level: E2
    status: established
    sources:
    - q4-anan-ndl
  - text: 阿南市は1958年5月1日、那賀郡の富岡町と橘町が合併して市制を施行し、発足した。
    kind: fact
    level: E2
    status: established
    sources:
    - q4-tokushima-enkaku
    - q4-anan-city-profile
  - text: 富岡町は1954年から1955年にかけて、中野島村・宝田村・長生村・加茂谷村・見能林村など周辺の町村を相次いで編入し、阿南市発足時の市域の骨格を作っていた。
    kind: fact
    level: E2
    status: established
    sources:
    - q4-tokushima-enkaku
  - text: 中心市街地のある富岡は、室町時代に阿波公方の居地となった旧城下町である。
    kind: fact
    level: E2
    status: established
    sources:
    - q4-anan-city-profile
  - text: 2006年3月20日に那賀川町と羽ノ浦町を編入し、新しい阿南市として出発した。
    kind: fact
    level: E2
    status: established
    sources:
    - q4-anan-city-profile
  - text: 阿南市の地方公共団体コードは362042である。
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 阿波の「南」という名前
    text: 1958年の合併で候補になり得たのは、中心地の富岡でも、もう一方の橘でもなかった。選ばれた「阿南」は、どちらの町の名でもない第三の名である。阿波の国は古くから阿南・阿北・阿西と呼び分けられてきた。その「阿波の南」という地域呼称をそのまま市名にすれば、県南を代表する市にふさわしい――それが図書館に伝わる命名の理由である。合併で片方の地名を採ると他方が反発する、という新市名の定番の難問を、地域全体の呼び名で解いた例といえる。なお、この名の読みは「あなん」で、長野県の山あいにある同名の阿南町とは由来も場所も全く異なる。今の阿南市はLED産業の集積で「光のまち阿南」を掲げる工業都市である。
    sources:
    - q4-anan-ndl
    - q4-anan-city-profile
  relations:
  - pref/36
  unknowns:
  - 「阿南」という呼称がいつから阿波の南部を指して使われたか、その初出は確認できなかった。
  - 1958年の市名選定の手続き（公募の有無や他の候補名）は確認できなかった。
  updated: '2026-11-13'
- id: muni/36-阿波市
