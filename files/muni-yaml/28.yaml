  homonyms:
  - muni/27-太子町
  summary: 昭和26年（1951年）に斑鳩町・石海村・太田村が合併して生まれた町で、町名は聖徳太子ゆかりの町であることから付けられた。その根拠は、推古14年（606年）に聖徳太子が寄進を受けたと伝わる荘園「鵤荘」と、その中核寺院・斑鳩寺である。大阪府の太子町も聖徳太子にちなむ命名だが、根拠が御廟の所在地である点が異なる。
  first_attestation:
    era: 昭和26年
    year_western: 1951
    document: 斑鳩町・石海村・太田村の合併による太子町の誕生（1951年4月1日）
    note: 町名としての初出。合併前の町名「斑鳩町」も聖徳太子ゆかりの名だった
  claims:
  - text: 昭和26年（1951年）4月1日、斑鳩町と石海村・太田村が合併して太子町が誕生した（昭和30年には龍田村を編入）
    kind: fact
    level: E2
    status: established
    sources:
    - upg-u11-taishi-toukei
  - text: 町名は、聖徳太子ゆかりの町であることから付けられた
    kind: fact
    level: E2
    status: established
    sources:
    - upg-u11-taishi-toukei
  - text: 町公式資料によれば、推古14年（606年）、聖徳太子は推古天皇の御前で勝鬘経を講話した功により播磨国揖保郡の水田百町を寄進され、その地を「鵤荘」と名付けて伽藍を建てたのが斑鳩寺の始まりで、斑鳩寺はのちに法隆寺に寄付され、その荘園として栄えた
    kind: fact
    level: E2
    status: established
    sources:
    - h6-taishi-hyogo-ikaruga
  - text: 『日本書紀』推古14年条には、聖徳太子が法華経の講義を行ったため天皇から播磨国の水田100町を与えられ、斑鳩寺（法隆寺）領として納めたとあり、この地は「鵤荘」と呼ばれて現在の町域に当たるとされる
    kind: fact
    level: E2
    status: established
    sources:
    - upg-u11-taishi-panfu
    - upg-u11-taishi-kotobank-sho
  - text: 大阪府の太子町も聖徳太子にちなむ合併時の命名という点は共通するが、根拠は御廟（墓所）の所在地であることであり、兵庫側の荘園・寺院の伝承とは異なる（異なる層）。また兵庫側は合併前の町名も「斑鳩町」で、二代続けて太子ゆかりの名を選んでいる
    kind: fact
    level: E2
    status: established
    sources:
    - upg-u11-taishi-kotobank
    - h6-taishi-osaka-profile
    - upg-u11-taishi-toukei
  - text: 町内の檀特山の山頂にある大きな岩のくぼみは、『播磨国風土記』では応神天皇が山頂から国見をしたときの杖の跡とされ、中世以降は、法隆寺領鵤荘を視察に訪れた聖徳太子が山に登ったときの乗馬の蹄の跡と伝えられるようになった。鎌倉時代末期の鵤荘絵図にも「黒小馬蹄跡」と記されている
    kind: legend
    level: E2
    status: established
    sources:
    - upg-u11-taishi-rekihaku
  column:
    title: 二代続けて太子の名を選んだ町
    text: 1951年の合併で太子町が生まれる前、この土地の中心は「斑鳩町」でした。斑鳩も聖徳太子を象徴する名（法隆寺のある大和の斑鳩）です。つまりこの町は、斑鳩町から太子町へ、二代続けて聖徳太子ゆかりの名を選び続けたことになります。その土台は、606年に太子が水田百町を寄進されて「鵤荘」と名付けたと伝わる荘園と、法隆寺領として千年近く続いた斑鳩寺の歴史です。大阪の太子町が「太子の墓の町」なら、こちらは「太子の荘園の町」です。
    sources:
    - h6-taishi-hyogo-wiki
    - h6-taishi-hyogo-ikaruga
  relations:
  - pref/28
  - muni/27-太子町
  unknowns:
  - 1951年の合併時に「太子町」の名を選んだ協議の記録（候補名の有無など）は未確認
  - 鵤荘の範囲と現在の町域がどの程度一致するかは資料により幅がある
  - 鵤荘の始まりの年次については、推古6年（598年）とする資料（法隆寺資財帳系の伝承）もあり、『日本書紀』推古14年（606年）の記事とは年次が異なる
  updated: '2026-11-13'
- id: muni/28-姫路市
  code: '282014'
  names:
    ja: 姫路市
    reading: ひめじし
    aliases:
    - 日女道
    - 姫道
  user_terms:
  - ひめじ
  - 白鷺城のまち
  - 姫路城の城下町
  naming_type: 中心地名の継承
  formation: 単独発足
  prefecture: 兵庫県
  homonyms: []
  summary: 市名は奈良時代の『播磨国風土記』に見える「日女道（ひめじ）」に由来する。風土記の日女道丘の記事は流れ着いた蚕（蚕子）に由来すると伝えるが、「姫道＝丘に登る小道」と解する説もあり、語源の決着はついていない。表記は鎌倉期に「姫道」、戦国期に「姫路」となり、姫路城の城下町名を経て、1889年の市制施行で市名となった。
  first_attestation:
    era: 霊亀元年ごろ
    year_western: 715
    document: 『播磨国風土記』飾磨郡伊和里条（「日女道丘」）
    note: 和銅6年（713年）の風土記編纂の詔に基づき霊亀元年（715年）ごろまでに成立したとされる。表記は「日女道」で読みは「ひめじ」。「姫路」の表記は戦国期からのものである。
  claims:
  - text: 『播磨国風土記』には、飾磨郡伊和里の14の丘の一つとして「日女道（ひめじ）丘」が挙げられており、「姫路」の名はこの「日女道」に由来するとされる。
    kind: fact
    level: E2
    status: established
    sources:
    - k4-himeji-harima
    - k4-himeji-gogen
  - text: 風土記には「蚕子（ひめこ）落ちし処は、即ち日女道丘と号す」という記事があり、流れ着いた蚕にちなんで日女道丘と名付けられたという話が伝えられている。
    kind: legend
    level: E4
    status: established
    sources:
    - k4-himeji-gogen
  - text: 一方、「日女道」は「姫道」の意味で、丘（姫山）に登る小道に由来する地名であるという解釈もあり、蚕子説については、風土記の説話は由来を知るための資料としては弱いという指摘もある。
    kind: fact
    level: E4
    status: contested
    sources:
    - k4-himeji-gogen
  - text: 「日女道」の表記は鎌倉期に「姫道」、戦国期に「姫路」と記されるようになり、近世には姫路城の城下町名となった。
    kind: fact
    level: E4
    status: established
    sources:
    - k4-himeji-gogen
  - text: 明治22年（1889年）4月、江戸時代の城下町とその外縁部を市域として、全国30市とともに我が国初の市制が施行され、姫路市が発足した。
    kind: fact
    level: E2
    status: established
    sources:
    - k4-himeji-cci
  - text: 姫路市の地方公共団体コードは282014である。
    kind: fact
    level: E2
    status: established
    sources:
    - d-cap-jlis-hyogo
  column:
    title: 白鷺の城が立つ丘の名は「日女道」
    text: 姫路城が立つ姫山は、『播磨国風土記』に「日女道丘」として現れる丘に重なるとされる。風土記はこの丘の名を、流れ着いた蚕（蚕子＝ひめこ）の話で説明した。「ひめこ」が「ひめじ」に転じたと読むか、「姫の道」と読むかは今も決着していないが、少なくとも1300年以上前から、この丘のあたりは「ひめじ」の音で呼ばれていたことになる。白鷺城の白さが目立つ城下町の名は、奈良時代の地名の音をそのまま引き継いでいる。
    sources:
    - k4-himeji-gogen
    - k4-himeji-harima
  relations:
  - pref/28
  unknowns:
  - 「日女道」の本来の意味は蚕子説と小道（姫道）説が対立しており、決着していない。
  - 姫路市公式サイトには市名の由来を解説する専用ページが見当たらず、本レコードは県・広域協議会・商工会議所等の資料に依拠した。
  updated: '2026-11-13'
- id: muni/28-宍粟市
  code: '282278'
  names:
    ja: 宍粟市
    reading: しそうし
    aliases:
    - 宍禾
  user_terms:
  - しそう
  - 読めない地名の市
  - 宍粟郡だったところ
  naming_type: 旧行政区画名の継承
  formation: 合併新設
  prefecture: 兵庫県
  homonyms: []
  summary: 2005年に旧宍粟郡の山崎町・一宮町・波賀町・千種町の4町が合併して誕生した市で、市名は郡名「宍粟」の継承である。その名は奈良時代の『播磨国風土記』に「宍禾郡（しさわのこおり）」と記された古名に由来し、現在の読み「しそう」はシシアワ→シサワ→シソウと変化したものと市公式の計画が伝える。「宍粟」は難読地名として知られる。
  first_attestation:
    era: 奈良時代
    year_western: 715
    document: 『播磨国風土記』宍禾郡条
    note: 霊亀元年（715）頃の編纂とされる『播磨国風土記』に「宍禾郡」と記されたのが古い用例で、読みは「しさわ」。現在の「宍粟」の表記は後のものである
  claims:
  - text: 宍粟市は平成17年（2005）4月1日に、旧宍粟郡の山崎町・一宮町・波賀町・千種町の4町が合併して誕生した
    kind: fact
    level: E2
    status: established
    sources:
    - x3-shiso-bunkazai
  - text: 市名は、合併した4町が属していた宍粟郡の郡名をそのまま継承したものである
    kind: fact
    level: E2
    status: established
    sources:
    - x3-shiso-bunkazai
  - text: 宍粟市公式の文化財保存活用地域計画は、宍粟という地名は奈良時代の『播磨国風土記』に「宍禾郡（しさわのこおり）」として記された歴史ある名であると紹介する
    kind: fact
    level: E2
    status: established
    sources:
    - x3-shiso-bunkazai
  - text: 同計画は、宍禾郡は孝徳天皇の時代に揖保郡を分けて作られたと『播磨国風土記』に記されていると紹介する
    kind: fact
    level: E2
    status: established
    sources:
    - x3-shiso-bunkazai
  - text: 同計画は、「宍」は肉、「禾（粟）」は穀物を表す字であることから、狩猟と農耕が盛んだったことに因む名ともいわれると紹介する
    kind: fact
    level: E2
    status: contested
    sources:
    - x3-shiso-bunkazai
  - text: 伊和大神がこの地で舌を出した大きな鹿と出会ったことから「シシアワ（鹿に逢う）」と名づけられ、シシアワがシサワ、さらにシソウへと変化したという伝承が、市公式の文化財保存活用地域計画に『播磨国風土記』ゆかりの話として紹介されている
    kind: legend
    level: E2
    status: established
    sources:
    - x3-shiso-bunkazai
  - text: 合併時の新市名は、候補5点から最終候補が「宍禾（しさわ）」と「宍粟」の2点に絞られ、古代の表記そのままの「宍禾」ではなく「宍粟」が選ばれた
    kind: fact
    level: E4
    status: established
    sources:
    - x3-uub-shiso
  - text: 合併協議には当初、安富町を含む5町が参加していたが、安富町は協議から離脱し、2006年に姫路市へ編入された
    kind: fact
    level: E2
    status: established
    sources:
    - x3-shiso-bunkazai
  - text: 総務省の全国地方公共団体コードで、宍粟市の団体コードは282278と定められている
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 風土記の表記が、あと一歩で市名になるところだった
    text: 2005年の合併で新市名の最終候補に残ったのは、「宍粟」と、奈良時代の『播磨国風土記』の表記そのままの「宍禾（しさわ）」でした。1,300年前の文書の字をそのまま市名にする案が最後の2つまで残ったこと自体、この地域が風土記の名をどれだけ誇りにしてきたかを物語ります。選ばれたのは現在の「宍粟」でしたが、読みの「しそう」の成り立ちとして市公式の計画が伝えるのは、伊和大神が舌を出した大きな鹿に出会って「シシアワ（鹿に逢う）」と名づけたという伝承です。神話の世界の話ではありますが、その響きがシサワ、シソウへと姿を変えながら現代の市名に届いている、という語りは大切にされています。
    sources:
    - x3-uub-shiso
    - x3-shiso-bunkazai
  relations:
  - pref/28
  unknowns:
  - 「宍禾」から「宍粟」へ表記が切り替わった時期と経緯は未確認
  - 新市名選定の合併協議会公式記録は未確認で、候補の経緯は自治体沿革データベースの紹介によった
  updated: '2026-11-13'
- id: muni/28-宝塚市
  code: '282146'
  names:
    ja: 宝塚市
    reading: たからづかし
    aliases:
    - 小浜
    - 宝塚温泉
  user_terms:
  - 宝塚の名前の由来
  - 宝塚の塚って何の塚
  - 宝塚市はいつできたの
  - 歌劇と温泉の市の名前
  naming_type: 中心地名の継承
  naming_note: 宝塚町の名を継承
  formation: 合併新設
  prefecture: 兵庫県
  homonyms: []
  summary: 「宝塚」はもともと川辺郡米谷村にあった塚の名で、元禄頃の地誌『摂陽群談』が「この塚のあたりで物を拾う者には必ず幸いがある」という伝承とともに伝えた。1887年に武庫川対岸の伊孑志村で温泉が開かれて「宝塚温泉」と名乗り、1911年の新温泉と1914年の宝塚少女歌劇で名が全国に広がった。1951年に小浜村が町制施行して宝塚町となり、1954年に良元村と合併して宝塚市が誕生した。
  first_attestation:
    era: 江戸時代
    year_western: 1701
    document: 摂陽群談
    note: 国立国会図書館によれば、元禄頃に成立した『摂陽群談』に、川辺郡米谷村の塚の名として「宝塚」が見えるのが確認できる早い用例
  claims:
  - text: 国立国会図書館によれば、「宝塚」はもともと川辺郡米谷村にあった塚の名前で、『摂陽群談』は「此塚の許に於いて、物を拾う者、必ず幸あり。是を以って、宝塚と号る」と伝える（地方公共団体コードは282146）
    kind: fact
    level: E2
    status: established
    sources:
    - l4-takarazuka-ndl
    - b-cap-chiba-soumu-code
  - text: 塚の正体については、宝塚は古墳を指すとも、物を拾った者に幸運が舞い込んだという言い伝えとも、宝物が埋まっているという言い伝えともいわれると宝塚市の公式見解は述べる
    kind: legend
    level: E2
    status: contested
    sources:
    - l4-takarazuka-city-faq
  - text: 1887年（明治20年）、武庫郡伊孑志村で橋本宗吉が温泉を開業し、付近にあった宝塚の名にちなんで「宝塚温泉」と命名したと国立国会図書館は述べる
    kind: fact
    level: E2
    status: established
    sources:
    - l4-takarazuka-ndl
  - text: 1911年（明治44年）に宝塚新温泉が開湯し、1914年（大正3年）に宝塚少女歌劇が誕生した
    kind: fact
    level: E2
    status: established
    sources:
    - l4-takarazuka-city-kousou
  - text: 川辺郡小浜村は1951年（昭和26年）3月15日に町制を施行して宝塚町となり、1954年（昭和29年）4月1日に武庫郡良元村と合併して宝塚市が誕生した
    kind: fact
    level: E2
    status: established
    sources:
    - l4-takarazuka-city-shishi
  - text: 1955年（昭和30年）3月10日に長尾村、3月14日に西谷村を編入し、長尾村の一部（検見川・山原）は同年4月1日に伊丹市へ移った
    kind: fact
    level: E2
    status: established
    sources:
    - l4-takarazuka-city-shishi
  - text: 名のもとになった塚があったのは米谷村（現在の宝塚市米谷）であり、塚の名は温泉の名として武庫川の対岸一帯に広がったもので、名前の発生地点と現在の中心市街地は川を隔てている
    kind: fact
    level: E2
    status: established
    sources:
    - l4-takarazuka-ndl
  column:
    title: 「塚」の字に点がある理由
    text: 宝塚市の公式表記で使う「塚」の字には、点（ヽ）が打たれている。これは宝塚市が公式に示している表記で、市の刊行物や案内板でも点のある「塚（ヽ付き）」が使われている。歌劇と温泉で全国に知られる地名の、意外と知られていない一文字のこだわりである。ちなみに名のもとの塚は、中心市街地とは武庫川を挟んだ対岸、米谷の地にあったと伝えられる。
    sources:
    - l4-takarazuka-city-faq
    - l4-takarazuka-ndl
  relations:
  - pref/28
  - muni/28-伊丹市
  unknowns:
  - 米谷にあった塚のうち、どの古墳が「宝塚」と呼ばれたかは特定されていない
  - 『摂陽群談』の刊行年は「元禄頃」とされるにとどまり厳密な確認は未了
  updated: '2026-11-13'
- id: muni/28-小野市
  code: '282189'
  names:
    ja: 小野市
    reading: おのし
    aliases:
    - 小野町
    - 門前村小野
  user_terms:
  - おの
  - そろばんのまち
  - 播州そろばんの産地
  naming_type: 中心地名の継承
  formation: 合併新設
  prefecture: 兵庫県
  homonyms: []
  summary: 1954年に小野町など6町村が合併して市制施行した市で、市名は中心地「小野」の継承である。「小野」はもともと原野を指す言葉に由来するとみられ、一帯を「小野の原」といったという伝承や、大きな原野を「オノ」と呼んだとする説が併記されている。市名採用の理由として、そろばんの産地として「小野」の名に商業上の信用があったことが『小野市誌』に記されている。
  first_attestation:
    era: 江戸時代
    year_western: 1653
    document: 『日本歴史地名大系』29-2「小野」項（国立国会図書館レファレンス協同データベースの小野市立図書館回答が引く）
    note: 『日本歴史地名大系』は、市名は承応2年（1653）に一柳直次が門前村小野に築いた陣屋周辺に形成された小野町の町名を継承すると解説する。中世以前の「小野」の用例は未確認である
  claims:
  - text: 小野市は昭和29年（1954）12月1日に、加東郡小野町・河合村・来住村・市場村・大部村・下東条村の6町村が合併して市制施行し誕生した
    kind: fact
    level: E2
    status: established
    sources:
    - x3-ono-reiki
  - text: 『日本歴史地名大系』は、市名「小野」は、一柳直次が承応2年（1653）に門前村小野に築いた陣屋周辺に形成された小野町の町名を継承すると解説する
    kind: fact
    level: E2
    status: established
    sources:
    - x3-ndl-ono
  - text: 『小野市誌』は市名採用の理由として、中心地「小野」が一柳家の陣屋以来この一帯を代表する名として広く知られていたこと、特産の算盤（そろばん）が日本一の生産量で「小野」の名が商取引上の信用として欠かせなかったこと、呼称が簡潔平易で誤読がないことを挙げると、レファレンス協同データベースの小野市立図書館回答が紹介する
    kind: fact
    level: E2
    status: established
    sources:
    - x3-ndl-ono
  - text: 『角川日本地名大辞典』28の「小野」項は、「何々の小野」というように周辺の里名を冠して読むのが普通だったという説（小野旧藩誌）を紹介すると、同回答が伝える
    kind: fact
    level: E2
    status: contested
    sources:
    - x3-ndl-ono
  - text: 同じく『角川日本地名大辞典』が紹介する伝承では、一柳氏の城下となった地は昔は小丘陵地で、その一帯の原野を「小野の原」といったという（加東郡誌）
    kind: legend
    level: E2
    status: established
    sources:
    - x3-ndl-ono
  - text: 『ひょうごの地名』は、「小野」は小さな原野ではなく、大きな原野である大野を「オノ」と呼んだものとみる
    kind: fact
    level: E2
    status: contested
    sources:
    - x3-ndl-ono
  - text: 小野は1915年（大正4年）に町制施行して小野町となり、市制直前まで加東郡に属していた
    kind: fact
    level: E2
    status: established
    sources:
    - x3-ndl-ono
  - text: 総務省の全国地方公共団体コードで、小野市の団体コードは282189と定められている
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: そろばんの信用が市名を決めた
    text: 市名の理由に「商売上の信用」がはっきり書かれている例は珍しくありませんが、小野市の場合はそれが際立っています。『小野市誌』が挙げる採用理由の一つは、播州そろばんが日本一の生産量を誇り、「小野」の名が商取引上の声価（信用）として欠かせなかったから、というものでした。つまり「小野」は地名であると同時に、全国の問屋に通じるブランド名だったのです。一方で「小野」そのものの語源については、大野をオノと呼んだとする説や、「小野の原」という原野の伝承など、諸説が併記されたまま決着していません。
    sources:
    - x3-ndl-ono
  relations:
  - pref/28
  - muni/28-加東市
  unknowns:
  - 『和名類聚抄』の加東郡に「小野郷」があったかは確認できず、「小野」の中世以前の用例は未確認である
  - 氏族の小野氏（小野妹子など）とこの「小野」の関係を示す資料は確認できなかった
  updated: '2026-11-13'
- id: muni/28-尼崎市
  code: '282022'
  names:
    ja: 尼崎市
    reading: あまがさきし
    aliases:
    - 尼ヶ崎
    - 海士崎
    - 海人崎
  user_terms:
  - 尼崎の名前の由来
  - あまがさきの語源
  - 尼ヶ崎と尼崎はどっちが本来の表記なの
  - 漁民の町から来た地名
  naming_type: 中心地名の継承
  formation: 単独発足
  prefecture: 兵庫県
  homonyms: []
  summary: 市名は中世以来の港町「尼崎」の継承。久安年間（1145〜1151年）以後に新しくできた土地と古文書に記され、漁民を意味する「アマ」と海に突き出た土地「サキ」の結合と説明される。中世には「海士崎」「海人崎」とも書かれた。大正5年（1916年）に市制を施行した。
  first_attestation:
    era: 久安年間（1145〜1151年）
    year_western: null
    document: 大物浜・長洲浜請文（真福寺文書）
    note: 尼崎市公式が「尼崎」の最古の用例として挙げる文書で、成立は平安時代末〜鎌倉時代初期とされる。文中に「久安以後の新出地」とあることから、地名の成立自体は久安年間ごろにさかのぼるとみられる
  claims:
  - text: 尼崎市の地方公共団体コードは282022である（総務省「地方公共団体コード一覧」による）
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  - text: 「尼崎」の最古の用例は平安時代末〜鎌倉時代初期の「大物浜・長洲浜請文」（真福寺文書）で、尼崎浜は久安年間（1145〜1151年）以後に新しくできた土地と記されている
    kind: fact
    level: E2
    status: established
    sources:
    - k5-amagasaki-city-yurai
  - text: もとの「尼崎」は現在の阪神尼崎駅から大物駅の南側あたりにあった土地で、現在の市中心部とは位置がずれている
    kind: fact
    level: E2
    status: established
    sources:
    - k5-amagasaki-city-yurai
  - text: 尼崎市公式の由来説明では、「尼崎」は漁民・海民を意味する「アマ」と、海に突き出た土地を意味する「サキ」が結びついた地名とされる
    kind: fact
    level: E2
    status: established
    sources:
    - k5-amagasaki-city-yurai
  - text: 中世の史料には「尼崎」のほかに「海士崎」「海人崎」「海ヶ崎」「尼カ崎」などの表記が見られ、このうち「海士崎」「海人崎」は海士・海人（あま）が住む崎という地名本来の由来を表す表記であろうと考えられている
    kind: fact
    level: E2
    status: established
    sources:
    - k5-amagasaki-ndl-ref
  - text: 町制時代の正式な表記は「尼ヶ崎町」だったが、大正5年（1916年）の市制施行にあたり、町当局は古文書に「尼崎」とあることを根拠に「尼崎」が本来の表記であるとして市名に「尼崎市」を希望し、そのとおりに定められた
    kind: fact
    level: E2
    status: established
    sources:
    - k5-amagasaki-ndl-ref
  - text: 大正5年（1916年）4月1日、尼崎町と立花村の一部（東難波・西難波）が合併して市制を施行し、尼崎市が発足した（当時の人口は32,013人で、兵庫県内では3番目、全国では66番目の市制施行）
    kind: fact
    level: E2
    status: established
    sources:
    - k5-amagasaki-zusetsu
  column:
    title: 「尼ヶ崎」と書くか「尼崎」と書くか
    text: 中世以来、「尼崎」の表記は一つではなかった。「海士崎」「海人崎」という由来を思わせる書き方から、近世の「尼ヶ崎」までが混用され、町制時代の正式表記は「尼ヶ崎町」だった。ところが町の公文書はほぼ例外なく「尼崎町」と書かれていた。1916年の市制施行の際、町当局は信長・秀吉時代の古文書に「尼崎」とある例を引いて、これが本来の表記であると国に上申し、市名は「尼崎市」に決まった。それでも「尼ヶ崎」の表記は慣例として長く残り、平成の直木賞受賞小説『赤目四十八瀧心中未遂』（車谷長吉）は、作中の地名をすべて「尼ヶ崎」で統一している。
    sources:
    - k5-amagasaki-ndl-ref
  relations:
  - pref/28
  unknowns:
  - 「大物浜・長洲浜請文」自体の正確な成立年代（平安末か鎌倉初期か）には幅がある
  - 久安年間の「新出地」の記述以前に、この地が何と呼ばれていたかは不明
  updated: '2026-11-13'
- id: muni/28-川西市
  code: '282171'
  names:
    ja: 川西市
    reading: かわにしし
    aliases:
    - 川西町
    - 川西村
  user_terms:
  - 川西の名前の由来
  - かわにし
  - 清和源氏発祥の地
  - 能勢電鉄の川西
  naming_type: 方位・位置による命名
  formation: 合併新設
  prefecture: 兵庫県
  homonyms:
  - muni/06-川西町
  - muni/29-川西町
  summary: 川西は猪名川の西岸一帯を指す方角地名で、江戸時代からこの地方の呼び名だったと伝わる。1889年に11か村が合併して川西村が発足する際、「山根村」「秋津村」の候補を退けて選ばれた名である。市域の多田は清和源氏の本拠地として知られ、1954年に川西町・多田村・東谷村が合併して川西市が誕生した。
  first_attestation:
    era: 江戸時代
    year_western: null
    document: 未確認
    note: 江戸時代から猪名川西岸の地方を指す呼び名だったと郷土館の展示資料は伝えるが、文献上の初出は確認できなかった
  claims:
  - text: 地方公共団体コードは282171である
    kind: fact
    level: E2
    status: established
    sources:
    - d-cap-jlis-hyogo
  - text: 「川西」は一般に川の西側を意味する地名で、兵庫県の川西は猪名川を隔てて大阪府池田市と相対する地を指す
    kind: fact
    level: E3
    status: established
    sources:
    - p4-kotobank-kawanishi
  - text: 川西市郷土館の展示資料によれば、1889年（明治22年）に11か村が合併して川西村が発足した際、村名の候補には「山根村」「秋津村」もあったが、猪名川西岸の地という意味で江戸時代からこの地方を指す呼び名であった「川西」が選ばれた
    kind: fact
    level: E4
    status: established
    sources:
    - p4-kawanishi-panel
  - text: 川西村は大正14年（1925年）に町制を施行して川西町となった
    kind: fact
    level: E2
    status: established
    sources:
    - p4-kawanishi-city-keii
  - text: 1954年（昭和29年）8月1日、川西町・多田村・東谷村が合併して川西市が誕生した
    kind: fact
    level: E2
    status: established
    sources:
    - p4-kawanishi-archive
  - text: 国土交通省の川の資料によれば、川辺郡多田庄（現在の川西市多田）は摂津源氏の本拠地であった
    kind: fact
    level: E2
    status: established
    sources:
    - p4-mlit-inagawa
  - text: 川西市は市の歴史資料で市域が清和源氏の発祥の地であることを伝えており、住宅地名「清和台」もそれに由来すると説明する
    kind: fact
    level: E2
    status: established
    sources:
    - p4-kawanishi-city-history
  column:
    title: 候補に敗れた「山根村」と「秋津村」
    text: 明治の町村合併で生まれた川西村には、別の名前の案があった。「山根村」と「秋津村」である。しかし実際に選ばれたのは、猪名川の西という位置そのものを名乗る「川西」だった。江戸時代から一帯を指す呼び名として定着していたことが決め手になったと、市の郷土館の展示は伝える。派手さはないが間違えようのない方角地名が、新しい村の名として生き残り、そのまま市名にもなった。
    sources:
    - p4-kawanishi-panel
  relations:
  - pref/28
  - muni/06-川西町
  - muni/29-川西町
  unknowns:
  - 「川西」という呼び名の文献上の初出は確認できなかった
  - 山形県川西町・奈良県川西町との由来の異同は相手側レコードで別途確認する
  updated: '2026-11-13'
- id: muni/28-市川町
  code: '284424'
  names:
