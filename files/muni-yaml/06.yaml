  prefecture: 山形県
  homonyms: []
  summary: 西置賜郡北部、最上川が町の中央を南から北へ貫流する町。1954年（昭和29年）10月1日に荒砥町・蚕桑村・鮎貝村・十王村・白鷹村・東根村の1町5村が合併して発足した。新町名は関係町村の投票で決められ、旧中心地の荒砥を抑えて、東北にそびえる白鷹山（標高994メートル）の名が選ばれた。白鷹山は山頂に福満大虚空蔵尊を祀る信仰の山で、翌1955年には朝日町の一部（針生）を編入して現在の町域となった。
  first_attestation:
    era: 昭和29年
    year_western: 1954
    document: 町村合併による白鷹町の発足
    note: 町名としての初出。由来となった山名「白鷹山」の文献上の初出は特定できていない
  claims:
  - text: 1954年（昭和29年）10月1日、荒砥町・蚕桑村・鮎貝村・十王村・白鷹村・東根村の1町5村が合併して白鷹町が発足し、翌1955年に西村山郡朝日町の一部（針生）を編入した
    kind: fact
    level: E2
    status: established
    sources:
    - z12-shirataka-town-tokei
  - text: 新町名は合併関係町村による投票で決められ、白鷹町20票・荒砥町16票・その他5票で「白鷹町」が選ばれた（白鷹町史の記述）
    kind: fact
    level: E2
    status: established
    sources:
    - z12-shirataka-townshi
  - text: 町史によれば新町名「白鷹」は東北方にそびえる白鷹山の名から取られ、合併処分申請書に添付された名称選定理由には、白鷹虚空蔵菩薩への信仰が厚く住民の意識から自然な名である旨が記されていた（申請書そのものは町史経由の確認）
    kind: fact
    level: E2
    status: established
    sources:
    - z12-shirataka-townshi
  - text: 白鷹山は標高994メートルで、山頂には日本五大虚空蔵の一つとされる福満大虚空蔵尊が祀られ、農業・養蚕の神として地域の信仰を集めてきた
    kind: fact
    level: E2
    status: established
    sources:
    - z12-shirataka-rinya
    - z12-shirataka-maff-pdf
  - text: 合併以前から「白鷹村」が存在し、1889年（明治22年）に萩野村・滝野村・十王村・中山村が合併して発足したが、1892年に十王が分離して十王村となった
    kind: fact
    level: E5
    status: established
    sources:
    - z12-shirataka-wiki-old
  - text: 白鷹山の名は、奈良時代の高僧・行基がこの地を訪れた際に白い鷹が飛来し、そこに虚空蔵菩薩が現れたため、行基が山頂に虚空蔵菩薩を祀って命名したという伝説が伝わる
    kind: legend
    level: E2
    status: established
    sources:
    - z12-shirataka-maff-pdf
  - text: 山名の由来には、冬に雪を抱いた山容が翼を広げた鷹に見えることから名づけられたとする説もある
    kind: fact
    level: E2
    status: contested
    sources:
    - z12-shirataka-maff-pdf
  - text: 「白鷹」が「しらかた」と読まれた記録は確認できず、総務省の地方公共団体コード一覧でもカナ表記は「シラタカ」とされる
    kind: fact
    level: E2
    status: indeterminate
    sources:
    - b-cap-chiba-soumu-code
  - text: 白鷹町の地方公共団体コードは064025である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 20対16で決まった町名
    text: 1954年の合併で、新しい町の名は投票に委ねられた。中心地・荒砥町の名を推す声も強く、決着は再投票にもつれ込み、白鷹町20票・荒砥町16票という僅差で「白鷹」が勝ったと町史は伝える。選ばれたのはどの集落の名でもなく、地域を見下ろす信仰の山の名だった。山頂の福満大虚空蔵尊は置賜・村山の両地域から参詣を集め、米沢藩の名君・上杉鷹山の号「鷹山」の由来とも伝えられる。六つの町村のどれにも属さない山の名だからこそ、新しい町の旗印になり得たのだろう。
    sources:
    - z12-shirataka-townshi
    - z12-shirataka-maff-pdf
  relations:
  - pref/06
  unknowns:
  - 「しらかた」という読みが歴史的に使われたかどうかは確認できなかった（現行の読みは「しらたか」で、総務省コード一覧のカナも「シラタカ」）
  - 山名「白鷹」の文献上の初出は特定できていない
  - 旧白鷹村（1889年発足）の村名が白鷹山に由来することの直接の典拠は確認できなかった
  updated: '2026-11-13'
- id: muni/06-真室川町
  code: 063649
  names:
    ja: 真室川町
    reading: まむろがわまち
    aliases:
    - 真室川
    - 真室川村（1889〜1950年）
  user_terms:
  - 真室川
  - まむろがわ
  - 真室川音頭の町
  - 梅の里
  - 原木なめこ
  naming_type: 自然地名から
  naming_note: 川名「真室川」を1889年の合併新村名に採用
  formation: 合併新設
  prefecture: 山形県
  homonyms: []
  summary: 山形県最北部の山間の町で、真室川と鮭川が町の南部で合流する。町名は川の名「真室川」に由来するとされ、1889年（明治22年）に内町・木ノ下・新町・平岡・川ノ内の5村を併せた新村名として河川名から採られた。「まむろ」の語源は確定していない。民謡「真室川音頭」の発祥地として町名は全国に知られる。
  first_attestation:
    era: 明治22年
    year_western: 1889
    document: 町村制施行による真室川村の成立
    note: 自治体名としての初出。川名「真室川」そのものの文献初出は確認できていない
  claims:
  - text: 町名は川の名「真室川」に由来し、1889年（明治22年）の合併に際して河川名に因んで新しく命名されたと地名資料は伝える。真室川は神室山地に発して西流し、鮭川に合流する川である
    kind: fact
    level: E4
    status: established
    sources:
    - z12-mamuro-folklore
  - text: 「まむろ」の語源は確定しておらず、真（ま）を「澗」と同義の船着き場、室（むろ）を集落の意とする説と、接頭語の「マ」と「モリ（高くなった所）」の転訛とする説が紹介されている
    kind: fact
    level: E4
    status: contested
    sources:
    - z12-mamuro-folklore
  - text: 1889年（明治22年）の市町村制施行にあたり、内町・木ノ下・新町・平岡・川ノ内の各村を併せて真室川村となった
    kind: fact
    level: E2
    status: established
    sources:
    - z12-mamuro-town-kaso
  - text: 1950年（昭和25年）4月1日に真室川村が町制を施行し、1956年（昭和31年）9月30日に真室川町・安楽城村・及位村の1町2村が合併して現在の真室川町となった
    kind: fact
    level: E2
    status: established
    sources:
    - z12-mamuro-town-kaso
    - z12-mamuro-town-gaiyo
  - text: 町内では真室川と鮭川が数多くの支流を合わせて流れ下り、町の中心部は両川と金山川の下流部の合流地点の台地にあり、平地や集落はこれら河川の流域に点在する
    kind: fact
    level: E2
    status: established
    sources:
    - z12-mamuro-town-gikai
    - z12-mamuro-town-gaiyo
  - text: 永禄6年（1563年）、鮭延秀綱が内町の鮭川の高台に鮭延城を築城したとされる
    kind: fact
    level: E5
    status: established
    sources:
    - z12-mamuro-wiki
  - text: 民謡「真室川音頭」によって町の名は全国に広まった。町は1952年（昭和27年）に歌詞を公募して「正調真室川音頭」を定めている
    kind: fact
    level: E2
    status: established
    sources:
    - z12-mamuro-town-ondo
  - text: 真室川町の地方公共団体コードは063649である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 町の名より有名な歌の名
    text: 「真室川という場所は知らないが、真室川音頭は知っている」という人が少なくない、と県の観光サイトはいう。町公式の説明では、元唄は出稼ぎの人々が歌った「カムチャッカ節」で、料亭で働いていた近岡ナカエが創作を加えて歌ったのが始まりとされる（北海道の「ナット節」を女川の漁師から習ったとする紹介もある）。真室鉱山や軍用飛行場建設に集まった労働者たちに歌い広められ、戦後に彼らが全国へ散ったことで一気に広まった。1952年に町が歌詞を公募して定めた「正調真室川音頭」は、いまも全国大会が開かれるほど愛唱されている。川の名として生まれた「まむろがわ」は、歌の名として全国に届いた。
    sources:
    - z12-mamuro-town-ondo
  relations:
  - pref/06
  - muni/06-鮭川村
  - muni/06-金山町
  unknowns:
  - 「まむろ」の語源は諸説あり（澗＋集落説、マ＋モリ転訛説）、専門辞典による確定は確認できなかった
  - 川名「真室川」の文献上の初出は確認できていない
  - 真室川音頭の元唄については、町公式の説明の中でも「カムチャッカ節」説と「ナット節」説が併存し、どちらが原型かは確定していない
  updated: '2026-11-13'
- id: muni/06-米沢市
  code: '062022'
  names:
    ja: 米沢市
    reading: よねざわし
    aliases:
    - 米澤
  user_terms:
  - 米沢の名前の由来
  - 上杉の城下町
  - 米沢牛のふるさと
  naming_type: 中心地名の継承
  formation: 単独発足
  prefecture: 山形県
  homonyms: []
  summary: 市公式資料によれば地名は中世後期から見られ、語源には「米のなる沢」説と「米井(よねい)」説がある。長井氏・伊達氏・上杉氏が本拠とした城下町で、1889年に最初期の市の一つとなった。
  first_attestation:
    era: 中世後期
    year_western: null
    document: 米沢市「市勢要覧2025」(「米沢の地名は中世後期から見られる」)
    note: 具体的な初出史料の名は市公式資料に示されていない。米沢城は暦仁元年(1238年)に長井時広が築いたと伝えられ、少なくとも鎌倉時代後半には「米沢」が城とその周辺の名として成立していたとみられる。
  claims:
  - text: 米沢市市勢要覧は「米沢の地名は中世後期から見られる」とする。
    kind: fact
    level: E2
    status: established
    sources:
    - m2-yonezawa-yoran
  - text: 地名の由来には、ヨネ(米)のなるサワ(草の生える湿地)とする説と、白い水が湧く米井(よねい)があることからきたとする説がある(米沢市市勢要覧)。
    kind: fact
    level: E2
    status: contested
    sources:
    - m2-yonezawa-yoran
  - text: 米沢城は暦仁元年(1238年)に長井時広が築いたと伝えられ、以後伊達氏・上杉氏の本拠となった。
    kind: fact
    level: E5
    status: established
    sources:
    - m2-yonezawa-castle-wiki
  - text: 鎌倉時代に地頭が置かれてまちが形成され、米沢は伊達氏が212年間、上杉氏が272年間本拠とした城下町として栄えた。城下町の基礎は直江兼続が築いた(米沢市資料)。
    kind: fact
    level: E2
    status: established
    sources:
    - m2-yonezawa-yoran
  - text: 明治22年(1889年)4月1日、米沢市は日本で最初に市制を施行した31市の一つとして発足し、昭和28〜30年(1953〜55年)に周辺10村と合併した(米沢市市勢要覧)。
    kind: fact
    level: E2
    status: established
    sources:
    - m2-yonezawa-yoran
  - text: 米沢市の地方公共団体コードは062022である(総務省「地方公共団体コード一覧」)。
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 城下町を設計した家老・直江兼続
    text: 米沢の城下町の基礎を築いたのは、上杉景勝の家老・直江兼続とされる。景勝が会津から米沢へ移った慶長6年(1601年)以降、兼続は城下の整備と殖産に力を注ぎ、以後の上杉氏272年の治世の土台を作った。「米沢」という地名が城下町の名として定着していくのはこの時期である。
    sources:
    - m2-yonezawa-yoran
  relations:
  - pref/06
  unknowns:
  - 地名「米沢」の具体的な初出史料(文書名・年次)は市公式資料に示されておらず未特定
  - 語源の「米のなる沢」説と「米井」説のいずれが有力かについての定説は確認できていない
  updated: '2026-11-13'
- id: muni/06-舟形町
  code: '063631'
  names:
