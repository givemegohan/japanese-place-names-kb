  w5-noda-city-shoyu:
    label: 野田市公式「野田の醤油発祥地」（市指定史跡の解説。野田の近世の醤油醸造は寛文元年（1661年）に髙梨兵左衛門が醸造を開始してから商品化が進んだと考えられること、明治20年（1887年）に野田醤油醸造組合が結成されたこと、大正6年（1917年）に茂木・髙梨両一族の八家合同で野田醤油株式会社（キッコーマン株式会社の前身）が誕生したことを記す）
    url: https://www.city.noda.chiba.jp/kurashi/kyoiku/bunka/1000550/1003454/1000567.html
  w5-noda-kotobank:
    label: コトバンク「野田」（『日本大百科全書（ニッポニカ）』の「野田（市）」解説と『デジタル大辞泉』の「野田」の語釈を収載。ニッポニカは、地名は広い原野に水田が開かれたことに由来すること、昭和25年（1950年）に野田町と旭・七福・梅郷の3村が合併して市制を施行し、平成15年（2003年）に関宿町を編入したこと、平安時代末に下河辺荘に属し中世には関宿城主簗田氏に支配されたことを記す。大辞泉は「野田」を「野の中にある田」と解する）
    url: https://kotobank.jp/word/%E9%87%8E%E7%94%B0-112248
  w5-shiroi-city-rekishi:
    label: 白井市公式「白井市誕生までの軌跡」（明治22年（1889年）に白井村谷清村組合村が誕生し、村名は当時最も知られていた白井橋本村の通称「白井」を踏襲したといわれること、大正2年（1913年）に単独の白井村となったこと、昭和39年（1964年）9月1日に町制を施行して白井町となったこと、平成13年（2001年）4月に市制を施行して白井市が誕生したことを記す）
    url: https://www.city.shiroi.chiba.jp/manabu/rekishi/r02/1421654504129.html
  w5-shiroi-museum-chimei:
    label: 白井市郷土資料館「白井市の地名」（白井市郷土資料館2005『白井の地名‐ニュータウン開発以前の字地名‐』に基づく解説。白井の名の起源は郷名「白井郷」で、確実に遡れる史料は慶長7年（1602年）『下総国印西庄外郷白井郷之内橋本之郷水帳』であること、白井郷は室町時代当初から天正10年（1582年）までの間に成立したと考えられること、語源として旧・埴生西冨谷郷の範囲と重なることから冨谷→代囲→白井という変化の過程を想像できるとすること、白井が全国有数の日本梨の産地で梨栽培は明治38年（1905年）頃に始まったと伝えられることを記す）
    url: https://www.center.shiroi.chiba.jp/kyoudo/knowledge.html
  w5-sodegaura-city-plan:
    label: 袖ケ浦市総合計画（袖ケ浦市公式。沿革として、「袖ケ浦」の名は『古事記』の日本武尊が相模国からの東征の折に走水を渡る際に大時化に遭い、海神の怒りを鎮めるため海中に身を投じた妃・弟橘姫の袖がこの地方の海岸に流れ着いたという伝説に由来し、昭和30年（1955年）に旧袖ヶ浦町の誕生の際に町名として採用されたものであること、室町時代には「横田郷」と呼ばれる大きな村ができていたこと、高度経済成長期に海岸の埋め立て造成により石油化学やエネルギー関連のコンビナートが形成され京葉工業地域の一翼を担ったこと、昭和46年（1971年）11月3日に旧袖ヶ浦町と旧平川町が合併して新たな袖ヶ浦町が発足したこと、平成3年（1991年）4月1日に市制を施行して袖ケ浦市が誕生したことを記す）
    url: http://www.city.sodegaura.lg.jp/uploaded/attachment/22268.pdf
  w5-urayasu-city-chimei:
    label: 浦安市公式「地域名の由来」（市内19大字の由来を解説。猫実は「根越さね」の転訛という言い伝え、当代島は「当代にできた島」から名付けられたという言い伝え、堀江は鎌倉時代に小さな港が作られたことからという言い伝え、埋立地の大字は漁場名などにちなむ命名であることを記す）
    url: https://www.city.urayasu.lg.jp/shisei/profile/profile/1000021.html
  w5-urayasu-city-tanjou:
    label: 浦安市公式「浦安村の誕生」（明治22年（1889年）に堀江・猫実・当代島の3村が合併して浦安村が誕生したこと、命名は初代村長・新井甚左衛門が漁浦の安泰を祈願して名付けたといわれること、別説として日本国が昔「浦安の国」と称したことにちなむともいわれること、明治42年（1909年）の町制、昭和39年（1964年）からの海面埋立の本格化、昭和56年（1981年）の市制施行、昭和58年（1983年）の東京ディズニーランド開園を記す）
    url: https://www.city.urayasu.lg.jp/shisei/profile/rekishi/1001461.html
