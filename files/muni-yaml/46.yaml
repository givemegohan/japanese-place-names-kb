records:
- id: muni/46-いちき串木野市
  code: '462195'
  names:
    ja: いちき串木野市
    reading: いちきくしきのし
    aliases:
    - 串木野市
    - 市来町
    - 櫛木野
  user_terms:
  - 串木野
  - いちき
  - マグロのまち
  - さつま揚げ発祥の地
  naming_type: 合成地名
  formation: 合併新設
  prefecture: 鹿児島県
  homonyms: []
  summary: 平成17年（2005年）10月11日、串木野市と日置郡市来町が新設合併して発足した市。市名は旧市来町の「市来（いちき）」を平仮名にし、旧串木野市の「串木野」をそのまま連ねた合成地名で、平仮名と漢字を組み合わせた全国的にも珍しい形式である。「串木野」は近世の外城名に遡り、旧表記に「櫛木野」がある。「市来」は平安時代に市来院が置かれた古い地名である。
  first_attestation:
    era: null
    year_western: null
    document: null
    note: 「いちき串木野」という市名自体は2005年の合併で生まれた命名そのものが初出。構成要素では「市来」が平安時代の市来院に、「串木野」が近世の串木野郷に遡るが、各語の文献上の確かな初出は特定できなかった
  claims:
  - text: いちき串木野市の地方公共団体コードは462195である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  - text: いちき串木野市は平成17年（2005年）10月11日、串木野市と日置郡市来町の新設合併で発足した
    kind: fact
    level: E2
    status: established
    sources:
    - s4-ichiki-city-ayumi
    - s4-ichiki-uub
  - text: 新市名は公募により決定され、旧市来町の「市来」と旧串木野市の「串木野」を連ねた合成地名である
    kind: fact
    level: E4
    status: established
    sources:
    - s4-ichiki-jlogos
  - text: 串木野は昭和25年（1950年）に市制を施行した旧市で、「串木野」の旧表記として「櫛木野」がある
    kind: fact
    level: E3
    status: established
    sources:
    - s4-kushikino-kotobank
  - text: 串木野郷は江戸時代の鹿児島藩の外城の一つで、上名村・下名村・荒川村・羽島村の四か村からなっていた
    kind: fact
    level: E3
    status: established
    sources:
    - s4-kushikinogou-kotobank
  - text: 「串木野」の語源については、冠岳神社の祭神・櫛御気命にちなむという説、葦の生い茂る所を意味するアイヌ語に由来するという説、神が臥木（ふしき）で仮宿した故事に由来するという説などが伝えられ、定説はない
    kind: fact
    level: E4
    status: contested
    sources:
    - s4-ichiki-jlogos
  - text: 市来には平安時代に市来院（倉院）が置かれており、昭和5年（1930年）に西市来村が町制施行と同時に市来町と改称した
    kind: fact
    level: E3
    status: established
    sources:
    - s4-ichiki-kotobank
  - text: 「市来」は「市が立つ里」の意味であるという解釈が地名解説で紹介されている
    kind: fact
    level: E5
    status: indeterminate
    sources:
    - s4-ichiki-folklore
  column:
    title: 平仮名と漢字を連ねた市名
    text: 合併した両市町の名前をどちらも残すため、「市来」を平仮名の「いちき」にして「串木野」の前に連ねたのが「いちき串木野市」である。平仮名部分と漢字部分が同居する市名は全国でも例が少なく、旧市来町域の住民にとっては、自治体名としては消えた「市来」の読みだけが市名の先頭に残った形になった。なお旧串木野市の「串木野」には「櫛木野」という旧表記があり、現在の表記自体も歴史の中で定着したものである。
    sources:
    - s4-ichiki-jlogos
    - s4-kushikino-kotobank
  relations:
  - pref/46
  - muni/46-日置市
  unknowns:
  - 「串木野」「市来」それぞれの文献上の確かな初出（出典名と年代）は特定できなかった
  - 新市名の公募件数や最終候補の一覧は、合併協議会の一次資料では確認できなかった
  - 「市来」を平仮名表記にした決定理由の公式記録は確認できなかった
  updated: '2026-11-13'
- id: muni/46-さつま町
  code: '463922'
  names:
    ja: さつま町
    reading: さつまちょう
    aliases: []
  user_terms:
  - さつま
  - サツマ
  - 薩摩郡の町
  - 宮之城のある町
  naming_type: 旧国名・広域地名の採用
  formation: 合併新設
  prefecture: 鹿児島県
  homonyms: []
  summary: 2005年（平成17年）3月22日、薩摩郡の宮之城町・鶴田町・薩摩町の3町が新設合併して発足した町。町名は3町に共通する旧国名・郡名「薩摩」を平仮名にしたもので、新町名の最終候補には漢字の「薩摩」も残ったが、平仮名の「さつま」が選ばれた。旧3町のうち薩摩町は漢字表記のまま1954年から存在しており、読みは同じでも表記を変えた命名である。
  first_attestation:
    era: 平成時代
    year_western: 2005
    document: 宮之城町・鶴田町・薩摩町合併協議会による新町名称の決定（2005年3月22日さつま町発足）
    note: 平仮名表記の自治体名「さつま」としての初出はこの命名そのもの。読みの源である旧国名「薩摩」は古代以来の国名で、郡名としても続いていた
  claims:
  - text: さつま町の地方公共団体コードは463922である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  - text: さつま町は2005年（平成17年）3月22日に宮之城町・鶴田町・薩摩町の3町が新設合併して発足した
    kind: fact
    level: E2
    status: established
    sources:
    - s1-satsuma-net-plan
    - s1-satsuma-uub
  - text: 新町名は候補19点から最終候補6点（薩摩・さつま・北さつま・新さつま・宮之城・さつみ）に絞られ、平仮名の「さつま」が選ばれた
    kind: fact
    level: E4
    status: established
    sources:
    - s1-satsuma-uub
  - text: 合併する3町はいずれも薩摩郡に属しており、町名「さつま」は旧国名であり郡名でもある「薩摩」の平仮名表記である
    kind: fact
    level: E4
    status: established
    sources:
    - s1-satsuma-uub
  - text: 旧薩摩町は1954年（昭和29年）12月1日に永野村・求名村・中津川村が合併して発足した町で、漢字表記の「薩摩町」として2005年まで存続した
    kind: fact
    level: E5
    status: established
    sources:
    - s1-satsuma-wiki
  - text: 旧宮之城町は1954年（昭和29年）に佐志村と、1955年（昭和30年）に山崎町と合併を重ねた町であり、合併協議の枠組みは当初7町・5町も検討されたが、入来町・祁答院町の住民投票で否決されるなどして最終的に3町に落ち着いた
    kind: fact
    level: E4
    status: established
    sources:
    - s1-satsuma-uub
    - s1-satsuma-wiki
  - text: 旧鶴田町は1963年（昭和38年）4月1日に町制を施行した町で、2005年の合併まで存続した
    kind: fact
    level: E4
    status: established
    sources:
    - s1-satsuma-uub
  column:
    title: 漢字か平仮名か――読みが同じ「薩摩」と「さつま」の決選
    text: 新町名の最終候補6点には、読みがまったく同じ「薩摩」と「さつま」が並んでいた。どちらも旧国名・薩摩郡に由来する名で、争われたのは意味ではなく表記である。結果は平仮名の「さつま」が採られ、1954年以来半世紀使われた漢字の「薩摩町」とは字面の異なる町名になった。候補にはこのほか、紫尾山にちなむ「紫尾（しび）」、旧3町の要素を連ねた「薩摩鶴宮（さつまつるみや）」など個性的な案もあった。なお同じ2005年には南さつま市でも最終候補が「南薩摩」と「南さつま」に絞られ、同じく平仮名が選ばれている。
    sources:
    - s1-satsuma-uub
  relations:
  - pref/46
  - muni/46-南さつま市
  - muni/46-薩摩川内市
  unknowns:
  - 最終候補から平仮名の「さつま」を選んだ理由を述べた合併協議会・町公式の一次説明は確認できなかった（候補の変遷は市区町村変遷情報による）
  - 旧国名「薩摩」そのものの語源は本レコードでは扱わず、都道府県レコード（pref/46）の範囲でも確定していない
  updated: '2026-11-13'
- id: muni/46-三島村
  code: '463035'
  names:
    ja: 三島村
    reading: みしまむら
    aliases:
    - 口之三島
    - 上三島
  user_terms:
  - みしまむら
  - 口之三島の村
  - 竹島・硫黄島・黒島の村
  - 役場が鹿児島市にある村
  naming_type: 新規命名
  naming_note: 旧十島村の境界変更・名称変更による改称
  formation: 改称
  prefecture: 鹿児島県
  homonyms: []
  summary: 竹島・硫黄島・黒島の3つの有人島（口之三島・上三島）からなる村で、「三島」の名はこの3島に由来する。もとはトカラ列島とともに十島村（じっとうそん）を構成したが、1946年に北緯30度線で南北に分断され、1952年2月10日のトカラ列島の本土復帰に合わせて境界変更・名称変更により三島村となった。村役場は区域外の鹿児島市内に置かれている。
  first_attestation:
    era: 昭和時代
    year_western: 1952
    document: 鹿児島県告示第75号「大島郡十島村を三島村に変更する条例の許可」（1952年2月10日施行）
    note: 自治体名としての「三島村」の初出はこの改称そのもの。区域を指す呼称としては、それ以前から3島は「上三島」「口之三島」と呼ばれていた
  claims:
  - text: 三島村の地方公共団体コードは463035である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  - text: 三島村は竹島・硫黄島・黒島の3島で構成されており、「三島」の名はこの3つの有人島があることによる
    kind: fact
    level: E2
    status: established
    sources:
    - s1-mishima-vill-plan
    - s1-mishima-wiki
  - text: 3島は江戸時代には薩摩国川辺郡十島（川辺十島）に属し、1908年（明治41年）4月1日の島嶼町村制施行でトカラ列島とともに十島村（じっとうそん）として設置された
    kind: fact
    level: E5
    status: established
    sources:
    - s1-mishima-wiki
  - text: 1946年（昭和21年）2月2日、GHQの指令SCAPIN第677号により北緯30度以南の日本政府の施政権が停止されて十島村は南北に分断され、日本側に残った上三島は役場を失い、同年2月24日に鹿児島市に十島村仮役場を設置した
    kind: fact
    level: E5
    status: established
    sources:
    - s1-mishima-wiki
  - text: 1952年（昭和27年）2月10日、トカラ列島の本土復帰に合わせて鹿児島県告示第74号で区域が北緯30度以北に変更され、同第75号で十島村（じっとうそん）が三島村に改称された。同日、トカラ列島の区域には新しい十島村（としまむら）が設置された
    kind: fact
    level: E2
    status: established
    sources:
    - s1-toshima-vill-sonsei
    - s1-mishima-wiki
  - text: 三島村は1946年2月11日に黒島で開かれた三島村設立委員会の日を「建村日」としており、1973年（昭和48年）4月1日に所属郡が大島郡から鹿児島郡に変更された
    kind: fact
    level: E5
    status: established
    sources:
    - s1-mishima-wiki
  - text: 三島村役場は村の区域内ではなく鹿児島市名山町に置かれており、区域内に常設の役場がない自治体は全国でも三島村・十島村・竹富町の3町村のみとされる
    kind: fact
    level: E5
    status: established
    sources:
    - s1-mishima-wiki
  column:
    title: 「建村日」は改称の6年前――役場を失った村の再出発
    text: 三島村の法的な誕生は1952年の改称だが、村が「建村日」とするのはそれより6年前の1946年2月11日である。北緯30度線で村が分断され、役場のあった中之島が米軍統治下に入った直後、残された3島の代表が黒島に集まって「三島村設立委員会」を開き、村長臨時代理者の選任と鹿児島市への事務所設置を決めた。この時点ではまだ法的には「十島村」のままだったが、村の実質的な出発点としてこの日が記憶されている。いまも村役場は鹿児島市内にあり、島々には出張所が置かれている。
    sources:
    - s1-mishima-wiki
  relations:
  - pref/46
  - muni/46-十島村
  unknowns:
  - 「三島」という呼称自体がいつから3島の総称として使われていたか（江戸時代の文書での用例）は確認できなかった
  - 1952年の改称に際して「三島」以外の名称が検討されたかどうかは確認できなかった
  updated: '2026-11-13'
- id: muni/46-与論町
  code: '465356'
  names:
    ja: 与論町
    reading: よろんちょう
    aliases:
    - 与論村
    - ユンヌ
  user_terms:
  - よろん
  - ユンヌ
  - 鹿児島県最南端の島
  - 与論島
  naming_type: 島名の継承
  naming_note: 島名「与論」をそのまま村名・町名としたもの
  formation: 分村・分立
  prefecture: 鹿児島県
  homonyms: []
  summary: 鹿児島県最南端の与論島を占める町で、明治41年（1908年）の島嶼町村制で発足した与論村が、昭和28年（1953年）の本土復帰を経て、昭和38年（1963年）1月に町制を施行して与論町となった。町名は島名「与論」をそのまま継ぐ。島は地元で「ユンヌ」と呼ばれ、漢字表記「与論」と現地音との関係や島名の語源には定説がない。
  first_attestation:
    era: null
    year_western: null
    document: null
    note: 「与論」という表記の文献上の初出は確認できなかった。町勢要覧の沿革は推古24年（616年）を境に島が大和朝廷に従属したとするが、これは島名の初出を示すものではない
  claims:
  - text: 与論町の地方公共団体コードは465356である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  - text: 明治41年（1908年）の島嶼町村制の実施に伴い「与論村」が誕生したと町の町勢要覧は紹介する
    kind: fact
    level: E2
    status: established
    sources:
    - s3-yoron-youran
    - s3-yoron-rilg
  - text: 昭和28年（1953年）12月に日米協定に基づく祖国復帰を果たし、昭和38年（1963年）1月から町制を施行して「与論町」となったと町の町勢要覧は紹介する
    kind: fact
    level: E2
    status: established
    sources:
    - s3-yoron-youran
  - text: 文永3年（1266年）に琉球王の善政を慕って自ら貢納し以後340年間琉球王の統治下にあり、慶長14年（1609年）の島津藩の琉球征服により与論を含む大島諸島は琉球から分割されて薩摩の直属となったと町の町勢要覧は紹介する
    kind: fact
    level: E2
    status: established
    sources:
    - s3-yoron-youran
  - text: 与論島は鹿児島県最南端の島で、1972年の沖縄返還まで我が国の最南端地であったと地方自治研究機構の調査は紹介する
    kind: fact
    level: E2
    status: established
    sources:
    - s3-yoron-rilg
  - text: 島の自称「ユンヌ」の語源については、「砂浜を持つ地」と解するユナヌ説など複数の仮説が提示されているが、いずれも仮説の域を出ず定説はない
    kind: fact
    level: E5
    status: indeterminate
    sources:
    - s3-yoron-qualia
  - text: 町の町勢要覧の沿革は、推古24年（616年）を境に島が日本に対して朝貢関係に入り大和朝廷に従属したとするが、これは島名「与論」の文献初出を示す記述ではない
    kind: fact
    level: E2
    status: established
    sources:
    - s3-yoron-youran
  column:
    title: 日本最南端だった約20年
    text: 1953年に奄美群島が本土復帰したとき、与論島は日本の南の国境になった。1972年に沖縄が返還されるまでの約20年間、与論島は「日本最南端の地」として知られ、離島ブームに沸いた。島の北東わずか23km先には沖縄本島が見える。与論は琉球王国に340年属し、薩摩に属し、アメリカの軍政下に置かれ、と帰属を何度も変えてきた島だが、地元の人々が島を呼ぶ名「ユンヌ」は、そのすべての時代を通じて変わらなかったはずの名である。漢字の「与論」がいつ、なぜこの音に当てられたのかは、まだ分かっていない。
    sources:
    - s3-yoron-rilg
    - s3-yoron-youran
  relations:
  - pref/46
  unknowns:
  - 「与論」という漢字表記の初出と、現地音「ユンヌ」にこの字が当てられた経緯は確認できなかった
  - 「ユンヌ」の語源について、専門辞典（角川日本地名大辞典・日本歴史地名大系）の記述を直接確認することはできなかった
  - 与論村発足時（1908年）に島名を村名とした経緯を示す一次資料は確認できなかった
  updated: '2026-11-13'
