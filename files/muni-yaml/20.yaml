    note: 町名としての初出。もとの国名「信濃」の初出は古代に遡るが、本バッチでは特定していない
  claims:
  - text: 昭和28年（1953年）から、柏原村・富士里村・信濃尻村・古間村の北山部4村で合併協議が始まったが、当初は各村の事情で足並みが揃わなかった
    kind: fact
    level: E2
    status: established
    sources:
    - v10-shinano-town
  - text: 昭和30年（1955年）7月に柏原村と富士里村が合併して信濃村が誕生し、昭和31年（1956年）9月に信濃尻村・古間村・信濃村が合併して信濃町が発足した
    kind: fact
    level: E2
    status: established
    sources:
    - v10-shinano-town
  - text: 町名は旧国名（信濃国）に由来するものである
    kind: fact
    level: E5
    status: established
    sources:
    - v10-shinano-wiki
  - text: Wikipedia「信濃町」が引用する『信濃町誌』の記述によれば、古来この地方は北信濃・奥信濃と呼ばれて住民に親しまれていたことから、その呼び名を簡潔に表現して「信濃町」としたとされる
    kind: fact
    level: E5
    status: established
    sources:
    - v10-shinano-wiki
  - text: 町域の柏原は、俳人・小林一茶の生誕地として知られる
    kind: fact
    level: E5
    status: established
    sources:
    - v10-shinano-wiki
  - text: 町には野尻湖があり、黒姫山や妙高山を望む高原地帯が広がる
    kind: fact
    level: E5
    status: established
    sources:
    - v10-shinano-wiki
  - text: 信濃町の地方公共団体コードは205834である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 県名になれなかった国名の居場所
    text: 明治の県名の決定では「信濃県」ではなく長野県が選ばれ、旧国名「信濃」は自治体の名から消えたかに見えた。ところが1956年、県の最北端の合併によって「信濃町」が生まれる。合併に参加した村の中には、かつて「信濃尻村」という名の村もあった。尻とは奥・末端を指す言葉で、信濃の国のいちばん奥という位置感覚がその名に表れている。その「尻」の付いた村を含む合併で、あえて「信濃」の本名が選ばれた。今や長野県で旧国名を名乗る町はここだけで、信濃町は県名に敗れた国名の受け皿になっている。
    sources:
    - v10-shinano-wiki
    - v10-shinano-town
  relations:
  - pref/20
  - muni/20-飯綱町
  unknowns:
  - 1955年の「信濃村」の命名協議の詳細（他にどのような候補名があったか）は確認できなかった
  - 国名「信濃」自体の語源については諸説があり、本バッチでは深追いしていない
  updated: '2026-11-13'
- id: muni/20-北相木村
  code: '203076'
  names:
    ja: 北相木村
    reading: きたあいきむら
    aliases:
    - 北阿江木
    - 相木
  user_terms:
  - きたあいき
  - 栃原岩陰遺跡の村
  - 長者の森のある村
  - 南相木村の隣の村
  naming_type: 一部の地名（旧相木村の北半分。永禄8年（1565年）に相木が南北の郷に分かれたことに由来）
  prefecture: 長野県
  homonyms: []
  summary: 佐久地方の東端、相木川沿いの山村。もとは一つの相木村（阿江木とも書いた）で、永禄8年（1565年）に北相木・南相木の両郷に分かれたとされる。明治22年（1889年）に単独で北相木村が発足して以来、一度も合併を経ていない。「相木」という地名自体の語源は定かでない。
  first_attestation:
    era: 永禄8年
    year_western: 1565
    document: 武田信玄が諏訪社の祭礼再興を命じた文書
    note: 『日本歴史地名大系』によればこの文書に「北阿江木之郷」「南阿江木之郷」の名が見えるという（二次資料経由の確認であり、原文は未確認）
  claims:
  - text: 『日本歴史地名大系』によれば、永禄8年（1565年）に武田信玄が諏訪社の祭礼再興を命じた文書には「北阿江木之郷」「南阿江木之郷」の名が記されている
    kind: fact
    level: E4
    status: established
    sources:
    - v10-kitaaiki-guide
  - text: 中世の相木（阿江木）の地は大井庄に属したと考えられ、相木氏は岩村田を拠点とした大井氏の有力な被官であった
    kind: fact
    level: E4
    status: established
    sources:
    - v10-kitaaiki-guide
  - text: 長野県立歴史館の資料解説によれば、村の中央の字坂上には相木城跡がある
    kind: fact
    level: E2
    status: established
    sources:
    - v10-kitaaiki-dcommons
  - text: 明治22年（1889年）4月1日、町村制の施行により北相木村の区域をもって北相木村が発足し、以来合併を経ていない
    kind: fact
    level: E5
    status: established
    sources:
    - v10-kitaaiki-wiki
  - text: 村は相木川沿いに集落が形成され、面積の約9割を山林が占める
    kind: fact
    level: E5
    status: established
    sources:
    - v10-kitaaiki-wiki
  - text: 村内の栃原岩陰遺跡は縄文時代早期の岩陰遺跡で、埋葬された人骨などが出土し、昭和62年（1987年）に国の史跡に指定された
    kind: fact
    level: E4
    status: established
    sources:
    - v10-kitaaiki-guide
    - v10-kitaaiki-wiki
  - text: 平成27年（2015年）に、北相木村と南相木村は分立から450周年を迎えた
    kind: fact
    level: E5
    status: established
    sources:
    - v10-kitaaiki-wiki
  - text: 北相木村の地方公共団体コードは203076である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 450年続く「北」と「南」のペア
    text: 北相木村と南相木村は、1565年に一つの相木村が南北に分かれて以来、450年以上にわたって別々の村であり続けている。明治の町村制でも、昭和・平成の合併の波でも、両村が再び一つに戻ることはなかった。両村は2015年にそろって「450周年」を祝ったという。川沿いの細長い谷を北と南で分け合う地名のペアは全国各地にあるが、その成立が戦国時代の文書にまで遡って確認できる例は珍しい。村の中央には相木城の跡とされる場所も残り、中世以来の村の骨格が今に続いている。
    sources:
    - v10-kitaaiki-guide
    - v10-kitaaiki-wiki
    - v10-kitaaiki-dcommons
  relations:
  - pref/20
  - muni/20-南相木村
  - muni/20-佐久穂町
  - muni/20-小海町
  unknowns:
  - 「相木（阿江木）」という地名自体の語源は確認できなかった
  - 永禄8年（1565年）の南北分立が、領主の分割によるものか行政上の区分によるものかは、資料で確認できなかった
  updated: '2026-11-13'
- id: muni/20-千曲市
  code: '202185'
  names:
    ja: 千曲市
    reading: ちくまし
    aliases:
    - 更埴市
    - 戸倉町
    - 上山田町
  user_terms:
  - ちくまし
  - 千曲川に由来する市名
  - 更埴・戸倉・上山田の合併市
  naming_type: 合併新設
  prefecture: 長野県
  homonyms: []
  summary: 千曲市は2003年に更埴市・戸倉町・上山田町が合併して生まれた市で、市名は地域を流れる千曲川（信濃川の長野県内での名）にちなむ。新市名は公募から絞られた「千曲市」と「更科市」の二択による住民アンケートで決められ、千曲市19,346人（51.3%）が更科市17,580人（46.6%）を僅差で上回った。
  first_attestation:
    era: 平成15年
    year_western: 2003
    document: 更埴市・戸倉町・上山田町合併協議会の決定（千曲市公式サイト「千曲市誕生までの経緯」による）
    note: 市名としての「千曲」の命名そのもの。元になった千曲川の名の初出は本調査では確認できなかった
  claims:
  - text: 平成15年（2003年）9月1日に、更埴市・埴科郡戸倉町・更級郡上山田町が合併して千曲市が設置された
    kind: fact
    level: E2
    status: established
    sources:
    - v2-chikuma-keii
  - text: 新市の名称は公募され、応募のあった全346種類から候補が絞り込まれ、最終的に「千曲市」と「更科市」の2つから選ぶ住民アンケートが実施された
    kind: fact
    level: E2
    status: established
    sources:
    - v2-chikuma-keii
  - text: アンケートは18歳以上の全住民53,730人を対象とし、37,714人（70.2%）が回答した。その結果、千曲市19,346人（51.3%）が更科市17,580人（46.6%）を上回り、平成15年1月16日の第8回合併協議会で新市名が「千曲市」に決定した
    kind: fact
    level: E2
    status: established
    sources:
    - v2-chikuma-keii
  - text: 新市名の「千曲」は、合併した1市2町を流れる千曲川の名に由来する
    kind: fact
    level: E2
    status: established
    sources:
    - v2-chikuma-keii
  - text: 合併そのものの賛否を問う住民アンケートでは、対象53,569人のうち42,649人（79.6%）が回答し、合併に前向きな回答が61.7%だった
    kind: fact
    level: E2
    status: established
    sources:
    - v2-chikuma-keii
  - text: 千曲市の地方公共団体コードは202185である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: わずか1,766票差で決まった市名
    text: 千曲市の名前は、住民アンケートの僅差で決まった。「千曲市」19,346票に対して「更科市」17,580票、差は1,766票、割合にして51.3%対46.6%である。敗れた「更科」も、更級郡・更科の名に根ざす由緒ある候補だった。回答率は70.2%と高く、地域のほぼ半分ずつが別の名を推したことになる。今では当たり前に使われる「千曲市」だが、その名は地域の意見が真っ二つに割れた末の、薄氷の決定だった。
    sources:
    - v2-chikuma-keii
  relations:
  - pref/20
  unknowns:
  - 千曲川の語源（「千の曲がり」に由来する説など）と初出を確認できなかった
  - 最終候補に残った「更科市」の名の由来（更級・更科との関係）の詳細を公式資料で確認できなかった
  updated: '2026-11-13'
- id: muni/20-南木曽町
  code: '204234'
  names:
    ja: 南木曽町
    reading: なぎそまち
    aliases: []
  user_terms:
  - なぎそ
  - 妻籠宿のある町
  - 木曽路の宿場町
  naming_type: 合併新設（1961年に3村が合併し新町名を採用）
  prefecture: 長野県
  homonyms: []
  summary: 木曽谷の南端、木曽川沿いの町。1961年に読書村・吾妻村・田立村が合併して発足した際、構成村の名を受け継がず「南木曽」という新名を採用した。町名の由来については南木曽岳にちなむとする説明がある一方、町公式資料に命名理由の明示はなく、木曽郡の南部という位置に対応する名とみられている。
  first_attestation:
    era: 昭和36年
    year_western: 1961
    document: null
    note: 町名「南木曽」の初出は1961年1月1日の合併による南木曽町発足。合併当時の命名経緯を示す公的記録は未確認
  claims:
  - text: 昭和36年（1961年）1月1日、西筑摩郡の読書村・吾妻村・田立村が合併して南木曽町が発足した
    kind: fact
    level: E2
    status: established
    sources:
    - v11-nagiso-town-gaiyo
  - text: 合併した3村の名はいずれも「南木曽」ではなく、町名は合併に際して新たに付けられた名である
    kind: fact
    level: E2
    status: established
    sources:
    - v11-nagiso-town-gaiyo
  - text: 町公式の概況は、町が長野県の南西部・木曽谷の南端に位置し、木曽川とその支流が形成した段丘上に集落が点在すると説明する
    kind: fact
    level: E2
    status: established
    sources:
    - v11-nagiso-town-gaiyo
  - text: Wikipediaは町の東部にそびえる南木曽岳（1,679メートル）を「町名の由来となった」と記すが典拠は示されておらず、町公式資料にも命名理由の明示は確認できない
    kind: fact
    level: E5
    status: indeterminate
    sources:
    - v11-nagiso-wiki
  - text: 「南木曽」の「南」は木曽郡（木曽谷）の南部に位置することに対応する命名とみるのが自然だが、合併当時の命名記録による裏付けは得られていない
    kind: fact
    level: H
    status: inferred
    sources:
    - v11-nagiso-town-gaiyo
  - text: 前身の一つ読書村は明治7年（1874年）に与川村・三留野村・柿其村が合併して生まれ、村名は3村の頭文字「よ・み・かき」をつないだ「よみかき」に「読書」の漢字を当てたもので、学問に優れた村になろうという願いが込められていると町は説明する
    kind: fact
    level: E4
    status: established
    sources:
    - v11-nagiso-chunichi-yomikaki
  - text: 町内には中山道の宿場町だった妻籠宿・三留野宿があり、妻籠は国の重要伝統的建造物群保存地区に選定されている
    kind: fact
    level: E3
    status: established
    sources:
    - v11-nagiso-kotobank-nipponika
  - text: 南木曽町の地方公共団体コードは204234である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 「読書（よみかき）」という村名
    text: 与川の「よ」、三留野の「み」、柿其の「かき」。1874年に3村が合併したとき、頭文字をつないだ「よみかき」という音に「読書」の漢字を当てた。町によると、学問に優れた村になろうという願いが込められているという。頭文字の合成は明治の合併でよく使われた手法だが、音の響きに合わせて「読書」という教養ある字を当てたところに、この谷の村らしい洒落がある。今も南木曽町の大字として「読書」の名が残り、町は子どもへの本の贈呈など「読書」にちなんだ取り組みを行っている。
    sources:
    - v11-nagiso-chunichi-yomikaki
    - v11-nagiso-town-gaiyo
  relations:
  - pref/20
  - muni/20-大桑村
  unknowns:
  - 1961年の合併時に「南木曽」という町名が選ばれた理由と経過を記した当時の公的記録（合併協議の資料など）
  - 「なぎそ」という読みの語源（南木曽岳の山名の由来を含む）
  updated: '2026-11-13'
- id: muni/20-南牧村
  code: '203050'
  names:
    ja: 南牧村
    reading: みなみまきむら
    aliases: []
  user_terms:
  - みなみまきむら
  - 南牧村 長野 読み方
  - 野辺山の村
  naming_type: 合併新設
  prefecture: 長野県
  homonyms:
  - muni/10-南牧村
  summary: 明治22年（1889年）に海尻・海ノ口・広瀬・平沢と大明村の一部（板橋）が合併して発足した村。千曲川上流・八ヶ岳東麓の高原の村で、野辺山原の秣場や馬市場に象徴される馬と放牧の歴史を持つ。群馬県の南牧村とは漢字が同じでも読みが異なり、こちらは「みなみまき」と読む。1889年の命名理由そのものを記した資料は確認できていない。
  first_attestation:
    era: 明治22年
    year_western: 1889
    document: 町村制施行による南牧村の発足（1889年4月1日）
    note: 自治体名としての初出。村公式の年表には1886年の馬市場の開設を「南牧村に馬市場ができる」と記す箇所があり、「南牧」の名が発足前から地域を指して使われた可能性もあるが、確定はできない
  claims:
  - text: 明治22年（1889年）4月1日、海尻村・海ノ口村・広瀬村・平沢村の区域と大明村の区域のうち板橋の区域をもって南牧村が発足した
    kind: fact
    level: E2
    status: established
    sources:
    - h6-minamimaki-official-history
    - h6-minamimaki-wiki
  - text: 村公式の歴史は、大明村を「馬産・蕎麦・炭焼き・木材搬出等を収入源とする山間の集落」と紹介し、明治19年（1886年）には南牧村に馬市場ができたとする年表を載せる
    kind: fact
    level: E2
    status: established
    sources:
    - h6-minamimaki-official-history
  - text: 日本歴史地名大系によれば、野辺山原は江戸時代を通じて板橋・平沢（現南牧村）や川上村の樋沢など諸村の入会林野で、大部分が秣場（馬の飼料を採る草地）として利用されていた
    kind: fact
    level: E3
    status: established
    sources:
    - h6-nanmoku-kotobank
  - text: 読みは「みなみまき」で、県境の向こうにある群馬県甘楽郡の南牧村の読み「なんもく」とは異なる（異なる層）。共通するのは「南牧」という漢字表記だけで、成立年も経緯も別である
    kind: fact
    level: E2
    status: established
    sources:
    - h6-minamimaki-official-history
    - h6-nanmoku-gunma-pref
  - text: 「牧」の字は、秣場や馬市場に象徴される当地の放牧・馬産の歴史と響き合うが、1889年の合併時に「南牧」と命名した理由そのものを記した資料は確認できておらず、村名と放牧の直接の因果は未確定である
    kind: fact
    level: E3
    status: indeterminate
    sources:
    - h6-minamimaki-official-history
    - h6-nanmoku-kotobank
  column:
    title: 馬の村だった「みなみまき」
    text: 南牧村の公式の歴史をたどると、馬の話が繰り返し出てきます。大明村は馬産を収入源とし、明治19年には馬市場が開かれ、明治中期にはアメリカから乳牛や優良な種馬を輸入して牧場経営が試みられたこともありました（これは失敗に終わったそうです）。野辺山原は長く諸村の秣場でした。「牧」という字が村名に入っているのは、偶然とは思えない土地の記憶です。ただし、それがそのまま命名理由だと断言できる資料はまだ見つかっていません。
    sources:
    - h6-minamimaki-official-history
    - h6-nanmoku-kotobank
  relations:
  - pref/20
  - muni/10-南牧村
  unknowns:
  - 明治22年の合併時に「南牧」と命名した理由の一次記録は未確認
