  summary: 長野県下高井郡の村。千曲川の東岸、飯山市の南に位置する。1955年（昭和30年）に穂高村・往郷村・上木島村が合併して発足した。村名は、中世にこの一帯にあった「木島郷」の名と、近世に村々の総称として使われた「木島平」という広域地名を継いだものである。
  first_attestation:
