  summary: 三重県の最南端、南牟婁郡の町。1954年（昭和29年）に井田村・御船村・相野谷村が合併して町制とともに生まれ、2006年（平成18年）に鵜殿村と合併して現在の町域となった。この合併で三重県から村がなくなった。「紀宝」は1954年の合併時に付けられた新しい名だが、その命名理由を記した公的資料は確認できていない。
  first_attestation:
    era: 昭和29年
    year_western: 1954
    document: 紀宝町の設置（井田村・御船村・相野谷村の新設合併と町制施行）
    note: 自治体名としての初出は1954年の命名そのもの。前身の各村名はそれ以前からの村名を継ぐ
  claims:
  - text: 紀宝町の地方公共団体コードは245623である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
    - x9-kiho-wiki
  - text: 1954年（昭和29年）10月31日に井田村・御船村・相野谷村が合併し、町制を施行して紀宝町が発足した
    kind: fact
    level: E5
    status: established
    sources:
    - x9-kiho-wiki
    - x9-kiho-uub
  - text: 2006年（平成18年）1月10日に鵜殿村と合併して新しい紀宝町が発足し、これにより三重県内の村は消滅した。町役場には旧鵜殿村役場が使われている
    kind: fact
    level: E5
    status: established
    sources:
    - x9-kiho-wiki
  - text: 2006年の合併に際して新町名が公募されたが、「紀宝（きほう）」は応募の上位にあり、最終候補を経て、読みを「きほうちょう」として町名が維持された
    kind: fact
    level: E4
    status: established
    sources:
    - x9-kiho-uub
  - text: 町域は令制国では紀伊国牟婁郡（それ以前は熊野国）に属した
    kind: fact
    level: E5
    status: established
    sources:
    - x9-kiho-wiki
  - text: 1954年の命名時に「紀宝」の名が選ばれた理由を記した公的資料は確認できておらず、「紀伊半島の宝」に由来するといった説明は裏付けのない解釈にとどまる
    kind: fact
    level: H
    status: indeterminate
    sources:
    - x9-kiho-wiki
    - x9-kiho-yoran
  column:
    title: 二度生まれた町
    text: 紀宝町は1954年に3村の合併で生まれ、2006年には隣の鵜殿村と合併して「新しい紀宝町」として改めて生まれた。2度目の合併では新町名が公募されたが、「紀宝」は応募の上位に入って最終的に存置され、一方で役場庁舎は旧鵜殿村のものを使うことになった。名は紀宝、庁舎は鵜殿という役割分担である。この合併で三重県から村が姿を消した。町の町勢要覧はいま「宝」の字を町の魅力そのものとして大きく掲げているが、そもそも1954年に「紀宝」と名付けられた理由の記録は、まだ見つかっていない。
    sources:
    - x9-kiho-uub
    - x9-kiho-wiki
    - x9-kiho-yoran
  relations:
