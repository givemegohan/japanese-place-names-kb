  summary: 田川郡の町。1889年の町村制施行で糸田村が発足し、1939年1月1日に町制を施行した。町内には「糸田町の地名の起こり」とされる湧泉「泌泉（たぎり）」があり、町指定文化財（史跡）に指定されている。また町には大字がなく、住所は町名と番地だけで表示される珍しい自治体である。
  first_attestation:
