  - text: 村公式によれば、正保元年（1644）の正保図絵図には「譜代」「譜代崎」が見えており、承応3年（1654）の藤島家古文書では「普代村」の記述がより明確になっている
    kind: fact
    level: E2
    status: established
    sources:
    - z7-fudai-vill-gaiyo
  - text: 岩手県の「町村名の由来」は普代の語源として、「二井」で2つの水流の合流地とする説と、「塞井」で砂州によって河口をふさがれた土地とする説を挙げる
    kind: fact
    level: E2
    status: contested
    sources:
    - z6-iwate-bunka-chimei
  - text: 同一覧はさらに、方言「ふだい」からきたもので家来の分家の開拓地とする説と、「譜代」で「お譜代さま」と呼ばれた三上氏にちなむとする説も挙げており、語源は確定していない
    kind: fact
    level: E2
    status: contested
    sources:
    - z6-iwate-bunka-chimei
  - text: 普代村の総合発展計画によれば、明治9年（1876）に普代村と黒崎村・堀内村の3村が合併して、現在の普代村の始まりとなった
    kind: fact
    level: E2
    status: established
    sources:
    - z7-fudai-plan
  - text: 村には、源義経が自害せず北へ逃れる途中に旅の安全を祈願して立ち寄ったとされる鵜鳥神社が伝わり、義経北行伝説ゆかりの地とされる
    kind: legend
    level: E4
    status: established
    sources:
    - z7-fudai-sanfes
  - text: 村内には、義経一行が村人に道を尋ねた際に「不行道（行けない道）」と言われたことに由来すると伝わる「不行道」という地名があるとされる
    kind: legend
    level: E4
    status: established
    sources:
    - z7-fudai-sanfes
  - text: 普代村の地方公共団体コードは034851である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 義経が通った村、「不行道」の伝説
    text: 岩手県の沿岸には、源義経が平泉で死なずに北へ逃れたという「義経北行伝説」が各地に残る。普代村もそのゆかりの地で、鵜鳥神社には義経一行が蝦夷へ向かう途中に旅の安全を祈願して立ち寄ったという伝えがある。さらに村内には「不行道」という印象的な地名が伝わる。一行が村人に道を尋ねたところ「（この先は）不行道＝行けない道」と言われたことに由来するという。もちろんこれらは伝説の層の話で、史実として確かめられたものではない。だが、断崖の続く三陸北部の道の険しさを思えば、「行けない道」という名が言い伝えとともに残ったこと自体が、この土地の記憶の残り方を物語っている。
    sources:
    - z7-fudai-sanfes
  relations:
  - pref/03
  unknowns:
  - 語源の定説はなく、県一覧の挙げる4説のいずれとも確定できない
  - アイヌ語に由来する説は県の由来一覧には挙げられておらず、本バッチでは裏付けが確認できなかった
  - 馬焼印図の原資料そのものは未確認で、村公式の紹介によっている
  updated: '2026-11-13'
