  - 世界遺産の町
  - 中尊寺
  - 毛越寺
  - 奥州藤原氏
  naming_type: その他（古代以来の地名とされるが、語源・成立時期は未確定）
  prefecture: 岩手県
  homonyms: []
  summary: 西磐井郡の町で、奥州藤原氏が築いた中尊寺・毛越寺などを擁し、「平泉―仏国土（浄土）を表す建築・庭園及び考古学的遺跡群」が世界遺産に登録されている。町公式は町名を「古代以来の地名による」とし、語源には泉の噴出説やアイヌ語説があるとする。一方で学術研究では、清衡が移る以前にこの地名があったかどうか自体が論点であり、唐代の名園「平泉荘」に倣った命名とする説や、本来の読みは音読み「へいせん」とする見解もある。昭和30年（1955）に平泉町と長島村が合併して現在の町が成立した。
  first_attestation:
    era: 文治5年
    year_western: 1189
    document: 『吾妻鏡』文治5年9月2日条
    note: 「平泉を出で、岩井郡厨河の辺に赴かしめ給う」とあり、奥州藤原氏の本拠の名として「平泉」の使用が確認できる。ただし『吾妻鏡』自体は後世の編纂であり、12世紀の同時代史料での用例は確認されていない
  claims:
  - text: 平泉町公式は、町名の由来を「古代以来の地名による」とし、「語源には、泉の噴出説やアイヌ語説があります」と説明する
    kind: fact
    level: E2
    status: established
    sources:
    - z7-hiraizumi-town-gaiyo
  - text: 岩手県の「町村名の由来」は平泉の語源として、「平」は斜めに平らな土地で北上川氾濫原の平地・泉地をいう説、方言の「ひら」泉で山麓の清泉をいう説、奥御館の南隅に湧く平地の湧井をいう説の3説を挙げる
    kind: fact
    level: E2
    status: contested
    sources:
    - z6-iwate-bunka-chimei
  - text: 『吾妻鏡』文治5年（1189）9月2日条には「平泉を出で、岩井郡厨河の辺に赴かしめ給う」とあり、奥州藤原氏の本拠の名として「平泉」が記されている（翻刻による確認）
    kind: fact
    level: E2
    status: established
    sources:
    - z7-azumakagami-bunji5
  - text: 学術研究には、藤原清衡が移る以前の岩井郡に「平泉」の地名はなく、移転当初の清衡の館も平泉館とは呼ばれていなかったとする見解（高橋富雄）があり、地名の成立時期自体が論点になっている
    kind: fact
    level: E3
    status: contested
    sources:
    - z7-hiraizumi-ito
  - text: 唐代の宰相李徳裕の別荘「平泉荘」の名に倣って「平泉」と命名されたとする説があり、あわせて「平泉」の本来の読みは音読みの「へいせん」で、訓読みの「ひらいずみ」は後出的だとする見解も示されている
    kind: fact
    level: E3
    status: contested
    sources:
    - z7-hiraizumi-ito
  - text: 江戸時代以来、平泉の館の南には甘い水が湧き出た「酒泉（泉酒）」の跡があったとされ、その瑞祥が「平泉」の名の由来と結びつけて語り伝えられてきた
    kind: legend
    level: E4
    status: established
    sources:
    - z7-hiraizumi-shi
  - text: 現在の平泉町は昭和30年（1955）4月15日に、平泉町と長島村が合併して成立した
    kind: fact
    level: E2
    status: established
    sources:
    - z7-hiraizumi-town-gaiyo
  - text: 平泉町の地方公共団体コードは034029である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 「平泉」は清衡が名付けたのか
    text: 近世の地誌『平泉志』は、藤原清衡が嘉保元年（1094）に平泉館を営んでこの地に移ったと記し、館の南に甘い水の湧く「酒泉」があったことを平泉繁昌の瑞祥として伝える。長くこの物語が「平泉」の始まりとされてきた。しかし近年の研究では、清衡が移る前の岩井郡に「平泉」という地名は見当たらず、当初の館も平泉館とは呼ばれていなかったのではないか、という見方が出されている。名の由来として有力視されるのは、中国・唐代の宰相李徳裕の別荘「平泉荘」である。山あいの平らな土地から泉が湧く名園の名を、清衡の都の名に重ねたという読み解きだ。その場合「平泉」の読みは本来「へいせん」で、「ひらいずみ」という訓読みは後から広まったことになる。世界遺産の町の名は、今も研究の最前線にある。
    sources:
    - z7-hiraizumi-shi
    - z7-hiraizumi-ito
  relations:
  - pref/03
  unknowns:
  - 「平泉」の12世紀の同時代史料での用例は確認できておらず、文献上の初見の確定は研究途上である
  - 藤原清衡自身が「平泉」と命名したかどうかは学説が分かれ、確定していない
  - 町公式が挙げるアイヌ語説について、具体的な語形対応は本バッチでは確認できなかった
  updated: '2026-11-13'
