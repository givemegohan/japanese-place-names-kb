records:
- id: muni/04-七ヶ宿町
  code: 043028
  names:
    ja: 七ヶ宿町
    reading: しちかしゅくまち
    aliases:
    - 七ヶ宿村
    - 七ケ宿町
  user_terms:
  - しちかしゅく
  - 七ヶ宿ダムの町
  - 山中七ヶ宿街道
  naming_type: その他（江戸時代の街道の7宿場の総称「七ヶ宿」の継承）
  prefecture: 宮城県
  homonyms: []
  summary: 宮城県刈田郡の、蔵王連峰南麓の町。江戸時代、奥州と羽州を結ぶ道は「山中七ヶ宿街道」と呼ばれ、上戸沢・下戸沢・渡瀬・関・滑津・峠田・湯原の7つの宿場があったことが町名の由来である。明治に上戸沢・下戸沢が白石市側へ分かれ、残る4村が1889年に合併して七ヶ宿村となり、1957年に町制を施行した。仙台市の水がめ・七ヶ宿ダムを擁する水源の町でもある。
  first_attestation:
    era: 江戸時代
    year_western: null
    document: 「山中七ヶ宿街道」の呼称（七ヶ宿町教育委員会の資料が紹介）
    note: 7宿場の総称としての「七ヶ宿」の成立時期を示すもの。具体的な初出文献は特定できなかった
  claims:
  - text: 総務省の全国地方公共団体コードで、七ヶ宿町の団体コードは043028と定められている
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  - text: 江戸時代には、奥州と羽州を結ぶ道が「山中七ヶ宿街道」と称され、7つの宿場があったことが町名の由来となっている
    kind: fact
    level: E2
    status: established
    sources:
    - z8-shichikashuku-edu
  - text: 7つの宿場は、上戸沢、下戸沢、渡瀬、関、滑津、峠田、湯原であり、街道は諸大名の参勤交代の要路であるとともに、商人や出羽三山参詣の人々が往来した
    kind: fact
    level: E2
    status: established
    sources:
    - z8-shichikashuku-edu
  - text: 明治維新の後、7宿場のうち上戸沢・下戸沢は現在の白石市の小原村として分離し、渡瀬、関、滑津、湯原の4ヶ村が明治22年（1889年）の町村制施行とともに合併して「七ヶ宿村」となった
    kind: fact
    level: E2
    status: established
    sources:
    - z8-shichikashuku-edu
  - text: 昭和32年（1957年）に町制を施行し、七ヶ宿町となった
    kind: fact
    level: E2
    status: established
    sources:
    - z8-shichikashuku-edu
  - text: 平成3年（1991年）に七ヶ宿ダムが完成し、町は仙台市を含む県民の水がめを擁する水源の町となった
    kind: fact
    level: E2
    status: established
    sources:
    - z8-shichikashuku-edu
  column:
    title: 「七ヶ宿」を名乗りながら、宿場は五つ
    text: 町名の由来は7つの宿場だが、そのすべてが今の町の中にあるわけではない。明治の初め、上戸沢と下戸沢は白石市の側へ分かれてしまった。現在の町域に残る宿場は渡瀬・関・滑津・峠田・湯原の五つ。それでも町は「七ヶ宿」の名を大切に守り続け、夏には往時の街道をわらじで歩くイベントが開かれている。
    sources:
    - z8-shichikashuku-edu
  relations:
  - pref/04
  unknowns:
  - 宿場「峠田」が明治22年の合併時に4村のいずれに含まれたかは未確認
  - 「山中七ヶ宿街道」の呼称の文献上の初出は未確認
  updated: '2026-11-13'
- id: muni/04-七ヶ浜町
  code: '044041'
  names:
    ja: 七ヶ浜町
    reading: しちがはままち
    aliases:
    - 七ヶ浜村
    - 七ケ浜町
  user_terms:
  - しちがはま
  - 七つの浜の町
  - 大木囲貝塚の町
  naming_type: その他（明治9年（1876年）に七つの浜を一括した総称の継承）
  prefecture: 宮城県
  homonyms: []
  summary: 宮城県宮城郡の、松島湾と太平洋に面した半島状の町。明治9年（1876年）に、湊浜・松ヶ浜・菖蒲田浜・花渕浜・吉田浜・代ヶ崎浜・東宮浜の七つの浜を一括して「七ヶ浜」と称することになったのが町名の由来である。1889年に七ヶ浜村が発足し、1959年に町制を施行した。縄文時代の大木囲貝塚で知られ、面積は東北の町で最も小さい。
  first_attestation:
    era: 明治9年
    year_western: 1876
    document: 七ヶ浜町教育委員会『七ヶ浜町の教育』が伝える明治9年の総称
    note: 七つの浜を一括する総称「七ヶ浜」としての初出。各浜の名自体はそれ以前からあった
  claims:
  - text: 総務省の全国地方公共団体コードで、七ヶ浜町の団体コードは044041と定められている
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  - text: 明治9年（1876年）には「湊浜」「松ヶ浜」「菖蒲田浜」「花渕浜」「吉田浜」「代ヶ崎浜」「東宮浜」の七つの浜を一括して「七ヶ浜」と称することになった
    kind: fact
    level: E2
    status: established
    sources:
    - z8-shichigahama-edu
  - text: 明治22年（1889年）の町村制施行により七ヶ浜村となり、昭和34年（1959年）1月1日に町制が施行された
    kind: fact
    level: E2
    status: established
    sources:
    - z8-shichigahama-edu
  - text: 町内には縄文時代の大木囲貝塚をはじめ50カ所ほどの遺跡があり、縄文時代の後半から製塩を行っていた痕跡が多数確認されている
    kind: fact
    level: E2
    status: established
    sources:
    - z8-shichigahama-edu
  - text: 『日本書紀』には日本武尊の一行が上総国から陸奥国に入り、海路でこの地に上陸したとする記述がある、と町の歴史資料は紹介している
    kind: legend
    level: E2
    status: indeterminate
    sources:
    - z8-shichigahama-edu
  - text: 町の面積は13.19平方キロメートルで、東北で最も小さい町である
    kind: fact
    level: E2
    status: established
    sources:
    - z8-shichigahama-edu
  column:
    title: 七つの浜は、今も住所の中に
    text: 湊浜、松ヶ浜、菖蒲田浜、花渕浜、吉田浜、代ヶ崎浜、東宮浜——明治9年に一括して「七ヶ浜」と呼ばれるようになった七つの浜の名は、今も町の地区名として地図に残っている。町名は行政が作った総称でありながら、それぞれの浜で暮らしてきた人々の地名を束ねた名でもある。縄文時代の大木囲貝塚が示すように、人々がこの海岸に住み始めてからの時間は、町名の歴史よりはるかに長い。
    sources:
    - z8-shichigahama-edu
  relations:
  - pref/04
  - muni/04-多賀城市
  - muni/04-塩竈市
  unknowns:
  - 七つの浜それぞれの名の個別の初出は未確認
  - 明治9年の総称化がどのような行政手続きで行われたかの詳細は未確認
  updated: '2026-11-13'
- id: muni/04-丸森町
  code: 043419
  names:
    ja: 丸森町
    reading: まるもりまち
    aliases:
    - 丸森村
  user_terms:
  - まるもり
  - 猫神の町
  - 阿武隈川の町
  naming_type: 合併新設（旧丸森町の名を継承）
  prefecture: 宮城県
  homonyms: []
  summary: 宮城県伊具郡の、県最南端の町。地名の由来は、安永の『風土記御用書出』によれば、丸山館の近くの小山を往古より「丸森」と唱えたことによるという。中世以来の中心地・丸森は1889年に単独で丸森村となり、町制を経て、1954年に金山町と6村が合併して現在の丸森町が誕生した。養蚕の歴史が古く、鼠を退治する猫を祀る「猫神」信仰が町内に根付いている。
  first_attestation:
    era: 安永年間
    year_western: null
    document: 『封内風土記』
    note: 「丸森邑、古塁、東南有小山、曰之丸山」と見える。中世以前の用例は本調査では確認できなかった。村名由来の説明は『風土記御用書出』にも記される
  claims:
  - text: 総務省の全国地方公共団体コードで、丸森町の団体コードは043419と定められている
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  - text: 「丸森地名考」が引用する『風土記御用書出』には、「当村丸山館の近所に小山御座候処、往古より丸森と申唱候につき邑名に相称候」とあり、丸山館近くの小山を古くから「丸森」と呼んだことが村名の由来としてまとめられている
    kind: fact
    level: E2
    status: established
    sources:
    - z8-marumori-chimei
  - text: 安永の『封内風土記』には「丸森邑、古塁、東南有小山、曰之丸山一名本之」と記され、丸森の東南に「丸山」と呼ばれる小山があった
    kind: fact
    level: E2
    status: established
    sources:
    - z8-marumori-chimei
  - text: これとは逆の順序の説もあり、先に丸山館があり、城のあった愛宕山の峰続きに丸い森があって、その森と丸山城の「丸」が結びついて「丸森」という地名が起こったとされる
    kind: fact
    level: E4
    status: contested
    sources:
    - z8-marumori-chimei
  - text: 丸山城（丸山館）は、伊達政宗の曾祖父である稙宗が隠居した城と伝えられている
    kind: fact
    level: E4
    status: indeterminate
    sources:
    - z8-marumori-chimei
  - text: 明治22年（1889年）の町村制の際、丸森は1村1大字の単独で伊具郡丸森村となった
    kind: fact
    level: E4
    status: established
    sources:
    - z8-marumori-chimei
  - text: 昭和29年（1954年）12月1日に丸森町・金山町の2町と大内村・大張村・耕野村・小斎村・舘矢間村・筆甫村の6村が合併して、現在の丸森町が誕生した
    kind: fact
    level: E2
    status: established
    sources:
    - z8-marumori-town-70th
    - z8-marumori-chimei
  column:
    title: 養蚕の町と猫神さま
    text: 丸森は養蚕の盛んな町だった。蚕の天敵は鼠である。その鼠を退治してくれる猫は、やがて「猫神」として祀られるようになり、町内の各地に猫神の碑や祠が残っている。『和名類聚抄』に見える伊具五郷の一つ静織郷は、機織りの巧みな集団に由来するとされ、この土地の布づくりの歴史の古さを物語る。町の産業の記憶は、地名と信仰の中に編み込まれている。
    sources:
    - z8-marumori-chimei
  relations:
  - pref/04
  unknowns:
  - 「丸森」の名の中世以前の用例は未確認
  - 「丸い森」先行説と「丸山」先行説のいずれが正しいかは未確定
  - 風土記御用書出の記述を直接の影印・翻刻では確認しておらず、卒業研究の引用経由である
  updated: '2026-11-13'
- id: muni/04-亘理町
  code: '043613'
  names:
    ja: 亘理町
    reading: わたりちょう
    aliases: []
  user_terms:
  - わたり
  - はらこめしの町
  - 鳥の海
  - 亘理伊達家の城下町
  naming_type: 一部の地名
  prefecture: 宮城県
  homonyms: []
  summary: 宮城県亘理郡の、阿武隈川河口南岸の町。町の公式説明では、阿武隈川の南岸にあり、川を「渡る地」として「わたり」という地名になったといわれている。古代には陸奥国亘理郡の地で、郡衙の推定地とされる三十三間堂官衙遺跡がある。中世から近世にかけて亘理・片倉・伊達各氏の城下町、浜街道の要駅として栄え、江戸時代は亘理伊達家の城下町だった。1955年に荒浜町などと合併して現在の町となった。
  first_attestation:
    era: null
    year_western: null
    document: null
    note: 「亘理」は古代の陸奥国亘理郡の郡名に遡るとされるが、本調査では『和名類聚抄』等の初出文献を直接確認できなかった
  claims:
  - text: 総務省の全国地方公共団体コードで、亘理町の団体コードは043613と定められている
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  - text: 亘理町公式の説明では、亘理は阿武隈川の南岸にあり、川を「渡る地」として「わたり」という地名になったといわれている
    kind: fact
    level: E2
    status: indeterminate
    sources:
    - z8-watari-town
  - text: 町内には国指定史跡の三十三間堂官衙遺跡があり、古代の亘理郡の郡衙の跡とされる
    kind: fact
    level: E4
    status: established
    sources:
    - z8-watari-jtb
  - text: 中心集落の亘理地区は中世から近世にかけて亘理氏・片倉氏・伊達各氏の城下町であり、仙台城下へ通じる浜街道の要駅として栄えた
    kind: fact
    level: E4
    status: established
    sources:
    - z8-watari-jtb
  - text: 江戸時代は亘理伊達家の治世のもと城下町が築かれ、その風情が今も町に残る
    kind: fact
    level: E2
    status: established
    sources:
    - z8-watari-town
  - text: 明治22年（1889年）に町制を施行した
    kind: fact
    level: E4
    status: established
    sources:
    - z8-watari-jtb
  - text: 昭和30年（1955年）2月に亘理町・荒浜町・吉田村・逢隈村が合併して、現在の亘理町が誕生した
    kind: fact
    level: E2
    status: established
    sources:
    - z8-watari-town
  column:
    title: 川を渡る地、舟の集まる浜
    text: 亘理は、阿武隈川を「渡る地」だったという。川の南岸の城下町として栄える一方、河口の荒浜は藩政時代に舟運の起点となり、米や木材の集散地として賑わった。渡しと舟運、二つの「渡る」に支えられた町である。その荒浜は今、「元祖はらこめし」の発祥の地として知られている。
    sources:
    - z8-watari-jtb
    - z8-watari-town
  relations:
  - pref/04
  unknowns:
  - 「亘理」の郡名としての初出文献（『和名類聚抄』等）は未確認
  - 「渡る地」説以外の語源説（亘理氏の居住による逆転の可能性を含む）は未検証
  - 阿武隈川の渡し場が具体的にどこにあったかは未確認
  updated: '2026-11-13'
- id: muni/04-仙台市
  code: 041009
  names:
    ja: 仙台市
    reading: せんだいし
    aliases:
    - 千代
    - 仙臺
    - 仙台町
  user_terms:
  - 仙台の名前の由来
  - 政宗が千代を仙台に変えた理由
  - 仙台は中国の詩から来た名前
  - 千代と仙台は読みが同じ
  naming_type: 新規命名
  prefecture: 宮城県
  homonyms: []
  summary: 市名は伊達政宗が慶長5年（1600年）に旧名「千代」を「仙台（仙臺）」と改めた命名の継承である。「千代」は、この地に祭られていた千体仏にちなむ「千体」の雅名とする説がよく知られ、「仙台」の字は唐の詩人・韓翃の詩句「仙臺初見五城樓」から採ったと考えられている。読み（せんだい）は変えず字だけを格上げした改名で、明治22年（1889年）に市制施行した。
  first_attestation:
    era: 慶長5年
    year_western: 1600
    document: 政宗による改称（仙台市公式年表に「千代を仙台と改め縄張りを行う」とある）
    note: 命名・改称そのものの年。旧名「千代」の文書上の初出は別途未確認
  claims:
  - text: 仙台市の公式年表は、慶長5年（1600年）に伊達政宗が「千代」を「仙台」と改め、仙台城の縄張りを行い、翌慶長6年（1601年）に普請を開始したとする
    kind: fact
    level: E2
    status: established
    sources:
    - a-cap-sendai-city
  - text: 改称後も読みは「せんだい」のままで、変わったのは漢字表記だけである
    kind: fact
    level: E2
    status: established
    sources:
    - a-cap-sendai-city
    - a-cap-sendai-lib
  - text: 仙台市民図書館のレファレンスによれば、もともとこの地に祭られていた千体仏にちなんで「千体」の字が当てられ、いつのころからかその雅名である「千代」の文字が使われるようになった、と『仙台事物起原考』は伝えている
    kind: fact
    level: E2
    status: established
    sources:
    - a-cap-sendai-lib
  - text: 「仙台」の字の由来は、中国の唐の詩人・韓翃（かんゆう）の七言律詩の起句「仙臺初見五城樓」から採ったものと考えられている、と同じレファレンスは紹介している
    kind: fact
    level: E2
    status: established
    sources:
    - a-cap-sendai-lib
  - text: 「千代（せんだい）」の語源にはこのほか、川に囲まれた山の手を「川内（かわうち）」と称したことから音読で「せんだい」と呼ばれて「千代」の字が生まれたとする説、アイヌ語の「sep-nay（広い川）」を語源とする説もあり、諸説が並立している
    kind: fact
    level: E2
    status: contested
    sources:
    - a-cap-sendai-lib
  - text: 明治22年（1889年）に市制を施行して仙台市が誕生し（当時の人口8万6352人）、平成元年（1989年）に東北初の政令指定都市となった、と仙台市は述べている
    kind: fact
    level: E2
    status: established
    sources:
    - a-cap-sendai-ayumi
  column:
    title: 詩の一節を、城下町の名前に
    text: 「仙臺」は唐の詩人・韓翃の詩に詠まれた、仙人の住むという高台の名です。政宗は読みを一切変えず、「千代」という日本の名前に中国の詩の字を当てはめました。音は土地のまま、字だけを天下に通用する教養の言葉に替える――読みを保ったまま漢字だけを格上げするこの手法は、岐阜（信長）や福島の改名とも通じる、戦国大名好みの命名術です。政宗の漢詩の素養が、そのまま都市の名前になっている例といえます。
    sources:
    - a-cap-sendai-lib
  relations:
  - pref/04
  unknowns:
