  naming_type: 中心地名の継承
  formation: 単独発足
  prefecture: 沖縄県
  homonyms: []
  summary: 沖縄本島中部の西海岸にある村。「恩納」は、もともと中心集落である恩納ムラの名で、1673年に金武間切と読谷山間切の一部を分けて恩納間切が新設された際に間切名となり、1908年の町村制で恩納村となった。「恩納」という地名そのものの語源は、村の字誌でも「未だ明らかではない」とされており未詳である。女流歌人・恩納ナビーはこの地の出身とされるが、それは地名の由来ではなく、地名を負った人物の層である。
  first_attestation:
    era: 万暦12年
    year_western: 1584
    document: 恩納ノロ辞令書
    note: 恩納村史編さんだよりが村役場所蔵の辞令書の写真とともに紹介するもの。恩納間切の創設（1673年）以前から「恩納」の名が文書に現れる用例だが、辞令書そのものを直接確認したわけではないため、主張側ではE2として扱う
  claims:
  - text: 総務省「地方公共団体コード一覧」で、恩納村の団体コードは473111とされている
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  - text: 『球陽』には「金武郡内の四邑、亦読谷山の八邑を将て、合して恩納郡と為し」とあり、1673年に金武間切から名嘉真・安富祖・瀬良垣・恩納の4村、読谷山間切から谷茶・冨着・仲泊・久良波・読谷山・真栄田・塩屋・与久田の8村を分けて恩納間切が創設されたと、恩納村史編さんだよりは紹介している
    kind: fact
    level: E2
    status: established
    sources:
    - s7-onna-hensan60
  - text: 恩納間切の番所（役所）は恩納ムラに置かれ、「恩納間切」という名前も恩納ムラから取られたのだろうと、恩納村史編さんだよりは推測している
    kind: fact
    level: E2
    status: inferred
    sources:
    - s7-onna-hensan92
  - text: 『おもろさうし』第十七巻の表題は「恩納より上のおもろ御さうし」であり、恩納間切創設以前の史料にすでに「恩納」の名が現れると、恩納村史編さんだよりは紹介している
    kind: fact
    level: E2
    status: established
    sources:
    - s7-onna-hensan92
  - text: 万暦12年（1584年）の恩納ノロ辞令書が村役場に所蔵されており、「恩納」の名は間切創設以前から文書に現れる
    kind: fact
    level: E2
    status: established
    sources:
    - s7-onna-hensan60
  - text: 「恩納」という地名の由来そのものは、『恩納字誌』や『琉球王国の真実』でも「未だ明らかではない」とされており、語源は未詳である
    kind: fact
    level: E2
    status: indeterminate
    sources:
    - s7-onna-crd
  - text: 1908年に沖縄県及島嶼町村制が施行され、琉球王国時代の行政単位であった恩納間切は恩納村に改められ、初代村長として当山正禄が就任した
    kind: fact
    level: E2
    status: established
    sources:
    - s7-onna-ayumi
    - s7-onna-keikaku
  - text: 18世紀になると女流歌人・恩納ナビーが恩納の風景を琉歌に歌い上げ、1928年にはその碑が万座毛に建立されたが、これは地名の由来ではなく、地名を負った人物の層である
    kind: fact
    level: E2
    status: established
    sources:
    - s7-onna-keikaku
    - s7-onna-ayumi
  column:
    title: もう一つの「恩納」――東恩納
    text: 実は「恩納」という村は二つあった。越来間切にも恩納村（おんなむら）があり、1673年に恩納間切が新設されると、間切の中心である恩納ムラと区別するために、越来側は「東恩納」と称するようになったと『恩納字誌』にあることを、国立国会図書館のレファレンス事例が紹介している。新しい行政区画の誕生が、同名のもう片方の名を変えてしまった例である。
    sources:
    - s7-onna-crd
  relations:
  - pref/47
  - muni/47-金武町
  - muni/47-読谷村
  unknowns:
  - 「恩納」の語源（『恩納字誌』等でも明らかではないとされており、確認できる範囲では未詳）
  - 恩納ノロ辞令書（1584年）の原文を直接確認できていないこと
  - 『おもろさうし』第十七巻の表題の「恩納」が指す範囲（恩納ムラか、より広い地域か）の確定
  updated: '2026-11-13'
- id: muni/47-本部町
  code: '473081'
  names:
    ja: 本部町
    reading: もとぶちょう
    aliases:
    - 伊野波間切
    - 本部間切
  user_terms:
  - もとぶ
  - ムトゥブ（地元の方音）
  - 海洋博の町
  - 美ら海水族館のある町
  - 本部半島の町
  naming_type: 旧行政区画名の継承
  formation: 単独発足
  prefecture: 沖縄県
  homonyms: []
  summary: 本部半島の西側を占める町で、町名は琉球王国の行政区画「本部間切」に由来する。もとは今帰仁間切の一部で、1666年に12村を分けて「伊野波間切」が新設され、翌1667年に本部間切と改称された。地元の方音は「ムトゥブ」。1908年に本部村、1940年に町制を施行して本部町となり、1975年には沖縄国際海洋博覧会の会場となった。
  first_attestation:
    era: 康熙6年（尚質王20年）
    year_western: 1667
    document: 『球陽』
    note: 伊野波間切から本部間切への改称を記す、間切名としての初出。『日本歴史地名大系』が『球陽』尚質王19〜20年条の記述として紹介している（二次資料経由の確認）
  claims:
  - text: 本部町の地方公共団体コードは473081である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  - text: 町名は琉球王国の行政区画である本部間切に由来し、1908年に本部村となり、1940年12月10日の町制施行で本部町となった
    kind: fact
    level: E2
    status: established
    sources:
    - s6-motobu-town-intro
  - text: 本部間切は1666年に今帰仁間切から12村を分けて伊野波間切として新設され、翌1667年に本部間切と改称されたことが、『球陽』の記述として『日本歴史地名大系』で紹介されている
    kind: fact
    level: E3
    status: established
    sources:
    - s6-motobu-kotobank-magiri
    - s6-motobu-town-intro
  - text: 地元の方音は「ムトゥブ」で、近世の資料では間切名は「むとうぶまぎり」と読まれ、公称の「もとぶ」とは音が異なる
    kind: fact
    level: E3
    status: established
    sources:
    - s6-motobu-kotobank-magiri
    - s6-kunigami-kotobank-hou
  - text: 本部間切が分かれる前の今帰仁間切の村の中に「崎本部（さきむとうぶ）村」があり、「ムトゥブ」という地名の要素は間切の成立以前からこの一帯に存在したことが『日本歴史地名大系』で紹介されている
    kind: fact
    level: E3
    status: established
    sources:
    - s6-motobu-kotobank-magiri
  - text: 「ムトゥブ（本部）」の語源については、確認した専門辞典に定説の説明が見当たらず、確定できない
    kind: fact
    level: E3
    status: indeterminate
    sources:
    - s6-motobu-kotobank-magiri
  - text: 1947年に町北部の9字が分離して上本部村となったが、1971年に再び本部町と合併して現在の町域となった
    kind: fact
    level: E2
    status: established
    sources:
    - s6-motobu-town-intro
  - text: 1975年、本部町は沖縄国際海洋博覧会の会場となった
    kind: fact
    level: E2
    status: established
    sources:
    - s6-motobu-town-intro
  column:
    title: 「本部」の前にあった「崎本部」
    text: 本部間切が生まれる前、この一帯は今帰仁間切の一部だった。その今帰仁間切の村の名簿を『日本歴史地名大系』でたどると、1666年に分かれた12村の中に「崎本部（さきむとうぶ）村」という村がすでにある。つまり「ムトゥブ」という音は、間切の名になる前から、一つの村の名としてこの土地に生きていたらしい。新しい間切は当初「伊野波」と名づけられたが、わずか1年で「本部」に改められた。改称の理由は記録に残っていないが、在地の古い地名が新しい行政区画の名に引き上げられた、と見ることもできるだろう。
    sources:
    - s6-motobu-kotobank-magiri
    - s6-motobu-town-intro
  relations:
  - pref/47
  - muni/47-今帰仁村
  - muni/47-名護市
  unknowns:
  - 「ムトゥブ」の語源は未詳で、半島の付け根にあたる位置に結びつける俗説は専門資料で裏付けが取れなかった
  - 伊野波（ぬふあ）という当初の間切名の語源は確認できていない
  - 1947年に分かれた上本部村の村名の命名経緯は確認できていない
  updated: '2026-11-13'
- id: muni/47-東村
  code: '473031'
  names:
    ja: 東村
    reading: ひがしそん
    aliases: []
  user_terms:
  - ひがし
  - ひがしそん
  - 花と水とパインの村
  - つつじの村
  - 慶佐次湾のヒルギ林のある村
  naming_type: 新規命名
  formation: 分村・分立
  prefecture: 沖縄県
  homonyms: []
  summary: 沖縄本島北部の東海岸にある村で、1923年に久志村から分村して誕生した比較的新しい村である。村名は、旧久志村の東方に位置することと、太平洋に面して東の空から朝日が昇ることから「日の出るところ東なり」と命名されたと、村の公式資料が伝えている。近世の村域は名護間切、のち久志間切に属していた。
  first_attestation:
    era: 大正12年
    year_western: 1923
    document: 第5次東村総合計画・基本構想（東村）
    note: 村名の初出は1923年4月1日の久志村からの分村による命名そのもので、村公式資料の沿革記述による
  claims:
  - text: 東村の地方公共団体コードは473031である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  - text: 東村は1923年（大正12年）4月1日、久志村（現・名護市の一部）から有銘以東の5字が分村して誕生し、翌1924年に宮城の一部から高江が分かれて現在の6字となった
    kind: fact
    level: E2
    status: established
    sources:
    - s6-higashi-vill-plan
  - text: 村名は、旧久志村の東方に位置していることと、太平洋に面し東の空から赤々と朝日が昇ることから「日の出るところ東なり」と命名されたと言われていると、村の総合計画が紹介している
    kind: fact
    level: E2
    status: established
    sources:
    - s6-higashi-vill-plan
  - text: 近世の村域は当初は名護間切に属し、1673年に名護間切から久志間切が分離・新設されて以後は久志間切に属した
    kind: fact
    level: E2
    status: established
    sources:
    - s6-higashi-vill-plan
  - text: 『おもろさうし』巻13には「久志の前兼久にて船を建造した」とあり、村の公式資料はその場所を現在の慶佐次か有銘の海岸であったと推測している
    kind: fact
    level: E2
    status: established
    sources:
    - s6-higashi-vill-plan
  - text: 慶佐次川河口のヒルギ林は1972年に国の天然記念物に指定され、ヒルギは村の木にも選ばれている
    kind: fact
    level: E2
    status: established
    sources:
    - s6-higashi-vill-plan
  - text: 村は「花と水とパインの村」をキャッチフレーズに掲げている
    kind: fact
    level: E2
    status: established
    sources:
    - s6-higashi-vill-plan-main
  column:
    title: 「日の出るところ東なり」
    text: 「東村」という名は一見すると方角そのままで味気ない。しかし村の公式資料には命名の理由がはっきり残っている。1923年の分村のとき、旧久志村の東方に位置することに加え、太平洋に面したこの村では東の空から赤々と力強く朝日が昇ることから、「日の出るところ東なり」と命名されたと言われる。沖縄本島の東海岸らしい景色を、そのまま村の名に刻んだ命名だった。村民の森のつつじ園や慶佐次のヒルギ林とあわせ、村の自己紹介は今も「花と水とパインの村」である。
    sources:
    - s6-higashi-vill-plan
    - s6-higashi-vill-plan-main
  relations:
  - pref/47
  - muni/47-名護市
  - muni/47-国頭村
  - muni/47-大宜味村
  unknowns:
  - 1923年の命名が公募によるものか協議によるものかなど、命名過程の一次記録は確認できていない（村公式資料は理由のみを伝える）
  - 村内の字名（平良・宮城・慶佐次・有銘・高江・川田）の由来は本レコードでは未調査である
  updated: '2026-11-13'
- id: muni/47-沖縄市
  code: '472115'
  names:
    ja: 沖縄市
    reading: おきなわし
    aliases:
    - コザ市
    - 胡差
  user_terms:
  - 沖縄市はどうやってできた
  - コザって何
  - 沖縄市の名前の由来
  naming_type: 旧国名・広域地名の採用
  formation: 合併新設
  prefecture: 沖縄県
  homonyms: []
  summary: 1974年4月1日にコザ市と美里村の対等合併で誕生した新設の市名で、県内では那覇市に次ぐ第二の都市となった。前身のコザ市は、米軍嘉手納基地の門前町として発展した越来村が1956年に「コザ」へ改称して生まれた市で、「コザ」の語源には胡屋説と古謝説がある。1666年に分かれた越来・美里の両地域が308年ぶりに再び一つになった合併でもあった。
  first_attestation:
    era: 昭和49年
    year_western: 1974
    document: コザ市・美里村の合併協定（1973年12月27日調印）と1974年4月1日の沖縄市発足
    note: 市名としての成立。前身の「コザ」は1956年に越来村の改称で生まれた名で、戦後に通称として定着していたと沖縄県公文書館の資料は伝える
  claims:
  - text: 1974年（昭和49年）4月1日、コザ市と美里村の対等合併により沖縄市が誕生し、人口約9万6,000人を擁する県下第二の都市となった（地方公共団体コードは472115）
    kind: fact
    level: E2
    status: established
    sources:
    - l6-okinawa-yoran
    - l6-okinawa-koho40
    - b-cap-chiba-soumu-code
  - text: 沖縄市公式の要覧によれば、1666年に越来間切から美里間切が分離して以来、1974年の合併で両地域は308年ぶりに再び一つになった
    kind: fact
    level: E2
    status: established
    sources:
    - l6-okinawa-yoran
  - text: 前身の越来村は嘉手納基地の門前町として発展し、1956年（昭和31年）6月にコザ村へ改称、同年7月に市制を施行してコザ市となった。そのため「コザ村」として存在した期間は1か月足らずだった（沖縄県公文書館の紹介資料）
    kind: fact
    level: E2
    status: established
    sources:
    - l6-okinawa-archives
    - l6-okinawa-yoran
  - text: 沖縄県公文書館は、1956年の越来村からコザ村への名称変更に関する琉球政府文書を紹介し、「コザ」という名称は戦後に通称として定着していたと伝える
    kind: fact
    level: E2
    status: established
    sources:
    - l6-okinawa-archives
  - text: 前身名「コザ」の由来については、沖縄県立図書館のレファレンス回答が、参照した資料のうち2点は「胡屋」、1点は「古謝」を由来とするなど説が分かれることを紹介している
    kind: fact
    level: E2
    status: contested
    sources:
    - l6-okinawa-ndl-crd
  - text: 米軍統治下の1945年には、旧越来村一帯に「胡差（古謝）市」、旧美里村一帯に「前原市」が置かれたが、いずれも翌年には解かれて村に戻った（沖縄市要覧）
    kind: fact
    level: E2
    status: established
    sources:
    - l6-okinawa-yoran
  - text: 沖縄市は本土復帰（1972年）から2年後の1974年に誕生し、市は合併後に策定した長期計画で「国際文化観光都市」を宣言した（沖縄市要覧）
    kind: fact
    level: E2
    status: established
    sources:
    - l6-okinawa-yoran
  column:
    title: 1か月だけ存在した「コザ村」
    text: 沖縄市の前身・コザ市には、短命だったもう一つの姿がある。1956年6月、越来（ごえく）村は「コザ村」に改称されたが、その翌月には市制を施行してコザ市になってしまった。つまり「コザ村」は1か月足らずしか存在しなかった。公文書館に残る改称の文書には、戦後の門前町で「コザ」という呼び名がすでに定着していたことがうかがえる。そして1974年、コザ市は美里村と合併して「沖縄市」となり、その名もまた18年で姿を消した。二つの短い名前の上に、現在の市名が立っている。
    sources:
    - l6-okinawa-archives
    - l6-okinawa-yoran
  relations:
  - pref/47
  unknowns:
  - 新市名「沖縄市」の決定過程（候補案や選定理由）を示す一次資料は確認できなかった
  - 「コザ」の語源（胡屋説・古謝説）の決着は未了
  updated: '2026-11-13'
- id: muni/47-浦添市
  code: '472085'
  names:
    ja: 浦添市
    reading: うらそえし
    aliases:
    - うらおそい
    - 浦襲
  user_terms:
  - うらそえの由来
  - 浦添ってどう読むの
  - てだこのまち
  naming_type: 中心地名の継承
  formation: 単独発足
  prefecture: 沖縄県
  homonyms: []
  summary: 「浦添」は当て字で、もとは「うらおそい」とかな書きされていた。琉球の言語学者・伊波普猷は「浦々を支配する所」の意と解釈し、市公式・沖縄県公式の説明もこの説に沿う。浦添は首里に王都が移る以前の琉球の中心で、舜天・英祖・察度の王統が拠った地である。1908年に浦添間切から浦添村となり、1970年に市制を施行した。
  first_attestation:
    era: 江戸時代初期
    year_western: 1623
    document: おもろさうし
    note: 「うらおそい」とかな書きされた用例を伊波普猷『浦添考』が引く。『おもろさうし』は16世紀から1623年にかけて編纂された歌謡集。「浦添」の漢字表記は当て字で、本来の形は「うらおそい」
  claims:
  - text: 「浦添」の字は当て字であり、もとは「うらおそい」とかなで書かれ、『おもろさうし』や浦添ようどれの碑文にもその形が見えると、伊波普猷は『浦添考』で述べる
    kind: fact
    level: E3
    status: established
    sources:
    - l6-urasoe-iha
  - text: 伊波普猷は「うらおそい」を「浦（うら）」と「おそう（襲）」の名詞形に分け、「浦々を襲う、すなわち浦々を支配する所」の意であると解釈した
    kind: fact
    level: E3
    status: established
    sources:
    - l6-urasoe-iha
  - text: 浦添市公式・沖縄県公式の説明も、「うらおそい（浦襲）」は津々浦々を支配するという意味であり、それが転じて「うらそえ」となり「浦添」の字が当てられたとする
    kind: fact
    level: E2
    status: established
    sources:
    - l6-urasoe-about
    - l6-urasoe-pref
  - text: 浦添は首里に王都が移る以前の琉球の王都であり、舜天王・英祖王・察度王の王統が浦添城を中心に約250年にわたって本島中南部の中心だったと、浦添市公式資料は伝える
    kind: fact
    level: E2
    status: established
    sources:
    - l6-urasoe-guide
  - text: 1908年（明治41年）4月、浦添間切が浦添村に改められた（浦添市公式のあゆみ）
    kind: fact
    level: E2
    status: established
    sources:
    - l6-urasoe-ayumi-pre
  - text: 1970年（昭和45年）7月に浦添村が市制を施行して浦添市となった。米軍統治下での市制施行である（地方公共団体コードは472085）
    kind: fact
    level: E2
    status: established
    sources:
    - l6-urasoe-ayumi
    - b-cap-chiba-soumu-code
  - text: 英祖王は「てだこ（太陽の子）」と敬称され、その母が、太陽が懐に入る夢を見て英祖を身籠ったという伝承を、浦添市公式のプロフィールは紹介する
    kind: legend
    level: E2
    status: established
    sources:
    - l6-urasoe-profile
  column:
    title: 王都の名は「支配」の意味だった
    text: 浦添の名の底にある「うらおそい」は、「浦々を支配する所」という意味だったと伊波普猷は解いた。王都にふさわしい名である。実際、浦添は首里に都が移る前の琉球の中心で、舜天・英祖・察度の三代の王統がここを拠りにした。王都が首里へ移った後も、「支配の中心」を意味する名は土地に残り続け、読みが「うらおそい」から「うらそえ」へ和らぎ、「浦添」の字が当てられて現代の市名になった。王のいなくなった都の名が、六百年以上も使われ続けている。
    sources:
    - l6-urasoe-iha
    - l6-urasoe-guide
  relations:
  - pref/47
  unknowns:
  - 「うらおそい」より前の古名や、浦添ようどれ碑文の正確な年代の直接確認は未了
  - 伊波普猷の解釈以外の語源説の有無は確認できなかった
  updated: '2026-11-13'
- id: muni/47-渡名喜村
  code: '473561'
  names:
    ja: 渡名喜村
    reading: となきそん
    aliases:
    - 戸無島
  user_terms:
  - 渡名喜島
  - となき
  - トゥナチ
  naming_type: 島名の継承
  formation: 単独発足
  prefecture: 沖縄県
  homonyms: []
  summary: 渡名喜島と無人島の入砂島からなる、面積が沖縄県最小の村。島は那覇と中国福建を往復した進貢船の航路に位置し、航海安全を願う神歌（オモロ）に「となき」の名がみえる。1908年の島嶼町村制により村制が施行された。集落全体が国の重要伝統的建造物群保存地区に選定されている。島名「渡名喜」の語源は未詳である。
  first_attestation:
    era: 16世紀
    year_western: null
    document: 『おもろさうし』の神歌にみえる「となき」
    note: 日本歴史地名大系が、進貢船の航海安全を願う神歌（オモロ）に「となき」がみえると紹介する。『おもろさうし』の編纂は1531年から1623年にかけてのため、西暦年は特定しない
  claims:
  - text: 渡名喜村の地方公共団体コードは473561である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  - text: 日本歴史地名大系によれば、渡名喜島は那覇と中国福建を往復した進貢船の航海ルートに位置したため、航海安全を願う神歌（オモロ）に「となき」の名がみえる
    kind: fact
    level: E3
    status: established
    sources:
    - s10-tonaki-kotobank
  - text: 日本歴史地名大系によれば、渡名喜村は渡名喜島を一村とし、属島の入砂島は無人島である
    kind: fact
    level: E3
    status: established
    sources:
    - s10-tonaki-kotobank
  - text: 明治41年（1908年）4月1日、島嶼町村制により渡名喜村の村制が施行された。面積は国土地理院の面積調（2026年7月1日現在）で3.87平方キロメートルと、沖縄県の自治体のうち最も小さい
    kind: fact
    level: E2
    status: established
    sources:
    - upg-t8-tonaki-ken-gaiyou
    - upg-t8-tonaki-geoshape
    - upg-q10-gsi-menseki
  - text: 渡名喜島は17世紀中期以降「戸無島」と記されるようになり、その後、現在の「渡名喜」の呼称へと変化していったと、渡名喜村教育委員会の資料に基づく学術論文が紹介している
    kind: fact
    level: E3
    status: established
    sources:
    - upg-t8-tonaki-ritsumei
  - text: 文化遺産オンラインによれば、渡名喜島の集落は2000年5月25日に重要伝統的建造物群保存地区として選定された
    kind: fact
    level: E2
    status: established
    sources:
    - s10-tonaki-bunka
  - text: 「渡名喜（となき）」という島名の語源は、日本歴史地名大系・村公式資料のいずれにも説明が見当たらず、未詳である
    kind: fact
    level: E3
    status: indeterminate
    sources:
    - s10-tonaki-kotobank
  column:
    title: 砂州が結んだ二つの島
    text: 渡名喜島は、もともと北の丘陵と南の山地が別々の島で、長い年月をかけて間に砂が堆積し、一つの島になった。その平坦な砂州の上にできた集落は、白砂の道とフクギの屋敷林、赤瓦の家並みが残り、集落全体が国の重要伝統的建造物群保存地区に選ばれている。地割制度の細長い畑の区画も残り、沖縄の古い島の景観をいまに伝える村である。
    sources:
    - s10-tonaki-island-wiki
    - s10-tonaki-bunka
  relations:
  - pref/47
  - muni/47-粟国村
  - muni/47-久米島町
  unknowns:
  - 島名「渡名喜（となき）」の語源は未詳である
  - 『おもろさうし』のどの巻の歌に「となき」が現れるかは確認できなかった
  - 「戸無島」という呼称の由来は確認できなかった
  updated: '2026-11-13'
- id: muni/47-渡嘉敷村
  code: '473537'
  names:
    ja: 渡嘉敷村
    reading: とかしきそん
    aliases:
    - 前慶良間
  user_terms:
  - 渡嘉敷島
  - とかしき
  - 前慶良間
  - ケラマ
  naming_type: 島名の継承
  formation: 単独発足
  prefecture: 沖縄県
  homonyms: []
  summary: 慶良間諸島最大の渡嘉敷島を中心とする村。那覇の西約32キロにあり、沖縄本島から見て手前にあたることから「前慶良間」とも呼ばれる。近世は渡嘉敷間切（方音トゥカシチ）で、1908年の島嶼町村制により渡嘉敷村となった。島名「渡嘉敷」の語源は、調査した公的・専門資料に定説が見当たらない。1945年の集団自決は地名の由来とは別の、島の近代史の層である。
  first_attestation:
    era: 江戸時代
    year_western: 1713
    document: 『琉球国由来記』（1713年成立）の渡嘉敷間切
    note: 王府の旧記座が各間切から由来記を集めて編んだ地誌に渡嘉敷間切の名と祭祀が記録される。「渡嘉敷」の漢字表記の初出そのものは未確認
  claims:
  - text: 渡嘉敷村の地方公共団体コードは473537である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  - text: 日本歴史地名大系によれば、近世の渡嘉敷は「とうかしち間切」と読まれ、渡嘉敷村・小嶺村・阿波連村を擁し、座間味間切とともに久米方に属した
    kind: fact
    level: E3
    status: established
    sources:
    - s10-tokashiki-kotobank
  - text: 日本歴史地名大系によれば、渡嘉敷集落の方音は「トゥカシチ」で、渡嘉敷間切の行政の中心地であった
    kind: fact
    level: E3
    status: established
    sources:
    - s10-tokashiki-kotobank
  - text: 日本歴史地名大系および村公式資料によれば、沖縄本島から見て手前にあたることから、渡嘉敷島一帯は「前慶良間（メーギラマ）」、西方の座間味村の島々は「後慶良間（クシギラマ）」と呼ばれてきた
    kind: fact
    level: E3
    status: established
    sources:
    - s10-tokashiki-kotobank
    - s10-tokashiki-vill
  - text: 日本歴史地名大系によれば、1903年（明治36年）に小嶺村が渡嘉敷村に統合され、1908年の沖縄県及島嶼町村制により渡嘉敷村が成立した
    kind: fact
    level: E3
    status: established
    sources:
    - s10-tokashiki-kotobank
  - text: 村公式資料によれば、明治41年（1908年）の地方制度改正で沖縄県島尻郡渡嘉敷村となり、明治42年2月に間切長は村長に改称された
    kind: fact
    level: E2
    status: established
    sources:
    - s10-tokashiki-vill
  - text: 1945年（昭和20年）3月27日に米軍が渡嘉敷島に上陸し、住民の集団自決という悲惨な出来事があった。これは島名の由来とは別の、島の近代史の層である
    kind: fact
    level: E3
    status: established
    sources:
    - s10-tokashiki-nipponica
  - text: 「渡嘉敷」という島名の語源は、村公式資料・日本歴史地名大系のいずれにも説明が見当たらず、未詳である
    kind: fact
    level: E3
    status: indeterminate
    sources:
    - s10-tokashiki-kotobank
    - s10-tokashiki-vill
  column:
    title: 風待ちの港に生きた「海の民」
    text: 日本歴史地名大系によれば、渡嘉敷島は沖縄島に近く、貢船・冊封船の風待ち港として利用され、各村とも多くの船乗りを輩出してきた。島の西側の集落「渡嘉志久（とかしく）」や南の阿波連は、那覇と中国を結ぶ航路に生きた海の民の拠点だった。島名の語源は残されていないが、「前慶良間」の島々は琉球の対外航海を支えた島として記録に残る。
    sources:
    - s10-tokashiki-kotobank
  relations:
  - pref/47
  - muni/47-座間味村
  unknowns:
  - 島名「渡嘉敷」の語源は未詳で、方音「トゥカシチ」の原語的な意味も確認できなかった
  - 「渡嘉敷」の漢字表記が文献に初めて現れる時期は確認できなかった
  - 集団自決の発生日については、米軍上陸を3月27日とする資料（ニッポニカ）のほか、集団自決自体を3月28日とする説明もあり、日付の細部は確定していない
  updated: '2026-11-13'
- id: muni/47-石垣市
  code: '472077'
  names:
    ja: 石垣市
    reading: いしがきし
    aliases:
    - 石垣町
  user_terms:
  - 石垣島の由来
  - 日本最南端の市
  - 尖閣諸島がある市
  naming_type: 島名の継承
  formation: 単独発足
  prefecture: 沖縄県
  homonyms: []
  summary: 市名は島名「石垣」に由来する。『精選版日本国語大辞典』は「いしがき」を「信覚（しがき）の変化した語といわれる」とし、奈良時代初めに使者を送った信覚国を石垣島に比定する説を紹介する。地元の方言では今も「イシャナギィ」と呼ばれ、古い音の痕跡を残す。市域は石垣島全域と無人の尖閣諸島を含み、日本最西端・最南端の市である。1947年に石垣町が市制を施行した。
  first_attestation:
    era: 和銅7年
    year_western: 714
    document: 続日本紀
    note: 「信覚国」の記事。『精選版日本国語大辞典』は「いしがき」を信覚（しがき）の変化した語とし、信覚国を石垣島に比定する説を紹介する。前身名の初出として記録するもので、比定は説の段階にとどまる
  claims:
  - text: 『精選版日本国語大辞典』は「いしがき」について「信覚（しがき）の変化した語といわれる」とし、奈良時代の初めに使者をよこした信覚国は石垣島ともいわれる、とする
    kind: fact
    level: E3
    status: contested
    sources:
    - l6-ishigaki-kotobank-jima
  - text: 地元の方言では石垣を「イシャナギィ」といい、『日本歴史地名大系』も石垣村の読みを「いしやなぎい」とする
    kind: fact
    level: E3
    status: established
    sources:
    - l6-ishigaki-kotobank-jima
  - text: 王府時代の市域は石垣・大浜・宮良の3間切に分かれ、石垣間切には石垣・新川・名蔵・崎枝・川平・桴海の6か村があった（『日本歴史地名大系』「石垣市」）
    kind: fact
    level: E3
    status: established
    sources:
    - l6-ishigaki-kotobank-shi
  - text: 石垣市は石垣島全域と無人の尖閣諸島を含む、日本最西端・最南端の市である（『日本歴史地名大系』「石垣市」）
    kind: fact
    level: E3
    status: established
    sources:
    - l6-ishigaki-kotobank-shi
  - text: 尖閣諸島の字（あざ）名は2020年（令和2年）10月に、石垣市字登野城から「登野城尖閣」へ変更された（石垣市公式サイト）
    kind: fact
    level: E2
    status: established
    sources:
    - l6-ishigaki-city-senkaku
  - text: 1969年（昭和44年）には、当時の石垣市長が自ら尖閣諸島に上陸し、5島に行政標柱を建立した（石垣市議会の決議資料）
    kind: fact
    level: E2
    status: established
    sources:
    - l6-ishigaki-city-gikai
  - text: 石垣市公式の市史年表によれば、米軍統治下の1947年（昭和22年）3月21日に八重山民政府が発足し、同年7月10日に石垣町が石垣市に昇格した。沖縄県の市町村一覧も市制施行を昭和22年7月10日とし、地方公共団体コードは472077である
    kind: fact
    level: E2
    status: established
    sources:
    - upg-t12-ishigaki-shishi-nenpyo
    - upg-t12-okinawa-shichoson-ichiran
  column:
    title: 「イシャナギィ」に残る古い音
    text: 石垣の島の名は、標準語の音からは想像しにくい古い姿を方言に残している。地元の言葉では石垣は「イシャナギィ」。『精選版日本国語大辞典』が示す「信覚（しがき）から変化した」という説が正しければ、奈良時代に大和朝廷へ使者を送った「信覚国」の名が、1300年の歳月を経てこの方言の音の中に生きていることになる。比定はまだ説の段階だが、島の人々の日常の呼び名こそが、最も古い地名の記録なのかもしれない。
    sources:
    - l6-ishigaki-kotobank-jima
  relations:
  - pref/47
  unknowns:
  - 「信覚（しがき）」から「石垣」への音変化の過程を示す中世の用例は確認できなかった
  - 「石垣」の漢字が当てられた時期の特定は未了
  updated: '2026-11-13'
- id: muni/47-竹富町
  code: '473812'
  names:
    ja: 竹富町
    reading: たけとみちょう
    aliases:
    - 竹富村
    - 武富
    - てーどぅん
  user_terms:
  - 竹富島の名前の由来
  - テードゥン
  - タキドゥン
  - 町役場が石垣市にある町
  - 日本最南端の町
  - 八重山諸島の島々の町
  naming_type: 島名の継承
  formation: 単独発足
  prefecture: 沖縄県
  homonyms: []
  summary: 町名は竹富島の島名に由来する。竹富島は島の方言（テードゥンムニ）で「テードゥン」、石垣方言で「タキドゥン」と呼ばれ、島名は伝承上の人物タキンドゥン（他金殿）の名に由来すると『竹富町史』は伝える。町は西表島・竹富島・小浜島・黒島・波照間島など9つの有人島からなる日本最南端の町で、町役場は町域外の石垣市に置かれている。1914年に竹富村として発足し、1948年に町制を施行した。
  first_attestation:
    era: 正保年間
    year_western: null
    document: 正保国絵図
    note: 『日本歴史地名大系』「竹富島」項によれば、1640年代に作成された『正保国絵図』に竹富島が「たけとみ嶋」と記される。従来初出としてきた『元禄国絵図』（1697年）より古い用例
  claims:
  - text: ブリタニカ国際大百科事典は、町名は竹富島の島名に由来し、1948年に町制が施行され、町役場は石垣市美崎町にあるとする
    kind: fact
    level: E3
    status: established
    sources:
    - s12-taketomi-kotobank
  - text: 『日本歴史地名大系』によれば、町は竹富島・西表島・外離島・由布島・鳩間島・小浜島・新城島（上地・下地）・黒島・波照間島の有人10島と無人島からなり、日本最南端の有人島をもつ自治体である
    kind: fact
    level: E3
    status: established
    sources:
    - s12-taketomi-kotobank
  - text: 竹富島は、島の方言で「テードゥン」、石垣島では「タキドゥン」と呼ばれる（『日本歴史地名大系』「竹富島」項）
    kind: fact
    level: E3
    status: established
    sources:
    - upg-t5-taketomi-kotobank-jima
  - text: 島名は、沖縄島から渡来したと伝わるタキンドゥン（他金殿）の古称に由来するとも伝えられる。他金殿は竹富島の六山（六御嶽）のひとつ花城御嶽に海の神として祀られている（国土交通省の地域観光資源多言語解説文による）
    kind: legend
    level: E2
    status: indeterminate
    sources:
    - upg-t5-taketomi-mlit-on
  - text: 『正保国絵図』には竹富島が「たけとみ嶋」と記され、『中山伝信録』（1721年）には「達奇度奴」と記されて「富武」と訳されている。また同書に依拠したフランス人宣教師ゴービルの『琉球諸島覚書』には「Ta-ki-tou-non」と記される（『日本歴史地名大系』「竹富島」項）
    kind: fact
    level: E3
    status: established
    sources:
    - upg-t5-taketomi-kotobank-jima
  - text: 漢字表記は古くは「竹富」だったが、1729年に琉球王府が「竹」の字の使用を禁じたため「武富」と表記されるようになり、明治20年代頃から再び「竹富」と表記されるようになったとされる（『竹富町史』の記載としてWikipedia「竹富島」が紹介）
    kind: fact
    level: E5
    status: established
    sources:
    - s12-wiki-taketomi-island
  - text: 1914年（大正3年）4月1日に八重山村が分村し、竹富・黒島・小浜・新城・西表・鳩間・波照間の島々を村域として竹富村が発足し、当初は村役場が竹富島に置かれた。1938年（昭和13年）に村役場が石垣島の石垣町へ移転し、1948年（昭和23年）7月に町制を施行して竹富町となった
    kind: fact
    level: E2
    status: established
    sources:
    - upg-t5-taketomi-enkaku1
    - upg-t5-taketomi-enkaku2
    - upg-t5-taketomi-geoshape-son
  - text: 地方公共団体コードは473812である（総務省「地方公共団体コード一覧」で実測確認）
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 役場が町の外にある町
    text: 竹富町役場は、町の島々ではなく隣の石垣島（石垣市美崎町）にある。1914年の竹富村発足当初は役場も竹富島にあったが、1938年に石垣町へ移り、1948年に町になってからもそのままだ。各島を結ぶ船がすべて石垣港を起点とするため、行政の拠点も石垣に置くほうが都合がよいのである。区域の外に役場を置く町村は、全国でも竹富町と鹿児島県の十島村・三島村だけとされる。町の名の由来となった竹富島自体は、石垣港から高速船で約10分の近さにある。
    sources:
    - s12-taketomi-kotobank
    - s12-wiki-taketomi-town
    - s12-wiki-taketomi-island
  relations:
  - pref/47
  unknowns:
  - 島名「タキドゥン／テードゥン」の語源については、『日本歴史地名大系』と国土交通省の解説文で伝えられる範囲を確認したが、『竹富町史』（2011年）の本文の直接確認は未了
  - 『指南広義』（1708年）・新井白石『南島志』（1719年）の竹富の表記はWikipediaが挙げるが、専門辞典の本文では確認できていない
  - 竹富町の町制施行日は、町公式の沿革が1948年7月2日（南部琉球郡政府の許可による）とする一方、歴史的行政区域データセットでは竹富村の有効期間が同年7月1日までとされ、1日のずれがある
  - 「たけとみ」の呼称の初出は『正保国絵図』（1640年代）の「たけとみ嶋」を暫定的な初出とし、それ以前の用例は未確認
  - 1524年頃に竹富島出身の西塘が授かったとされる「武富大首里大屋子」の表記と、「竹富／武富」の表記の使い分けの関係は未確認
  updated: '2026-11-13'
- id: muni/47-粟国村
  code: '473553'
  names:
    ja: 粟国村
    reading: あぐにそん
    aliases:
    - 粟島
    - アワグニ
  user_terms:
  - 粟国島
  - あぐに
  - アグニ
  naming_type: 島名の継承
  formation: 単独発足
  prefecture: 沖縄県
  homonyms: []
  summary: 粟国島1島で構成される村。島名はかつての主要作物アワ（粟）に由来するとされ、古くは「アワグニ」と呼ばれた。1464年の文書に「亜哇郡尼」と記されるのが古い記録で、「粟島（アワジマ）」の表記を経て、明治6年の当局の答申で「粟国島」の表記が認められ、読みもアグニへと変化した。1908年の島嶼町村制により粟国村となった。
  first_attestation:
    era: 室町時代
    year_western: 1464
    document: 天順8年（1464年）の文書および鄭姓胡城家譜にみえる「亜哇郡尼（アワグニ）」
    note: 村公式の粟国アーカイブスが東恩納寛惇『南島風土記』・粟国村誌の記述として紹介するもので、原典は未読のため主張はE2に格下げした
  claims:
  - text: 粟国村の地方公共団体コードは473553である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  - text: 粟国村公式の粟国アーカイブスは、東恩納寛惇『南島風土記』を引き、粟国は本来「アグニ」で、1464年（天順8年）の文書と鄭姓胡城家譜に「亜哇郡尼（アワグニ）」と記載されていると紹介している
    kind: fact
    level: E2
    status: established
    sources:
    - s10-aguni-archive
  - text: 同アーカイブスによれば、『海島記』や慶長帳では「粟島（アワジマ）」となっていたが、明治6年（1873年）の調査書類に対する当局の答申で「粟国島」の表記が認められ、「アワグニ」「アグニ」となった
    kind: fact
    level: E2
    status: established
    sources:
    - s10-aguni-archive
  - text: ブリタニカ国際大百科事典は、粟国村の村名は島名にちなみ、島名はかつての主要作物アワに由来すると説明している
    kind: fact
    level: E3
    status: established
    sources:
    - s10-aguni-kotobank
  - text: 沖縄県町村会の粟国村紹介でも、島の名前の由来はかつての主要作物「アワ」に由来するとされている
    kind: fact
    level: E2
    status: established
    sources:
    - s10-aguni-chousonkai
  - text: 日本歴史地名大系によれば、『おもろさうし』では粟国島は「かき となき」とみえ、「かき」と呼ばれている
    kind: fact
    level: E3
    status: established
    sources:
    - s10-aguni-kotobank
  - text: 1908年（明治41年）4月1日、島嶼町村制の施行により粟国村として村制が施行された
    kind: fact
    level: E2
    status: established
    sources:
    - upg-t8-aguni-geoshape
  column:
    title: アワの島は、古歌謡では「かき」
    text: 粟国の名はアワ（粟）の産地に由来するとされるが、琉球の古歌謡集『おもろさうし』の世界では、この島は「かき」と呼ばれていた。日本歴史地名大系によれば、おもろに粟国島は「かき となき」とみえるという。進貢船の航路にあたる隣の渡名喜（となき）と並び称された一節で、「粟国」という漢字名が定まるはるか前から、島は歌謡の中に別の名を持っていた。
    sources:
    - s10-aguni-kotobank
  relations:
  - pref/47
  - muni/47-渡名喜村
  - muni/47-久米島町
  unknowns:
  - 「アワグニ」から「アグニ」への音の変化がいつ起きたかは確認できなかった
  - 『おもろさうし』にみえる「かき」の語義は確認できなかった
  - 1464年の文書の原典は未読で、粟国アーカイブス経由の紹介にとどまる
  updated: '2026-11-13'
- id: muni/47-糸満市
  code: '472107'
  names:
    ja: 糸満市
    reading: いとまんし
    aliases:
    - 糸満町
    - いとまむ
    - イチュマン
  user_terms:
  - いとまん
  - 海人（あま）のまち
  - 糸満ハーレーのまち
  - 沖縄本島最南端の市
  naming_type: 中心地名の継承
  formation: 合併新設
  prefecture: 沖縄県
  homonyms: []
  summary: 沖縄本島最南端の市で、昭和46年（1971年）12月1日に市制を施行した。本土復帰の前年、米軍統治下での発足である。「糸満」は近世の帳簿類に「いとまむ村」と記され、1713年の『琉球国由来記』で「糸満村」の表記が見える古い地名。方音は「イチュマン」。語源は漁師のまちにふさわしく「イト（優れたの意）＋アマ（海人）＝優れた漁師」とする説が糸満町史の編集者によって本命とされたが、他の学者の説もあって確定していない。
  first_attestation:
    era: 慶安2年
    year_western: 1649
    document: 『絵図郷村帳』
    note: 慶安2年（1649年）の『絵図郷村帳』と翌年の『琉球国高究帳』では「いとまむ村」と表記され、康熙52年（1713年）の『琉球国由来記』では「糸満村」となっている（『日本歴史地名大系』「糸満村」の項で確認）
  claims:
  - text: 糸満市の地方公共団体コードは472107である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  - text: 糸満市は昭和46年（1971年）12月1日に市制を施行した、本土復帰の前年にあたる米軍統治下での発足である
    kind: fact
    level: E3
    status: established
    sources:
    - s5-itoman-kotobank
    - s5-itoman-kukuru
  - text: 前身の糸満町は明治41年（1908年）の町村制施行時に兼城間切の糸満村が町制を施行して生まれ、昭和36年（1961年）に兼城村・高嶺村・三和村と合併して新しい糸満町となった
    kind: fact
    level: E3
    status: established
    sources:
    - s5-itoman-kotobank
    - s5-itoman-city-ayumi
  - text: 「糸満」の表記は、慶安2年（1649年）の『絵図郷村帳』と翌年の『琉球国高究帳』では「いとまむ村」、康熙52年（1713年）の『琉球国由来記』では「糸満村」となっている
    kind: fact
    level: E3
    status: established
    sources:
    - upg-t8-itoman-taikei
    - upg-t8-itoman-takakime
    - upg-t8-itoman-dana
    - upg-t8-itoman-yuraiki
  - text: 語源について、糸満町史の編集委員だった玉城貫は、第一・優れたなどの意味を持つ「イト」と海人の「アマ」を合わせた言葉で「優れた漁師」という意味だとする説を本命としたことが紹介されている
    kind: fact
    level: E5
    status: contested
    sources:
    - s5-itoman-wiki
  - text: 民俗学者の宮良當壯は「イユ・トゥイ・アマミ」（魚を捕る海人の集団）の約転であろうとする説を唱え、金関丈夫も別の語源を唱えるなど諸説があり、定説は得られていないことが紹介されている
    kind: fact
    level: E5
    status: contested
    sources:
    - s5-itoman-wiki
  - text: 井戸を掘る際に糸を食べている蟹が現れたことが「糸満」の名の起こりだという話が伝えられている
    kind: legend
    level: E5
    status: established
    sources:
    - s5-itoman-wiki
  - text: 方音は「イチュマン」で、糸満の漁師（海人）は戦前から日本近海のみならず海外にまで進出したことで知られる
    kind: fact
    level: E3
    status: established
    sources:
    - s5-itoman-kotobank
  column:
    title: 町史の編集委員が激怒した「エイトマン説」
    text: 糸満の語源には、変わった俗説がある。昔、8人の異人がこの地に漂着したから「エイトマン」と呼ばれ、それが訛って糸満になった、というものである。ところが糸満町史の編集にあたった玉城貫は、この説を著書で「学問を愚弄するもの」とまで言って切り捨てた。玉城自身の本命は、「イト（優れた）＋アマ（海人）」で「優れた漁師」という、漁師のまちの誇りを込めた解釈である。漂着した異人の数から名前を説明したくなる素朴な語源遊びと、それを許さなかった地元の史家の矜持との対比が、この地名の語られ方の面白さをよく示している。
    sources:
    - s5-itoman-wiki
  relations:
  - pref/47
  unknowns:
  - 語源の諸説はいずれもWikipedia経由で糸満市史・糸満町史の記述として紹介されたもので、市史そのものは未確認である
  - 「糸を巻く」「糸を引く」といった漁の糸そのものに結びつける語源説は、井戸掘りの蟹の伝承以外には確認できなかった
  - 『おもろさうし』など近世以前の古い史料における「いとまむ」の用例は確認できなかった
  updated: '2026-11-13'
- id: muni/47-西原町
  code: '473294'
  names:
    ja: 西原町
    reading: にしはらちょう
    aliases:
    - 西原
    - にしばる（沖縄語の現地読み）
  user_terms:
  - 西原 なぜ西なのに北
  - 琉球大学のある町
  - にしはら 読み方 沖縄 方言
  naming_type: 旧行政区画名の継承
  naming_note: 首里から見た方位を示す王国の間切名「西原間切」を継承し、1979年に町制を施行した
  formation: 単独発足
  prefecture: 沖縄県
  homonyms: []
  summary: 沖縄本島南部、首里の北に広がる町。町名は王国時代の間切名「西原間切」に由来する。沖縄語で「ニシ」は北を意味し、「西原」は漢字の字面に反して「首里の北の原」を指す地名である。真和志・南風原とともに王府直轄の「首里三平等」の一つだった。間切時代の領域は津堅島から泊・天久まで及んだが、首里・那覇への編入で縮小した。1908年に西原村となり、1979年4月1日に西原町となり、同年に琉球大学が首里から移転した。
  first_attestation:
    era: 寛永12年
    year_western: 1635
    document: 『琉球国高究帳』
    note: 17世紀初めの『琉球国高究帳』に西原間切が見えるという二次資料の紹介によるもので、間切の範囲が記される古い記録の一つ。
  claims:
  - text: 町名は王国時代の間切名「西原間切」を継承する。1908年（明治41年）に17か村をもって西原村が成立し、1979年（昭和54年）4月1日に町制を施行して西原町となった
    kind: fact
    level: E2
    status: established
    sources:
    - s9-nishihara-bunka-koso
    - s9-nishihara-fukki50
  - text: 町公式の記念誌は「西原の名称は、首里御城の北（ニシ）にある地域という意で、南の南風原に対する名称である」と説明する。沖縄語のニシは、標準語の「西」ではなく「北」を意味する
    kind: fact
    level: E2
    status: established
    sources:
    - s9-nishihara-fukki50
  - text: 町公式の歴史文化基本構想も「西原の名称は首里の北（方言でニシ）にある地方に由来している」とし、間切時代の西原は首里王府の直轄領で、領域は北は津堅島、西は石嶺・末吉・天久・泊まで及ぶ大きな行政圏だったと記す
    kind: fact
    level: E2
    status: established
    sources:
    - s9-nishihara-bunka-koso
  - text: 西原は真和志間切・南風原間切とともに「首里三平等（しゅりみひら）」と呼ばれた首里王府の直轄領の一つだった
    kind: fact
    level: E2
    status: established
    sources:
    - s9-nishihara-fukki50
  - text: 明治末から大正期にかけて石嶺・末吉などが首里区（現・那覇市）へ編入され、1920年にはほぼ現在の町の領域になった
    kind: fact
    level: E2
    status: established
    sources:
    - s9-nishihara-bunka-koso
  - text: 『日本歴史地名大系』の「西原間切」の項は見出しの読みを「にしばるまぎり」とし、西原の現地読みが「にしばる」であることを示している。読みの上でも「ニシ＝北」の地名である
    kind: fact
    level: E3
    status: established
    sources:
    - upg-t6-nishihara-kotobank
  - text: 一方、沖縄語で方位の「西」は「イリ」といい、「西原」を「イリバル」と読む地名はうるま市西原など他所にある。西原町の「ニシハラ」とは、読みも成り立ちも異なる
    kind: fact
    level: E2
    status: established
    sources:
    - upg-ag6-nishihara-japanpost-uruma
    - s9-nishihara-disambig
  - text: 西原は王府時代には稲作地帯として知られ、1906年に政府の糖業改良事務局が我謝に置かれると、糖業が町の主要産業となった
    kind: fact
    level: E2
    status: established
    sources:
    - s9-nishihara-fukki50
  - text: 琉球大学は1979年（昭和54年）3月に農学部を皮切りに首里キャンパスから西原町千原への移転を開始し、1984年（昭和59年）に全学部の移転が完了した。町は1982年に将来像として「文教のまち西原」を掲げ、教育・文教のまちとして発展した
    kind: fact
    level: E2
    status: established
    sources:
    - upg-t6-ryudai-bulletin
    - s9-nishihara-bunka-koso
  - text: 自治体コードは473294である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 「西」と書いて「北」と読む町
    text: 西原町の漢字は、地図上の方角と反対の意味を持っている。沖縄語では北を「ニシ」という。首里城から見て北に広がる原野だったこの地は「ニシの原＝ニシバル」と呼ばれ、それに「西原」の字が当てられた。だから西原町は、本土の感覚で読むと方位が逆転する地名である。しかも間切時代の西原は、津堅島から泊・天久・石嶺・末吉までを抱える王府直轄の大きな領域で、今の那覇市の市街地の一部までが「西原」だった。城下の変遷とともに領域を縮めながら、「北の原」という意味だけは名前の中に残り続けている。
    sources:
    - s9-nishihara-bunka-koso
    - s9-nishihara-fukki50
  relations:
  - pref/47
  - muni/47-南風原町
  - muni/43-西原村
  unknowns:
  - 西原間切の成立年代と、「ニシバル」という呼称が文献に現れる正確な初出
  - 「西原」に「西」の字が当てられた経緯（当て字を決めた主体や時期）の記録
  updated: '2026-11-13'
