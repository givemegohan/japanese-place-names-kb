  - 下伊那の高森町
  naming_type: 合併新設
  prefecture: 長野県
  homonyms:
  - muni/43-高森町
  summary: 下伊那郡の町で、昭和32年（1957）7月1日に市田村と山吹村の合併で発足した。町名は「両村を山頂で結ぶ本高森山に由来して」付けられたことが町の公式要覧に明記される、山名採用型の合併新名である。同名の熊本県高森町は江戸期の高森手永に遡る古い地名の継承であり、同じ「高森」でも名前の年齢がまったく異なる。
  first_attestation:
    era: 昭和32年
    year_western: 1957
    document: 高森町の発足（市田村・山吹村の合併、本高森山に由来する命名）
    note: 地名としての「高森」の初出は命名そのもの。山名「本高森山」はそれ以前から存在したが、その山名自体の由来は未確認
  claims:
  - text: 昭和32年（1957）7月1日に市田村と山吹村が合併し、両村を山頂で結ぶ本高森山に由来して、町名を高森町とした
    kind: fact
    level: E2
    status: established
    sources:
    - h5-takamori-nagano-handbook
  - text: 市田村は1889年（明治22年）に下市田・上市田・吉田・出原・大島山・牛牧の6か村が合併して発足した村であり、合併前の町域に「高森」を名乗る自治体はなかった
    kind: fact
    level: E2
    status: established
    sources:
    - h5-takamori-nagano-handbook
  - text: 異なる層として、同名の熊本県高森町は江戸時代に行政区画「高森手永」が置かれ、1889年の町村制ですでに高森町が存在した古い地名であり、1957年に山名から新しく名付けられた長野の高森とは、名前の古さが対照的である
    kind: fact
    level: E2
    status: established
    sources:
    - h5-takamori-kumamoto-enkaku
  - text: 共通する層として、両町とも「森」を含む名が山地の地形と結びついた町であり、昭和の大合併期に現在の町として発足した点は共通する
    kind: fact
    level: E2
    status: established
    sources:
    - h5-takamori-nagano-handbook
    - h5-takamori-kumamoto-kaso
  - text: 総務省の全国地方公共団体コードで、高森町の団体コードは204030と定められている
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 二つの村を「山頂で結ぶ」山の名前
    text: 長野の高森町の名前の決め方は、町の公式資料に美しい一文で残っています。「両村を山頂で結ぶ本高森山に由来して、町名を高森町としました」。本高森山の山頂は市田村と山吹村の境界にあり、合併する二つの村はもともと一つの山で結ばれていた、というわけです。どちらか一方の村の名前を選ぶのではなく、二つの村の真上にある山の名前を共有の名にしたところに、対等合併の知恵が見えます。
    sources:
    - h5-takamori-nagano-handbook
  relations:
  - pref/20
  - muni/43-高森町
  unknowns:
  - 命名の選定過程（公募だったか、候補名に何があったか）は未確認
  - 山名「本高森山」の「高森」自体の由来（いつ、なぜ高森と呼ばれるようになったか）は未確認
  updated: '2026-11-13'
- id: muni/21-岐阜市
  code: '212016'
  names:
    ja: 岐阜市
    reading: ぎふし
    aliases:
    - 岐阜町
    - 井口
    - 井ノ口
  user_terms:
  - 岐阜市の名前の由来
  - 岐阜は信長が付けた名前か
  - 岐山と曲阜の意味
  - 沢彦の3つの案
  naming_type: 一部の地名
  prefecture: 岐阜県
  homonyms: []
  summary: 市名は城下町「岐阜」の名を受け継いだもので、その岐阜は永禄10年（1567）に織田信長が稲葉山城下の井口を改めた名とされる。沢彦宗恩の進言による命名という話は後世の編纂物『安土創業録』に基づいており、信長以前から禅僧の間で「岐阜」の語が使われていた例もあって、命名の経緯には諸説がある（県レコードと同一の記録）。明治22年（1889）に市制が施行されて岐阜市となった。
  first_attestation:
    era: 永禄10年
    year_western: 1567
    document: 信長公記
    note: 井口を岐阜と改めた公称としての初出。語そのものは信長以前の禅僧の用例が指摘されている（県レコードと同一の記録）
  claims:
  - text: 永禄10年（1567）、織田信長は稲葉山城を攻略して居城を清須から移した
    kind: fact
    level: E2
    status: established
    sources:
    - c-gifu-ken
  - text: 『信長公記』は、信長が稲葉山の城下の井口（井ノ口）を岐阜と改めたと記しており、改名自体は当事者に近い記録で裏付けられる
    kind: fact
    level: E1
    status: established
    sources:
    - c-cap-nobunaga-koki
    - c-gifu-ken
  - text: 尾張・政秀寺の禅僧沢彦宗恩が「岐山・岐陽・岐阜」の3案を進言し、信長が「岐阜」を選んだとする話は『安土創業録』に基づくもので、同書は後世の編纂物であり同時代の記録ではない
    kind: fact
    level: E2
    status: contested
    sources:
    - c-gifu-ken
    - c-cap-azuchi-sogyoroku
  - text: 「岐」は、中国で周の文王が岐山より興って天下を定めた故事にちなむと岐阜県公式は説明する
    kind: fact
    level: E2
    status: established
    sources:
    - c-gifu-ken
  - text: 「阜」を孔子の生誕地である曲阜にちなむとする説明も広く流布するが、県公式の説明は岐山の故事を中心としており、曲阜説は諸説の一つと位置づけられる
    kind: fact
    level: E3
    status: contested
    sources:
    - c-gifu-ken
    - c-gifu-city-gaiyo
  - text: 岐阜市の資料は、応仁元年（1467）の瑞龍寺建立に際する賛に「岐阜」の字句が見えることや、快川紹喜が「岐陽」の語を用いたことを挙げ、信長以前から禅僧の間でこの地の雅称が使われていたとする
    kind: fact
    level: E2
    status: established
    sources:
    - c-gifu-city-gaiyo
  - text: 明治22年（1889）7月1日、市制町村制の施行で岐阜の56の町の区域を合わせて岐阜市が発足した
    kind: fact
    level: E4
    status: established
    sources:
    - c-cap-gifu-uub
  - text: 総務省の全国地方公共団体コードで、岐阜市の団体コードは212016と定められている
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 天下統一の出発点に、中国の故事を重ねた男
    text: 永禄10年、美濃を手に入れた信長は、井ノ口という小さな地名を捨てて「岐阜」と改め、ほどなく「天下布武」の印を使い始めます。沢彦進言説によれば、「岐」は周の文王が岐山から興って天下を平定した故事へのなぞらえで、命名はそのまま天下への宣言でした。もっとも「岐阜」の語自体は、それ以前から金華山周辺を詠む禅僧の雅称として存在したとも言われます。信長の才覚は、無から名前を発明したことではなく、すでにあった由緒ある言葉を拾い上げ、自分の旗印に変えたところにあったのかもしれません。岐阜のまちは、その改名の瞬間から都市としての歩みを始めたと言えます。
    sources:
    - c-gifu-ken
    - c-gifu-city-gaiyo
  relations:
  - pref/21
  unknowns:
  - 沢彦宗恩の進言を裏付ける同時代史料は確認されておらず、『安土創業録』の記事の信憑性は確定していない（県レコードと同一の未確認事項）
  - 1467年の賛の「岐阜鐘秀」という字句が地名として使われたのか、単なる美称かは解釈が分かれる
  - 「阜＝曲阜」説の出典となる初期の文献は特定できていない
  - 岐阜市の市制施行日（1889年7月1日）について、市公式の概況資料での直接確認は次回に回した
  updated: '2026-11-13'
- id: muni/21-池田町
  code: '214043'
  names:
    ja: 池田町
    reading: いけだちょう
    aliases:
    - 池田村
    - 温知村
    - 池田荘
  user_terms:
  - 池田町 岐阜
  - 揖斐郡の池田町
  - 池田温泉のある町
  naming_type: その他（旧村名の復活による改称）
  prefecture: 岐阜県
  homonyms:
  - muni/01-池田町
  - muni/18-池田町
  - muni/20-池田町
  summary: 岐阜県揖斐郡の町。町域は古代から中世にかけて美濃国の池田荘に属した。明治の池田村は1950年に本郷村と合併して温知村となったが、1954年5月1日の町制施行と同時に池田町へ改称され、旧村名「池田」が復活した。4つの池田町のうち、合併新名を捨てて旧名に戻した経緯が特徴である。
  first_attestation:
    era: 中世
    year_western: null
    document: 荘園名「池田荘」（美濃国）としての記録
    note: 室町時代に美濃国守護・土岐頼忠の本拠が置かれた。具体的な初出年は今回の調査では特定できていない
  claims:
  - text: 町域は古代から中世にかけて池田荘に属し、室町時代には美濃国守護の土岐頼忠が本拠を置いた
    kind: fact
    level: E3
    status: established
    sources:
    - h2-kotobank-ikeda
    - h2-ikeda-gifu-shiryo
  - text: 1950年に池田村と本郷村が合併して温知村となり、1954年5月1日に「温知村を池田村とし、池田村を池田町とする」手続きで、町制施行と同時に池田町となった
    kind: fact
    level: E2
    status: established
    sources:
    - h2-ikeda-gifu-kankyo
  - text: 1954年の改称は、合併でいったん姿を消した旧村名「池田」の復活であり、その名は池田荘の地を指した古い地域名に遡る。ただし改称理由の明文は確認できておらず、この説明は経緯からの類推である
    kind: fact
    level: H
    status: inferred
    sources:
    - h2-ikeda-gifu-kankyo
    - h2-kotobank-ikeda
  - text: 同名の比較（共通する層）：福井県池田町も中世の「池田荘」に遡る点で共通する。ただし美濃国と越前国今立郡の池田荘は別の荘園であり、直接の関係はない
    kind: fact
    level: E3
    status: established
    sources:
    - h2-kotobank-ikeda
    - h2-kotobank-ikedacho
  - text: 同名の比較（異なる層）：北海道池田町の人名由来、長野県池田町の郷名のまっすぐな継承とは異なり、岐阜県池田町は「合併新名（温知）から旧名への復活改称」という経緯を持つ。読みは「いけだちょう」
    kind: fact
    level: E2
    status: established
    sources:
    - h2-ikeda-gifu-kankyo
    - b-cap-chiba-soumu-code
  - text: 中心集落の池野は近世に市場町として発展し、町名のもとになった池田村の中心でもあった
    kind: fact
    level: E3
    status: established
    sources:
    - h2-kotobank-ikedacho
  column:
    title: わずか4年で消えた「温知村」
    text: 1950年の合併で生まれた温知村は、「温故知新」を思わせる雅な新名だった。だが4年後、町制施行の機会に村は「池田村」を名乗り直し、そのまま池田町になった。合併で新しい名を作っても、土地の古い名のほうがしっくりくる——昭和の合併で全国に生まれた新名が次々に旧名へ戻った現象の、小さく分かりやすい実例である。
    sources:
    - h2-ikeda-gifu-kankyo
    - h2-ikeda-gifu-shiryo
  relations:
  - pref/21
  - muni/01-池田町
  - muni/18-池田町
  - muni/20-池田町
  unknowns:
  - 美濃国池田荘の初出文書・成立時期は未確認
  - 1954年の改称を決めた際の公式な理由の記録は未確認（旧村名の復活とする説明は経緯からの類推）
  updated: '2026-11-13'
- id: muni/21-白川村
  code: '216046'
  names:
    ja: 白川村
    reading: しらかわむら
    aliases:
    - 白川郷
  user_terms:
  - 白川村の名前の由来
  - 白川郷の白川の意味
  - 白川郷と白川村の違い
  naming_type: 一部の地名
  prefecture: 岐阜県
  homonyms: []
  summary: 村名は歴史的な地域名「白川郷」の白川を受け継いだもので、「飛騨国白川郷」の名は平安時代末期の『玉葉』に見える。「白川」は「白い川」の意で、白山の地下から流れ出る温泉の鉱物のために庄川の水がしばしば濁って白く見えることを形容した名と説明される。明治時代に白川郷42集落のうち23集落が白川村となり、残りは荘川村（現在の高山市域）となった。
  first_attestation:
    era: 安元2年
    year_western: 1176
    document: 『玉葉』（九条兼実の日記）
    note: 「飛騨国白川郷」の名の初見として白川郷・五箇山の合掌造り集落世界遺産センターが紹介するもの。村名はこの広域の地域名「白川郷」の継承である
  claims:
  - text: 平安時代末期、九条兼実の日記『玉葉』の安元2年（1176）の条に「飛騨国白川郷」の名が初めて見えると白川郷・五箇山の合掌造り集落世界遺産センターは紹介する
    kind: fact
    level: E2
    status: established
    sources:
    - k3-shirakawa-whc-ogimachi
  - text: 「白川」は「白い川」を意味し、休火山である白山の下から流れ出る温泉の鉱物が支流に流れ込むため、しばしば濁って白く見える庄川の水を形容した言葉であると、国土交通省の多言語解説文データベース（白川村多言語解説協議会作成）は説明する
    kind: fact
    level: E2
    status: established
    sources:
    - k3-shirakawa-mlit
  - text: 白川郷は8世紀以来の白山信仰の修験の行場として開かれ、飛騨側からの白山登拝路の拠点であった
    kind: fact
    level: E2
    status: established
    sources:
    - k3-shirakawa-whc-rekishi
  - text: 江戸時代、白川郷には42の集落があり、大名の領地ではなく江戸幕府の直轄地（天領）であった
    kind: fact
    level: E2
    status: established
    sources:
    - k3-shirakawa-mlit
    - k3-shirakawa-whc-rekishi
  - text: 寿永2年（1183）に倶利伽羅峠の戦いで敗れた平家の残党が白川郷に落ちのびたとする伝説が、村人の間に語り継がれている
    kind: legend
    level: E2
    status: established
    sources:
    - k3-shirakawa-whc-ogimachi
  - text: 明治時代になると、白川郷の42集落のうち23集落が岐阜県白川村となり、残りの集落は荘川村（現在の高山市の一部）となった
    kind: fact
    level: E2
    status: established
    sources:
    - k3-shirakawa-whc-rekishi
  - text: 平成7年（1995）、白川村の荻町集落は富山県五箇山の集落とともに「白川郷・五箇山の合掌造り集落」として世界遺産に登録された
    kind: fact
    level: E2
    status: established
    sources:
    - k3-shirakawa-whc-ogimachi
  - text: 総務省の全国地方公共団体コードで、白川村の団体コードは216046と定められている
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 白川郷は、白川村より大きい
    text: 「白川郷」と「白川村」は同じ範囲を指す言葉ではありません。白川郷は庄川流域の42集落全体を指した歴史的な広域の名前で、いまの白川村はそのうち下流側の23集落です。残りの集落は荘川村となり、2005年の合併で高山市の一部になりました。国土交通省の解説文も「白川郷の名は歴史上の全体を指すので、小さい方の白川村と混同しないように」とわざわざ注意しています。世界遺産の名前にある「白川郷」は広い方の白川郷で、村の名前はその一部を受け継いだものなのです。
    sources:
    - k3-shirakawa-mlit
    - k3-shirakawa-whc-rekishi
  relations:
  - pref/21
  - muni/21-高山市
  unknowns:
  - 白川村が成立した正確な年次（明治何年か）は、本バッチで確認した公的資料では特定できていない
  - 「白い川」説の原典にあたる村史・地名辞典の記述は本バッチでは直接確認できていない
  - 『玉葉』の該当記事の原文確認は行っておらず、世界遺産センターの紹介に基づく
  updated: '2026-11-13'
- id: muni/21-高山市
  code: '212032'
  names:
    ja: 高山市
    reading: たかやまし
    aliases:
    - 高山町
  user_terms:
  - 高山市の名前の由来
  - 飛騨高山の名前の理由
  - 高山は人名なのか
  naming_type: 一部の地名
  prefecture: 岐阜県
  homonyms: []
  summary: 市名は城下町「高山」の継承で、その地名は永正年間（1504〜21）に守護代多賀氏の一族・高山外記が現在の城山に城砦を築いた頃にさかのぼると高山市は説明する。城内に多賀天神を祀って天神山・多賀山と称したことに由来するともいわれており、由来は確定していない。天正14年（1586）に金森長近が高山城を築いて城下町を形成し、昭和11年（1936）に市制を施行した。
  first_attestation:
    era: 永正年間（1504〜21年）
    year_western: null
    document: 高山市公式資料（高山市中心市街地活性化基本計画）
    note: 「高山」の地名は高山外記が城山に城砦を築いた頃にさかのぼると市の公式計画が説明するもので、同時代文書による初出の特定ではない
  claims:
  - text: 「高山」の地名は、永正年間（1504〜21）に守護代多賀氏の一族である高山外記が、現在の城山に城砦を築いた頃にさかのぼると高山市の公式資料は説明する
    kind: fact
    level: E2
    status: established
    sources:
    - k3-takayama-chushin
  - text: 城内に近江の多賀天神を祀り、天神山・多賀山と称したことに由来するともいわれている
    kind: fact
    level: E2
    status: contested
    sources:
    - k3-takayama-chushin
  - text: 天正13年（1585）に飛騨を平定した金森長近は、翌天正14年に飛騨に入り、天神山に高山城の築城を始めて城下町を形成した
    kind: fact
    level: E2
    status: established
    sources:
    - k3-takayama-chushin
  - text: 明治8年（1875）に高山一之町村・二之町村・三之町村が合併して高山町となった
    kind: fact
    level: E2
    status: established
    sources:
    - k3-takayama-chushin
  - text: 昭和11年（1936）11月1日、大名田町を合併して市制を施行し、高山市が発足した
    kind: fact
    level: E2
    status: established
    sources:
    - k3-takayama-chushin
  - text: 平成17年（2005）2月1日に丹生川村・清見村・荘川村など周辺9町村と合併し、日本一広大な面積を有する市となった
    kind: fact
    level: E2
    status: established
    sources:
    - k3-takayama-chushin
  - text: 総務省の全国地方公共団体コードで、高山市の団体コードは212032と定められている
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 「高山」は人名だったのか、山の名か
    text: 高山という地名の候補は2つあります。ひとつは永正年間に城砦を築いた武将・高山外記という人名。もうひとつは、城内に多賀天神を祀った山が天神山・多賀山と呼ばれたという山の名の系譜です。高山市の公式資料は前者を本筋として書きながら、後者も「由来するともいわれている」と併記していて、決着はついていません。はっきりしているのは、どちらの話でも出発点が同じ城山（いまの高山城跡）だということ、そして金森長近がこの名を受け継いで城下町を完成させ、名前が飛騨の中心地の呼び名として定着したことです。
    sources:
    - k3-takayama-chushin
  relations:
  - pref/21
  - muni/21-白川村
  unknowns:
  - 高山外記の人名に由来するのか、天神山・多賀山の称に由来するのかは、市の公式資料でも確定していない
  - 「高山」の同時代文書における初出は本バッチでは特定できていない
  - 高山外記という人物の実在性と事績の検証は本バッチでは行えていない
  updated: '2026-11-13'
- id: muni/22-森町
  code: '224618'
  names:
    ja: 森町
    reading: もりまち
    aliases:
    - 森町村
    - 三木の里
  user_terms:
  - 森町 静岡
  - 遠州の小京都
  - 三木の里 森町
  - 周智郡の町
  naming_type: 一部の地名
  prefecture: 静岡県
  homonyms:
  - muni/01-森町
  summary: 静岡県周智郡の町。町の説明では「森町という名前の村ができたのは鎌倉時代中頃」とされ、中世の村名を継承する。明治22年（1889）の町村制で森町として発足し、昭和30〜31年（1955〜56）の合併で現在の町域となった。古代の周智郡や小國神社の記録は古いが、「森」の名自体は中世以降のものである。
  first_attestation:
    era: 鎌倉時代中頃
    year_western: null
    document: 森の村の成立を伝える町公式の説明
    note: 具体的な文書名・年は町の説明では示されていない
  claims:
  - text: 町公式の説明によれば、「森町という名前の村ができたのは鎌倉時代中頃」で、それ以前の古代の資料に「森」の名は確認できない
    kind: fact
    level: E2
    status: established
    sources:
    - h2-mori-shizuoka-yurai
  - text: 周智郡と小國神社は『続日本後紀』承和7年（840）の記事に現れる古代以来の名だが、『和名類聚抄』に載る周智郡の5郷（大田・上山・野中・土器・井伊）に「森」はなく、「森」の名は中世のものである
    kind: fact
    level: E2
    status: established
    sources:
    - h2-mori-shizuoka-zusetsu
    - h2-mori-shizuoka-yurai
  - text: 明治22年（1889）の町村制施行で三倉村・天方村・森町・一宮村・園田村・飯田村が発足し、昭和30年（1955）に天方村・一宮村・園田村・飯田村が森町と合併、翌年に三倉村が合併して現在の森町となった
    kind: fact
    level: E2
    status: established
    sources:
    - h2-mori-shizuoka-keikan
  - text: 別名「三木の里」は、「森」の字が木を3つ重ねた形であることにちなむ
    kind: fact
    level: E2
    status: established
    sources:
    - h2-mori-shizuoka-yurai
  - text: 同名の比較（異なる層）：北海道森町が江戸時代の漁村名（アイヌ語オニウシに対応する和名）に由来するのに対し、静岡県森町は中世の村名の継承であり、名の古さが大きく異なる
    kind: fact
    level: E2
    status: established
    sources:
    - h2-mori-shizuoka-yurai
    - h2-mori-hok-tokei
  - text: 同名の比較（共通する層）：読みは北海道森町と同じ「もりまち」である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 遠州の小京都と「三木の里」
    text: 大正12年（1923）、地理学者の志賀重昂は森町を訪れて「遠州森町は如何にも小京都である」と称えたと観光協会は伝える。小國神社・天宮神社という古社を抱え、秋葉街道の宿場として栄えた町の佇まいが評価されたものだ。もう一つの愛称「三木の里」は、森の字が木を3つ重ねた形という、漢字の形そのものへの着目から生まれた。名の由来が分からなくても、字の形から新しい物語が生まれる例である。
    sources:
    - h2-mori-kanko
    - h2-mori-shizuoka-yurai
  relations:
  - pref/22
  - muni/01-森町
  unknowns:
  - 「森」の村名の具体的な初出文書は未確認（町の説明は鎌倉時代中頃とするが文書名を示していない）
  - 森の名の由来（森林の姿によるか、神社の森によるか等）を特定する資料は未確認
  updated: '2026-11-13'
- id: muni/22-浜松市
  code: '221309'
  names:
    ja: 浜松市
    reading: はままつし
    aliases:
    - 浜津
    - 引間
    - 曳馬
    - 浜松町
  user_terms:
  - 浜松市の名前の由来
  - 浜松はなぜ浜松というのか
  - 曳馬と浜松の関係
  - 浜松城の名前の由来
  naming_type: 一部の地名
  prefecture: 静岡県
  homonyms: []
  summary: 市名は古代の郷名「浜松（はまつ）」を受け継いだものである。古くは「浜津」と書かれ、市の中心域は中世には引間（引馬）と呼ばれていたが、元亀元年（1570）に徳川家康が引間城を浜松城と改めてから、城下町の名として浜松が定着した。明治44年（1911）に市制を施行して浜松市となった。
  first_attestation:
    era: 奈良時代
    year_western: null
    document: 伊場遺跡出土木簡・『和名類聚抄』高山寺本
    note: 地名の古形「浜津（はまつ）」としての初出。現在の表記「浜松」は『和名類聚抄』の室町時代の写本に見える
  claims:
  - text: 浜松は古代の遠江国敷智郡の郷名で、『和名類聚抄』高山寺本には「浜津（はまつ）」とされ、奈良時代の伊場遺跡出土木簡にも同じ表記が見えると浜松市の概要は説明する
    kind: fact
    level: E2
    status: established
    sources:
    - k3-hamamatsu-gaiyo
  - text: 『和名類聚抄』の平安時代後期の写本には「浜津」とあるが、室町時代の写本では「浜松」と表記され「波万万都（はまつ）」の読み仮名が添えられており、表記は中世のうちに浜津から浜松へ移った
    kind: fact
    level: E2
    status: established
    sources:
    - k3-hamamatsu-fuchi
  - text: 中世の市の中心域は引間（引馬とも表記）と呼ばれ、『吾妻鏡』建長4年（1252）に東海道の引間宿の名が見えるなど、引間は当地随一の経済拠点として発展した
    kind: fact
    level: E2
    status: established
    sources:
    - k3-hamamatsu-gaiyo
  - text: 元亀元年（1570年）、徳川家康が引間城を改修して浜松城と改め、近世には城下町の名称として浜松が定着した
    kind: fact
    level: E2
    status: established
    sources:
    - k3-hamamatsu-gaiyo
  - text: 読みが「はまつ」のまま「浜津」から「浜松」へ字が置き換わった理由は、確認できた市の公式資料では説明されておらず、確定していない
    kind: fact
    level: E2
    status: indeterminate
    sources:
    - k3-hamamatsu-fuchi
    - k3-hamamatsu-gaiyo
  - text: 明治22年（1889）に浜松町が誕生し、明治44年（1911）7月1日の市制施行により、静岡県では静岡市に次いで2番目の市となる浜松市が誕生した
    kind: fact
    level: E2
    status: established
    sources:
    - k3-hamamatsu-gaiyo
  - text: 平成17年（2005）に浜松市・浜北市・天竜市など12市町村が合併して現在の浜松市となり、平成19年（2007）に政令指定都市へ移行した
    kind: fact
    level: E2
    status: established
    sources:
    - k3-hamamatsu-gaiyo
  - text: 総務省の全国地方公共団体コードで、浜松市の団体コードは221309と定められている
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 読みはそのまま、字だけが変わった
    text: 奈良時代の伊場遺跡の木簡に残るこの地の名は「浜津」でした。読みは今と同じ「はまつ」です。ところが室町時代の『和名類聚抄』の写本では、読み仮名「波万万都（はまつ）」を添えながら、字の方はもう「浜松」に置き換わっています。なぜ「津」が「松」になったのか、市の資料は教えてくれません。一方、中世のまちの中心は引間と呼ばれ、浜松はその周辺を指す地名でした。1570年に家康が引間城を浜松城と改めると、周辺地名だったはずの浜松が城と城下町全体の名前に昇格します。読みは奈良時代から不変、主役の地名は中世と近世で入れ替わった、というのが浜松の名前の歩みです。
    sources:
    - k3-hamamatsu-fuchi
    - k3-hamamatsu-gaiyo
  relations:
  - pref/22
  unknowns:
  - 「浜津」から「浜松」へ表記が変わった理由と正確な時期は、市の公式資料では確定していない
  - 「浜津」の「津」が浜名湖の港を指すのかなど、語源そのものの検証は専門の地名辞典まで確認できていない
  - 引間（ひくま）の語源については本バッチでは確認できていない
  updated: '2026-11-13'
- id: muni/22-清水町
  code: '223417'
  names:
    ja: 清水町
    reading: しみずちょう
    aliases:
    - 清水村
  user_terms:
  - 清水町 静岡
  - 柿田川の清水町
  - 駿東郡の清水町
  - 湧水の町 清水
  naming_type: その他（湧水にちなむ新規命名）
  prefecture: 静岡県
  homonyms:
  - muni/01-清水町
  summary: 静岡県駿東郡の町。明治22年（1889）に12か村と徳倉村が合併して清水村となり、昭和38年（1963）に町制施行した。合併前の構成村に「清水」はなく、町名は日本歴史地名大系が「町名の由来ともなった湧水」と記す柿田川の清らかな湧水にちなむ新規命名である。
  first_attestation:
    era: 明治22年
    year_western: 1889
    document: 町村制施行による清水村の成立
    note: 合併前の構成村に「清水」の名はなく、湧水にちなむ新名として付けられた
  claims:
  - text: 日本歴史地名大系は、狩野川（古くは泉川とも呼ばれた）に注ぐ湧水の川・柿田川を「町名の由来ともなった湧水」と記す
    kind: fact
    level: E3
    status: established
    sources:
    - h2-kotobank-shimizu
  - text: 明治22年（1889）に12か村と徳倉村が合併して清水村となり、昭和38年（1963）に町制を施行して清水町となった
    kind: fact
    level: E2
    status: established
    sources:
    - h2-shimizu-shizuoka-plan
  - text: 柿田川は富士山に降った雨や雪が伏流水となって湧き出す川で、湧水量は日量約100万トンとされ、環境省の名水百選に選ばれている
    kind: fact
    level: E2
    status: established
    sources:
    - h2-kakita-meisui
  - text: 同名の比較（共通する層と異なる層）：「清水（清らかな水）」に由来する点は北海道清水町と共通するが、こちらは土地の湧水をそのまま名にした和名であり、アイヌ語（ペケレベツ）の意訳である北海道清水町とは出発点が異なる
    kind: fact
    level: E3
    status: established
    sources:
    - h2-kotobank-shimizu
    - h2-shimizu-hok-history
  - text: 同じ静岡県内には旧清水市（現在の静岡市清水区）という別の大きな「清水」があり、県内でも同名の地名が重なっている
    kind: fact
    level: E3
    status: established
    sources:
    - h2-kotobank-shimizu
  - text: 同名の比較（共通する層）：読みは北海道清水町と同じ「しみずちょう」である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 名は看板に偽りなし——県内最小の町と日本有数の湧水
    text: 清水町の面積は静岡県の市町村で最も小さい部類だが、その小さな町域に、1日約100万トンもの水が湧く柿田川が流れる。「清らかな水」という名は、誇張でも願望でもなく、町の真ん中を流れる川そのものの描写だった。1889年、合併した村々がどの村の名でもない中立の新名として「清水」を選んだのは、水の恵みこそが共通の財産だったからだろう。
    sources:
    - h2-kakita-meisui
    - h2-shimizu-shizuoka-plan
  relations:
  - pref/22
  - muni/01-清水町
  unknowns:
  - 1889年の合併時に「清水」の名を選んだ経緯を示す議事記録等は未確認
  - 柿田川が「町名の由来ともなった湧水」とする以上の、命名者や選定過程は未確認
  updated: '2026-11-13'
- id: muni/22-熱海市
  code: '222054'
  names:
    ja: 熱海市
    reading: あたみし
    aliases:
    - 阿多美
    - 安多美
    - 直美
    - 熱海町
  user_terms:
  - 熱海の名前の由来
  - 熱海はなぜ熱海と書くのか
  - あつうみが崎とは
  - 熱海温泉の始まり
  naming_type: 一部の地名
  prefecture: 静岡県
  homonyms: []
  summary: 市名は古くからの地名「あたみ」を受け継いだもので、古くは直美・阿多美・安多美などの当て字が使われ、「熱海」の表記が確認できる最古の資料は永仁5年（1297）の文書とされる。語源は明らかではなく、海中の温泉で海水が熱くなったという「あつうみ」説は市公式が伝える説明である。昭和12年（1937）に熱海町と多賀村が合併して熱海市が発足した。
  first_attestation:
    era: 永仁5年
    year_western: 1297
    document: 北条貞時の走湯山宛文書
    note: 「熱海」の表記が確認できる最古の資料と『熱海温泉誌』が紹介するもの。地名「あたみ」自体は『和名類聚抄』の「直美郷」や『吾妻鏡』建保元年（1213）の「阿多美郷」など、より古い当て字で現れる
  claims:
  - text: 10世紀の辞書『和名類聚抄』には「直美郷」とあり、古くは直美・阿多美・安多美などの漢字が「あたみ」に用いられたと熱海ロマン紀行は紹介する
    kind: fact
    level: E4
    status: established
    sources:
    - k3-atami-roman
  - text: 『曾我物語』には建久4年（1193）の「伊豆安多美湯」が見え、『吾妻鏡』には建保元年（1213）に北条泰時が「伊豆国阿多美郷」の地頭職を走湯権現に寄進したとあると熱海ロマン紀行は紹介する
    kind: fact
    level: E4
    status: established
    sources:
    - k3-atami-roman
  - text: 「熱海」の表記が確認できる最古の資料は永仁5年（1297）のもので、鎌倉幕府の執権・北条貞時が走湯山に宛てた文書に「熱海郷」と記されていると『熱海温泉誌』に基づき熱海ロマン紀行は紹介する
    kind: fact
    level: E4
    status: established
    sources:
    - k3-atami-roman
  - text: 熱海市公式は、海中から温泉が沸き上がって海水がことごとく熱湯のようになったため「あつうみが崎」と呼ばれ、それが変じて「あたみ」になったと言われていると説明するが、「あたみ」の語源は明らかではないと熱海ロマン紀行は述べており、語源は確定していない
    kind: fact
    level: E2
    status: contested
    sources:
    - k3-atami-city-yurai
    - k3-atami-roman
  - text: 奈良時代、箱根の万巻上人が、海中に沸く熱湯で魚が死ぬのを哀れんだ漁民の訴えを聞き、祈願によって泉脈を海中から山里へ移したと伝えられ、その源泉が現在の大湯、その社が湯前神社（湯前権現）とされる
    kind: legend
    level: E2
    status: established
    sources:
    - k3-atami-city-yurai
  - text: 明治22年（1889）に熱海村が発足して明治24年（1891）に熱海町となり、昭和12年（1937）4月10日に多賀村と合併して熱海市が発足した
    kind: fact
    level: E5
    status: established
    sources:
    - k3-atami-wikipedia
  - text: 総務省の全国地方公共団体コードで、熱海市の団体コードは222054と定められている
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 三つの当て字を経て「熱海」へ
    text: 「あたみ」という音は古くからありましたが、漢字はずっと定まっていませんでした。『和名類聚抄』では「直美」、鎌倉時代の記録では「阿多美」「安多美」と書かれ、いずれも音を借りた当て字です。いまの「熱海」の字が文書に現れるのは1297年のことで、温泉のまちにふさわしい「熱い海」という意味の字が、ようやく音に追いついた形です。市の公式説明にある「あつうみが崎」の話は、この当て字の成立を後から説明したものとも読めます。音が先、意味のある字は後、という順序は日本の地名では珍しくありませんが、熱海はその過程が文書でたどれる例です。
    sources:
    - k3-atami-roman
    - k3-atami-city-yurai
  relations:
  - pref/22
  unknowns:
  - 「あたみ」の語源は、確認できた資料のいずれでも明らかではないとされており、確定していない
  - 阿多美郷の正確な範囲（現在の市域との対応）は本バッチでは確認できていない
  - 万巻上人の開湯伝説に対応する奈良時代の記録は確認できていない
  updated: '2026-11-13'
- id: muni/22-静岡市
  code: '221007'
  names:
    ja: 静岡市
    reading: しずおかし
    aliases:
    - 静岡
    - 駿府
    - 府中
  user_terms:
  - 静岡市の名前の由来
  - 静岡市はなぜ静岡というのか
  - 駿府から静岡への改名
  - 静岡市と清水市の合併
  naming_type: 合併新設
  prefecture: 静岡県
  homonyms: []
  summary: 現在の静岡市は、平成15年（2003）に旧静岡市と清水市の新設合併で発足した自治体だが、市名自体は明治2年（1869）に生まれた「静岡」の継承である。もとの「府中（駿府）」は各地にある紛らわしい名だとして政府から改名を求められ、藩内から上申した「静」「静城」「静岡」の3案の中から「静岡」が選ばれた。
  first_attestation:
    era: 明治2年
    year_western: 1869
    document: 静岡藩への改称（藩知事任命時）
    note: 命名そのものの初出。明治2年6月の徳川家達の藩知事任命の際に「静岡」が初めて使用されたと県公式は説明する（県レコードと同一の記録）
  claims:
  - text: 駿府は「駿河府中」の略であり、律令期以来の国府所在地を指す、特定の土地固有ではない普通名詞的な名称だった
    kind: fact
    level: E2
    status: established
    sources:
    - c-shizuoka-ken
  - text: 明治2年（1869）、新政府は「府中」という名称は紛らわしいとして、駿府藩（府中藩）に対して地名の変更を求めた
    kind: fact
    level: E2
    status: established
    sources:
    - c-shizuoka-ken
    - c-shizuoka-lib
  - text: 藩内で検討して「静」「静城」「静岡」の3案を考案して政府に報告し、そのうち「静岡」が採用されて、同年6月の藩知事任命の際に初めて使用された
    kind: fact
    level: E2
    status: established
    sources:
    - c-shizuoka-ken
    - c-shizuoka-lib
  - text: 「シズオカ」の「シズ」は、駿府の北西にある賤機山（しずはたやま）に由来すると言われているが、同時代の命名記録で直接確認されたものではない
    kind: fact
    level: E2
    status: contested
    sources:
    - c-shizuoka-ken
  - text: いったん「賤ヶ丘」と決まった名を、藩校頭取の向山黄村が「賤」の字を嫌って「静」に改めるよう進言したとする逸話が伝わるが、その史料的裏付けは確認されていない
    kind: legend
    level: E4
    status: contested
    sources:
    - c-shizuoka-weblio
  - text: 明治22年（1889）に市制を施行して静岡市が発足し、周辺の町村を編入しながら市域を広げてきた
    kind: fact
    level: E2
    status: established
    sources:
    - c-cap-shizuoka-city
  - text: 平成15年（2003）4月1日、旧静岡市と清水市が合併して新しい静岡市が発足した
    kind: fact
    level: E2
    status: established
    sources:
    - c-cap-shizuoka-city
  - text: 平成17年（2005）4月1日、静岡市は政令指定都市に移行した
    kind: fact
    level: E4
    status: established
    sources:
    - c-cap-shizuoka-uub
  - text: 総務省の全国地方公共団体コードで、静岡市の団体コードは221007と定められている
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 城下町と港町、二つの中心が一つの市に
    text: 静岡市には、生まれの違う二つの中心があります。一つは駿府城の城下町だった旧静岡市。もう一つは、明治32年（1899）に開港場となった清水港を擁する旧清水市です。2003年、この二つが合併して新しい静岡市が生まれ、2005年には政令指定都市になりました。市名に残ったのは城下町側の「静岡」で、清水の名は区名（清水区）と港の名に残っています。1869年に「府中」から改名して生まれた若い地名が、130年余りを経て、港町まで含む大きな市の名前になったのです。
    sources:
    - c-cap-shizuoka-city
    - c-cap-shizuoka-uub
  relations:
  - pref/22
  unknowns:
  - 「シズ＝賤機山」説を裏付ける同時代の命名経緯記録は確認できていない（県レコードと同一の未確認事項）
  - 向山黄村の進言説については、向山自身の史料や伝記・墓誌にも言及がないと指摘されており、裏付けは未確認
  - 政令指定都市への移行（2005）の経緯について、市公式の沿革ページでの直接確認は未了
  updated: '2026-11-13'
- id: muni/23-一宮市
  code: '232033'
  names:
    ja: 一宮市
    reading: いちのみやし
    aliases:
    - 一宮町
  user_terms:
  - 一宮市の名前の由来
  - 一宮とは何か
  - 真清田神社と一宮市の関係
  naming_type: 一部の地名
  prefecture: 愛知県
  homonyms: []
  summary: 市名は、真清田神社が尾張国の一宮（いちのみや＝その国で最も格式の高い神社）とされたことに由来する。その門前町であるこの地域が「いちのみや」と呼ばれるようになり、明治22年（1889）に一宮町、大正10年（1921）に一宮市となった。国名・郡名・川の名ではなく、神社の格を示す普通名詞がそのまま市名になった例である。
  first_attestation:
    era: 平安時代
    year_western: null
    document: 真清田神社を尾張国一宮とする社格の成立と門前町の呼称
    note: 「いちのみや」の呼称は、真清田神社が尾張国の「一の宮」であったことからその門前町を指して広まったもので、単一の文書を初出として特定することはできない（市の沿革の説明による）
  claims:
  - text: 平安時代、真清田神社が尾張の国の一の宮であったことから、その門前町であるこの地域がいつしか「いちのみや」と呼ばれるようになったと一宮市は説明する
    kind: fact
    level: E2
    status: established
    sources:
    - k3-ichinomiya-toshi
  - text: 江戸時代には真清田神社の門前で産物や綿織物の売買のため三八市が開かれ、この地方における流通と商品生産の中心地となって中心市街地が形成された
    kind: fact
    level: E2
    status: established
    sources:
    - k3-ichinomiya-toshi
  - text: 明治22年（1889）に一宮村と一色村が合併して一宮町となり、大正10年（1921）9月に市制を施行して、人口30,558人の一宮市が誕生した
    kind: fact
    level: E2
    status: established
    sources:
    - k3-ichinomiya-toshi
  - text: 市名は国名・郡名・河川名ではなく、神社の社格である「一宮」という普通名詞的な呼称をそのまま自治体名としたものである
    kind: fact
    level: E2
    status: established
    sources:
    - k3-ichinomiya-toshi
  - text: 平成17年（2005）に尾西市・葉栗郡木曽川町と合併し、令和3年（2021）4月1日に愛知県尾張地方で初の中核市となった
    kind: fact
    level: E2
    status: established
    sources:
    - k3-ichinomiya-toshi
  - text: 総務省の全国地方公共団体コードで、一宮市の団体コードは232033と定められている
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 「一宮」は固有名詞ではなく「格」の名前
    text: 律令制の国ごとに、神社は一宮・二宮・三宮と格付けされていました。「一宮」とは「その国で一番の神社」という地位の名前であって、特定の場所の名前ではありません。尾張国の一宮は真清田神社で、その門前町が地位の名で呼ばれるようになり、やがて町名・市名にまでなりました。同じ仕組みで生まれた自治体名は各地にあり、千葉県には長生郡一宮町があります（上総国の一宮の門前町です）。地位が地名に化けた、珍しいタイプの市名です。
    sources:
    - k3-ichinomiya-toshi
  relations:
  - pref/23
  - muni/12-一宮町
  unknowns:
  - 「いちのみや」の呼称が門前町を指して使われた最も古い用例は、本バッチでは特定できていない
  - 真清田神社が尾張国一宮とされた正確な時期については本バッチでは確認できていない
  - 千葉県一宮町との由来の対比（一宮という呼称の共通性と地域事情の違い）の本格的な横断チェックは未了
  updated: '2026-11-13'
- id: muni/23-名古屋市
  code: '231002'
  names:
    ja: 名古屋市
    reading: なごやし
    aliases:
    - 名古屋
    - 那古野
    - 名護屋
    - 浪越
  user_terms:
  - 名古屋市の名前の由来
  - 名古屋はなぜ名古屋というのか
  - 那古野となごやの関係
  - 名古屋の語源の諸説
  naming_type: 一部の地名
  prefecture: 愛知県
  homonyms: []
  summary: 市名は尾張の中心地「名古屋（なごや）」の名を受け継いだもので、その古い表記「那古野」は平安時代末期の荘園名「那古野荘」として現れる。「なごや」の語源は諸説あって確定していない。近世初めに名古屋城の城下町が開かれてから「名古屋」の表記が定着し、明治22年（1889）に市制が施行された。
  first_attestation:
    era: 平安時代末期
    year_western: null
    document: 旧広橋家本『江家次第』裏書（尾張国那古野庄領家職相伝系図）
    note: 荘園名「那古野荘」としての初見。具体的な年代は特定できないため西暦年は null とした（『日本歴史地名大系』の説明を愛知県図書館のレファレンス回答が紹介）
  claims:
  - text: 『日本歴史地名大系』は、平安時代末期の荘園名「那古野荘」が史料上の初見であり、旧広橋家本『江家次第』裏書の那古野庄領家職相伝系図に現れるとする
    kind: fact
    level: E2
    status: established
    sources:
    - c-cap-nagoya-ndl
  - text: 中世には那古野のほか名護屋・浪越などとも記され、読みは「なごや」であったとされる
    kind: fact
    level: E2
    status: established
    sources:
    - c-cap-nagoya-ndl
  - text: 「なごや」の語源については、気候・風土がなごやかな地とする説、ナゴ（霧）の多い原野とする説、海辺の漁村（魚子屋）とする説など諸説があり、確定していない
    kind: fact
    level: E2
    status: contested
    sources:
    - c-cap-nagoya-ndl
  - text: 慶長15年（1610）、徳川家康が那古野台地に名古屋城の築城工事を始め、清洲の士民が移り住む「清洲越し」によって城下町ができあがった
    kind: fact
    level: E2
    status: established
    sources:
    - c-cap-nagoya-city
  - text: 近世の初め、名古屋城下が開かれた頃から「名古屋」と「名護屋」が併用されたが、しだいに「名古屋」に定まったと『日本歴史地名大系』は説明する
    kind: fact
    level: E2
    status: established
    sources:
    - c-cap-nagoya-ndl
  - text: 廃藩置県で名古屋県が置かれ、翌・明治5年（1872）に愛知県と改称された。市名は県名（郡名由来）ではなく、城下町以来の地名「名古屋」をそのまま受け継いだものである
    kind: fact
    level: E2
    status: established
    sources:
    - c-cap-nagoya-city
    - c-cap-nagoya-ndl
  - text: 明治22年（1889）10月1日に市制が施行されて名古屋市が誕生し、名古屋市はこの日を市制施行日としている
    kind: fact
    level: E2
    status: established
    sources:
    - c-cap-nagoya-promo
  - text: 総務省の全国地方公共団体コードで、名古屋市の団体コードは231002と定められている
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 「なごの」と「なごや」の分かれ道
    text: いま名古屋市内には「那古野」という町名があり、「なごの」と読みます。ところが愛知県図書館の調査では、明治22年（1889）に成立した愛知郡那古野村は、県令の別表で「なごや」と読んだことが確認でき、「なごの」という読みがいつ始まったのかを示す史料は見つかっていないといいます。つまり中世以来「なごや」だったはずの那古野は、明治のどこかで「なごの」へ読みがずれ、その一方で「名古屋（なごや）」の表記と読みが市の名前として固定されました。同じ出発点から、読みと表記が別々の道を歩んだ例です。
    sources:
    - c-cap-nagoya-ndl
  relations:
  - pref/23
  unknowns:
  - 「なごや」の語源は諸説のいずれとも決められていない
  - 「那古野」を「なごの」と読むようになった時期を示す史料は、愛知県図書館の調査でも発見されていない
  - 那古野荘の正確な範囲（現在の市域のどの部分か）の比定は、『新修名古屋市史』の推定の域を出ない
  - 名古屋城下開府の際に「名古屋」の字を選んだ主体と経緯を示す同時代記録は未確認
  updated: '2026-11-13'
- id: muni/23-岡崎市
  code: '232025'
  names:
    ja: 岡崎市
    reading: おかざきし
    aliases:
    - 菅生郷
    - 岡崎町
  user_terms:
  - 岡崎市の名前の由来
  - 岡崎という地名の意味
  - 岡崎城と地名の関係
  naming_type: 一部の地名
  prefecture: 愛知県
  homonyms: []
  summary: 市名は中世末に定着した地名「岡崎」を受け継いだもので、市の資料は「丘の先」という意味があるといわれていると説明する。当初「岡崎」と呼ばれたのは乙川南岸の明大寺付近で、享禄年間（1530〜31）に松平清康が現在地へ城を移してから、広い範囲が岡崎と呼ばれるようになった。大正5年（1916）に市制を施行した。
  first_attestation:
    era: 室町時代（15世紀半ば）
    year_western: null
    document: 岡崎市公式資料（岡崎市の歴史的風致形成の背景）
    note: 15世紀半ばに岡崎城が築かれた当時、乙川南岸の明大寺付近が岡崎と呼ばれていたと市の資料は説明する。江戸時代末期の『三河国名所図会』は「岡崎は享禄以来の名號にして其以前は菅生郷なり」と記す
  claims:
  - text: 「岡崎」には、丘の先という意味があるといわれていると岡崎市の資料は説明する
    kind: fact
    level: E2
    status: established
    sources:
    - k3-okazaki-fuchi
  - text: 15世紀半ばに岡崎城が築かれた当時、岡崎と呼ばれていたのは現在の菅生川（乙川）南岸の明大寺付近であった
    kind: fact
    level: E2
    status: established
    sources:
    - k3-okazaki-fuchi
  - text: 享禄3年（1530）から4年（1531）に松平清康が現在の場所に居城を移してから、広い範囲が岡崎と呼ばれるようになった
    kind: fact
    level: E2
    status: established
    sources:
    - k3-okazaki-fuchi
  - text: 江戸時代末期の『三河国名所図会』は「岡崎は享禄（1528〜1531）以来の名號にして、其以前は菅生郷なり」と記しており、この時期に岡崎という地名が定着していったと考えられている
    kind: fact
    level: E2
    status: established
    sources:
    - k3-okazaki-fuchi
  - text: 享徳元年（1452）に西郷稠頼が築城し、大永4年（1524）に松平清康が入城した頃に岡崎は飛躍的に発展し、徳川家康はこの岡崎城で生まれた
    kind: fact
    level: E2
    status: established
    sources:
    - k3-okazaki-gikai
  - text: 大正5年（1916）7月1日に市制を施行して岡崎市が誕生した
    kind: fact
    level: E2
    status: established
    sources:
    - k3-okazaki-gikai
  - text: 総務省の全国地方公共団体コードで、岡崎市の団体コードは232025と定められている
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 「岡崎」の原点は川の南岸にあった
    text: いま岡崎城が立つのは乙川の北岸ですが、「岡崎」という名前の原点は川の向こう側、南岸の明大寺付近でした。15世紀半ばに最初の城が築かれた頃、岡崎と呼ばれていたのは南岸の一帯で、その前は菅生郷の一部でした。1530年頃に松平清康が北岸の現在地へ城を移すと、「岡崎」の指す範囲は城とともに川を越えて広がっていきます。地名が場所を固定するのではなく、権力の中心について移動する。岡崎はその様子が市の資料ではっきりたどれる例です。
    sources:
    - k3-okazaki-fuchi
  relations:
  - pref/23
  unknowns:
  - 「岡崎」の文書上の確実な初出（中世文書の用例）は本バッチでは特定できていない
  - 「丘の先」という語源説明の言語学的な検証水準は、専門の地名辞典まで確認できていない
  - 明大寺付近が「岡崎」と呼ばれ始めた正確な時期は資料からは絞り込めていない
  updated: '2026-11-13'
- id: muni/23-美浜町
  code: '234460'
  names:
    ja: 美浜町
    reading: みはまちょう
    aliases:
    - 河和町
    - 野間町
  user_terms:
  - 愛知の美浜町の由来
  - 知多半島の美浜町はなぜ美浜か
  - 河和と野間が合併した町
  naming_type: 合併新設
  prefecture: 愛知県
  homonyms:
  - muni/18-美浜町
  - muni/30-美浜町
  summary: 知多半島南部の町で、昭和30年（1955）に河和町と野間町が合併して発足し、1957年に上野間地区が加わった。町名は『角川日本地名大辞典』が「海に面して美しい砂浜が見えることに由来する」瑞祥地名と紹介する。同名の福井県・和歌山県の美浜町とは同時期の合併新設町という共通点を持つが、町同士の合併だった点と二段階で町域が固まった点が異なる。
  first_attestation:
    era: 昭和30年
    year_western: 1955
    document: 美浜町の発足（河和町・野間町の合併）
    note: 町名は合併時に新たに付けられたもので、名前の初出は命名そのもの
  claims:
  - text: 昭和30年（1955）4月、河和・野間の両町が合併し、美浜町として発足した
    kind: fact
    level: E2
    status: established
    sources:
    - h5-aichi-mihama-gaiyo
  - text: 昭和32年（1957）3月に小鈴谷町の上野間地区が合併し、現在の美浜町域となった
    kind: fact
    level: E2
    status: established
    sources:
    - h5-aichi-mihama-gaiyo
  - text: 明治初期に15の村に分かれていた町域は、幾度かの合併を経て河和町と野間町になっていた
    kind: fact
    level: E2
    status: established
    sources:
    - h5-aichi-mihama-soukei
  - text: 『角川日本地名大辞典』愛知県は、町名の由来について、海に面しており美しい砂浜が見えることに由来する（瑞祥地名）と紹介している
    kind: fact
    level: E3
    status: established
    sources:
    - h5-aichi-mihama-wiki
  - text: 町域は伊勢湾と三河湾に囲まれた知多半島南部にあり、東西の両側が海に面する
    kind: fact
    level: E2
    status: established
    sources:
    - h5-aichi-mihama-soukei
  - text: 共通する層として、同名の福井県美浜町・和歌山県美浜町も1954年の合併で生まれた新設町であり、3町はいずれも「美しい浜」にちなむ命名と説明される、昭和の大合併期の同名町である
    kind: fact
    level: E2
    status: established
    sources:
    - h5-fukui-mihama-70th
    - h2-hidaka-wakayama-manabi
  - text: 異なる層として、愛知の美浜は合併の相手が村ではなく町同士（河和町・野間町）であり、発足の2年後に上野間地区が加わる二段階の成立だった点が、単一の合併で発足した福井・和歌山の美浜町と異なる
    kind: fact
    level: E2
    status: established
    sources:
    - h5-aichi-mihama-gaiyo
  - text: 総務省の全国地方公共団体コードで、美浜町の団体コードは234460と定められている
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 半島の両側が海、「美しい浜」は二つある
    text: 愛知の美浜町は、知多半島の南端近くで伊勢湾と三河湾の両方に面しています。西の伊勢湾側には野間の海岸、東の知多湾（三河湾）側には河和の港と砂浜があり、「海に面して美しい砂浜が見える」という辞典の説明は、半島のどちらの側から見ても成り立ちます。1955年に河和町と野間町という、別々の海に開いた二つの町が一つになったからこそ、半島全体を指す「美しい浜」という大きな名前が選ばれたとも読めます。
    sources:
    - h5-aichi-mihama-soukei
    - h5-aichi-mihama-wiki
  relations:
  - pref/23
  - muni/18-美浜町
  - muni/30-美浜町
  unknowns:
  - 命名が公募だったか、命名者や候補名など1955年当時の選定過程を示す町の公式記録は未確認
  - 『角川日本地名大辞典』愛知県の該当記述の原文（直接確認）は未了で、ここではそれを引用する二次資料経由の確認にとどまる
  updated: '2026-11-13'
- id: muni/23-豊橋市
  code: '232017'
  names:
    ja: 豊橋市
    reading: とよはしし
    aliases:
    - 吉田
    - 今橋
    - 豊橋町
  user_terms:
  - 豊橋市の名前の由来
  - 吉田から豊橋への改名
  - 豊橋藩の名前の理由
  naming_type: その他（同名の藩を避けるため政府に命じられた改称で選ばれた名の継承）
  prefecture: 愛知県
  homonyms: []
  summary: 市名は明治2年（1869）に生まれた藩名「豊橋」の継承である。江戸時代のこの地は吉田と呼ばれたが、伊予国にも吉田藩があったため政府に改名を命じられ、藩が提出した「今橋」「関屋」「豊橋」の3案から、豊川に架かる橋の名である「豊橋」が選ばれた。明治39年（1906）に市制を施行して豊橋市となった。
  first_attestation:
    era: 明治2年
    year_western: 1869
    document: 藩名改称の決定（明治2年6月19日）
    note: 「豊橋」の公称としての初出は藩名としての命名。橋の名としての豊橋は、豊川に架かる橋を指してそれ以前からあった
  claims:
  - text: 江戸時代のこの地域は吉田と呼ばれ、東海道の宿場町であり、松平伊豆守家7万石の吉田城の城下町として栄えた
    kind: fact
    level: E2
    status: established
    sources:
    - k3-toyohashi-plan
  - text: 吉田城はもと今橋城と呼ばれ、明応6年（1497）頃に牧野古白が築いて、後に吉田城と改称された
    kind: fact
    level: E2
    status: established
    sources:
    - k3-toyohashi-plan
  - text: 明治2年（1869）、伊予国（愛媛県）に同名の吉田藩があったため、明治政府は三河の吉田藩に改名を命じた
    kind: fact
    level: E2
    status: established
    sources:
    - k3-toyohashi-faq
  - text: 藩は「今橋」「関屋」「豊橋」の試案を申し出て、同年6月19日に「豊橋」と藩名を変更するよう命じられた
    kind: fact
    level: E2
    status: established
    sources:
    - k3-toyohashi-faq
  - text: 候補名の由来は、「今橋」は吉田の旧称、「関屋」は吉田城西側の地名、「豊橋」は豊川に架けられた橋であると豊橋市は説明する
    kind: fact
    level: E2
    status: established
    sources:
    - k3-toyohashi-faq
  - text: 明治22年（1889）に豊橋町となり、明治39年（1906）8月1日、愛知県で2番目（全国で62番目）の市として豊橋市が誕生した
    kind: fact
    level: E2
    status: established
    sources:
    - k3-toyohashi-plan
  - text: 総務省の全国地方公共団体コードで、豊橋市の団体コードは232017と定められている
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 改名候補に残らなかった「今橋」と「関屋」
    text: 1869年の改名では、最終候補が3つありました。「今橋」は吉田の旧称で、城の元の名前でもある由緒ある案。「関屋」は吉田城の西側の地名です。そして選ばれた「豊橋」は、豊川に架かる橋の名前でした。城の名前でも宿場の名前でもなく、川を渡る橋の名前が藩の名前になり、そのまま市の名前になった点が豊橋の面白さです。吉田の名は、いまも市内の吉田方地区や吉田神社などに残っています。
    sources:
    - k3-toyohashi-faq
    - k3-toyohashi-plan
  relations:
  - pref/23
  unknowns:
  - 橋の名としての「豊橋」がいつ頃から呼ばれていたかは、本バッチでは確認できていない
  - 「吉田」という地名自体の由来については本バッチでは確認できていない
  - 3案のうち豊橋が選ばれた理由を示す政府側の記録は確認できていない
  updated: '2026-11-13'
- id: muni/23-豊田市
  code: '232114'
  names:
    ja: 豊田市
    reading: とよたし
    aliases:
    - 挙母
    - 衣
    - 挙母市
    - 挙母町
  user_terms:
  - 豊田市の名前の由来
  - 挙母から豊田への改称理由
  - 豊田市はトヨタから名付けられたのか
  - 挙母の読み方と意味
  naming_type: その他（自動車産業の企業城下町としての改称）
  prefecture: 愛知県
  homonyms: []
  summary: 市名は昭和34年（1959）1月1日に挙母市から改称して生まれたもので、市内に本社を置くトヨタ自動車と、その創業者一族の姓「豊田」に由来するとされる。旧名「挙母（ころも）」は『和名類聚抄』の挙母郷に遡る古い地名で、1958年に商工会議所が「クルマのまちに成長したこと」と「挙母が読みにくいこと」を理由に改称を請願し、市を二分する論議を経て変更された。
  first_attestation:
    era: 昭和34年
    year_western: 1959
    document: 市名変更（挙母市から豊田市へ、1959年1月1日）
    note: 「豊田」の公称としての初出は1959年の市名変更。旧名「挙母」は平安時代の『和名類聚抄』の挙母郷に見える古い地名である
  claims:
  - text: 『古事記』には許呂母別（ころもわけ）が見え、この地には三河之衣君（ころものきみ）という豪族が住んでいたと全国観光資源台帳は紹介する
    kind: fact
    level: E3
    status: established
    sources:
    - k3-toyota-jtb
  - text: 平安時代の『和名類聚抄』には加茂郡の挙母郷が見え、鎌倉時代には高橋荘衣郷（ころものごう）があったと全国観光資源台帳は紹介する
    kind: fact
    level: E3
    status: established
    sources:
    - k3-toyota-jtb
  - text: 豊田市統計書は、城下町が整えられる中で、地名の「衣」は「挙母」に改められたと説明する
    kind: fact
    level: E2
    status: established
    sources:
    - k3-toyota-tokeisho
  - text: 昭和12年（1937）にトヨタ自動車工業株式会社の挙母工場が完成して自動車のまちへの転換が始まり、昭和26年（1951）3月1日に市制を施行して挙母市が誕生した
    kind: fact
    level: E2
    status: established
    sources:
    - k3-toyota-tokeisho
    - k3-toyota-kobunsho
  - text: 昭和33年（1958）、商工会議所から市に、挙母市が全国有数の「クルマのまち」に成長したこと、地名の「挙母」が読みにくいことなどを理由に、市名を変更したいという請願書が出された
    kind: fact
    level: E2
    status: established
    sources:
    - k3-toyota-tokeisho
  - text: 翌・昭和34年（1959）1月、自動車産業とともに発展することを誓って、市名が「豊田市」に変更された
    kind: fact
    level: E2
    status: established
    sources:
    - k3-toyota-tokeisho
    - k3-toyota-kobunsho
  - text: 新市名「豊田」は、市内に本社を置くトヨタ自動車と、同社の創業者一族の姓「豊田（とよだ）」に由来するとされる。古代以来の「挙母」に愛着を持つ市民も多く、改称の賛否で一時は市を二分するほどの論議があった
    kind: fact
    level: E5
    status: established
    sources:
    - k3-toyota-wikipedia
  - text: 総務省の全国地方公共団体コードで、豊田市の団体コードは232114と定められている
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 会社は「とよだ」、市は「とよた」
    text: 創業者一族の姓「豊田」は「とよだ」と読みますが、市名は「とよたし」と清音で読みます。会社の名をそのまま市名にしながら、読みだけが少しずれたわけです。改称に反対した人々が守ろうとした「挙母」の名も、消えてはいません。市内には挙母町・上挙母の町名が残り、上挙母駅、挙母神社、挙母小学校にもその名があります。そして市の紋章は、挙母市時代の1951年に制定されたものを、改称後もそのまま使い続けています。新しい名前の市の真ん中に、旧名の紋章が残っているのです。
    sources:
    - k3-toyota-wikipedia
    - k3-toyota-tokeisho
  relations:
  - pref/23
  unknowns:
  - 「衣（ころも）」の語源について、衣君や衣縫部との関係を示す専門の地名辞典での確認は未了
  - 改称を決めた市議会の議論の詳細（賛否の数など）は本バッチでは確認できていない
  - 『和名類聚抄』の挙母郷の表記と、豊田市統計書の「衣から挙母へ改められた」という説明の関係（郷名と城下町名で表記の層が違う可能性）の切り分けは未了
  updated: '2026-11-13'
- id: muni/24-伊勢市
  code: '242039'
  names:
    ja: 伊勢市
    reading: いせし
    aliases:
    - 宇治山田市
    - 宇治山田町
  user_terms:
  - いせ
  - 神都
  - 宇治山田
  - お伊勢参りのまち
  naming_type: その他（1955年に宇治山田市から改称した名を、2005年の新設合併でも継承した）
  prefecture: 三重県
  homonyms: []
  summary: 市名「伊勢」は、古代の国名であり伊勢神宮の名でもある。このまちはもともと内宮の鳥居前町「宇治」と外宮の鳥居前町「山田」を合わせた宇治山田町（1889年）・宇治山田市（1906年）であったが、1955年1月1日に周辺4村の合併とともに「伊勢市」へ改称した。2005年11月1日には二見町・小俣町・御薗村との新設合併で新たな伊勢市が発足し、名はそのまま継承された。つまり2005年は改称の年ではなく、改称は1955年に行われている。
  first_attestation:
    era: 昭和30年
    year_western: 1955
    document: 市名変更条例（昭和29年12月25日条例第18号）による宇治山田市から「伊勢市」への改称
    note: 市名としての「伊勢市」の初出。地名・国名としての「伊勢」は古代に遡り、『伊勢国風土記』逸文には国名の由来とする伊勢津彦の伝承が残る。2005年の合併はこの名の継承である。
  claims:
  - text: 明治22年（1889年）の町村制施行により、宇治と山田を合わせて宇治山田町が誕生した。宇治は伊勢神宮内宮の鳥居前町、山田は外宮の鳥居前町を指し、宇治山田は両町の名を合わせた合成地名である。
    kind: fact
    level: E2
    status: established
    sources:
    - k4-ise-gappei
    - k4-ise-weblio
  - text: 明治39年（1906年）9月1日、宇治山田町が市制を施行して宇治山田市となった。
    kind: fact
    level: E2
    status: established
    sources:
    - k4-ise-gappei
  - text: 昭和30年（1955年）1月1日、宇治山田市は度会郡豊浜村・北浜村・城田村・四郷村を合併するとともに、「伊勢市」に改称した。
    kind: fact
    level: E2
    status: established
    sources:
    - k4-ise-gappei
  - text: この改称は、市の条例（昭和29年12月25日条例第18号）で「本市の名称『宇治山田市』を『伊勢市』に変更する」と定められ、三重県知事の許可（昭和29年12月22日、三重県告示第1046号）を得て、昭和30年1月1日から施行された。
    kind: fact
    level: E1
    status: established
    sources:
    - k4-ise-reiki
  - text: 『伊勢国風土記』逸文には、神武天皇の勅を受けた天日別命が、この地の神・伊勢津彦と争って国を平定したという話が伝わり、国名「伊勢」の由来とする伝承となっている。
    kind: legend
    level: E3
    status: established
    sources:
    - k4-ise-fudoki
  - text: 平成17年（2005年）11月1日、伊勢市・二見町・小俣町・御薗村の4市町村の合併（新設）が実現し、新たな「伊勢市」が誕生した。2005年の出来事は改称ではなく、1955年以来の市名の継承を伴う合併である。
    kind: fact
    level: E2
    status: established
    sources:
    - k4-ise-gappei
  - text: 伊勢市の地方公共団体コードは242039である。
    kind: fact
    level: E2
    status: established
    sources:
    - k4-ise-jlis
  column:
    title: 二つの鳥居前町が「神都」の名を名乗るまで
    text: 宇治山田という市名は、内宮と外宮、二つの鳥居前町の妥協の産物だった。どちらの町の名も捨てずに並べた合成地名は、1889年から66年間使われた。しかし全国の参拝者にとってこのまちはあくまで「伊勢」であり、1955年元日、周辺の村々を合併する節目に、市は条例をもって名を「伊勢市」に改めた。半世紀後の2005年の大合併でも、議論の末に残ったのはやはり「伊勢」だった。二つの町の名の記憶は、今も宇治山田駅の駅名の中に生きている。
    sources:
    - k4-ise-gappei
    - k4-ise-reiki
  relations:
  - pref/24
  unknowns:
  - 1955年の改称の直接の動機（1953年の神宮式年遷宮との関係や知名度の考慮など）は、今回確認した市の公式資料・例規には明記されておらず、未確認である。
  - 2005年の合併で新市の名称を「伊勢市」と定めた協議の詳細は、「合併の記録」概要版からは確認できなかった。
  updated: '2026-11-13'
- id: muni/24-明和町
  code: '244422'
  names:
    ja: 明和町
    reading: めいわちょう
    aliases:
    - 神郷町
    - 三和町
    - 斎明村
  user_terms:
  - 三重の明和町の由来
  - 斎宮のある明和町
  - 神郷町という幻の町名
  naming_type: 合併新設
  prefecture: 三重県
  homonyms:
  - muni/10-明和町
  summary: 多気郡の町で、1958（昭和33）年に三和町と斎明村が合併して成立した。合併の激論の末に町名が決まらず、暫定名「神郷町」として合併を行い、合併決議後の公募で「明和」が決まって発足と同時に改称したという、異例の経緯を持つ。「明和」の字は斎明村の「明」と三和町の「和」の合成と説明される。同名の群馬県明和町も公募命名だが、そちらは理念を掲げた瑞祥地名で、字の出どころの論理が異なる。
  first_attestation:
    era: 昭和33年
    year_western: 1958
    document: 公募による新町名「明和」の決定（神郷町の発足と同時の改称）
    note: 合併自体は暫定名「神郷町」で行われ、「明和」の初出は合併決議後の公募決定による改称である
  claims:
  - text: 昭和30年（1955）に大淀町・上御糸村・下御糸村が合併して三和町に、斎宮村と明星村が合併して斎明村になった
    kind: fact
    level: E2
    status: established
    sources:
    - h5-meiwa-mie-rekimachi
  - text: 昭和33年（1958）9月、三和町と斎明村の合併は、県の仲裁を要する激論の末に町名が決まらず、仮に「神郷町」として合併を行うことで決着した
    kind: fact
    level: E2
    status: established
    sources:
    - h5-meiwa-mie-rekimachi
  - text: 合併決議の後に新町名を公募した結果「明和」と決まり、神郷町発足と同時に明和町と改称したため、神郷町は実質的に発足の瞬間だけの暫定名となった
    kind: fact
    level: E2
    status: established
    sources:
    - h5-meiwa-mie-rekimachi
  - text: 町の文化財計画は「神郷」を「斎明村と三和町が合併し、明和町になるまでの暫定町名」と定義し、「斎明」は斎宮村と明星村が合併してできた地名であると定義している
    kind: fact
    level: E2
    status: established
    sources:
    - h5-meiwa-mie-bunka
  - text: 町名「明和」は、斎明村から「明」を、三和町から「和」をとって名付けられたと説明される
    kind: fact
    level: E4
    status: established
    sources:
    - h5-meiwa-mie-weblio
  - text: 共通する層として、同名の群馬県明和町も1950年代の合併で新名を公募により決めており、「公募で生まれた明和」という点は両町に共通する
    kind: fact
    level: E2
    status: established
    sources:
    - h5-meiwa-gunma-yurai
  - text: 異なる層として、群馬の明和が「明朗にして平和なる理想郷」という理念を表す瑞祥地名として選ばれたのに対し、三重の明和は前身2町村の名の字（斎明の「明」と三和の「和」）を組み合わせた合成名であり、暫定名「神郷町」を経た経緯も三重だけのものである
    kind: fact
    level: E2
    status: established
    sources:
    - h5-meiwa-mie-rekimachi
    - h5-meiwa-gunma-yurai
  - text: 総務省の全国地方公共団体コードで、明和町の団体コードは244422と定められている
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 発足の瞬間だけ存在した町名「神郷町」
    text: 1958年の合併は、町の場所をめぐる激論の末に県の仲裁でようやくまとまりましたが、新しい町の名前だけは決まりませんでした。そこで暫定的に「神郷町」として合併を行い、名前は後から公募することにしたのです。公募で「明和」と決まると、神郷町は発足と同時に明和町へ改称されました。つまり神郷町は、書類の上でのみ一瞬存在した「幻の町名」です。伊勢神宮の斎王の宮・斎宮の地であるこの地域で、「神」の字を持つ暫定名が生まれ、すぐに消えたことも、偶然にせよ象徴的です。
    sources:
    - h5-meiwa-mie-rekimachi
    - h5-meiwa-mie-bunka
  relations:
  - pref/24
  - muni/10-明和町
  unknowns:
  - 公募の応募総数や「明和」以外の候補名の一覧は未確認
  - 暫定名「神郷」の選定理由（伊勢神宮・斎宮との関係を意図したものか）は資料に明記がなく未確認
  - 「明は斎明、和は三和」の字配分を記した町史の原文の直接確認は未了（辞書サイト経由の確認にとどまる）
  updated: '2026-11-13'
- id: muni/24-朝日町
  code: '243434'
  names:
    ja: 朝日町
    reading: あさひちょう
    aliases:
    - 朝日村
  user_terms:
  - 朝日町の名前の由来
  - 三重の朝日町は天武天皇の故事
  - 読み方が「あさひちょう」の朝日町
  - 朝日町は山形と富山と三重にある
  naming_type: その他
  prefecture: 三重県
  homonyms:
  - muni/06-朝日町
  - muni/16-朝日町
  summary: 明治22年（1889年）に朝明郡の小向・柿・埋縄・縄生の村々をもって発足した朝日村が前身で、昭和29年（1954年）10月17日に単独で町制を施行して朝日町となった。町公式は、大海人皇子（後の天武天皇）が壬申の乱の際にこの近辺で朝日を拝んだという故事にあやかって命名されたと伝える。『日本書紀』には朝明郡迹太川のほとりで天照太神を望拝した記事があるが、迹太川を現在の朝明川とする比定には異説がある。
  first_attestation:
    era: 明治22年
    year_western: 1889
    document: 朝日村の発足（町村制施行、1889年4月1日）
    note: 自治体名としての「朝日」の初出。故事そのものの記録は『日本書紀』巻第二十八（720年成立）にさかのぼるとされる
  claims:
  - text: 明治22年（1889年）4月1日、町村制の施行により、朝明郡の小向村・柿村・埋縄村・当新田の区域の一部および縄生村の区域の一部をもって朝日村が発足した
    kind: fact
    level: E2
    status: established
    sources:
    - h4-mie-asahi-wikipedia
  - text: 町公式の「朝日町のあらまし」は、大海人皇子（後の天武天皇）が壬申の乱（672年）でこの近辺を通過した際に朝日を拝んだと言われており、この故事にあやかり明治22年（1889年）に「朝日村」が誕生し、昭和29年に町制施行で「朝日町」となったと伝える
    kind: legend
    level: E2
    status: established
    sources:
    - h4-mie-asahi-aramashi
  - text: 『朝日町史』（1974年）に基づく命名経緯の紹介によれば、村名について朝明郡長は「山添村」としたが、村側が申請した「朝明村」は郡と同名であるとして退けられ、舘通因に相談したところ天武天皇が縄生・小向の辺りで朝日を拝まれたという故事があると聞き、これに因んで「朝日村」として申請し、許可されるに至ったとされる
    kind: fact
    level: E2
    status: established
    sources:
    - h4-mie-asahi-wikipedia
  - text: 『日本書紀』巻第二十八には、大海人皇子が「朝明郡迹太川の辺（ほとり）で天照太神を望拝した」という趣旨の記事があり、故事には古典籍の裏付けがある。ただし故事の舞台を現在の朝日町内とするのは迹太川を現在の朝明川に比定する前提に立ち、この比定には異説があって確定していない
    kind: fact
    level: E2
    status: contested
    sources:
    - h4-mie-asahi-wikipedia
  - text: 昭和29年（1954年）10月17日、朝日村は合併せず単独で町制を施行して朝日町となった。町村合併促進法のもとで同村は合併の対象だったが、産業面のほか交通・文化に恵まれていたことから単独町制を選んだと町の広報は説明する
    kind: fact
    level: E2
    status: established
    sources:
    - h4-mie-asahi-koho
  - text: 【異なる層】3つの朝日町のうち三重の例だけが「朝日（太陽）」を直接の由来とし、山の名から取って公式に明示する富山県朝日町とも、大朝日岳の麓にありながら命名理由の明示がない山形県朝日町とも、命名の型が異なる
    kind: fact
    level: E2
    status: established
    sources:
    - h4-toyama-asahi-gaiyo
    - h4-yamagata-asahi-gikai
  column:
    title: 却下された2つの名前
    text: 「朝日村」の前には2つの落選案があった。郡長が推した「山添村」、村が申請した「朝明村」は郡と同じ名で却下。困って地元の碩学・舘通因に相談すると、『日本書紀』にある天武天皇の故事を教えてくれた。こうして生まれた「朝日村」は、以来130年以上、一度も合併せずに「朝日町」として続いている。
    sources:
    - h4-mie-asahi-wikipedia
  relations:
  - pref/24
  - muni/06-朝日町
  - muni/16-朝日町
  unknowns:
  - 迹太川の比定について、現在の朝明川とする説への異説の具体的内容は、久志本鉄也「壬申紀『迹太川』小考」（2013年）などの原典確認が必要
  - 『朝日町史』（1974年）原文での命名経緯の直接確認は未実施（Wikipediaが同書を引く紹介によって記録した）
  updated: '2026-11-13'
- id: muni/24-津市
  code: '242012'
  names:
    ja: 津市
    reading: つし
    aliases:
    - 安濃津
    - 津町
  user_terms:
  - 県庁所在地の津
  - 藤堂高虎の城下町
  - 日本三津の港町
  naming_type: 一部の地名
  prefecture: 三重県
  homonyms: []
  summary: 市名は「港」を意味する「津」に由来する。古代・中世の港「安濃津」の名が短縮され、江戸時代には藤堂家の城下町「津」として定着し、1889年の市制施行でそのまま市名となった。2006年の10市町村合併でも「津市」の名は継承された。
  first_attestation:
    era: 嘉保3年
    year_western: 1096
    document: 『中右記』嘉保3年12月9日条（裏書）
    note: 「安乃津」と表記され、地震・津波の被害記事として安濃津が文書に現れる早い確認例（『日本歴史地名大系』の整理による二次確認）。「津」単独の呼称は中世後期以降に現れる。
  claims:
  - text: 「津」は本来「港」を意味する言葉であり、津市議会の資料は、市の名が海上交通・交易の拠点を表す港に由来すると説明する。
    kind: fact
    level: E2
    status: established
    sources:
    - d-cap-tsu-gikai
  - text: 地名の歴史は安濃郡の港「安濃津」に始まると『日本歴史地名大系』は解説する。
    kind: fact
    level: E3
    status: established
    sources:
    - d-cap-tsu-kotobank
  - text: 安濃津は『中右記』嘉保3年（1096年）の裏書に「安乃津」と見えて地震・津波の記事があり、『兵範記』には「安濃津」、『玉葉』には「阿乃之津」とあるなど、平安時代後期以降の文書に散見する。
    kind: fact
    level: E3
    status: established
    sources:
    - d-cap-tsu-kotobank
  - text: 安濃津は博多津・坊津とともに日本三津とうたわれ、対外貿易の港町として栄えた。
    kind: fact
    level: E2
    status: established
    sources:
    - d-cap-tsu-gikai
  - text: 鎌倉後期には「津湊」とも呼ばれ、大永2年（1522年）の文書に「津四郷」、慶長13年（1608年）の藤堂高虎の文書に「津町中」とあるなど、近世には「津」の呼称が主流となって安濃津の用例は少なくなった。
    kind: fact
    level: E3
    status: established
    sources:
    - d-cap-tsu-kotobank
  - text: 江戸時代、津は藤堂高虎が安濃津城を改修した津城の城下町（32万3900石）として栄え、市名はこの城下町「津」を継ぐものである。
    kind: fact
    level: E2
    status: established
    sources:
    - d-cap-tsu-gikai
    - d-cap-tsu-castle
  - text: 1889年4月1日、全国の30市とともに日本で最初の市制が施行され、津市が誕生した。当時の人口は約2万7000人、面積は7.9平方キロであった。
    kind: fact
    level: E2
    status: established
    sources:
    - d-cap-tsu-mayor
    - d-cap-tsu-gikai
  - text: 2006年1月1日に津市・久居市・河芸町・芸濃町・美里村・安濃町・香良洲町・一志町・白山町・美杉村の10市町村が合併して新しい津市が誕生し、市名「津」は継承された。
    kind: fact
    level: E2
    status: established
    sources:
    - d-cap-tsu-gikai
  - text: 聖徳太子が四方に四天王寺を建立する企ての中で、当地の四天王寺を東の難波の四天王寺に対応させたという話が伝わるが、『日本歴史地名大系』はこの話を伝説の域を出ないとする。
    kind: legend
    level: E3
    status: established
    sources:
    - d-cap-tsu-kotobank
  - text: 津市の地方公共団体コードは242012である。
    kind: fact
    level: E2
    status: established
    sources:
    - d-cap-jlis-mie
  column:
    title: 「安濃津市」になりかけた津市
    text: 1889年の市制施行にあたって、津には「安濃津市」という名称案があった。古代以来の港のフルネームを復活させる案である。しかし実際に選ばれたのは、城下町として定着していた短い「津」の方だった。安濃津から津へという短縮は、鎌倉時代の「津湊」や近世の「津町中」といった用例が示すとおり、何百年もかけて進んだ流れの到着点だったといえる。
    sources:
    - d-cap-tsu-kotobank
  relations:
  - pref/24
  unknowns:
  - 郡名・郷名としての「安濃」自体の語源は、今回参照した範囲では確認できなかった。
  - 古代の安濃津の港湾施設の正確な範囲は、今回の調査では発掘成果まで確認していない。
  - 『中右記』の裏書記事は『日本歴史地名大系』経由の確認で、原典は未読である。
  updated: '2026-11-13'
- id: muni/25-大津市
  code: '252018'
  names:
    ja: 大津市
    reading: おおつし
    aliases:
    - 古津
    - 大津町
  user_terms:
  - 琵琶湖のほとりの県庁所在地
  - 大津宮のあった市
  - 京の外港だったまち
  naming_type: その他
  prefecture: 滋賀県
  homonyms: []
  summary: 市名は琵琶湖の港「大津」に由来する。667年に近江大津宮が置かれて都となったが、その廃絶後は「古津」と呼ばれ、794年の平安京遷都の詔で「先帝の旧都」として「大津」に復活した。以後は港町・宿場町の名として定着し、1898年の市制施行で大津市の名となった。
  first_attestation:
    era: 天智天皇6年
    year_western: 667
    document: 『日本書紀』天智天皇条（近江大津宮）
    note: 「大津」の名が都の宮号として現れる早い例。宮の廃絶後は「古津」と呼ばれ、794年に「大津」へ復した。原典は未読で、大津市の歴史文化資料等の紹介による二次確認にとどまる。
  claims:
  - text: 天智天皇6年（667年）に天智天皇は近江大津宮へ都を移し、大津には漏刻（水時計）や庠序（学校）を備えた都が置かれ、律令体制の基礎づくりが進められた。
    kind: fact
    level: E2
    status: established
    sources:
    - d-cap-otsu-rekibun
    - d-cap-otsu-ancient
  - text: 大津宮の廃絶後、この地は「古津」と呼ばれるようになったと百科事典は解説する。「古都の津」の意と解される。
    kind: fact
    level: E3
    status: established
    sources:
    - d-cap-otsu-furutsu
  - text: 古津と呼ばれるようになった理由には、672年の壬申の乱で大津宮が廃されたためとする説と、761年に瀬田川河口部の粟津が大津とされたため、旧来の大津が古津になったとする説がある。
    kind: fact
    level: E3
    status: contested
    sources:
    - d-cap-otsu-furutsu
  - text: 延暦13年（794年）、平安京遷都に際して出された詔には「近江国滋賀郡古津は先帝の旧都、今は輦下に接す。昔の号を追ひて大津と改称すべし」とあり、「大津」の名が復活したことが、『日本紀略』の記事や『日本後紀』逸文の引用を通じて確認できる。
    kind: fact
    level: E3
    status: established
    sources:
    - d-cap-otsu-furutsu
    - d-cap-heian-edict
  - text: 「大津」は辞典では「船が多く泊まる処」を意味する語としても立項されており、琵琶湖の水運の要衝であった当地の性格を表す名であった。
    kind: fact
    level: E3
    status: established
    sources:
    - d-cap-otsu-kotobank
  - text: 江戸時代の大津（大津宿・現在の大津・浜大津地区）は、東海道五十三次の宿場の中でも最大の人口を有するほどの賑わいを見せ、北国の物資が集散する港町の機能をあわせ持っていた。
    kind: fact
    level: E2
    status: established
    sources:
    - d-cap-otsu-chushin
  - text: 1898年10月1日に大津町へ市制が施行され、大津市が成立した。当時の面積は14.20平方キロ、人口は3万2446人であった。
    kind: fact
    level: E2
    status: established
    sources:
    - d-cap-otsu-databook
  - text: 大津宮の所在地は現在の大津市錦織一帯（近江大津宮錦織遺跡）とされ、往時の都の中心は現在の市街地の北部にあたる。
    kind: fact
    level: E2
    status: established
    sources:
    - d-cap-otsu-ancient
  - text: 天智天皇7年（668年）に崇福寺建立のための地ならしをしている際、銅鐸が発見されたという伝承や、石山寺建立の際に銅鐸が出土したという伝承が残されている。
    kind: legend
    level: E2
    status: established
    sources:
    - d-cap-otsu-rekibun
  - text: 大津市の地方公共団体コードは252018である。
    kind: fact
    level: E2
    status: established
    sources:
    - d-cap-jlis-shiga
  column:
    title: 消えた都の名前を取り戻した町
    text: 都が去った後の大津は、「古津」と呼ばれるようになってしまった。ところが794年、桓武天皇が平安京へ遷都した際の詔は、新京を平安京と名付け、国名を山背から山城へ改める話と並べて、近江の古津を「先帝の旧都」として「大津」に戻すことを命じていた。新都の命名と旧都の名の復活は、同じ一つの詔の中で同時に行われたのである。いまの大津市の名は、このとき取り戻された名前である。
    sources:
    - d-cap-otsu-furutsu
    - d-cap-heian-edict
  relations:
  - pref/25
  - muni/26-京都市
  unknowns:
  - 宮号「大津宮」が先にあったのか、港の地名「大津」が先にあったのかは、今回参照した資料では確定できなかった。
  - 『日本紀略』の古津改称記事は百科事典・辞典経由の確認で、原典は未読である。
  updated: '2026-11-13'
- id: muni/25-彦根市
  code: '252026'
  names:
    ja: 彦根市
    reading: ひこねし
    aliases:
    - 彦根町
  user_terms:
  - ひこね
  - 井伊家の城下町
  - 彦根藩35万石
  naming_type: 一部の地名
  prefecture: 滋賀県
  homonyms: []
  summary: 市名は城下町「彦根」の継承である。彦根市公式は、地名の由来を、天照大神の御子とされる活津彦根命が活津彦根明神として彦根山に祀られたことに求める伝承で説明する。関ヶ原後に井伊家が入り彦根城を築いて藩35万石の城下町となり、1937年、彦根町に5か村が合併して市制を施行した。
  first_attestation:
    era: 不明
    year_western: null
    document: 未確認
    note: 市公式は地名の由来を彦根山の祭神にまつわる伝承で説明するのみで、「彦根」の文献上の初出は本レコードの調査では確認できなかった。
  claims:
  - text: 彦根市公式は、「彦根」の地名は、むかし天照大神の御子に天津彦根命・活津彦根命の二神がおられ、このうち活津彦根命が活津彦根明神として彦根山に祭られたことに由来しているとされていると説明している。
    kind: legend
    level: E2
    status: established
    sources:
    - k4-hikone-city
    - k4-hikone-kankyo
  - text: 戦国時代には石田三成が佐和山城主となって町は繁栄したが、関ヶ原の戦いの功で井伊直政が彦根の地に封ぜられ、その子直継が彦根城の築城を始め、直孝により完成されて、彦根藩35万石の城下町として発展した。
    kind: fact
    level: E2
    status: established
    sources:
    - k4-hikone-city
  - text: 明治22年（1889年）4月1日に彦根で町制が施行され、彦根町が置かれた。
    kind: fact
    level: E2
    status: established
    sources:
    - k4-hikone-city
  - text: 昭和12年（1937年）2月11日、彦根町に隣接の松原・北青柳・青波・千本・福満の5か村が合併して彦根市が誕生した（当時の人口39,335人、面積25.08平方キロメートル）。
    kind: fact
    level: E2
    status: established
    sources:
    - k4-hikone-city
  - text: その後も昭和17年（1942年）の南青柳村・磯田村の合併から昭和43年（1968年）の稲枝町合併まで、周辺町村の編入が続いて現在の市域となった。
    kind: fact
    level: E2
    status: established
    sources:
    - k4-hikone-city
  - text: 彦根市の地方公共団体コードは252026である。
    kind: fact
    level: E2
    status: established
    sources:
    - d-cap-jlis-shiga
  column:
    title: 神の名をいただいた山のふもとの城下町
    text: 彦根の由来として市が伝えるのは、山に祀られた神の名前である。天照大神の御子という活津彦根命が「活津彦根明神」として彦根山に祀られたことから、地名「彦根」が生まれたとされる。井伊家は関ヶ原の後、あえて三成の佐和山城を使わず、この彦根山に新しい城を築いた。神の名を持つ山のふもとに35万石の城下町が開かれたことで、「彦根」は近江の東の中心として定着していく。
    sources:
    - k4-hikone-city
    - k4-hikone-kankyo
  relations:
  - pref/25
  unknowns:
  - 「彦根」の文献上の初出（中世の荘園・地名資料など）は、今回の調査では確認できなかった。
  - 活津彦根命を彦根山に祀る祭祀がいつ始まったのかは、市公式の説明にも示されておらず未確認である。
  updated: '2026-11-13'
- id: muni/25-日野町
  code: '253839'
  names:
    ja: 日野町
    reading: ひのちょう
    aliases:
    - 日野御牧
    - 日野市
  user_terms:
  - 日野町 日野御牧
  - 日野商人の町
  - 蒲生氏郷の城下町
  naming_type: その他
  prefecture: 滋賀県
  homonyms:
  - muni/31-日野町
  summary: 「日野」の名は天喜4年（1056年）の文書に法成寺領「日野御牧」として現れるのが初出とされ、中世には市場町「日野市」を経て蒲生氏の城下町となり、近江商人（日野商人）の町として発展した。明治22年（1889年）に日野町が発足し、昭和30年（1955年）の合併でも名が継承された。鳥取県の日野町が郡名を採用した新設町であるのとは成立の事情が異なる。
  first_attestation:
    era: 天喜4年
    year_western: 1056
    document: 東大寺使神成則請文
    note: 藤原摂関家ゆかりの法成寺領「日野御牧」としての登場。町公式の文化財保存活用地域計画が「日野の由来」として紹介するもの
  claims:
  - text: 町公式資料によれば、「日野」という名称が初めて歴史に登場するのは天喜4年（1056年）で、「東大寺使神成則請文」の中に藤原摂関家ゆかりの法成寺領「日野御牧」として登場する
    kind: fact
    level: E2
    status: established
    sources:
    - h6-hino-shiga-keikaku
  - text: 応永33年（1426年）には、四本商人の一つである保内商人が伊勢との交易の拠点として「日野市」で商売を行った記録が残り、この「日野市」がのちに蒲生氏の城下町「日野町」へと発展した
    kind: fact
    level: E2
    status: established
    sources:
    - h6-hino-shiga-keikaku
  - text: 16世紀初頭、蒲生定秀が「日野市」付近に中野城を築いて城下町を整備し、日野は蒲生氏の支配の拠点となった。日野はのちに近江商人（日野商人）の発祥地として知られる
    kind: fact
    level: E2
    status: established
    sources:
    - h6-hino-shiga-keikaku
    - h6-hino-shiga-wiki
  - text: 昭和30年（1955年）3月16日、日野町・東桜谷村・西桜谷村・西大路村・鎌掛村・南比都佐村・北比都佐村の1町6村が合併して現在の日野町が誕生した。町名は1889年に発足した日野町の名の継承である
    kind: fact
    level: E2
    status: established
    sources:
    - h6-hino-shiga-keikaku
  - text: 鳥取県の日野町は昭和34年（1959年）に郡名「日野」を採って新設された町であり、滋賀の日野が中世の御牧・市場町以来の地名を継承してきた点で、名の継承経路が異なる（異なる層）
    kind: fact
    level: E2
    status: established
    sources:
    - h6-hino-shiga-keikaku
    - h6-hino-tottori-wiki
  - text: 「日野」という語そのものの語源（なぜ「日野」と呼ばれるようになったか）は、町公式資料も初出の紹介にとどまっており、確定していない
    kind: fact
    level: E2
    status: indeterminate
    sources:
    - h6-hino-shiga-keikaku
  column:
    title: 御牧からはじまる商人の町
    text: 日野の名は、平安時代の馬の放牧地「日野御牧」として史料に現れます。それが中世には「日野市」という市場町の名となり、戦国期には蒲生氏郷の父祖の城下町となり、江戸時代には近江商人・日野商人を生む在郷町になりました。御牧→市場→城下町→商人の町と、名前は同じ「日野」のまま、中身が何度も入れ替わってきた町です。特産の「日野菜」（漬物で知られるカブ）も、この町の名を全国に運んだものの一つです。
    sources:
    - h6-hino-shiga-keikaku
    - h6-hino-shiga-wiki
  relations:
  - pref/25
  - muni/31-日野町
  unknowns:
  - 「日野」の語源（日野御牧の名の由来）は未確定
  - 日野御牧の範囲と現在の町域との対応の詳細は未確認
  updated: '2026-11-13'
- id: muni/26-京都市
  code: '261009'
  names:
    ja: 京都市
    reading: きょうとし
    aliases:
    - 平安京
    - 京
    - 京師
  user_terms:
  - 千年の都
  - 平安京のあった市
  - 古都
  naming_type: その他
  prefecture: 京都府
  homonyms: []
  summary: 市名は都の名「京都」の継承である。その基盤は794年に桓武天皇が命名した平安京で、1000年余り都であり続けた歴史の上に「京都」の名が成り立っている。1889年の市制施行により京都市が誕生した。
  first_attestation:
    era: 延暦13年
    year_western: 794
    document: 『日本後紀』逸文（延暦13年11月8日の詔）
    note: 都の名「平安京」の命名そのものを伝える詔文。本文は散逸し、逸文としての引用経由で確認した。都市名「京都」が固有名詞として定着するのはこれより後の時代である。
  claims:
  - text: 延暦13年（794年）10月22日に桓武天皇が新京へ移り、同月28日に遷都の詔が下された。
    kind: fact
    level: E2
    status: established
    sources:
    - d-cap-kyoto-nenpyo
  - text: 同年11月8日、新京は「平安京」と名付けられ、あわせて国名が「山背国」から「山城国」に改められた。
    kind: fact
    level: E2
    status: established
    sources:
    - d-cap-kyoto-nenpyo
  - text: 『日本後紀』の逸文として伝わるこの詔には「此の国は山河襟帯し、自然に城をなす。此の勝によりて新号を制むべし」と地形を評した上で、「子来の民、謳歌の輩、異口同辞に号して平安京と曰ふ」と、集まった人々が口々に平安京と呼んだことが記される形になっている（辞典の引用による確認）。
    kind: fact
    level: E3
    status: established
    sources:
    - d-cap-heian-edict
  - text: 平安京は唐の長安を手本とした東西約4.5キロ、南北約5.2キロの条坊制の都で、大内裏から南の羅城門まで朱雀大路（現在の千本通）がまっすぐ通された。
    kind: fact
    level: E2
    status: established
    sources:
    - d-cap-kyoto-kodomo
  - text: 平安京は延暦13年（794年）に定められてから明治のはじめまで1000年余りの間、日本の政治・経済・文化の中心として発展した。
    kind: fact
    level: E2
    status: established
    sources:
    - d-cap-kyoto-fu-tokei
  - text: 1889年4月1日、市制施行により京都市が誕生したが、東京・大阪とともに市制特例が適用され、市長は置かれず京都府知事が市長の職務を兼務した。
    kind: fact
    level: E2
    status: established
    sources:
    - d-cap-kyoto-jichi
    - d-cap-kyoto-aramashi
  - text: 市制特例の撤廃を求める運動の末、1898年10月15日に初代市長が就任して市役所が開庁した。京都市はこの日を自治記念日としている。
    kind: fact
    level: E2
    status: established
    sources:
    - d-cap-kyoto-jichi
  - text: 平安京の中心だった大内裏は現在の市街地の北西寄りにあたり、朱雀大路は現在の千本通にあたるなど、都の骨格は現在の町並みに残っている。一方で右京は湿地が多く人が住みにくかったため、人々は左京へ移り、都市の発展は東側に偏った。
    kind: fact
    level: E2
    status: established
    sources:
    - d-cap-kyoto-kodomo
  - text: 京都市の地方公共団体コードは261009である。
    kind: fact
    level: E2
    status: established
    sources:
    - d-cap-jlis-kyoto
  column:
    title: 一つの詔が動かした三つの名前
    text: 794年11月8日の詔は、一度に三つの名前を動かした。新京は「平安京」と名付けられ、国名は「山背国」から「山城国」へ改められ、そして近江の「古津」は先帝の旧都として「大津」に戻された。いま京都市の名に残っているのは宮都の名「平安京」ではなく、都そのものを指す「京都」の方だが、その出発点はこの日の命名にある。
    sources:
    - d-cap-kyoto-nenpyo
    - d-cap-heian-edict
  relations:
  - pref/26
  - muni/25-大津市
  unknowns:
  - 『日本後紀』の詔文は散逸した本文の逸文としての引用経由でしか確認しておらず、伝存形態の詳細は未確認である。
  - 平安京の選地にまつわる将軍塚の伝承などは、今回参照した市公式資料では確認できなかったため収録していない。
  - 「京都」が固有名詞として平安京を指すようになった過程の詳細は、都道府県レコード（pref/26）側の調査に委ね、本レコードでは平安京の命名と市制施行以降を中心に記録した。
  updated: '2026-11-13'
- id: muni/27-八尾市
  code: '272124'
  names:
    ja: 八尾市
    reading: やおし
    aliases:
    - 矢尾
    - 八尾庄
    - 八尾木
  user_terms:
  - やお
  - 鶯の伝説のまち
  naming_type: 一部の地名
  prefecture: 大阪府
  homonyms: []
  summary: 市名は中世以来の地名「八尾」の継承で、文献上の初出は長久2年（1041年）の矢作神社文書とされる。語源は決着しておらず、矢作部の「矢負い」が転訛したという説、尾羽根が8枚ある鶯の伝説、由義宮造営に伴う築堤の「八百の柵」説などが並び立つ。1948年に市制を施行した。
  first_attestation:
    era: 長久2年
    year_western: 1041
    document: 矢作神社文書（「河内国若江郡八尾八幡掃部別宮」）
    note: 八尾市立図書館が『八尾市史』等の資料に基づき紹介する初出。古くは「矢尾」とも書かれた。
  claims:
  - text: 八尾市立図書館は、「八尾」という地名が初めて文献に登場するのは、長久2年（1041年）の矢作神社文書に見える「河内国若江郡八尾八幡掃部別宮」であるという。
    kind: fact
    level: E2
    status: established
    sources:
    - k4-yao-library
  - text: 一つ目の説として、古代の八尾の地に大豪族・物部氏の配下で弓矢の生産に従事していた矢作部や弓削部があったことから「矢負い」という語が生まれ、転訛して「やを」になり「八尾」の字があてられるようになったという説が唱えられている。
    kind: fact
    level: E2
    status: contested
    sources:
    - k4-yao-library
  - text: 尾羽根が8枚ある鶯が美しい声で鳴いたという「八つ尾の鶯」の話は、天文22年（1553年）に三条西公条の『吉野詣記』に記されたもので、もとは「八尾木」の伝説であったものが八尾の地名伝説に転じていったと『八尾市史』は述べている。
    kind: legend
    level: E2
    status: established
    sources:
    - k4-yao-library
  - text: 宝亀元年（770年）から行われた古大和川（長瀬川）の大築堤工事で打ち込まれた大小の柵（木）の壮観を人々が「八百の木」と呼んだことが、「八尾」に転じたという説もあり、称徳天皇の由義宮（西の京）造営計画と結びつけて語られている。
    kind: fact
    level: E2
    status: contested
    sources:
    - k4-yao-library
  - text: このほか、低湿地を意味する古語「矢野」・「谷野」が転訛したという説や、信貴生駒連峰の八つの尾嶺に由来するという説も唱えられている。
    kind: fact
    level: E2
    status: contested
    sources:
    - k4-yao-library
  - text: 八尾市公式の「地名のいわれ」のページも、鶯の尾羽根説・矢負い説・八百の杭説の3つを、市の地名の「いわれ」として並べて紹介している。
    kind: fact
    level: E2
    status: established
    sources:
    - k4-yao-iwaware
  - text: 昭和23年（1948年）4月1日に市制を施行した（当時の人口64,431人、面積18.99平方キロメートル）。
    kind: fact
    level: E2
    status: established
    sources:
    - k4-yao-gaiyo
  - text: 八尾市の地方公共団体コードは272124である。
    kind: fact
    level: E2
    status: established
    sources:
    - d-cap-jlis-osaka
  column:
    title: 「八尾木」の鶯が「八尾」の鶯になるまで
    text: 八尾の鶯伝説は、もともと地名そのものの話ではなかった。『八尾市史』によれば、八つ尾の鶯の話は「八尾木」という木にまつわる伝説として語られていたものが、後に「八尾」の地名伝説へと転じていったという。1553年に吉野詣での途中でこの話を聞いた公卿・三条西公条は、「鶯の八尾のつばさ八千とせの声」と歌まで残した。伝説が地名に取り込まれていく過程を、市史がここまで具体的にたどれる例は珍しい。
    sources:
    - k4-yao-library
  relations:
  - pref/27
  unknowns:
  - 「八尾」の語源は諸説が並立しており、矢負い説・八百の柵説・地形説のいずれにも決着はついていない。
  - 昭和23年（1948年）の市制施行に至る合併の構成町村は、今回確認した市公式資料には記載がなく、未確認である。
  updated: '2026-11-13'
- id: muni/27-吹田市
  code: '272051'
  names:
    ja: 吹田市
    reading: すいたし
    aliases:
    - 次田
    - 吹田庄
  user_terms:
  - すいた
  - 万博のまち
  - 千里ニュータウン
  naming_type: 一部の地名
  prefecture: 大阪府
  homonyms: []
  summary: 市名は古代以来の地名「吹田」の継承だが、その出発点は「次田（スキタ）」である。吹田市公式によれば、初見は『行基年譜』の天平13年（741年）の記事で、「スキタ」が音便で「スイタ」に変わり、草書体で「次」に似た「吹」の字があてられて「吹田」になった。1940年に4町村の合併で市制を施行した。
  first_attestation:
    era: 天平13年
    year_western: 741
    document: 『行基年譜』
    note: 現在の「吹田」表記ではなく「嶋下郡次田里」「次田堀川」とあり、「次田（スキタ）」としての初見である。「吹田」表記への移行過程は市公式の説明による。
  claims:
  - text: 吹田市公式は、吹田の地名の初見は「行基年譜」の天平13年（741年）の記にある「嶋下郡次田里」「次田堀川」で、もとは「次田」と書いて「スキタ」と読んでいたと考えられると説明している。
    kind: fact
    level: E2
    status: established
    sources:
    - k4-suita-history
  - text: 「スキタ」は音便で「スイタ」に変化し、草書体で「次」の字に似ている「吹」の字が使われるようになったと考えられると市公式は説明している。
    kind: fact
    level: E2
    status: established
    sources:
    - k4-suita-history
  - text: 吹田市史総説編は、『醍醐雑事記』に、貞観7年（865年）に淳和天皇の皇子・基貞親王の領田として吹田庄が成立し、後に清住寺に寄進されたことが記されていると紹介している。
    kind: fact
    level: E2
    status: established
    sources:
    - k4-suita-shishi
  - text: のちの文献では「スイタ」を「水田」と書く例も見られると市公式は記している。
    kind: fact
    level: E2
    status: established
    sources:
    - k4-suita-history
  - text: 昭和15年（1940年）4月1日、三島郡吹田町・千里村・岸部村と豊能郡豊津村の4町村が合併して吹田市が誕生した。
    kind: fact
    level: E2
    status: established
    sources:
    - k4-suita-enkaku
  - text: 吹田市の地方公共団体コードは272051である。
    kind: fact
    level: E2
    status: established
    sources:
    - d-cap-jlis-osaka
  column:
    title: 「次」が「吹」になったまち
    text: 地名の漢字が変わる理由は、音の変化や縁起担ぎが多いが、吹田の場合は「字の形」である。「次田（スキタ）」の「次」を草書体で書くと「吹」に似るため、いつしか「吹」の字が使われるようになったというのが市の説明だ。音便で読みが「スイタ」に滑らかになるのと並行して、表記まで隣の字へ滑っていった。読みと字形の両方が少しずつずれて固まった地名は、全国的にも珍しい部類に入るだろう。
    sources:
    - k4-suita-history
  relations:
  - pref/27
  unknowns:
  - 『行基年譜』自体は後世に編まれた年譜であり、天平13年（741年）当時の同時代史料で「次田」を確認できたわけではない。
  - 「吹田」表記が文献に定着した時期は、市公式の説明でも明確には示されていない。
  updated: '2026-11-13'
- id: muni/27-堺市
  code: '271403'
  names:
    ja: 堺市
    reading: さかいし
    aliases:
    - 堺津
  user_terms:
  - さかい
  - 環濠都市
  - 政令指定都市
  naming_type: 一部の地名
  prefecture: 大阪府
  homonyms: []
  summary: 市名は中世以来の港町「堺」の継承である。「さかい」の名は、この地が摂津・河内・和泉の国の境（あるいは摂津・和泉の2国の境）にあったことに由来すると説明され、文献への初登場は11世紀中頃とされる。中世後期には環濠都市・貿易港として繁栄し、1889年に市制を施行、2006年に政令指定都市となった。
  first_attestation:
    era: 平安時代
    year_western: null
    document: 文献名不詳（堺市議会「市勢の概要」は「さかい」の地名が文献に初めて登場するのは11世紀中頃とするが、書名を示していない）
    note: 書名を伴う用例としては、角川日本地名大辞典が貞永元年（1232年）の文書に見える「泉州堺津」を紹介している。初出の年には資料間で幅がある。
  claims:
  - text: 堺市議会の「市勢の概要」は、「さかい」の地名が初めて文献に登場するのは11世紀中頃で、堺が摂津・河内・和泉の国境にあったことによるものと言われていると記している。
    kind: fact
    level: E2
    status: established
    sources:
    - k4-sakai-gikai
  - text: 一方で堺市の中心市街地活性化基本計画は、平安時代にこの地が摂津・和泉の2国の境に位置していたことから「さかい」と呼ばれるようになったと説明しており、「境」の国の数をめぐっては市公式資料の間でも2国説と3国説が併存する。
    kind: fact
    level: E2
    status: contested
    sources:
    - k4-sakai-chukatsu
    - k4-sakai-gikai
  - text: 角川日本地名大辞典は、中世の堺を摂津国住吉郡と和泉国大鳥郡にまたがる堺北荘・堺南荘の総称とし、貞永元年（1232年）の文書に、鋳物師らが廻船の拠点とした「泉州堺津」が見えることを示している。
    kind: fact
    level: E3
    status: established
    sources:
    - k4-sakai-kadokawa
  - text: 中世後期の堺は、良港を擁して朱印船貿易など海外貿易の物資集散地となり、防衛のため濠を巡らせた環濠都市が形成され、自治都市として繁栄した。
    kind: fact
    level: E2
    status: established
    sources:
    - k4-sakai-chukatsu
  - text: 1889年4月1日に市制が施行されて堺市が発足し、その後、明治27年（1894年）の第1次合併から14次にわたって22町村を編入して現在の市域が形成された。
    kind: fact
    level: E2
    status: established
    sources:
    - k4-sakai-gappei
  - text: 2005年2月1日に南河内郡美原町を編入し、これを契機として2006年4月に政令指定都市へ移行した。
    kind: fact
    level: E2
    status: established
    sources:
    - k4-sakai-gappei
    - k4-sakai-rekimachi
  - text: 堺市の地方公共団体コードは271403である。
    kind: fact
    level: E2
    status: established
    sources:
    - d-cap-jlis-osaka
  column:
    title: 三つの「市」の字が語る、国境のまち
    text: 明治28年（1895年）に制定された堺の市章は、「市」の字を三つ組み合わせた形をしている。堺市議会の資料によれば、これは3国の境に発達した都市という意味を込めたものだという。国と国の境目という、行政の周縁にあったはずの場所が、港の地の利を得て中世には会合衆が治める自治都市にまで育った。市章の三つの「市」は、その出自を今も静かに語り続けている。
    sources:
    - k4-sakai-gikai
    - k4-sakai-chukatsu
  relations:
  - pref/27
  - muni/27-大阪市
  unknowns:
  - 「さかい」の初出について、堺市議会資料は11世紀中頃とするが具体的な文献名を示しておらず、角川地名大辞典が示す鎌倉期の用例との間で幅があり、一次文献での確定には至らなかった。
  - 境の国の数が2国（摂津・和泉）か3国（摂津・河内・和泉）かは、市の公式資料の間でも説明が分かれており決着していない。
  updated: '2026-11-13'
- id: muni/27-大阪市
  code: '271004'
  names:
    ja: 大阪市
    reading: おおさかし
    aliases:
    - 大坂
    - 小坂
  user_terms:
  - 天下の台所
  - 大坂のまち
  - 商都
  naming_type: 一部の地名
  prefecture: 大阪府
  homonyms: []
  summary: 市名は城下町・大坂の名の継承である。地名「大坂」は蓮如の御文章を最古の用例として本願寺の寺内町とともに広まり、江戸時代を通じて「大坂」表記が主流だったが、明治10年ごろ「大阪」の表記に落ち着いた。その過程の途上で、1889年に大阪市が発足した。
  first_attestation:
    era: 明応5年
    year_western: 1496
    document: 蓮如『御文』（御文章）
    note: 大阪市公式が「文献に残る最古」とする「攝州東成郡生玉之庄内大坂」の用例。明応7年（1498年）の蓮如の消息を初見とする資料もあり、年には揺れがある（pref/27でも対立として記録）。
  claims:
  - text: 大阪市公式は、市名のいわれには諸説がありはっきりしないとしつつ、文献に残る最古の「大坂」は、室町時代に石山本願寺を建てた蓮如の御文章に書かれた「攝州東成郡生玉之庄内大坂」であると説明する。
    kind: fact
    level: E2
    status: established
    sources:
    - d-cap-osaka-city-name
  - text: 当時の文献には「大坂」とも「小坂」とも記され、いずれもオサカと発音されていたと思われると大阪市公式は説明する。
    kind: fact
    level: E2
    status: established
    sources:
    - d-cap-osaka-city-name
  - text: 江戸時代には「大坂」が多く使われ「大阪」も混用されてきたが、明治10年ごろになって、ようやく「大阪」に落ち着いた。
    kind: fact
    level: E2
    status: established
    sources:
    - d-cap-osaka-city-name
  - text: もともと「坂」と「阪」は同字で、「阪」から「坂」の字が生まれたとされ、1868年に大阪府が設置されてからも両表記は混用されていたが、明治10年代には「大阪」が一般的になった。
    kind: fact
    level: E2
    status: established
    sources:
    - d-cap-osaka-ndl
  - text: 「坂の字は土に反る（土に帰る）ので不吉として忌み、『阪』を用いるようになった」という説明が流布しているが、これは文化5年（1808年）の『摂陽落穂集』が「坂は不吉な文字として忌み嫌う人もおり、阪をもちいる人もいた」と記す言い伝えに由来するもので、改字を命じた公的記録によるものではない。
    kind: legend
    level: E2
    status: contested
    sources:
    - d-cap-osaka-ndl
  - text: 1889年4月1日、大阪府の東区・南区・西区・北区の4つの区の区域に市制が施行され、大阪市が誕生した。この年に全国で39の市が成立している。
    kind: fact
    level: E2
    status: established
    sources:
    - d-cap-osaka-tayori
  - text: 市制特例により当初の大阪市には市役所ができず、府の知事が市長の職務を行い、府の書記官が助役の職務を行った。
    kind: fact
    level: E2
    status: established
    sources:
    - d-cap-osaka-tayori
  - text: 1898年10月、市制特例の廃止を受けて田村太兵衛が初代大阪市長に就任した。
    kind: fact
    level: E2
    status: established
    sources:
    - d-cap-osaka-nenpyo
  - text: 「大坂」の語源そのものについては、大阪市公式も「いろいろな説がありはっきりとしていません」と述べており、確定していない。
    kind: fact
    level: E2
    status: indeterminate
    sources:
    - d-cap-osaka-city-name
  - text: 大阪市の地方公共団体コードは271004である。
    kind: fact
    level: E2
    status: established
    sources:
    - d-cap-jlis-osaka
  column:
    title: 府も市も、名前の表記が固まる前に生まれた
    text: 大阪府の設置は1868年、大阪市の誕生は1889年。ところが「大阪」という表記が一般的になったのは明治10年代のこととされる。つまり府も市も、「大坂」と書くか「大阪」と書くかがまだ定まらないうちに発足していたことになる。しかも字の古さでいえば、もともと坂と阪は同字で、阪から坂が生まれたというから、表記の移行は「新しい字への変更」というより「古い字への回帰」に近い。
    sources:
    - d-cap-osaka-ndl
    - d-cap-osaka-tayori
  relations:
  - pref/27
  - muni/26-京都市
  unknowns:
  - 「大坂」の語源は大阪市公式も確定していないとしており、本レコードでも諸説の決着には至らなかった。
  - 蓮如の用例の年（1496年か1498年か）は資料により異なり、原典での確定には至っていない。
  updated: '2026-11-13'
- id: muni/27-太子町
  code: '273813'
  names:
    ja: 太子町
    reading: たいしちょう
    aliases: []
  user_terms:
  - 太子町 聖徳太子のお墓
  - 叡福寺のある町
  - 王陵の谷の町
  naming_type: 合併新設
  prefecture: 大阪府
  homonyms:
  - muni/28-太子町
  summary: 昭和31年（1956年）に磯長村と山田村が合併した際、聖徳太子にちなんで命名された町。町内には聖徳太子御廟（叡福寺）があり、天皇陵が集まる「王陵の谷」の中心に位置する。兵庫県の太子町も聖徳太子ゆかりを理由とする命名で、この層は共通するが、大阪側の根拠は太子の墓所そのものが町内にあることにある。
  first_attestation:
    era: 昭和31年
    year_western: 1956
    document: 磯長村・山田村の合併による太子町の発足（1956年9月30日）
    note: 町名としての初出。地名「太子」自体は旧磯長村の大字名として先行する
  claims:
  - text: 町公式プロフィールによれば、昭和31年（1956年）9月30日に磯長村と山田村が合併し、「聖徳太子にちなんで太子町と名付けられた」
    kind: fact
    level: E2
    status: established
    sources:
    - h6-taishi-osaka-profile
  - text: 町内には聖徳太子御廟（叡福寺）があり、敏達・用明・推古・孝徳の各天皇陵とあわせて「梅鉢御陵」と総称され、一帯は天皇・皇族級の古墳が集中する「王陵の谷」と呼ばれる
    kind: fact
    level: E2
    status: established
    sources:
    - h6-taishi-osaka-profile
  - text: 旧磯長村の大字には「太子」があり、現在も太子町の大字として残る。町名は、合併地に先行するこの地名の側からも受け継がれた形になっている
    kind: fact
    level: E5
    status: established
    sources:
    - h6-taishi-osaka-wiki
  - text: 兵庫県の太子町も、聖徳太子ゆかりの町であることを理由に昭和26年（1951年）の合併で命名されており、「聖徳太子にちなむ合併時の命名」という層は共通する（共通する層）
    kind: fact
    level: E2
    status: established
    sources:
    - h6-taishi-osaka-profile
    - h6-taishi-hyogo-wiki
  - text: 両町の違いは根拠の置きどころにあり、大阪側は聖徳太子の御廟（墓所）そのものが町内にあるのに対し、兵庫側は太子が寄進を受けた荘園（鵤荘）と斑鳩寺の伝承が根拠である（異なる層）
    kind: fact
    level: E2
    status: established
    sources:
    - h6-taishi-osaka-profile
    - h6-taishi-hyogo-ikaruga
  - text: 飛鳥時代、この一帯は大和の「遠つ飛鳥」に対して「近つ飛鳥」と呼ばれ、推古天皇によって整備された大道（のちの竹内街道）が通っていた
    kind: fact
    level: E2
    status: established
    sources:
    - h6-taishi-osaka-profile
  column:
    title: 王陵の谷の真ん中で
    text: 太子町は「天皇のお墓だらけの町」です。敏達・用明・推古・孝徳の4天皇陵と聖徳太子御廟を合わせて「梅鉢御陵」と呼び、一帯は「王陵の谷」と呼ばれます。飛鳥の都に近い「近つ飛鳥」として、皇族の墓所が集中的に営まれた土地でした。1956年の命名は、この御廟の存在を町の看板に据えたもの。兵庫県の太子町が「太子ゆかりの荘園」を看板にするのと並べると、同じ聖徳太子でも「墓」と「荘園」という対照が見えてきます。
    sources:
    - h6-taishi-osaka-profile
  relations:
  - pref/27
  - muni/28-太子町
  unknowns:
  - 大字「太子」の名がいつ・どのように御廟にちなんで付けられたかの記録は未確認
  - 1956年の合併時に他の候補名があったかどうかは未確認
  updated: '2026-11-13'
- id: muni/27-寝屋川市
  code: '272159'
  names:
    ja: 寝屋川市
    reading: ねやがわし
    aliases:
    - 寝屋川村
    - 寝屋川町
  user_terms:
  - ねやがわ
  - 鉢かづき姫のまち
  naming_type: 一部の地名
  prefecture: 大阪府
  homonyms: []
  summary: 市名は川の名「寝屋川」の転用である。寝屋川市広報によれば、川名はその起点付近の集落「寝屋」に由来し、1889年に合併で生まれた村が、域内を流れる川の名を村名に採用した。それが町制を経て1951年の市制施行まで受け継がれた。「寝屋」の語源自体は諸説あり確定していない。
  first_attestation:
    era: 明治22年
    year_western: 1889
    document: 寝屋川村の成立（町村制による木田・堀溝・河北・萱島流作新田の4村合併）
    note: 自治体名としての「寝屋川」の初出。川名「寝屋川」は江戸時代初期の記録に初めて登場すると市広報は伝えるが、具体的な書名は示されていない。
  claims:
  - text: 寝屋川市広報は、市名の由来である「寝屋川」という名称は、傍示川と北谷川が合流して寝屋川が始まる地にある「寝屋」という地区の地名に由来すると説明している。
    kind: fact
    level: E2
    status: established
    sources:
    - k4-neyagawa-koho
  - text: 同広報は、寝屋川が記録に初めて登場したのは江戸時代の初期で、それ以前から呼ばれていたようだがはっきりしないと述べている。
    kind: fact
    level: E2
    status: established
    sources:
    - k4-neyagawa-koho
  - text: 明治22年（1889年）4月、木田・堀溝・河北・萱島流作新田の4村が合併して寝屋川村が誕生し、4村に流れていた川の名が村名に採用され、その後、寝屋川町を経て寝屋川市へと受け継がれた。
    kind: fact
    level: E2
    status: established
    sources:
    - k4-neyagawa-koho
  - text: 昭和26年（1951年）5月3日に市制を施行し、同日制定された市章は、中央の部分が「ネ」と「矢」で「寝屋」を、周囲が「川」を表す形で市名を図案化したものである。
    kind: fact
    level: E2
    status: established
    sources:
    - k4-neyagawa-shisho
  - text: 集落名「寝屋」の語源については、星田牧の従事者の宿泊所が存在したことによるとする説と、東高野街道の旅人のための布施屋の設備があったことによるとする説が紹介されている。
    kind: fact
    level: E4
    status: contested
    sources:
    - k4-neyagawa-chimei
  - text: 「寝屋」は「ネ（川岸）」と「ヤ（湿地）」からなる地形名で、川沿いの湿地を指すのではないかという見方もある。
    kind: fact
    level: E4
    status: contested
    sources:
    - k4-neyagawa-chimei
  - text: 市内の寝屋地区には、御伽草子で知られる「鉢かづき姫」の舞台となった寝屋長者の屋敷跡と伝えられる場所があり、寝屋川市はこの伝説をたどる散策コースを設けている。
    kind: legend
    level: E2
    status: established
    sources:
    - k4-neyagawa-hachikazuki
    - k4-neyagawa-chimei
  - text: 寝屋川市の地方公共団体コードは272159である。
    kind: fact
    level: E2
    status: established
    sources:
    - d-cap-jlis-osaka
  column:
    title: お伽草子の姫が眠るまち、寝屋
    text: 「鉢かづき姫」は、継母に大きな鉢をかぶせられながらも幸せをつかむ姫の物語で、室町時代のお伽草子として知られる。その舞台とされるのが寝屋川市の寝屋地区で、姫の父とされる寝屋長者の屋敷跡と伝えられる場所が残り、市は「鉢かづき姫伝説コース」として散策路に組み入れている。川の名がまちの名になり、そのまちの一角には物語の伝承地が残る。地名と伝説が重なり合う好例である。
    sources:
    - k4-neyagawa-hachikazuki
    - k4-neyagawa-chimei
  relations:
  - pref/27
  unknowns:
  - 「寝屋」の語源は宿泊所説・布施屋説・地形説が並立し、確定していない。
  - 川名「寝屋川」の記録上の初出（江戸時代初期）について、市広報は具体的な書名を示しておらず未確認である。
  updated: '2026-11-13'
- id: muni/27-東大阪市
  code: '272272'
  names:
    ja: 東大阪市
    reading: ひがしおおさかし
    aliases: []
  user_terms:
  - ひがしおおさか
  - 三市合併のまち
  naming_type: 合併新設
  prefecture: 大阪府
  homonyms: []
  summary: 市名は1967年の3市合併で生まれた新名である。東大阪市公式によれば、「東大阪市」という呼び名は合併以前から市民に親しみをもって呼称されてきた通称で、新市が地域の中核都市として発展するにふさわしい名称として、合併前の1966年8月に決定された。翌1967年2月1日、布施市・河内市・枚岡市が合併して東大阪市が誕生した。
  first_attestation:
    era: 昭和41年
    year_western: 1966
    document: 合併に先立つ新市名称の決定（1966年8月）
    note: 「東大阪」の呼称自体は合併以前からこの地域を指す通称として市民に使われていたもので、1966年8月に正式な市名として決定された。
  claims:
  - text: 昭和42年（1967年）2月1日、布施市・河内市・枚岡市の3市が合併して東大阪市が誕生した。
    kind: fact
    level: E2
    status: established
    sources:
    - k4-higashiosaka-ayumi
  - text: 東大阪市公式は、「東大阪市」という呼び名は三市合併以前から市民に親しみをもって呼称されてきたものであり、将来この新しい市が地域の中核都市として発展するにふさわしい名称であるとして、合併前の昭和41年（1966年）8月に決定したと説明している。
    kind: fact
    level: E2
    status: established
    sources:
    - k4-higashiosaka-50nen
  - text: 昭和44年（1969年）7月、東大阪市の人口は50万人を突破し、当時、人口50万人以上の都市は全国で15番目であった。
    kind: fact
    level: E2
    status: established
    sources:
    - k4-higashiosaka-ayumi
  - text: 前身の一つである旧布施町では、昭和7年（1932年）3月に給水が開始されており、これは現在の東大阪市水道の起点となっている。
    kind: fact
    level: E2
    status: established
    sources:
    - k4-higashiosaka-suido
  - text: 2017年には市制施行（合併）50周年を迎え、市政だよりは市名の由来を含む特集「東大阪市50年のあゆみ」を組んだ。
    kind: fact
    level: E2
    status: established
    sources:
    - k4-higashiosaka-50nen
  - text: 東大阪市の地方公共団体コードは272272である。
    kind: fact
    level: E2
    status: established
    sources:
    - d-cap-jlis-osaka
  column:
    title: 通称がそのまま市名になったまち
    text: 市同士の合併では、どの旧市名を残すかが揉め事の種になりやすい。ところが1967年の布施・河内・枚岡の合併では、3市のどれでもない「東大阪市」が選ばれた。決め手は格付けではなく日常の言葉だった。この一帯は合併前から市民に「東大阪」と呼ばれており、その通称が「地域の中核都市にふさわしい名称」として1966年8月に正式採用されたのである。行政が作った名前が市民に浸透するのではなく、市民の呼び名が行政を追認させた、珍しい順序の命名だった。
    sources:
    - k4-higashiosaka-50nen
  relations:
  - pref/27
  - muni/27-大阪市
  unknowns:
  - 1966年の市名決定の際、「東大阪市」以外にどのような候補が検討されたかは、今回確認した市の公式資料には記載がなかった。
  - 前身3市（布施市・河内市・枚岡市）それぞれの市制施行年は、本レコードの調査範囲では公式資料で個別に確認していない。
  updated: '2026-11-13'
- id: muni/27-枚方市
  code: '272108'
  names:
    ja: 枚方市
    reading: ひらかたし
    aliases:
    - 枚方里
    - 枚方宿
  user_terms:
  - ひらかた
  - 京街道の宿場町
  - 樟葉宮のまち
  naming_type: 一部の地名
  prefecture: 大阪府
  homonyms: []
  summary: 市名は古代の「枚方里」の継承である。奈良時代初頭の『播磨国風土記』は、播磨に同名の里ができた由来として河内国茨田郡の枚方里の存在を伝えており、河内の枚方はそれ以前から知られた地名だった。一方、「ひらかた」の語源そのものは枚方市公式も「わからない」としており、確定していない。1947年に市制を施行した。
  first_attestation:
    era: 和銅6年〜霊亀元年
    year_western: 713
    document: 『播磨国風土記』揖保郡条
    note: 播磨国の枚方の里の名の由来を述べる中で「河内の国、茨田の郡の枚方の里」に言及する形で現れる。河内の枚方里の成立はこれ以前に遡るはずだが、年代は未確認である（成立年は713〜715年の幅がある）。
  claims:
  - text: 枚方市公式の概説は、いつのころから「ひらかた」と呼ばれるようになったのかは分からないとしながら、『播磨国風土記』に「河内国茨田郡枚方里」と記されていることを紹介している。
    kind: fact
    level: E2
    status: established
    sources:
    - k4-hirakata-ayumi
  - text: 郷土史の解説は、『播磨国風土記』揖保郡条に「枚方と名づる所以は、河内の国、茨田の郡の枚方の里の漢人、来たりて初めてこの村に居りき」という記事があり、播磨の枚方の里は河内の枚方里からの移住者にちなむ名であることを紹介している。
    kind: fact
    level: E4
    status: established
    sources:
    - k4-hirakata-fudoki
  - text: 枚方市公式の概説が「いつのころから『ひらかた』と呼ばれるようになったのかはわかりません」と述べるとおり、「ひらかた」の語源は確定していない。
    kind: fact
    level: E2
    status: indeterminate
    sources:
    - k4-hirakata-ayumi
  - text: 一説に、神武東征の説話に現れる「白肩津（しろかたつ）」という地名が転化して「枚方」になったともいわれる。
    kind: legend
    level: E4
    status: contested
    sources:
    - k4-hirakata-fudoki
  - text: 枚方市公式は、『日本書紀』によれば越前から迎えられた男大迹王（後の継体天皇）が507年に樟葉で即位し、5年にわたり宮を営んだとされ、交野天神社境内が樟葉宮跡の伝承地であると紹介している。
    kind: fact
    level: E2
    status: established
    sources:
    - k4-hirakata-kusuha
  - text: 江戸時代には、岡新町・岡・三矢・泥町の4か村が枚方宿に指定されて京街道の宿場町を形成し、淀川を上下する過書船の中継地としても賑わった。
    kind: fact
    level: E2
    status: established
    sources:
    - k4-hirakata-ayumi
  - text: 昭和22年（1947年）8月1日に市制を施行し、昭和30年（1955年）に津田町を合併して現在の市域となった。
    kind: fact
    level: E2
    status: established
    sources:
    - k4-hirakata-ayumi
  - text: 枚方市の地方公共団体コードは272108である。
    kind: fact
    level: E2
    status: established
    sources:
    - d-cap-jlis-osaka
  column:
    title: もう一つの枚方は「平方」になった
    text: 『播磨国風土記』が伝えるもう一つの「枚方」は、播磨国揖保郡（現在の兵庫県たつの市方面）にあった里で、河内の枚方から移り住んだ人々にちなむ名だったとされる。興味深いことに、播磨の枚方は後に「平方」と書かれるようになったという。残った大阪の枚方は、初見の古さに反して読み方が難しく、「まいかた」「まきかた」と読み間違えられることの多い地名として知られる。同じ名前から出発した二つの里は、表記の運命まで分かれたことになる。
    sources:
    - k4-hirakata-fudoki
    - k4-hirakata-ayumi
  relations:
  - pref/27
  unknowns:
  - 「ひらかた」の語源は枚方市公式も不明としており、白肩津転化説を含め決着はついていない。
  - 枚方里について『和名類聚抄』での郡・郷の記載と読みは、今回の調査では確認できなかった。
  updated: '2026-11-13'
- id: muni/27-豊中市
  code: '272035'
  names:
    ja: 豊中市
    reading: とよなかし
    aliases:
    - 豊中村
    - 豊中町
  user_terms:
  - とよなか
  - 文教都市
  naming_type: 合併新設
  prefecture: 大阪府
  homonyms: []
  summary: 市名は1889年に生まれた「豊中村」の継承である。豊島郡の新免・南轟木・山ノ上・桜塚・岡町の5か村が合併した際、郡の中央にあたることから「豊中」と名付けたと伝えられる。1927年に町制、1936年に近隣3村との合併を伴って市制を施行した。
  first_attestation:
    era: 明治22年
    year_western: 1889
    document: 豊中村の成立（町村制による5か村の合併）
    note: 地名「豊中」そのものの初出。もとの郡名「豊島」は『古事記』（712年）にまで遡るが、「豊中」は明治の合併で生まれた新しい地名である。
  claims:
  - text: 豊中市公式は、「豊中」の地名は明治22年（1889年）4月に摂津国豊島郡の新免村・南轟木村・山ノ上村・桜塚村・岡町村の5か村が合併して豊中村が置かれたときに生まれ、豊島郡の中央にあたることから名付けたと伝えられると説明している。
    kind: fact
    level: E2
    status: established
    sources:
    - k4-toyonaka-history
  - text: 豊中市公式は、豊島の名が文献に見えるのは和銅5年（712年）に撰上された『古事記』中巻からで、神護景雲3年（769年）には称徳天皇が豊島の人15人に姓を授けた記録が『続日本紀』に見えると紹介している。
    kind: fact
    level: E2
    status: established
    sources:
    - k4-toyonaka-history
  - text: 明治29年（1896年）4月に豊島郡と能勢郡が合併して豊能郡となったため、豊中村は豊能郡豊中村となった。
    kind: fact
    level: E2
    status: established
    sources:
    - k4-toyonaka-history
  - text: 昭和2年（1927年）に町制を施行して豊中町となり、昭和11年（1936年）に豊中町・麻田村・桜井谷村・熊野田村が合併して豊中市が発足した。
    kind: fact
    level: E2
    status: established
    sources:
    - k4-toyonaka-history
  - text: 昭和22年（1947年）には中豊島村・南豊島村・小曽根村を編入した。
    kind: fact
    level: E2
    status: established
    sources:
    - k4-toyonaka-history
  - text: 豊中市の地方公共団体コードは272035である。
    kind: fact
    level: E2
    status: established
    sources:
    - d-cap-jlis-osaka
  column:
    title: 市章の中に隠れた「豊中」の文字
    text: 1939年に公募で制定された豊中市の市章は、一見すると幾何学模様だが、実は文字遊びになっている。豊中（トヨナカ）の頭文字「ト」を4個組み合わせて「トヨ（豊）」ともじり、全体の形を「中」と見立てて「豊中」と読ませるのだという。地名の由来が「郡の真ん中」という位置の説明だったまちは、その名前を図案の中にもう一度「真ん中」の字で閉じ込めたことになる。
    sources:
    - k4-toyonaka-youran
    - k4-toyonaka-history
  relations:
  - pref/27
  unknowns:
  - 「豊島郡の中央にあたることから名付けた」という命名理由は、市公式が「伝えられています」とする伝承レベルの説明であり、命名当時の公文書での裏付けは確認できなかった。
  updated: '2026-11-13'
- id: muni/27-高槻市
  code: '272078'
  names:
    ja: 高槻市
    reading: たかつきし
    aliases:
    - 高月
    - 高槻庄
  user_terms:
  - たかつき
  - 京と大阪の中間
  - 高山右近の城下町
  naming_type: 一部の地名
  prefecture: 大阪府
  homonyms: []
  summary: 市名は中世以来の地名の継承で、そのおこりは「高月」である。高槻市公式資料は「高月」の名が鎌倉時代から南北朝時代にかけて史上に現れるとし、戦国期には「高槻庄」と記された。「高槻」への転化は、高い槻（ケヤキ）の木にまつわるという説が伝えられる。1943年に市制を施行した。
  first_attestation:
    era: 鎌倉時代
    year_western: null
    document: 史料名不詳（高槻市公式資料は「高月」の名が鎌倉時代から南北朝時代に史上に現れるとするが、具体的な書名を示していない）
    note: 「高槻」の形では戦国期の「高槻庄」が古い用例として語源由来辞典に紹介されている。
  claims:
  - text: 高槻市公式の郷土史資料は、高槻の地名のおこりは「高月」で、その名が史上に現れるのは鎌倉時代から南北朝時代であること、南北朝から戦国時代には芥川城や高槻城をめぐる攻防の地であったことを記している。
    kind: fact
    level: E2
    status: established
    sources:
    - k4-takatsuki-kyodo
  - text: 戦国期には「高槻庄」の名が見え、「高月」から「高槻」に転じたのは、高い槻の木（ケヤキの呼称）の近くに本陣が立てられたことからといわれる。
    kind: fact
    level: E4
    status: contested
    sources:
    - k4-takatsuki-gogen
  - text: もとの「高月」の由来については、高くなった所を表す「タカ」と「ツキ」を重ねた地形由来説のほか、安満庄の神社名に由来する説、神武東征の説話に軍の旗印の月を結びつける説など、諸説が並立している。
    kind: fact
    level: E4
    status: contested
    sources:
    - k4-takatsuki-gogen
  - text: 江戸時代には慶安年間に封じられた永井直清以来、高槻藩永井家の城下町として発展し、高槻城は明治7年（1874年）に破却された。
    kind: fact
    level: E2
    status: established
    sources:
    - k4-takatsuki-kyodo
  - text: 昭和18年（1943年）1月1日、大阪府下で9番目の市として高槻市が市制を施行した。
    kind: fact
    level: E2
    status: established
    sources:
    - k4-takatsuki-kyodo
  - text: 平成15年（2003年）4月1日、大阪府内で2番目の中核市へ移行した。
    kind: fact
    level: E2
    status: established
    sources:
    - k4-takatsuki-kyodo
  - text: 高槻市の地方公共団体コードは272078である。
    kind: fact
    level: E2
    status: established
    sources:
    - d-cap-jlis-osaka
  column:
    title: 市章が宣言する「京と大阪の真ん中」
    text: 高槻市の市章は、大阪市の市章と京都市の市章を組み合わせ、その形で高槻の「高」をかたどったものだと市は説明する。淀川を挟んで両都のちょうど中間に位置するこのまちは、古来、京と大坂を結ぶ交通の要衝だった。地名の由来には確かな決着がついていない一方で、市章のほうは「両都の真ん中」という自己認識をはっきりと図案に刻んでいる。
    sources:
    - k4-takatsuki-shisho
    - k4-takatsuki-kyodo
  relations:
  - pref/27
  unknowns:
  - 「高月」の初出の具体的な史料名・年は、市公式資料にも示されておらず未確認である。
  - 「高槻」表記が定着した時期と経緯は、槻の木にまつわる伝承的説明以外に確認できなかった。
  updated: '2026-11-13'
- id: muni/28-太子町
  code: '284645'
  names:
    ja: 太子町
    reading: たいしちょう
    aliases:
    - 鵤荘
  user_terms:
  - 太子町 斑鳩寺の町
  - 鵤荘の町
  - 太子町 兵庫 由来
  naming_type: 合併新設
  prefecture: 兵庫県
  homonyms:
  - muni/27-太子町
  summary: 昭和26年（1951年）に斑鳩町・石海村・太田村が合併して生まれた町で、町名は聖徳太子ゆかりの町であることから付けられた。その根拠は、推古14年（606年）に聖徳太子が寄進を受けたと伝わる荘園「鵤荘」と、その中核寺院・斑鳩寺である。大阪府の太子町も聖徳太子にちなむ命名だが、根拠が御廟の所在地である点が異なる。
  first_attestation:
    era: 昭和26年
    year_western: 1951
    document: 斑鳩町・石海村・太田村の合併による太子町の誕生（1951年4月1日）
    note: 町名としての初出。合併前の町名「斑鳩町」も聖徳太子ゆかりの名だった
  claims:
  - text: 昭和26年（1951年）4月1日、斑鳩町と石海村・太田村が合併して太子町が誕生した（昭和30年には龍田村を編入）
    kind: fact
    level: E5
    status: established
    sources:
    - h6-taishi-hyogo-wiki
  - text: 町名は、聖徳太子ゆかりの町であることから付けられた
    kind: fact
    level: E5
    status: established
    sources:
    - h6-taishi-hyogo-wiki
  - text: 町公式資料によれば、推古14年（606年）、聖徳太子は推古天皇の御前で勝鬘経を講話した功により播磨国揖保郡の水田百町を寄進され、その地を「鵤荘」と名付けて伽藍を建てたのが斑鳩寺の始まりで、斑鳩寺はのちに法隆寺に寄付され、その荘園として栄えた
    kind: fact
    level: E2
    status: established
    sources:
    - h6-taishi-hyogo-ikaruga
  - text: 『日本書紀』推古14年条には、聖徳太子が法華経の講義を行ったため天皇から播磨国の水田100町を与えられ、斑鳩寺（法隆寺）領として納めたとあり、この地は「鵤荘」と呼ばれて現在の町域に当たるとされる
    kind: fact
    level: E5
    status: established
    sources:
    - h6-taishi-hyogo-wiki
  - text: 大阪府の太子町も聖徳太子にちなむ合併時の命名という点は共通するが、根拠は御廟（墓所）の所在地であることであり、兵庫側の荘園・寺院の伝承とは異なる（異なる層）。また兵庫側は合併前の町名も「斑鳩町」で、二代続けて太子ゆかりの名を選んでいる
    kind: fact
    level: E5
    status: established
    sources:
    - h6-taishi-hyogo-wiki
    - h6-taishi-osaka-profile
  - text: 町内の檀特山の山頂にある大きな岩のくぼみは、応神天皇の御沓・御杖の跡、または聖徳太子が馬に乗って登り修行をした時についた蹄の跡と言い伝えられている
    kind: legend
    level: E5
    status: established
    sources:
    - h6-taishi-hyogo-wiki
  column:
    title: 二代続けて太子の名を選んだ町
    text: 1951年の合併で太子町が生まれる前、この土地の中心は「斑鳩町」でした。斑鳩も聖徳太子を象徴する名（法隆寺のある大和の斑鳩）です。つまりこの町は、斑鳩町から太子町へ、二代続けて聖徳太子ゆかりの名を選び続けたことになります。その土台は、606年に太子が水田百町を寄進されて「鵤荘」と名付けたと伝わる荘園と、法隆寺領として千年近く続いた斑鳩寺の歴史です。大阪の太子町が「太子の墓の町」なら、こちらは「太子の荘園の町」です。
    sources:
    - h6-taishi-hyogo-wiki
    - h6-taishi-hyogo-ikaruga
  relations:
  - pref/28
  - muni/27-太子町
  unknowns:
  - 1951年の合併時に「太子町」の名を選んだ協議の記録（候補名の有無など）は未確認
  - 鵤荘の範囲と現在の町域がどの程度一致するかは資料により幅がある
  updated: '2026-11-13'
- id: muni/28-姫路市
  code: '282014'
  names:
    ja: 姫路市
    reading: ひめじし
    aliases:
    - 日女道
    - 姫道
  user_terms:
  - ひめじ
  - 白鷺城のまち
  - 姫路城の城下町
  naming_type: 一部の地名
  prefecture: 兵庫県
  homonyms: []
  summary: 市名は奈良時代の『播磨国風土記』に見える「日女道（ひめじ）」に由来する。風土記の日女道丘の記事は流れ着いた蚕（蚕子）に由来すると伝えるが、「姫道＝丘に登る小道」と解する説もあり、語源の決着はついていない。表記は鎌倉期に「姫道」、戦国期に「姫路」となり、姫路城の城下町名を経て、1889年の市制施行で市名となった。
  first_attestation:
    era: 霊亀元年ごろ
    year_western: 715
    document: 『播磨国風土記』飾磨郡伊和里条（「日女道丘」）
    note: 和銅6年（713年）の風土記編纂の詔に基づき霊亀元年（715年）ごろまでに成立したとされる。表記は「日女道」で読みは「ひめじ」。「姫路」の表記は戦国期からのものである。
  claims:
  - text: 『播磨国風土記』には、飾磨郡伊和里の14の丘の一つとして「日女道（ひめじ）丘」が挙げられており、「姫路」の名はこの「日女道」に由来するとされる。
    kind: fact
    level: E2
    status: established
    sources:
    - k4-himeji-harima
    - k4-himeji-gogen
  - text: 風土記には「蚕子（ひめこ）落ちし処は、即ち日女道丘と号す」という記事があり、流れ着いた蚕にちなんで日女道丘と名付けられたという話が伝えられている。
    kind: legend
    level: E4
    status: established
    sources:
    - k4-himeji-gogen
  - text: 一方、「日女道」は「姫道」の意味で、丘（姫山）に登る小道に由来する地名であるという解釈もあり、蚕子説については、風土記の説話は由来を知るための資料としては弱いという指摘もある。
    kind: fact
    level: E4
    status: contested
    sources:
    - k4-himeji-gogen
  - text: 「日女道」の表記は鎌倉期に「姫道」、戦国期に「姫路」と記されるようになり、近世には姫路城の城下町名となった。
    kind: fact
    level: E4
    status: established
    sources:
    - k4-himeji-gogen
  - text: 明治22年（1889年）4月、江戸時代の城下町とその外縁部を市域として、全国30市とともに我が国初の市制が施行され、姫路市が発足した。
    kind: fact
    level: E2
    status: established
    sources:
    - k4-himeji-cci
  - text: 姫路市の地方公共団体コードは282014である。
    kind: fact
    level: E2
    status: established
    sources:
    - d-cap-jlis-hyogo
  column:
    title: 白鷺の城が立つ丘の名は「日女道」
    text: 姫路城が立つ姫山は、『播磨国風土記』に「日女道丘」として現れる丘に重なるとされる。風土記はこの丘の名を、流れ着いた蚕（蚕子＝ひめこ）の話で説明した。「ひめこ」が「ひめじ」に転じたと読むか、「姫の道」と読むかは今も決着していないが、少なくとも1300年以上前から、この丘のあたりは「ひめじ」の音で呼ばれていたことになる。白鷺城の白さが目立つ城下町の名は、奈良時代の地名の音をそのまま引き継いでいる。
    sources:
    - k4-himeji-gogen
    - k4-himeji-harima
  relations:
  - pref/28
  unknowns:
  - 「日女道」の本来の意味は蚕子説と小道（姫道）説が対立しており、決着していない。
  - 姫路市公式サイトには市名の由来を解説する専用ページが見当たらず、本レコードは県・広域協議会・商工会議所等の資料に依拠した。
  updated: '2026-11-13'
- id: muni/28-尼崎市
  code: '282022'
  names:
    ja: 尼崎市
    reading: あまがさきし
    aliases:
    - 尼ヶ崎
    - 海士崎
    - 海人崎
  user_terms:
  - 尼崎の名前の由来
  - あまがさきの語源
  - 尼ヶ崎と尼崎はどっちが本来の表記なの
  - 漁民の町から来た地名
  naming_type: 一部の地名
  prefecture: 兵庫県
  homonyms: []
  summary: 市名は中世以来の港町「尼崎」の継承。久安年間（1145〜1151年）以後に新しくできた土地と古文書に記され、漁民を意味する「アマ」と海に突き出た土地「サキ」の結合と説明される。中世には「海士崎」「海人崎」とも書かれた。大正5年（1916年）に市制を施行した。
  first_attestation:
    era: 久安年間（1145〜1151年）
    year_western: null
    document: 大物浜・長洲浜請文（真福寺文書）
    note: 尼崎市公式が「尼崎」の最古の用例として挙げる文書で、成立は平安時代末〜鎌倉時代初期とされる。文中に「久安以後の新出地」とあることから、地名の成立自体は久安年間ごろにさかのぼるとみられる
  claims:
  - text: 尼崎市の地方公共団体コードは282022である（総務省「地方公共団体コード一覧」による）
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  - text: 「尼崎」の最古の用例は平安時代末〜鎌倉時代初期の「大物浜・長洲浜請文」（真福寺文書）で、尼崎浜は久安年間（1145〜1151年）以後に新しくできた土地と記されている
    kind: fact
    level: E2
    status: established
    sources:
    - k5-amagasaki-city-yurai
  - text: もとの「尼崎」は現在の阪神尼崎駅から大物駅の南側あたりにあった土地で、現在の市中心部とは位置がずれている
    kind: fact
    level: E2
    status: established
    sources:
    - k5-amagasaki-city-yurai
  - text: 尼崎市公式の由来説明では、「尼崎」は漁民・海民を意味する「アマ」と、海に突き出た土地を意味する「サキ」が結びついた地名とされる
    kind: fact
    level: E2
    status: established
    sources:
    - k5-amagasaki-city-yurai
  - text: 中世の史料には「尼崎」のほかに「海士崎」「海人崎」「海ヶ崎」「尼カ崎」などの表記が見られ、このうち「海士崎」「海人崎」は海士・海人（あま）が住む崎という地名本来の由来を表す表記であろうと考えられている
    kind: fact
    level: E2
    status: established
    sources:
    - k5-amagasaki-ndl-ref
  - text: 町制時代の正式な表記は「尼ヶ崎町」だったが、大正5年（1916年）の市制施行にあたり、町当局は古文書に「尼崎」とあることを根拠に「尼崎」が本来の表記であるとして市名に「尼崎市」を希望し、そのとおりに定められた
    kind: fact
    level: E2
    status: established
    sources:
    - k5-amagasaki-ndl-ref
  - text: 大正5年（1916年）4月1日、尼崎町と立花村の一部（東難波・西難波）が合併して市制を施行し、尼崎市が発足した（当時の人口は32,013人で、兵庫県内では3番目、全国では66番目の市制施行）
    kind: fact
    level: E2
    status: established
    sources:
    - k5-amagasaki-zusetsu
  column:
    title: 「尼ヶ崎」と書くか「尼崎」と書くか
    text: 中世以来、「尼崎」の表記は一つではなかった。「海士崎」「海人崎」という由来を思わせる書き方から、近世の「尼ヶ崎」までが混用され、町制時代の正式表記は「尼ヶ崎町」だった。ところが町の公文書はほぼ例外なく「尼崎町」と書かれていた。1916年の市制施行の際、町当局は信長・秀吉時代の古文書に「尼崎」とある例を引いて、これが本来の表記であると国に上申し、市名は「尼崎市」に決まった。それでも「尼ヶ崎」の表記は慣例として長く残り、平成の直木賞受賞小説『赤目四十八瀧心中未遂』（車谷長吉）は、作中の地名をすべて「尼ヶ崎」で統一している。
    sources:
    - k5-amagasaki-ndl-ref
  relations:
  - pref/28
  unknowns:
  - 「大物浜・長洲浜請文」自体の正確な成立年代（平安末か鎌倉初期か）には幅がある
  - 久安年間の「新出地」の記述以前に、この地が何と呼ばれていたかは不明
  updated: '2026-11-13'
- id: muni/28-明石市
  code: '282031'
  names:
    ja: 明石市
    reading: あかしし
    aliases:
    - 赤石
  user_terms:
  - 明石の名前の由来
  - 赤石と明石はどっちが古いの
  - 明るい土地という意味の地名なの
  - 子午線のまちの名前の由来
  naming_type: 一部の地名
  prefecture: 兵庫県
  homonyms: []
  summary: 市名は古代の明石郡・明石の地名の継承。『播磨国風土記』『日本書紀』では「赤石」と書かれ、『続日本紀』以降に「明石」の表記となった。語源には赤石の岩・明るい土地・赤磯（あかし）などの諸説があり定説はない。大正8年（1919年）に市制を施行した。
  first_attestation:
    era: 和銅6年ごろ
    year_western: 713
    document: 播磨国風土記
    note: 明石市立図書館の資料によれば、『播磨国風土記』と『日本書紀』は「赤石」の表記を用い、『続日本紀』以降は「明石」と表記する。風土記の成立は和銅6年（713年）ごろとされる
  claims:
  - text: 明石市の地方公共団体コードは282031である（総務省「地方公共団体コード一覧」による）
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  - text: 『播磨国風土記』と『日本書紀』では「赤石」と書かれ、『続日本紀』以降は「明石」の表記が用いられた
    kind: fact
    level: E2
    status: established
    sources:
    - k5-akashi-lib-digital
  - text: 明石市立図書館の郷土史資料の検討では、「赤石」は風土記の編纂にあたって好字を著けるよう命じられたことによる表記であり、「赤い石」に地名の由来を求めるのは無理があるとされる
    kind: fact
    level: E2
    status: contested
    sources:
    - k5-akashi-lib-digital
  - text: 明石市公式は地名の由来の諸説として、林崎松江海岸の沖に沈む「赤石」という岩の名から変化したとする説と、西の方から見ると明るい土地だったためとする説を紹介している
    kind: fact
    level: E2
    status: contested
    sources:
    - k5-akashi-city-aramashi
  - text: 日本大百科全書は、『明石市史』が赤みがかった土を指す「赤磯（あかし）」に由来するとしていることを紹介している
    kind: fact
    level: E3
    status: contested
    sources:
    - k5-akashi-kotobank-hyakka
  - text: 林崎松江海岸の沖に沈むという「赤石」には、男が鹿に乗って海を渡り、矢で射られた鹿が血で赤い岩になったという伝説が伝わっている
    kind: legend
    level: E2
    status: established
    sources:
    - k5-akashi-city-aramashi
  - text: 大正8年（1919年）11月1日に市制を施行して明石市が発足した（兵庫県内では4番目、当時の人口は約32,000人）
    kind: fact
    level: E2
    status: established
    sources:
    - k5-akashi-city-aramashi
  column:
    title: 歌枕であり、子午線の通るまち
    text: 「あかし」は早くから都の人々に知られた地名だった。『日本書紀』には大化の改新（645年）の際に畿内の西端を「赤石の櫛淵」と定めたとあり、柿本人麻呂をはじめとする歌人に詠まれ、『源氏物語』では明石巻の舞台となった。近代になると東経135度の日本標準時子午線が市内を通ることが知られるようになり、「子午線のまち」がもう一つの顔になった。古代の歌枕と近代の標準時とが、同じ地名の上に重なっている。
    sources:
    - k5-akashi-city-aramashi
  relations:
  - pref/28
  unknowns:
  - 語源は確定していない（赤石の岩・明るい土地・赤磯のいずれの説も決め手を欠く）
  - 林崎松江海岸沖で1987年に海底の石が確認されたと資料は伝えるが、その石と地名との関係は証明されていない
  updated: '2026-11-13'
- id: muni/28-神戸市
  code: '281000'
  names:
    ja: 神戸市
    reading: こうべし
    aliases:
    - 神戸村
    - 神戸区
    - かんべ
  user_terms:
  - 生田神社のまち
  - 兵庫津の隣の港町
  - 開港で育った港町
  naming_type: 一部の地名
  prefecture: 兵庫県
  homonyms: []
  summary: 市名は生田神社の神戸（かんべ）の集落名に由来する。神社に属して神社を支えた民戸の居住地が「神戸村」となり、1868年の開港で港町として発展し、1889年に神戸市が発足した。読みはもとの「かんべ」から「こうべ」へ変化した。
  first_attestation:
    era: 神功皇后摂政元年（伝承）
    year_western: null
    document: 『日本書紀』神功皇后条
    note: 生田神社の創祀を伝える記事で、神戸の地名伝承の起点とされる。ただし地名「神戸」そのものの文書上の初出ではなく、その年代は未確認である。
  claims:
  - text: 「神戸」の名称は生田神社の神戸（かんべ）に由来すると辞典類は解説する。神戸（かんべ）とは、神社に属して租・庸・調や雑役を神社に納めた民戸（神封戸）のことである。
    kind: fact
    level: E3
    status: established
    sources:
    - d-cap-kobe-kotobank
  - text: 神戸市の資料も、古代、神領で神社を支えていた家のことを「かんべ」（神戸）といい、神戸の地名は生田神社の「かんべ」に由来すると伝わると説明する。
    kind: fact
    level: E2
    status: established
    sources:
    - d-cap-kobe-ikuta
  - text: 地名の読みは、もとの「かんべ」から「かうべ」を経て、現在の「こうべ」へと変化した。
    kind: fact
    level: E3
    status: established
    sources:
    - d-cap-kobe-kotobank
  - text: 修好通商条約で開港が定められたのは兵庫津だったが、実際の開港場と外国人居留地は神戸村に置かれ、慶応3年12月7日（西暦1868年1月1日）に開港した。
    kind: fact
    level: E2
    status: established
    sources:
    - d-cap-kobe-port
    - d-cap-kobe-archives
  - text: 1879年の郡区制実施に伴い、兵庫・神戸に坂本村を加えた「神戸区」が置かれ、現在の神戸市の原型となる行政単位が形成された。
    kind: fact
    level: E2
    status: established
    sources:
    - d-cap-kobe-archives
  - text: 1889年4月1日、神戸区に荒田村と葺合村を加えて神戸市が誕生した。
    kind: fact
    level: E2
    status: established
    sources:
    - d-cap-kobe-archives
  - text: 開港前の神戸村は、現在の神戸市中央区の元町通三丁目から生田川へかけての一帯にあたる小さな村であった。
    kind: fact
    level: E4
    status: established
    sources:
    - d-cap-kobe-motomachi
  - text: 生田神社は、神功皇后により布引の滝付近にある砂山に祀られたことが始まりと『日本書紀』に記される伝承があり、799年の大洪水により砂山が崩壊したため、現在の地に移されたと伝えられる。
    kind: legend
    level: E2
    status: established
    sources:
    - d-cap-kobe-ikuta
  - text: 神戸市の地方公共団体コードは281000である。
    kind: fact
    level: E2
    status: established
    sources:
    - d-cap-jlis-hyogo
  column:
    title: 「神戸」は「かんべ」だった
    text: 「神戸」という字面からは「神の戸」を想像しがちだが、もとの読みは「かんべ」である。神社に属し、神社の維持にあたった家々を神戸（神封戸）といい、生田神社の神戸の集落がそのまま地名になった。読みは「かうべ」を経て「こうべ」に変わったが、字は古代の制度の名をそのまま残している。開港地として世界に知られるようになった港町の名前は、実は律令時代の神社の戸籍に由来する。
    sources:
    - d-cap-kobe-kotobank
    - d-cap-kobe-ikuta
  relations:
  - pref/28
  unknowns:
  - 地名「神戸」が文書に現れる初出の年代は、今回参照した市公式・辞典資料では特定できなかった。
  - 生田神社の神戸がどの程度の規模の集落をなし、いつ「神戸村」として定着したかなど、成立過程の詳細は未確認である。
  updated: '2026-11-13'
- id: muni/28-西宮市
  code: '282049'
  names:
    ja: 西宮市
    reading: にしのみやし
    aliases:
    - 西宮町
  user_terms:
  - 西宮の名前の由来
  - えべっさんの神社から来た地名
  - 広田神社と西宮の関係
  - 西宮はなぜ「西」の宮なのか
  naming_type: その他（神社名「西宮」の継承）
  prefecture: 兵庫県
  homonyms: []
  summary: 市名は西宮神社にちなむ。「西宮」はもともと式内社・広田神社とその摂社（戎社）を指す言葉で、最古の史料は元永2年（1119年）の『長秋記』に見える「西宮社」。神社を指した名が荘園・門前町へと広がり、やがて市名になった。大正14年（1925年）に市制を施行した。
  first_attestation:
    era: 元永2年
    year_western: 1119
    document: 長秋記（源師時）
    note: 広田社への参詣の際に「西宮社」に奉幣したとあるのが最古の史料で、この時点では地名ではなく神社（西宮神社）を指す。平安時代には広田神社そのものの別称としても「西宮」が使われた
  claims:
  - text: 西宮市の地方公共団体コードは282049である（総務省「地方公共団体コード一覧」による）
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  - text: 地名「西宮」は西宮神社にちなみ、その最古の史料は元永2年（1119年）の源師時『長秋記』で、広田社参詣の際に「西宮社」に奉幣した記事である
    kind: fact
    level: E3
    status: established
    sources:
    - k5-nishinomiya-kotobank-hyakka
  - text: 西宮社はもと式内社・広田神社の摂社（戎社）で、鎌倉時代以降に独立して発展した
    kind: fact
    level: E3
    status: established
    sources:
    - k5-nishinomiya-kotobank-hyakka
  - text: 『伊呂波字類抄』や『簾中抄』の段階では広田神社そのものが「西宮」と呼ばれるに至っており、「西宮」は当初は神社を指す言葉だった
    kind: fact
    level: E3
    status: established
    sources:
    - k5-nishinomiya-kotobank-hyakka
  - text: 廣田神社公式によれば、都から見て西方にある重要な神社であったため中世の貴族が広田神社を「西宮」と別称し、呼称が広田神郷（荘園）全体を指す地名となり、近世には戎社のある浜南宮周辺、すなわち旧西宮町の地名となった
    kind: fact
    level: E2
    status: established
    sources:
    - k5-hirota-jinja-yurai
  - text: 西宮神社の祭神は、鳴尾の沖で漁師の網にかかって引き上げられた神を祀ったことに始まるという伝承がある
    kind: legend
    level: E2
    status: established
    sources:
    - k5-nishinomiya-city-shoshi
  - text: 大正14年（1925年）4月1日に市制を施行して西宮市が発足した
    kind: fact
    level: E2
    status: established
    sources:
    - k5-nishinomiya-sakurafm
  column:
    title: 神社の名前がまちの名前になるまで
    text: 「西宮」が指す範囲は、時代とともに一段ずつ広がっていった。はじめは広田神社の摂社である戎社（西宮社）を指し、やがて広田神社そのものの別称として使われ、荘園である広田神郷全体の名となり、近世には戎社の門前にできた町の名になった。1925年に市制が施行されると、その町名がそのまま市名になる。神社の一社の名が、千年かけて一つの市の名に育った例である。
    sources:
    - k5-hirota-jinja-yurai
    - k5-nishinomiya-kotobank-hyakka
  relations:
  - pref/28
  unknowns:
  - 「西宮」の呼称が地名として定着した正確な時期は特定できない
  - 西宮社（戎社）の創建年代は不明
  updated: '2026-11-13'
- id: muni/29-奈良市
  code: '292010'
  names:
    ja: 奈良市
    reading: ならし
    aliases:
    - 奈良町
    - 平城
    - 南都
    - 那羅
  user_terms:
  - 平城京のあった市
  - 南都と呼ばれたまち
  - 古都奈良の中心
  naming_type: 一部の地名
  prefecture: 奈良県
  homonyms: []
  summary: 市名は古都「奈良」の地名の継承である。もとの「ナラ」の地は現在の京都府境の丘陵一帯だったと推測され、平城京・南都・奈良町を経て地域の名として定着し、1898年に奈良町へ市制が施行されて奈良市となった。「なら」の語源には地形説・古代朝鮮語説などの諸説がある。
  first_attestation:
    era: 崇神天皇の条（伝承）
    year_western: null
    document: 『日本書紀』崇神天皇条
    note: 「那羅山」の名が見える伝説的記事で、奈良市公式資料が「奈良のはじまり」として紹介する起点。年代を特定できる史実の初出ではない。「那良」の表記は『古事記』（712年）にも見える。
  claims:
  - text: 奈良市は1898年（明治31年）に奈良町へ市制が施行されて成立した。
    kind: fact
    level: E2
    status: established
    sources:
    - d-cap-nara-chiiki
  - text: 奈良町は1889年の市制町村制の施行により、添上郡のうち江戸時代以来の奈良各町と周辺の村々を合わせて成立した町である。
    kind: fact
    level: E2
    status: established
    sources:
    - d-cap-nara-chiiki
  - text: 記紀（『古事記』・『日本書紀』）など古代の文献の記述から、もともとの「ナラ」の地は今日の京都府との境に広がる丘陵一帯だったと推測でき、現在の奈良市の中心部とは位置がずれている。
    kind: fact
    level: E2
    status: established
    sources:
    - d-cap-nara-plan
  - text: 「ナラ」の語源には、古代人の住居に適したなだらかな丘陵地を意味する平地（なるじ）、平（なら）などの地形語に由来するとする説がある。
    kind: fact
    level: E2
    status: contested
    sources:
    - d-cap-nara-plan
    - d-cap-nara-genjo
  - text: 「ナラ」の語源には、渡来人の居住地を古代の朝鮮で国を意味する「ナラ」と名付けたことから起こったとする説もあり、奈良市自身も由来には諸説あると説明している。
    kind: fact
    level: E2
    status: contested
    sources:
    - d-cap-nara-plan
  - text: 「ナラ」には那羅・奈良・奈羅・楢・平城・乃楽・寧楽などの漢字があてられ、奈良時代の官用には主に「平城」と記述され、平安時代以降は「奈良」が広く用いられるようになった。
    kind: fact
    level: E2
    status: established
    sources:
    - d-cap-nara-genjo
  - text: 和銅3年（710年）に藤原京から平城京へ都が移され、70年あまりの間、平城京は古代日本の都として栄えた。
    kind: fact
    level: E2
    status: established
    sources:
    - d-cap-nara-ayumi
  - text: 都が移った後、奈良の町は平城京の「外京」と呼ばれる地域を中心に形成され、残された東大寺・興福寺などの門前に人が集まって「まち」ができ、のちに奈良は「南都」と呼ばれるようになった。
    kind: fact
    level: E2
    status: established
    sources:
    - d-cap-nara-naramachi
  - text: 『日本書紀』崇神天皇の条には、大彦命と彦国葺の軍が武埴安彦の軍を迎え撃つため陣を布いたとき、兵士たちが草木を踏みならしたので、その山を那羅山といったという伝説が載せられている。
    kind: legend
    level: E2
    status: established
    sources:
    - d-cap-nara-genjo
  - text: 奈良市の地方公共団体コードは292010である。
    kind: fact
    level: E2
    status: established
    sources:
    - d-cap-jlis-nara
  column:
    title: 「ナラ」のふるさとは、いまの市街地の北にある
    text: 奈良市の総合計画は、記紀の記述から、もともとの「ナラ」の地を「今日の京都府との境に広がる丘陵一帯」と推測している。平城京が置かれた盆地の中心より北、現在の奈良市の縁にあたる一帯である。名前はそこから南へ広がり、平城京、南都、奈良町を経て、市の名前になった。地名の原点と現在の中心がずれている、日本でも典型的な例の一つである。
    sources:
    - d-cap-nara-plan
    - d-cap-nara-naramachi
  relations:
  - pref/29
  unknowns:
  - 「ナラ」の語源は諸説あり定説はなく、本レコードでは奈良市の説明に沿って地形説と古代朝鮮語説を併記した。楢の木に由来する説は今回の市公式資料では確認できなかった。
  - もとの「ナラ」の範囲の推測は記紀の記述に基づくもので、考古学的な確定には至っていない。
  updated: '2026-11-13'
- id: muni/29-川上村
  code: '294527'
  names:
    ja: 川上村
    reading: かわかみむら
    aliases: []
  user_terms:
  - 川上村 吉野川の源流
  - 水源地の村
  - 後南朝の村
  naming_type: 合併新設
  prefecture: 奈良県
  homonyms:
  - muni/20-川上村
  summary: 吉野川（紀の川）の最上流部に位置する村で、日本歴史地名大系は「吉野川の川上の村」と位置づける。明治22年（1889年）に23村の区域をもって発足した。長野県の川上村とは「大河の最上流部」という命名の構造だけが共通し、川も歴史も無関係である。村には惟高親王の木地伝承、義経伝説、後南朝の史跡と伝承が濃く残る。
  first_attestation:
    era: 明治22年
    year_western: 1889
    document: 町村制施行による川上村の発足（1889年4月1日）
    note: 村名として確認できる初出。地域名としての「川上」の古い用例は未確認
  claims:
  - text: 日本歴史地名大系は川上村を「吉野川の川上の村」と位置づける。村名は吉野川の最上流部にあたる立地によるものである
    kind: fact
    level: E3
    status: established
    sources:
    - h6-kawakami-kotobank
  - text: 明治22年（1889年）4月1日、東川村・西河村・大滝村・寺尾村・北塩谷村・迫村・高原村・人知村・白屋村・井戸村・武木村・下多古村・上多古村・神之谷村・柏木村・北和田村・中奥村・上谷村・大迫村・伯母谷村・入之波村・白川渡村・碇村の23村の区域をもって川上村が発足した
    kind: fact
    level: E5
    status: established
    sources:
    - h6-kawakami-nara-wiki
  - text: 長野県の川上村も大河（千曲川）の最上流部の村であり、両村の名は「大きな川の川上（上流）」という普通名詞的な命名の構造を共有するが、対象の川も地域の歴史も無関係である（共通する層＝命名の構造のみ）
    kind: fact
    level: E3
    status: established
    sources:
    - h6-kawakami-kotobank
  - text: 村は吉野杉を育てる吉野林業の中心地で、村自身は吉野川源流の「水源地の村づくり」（川上宣言）を掲げている
    kind: fact
    level: E2
    status: established
    sources:
    - h6-kawakami-nara-wiki
    - h6-kawakami-nara-official
  - text: 木地師（轆轤師）の祖とされる惟高親王が、貞観9年（867年）に高原地区に入って木地の製法を教えたといわれている
    kind: legend
    level: E2
    status: established
    sources:
    - h6-kawakami-nara-official
  - text: 白屋地区には、もと「白谷」と称していた地名を、源義経が八幡神社に矢を奉納したことから「白矢」と改めたという言い伝えが残されている
    kind: legend
    level: E2
    status: established
    sources:
    - h6-kawakami-nara-official
  column:
    title: 南朝の夢を見続ける村
    text: 川上村は後南朝の舞台でした。村公式の歴史によれば、南北朝の合一後も皇位の約束を守られなかった南朝の皇子たちがこの山深い村に潜幸し、嘉吉3年（1443年）に崩御したとされます。その皇子・自天王を偲ぶ「朝拝式」は、560年あまり経った今も毎年2月5日に続いているといいます。吉野川の源流の村が、都から最も遠い場所で、都の記憶を最も長く守ってきた――「川上」という素朴な名の奥にある、もう一つの顔です。
    sources:
    - h6-kawakami-nara-official
  relations:
  - pref/29
  - muni/20-川上村
  unknowns:
  - 「川上」という地域名の初出（中世に吉野川上流部を指す呼称があったか）は未確認
  - 村内にある丹生川上神社上社の社名と村名の先後関係・影響関係は未確認
  updated: '2026-11-13'
- id: muni/29-川西町
  code: '293610'
  names:
    ja: 川西町
    reading: かわにしまち
    aliases:
    - 川西村
  user_terms:
  - 川西町の名前の由来
  - 奈良の川西町は結崎ネブカと貝ボタンの町
  - 面塚の伝説の町
  - 川西町は山形と奈良にある
  naming_type: その他
  prefecture: 奈良県
  homonyms:
  - muni/06-川西町
  summary: 明治22年（1889年）に結崎・下永・吐田・唐院・梅戸・保田の6村が合併して川西村が誕生し、昭和50年（1975年）4月に町制を施行して川西町となった。町は大和盆地のほぼ中央にあり、4つの河川が集まって大和川に注ぐ地点に位置するが、「川西」がどの川の西を指すのか、命名理由を記した町の公表資料は確認できなかった。「最上川の西側」と公式に明言する山形県川西町とは対照的に、由来未確認の同名地名である。
  first_attestation:
    era: 明治22年
    year_western: 1889
    document: 川西村の発足（町村制施行。川西町公式「町の歴史」）
    note: 自治体名としての「川西」の初出
  claims:
  - text: 明治22年（1889年）に結崎・下永・吐田・唐院・梅戸・保田の6ヶ村が合併して川西村が誕生し、昭和50年（1975年）4月に町制が施行されて川西町がスタートした
    kind: fact
    level: E2
    status: established
    sources:
    - h4-nara-kawanishi-rekishi
  - text: 町公式は、川西町が大和盆地のほぼ中央に位置し、4つの河川が一同に集結して大和川に注ぐ水辺の町であると説明する
    kind: fact
    level: E2
    status: established
    sources:
    - h4-nara-kawanishi-gaiyo
  - text: 「川西」がどの川の西側を指すのかは、町公式の歴史・概要の両ページに説明がなく、今回の調査では確認できなかった。町域の大部分は大和川の南にあたるため、単純な方位の名とも断定できない
    kind: fact
    level: E2
    status: indeterminate
    sources:
    - h4-nara-kawanishi-rekishi
    - h4-nara-kawanishi-gaiyo
  - text: 町内の面塚には「空から能面とネギが降ってきた」という伝説が残り、その能面を葬った場所とも考えられていると奈良県町村会は紹介する。伝説に残るネギは、現在は特産品「結崎ネブカ」として親しまれている
    kind: legend
    level: E4
    status: established
    sources:
    - h4-nara-chousonkai
  - text: 結崎は、観阿弥・世阿弥を輩出した「結崎座」をルーツとする能楽・観世流発祥の地と伝えられ、面塚には昭和11年（1936年）に観世流宗家による揮毫の「観世発祥之地」の碑が建てられたと奈良県町村会は紹介する
    kind: fact
    level: E4
    status: established
    sources:
    - h4-nara-chousonkai
  - text: 【異なる層】山形県川西町は「最上川の西側に位置することから、川西町と名づけられました」と町公式が由来を明示するのに対し、奈良県川西町は同名でありながら命名理由の公表資料が確認できず、由来の確かさで対照をなす
    kind: fact
    level: E2
    status: established
    sources:
    - h4-yamagata-kawanishi-gaiyo
    - h4-nara-kawanishi-rekishi
  column:
    title: 空から面とネギが降ってきた町
    text: 奈良の川西町には、空から能面とネギが降ってきたという伝説がある。面は面塚に葬られたとされ、ネギは「結崎ネブカ」として今も町の特産品だ。結崎は観阿弥・世阿弥を生んだ結崎座の本拠で、観世流発祥の地と伝えられる。町の名の由来は分からなくても、町の物語はこんなに豊かである。
    sources:
    - h4-nara-chousonkai
  relations:
  - pref/29
  - muni/06-川西町
  unknowns:
  - 「川西」の命名理由と、どの川の西を指すのかは、町の公表資料と地名辞典のオンライン抜粋では未確認（『日本歴史地名大系』奈良県巻や町史の確認が必要）
  - 1889年の合併前の各村（結崎・下永・吐田・唐院・梅戸・保田）の地名の由来は本バッチの対象外
  updated: '2026-11-13'
- id: muni/30-和歌山市
  code: '302015'
  names:
    ja: 和歌山市
    reading: わかやまし
    aliases:
    - 若山
  user_terms:
  - 紀州徳川家の城下町
  - 和歌浦のまち
  - 和歌山城のある市
  naming_type: その他
  prefecture: 和歌山県
  homonyms: []
  summary: 市名は和歌山城の城下町名の継承である。紀の川河口の漁村「若山」に豊臣秀長が築城した際、秀吉が名勝・和歌浦にちなんで「和歌山」と命名したと市の資料は伝える。紀州徳川家の城下町として栄え、1889年に旧城下町を継承する形で和歌山市が発足した。
  first_attestation:
    era: 天正13年
    year_western: 1585
    document: 羽柴秀吉書状（「和歌山」の初出として県・市の資料が紹介）
    note: 書状そのものは都道府県レコード（pref/30）側で市長コラム経由により確認しており、本レコードでは市の沿革資料の紹介による確認にとどまる。
  claims:
  - text: 紀の川河口に点在していた島々が出水のたびに流出される土砂によって陸続きとなり、そこに「若山」という小漁村が生まれた。
    kind: fact
    level: E2
    status: established
    sources:
    - d-cap-wakayama-tokei
  - text: 天正13年（1585年）、豊臣秀吉が紀伊の国を統一し、その命を受けた豊臣秀長が若山の中央部、吹上の峰（岡山、現在の虎伏山）に築城した。
    kind: fact
    level: E2
    status: established
    sources:
    - d-cap-wakayama-tokei
    - d-cap-wakayama-jo
  - text: 「和歌山」の命名については、秀吉は古代からの名勝地「和歌浦」にちなんで「和歌山」と命名したと和歌山市の沿革資料は説明し、和歌山県教育センターの郷土学習資料は、秀吉が和歌浦に相対する山に築くその城を「和歌山城」と命名したことに由来するといわれている、と伝える。
    kind: fact
    level: E2
    status: contested
    sources:
    - d-cap-wakayama-tokei
    - d-cap-wakayama-kyoiku
  - text: 命名のもととなった和歌浦は、城の築かれた山と相対する位置にある景勝地で、現在の市街地の南、和歌浦湾に面している。
    kind: fact
    level: E2
    status: established
    sources:
    - d-cap-wakayama-kyoiku
    - d-cap-wakayama-tokei
  - text: 元和5年（1619年）、徳川頼宣が紀州和歌山55万5千石で和歌山城に入城し、徳川御三家の一つ「紀州徳川家」の城下町として繁栄した。
    kind: fact
    level: E2
    status: established
    sources:
    - d-cap-wakayama-tokei
  - text: 明治22年（1889年）に市制町村制が実施され、旧城下町を継承する形で和歌山市が発足し、以後県庁所在地として発展した。
    kind: fact
    level: E2
    status: established
    sources:
    - d-cap-wakayama-fuchi
  - text: 市名「和歌山」は、城の名・城下町名として定着した名の継承であり、県名も同じ城下町名「和歌山」に由来する。
    kind: fact
    level: E2
    status: established
    sources:
    - d-cap-wakayama-tokei
  - text: 和歌山市公式は、日前宮や、神武東征神話で天皇の兄・彦五瀬命が死んだ湊といわれる雄ノ湊、その兄を葬ったと伝えられる竃山など、記紀神話の舞台が市内にたくさん見えるとしつつ、これらの神話は史実ではなく虚構の話であると明記している。
    kind: legend
    level: E2
    status: established
    sources:
    - d-cap-wakayama-ayumi
  - text: 和歌山市の地方公共団体コードは302015である。
    kind: fact
    level: E2
    status: established
    sources:
    - d-cap-jlis-wakayama
  column:
    title: 漁村「若山」に「和歌」を載せた命名
    text: もとの漁村の名前は「若山」だった。市の沿革資料によれば、秀吉は築城にあたって、古代以来の名勝「和歌浦」の「和歌」を採って「和歌山」と命名したという。歌枕として知られた景勝地の名声を、新しい城と町に移植する命名だった。この名は城下町から県へ、そして市へと受け継がれ、400年以上使われ続けている。
    sources:
    - d-cap-wakayama-tokei
    - d-cap-wakayama-kyoiku
  relations:
  - pref/30
  unknowns:
  - 秀吉による命名を直接示す同時代の命令文書は確認できておらず、命名の説明は市・県の資料が「伝える」形のものであるため、主張は contested とした。
  - 漁村「若山」の名自体の由来（「若の浦」との関係など）は、今回参照した資料では確認できなかった。
  updated: '2026-11-13'
- id: muni/30-広川町
  code: '303623'
  names:
    ja: 広川町
    reading: ひろがわちょう
    aliases:
    - 広町
    - 南広村
    - 津木村
  user_terms:
  - 和歌山の広川町の由来
  - 稲むらの火の広川町
  - 広川という川の名前の町
  naming_type: 合併新設
  prefecture: 和歌山県
  homonyms:
  - muni/40-広川町
  summary: 有田郡の町で、昭和30年（1955）に広町・南広村・津木村の合併で発足した。町の由来は公式に「旧三か町村を流れて海に注ぐ当地最大の河川『広川』の名称を採ったもの」と説明される、川名採用型の合併新名である。読みは1996年に「ひろかわちょう」から「ひろがわちょう」へ変更された。同名の福岡県広川町も川名にちなむが、そちらは1889年以来3村すべてが名乗った既存地名の継承であり、成立の仕組みが正反対に近い。
  first_attestation:
    era: 昭和30年
    year_western: 1955
    document: 広川町の発足（1町2村の合併、川名の採用）
    note: 町名としての初出は1955年の命名。川名「広川」自体はそれ以前からの河川名で、町域は古く「広庄」と呼ばれた
  claims:
  - text: 昭和30年（1955）4月1日に広町・南広村・津木村の1町2村が合併して広川町が発足した
    kind: fact
    level: E2
    status: established
    sources:
    - h5-hirogawa-wakayama-gaiyo
  - text: 町の由来について町は、旧三か町村を流れて海に注ぐ当地最大の河川「広川」の名称を採ったものと説明している
    kind: fact
    level: E2
    status: established
    sources:
    - h5-hirogawa-wakayama-gaiyo
  - text: 県の郷土学習資料も、3町村を通じて流れる広川の名前をとって町名を広川町に決定したと記す
    kind: fact
    level: E2
    status: established
    sources:
    - h5-wakayama-manabi-hirogawa
  - text: 『日本歴史地名大系』は広川を「全長20km、有田郡内2位の河川」と記す
    kind: fact
    level: E3
    status: established
    sources:
    - h5-hirogawa-kotobank
  - text: 町の概要によれば、文献では広川町全域は古代末期から中世初期にかけて「広庄」と呼ばれていた
    kind: fact
    level: E2
    status: established
    sources:
    - h5-hirogawa-wakayama-gaiyo
  - text: 1996（平成8）年に町名の読みが「ひろかわ」から「ひろがわ」に変更された
    kind: fact
    level: E3
    status: established
    sources:
    - h5-hirogawa-kotobank
  - text: 共通する層として、同名の福岡県広川町も「広川」という川の名にちなむ町名であり、両町とも町の中心地帯を同名の川が流れる
    kind: fact
    level: E2
    status: established
    sources:
    - h5-hirogawa-fukuoka-masterplan
  - text: 異なる層として、和歌山では合併前の自治体名に「広川」は一つもなく（広町・南広村・津木村）、川名を新たに町名に採ったのに対し、福岡では1889年以来、上・中・下の3村すべてが「広川」を名乗っており、町名は既存地名の継承である。また読みも和歌山は「ひろがわちょう」、福岡は「ひろかわまち」と異なる
    kind: fact
    level: E2
    status: established
    sources:
    - h5-hirogawa-fukuoka-enkaku
  - text: 地方公共団体情報システム機構（J-LIS）のコード一覧で、広川町の団体コードは303623とされている
    kind: fact
    level: E2
    status: established
    sources:
    - d-cap-jlis-wakayama
  column:
    title: 川の名前をもらった町、「稲むらの火」のふるさと
    text: 広川町は1955年に川の名前をもらって生まれましたが、その川のほとりの広村は、それより約100年前の1854年、安政の大地震と大津波の舞台でした。醤油職人の濱口梧陵は、津波から村人を逃がすため、刈り取ったばかりの稲むらに火を放って高台へ誘導したと伝えられ、小泉八雲が「稲むらの火」として世界に紹介しました。梧陵が私財を投じて築いた広村堤防は今も町に残ります。町名は新しいのに、土地の記憶は幕末にまで遡る。それが広川町の地名の二層構造です。
    sources:
    - h5-hirogawa-wakayama-goryo
    - h5-hirogawa-wakayama-gaiyo
  relations:
  - pref/30
  - muni/40-広川町
  unknowns:
  - 川名「広川」そのものの語源（川幅の広さに由来するか等）を記した資料は未確認
  - 中世の「広庄」の「広」と川名「広川」の関係は未確認
  updated: '2026-11-13'
- id: muni/30-日高町
  code: '303828'
  names:
    ja: 日高町
    reading: ひだかちょう
    aliases:
    - 内原村
    - 志賀村
    - 比井崎村
  user_terms:
  - 日高町 和歌山
  - 日高郡の日高町
  - 日高川の郡の日高
  naming_type: 合併新設
  prefecture: 和歌山県
  homonyms:
  - muni/01-日高町
  summary: 和歌山県日高郡の町。昭和29年（1954）に内原村・志賀村・比井崎村が合併し、「日高地方の中心的存在になるようにとの願いをこめて」日高町と命名された。その背後にある日高郡は古代律令制以来の郡名で、日高川という川の名も郡名による。明治新設の日高国に由来する北海道日高町とは、国名系と郡名系という対照をなす。
  first_attestation:
    era: 大宝3年
    year_western: 703
    document: 『続日本紀』（「飯高」として）
    note: 地元の郷土史料が紹介する形での確認で、原文は未読。天平宝字8年（764）の条には日高郡の文字があるとも紹介される
  claims:
  - text: 昭和29年（1954）に内原村・志賀村・比井崎村が合併して日高町が発足し、町名は「日高地方の中心的存在になるようにとの願いをこめて」命名された
    kind: fact
    level: E2
    status: established
    sources:
    - h2-hidaka-wakayama-manabi
  - text: 地元の郷土史料は、『続日本紀』大宝3年（703）の条に「飯高」（日高のこと）の名が見え、天平宝字8年（764）の条に日高郡の文字があると紹介する
    kind: fact
    level: E4
    status: established
    sources:
    - h2-hidaka-wakayama-chimei
  - text: 「日高」の語源は確定していない。『紀伊続風土記』は名義を「日の高く天の真秀に坐して照り輝く」と説明する一方、喜田貞吉は「ヒダ」を大和民族以外の人々を指す語、「カ」を所在地を示す語と解する説を唱えた
    kind: fact
    level: E3
    status: contested
    sources:
    - h2-kotobank-hidakagun
    - h2-hidaka-wakayama-chimei
  - text: 日高川の川名は、郡の名（日高郡）による。つまり郡名が先にあり、川の名がそれに付いた
    kind: fact
    level: E3
    status: established
    sources:
    - h2-kotobank-hidakagawa
  - text: 日高郡は紀伊国の郡として古代以来続き、現在も日高町・御坊市・美浜町・由良町・印南町・日高川町を含む郡として残る
    kind: fact
    level: E3
    status: established
    sources:
    - h2-kotobank-hidakagun
  - text: 同名の比較（異なる層）：和歌山の日高は古代の日高郡という郡名の継承であり、北海道の日高（明治2年・1869年に新設された日高国に由来する地方名）とは出発点が異なる。国名系（北海道）と郡名系（和歌山）の対照である
    kind: fact
    level: E2
    status: established
    sources:
    - h2-hidaka-wakayama-manabi
    - h2-hidaka-hok-gyokaku
  - text: 同名の比較（共通する層）：読みは北海道日高町と同じ「ひだかちょう」である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 郡の名が、川の名になり、町の名になった
    text: ふつう川の名が郡や町の名になるものだが、日高では順序が逆で、郡名「日高」が先にあり、日高川の名は郡名によるのだという。その日高川は、安珍・清姫の伝説と道成寺で知られる川でもある。1300年以上続く郡の名は、1954年の合併で町の名にもなった。「日高地方の中心に」という願いを込めた命名は、古代の郡名に新しい役割を与えたものだった。
    sources:
    - h2-kotobank-hidakagawa
    - h2-hidaka-wakayama-manabi
    - h2-kotobank-hidakagun
  relations:
  - pref/30
  - muni/01-日高町
  unknowns:
  - 「日高」の語源は未確定（紀伊続風土記の名義説明と喜田貞吉の語源説などがあり対立）
  - 『続日本紀』大宝3年条の「飯高」が日高を指すことは郷土史料の紹介による確認で、原文は未読
  updated: '2026-11-13'
- id: muni/30-美浜町
  code: '303810'
  names:
    ja: 美浜町
    reading: みはまちょう
    aliases:
    - 松原村
    - 和田村
    - 三尾村
  user_terms:
  - 和歌山の美浜町の由来
  - 煙樹ヶ浜のある美浜町
  - 公募で決まった町名 美浜
  naming_type: 合併新設
  prefecture: 和歌山県
  homonyms:
  - muni/18-美浜町
  - muni/23-美浜町
  summary: 日高郡の町で、昭和29年（1954）に松原村・和田村・三尾村の合併で誕生した。町名は一般公募により名付けられ、自慢の煙樹ヶ浜と松林を指す「美しい浜のある町」という願いが込められたことが、県の郷土学習資料に明記されている。同名の福井県・愛知県の美浜町と「美しい浜」型の命名で共通するが、公募の経緯が公的資料に残るのは3町のうち和歌山だけである。
  first_attestation:
    era: 昭和29年
    year_western: 1954
    document: 公募による命名と美浜町の発足（3村の合併・町制施行）
    note: 町名は合併時の公募で新たに付けられたもので、名前の初出は命名そのもの
  claims:
  - text: 1954（昭和29）年10月1日に松原村・和田村・三尾村の3村が合併して、美浜町が誕生した
    kind: fact
    level: E2
    status: established
    sources:
    - h2-hidaka-wakayama-manabi
  - text: 町名はその時に一般公募により名付けられた
    kind: fact
    level: E2
    status: established
    sources:
    - h2-hidaka-wakayama-manabi
  - text: 命名には、地域の誰もが自慢とする煙樹ヶ浜と松林を指して「美しい浜のある町」という町民の願いが込められた
    kind: fact
    level: E2
    status: established
    sources:
    - h2-hidaka-wakayama-manabi
  - text: 共通する層として、同名の福井県美浜町・愛知県美浜町も1954〜55年の合併で生まれた新設町であり、3町はいずれも「美しい浜」にちなむ命名と説明される
    kind: fact
    level: E2
    status: established
    sources:
    - h5-fukui-mihama-70th
    - h5-aichi-mihama-gaiyo
  - text: 異なる層として、命名が公募だったことと、その理由（煙樹ヶ浜への願い）が県の郷土学習資料に明記されている点で、命名理由の説明が分かれたり選定過程が未確認だったりする福井・愛知の美浜町と、記録の残り方が異なる
    kind: fact
    level: E2
    status: established
    sources:
    - h2-hidaka-wakayama-manabi
  - text: 総務省の全国地方公共団体コードで、美浜町の団体コードは303810と定められている
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 「美しい浜のある町」を、町民の願いとして公募した
    text: 和歌山の美浜町の名前は、1954年の合併のときに一般公募で決まりました。県の郷土学習資料は、町民が自慢とする煙樹ヶ浜と松林を挙げ、「美しい浜のある町 美浜町」という願いを込めた名付けだったと伝えています。同名の美浜町が全国に3つある中で、なぜその名にしたのかを公募の言葉で説明できるのはこの町だけです。煙樹ヶ浜は今も松林が続く町の象徴で、名前と風景がそのまま重なっています。
    sources:
    - h2-hidaka-wakayama-manabi
  relations:
  - pref/30
  - muni/18-美浜町
  - muni/23-美浜町
  unknowns:
  - 公募の応募総数・候補名・選考経過を示す一次記録（町史・合併協議会記録）の確認は未了
  - 三尾地区の「アメリカ村」（カナダ移民の歴史）と町名の関係の有無は未確認（町名は煙樹ヶ浜に由来するとされ、移民史との直接の結びつきは資料にない）
  updated: '2026-11-13'
- id: muni/31-南部町
  code: '313891'
  names:
    ja: 南部町
    reading: なんぶちょう
    aliases: []
  user_terms:
  - 南部町の名前の由来
  - 南部町はなぜ南部という名前
  - 西伯町と会見町が合併した町
  naming_type: 合併新設
  prefecture: 鳥取県
  homonyms:
  - muni/02-南部町
  - muni/19-南部町
  summary: 2004年に西伯町と会見町が合併して発足した新名。町議会の公式概要は「南部」という名称について、古くから周辺地域一帯の住民に親しまれた由緒ある地域名であることと、「南」の字の暖かいイメージが新町の方向性に合致したことを理由として明記する。南部氏とは無関係で、青森県・山梨県の南部町とは由来を異にする。
  first_attestation:
    era: 平成16年
    year_western: 2004
    document: 自治体名としての「南部町」（西伯町・会見町合併による）
    note: 地域名としての「南部」の古い用例や指していた範囲は、確認した公式資料では示されず未確認
  claims:
  - text: 2004年10月1日に西伯町と会見町が合併して南部町が誕生した
    kind: fact
    level: E2
    status: established
    sources:
    - h3-tottori-gaiyo
  - text: 町議会の概要は「『南部』という名称は、古くからこの周辺地域一帯の住民にも親しまれ、歴史的にも文化的にも伝統と由緒ある名称であるとともに、南の文字が持つ暖かいイメージが新町の方向性と合致しています」と説明する
    kind: fact
    level: E2
    status: established
    sources:
    - h3-tottori-gikai
  - text: 青森県・山梨県の南部町の「南部」が南部氏に由来するのに対し、本町の「南部」は合併前の両町を含む周辺地域の旧来の地域名を新町名に採用したもので、氏族名とは別系統である
    kind: fact
    level: E2
    status: established
    sources:
    - h3-tottori-gikai
    - h3-yamanashi-yukari
  - text: 読みは青森県・山梨県の南部町と同じ「なんぶちょう」で、3町は読みまで一致するが、由来は一致しない
    kind: fact
    level: E2
    status: established
    sources:
    - h3-tottori-gikai
    - b-cap-chiba-soumu-code
  - text: 総務省「地方公共団体コード一覧」では本町のコードは313891とされる
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 「南」の字が持つ暖かさ
    text: 新町名の理由に「南の文字が持つ暖かいイメージ」を挙げるのは、平成期の合併新名としては率直な部類です。古くから親しまれた地域名という由緒と、字のイメージという2つの理由が公式資料に併記されている点が、この町の命名の記録として特徴的です。
    sources:
    - h3-tottori-gikai
  relations:
  - pref/31
  - muni/02-南部町
  - muni/19-南部町
  unknowns:
  - 「南部」という地域名が具体的にいつ頃から、どの範囲を指して使われたか
  - 合併協議会での新町名の候補一覧と選定過程の詳細
  updated: '2026-11-13'
- id: muni/31-日野町
  code: '314021'
  names:
    ja: 日野町
    reading: ひのちょう
    aliases: []
  user_terms:
  - 日野町 日野郡の町
  - 根雨と黒坂の合併した町
  - 日野川の町
  naming_type: 合併新設
  prefecture: 鳥取県
  homonyms:
  - muni/25-日野町
  summary: 昭和34年（1959年）に根雨町と黒坂町が合併して生まれた町で、町名は所属する郡の名「日野郡」を採ったもの。「日野」の名自体は『出雲国風土記』にまで遡るとされる古い地名で、郡名・日野川の名として受け継がれてきた。滋賀県の日野町が地名そのものを中世から継承してきたのとは経路が異なる。日野川の語源は諸説あり定まっていない。
  first_attestation:
    era: 天平5年
    year_western: 733
    document: 出雲国風土記（仁多郡条）
    note: 「日野」の地名の史料上の初見とされるもの（日野町の解説による二次的な紹介）。言及される範囲は現在の町域と必ずしも一致しない
  claims:
  - text: 「日野」の地名の史料上の初見は『出雲国風土記』（733年）とされ、仁多郡の条で言及されている。その後『倭名類聚抄』には、日野郡の一郷として記載されている
    kind: fact
    level: E5
    status: established
    sources:
    - h6-hino-tottori-wiki
  - text: 昭和34年（1959年）5月1日、日野郡根雨町・黒坂町が合併して日野町が発足した。町名は郡名「日野」をそのまま自治体名にした形である
    kind: fact
    level: E5
    status: established
    sources:
    - h6-hino-tottori-wiki
  - text: 日野川の語源は定説がなく、『出雲国風土記』大原郡斐伊郷条にある樋速日子命の故事から、国境の鳥髪山（船通山）を境に、出雲国を流れるのが斐伊川、伯耆国を流れるのが日野川だとする説がある。日野川は「簸之川」とも書かれた
    kind: fact
    level: E5
    status: contested
    sources:
    - h6-hinogawa-wiki
  - text: 日野神社の所在地や日野氏の居住地に由来する説もあるが、『日野郡史』によると川の名前が先であることが明白で、この説の信憑性は低いとされる
    kind: fact
    level: E5
    status: contested
    sources:
    - h6-hinogawa-wiki
  - text: 滋賀県日野町は中世の「日野御牧」以来の地名を町名として継承してきたのに対し、鳥取県日野町は1959年に郡名を採用して命名された町であり、「日野」の名の継承経路が異なる（異なる層）
    kind: fact
    level: E5
    status: established
    sources:
    - h6-hino-tottori-wiki
    - h6-hino-shiga-keikaku
  - text: ヤマタノオロチが住む「ひの川」は、島根県の斐伊川ではなく鳥取県の日野川だという説が伝えられている
    kind: legend
    level: E5
    status: established
    sources:
    - h6-hinogawa-wiki
  column:
    title: 二つの「ヒの川」と一つの郡名
    text: 鳥髪山（船通山）という国境の山を挟んで、西へ流れれば「斐伊川」、東へ流れれば「日野川」。どちらも読みの頭は「ヒ」で、語源をたどると『出雲国風土記』の樋速日子命の故事に行き着くという説があります。日野町という町名は1959年の合併で生まれた新しい名ですが、その材料になった郡名「日野」は、風土記の時代からこの地域に貼りついてきた古い名です。新しく作られた町名と、千年以上続く地名の、二層構造になっています。
    sources:
    - h6-hinogawa-wiki
    - h6-hino-tottori-wiki
  relations:
  - pref/31
  - muni/25-日野町
  unknowns:
  - 日野郡・日野川の名の由来は諸説のままで、確定できる資料は未確認
  - 『出雲国風土記』仁多郡条の「日野」への言及箇所の原文確認は未実施
  updated: '2026-11-13'
- id: muni/31-鳥取市
  code: '312011'
  names:
    ja: 鳥取市
    reading: とっとりし
    aliases: []
  user_terms:
  - 鳥取の名前の由来
  - 鳥取砂丘のある市の名前
  - 因幡の城下町の名前
  naming_type: 藩名
  prefecture: 鳥取県
  homonyms: []
  summary: 市名は鳥取藩の城下町・鳥取町を引き継ぐ。「鳥取」は因幡国邑美郡の古代郷名で、久松山麓の平野部にいた鳥取部（ととりべ）という職業集団に由来すると市は説明する。明治22年（1889年）10月1日に市制を施行し、平成16年（2004年）の合併で現在の鳥取市となった。
  first_attestation:
    era: 承平年間
    year_western: null
    document: 和名類聚抄
    note: 因幡国邑美郡の郷名「鳥取」の記載。鳥取市公式資料の紹介経由で参照し、原文は未読。職業集団としての鳥取部そのものは、それ以前の『日本書紀』に説話として見える
  claims:
  - text: 鳥取市の地方公共団体コードは312011である（総務省「全国地方公共団体コード」市区町村コード一覧による）
    kind: fact
    level: E2
    status: established
    sources:
    - e-cap-soumu-code-list
  - text: 「鳥取」は因幡国邑美郡鳥取郷という古代の郷名に由来し、『倭名抄（和名類聚抄）』に記載された郷名が中世・近世・近代へと受け継がれてきたと鳥取市は説明する
    kind: fact
    level: E2
    status: established
    sources:
    - e-tottori-city-history
    - e-cap-wamyosho
  - text: 鳥取郷は久松山麓一帯の平野部であったと考えられ、この地に「鳥取部」という古代の部民（職業集団）がいたことが郷名の由来といわれている
    kind: fact
    level: E2
    status: established
    sources:
    - e-tottori-city-history
  - text: 鳥取は江戸時代、鳥取藩池田家32万石の城下町として栄えた
    kind: fact
    level: E2
    status: established
    sources:
    - e-cap-tottori-city-enkaku
  - text: 鳥取市は明治22年（1889年）10月1日に市制を施行した
    kind: fact
    level: E2
    status: established
    sources:
    - e-cap-tottori-city-enkaku
    - e-tottori-city-history
  - text: 平成16年（2004年）11月1日、国府町・福部村・河原町・用瀬町・佐治村・気高町・鹿野町・青谷町との合併により、人口20万人を超える新「鳥取市」が誕生した
    kind: fact
    level: E2
    status: established
    sources:
    - e-tottori-city-history
    - e-cap-tottori-city-enkaku
  - text: 『日本書紀』垂仁天皇の条には、言葉を発しなかった誉津別王（本牟智和気御子）が白鳥を見て初めて声を上げ、天湯河板挙がその鳥を追って捕らえた功により鳥取造の姓を賜り鳥取部が定められた、という起源説話が記されている
    kind: legend
    level: E2
    status: established
    sources:
    - e-hannan-city-tottori
    - e-cap-nihonshoki
  column:
    title: 郷・城下町・市が同じ場所で重なる鳥取
    text: 鳥取の名前は、移動していない。古代の鳥取郷は久松山麓一帯の平野部にあったと鳥取市は説明するが、その同じ山麓に戦国期の鳥取城が築かれ（天正元年・1573年に山名豊国が天守櫓を築いて「城下町鳥取」が生まれたと市の沿革は記す）、江戸時代には池田家32万石の城下町が広がった。古代の郷名が、城下町名・藩名・県名を経て、そのまま市名として現在の中心市街地に残っている例であり、名前と場所が一緒に千年以上受け継がれてきたことが鳥取の地名の特徴である。
    sources:
    - e-tottori-city-history
    - e-cap-tottori-city-enkaku
  relations:
  - pref/31
  unknowns:
  - 鳥取郷の正確な範囲（久松山麓一帯の平野部とされるが、郷域を特定できる一次文書は確認していない）
  - 『日本書紀』の白鳥説話と因幡国鳥取郷の成立を直接結ぶ同時代資料は確認できておらず、両者の関係は未確認（県レコード pref/31 と同じ論点）
  updated: '2026-11-13'
- id: muni/32-出雲市
  code: '322032'
  names:
    ja: 出雲市
    reading: いずもし
    aliases:
    - 出雲町
  user_terms:
  - 出雲の名前の由来
  - 八雲立つってどういう意味
  - 出雲の名付け親はスサノオなの
  - 出る雲という意味の地名なの
  naming_type: 一部の地名
  prefecture: 島根県
  homonyms: []
  summary: 市名は古代の国名・郡名「出雲」の継承。年代の分かる初見は持統天皇6年（692年）の鰐淵寺の造像銘に見える「出雲国」で、由来そのものは記されていない。『出雲国風土記』は八束水臣津野命の「八雲立つ」を、記紀はスサノオの歌を命名と結びつけるが、語源は未確定。昭和16年（1941年）に市制を施行した。
  first_attestation:
    era: 持統天皇6年
    year_western: 692
    document: 鰐淵寺銅造観音菩薩立像台座銘
    note: 島根県古代文化センターの研究員が、年代の分かる「出雲」の初見として挙げる壬辰年（692年）の造像銘で、「出雲国」とある。藤原宮跡出土の木簡にも「出雲評」と見える。いずれも由来そのものは記されていない
  claims:
  - text: 出雲市の地方公共団体コードは322032である（総務省「地方公共団体コード一覧」による）
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  - text: 年代の分かる「出雲」の初見は、壬辰年（692年）造立の鰐淵寺銅造観音菩薩立像の台座銘に見える「出雲国」で、藤原宮跡出土の木簡にも「出雲評」とある
    kind: fact
    level: E2
    status: established
    sources:
    - k5-izumo-kodai-center
  - text: 『出雲国風土記』（天平5年・733年成立）の総記は、国引きの神である八束水臣津野命が「八雲立つ出雲」と言ったことが国名の由来であるとする
    kind: legend
    level: E2
    status: established
    sources:
    - e-shimane-pref-fudoki
    - k5-izumo-kodai-center
  - text: 一方、『古事記』『日本書紀』では、スサノオが須我の地で雲の立つのを見て「八雲立つ 出雲八重垣」の歌を詠んだことが命名と結びつけられており、古典の間でも命名の主が異なる
    kind: legend
    level: E2
    status: established
    sources:
    - k5-izumo-kodai-center
  - text: 「出る雲」の意とする解釈は江戸時代以来の通説だが研究者には異論もあり、島根県の観光案内は夕つ方説・五面（いつも）説・アイヌ語説・外国地名説・厳藻（いつも）説などの諸説を列挙している
    kind: fact
    level: E2
    status: indeterminate
    sources:
    - k5-izumo-kodai-center
    - k5-izumo-kankou-navi
  - text: 昭和16年（1941年）2月11日に今市町など9町村が合併して出雲町が発足し、同年11月3日に出雲町が市制を施行して出雲市となった
    kind: fact
    level: E4
    status: established
    sources:
    - k5-izumo-uub
  - text: 平成17年（2005年）3月22日に旧出雲市・平田市・大社町・佐田町・多伎町・湖陵町が新設合併して現在の出雲市が発足し、平成23年（2011年）10月1日に斐川町を編入した
    kind: fact
    level: E2
    status: established
    sources:
    - k5-izumo-city-koho
  column:
    title: 名付け親が本によって違う
    text: 「出雲」の名付け親は、読む本によって違う。中央で編まれた『古事記』『日本書紀』では須我の地に立ったスサノオ、その地の国造が編んだ『出雲国風土記』では国引きの神・八束水臣津野命である。ただし、どちらの物語も核にあるのは「八雲立つ」という言葉で、雲の立つ土地というイメージは共通している。島根県古代文化センターの研究員は、この食い違い自体が、出雲という名の古さと重みを物語るとみている。
    sources:
    - k5-izumo-kodai-center
  relations:
  - pref/32
  unknowns:
  - 語源は確定していない（「出る雲」説が通説だが異論があり、実証されていない）
  - 692年の造像銘以前に「出雲」の名がいつ成立したかは不明
  updated: '2026-11-13'
- id: muni/32-松江市
  code: '322016'
  names:
    ja: 松江市
    reading: まつえし
    aliases: []
  user_terms:
  - 松江の名前の由来
  - 松江城の城下町の名前
  - 宍道湖のほとりの市の名前
  - 松山と間違えやすい市の名前
  naming_type: 新規命名
  prefecture: 島根県
  homonyms: []
  summary: 市名は慶長16年（1611年）、堀尾吉晴が亀田山に松江城を築き、中世以来の町場だった白潟と末次を合わせて「松江」と称したことに始まると松江市は説明する。ただし命名を記した根本史料は残っておらず、命名者や「唐の松江」にあやかったとする由来には諸説があり、市の史料調査も定説はないと結論づけている。愛媛県の松山市とは読みが似るが、成立の事情はまったく異なる。
  first_attestation:
    era: 慶長16年
    year_western: 1611
    document: 松江城の完成に伴う城下町の命名（松江市公式「生いたち」）
    note: 命名の出来事としての初出。命名そのものを記した同時代の根本史料は確認されておらず、命名の伝えは『懐橘談』（1653年）などの近世史料による
  claims:
  - text: 松江市の地方公共団体コードは322016である（総務省「全国地方公共団体コード」市区町村コード一覧による）
    kind: fact
    level: E2
    status: established
    sources:
    - e-cap-soumu-code-list
  - text: 松江市公式サイトは、地名の由来は慶長16年（1611年）に堀尾吉晴が亀田山に城を築き、白潟と末次の二つの郷をあわせて松江と称したことにはじまると説明する
    kind: fact
    level: E2
    status: established
    sources:
    - e-cap-matsue-city-gaiyo
  - text: 命名を記した根本的な史料は残っておらず、『松江市史』でも名称由来は特段取り上げられておらず、定説はないと松江市の史料調査コラムは整理している
    kind: fact
    level: E2
    status: established
    sources:
    - e-cap-matsue-city-chosa26
  - text: 松江藩儒・黒澤石斎が承応2年（1653年）に書いた『懐橘談』は、白潟と末次を併せたこの地が唐の松江に地形が似て鱸魚（すずき）・蓴菜（じゅんさい）が多いことから、先の国守・堀尾忠氏が富田城から城を移して「松江」と名付けた、と伝える
    kind: fact
    level: E2
    status: contested
    sources:
    - e-cap-matsue-city-chosa26
    - e-cap-kaikitsudan
  - text: 命名者については近世史料の間で一致せず、『懐橘談』の堀尾忠氏のほか、小瀬甫庵とするもの、堀尾吉晴の命を受けた圓城寺開山・春龍和尚とする『雲陽誌』などがあり、諸説が併存する
    kind: fact
    level: E2
    status: contested
    sources:
    - e-cap-matsue-city-chosa26
  - text: 開府以前から「松江」という言葉が見えたとする説もあり、『太平記』などに「松江」の表記があるが、それが地名ではなく形容詞だという見方もあり、城下町以前の地名としての「松江」の存在は確定していない
    kind: fact
    level: E2
    status: indeterminate
    sources:
    - e-cap-matsue-city-chosa26
  - text: 城下町に取り込まれた白潟（意宇郡）と末次（島根郡）は中世以来の町場・港町で、新しい城下町はこの水陸の要衝を併せる形で形成された
    kind: fact
    level: E2
    status: established
    sources:
    - e-cap-matsue-city-chosa26
  - text: 松江市は明治22年（1889年）4月に市制を施行した（当時の市域は4.78平方キロメートル、人口は35,513人だった）
    kind: fact
    level: E2
    status: established
    sources:
    - e-cap-matsue-city-gaiyo
  - text: 平成17年（2005年）3月31日に八束郡の7町村と、平成23年（2011年）8月1日に東出雲町と合併し、現在の市域となった
    kind: fact
    level: E2
    status: established
    sources:
    - e-cap-matsue-city-gaiyo
  - text: 愛媛県松山市（まつやま）とは読みが似るが別の自治体であり、「松江」が堀尾氏の城下町命名に由来するのに対し、「松山」は加藤嘉明が名付けた城名に由来するなど、成立の事情は異なる
    kind: fact
    level: E2
    status: established
    sources:
    - e-cap-matsue-city-gaiyo
    - e-cap-matsuyama-city-riyu
  column:
    title: 命名者は誰か ― 定説のない「松江」
    text: 「松江」の命名をめぐっては、市の史料調査担当者が近世史料と明治以降の著述を総ざらいしても、なお定説にたどり着かなかった。藩儒の『懐橘談』は堀尾忠氏が「唐の松江」に似た地形と鱸・蓴菜の産することから名付けたとし、別の史料は小瀬甫庵や和尚・春龍の命名とし、藩儒・桃節山にいたっては「古くから唱えられた名をこの時に城下の称号として定めたのだろう。疑いを残して博識の君子を待つ」と結んでいる。松江市の調査コラムもこの節山の留保に妥当性を見ており、堀尾吉晴が新しい城下町に当時の「中国風好み」を取り入れて命名した可能性が高いとしつつ、旧来の呼称の拾い上げも否定できないとする。大きな城下町の名前でさえ、命名の一次史料が残らないことがあるという好例である。
    sources:
    - e-cap-matsue-city-chosa26
  relations:
  - pref/32
  - muni/38-松山市
  unknowns:
  - 命名者（堀尾吉晴・忠氏・忠晴のいずれか、小瀬甫庵、春龍和尚など）と命名の正確な年次を決める同時代史料は確認できていない
  - 開府以前の「松江」の用例（『太平記』『大江広元日記』とされるもの）が地名を指すかどうかは未確認で、大江広元日記については市の調査でも確認できていない
  - コラムの材料は市の調査コラムに依拠しており、近世史料そのものは未読である
  updated: '2026-11-13'
- id: muni/32-津和野町
  code: '325015'
  names:
    ja: 津和野町
    reading: つわのちょう
    aliases: []
  user_terms:
  - 津和野の名前の由来
  - なぜ山陰の小京都というの
  - 津和野城と吉見氏 亀井氏
  - 津和野町はいつ合併したの
  naming_type: 合併新設
  prefecture: 島根県
  homonyms: []
  summary: 現在の津和野町は2005年に旧津和野町と日原町が合併して生まれ、町名は旧津和野町の名を継承した。津和野は中世に吉見氏の城下として開け、江戸時代は亀井氏の城下町として「山陰の小京都」と呼ばれる町並みを育んだ。「津和野」の語源については、専門辞典・町の資料のいずれでも確定した説明を確認できず、語源未詳として記録する。
  first_attestation:
    era: 文明2年
    year_western: 1470
    document: 弘中武長書状（益田家文書）
    note: 「津和野」の用例を日本歴史地名大系が紹介するもの。津和野は中世の吉賀郡野々郷の範囲に比定される
  claims:
  - text: 2005年（平成17年）9月25日、旧津和野町と日原町が合併して現在の津和野町が誕生し、町名は旧津和野町の名を継承した。町役場は旧日原町役場に置かれた（地方公共団体コードは325015）
    kind: fact
    level: E2
    status: established
    sources:
    - k6-tsuwano-town-keikaku
    - b-cap-chiba-soumu-code
  - text: 1955年（昭和30年）1月10日、津和野町・畑迫村・木部村と小川村の一部が合併して、新しい津和野町が発足した
    kind: fact
    level: E2
    status: established
    sources:
    - e-shimane-pref-chimeikan
    - k6-tsuwano-town-keikaku
  - text: 1889年（明治22年）の町村制施行により、鹿足郡津和野町が発足した
    kind: fact
    level: E2
    status: established
    sources:
    - k6-tsuwano-town-keikaku
  - text: 津和野は中世の吉賀郡野々郷の範囲に比定され、「津和野」の用例として文明2年（1470年）の益田家文書（弘中武長書状）が確認できると日本歴史地名大系は紹介する
    kind: fact
    level: E3
    status: established
    sources:
    - k6-tsuwano-kotobank
  - text: 鎌倉時代、弘安5年（1282年）に吉見頼行が下って館を構え、永仁3年（1295年）から城（三本松城、のちの津和野城）の築城を始めた。吉見氏は14代・319年にわたってこの地を治めた
    kind: fact
    level: E2
    status: established
    sources:
    - k6-tsuwano-town-dai1syou
  - text: 江戸時代には元和3年（1617年）に亀井氏が入城し、山あいの盆地に城下町が整備された。津和野は森鷗外・西周らを輩出し、「山陰の小京都」と呼ばれる
    kind: fact
    level: E2
    status: established
    sources:
    - k6-tsuwano-town-dai1syou
  - text: 「津和野」という地名の語源については、町の計画資料・島根県の地名鑑・日本歴史地名大系のいずれにおいても確定した説明を確認できず、現時点では語源未詳とする
    kind: fact
    level: E3
    status: indeterminate
    sources:
    - k6-tsuwano-kotobank
    - e-shimane-pref-chimeikan
  column:
    title: 京都から山口を経て、山あいの城下へ——鷺舞が運んだ都の文化
    text: 津和野の初夏を彩る鷺舞は、京都・祇園祭の舞楽が山口へ伝わり、さらに戦国時代の当主・吉見正頼の頃に津和野へ移されたものと町は伝える。都の祭りの芸能が二段階の伝播を経て、中国山地の小さな城下に根づいた。その町並みと文化の蓄積が「山陰の小京都」の呼び名を生み、近代には森鷗外や西周のような人材を送り出した。語源は謎のままでも、町の名が背負った文化の履歴ははっきりしている。
    sources:
    - k6-tsuwano-town-dai1syou
  relations:
  - pref/32
  unknowns:
  - 「津和野」の語源（津＋和野等の字面解釈を含む）は専門資料で確認できず未詳。和名類聚抄など古代の郡郷名との対応も未確認
  - 1470年より古い「津和野」の用例の有無は未確認
  - 1889年発足時の町域と中世の城下の範囲の正確な対応は未確認
  updated: '2026-11-13'
- id: muni/32-美郷町
  code: '324485'
  names:
    ja: 美郷町
    reading: みさとちょう
    aliases: []
  user_terms:
  - 美郷町の名前の由来
  - 島根の美郷町は江の川の町
  - 美郷町は秋田と島根と宮崎にある
  naming_type: 合併新設
  prefecture: 島根県
  homonyms:
  - muni/05-美郷町
  - muni/45-美郷町
  summary: 平成16年（2004年）10月1日に邑智町と大和村が合併して誕生した新名。町公式は、両町村を貫く江の川と中国山地の織りなす風景が「ふるさとの原風景」を思い起こさせることから、自然豊かな美しい故郷をいつまでも残したいという住民の願いと、「みさと」という響きの温もりを命名の理由に挙げる。秋田県・宮崎県の美郷町と願いは共通するが、根拠とする川と山はそれぞれの土地のものである。
  first_attestation:
    era: 平成16年
    year_western: 2004
    document: 美郷町の発足（2004年10月1日）
    note: 自治体としての発足をもって名称の初出とする。合併協議における選定過程の一次記録は未確認
  claims:
  - text: 平成16年（2004年）に邑智郡の邑智町と大和村が合併して美郷町が誕生した。町章も同じ平成16年10月に制定されている
    kind: fact
    level: E2
    status: established
    sources:
    - h4-shimane-misato-gaiyo
  - text: 町公式は町名の由来として、合併前の2町村を江の川が貫流し、その両岸に中国山地が織りなす四季折々の豊かな自然と美しい街並みが広がる様子が、日本の古き良きふるさとの原風景を思い起こさせることを挙げる
    kind: fact
    level: E2
    status: established
    sources:
    - h4-shimane-misato-gaiyo
  - text: 「美郷（みさと）」には、この自然豊かな美しい故郷（ふるさと）をいつまでも残しておきたいという住民の願いが込められており、「みさと」という響きが持つ温もりも、人情豊かなこの地域をよく表すものとして新町の名称に決定された理由とされる
    kind: fact
    level: E2
    status: established
    sources:
    - h4-shimane-misato-gaiyo
  - text: 【共通する層】秋田県・宮崎県の美郷町も平成の大合併の新名で、「美しい故郷でありたい」という願いを込めた命名という点は共通する
    kind: fact
    level: E2
    status: established
    sources:
    - h4-akita-gappei-kiroku
    - h4-shimane-misato-gaiyo
  - text: 【異なる層】島根の公式説明は江の川と中国山地という固有の風景に根ざし、「みさと」の音の温もりまで理由に含める点に特徴がある。秋田のような公募・投票による選定の記録は、公表資料では確認できない
    kind: fact
    level: E2
    status: established
    sources:
    - h4-shimane-misato-gaiyo
    - h4-akita-gappei-kiroku
  column:
    title: 響きまで理由に入った名前
    text: 島根の美郷町の公式説明が面白いのは、意味だけでなく「みさと」という響きの温もりまで命名理由に数えていることだ。江の川の両岸に広がる原風景を「いつまでも残したい」という願いと、音の柔らかさ。平成の大合併では各地で新しい町名が作られたが、ここまで音の印象を表に出して説明する例は珍しい。
    sources:
    - h4-shimane-misato-gaiyo
  relations:
  - pref/32
  - muni/05-美郷町
  - muni/45-美郷町
  unknowns:
  - 合併協議会での名称選定過程（公募の有無・対抗候補など）の公表資料は未確認
  - 旧邑智町・大和村それぞれの地名の由来は本バッチの対象外で未確認
  updated: '2026-11-13'
- id: muni/33-倉敷市
  code: '332020'
  names:
    ja: 倉敷市
    reading: くらしきし
    aliases:
    - 倉鋪
    - 蔵鋪
    - 蔵敷
  user_terms:
  - 倉敷の名前の由来
  - 倉敷地って何
  - 倉庫の集まる町から来た地名
  - 倉敷は岡山にしかない地名なの
  naming_type: その他（物資集積地を意味する普通名詞「倉敷地」の固有地名化）
  prefecture: 岡山県
  homonyms: []
  summary: 市名は、年貢米などの物資の集積地を意味する一般語「倉敷地」が固有地名化したものとされる。地名としての初出は永禄9年（1566年）の日記に見える「くらしき」で、当時すでに瀬戸内の湊だった。現在の倉敷市は昭和42年（1967年）に旧倉敷市・児島市・玉島市が合併して発足した。
  first_attestation:
    era: 永禄9年
    year_western: 1566
    document: 新見庄庄使入足日記（教王護国寺文書）
    note: 『日本歴史地名大系』が紹介する用例で、9月29日の条に「くらしき」より塩飽（しわく）までの舟賃150文が見え、この頃には瀬戸内航路の湊として存在していたとされる
  claims:
  - text: 倉敷市の地方公共団体コードは332020である（総務省「地方公共団体コード一覧」による）
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  - text: 「倉敷」の語源は、物資の集積地を意味する一般語「倉敷地」の略称が固有地名化したものとする説が有力で、「倉敷地」とは荘園の年貢などを集めて積み出すために蔵が建ち並んだ土地を指した
    kind: fact
    level: E2
    status: contested
    sources:
    - k5-kurashiki-tocotoco
    - k5-kurashiki-kibinavi
  - text: 中世末期の史料には「倉鋪」「蔵鋪（敷）」などの表記が見え、天正8年（1580年）と推定される小早川隆景の書状には「蔵敷在番之儀」とある
    kind: fact
    level: E3
    status: established
    sources:
    - k5-kurashiki-kotobank-chimei
  - text: 倉敷の中心にある鶴形山は、古くは内倉島・亀居島・東亀島と呼ばれる海中の島だったと『日本歴史地名大系』は伝える
    kind: fact
    level: E3
    status: established
    sources:
    - k5-kurashiki-kotobank-chimei
  - text: 備後国尾道の大田庄の倉敷地のように、荘園の年貢の積み出しのために「倉敷」が置かれた港は各地にあり、「倉敷」がもとは普通名詞だったことを裏づけている
    kind: fact
    level: E3
    status: established
    sources:
    - k5-onomichi-kotobank-chimei
  - text: 昭和3年（1928年）4月1日に旧倉敷市が市制を施行し、昭和42年（1967年）2月1日に旧倉敷市・児島市・玉島市が新設合併して現在の倉敷市が発足した
    kind: fact
    level: E2
    status: established
    sources:
    - k5-okayama-pref-enkaku
  column:
    title: もう一つの「倉敷」は名を譲った
    text: 「倉敷」という地名は備中だけのものではなかった。美作国英田郡（現在の美作市林野）にも、吉野川の川舟による物資の集散地として栄えた倉敷地があり、古代の林野郷の地に倉敷村、やがて倉敷町が生まれた。同名の町が並立し、郵便の誤配など混同も伝えられるなか、美作の倉敷町は大正時代に古代の郷名だった「林野」へ町名を改めた。こうして「倉敷」の名は備中に残り、美作の倉敷は「林野」として今に伝わる。
    sources:
    - k5-kurashiki-kotobank-chimei
    - k5-kurashiki-kibinavi
  relations:
  - pref/33
  - muni/34-尾道市
  unknowns:
  - 「倉敷地」という普通名詞がいつ固有地名「倉敷」として定着したかの正確な時期は定かでない
  - 美作の倉敷町が林野町へ改称した正確な年月日（1918年4月1日と伝える資料はあるが、専門資料での裏付けは未確認）
  updated: '2026-11-13'
- id: muni/33-岡山市
  code: '331007'
  names:
    ja: 岡山市
    reading: おかやまし
    aliases: []
  user_terms:
  - 岡山の名前の由来
  - 岡山城・烏城のある市の名前
  - 桃太郎の市の名前の意味
  naming_type: 藩名
  prefecture: 岡山県
  homonyms: []
  summary: 市名は岡山藩の城下町・岡山に由来する。「岡山」はもともと現在の岡山城のある小高い丘の名で、宇喜多秀家がその丘に岡山城を築いて城下町を広げるにつれて町全体の名となり、藩名・市名・県名へと広がった。岡山市は明治22年（1889年）6月1日に市制を施行した。
  first_attestation:
    era: 文禄3年
    year_western: 1594
    document: 宇喜多秀家書状
    note: 「岡山」が城下町の地名として呼ばれ始めた時期の推測とされる年（県レコード pref/33 と同じ扱い）。丘の名としての「岡山」の文書上の初出は特定できていない
  claims:
  - text: 岡山市の地方公共団体コードは331007である（総務省「全国地方公共団体コード」市区町村コード一覧による）
    kind: fact
    level: E2
    status: established
    sources:
    - e-cap-soumu-code-list
  - text: 「岡山」は、もともと現在の岡山城のある場所に存在した小高い丘を指して呼んだ名であった
    kind: fact
    level: E2
    status: established
    sources:
    - e-okayama-city-yuraihi
  - text: 戦国時代、岡山の西隣の石山にあった石山城を元亀元年（1570年）に宇喜多直家が手に入れ、天正元年（1573年）に同城へ移って本拠とした
    kind: fact
    level: E2
    status: established
    sources:
    - e-okayama-city-yuraihi
    - e-okayama-city-jouhistory
  - text: 宇喜多秀家は豊臣秀吉の指示により旭川の流れを変え、石山の東の岡山へ本丸を移して岡山城の築城と本格的な城下町の建設を進めた
    kind: fact
    level: E2
    status: established
    sources:
    - e-okayama-city-yuraihi
  - text: 岡山城の天守閣は慶長2年（1597年）に完成し、築城の後、城は「岡山城」、城下町は「岡山」の呼称が定着した
    kind: fact
    level: E2
    status: established
    sources:
    - e-okayama-city-yuraihi
    - e-okayama-city-jouhistory
  - text: 岡山市は明治22年（1889年）6月1日に市制を施行した
    kind: fact
    level: E2
    status: established
    sources:
    - e-cap-okayama-city-hensen
  - text: 吉備の鬼ノ城で悪事を働いた異国の王子・温羅を、朝廷から派遣された吉備津彦命が成敗したという温羅伝説は、桃太郎伝説のモデルになったと言われている
    kind: legend
    level: E2
    status: established
    sources:
    - e-okayama-pref-pr
  column:
    title: 三つの丘から一つの市名へ
    text: 岡山の城下は、岡山・石山・天神山という三つの小高い丘にまたがって造られた。その中で町の代表名に選ばれたのは、本丸が置かれた「岡山」だった。丘の名が城の名になり、城下町全体の名になり、藩の名になり、明治22年（1889年）の市制ではそのまま市名になった。最初は旭川沿いの一つの丘を指す言葉にすぎなかったものが、川の流路を付け替えるほどの築城工事を経て、70万人都市の名前になったのである。
    sources:
    - e-okayama-city-yuraihi
    - e-okayama-city-jouhistory
  relations:
  - pref/33
  unknowns:
  - 丘の名としての「岡山」の文書上の初出は今回特定できていない
  - 「岡山」が城下町名として使われ始めた時期を文禄3年（1594年）ごろとする推測は、秀家の書状に基づくとされるが、書状そのものは未確認
  updated: '2026-11-13'
- id: muni/34-呉市
  code: '342025'
  names:
    ja: 呉市
    reading: くれし
    aliases:
    - 呉浦
    - 呉保
  user_terms:
  - 呉の名前の由来
  - くれの語源
  - 九つの嶺という意味の地名なの
  - 軍港のまちの名前はいつからあるの
  naming_type: 一部の地名
  prefecture: 広島県
  homonyms: []
  summary: 市名は中世の港「呉浦」「呉保」の継承。初見は永暦元年（1160年）の文書に見える「安摩庄呉浦」とされるが、1158年の「呉別符」を挙げる紹介もある。語源には九嶺説・榑（くれ）木説・呉人説があるがいずれも確証はない。明治35年（1902年）に市制を施行した。
  first_attestation:
    era: 永暦元年
    year_western: 1160
    document: 美福門院令旨（高野山文書）
    note: 6月28日付の令旨に「安摩庄呉浦事」と見えるのが『日本歴史地名大系』の挙げる初見。ただし保元3年（1158年）の官宣旨に石清水八幡宮寺領「呉別符」が見えるとして、より早い初見を挙げる紹介もある
  claims:
  - text: 呉市の地方公共団体コードは342025である（総務省「地方公共団体コード一覧」による）
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  - text: 『日本歴史地名大系』によれば、「呉」の初見は永暦元年（1160年）6月28日付の美福門院令旨（高野山文書）に見える「安摩庄呉浦」である
    kind: fact
    level: E3
    status: established
    sources:
    - k5-kure-kotobank-chimei
  - text: 一方、下向井龍彦「中世の呉」（『呉の歴史』2002年）は、保元3年（1158年）12月3日の官宣旨に石清水八幡宮寺領の「呉別符」が見えることを挙げ、地名大系の挙げる1160年より早い初見とする
    kind: fact
    level: E4
    status: contested
    sources:
    - k5-kure-blog-chimei
  - text: 元暦2年（1185年）正月9日付の源頼朝下文（石清水文書）には「安芸国呉保」とあり、中世の呉は浦・保として荘園の記録に残された
    kind: fact
    level: E3
    status: established
    sources:
    - k5-kure-kotobank-chimei
  - text: 語源には、灰ヶ峰を中心とする九つの嶺に囲まれるため「九嶺（くれ）」とする説、灰ヶ峰から切り出された船材の榑（くれ）木に由来する説、渡来人の呉人に起因する説があるが、いずれも確証はない
    kind: fact
    level: E3
    status: indeterminate
    sources:
    - k5-kure-kotobank-chimei
  - text: 読み「くれ」は康応元年（1389年）の『鹿苑院殿厳島詣記』に確認できる
    kind: fact
    level: E3
    status: established
    sources:
    - k5-kure-kotobank-chimei
  - text: 明治35年（1902年）10月1日に市制を施行して呉市が発足した（呉市は2002年10月1日に市制施行100周年を迎えた）
    kind: fact
    level: E2
    status: established
    sources:
    - k5-kure-city-nenpyo
  column:
    title: 浦から保へ、港から軍港へ
    text: 平安時代末の文書に現れる「呉浦」は、安芸の海に面した小さな浦だった。やがて石清水八幡宮の荘園「呉保」となり、中世を通じて港として記録され続ける。明治に入って海軍鎮守府が置かれると、この港は軍港都市へと一変し、1902年に市制を施行した。まちの姿は激変したが、「呉」という地名そのものは800年以上、同じ読みのまま受け継がれている。
    sources:
    - k5-kure-kotobank-chimei
    - k5-kure-city-nenpyo
  relations:
  - pref/34
  unknowns:
  - 初見が1158年（呉別符）か1160年（呉浦）かは、依拠する資料により異なる
  - 語源は確定していない（九嶺・榑木・呉人のいずれの説も確証を欠く）
  updated: '2026-11-13'
- id: muni/34-尾道市
  code: '342050'
  names:
    ja: 尾道市
    reading: おのみちし
    aliases:
    - 尾道浦
    - 尾道村
  user_terms:
  - 尾道の名前の由来
  - 山の尾の道という意味なの
  - 倉敷地があった港町の名前
  - 尾道という町は昔からあったの
  naming_type: 一部の地名
  prefecture: 広島県
  homonyms: []
  summary: 市名は中世の港「尾道浦」の継承。初出は永保元年（1081年）の西国寺文書に見える「尾道浦」で、12世紀後半に大田庄の倉敷地が置かれて港町として発展した。語源は「山の尾の道」説など諸説あるが定説はない。明治31年（1898年）に広島県内で2番目に市制を施行した。
  first_attestation:
    era: 永保元年
    year_western: 1081
    document: 西国寺文書（備後州御調郡尾道浦摩尼山西国寺由来之記）
    note: 『日本歴史地名大系』と尾道市教育委員会『尾道の歴史と遺跡 中世編』が一致して挙げる初出で、「尾道浦」と見える
  claims:
  - text: 尾道市の地方公共団体コードは342050である（総務省「地方公共団体コード一覧」による）
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  - text: 「尾道」の初出は永保元年（1081年）の西国寺文書に見える「尾道浦」である
    kind: fact
    level: E2
    status: established
    sources:
    - k5-onomichi-kyoii
    - k5-onomichi-kotobank-chimei
  - text: 仁安3年（1168年）の高野山文書には御調南条庄内の尾道村が見え、この頃に大田庄の倉敷（倉敷地）が尾道に設置されて港町として発展した
    kind: fact
    level: E3
    status: established
    sources:
    - k5-onomichi-kotobank-chimei
  - text: 尾道市公式は、嘉応元年（1169年）に備後大田荘の公認の船津倉敷地となり、荘園米の積み出し港となって以来、港町として繁栄したと紹介している
    kind: fact
    level: E2
    status: established
    sources:
    - k5-onomichi-city-gaiyo
  - text: 語源は定説がなく、「山の尾の道」とする説、入り江の水路である澪（みお）の道とする説（司馬遼太郎が唱えたとされる比較的新しい説）、尾道水道に由来する説などが紹介されている
    kind: fact
    level: E4
    status: indeterminate
    sources:
    - k5-onomichi-kibinavi
  - text: 明治31年（1898年）4月1日に市制を施行して尾道市が発足した（広島県内では広島市に次いで2番目）
    kind: fact
    level: E2
    status: established
    sources:
    - k5-onomichi-city-gaiyo
  column:
    title: 町なのに実在しなかった「尾道」
    text: 江戸時代の尾道は、久保町・十四日町・土堂町などに分かれた港町の総称で、「尾道」という単独の町や大字は存在しなかった。呼び名だけが港町全体を指す言葉として生き続け、明治になって自治体名としてよみがえる。1889年に尾道町が置かれ、1898年には市名となった。地図の上に単独の町としてはなくても、人々の口の上では何百年も実在し続けた地名である。
    sources:
    - k5-onomichi-kibinavi
  relations:
  - pref/34
  - muni/33-倉敷市
  unknowns:
  - 語源は確定していない（諸説を裏づける中世史料はない）
  - 「尾道浦」の「尾道」がもともと何を指したのか（陸の道か海の水道か）は不明
  updated: '2026-11-13'
- id: muni/34-広島市
  code: '341002'
  names:
    ja: 広島市
    reading: ひろしまし
    aliases: []
  user_terms:
  - 広島の名前の由来
  - 毛利輝元が名付けた市の名前
  - デルタの島という意味の市の名前
  - 福島と広島の名前の関係
  naming_type: 藩名
  prefecture: 広島県
  homonyms: []
  summary: 市名は広島藩の城下町・広島に由来する。もとは太田川デルタの五ケ浦・五ケ村と呼ばれた地で、天正17年（1589年）に毛利輝元が築城に着手した際に「広島」と命名した。語源には大江広元の「広」と福島元長の「島」を合わせたとする説と、デルタの島々に由来する説があり、県は諸説があるとしている。広島市は明治22年（1889年）4月に市制を施行した。
  first_attestation:
    era: 天正17年
    year_western: 1589
    document: 広島城築城に伴う毛利輝元の命名（広島市公式年表）
    note: 命名の出来事としての初出で、広島市公式年表は天正17年（1589年）4月とする。命名を直接記した同時代文書は今回特定できていない。なお築城地の旧称「五ケ浦」は応永4年（1397年）の文書に見える
  claims:
  - text: 広島市の地方公共団体コードは341002である（総務省「全国地方公共団体コード」市区町村コード一覧による）
    kind: fact
    level: E2
    status: established
    sources:
    - e-cap-soumu-code-list
  - text: 天正17年（1589年）4月、毛利輝元が五ケ（五ケ村）で築城に着手し、この地を「広島」と命名した
    kind: fact
    level: E2
    status: established
    sources:
    - e-cap-hiroshima-city-nenpyo
    - e-hiroshima-city-history
  - text: 命名の由来の一説として、毛利氏の祖先である大江広元の「広」と、この地の戦国時代の武士である福島元長の「島」を合わせたものとする説が紹介されている
    kind: fact
    level: E2
    status: contested
    sources:
    - e-hiroshima-pref-profile
  - text: もう一つの説として、広くデルタの島々が合わされたという自然の地形に由来するとする説があり、広島県は諸説があるとしている
    kind: fact
    level: E2
    status: contested
    sources:
    - e-hiroshima-pref-profile
  - text: 「島」の由来とされる福島元長は戦国時代の地元の武士であり、関ヶ原の戦いの後に広島の領主となった福島正則とは別人で、正則の広島城入城は慶長6年（1601年）のことで、天正17年の命名には関与し得ない
    kind: fact
    level: E2
    status: established
    sources:
    - e-hiroshima-pref-profile
    - e-cap-hiroshima-city-nenpyo
  - text: 築城以前、この地は五ケ浦・五ケ村と呼ばれ、応永4年（1397年）に五ケ浦の地名が文書（厳島神社文書）にあらわれる
    kind: fact
    level: E2
    status: established
    sources:
    - e-cap-hiroshima-city-nenpyo
    - e-hiroshima-city-history
  - text: 築城地は太田川が運んだ土砂で形成されたデルタで、砂洲や自然堤防の上に漁撈を主業とする人々が生活を営んでいた
    kind: fact
    level: E2
    status: established
    sources:
    - e-hiroshima-city-history
  - text: 広島市は明治22年（1889年）4月に市制を施行した（当時の人口は8万3,387人）
    kind: fact
    level: E2
    status: established
    sources:
    - e-cap-hiroshima-city-nenpyo
  column:
    title: 五ケ浦から広島へ ― デルタに生まれた城下町
    text: 「広島」の舞台は、太田川が瀬戸内海に注ぐ河口のデルタだった。築城前、この一帯は五ケ浦・五ケ村と呼ばれ、砂洲の上に漁撈を営む人々が暮らしていた。毛利輝元が1589年にここへ築城し「広島」と命名したことで、五つの集落の地は一つの城下町として再出発する。市名の由来をめぐるもう一つの説が「デルタの島々」に名前の起源を求めるのも、この土地の成り立ちを考えれば自然な発想である。つまり広島という名は、合成説を採るにせよ地形説を採るにせよ、川が運んだ土の上に新しく築かれた町の名として生まれた。
    sources:
    - e-cap-hiroshima-city-nenpyo
    - e-hiroshima-city-history
  relations:
  - pref/34
  unknowns:
  - 1589年の命名を直接記した同時代の一次文書は今回特定できておらず、命名の経緯は後世の伝えによる
  - 大江広元＋福島元長の合成説とデルタ地形説のどちらが正しいかは、資料上決められない（県レコード pref/34 と同じ論点）
  updated: '2026-11-13'
- id: muni/34-府中市
  code: '342084'
  names:
    ja: 府中市
    reading: ふちゅうし
    aliases:
    - 府中町
  user_terms:
  - 広島の府中の名前の由来
  - 備後国府があった市
  - 府中市はなぜ2つあるの
  naming_type: その他（国府所在地を指す普通名詞的地名の継承）
  prefecture: 広島県
  homonyms:
  - muni/13-府中市
  summary: 市名は、8世紀ごろに備後国府が置かれ、備後国の政治・経済・文化の中心であったことに由来すると市は説明する。長らく国府の存在は推定の域を出なかったが、発掘調査の裏づけが進み、備後国府跡は平成28年（2016年）に国の史跡となった。昭和29年（1954年）3月31日に芦品郡府中町と周辺5村が合併して市制を施行し、東京都府中市の成立（翌4月1日）より1日早く生まれた。
  first_attestation:
    era: 承平年間（931〜938年）
    year_western: null
    document: 和名類聚抄
    note: 文化庁が「和名類聚抄に国府在とみえる葦田郡に属するため国府所在地と推定されてきた」と紹介する、国府所在地推定の文献上の根拠。「府中」の語そのものの初出ではない
  claims:
  - text: 府中市公式プロフィールは、市名の由来を、8世紀ごろにこの地に備後国府が置かれ、備後国の政治・経済・文化の中心であったことに求めている
    kind: fact
    level: E2
    status: established
    sources:
    - h1-fuchu-hiroshima-profile
  - text: 文化庁は、備後国府について、和名類聚抄に国府在とみえる葦田郡に属するため国府所在地と推定されており、昭和42年度（1967年度）以降の発掘調査によって考古学的な裏づけが与えられたと紹介している
    kind: fact
    level: E2
    status: established
    sources:
    - h1-bingo-kokufu-db
  - text: 備後国府跡は平成28年（2016年）に国の史跡に指定されたが、国府の中心建物である国庁はまだ見つかっておらず、元町に所在したと推定されている
    kind: fact
    level: E2
    status: established
    sources:
    - h1-fuchu-hiroshima-roots
  - text: 昭和29年（1954年）3月、芦品郡府中町と岩谷村など周辺5村（計6カ町村）が合併して市制を施行し府中市が誕生した。その後、平成16年（2004年）に甲奴郡上下町を編入合併した
    kind: fact
    level: E2
    status: established
    sources:
    - h1-fuchu-hiroshima-youran
    - h1-jk-chimei-61
  - text: （共通する層）東京都府中市とは読み・表記が同一で、ともに律令制の国府（こちらは備後国府、相手は武蔵国府）の所在地に由来する「府中」である点で共通する
    kind: fact
    level: E3
    status: established
    sources:
    - h1-jk-chimei-61
  - text: （異なる層）両市の成立は広島県府中市が1954年3月31日、東京都府中市が翌4月1日と1日違いであり、全国で表記が同一の市名は府中市と伊達市の2組だけであると日本歴史地名大系ジャーナルは指摘する
    kind: fact
    level: E3
    status: established
    sources:
    - h1-jk-chimei-61
  - text: （府中町との関係）同じ広島県内にある府中町（安芸郡）は、同じ「府中」でも安芸国府に由来する別の系譜の地名であり、備後国府に由来するこの府中市とは国も成立事情も異なる
    kind: fact
    level: E2
    status: established
    sources:
    - h1-fuchucho-outline
    - h1-fuchucho-kotobank
  - text: 備後国府跡の一角は、その地に吉田寺があったという伝承に基づき「伝吉田寺地区」と呼ばれ、令和元年（2019年）に史跡の追加指定を受けた
    kind: legend
    level: E2
    status: established
    sources:
    - h1-fuchu-hiroshima-roots
  column:
    title: 掘って確かめた国府
    text: 備後国府は、和名類聚抄の記述と「府中」という地名が残ることから、長らく「この辺りにあったはずだ」と推定されてきた存在でした。それが変わったのは発掘調査が本格化してからで、昭和42年（1967年）以降の継続的な発掘が文献の記述を裏づけ、平成28年（2016年）に備後国府跡は国の史跡になりました。ただし中心建物の国庁はいまだ見つかっておらず、元町にあったと推定される段階です。地名が先に残り、遺跡が後から追いついた、という順序そのものが、この町の由来の面白さです。
    sources:
    - h1-bingo-kokufu-db
    - h1-fuchu-hiroshima-roots
  relations:
  - pref/34
  - muni/13-府中市
  - muni/34-府中町
  unknowns:
  - 備後国庁の正確な位置（元町に所在したと推定されるが未発見）
  - 「府中」という語の文献上の初出の特定は未了
  - 国府が置かれた正確な時期（市公式は「8世紀ごろ」とする）
  updated: '2026-11-13'
- id: muni/34-府中町
  code: '343021'
  names:
    ja: 府中町
    reading: ふちゅうちょう
    aliases:
    - 府中村
  user_terms:
  - 府中町は国府と関係があるの
  - 安芸国府はどこにあった
  - 広島市に囲まれた町
  naming_type: その他（国府所在地を指す普通名詞的地名の継承）
  prefecture: 広島県
  homonyms: []
  summary: 町名は、昔この地に安芸国の国府が置かれていたところといわれることに由来し、古代安芸国の政治文化の中心地であったと考えられている。ただし安芸国府の当初の所在地については、もともと府中にあったとする説と、最初は東広島市西条にあり後に移ったとする説が対立している。自治体としては江戸時代の府中村の区域をほぼ引き継ぎ、明治22年（1889年）に府中村、後に町制を施行して府中町となった。両府中市とは表記は違うが、「国府→府中」という同じ命名の系譜にある。
  first_attestation:
    era: 承平年間（931〜938年）
    year_western: null
    document: 和名類聚抄（和名抄）
    note: 府中町の教育資料が「和名抄の記載から、少なくとも平安中期には府中に国府があったことが分かる」と紹介するもの。ただし国府の当初所在地には西条説があり、位置づけは対立を含んでいる
  claims:
  - text: 府中町公式は、府中という名が示すように、昔この地に安芸の国府が置かれていたところといわれ、古代安芸国の政治文化の中心地であったと思われると説明している
    kind: fact
    level: E2
    status: established
    sources:
    - h1-fuchucho-outline
  - text: 安芸国府の所在地については、もともと府中にあったという説と、最初は東広島市の西条にあり後に府中へ移ったという説があり、府中町の教育資料も両説を併記している
    kind: fact
    level: E2
    status: contested
    sources:
    - h1-fuchucho-edu
  - text: 府中町の教育資料は、『和名抄』の記載から、少なくとも平安中期から府中に国府があったことが分かると述べている
    kind: fact
    level: E2
    status: established
    sources:
    - h1-fuchucho-edu
  - text: 日本歴史地名大系は広島県の府中町を「もと安芸国府の地」と解説し、広島市に囲まれた町であるとしている
    kind: fact
    level: E3
    status: established
    sources:
    - h1-fuchucho-kotobank
  - text: 府中町は周囲を広島市に囲まれ、安芸郡の飛び地という全国的にも特徴のある形態をしており、町域は江戸時代の府中村とほぼ同じ区域のまま明治22年（1889年）の町村制施行により府中村となり、後に町制を施行して府中町となった
    kind: fact
    level: E2
    status: established
    sources:
    - h1-fuchucho-outline
  - text: （両府中市との関係）表記は「府中町」で両府中市と異なるが、由来する国府は安芸国府であり、武蔵国府（東京都府中市）・備後国府（広島県府中市）とは別の国の国府である。3者はいずれも「国府の所在地＝府中」という同じ命名の系譜に属する
    kind: fact
    level: E2
    status: established
    sources:
    - h1-fuchucho-outline
    - h1-jk-chimei-61
  - text: 町域を通っていた古代の官道（山陽道）の峠道には、畑賀から府中の安芸駅へ向かう途中の甲越峠が「国府越え」の意味の名であると町の教育資料は伝えている
    kind: legend
    level: E2
    status: established
    sources:
    - h1-fuchucho-edu
  column:
    title: 広島市に囲まれた、国府の町
    text: 府中町は、四方を広島市に囲まれた安芸郡の飛び地という、全国でも珍しい形をした町です。県庁所在地の大都市にすっぽり囲まれながら独立した町であり続けている背景には、古代に安芸国の国府が置かれた中心地だったという、この土地の格があります。町内の峠道「甲越峠」は「国府越え」に由来する名と伝えられ、駅家だった安芸駅の記憶とともに、国府への道の名残を残しています。東京都府中市・広島県府中市とは字も読みも似ていますが、こちらは安芸国府の府中。一つの県の中に、別々の国に由来する「府中」が2つあることになります。
    sources:
    - h1-fuchucho-outline
    - h1-fuchucho-edu
  relations:
  - pref/34
  - muni/13-府中市
  - muni/34-府中市
  unknowns:
  - 安芸国府の当初所在地は西条説と府中説が対立し未決着であり、国庁の具体的な位置も未確認
  - 町制施行の年（昭和12年・1937年とする紹介が多い）について、町公式資料での一次確認は未了
  - 安芸駅（駅家）の正確な位置は未確認
  updated: '2026-11-13'
- id: muni/34-福山市
  code: '342076'
  names:
    ja: 福山市
    reading: ふくやまし
    aliases: []
  user_terms:
  - 福山の名前の由来
  - 水野勝成が名付けた城下町
  - 蝙蝠山と福山の関係
  - 福山という地名はいつできたの
  naming_type: 新規命名
  prefecture: 広島県
  homonyms: []
  summary: 市名は元和年間に水野勝成が築いた福山城の城下町名に由来する新規の命名。勝成は元和5年（1619年）に備後へ入封し、福山城とともに「福山」の町を興した。命名の由来には蝙蝠山の「蝠」が「福」に通じるとする説などがあり、地名大系は「寿山福海」の嘉名によるものとみる。大正5年（1916年）に市制を施行した。
  first_attestation:
    era: 元和5年
    year_western: 1619
    document: 水野勝成による命名（『日本歴史地名大系』「福山市」の解説による）
    note: 福山市公式の広報は、元和8年（1622年）に福山城を築き「この地を福山と名付けました」と説明する。命名の年次は、入封・築城着手の1619年と城の完成した1622年とで資料により見かけ上ずれる
  claims:
  - text: 福山市の地方公共団体コードは342076である（総務省「地方公共団体コード一覧」による）
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  - text: 元和5年（1619年）に水野勝成が備後10万石の領主として入封し、その後福山城を築いて城下町を形成し、この地を「福山」と名付けた
    kind: fact
    level: E2
    status: established
    sources:
    - k5-fukuyama-city-ayumi
    - k5-fukuyama-kotobank-chimei
  - text: 福山市公式の広報は、元和8年（1622年）に福山城を築き「この地を福山と名付けました」と説明し、2022年を「『福山』というまちが誕生して400年」と位置づけている
    kind: fact
    level: E2
    status: established
    sources:
    - k5-fukuyama-city-koho
  - text: 命名の由来の一説として、城を築いた蝙蝠山（常興寺山）の「蝠」の字が「福」に通じるためとする説が紹介されている
    kind: fact
    level: E3
    status: contested
    sources:
    - k5-fukuyama-kotobank-chimei
  - text: 別の説として、筋鉄御門の西内堀側に老松が叢生した小丘を福山と称していたためとする説や、城下の南の水呑村の宝山に対した称とする説があり、『日本歴史地名大系』は総じて「寿山福海」の嘉名による命名であろうと結んでいる
    kind: fact
    level: E3
    status: contested
    sources:
    - k5-fukuyama-kotobank-chimei
  - text: 大正5年（1916年）7月1日に市制を施行して福山市が発足した（全国73番目・広島県内4番目、当時の人口は32,356人）
    kind: fact
    level: E2
    status: established
    sources:
    - k5-fukuyama-city-ayumi
  column:
    title: 蝙蝠山が「福山」になった
    text: 福山城が建つ山は、もとは蝙蝠山（こうもりやま、常興寺山）と呼ばれた。『日本歴史地名大系』が伝える命名諸説の一つは、この「蝠」の字が「福」に通じることに目をつけた名づけとするものだ。決め手となる史料はないが、老松の小丘説や宝山対称説も含め、諸説に共通するのは「福山」がめでたい名として意識的に選ばれたという点である。新しい城下町には、新しい嘉名が必要だった。
    sources:
    - k5-fukuyama-kotobank-chimei
  relations:
  - pref/34
  unknowns:
  - 命名の年次を1619年とするか1622年とするかは資料により異なり、どちらとも決められない
  - 蝙蝠山という山名自体の由来は未確認
  updated: '2026-11-13'
- id: muni/35-下関市
  code: '352012'
  names:
    ja: 下関市
    reading: しものせきし
    aliases:
    - 赤間関
    - 赤馬関
    - 馬関
    - 赤目関
  user_terms:
  - 下関の名前の由来
  - 赤間関と下関はどっちが古いの
  - 馬関って何のこと
  - 赤間関市から下関市に名前が変わったのはなぜ
  naming_type: その他（旧称「赤間関」から、古代以来の地名「下関」への改称）
  prefecture: 山口県
  homonyms: []
  summary: 市名は古代以来の地名「下関」による。貞観11年（869年）の太政官符にすでに「下関」と見え、「赤間関」の名より古い。中世以降は赤間関・赤馬関・馬関とも呼ばれ、明治22年（1889年）の市制では「赤間関市」として発足したが、明治35年（1902年）に「下関市」へ改称した。
  first_attestation:
    era: 貞観11年
    year_western: 869
    document: 太政官符
    note: 『日本歴史地名大系』が紹介する「下関」表記の初出で、9月27日付の太政官符に見える。「赤間関」の名より「下関」の名の方が、文書の上では古くから現れる
  claims:
  - text: 下関市の地方公共団体コードは352012である（総務省「地方公共団体コード一覧」による）
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  - text: 『日本歴史地名大系』によれば、貞観11年（869年）9月27日付の太政官符にはすでに「下関」と見え、「下関」の表記は「赤間関」より古くから文書に現れる
    kind: fact
    level: E3
    status: established
    sources:
    - k5-shimonoseki-kotobank-chimei
  - text: この地は古くは赤間（赤目）と呼ばれ、『旧事本紀』に「赤間物部」、『大同類聚方』に「赤間稲置」とあり、赤間関・赤馬関・赤目関・関・馬関などとも称されてきた
    kind: fact
    level: E3
    status: established
    sources:
    - k5-shimonoseki-kotobank-chimei
  - text: 世界大百科事典は、古代の長門関・下関は現在の下関の地を指すと思われるとし、潮流の静まるのを待たなければ渡れない地理条件によって関が置かれ、港として発展したと解説している
    kind: fact
    level: E3
    status: inferred
    sources:
    - k5-shimonoseki-kotobank-akamagaseki
  - text: 「赤間関」の名の由来には、舟の異名を「赤馬」ということからとする赤馬説、「赤間」は「開間（あきま）」で長門・豊前二国の間の海峡になったためとする開間説などがある
    kind: fact
    level: E3
    status: contested
    sources:
    - k5-shimonoseki-kotobank-akamagaseki
  - text: 『注進案』は、赤目竜が国の中を蹴り破って水を通したという伝承を、「赤間」の名の由来として伝えている
    kind: legend
    level: E3
    status: established
    sources:
    - k5-shimonoseki-kotobank-akamagaseki
  - text: 明治22年（1889年）の市制施行の際、山口県内では唯一の市として「赤間関市」が発足し、明治35年（1902年）6月に「下関市」へ改称した
    kind: fact
    level: E2
    status: established
    sources:
    - k5-shimonoseki-city-gaiyo
  - text: 「赤馬関」の後ろ2字を取った「馬関（ばかん）」も通称として使われ、明治34年（1901年）に開業した山陽鉄道の駅は当初「馬関駅」と称し、翌年の市名改称に伴って下関駅に改称された
    kind: fact
    level: E2
    status: established
    sources:
    - k5-shimonoseki-mof
  column:
    title: 「下関」の方が「赤間関」より古かった
    text: ふつう「赤間関」が古名で「下関」が新しい名だと思われがちだが、文書の上では逆である。869年の太政官符にすでに「下関」とあるのに対し、「赤間関」が広く使われるようになるのは中世以降のこととされる。ところが1889年の市制施行では、あえて中世以来の「赤間関市」が市名に選ばれた。それが1902年、古代以来の「下関」に改められる。いまの市名は、千年以上前の文書に現れる名への回帰だった。
    sources:
    - k5-shimonoseki-kotobank-chimei
    - k5-shimonoseki-city-gaiyo
  relations:
  - pref/35
  unknowns:
  - 明治35年（1902年）の改称の理由（「下関の名が海外に知られていたため」と伝える資料はあるが、その原典は未確認）
  - 貞観11年の太政官符に見える「下関」が現在の市中心部を指すかどうかは推定の域を出ない
  - 「赤間関」の初見を『吾妻鏡』元暦2年（1185年）の記事とする話は、二次的な紹介でのみ確認している
  updated: '2026-11-13'
- id: muni/35-山口市
  code: '352039'
  names:
    ja: 山口市
    reading: やまぐちし
    aliases: []
  user_terms:
  - 山口の名前の由来
  - 西の京と呼ばれる市の名前
  - 大内氏の城下町の名前
  naming_type: 一部の地名
  prefecture: 山口県
  homonyms: []
  summary: 市名は中世以来の地名「山口」を引き継ぐ。「山口」の初見は建長6年（1254年）の金鼓銘とされ、14世紀に大内弘世が本拠を移して京に模した城下町を築いたことで都市として発展した。語源は山地への入り口とする説などがあるが、専門辞典は「想像に過ぎない」としており定説はない。山口市は昭和4年（1929年）に市制を施行した。
  first_attestation:
    era: 建長6年
    year_western: 1254
    document: 円政寺旧蔵金鼓銘
    note: 「防州山口月輪山円政寺天神宮」の銘が地名「山口」の初見とされる（『日本歴史地名大系』山口町条による）。円政寺は当時、椹野川の北側にあった寺で、のちに萩へ移転している
  claims:
  - text: 山口市の地方公共団体コードは352039である（総務省「全国地方公共団体コード」市区町村コード一覧による）
    kind: fact
    level: E2
    status: established
    sources:
    - e-cap-soumu-code-list
  - text: 「山口」の地名の初見は、建長6年（1254年）の円政寺旧蔵金鼓銘の「防州山口月輪山円政寺天神宮」であることがよく知られている
    kind: fact
    level: E3
    status: established
    sources:
    - e-cap-yamaguchi-kotobank-machi
    - e-cap-enseiji-kongo
  - text: 「山口」の語源には、山口盆地の北を流れ椹野川の支流である一ノ坂川に沿って長門国阿武郡の山地に分け入る入り口にあたるからとする説がある
    kind: fact
    level: E3
    status: indeterminate
    sources:
    - e-cap-yamaguchi-kotobank-machi
    - e-yamaguchi-ndl-ref
  - text: 別の説として、東鳳翩山の銀鉱に入る山の口にあたる天花辺りの地名が一般的な呼称になったとする説があるが、『日本歴史地名大系』はこれらの説を「想像に過ぎない」としている
    kind: fact
    level: E3
    status: indeterminate
    sources:
    - e-cap-yamaguchi-kotobank-machi
    - e-yamaguchi-ndl-ref
  - text: 大内氏はそれまで仁保川沿いの御堀氷上を本拠としていたが、大内弘世の時代に山口へ本拠を移した。江戸時代に復元された山口古図には、山口が京に似て四神相応の地であるので延文5年（1360年）に京に倣って町割をした旨が記されている
    kind: fact
    level: E3
    status: established
    sources:
    - e-cap-yamaguchi-kotobank-machi
  - text: 大内弘世は京都の文化に感銘を受け、盆地の地形が京都に似た山口に京に模した街づくりを行い、山口は「西の京」と呼ばれるようになったと山口市は伝えている
    kind: fact
    level: E2
    status: established
    sources:
    - e-yamaguchi-city-ouchi
  - text: 大内氏の始まりは、百済国聖明王の第3王子である琳聖太子が周防国に着岸し、聖徳太子より周防国大内県を賜ったことに始まると伝えられている
    kind: legend
    level: E2
    status: established
    sources:
    - e-yamaguchi-city-ouchi
  - text: 山口市は昭和4年（1929年）に、当時の山口町が吉敷村と合併して市制を施行した
    kind: fact
    level: E2
    status: established
    sources:
    - e-cap-yamaguchi-city-gaiyo
  - text: 平成17年（2005年）10月に山口市・小郡町・秋穂町・阿知須町・徳地町の1市4町が合併し、平成22年（2010年）1月に阿東町と合併して、県内最大の市域を有するまちになった
    kind: fact
    level: E2
    status: established
    sources:
    - e-cap-yamaguchi-city-gaiyo
  column:
    title: 本拠はもと川向こうにあった ― 御堀氷上から山口へ
    text: 大内氏の本拠は、初めから山口だったわけではない。それまでの一族は周防国衙への往来に便利な仁保川沿いの御堀氷上に拠っていた。弘世の時代、日本海側の確保と石見への進出が課題になると、交通路にあたり鴻ノ峰や天花などの要害を控えた山口の地が選ばれた。山口古図が伝える「延文5年（1360年）、京に倣って町割をした」という記述は江戸時代の復元図に残る伝えだが、「山口」の名そのものは1254年の金鼓銘にすでに見えており、城下町の建設より1世紀以上前からこの盆地の名として使われていたことになる。都市の成立と地名の成立は、ここでも別の年代を持つ。
    sources:
    - e-cap-yamaguchi-kotobank-machi
    - e-yamaguchi-city-ouchi
  relations:
  - pref/35
  unknowns:
  - 「山口」の語源は専門辞典でも諸説が「想像に過ぎない」とされており、定説は確認できていない
  - 大内弘世が山口へ移った正確な年次は当時の文献には伝えられておらず、延文5年（1360年）の町割は山口古図（江戸時代の復元図）の記述による
  - 円政寺金鼓銘そのものは未読で、初見の情報は『日本歴史地名大系』の記述経由である
  updated: '2026-11-13'
- id: muni/35-萩市
  code: '352047'
  names:
    ja: 萩市
    reading: はぎし
    aliases:
    - 萩浦
    - 萩町
  user_terms:
  - 萩の名前の由来
  - ハギの花から来た地名なの
  - 椿浦と萩浦って何
  - 毛利の城下町の名前の由来
  naming_type: 一部の地名
  prefecture: 山口県
  homonyms: []
  summary: 市名は阿武川三角州東側の浦の名「萩浦」の継承。初見は天文19年（1550年）の大内義隆寄進状とされ、三角州の西側は椿浦と呼ばれた。語源は植物のハギに求める説などを市が紹介するが、専門資料も断定していない。慶長9年（1604年）に毛利輝元の城下町となり、昭和7年（1932年）に市制を施行した。
  first_attestation:
    era: 天文19年
    year_western: 1550
    document: 大内義隆寄進状（善福寺文書）
    note: 『日本歴史地名大系』の挙げる「萩」の初見。ただし「注進案」によれば永享3年（1431年）の文書に「萩浦」と記されていたという二次引用も伝わる
  claims:
  - text: 萩市の地方公共団体コードは352047である（総務省「地方公共団体コード一覧」による）
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  - text: 『日本歴史地名大系』によれば、「萩」の初見は天文19年（1550年）の大内義隆寄進状（善福寺文書）である
    kind: fact
    level: E3
    status: established
    sources:
    - k5-hagi-kotobank-chimei
  - text: 阿武川の三角州では、西の橋本川左岸（現在の椿から玉江浦）の一帯を椿浦と呼び、東の松本川右岸は室町時代以降に萩浦と呼ばれた
    kind: fact
    level: E3
    status: established
    sources:
    - k5-hagi-kotobank-chimei
  - text: 『日本歴史地名大系』は、もとの地が「古萩」と呼ばれたことから「萩」の総名が生まれたと紹介しており、中心の移り変わりとともに「萩」が一帯の総称になったとする
    kind: fact
    level: E3
    status: established
    sources:
    - k5-hagi-kotobank-chimei
  - text: 萩市公式は地名の由来として、近くにハギがたくさん生い茂った山があったことに由来するとする説と、ツバキがつまって「ハギ」になったとする説を紹介している
    kind: fact
    level: E2
    status: contested
    sources:
    - k5-hagi-city-gaiyo
  - text: 慶長9年（1604年）に毛利輝元が居城を広島から萩へ移し、阿武川の三角州に城下町を建設した。以後、萩は毛利36万石の城下町となった
    kind: fact
    level: E2
    status: established
    sources:
    - k5-hagi-city-rekishi
  - text: 昭和7年（1932年）に萩町が市制を施行して旧萩市が発足した
    kind: fact
    level: E3
    status: established
    sources:
    - k5-hagi-kotobank-chimei
  - text: 平成17年（2005年）3月6日に旧萩市と2町4村が合併して現在の萩市が発足した
    kind: fact
    level: E2
    status: established
    sources:
    - k5-hagi-city-rekishi
  column:
    title: 椿浦と萩浦、二つの浦のある三角州
    text: 阿武川が日本海に注ぐ三角州は、川の流れに隔てられて、もとは東西で別の名を持っていた。西は椿浦、東は萩浦。1604年に毛利輝元が東の萩浦側に城下町を築くと、「萩」が三角州全体の名として定着し、元の中心だった地は「古萩」と呼ばれるようになった。萩市公式サイトが「市の花」ハギの紹介の中で、ツバキに由来するという説まで併せて紹介しているのは、この東西二つの浦の名の名残といえる。
    sources:
    - k5-hagi-kotobank-chimei
    - k5-hagi-city-gaiyo
  relations:
  - pref/35
  unknowns:
  - 語源は確定していない（植物のハギに由来するかは市公式・地名大系とも断定していない）
  - 永享3年（1431年）の文書に「萩浦」とあったとする伝聞は「注進案」経由の二次引用で、文書そのものは未確認
  updated: '2026-11-13'
- id: muni/36-徳島市
  code: '362018'
  names:
    ja: 徳島市
    reading: とくしまし
    aliases: []
  user_terms:
  - 徳島の名前の由来
  - 阿波おどりの市の名前
  - 渭津から徳島に改名した市の名前
  naming_type: 藩名
  prefecture: 徳島県
  homonyms: []
  summary: 市名は徳島藩の城下町・徳島に由来する。天正13年（1585年）、蜂須賀家政が猪山（現在の城山）に徳島城を築く際、それまで「渭津（いのつ）」と呼ばれた地を「徳島」と改めた。誰が名付けたか、「徳」の字をなぜ選んだかを示す文献は確認されておらず、縁起を担いだ命名とする郷土史家の推定がある。徳島市は明治22年（1889年）10月1日に誕生した。
  first_attestation:
    era: 天正13年
    year_western: 1585
    document: 徳島城築城に伴う改名（徳島市立徳島城博物館の解説）
    note: 地名の命名そのものとしての初出。改名を記した同時代の一次文書は今回特定できていない
  claims:
  - text: 徳島市の地方公共団体コードは362018である（総務省「全国地方公共団体コード」市区町村コード一覧による）
    kind: fact
    level: E2
    status: established
    sources:
    - e-cap-soumu-code-list
  - text: 天正13年（1585年）、豊臣秀吉の四国平定により蜂須賀家政が阿波国を与えられ、徳島城を築いて居城とした
    kind: fact
    level: E2
    status: established
    sources:
    - e-tokushima-pref-gaiyo
  - text: 城地は秀吉の命により猪山（現在の城山）と定められたと徳島市立徳島城博物館は伝えている
    kind: fact
    level: E2
    status: established
    sources:
    - e-tokushima-city-history01
  - text: 築城当時、城の周囲の地は「渭津（いのつ）」と呼ばれていたが、築城と城下町の開設にあたって「徳島」と地名を改めた
    kind: fact
    level: E2
    status: established
    sources:
    - e-tokushima-city-history05
    - e-tokushima-city-history01
  - text: 「徳島」という地名を誰が命名したかを、文献・古文書は明らかにしてくれない。郷土史家・河野幸夫は、「徳」は富田庄の「富」と同意の嘉字（よい意味の字）であり、東に福島という地名もあることから、家政が福島に対して徳島と縁起をかついで名付けたのではないかと推定しているが、決め手はないとされている
    kind: fact
    level: E2
    status: inferred
    sources:
    - e-tokushima-city-history05
  - text: 徳島は江戸時代を通じて、阿波・淡路両国25万7千石を領した蜂須賀氏の城下町として栄えた
    kind: fact
    level: E2
    status: established
    sources:
    - e-tokushima-pref-gaiyo
  - text: 明治22年（1889年）10月1日、かつて御山下と称した朱引地内の33か町村とこれに接続する4郷町村に市制が施行され、徳島市が誕生した。当時の徳島市の人口は6万861人で、その年に市制を施行した市の中で全国10位の規模だった
    kind: fact
    level: E2
    status: established
    sources:
    - e-cap-tokushima-city-hensan
  - text: 市制施行の際、市内の町村名はすべて「町」に統一され、10月1日は後に徳島市の置市記念日とされた
    kind: fact
    level: E2
    status: established
    sources:
    - e-cap-tokushima-city-hensan
  column:
    title: 福島の隣に徳島を ― 縁起を担いだ命名か
    text: 「徳島」の名付け親は分からない。しかし手がかりは地名の配置にある。城下の東には「福島」という地名があった。郷土史家・河野幸夫は、富田庄の「富」と同じく縁起のよい字である「徳」を選び、福島に対して徳島と対にして名付けたのではないか、と推定した。徳島城博物館の連載はこの推定を紹介しながら「決め手はない」と正直に結んでいる。命名の理由が残らなかった城下町は多いが、徳島の場合は「分からない」と明示した上で、もっともらしい推定の根拠まで示されている点が読みどころである。
    sources:
    - e-tokushima-city-history05
  relations:
  - pref/36
  unknowns:
  - 「徳島」の命名者と、「徳」の字が選ばれた理由を示す確かな記録は確認できていない
  - 「渭津」から「徳島」への改名を記した同時代の一次文書は今回特定できていない
  updated: '2026-11-13'
- id: muni/37-高松市
  code: '372013'
  names:
    ja: 高松市
    reading: たかまつし
    aliases: []
  user_terms:
  - 高松の名前の由来
  - うどんの市の名前の意味
  - 高松城の城下町の名前
  - 高松郷と高松城の関係
  naming_type: 一部の地名
  prefecture: 香川県
  homonyms: []
  summary: 市名の源は、讃岐国香川郡の古代郷名「高松郷」にある。天正16年（1588年）、生駒親正が玉藻浦の笑原郷（のはら）の地に高松城を築く際、著名だった高松郷の名を取って城と城下町の名とした。高松郷そのものは現在の古高松地区にあたり、名の原点と城下町の位置は市域の東西でずれている。高松市は明治23年（1890年）に市制を施行した。
  first_attestation:
    era: 承平年間
    year_western: null
    document: 和名類聚抄
    note: 讃岐国香川郡の郷名「高松」の記載とされる（語源由来辞典による）。原文は未読。城下町名としての使用は天正16年（1588年）の築城から
  claims:
  - text: 高松市の地方公共団体コードは372013である（総務省「全国地方公共団体コード」市区町村コード一覧による）
    kind: fact
    level: E2
    status: established
    sources:
    - e-cap-soumu-code-list
  - text: 「高松」の地名は平安前期の『和名抄（和名類聚抄）』に「高松郷」で見えるのが古く、高松市は市名の由来が平安時代中期の史書に見える「高松郷」（現在の古高松地区）に発すると説明する
    kind: fact
    level: E2
    status: established
    sources:
    - e-cap-takamatsu-gogen
    - e-cap-takamatsu-city-plan
    - e-cap-wamyosho
  - text: 近世の高松城下町が発達した地は、律令時代には香川郡笑原郷（のはら）といわれた地であり、高松市公式の高松城跡解説は築城地の旧地名を「野原」と表記する
    kind: fact
    level: E2
    status: established
    sources:
    - e-cap-takamatsu-kotobank
    - e-cap-takamatsu-city-castle
  - text: 天正16年（1588年）、生駒親正は築城の際、屋島合戦などで中央にも知られた高松郷の名を取って高松城とし、その城下町名としたことから、城下町としての高松の地名が始まった
    kind: fact
    level: E3
    status: established
    sources:
    - e-cap-takamatsu-kotobank
    - e-cap-takamatsu-city-profile
  - text: 明治23年（1890年）に市制を施行し高松市となった
    kind: fact
    level: E3
    status: established
    sources:
    - e-cap-takamatsu-kotobank
  - text: 生駒氏の転封後、寛永19年（1642年）に松平頼重が東讃12万石を与えられて入部し、以後松平11代の城下町として明治を迎えた
    kind: fact
    level: E2
    status: established
    sources:
    - e-cap-takamatsu-city-castle
    - e-cap-takamatsu-city-profile
  - text: 高松郷の語源については、海の近くに高い松の林があったことが地名の由来といわれている
    kind: legend
    level: E3
    status: indeterminate
    sources:
    - e-cap-takamatsu-gogen
  column:
    title: 名の原点は城下の東にあった ― 高松郷と玉藻浦
    text: 高松という名前には「原点のずれ」がある。名の出どころである古代の高松郷は、現在の高松市東部の古高松地区にあたる。一方、生駒親正が1588年に城を築いたのは、その西方の玉藻浦で、律令時代には笑原郷（のはら）と呼ばれた別の地だった。親正は自分の城地の旧名ではなく、屋島合戦で中央にも知られた由緒ある郷名「高松」を借りてきて、城と新しい城下町に看板として掲げたのである。市名の地図上の原点は、城のある場所ではなく、東の古高松に置くべきだということになる。
    sources:
    - e-cap-takamatsu-city-plan
    - e-cap-takamatsu-kotobank
    - e-cap-takamatsu-gogen
  relations:
  - pref/37
  unknowns:
  - 高松郷の正確な郷域と、笑原郷との境界を特定できる一次文書は確認していない
  - 「高い松の林」説のほか高松郷の語源の定説は確認できていない
  - 『和名類聚抄』の高松郷の記載そのものは未読で、語源由来辞典などの紹介経由である
  updated: '2026-11-13'
- id: muni/38-松前町
  code: '384011'
  names:
    ja: 松前町
    reading: まさきちょう
    aliases:
    - 正木
  user_terms:
  - 松前町は「まさき」と読むのはなぜ
  - 松前町（愛媛）の名前の由来
  - 正木城があった町
  naming_type: その他（「まさき」の音を継ぎ、表記を「松前」に改めたという言い伝えに基づく）
  prefecture: 愛媛県
  homonyms:
  - muni/01-松前町
  summary: 読みは「まさき」。愛媛県の市町要覧によれば、慶長8年（1603年）に加藤嘉明が正木（まさき）城から勝山に居城を移して「松山城」と命名した際、「松山（城）の前」の意で「松前（まさき）」に改字したといわれている。ただし同要覧は「他にも諸説あり詳細は不明」と明記しており、確定した由来ではない。昭和30年（1955年）3月31日に旧松前町・岡田村・北伊予村が合併して現在の松前町となった。北海道松前町とは漢字が同じだけで、読みも由来も無関係である。
  first_attestation:
    era: 慶長8年
    year_western: 1603
    document: 加藤嘉明の居城移転に伴う改字の言い伝え
    note: 「松前」の表記が始まったとされる年。ただし愛媛県市町要覧自身が「諸説あり詳細は不明」と留保しており、一次文書による確定ではない。「正木」の地名自体は中世以来のものである
  claims:
  - text: 愛媛県の市町要覧は、町名の由来について、慶長8年（1603年）に加藤嘉明が正木（まさき）城から勝山（現松山市）に居城を移し「松山城」と命名した際に、松山（城）の前の意で「松前（まさき）」に改字したといわれていると紹介している
    kind: fact
    level: E2
    status: contested
    sources:
    - h1-matsumae-ehime-yoran
  - text: 同じく愛媛県の市町要覧は、この改字説について「他にも諸説あり詳細は不明」と明記しており、県の公式資料の水準でも由来は確定していない
    kind: fact
    level: E2
    status: contested
    sources:
    - h1-matsumae-ehime-yoran
  - text: 読みは「まさき」であり、「松前」の表記に「まさき」と読ませるのは、もとの地名「正木（まさき）」の音を継いだものと位置づけられている
    kind: fact
    level: E2
    status: established
    sources:
    - h1-matsumae-ehime-yoran
  - text: 正木城は加藤嘉明の居城であり、嘉明は慶長8年（1603年）に正木城から勝山へ居城を移した
    kind: fact
    level: E2
    status: established
    sources:
    - h1-matsumae-ehime-yoran
  - text: 昭和30年（1955年）3月31日、旧松前町・岡田村・北伊予村が合併して、現在の松前町となった
    kind: fact
    level: E2
    status: established
    sources:
    - h1-matsumae-ehime-yoran
  - text: （異なる層）北海道松前町とは漢字表記が同じだけで、読み（まさき／まつまえ）も、由来（正木の改字の言い伝え／アイヌ語地名と松前藩の系譜）も異なる、無関係の地名である
    kind: fact
    level: E2
    status: established
    sources:
    - h1-matsumae-ehime-yoran
    - h1-matsumae-jtb
  - text: 加藤嘉明が松山城を命名したとき、もとの居城の地を「松山の前」として「松前」と書き改めたという話は、地元で言い伝えとして語られている
    kind: legend
    level: E2
    status: established
    sources:
    - h1-matsumae-ehime-yoran
  column:
    title: 「まつまえ」とは読まない松前
    text: 同じ「松前」という漢字でも、北海道の町は「まつまえ」、愛媛の町は「まさき」と読みます。愛媛の「まさき」は、もとの地名「正木（まさき）」の音をそのまま残し、字だけを替えたものと伝えられます。言い伝えでは、加藤嘉明が新しい城を「松山城」と名付けたとき、古い城下を「松山の前」と位置づけて「松前」の字をあてた、とされます。ただし愛媛県の公式資料自身が「諸説あり詳細は不明」と書く話です。読み方が違えば郵便も間違えようがない、というのは同名地名の中では珍しい幸運かもしれません。
    sources:
    - h1-matsumae-ehime-yoran
  relations:
  - pref/38
  - muni/01-松前町
  unknowns:
  - 改字説を裏づける一次文書は未確認（愛媛県市町要覧も「詳細は不明」とする）
  - 「諸説あり」とされる他の説の具体的な内容は、市町要覧の範囲では未確認
  - 「正木」の地名の初出文書の特定は未了
  updated: '2026-11-13'
- id: muni/38-松山市
  code: '382019'
  names:
    ja: 松山市
    reading: まつやまし
    aliases: []
  user_terms:
  - 松山の名前の由来
  - 松山城のある市の名前
  - 道後温泉のある市の名前
  - 松江と間違えやすい市の名前
  naming_type: 新規命名
  prefecture: 愛媛県
  homonyms: []
  summary: 市名は松山城の城名に由来する。城が築かれた山はもともと勝山と呼ばれていたが、慶長7年（1602年）に築城に着手した加藤嘉明が翌慶長8年（1603年）に「松山城」と名付け、城名が町・市の名になった。命名理由には松の木に由来する説と、松平家の「松」を取ったとする説があり、市は2説を併記している。松山市は明治22年（1889年）12月15日に市制を施行した。島根県の松江市とは読みが似るが別の自治体である。
  first_attestation:
    era: 慶長8年
    year_western: 1603
    document: 松山城の命名（松山市公式「松山という名がつけられた理由」）
    note: 城名としての命名。築城着工は慶長7年（1602年）で、山そのものは勝山と呼ばれていた
  claims:
  - text: 松山市の地方公共団体コードは382019である（総務省「全国地方公共団体コード」市区町村コード一覧による）
    kind: fact
    level: E2
    status: established
    sources:
    - e-cap-soumu-code-list
  - text: 松山の名は、慶長7年（1602年）に加藤嘉明が築城にかかり、翌慶長8年（1603年）に松山城と名づけたことに始まる
    kind: fact
    level: E2
    status: established
    sources:
    - e-cap-matsuyama-city-gaiyo
    - e-cap-matsuyama-city-riyu
  - text: 松山城が築かれたのは、標高132メートル・周囲約4キロメートルの独立丘陵である勝山を中心とする地で、城の完成は嘉明の転封後、寛永4年（1627年）に第2代城主・蒲生忠知によって成されたと伝えられる
    kind: fact
    level: E2
    status: established
    sources:
    - e-cap-matsuyama-city-castle
  - text: 命名の理由の一説として、お城のある山に多くの松の木が植えられていたことが挙げられている
    kind: fact
    level: E2
    status: contested
    sources:
    - e-cap-matsuyama-city-riyu
  - text: もう一説として、徳川家の一族である松平家の「松」の字を取って付けられたとする説があり、松山市はその典拠を奥平貞虎編『予陽郡郷俚諺集』とする。ただしこれは江戸時代の俚諺集に基づく後世の説明で、命名した加藤嘉明との関係を示す同時代資料は確認されていない
    kind: fact
    level: E2
    status: contested
    sources:
    - e-cap-matsuyama-city-riyu
  - text: 明治6年（1873年）に愛媛県庁が設置されて県都となり、明治22年（1889年）12月15日に市制を施行した
    kind: fact
    level: E2
    status: established
    sources:
    - e-cap-matsuyama-city-gaiyo
  - text: 島根県松江市（まつえ）とは読みが似るが別の自治体であり、「松山」が加藤嘉明の名付けた城名に由来するのに対し、「松江」は堀尾氏が白潟・末次を合わせて称した城下町名に由来するなど、成立の事情は異なる
    kind: fact
    level: E2
    status: established
    sources:
    - e-cap-matsuyama-city-riyu
    - e-cap-matsue-city-gaiyo
  column:
    title: 勝山から松山へ ― 山の名前が市の名前になった
    text: 松山城の山は、城ができる前は「勝山」と呼ばれていた。加藤嘉明が1602年に築城を始め、翌年に城を「松山城」と名付けたことで、山の名も町の名も「松山」に切り替わった。もとの「勝山」も縁起のよい名だったはずだが、新しい城主は新しい名を選んだ。松山市の公式解説は命名理由を2説併記する。山に松が多かったという素朴な説と、松平家の「松」を取ったという説である。後者は江戸時代の俚諺集が出典で、命名の当事者である嘉明との結びつきは薄い。「なぜ松なのか」は、今も決着していない。
    sources:
    - e-cap-matsuyama-city-riyu
    - e-cap-matsuyama-city-castle
  relations:
  - pref/38
  - muni/32-松江市
  unknowns:
  - 命名理由の2説（松の木説・松平家の「松」説）のどちらが正しいかは資料上決められず、特に松平説は松平氏が松山の城主となる時期との関係を含め同時代資料での裏付けが確認できていない
  - 加藤嘉明が「松山」と名付けた経緯を記した同時代の一次文書は今回特定できていない
  updated: '2026-11-13'
- id: muni/39-高知市
  code: '392014'
  names:
    ja: 高知市
    reading: こうちし
    aliases: []
  user_terms:
  - 高知の名前の由来
  - 河中から高知に変わった理由
  - 坂本龍馬のふるさとの市の名前
  naming_type: 一部の地名
  prefecture: 高知県
  homonyms: []
  summary: 市名は山内氏の城下町・高知に由来し、その名は二度の改名を経ている。山内一豊が大高坂山に築城して「河中（こうち）」と名付けたが、水害を連想させる字を嫌った2代藩主・忠義が慶長15年（1610年）に僧・空鏡に改めさせて「高智」とし、のちに「高知」の表記が定着した。高知市は明治22年（1889年）4月1日に旧城下49町から誕生した。
  first_attestation:
    era: 慶長15年
    year_western: 1610
    document: 山内氏時代史初稿
    note: 「河中」から「高智」への改字を記す藩政史料として高知市が紹介するもの。前身の「河中」の命名は慶長8年（1603年）の一豊入城時とされる
  claims:
  - text: 高知市の地方公共団体コードは392014である（総務省「全国地方公共団体コード」市区町村コード一覧による）
    kind: fact
    level: E2
    status: established
    sources:
    - e-cap-soumu-code-list
  - text: 慶長6年（1601年）に土佐へ入国した山内一豊は大高坂山に築城を開始し、慶長8年（1603年）に入城して山の名を河中山と改めた
    kind: fact
    level: E2
    status: established
    sources:
    - e-kochi-city-rekishi
  - text: 「河中」の名は、城下が北の江ノ口川と南の鏡川という二つの川に挟まれた「中」に位置することに由来する
    kind: fact
    level: E3
    status: established
    sources:
    - e-kochi-kotobank
  - text: 『山内氏時代史初稿』の慶長15年（1610年）9月の条に「山内忠義、竹林寺ノ僧空鏡ヲシテ河中山ノ文字ヲ改メシメ高智ト称ス」とあり、2代藩主忠義が僧・空鏡に命じて河中山を高智山に改名した
    kind: fact
    level: E2
    status: established
    sources:
    - e-kochi-city-rekishi
    - e-kochi-city-shiryo
  - text: 改名の理由は、「河中」という字が水害の多い地を連想させ縁起が悪いためであったと伝えられている
    kind: fact
    level: E2
    status: established
    sources:
    - e-kochi-city-rekishi
    - e-kochi-kotobank
  - text: のちに「高智」の「智」が「知」に置き換わり「高知」と書かれるようになり、城名から地名へ広がった
    kind: fact
    level: E3
    status: established
    sources:
    - e-kochi-kotobank
  - text: 明治22年（1889年）4月1日に市制が施行され、旧城下49町から高知市が誕生した（当時の人口は21,823人、初代市長は一圓正興）
    kind: fact
    level: E2
    status: established
    sources:
    - e-cap-kochi-city-tokei
  column:
    title: 旧城下49町、そのまま市になる
    text: 高知市の誕生日は明治22年（1889年）4月1日である。高知市統計書の参考資料は「市町村制施行。高知市誕生（旧城下49町、人口21,823人）」と記す。つまり高知市は、山内氏の城下町をほぼそのままの範囲で引き継いで発足した。城下町はすでに「高知」の名を持っていたから、新しい市に新しい名前は要らなかった。河中→高智→高知という改名の歴史を背負った名前が、城の町から近代の市へと、そのまま受け渡されたのである。
    sources:
    - e-cap-kochi-city-tokei
    - e-kochi-city-rekishi
  relations:
  - pref/39
  unknowns:
  - 「高智」の「智」が「知」に置き換わった正確な時期と経緯は今回特定できていない（県レコード pref/39 と同じ論点）
  - 「高智」が文殊菩薩の浄土にちなむとする説明は伝承的な色彩が強く、同時代資料での裏付けは確認できていない
  updated: '2026-11-13'
- id: muni/40-久留米市
  code: '402036'
  names:
    ja: 久留米市
    reading: くるめし
    aliases:
    - 久留目
  user_terms:
  - 久留米の名前の由来
  - 久留米藩と有馬氏
  - クルメクって何
  - 久留米市はいつできたの
  naming_type: その他（城下町・郡の名「久留米」を継承して市制を施行）
  prefecture: 福岡県
  homonyms: []
  summary: 市名は、筑後国府の置かれた地に育ち、有馬氏21万石の城下町となった「久留米」の名をそのまま継いだもの。地名の確実な用例は室町時代に遡るが、語源については玖留目神説・機織りの工人に由来する説・来目皇子説・筑後川の蛇行をいう「クルメク」説などが併記され、定説はない。
  first_attestation:
    era: 応永25年
    year_western: 1418
    document: 報恩寺坪付帳
    note: 「久留目」という表記での用例。Wikipediaが紹介するもので、原典の直接確認は未了
  claims:
  - text: 1889年（明治22年）4月1日、市制施行により久留米市が誕生した。当時の人口は24,750人で、福岡市とともに福岡県で最初の市の一つであった（地方公共団体コードは402036）
    kind: fact
    level: E2
    status: established
    sources:
    - k6-kurume-city-history
    - b-cap-chiba-soumu-code
  - text: 古代には筑後国府がこの地に置かれ、北部九州の行政・交通の要衝として栄えたと久留米市は説明する
    kind: fact
    level: E2
    status: established
    sources:
    - k6-kurume-city-history
  - text: 江戸時代には有馬氏が丹波国福知山から入部し（1621年）、明治まで11代の城主が治める21万石の城下町となった
    kind: fact
    level: E2
    status: established
    sources:
    - k6-kurume-city-history
  - text: 「久留米」という地名は室町時代から文献に見られ、応永25年（1418年）の「報恩寺坪付帳」には「久留目」と記されているとWikipediaは紹介する
    kind: fact
    level: E5
    status: established
    sources:
    - k6-kurume-wikipedia
  - text: 語源には、天慶7年（944年）の「筑後国神名帳」にみえる「玖留目神」に由来するとする説、大陸から渡来した機織りの工人の「呉姫（くれひめ）」「繰女（くりめ）」が転訛したとする説、用明天皇の皇子・来目皇子に由来する説、筑後川の大きな蛇行を意味する「クルメク（転く）」を語源とする説などがあり、定説はない
    kind: fact
    level: E5
    status: contested
    sources:
    - k6-kurume-wikipedia
  - text: 2005年（平成17年）2月に田主丸町・北野町・城島町・三潴町の4町を編入して市域が拡大し、2008年（平成20年）4月には九州では県庁所在地以外で唯一の中核市となった
    kind: fact
    level: E2
    status: established
    sources:
    - k6-kurume-city-bunkazai
  column:
    title: 市制の年に襲った大洪水——筑後川との戦いの始まり
    text: 久留米市が生まれた1889年、その年の7月に筑後川が氾濫し、流域は泥土と化して流失家屋は1,262戸に及んだと記録にある。市はこの後も大正10年、昭和28年と大洪水に見舞われ続けた。久留米市自身が「本市の歴史は、筑後川との戦いの歴史であったということができます」と書くほどで、城下町の繁栄も軍都の発展も、つねにこの大河の恵みと脅威の裏表だった。
    sources:
    - k6-kurume-city-history
  relations:
  - pref/40
  unknowns:
  - 語源諸説と1418年の用例は、現時点ではWikipediaの整理に依拠しており、『筑後国神名帳』『報恩寺坪付帳』の原典や角川日本地名大辞典での直接確認が未了
  - 筑後国府の所在地が現在の市街地とどう重なるか（位置のずれ）の精密な検討は未了
  updated: '2026-11-13'
- id: muni/40-北九州市
  code: '401005'
  names:
    ja: 北九州市
    reading: きたきゅうしゅうし
    aliases: []
  user_terms:
  - 北九州市はどうやってできたの
  - 西京市って何
  - 門司 小倉 八幡の合併
  - 九州で最初の100万都市
  naming_type: 合併新設
  prefecture: 福岡県
  homonyms: []
  summary: 1963年2月10日、門司・小倉・若松・八幡・戸畑の5市が対等合併して誕生した市で、市名は全国公募を経て「北九州市」に決まった。公募の最多票は「西京市」だったが、合併促進協議会が「呼び慣れていて身近に感じる」として、次点の「北九州市」を選んだという経緯が残る。
  first_attestation:
    era: 昭和37年
    year_western: 1962
    document: 新市名の全国公募と北九州五市合併促進協議会による「北九州」の決定
    note: 市名としての成立。翌1963年2月10日に市が発足した。「北九州」という地域名自体は、合併前から五市一帯を指す呼び名として定着していた
  claims:
  - text: 1963年（昭和38年）2月10日、門司市・小倉市・若松市・八幡市・戸畑市の5市が対等合併して北九州市が誕生し、九州初の100万都市となった（地方公共団体コードは401005）
    kind: fact
    level: E2
    status: established
    sources:
    - k6-kitakyushu-city-pr
    - b-cap-chiba-soumu-code
  - text: 新市名は全国に募集され、約13万7,000通の応募があった。最多は「西京市」の約1万2,100通で、「北九州市」は約6,600通で次点だったと北九州市政だよりは伝える
    kind: fact
    level: E2
    status: established
    sources:
    - k6-kitakyushu-city-pr
  - text: 最終的には北九州五市合併促進協議会で、「呼び慣れていて、身近に感じる」などの理由から「北九州市」に決まった
    kind: fact
    level: E2
    status: established
    sources:
    - k6-kitakyushu-city-pr
  - text: 国立国会図書館のレファレンス事例によれば、公募は1962年（昭和37年）4月1日から5月10日まで行われ、応募総数137,142通・市名の種類は19,292種に上り、同年6月10日に「北九州」と決定したと当日の夕刊が報じた
    kind: fact
    level: E2
    status: established
    sources:
    - k6-kitakyushu-ndl-crd
  - text: 合併前の五市一帯はすでに「北九州」と呼ばれており、その呼び慣れた広域地名が新しい市の名として採用された
    kind: fact
    level: E2
    status: established
    sources:
    - k6-kitakyushu-city-pr
  - text: 旧5市の区域は現在の門司区・小倉北区・小倉南区・若松区・八幡東区・八幡西区・戸畑区の7区のおおむねのもとになっており、北九州市は政令指定都市である
    kind: fact
    level: E2
    status: established
    sources:
    - k6-kitakyushu-city-pr
    - b-cap-chiba-soumu-code
  column:
    title: 公募1位は「西京市」だった
    text: 新しい市の名前を全国から募ったところ、集まったのは約13万7,000通。いちばん多かったのは「西京市」で、「北九州市」はその半分ほどしかなかった。それでも最終的に選ばれたのは「北九州市」だった。合併協議会の理由は「呼び慣れていて、身近に感じる」から。応募作の中には「八小門若戸」「19635」「NKC」のような珍名も並んでいたと『北九州五市合併の記録』は伝える。人気投票ではなく「日常の呼び名」を採った判断が、そのまま定着した市名を決めた。
    sources:
    - k6-kitakyushu-city-pr
    - k6-kitakyushu-ndl-crd
  relations:
  - pref/40
  unknowns:
  - 「北九州」という広域地名がいつ頃から五市一帯を指して使われ始めたか（北九州工業地帯の呼称の定着過程）は、本調査では確認できなかった
  - 政令指定都市への移行日（1963年4月1日とされる）については、市の公式年表での直接確認が未了のため主張に含めていない
  updated: '2026-11-13'
- id: muni/40-川崎町
  code: '406058'
  names:
    ja: 川崎町
    reading: かわさきまち
    aliases:
    - 川崎村
    - 東川崎村
    - 西川崎村
  user_terms:
  - 川崎町の名前の由来
  - 福岡の川崎町はなぜ川崎
  - 田川郡の炭鉱町
  naming_type: その他
  prefecture: 福岡県
  homonyms:
  - muni/04-川崎町
  summary: 明治期に東川崎村・西川崎村が合併して生まれた川崎村を前身とし、1937年に安真木村と合併、1938年に町制を施行して川崎町となった。「川崎」の名は村名として先行していたが、その語源は確認した資料では説明されない。宮城県川崎町とは成立の経緯が異なり、共通の命名理由は立証できない。
  first_attestation:
    era: 明治時代（明治20年）
    year_western: 1887
    document: 東川崎村・西川崎村の合併による川崎村の成立
    note: 東・西川崎の村名自体はこれ以前から存在するが、「川崎」の初出・語源は未確認
  claims:
  - text: 明治20年（1887年）4月に東川崎村と西川崎村が合併して川崎村となり、明治22年（1889年）には川崎・田原・池尻が合併して新たな川崎村が誕生したと沿線紹介資料が伝える
    kind: fact
    level: E4
    status: established
    sources:
    - h3-kawasaki-f-hitahiko
  - text: 昭和12年（1937年）に南部の安真木村と北部の川崎村が合併し、昭和13年（1938年）から町制を施行して川崎町となった
    kind: fact
    level: E2
    status: established
    sources:
    - h3-kawasaki-f-town
    - h3-kawasaki-f-yoran
  - text: 『日本歴史地名大系』は、町域中部を中元寺川が北流し、古代律令制下では和名抄の位登郷に含まれていたとみられると紹介する
    kind: fact
    level: E3
    status: established
    sources:
    - h3-kawasaki-kotobank
  - text: 明治末期以降、古河大峰・三井田川などの炭鉱を有する炭鉱町として発達したが、昭和30年代後半にすべて閉山されたと百科事典の解説にある
    kind: fact
    level: E3
    status: established
    sources:
    - h3-kawasaki-f-kotobank
  - text: 宮城県川崎町とは「川崎村」を前身とする点は共通する。ただし宮城では1889年の構成5村に「川崎」がなく宿場名「川崎宿」が先行したのに対し、福岡では東・西川崎という村名が先行する点が異なる。両町とも「川崎」の語源そのものは未確認で、共通の命名理由は立証できない
    kind: fact
    level: E3
    status: established
    sources:
    - h3-kawasaki-m-uub
    - h3-kawasaki-m-juku
    - h3-kawasaki-f-hitahiko
  - text: 総務省「地方公共団体コード一覧」では本町のコードは406058とされる
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 川崎村が二度生まれた町
    text: この町の前身「川崎村」は、1887年に東・西川崎の合併で一度生まれ、1889年の町村制施行でもう一度、田原・池尻を加えて生まれ直しています。さらに1937年の安真木村との合併でも名は「川崎」のまま残り、翌年に町になりました。合併のたびに残り続けた名ですが、その最初の語源だけが記録に残っていません。
    sources:
    - h3-kawasaki-f-hitahiko
    - h3-kawasaki-f-town
  relations:
  - pref/40
  - muni/04-川崎町
  unknowns:
  - 東・西川崎村の初出と「川崎」の語源（中元寺川との関係を含む）
  - 1887年・1889年の合併の法的根拠の一次確認
  updated: '2026-11-13'
- id: muni/40-広川町
  code: '405442'
  names:
    ja: 広川町
    reading: ひろかわまち
    aliases:
    - 上広川村
    - 中広川村
    - 下広川村
  user_terms:
  - 福岡の広川町の由来
  - 八女の広川町 なぜ広川か
  - 上広川 中広川 下広川
  naming_type: 一部の地名
  prefecture: 福岡県
  homonyms:
  - muni/30-広川町
  summary: 八女郡の町で、読みは「ひろかわまち」。「広川」は1889（明治22）年の町村制で上広川村・中広川村・下広川村の3村がそろって名乗った、町村制以前の広川村に遡る既存の地名である。昭和30年（1955）に上・中両村の合併で広川町が発足し、同年12月に下広川村の一部が編入された。同名の和歌山県広川町が合併時に川名を新たに採用した新名であるのと対照的に、こちらは古い地名の継承・統一である。
  first_attestation:
    era: 明治22年
    year_western: 1889
    document: 町村制施行による上広川村・中広川村・下広川村の発足
    note: 「広川」は下広川村を構成した広川村のように、町村制以前から存在した村名・川名に遡る。町としての初出は1955年
  claims:
  - text: 昭和30年（1955）4月1日に上広川村と中広川村が新設合併して広川町が発足し、同年12月1日に下広川村の一部が編入されて現在の町域となった
    kind: fact
    level: E2
    status: established
    sources:
    - h5-hirogawa-fukuoka-masterplan
  - text: 明治22年（1889）の町村制施行により、町域には上広川村・中広川村・下広川村が発足した
    kind: fact
    level: E2
    status: established
    sources:
    - h5-hirogawa-fukuoka-enkaku
  - text: 下広川村は明治8年以来の広川村・藤田村・一条村を区域としており、「広川」という村名は町村制以前から存在した
    kind: fact
    level: E2
    status: established
    sources:
    - h5-hirogawa-fukuoka-enkaku
  - text: 下広川村の区域は全域が広川町に入ったのではなく、一部は筑後市と筑邦町へ分かれて編入された
    kind: fact
    level: E2
    status: established
    sources:
    - h5-hirogawa-fukuoka-ayumi
  - text: 町域は発心山に源を発する広川がつくる広川谷の盆地にあり、町名と同じ川が流れ下って筑後川に注ぐ
    kind: fact
    level: E2
    status: established
    sources:
    - h5-hirogawa-fukuoka-masterplan
  - text: 共通する層として、同名の和歌山県広川町も「広川」という川の名にちなむ町名であり、両町とも町の中心地帯を同名の川が流れる
    kind: fact
    level: E2
    status: established
    sources:
    - h5-hirogawa-wakayama-gaiyo
  - text: 異なる層として、福岡の「広川」は合併で新しく作られた名ではなく、1889年以来3村が共有してきた地名を引き継いで一つの町名に統一したものである。和歌山のように川名を新たに町名へ採用した事例とは成り立ちが逆であり、読みも「ひろかわまち」と異なる
    kind: fact
    level: E2
    status: established
    sources:
    - h5-hirogawa-fukuoka-enkaku
    - h5-hirogawa-kotobank
  - text: 地方公共団体情報システム機構（J-LIS）のコード一覧で、広川町の団体コードは405442とされている
    kind: fact
    level: E2
    status: established
    sources:
    - h5-jlis-fukuoka
  column:
    title: 上・中・下、川の流れで分かれていた三つの「広川」
    text: 福岡の広川町の前身は、川の上流から下流へ、上広川村・中広川村・下広川村と並んでいました。同じ川の流域に暮らしながら、1889年以来ずっと別々の村だったのです。1955年4月にまず上と中が合併して広川町になり、下は同年12月にようやく一部が町へ加わりましたが、残りは筑後市や筑邦町へと分かれました。一つの川の名前を分け合っていた三つの村が、一つの町に結び直されたのが、この町の成り立ちです。
    sources:
    - h5-hirogawa-fukuoka-enkaku
    - h5-hirogawa-fukuoka-ayumi
  relations:
  - pref/40
  - muni/30-広川町
  unknowns:
  - 川名「広川」の語源（広い川原・氾濫原に由来するか等）の町史・地名辞典での確認は未了
  - 町村制以前の「広川村」の成立時期、近世の村名としての初出は未確認
  updated: '2026-11-13'
- id: muni/40-福岡市
  code: '401307'
  names:
    ja: 福岡市
    reading: ふくおかし
    aliases:
    - 博多
    - 福崎
    - 那の津（那津）
  user_terms:
  - 福岡市と博多市はなぜ分かれていたの
  - 福岡と博多 どっちが古い地名
  - 那の津ってどこ
  - 市名は福岡なのに駅名は博多なのはなぜ
  naming_type: 新規命名
  prefecture: 福岡県
  homonyms: []
  summary: 市名「福岡」は、1601年に黒田長政が博多の西隣に築いた城下町の名で、長政が先祖ゆかりの備前福岡にちなんで命名したと地誌が伝える。その下には、古代の港「那津（那の津）」と中世以来の貿易港「博多」という古い地名の層があり、1889年の市制施行では福岡と博多が一つの市となり、市名を福岡とするか博多とするかが争われた。
  first_attestation:
    era: 慶長6年
    year_western: 1601
    document: 福岡城・城下町の命名（経緯は『筑前国続風土記』等に記録）
    note: 市名「福岡」そのものの起源。地名の層としては、8世紀の記録に現れる「博多」、さらに古い「那津」が下に重なる
  claims:
  - text: 市名「福岡」は、1601年（慶長6年）に黒田長政が那珂川西岸の福崎の地に築いた城下町の名に由来し、1889年（明治22年）の市制施行でそのまま市名となった
    kind: fact
    level: E2
    status: established
    sources:
    - f-fukuoka-city
    - f-fukuoka-ndl
  - text: 『筑前国続風土記』は、長政が黒田氏先祖ゆかりの備前国邑久郡福岡にちなんで「福岡」と名付けたと記すと、福岡市史関係資料と国立国会図書館レファレンスが紹介している
    kind: fact
    level: E2
    status: established
    sources:
    - f-cap-chikuzen-fudoki-zoku
    - f-fukuoka-ndl
    - f-fukuoka-city
  - text: 命名の動機については、備前福岡由来説に対し、築城地の旧名「福崎」の丘陵地にちなむとする説もあり、完全には決着していない
    kind: fact
    level: E3
    status: contested
    sources:
    - f-fukuoka-ndl
  - text: 那珂川を挟んだ東側の博多は、もともと博多湾岸一帯を指す広い地名で、中世以降は国際貿易の中心となった都市部分を指すようになったと福岡市史コラムは説明する
    kind: fact
    level: E2
    status: established
    sources:
    - f-fukuoka-city
  - text: 「博多」の文献上の初出は、『続日本紀』（797年完成）の天平宝字3年（759年）の記事にみえる「博多大津」であると福岡市（博多港の歴史）が紹介している
    kind: fact
    level: E2
    status: established
    sources:
    - f-cap-fukuoka-city-port
  - text: さらに古い層として、港は「那津（那の津）」と呼ばれ、『日本書紀』宣化天皇元年（536年）条には、那津の口に穀物を集める官家（那津官家）を造った記事があることを福岡市博物館が紹介している
    kind: fact
    level: E2
    status: established
    sources:
    - f-cap-fukuoka-museum-nanotsu
  - text: 1889年の市制施行後も、市会では「博多市」への改称が争われ、僅差で「福岡」が維持された話が有名であると福岡市史コラムは伝える
    kind: fact
    level: E2
    status: established
    sources:
    - f-fukuoka-city
  - text: 博多の名は、駅名として残ったほか、1972年（昭和47年）に福岡市が政令指定都市へ移行した際、行政区名「博多区」として復活した
    kind: fact
    level: E2
    status: established
    sources:
    - f-fukuoka-city
  - text: 「ハカタ」の語源は確定しておらず、福岡市史コラムも湾岸の地形に由来するという見方を紹介するにとどまる
    kind: fact
    level: E2
    status: indeterminate
    sources:
    - f-fukuoka-city
  column:
    title: 市名は福岡、駅名は博多——妥協が生んだ二つの顔
    text: 1889年、福岡と博多は一つの市になったが、市名をどちらにするかは最後までもめた。人口では博多が福岡を上回っていた時期もあり、翌年の市会でも改称案が争われたと福岡市史は伝える。決着の落としどころとして、同年に開業した九州鉄道の駅名は「福岡駅」ではなく「博多駅」とされた。市役所のある市は福岡、九州最大のターミナル駅は博多、空港は福岡空港——このねじれは、那珂川を挟んで並立した武家の町と商人の町の、400年越しの力関係の化石である。
    sources:
    - f-fukuoka-city
  relations:
  - pref/40
  unknowns:
  - 「ハカタ」の語源（地形由来とされるが具体的な原義）は確定していない
  - 『日本書紀』の「那津」と『続日本紀』の「博多大津」が完全に同一の港を指すかについては検討を要すると専門事典が指摘しており、本KBでは断定しない
  - 福岡命名を命じた長政自身の同時代文書の現存は本調査では確認できず、命名経緯は後世の地誌と家譜に依拠する
  updated: '2026-11-13'
- id: muni/41-佐賀市
  code: '412015'
  names:
    ja: 佐賀市
    reading: さがし
    aliases:
    - 佐嘉
  user_terms:
  - 佐賀市と佐嘉はどう違う
  - 佐賀城下町はいつできた
  - 佐賀市の名前はどこから
  naming_type: その他（佐賀郡・城下町「佐賀」の名を継承して市制を施行）
  prefecture: 佐賀県
  homonyms: []
  summary: 市名は肥前国佐賀郡（古くは佐嘉郡）と、その郡内に育った城下町「佐賀」に由来する。郡名の由来は『肥前国風土記』が伝える「栄の国」伝説と「賢女」伝説が著名だが、いずれも伝承であり、「さが」の語源に定説はない。1889年に佐賀城下町を中心として市制が施行された。
  first_attestation:
    era: 奈良時代（風土記編纂期）
    year_western: null
    document: 肥前国風土記
    note: 「佐嘉郡」の名と由来譚が記録された最古級の資料。風土記自体は713年の編纂命令に基づく
  claims:
  - text: 市名「佐賀」は佐賀郡・城下町の名に由来し、1889年（明治22年）4月1日の市制施行で、佐賀城下町を中心とした佐賀市が誕生した
    kind: fact
    level: E2
    status: established
    sources:
    - f-cap-saga-city-profile
    - f-cap-saga-city-plan
  - text: 『肥前国風土記』佐嘉郡条には、郡名の由来として2つの異なる由緒が併記されている
    kind: fact
    level: E2
    status: established
    sources:
    - f-cap-hizen-fudoki
    - f-saga-city-fudoki
  - text: 風土記の一説では、村に生えた樟（楠）の大木が朝夕の影で隣郡の山々を蔽うほど栄え、日本武尊が「此の国は栄の国と謂うべし」と述べたため栄郡と号し、後に佐嘉郡に改めたと伝える
    kind: legend
    level: E2
    status: established
    sources:
    - f-cap-hizen-fudoki
    - f-saga-city-fudoki
  - text: 風土記のもう一説では、佐嘉川の荒ぶる神を鎮める方策を説いた土蜘蛛の大山田女・狭山田女が「賢女（さかしめ）」と讃えられ、賢女郡と号したものが訛って佐嘉郡になったと伝える
    kind: legend
    level: E2
    status: established
    sources:
    - f-cap-hizen-fudoki
    - f-saga-city-fudoki
  - text: 「さが」の語源については、満潮時に逆流する川にちなむ「逆川」説、傾斜地を指す「坂」説、砂丘地を指す「洲処（すが）」の転訛説などがあり、定説は定まっていない
    kind: fact
    level: E3
    status: contested
    sources:
    - f-saga-city-fudoki
  - text: 表記は古く「佐嘉」が正式で「佐賀」も並行して使われ、明治初年に「佐賀」へ統一されたが、統一の年を1870年とする資料と1872年とする資料がある
    kind: fact
    level: E2
    status: contested
    sources:
    - f-saga-city-fudoki
  - text: 戦国期に龍造寺氏の城下町として発展した佐賀は、1608年（慶長13年）に鍋島直茂が藩主となって佐賀城の総普請が始まり、鍋島氏の城下町として整備された
    kind: fact
    level: E2
    status: established
    sources:
    - f-cap-saga-city-profile
  - text: 現在の市域は、2005年（平成17年）に諸富町・大和町・富士町・三瀬村と、2007年（平成19年）に川副町・東与賀町・久保田町と合併して拡大したもので、1889年の市域は佐賀平野中央部の城下町周辺にとどまっていた
    kind: fact
    level: E2
    status: established
    sources:
    - f-cap-saga-city-plan
  column:
    title: 「佐嘉」と「佐賀」、千年並んだ二つの表記
    text: 佐賀の表記は、奈良時代の『肥前国風土記』以来「佐嘉」が正式とされながら、「佐賀」も古代から並行して使われ続けた。どちらも読みは「さが」で、意味の違いはほとんど意識されないまま千年以上が過ぎ、統一されたのは明治初年のことである（年については1870年説と1872年説がある）。いまもJRの駅は「佐賀駅」だが、佐賀県のゆるキャラ的な話題や老舗の屋号には「佐嘉」の字が残る。表記の統一が遅れた分だけ、古い字のほうにも愛着が残った土地柄といえる。
    sources:
    - f-saga-city-fudoki
  relations:
  - pref/41
  unknowns:
  - 「佐嘉」から「佐賀」への表記統一の正確な年月は資料間で一致せず、本調査では特定できなかった
  - 風土記の2つの由来譚のうち、どちらが実際の郡名成立に近いかは資料上判断できない
  - 「さが」の語源は確定していない
  updated: '2026-11-13'
- id: muni/42-佐世保市
  code: '422029'
  names:
    ja: 佐世保市
    reading: させぼし
    aliases: []
  user_terms:
  - 佐世保の名前の由来
  - 佐世保の軍港はいつできた
  - 村から一足とびに市になった
  - サセブの木って何
  naming_type: その他（旧村名「佐世保」を継承し、村から直接市制を施行）
  prefecture: 長崎県
  homonyms: []
  summary: 明治初期までは大村湾の奥の村にすぎなかった佐世保が、海軍鎮守府の設置で軍港都市として急成長し、1902年に村から一足とびに市制を施行した。「佐世保」という地名の由来には定説がなく、木の名に由来する説と、「狭瀬＋保（中世の行政単位）」とする説などが市史に併記されている。
  first_attestation:
    era: null
    year_western: null
    document: 「佐世保」という地名（「保」は中世の行政単位に由来するとの説がある）
    note: 地名の確実な初出年は本調査では確認できなかった。1902年の市制施行時点では佐世保村の村名として定着していた
  claims:
  - text: 1902年（明治35年）4月、佐世保村は村から一足とびに市制を施行して佐世保市となった。当時は7,700世帯・人口約45,800人に達していた（地方公共団体コードは422029）
    kind: fact
    level: E2
    status: established
    sources:
    - k6-sasebo-city-seigaiyou
    - b-cap-chiba-soumu-code
  - text: 急成長の契機は1886年（明治19年）の海軍鎮守府の設置決定と1889年（明治22年）の鎮守府開庁で、それまで佐世保は大村湾口よりさらに深奥の村にすぎなかったと佐世保市は説明する
    kind: fact
    level: E2
    status: established
    sources:
    - k6-sasebo-city-seigaiyou
  - text: 地名「佐世保」の由来については定説と呼ばれるものがなく、佐世保市立図書館は『佐世保市史』総説篇などに基づいて諸説を紹介している
    kind: fact
    level: E2
    status: established
    sources:
    - k6-sasebo-ndl-crd
  - text: 由来の一説として、この地に「サセブ」と呼ばれる木（和名シャシャンボ、古名サシブノキ）が繁茂していたからとする説が市史に記されている
    kind: fact
    level: E2
    status: contested
    sources:
    - k6-sasebo-ndl-crd
  - text: もう一つの説として、「佐世（サセ）」は狭い川瀬を意味する「狭瀬（サセ）」で、「保」は中世の行政単位の一つであるとする説がある
    kind: fact
    level: E2
    status: contested
    sources:
    - k6-sasebo-ndl-crd
  - text: 1945年（昭和20年）の空襲と終戦で軍港としての機能を失った後は、旧軍港の遺産を活用する平和産業港湾都市への転換が進められた
    kind: fact
    level: E2
    status: established
    sources:
    - k6-sasebo-city-seigaiyou
  column:
    title: 村から一足とびに市へ——軍港が作った都市
    text: 普通、市になるにはまず町になる段階を踏む。ところが佐世保は、1902年に村から直接、市になった。理由は単純で、海軍鎮守府が置かれてから十数年の間に、湾奥の寒村へ人が殺到したからである。地名の由来が定まらないのも、この都市の性格を映している。城下町のように長い時間をかけて名が育ったのではなく、軍港という国家事業が先に来て、まちが後から膨らんだ。その出発点の古い地名の記憶は、市史にも諸説併記の形でしか残らなかった。
    sources:
    - k6-sasebo-city-seigaiyou
    - k6-sasebo-ndl-crd
  relations:
  - pref/42
  unknowns:
  - 「佐世保」の文献上の確実な初出（中世文書での用例）は本調査では確認できなかった
  - 「佐世」という小字・人名との関係（佐世氏説の有無）は市史総説篇の直接確認が未了
  updated: '2026-11-13'
- id: muni/42-長崎市
  code: '422011'
  names:
    ja: 長崎市
    reading: ながさきし
    aliases:
    - 長埼
    - 永埼
  user_terms:
  - 長崎市の名前は長い岬から
  - 長崎氏って誰
  - 長崎はいつ開港したの
  - 長崎市はいつできた
  naming_type: その他（港町「長崎」の名をそのまま市名とした）
  prefecture: 長崎県
  homonyms: []
  summary: 市名は港町「長崎」に由来する。地名の起源には、長崎港に突き出した「長い岬」にちなむ説と、在地豪族・長崎氏にちなむ説があり、長崎市関連資料も両説を併記する。1571年の開港で貿易港として発展し、1889年に旧幕府直轄地を中心とした区域で市制が施行された。
  first_attestation:
    era: 嘉禎3年
    year_western: 1237
    document: 福田文書等にみえる長崎小太郎重綱の知行記録（研究経由）
    note: 鎌倉初期に「長埼浦」の地頭職を知行した長崎氏の存在が確認できる時点。地名自体はこれ以前から存在した可能性が高い
  claims:
  - text: 市名「長崎」は港町の名に由来し、1889年（明治22年）4月1日に市制が施行されたときの市域は、旧幕府直轄地を中心とした区域であった
    kind: fact
    level: E2
    status: established
    sources:
    - f-cap-nagasaki-city-fuuchi
    - f-cap-nagasaki-city-chronology
  - text: 地名「長崎」の由来には、諏訪神社付近から長崎港へ突き出した長い岬の地形にちなむとする説がある
    kind: fact
    level: E2
    status: contested
    sources:
    - f-nagasaki-city-magazine
    - f-nagasaki-city-profile
  - text: もう一つの説は、室町時代に移住してきた豪族・長崎氏（永崎氏）の名に由来するとするもので、長崎市関連資料は岬説と長崎氏説の2説を併記している
    kind: fact
    level: E2
    status: contested
    sources:
    - f-nagasaki-city-magazine
  - text: 鎌倉初期の嘉禎3年（1237年）頃、長崎小太郎重綱が長埼浦の地頭職を知行する御家人であったことが、後の研究で判明している
    kind: fact
    level: E2
    status: established
    sources:
    - f-nagasaki-city-magazine
  - text: 野母崎半島を指す「長か岬（ながかみさき）」が方言で「なんかみさき」と転訛して「長崎」になったという説明は、地元で語られる俗説として伝えられている
    kind: legend
    level: E4
    status: established
    sources:
    - f-nagasaki-city-magazine
  - text: 長崎の発展は元亀2年（1571年）のポルトガル船入港と開港を画期とし、大村純忠のもとで岬の周辺に6町の町建てが進んだ
    kind: fact
    level: E2
    status: established
    sources:
    - f-nagasaki-city-magazine
    - f-nagasaki-city-profile
  - text: 開港当時の長崎の領主格であった長崎甚左衛門純景は長崎氏の後裔で、大村純忠の娘を妻とし、自らもキリシタンとなった
    kind: fact
    level: E2
    status: established
    sources:
    - f-nagasaki-city-magazine
  - text: 現在の市域は、2005年（平成17年）に香焼・伊王島・高島・野母崎・三和・外海の6町、2006年（平成18年）に琴海町と合併して拡大したもので、開港時の町域とは大きく異なる
    kind: fact
    level: E2
    status: established
    sources:
    - f-nagasaki-city-profile
  column:
    title: 町の中心は、岬の付け根から先端へ移った
    text: 開港前の長崎の中心は、諏訪神社の鎮座する森崎——岬の付け根あたりの集落だった。ところが1571年の開港とともに、大村純忠は岬の先のほうに横瀬浦町・平戸町・外浦町・大村町・文治町・嶋原町という6つの新しい町を建て、貿易の拠点をそちらへ寄せた。現在の県庁・市役所通りのあたりがその6町に相当する。つまり「長崎」という町の重心は、開港の瞬間に岬を少し下った場所へ引っ越したのであり、古い中心は神社の門前として残った。
    sources:
    - f-nagasaki-city-magazine
    - f-cap-nagasaki-magazine2
  relations:
  - pref/42
  unknowns:
  - 「長崎」の語が文献に現れる正確な初出（表記は永埼・長埼など）は本調査では一次史料で直接確認できておらず、1237年の知行記録は研究紹介経由の確認である
  - 岬由来説と長崎氏由来説の先後関係（地名が先か苗字が先か）は確定していない
  updated: '2026-11-13'
- id: muni/43-小国町
  code: '434248'
  names:
    ja: 小国町
    reading: おぐにまち
    aliases:
    - 小国郷
    - 北小国村
  user_terms:
  - 小国町の名前の由来
  - 国小なりの伝説
  - 小国郷とはどこ
  naming_type: その他
  prefecture: 熊本県
  homonyms:
  - muni/06-小国町
  summary: 阿蘇の北側に広がる小国郷の名の継承。中世の文書に「小国之分」と見える地域で、1889年に北小国村・南小国村に分かれ、1935年に北小国村が町制施行と同時に「小国町」へ改称した。町公式は地名の起こりとして、健磐竜命にまつわる「臣が国小なり」という言葉から「小国」が生まれたという伝説を、『小国郷史』由来の話として伝える。
  first_attestation:
    era: 室町時代（文明16年）
    year_western: 1484
    document: 阿蘇家文書「阿蘇十二社同霜宮最花米注文」（「小国之分」）
    note: 『日本歴史地名大系』の記載として阿蘇ペディアが紹介するもの。原典は未読のため紹介として記録する。より古い用例として『豊後国風土記』の「小国の峯」が南小国町の町名由来（熊本県資料）に紹介されるが、原文での確認は未了
  claims:
  - text: 阿蘇神社の祭神・健磐竜命が阿蘇山上から放った矢の落ちた御矢の原（現在の宮原）の地主・大河片澄が、巡視に来た二神を迎えて「臣が国、小なりと雖も、青山四方を巡りて住み吉の国なり」と申し上げた。その言葉の中の「国小なり」から「小国」の地名が生まれたという話が、『小国郷史』からの引用として町公式・熊本県資料に伝えられる
    kind: legend
    level: E2
    status: established
    sources:
    - h3-oguni-k-town
    - h3-oguni-k-pref
  - text: 文明16年（1484年）の阿蘇家文書「阿蘇十二社同霜宮最花米注文」に「小国之分」の記載があり、郷内の二十数か村の名が見えることを『日本歴史地名大系』が紹介していると阿蘇ペディアが伝える
    kind: fact
    level: E4
    status: established
    sources:
    - h3-oguni-k-asopedia
  - text: 中世の小国郷は阿蘇本社領に属し、満願寺・宮原・上田・北里などの村が含まれていたと阿蘇ペディアが伝える
    kind: fact
    level: E4
    status: established
    sources:
    - h3-oguni-k-asopedia
  - text: 明治3年（1870年）に旧25か村が9か村となり、明治22年（1889年）の町村制施行で北小国村（6か村）と南小国村（3か村）に分かれた
    kind: fact
    level: E2
    status: established
    sources:
    - h3-oguni-k-town
  - text: 北小国村は昭和10年（1935年）4月1日に町制を施行し「小国町」と改称した。町公式は、人口11,000人余で県内で唯一の人口1万人以上の村だったことなどを、その背景として記す
    kind: fact
    level: E2
    status: established
    sources:
    - h3-oguni-k-town
  - text: 山形県小国町とは、山に囲まれた盆地の郷名「小国」を継ぐ点で共通する。異なるのは、本町では「国小なり」の言葉に由来するという伝説が『小国郷史』以来の説明として公式に伝えられている点で、山形側には対応する命名伝説が確認できない
    kind: fact
    level: E3
    status: established
    sources:
    - h3-oguni-k-town
    - h3-oguni-jk
  - text: 総務省「地方公共団体コード一覧」では本町のコードは434248とされる
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 矢が落ちた原と「御矢の原」
    text: 伝説で健磐竜命の矢が落ちたとされる「御矢の原」は、現在の宮原にあたると町は説明します。宮原は今も町の中心地で、役場や商店が集まります。地名の伝説が現在の中心地と結びついて語り継がれているのが、この町の伝承の特徴です。
    sources:
    - h3-oguni-k-town
    - h3-oguni-k-pref
  relations:
  - pref/43
  - muni/06-小国町
  unknowns:
  - 「小国郷」の文書上の初出の確定（『豊後国風土記』の「小国の峯」の原文確認を含む）
  - 伝説とは別に、歴史地名としての「小国」の成立理由を専門資料がどう説明するか
  updated: '2026-11-13'
- id: muni/43-熊本市
  code: '431001'
  names:
    ja: 熊本市
    reading: くまもとし
    aliases:
    - 隈本
  user_terms:
  - 熊本は昔は隈本だったの
  - 清正が熊の字に変えた理由
  - 隈本城と熊本城は同じ場所
  - 熊本市はいつできた
  naming_type: その他（城下町名の継承。ただし表記は近世初頭に「隈本」から「熊本」へ改められた）
  prefecture: 熊本県
  homonyms: []
  summary: 市名は城下町「熊本」に由来し、その旧表記は「隈本」である。隈本の名は南北朝時代の軍忠状に確認でき、1607年の熊本城完成の頃に「隈」から「熊」へ表記が改められたとされる。改字の理由として語られる「畏を嫌った」という説明は伝承の域を出ない。1889年に市制が施行された。
  first_attestation:
    era: 観応2年
    year_western: 1351
    document: 伊東氏祐軍忠状
    note: 「隈本在陣」とあり、「隈本」の初見とされる（熊本市の講座資料による）。「隈本城」の初見は永和3年（1377年）の大嶋堅軍忠状
  claims:
  - text: 市名「熊本」は城下町の名に由来し、熊本市は1889年（明治22年）の市制施行以来、周辺町村との合併を繰り返して発展してきた
    kind: fact
    level: E2
    status: established
    sources:
    - f-cap-kumamoto-city-plan
  - text: 「隈本」の初見は観応2年（1351年）の伊東氏祐軍忠状の「隈本在陣」で、「隈本城」の初見は永和3年（1377年）の大嶋堅軍忠状である
    kind: fact
    level: E2
    status: established
    sources:
    - f-cap-kumamoto-city-lecture
  - text: 中世の隈本城は茶臼山の一角に築かれた城で、現在の熊本城の本丸一帯とは位置が少しずれており、近世の城とは区別して「古城」と呼ばれている
    kind: fact
    level: E2
    status: established
    sources:
    - f-cap-kumamoto-city-lecture
    - f-kumamoto-kotobank
  - text: 1607年（慶長12年）の熊本城完成の頃、「隈本」から「熊本」への表記変更が行われたとされる
    kind: fact
    level: E2
    status: established
    sources:
    - f-kumamoto-maff
  - text: 加藤清正が「隈」の字に「畏（おそれる）」の字を含むことを嫌い、武将の居城にふさわしくないとして「熊」の字に改めた、と広く伝えられている
    kind: legend
    level: E2
    status: established
    sources:
    - f-kumamoto-maff
  - text: 「隈」は川の屈曲部や山の奥まった場所を指す地形語であり、隈本も地形に由来する地名とする見方が地名学では示されている
    kind: fact
    level: E3
    status: contested
    sources:
    - f-kumamoto-kotobank
  - text: 隈本の由来として、菊池氏の祖・菊池則隆が鞍岳から眺めた山並みの「隈取り」にちなんで隈本・隈府と名付けたとする伝承が語られている
    kind: legend
    level: E4
    status: established
    sources:
    - f-kumamoto-kikuchi
  - text: 熊本市は2012年（平成24年）4月1日に政令指定都市へ移行し、九州では福岡市・北九州市に次ぐ政令市となった
    kind: fact
    level: E2
    status: established
    sources:
    - f-cap-kumamoto-city-plan
  column:
    title: 清正は「くまもと城」を二つ造った
    text: 熊本城と聞いて思い浮かべる天守は加藤清正の新城だが、清正はそれ以前に、中世の隈本城を取り込んだ「古城」も造っている。熊本市の講座資料は「清正は新旧二つの『くまもと城』を造った」と整理する。中世の隈本城は茶臼山の一角にあり、新城の本丸とは場所がずれる。地名のほうも同じで、「隈本」の舞台は古城の側、「熊本」の舞台は新城の側というように、字の交代と城の交代がほぼ重なって起きた。だから熊本の中心市街を歩くと、中世と近世の二つの「くまもと」が同じ丘の上に重なっている。
    sources:
    - f-cap-kumamoto-city-lecture
  relations:
  - pref/43
  unknowns:
  - 加藤清正が隈本から熊本への改字を命じたことを示す同時代の正式文書の現存は、本調査では確認できなかった
  - 「隈本」の語源（地形由来か、その他か）は確定していない
  updated: '2026-11-13'
- id: muni/43-美里町
  code: '433489'
  names:
    ja: 美里町
    reading: みさとまち
    aliases: []
  user_terms:
  - 美里町の名前の由来
  - 中央町と砥用町が合併した町
  - 美里町は公募で決まった名前
  naming_type: 合併新設
  prefecture: 熊本県
  homonyms:
  - muni/04-美里町
  - muni/11-美里町
  summary: 2004年に中央町と砥用町が合併した際、全国公募と合併協議会の投票で決まった新町名。町公式・県資料には「いつまでも美しいふる里であって欲しい」という理由文が残り、「美しい里」型の命名であることが公式に確認できる。最終候補には「石橋町」「宇城東町」などもあった。
  first_attestation:
    era: 平成16年
    year_western: 2004
    document: 自治体名としての「美里町」（中央町・砥用町合併協議会の第18回協議会の投票で決定）
    note: 合併前の両町域に「美里」という地名があったかは未確認
  claims:
  - text: 平成16年（2004年）11月1日に中央町と砥用町が合併して美里町が誕生した。町名は全国から公募した中から選考し、「いつまでも美しいふる里でありますように」等の理由から美里町となったと町の公式ページが説明する
    kind: fact
    level: E2
    status: established
    sources:
    - h3-kumamoto-misato-town
  - text: 熊本県の市町村史資料によれば、最終候補は「あけぼの町」「石橋町」「宇城東町」「砥央町」「美里町」の5点で、第18回合併協議会の投票により「美里町」に決定した
    kind: fact
    level: E2
    status: established
    sources:
    - h3-kumamoto-misato-pref
  - text: 投票結果は美里町7票、宇城東町5票、石橋町4票、砥央町4票、あけぼの町1票だったと町の広報が伝える
    kind: fact
    level: E2
    status: established
    sources:
    - h3-kumamoto-misato-koho
  - text: 「美里」が候補に推された理由として「いつまでも美しいふる里であって欲しい」「山紫水明のごとき眺望」「山と水に恵まれ、人情味豊かで美しいふる里にしたい」などが県資料に記録されている
    kind: fact
    level: E2
    status: established
    sources:
    - h3-kumamoto-misato-pref
  - text: 3町とも合併新名で「美しい里」と読める字面は共通する。本町は理由文が公式に残り「美しい里」型の命名と確認できる点で、理由の確認できない宮城県美里町と異なる。埼玉県美里町は「平和な農村」への願いとして説明され、字義の中心がやや異なる
    kind: fact
    level: E2
    status: established
    sources:
    - h3-kumamoto-misato-town
    - h3-saitama-mayor
  - text: 総務省「地方公共団体コード一覧」では本町のコードは433489とされる
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 投票結果まで残る命名
    text: 最終候補5点と得票数（美里町7・宇城東町5・石橋町4・砥央町4・あけぼの町1）が町広報と県資料に残っており、全国公募から投票までの過程をたどることができます。「美しいふる里」という理由文とあわせ、平成期の合併新名としては記録の残り方が丁寧な部類です。
    sources:
    - h3-kumamoto-misato-pref
    - h3-kumamoto-misato-koho
  relations:
  - pref/43
  - muni/04-美里町
  - muni/11-美里町
  unknowns:
  - 公募の応募総数
  - 合併前の両町域に「美里」という字名・小地名があったか
  updated: '2026-11-13'
- id: muni/43-高森町
  code: '434281'
  names:
    ja: 高森町
    reading: たかもりまち
    aliases:
    - 高森手永
    - 色見村
    - 草部村
    - 野尻村
  user_terms:
  - 熊本の高森町の由来
  - 阿蘇の高森町 なぜ高森か
  - 高森殿の杉のある町
  naming_type: 一部の地名
  prefecture: 熊本県
  homonyms:
  - muni/20-高森町
  summary: 阿蘇郡の町。地名「高森」は江戸時代に細川藩の行政区画「高森手永」が置かれた古い地名で、1889年の町村制ですでに高森町が存在した。昭和30年（1955）の合併でも旧高森町の名がそのまま継承されており、合併新名ではなく既存地名の存続である。語源については「高貴なる阿蘇大神が一時、宮居を定めた森」に由来するという伝承が『日本大百科全書』に紹介されており、伝説として分離して記録する。同名の長野県高森町は1957年に本高森山から採った新名で、成り立ちが逆である。
  first_attestation:
    era: 明治22年
    year_western: 1889
    document: 町村制施行による高森町の発足
    note: 自治体としての初出は1889年だが、地名「高森」は江戸時代の行政区画「高森手永」に遡り、町村制以前から使われていた
  claims:
  - text: 江戸時代、町域は肥後細川藩の南郷郡代の管下にあり、高森手永と野尻手永に分かれて支配されていた
    kind: fact
    level: E2
    status: established
    sources:
    - h5-takamori-kumamoto-enkaku
  - text: 明治22年（1889）の町村制施行により、高森町・色見村・草部村・野尻村の1町3村になった
    kind: fact
    level: E2
    status: established
    sources:
    - h5-takamori-kumamoto-enkaku
  - text: 昭和30年（1955）4月に旧高森町・色見村・草部村が合併して新しい高森町が誕生し、昭和32年（1957）8月には野尻村が編入された
    kind: fact
    level: E2
    status: established
    sources:
    - h5-takamori-kumamoto-kaso
  - text: 町名の由来について、当地方の伝承として「高貴なる阿蘇大神が一時、宮居を定めた森」に由来すると伝えられている
    kind: legend
    level: E3
    status: established
    sources:
    - h5-takamori-kotobank
  - text: 町内では、戦国時代に高森一帯を治めた高森城主・高森伊予守惟居を指す「高森殿」の名が残り、「高森殿の杉」が観光地となっている
    kind: fact
    level: E4
    status: established
    sources:
    - h5-takamori-kanko-sugi
  - text: 異なる層として、同名の長野県高森町は1957年に両村を結ぶ本高森山から新たに名付けられた合併新名であるのに対し、熊本の高森は江戸期以来の地名で、合併では旧高森町の名がそのまま継承された
    kind: fact
    level: E2
    status: established
    sources:
    - h5-takamori-nagano-handbook
  - text: 共通する層として、両町とも「森」を含む名が山地の地形と結びついた町であり、昭和の大合併期に現在の町として発足した点は共通する
    kind: fact
    level: E2
    status: established
    sources:
    - h5-takamori-kumamoto-kaso
    - h5-takamori-nagano-handbook
  - text: 熊本県の地方公共団体コード一覧で、高森町の団体コードは434281とされている
    kind: fact
    level: E2
    status: established
    sources:
    - h5-kumamoto-codes
  column:
    title: 神の森と、「高森殿」の杉
    text: 熊本の高森には、地名をめぐる物語が二つ重なっています。一つは『日本大百科全書』が伝える「高貴なる阿蘇大神が一時、宮居を定めた森」という伝承で、「高森」を神の森として語る層です。もう一つは歴史の層で、戦国時代に高森城を拠点に一帯を治めた高森伊予守惟居は「高森殿」と呼ばれ、その名を残す「高森殿の杉」が今も観光地になっています。神話の森と戦国の殿様。古い地名には、こうして何層もの物語が積み重なります。
    sources:
    - h5-takamori-kotobank
    - h5-takamori-kanko-sugi
  relations:
  - pref/43
  - muni/20-高森町
  unknowns:
  - 「高森」の語源を確定する中世の文書（高森郷・高森村などの記載）の確認は未了であり、伝承以外の定説は本調査で確認できなかった
  - 高森手永の設置年など、江戸時代初期の行政区画としての「高森」の詳細は未確認
  updated: '2026-11-13'
- id: muni/44-別府市
  code: '442020'
  names:
    ja: 別府市
    reading: べっぷし
    aliases:
    - 別符
  user_terms:
  - 別府の名前の由来
  - 別符とは何か
  - 別府は別荘の意味なの
  - 別府市はいつできたの
  naming_type: その他（中世の荘園「石垣別符」に由来する地名を継承）
  prefecture: 大分県
  homonyms: []
  summary: 「別府」は温泉の町の名前である前に、中世の土地制度の名前だった。豊後国速見郡朝見郷に成立した宇佐宮領の荘園「石垣別符（別府）」がその核で、「別符」とは国衙領などに特別の符宣で設けられた特別区域を指す。温泉地としての繁栄はずっと後のことである。
  first_attestation:
    era: 平安時代末期
    year_western: null
    document: 宇佐宮領「石垣別符（別府）」の成立（『国史大辞典』の説明による）
    note: 別符という制度そのものの成立期。地名としての確実な初出年は未確認
  claims:
  - text: 市名「別府」は、豊後国速見郡朝見郷の内に成立した宇佐宮領「石垣別符」に由来すると『国史大辞典』は説明し、国立国会図書館のレファレンス事例が紹介している（地方公共団体コードは442020）
    kind: fact
    level: E2
    status: established
    sources:
    - k6-beppu-ndl-crd
    - b-cap-chiba-soumu-code
  - text: 「別符（別府）」とは、平安末期に国衙領などを中心として特別の符宣により成立した特別区域を指す土地制度の名で、その地名化した代表例が大分県の別府であると『日本大百科全書』は説明する
    kind: fact
    level: E2
    status: established
    sources:
    - k6-beppu-ndl-crd
  - text: 『別府市誌』は「別府の地名は朝見弁分（別符）から」とし、石垣荘が宇佐宮に寄進されて石垣別符となり、その行政の中心地がやがて別府と呼ばれるようになったと説明する
    kind: fact
    level: E2
    status: established
    sources:
    - k6-beppu-ndl-crd
  - text: 別府市の公式資料も、荘園時代に新しく開かれた区域を指す「別符」がのちに「別府」と書かれるようになり、地名となったと伝えられていると説明する
    kind: fact
    level: E2
    status: established
    sources:
    - k6-beppu-city-gaiyo
  - text: 別府温泉についての最古の記録は『豊後国風土記』とされ、現在の鉄輪地区には古代から「地獄」が存在したことが記されていると別府市は紹介する
    kind: fact
    level: E2
    status: established
    sources:
    - k6-beppu-city-gaiyo
  - text: 1906年（明治39年）に別府町が誕生し、1924年（大正13年）4月1日に人口36,276人をもって別府市が誕生した
    kind: fact
    level: E2
    status: established
    sources:
    - k6-beppu-city-gaiyo
  - text: 少数説として、『日本国語大辞典』は「ベップ」をアイヌ語の川の意とするバチェラーの説を紹介しているが、主流の説明は別符由来説である
    kind: fact
    level: E2
    status: contested
    sources:
    - k6-beppu-ndl-crd
  column:
    title: 温泉の前に荘園があった——「別荘」ではない別府
    text: 「別府」と聞くと、貴人の別荘が集まった土地を思い浮かべる人が多い。だがこの言葉の正体は、平安末期の土地制度である。荘園や国衙領の中で、特別な命令文書（符宣）によって切り離された区域を「別符」と呼んだ。その地名化の代表例がこの別府で、「符」の字が「府」に書き換わり、制度の名が町の名になった。温泉で名高い現在の別府は、その中世の土地区画の名を、今もそのまま背負っている。
    sources:
    - k6-beppu-ndl-crd
  relations:
  - pref/44
  unknowns:
  - 石垣別符の成立年と、文書上「別府」と書かれた最初の年は、本調査では確認できなかった
  - 現在の市街地と中世の別符の範囲との具体的な重なりは未確認
  updated: '2026-11-13'
- id: muni/44-大分市
  code: '442011'
  names:
    ja: 大分市
    reading: おおいたし
    aliases:
    - 府内
    - 碩田
  user_terms:
  - 大分市は昔は府内だったの
  - 大分市はいつできた 1963年合併
  - 碩田と大分の関係
  - 鶴崎はなぜ大分市になった
  naming_type: 合併新設
  prefecture: 大分県
  homonyms: []
  summary: 現在の大分市は1963年に旧大分市・鶴崎市など6市町村が合併して発足した新設市で、名は豊後国大分郡の郡名「大分」を継いだ。「大分」は『日本書紀』『豊後国風土記』の碩田（おおきた）の故事に結びつけられるが、地形に由来するとする対立説もある。近世までの中心地の名は、国府にちなむ「府内」だった。
  first_attestation:
    era: 古代（日本書紀・景行天皇紀）
    year_western: null
    document: 日本書紀
    note: 「碩田國に到りたまふ…碩田、此れをば於保岐陀と云う」とあり、音「おおきた」の最古級の記録。景行天皇の年代自体は伝承上のもので実年代は特定できない。市名としての「大分」の直接の起点は1911年の大分町の市制施行である
  claims:
  - text: 現在の大分市は、1963年（昭和38年）3月10日に旧大分市・鶴崎市・大南町・大分町・大在村・坂ノ市町が合併して発足した
    kind: fact
    level: E2
    status: established
    sources:
    - f-cap-oita-city-chronology
  - text: 最初の「大分市」は、1911年（明治44年）に大分町が市制を施行して成立した
    kind: fact
    level: E2
    status: established
    sources:
    - f-cap-oita-city-chronology
  - text: 市名「大分」は豊後国大分郡の郡名に由来し、大分県の県名も同じ郡名から採られている
    kind: fact
    level: E2
    status: established
    sources:
    - f-oita-pref
  - text: 『日本書紀』と『豊後国風土記』には景行天皇の言葉として碩田の命名が記され、この「碩田（おおきた）」が後に「大分」と書かれるようになったと大分県公式は説明する
    kind: fact
    level: E2
    status: established
    sources:
    - f-cap-bungo-fudoki
    - f-oita-pref
  - text: 景行天皇が巡幸先で土地を眺めて「碩田」と命名したという物語そのものは、記紀・風土記に共通する天皇命名譚であり、史実の命名行為としてではなく伝承として扱うべき性格のものである
    kind: legend
    level: E2
    status: established
    sources:
    - f-cap-bungo-fudoki
    - f-oita-pref
  - text: 語源については、「キダ（段）」と「分」から、谷や川、山によって大きく刻み分けられた土地を表す言葉とする地形説も大分市歴史資料館が紹介しており、碩田の故事と併存している
    kind: fact
    level: E2
    status: contested
    sources:
    - f-cap-oita-city-exhibition
  - text: 近世までの中心地は「府内」と呼ばれた。大分郡には豊後国の国府が置かれ、その名残は近世の府内城・府内藩の名に残った
    kind: fact
    level: E2
    status: established
    sources:
    - f-cap-oita-city-history-env
  - text: 国府の中心と推定される大規模な官衙遺跡は大分川流域の台地上で見つかっており、近世の府内城下が大分川河口側に形成されたことと合わせ、古代の中心と近世以降の中心市街地とは位置がずれている
    kind: fact
    level: E2
    status: established
    sources:
    - f-cap-oita-city-history-env
  column:
    title: 「府内」から「大分」へ、中心の名前が交代した街
    text: 大分の中心市街は、江戸時代までずっと「府内」と呼ばれてきた。国府のある土地という意味の、全国各地にあった普通名詞的な地名である。ところが明治になると表舞台に立ったのは郡名の「大分」のほうで、1911年の市制施行で大分市が成立し、府内は城の名や学校名などに残るだけになった。さらに1963年には、江戸時代は別の支配を受けた港町・鶴崎などと合併して新・大分市が発足する。「国府の府内」「郡名の大分」「合併都市の大分市」と、中心の呼び名が時代ごとに交代してきた街である。
    sources:
    - f-cap-oita-city-history-env
    - f-cap-oita-city-chronology
  relations:
  - pref/44
  unknowns:
  - 「碩田」から「大分」への表記変更がいつ、どの文書で確認できるかは本調査では特定できなかった
  - 「府内」の呼称が文献に現れる初出は本調査では確認できなかった
  - 1963年の合併で市名を「大分市」とすることに決まった経緯（候補名の有無など）は本調査では確認できなかった
  updated: '2026-11-13'
- id: muni/44-由布市
  code: '442135'
  names:
    ja: 由布市
    reading: ゆふし
    aliases:
    - 柚富
  user_terms:
  - 由布市の名前の由来
  - 湯布院と由布院の違い
  - 由布市はいつできたの
  - 柚富郷とは何か
  naming_type: 合併新設
  prefecture: 大分県
  homonyms: []
  summary: 2005年10月1日、挾間町・庄内町・湯布院町の3町が合併して誕生した市。市名「由布」は合併時の一般公募で最多票を得てそのまま選ばれたとされ、その語源はさらに古く、『豊後国風土記』に記される「柚富（ゆふ）」郷に遡る。旧湯布院町の「湯布院」とJRの駅名「由布院駅」の表記の違いでも知られる。
  first_attestation:
    era: 奈良時代
    year_western: null
    document: 豊後国風土記・大分郡柚富郷条
    note: 「柚富（ゆふ）」の初出級の資料。市名としての「由布市」は2005年に成立した
  claims:
  - text: 2005年（平成17年）10月1日、由布院町と湯平村の合併で生まれた湯布院町を含む挾間町・庄内町・湯布院町の3町が新設合併して、由布市が誕生した（地方公共団体コードは442135）
    kind: fact
    level: E2
    status: established
    sources:
    - k6-yufu-city-textbook
    - b-cap-chiba-soumu-code
  - text: 市名「由布市」は、合併に際して行われた一般公募で圧倒的に最多の票を得て、そのまま選出されたとWikipediaは合併協議会資料等に基づいて紹介する
    kind: fact
    level: E5
    status: established
    sources:
    - k6-yufu-wikipedia
  - text: 「由布（ゆふ）」の語源は『豊後国風土記』の大分郡柚富郷に遡り、同郷の条には、郷内に栲（こうぞ）の木が多く生え、その皮を取って木綿（ゆう）を作ったので「柚富郷」と名づけた、という地名由来の記事があることが知られる
    kind: fact
    level: E3
    status: established
    sources:
    - k6-yufu-kotobank-yufudake
    - k6-yufu-wikipedia
  - text: 由布岳は『豊後国風土記』に「柚富峯」と記され、近くに柚富郷があったことからその名がついたと『日本歴史地名大系』は説明する
    kind: fact
    level: E3
    status: established
    sources:
    - k6-yufu-kotobank-yufudake
  - text: 旧湯布院町は1955年（昭和30年）に由布院町と湯平村が合併して生まれた町で、「湯平」の「湯」と「由布院」の「布院」を合わせた合成地名である
    kind: fact
    level: E2
    status: established
    sources:
    - k6-yufu-city-textbook
  - text: JR久大本線の駅名は「由布院駅」で、町名として生まれた「湯布院」とは表記が異なると由布市の副読本は説明する
    kind: fact
    level: E2
    status: established
    sources:
    - k6-yufu-city-textbook
  - text: 由布川は旧湯布院町・旧庄内町・旧挾間町にまたがって流れ、「由布」は3町に共通する地域の名でもあった
    kind: fact
    level: E5
    status: established
    sources:
    - k6-yufu-wikipedia
  column:
    title: 「湯布院」と「由布院」——同じ温泉地の二つの漢字
    text: 由布市の観光地はふつう「湯布院」と書くが、JRの駅の看板は「由布院駅」である。理由は名前の作られ方にある。1955年、由布院町と湯平村が合併したとき、新しい町の名は「湯平」の湯と「由布院」の布院を組み合わせて「湯布院」となった。ところが駅の名は旧来の「由布院」のまま残った。地名の表記が合併で一度組み替えられた痕跡が、駅名と町名の食い違いとして今も残っているのである。
    sources:
    - k6-yufu-city-textbook
  relations:
  - pref/44
  unknowns:
  - 市名公募の得票数や次点候補などの詳細は、合併協議会資料の原本での直接確認が未了
  - 古代の柚富郷の範囲と現市域の関係は、一般的な比定の範囲を超えては確認できていない
  updated: '2026-11-13'
- id: muni/45-宮崎市
  code: '452017'
  names:
    ja: 宮崎市
    reading: みやざきし
    aliases:
    - 宮埼
  user_terms:
  - 宮崎市の名前の由来 宮って何の宮
  - 宮崎市はいつできた 1924年
  - 神武天皇と宮崎市の関係
  naming_type: 合併新設
  prefecture: 宮崎県
  homonyms: []
  summary: 市は1924年に宮崎町・大淀町・大宮村が合併して発足し、中心町だった宮崎町の名を採った。「宮崎」は日向国宮崎郡の郡名で、『和名類聚抄』に確認できる。語源は神社の前を意味する「宮前」説が有力とされるが、「宮」にあたる神社の特定は確定しておらず、神武天皇の宮居伝承も並んで語られる。
  first_attestation:
    era: 承平年間
    year_western: null
    document: 和名類聚抄
    note: 日向国宮崎郡を収載し、諸本に「宮埼」「宮崎」の表記と「三也佐伎（みやさき）」の訓がみえる。成立は934年頃
  claims:
  - text: 宮崎市は1924年（大正13年）4月1日、宮崎郡宮崎町・大淀町・大宮村の廃置分合により市制を施行して発足し、名は中心町だった宮崎町の名を継いだ
    kind: fact
    level: E2
    status: established
    sources:
    - f-cap-miyazaki-city-history
  - text: 『和名類聚抄』に日向国宮崎郡の名が見え、諸本では「宮埼」とも「宮崎」とも記され、「三也佐伎」の訓がある
    kind: fact
    level: E3
    status: established
    sources:
    - f-cap-wamyosho
    - f-miyazaki-kotobank
  - text: 郡名の語源として有力なのは「宮（神社）の前」を意味する「宮前（みやさき）」が転じたとする説で、「宮」にあたる神社は宮崎郡内の式内社・江田神社とする見方がある
    kind: fact
    level: E3
    status: contested
    sources:
    - f-miyazaki-ndl
  - text: この地が神武天皇の宮居の地であったことから「宮崎」と呼ぶようになったという古老伝が、『日向旧跡見聞録』や『太宰管内志』に記録されている
    kind: legend
    level: E3
    status: established
    sources:
    - f-miyazaki-kotobank
  - text: 神武天皇の宮居伝承の候補地として、皇宮屋（宮崎市下北方町）や奈古神社の前である「宮前」が挙げられている
    kind: legend
    level: E2
    status: established
    sources:
    - f-miyazaki-ndl
  - text: 宮崎町は1873年（明治6年）の宮崎県設置で県庁所在地となり、1876年の鹿児島県への合併と1883年（明治16年）の宮崎県再置を経て、県都の町として発展した
    kind: fact
    level: E2
    status: established
    sources:
    - f-miyazaki-ndl
    - f-cap-miyazaki-city-history
  - text: 現在の市域は、2006年（平成18年）に佐土原町・田野町・高岡町、2010年（平成22年）に清武町を編入合併して大きく広がったもので、1924年の発足時の市域は大淀川下流の平野部にとどまっていた
    kind: fact
    level: E2
    status: established
    sources:
    - f-cap-miyazaki-city-history
  column:
    title: 「宮の前」の宮は、どの神社なのか
    text: 「宮前（みやさき）」説を採るなら、次に問われるのは「その宮はどの神社か」である。候補には、式内社の江田神社、神武天皇を祀る宮崎神宮、その前身とされる奈古神社などが挙がり、神武の宮居跡とされる皇宮屋も市内に伝わる。宮崎神宮の社殿が現在の形に整うのは近代以降で、古代の郡名の由来をそのまま結びつけるには慎重さが要る。地名の側から見ると、「宮崎」は神社の門前という地形・位置の名だった可能性と、建国神話の舞台という物語の名である可能性が、いまも並んで立っている。
    sources:
    - f-miyazaki-ndl
    - f-miyazaki-kotobank
  relations:
  - pref/45
  unknowns:
  - 「宮前」説で「宮」にあたる神社の特定（江田神社・奈古神社・宮崎神宮の前身等）は確定していない
  - 宮崎町から1924年の新市名決定に至る経緯（他候補の有無）は本調査では確認できなかった
  updated: '2026-11-13'
- id: muni/45-美郷町
  code: '454311'
  names:
    ja: 美郷町
    reading: みさとちょう
    aliases: []
  user_terms:
  - 美郷町の名前の由来
  - 宮崎の美郷町は南郷・西郷・北郷が合併した町
  - 美郷町は秋田と島根と宮崎にある
  naming_type: 合併新設
  prefecture: 宮崎県
  homonyms:
  - muni/05-美郷町
  - muni/32-美郷町
  summary: 平成18年（2006年）1月1日に南郷村・西郷村・北郷村が対等合併して誕生した新名。旧3村はいずれも名に「郷」を含んでおり、新名「美郷」はその共通の「郷」を受け継ぎながら「美しい郷」を掲げた形になっている。ただし命名理由を明示した町の公表資料は今回の調査では見つからず、理由が公式に説明されている秋田県・島根県の美郷町とは異なる。
  first_attestation:
    era: 平成18年
    year_western: 2006
    document: 美郷町の発足（2006年1月1日）
    note: 自治体としての発足をもって名称の初出とする
  claims:
  - text: 平成18年（2006年）1月1日、東臼杵郡の南郷村・西郷村・北郷村が対等合併して美郷町が誕生した。平成17年（2005年）2月22日に合併協定が調印され、同年9月2日付けの官報に総務大臣の告示がなされた
    kind: fact
    level: E2
    status: established
    sources:
    - h4-miyazaki-misato-profile
  - text: 旧3村はいずれも明治22年（1889年）の町村制施行で生まれ、南郷村は上渡川村・中渡川村・鬼神野村・神門村・水清谷村の5村、西郷村は山三ヶ村・小原村・田代村・立石村の4村、北郷村は宇納間村・入下村・黒木村の3村が合併して発足した
    kind: fact
    level: E2
    status: established
    sources:
    - h4-miyazaki-misato-keikaku
  - text: 【異なる層】3つの旧村名はいずれも「郷」の字を含んでおり（南郷・西郷・北郷）、新名「美郷」はこの「郷」を3村の共通項として受け継いだ形になっている。旧町村名に「郷」を含む事情は、秋田・島根の美郷町にはない
    kind: fact
    level: E2
    status: established
    sources:
    - h4-miyazaki-misato-profile
  - text: 本町の命名理由を明示した町の公表資料（合併協議の記録・町史等）は、今回の公開資料調査では見つからなかった。移住情報サイトの町提供文では「美しい山々と清流に恵まれた美しい郷、それが美郷町です」と語られるが、これは町の紹介文であって命名理由の説明ではない
    kind: fact
    level: E2
    status: indeterminate
    sources:
    - h4-miyazaki-misato-join
    - h4-miyazaki-misato-profile
  - text: 【共通する層】秋田県・島根県の美郷町と同様、平成の大合併において旧町村名のどれでもない新しい名を掲げた新設合併の町である
    kind: fact
    level: E2
    status: established
    sources:
    - h4-akita-gappei-kiroku
    - h4-shimane-misato-gaiyo
  column:
    title: 三つの「郷」が一つになった
    text: 南郷・西郷・北郷。合併した3村は、方位こそ違えど全員が「郷」の字を背負っていた。新町の名が「美郷」になったとき、「郷」は3村の共通項として残り、頭に「美」が付いた。命名理由の公式な記録は見つからなかったが、名前の形そのものが3村の歩みを物語っている。
    sources:
    - h4-miyazaki-misato-profile
  relations:
  - pref/45
  - muni/05-美郷町
  - muni/32-美郷町
  unknowns:
  - 新町名「美郷」の選定過程と命名理由を明示した公表資料は未確認（合併協議会の記録や町史の確認が必要）
  - 旧3村の名（南郷・西郷・北郷）の由来そのものは未確認
  updated: '2026-11-13'
- id: muni/46-指宿市
  code: '462101'
  names:
    ja: 指宿市
    reading: いぶすきし
    aliases:
    - 湯豊宿
  user_terms:
  - 指宿の読み方と由来
  - なぜ指宿と書くの
  - 指宿市はいつできたの
  - 指宿の温泉と地名
  naming_type: 合併新設
  prefecture: 鹿児島県
  homonyms: []
  summary: 「指宿（いぶすき）」は難読地名として知られるが、その読みの核は「湯」を含む古い形にある。指宿市の文化財計画によれば、地名の初出は927年編纂の『延喜式』とされ、郷土史家・小川亥三郎は本来の意味を「湯生村（ユフスキ）」とし、713年の好字令の影響で好字の「指宿」に書き換えられたとする説を唱えた。1954年に指宿町と今和泉村の合併で市となり、2006年に山川町・開聞町と合併して現在の市になった。
  first_attestation:
    era: 延長5年
    year_western: 927
    document: 延喜式
    note: 指宿市の文化財保存活用地域計画が、小川亥三郎の研究として紹介する初出。『和名類聚抄』には読みが「以夫須岐（イフスキ）」と記されるという
  claims:
  - text: 指宿の地名の初出は927年（延長5年）に編纂された『延喜式』とされ、『和名類聚抄』には読みが「以夫須岐（イフスキ）」と記されていると、指宿市の文化財保存活用地域計画は紹介する（地方公共団体コードは462101）
    kind: fact
    level: E2
    status: established
    sources:
    - k6-ibusuki-city-bunkazai
    - b-cap-chiba-soumu-code
  - text: 郷土史家の小川亥三郎は、「指宿」の本来の意味は「湯生村（ユフスキ）」であり、713年（和銅6年）の諸国郡郷名著好字令の影響で好字の「指宿」になったとする説を唱えた
    kind: fact
    level: E2
    status: contested
    sources:
    - k6-ibusuki-city-bunkazai
  - text: 1543年（天文12年）に津曲兼任が建立した板碑には「湯豊宿（ユブスキ）」の表記があり、本来の意味に近い書き方が中世まで残っていたことがうかがえる
    kind: fact
    level: E2
    status: established
    sources:
    - k6-ibusuki-city-bunkazai
  - text: 市域には「湯」を含む小字が周辺に比べて圧倒的に多く、地名群の上からも温泉と結びついた土地であることがうかがえると同計画は指摘する
    kind: fact
    level: E2
    status: established
    sources:
    - k6-ibusuki-city-bunkazai
  - text: 1954年（昭和29年）4月、指宿町と今和泉村が合併して指宿市が誕生した
    kind: fact
    level: E2
    status: established
    sources:
    - k6-ibusuki-city-bunkazai
  - text: 2006年（平成18年）1月1日、山川町・開聞町と合併して、新しい指宿市となった
    kind: fact
    level: E2
    status: established
    sources:
    - k6-ibusuki-city-bunkazai
  column:
    title: 好字令で書き換えられた名前——「湯」から「指」へ
    text: 奈良時代の713年、政府は「郡や郷の名には良い字を二つ使え」という令を出した（諸国郡郷名著好字令）。小川亥三郎の研究によれば、「指宿」もこの波に洗われた名の一つで、もとは「湯生村（ユフスキ）」、つまり温泉の湧く里をそのまま表す名だったという。ところが16世紀の板碑には「湯豊宿」の字が残っており、公式の書き換えの後も、土地の人々の記憶の中では「湯」の名が生き続けていたことがわかる。難読地名「指宿」の半分は、千年以上前の漢字政策の名残なのである。
    sources:
    - k6-ibusuki-city-bunkazai
  relations:
  - pref/46
  unknowns:
  - 『延喜式』における「指宿」の具体的な表記字形は、市の計画PDFの抽出で欠けた部分があり、原典での直接確認が未了
  - 小川亥三郎の説に対する学界の評価や、対抗する語源説の有無は本調査では確認できなかった
  updated: '2026-11-13'
- id: muni/46-鹿児島市
  code: '462012'
  names:
    ja: 鹿児島市
    reading: かごしまし
    aliases:
    - 麑嶋
    - 鹿児島郡
  user_terms:
  - 鹿児島市と桜島はどっちが先の名前
  - 鹿児島市の名前 鹿と関係あるの
  - 鹿児島市はいつできた 最初の市
  naming_type: 合併新設
  prefecture: 鹿児島県
  homonyms: []
  summary: 市名は薩摩国鹿児島郡・城下町「鹿児島」に由来する。「鹿児島」はもともと桜島の古名だったとする見方が有力だが、その語源は鹿の子・火山を意味する「カグ」・水夫「カコ」・崖を意味する「カゴ」など諸説あり確定していない。1889年に旧城下の町々と近在の村々の合併で発足し、全国で最初に市制が施行された市の一つとなった。
  first_attestation:
    era: 天平宝字8年
    year_western: 764
    document: 続日本紀
    note: 桜島の噴火を記した記事に「麑島」とあるのが「鹿児島」の文献上の初見であると鹿児島県の資料は紹介する。指示対象は現在の桜島とされる。神名としての「鹿児島」は『日本三代実録』貞観2年（860年）条に確認できる
  claims:
  - text: 鹿児島市は1889年（明治22年）4月1日に市制が施行されて発足し、全国で最初に市制が施行された市の一つである
    kind: fact
    level: E2
    status: established
    sources:
    - f-cap-kagoshima-city-profile
  - text: 市勢要覧の総説に収められた表は、市制施行時の鹿児島市の構成を50町村と示している
    kind: fact
    level: E2
    status: established
    sources:
    - f-cap-kagoshima-city-sousetu
  - text: 「鹿児島」はもともと桜島の古名だったとする見方があり、鹿児島県公式が紹介し、『日本歴史地名大系』も妥当としている
    kind: fact
    level: E2
    status: established
    sources:
    - f-kagoshima-pref
    - f-kagoshima-kotobank
  - text: 鹿児島県の資料は、『続日本紀』天平宝字8年（764年）の桜島噴火の記事にみえる「麑島」を、「鹿児島」の文献上の初見として紹介している
    kind: fact
    level: E2
    status: established
    sources:
    - f-cap-kagoshima-pref-goroumon
  - text: 『日本三代実録』貞観2年（860年）3月条に、薩摩国の鹿児島神に従五位上を授けたことが記録されており、「鹿児島」の名は9世紀には神名として存在した
    kind: fact
    level: E2
    status: established
    sources:
    - f-cap-sandai-jitsuroku
    - f-kagoshima-kotobank
  - text: 鹿児島の語源について鹿児島県公式は、野生の鹿の子が多く生息していたから、火山を意味する「カグ」という言葉から、多くの水夫（かこ）が住んでいたから、などさまざまな説があるとして併記している
    kind: fact
    level: E2
    status: contested
    sources:
    - f-kagoshima-pref
  - text: 山幸彦（天津日高彦穂々出見尊）が海神の宮へ行く際に乗った舟が鹿児山で作られたことに由来するという、神話に結びつけた由来譚も伝えられている
    kind: legend
    level: E3
    status: established
    sources:
    - f-kagoshima-kotobank
  - text: 城下町としての鹿児島の都市的起源は、1602年（慶長7年）に島津家久が鶴丸城を構築し城下町を整備したことにあり、以来江戸時代を通じて島津氏の居城として藩政の中心となった
    kind: fact
    level: E2
    status: established
    sources:
    - f-cap-kagoshima-city-profile
  column:
    title: 名前は、湾の向こうの島から渡ってきた
    text: 鹿児島という名の最初の持ち主は、市街地ではなく対岸の火山の島——いまの桜島——だったとされる。島のほうが「桜島」と呼ばれるようになるのは江戸時代後期のことで、それまでは鹿児島とも向島とも呼ばれていた。半島側の城下町が「鹿児島」を名乗り続けた結果、名前は島から町へ渡り、島は別の名を得た。1914年の大噴火で桜島が大隅半島と陸続きになっても、この名の所属は元に戻らなかった。フェリーで15分の距離にある島と市が、名前の元と継ぎ手の関係にあるのが鹿児島の面白さである。
    sources:
    - f-kagoshima-pref
    - f-kagoshima-kotobank
  relations:
  - pref/46
  unknowns:
  - 「鹿児島」の語源は確定しておらず、崖説・火山説・水夫説・鹿の子説のいずれも決定的な証拠を欠く
  - 764年の「麑島」が桜島を指すことの厳密な検証は、県資料の紹介経由であり一次資料では確認していない
  - 桜島の名称統一（1698年・薩摩藩通達とされる）の一次資料は本調査では直接確認できていない
  updated: '2026-11-13'
- id: muni/47-那覇市
  code: '472018'
  names:
    ja: 那覇市
    reading: なはし
    aliases:
    - 那波
    - 奈波
    - 浮島
  user_terms:
  - 那覇の名前の由来 漁場って本当
  - ナーファ ナファ 那覇の読み方
  - 首里と那覇はどう違う
  - 那覇市はいつできた
  naming_type: その他（港町「那覇」の名を継承し、那覇区への市制施行により市となった）
  prefecture: 沖縄県
  homonyms: []
  summary: 市名は琉球王国の貿易港「那覇」に由来する。「なは」の語源については、島袋源七が提唱し伊波普猷が支持した「ナバ（漁場）」説が通説とされてきたが、反論もあり確定していない。王国の記録が伝える茸の形の石にちなむ命名伝承とは別系統の話として分けて扱う。王都・首里の外港だった那覇は、1879年に県庁が置かれて県都となり、1921年に市制が施行された。
  first_attestation:
    era: 文明3年
    year_western: 1471
    document: 海東諸国紀
    note: 朝鮮の申叔舟が琉球の港を「那波」と記したものが、確認できる古い記録の一つ。当時この地が「ナバ」と呼ばれていた可能性を示すと『沖縄県の地名』は記す（国立国会図書館レファレンスが紹介）
  claims:
  - text: 市名「那覇」は港町の名に由来し、1921年（大正10年）5月20日、特別区制が廃されて一般市制が施行され、那覇区が那覇市となった
    kind: fact
    level: E2
    status: established
    sources:
    - f-cap-naha-city-ayumi
  - text: 王国時代の那覇は、那覇川（現在の国場川）と安里川の注ぐ湾に浮かぶ島「浮島」であり、1451年（享徳3年）に尚金福王が長虹堤を築いて首里側と結び、那覇四町（西町・東町・若狭町・泉崎）を形成したと那覇市公式は説明する
    kind: fact
    level: E2
    status: established
    sources:
    - f-cap-naha-city-ayumi
  - text: 王都は首里に置かれ、那覇はその外港・商都として発展したが、1879年（明治12年）の廃藩置県で県庁が那覇に置かれ、政治・経済・文化の中心は首里から那覇へ移った
    kind: fact
    level: E2
    status: established
    sources:
    - f-cap-naha-city-ayumi
  - text: 『海東諸国紀』に「那波」とあって、15〜16世紀にはこの地が「ナバ」と唱えられていた可能性が高いと、『沖縄県の地名』（日本歴史地名大系・沖縄県編）は記している
    kind: fact
    level: E2
    status: established
    sources:
    - f-cap-kaidoushokki
    - f-cap-naha-ndl
  - text: 「ナバ」の意味について、島袋源七が提唱し伊波普猷が支持・立証した漁場説が通説とされてきたが、海に面しない「ナバ」系の地名もあることなどから一仮説にとどまるとする批判的な見解もあり、語源は確定していない
    kind: fact
    level: E2
    status: contested
    sources:
    - f-cap-naha-ndl
  - text: 『琉球国由来記』巻八「那覇由来記」は、呉姓我那覇の屋敷の中に茸（世俗にナバという）の形に似た石があり、人々がこの地を「ナハ」と呼ぶようになり、後に字を「那覇」に改めたと伝える
    kind: legend
    level: E2
    status: established
    sources:
    - f-cap-ryukyu-yuraiki
    - f-cap-naha-ndl
  - text: 那覇市公式は、那覇の読みは現地の「ナーファ」「ナファ」から転訛したもので、それまでナハ・ナファ・ナワ・ナバなどと呼ばれていた読みが、1934年（昭和9年）3月に日本放送語審査委員会の決定で「ナハ」に統一されたと説明している
    kind: fact
    level: E2
    status: established
    sources:
    - f-cap-naha-city-name
  - text: 現在の市域は、1954年（昭和29年）に首里市・小禄村、1957年（昭和32年）に真和志市を合併して形成されたもので、王国期の那覇（浮島とその周辺）とは範囲が大きく異なる
    kind: fact
    level: E2
    status: established
    sources:
    - f-cap-naha-city-siryou
  column:
    title: 王都ではない港町が、県都になった
    text: 琉球王国の中心は、丘の上の王都・首里だった。那覇はその足元に浮かぶ「浮島」の港町で、冊封使や交易船を迎える玄関口だったが、政治の中心ではなかった。その力関係が逆転したのは1879年、廃藩置県で県庁が那覇に置かれてからである。首里城は象徴として残り、行政・経済の実務は港町へ移った。現在の那覇市は1950年代に首里市などを合併しており、いま市域に含まれる首里は「もとの王都を後から市域に迎えた」形になっている。港町の名前が、王都を含む市の名前になったわけである。
    sources:
    - f-cap-naha-city-ayumi
    - f-cap-naha-city-siryou
