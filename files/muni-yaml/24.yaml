  - text: 2003年に員弁郡の他の4町がいなべ市となったため、東員町は員弁郡で唯一の町となった
    kind: fact
    level: E5
    status: established
    sources:
    - x8-toin-wiki
  - text: 東員町の地方公共団体コードは243248である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 読めない町名「とういん」と、員弁郡の生き残り
    text: 「東員」は、初見ではまず読めない。答えは「とういん」で、鍵は郡名の「員弁（いなべ）」にある。1954年の合併で生まれたこの名は、員弁郡の「員」を採ったものとみられる。半世紀後の2003年、員弁郡の他の4町は合併していなべ市となり、「員弁」の名は市の名に残った一方、郡に残ったのは東員町ただ一つになった。郡の名を市と町で分け合う形である。読みの難しさも含めて、古代の豪族・猪名部氏の本拠とされるこの土地の、郡への帰属意識の強さを物語る名前といえる。
    sources:
    - x8-toin-wiki
    - x8-toin-pamphlet
  relations:
