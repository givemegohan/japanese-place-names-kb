  column:
    title: 消えた郡の名が、町名として戻ってきた
    text: 「西和賀」は新しい造語ではない。明治12年（1879）、和賀郡が東西に分かれたとき、湯田・沢内など西側の村々は「西和賀郡」となった。その後、郡の再編で西和賀郡の名は地図から消えたが、平成17年（2005）に湯田町と沢内村が合併した際、新しい町の名として「西和賀」が選ばれた。旧西和賀郡の区域と新しい町の区域はほぼ重なっており、126年の時をへて郡の名前が自治体の名前として戻ってきた形である。合併新町名の多くが公募の瑞祥地名や合成名である中で、歴史上の行政区画の名をそのまま蘇らせた例は珍しい。現在、和賀郡に属する自治体は西和賀町ただ一つで、郡と町は同じ範囲を指す名前になっている。
    sources:
    - z7-nishiwaga-gun-wiki
    - z7-nishiwaga-town-enkaku
  relations:
  - pref/03
  unknowns:
  - 2005年の合併に際して「西和賀」が新町名に選ばれた公式の命名理由・選定経過（公募や協議会の記録）は、本バッチでは確認できなかった
  - 「和賀」の語源そのもの（アイヌ語説など）は、本バッチでは諸説の裏付け確認に至らなかった
  - 西和賀郡が廃止された正確な年は、本バッチでは公的資料で確認できなかった
