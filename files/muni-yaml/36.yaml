  - text: 2005年3月1日に那賀郡の鷲敷町・相生町・上那賀町・木沢村・木頭村の5町村が合併して那賀町が誕生した
    kind: fact
    level: E2
    status: established
    sources:
    - q11-naka-env
    - q10-soumu-gapei
  - text: 合併前の5町村は丹生谷（にゅうだに）と総称され、地理的・歴史的、また産業・文化面においても古くからの結びつきがあり、一部事務組合で地域全体の課題に取り組んできた
    kind: fact
    level: E2
    status: established
    sources:
    - q11-naka-env
  - text: 那賀川は昔、「長（なが）の国」の「長川（ながかわ）」と呼ばれ、長の国の名称は『日本書紀』に「奈我」「長」などと書かれたと国土交通省の那賀川解説が紹介する
    kind: fact
    level: E2
    status: established
    sources:
    - q11-nakagawa-mlit
  - text: 奈良時代に阿波国那賀郡と改名されたが、この名が定着したのは平安時代頃と言われ、川は江戸時代まで「長川」「長河」とも書かれていた
    kind: fact
    level: E2
    status: established
    sources:
    - q11-nakagawa-mlit
  - text: 那賀川は那賀町木頭北川の剣山山系ジロウギュウに源を発し、町域を貫いて東へ流れる
    kind: fact
    level: E2
    status: established
    sources:
    - q11-nakagawa-mlit
  - text: 那賀川の愛称「阿波の八郎」は1987年（昭和62年）に流域住民からの愛称募集で誕生し、吉野川の「四国三郎」に対峙する名である
    kind: fact
    level: E2
    status: established
    sources:
    - q11-nakagawa-mlit
  column:
    title: 四国三郎に対抗する阿波の八郎
    text: 吉野川が「四国三郎」なら、那賀川は「阿波の八郎」。1987年の愛称募集で、当時の流域市町村の数である「8」を主体に、縁起のよい「八」の字を重ねて名付けられた。2005年に生まれた那賀町の名は古代の郡名だが、その川にはこんな新しい愛称の層もある。
    sources:
    - q11-nakagawa-mlit
  relations:
