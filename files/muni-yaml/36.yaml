    reading: みなみちょう
    aliases:
    - 日和佐町
    - 由岐町
    - 上灘
  user_terms:
  - みなみ
  - うみがめの町
  - 薬王寺の門前町
  - 日和佐
  - 由岐
  naming_type: 新規命名
  formation: 合併新設
  prefecture: 徳島県
  homonyms: []
  summary: 2006年3月31日に日和佐町と由岐町が合併して生まれた新町名。両町は古く「上灘」と呼ばれた海岸地帯で、漁業や文化の面で結びついてきた。「美波」という名の選定理由を記した公式資料は、確認できなかった。
  first_attestation:
    era: 平成
    year_western: 2006
    document: 美波町の発足（日和佐町・由岐町合併）
    note: 町名自体は2006年の新命名である。旧地名の層として日和佐・由岐・上灘がある。
  claims:
  - text: 地方公共団体コードは363871である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  - text: 2006年3月31日に海部郡の由岐町と日和佐町が合併して美波町が誕生した
    kind: fact
    level: E2
    status: established
    sources:
    - q11-minami-pref
    - q10-soumu-gapei
  - text: 日和佐町と由岐町は昔から「上灘」と呼ばれ、室戸阿南海岸国定公園に指定された海岸線を有し、漁業を中心とした産業や歴史・文化面において古くから結びつきがあったと町は説明する
    kind: fact
    level: E2
    status: established
    sources:
    - q11-minami-pamphlet
  - text: 由岐町は1955年2月11日に三岐田町が阿部村を編入し、同日付で改称して発足した
    kind: fact
    level: E3
    status: established
    sources:
    - upg-s6-minami-yuki-kotobank
    - upg-s6-minami-yuki-geoshape
  - text: 日和佐町は1956年9月30日に赤河内村が旧日和佐町を編入して町制施行し、即日改称して日和佐町（第2次）となる複雑な経緯を持つ
    kind: fact
    level: E3
    status: established
    sources:
    - upg-s6-minami-hiwasa-kotobank
    - upg-s6-minami-hiwasa-geoshape
  - text: 四国八十八箇所霊場23番札所の薬王寺は、弘仁6年（815年）に平城天皇の命により空海が厄除けの寺として創建したという伝承があり、日和佐はその門前町である
    kind: legend
    level: E2
    status: indeterminate
    sources:
    - q11-minami-meti
  - text: 日和佐の大浜海岸はアカウミガメの産卵地として知られ、町はウミガメの町として知られる
    kind: fact
    level: E2
    status: established
    sources:
    - q11-minami-meti
  column:
    title: にぎやかな過疎の町
    text: 美波町は過疎地域であることを逆手に取り、「“にぎやかそ” にぎやかな過疎の町」をスローガンに掲げる。新町名「美波」の由来は公式には語られていないが、少なくともこの町は、名前の意味よりも先に、どう名乗って生きるかを自分で決めた町である。
    sources:
    - q11-minami-wiki
  relations:
  - pref/36
  unknowns:
  - 新町名「美波」の選定理由と、公募によるものかどうか（合併協議会資料での確認が今後の課題）
  - 「日和佐」「由岐」の語源
  updated: '2026-11-13'
- id: muni/36-美馬市
  code: '362077'
  names:
    ja: 美馬市
    reading: みまし
    aliases: []
  user_terms:
  - うだつの上がる町並みの脇町
  - みまし
  - 美馬郡の名前の市
  - 美馬市と美馬郡つるぎ町
  naming_type: 旧行政区画名の継承
  formation: 合併新設
  prefecture: 徳島県
  homonyms: []
  summary: 2005年3月1日に美馬郡の脇町・美馬町・穴吹町・木屋平村が合併して発足した市で、市名には郡名「美馬」が採用された。同日の合併で貞光町・半田町・八千代村からつるぎ町が生まれ、美馬郡はつるぎ町のみを残して存続したため、「美馬市」と「美馬郡つるぎ町」が隣り合って併存する。「うだつの上がる町並み」で知られる脇町を含む。郡名「美馬」の語源には諸説があり、定説はない。
  first_attestation:
    era: 平安時代
    year_western: null
    document: 『和名類聚抄』（阿波国美馬郡）
    note: 郡名の初出としての性格を持つ。原本は未確認で、本レコードでは紹介資料による確認にとどめる。
  claims:
  - text: 美馬市は2005年3月1日、美馬郡の脇町・美馬町・穴吹町・木屋平村が合併して発足し、市名には郡名「美馬」が採用された。
    kind: fact
    level: E2
    status: established
    sources:
    - q4-tokushima-enkaku
    - q4-mima-uub
  - text: 旧・美馬町は1957年3月31日に郡里町と重清村が合併して生まれた町であり、市名「美馬」は郡名であると同時に、この旧町名とも重なっている。
    kind: fact
    level: E4
    status: established
    sources:
    - q4-mima-uub
  - text: 同じ2005年3月1日の合併で、美馬郡の残りの貞光町・半田町・八千代村からつるぎ町が生まれ、美馬郡はつるぎ町のみを残して存続した。そのため郡名を名乗る市と、その郡に属する町が隣り合って併存している。
    kind: fact
    level: E2
    status: established
    sources:
    - q4-tokushima-enkaku
  - text: 「美馬」の語源について、徳島県立図書館のレファレンス回答が引く『阿波 地名の学習』は、良馬を産出したとする説や、水の女神への信仰に結びつける説など複数の説を紹介し、著者自身は地形から「水沼（みぬま）」の音が変化したものとする説を採っている。
    kind: fact
    level: E2
    status: contested
    sources:
    - q4-mima-ndl
  - text: 『古代地名語源辞典』は「美馬」を「水間（みま）」すなわち湿地の意とする説を示し、「良馬の産地だった」という説には否定的であり、語源は資料によって見解が分かれている。
    kind: fact
    level: E4
    status: contested
    sources:
    - q4-mima-ndl
    - q4-mima-gogen
  - text: 脇町地区は脇城の城下町として、また藍の集散地として発展し、「うだつの上がる町並み」が1988年12月16日に国の重要伝統的建造物群保存地区に選定された。
    kind: fact
    level: E2
    status: established
    sources:
    - q4-mima-city-udatsu
  - text: 美馬市の地方公共団体コードは362077である。
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 市になっても消えなかった郡名
    text: 合併で市が郡名を名乗ると、普通はその郡は姿を消す。美馬の場合は違った。2005年、美馬郡の西半分が「美馬市」になり、東半分の3町村は「つるぎ町」として独立した合併を選んだため、美馬郡はつるぎ町1町だけを抱えて存続した。結果、「美馬市」と「美馬郡つるぎ町」が隣り合う、全国でも珍しい地図になった。しかも市名の「美馬」と旧・美馬町は別の由来を持つわけではなく、町名も郡名から来ている。市になった脇町は、商家の屋根に防火壁「うだつ」を連ねた町並みで知られる。郡名が市と郡の両方に生き残る土地で、江戸時代の商いの繁栄の跡が今も通りに残っている。
    sources:
    - q4-mima-uub
    - q4-tokushima-enkaku
  relations:
  - pref/36
  - muni/36-つるぎ町
  unknowns:
  - 「美馬」の語源は諸説あり、定説は確認できなかった（記録した対立のまま）。
  - 2005年の合併協議会で市名「美馬」が選定された経緯の詳細は確認できなかった。
  updated: '2026-11-13'
