  - text: 葛巻町公式の概要によれば、町の町制施行は昭和30年（1955）7月15日で、町は「北緯40度 ミルクとワインとクリーンエネルギーのまち」を掲げている
    kind: fact
    level: E2
    status: established
    sources:
