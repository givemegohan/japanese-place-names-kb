  prefecture: 鹿児島県
  homonyms: []
  summary: 種子島の中央部を占める町で、明治22年（1889年）の町村制施行で発足した中種子村が、昭和15年（1940年）に町制を施行して中種子町となった。町名の「中」は島の中央部という位置を示し、町公式資料によれば中世の郡政で島を上郡・中郡・下郡に三分したうちの中郡にあたる。種子島空港が置かれる島の空の玄関でもある。
  first_attestation:
    era: 明治22年
    year_western: 1889
    document: 町村制施行による中種子村の発足
    note: 自治体名としての「中種子」の初出。地名の層としては、それ以前の中世の郡政における「中郡」の名を位置のうえで継ぐ
  claims:
  - text: 中種子町の地方公共団体コードは465011である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  - text: 明治22年（1889年）の町村制実施により種子島全体が熊毛郡となり、北種子村・中種子村・南種子村の3村が誕生したと町は紹介する
    kind: fact
    level: E2
    status: established
    sources:
    - s3-nakatane-kaso
  - text: 中種子村は鎌倉幕府直轄時代の郡政で島を上郡・中郡・下郡に三分したうちの中郡にあたり、野間・油久・納官・増田・坂井の5ケ村に、明治になって分村した牧川・田島を加えた7ケ村が統合して発足したと町は紹介する
    kind: fact
    level: E2
    status: established
    sources:
    - s3-nakatane-kaso
  - text: 中種子村は昭和15年（1940年）に町制を施行し中種子町となったと町は紹介する（町制施行の日付は11月10日とWikipedia「熊毛郡」は紹介する）
    kind: fact
    level: E2
    status: established
    sources:
    - s3-nakatane-kaso
    - s3-kumage-wiki
  - text: 種子島は古代「多ネ執島」又は「多禰島」と呼ばれ、大和朝廷との接触があったことが『日本書紀』や『古事記』に記録されていると町は紹介する
    kind: fact
    level: E2
    status: established
    sources:
    - s3-nakatane-kaso
  - text: 大宝2年（702年）に種子島と屋久島を合わせて令制国の多禰国が置かれ、多禰国は天長元年（824年）に廃止されて大隅国に編入されたとWikipedia「種子島」は紹介する
    kind: fact
    level: E5
    status: established
    sources:
    - s3-tanegashima-wiki
  - text: 町内の坂井に所在する立切遺跡から、後期旧石器時代初頭にあたる約3万5千年前の生活を示す遺構・遺物が出土していると町は紹介する
    kind: fact
    level: E2
    status: established
    sources:
    - s3-nakatane-kaso
  column:
    title: 「北・中・南」は鎌倉の「上・中・下」の名残
    text: 種子島には北から西之表市・中種子町・南種子町が並ぶ。この北・中・南という素っ気ない並びは、近代の町村制で付けられた名だが、その下敷きは古い。町公式資料によれば、中世に鎌倉幕府の直轄地だった種子島は上郡・中郡・下郡の3つに分けて治められ、中種子村はその中郡にあたるという。1889年に生まれた3村の名は、この島を縦に三分する発想をそのまま継いだものとみることができる。ちなみに中種子町には種子島空港があり、「中の町」が今は島の空の玄関も兼ねている。
    sources:
    - s3-nakatane-kaso
    - s3-kumage-wiki
  relations:
  - pref/46
  - muni/46-西之表市
  - muni/46-南種子町
  unknowns:
  - 「中郡」の初出となる中世の一次文書そのものは確認できなかった（町の計画資料が「伝えられている」として紹介するにとどまる）
  - 「多禰（たね）」という古名に後世「種子」の漢字が当てられた経緯を、専門辞典で直接確認することはできなかった
  updated: '2026-11-13'
- id: muni/46-伊仙町
  code: '465321'
  names:
    ja: 伊仙町
    reading: いせんちょう
    aliases:
    - 伊仙村
    - 島尻村
  user_terms:
  - いせん
  - 徳之島の町
  - 長寿の町
  - 闘牛の町
  naming_type: 中心地名の継承
  formation: 改称
  prefecture: 鹿児島県
  homonyms: []
  summary: 徳之島南西部の町。明治41年（1908年）に島尻村として発足し、大正10年（1921年）に区域内の一集落の名「伊仙」を採って伊仙村に改称、昭和37年（1962年）の町制施行で伊仙町となった。「伊仙」の語源と、改称でこの名が選ばれた理由は公式資料では確認できない。
  first_attestation:
    era: 大正時代（大正10年）
    year_western: 1921
    document: 島尻村から伊仙村への改称
    note: 集落名としての「伊仙」は、明治41年（1908年）の島尻村発足時の構成村の一つとしてすでに現れる。語源は未詳
  claims:
  - text: 伊仙町の地方公共団体コードは465321である
    kind: fact
    level: E2
    status: established
    sources:
    - s4-kagoshima-muni-list
  - text: 『続日本紀』文武天皇3年（699年）条の「度感」が徳之島であれば、島の名の記録は7世紀末に遡るが、「度感」の読みも徳之島への比定も確定していない
    kind: fact
    level: E4
    status: contested
    sources:
    - s4-tokuda-rekishi
    - s4-wiki-tokunoshima
  - text: 「とくのしま」の表記が確実に現れるのは鎌倉時代後期の徳治元年（1306年）の『千竈時家処分状』の「とくのしま」であると徳田虎雄顕彰記念館の資料が紹介する
    kind: fact
    level: E4
    status: established
    sources:
    - s4-tokuda-rekishi
  - text: 明治41年（1908年）の島嶼町村制で島尻村が発足し、その区域には旧来の伊仙村（集落）も含まれていた
    kind: fact
    level: E2
    status: established
    sources:
    - s4-oshima-gaikyou
    - s4-uub-isen
  - text: 島尻村が伊仙村に改称した日付は、鹿児島県大島支庁の沿革資料が大正10年（1921年）6月29日とするのに対し、市区町村変遷情報データベースは1921年8月1日に訂正しており、資料により異なる
    kind: fact
    level: E2
    status: contested
    sources:
    - s4-oshima-gaikyou
    - s4-uub-isen
  - text: 昭和37年（1962年）1月1日、伊仙村が町制施行して伊仙町となった
    kind: fact
    level: E2
    status: established
    sources:
    - s4-isen-gaiyo
    - s4-oshima-gaikyou
  - text: 町公式サイトの町政情報には町名の由来の説明がなく、「伊仙」の語源は未詳である
    kind: fact
    level: E2
    status: indeterminate
    sources:
    - s4-isen-gaiyo
  column:
    title: 島尻から伊仙へ、理由の残らない改称
    text: 伊仙町の前身は「島尻村」だった。島尻は奄美・沖縄で広く見られる地名だが、1921年、この村は区域内の一集落「伊仙」の名を採って伊仙村に改称した。現在の町役場も大字伊仙に置かれている。ところが、なぜ島尻を捨てて伊仙を選んだのか、町や県の公式資料は語っていない。地名の由来が「分からない」こともまた記録すべき事実であり、この改称はその好例である。由来の解明は、今後の町史資料の調査に委ねられる。
    sources:
    - s4-oshima-gaikyou
    - s4-uub-isen
    - s4-isen-gaiyo
  relations:
  - pref/46
  - muni/46-徳之島町
  - muni/46-天城町
  unknowns:
  - 1921年の改称で「伊仙」が選ばれた理由は確認できなかった
  - 「伊仙」という集落名自体の語源は確認できなかった
  - 改称の日付は県資料（6月29日）と市区町村変遷情報（8月1日に訂正）で異なる
  updated: '2026-11-13'
- id: muni/46-伊佐市
  code: '462241'
  names:
    ja: 伊佐市
    reading: いさし
    aliases:
    - 大口市
    - 菱刈町
    - 伊佐郡
  user_terms:
  - 大口
  - 菱刈
  - いさ
  - 鹿児島の北海道
  naming_type: 旧行政区画名の継承
  formation: 合併新設
  prefecture: 鹿児島県
  homonyms: []
  summary: 平成20年（2008年）11月1日、大口市と伊佐郡菱刈町が新設合併して発足した市。市名は両市町を含む旧郡名「伊佐郡」に由来する。ただしこの伊佐郡は近世初頭に中世の牛屎院・答院の地域を合わせて成立した郡であり、古代薩摩国の郡の一つだった伊作郡（現在の日置市域）とは字面が似るだけで別の郡である。合併は一度、住民投票の結果で不成立になった経緯がある。
  first_attestation:
    era: null
    year_western: null
    document: null
    note: 「伊佐郡」は近世初頭の成立と『日本歴史地名大系』が紹介するが、「伊佐」の語そのものの初出・語源は確認できなかった
  claims:
  - text: 伊佐市の地方公共団体コードは462241である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  - text: 伊佐市は平成20年（2008年）11月1日、大口市と伊佐郡菱刈町の新設合併で発足した
    kind: fact
    level: E2
    status: established
    sources:
    - s4-isa-city-keikaku
    - s4-isa-kotobank
  - text: 市名「伊佐」は、両市町を含む旧郡名である伊佐郡の名を引き継いだものである
    kind: fact
    level: E3
    status: established
    sources:
    - s4-isa-kotobank
    - s4-isa-uub
  - text: 薩摩国の伊佐郡は近世初頭に成立した郡で、中世の牛屎院・答院の地域を合わせたものであり、薩摩半島中央西部にあった古代の伊作郡とは郡域もまったく異なる別の郡である
    kind: fact
    level: E3
    status: established
    sources:
    - s4-isagun-kotobank
  - text: 明治30年（1897年）に北伊佐郡と大隅国菱刈郡が合併して伊佐郡が再発足し、その郡域は現在の伊佐市の全域にあたっていた
    kind: fact
    level: E5
    status: established
    sources:
    - s4-isagun-wiki
  - text: 合併協議は一度不成立に終わっており、旧伊佐地区合併協議会は平成17年（2005年）5月10日に解散し、平成18年（2006年）8月28日に協議会が再設置されて合併に至った
    kind: fact
    level: E4
    status: established
    sources:
    - s4-isa-uub
    - s4-isa-isalove
  - text: 旧菱刈町域には金・銀を産出する菱刈鉱山があり、日本大百科全書は伊佐市の産業として鉱山への言及を含む
    kind: fact
    level: E3
    status: established
    sources:
    - s4-isa-kotobank
  column:
    title: 一度は否決された「伊佐市」
    text: 「伊佐市」という名前は、実は一度お蔵入りした名前である。2000年代初頭に大口市と菱刈町は合併協議会を立ち上げ、新市名を「伊佐市」と決めたが、菱刈町で行われた住民投票で反対が賛成を上回り、協議会は2005年に解散した。その後2006年に協議会が再び立ち上げられ、新市名は前回と同じ「伊佐市」として合意され、2008年にようやく市が発足した。郡名という、どちらの自治体の名前でもない「中立の名」が、二度にわたって選ばれたことになる。
    sources:
    - s4-isa-isalove
    - s4-isa-uub
  relations:
  - pref/46
  unknowns:
  - 「伊佐」という語自体の語源は専門資料で確認できなかった
  - 新市名の公募・選定過程の詳細（候補一覧等）は合併協議会の一次資料では確認できなかった
  - 1897年の伊佐郡再発足についてはWikipedia以外の高次資料で裏付けが取れなかった
  updated: '2026-11-13'
- id: muni/46-出水市
  code: '462080'
  names:
    ja: 出水市
    reading: いずみし
    aliases:
    - 出水町
    - 米ノ津町
  user_terms:
  - ツルの渡来地
  - 出水兵児のふるさと
  - いずみ
  naming_type: 中心地名の継承
  formation: 合併新設
  prefecture: 鹿児島県
  homonyms: []
  summary: 鹿児島県北端の市で、昭和29年（1954年）4月1日に出水町・米ノ津町が合併して発足し、平成18年（2006年）3月13日に野田町・高尾野町と合併して現在の市域となった。「出水」は薩摩国の郡名として『和名類聚抄』に見える古い地名で、市は、出水平野の扇状地の扇端に湧水が豊かだったことに地名が由来するといわれると説明する。ツルの渡来地として知られる。
  first_attestation:
    era: 平安時代
    year_western: null
    document: 『和名類聚抄』
    note: 薩摩国出水郡として見えることを二次資料が紹介する。原文を直接確認していないため紹介形で記録する
  claims:
  - text: 出水市の地方公共団体コードは462080である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  - text: 「出水」という地名は、扇状地の扇端部のいたるところに湧水が見られた、その湧水の豊かさに由来するといわれていると、出水市郷土誌に基づく市の環境基本計画は記す
    kind: fact
    level: E2
    status: established
    sources:
    - s3-izumi-city-env
  - text: 現在の出水市域は『和名類聚抄』に見える薩摩国出水郡の地であり、江戸時代には薩摩藩の出水郷が置かれ、その武士団は「出水兵児（いずみへこ）」と呼ばれたとWikipediaは紹介する
    kind: fact
    level: E5
    status: established
    sources:
    - s3-izumi-wiki
  - text: 昭和29年（1954年）4月1日に出水町と米ノ津町が合併して出水市が発足し、同年10月に大川内村を編入、平成18年（2006年）3月13日に野田町・高尾野町と合併して新・出水市となったとWikipediaは紹介する
    kind: fact
    level: E5
    status: established
    sources:
    - s3-izumi-wiki
  - text: 出水平野の背後の山麓部には扇状地が発達して地表水は少なく、雨水は伏流水となり、中心部の地下水位は地表から2〜3mと浅いことが出水地域の特徴であると市は説明する
    kind: fact
    level: E2
    status: established
    sources:
    - s3-izumi-city-env
  - text: ツルの渡来地は国の特別天然記念物「鹿児島県のツルおよびその渡来地」に指定され、出水市はツルの里として全国に名を知られている
    kind: fact
    level: E2
    status: established
    sources:
    - s3-izumi-city-env
  column:
    title: 湧き水の平野に、ツルが冬を越しに来る
    text: 出水平野は、川が山を出たところに広がる扇状地である。扇状地では降った雨が地下に潜り、扇の末端で湧き水となって現れる。出水の市街地の地下水位は地表からわずか2〜3mと浅く、かつては扇端のいたるところに湧水が見られた。その水の豊かさが「出水」という名になったといわれる。冬、この水の豊かな平野にシベリアから1万羽を超えるツルが渡ってくる。古代の郡名として残った「出水」は、水が出る土地という意味を千年にわたって裏切り続けていない。
    sources:
    - s3-izumi-city-env
  relations:
  - pref/46
  unknowns:
  - 『和名類聚抄』における「出水郡」の読み（訓）は確認できなかった
  - 「出水」の名が付けられた主体と正確な年代は確認できなかった
  updated: '2026-11-13'
- id: muni/46-十島村
  code: '463043'
  names:
    ja: 十島村
    reading: としまむら
    aliases:
    - じっとうそん
  user_terms:
  - としまむら
  - トカラ列島の村
  - トカラの村
  - 役場が鹿児島市にある村
  naming_type: 旧国名・広域地名の採用
  naming_note: 区域をなす島の数に由来する命名
  formation: 分村・分立
  prefecture: 鹿児島県
  homonyms: []
  summary: トカラ列島の下七島（口之島・中之島・臥蛇島・平島・諏訪之瀬島・悪石島・宝島、小宝島を含む）を区域とする村。村名はもともと、上三島（現在の三島村）を含む十の島を区域としたことに由来し、1908年に島嶼町村制で「十島村（じっとうそん）」として発足した。1946年に北緯30度線で分断され、1952年2月10日の本土復帰で下七島のみを区域として「十島村（としまむら）」と読みを変えて再発足したため、現在は島が7つでも「十島」の名が残っている。
  first_attestation:
    era: 明治時代
    year_western: 1908
    document: 島嶼町村制の施行（1908年4月1日、十島村の発足）
    note: 自治体名としての初出はこの発足そのもの。区域の総称としては江戸時代から「川辺郡十島（川辺十島）」と呼ばれており、「十島」は十の島の数に由来する呼称だった
  claims:
  - text: 十島村の地方公共団体コードは463043である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  - text: 1908年（明治41年）4月1日に島嶼町村制が施行され「十島村（じっとうそん）」が発足した。当時の区域は口之島・中之島・臥蛇島・平島・諏訪之瀬島・悪石島・宝島・硫黄島・竹島・黒島の十島で、村名はこの十の島に由来する
    kind: fact
    level: E2
    status: established
    sources:
    - s1-toshima-vill-sonsei
  - text: 江戸時代、この一帯は薩摩国川辺郡に属し「川辺十島」と呼ばれていた。1889年（明治22年）の町村制では施行対象外の島嶼に指定され、1897年（明治30年）に川辺郡から大島郡へ移された
    kind: fact
    level: E5
    status: established
    sources:
    - s1-mishima-wiki
  - text: 1946年（昭和21年）、連合国軍総司令部の命により北緯30度線で上三島（竹島・黒島・硫黄島）と分離され、トカラ列島側は米軍政下に置かれた
    kind: fact
    level: E2
    status: established
    sources:
    - s1-toshima-vill-sonsei
  - text: 1952年（昭和27年）2月10日、本土復帰により下七島（口之島・中之島・臥蛇島・平島・諏訪之瀬島・悪石島・宝島）を区域とする村が「十島村（としまむら）」として発足し、上三島は三島村として同日に発足した。分離で島は7つになったが「十島」の名と読みの変更（じっとうそん→としまむら）が同時に行われた
    kind: fact
    level: E2
    status: established
    sources:
    - s1-toshima-vill-sonsei
  - text: 十島村役場は1956年（昭和31年）に中之島から鹿児島市へ移転し、現在も区域外の鹿児島市内に置かれている。1973年（昭和48年）には所属郡が大島郡から鹿児島郡へ変更された
    kind: fact
    level: E2
    status: established
    sources:
    - s1-toshima-vill-sonsei
  - text: 村を構成する島のうち臥蛇島は1970年（昭和45年）に島民が全員移住して無人島となっており、現在の有人島は6島（口之島・中之島・平島・諏訪之瀬島・悪石島・宝島）である
    kind: fact
    level: E2
    status: established
    sources:
    - s1-toshima-vill-sonsei
  column:
    title: 島が7つになっても「十島」――読みだけが変わった村名
    text: 1952年の本土復帰のとき、下七島の村は名を変える機会があったはずだが、選ばれたのは改名ではなく読みの変更だった。「じっとうそん」から「としまむら」へ。漢字の「十島」は、上三島を含む十の島で発足した1908年以来の名として残された。その結果、現在の十島村は島の数（区域は7島）と名前の数が一致しない村になった。分離した上三島の側も、新しい村名には島の数「三」を使っており、北緯30度線で分かれた2つの村が、どちらも「島の数」を名に持つ形で再出発したことになる。
    sources:
    - s1-toshima-vill-sonsei
  relations:
  - pref/46
  - muni/46-三島村
  unknowns:
  - 1952年の再発足時に「十島」以外の新村名が検討されたかどうかは公式資料で確認できなかった
  - 江戸時代の「十島」の数え方（小宝島・昭和硫黄島など無人島の扱い）の変遷は確認できなかった
  updated: '2026-11-13'
- id: muni/46-南さつま市
  code: '462209'
  names:
    ja: 南さつま市
    reading: みなみさつまし
    aliases:
    - 加世田市
    - 南薩摩
  user_terms:
  - 南薩
  - 加世田
  - 坊津
  - みなみさつま
  naming_type: 旧国名・広域地名の採用
  formation: 合併新設
  prefecture: 鹿児島県
  homonyms: []
  summary: 平成17年（2005年）11月7日、加世田市・笠沙町・大浦町・坊津町・金峰町の1市4町が新設合併して発足した、薩摩半島南西部の市。市名は公募で最も多く寄せられた「南さつま」で、最終候補には読みがまったく同じ「南薩摩」も残り、漢字表記でなく平仮名表記が選ばれた。「さつま」は旧国名・薩摩の平仮名表記であり、市域は薩摩国の南部（南薩）にあたる。
  first_attestation:
    era: null
    year_western: null
    document: null
    note: 「南さつま」という市名自体は2005年の合併で生まれた命名そのものが初出。旧中心地名「加世田」は近世の郷名に遡るが、その確かな初出は確認できなかった
  claims:
  - text: 南さつま市の地方公共団体コードは462209である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  - text: 南さつま市は平成17年（2005年）11月7日、加世田市・笠沙町・大浦町・坊津町・金峰町の1市4町の新設合併で発足した
    kind: fact
    level: E2
    status: established
    sources:
    - s4-minamisatsuma-city-youran
  - text: 本市は薩摩半島の南西部に位置し、南側と西側は東シナ海に面する
    kind: fact
    level: E2
    status: established
    sources:
    - s4-minamisatsuma-city-gaiyo
  - text: 新市名は公募で「南さつま」が最も多く寄せられ、最終候補は読みが同じ「南薩摩（みなみさつま）」と「南さつま」の2点で、平仮名表記の「南さつま」が選ばれた
    kind: fact
    level: E4
    status: established
    sources:
    - s4-minamisatsuma-uub
  - text: 旧中心の加世田市は昭和29年（1954年）7月15日、加世田町と万世町が合併して発足した市であった
    kind: fact
    level: E4
    status: established
    sources:
    - s4-kasedashi-uub
  - text: 市域の坊津は古くからの良港で知られ、一帯は国の名勝『坊津』に指定されている
    kind: fact
    level: E2
    status: established
    sources:
    - s4-minamisatsuma-city-gaiyo
  column:
    title: 読みが同じ2つの最終候補
    text: 南さつま市の市名決定は、最終候補が「南薩摩」と「南さつま」という、読みがまったく同じ2案に絞られた珍しい決選だった。争われたのは意味ではなく表記であり、結果は漢字の重厚さよりも平仮名のやわらかさを取った「南さつま」の勝利だった。公募の上位には「南薩」「薩南」「川辺」「加世田」なども並んでおり、旧郡名や旧市名を推す声も少なくなかったことがうかがえる。
    sources:
    - s4-minamisatsuma-uub
  relations:
  - pref/46
  - muni/46-南九州市
  - muni/46-枕崎市
  - muni/46-日置市
  unknowns:
  - 市名の命名理由を述べた合併協議会・市公式の一次説明は確認できなかった（公募結果と候補の変遷は変遷情報データベースによる）
  - 旧中心地名「加世田」の語源と確かな初出は確認できなかった
  updated: '2026-11-13'
- id: muni/46-南九州市
  code: '462233'
  names:
    ja: 南九州市
    reading: みなみきゅうしゅうし
    aliases:
    - 知覧町
    - 川辺町
    - 頴娃町
  user_terms:
  - 知覧
  - 川辺
  - みなみきゅうしゅう
  - 知覧茶のまち
  naming_type: 方位・位置による命名
  formation: 合併新設
  prefecture: 鹿児島県
  homonyms: []
  summary: 平成19年（2007年）12月1日、揖宿郡頴娃町・川辺郡知覧町・川辺町の3町が新設合併して発足した市。市名は九州の南部に位置することに由来する方角地名で、県名も旧国名も含まない。読みの「みなみきゅうしゅう」は9文字で自治体名の読みとしては日本最長とされる一方、市域が九州南部の一部にすぎないことから「広域地名の僭称」との批判も受けている。
  first_attestation:
    era: null
    year_western: null
    document: null
    note: 「南九州」という市名自体は2007年の合併で生まれた命名そのものが初出。広域地域名としての「南九州」はそれ以前から一般に使われていた
  claims:
  - text: 南九州市の地方公共団体コードは462233である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  - text: 南九州市は平成19年（2007年）12月1日、旧頴娃町・旧知覧町・旧川辺町の3町の新設合併で発足した
    kind: fact
    level: E2
    status: established
    sources:
    - s4-minamikyushu-city-koho
    - s4-minamikyushu-uub
  - text: 市名「南九州」は、市が九州島の南部に位置することに由来する方角地名である
    kind: fact
    level: E5
    status: established
    sources:
    - s4-minamikyushu-wiki
  - text: 新市名は公募の上位案から絞り込まれ、最終候補の「南薩（なんさつ）」と「南九州」の2点から「南九州」が選ばれた
    kind: fact
    level: E4
    status: established
    sources:
    - s4-minamikyushu-uub
  - text: 市名の読み仮名「みなみきゅうしゅう」は9文字となり、日本の自治体名の読みとしては最長である
    kind: fact
    level: E5
    status: established
    sources:
    - s4-minamikyushu-wiki
  - text: 地名研究者の今尾恵介は、九州南部のうちの一部地域にすぎない本市が「南九州」を名乗ることを「僭称地名」の筆頭格として批判している
    kind: fact
    level: E5
    status: contested
    sources:
    - s4-minamikyushu-wiki
  - text: この合併で川辺郡と揖宿郡はともに消滅し、市役所は旧知覧町役場に置かれた
    kind: fact
    level: E4
    status: established
    sources:
    - s4-minamikyushu-uub
    - s4-minamikyushu-wiki
  column:
    title: 候補にあった「平和」という市名
    text: 南九州市の新市名公募の上位10点には、「薩南」「南薩」といった地域名に混じって「平和（へいわ）」という案が入っていた。旧知覧町には特攻隊の出撃基地だった知覧特攻平和会館があり、平和への願いを市名に託そうという発想だったとみられる。最終候補は「南薩」と「南九州」に絞られ、選ばれたのは九州全体を背負う大きな名だった。その大胆さゆえ「僭称」との批判も受けるが、読みの長さ日本一という記録とともに、この市名は平成の大合併が生んだ最も議論を呼ぶ命名の一つになっている。
    sources:
    - s4-minamikyushu-uub
    - s4-minamikyushu-wiki
  relations:
  - pref/46
  - muni/46-南さつま市
  - muni/46-枕崎市
  - muni/46-指宿市
  unknowns:
  - 市名の選定理由を述べた合併協議会・市公式の一次説明は確認できなかった（公募結果と候補の変遷は変遷情報データベースとWikipediaによる）
  - 「平和」が候補に入った理由（知覧の特攻平和会館との関係）は推測の域を出ず、公式記録では確認できなかった
  updated: '2026-11-13'
- id: muni/46-南大隅町
  code: '464911'
  names:
    ja: 南大隅町
    reading: みなみおおすみちょう
    aliases:
    - 根占町
    - 佐多町
    - 南隅
  user_terms:
  - みなみおおすみ
  - 本土最南端の町
  - 佐多岬のある町
  naming_type: 方位・位置による命名
  formation: 合併新設
  prefecture: 鹿児島県
  homonyms: []
  summary: 鹿児島県肝属郡の町で、大隅半島の最南部に位置し、日本本土最南端の佐多岬を有する。2005年3月31日、根占町と佐多町が合併して発足した。町名「南大隅」は公募で決められたが、明治期に実在した南大隅郡の名でもあり、町発足前から県立南大隅高等学校が名乗っていた地域の呼び名でもあった。旧根占は中世の荘園・禰寝院の地で、「根占（ねじめ）」の読みは禰寝氏の名字に通じる。
  first_attestation:
    era: 明治20年
    year_western: 1887
    document: 南大隅郡の設置（郡名として）
    note: Wikipedia「南大隅町」が、現町域は後に大隅郡に属し1887年から1897年までは南大隅郡とされたと紹介するもの。「南大隅」の名の側の早い用例として記録する。町名としての採用は2005年
  claims:
  - text: 総務省「地方公共団体コード一覧」で、南大隅町の団体コードは464911とされている
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  - text: 2005年3月31日、根占町と佐多町が合併して南大隅町が誕生したと、町公式サイト「南大隅町誕生までの経緯」は記録している
    kind: fact
    level: E2
    status: established
    sources:
    - s2-minamiosumi-town-keii
  - text: 新町名称は両町の住民に公募され、応募総数1,042通（うち有効1,020通）・有効候補240候補の中から選定が進み、2004年10月1日の第2回南大隅合併協議会で新町の名称を「南大隅町」とすることが承認されたと、町公式サイトは記録している
    kind: fact
    level: E2
    status: established
    sources:
    - s2-minamiosumi-town-keii
  - text: 当初は根占町・佐多町・大根占町・田代町の4町で2003年6月に南隅地域合併協議会を設置して協議したが、大根占町側の反対により決裂し、根占町と佐多町の2町で2004年9月に南大隅合併協議会を設置して合併に至ったとWikipediaは紹介している
    kind: fact
    level: E5
    status: established
    sources:
    - s2-minamiosumi-wiki
  - text: 「南大隅」は町域を含む地域の呼び名でもあり、1887年から1897年までは南大隅郡が置かれていた。また町が発足する前から県立南大隅高等学校が「南大隅」を名乗っていたとWikipediaは紹介している
    kind: fact
    level: E5
    status: established
    sources:
    - s2-minamiosumi-wiki
  - text: 平安時代には現町域に禰寝院と呼ばれる荘園があり、建部氏がこれに因んで禰寝氏（根占氏とも）を名乗ってこの地を長く治めた。「根占」の読み「ねじめ」はこの禰寝の層に連なるとWikipediaは紹介している
    kind: fact
    level: E5
    status: established
    sources:
    - s2-minamiosumi-wiki
  - text: 江戸時代には根占・佐多に薩摩藩の外城が置かれ、1784年に根占郷・佐多郷と改められた。1889年の町村制で小根占村・佐多村となり、小根占村は1941年に根占町、佐多村は1947年に佐多町となったとWikipediaは紹介している
    kind: fact
    level: E5
    status: established
    sources:
    - s2-minamiosumi-wiki
  - text: 町域の南端の佐多岬は日本本土最南端の地で、岬上を北緯31度線が通るとWikipediaは紹介している
    kind: fact
    level: E5
    status: established
    sources:
    - s2-minamiosumi-wiki
  column:
    title: 新しい町名は、明治の郡名だった
    text: 2005年の合併で生まれた「南大隅町」は、まったくの新造名ではない。1887年から1897年までの10年間、この一帯には実際に南大隅郡が置かれていたし、町が生まれる前から県立南大隅高等学校が「南大隅」の名を掲げていた。公募には1,042通の応募があり240もの候補が並んだが、最終的に選ばれたのは、地域の人々がもともと自分たちの土地を呼んでいた名だった。面白いのは、隣の錦江町も含めた一帯が「南隅」と呼ばれることで、「南大隅」は町一つの名であると同時に、大隅半島の南半分を指す広い地域名でもある点である。
    sources:
    - s2-minamiosumi-town-keii
    - s2-minamiosumi-wiki
  relations:
  - pref/46
  - muni/46-錦江町
  - muni/46-肝付町
  unknowns:
  - 公募で「南大隅」が何通の応募だったかは確認できなかった
  - 「根占（ねじめ）」の語源そのものを説明した専門資料（『角川日本地名大辞典』等の当該項目）は確認できなかった
  - 「佐多」の地名の由来・初出は確認できなかった
  updated: '2026-11-13'
- id: muni/46-南種子町
  code: '465020'
  names:
    ja: 南種子町
    reading: みなみたねちょう
    aliases:
    - 南種子村
  user_terms:
  - みなみたね
  - 鉄砲伝来の地
  - 種子島宇宙センターのある町
  - ロケットの町
  naming_type: 方位・位置による命名
  naming_note: 島の南端に位置することによる位置命名。中種子が中郡にあたるのと対になる名付け
  formation: 合併新設
  prefecture: 鹿児島県
  homonyms: []
  summary: 種子島の南端を占める町で、明治22年（1889年）4月の町村制施行で発足した南種子村が、昭和31年（1956年）10月に町制を施行して南種子町となった。町名の「南」は島の南部という位置を示す。天文12年（1543年）にポルトガル人を乗せた船が漂着した鉄砲伝来の地であり、現在の町域には種子島宇宙センターが置かれる。
  first_attestation:
    era: 明治22年
    year_western: 1889
    document: 町村制施行による南種子村の発足
    note: 自治体名としての「南種子」の初出。島の南部という位置による命名で、中種子の「中郡」対応と対になる近代の名付け
  claims:
  - text: 南種子町の地方公共団体コードは465020である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  - text: 明治22年（1889年）4月の町村制施行により南種子村が誕生したと町は紹介する
    kind: fact
    level: E2
    status: established
    sources:
    - s3-minamitane-gaiyou
  - text: 南種子村は茎永村・島間村・西之村・平山村・中之村の区域をもって発足したとWikipedia「熊毛郡」は紹介する
    kind: fact
    level: E5
    status: established
    sources:
    - s3-kumage-wiki
  - text: 南種子村は昭和31年（1956年）10月に町制を施行し南種子町となったと町は紹介する（施行日は10月15日とWikipedia「熊毛郡」は紹介する）
    kind: fact
    level: E2
    status: established
    sources:
    - s3-minamitane-gaiyou
    - s3-kumage-wiki
  - text: 天文12年（1543年）、ポルトガル人が乗った明国船が種子島最南端の前之浜に漂着し、鉄砲伝来の地として歴史的な由来を持つと町は紹介する
    kind: fact
    level: E2
    status: established
    sources:
    - s3-minamitane-gaiyou
  - text: 明治維新までの約700年間、平行盛の子孫が代々島主として種子島を治めており、赤尾木（現在の西之表市）を中心に統治したと町は紹介する
    kind: fact
    level: E2
    status: established
    sources:
    - s3-minamitane-gaiyou
  - text: 現在の南種子町には日本の科学技術を集めた種子島宇宙センターがあると町は紹介する
    kind: fact
    level: E2
    status: established
    sources:
    - s3-minamitane-gaiyou
  - text: 中種子が中世の郡政の「中郡」にあたることと、島を上郡・中郡・下郡に三分したという伝承からすれば、南種子はその「下郡」にあたる地域と考えられる
    kind: fact
    level: H
    status: inferred
    sources:
    - s3-nakatane-kaso
  column:
    title: 鉄砲からロケットへ、同じ南の空
    text: 1543年、ポルトガル人を乗せた船が漂着したのは島の南端、前之浜（門倉岬）だった。鉄砲はここから日本中に広がり、やがて火縄銃そのものが「種子島」と呼ばれるようになる。それから約430年後、同じ南種子町の地に種子島宇宙センターが置かれ、今度はロケットがこの南の空から宇宙へ飛び立つようになった。町自身が「歴史と未来が共存する町」と表現するゆえんである。なお鉄砲伝来は島の歴史の層であって、1889年に付けられた「南種子」という町名そのものの由来は、島の南部という位置にすぎない。
    sources:
    - s3-minamitane-gaiyou
  relations:
  - pref/46
  - muni/46-中種子町
  - muni/46-西之表市
  unknowns:
  - 南種子が中世の郡政の「下郡」にあたることを明記した公的・専門資料は確認できなかった（位置関係からの類推にとどまる）
  - 「南種子」の名が1889年の村名採用時にどのような手続きで決まったかを示す資料は確認できなかった
  updated: '2026-11-13'
- id: muni/46-和泊町
  code: '465330'
  names:
    ja: 和泊町
    reading: わどまりちょう
    aliases:
    - 和泊村
  user_terms:
  - 沖永良部島の東半分の町
  - ワドゥマイ
  - エラブの町
  naming_type: 中心地名の継承
  naming_note: 中世以来の湊の名「和泊」を村名・町名として継承
  formation: 単独発足
  prefecture: 鹿児島県
  homonyms: []
  summary: 沖永良部島の東半分を占める町。方言でワドゥマイと呼ばれ、『日本歴史地名大系』は地名が湊を意味する「トゥマイ」に由来するとする。近世には島の代官所が置かれた行政の中心地で、1908年に和泊村として発足し、1941年に町制を施行した。
  first_attestation:
    era: 正保年間
    year_western: null
    document: 正保琉球国絵図
    note: 『日本歴史地名大系』によれば、村名の記載はないが湊としての「和泊（わとまり）」が見える（同書の紹介による）
  claims:
  - text: 和泊町の地方公共団体コードは465330である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  - text: 明治41年（1908年）4月1日、島嶼町村制の実施により沖永良部島に和泊村と知名村が編成された
    kind: fact
    level: E2
    status: established
    sources:
    - s5-kagoshima-oshima-gaikyo
  - text: 和泊村は昭和16年（1941年）5月1日に町制を施行して和泊町となった
    kind: fact
    level: E2
    status: established
    sources:
    - s5-kagoshima-oshima-gaikyo
    - s5-wadomari-wiki
  - text: 『日本歴史地名大系』は、正保琉球国絵図に村名の記載はないものの、湊としての「和泊（わとまり）」が見えると紹介する
    kind: fact
    level: E3
    status: established
    sources:
    - s5-kotobank-wadomari-mura
  - text: 『日本歴史地名大系』は、和泊の地名は湊を意味する「トゥマイ」に由来するとする
    kind: fact
    level: E3
    status: established
    sources:
    - s5-kotobank-wadomari-mura
  - text: 方言名ワドゥマイの由来には、和（ワー）の漁師が漁の前に波が落ち着くまで泊まったとする説と、大きな湾を意味する湾泊（ワンドゥマイ）から「ン」が省かれたとする説があり、『沖永良部島地名考』は両説を紹介する
    kind: fact
    level: E4
    status: contested
    sources:
    - s5-okinoerabu-aza
  - text: 島名の古層として、琉球王国の歌集『おもろさうし』に「ゑらぶしま」「ゑらぷせりよさ」と見え、島は古く「せりよさ」とも呼ばれた
    kind: fact
    level: E3
    status: established
    sources:
    - s5-nakamoto-erabu
  - text: 島には「いらで いらぼら ぬ いらぷ じま」という言い回しがあり、「選んでも選ぶことができない永良部島」、すなわち「どこを探しても見つけることができない恵まれた島」の意と解されてきた
    kind: legend
    level: E3
    status: established
    sources:
    - s5-nakamoto-erabu
  column:
    title: 島の都だった和泊――代官所と世之主の墓
    text: 和泊は古くから沖永良部島の表玄関だった。『日本歴史地名大系』によれば、元禄4年（1691年）に沖永良部島代官所が設置されると、和泊に代官役所（仮屋）が置かれ、与人役所も当地にあって、和泊は島の行政の中心となった。その記憶は地名にも残り、町内には中世に島を治めた豪族・世之主の墓と伝わる鹿児島県指定史跡「世之主の墓」がある。湊を意味するトゥマイに由来するという地名の通り、和泊は船の出入りと役所のある「島の都」として、知名と並ぶ島の中心であり続けた。
    sources:
    - s5-kotobank-wadomari-mura
    - s5-wadomari-kyoiku
  relations:
  - pref/46
  - muni/46-知名町
  unknowns:
  - 島名「沖永良部」の「沖」の字がいつ・なぜ付けられたかは確認できなかった
  - 沖永良部島代官所の設置年は、知名町公式が元禄3年（1690年）、『日本歴史地名大系』が元禄4年（1691年）としており、資料間で1年の差がある
  - 「ゑらぶ（エラブ）」という島名そのものの語源は、地名考でも不明とされる
  updated: '2026-11-13'
- id: muni/46-喜界町
  code: '465291'
  names:
    ja: 喜界町
    reading: きかいちょう
    aliases:
    - 喜界村
    - 早町村
    - 貴駕島
    - 貴海島
    - 鬼界島
    - 奇界島
    - キキャ
  user_terms:
  - きかい
  - 喜界島の町
  - 鬼界ヶ島の島
  - 俊寛の像がある島
  naming_type: 中心地名の継承
  formation: 合併新設
  prefecture: 鹿児島県
  homonyms: []
  summary: 喜界島の全島を町域とする町で、町名は島名「喜界」を継承する。島名は平安時代の文献に「貴駕島」と現れるのが初出とされ、のち「貴海島」「鬼界島」などとも書かれた。明治41年（1908年）に喜界村が成立し、昭和16年（1941年）の町制施行を経て、昭和31年（1956年）に早町村と合併して現在の喜界町となった。
  first_attestation:
    era: 平安時代（長徳4年）
    year_western: 998
    document: 『日本紀略』
    note: 「貴駕島」として現れるのが島名の文献初出とされる（二次資料経由の確認）。町名そのものではなく島名の初出
  claims:
  - text: 喜界町の地方公共団体コードは465291である
    kind: fact
    level: E2
    status: established
    sources:
    - s4-kagoshima-muni-list
  - text: 『日本紀略』長徳4年（998年）の「貴駕島」が喜界島の文献初出とされ、大宰府が南蛮人の捕縛を貴駕島に命じた記事と結びつけられる
    kind: fact
    level: E5
    status: established
    sources:
    - s4-wiki-kikaijima
  - text: 『吾妻鏡』には文治4年（1188年）に天野遠景による「貴海島征伐」が行われ、島が鎌倉幕府の支配に入ったと記される
    kind: fact
    level: E5
    status: established
    sources:
    - s4-wiki-kikaijima
  - text: 喜界島は「喜界」のほか「鬼界」「奇界」とも記され、「鬼界島」の表記は18世紀初めまで公的にも通用していた
    kind: fact
    level: E3
    status: established
    sources:
    - s4-kotobank-kikaijima
  - text: 島は方言で「キキャ」と呼ばれ、沖永良部島のユタの祝詞「シマタティシンゴ」にも「喜界（ききや）はウルシ嶽に」と歌われている
    kind: fact
    level: E3
    status: established
    sources:
    - s4-kotobank-kikaijima
  - text: 「喜界」の語源は未詳である。古い形とみられる「ききや」「キキャ」がどのような意味の語に由来するかは確認できない
    kind: fact
    level: E3
    status: indeterminate
    sources:
    - s4-kotobank-kikaijima
  - text: 明治41年（1908年）の島嶼町村制で喜界村が成立し、大正8年（1919年）に早町村が分立した。昭和16年（1941年）に喜界村が町制施行して喜界町となり、昭和31年（1956年）9月10日に早町村と合併して現在の喜界町となった
    kind: fact
    level: E2
    status: established
    sources:
    - s4-oshima-gaikyou
    - s4-kikai-yoran
  - text: 『平家物語』の流刑地「鬼界ヶ島」を喜界島とする説と、火山島という描写に合う硫黄島とする説とがあり、硫黄島説が有力とされる
    kind: fact
    level: E5
    status: contested
    sources:
    - s4-wiki-kikaijima
  column:
    title: 『平家物語』の鬼界ヶ島は喜界島か
    text: 俊寛らが流された「鬼界ヶ島」の場所は、古くから喜界島に比定されてきた。喜界島には俊寛の像も建てられ、江戸時代には薩摩藩の遠島先として実際に使われた歴史もある。しかし『平家物語』の鬼界ヶ島は硫黄の採れる火山島として描かれており、隆起サンゴ礁の平坦な喜界島とは景観が合わない。このため現在は、薩摩硫黄島に比定する説が有力とされる。喜界島が「鬼界」とも書かれたことが、比定論争の背景にある。
    sources:
    - s4-wiki-kikaijima
    - s4-kotobank-kikaijima
  relations:
  - pref/46
  unknowns:
  - 「喜界（ききや／キキャ）」の語源の定説は確認できなかった
  - 『日本紀略』の「貴駕島」を初出とする説明は二次資料経由でしか確認できなかった
  - 町名が島名から採られた経緯を説明する町公式資料は確認できなかった（全島が町域のため島名の継承とみられる）
  updated: '2026-11-13'
- id: muni/46-垂水市
  code: '462144'
  names:
    ja: 垂水市
    reading: たるみずし
    aliases:
    - 垂水町
  user_terms:
  - 桜島の対岸の市
  - 鹿児島湾フェリーの玄関口
  - たるみず
  naming_type: 中心地名の継承
  formation: 合併新設
  prefecture: 鹿児島県
  homonyms: []
  summary: 大隅半島西岸、桜島の対岸にある市。昭和30年（1955年）に垂水町・牛根村・新城村が合併して垂水町となり、昭和33年（1958年）10月1日に市制を施行した。「垂水」は中世後期から見える地名で、古語の「たるみ」は垂れ落ちる水・滝を意味する。江戸時代には市来・中俣の両村一帯が垂水村と称された。
  first_attestation:
    era: 室町時代
    year_western: 1474
    document: 雲遊雑記伝（行脚僧の雑録）
    note: 『日本歴史地名大系』が紹介する文明6年（1474年）の記録に、下大隅の石井氏と「垂水の丹波守」との関係が見える。同大系は「垂水」を中世後期から見える地名とする
  claims:
  - text: 垂水市の地方公共団体コードは462144である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  - text: 昭和30年（1955年）に垂水町と牛根・新城の2村が合併し、昭和33年（1958年）に市制を施行した
    kind: fact
    level: E3
    status: established
    sources:
    - s3-tarumizu-kotobank
  - text: 「垂水」は中世後期から見える地名で、下大隅郡に含まれ、江戸時代の市来・中俣両村が垂水村と称されたことから、この両村一帯に比定される
    kind: fact
    level: E3
    status: established
    sources:
    - s3-tarumizu-kotobank
  - text: 「たるみ（垂水）」は垂れ落ちる水・滝を意味する古語で、『万葉集』に「石走る垂水の水をむすびて飲みつ」の用例があると『精選版日本国語大辞典』は紹介する
    kind: fact
    level: E3
    status: established
    sources:
    - s3-tarumizu-kotobank
  - text: 蒲生氏系図は、保安4年（1123年）ごろに舜清が垂水に下向して垂水城を拠点にしたと伝える
    kind: fact
    level: E3
    status: established
    sources:
    - s3-tarumizu-kotobank
  - text: 垂水市は鹿児島湾に面し、鹿児島市（鴨池港）との間に大型カーフェリーが就航する大隅半島の表玄関である
    kind: fact
    level: E3
    status: established
    sources:
    - s3-tarumizu-kotobank
  column:
    title: 「垂水」は滝のこと――万葉の古語が残る地名
    text: 「たるみず」と読むこの地名の核は、古語の「たるみ」である。垂れ落ちる水、すなわち滝を意味し、『万葉集』にも「石走（いはばし）る垂水の水」と歌われた。だから「垂水」は特定の固有名詞というより、水の垂れる地形を指す普通名詞の地名で、神戸市垂水区や大阪府吹田市にも同名の地名が残る。鹿児島の垂水は中世後期から記録に見え、シラス台地の崖から水の湧く大隅半島西岸の地形と響き合う。桜島を正面に望む小さな市の名は、千二百年前の歌の言葉をいまに伝えている。
    sources:
    - s3-tarumizu-kotobank
  relations:
  - pref/46
  unknowns:
  - この地が「垂水」と呼ばれるようになった具体的な理由（どの滝や水源を指したか）は確認できなかった
  updated: '2026-11-13'
