  - text: 神流川の名は、古くは「カミノ川」と呼ばれ、武蔵国の北の果て「上」の国から流れる川の意が「神（カム）の川」、さらに「神名」に転じたものと国土交通省が解説している
    kind: fact
    level: E2
    status: established
    sources:
    - w11-kanna-mlit
  - text: 神流川は「感納川」「甘奈川」とも綴られてきた
    kind: fact
    level: E2
    status: established
    sources:
    - w11-kanna-mlit
  - text: 1954年（昭和29年）5月3日、丹荘村と青柳村が合併して神川村が発足した
    kind: fact
    level: E2
    status: established
    sources:
