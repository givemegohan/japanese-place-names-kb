prefecture_code: '11'
records:
- id: muni/11-さいたま市
  code: '111007'
  names:
    ja: さいたま市
    reading: さいたまし
    aliases:
    - 浦和市
    - 大宮市
    - 与野市
  user_terms:
  - さいたま市はなぜひらがな
  - さいたま市の名前の決め方
  - 埼玉とさいたま市の違い
  - 浦和と大宮が合併した市
  - 県名の発祥の地はどこ
  naming_type: 新規命名
  formation: 合併新設
  prefecture: 埼玉県
  homonyms: []
  summary: さいたま市は平成13年（2001年）5月1日に浦和市・大宮市・与野市が合併して誕生した新設市で、市名は市民公募を経て、県名と同じ「さいたま」をひらがな表記で採用した。ただし県名の原点である古代の埼玉（さきたま）は現在の行田市埼玉にあり、新市の市名が指す古代の土地は現在のさいたま市の市域にはないという、位置と読みの双方のずれを抱えている。
  first_attestation:
    era: 平成13年
    year_western: 2001
    document: 浦和市・大宮市・与野市の合併による市制施行（新市名称の公募と決定）
    note: 合併新設市の命名そのものが「さいたま市」という自治体名の初出。「さいたま」の語自体は古代の埼玉（さきたま）に遡るが、表記はひらがな、読みは現代の県名の読みを採った
  claims:
  - text: さいたま市公式によれば、平成13年（2001年）5月1日、浦和市・大宮市・与野市の3市が合併し、人口103万人を擁する「さいたま市」が誕生した
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-saitama-20th
  - text: さいたま市公式FAQによれば、新市名については平成12年（2000年）1月10日から40日間公募が実施され、平仮名の「さいたま市」、漢字の「埼玉市」、「彩都市」、「さきたま市」、「関東市」の5つの案が候補に選ばれた
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-saitama-faq
  - text: さいたま市公式FAQによれば、応募総数は67,396人で、うち漢字の「埼玉市」と平仮名の「さいたま市」の2案を合わせて10,938人の応募があり、ひらがなの採用理由として、誰からも埼玉県の県庁所在地と分かること、漢字の埼玉県と区別すること、市名から受ける感じをやさしく柔らかくすることが挙げられている
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-saitama-faq
  - text: さいたま市公式FAQは新市名の決定理由の1つに『続日本紀』や『万葉集』にもその名が散見される歴史ある名であることを挙げる一方、埼玉県名発祥之碑の碑文によれば、古代の表記は前玉（さきたま）で、正倉院文書の神亀3年（726年）の山背国戸籍帳などに武蔵国前玉郡と見える。つまり古代の読みは「さきたま」であり、市の名が採った「さいたま」は後世の読みである
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-saitama-faq
    - b-saitama-hasshohi
  - text: 埼玉県名発祥之碑の碑文によれば、埼玉郡は律令による国郡制度発足当初から置かれた郡とみられ、その原点の地は現在の行田市埼玉である。したがって「埼玉」の原点は、さいたま市の市域（旧浦和市・大宮市・与野市）にはなく、北へ離れた行田市にある
    kind: fact
    level: E2
    status: established
    sources:
    - b-saitama-hasshohi
  - text: さいたま市公式によれば、平成15年（2003年）4月に政令指定都市へ移行し、平成17年（2005年）4月に岩槻市と合併して現在の市域となった
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-saitama-20th
  - text: さいたま市公式によれば、さいたま市の地方公共団体コードは111007である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-saitama-code
  column:
    title: 「埼玉」の原点は、さいたま市にはない
    text: さいたま市の名は県名から採られたが、その県名の原点は行田市埼玉（さきたま）にある。古代、そこは前玉・埼玉と呼ばれた土地で、さきたま古墳群が残り、「埼玉県名発祥之碑」も行田市に建つ。2001年の合併で生まれた新市は、この由緒ある名を借りたが、読みは古代の「さきたま」ではなく現代の「さいたま」、表記は漢字ではなくひらがなを選んだ。公募の候補には「さきたま市」も残っていたが、採用されたのは県庁所在地と一目で分かる「さいたま市」だった。名の故郷と名を受け継いだ都市が、読みも場所もずれているのがこの市名の面白さである。
    sources:
    - b-saitama-hasshohi
    - b-cap-saitama-faq
  relations:
  - pref/11
  unknowns:
  - 新市名の候補5案がどのような選定過程（合併協議会での審議等）を経て1案に絞られたかの詳細は、公式資料で確認できなかった
  - 県庁所在地だった浦和市の名が新市名に残らなかった経緯についての公式説明は、確認できなかった
  updated: '2026-11-13'
- id: muni/11-ときがわ町
  code: '113492'
  names:
    ja: ときがわ町
    reading: ときがわまち
    aliases:
    - 都幾川村
    - 玉川村
  user_terms:
  - ときがわ町の名前の由来
  - ひらがなの町名
  - 都幾川の清流の町
  - 慈光寺と建具の里
  naming_type: 自然地名から
  formation: 合併新設
  prefecture: 埼玉県
  homonyms: []
  summary: 埼玉県比企郡の町。平成18年（2006年）に都幾川村と玉川村が合併し、両村を西から東へ流れる川「都幾川」の読みをそのまま平仮名にした町名で発足した。川名は昭和30年（1955年）に都幾川村の村名にもなった名だが、「都幾」の語源は「斎（とき）」説などがあり定説はない。
  first_attestation:
    era: 平成18年
    year_western: 2006
    document: 都幾川村・玉川村合併協議会による新町名の決定（官報告示は平成17年8月24日）
    note: 町名としての初出（命名そのもの）。川名「都幾川」自体の初出は未確認
  claims:
  - text: 総務省の全国地方公共団体コードで、ときがわ町の団体コードは113492と定められている
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
    - w9-tokigawa-town-kyoiku
  - text: 平成18年（2006年）2月1日、比企郡都幾川村と玉川村が合併して、ときがわ町が誕生した
    kind: fact
    level: E2
    status: established
    sources:
    - w9-tokigawa-town-kyoiku
  - text: 町名は、町を西から東へ流れる川「都幾川」の名を平仮名で表記したもので、町公式資料も「町名の由来でもあります都幾川が西から東へ流れる」と説明する
    kind: fact
    level: E2
    status: established
    sources:
    - w9-tokigawa-town-kyoiku
  - text: 都幾川村は昭和30年（1955年）に明覚村・平村・秩父郡大椚村の3村が合併して成立し、その際に川の名を村名とした
    kind: fact
    level: E3
    status: established
    sources:
    - w9-tokigawa-kotobank
  - text: 『都幾川村史』は村名について「地名『都幾川』に由来」とする節を立てており、村名・町名のいずれも川の名の継承である
    kind: fact
    level: E2
    status: established
    sources:
    - w9-tokigawa-murashi-chiri
  - text: 都幾川という川名の語源については、清めることを意味する「斎（とき）」から来ているとする説や、慈光寺のある都幾山の南麓を流れることとの関係を説く見方があるが、定説はない
    kind: fact
    level: E5
    status: contested
    sources:
    - w9-tokigawa-wiki-river
  - text: 合併したもう一方の玉川村には、江戸時代に幕府の機関である玉川陣屋が置かれ、周辺50か村の中心として栄えた歴史がある
    kind: fact
    level: E2
    status: established
    sources:
    - w9-tokigawa-town-kyoiku
  column:
    title: 消えた村名は、建物の名前に残る
    text: 2006年の合併で、都幾川村の名は川の名として町名に生き残りましたが、玉川村の名は自治体名からは消えました。それでも旧玉川村の文化センターは今も「アスピアたまがわ」と呼ばれ、合併協議会の会議もそこで開かれました。川の名を町名にするという選択は、どちらか一方の村名を残すのではなく、二つの村に共通する自然の名を選ぶという解決でもありました。漢字の「都幾川」は川の正式な表記として残り、町の名だけが平仮名になった点も、この町の名前の面白さです。
    sources:
    - w9-tokigawa-town-gappei
    - w9-tokigawa-town-kyoiku
  relations:
  - pref/11
  unknowns:
  - 都幾川の川名の初出と語源の学術的検討は未確認
  - 町名を平仮名表記にした理由の公式記録は未確認
  - 新町名の他の候補案は未確認
  updated: '2026-11-13'
- id: muni/11-ふじみ野市
  code: '112453'
  names:
    ja: ふじみ野市
    reading: ふじみのし
    aliases:
    - 上福岡市
    - 大井町
  user_terms:
  - ふじみの
  - 上福岡
  - ふじみ野駅
  - おおい
  naming_type: 学校名・駅名などから
  formation: 合併新設
  prefecture: 埼玉県
  homonyms: []
  summary: 2005年に上福岡市と入間郡大井町が合併して誕生した、ひらがな表記の市名を持つ市。「ふじみ野」はもともと富士見市・三芳町を含む2市2町の合併で使うはずだった新市名で、合併が不成立になった後も1993年開業のふじみ野駅の名として残り、12年後に2市町の合併で市名として実現した。隣接する富士見市とは名前が酷似し、合併時に再考を求められた経緯がある。
  first_attestation:
    era: 平成17年
    year_western: 2005
    document: 上福岡市・大井町法定合併協議会による新市名称の決定
    note: 市名としての決定は2005年1月。ただし「ふじみ野」の語そのものは1993年開業の東武東上線ふじみ野駅の駅名として先に使われていた。
  claims:
  - text: 平成17年（2005年）10月1日に上福岡市と入間郡大井町が新設合併し、ふじみ野市が誕生した
    kind: fact
    level: E2
    status: established
    sources:
    - w1-fujimino-city-keii
  - text: 新市の名称「ふじみ野市」は、平成17年（2005年）1月に上福岡市・大井町法定合併協議会で決定され、同月に合併協定書が調印された
    kind: fact
    level: E2
    status: established
    sources:
    - w1-fujimino-city-keii
  - text: 「ふじみ野」という名称は、もともと富士見市・上福岡市・大井町・三芳町の2市2町による合併協議の中で、合併後の新市名として用いることが決まっていたもので、この合併は2003年の住民投票で不成立となった
    kind: fact
    level: E5
    status: established
    sources:
    - w1-fujimino-wiki
    - w1-fujimino-uub
  - text: 平成5年（1993年）に開業した東武東上線ふじみ野駅の駅名は、合併後の新市名「ふじみ野」にちなんで公募の中から決められたとされ、市が存在しない時期に駅名として先行して使われ始めた
    kind: fact
    level: E5
    status: established
    sources:
    - w1-fujimino-wiki
  - text: 新市名の決定に際し、隣接する富士見市は、駅の所在地でありながら駅名と紛らわしいことなどを理由に「ふじみ野市」の名称を使わないよう求める動きを見せたが、名称は変更されなかった
    kind: fact
    level: E5
    status: contested
    sources:
    - w1-fujimino-wiki
    - w1-fujimino-uub
  - text: 旧上福岡市は、昭和47年（1972年）4月10日に福岡町が市制を施行した際、福岡県福岡市との同名を避けるため「上」を冠して上福岡市と改称したものである
    kind: fact
    level: E5
    status: established
    sources:
    - w1-fujimino-uub
  - text: 旧大井町は明治22年（1889年）の大井村に始まり、昭和41年（1966年）に町制を施行して大井町となった
    kind: fact
    level: E2
    status: established
    sources:
    - w1-fujimino-city-plan
    - w1-fujimino-uub
  - text: 総務省の全国地方公共団体コードで、ふじみ野市の団体コードは112453と定められている
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 市より先に生まれた駅名「ふじみ野」
    text: 「ふじみ野」という名前は、順序が普通と逆である。1990年代、富士見市・上福岡市・大井町・三芳町の合併構想の中で新市名「ふじみ野市」が決まり、1993年に開業した新しい駅は、その未来の市名にちなんで「ふじみ野駅」と名付けられた。ところが合併は2003年の住民投票で不成立となり、市は幻に終わった。駅名だけが残り、駅は所在地の富士見市の中で「ふじみ野」を名乗り続けた。2005年、上福岡市と大井町だけの合併が実現したとき、新市はこの名を採用した。市名が駅名を追いかけた形である。なお、この名をめぐっては、隣の富士見市が「紛らわしい」として再考を求めた経緯があり、似た名前の両市は今も隣り合っている。
    sources:
    - w1-fujimino-wiki
    - w1-fujimino-city-keii
  relations:
  - pref/11
  unknowns:
  - 市名「ふじみ野」の選定理由として協議会が公式に示した文言（富士山の眺望との関係など）は、市公式ページでは未確認
  - 新市名公募の応募総数・得票の内訳は未確認
  updated: '2026-11-13'
- id: muni/11-三芳町
  code: '113247'
  names:
    ja: 三芳町
    reading: みよしまち
    aliases:
    - 三芳村
    - 三芳野
  user_terms:
  - 三芳町の名前の由来
  - みよし野の町
  - 伊勢物語ゆかりの町名
  - 三富新田の町
  naming_type: 文献・故事から命名
  formation: 合併新設
  prefecture: 埼玉県
  homonyms: []
  summary: 埼玉県入間郡の町。町名は『伊勢物語』にも詠まれた武蔵野の美称「三芳野（みよしの）」から採られたもので、明治22年（1889年）に4か村が合併した際の命名である。当初案の「三芳野村」から「野」を省いて「三芳村」になったと伝わる。合併した村々の基は、元禄7年（1694年）の三富新田の開拓にある。
  first_attestation:
    era: 平安時代
    year_western: null
    document: 『伊勢物語』第十段（三芳野を詠んだ歌のやり取り）
    note: 町名の出典となった古地名「三芳野」の歌物語における使用例。歌の舞台が入間郡の三芳野の里とされることは町広報の解説による
  claims:
  - text: 総務省の全国地方公共団体コードで、三芳町の団体コードは113247と定められている
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
    - w9-miyoshi-town-gaiyou
  - text: 明治22年（1889年）4月1日の町村制施行により、入間郡の上富村・北永井村・藤久保村・竹間沢村の旧4か村が合併して三芳村が誕生し、昭和45年（1970年）に町制を施行して三芳町となった
    kind: fact
    level: E2
    status: established
    sources:
    - w9-miyoshi-town-gaiyou
  - text: 町名「三芳」は、古く武蔵野の原野を指した美称「三芳野」から採られたもので、中世まで武蔵野一帯は広い範囲で「みよし野」と呼ばれていた
    kind: fact
    level: E2
    status: established
    sources:
    - w9-miyoshi-mlit-garden
    - w9-miyoshi-town-koho
  - text: 「三芳野」は、芳野（美しい・うるわしい野原の意）に接頭語の「み」（とてもの意）がついたものと考えられ、とても美しい草原が広がっているところを意味すると、町広報は説明する
    kind: fact
    level: E2
    status: established
    sources:
    - w9-miyoshi-town-koho
  - text: 平安時代の『伊勢物語』第十段には、在原業平と三芳野を詠み交わした歌の段があり、歌の女性が住んでいたのが入間郡の三芳野の里であると、町広報は紹介する
    kind: fact
    level: E2
    status: established
    sources:
    - w9-miyoshi-town-koho
  - text: 合併の際は当初「三芳野村」とする予定だったが、先行して同名の村が埼玉県内に3つ誕生しており、県から「多すぎる」として変更を求められたため、「野」を省いて三芳村としたと伝わる
    kind: fact
    level: E5
    status: indeterminate
    sources:
    - w9-miyoshi-wiki
  - text: 合併した村々の基は、元禄7年（1694年）に川越藩主・柳沢吉保の命による「三富新田」の開拓で成立した村々にあり、上富の名は現在も大字として残る
    kind: fact
    level: E2
    status: established
    sources:
    - w9-miyoshi-town-gaiyou
  column:
    title: 消えた「野」の字
    text: 1889年、三芳野という千年前の歌の地名が、そのまま村の名前になろうとしていました。ところが埼玉県内では、同じ年に「三芳野村」を名乗る村が先にいくつも生まれていたため、県の求めで「野」の一字を省いて「三芳村」になったと伝えられます。武蔵野の原野を指す美称としてあまりに魅力的だったため、県内のあちこちで同じ名前が競合したのです。なお、その同名の村々はその後の合併でいずれも消え、残ったのは「野」を失ったこの三芳だけでした。
    sources:
    - w9-miyoshi-wiki
    - w9-miyoshi-town-koho
  relations:
  - pref/11
  unknowns:
  - 『伊勢物語』第十段の三芳野が現在の町域を指すことの文学研究上の裏づけは未確認
  - 「三芳野村」案が退けられた経緯を示す当時の一次記録は未確認
  updated: '2026-11-13'
