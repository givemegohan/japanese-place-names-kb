  - text: 町は木曽川の最下流・河口部に位置し、周囲を堤防で囲まれた輪中の地形のうえに集落と耕地が広がる
    kind: fact
    level: E2
    status: established
    sources:
    - x8-kisosaki-mlit
  - text: 三重県の市町村で木曽川東岸に位置するのは木曽岬町と桑名市長島町老松の区域のみであり、本町は桑名郡に属する唯一の町である
