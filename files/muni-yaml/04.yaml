- id: muni/04-利府町
  code: '044067'
  names:
    ja: 利府町
    reading: りふちょう
    aliases:
    - 利府村
    - 十符
  user_terms:
  - りふ
  - 十符の菅薦の里
  - グランディ21のある町
  naming_type: その他（古地名「十符」に佳字を当てた名の継承）
  prefecture: 宮城県
  homonyms: []
  summary: 宮城県宮城郡の、仙台市の北東に隣接する町。古くは平安時代の歌枕「十符の菅薦」の産地として知られた「十符（とふ）」の地で、留守氏が居住した際に「十符」に佳字の「利」と国府の「府」を当てて「利府」となり、「りふ」と読み替えられたと考えられている。『安永風土記』には国府に付随する地として「利府」と相称したことが記される。1889年に利府村が発足し、1967年に町制を施行した。
  first_attestation:
    era: 文禄4年
    year_western: 1595
    document: 「利府本郷」の表記（語源由来辞典が紹介）
    note: 「利府」表記の確認できる古い例とされるもの。古地名「十符」はそれに先立ち、平安時代の歌枕「十符の菅薦」として知られていた
  claims:
  - text: 総務省の全国地方公共団体コードで、利府町の団体コードは044067と定められている
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  - text: 利府は平安時代から「十符の菅薦（とふのすがこも）」の産地であり、編み目が10筋あるスゲで編んだ敷物「菅薦」に由来して「十符」と呼ばれたとされる
    kind: fact
    level: E4
    status: established
    sources:
    - z8-rifu-gogen
    - z8-rifu-culture
  - text: 地域文化資料が引用する『安永風土記』には「往古多賀国府に付、利府と相称候」とあり、国府に付随する地として「利府」と称されていたことが記される
    kind: fact
    level: E2
    status: established
    sources:
    - z8-rifu-culture
  - text: 留守氏がこの地に居住した際、「十符」に佳字の「利」と国府の「府」を当てて「利府」となり、のちに「りふ」と読み替えたと考えられている
    kind: fact
    level: E4
    status: indeterminate
    sources:
    - z8-rifu-gogen
  - text: 一方、利府の地は塩竈市・七ヶ浜町とともに陸奥府中の内に当たるものの、「国府」や「府中」が町名の直接の由来かどうかは不明と整理されている
    kind: fact
    level: E5
    status: indeterminate
    sources:
    - z8-rifu-wiki
  - text: 「利府」の地名は文禄4年（1595年）に「利府本郷」で見えるのが古い例とされる
    kind: fact
    level: E4
    status: established
    sources:
    - z8-rifu-gogen
  - text: 明治22年（1889年）に利府村が誕生し、昭和42年（1967年）に町制を施行して利府町となった
    kind: fact
    level: E4
    status: established
    sources:
    - z8-rifu-gogen
  column:
    title: 歌枕の敷物を編み直す町
    text: 「十符の菅薦」は、都の歌人にも知られたみちのくの歌枕だった。スゲを編んだ敷物は昭和初期まで当地で作られていたが、製法はいったん失われた。今、町の文化事業として、菅草の群生地・春日地区で菅薦づくりの復元が進められている。地名の「十符」の記憶は、漢字が「利府」に変わった後も、編み目の数え方とともに手仕事の中に生き続けている。
    sources:
    - z8-rifu-culture
    - z8-rifu-gogen
  relations:
  - pref/04
  - muni/04-多賀城市
  unknowns:
  - 「十符」から「利府」への表記変更の正確な時期と経緯は未確定
  - 留守氏による当て字という説明の一次資料は未確認
  - 「十符の菅薦」が詠まれた平安時代の歌の具体的な出典は未確認
  updated: '2026-11-13'
- id: muni/04-加美町
  code: 044458
  names:
    ja: 加美町
    reading: かみまち
    aliases: []
  user_terms:
  - かみまち
  - 加美富士（薬莱山）の町
  - やくらい
  naming_type: 合併新設（郡名「加美」を採用）
  prefecture: 宮城県
  homonyms: []
  summary: 宮城県加美郡の町。2003年4月1日に中新田町・小野田町・宮崎町が新設合併して発足した、宮城県内の平成の合併の第一号である。新町名「加美」は、3町が属する加美郡の郡名を継承したもので、郡名は奈良時代の『続日本紀』に見える「賀美郡」に遡り、江戸時代に「加美」と改められたとされる。当初は色麻町を含む4町で「加美市」を目指したが、色麻町の離脱により町制の町となった。
  first_attestation:
    era: 奈良時代
    year_western: null
    document: 『続日本紀』（「賀美郡」）
    note: 町名の源である郡名の原型「賀美」の初出とされるもの。二次資料経由の確認にとどまる。町名「加美町」自体は2003年の合併で誕生した
  claims:
  - text: 総務省の全国地方公共団体コードで、加美町の団体コードは044458と定められている
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  - text: 平成15年（2003年）4月1日に加美郡中新田町・小野田町・宮崎町を廃して新たに加美町が置かれる新設合併が行われ、県内における平成の合併の第一号となった
    kind: fact
    level: E2
    status: established
    sources:
    - z8-kami-pref
  - text: 新町名の決定にあたっては候補17点が挙げられ、最終候補には「加美」「加美富士」「新加美」「加美大崎」「加美郡」と郡名にちなむ案が並び、「加美」が選ばれた
    kind: fact
    level: E4
    status: established
    sources:
    - z8-kami-uub
  - text: 合併の検討は当初、色麻町を含む加美郡4町で進められ「加美市」の発足が想定されていたが、色麻町が合併期日の延期を申し入れて協議が休止となり、3町での合併に切り替えたため町制の加美町となった
    kind: fact
    level: E2
    status: established
    sources:
    - z8-kami-pref
    - z8-kami-uub
  - text: 加美郡の名は、奈良時代の『続日本紀』に「賀美郡」と記されたものに遡り、その後色麻郡を併せ、江戸時代に賀美郡から加美郡に改名したとされ、明治22年（1889年）の町村制でも町域には「賀美石村」の名が残っていた
    kind: fact
    level: E5
    status: established
    sources:
    - z8-kami-gun-wiki
  - text: 町域は鳴瀬川・田川が貫流し、加美富士と呼ばれる薬莱山を擁する、大崎耕土の一角をなす穀倉地帯である
    kind: fact
    level: E2
    status: established
    sources:
    - z8-kami-pref
  column:
    title: 「加美市」にならなかった町
    text: 加美町は、もう少しで「加美市」になるところだった。当初は加美郡の4町すべてが合併し、市制を施行する計画だった。しかし色麻町が住民アンケートを理由に合併の延期を申し入れ、協議は休止。残る3町は単独での合併に切り替えたが、人口が市の要件に届かず、町制の「加美町」として出発することになった。郡の名を継ぐ新しい町の名には、こうした曲折の記憶も刻まれている。
    sources:
    - z8-kami-pref
    - z8-kami-uub
  relations:
  - pref/04
  unknowns:
  - 『続日本紀』の「賀美郡」の記載を原文では未確認（二次資料経由）
  - 「賀美」の語源そのもの（何を意味したか）は未確認
  - 新町名「加美」の選定理由を記した合併協議会の一次資料は未確認
  updated: '2026-11-13'
- id: muni/04-南三陸町
  code: '046060'
  names:
    ja: 南三陸町
    reading: みなみさんりくちょう
    aliases: []
  user_terms:
  - みなみさんりく
  - 志津川
  - 歌津
  - 三陸の南の玄関
  naming_type: 新規命名（公募で広域地名を採用）
  prefecture: 宮城県
  homonyms: []
  summary: 宮城県本吉郡の、三陸海岸南部に位置する町。2005年10月1日に志津川町と歌津町が新設合併して発足した。新町名「南三陸」は合併協議会が公募し、670件の応募の中から選ばれた名で、2004年1月に決定した。もともと2005年4月の合併を予定したが、歌津町議会での否決と再協議を経て、発足は10月にずれ込んだ。
  first_attestation:
    era: 平成16年
    year_western: 2004
    document: 志津川町・歌津町合併協議会の新町名決定（宮城県の合併資料）
    note: 公募と協議会の確認（平成16年1月21日）をもって自治体名としての「南三陸」が成立した。以後2005年10月1日の町発足で使用開始
  claims:
  - text: 総務省の全国地方公共団体コードで、南三陸町の団体コードは046060と定められている
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  - text: 平成17年（2005年）10月1日に、本吉郡志津川町と歌津町を廃し、その区域をもって新しい町を設置する新設合併により、南三陸町が発足した
    kind: fact
    level: E2
    status: established
    sources:
    - z8-minamisanriku-pref
  - text: 新町の名称は平成15年（2003年）11月1日から30日に公募され、応募件数は670件にのぼった
    kind: fact
    level: E2
    status: established
    sources:
    - z8-minamisanriku-pref
  - text: 平成16年（2004年）1月21日に、合併協議会で新町の名称が「南三陸町（みなみさんりくちょう）」と確認された
    kind: fact
    level: E2
    status: established
    sources:
    - z8-minamisanriku-pref
    - z8-minamisanriku-town
  - text: 合併の期日は当初平成17年（2005年）4月1日とされたが、歌津町議会で合併関連議案が否決され、再協議を経て同年10月1日に変更された
    kind: fact
    level: E2
    status: established
    sources:
    - z8-minamisanriku-pref
  - text: 旧志津川町は平成7年（1995年）に町制施行100周年を迎えた古い町で、旧歌津町とともにリアス海岸の漁業の町として歩んできた
    kind: fact
    level: E2
    status: established
    sources:
    - z8-minamisanriku-town
    - z8-minamisanriku-pref
  column:
    title: 名前が先に決まった町
    text: 「南三陸」という名は、町ができる1年9か月前に決まっていた。2003年11月の公募には670件の応募があり、翌2004年1月、新町名は「南三陸町」に決まった。ところが合併そのものは難航し、歌津町議会の否決をはさんで発足は2005年10月にずれ込んだ。三陸の南の玄関を名乗る新しい町の名は、自治体の誕生を待ちながら先に生まれていたのである。
