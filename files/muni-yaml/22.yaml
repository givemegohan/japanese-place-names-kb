  prefecture: 静岡県
  homonyms: []
  summary: 市名は古くからの地名「あたみ」を受け継いだもので、古くは直美・阿多美・安多美などの当て字が使われ、「熱海」の表記が確認できる最古の資料は永仁5年（1297）の文書とされる。語源は明らかではなく、海中の温泉で海水が熱くなったという「あつうみ」説は市公式が伝える説明である。昭和12年（1937）に熱海町と多賀村が合併して熱海市が発足した。
  first_attestation:
    era: 永仁5年
    year_western: 1297
    document: 北条貞時の走湯山宛文書
    note: 「熱海」の表記が確認できる最古の資料と『熱海温泉誌』が紹介するもの。地名「あたみ」自体は『和名類聚抄』の「直美郷」や『吾妻鏡』建保元年（1213）の「阿多美郷」など、より古い当て字で現れる
  claims:
  - text: 10世紀の辞書『和名類聚抄』には「直美郷」とあり、古くは直美・阿多美・安多美などの漢字が「あたみ」に用いられたと熱海ロマン紀行は紹介する
    kind: fact
    level: E4
    status: established
    sources:
    - k3-atami-roman
  - text: 『曾我物語』には建久4年（1193）の「伊豆安多美湯」が見え、『吾妻鏡』には建保元年（1213）に北条泰時が「伊豆国阿多美郷」の地頭職を走湯権現に寄進したとあると熱海ロマン紀行は紹介する
    kind: fact
    level: E4
    status: established
    sources:
    - k3-atami-roman
  - text: 「熱海」の表記が確認できる最古の資料は永仁5年（1297）のもので、鎌倉幕府の執権・北条貞時が走湯山に宛てた文書に「熱海郷」と記されていると『熱海温泉誌』に基づき熱海ロマン紀行は紹介する
    kind: fact
    level: E4
    status: established
    sources:
    - k3-atami-roman
  - text: 熱海市公式は、海中から温泉が沸き上がって海水がことごとく熱湯のようになったため「あつうみが崎」と呼ばれ、それが変じて「あたみ」になったと言われていると説明するが、「あたみ」の語源は明らかではないと熱海ロマン紀行は述べており、語源は確定していない
    kind: fact
    level: E2
    status: contested
    sources:
    - k3-atami-city-yurai
    - k3-atami-roman
  - text: 奈良時代、箱根の万巻上人が、海中に沸く熱湯で魚が死ぬのを哀れんだ漁民の訴えを聞き、祈願によって泉脈を海中から山里へ移したと伝えられ、その源泉が現在の大湯、その社が湯前神社（湯前権現）とされる
    kind: legend
    level: E2
    status: established
    sources:
    - k3-atami-city-yurai
  - text: 明治22年（1889）に熱海村が発足して明治24年（1891）に熱海町となり、昭和12年（1937）4月10日に多賀村と合併して熱海市が発足した
    kind: fact
    level: E5
    status: established
    sources:
    - k3-atami-wikipedia
  - text: 総務省の全国地方公共団体コードで、熱海市の団体コードは222054と定められている
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 三つの当て字を経て「熱海」へ
    text: 「あたみ」という音は古くからありましたが、漢字はずっと定まっていませんでした。『和名類聚抄』では「直美」、鎌倉時代の記録では「阿多美」「安多美」と書かれ、いずれも音を借りた当て字です。いまの「熱海」の字が文書に現れるのは1297年のことで、温泉のまちにふさわしい「熱い海」という意味の字が、ようやく音に追いついた形です。市の公式説明にある「あつうみが崎」の話は、この当て字の成立を後から説明したものとも読めます。音が先、意味のある字は後、という順序は日本の地名では珍しくありませんが、熱海はその過程が文書でたどれる例です。
    sources:
    - k3-atami-roman
    - k3-atami-city-yurai
  relations:
  - pref/22
  unknowns:
  - 「あたみ」の語源は、確認できた資料のいずれでも明らかではないとされており、確定していない
  - 阿多美郷の正確な範囲（現在の市域との対応）は本バッチでは確認できていない
  - 万巻上人の開湯伝説に対応する奈良時代の記録は確認できていない
  updated: '2026-11-13'
- id: muni/22-牧之原市
  code: '222267'
  names:
    ja: 牧之原市
    reading: まきのはらし
    aliases: []
  user_terms:
  - まきのはら
  - 牧之原茶のまち
  - 相良と榛原の合併市
  - 静岡空港のある市
  naming_type: 合併新設
  prefecture: 静岡県
  homonyms: []
  summary: 2005年10月11日に榛原郡の相良町と榛原町が合併して誕生した市で、市名は両町にまたがる牧之原台地の名から採られた。合併協議では新市名に既存の市町村名を使わないことが原則とされ、住民アンケートを経て、東名高速道路のインターチェンジ名としても知られる「牧之原」が選ばれた。台地の名は、もと「諏訪原」と呼ばれた一帯を、戦国末期に徳川家康が「牧野ヶ原」と改めたことに始まると県の資料は伝える。
  first_attestation:
    era: 明治4年
    year_western: 1871
    document: 地籍簿（静岡県公式資料が紹介する改称の経緯）
    note: 台地名「牧野ヶ原」が「牧之原」の表記に改められた時期。市名としての「牧之原」は2005年の合併で採用された。
  claims:
  - text: 牧之原市は平成17年（2005年）10月11日、榛原郡相良町と榛原町との対等合併（新設合併）により誕生した。
    kind: fact
    level: E2
    status: established
    sources:
    - v5-makinohara-env
    - v5-makinohara-gappei
  - text: 合併協議では、新市の名称は既存の市町村名としないことが決められていた。
    kind: fact
    level: E2
    status: established
    sources:
    - v5-makinohara-gappei
  - text: 新市名は住民アンケート調査の結果を踏まえて合併協議会の小委員会が5点を選定し、協議会で最も得票数の多かった「牧之原」に決まった。
    kind: fact
    level: E2
    status: established
    sources:
    - v5-makinohara-gappei
  - text: 「牧之原」が選ばれた理由として、東名高速道路のインターチェンジ・サービスエリアの名称が牧之原で全国的に茶で有名なこと、2町とも牧之原台地を茶所として発展し生葉収穫量・荒茶生産量が全国一となったことが挙げられた。
    kind: fact
    level: E2
    status: established
    sources:
    - v5-makinohara-gappei
  - text: 静岡県の公式資料は、牧之原台地はもともと諏訪原と呼ばれていたが、武田信玄の命で築かれた諏訪原城が天正3年（1575年）に徳川家康により落城した際、家康がこの一帯を牧野ヶ原と改めたと紹介している。
    kind: fact
    level: E2
    status: established
    sources:
    - v5-shizuoka-makinohara
  - text: 静岡県の公式資料は、「牧之原」の表記は明治4年（1871年）頃に地籍簿を作る際に改称されたものと紹介している。
    kind: fact
    level: E2
    status: established
    sources:
    - v5-shizuoka-makinohara
  - text: 明治2年（1869年）、徳川慶喜に随行して静岡に移った旧幕臣の新番組が中條金之助影昭らに率いられて牧之原に入植し、勝海舟の勧めもあって台地の開拓に従事し、茶園として開拓されていった。
    kind: fact
    level: E2
    status: established
    sources:
    - v5-shizuoka-makinohara
  - text: 牧之原市の地方公共団体コードは222267である。
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 茶の収穫期を避けて決めた合併日
    text: 牧之原市の誕生日は2005年10月11日だが、この日付けには土地らしい事情があった。合併協議の記録によれば、合併の期日は基幹作物である茶の収穫時期を除き、引っ越し等を考えて連休を挟む日に決められたという。市名のほうも、相良・榛原のどちらの町名でもなく、両町が共有する台地の名が選ばれた。「牧之原」はもともと諏訪原と呼ばれた原野を家康が牧野ヶ原と改めた名に始まり、明治には旧幕臣たちが剣を鍬に持ち替えて茶園に変えた土地の名である。自治体の名が、役所の所在地ではなく土地そのものの履歴から採られた例といえる。
    sources:
    - v5-makinohara-gappei
    - v5-shizuoka-makinohara
  relations:
  - pref/22
  unknowns:
  - 諏訪原城落城時に家康が「牧野ヶ原」と改めたことを示す一次史料は、本調査では直接確認できなかった（静岡県公式資料の紹介による）。
  - 「諏訪原」以前のこの一帯の呼称や、牧野ヶ原が放牧地として実際に使われた実態は確認できなかった。
  updated: '2026-11-13'
- id: muni/22-磐田市
  code: '222119'
  names:
    ja: 磐田市
    reading: いわたし
    aliases:
    - 磐田町
    - 見付町
    - 見付宿
  user_terms:
  - 磐田市の名前の由来
  - 見付のまち
  - 遠江国府のあった市
  - ジュビロ磐田のまち
  naming_type: その他（郡名の継承）
  prefecture: 静岡県
  homonyms: []
  summary: 市名は、古代以来の郡名「磐田郡」に由来する。中心地の見付は遠江国の国府・国分寺が置かれた古い政治の中心で、江戸時代は東海道の見付宿として栄えたが、自治体名としては見付町・中泉町などの合併が進んだ昭和15年（1940年）に、郡名を採った磐田町が誕生し、昭和23年（1948年）に市制を施行して磐田市となった。平成17年（2005年）には福田町・竜洋町・豊田町・豊岡村と合併して現在の市域となった。
  first_attestation:
    era: 古代
    year_western: null
    document: 遠江国磐田郡
    note: 磐田郡は古代以来の郡名だが、本バッチでは『和名類聚抄』等の郡名表記の原文を確認できなかった。郡名「磐田」自体の語源も確定した説を確認できていない
  claims:
  - text: 昭和15年（1940年）11月1日、見付町・中泉町・西貝村・天竜村が合併して、郡名に由来する磐田町が発足した
    kind: fact
    level: E5
    status: established
    sources:
    - n4-iwata-gun-wiki
  - text: 昭和23年（1948年）4月1日に磐田町が市制を施行して磐田市となった
    kind: fact
    level: E5
    status: established
    sources:
    - n4-iwata-gun-wiki
  - text: 平成17年（2005年）4月1日、旧磐田市・福田町・竜洋町・豊田町・豊岡村が合併して、現在の磐田市が発足した
    kind: fact
    level: E5
    status: established
    sources:
    - n4-iwata-city-wiki
  - text: 中心地の見付は、平安時代中頃には遠江国の役所である国府が置かれ、鎌倉時代には守護の館である守護所も置かれた、遠江国の政治・経済の中心地であったと磐田市教育委員会は紹介している
    kind: fact
    level: E2
    status: established
    sources:
    - n4-iwata-bunkazai
  - text: 見付は江戸時代に東海道五十三次の28番目の宿場（見付宿）として栄えた
    kind: fact
    level: E2
    status: established
    sources:
    - n4-iwata-bunkazai
  - text: 磐田郡は古代からの郡だが、近世には東海道見附宿のみで構成される小さな郡となっていた
    kind: fact
    level: E5
    status: established
    sources:
    - n4-iwata-gun-wiki
  - text: 磐田市の地方公共団体コードは222119である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 見付天神と猿神退治の伝説
    text: 磐田の中心・見付には、国府の記憶とは別の顔がある。見付天神（矢奈比売神社）の裸祭りの由来には、かつて人身御供を求めた猿神を、旅の法師と犬が退治したという「猿神退治」の伝承が結びついている。この型の話は各地に分布するが、見付では祭りの起源譚として今も語られ、祭り自体は国の重要無形民俗文化財に指定されている。郡名をもらった近代的な市名の内側に、国府の都と宿場町と、御供の伝説が層をなして眠っている。
    sources:
    - n4-iwata-city-wiki
  relations:
  - pref/22
  - muni/22-浜松市
  - muni/22-掛川市
  unknowns:
  - 郡名「磐田」の語源（岩の多い田などの地形説を含め）は、本バッチでは専門辞典で確認できなかった
  - 磐田郡の『和名類聚抄』など古代文献における表記と読みは、本バッチでは原文を確認できなかった
  - 1940年の合併で新町名に郡名「磐田」を選んだ経緯の一次資料は確認できなかった
  updated: '2026-11-13'
- id: muni/22-菊川市
  code: '222241'
  names:
    ja: 菊川市
    reading: きくがわし
    aliases: []
  user_terms:
  - きくがわ
  - 深蒸し茶のまち
  - お茶のまち菊川
  - 菊川茶の産地
  naming_type: 合併新設
  prefecture: 静岡県
  homonyms: []
  summary: 2005年1月17日に小笠郡の菊川町と小笠町が合併して誕生した市で、市名は旧菊川町の名を引き継いだ。菊川町は1954年に堀之内町などが合併して生まれた町で、その名は市内を縦断する一級河川「菊川」に由来すると市は説明している。川の名の語源は、荘園の放牧地を流れる「城飼川」が転じたとする説などが伝えられるが定説はない。
  first_attestation:
    era: 昭和29年
    year_western: 1954
    document: 菊川町の発足（堀之内町・六郷村・横地村・加茂村・内田村の合併）
    note: 自治体名としての「菊川」の初出。河川名「菊川」自体の文献上の初出は確認できなかった。
  claims:
  - text: 菊川市は平成17年（2005年）1月17日、小笠郡菊川町と小笠町が合併して誕生した。
    kind: fact
    level: E2
    status: established
    sources:
    - v5-kikugawa-city-enkaku
    - v5-kikugawa-city-data
  - text: 旧菊川町は昭和29年（1954年）に堀之内町・六郷村・横地村・加茂村・内田村の1町4村が合併して誕生し、昭和30年（1955年）に河城村を編入した。
    kind: fact
    level: E2
    status: established
    sources:
    - v5-kikugawa-city-enkaku
  - text: 菊川市は公式資料で、市の花「菊」は「市内を縦断し市の名の由来となった河川『菊川』の頭文字」であると説明しており、市名の由来を河川の菊川に求めている。
    kind: fact
    level: E2
    status: established
    sources:
    - v5-kikugawa-city-data
  - text: 菊川は粟ヶ岳周辺に源を発し、菊川市の中心部を縦断して遠州灘に注ぐ一級河川で、昭和42年（1967年）に一級河川に指定された。
    kind: fact
    level: E5
    status: established
    sources:
    - v5-kikugawa-river-wiki
  - text: 河川名「菊川」の語源については、周辺一帯が古くは荘園で放牧が行われていたことから、柵で囲まれた放牧地（城飼）を流れる川という意味の「城飼川（きこうがわ）」が転じて菊川となったとする説が有力とされている。
    kind: fact
    level: E5
    status: contested
    sources:
    - v5-kikugawa-river-wiki
  - text: 菊川の名についてはほかに、上流の小夜の中山にある「菊石」あるいは旧菊川町友田にある「菊目石」から付けられたという説や、高天神城の東を流れる川であることから「城東川（きとうがわ）」が転じたとする説がある。
    kind: fact
    level: E5
    status: contested
    sources:
    - v5-kikugawa-river-wiki
  - text: 菊川市は深蒸し茶発生の地とされ、市の木にも特産の「茶」が選ばれている。
    kind: fact
    level: E2
    status: established
    sources:
    - v5-kikugawa-city-data
  - text: 菊川市の地方公共団体コードは222241である。
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 菊の花は、川の名前の頭文字だった
    text: 菊川市の市の花は「菊」だが、その理由は名前に花のイメージを重ねたからではない。市の公式資料は、市の花の菊は「市の名の由来となった河川『菊川』の頭文字」だと説明する。つまり順序は逆で、先に川の名「菊川」があり、市名も花の指定もそこから来ている。そして川の名の有力な語源とされるのは花とは無関係の「城飼川」で、荘園の放牧地を流れる川という意味だという。花の清楚なイメージは後から重なったもので、地名の中身は牧畜の風景だった可能性がある。
    sources:
    - v5-kikugawa-city-data
    - v5-kikugawa-river-wiki
  relations:
  - pref/22
  unknowns:
  - 2005年の合併で新市名「菊川」が選ばれた手続き（公募の有無や候補名）は、合併協議会の公開資料では確認できなかった。
  - 河川名「菊川」の文献上の初出と語源の定説は、専門辞典では確認できなかった（諸説はWikipediaの河川記事による）。
  updated: '2026-11-13'
- id: muni/22-藤枝市
  code: '222143'
  names:
    ja: 藤枝市
    reading: ふじえだし
    aliases:
    - 藤枝町
    - 藤枝宿
  user_terms:
  - 藤枝市の名前の由来
  - 藤の花のまち
  - 田中藩の城下町
  - サッカーのまち藤枝
  naming_type: その他（宿場町以来の地名の継承）
  prefecture: 静岡県
  homonyms: []
  summary: 市名は、東海道の宿場町・田中藩の城下町として栄えた中心地「藤枝」を受け継ぐ。由来には、若一王子神社の社伝に伝わる源義家の歌の故事と、藤の枝のように細長い宿場町だったからとする説がある。慶長6年（1601年）に藤枝宿が置かれ、明治22年（1889年）に藤枝町が発足、昭和29年（1954年）に周辺町村と合併して藤枝市となった。
  first_attestation:
    era: 江戸時代
    year_western: 1601
    document: 東海道藤枝宿の設置
    note: 宿場としての「藤枝」の確実な用例として。地名自体は社伝では平安時代末の源義家の故事に結びつけられるが、文書上の初出は本バッチでは特定できなかった
  claims:
  - text: 若一王子神社の社伝によれば、後三年の役（1083年から1087年）で奥州へ下る源義家が神社に立ち寄り、裏山の古い松に絡まる藤の花を見て「松に花咲く藤枝の」と歌を詠んだことから「藤枝」の名が生まれたと伝えられる
    kind: legend
    level: E5
    status: established
    sources:
    - n4-fujieda-city-wiki
  - text: 由来のもう一つの説として、藤の枝のように細長い宿場町だったから「藤枝」と呼ばれるようになったとする説がある
    kind: legend
    level: E5
    status: contested
    sources:
    - n4-fujieda-city-wiki
  - text: 慶長6年（1601年）に東海道の宿場町として藤枝宿が置かれ、田中城の拡張とともに田中藩の城下町としても発展した
    kind: fact
    level: E5
    status: established
    sources:
    - n4-fujieda-city-wiki
  - text: 藤枝は安倍川と大井川に挟まれた志太平野のまちで、江戸時代には藤枝宿と岡部宿の二つの宿場を抱えていた
    kind: fact
    level: E5
    status: established
    sources:
    - n4-fujieda-city-wiki
  - text: 明治22年（1889年）に町制を施行して藤枝町となった
    kind: fact
    level: E5
    status: established
    sources:
    - n4-fujieda-city-wiki
  - text: 昭和29年（1954年）3月31日、藤枝町・青島町・稲葉村・大洲村・高洲村などが合併して藤枝市が発足した
    kind: fact
    level: E5
    status: established
    sources:
    - n4-fujieda-city-wiki
  - text: 藤枝市の地方公共団体コードは222143である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 義家の歌と、細長い宿場町
    text: 藤枝の由来は二つの物語が並び立つ。ひとつは雅な物語で、奥州へ向かう源義家が若一王子神社で松に絡む藤の花を見て歌を詠んだという社伝。もうひとつは素朴な物語で、街道に沿って細長く伸びる宿場町の姿が藤の枝に似ていたからという。どちらが先かは決めがたいが、市の花は今も藤であり、歌の舞台とされる神社の境内には藤棚がある。伝説と地形、二つの説明が競い合いながら残ること自体が、古い宿場町の地名らしさである。
    sources:
    - n4-fujieda-city-wiki
  relations:
  - pref/22
  - muni/22-焼津市
  - muni/22-島田市
  - muni/22-静岡市
  unknowns:
  - 「藤枝」の文書上の初出（中世の荘園・郷名としての用例）は本バッチでは特定できなかった
  - 由来2説はいずれもWikipedia経由の確認にとどまり、藤枝市公式の市名由来ページは直接確認できなかった
  updated: '2026-11-13'
- id: muni/22-袋井市
  code: '222160'
  names:
    ja: 袋井市
    reading: ふくろいし
    aliases:
    - 山名町
    - 袋井宿
  user_terms:
  - ふくろい
  - 東海道どまん中の宿場町
  - エコパのある市
  - フッピー
  naming_type: 一部の地名
  prefecture: 静岡県
  homonyms: []
  summary: 東海道五十三次の宿場町・袋井宿を中心に発展した市で、現在の市は2005年に旧袋井市と浅羽町が合併して発足した。市名の由来について市は、市内を流れる3つの川に囲まれた「袋」のような地形に由来すると説明している。袋井宿は江戸からも京からも27番目で「どまん中の宿」として知られる。
  first_attestation:
    era: 元和2年
    year_western: 1616
    document: 袋井宿の開設
    note: 宿場名としての確認できる節目。地名自体はそれ以前からあり、市の公式ハンドブックは鎌倉時代の和歌集に「袋井」が詠まれていることに触れるが、具体的な初出文献は確認できなかった。
  claims:
  - text: 現在の袋井市は、平成17年（2005年）4月1日に旧袋井市と磐田郡浅羽町が合併して発足した。
    kind: fact
    level: E5
    status: established
    sources:
    - v5-fukuroi-wiki
  - text: 旧袋井市は昭和33年（1958年）11月3日に市制を施行したもので、その前身は明治22年（1889年）に袋井宿ほかの区域をもって発足した山名郡山名町であり、明治42年（1909年）に袋井町へ改称した。
    kind: fact
    level: E5
    status: established
    sources:
    - v5-fukuroi-wiki
  - text: 袋井市の公式説明では、地名の由来は、市内を流れる原野谷川・宇刈川・沖之川に囲まれた「袋」のような地形にあるという。
    kind: fact
    level: E2
    status: established
    sources:
    - v5-fukuroi-city-handbook
  - text: 袋井宿は元和2年（1616年）に開設され、東海道五十三次の中で東から数えても西から数えてもちょうど27番目の宿場であった。
    kind: fact
    level: E2
    status: established
    sources:
    - v5-fukuroi-city-koho
  - text: 袋井市の公式ハンドブックは、市の鳥フクロウの説明の中で、鎌倉時代の和歌集の中でも「袋井」に掛けて詠まれているなど歴史的な関わりが深いことに触れており、「袋井」の名が中世には歌の題材になるほど知られていたことがうかがえる。
    kind: fact
    level: E2
    status: established
    sources:
    - v5-fukuroi-city-handbook
  - text: 袋井市の地方公共団体コードは222160である。
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 東からも西からも27番目、「どまん中」の宿
    text: 東海道五十三次には全部で53の宿場がある。その真ん中、江戸から数えても京から数えても27番目にあたるのが袋井宿で、1616年の開設から400年を超えた。袋井市はこの「どまん中」をまちの看板にしており、宿場公園には「どまん中茶屋」が立つ。ちなみに中山道にも「どまん中の宿」を持つまちがあり、旧袋井市は旧楢川村（現在は長野県塩尻市の一部）とその縁で交流を始め、合併後の袋井市と塩尻市は姉妹都市となっている。街道の真ん中同士が結んだ縁である。
    sources:
    - v5-fukuroi-city-koho
    - v5-fukuroi-city-handbook
  relations:
  - pref/22
  unknowns:
  - 「袋井」の「井」の字の由来（井戸や湧水にちなむという説明）は、市の公式資料では確認できなかった。市の説明は「袋のような地形」までにとどまる。
  - 「袋井」の地名の文献上の初出（中世の和歌集の具体的な書名・歌）は確認できなかった。
  updated: '2026-11-13'
- id: muni/22-裾野市
  code: '222208'
  names:
    ja: 裾野市
    reading: すそのし
    aliases:
    - 裾野町
  user_terms:
  - すその
  - 富士山の裾野のまち
  - 裾野駅のある市
  naming_type: その他
  prefecture: 静岡県
  homonyms: []
  summary: 富士山の南東麓、「裾野」と呼ばれる緩やかな山麓斜面に広がる市で、市名はこの地形の普通名詞そのものに由来する。1952年に小泉村と泉村が合併して裾野町が生まれ、深良・富岡・須山の各村を編入して1971年に市制を施行した。駅名は町ができる前の1915年に佐野駅から裾野駅へ改称されており、「裾野」の名が先に地域名として定着していた。
  first_attestation:
    era: 大正4年
    year_western: 1915
    document: 佐野駅の裾野駅への改称（市の公式年表）
    note: 駅名としての確認できる節目。「裾野」は山麓を指す普通名詞でもあるため、地名としての文献上の初出の特定は困難で、確認できなかった。
  claims:
  - text: 裾野市は静岡県東部に位置し、市は自らを「麗峰富士の裾野に広がり」と位置づけており、市名は富士山の裾野という地形の名に由来する。
    kind: fact
    level: E2
    status: established
    sources:
    - v5-susono-city-kyoiku
  - text: 裾野市の市章は、スソノの「ス」を5つ組み合わせたもので、「富士の裾野の旧5か村」が固く団結することを表すと説明されている。
    kind: fact
    level: E2
    status: established
    sources:
    - v5-susono-city-kyoiku
  - text: 裾野町は昭和27年（1952年）4月1日に小泉村と泉村が合併して誕生し、昭和31年（1956年）に深良村、昭和32年（1957年）に富岡村と須山村を編入・合併した。
    kind: fact
    level: E2
    status: established
    sources:
    - v5-susono-city-kyoiku
    - v5-susono-city-nenpyo
  - text: 裾野町は昭和46年（1971年）1月1日に市制を施行し、裾野市となった（県下20番目の市）。
    kind: fact
    level: E2
    status: established
    sources:
    - v5-susono-city-kyoiku
  - text: 東海道本線の佐野駅は大正4年（1915年）に裾野駅と改称されており、「裾野」の名称は裾野町の成立（1952年）より前から地域の名として使われていた。
    kind: fact
    level: E2
    status: established
    sources:
    - v5-susono-city-nenpyo
    - v5-susono-city-kyoiku
  - text: 裾野市の地方公共団体コードは222208である。
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 駅の名前のほうが37年先だった
    text: 普通、市や町の名前が決まってから駅名がそれに倣う。裾野では順序が逆で、東海道本線の駅が「裾野駅」になったのは1915年、裾野町が誕生したのは1952年のことである。富士山の裾野という呼び名は、自治体の名になるずっと前から、この土地を指す言葉として人々に使われていたのだろう。1952年の合併で新しい町名が必要になったとき、人々が選んだのは、すでに駅名として行き交う人々に親しまれていた地形の名だった。
    sources:
    - v5-susono-city-nenpyo
    - v5-susono-city-kyoiku
  relations:
  - pref/22
  unknowns:
  - 「裾野」がこの地域を指す地名として文献に現れる初出は確認できなかった（普通名詞と地名の区別がつきにくい）。
  - 1952年の合併で新町名「裾野」が選ばれた手続き（公募の有無など）は、市の公開資料では確認できなかった。
  updated: '2026-11-13'
- id: muni/22-静岡市
  code: '221007'
  names:
    ja: 静岡市
    reading: しずおかし
    aliases:
    - 静岡
    - 駿府
    - 府中
  user_terms:
  - 静岡市の名前の由来
  - 静岡市はなぜ静岡というのか
  - 駿府から静岡への改名
  - 静岡市と清水市の合併
  naming_type: 合併新設
  prefecture: 静岡県
  homonyms: []
  summary: 現在の静岡市は、平成15年（2003）に旧静岡市と清水市の新設合併で発足した自治体だが、市名自体は明治2年（1869）に生まれた「静岡」の継承である。もとの「府中（駿府）」は各地にある紛らわしい名だとして政府から改名を求められ、藩内から上申した「静」「静城」「静岡」の3案の中から「静岡」が選ばれた。
  first_attestation:
    era: 明治2年
    year_western: 1869
    document: 静岡藩への改称（藩知事任命時）
    note: 命名そのものの初出。明治2年6月の徳川家達の藩知事任命の際に「静岡」が初めて使用されたと県公式は説明する（県レコードと同一の記録）
  claims:
  - text: 駿府は「駿河府中」の略であり、律令期以来の国府所在地を指す、特定の土地固有ではない普通名詞的な名称だった
    kind: fact
    level: E2
    status: established
    sources:
    - c-shizuoka-ken
  - text: 明治2年（1869）、新政府は「府中」という名称は紛らわしいとして、駿府藩（府中藩）に対して地名の変更を求めた
    kind: fact
    level: E2
    status: established
    sources:
    - c-shizuoka-ken
    - c-shizuoka-lib
  - text: 藩内で検討して「静」「静城」「静岡」の3案を考案して政府に報告し、そのうち「静岡」が採用されて、同年6月の藩知事任命の際に初めて使用された
    kind: fact
    level: E2
    status: established
    sources:
    - c-shizuoka-ken
    - c-shizuoka-lib
  - text: 「シズオカ」の「シズ」は、駿府の北西にある賤機山（しずはたやま）に由来すると言われているが、同時代の命名記録で直接確認されたものではない
    kind: fact
    level: E2
    status: contested
    sources:
    - c-shizuoka-ken
  - text: いったん「賤ヶ丘」と決まった名を、藩校頭取の向山黄村が「賤」の字を嫌って「静」に改めるよう進言したとする逸話が伝わるが、その史料的裏付けは確認されていない
    kind: legend
    level: E4
    status: contested
    sources:
    - c-shizuoka-weblio
  - text: 明治22年（1889）に市制を施行して静岡市が発足し、周辺の町村を編入しながら市域を広げてきた
    kind: fact
    level: E2
    status: established
    sources:
    - c-cap-shizuoka-city
  - text: 平成15年（2003）4月1日、旧静岡市と清水市が合併して新しい静岡市が発足した
    kind: fact
    level: E2
    status: established
    sources:
    - c-cap-shizuoka-city
  - text: 平成17年（2005）4月1日、静岡市は政令指定都市に移行した
    kind: fact
    level: E4
    status: established
    sources:
    - c-cap-shizuoka-uub
  - text: 総務省の全国地方公共団体コードで、静岡市の団体コードは221007と定められている
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 城下町と港町、二つの中心が一つの市に
    text: 静岡市には、生まれの違う二つの中心があります。一つは駿府城の城下町だった旧静岡市。もう一つは、明治32年（1899）に開港場となった清水港を擁する旧清水市です。2003年、この二つが合併して新しい静岡市が生まれ、2005年には政令指定都市になりました。市名に残ったのは城下町側の「静岡」で、清水の名は区名（清水区）と港の名に残っています。1869年に「府中」から改名して生まれた若い地名が、130年余りを経て、港町まで含む大きな市の名前になったのです。
    sources:
    - c-cap-shizuoka-city
    - c-cap-shizuoka-uub
  relations:
  - pref/22
  unknowns:
  - 「シズ＝賤機山」説を裏付ける同時代の命名経緯記録は確認できていない（県レコードと同一の未確認事項）
  - 向山黄村の進言説については、向山自身の史料や伝記・墓誌にも言及がないと指摘されており、裏付けは未確認
  - 政令指定都市への移行（2005）の経緯について、市公式の沿革ページでの直接確認は未了
  updated: '2026-11-13'
