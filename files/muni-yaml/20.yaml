    sources:
    - x1-matsukawamachi-donnatoko
  - text: 町章は「マ」「ツ」「川」の文字と平和のシンボルである鳩を図案化したものと町公式の総合計画が説明し、川の名を採った町名がシンボルにも刻まれている
    kind: fact
    level: E2
    status: established
    sources:
    - x1-matsukawamachi-plan
  - text: 地方公共団体コードは204021である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 郡をまたいで生まれた町と、一本の川
    text: 1956年の松川町の発足は、下伊那郡の大島村と上伊那郡の上片桐村という、郡の違う2村の合併だった。新しい町の名に選ばれたのは、どちらの村の名でもなく、中央アルプスから流れて両村の地を潤す片桐松川の名である。川の名を共有の看板に掲げることで、郡の境を越えた合併に一つのまとまりを与えた命名といえる。同じ長野県の北安曇郡松川村（1874年以来の古い村名）とは別の自治体である。松川町公式「第5次松川町総合計画」に基づく。
    sources:
    - x1-matsukawamachi-plan
  relations:
  - pref/20
  - muni/20-松川村
  unknowns:
  - 河川名「片桐松川」の名自体の由来（「片桐」の語源）は確認できていない
  - 合併協議で町名を河川名に決めた過程の記録は確認できていない
  updated: '2026-11-13'
- id: muni/20-松本市
  code: '202029'
  names:
    ja: 松本市
    reading: まつもとし
    aliases:
    - 深志
    - 府中
    - 松本町
  user_terms:
  - 松本市の名前の由来
  - 深志から松本への改称
  - 松本城の名前の由来
  naming_type: その他（城の改称に由来する名の継承）
  prefecture: 長野県
  homonyms: []
  summary: 市名は城下町「松本」の継承で、その松本は天正10年（1582）に小笠原貞慶が深志城を松本城と改めたことに始まると松本市は説明する。この地は古くは深志と呼ばれ、国府が置かれてからは府中とも呼ばれた。貞慶がなぜ「松本」の名を選んだのかは同時代の記録では確認できていない。明治40年（1907）に市制を施行した。
  first_attestation:
    era: 天正10年
    year_western: 1582
    document: 小笠原貞慶による深志城の松本城への改称（松本市公式「松本城の歴史」）
    note: 「松本」の公称としての初出は1582年の城の改称。これ以前に地名としての用例があったかは確認できていない
  claims:
  - text: 松本の地は古くは深志と呼ばれ、平安時代初期に上田から国府が移されてからは府中とも呼ばれていた
    kind: fact
    level: E2
    status: established
    sources:
    - k3-matsumoto-shiseki
  - text: 深志城は永正元年（1504）に小笠原氏の一族・島立貞永により平城として構築され、天文19年（1550）以降は武田氏の信濃支配の拠点となった
    kind: fact
    level: E2
    status: established
    sources:
    - k3-matsumoto-shiseki
  - text: 天正10年（1582年）、武田氏の滅亡後に小笠原貞慶が深志城を回復して名を松本城と改め、これ以降、松本の地名が用いられるようになった
    kind: fact
    level: E2
    status: established
    sources:
    - k3-matsumoto-fuchi
    - k3-matsumoto-castle
  - text: 貞慶が「松本」という名を選んだ理由について、松本市公式の資料は説明しておらず、「松本」の語源は確定していない
    kind: fact
    level: E2
    status: indeterminate
    sources:
    - k3-matsumoto-castle
    - k3-matsumoto-shiseki
  - text: 明治40年（1907）5月1日に市制を施行して松本市が誕生した
    kind: fact
    level: E2
    status: established
    sources:
    - k3-matsumoto-fuchi
  - text: 平成17年（2005）と平成22年（2010）の合併を経て、現在の松本市の市域となった
    kind: fact
    level: E2
    status: established
    sources:
    - k3-matsumoto-fuchi
  - text: 総務省の全国地方公共団体コードで、松本市の団体コードは202029と定められている
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 名前を付けた人は、天守を見ていない
    text: 1582年に城を「松本」と名付けた小笠原貞慶は、父の代に武田氏に追われた旧領を取り返したばかりでした。深志という旧名を捨てて新しい名を掲げることは、支配の再出発の宣言でもあったはずです。ところが貞慶は1590年に移封され、いま私たちが見ている国宝の天守を実際に築いたのは、次の城主・石川康長の代（1593年から）です。名前を付けた人は天守を見ず、天守を建てた人は名前を変えなかった。その後400年以上、「松本」の名だけが城とまちの顔として残りました。
    sources:
    - k3-matsumoto-castle
    - k3-matsumoto-fuchi
  relations:
  - pref/20
  unknowns:
  - 貞慶が「松本」の名を選んだ理由を示す同時代史料は確認できていない
  - 1582年の改称以前に「松本」という地名の用例があったかは未確認
  - 「深志」の語源については本バッチでは確認できていない
  updated: '2026-11-13'
- id: muni/20-栄村
  code: '206024'
  names:
    ja: 栄村
    reading: さかえむら
    aliases: []
  user_terms:
  - 長野県の最北端の村
  - 下水内郡の村
  - 秋山郷のある村
  - 豪雪の村
  naming_type: 合併新設
  prefecture: 長野県
  homonyms: []
  summary: 長野県下水内郡の村で、県の最北端に位置する豪雪地。1956年（昭和31年）9月30日に下水内郡水内村と下高井郡堺村が合併して発足した、郡をまたぐ合併による村。村域の南には平家の落人伝説で知られる秋山郷が広がる。「栄」という村名の命名理由は、村公式資料でも確認できていない。
  first_attestation:
    era: 昭和31年
    year_western: 1956
    document: null
    note: 村名「栄」は1956年の合併に伴う命名そのものが初出。前身の水内村を構成した村の一つに「豊栄村」があったが、その名の一部を採ったかどうかは未確認。
  claims:
  - text: 現在の栄村は昭和31年（1956年）9月に下高井郡堺村と下水内郡水内村が合併して生まれた村であり、合併当時の人口は堺村5,641人・水内村2,331人であったと、栄村公式の村勢要覧が記す（発足日は1956年9月30日）
    kind: fact
    level: E2
    status: established
    sources:
    - x1-sakae-yoran
    - x1-sakae-wiki
  - text: 1889年（明治22年）の町村制施行の時点で、現在の村域は堺村と水内村の2村にまとまっており、水内村は豊栄村・北信村・森村などの合併、堺村は志久見村・白鳥村・平滝村・青倉村などの合併で成立したと、村勢要覧の変遷図が示す
    kind: fact
    level: E2
    status: established
    sources:
    - x1-sakae-yoran
  - text: 「栄」という村名の命名理由について、村勢要覧をはじめ村公式資料に説明が見当たらず、本調査では確認できていない
    kind: fact
    level: E2
    status: indeterminate
    sources:
    - x1-sakae-yoran
  - text: 村域南部の秋山郷は、平家の落人が隠れ住んだ地と伝えられる秘境として知られる
    kind: legend
    level: E5
    status: indeterminate
    sources:
    - x1-sakae-wiki
  - text: 栄村は長野県の最北端に位置し、面積の92.8％を山林原野が占める豪雪地帯であると村勢要覧が記す
    kind: fact
    level: E2
    status: established
    sources:
    - x1-sakae-yoran
  - text: 地方公共団体コードは206024である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 理由の残らなかった「栄」
    text: 1956年、栄村は郡の違う堺村と水内村の合併で生まれた。ところが合併の記録を村公式資料でたどっても、「栄」の名を選んだ理由はどこにも書かれていない。前身の一つには「豊栄村」という名もあったが、そこから字を採ったのか、新しい村の「栄え」を願ったのかは、今の資料では決められない。命名理由が残らなかったこと自体が、この村の記録の正直な姿である。栄村公式「2019 村勢要覧」に基づく。
    sources:
    - x1-sakae-yoran
  relations:
  - pref/20
  - muni/20-木島平村
  unknowns:
  - 村名「栄」の命名理由は公的資料で確認できていない（前身の豊栄村からの継承かどうかも含め未確認）
  - 1956年の合併協議における村名決定の経緯は確認できていない
  updated: '2026-11-13'
- id: muni/20-根羽村
  code: '204102'
  names:
    ja: 根羽村
    reading: ねばむら
    aliases: []
  user_terms:
  - 矢作川の源流の村
  - 下伊那郡の最南の村
  - 信玄終焉の伝承の村
  naming_type: 一部の地名
  prefecture: 長野県
  homonyms: []
  summary: 長野県下伊那郡の村で、県の南端に位置する。矢作川の源流域の村であり、1875年（明治8年）に根羽村と月瀬村が合併して現在の村となった。名は旧・根羽村の地名の継承。古代・中世には三河国に属していた歴史を持ち、武田信玄の終焉にまつわる伝承が残る。
  first_attestation:
    era: 明治8年
    year_western: 1875
    document: null
    note: 自治体名「根羽村」は1875年の月瀬村との合併で旧名を継承したもの。「根羽」という地名自体は中世（三河国）以来のものだが、具体的な初出文書は未確認。
  claims:
  - text: 明治8年（1875年）1月12日に根羽村と月瀬村が合併し、現在の根羽村となったと、根羽村役場の村史紹介に基づく資料が伝える。村名は旧・根羽村の名の継承である
    kind: fact
    level: E4
    status: established
    sources:
    - x1-neba-donnatoko
  - text: 古代・中世の根羽・月瀬の両村は三河国に属していたが、元亀2年（1571年）に武田信玄の南下作戦で足助松山城が攻略されると武田領となり、三河国から信濃国へ編入されたと、村役場の村史紹介に基づく資料が伝える
    kind: fact
    level: E4
    status: established
    sources:
    - x1-neba-donnatoko
  - text: 村を流れる矢作川の最上流部は「根羽川」とも呼ばれ、村名と同じ名を冠する川が源流域を流れる
    kind: fact
    level: E5
    status: established
    sources:
    - x1-yahagi-wiki
  - text: 根羽村は矢作川源流の里として、流域約180万人の水源を守る村づくりを進めていると、村役場のSDGs未来都市提案資料（内閣府掲載）が示す
    kind: fact
    level: E2
    status: established
    sources:
    - x1-neba-sdgs
  - text: 村は武田信玄終焉の伝承地の一つとされ、病が重くなった信玄の一行が旗を横にしたことから「横旗」の地名が生まれたと伝えられる。信玄の没地には駒場など諸説がある
    kind: legend
    level: E4
    status: contested
    sources:
    - x1-neba-donnatoko
  - text: 「根羽」という地名の語源そのものは、本調査で確認できた資料には説明がなく、未確認である
    kind: fact
    level: E4
    status: indeterminate
    sources:
    - x1-neba-donnatoko
  - text: 地方公共団体コードは204102である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 三河から信濃へ――国境を越えた村名
    text: 根羽村は今でこそ長野県の村だが、古代・中世は三河国の村だった。1571年に武田信玄の軍が進むと信濃国へ組み入れられ、江戸時代も伊那県・筑摩県を経て長野県に属した。村の名はその国替えを越えて残り、今は矢作川の源流の名として、愛知県側の下流の人々の水源の村を指す言葉になっている。根羽村役場の村史紹介に基づく資料による。
    sources:
    - x1-neba-donnatoko
    - x1-neba-sdgs
  relations:
  - pref/20
  unknowns:
  - 「根羽」の地名の語源・初出文書は確認できていない
  - 中世の根羽村・月瀬村を記した具体的な史料名は確認できていない
  updated: '2026-11-13'
- id: muni/20-池田町
  code: '204811'
  names:
    ja: 池田町
    reading: いけだまち
    aliases:
    - 池田町村
    - 池田郷
  user_terms:
  - 池田町 長野
  - いけだまち
  - 北安曇郡の池田町
  - ハーブの町 池田
  naming_type: 一部の地名
  prefecture: 長野県
  homonyms:
  - muni/01-池田町
  - muni/18-池田町
  - muni/21-池田町
  summary: 長野県北安曇郡の町。中世の池田郷の名を継承し、『親元日記』寛正6年（1465）の記事に「矢原庄池田郷」と見えるのが確認できる早い記録である。江戸時代は松本藩の池田組に属し、明治8年（1875）に池田町村、大正4年（1915）に町制施行で池田町となった。4つの池田町のうち唯一「いけだまち」と読む。
  first_attestation:
    era: 寛正6年
    year_western: 1465
    document: 『親元日記』寛正6年5月18日条（「矢原庄池田郷」）
    note: 日本歴史地名大系が紹介する形で確認した二次確認であり、原典は未読
  claims:
  - text: 池田郷は『親元日記』寛正6年（1465）5月18日の記事に「矢原庄池田郷」と見え、中世の郷名として確認できる
    kind: fact
    level: E3
    status: established
    sources:
    - h2-kotobank-ikedamachi
  - text: 江戸時代を通じて松本藩領の池田組に属し、明治8年（1875）に池田町村となった
    kind: fact
    level: E3
    status: established
    sources:
    - h2-kotobank-ikedamachi
  - text: 大正4年（1915）に町制を施行して池田町となり、昭和30年（1955）に会染村と合併して現在の池田町となった
    kind: fact
    level: E2
    status: established
    sources:
    - h2-ikeda-nagano-gaiyo
  - text: 原初の池田の集落は、東南の「馬の口」と呼ばれる場所の近くにあったと伝えられる
    kind: legend
    level: E3
    status: indeterminate
    sources:
    - h2-kotobank-ikedamachi
  - text: 「池田」という名の語源については、確認した公式・専門資料の範囲では説明が見当たらず、確定できない
    kind: fact
    level: E3
    status: indeterminate
    sources:
    - h2-kotobank-ikedamachi
    - h2-ikeda-nagano-gaiyo
  - text: 同名の比較（異なる層）：中世の郷名の継承であり、荘園名に遡る福井県・岐阜県の池田町、人名に由来する北海道池田町とは成り立ちが異なる
    kind: fact
    level: E3
    status: established
    sources:
    - h2-kotobank-ikedamachi
  - text: 同名の比較（異なる層）：読みは「いけだまち」で、他の3つの池田町（すべて「いけだちょう」）と異なる、4件中で唯一の「まち」読みである
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 1465年の日記に残る、郷の名のままの町
    text: 池田郷の名は、室町時代の日記『親元日記』の1465年の記事にすでにある。荘園の名でも人名でもなく、在地の小さな郷の名が、村・町と姿を変えながら550年以上そのまま使われ続けてきた。しかも全国4つの池田町の中で、ここだけが「ちょう」ではなく「まち」と読む。古い地名ほど静かに残る、という好例である。
    sources:
    - h2-kotobank-ikedamachi
    - b-cap-chiba-soumu-code
  relations:
  - pref/20
  - muni/01-池田町
  - muni/18-池田町
  - muni/21-池田町
  unknowns:
  - 「池田」の語源（池と田の地形名に由来するか等）は、確認した資料の範囲では説明がなく未確認
  - 池田郷の成立時期（1465年より前の記録）は未確認
  updated: '2026-11-13'
- id: muni/20-泰阜村
  code: '204145'
  names:
    ja: 泰阜村
