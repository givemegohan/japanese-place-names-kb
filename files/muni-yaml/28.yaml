    sources:
    - x12-harima-koho-2012
  - text: 新町名「播磨」は旧国名の播磨国にちなむ名とみられるが、改称当時にその選定理由を明示した資料は確認できなかった
    kind: fact
    level: H
    status: inferred
    sources:
    - x12-harima-koho-2012
  - text: 『播磨国風土記』賀古郡条には「阿閇津（あへのつ）」「阿閇村」が記されており、「阿閇」は奈良時代の文献に現れる古い地名である
    kind: fact
    level: E2
    status: established
    sources:
    - x12-harima-fudoki-yaku
    - x12-harima-kakokita
  - text: 『播磨国風土記』は阿閇の名の由来を、大帯日子命（景行天皇）が印南別嬢（いなみのわきのいらつめ）を訪ねる途上、阿閇津で御食をたてまつった故事に求めている。兵庫県立加古川北高校の郷土資料も「阿閇はその時の故事に因んだ地名です」と紹介する
    kind: legend
    level: E2
    status: established
    sources:
    - x12-harima-fudoki-yaku
    - x12-harima-kakokita
  - text: 「阿閇」の語源そのもの（「あへ」の意味）については、風土記の故事以外に確定的な説明を確認できなかった
    kind: fact
    level: E2
    status: indeterminate
    sources:
    - x12-harima-fudoki-yaku
  - text: 播磨町の地方公共団体コードは283827である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 風土記に残る「阿閇」、1962年に消えた難読地名
    text: 「阿閇（あえ）」は、『播磨国風土記』の時代から続く地名だった。景行天皇が印南別嬢に会いに行く物語の舞台で、天皇が食事をとった津（港）が阿閇津、その地が阿閇村と呼ばれたという。ところが1962年、町制施行を機に村は「播磨町」へと改称し、千年以上続いた「阿閇」の名は自治体名としては姿を消した。今も町内には阿閇神社の名などにその名残が残る。
    sources:
    - x12-harima-fudoki-yaku
    - x12-harima-koho-2003
    - x12-harima-koho-2012
  relations:
  - pref/28
  unknowns:
  - 「播磨町」への改称理由を明示した当時の資料（村議会記録・町史等）は未確認
  - 「阿閇」の語源（風土記の故事を離れた言語学的な説明）は未確認
  - 阿閇村発足時（1889年）の構成村の詳細は町史での確認が今後の課題
  updated: '2026-11-13'
- id: muni/28-新温泉町
  code: '285862'
  names:
    ja: 新温泉町
    reading: しんおんせんちょう
    aliases: []
  user_terms:
  - 新温泉
  - しんおんせん
  - 湯村温泉の町
  - 浜坂
  - 温泉町と浜坂町が合併した町
  naming_type: 中心地名の継承
  naming_note: 旧町名「温泉町」に「新」を付けた新町名。当初案から変更されて決まった
  formation: 合併新設
  prefecture: 兵庫県
  homonyms: []
  summary: 美方郡の町。2005年10月1日に温泉町と浜坂町が新設合併して発足した。新町名は当初「温泉町」と決まっていたが、浜坂町側の反発で「新温泉町」に変更されたという異例の経緯を持つ。旧温泉町の中心・湯村温泉は、円仁（慈覚大師）が開いたと伝える古湯で、98度の源泉「荒湯」で知られる。
  first_attestation:
    era: 平成
    year_western: 2005
    document: 浜坂町・温泉町合併協定（2005年3月19日再調印）
    note: 新町名「新温泉町」は2005年3月19日の合併協定再調印で確定し、同年7月7日に官報告示された（市区町村変遷情報による）
  claims:
  - text: 2005年（平成17年）10月1日、浜坂町と温泉町が合併して新温泉町が発足した
    kind: fact
    level: E2
    status: established
    sources:
    - x12-shinonsen-nenpyo
    - x12-shinonsen-ndl
  - text: 新町名は一度「温泉町」と決定していたが、浜坂町が難色を示したため、2005年3月19日に「新温泉町」へ変更して合併協定が再調印された。協定には町名を合併後に改めて検討するという留保が付されていた
    kind: fact
    level: E4
    status: established
    sources:
    - x12-shinonsen-uub
  - text: 町名の候補は浜坂・温泉・おんせん・湯の浜・湯の里の5点から、浜坂・温泉の2点に絞り込まれていた
    kind: fact
    level: E4
    status: established
    sources:
    - x12-shinonsen-uub
  - text: 旧温泉町は、1889年に二方郡温泉村として発足し、1896年に美方郡へ移り、1927年4月15日に町制を施行して温泉町となった。1954年10月1日には照来村・八田村と合併している
    kind: fact
    level: E2
    status: established
    sources:
    - x12-inagawa-yoran
  - text: 旧浜坂町は、1889年に東浜村として発足し、1891年12月11日に町制施行・改称して浜坂町となった。1954年10月1日には大庭村・西浜村と合併している
    kind: fact
    level: E2
    status: established
    sources:
    - x12-inagawa-yoran
  - text: 湯村温泉は、嘉祥元年（848年）に円仁（慈覚大師）によって開かれたとされると兵庫県の資料は紹介する
    kind: legend
    level: E2
    status: established
    sources:
    - x12-shinonsen-ken-archive
  - text: 湯村温泉の源泉「荒湯」は98度の高温泉である
    kind: fact
    level: E2
    status: established
    sources:
    - x12-shinonsen-ken-archive
  - text: 新温泉町の地方公共団体コードは285862である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 一度決まった「温泉町」が、ひっくり返った
    text: 平成の大合併では、合併相手の名前をそのまま新町名にすることが多かった。新温泉町でも当初は「温泉町」に決まっていた。ところが浜坂町側が難色を示し、協定の再調印の末に生まれたのが「新温泉町」だった。それでも協定には「町名は合併後に検討する」という留保が残された。合併から20年以上経った今も町名は「新温泉町」のままで、「新」の字は合併の駆け引きの記念碑になっている。
    sources:
    - x12-shinonsen-uub
    - x12-shinonsen-nenpyo
  relations:
  - pref/28
  unknowns:
  - 新町名の最終決定に至る協議の詳細（合併協議会の記録そのもの）は未確認で、市区町村変遷情報（uub.jp）の記述に依拠した
  - 旧温泉町の名「温泉」自体の由来（湯村温泉にちなむ命名か等）を明示した資料は未確認
  - 旧温泉村の発足時（1889年）の構成村（湯村・春来村・歌長村など11村）の内訳は、Wikipediaの記述のみで強い出典の裏付けは未確認
  updated: '2026-11-13'
- id: muni/28-明石市
  code: '282031'
  names:
    ja: 明石市
    reading: あかしし
    aliases:
    - 赤石
  user_terms:
  - 明石の名前の由来
  - 赤石と明石はどっちが古いの
  - 明るい土地という意味の地名なの
  - 子午線のまちの名前の由来
  naming_type: 中心地名の継承
  formation: 単独発足
  prefecture: 兵庫県
  homonyms: []
  summary: 市名は古代の明石郡・明石の地名の継承。『播磨国風土記』『日本書紀』では「赤石」と書かれ、『続日本紀』以降に「明石」の表記となった。語源には赤石の岩・明るい土地・赤磯（あかし）などの諸説があり定説はない。大正8年（1919年）に市制を施行した。
  first_attestation:
    era: 和銅6年ごろ
    year_western: 713
    document: 播磨国風土記
    note: 明石市立図書館の資料によれば、『播磨国風土記』と『日本書紀』は「赤石」の表記を用い、『続日本紀』以降は「明石」と表記する。風土記の成立は和銅6年（713年）ごろとされる
  claims:
  - text: 明石市の地方公共団体コードは282031である（総務省「地方公共団体コード一覧」による）
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  - text: 『播磨国風土記』と『日本書紀』では「赤石」と書かれ、『続日本紀』以降は「明石」の表記が用いられた
    kind: fact
    level: E2
    status: established
    sources:
    - k5-akashi-lib-digital
  - text: 明石市立図書館の郷土史資料の検討では、「赤石」は風土記の編纂にあたって好字を著けるよう命じられたことによる表記であり、「赤い石」に地名の由来を求めるのは無理があるとされる
    kind: fact
    level: E2
    status: contested
    sources:
    - k5-akashi-lib-digital
  - text: 明石市公式は地名の由来の諸説として、林崎松江海岸の沖に沈む「赤石」という岩の名から変化したとする説と、西の方から見ると明るい土地だったためとする説を紹介している
    kind: fact
    level: E2
    status: contested
    sources:
    - k5-akashi-city-aramashi
  - text: 日本大百科全書は、『明石市史』が赤みがかった土を指す「赤磯（あかし）」に由来するとしていることを紹介している
    kind: fact
    level: E3
    status: contested
    sources:
    - k5-akashi-kotobank-hyakka
  - text: 林崎松江海岸の沖に沈むという「赤石」には、男が鹿に乗って海を渡り、矢で射られた鹿が血で赤い岩になったという伝説が伝わっている
    kind: legend
    level: E2
    status: established
    sources:
    - k5-akashi-city-aramashi
  - text: 大正8年（1919年）11月1日に市制を施行して明石市が発足した（兵庫県内では4番目、当時の人口は約32,000人）
    kind: fact
    level: E2
    status: established
    sources:
    - k5-akashi-city-aramashi
  column:
    title: 歌枕であり、子午線の通るまち
    text: 「あかし」は早くから都の人々に知られた地名だった。『日本書紀』には大化の改新（645年）の際に畿内の西端を「赤石の櫛淵」と定めたとあり、柿本人麻呂をはじめとする歌人に詠まれ、『源氏物語』では明石巻の舞台となった。近代になると東経135度の日本標準時子午線が市内を通ることが知られるようになり、「子午線のまち」がもう一つの顔になった。古代の歌枕と近代の標準時とが、同じ地名の上に重なっている。
    sources:
    - k5-akashi-city-aramashi
  relations:
  - pref/28
  unknowns:
  - 語源は確定していない（赤石の岩・明るい土地・赤磯のいずれの説も決め手を欠く）
  - 林崎松江海岸沖で1987年に海底の石が確認されたと資料は伝えるが、その石と地名との関係は証明されていない
  updated: '2026-11-13'
- id: muni/28-朝来市
  code: '282251'
  names:
    ja: 朝来市
    reading: あさごし
    aliases:
    - 阿相郡
    - 安佐古
  user_terms:
  - あさご
  - 竹田城跡のある市
  - 天空の城のふもと
  naming_type: 旧行政区画名の継承
  formation: 合併新設
  prefecture: 兵庫県
  homonyms: []
  summary: 2005年に朝来郡の4町が合併して誕生した市で、市名は郡名「朝来」の継承である。「朝来」は古代には「あさこ」と読まれ、『和名類聚抄』は「安佐古」と訓んだ。「朝来」の表記自体は天平9年（737）の但馬国正税帳に見える古いもので、市名候補だった読み「あさご」は明治期以降の読みである。「朝に来る」という語源説は、公的資料では確認できなかった。
  first_attestation:
    era: 奈良時代
    year_western: 714
    document: 長屋王家木簡
    note: 『日本歴史地名大系』「朝来郡」が紹介するところでは、郡名の初見は和銅7年（714）と年代が推定できる長屋王家木簡の「但馬国阿相郡」で、『播磨国風土記』にも「但馬阿相郡」とある。「朝来」の表記は天平9年（737）の但馬国正税帳に用いられている
  claims:
  - text: 朝来市は平成17年（2005）4月1日に、朝来郡の生野町・和田山町・山東町・朝来町の4町が合併して誕生し、朝来郡は消滅した
    kind: fact
    level: E2
    status: established
    sources:
    - upg-u1-hyogo-ichiran
  - text: 新市名は、当初「あさご」が有力だったがこれに難色を示す町があり協議が一時休止し、最終候補10点（あさご・南但・円山・兵庫中央・兵庫なか・朝来・南但馬・和田山・生野・竹田城）の中から「朝来市」に決まった
    kind: fact
    level: E4
    status: established
    sources:
    - x3-uub-asago
  - text: 『日本歴史地名大系』は、郡名の初見は和銅7年（714）と推定できる長屋王家木簡の「但馬国阿相郡」で、『播磨国風土記』にも「但馬阿相郡」とあると紹介する
    kind: fact
    level: E2
    status: established
    sources:
    - x3-kotobank-asagogun
  - text: 同大系は、天平9年（737）の但馬国正税帳では「朝来」の表記が用いられていると紹介する
    kind: fact
    level: E2
    status: established
    sources:
    - x3-kotobank-asagogun
  - text: 同大系によると、郡名の古代の読みは『和名類聚抄』に「安佐古（あさこ）」、『延喜式』に「アサコ」とあり、明治期になって「あさご」と読むようになったとされる
    kind: fact
    level: E3
    status: established
    sources:
    - x3-kotobank-asagogun
  - text: 市域には雲海に浮かぶ山城として知られる竹田城跡があり、合併時の新市名候補には「竹田城」も入っていた
    kind: fact
    level: E4
    status: established
    sources:
    - upg-u1-asago-history
    - x3-uub-asago
  - text: 総務省の全国地方公共団体コードで、朝来市の団体コードは282251と定められている
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 「あさこ」だった郡が、「あさご」の市になるまで
    text: 朝来市の読み「あさご」は、実は明治以降の読みです。古代の資料では『和名類聚抄』が「安佐古（あさこ）」、『延喜式』も「アサコ」と訓んでいて、郡名はもともと「あさこ」でした。ところが2005年の合併協議では、この新しい読み「あさご」をそのまま市名にしようとする案と、漢字の「朝来」を市名にしようとする案がぶつかり、協議が一時止まるほどになりました。結局選ばれたのは漢字の「朝来市」。表記は平安の正税帳以来の古い字、読みは明治以降の新しい読み——市名は両方の時代を背負っています。
    sources:
    - x3-kotobank-asagogun
    - x3-uub-asago
  relations:
  - pref/28
  - muni/28-養父市
  unknowns:
  - 「朝来は『朝に来る』の意」という語源説は、参照した公的・専門資料では確認できなかった。『日本歴史地名大系』も語源の説明を与えておらず、語源自体は未確定である
  - 新市名選定の合併協議会公式記録は未確認で、候補の経緯は自治体沿革データベースの紹介によった
  updated: '2026-11-13'
- id: muni/28-洲本市
  code: '282057'
  names:
    ja: 洲本市
