records:
- id: muni/10-みどり市
  code: '102121'
  names:
    ja: みどり市
    reading: みどりし
    aliases:
    - 笠懸町
    - 大間々町
    - 東村
  user_terms:
  - 群馬県初のひらがな市名のまち
  - 岩宿遺跡のあるまち
  - わたらせ渓谷鐡道の通るまち
  naming_type: 新規命名
  formation: 合併新設
  prefecture: 群馬県
  homonyms: []
  summary: 2006年3月27日に笠懸町・大間々町・東村が合併して生まれた、群馬県で48年ぶりの新しい市。市名「みどり」は合併協議の中で公募により候補を募って決められ、緑豊かなふるさとへの思いが込められているという。旧中心の一つ大間々の名は、渡良瀬川の河岸段丘の崖を指す地形語「まま」に由来すると市は説明する。市域は桐生市に東西から挟まれ、くびれた形をしている。
  first_attestation:
    era: 平成18年
    year_western: 2006
    document: 笠懸町・大間々町・東村合併協議会による市名の決定（みどり市公式「市名・市章」が経緯を説明）
    note: 市名自体の初出（命名の年）。旧中心地「大間々」の地名としての初出は未特定で、『日本歴史地名大系』は文禄年間（1592〜96）に桐原村から分郷して集落が発達したとする
  claims:
  - text: みどり市公式サイトによれば、2006年（平成18年）3月27日に新田郡笠懸町・山田郡大間々町・勢多郡東村が合併してみどり市が誕生した。群馬県では12番目となる、48年ぶりに誕生した新しい市である
    kind: fact
    level: E2
    status: established
    sources:
    - u4-midori-city-gaiyo
    - u4-midori-city-ayumi
  - text: 市名「みどり」は、合併協議のなかで公募により候補を募り、話し合いにより決定したもので、緑豊かなふるさとへの思いと、今後の豊かな自然との共存への願いが込められていると、みどり市公式サイトは説明している
    kind: fact
    level: E2
    status: established
    sources:
    - u4-midori-city-meisho
  - text: みどり市公式資料は、大間々町が東西を桐生市に挟まれた位置にあり、みどり市の東町と笠懸町を繋ぐ中間にあたることを記している。市域は南北に長く、接点部分が著しくくびれている
    kind: fact
    level: E2
    status: established
    sources:
    - u4-midori-city-sogokeikaku
    - u4-midori-city-gaiyo
  - text: この市域の形は、桐生広域圏の合併枠組みを巡る調整の結果による。大間々町の西隣の新里村と、大間々町と東村の間にあった黒保根村が桐生市との合併を選択したため、桐生市に挟まれた3町村が「みどり市」として合併することになったとされる
    kind: fact
    level: E5
    status: established
    sources:
    - u4-midori-wikipedia
  - text: 大間々の町名の由来となった「まま」は、渡良瀬川の河岸段丘が造り出した傾斜地・崖の呼称であり、住民にとって渡良瀬川が生活に深く根ざしてきたことを物語る名であると、みどり市公式サイトは説明している。「大間々」は大きな崖地のある土地の意に通じる
    kind: fact
    level: E2
    status: established
    sources:
    - u4-midori-city-gaiyo
  - text: 『日本歴史地名大系』も「まま」は急な傾斜地の意味で、大間々には間々根・儘下などの小字があるとする。同書はまた、文禄年間（1592〜96）に「吹払い」と称された地に桐原村から分郷して集落が発達したという『山田郡誌』の記述を紹介し、大間々が銅山（あかがね）街道の通る交通の要衝で、大間々宿とも呼ばれたことを記す
    kind: fact
    level: E3
    status: established
    sources:
    - u4-midori-kotobank-omama
  - text: 旧笠懸町の町名の由来は、鎌倉時代に成立した、笠を模した的を馬上から射る武技「笠懸」であると、みどり市公式サイトは紹介している。笠懸地区には日本の旧石器文化の存在を証明した岩宿遺跡がある
    kind: fact
    level: E2
    status: established
    sources:
    - u4-midori-city-ayumi
  - text: みどり市の総務省地方公共団体コードは102121である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 崖の町「大間々」と、公募の「みどり」
    text: みどり市の三つの旧町村は、それぞれ性格の違う名を持っていた。笠懸は、馬上から笠の的を射る武技の名。大間々は、渡良瀬川が刻んだ河岸段丘の崖――地形語で「まま」――の名。東は、方角そのものの名である。2006年に三つが一つになる際、新しい市の名に選ばれたのは、どの町の名でもなく、公募で募った「みどり」だった。市の説明によれば、緑豊かなふるさとへの思いと、豊かな自然との共存への願いが込められている。間にあった二つの村が桐生市との合併を選んだため、市域は桐生市に挟まれて細くくびれている。その地図の形自体が、平成の大合併の迷走と決着を今に伝えている。
    sources:
    - u4-midori-city-meisho
    - u4-midori-city-gaiyo
    - u4-midori-wikipedia
  relations:
  - pref/10
  unknowns:
  - 公募の応募総数や、「みどり」以外の最終候補の市名案は市公式ページで確認できなかった
  - 「大間々」の地名の初出文書は特定できなかった。「まま」が崖を指す地形語であることは市公式と専門辞典で一致するが、「大」が付いた成り立ちの詳細は未確認である
  updated: '2026-11-13'
- id: muni/10-みなかみ町
  code: '104493'
  names:
    ja: みなかみ町
    reading: みなかみまち
    aliases:
    - 水上町
    - 月夜野町
    - 新治村
  user_terms:
  - みなかみ
  - 利根川源流の町
  - みなかみ18湯
  - 水上の温泉郷
  naming_type: 文献・故事から命名
  formation: 合併新設
  prefecture: 群馬県
  homonyms: []
  summary: 群馬県最北部、利根郡の町。2005年10月1日に月夜野町・水上町・新治村が合併して生まれた。町名は若山牧水の紀行文『みなかみ紀行』（1924年）に由来し、公募で最も多かった平仮名の「みなかみ」が選ばれたと観光協会は伝える。最大の旧町だった水上町も読みは「みなかみまち」であり、新町名はその読みを残しながら漢字表記を捨てた命名だった。町は利根川の源流域にあり、大水上山の雪渓の一滴が利根川の源とされる。
  first_attestation:
    era: 大正13年
    year_western: 1924
    document: 若山牧水『みなかみ紀行』
    note: 町名の典拠としての現れ。町名としての使用は2005年から
  claims:
  - text: 市町村コードは総務省の全国地方公共団体コード一覧で「104493」とされる
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  - text: 2005年（平成17年）10月1日に月夜野町・水上町・新治村が合併してみなかみ町が誕生した
    kind: fact
    level: E2
    status: established
    sources:
    - w7-minakami-env
    - w7-minakami-water
  - text: 町名は、当地を何度も訪れた歌人・若山牧水の紀行文『みなかみ紀行』（1924年・大正13年刊）に由来する
    kind: fact
    level: E2
    status: established
    sources:
    - w7-minakami-water
    - w7-minakami-env
  - text: 新町名は公募で決まり、最も多かった案が平仮名の「みなかみ」だったと、みなかみ町観光協会の担当者は語る
    kind: fact
    level: E4
    status: established
    sources:
    - w7-minakami-notahotel
  - text: 最大の旧町であった水上町の読みも「みなかみまち」であり、新町名はその読みを引き継ぎながら漢字表記を捨てて平仮名にしたものだった
    kind: fact
    level: E5
    status: established
    sources:
    - w7-minakami-wiki
  - text: 牧水は『みなかみ紀行』に「私は河の水上（みなかみ）といふものに不思議な愛着を感ずる」と書いた
    kind: fact
    level: E4
    status: established
    sources:
    - w7-minakami-jomo
  - text: 町の北端の大水上山にある三角雪渓からの一滴が利根川の源であると言われ、町は「利根川源流の町」を掲げる
    kind: fact
    level: E2
    status: established
    sources:
    - w7-minakami-water
  - text: 町内の温泉地は「みなかみ18湯」と総称される
    kind: fact
    level: E2
    status: established
    sources:
    - w7-minakami-env
  column:
    title: 漢字を捨てた町名
    text: 2005年の合併で生まれた「みなかみ町」という名には、ちょっとした仕掛けがある。合併した3町村のうち最大の水上町は、漢字こそ「水上」だが読みは「みなかみまち」だった。新町名の公募で最も多かったのは、平仮名の「みなかみ」。つまり新町名は、音の上では旧・水上町の名をそのまま引き継ぎながら、見た目には全く新しい名になったのである。その典拠は若山牧水の『みなかみ紀行』（1924年）。牧水は群馬を8度訪れ、この地への2度の旅から『利根の奥へ』『みなかみ紀行』を著した。「河の水上（みなかみ）」への愛着を綴った歌人の言葉が、80年余りを経て、漢字を捨てた町名として残った。
    sources:
    - w7-minakami-jomo
    - w7-minakami-notahotel
    - w7-minakami-water
  relations:
  - pref/10
  unknowns:
  - 公募の応募総数や、「みなかみ」以外の候補名の詳細
  - 旧水上町の「水上」を「みなかみ」と読む慣習が成立した経緯と時期
  updated: '2026-11-13'
- id: muni/10-上野村
  code: '103667'
  names:
    ja: 上野村
    reading: うえのむら
    aliases: []
  user_terms:
  - うえのむら
  - 御巣鷹の村
  - 合併しない宣言の村
  - 神流川源流の村
  - 群馬県で一番人口の少ない村
  naming_type: 新規命名
  formation: 合併新設
  prefecture: 群馬県
  homonyms: []
  summary: 群馬県南西部、多野郡の村。1889年の町村制施行で乙母・野栗沢・新羽・勝山・川和・乙父・楢原の7つの郷村が統括されて発足し、それ以前に「上野」を名乗る村はなかった。「うえの」の由来は旧国名「上野国（こうずけ）」に関係するといわれるが不明で、中世の上山荘の名にちなむ説もある。読みは国名の「こうずけ」ではなく「うえの」である。日本武尊の通過伝説を村公式サイトは伝えるが、それは伝説の層であって命名の経緯とは分けて記録する。
  first_attestation:
    era: 明治22年
    year_western: 1889
    document: 町村制施行時の村名
    note: 7郷村の統括により1889年に命名された。それ以前の「上野村」は存在しない
  claims:
  - text: 市町村コードは総務省の全国地方公共団体コード一覧で「103667」とされる
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  - text: 1889年（明治22年）の町村制施行により、乙母・野栗沢・新羽・勝山・川和・乙父・楢原の7つの郷村が統括されて上野村が発足し、現在の大字はこの7つの旧村名を残す
    kind: fact
    level: E2
    status: established
    sources:
    - w7-ueno-village-about
    - w7-ueno-wiki
  - text: 「上野」の名は、旧国名「上野国」に関係するといわれるが確かではなく、中世の上山荘の名にちなむという説もある
    kind: fact
    level: E5
    status: indeterminate
    sources:
    - w7-ueno-gogen
  - text: 村名の読みは、国名「上野（こうずけ）」と同じ漢字でありながら「こうずけ」ではなく「うえの」である
    kind: fact
    level: E5
    status: established
    sources:
    - w7-ueno-wiki
  - text: 村には、日本武尊が軍勢を率いてこの地を通過したという伝説が残ると、村公式サイトは伝える
    kind: legend
    level: E2
    status: established
    sources:
    - w7-ueno-village-about
  - text: 上野村は平成の大合併の際に「合併しない宣言」を出し、単独での存続を選んだ
    kind: fact
    level: E5
    status: established
    sources:
    - w7-ueno-wiki
  - text: 村域南部の「御巣鷹の尾根」は1985年8月12日の日本航空123便墜落事故の現場で、当時無名だったこの尾根に「御巣鷹の尾根」と命名したのは元村長の黒澤丈夫とされる
    kind: fact
    level: E5
    status: established
    sources:
    - w7-ueno-wiki
  column:
    title: 「こうずけ」と読まない上野
    text: 群馬県の旧国名は「上野国（こうずけのくに）」。ところが多野郡の上野村は、同じ「上野」と書いて「うえのむら」と読む。村の名の由来ははっきりしない。国名に関係するといわれる一方、中世の「上山荘」の名にちなむという説もある。名づけの舞台となったのは1889年、町村制の施行である。それまで別々だった7つの郷村が一つの村にまとめられ、新しい村の名として「上野」が選ばれた。つまり「上野村」は、明治に新しく付けられた村名でありながら、読みは国名とは違う。漢字は由緒ありげで、村は新しい。そのねじれが、この村の名の面白さである。
    sources:
    - w7-ueno-gogen
    - w7-ueno-village-about
  relations:
  - pref/10
  unknowns:
  - 「上野」の命名理由（国名由来説と上山荘由来説があり、村公式にも定説の提示はない）
  - 読みが「こうずけ」でなく「うえの」となった経緯
  updated: '2026-11-13'
- id: muni/10-下仁田町
  code: '103829'
  names:
    ja: 下仁田町
    reading: しもにたまち
    aliases:
    - 下仁田村
  user_terms:
  - しもにた
  - 下仁田ネギの町
  - こんにゃくの町
  - ねぎとこんにゃく下仁田名産
  naming_type: 中心地名の継承
  formation: 合併新設
  prefecture: 群馬県
  homonyms: []
  summary: 群馬県南西部、甘楽郡の町。町名は中心集落の下仁田に由来し、寛文郷帳に「下仁田村（幕府領）」と見える。南牧川と西牧川の合流点の谷口集落として、近世以来2・5・9の日を市日とする市場町、信州方面への交通の要地として発達した。「仁田」の語源は、町公式の沿革・要覧、群馬県の市町村資料、専門辞典のいずれにも説明が確認できず、未詳として記録する。下仁田村は明治5年（1872年）に町となり、1955年3月10日に周辺4村と合併して現在の町となった。
  first_attestation:
    era: 寛文年間
    year_western: null
    document: 寛文郷帳（『日本歴史地名大系』が「下仁田村」に幕府領・高338石余と紹介）
    note: 寛文年間（1661〜1673年）の郷帳における現れ
  claims:
  - text: 市町村コードは総務省の全国地方公共団体コード一覧で「103829」とされる
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  - text: 寛文郷帳に「下仁田村」と見え、当時は幕府領で、高338石余はすべて畑方であったことが『日本歴史地名大系』によって紹介されている
    kind: fact
    level: E3
    status: established
    sources:
    - w7-shimonita-kotobank-village
  - text: 下仁田は南牧川と西牧川が合流して鏑川となる地にあり、河岸や市場が設けられて町場を形成した
    kind: fact
    level: E3
    status: established
    sources:
    - w7-shimonita-kotobank-village
  - text: 中心集落の下仁田は、近世以来2・5・9の日を市日とする市場町で、信州方面への交通の要地として発達した
    kind: fact
    level: E3
    status: established
    sources:
    - w7-shimonita-kotobank
  - text: 「仁田」の語源については、町公式の沿革・町勢要覧、『日本歴史地名大系』『日本大百科全書』のいずれにも説明が確認できず、未詳である
    kind: fact
    level: E3
    status: indeterminate
    sources:
    - w7-shimonita-kotobank-village
    - w7-shimonita-kotobank
  - text: 下仁田村は明治5年（1872年）に町となり、1889年の町村制施行後も下仁田町として存続した
    kind: fact
    level: E2
    status: established
    sources:
    - w7-shimonita-town-enkaku
  - text: 1955年（昭和30年）3月10日に旧下仁田町・馬山村・西牧村・小坂村・青倉村が合併して、現在の下仁田町が誕生した
    kind: fact
    level: E2
    status: established
    sources:
    - w7-shimonita-yoran
  - text: 文化2年（1805年）の江戸旗本から名主宛の手紙に「ネギ200本至急送れ」とあり、当時すでに下仁田のネギが栽培され珍重されていたことが分かる。下仁田ネギは別名「殿様ネギ」と呼ばれ、上毛かるたには「ねぎとこんにゃく下仁田名産」と詠まれる
    kind: fact
    level: E2
    status: established
    sources:
    - w7-shimonita-town-negi
  column:
    title: ネギが運んだ町名
    text: 「下仁田」という名を全国に運んだのはネギである。文化2年（1805年）、江戸の旗本から下仁田の名主のもとへ、「ネギ200本至急送れ、運送代はいくらかかってもよい」という趣旨の手紙が届いた。江戸から遠く離れた山あいの町のネギが、江戸の武家にまで求められていたことが分かる。下仁田ネギは「殿様ネギ」とも呼ばれ、昭和には皇室への献上も行われたという。上毛かるたの札は「ねぎとこんにゃく下仁田名産」。一方で、下仁田ネギには「下仁田ネギは下仁田におけ」という言い伝えがある。他の土地の試験場で育てても同じ品質にはならなかったという話で、ネギの名声とともに、地名そのものが「ここでしか育たない土地」の名として記憶されるようになった。
    sources:
    - w7-shimonita-town-negi
    - w7-shimonita-kotobank-village
  relations:
  - pref/10
  unknowns:
  - 「仁田」「下仁田」の語源（対応する「上仁田」の有無を含め、公的資料・専門辞典に説明が見当たらない）
  - 「下仁田」の名の初出文献（寛文郷帳より前の用例の有無）
  updated: '2026-11-13'
- id: muni/10-中之条町
  code: '104213'
  names:
    ja: 中之条町
    reading: なかのじょうまち
    aliases:
    - 中条（戦国期の文書表記）
    - 中野条（近世郷帳の表記）
    - 中之条新町（文禄4年の移転後の称）
    - 河原町（移転前の集落の称）
  user_terms:
  - なかのじょう
  - 四万温泉の町
  - 中之条ビエンナーレ
  - 吾妻郡の中心
  naming_type: 中心地名の継承
  naming_note: 中世以来の地名「中条」を継承する在郷町名。1889年に町制、1955年・2010年の合併でも名が継承された
  formation: 合併新設
  prefecture: 群馬県
  homonyms: []
  summary: 吾妻川中流の中之条盆地に位置し、四万温泉・沢渡温泉を擁する吾妻郡の中心町。中世末の文書では「中条」と記され、近世の郷帳では「中野条」の表記が多い。集落はもと吾妻川と名久田川の合流点付近にあって河原町といったが、文禄4年（1595年）に段丘上へ移って中之条新町となり、六斎市の立つ市場町・街道の要地として発展した。「条」の語源そのものは、確認した専門資料では明示されていない。
  first_attestation:
    era: 天正11年
    year_western: 1583
    document: 真田昌幸朱印状写（一場文書）
    note: 『日本歴史地名大系』が紹介する記載で、「中之条」ではなく「中条」の表記で現れる。「中之条」の表記での初出は未確認
  claims:
  - text: 中之条町の地方公共団体コードは104213である
    kind: fact
    level: E1
    status: established
    sources:
    - b-cap-chiba-soumu-code
  - text: 戦国期の文書ではこの地は「中条」と記されており、『日本歴史地名大系』は天正11年（1583年）3月26日の真田昌幸朱印状写（一場文書）と天正18年（1590年）閏12月10日の真田信幸朱印状写（『吾妻記』所収）に「中条」の宛行の記事が見えることを紹介する
    kind: fact
    level: E2
    status: established
    sources:
    - w8-nakanojo-kotobank-taikei
  - text: 近世の郷帳では「中野条」と記すものが多かった（『日本歴史地名大系』による）
    kind: fact
    level: E3
    status: established
    sources:
    - w8-nakanojo-kotobank-taikei
  - text: 集落は古くは名久田川が吾妻川に合流する付近にあって河原町といったが、文禄4年（1595年）には河川から離れた一段上の下ノ町（長岡）に移り、中之条新町となった（『日本歴史地名大系』が「吾妻郡略記」「伊勢町覚書」を引いて紹介）
    kind: fact
    level: E2
    status: established
    sources:
    - w8-nakanojo-kotobank-taikei
  - text: 戦国時代には真田氏の居城沼田城と信州上田城を結ぶ道の要地であり、近世には吾妻川・四万川・名久田川流域の諸村を後背地として1と6の日を市日とする六斎市が開かれ、米・生糸・薪炭の取引で繁栄した市場町だった
    kind: fact
    level: E3
    status: established
    sources:
    - w8-nakanojo-kotobank-taikei
    - w8-nakanojo-kotobank-nipponica
  - text: 古代にはJR吾妻線中之条駅南の地域から銅印・墨書土器・奈良三彩陶器片が出土しており、町公式の歴史解説は、この地域が吾妻郡の郡衙や郡政治と密接な関わりを持っていたことを想定させる、と紹介する
    kind: fact
    level: E2
    status: established
    sources:
    - w8-nakanojo-town-history
  - text: 1889年（明治22年）に町制が施行され、1955年（昭和30年）に沢田村・伊参村・名久田村と合併、2010年（平成22年）に六合村を編入して現在の町域となったが、「中之条」の名は一貫して継承された
    kind: fact
    level: E3
    status: established
    sources:
    - w8-nakanojo-kotobank-nipponica
    - w8-nakanojo-wiki
  - text: 「中之条」の「条」が何に由来するか（条里制や荘園の区画との関係を含む）は、確認した『日本歴史地名大系』等の専門資料では明示されておらず、語源は未確定である
    kind: fact
    level: E3
    status: indeterminate
    sources:
    - w8-nakanojo-kotobank-taikei
  - text: 町内の四万温泉の名は「四万（よんまん）の病を癒す霊泉」であることに由来するという伝説があり、温泉の始まりについては坂上田村麻呂が入浴したとする説と、源頼光の家臣・日向守碓氷貞光が夢のお告げで湧出を見つけたとする説が伝えられる
    kind: legend
    level: E2
    status: established
    sources:
    - w8-nakanojo-shima-jtb
  column:
    title: 川に追われて引っ越した町 ― 河原町から「中之条新町」へ
    text: いまの中之条の市街地は、吾妻川北岸の河岸段丘の上にあります。ところが古く、この町の集落は名久田川が吾妻川に合流する河原の近くにあり、「河原町」と呼ばれていました。水に近すぎる立地は洪水と隣り合わせで、文禄4年（1595年）、集落は川から離れた一段高い下ノ町（長岡）へ移り、「中之条新町」と名を改めます。さらに寛永9年（1632年）には一部が王子原へ移って町割が引かれました。川辺の「河原町」が高台の「新町」になる ― 町の名前の歴史は、そのまま水害と折り合いをつけてきた移転の歴史でもあるのです。
    sources:
    - w8-nakanojo-kotobank-taikei
  relations:
  - pref/10
  unknowns:
  - 「中之条」の「条」の語源（条里制・荘園の区画との関係など）は専門資料で確認できなかった
  - 「中之条」の表記（之を含む形）の文献上の初出は未確認（戦国期の文書は「中条」、近世郷帳は「中野条」が多い）
  updated: '2026-11-13'
- id: muni/10-伊勢崎市
  code: '102041'
  names:
    ja: 伊勢崎市
    reading: いせさきし
    aliases:
    - 赤石
    - 伊勢前
    - 伊勢崎町
  user_terms:
  - 伊勢崎市の名前の由来
  - 伊勢崎と伊勢神宮の関係
  - 赤石という古い地名
  - 伊勢崎銘仙のまち
  naming_type: 中心地名の継承
  formation: 合併新設
  prefecture: 群馬県
  homonyms: []
  summary: もとは広瀬川の赤土の崖から「赤石」と呼ばれた土地である。1565年に由良成繁が土地を伊勢神宮に寄進して城内に伊勢宮を祀ると、一帯は「伊勢の前」「伊勢の先」と呼ばれるようになり、「伊勢崎」の地名が生まれた。1601年に伊勢崎藩が成立して城下町となり、その名が町名・市名に受け継がれた。
  first_attestation:
    era: 天正年間（1573〜1591）
    year_western: null
    document: 伊勢崎城（伊勢前城・伊勢崎城）の呼称
    note: 伊勢宮の建立（1565年）を契機に生まれた「伊勢の前・先」の呼び名が、城名・地名として定着した時期
  claims:
  - text: この地域は古来「赤石」と呼ばれ、その名の由来は、広瀬川が侵食して露出した関東ローム層の「赤土」の崖の様子からと言われている
    kind: fact
    level: E2
    status: established
    sources:
    - l2-isesaki-machinaka
  - text: 永禄8年（1565）、由良成繁は赤石城を再興するため、土地120貫文を伊勢神宮領に寄進し、城の守護神として城内に伊勢宮を建立した。これによりこの地域が「伊勢の前」や「伊勢の先」と呼ばれるようになり、「伊勢崎」という地名が生まれた
    kind: fact
    level: E2
    status: established
    sources:
    - l2-isesaki-machinaka
  - text: 天正年間までには赤石城も伊勢前（崎）城と名前を変え、慶長6年（1601）の関ヶ原の戦いの後、稲垣長茂が伊勢崎藩主となり、伊勢崎城（陣屋）を藩庁として城下町が形成された
    kind: fact
    level: E2
    status: established
    sources:
    - l2-isesaki-machinaka
  - text: 江戸時代後期から明治時代にかけて伊勢崎は織物の町として発展し、大衆着として人気となった伊勢崎銘仙の生産で知られた
    kind: fact
    level: E2
    status: established
    sources:
    - l2-isesaki-machinaka
  - text: 昭和15年（1940）9月13日、伊勢崎町・殖蓮村・茂呂村が合併して伊勢崎市が誕生し、平成17年（2005）1月1日に赤堀町・東村・境町との新設合併で現在の伊勢崎市となった
    kind: fact
    level: E5
    status: established
    sources:
    - l2-gunma-hensei
  - text: 総務省の全国地方公共団体コードで、伊勢崎市の団体コードは102041と定められている
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 神宮への寄進が生んだ地名
    text: 伊勢崎の「伊勢」は、三重県の伊勢神宮から来ています。1565年、戦国武将の由良成繁が赤石城を再興するにあたり、土地を伊勢神宮に寄進し、守護神として城の中に伊勢宮を建てました。すると人々はこの辺りを「伊勢の前」「伊勢の先」と呼ぶようになり、やがて城も伊勢崎城と名を変えます。遠く離れた上野国の城下町が、伊勢神宮との縁で名付けられたわけです。元の名「赤石」は、広瀬川の赤い土の崖に由来するとされ、今も赤石の名は地域に残っています。神社の寄進が地名を塗り替えた、珍しい成立の仕方です。
    sources:
    - l2-isesaki-machinaka
  relations:
  - pref/10
  unknowns:
  - 「伊勢崎」の表記が文献に初めて現れる正確な時期は、専門の地名辞典では確認できていない
  - 赤石の名の「赤土の崖」説は市の冊子が「と言われています」とする説明で、検証の余地が残る
  updated: '2026-11-13'
- id: muni/10-前橋市
  code: '102016'
  names:
    ja: 前橋市
    reading: まえばしし
    aliases:
    - 厩橋
    - 駅家郷
  user_terms:
  - 前橋の名前の由来
  - 厩橋って何と読む
  - 前橋はもともと別の名前だった
  - 群馬県庁がある市
  - まやはしと前橋
  naming_type: 表記・読みの変更
  formation: 単独発足
  prefecture: 群馬県
  homonyms: []
  summary: 前橋の旧名は「厩橋（まやはし）」で、車川にかかる「駅家（うまや）の橋」が地名になったと前橋市は伝える。「前橋」への改称は江戸時代初期の前橋藩主・酒井忠清の頃（1648〜1652年）というのが市の公式見解で、明治25年（1892年）の市制施行以来、この名が市名として継承されている。
  first_attestation:
    era: 平安時代中期（10世紀）
    year_western: null
    document: 和名類聚抄
    note: 群馬郡の駅家（うまや）郷など、前橋の前身と市が見なす地名が現れる時代の資料。前橋市勢要覧が「前橋の地名が出てくるのは10世紀平安中期」と紹介するもので、「厩橋」の文字列そのものの初出ではない
  claims:
  - text: 前橋市公式によれば、前橋は古くは「厩橋（まやはし）」と称した
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-mae-city
  - text: 前橋市公式によれば、「厩橋」の名は、現在利根川が流れているあたりに車川と称する流れがあり、そこにかかっていた橋を「駅家（うまや）の橋」と呼んだことから、自然に地名になったと伝えられている
    kind: fact
    level: E2
    status: contested
    sources:
    - b-cap-mae-city
    - b-cap-mae-youran
  - text: 前橋市公式によれば、「厩橋」が「前橋」に改められたのは西暦1648年から1652年、前橋藩第4代藩主の酒井忠清が城主であった頃だと言われている
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-mae-city
  - text: 前橋市勢要覧によれば、群馬（くるま）の郡、駅家（うまや）の郷、群馬（くるま）の駅など、前橋の地名が出てくるのは10世紀の平安中期である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-mae-sisei
  - text: 前橋市公式によれば、厩橋城は文明年間（1470年代）に築かれたとされ、この城は戦国時代に上杉・武田・北条の攻防の的となった
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-mae-city
    - b-cap-mae-youran
  - text: 前橋市公式によれば、慶応3年（1867年）に松平氏が再び前橋に迎えられて前橋藩が復活したが、まもなく明治維新となった。これは厩橋から前橋への改名の時期とは別の出来事である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-mae-city
  - text: 前橋市公式によれば、明治14年（1881年）に県庁が前橋に置かれ、明治22年（1889年）に町制を施行し、明治25年（1892年）には県内最初・関東で4番目・全国で41番目に市制を施行した
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-mae-city
  - text: 総務省の全国地方公共団体コードで、前橋市のコードは102016と定められている（J-LISの地方公共団体コード一覧による）
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-mae-jlis
  column:
    title: 消えた「厩」の字
    text: 前橋の旧名「厩橋」は、馬の駅（駅家）に由来する実務的な地名だった。それがなぜ「前橋」に変わったのか、理由は前橋市の公式資料には書かれていない。時期についても、市は1648年から1652年という幅のある言い方をしている。なお、江戸末期の慶応3年（1867年）に松平氏が前橋に戻った出来事は、改名ではなく藩の復活であり、改名とは時代も主も異なる。はっきりしているのは、大老・酒井忠清が藩主だった時代に、城下の名が馬の駅の橋を意味する「厩橋」から「前橋」へ置き換わったということまでである。
    sources:
    - b-cap-mae-city
  relations:
  - pref/10
  unknowns:
  - 厩橋から前橋への改名の理由（「厩」の字を忌んだとする類の説明）は、市の公式資料では確認できなかった
  - 改名の正確な年は1648〜1652年の幅があり、確定できなかった
  - 「厩橋」の文字列の文書上の初出は特定できなかった
  updated: '2026-11-13'
- id: muni/10-千代田町
  code: '105236'
  names:
    ja: 千代田町
    reading: ちよだまち
    aliases:
    - 千代田村（1955年〜1982年の名称）
  user_terms:
  - ちよだまち
  - じゃない方の千代田
  - 利根川沿いの千代田町
  - 赤岩渡船の町
  naming_type: 新規命名
  naming_note: 1955年の3村合併に際して新しく命名された村名を、1982年の町制施行後も継承
  formation: 合併新設
  prefecture: 群馬県
  homonyms: []
  summary: 利根川中流の左岸に東西に細長く広がる、山のない平坦な田園の町。昭和30年（1955年）3月31日に永楽村・富永村・長柄村が合併して千代田村が生まれ、昭和57年（1982年）に町制を施行した。「千代田」は合併時の新名で、「千代に八千代に栄える町であるように」という願いを込めた命名と町職員が説明している。江戸時代は利根川水運の拠点で、現在も橋のない県道として赤岩渡船が残る。
  first_attestation:
    era: 昭和30年
    year_western: 1955
    document: 永楽村・富永村・長柄村の新設合併による千代田村の発足（1955年3月31日）
    note: 自治体名としての初出であり、命名そのもの。旧3村のいずれの名とも異なる新名である
  claims:
  - text: 千代田町の地方公共団体コードは105236である
    kind: fact
    level: E1
    status: established
    sources:
    - b-cap-chiba-soumu-code
  - text: 昭和30年（1955年）3月31日、邑楽郡の永楽村・富永村・長柄村が合併して千代田村が誕生した
    kind: fact
    level: E2
    status: established
    sources:
    - w8-chiyoda-town-intro
    - w8-chiyoda-gunma-hensen
  - text: 翌昭和31年（1956年）9月30日、旧長柄村の区域（大字赤堀・狸塚・篠塚）が千代田村から離れて中島村（のちの邑楽町）へ編入され、現在の町域の骨格が定まった
    kind: fact
    level: E2
    status: established
    sources:
    - w8-chiyoda-town-intro
    - w8-chiyoda-gunma-hensen
  - text: 昭和57年（1982年）4月1日に町制を施行して千代田町となり、合併時の村名「千代田」がそのまま町名に継承された
    kind: fact
    level: E2
    status: established
    sources:
    - w8-chiyoda-town-intro
    - w8-chiyoda-town-history
  - text: 町名「千代田」は、合併にあたって「千代に八千代に栄える町であるように（いつまでも永遠に）」という願いを込めて名付けられた、と町職員が紹介している
    kind: fact
    level: E4
    status: established
    sources:
    - w8-chiyoda-cbc
  - text: 「千代田」は旧3村（永楽・富永・長柄）のいずれの名からも取られておらず、合併に際して新しく作られた名称である
    kind: fact
    level: E2
    status: established
    sources:
    - w8-chiyoda-town-intro
    - w8-chiyoda-gunma-hensen
  - text: 町域は中世から近世にかけて佐貫氏・赤井氏の中心的な地域であり、江戸時代には利根川を利用した江戸への水運の拠点として繁栄した、と町公式の紹介は述べる
    kind: fact
    level: E2
    status: established
    sources:
    - w8-chiyoda-town-intro
  - text: 町内には山がなく全体が平坦で、利根川を挟んで埼玉県熊谷市・行田市に接する。赤岩渡船は利根川を渡る「橋のない県道」として町内に残る
    kind: fact
    level: E2
    status: established
    sources:
    - w8-chiyoda-town-intro
    - w8-chiyoda-sogokeikaku
  - text: 町は東京都千代田区と混同されやすいことを逆手に取り、「じゃない方の千代田」という自虐的なキャッチコピーで町のPRを行っている
    kind: fact
    level: E4
    status: established
    sources:
    - w8-chiyoda-cbc
  column:
    title: 「じゃない方の千代田」という名乗り
    text: 「千代田」と言えば、皇居と国会議事堂のある東京都千代田区が圧倒的に有名です。群馬県の千代田町は、「千代田町です」と言うと「東京都千代田区ですか？」と聞き返されることも少なくありません。そこで町は発想を逆転させ、「#じゃない方の千代田」と自ら名乗るPRを始めました。鉄道駅のない人口約1万人の田園の町が、名前の知名度の差そのものを笑いに変えて売り込む ― 合併の願いを込めて名付けられた「千代田」という名が、いまは町の広報戦略の主役になっています。
    sources:
    - w8-chiyoda-cbc
  relations:
  - pref/10
  unknowns:
  - 1955年の合併時に「千代田」の名が選ばれた経緯（候補名や選定手続き）を記した公的記録は確認できなかった（命名の願いは町職員のメディアでの説明による）
  updated: '2026-11-13'
- id: muni/10-南牧村
  code: '103837'
  names:
    ja: 南牧村
    reading: なんもくむら
    aliases: []
  user_terms:
  - なんもくむら
  - 南牧村 群馬 読み方
  - 南牧村は二つある
  naming_type: その他
  formation: 合併新設
  prefecture: 群馬県
  homonyms:
  - muni/20-南牧村
  summary: 昭和30年（1955年）に磐戸村・月形村・尾沢村の3村が合併して生まれた村で、村の中央を南牧川が流れる。県境の向こうにある長野県の南牧村とは漢字が同じでも読みが違い、こちらは「なんもく」と読む。村名そのものの語源（南牧川・地域名「南牧」の由来）は、確認した公式資料・地名辞典では明示されていない。
  first_attestation:
    era: 昭和30年
    year_western: 1955
    document: 磐戸村・月形村・尾沢村の合併による南牧村の発足（1955年3月15日村制施行）
    note: 自治体名としての初出。地域名・川名としての「南牧」の初出は未確認
  claims:
  - text: 昭和30年（1955年）3月15日、磐戸村・月形村・尾沢村の3か村の合併により南牧村が誕生した
    kind: fact
    level: E2
    status: established
    sources:
    - h6-nanmoku-gunma-pref
  - text: 村のほぼ中央を南牧川が流れ、集落のほとんどは南牧川とその支流に沿って発展している。日本歴史地名大系・ブリタニカ小項目事典もこの村を南牧川流域の村として記述する
    kind: fact
    level: E2
    status: established
    sources:
    - h6-nanmoku-gunma-pref
    - h6-nanmoku-kotobank
  - text: 読みは「なんもく」で、県境の向こうにある長野県南佐久郡の南牧村の読み「みなみまき」とは異なる。同じ漢字表記でも読みが違うため、両村はまず読みで区別される（異なる層）
    kind: fact
    level: E2
    status: established
    sources:
    - h6-nanmoku-gunma-pref
    - h6-minamimaki-official-history
  - text: 両村は県境を挟んで近接しており、Wikipediaの両村の記事はともに相手の村の読みの違いを注記している（共通する層は「南牧」という漢字表記のみ）
    kind: fact
    level: E5
    status: established
    sources:
    - h6-nanmoku-gunma-wiki
    - h6-minamimaki-wiki
  - text: 村名「南牧」が何に由来するか（南牧川の名が先か、地域名が先か、「牧」が放牧とどう関係するか）は、確認した県公式資料・地名辞典では明示されておらず、語源は未確定である
    kind: fact
    level: E3
    status: indeterminate
    sources:
    - h6-nanmoku-kotobank
    - h6-nanmoku-gunma-pref
  column:
    title: 県境の両側で読みが分かれた「南牧村」
    text: 国道254号を下仁田方面へ走ると「南牧村」の標識が見えますが、あれは群馬の「なんもく」です。一方、八ヶ岳の麓にある長野の南牧村は「みなみまき」。県境を挟んで近接する二つの村は漢字が完全に同じで、読みだけが違うため、ドライバーが標識を見て混乱した体験記が残るほどです。郵便や宅配の宛先でも県名の書き添えが欠かせない、全国でも珍しい同名ペアです。
    sources:
    - h6-nanmoku-futatsu-essay
    - h6-nanmoku-gunma-wiki
  relations:
  - pref/10
  - muni/20-南牧村
  unknowns:
  - 南牧川および地域名「南牧」の初出と語源（公式資料・地名辞典で確認できず）
  - 昭和30年の合併時に「南牧」の名を選んだ経緯の記録は未確認
  updated: '2026-11-13'
- id: muni/10-吉岡町
  code: '103454'
  names:
    ja: 吉岡町
    reading: よしおかまち
    aliases:
    - 吉岡村（1955年〜1991年の名称）
  user_terms:
  - よしおかまち
  - 吉岡温泉 リバートピア吉岡
  - 道の駅よしおか温泉
  - 榛名山の麓の吉岡
  naming_type: 自然地名から
  naming_note: 1955年の2村合併に際し、両村を結ぶ川（吉岡川）の名を取った命名。1991年の町制施行後も継承
  formation: 合併新設
  prefecture: 群馬県
  homonyms: []
  summary: 榛名山南東麓と利根川の間の台地に広がる町。昭和30年（1955年）4月に明治村と駒寄村が合併した際、2つの村を結ぶ河川（吉岡川）の名にちなんで吉岡村と命名され、平成3年（1991年）4月に町制を施行した。「吉岡」は人名由来ではなく川の名に由来する合併新名であり、川名そのものの語源は公式資料では示されていない。町内は古墳の密集地として知られる。
  first_attestation:
    era: 昭和30年
    year_western: 1955
    document: 明治村・駒寄村の合併による吉岡村の発足（1955年4月）
    note: 自治体名としての初出であり、命名そのもの。川名「吉岡川」の名の初出・語源は未確認
  claims:
  - text: 吉岡町の地方公共団体コードは103454である
    kind: fact
    level: E1
    status: established
    sources:
    - b-cap-chiba-soumu-code
  - text: 昭和30年（1955年）4月、明治村と駒寄村が合併し、2つの村を結ぶ河川の名にちなんで吉岡村と命名された
    kind: fact
    level: E2
    status: established
    sources:
    - w8-yoshioka-town-gaiyo
    - w8-yoshioka-gunma-arabashi
  - text: 村名の由来となった川は吉岡川で、合併した両村の間を流れる川の名が、そのまま新しい自治体の名に採用された
    kind: fact
    level: E2
    status: established
    sources:
    - w8-yoshioka-town-gaiyo
  - text: 平成3年（1991年）4月1日に町制が施行され、吉岡村は吉岡町となった
    kind: fact
    level: E2
    status: established
    sources:
    - w8-yoshioka-town-gaiyo
    - w8-yoshioka-gunma-arabashi
  - text: 前身の明治村と駒寄村は、明治22年（1889年）の町村制実施の際に、明治17年の連合村組織をそのままの形で継承して生まれた村だった
    kind: fact
    level: E2
    status: established
    sources:
    - w8-yoshioka-town-enkaku
  - text: 町は県のほぼ中央、榛名山の南東山麓と利根川地域に位置し、西半分は榛名山の裾野の傾斜地、東半分は洪積台地である
    kind: fact
    level: E2
    status: established
    sources:
    - w8-yoshioka-town-gaiyo
  - text: 町内は「古墳の宝庫」とされ、昭和初期には町全体で420基を超える古墳があったとも言われ、天皇陵と同じ八角墳である三津屋古墳が残る
    kind: fact
    level: E2
    status: established
    sources:
    - w8-yoshioka-town-keikaku
  - text: 中世には桃井氏がこの一帯を治め、近世には佐渡街道の大久保宿、伊香保街道の野田宿が置かれて宿場町として栄えた
    kind: fact
    level: E2
    status: established
    sources:
    - w8-yoshioka-town-keikaku
  - text: 川名「吉岡川」の「吉岡」そのものの語源は、確認した町・県の公式資料では説明されておらず、未確定である
    kind: fact
    level: E2
    status: indeterminate
    sources:
    - w8-yoshioka-town-gaiyo
  column:
    title: 村と村を結ぶ川の名が、そのまま町の名になった
    text: 合併で生まれる自治体の名前は、旧町村の名前の奪い合いになりがちです。1955年の吉岡村は、その争いを避けるような命名でした。明治村と駒寄村、どちらの名前でもなく、2つの村を結ぶように流れる吉岡川の名を取ったのです。川は両村の共有物だから、どちらにも肩入れしない中立の名になりました。町名の由来をたどると「川の名前」に行き着き、そこで記録が止まる ― その川の名の由来は今も資料に残っていません。
    sources:
    - w8-yoshioka-town-gaiyo
  relations:
  - pref/10
  unknowns:
  - 川名「吉岡川」の語源・初出は公式資料で確認できなかった
  - 1955年の命名に際して他の候補名があったかどうかは未確認
  updated: '2026-11-13'
- id: muni/10-大泉町
  code: '105244'
  names:
    ja: 大泉町
    reading: おおいずみまち
    aliases:
    - 小泉町（1957年まで存在した前身の町）
    - 大川村（1957年まで存在した前身の村）
  user_terms:
  - おおいずみまち
  - ブラジルタウン
  - 大泉カルナバル
  - 群馬で一番小さい町
  naming_type: 合成地名
  naming_note: 1957年に小泉町と大川村が合併。大川の「大」と小泉の「泉」を合わせた合成地名と解される
  formation: 合併新設
  prefecture: 群馬県
  homonyms: []
  summary: 利根川北岸に広がる、群馬県で最も面積の小さい町で、日系ブラジル人の多い国際色豊かな工業町として知られる。昭和32年（1957年）3月31日に小泉町と大川村が合併して生まれ、「大泉」は大川村の「大」と小泉町の「泉」を合わせた合成地名と解される。中心地の小泉は中世の小泉城の城下で、近世には日光例幣使街道脇往還の宿場町・市場町だった。「泉」を「大きな泉」と読む語源説は確認できず、地名「小泉」そのものの語源も公式資料では示されていない。
  first_attestation:
    era: 昭和32年
    year_western: 1957
    document: 小泉町・大川村の新設合併による大泉町の発足（1957年3月31日）
    note: 自治体名としての初出であり、命名そのもの。前身の地名「小泉」は中世の佐貫庄の時代から続く古い地名である
  claims:
  - text: 大泉町の地方公共団体コードは105244である
    kind: fact
    level: E1
    status: established
    sources:
    - b-cap-chiba-soumu-code
  - text: 昭和32年（1957年）3月31日、小泉町と大川村が合併して大泉町が誕生した
    kind: fact
    level: E2
    status: established
    sources:
    - w8-oizumi-town-history
    - w8-oizumi-gunma-arabashi
  - text: 町名「大泉」は、大川村の「大」と小泉町の「泉」を1字ずつ取って合わせた合成地名と解されるが、町・県の公式資料に命名理由の明記は確認できなかった
    kind: fact
    level: E5
    status: indeterminate
    sources:
    - w8-oizumi-kotobank-nipponica
  - text: 前身の小泉町は、明治22年（1889年）に成立した小泉村が明治35年（1902年）7月25日に町制を施行したもので、大川村も同じ1889年に成立した村だった
    kind: fact
    level: E2
    status: established
    sources:
    - w8-oizumi-town-history
  - text: 中心地の小泉は、延徳元年（1489年）に富岡直光が小泉城を築いて以来の城下であり、近世には日光例幣使街道脇往還の宿場町であり、1と6の日を市日とする市場町でもあった
    kind: fact
    level: E3
    status: established
    sources:
    - w8-oizumi-town-history
    - w8-oizumi-kotobank-nipponica
  - text: 町域は中世には佐貫庄に属し、文治元年（1185年）に佐貫広綱が佐貫庄の地頭となった、と町の歴史年表は記す
    kind: fact
    level: E2
    status: established
    sources:
    - w8-oizumi-town-history
  - text: 町の面積は18.03平方キロメートルで群馬県で一番小さく、戦中の中島飛行機小泉製作所以来の工業都市で、現在は外国籍住民の割合が約2割に達する
    kind: fact
    level: E2
    status: established
    sources:
    - w8-oizumi-town-handbook
    - w8-oizumi-gunma-arabashi
  - text: 地名「小泉」の語源（泉の湧く地であったとする説を含む）は、確認した町・県の公式資料と百科事典では明示されておらず、未確定である
    kind: fact
    level: E3
    status: indeterminate
    sources:
    - w8-oizumi-kotobank-nipponica
  column:
    title: 合併で生まれた「泉」の字が、町のブランドになった
    text: 大泉町は群馬県でいちばん小さな町ですが、人口の約2割が外国籍で、その多くが日系ブラジル人です。毎年開かれる「大泉カルナバル」ではサンバが町を練り歩き、ポルトガル語の看板が並ぶ通りは「ブラジルタウン」と呼ばれます。面白いのは、合併で生まれた「大泉」の「泉」の字が、いつの間にか町のイメージそのものになったことです。「いずみ緑道」「いずみ総合公園」「いずみの杜」と、町の施設には次々に「いずみ」の名が付けられました。1字ずつの寄せ集めだったはずの合成地名が、半世紀をかけて町の顔になっていった例です。
    sources:
    - w8-oizumi-town-handbook
    - w8-oizumi-gunma-arabashi
  relations:
  - pref/10
  unknowns:
  - 「大泉」の合成（大＋泉）の命名経緯を記した公式記録は確認できなかった
  - 地名「小泉」の語源と文献上の初出は未確認
  updated: '2026-11-13'
- id: muni/10-太田市
  code: '102059'
  names:
    ja: 太田市
    reading: おおたし
    aliases: []
  user_terms:
  - 太田の名前の由来
  - 新田義貞の本拠地
  - 金山城の城下町
  naming_type: 中心地名の継承
  formation: 合併新設
  prefecture: 群馬県
  homonyms: []
  summary: 中世の太田郷・新田荘の中心地で、金山城の城下町、日光例幣使街道の太田宿として発展した。1948年に新田郡太田町が市制を施行し、2005年に尾島町・新田町・藪塚本町と新設合併して現在の太田市となった。「太田」の語源と太田郷の初出は未確定である。
  first_attestation:
    era: 中世
    year_western: null
    document: 日本歴史地名大系『太田町』
    note: 同書は中世の太田が太田郷に属したことを記すが、太田郷の初出史料とその年は特定できなかった。
  claims:
  - text: 総務省の地方公共団体コード一覧では、太田市の団体コードは102059とされている。
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  - text: 太田市観光協会の資料によれば、現在の太田市域は中世に新田荘が成立した地であり、新田義貞の本拠地として文化が形成された。
    kind: fact
    level: E4
    status: established
    sources:
    - m3-ota-kanko
  - text: 日本歴史地名大系によれば、中世の太田は太田郷に属し、文明元年（1469）に金山城が築かれたのち、その城下町として発展し町場の基礎が築かれた。
    kind: fact
    level: E3
    status: established
    sources:
    - m3-kotobank-ota-machi
  - text: 同書によれば、近世の太田は日光例幣使街道の宿駅（太田宿）であり、六斎市の立つ市場町として活況を呈した。
    kind: fact
    level: E3
    status: established
    sources:
    - m3-kotobank-ota-machi
  - text: 太田市観光協会によれば、大光院は慶長18年（1613）に徳川家康が先祖と仰ぐ新田義重を弔うために建立した寺で、開山の呑龍上人が貧しい家の子を養育したことから「子育て呑龍さま」と言われるようになった。
    kind: fact
    level: E4
    status: established
    sources:
    - m3-ota-kanko
  - text: 昭和23年（1948）5月3日に新田郡太田町が市制を施行して太田市となり、その後、強戸村・休泊村（1957年）、矢場川村の一部（1960年）、宝泉村（1963年4月）、毛里田村（1963年12月）を編入した。
    kind: fact
    level: E2
    status: established
    sources:
    - m3-ota-city-pdf
    - k6-kusatsu-gunma-henssen
  - text: 平成17年（2005）3月28日に太田市・尾島町・新田町・藪塚本町の1市3町が新設合併して、新しい太田市が誕生した。
    kind: fact
    level: E2
    status: established
    sources:
    - m3-ota-city-pdf
  - text: 「太田」の語源と、太田郷の初出の史料・年代は、特定できなかった。
    kind: fact
    level: E3
    status: indeterminate
    sources:
    - m3-kotobank-ota-machi
  column:
    title: 市章に受け継がれた新田氏の旗印「大中黒」
    text: 2005年の新設合併で生まれた新・太田市の市章は、この地域を治めた新田氏（新田義貞）の旗印「大中黒」をベースに、右下に市名をひらがなで配置したデザインである。太田市は、大中黒に「脈々と受け継がれる伝統と革新の精神」を表現したと説明している。中世の荘園領主の旗印が、平成の合併で生まれた市の紋章に生き続けている。
    sources:
    - m3-ota-city-pdf
  relations:
  - pref/10
  unknowns:
  - 太田郷の初出史料と年代は未確認
  - 「太田」の語源の定説は未確認（「大きな田」などの一般的な解釈を裏づける地元資料は取得できなかった）
  updated: '2026-11-13'
- id: muni/10-嬬恋村
  code: '104256'
  names:
    ja: 嬬恋村
    reading: つまごいむら
    aliases: []
  user_terms:
  - つまごい
  - 愛妻家の聖地
  - 嬬恋キャベツ
  - 万座温泉の村
  - 鎌原観音堂
  naming_type: 文献・故事から命名
  naming_note: 1889年の11か村合併に際し、日本武尊と弟橘媛の伝説にちなんで命名された新村名
  formation: 合併新設
  prefecture: 群馬県
  homonyms: []
  summary: 浅間山北麓の高原に広がり、夏秋キャベツの出荷量日本一で知られる村。明治22年（1889年）に田代・大笹・鎌原など11か村が合併して生まれた際、村名は日本武尊が亡き妻・弟橘媛を偲んで「吾嬬者耶（あづまはや）」と嘆いたという伝説に由来すると村公式が説明する、「伝説から名付けられた地名」の代表例。文献で確認できるのは1889年の命名の事実であり、伝説そのものは事実の層と分けて記録する。天明3年（1783年）の浅間山大噴火では鎌原村が壊滅的な被害を受けた。
  first_attestation:
    era: 明治22年
    year_western: 1889
    document: 町村制施行による嬬恋村の成立（1889年4月1日）
    note: 自治体名としての初出であり、命名そのもの。命名の典拠とされる日本武尊の故事は古代の文献に遡る伝承だが、「嬬恋」の地名自体は1889年に作られた
  claims:
  - text: 嬬恋村の地方公共団体コードは104256である
    kind: fact
    level: E1
    status: established
    sources:
    - b-cap-chiba-soumu-code
  - text: 明治22年（1889年）の市町村制施行に伴い、田代・大笹・干俣・大前・門貝・西窪・鎌原・芦生田・今井・袋倉・三原の11か村が合併して嬬恋村が誕生した
    kind: fact
    level: E2
    status: established
    sources:
    - w8-tsumagoi-vill-youran
    - w8-tsumagoi-gunma-arabashi
  - text: 村名「嬬恋」は、日本武尊と愛妻・弟橘媛との間の伝説に由来する、と村公式の村勢要覧は明記する。すなわち命名の典拠は歴史的事実ではなく伝説の層にある
    kind: fact
    level: E2
    status: established
    sources:
    - w8-tsumagoi-vill-youran
  - text: 日本武尊は東征の帰路、鳥居峠（碓日坂）に立ち、海神の怒りを鎮めるために海に身を投じた愛妻・弟橘媛を偲んで「吾嬬者耶（あづまはや）＝ああ、わが妻よ、恋しい」と嘆いたという。この故事にちなんで村名が付けられたと伝えられる
    kind: legend
    level: E2
    status: established
    sources:
    - w8-tsumagoi-ueda-sanada
    - w8-tsumagoi-vill-kouhou
  - text: 伝説の語られ方には揺れがあり、村観光協会は日本武尊が四阿山（吾妻山）から眼下の雲海を見て荒れる海を思い出し、亡き妻を偲んだとする形で紹介する
    kind: legend
    level: E4
    status: contested
    sources:
    - w8-tsumagoi-kankou
  - text: 「吾妻者耶」の故事は郡名「吾妻」の由来ともされるもので、村名と郡名は同じ伝説の層を共有すると紹介される
    kind: fact
    level: E5
    status: established
    sources:
    - w8-tsumagoi-kankou
  - text: 村域は中世に「三原庄」「吾妻庄」と呼ばれ、信濃源氏の末裔とされる海野氏、その一族の鎌原氏の支配下にあった、と村公式の沿革は述べる
    kind: fact
    level: E2
    status: established
    sources:
    - w8-tsumagoi-vill-intro
  - text: 天明3年（1783年）の浅間山大噴火では土石なだれが浅間山北麓を襲い、村内の鎌原村は犠牲者477名を出すなど壊滅的な被害を受けた
    kind: fact
    level: E2
    status: established
    sources:
    - w8-tsumagoi-vill-youran
    - w8-tsumagoi-vill-intro
  - text: 噴火後の鎌原では、妻を亡くした男と夫を亡くした女が新しい家族を結んで復興を図ったと語り継がれ、高台の鎌原観音堂では50段あった石段のうち35段が噴火で埋まったと伝えられる
    kind: legend
    level: E4
    status: established
    sources:
    - w8-tsumagoi-kankou
  - text: 村は「嬬恋」の名を「愛妻家の聖地」として観光に生かし、1月31日の「愛妻の日」に合わせたキャンペーンなどを行っている
    kind: fact
    level: E2
    status: established
    sources:
    - w8-tsumagoi-vill-kouhou
  column:
    title: 名前の典拠が「伝説」だと、村自身が言い切る地名
    text: 地名の由来を調べると、自治体が伝説をあたかも事実のように紹介している例は少なくありません。嬬恋村は逆で、村の公式要覧が「村名は、日本武尊と愛妻弟橘媛との間のロマンに満ちた伝説に由来するものです」とはっきり書いています。1889年、11の村が合併するにあたって人々が選んだのは、どの旧村の名前でもなく、この土地を日本武尊の妻恋いの物語と結びつける新しい名でした。伝説を根拠に名付けられた名だからこそ、村はいま「愛妻家の聖地」を名乗り、「あづまはや」と嘆いたという物語そのものを観光資源にしています。事実と伝説を分けてこそ見える、この村らしい名前の使い方です。
    sources:
    - w8-tsumagoi-vill-youran
    - w8-tsumagoi-vill-kouhou
  relations:
  - pref/10
  unknowns:
  - 日本武尊の故事を伝える『日本書紀』景行天皇条の原文は、二次資料経由の紹介にとどまり直接確認していない
  - 1889年の命名に際して他の候補名があったか、命名者が誰かは未確認
  updated: '2026-11-13'
- id: muni/10-安中市
  code: '102113'
  names:
    ja: 安中市
    reading: あんなかし
    aliases:
    - 安中町
    - 安中宿
  user_terms:
  - 安中宿
  - サムライマラソン
  - 安政遠足
  - 碓氷峠のふもと
  naming_type: 中心地名の継承
  formation: 合併新設
  prefecture: 群馬県
  homonyms: []
  summary: 群馬県西部の市で、中山道の安中宿と安中藩の城下町として栄えた。「安中」の名は中世以来この地を治めた安中氏に結びつき、戦国期の安中城の名として同時代文書に現れる。江戸時代末期の安政遠足は「日本マラソン発祥の地」の物語として今も侍マラソンに受け継がれている。1958年に市制施行し、2006年に松井田町と合併して現在の市域となった。
  first_attestation:
    era: 戦国時代
    year_western: 1556
    document: 足利義氏感状案（武州文書）
    note: 群馬県立文書館の古文書群概要が、弘治2年（1556）11月16日の感状案に「今度於上州安中城働之所」と見えると紹介するもの。原文を直接確認したものではないため、紹介として記録する
  claims:
  - text: 当地は『和名類聚抄』碓氷郡野後郷の故地とされ、『延喜式』にも東山道の駅として野後駅が見えると、群馬県立文書館の古文書群概要が紹介する
    kind: fact
    level: E2
    status: established
    sources:
    - u5-annaka-kenbunsho
  - text: 地名「安中」は、戦国期に安中忠政が当地に築城して入り、自らの姓をとって安中城としたのが始まりといわれていると『安中志』が伝え、県立文書館がその説を紹介する
    kind: fact
    level: E2
    status: contested
    sources:
    - u5-annaka-kenbunsho
  - text: 弘治2年（1556）11月16日の足利義氏感状案に「今度於上州安中城働之所」と見え、安中城の名は1550年代半ばには同時代文書に現れている（県立文書館の紹介による）
    kind: fact
    level: E2
    status: established
    sources:
    - u5-annaka-kenbunsho
  - text: 近世の記録は永禄2年（1559）に安中氏が野尻の地に城を移して安中と改めたと伝えるが、1556年の文書にすでに安中城の名が見えるため、改名の年次には食い違いがある
    kind: fact
    level: E4
    status: contested
    sources:
    - u5-annaka-localhistoria
    - u5-annaka-kenbunsho
  - text: 安中は中山道の宿場町（安中宿）であり、近世を通じて安中藩の城下町であった。藩主は井伊氏に始まり、幕末まで板倉氏が続いた
    kind: fact
    level: E4
    status: established
    sources:
    - u5-annaka-localhistoria
  - text: 安政2年（1855）、安中藩主・板倉勝明が50歳以下の家臣96人に、安中城内から中山道・碓氷峠頂上の熊野神社までの約29kmを走らせた安政遠足が行われ、その到着記録「安中御城内御諸士御遠足着帳」が残された
    kind: fact
    level: E2
    status: established
    sources:
    - u5-annaka-ansei
  - text: 1955年3月1日に安中町・原市町・磯部町・東横野村・岩野谷村・板鼻町・秋間村・後閑町が新設合併して安中町となり、1958年11月1日に市制施行して安中市となった。2006年3月18日に松井田町と新設合併して現在の安中市となった
    kind: fact
    level: E2
    status: established
    sources:
    - k6-kusatsu-gunma-henssen
  - text: 安政遠足は1955年に古文書が発見されて史実が明らかになり、1975年に第1回「侍マラソン」が開催され、現在は「安政遠足侍マラソン」として続いている
    kind: fact
    level: E2
    status: established
    sources:
    - u5-annaka-ansei
  column:
    title: 日本マラソン発祥の地――藩士の徒競走「安政遠足」
    text: 安政2年（1855）、安中藩主の板倉勝明は、心身鍛練のため50歳以下の家臣96人に安中城内から碓氷峠頂上の熊野神社まで約29kmを走らせた。神主が書き残した到着帳が昭和30年（1955）に発見され、この出来事が史実と分かった。市はこれを「日本マラソン発祥の地」とし、1975年から「侍マラソン」（現在の安政遠足侍マラソン）が続いている。城下町の名が武家の姓に由来する一方で、町のもう一つの顔はこの徒競走の記憶である。
    sources:
    - u5-annaka-ansei
  relations:
  - pref/10
  unknowns:
  - 安中氏の姓の由来そのもの（越後国新発田から移ってきたという伝承の裏づけ）は未確認
  - 地名としての「安中」が安中氏の入部以前から存在したとする新説（木部道金書状の紹介）は郷土研究レベルの確認にとどまる
  - 安中市公式サイトに市名の由来を直接説明するページは確認できなかった
  updated: '2026-11-13'
- id: muni/10-富岡市
  code: '102105'
  names:
    ja: 富岡市
    reading: とみおかし
    aliases: []
  user_terms:
  - 富岡の名前の由来
  - 富岡製糸場のある市
  - 世界遺産の製糸場のまち
  naming_type: 中心地名の継承
  formation: 合併新設
  prefecture: 群馬県
  homonyms: []
  summary: 近世の富岡町は、慶長17年（1612）に幕府代官の計画で宮崎村の住民を移住させて成立した町である。明治5年（1872）に官営富岡製糸場が置かれて名が知られ、1954年に市制、2006年に妙義町との新設合併を経て、2014年には製糸場が世界文化遺産となった。「富岡」の語源は未確定である。
  first_attestation:
    era: 慶長17年
    year_western: 1612
    document: 角川日本地名大辞典『富岡町（近世）』
    note: 幕府代官中野七蔵の計画により宮崎村の住民が小幡領瀬下郷へ移住して富岡町が成立した年。元和3年（1617）の検地帳には「小幡領富岡新田」とみえる。「富岡」の名自体がこれより遡るかは確認できていない。
  claims:
  - text: 総務省の地方公共団体コード一覧では、富岡市の団体コードは102105とされている。
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  - text: 角川日本地名大辞典によれば、近世の富岡町は慶長17年（1612）に幕府代官中野七蔵が中山道脇往還に新町を作ることを計画し、小幡領瀬下郷へ宮崎村の住民を移住させて成立した町であり、元和3年（1617）の検地帳に「小幡領富岡新田」とみえる。
    kind: fact
    level: E3
    status: established
    sources:
    - m3-jlogos-tomioka
  - text: 同書は言い伝えとして、旧城下町の系譜を持つ宮崎村の中町が富岡の上町を、宮崎村の上町が中町を形成し、瀬下郷の住民が下町を作ったという町の成り立ちを紹介している。
    kind: legend
    level: E3
    status: established
    sources:
    - m3-jlogos-tomioka
  - text: 群馬県によれば、富岡製糸場は明治5年（1872）に日本で最初の官営器械製糸工場として設立され、フランス人技師ポール・ブリュナの指導のもとで建物の建設と器械製糸技術の導入がはかられた。
    kind: fact
    level: E2
    status: established
    sources:
    - m3-gunma-tomioka-wh
  - text: 富岡市公式によれば、昭和29年（1954）4月に富岡町へ黒岩村・一ノ宮町・高瀬村・額部村・小野村が編入合併して富岡市が誕生し、次いで吉田村や丹生村などが編入された。
    kind: fact
    level: E2
    status: established
    sources:
    - m3-tomioka-keikaku
  - text: 富岡市公式によれば、平成18年（2006）3月27日に富岡市と妙義町が新設合併して、現在の富岡市が誕生した。
    kind: fact
    level: E2
    status: established
    sources:
    - m3-tomioka-keikaku
  - text: 富岡市公式によれば、平成26年（2014）6月に「富岡製糸場と絹産業遺産群」が世界文化遺産に登録され、同年12月に繰糸所・東置繭所・西置繭所の3棟が国宝に指定された。
    kind: fact
    level: E2
    status: established
    sources:
    - m3-tomioka-keikaku
  - text: 富岡市の景観計画によれば、富岡製糸場で働いた工女の当時の様子は、信州松代藩士の娘・和田英が残した『富岡日記』にみることができる。
    kind: fact
    level: E2
    status: established
    sources:
    - m3-tomioka-keikan
  column:
    title: 工女たちが技術を持ち帰ったまち
    text: 富岡製糸場は、器械製糸の技術を全国へ広めるための模範工場だった。全国から集まった工女たちはフランス人技術者から技術を学び、伝習を終えて故郷に戻ると、各地に設立された製糸工場で指導者となった。その工女の一人、和田英が残した『富岡日記』は、製糸場の暮らしを伝える貴重な記録である。富岡の名は、製糸場とともに全国へ広がった。
    sources:
    - m3-gunma-tomioka-wh
    - m3-tomioka-keikan
  relations:
  - pref/10
  - muni/10-藤岡市
  unknowns:
  - 「富岡」の語源と、1612年の町成立以前の「富岡」の用例は確認できなかった
  - 古代の甘楽郡の郷（額部・小野など）の多くは現市域に比定されるが、「富岡」の名自体は古代・中世の史料に確認できていない
  updated: '2026-11-13'
- id: muni/10-川場村
  code: '104442'
  names:
    ja: 川場村
    reading: かわばむら
    aliases: []
  user_terms:
  - かわば
  - 川場田園プラザ
  - 雪ほたかの村
  - 世田谷区民健康村
  - 田園理想郷
  naming_type: 自然地名から
  naming_note: 「川の多い場所」であることに由来すると県の市町村要覧が説明する地名。1889年の村制以来、一度も合併せず名が続く
  formation: 単独発足
  prefecture: 群馬県
  homonyms: []
  summary: 武尊山南麓の盆地に広がる農山村で、道の駅「川場田園プラザ」とブランド米「雪ほたか」で知られる。村名の由来について、群馬県の市町村要覧は「村内には源を有する一級河川が4本流れ、川の多い場所であることが村名の由来」と説明し、村公式は薄根川を「村名の由来となる川」とする。明治22年（1889年）の町村制で成立して以来、合併を経験せず今日に至る。中世には利根庄が置かれ、相模の大友氏の発祥の地とされる。
  first_attestation:
    era: 明治22年
    year_western: 1889
    document: 町村制施行による川場村の成立（1889年4月1日）
    note: 自治体名としての初出。地名「川場」そのものの文献上の初出は未確認
  claims:
  - text: 川場村の地方公共団体コードは104442である
    kind: fact
    level: E1
    status: established
    sources:
    - b-cap-chiba-soumu-code
  - text: 「川場」の名は、村内に源を有する一級河川が4本あり、各地区の山裾から武尊山の伏流水が湧き出る「川の多い場所」であることに由来する、と群馬県の市町村要覧は説明する
    kind: fact
    level: E2
    status: established
    sources:
    - w8-kawaba-gunma-arabashi
  - text: 村公式の紹介は、村内を流れる薄根川を「村名の由来となる川」と位置づける
    kind: fact
    level: E2
    status: established
    sources:
    - w8-kawaba-vill-about
  - text: 村は明治22年（1889年）4月1日の町村制施行に伴い成立し、その後合併を経験することなく現在に至っている
    kind: fact
    level: E2
    status: established
    sources:
    - w8-kawaba-gunma-arabashi
    - w8-kawaba-wiki
  - text: 村は武尊山の南麓に広がり、総面積の86パーセントを森林が占める。川場温泉など五つの温泉が村を潤す
    kind: fact
    level: E2
    status: established
    sources:
    - w8-kawaba-gunma-arabashi
    - w8-kawaba-vill-about
  - text: 平安時代にはこの地に「利根庄」が成立し、鎌倉時代にはこの地で生まれた利根姫を母に持つ相模国の大友能直の領地となったと紹介される
    kind: fact
    level: E2
    status: established
    sources:
    - w8-kawaba-mod-kikou
  - text: 村内の吉祥寺は1339年に大友氏7代氏泰が先祖発祥の地に建立した臨済宗の寺で、建長寺派の寺院の中で最も北に位置することから「建長寺の北の門」とも称される
    kind: fact
    level: E2
    status: established
    sources:
    - w8-kawaba-mod-kikou
  - text: 村は1981年に東京都世田谷区と「縁組協定」を締結し、世田谷区民健康村を受け入れるなど、都市と農村の交流の先進的な取り組みを行ってきた
    kind: fact
    level: E2
    status: established
    sources:
    - w8-kawaba-gunma-arabashi
  - text: 「川場」という地名の文献上の初出や、1889年以前にこの名が地域名としてどう使われていたかは、確認した公式資料では示されていない
    kind: fact
    level: E2
    status: indeterminate
    sources:
    - w8-kawaba-gunma-arabashi
  column:
    title: 「川の多い場所」という名前が、都会の区を呼び寄せた
    text: 川場村の名前の説明は、ひどく素直です。「川の多い場所であることが村名の由来」。村内には薄根川をはじめ4本の一級河川が流れ、武尊山の伏流水があちこちから湧きます。その「水の豊かさ」が、1981年には東京都世田谷区との「縁組協定」を結ぶ決め手にもなりました。都会の区と山村が「結婚」の言葉で結ばれるという当時としては珍しい協定で、世田谷区民健康村が村内に置かれ、区民が川場の川と田んぼに通う関係が40年以上続いています。村の名前そのものが、村の一番の資源を正確に言い当てていた例です。
    sources:
    - w8-kawaba-gunma-arabashi
    - w8-kawaba-vill-about
  relations:
  - pref/10
  unknowns:
  - 地名「川場」の文献上の初出は未確認
  - 村公式が薄根川を「村名の由来となる川」とする根拠の詳細（川場という地名と薄根川の結びつき）は公式資料に明記されていない
  updated: '2026-11-13'
- id: muni/10-明和町
  code: '105228'
  names:
    ja: 明和町
    reading: めいわちょう
    aliases:
    - 明和村
  user_terms:
  - 群馬の明和町の由来
  - 明和村から明和町になった町
  - 理想郷という意味の明和
  naming_type: 合成地名
  formation: 合併新設
  prefecture: 群馬県
  homonyms:
  - muni/24-明和町
  summary: 邑楽郡の町で、昭和30年（1955）に千江田村・梅島村・佐貫村の合併で「明和村」として誕生した。新村名は3か村への公募で決まり、「明朗にして平和なる理想郷の象徴」として選ばれた瑞祥地名である。平成10年（1998）の町制施行では慣れ親しんだ村名を残し「明和町」となった。同名の三重県明和町も公募命名だが、そちらは前身町村名の字の合成で、命名の論理が異なる。
  first_attestation:
    era: 昭和30年
    year_western: 1955
    document: 公募による「明和村」の命名（3村の合併）
    note: 名前としての初出は1955年の明和村。町としての初出は1998年10月1日の町制施行で、村名をそのまま引き継いだ
  claims:
  - text: 昭和30年（1955）、旧千江田村・梅島村・佐貫村が合併して明和村が誕生した
    kind: fact
    level: E2
    status: established
    sources:
    - h5-meiwa-gunma-koho
  - text: 新村名は3か村に公募され、応募総数は215通、村名は89種類にのぼった
    kind: fact
    level: E2
    status: established
    sources:
    - h5-meiwa-gunma-yurai
  - text: 審査の結果、「明朗にして平和なる理想郷の象徴」として「明和村」の名称が決められたと、町は由来を説明している
    kind: fact
    level: E2
    status: established
    sources:
    - h5-meiwa-gunma-yurai
  - text: 平成10年（1998）10月1日の町制施行にあたり、43年間慣れ親しんだ村名を廃止するには忍びないとして、新しい町名は「明和町」と決まった
    kind: fact
    level: E2
    status: established
    sources:
    - h5-meiwa-gunma-yurai
  - text: 共通する層として、同名の三重県明和町も1950年代の合併で新町名を公募により決めており、「公募で生まれた明和」という点は両町に共通する
    kind: fact
    level: E2
    status: established
    sources:
    - h5-meiwa-mie-rekimachi
  - text: 異なる層として、群馬の明和は特定の旧村名の字を採った合成名ではなく「明朗」「平和」という理念そのものを名にした瑞祥地名であり、また1955年から1998年まで43年間は「明和村」だった点で、発足時から町だった三重の明和町と履歴が異なる
    kind: fact
    level: E2
    status: established
    sources:
    - h5-meiwa-gunma-yurai
    - h5-meiwa-mie-weblio
  - text: 総務省の全国地方公共団体コードで、明和町の団体コードは105228と定められている
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 89種類の候補から選ばれた「理想郷」の名前
    text: 1955年の合併で新しい村の名前を決めるとき、群馬の明和は3か村の住民に公募しました。条件は、3か村に共通する感じであること、簡潔で印象が明朗なこと、新鮮味のあること。集まった215通・89種類の中から選ばれたのが「明和」で、その理由は「明朗にして平和なる理想郷の象徴」と記録されています。村名に村の理想そのものを書き込む、昭和の大合併期らしい瑞祥命名です。そして43年後、町になるときも町民はこの名を手放さず、「廃止するには忍びない」と残しました。
    sources:
    - h5-meiwa-gunma-yurai
  relations:
  - pref/10
  - muni/24-明和町
  unknowns:
  - 公募で「明和」に次ぐ候補だった村名（次点の候補）は未確認
  - 「明和村」の名称を応募したのが誰か（個人名）は未確認
  updated: '2026-11-13'
- id: muni/10-昭和村
  code: '104485'
  names:
    ja: 昭和村
    reading: しょうわむら
    aliases:
    - 久呂保村
    - 糸之瀬村
  user_terms:
  - 群馬の昭和村の由来
  - 昭和村はなぜ昭和という名前か 群馬
  - こんにゃくいもの村 昭和村
  naming_type: 新規命名
  formation: 合併新設
  prefecture: 群馬県
  homonyms:
  - muni/07-昭和村
  summary: 利根郡の村で、昭和33年（1958）11月1日に久呂保村と糸之瀬村の合併で誕生した、昭和の大合併期の村である。村名が元号「昭和」と同字であることは明らかだが、命名理由を明記した村公式・県の公的資料は確認できず、理由は未詳として残す。同名の福島県昭和村は1927年の成立で改元あやかりの命名が説明されており、対照的である。
  first_attestation:
    era: 昭和33年
    year_western: 1958
    document: 昭和村の発足（久呂保村・糸之瀬村の合併）
    note: 村名の初出は1958年の合併による命名そのもの。ただし命名理由の公的記録は未確認
  claims:
  - text: 昭和33年（1958）11月1日に久呂保村と糸之瀬村が合併して昭和村が誕生した
    kind: fact
    level: E2
    status: established
    sources:
    - h5-showa-gunma-plan
  - text: 昭和36年（1961）8月1日には、利根村の大字生越が境界変更により昭和村へ編入された
    kind: fact
    level: E2
    status: established
    sources:
    - h5-showa-gunma-plan
  - text: 前身の久呂保村は1889年（明治22年）に森下村・橡久保村・川額村の合併で、糸之瀬村は糸井村・貝野瀬村の合併で発足した村である
    kind: fact
    level: E2
    status: established
    sources:
    - h5-showa-gunma-plan
  - text: 県の市町村要覧は、昭和村の団体コードを104485、村制施行の日を昭和33年11月1日と記す
    kind: fact
    level: E2
    status: established
    sources:
    - h5-showa-gunma-youran
  - text: 村名「昭和」の命名理由は、村公式の総合計画や県の市町村要覧・市町村名変遷表には記されておらず、命名理由を明記した公的資料を確認できなかった
    kind: fact
    level: E2
    status: indeterminate
    sources:
    - h5-showa-gunma-plan
    - h5-showa-gunma-youran
  - text: 異なる層として、同名の福島県昭和村は昭和2年（1927）に成立し、「昭和時代に入って誕生した村」という改元あやかりの命名理由が公的資料で説明されるのに対し、群馬の昭和村は昭和の大合併期（1958）の成立で、理由も記録されていない
    kind: fact
    level: E2
    status: established
    sources:
    - h5-showa-fk-soka
    - h5-showa-gunma-plan
  - text: 共通する層として、両村とも合併で旧村名を継承せず、元号と同字の新名「昭和」を採った村である
    kind: fact
    level: E2
    status: established
    sources:
    - h5-showa-fk-soka
    - h5-showa-gunma-plan
  - text: 平成の大合併では、村は「自主自立の道」を選択し、合併せずに単独の村として存続した
    kind: fact
    level: E2
    status: established
    sources:
    - h5-showa-gunma-plan
  column:
    title: 「昭和の日」が、村の行事になる村
    text: 群馬の昭和村では、県の市町村要覧の行事一覧に「『昭和の日』記念イベント（4月）」が載っています。村名が元号そのものなので、4月29日の「昭和の日」が、そのまま村のアイデンティティを祝う日になるのです。こんにゃくいもの大鍋が名物のこのイベントも含め、村は「昭和」という名を積極的に使い続けています。ただし、1958年の合併時に誰がなぜこの名を選んだのかは、公表された資料ではまだ分かりません。名の使い方は華やかでも、名の由来の記録は静かです。
    sources:
    - h5-showa-gunma-youran
    - h5-showa-gunma-plan
  relations:
  - pref/10
  - muni/07-昭和村
  unknowns:
  - 村名「昭和」の命名理由・発案者・選定過程は公表資料で未確認であり、『昭和村誌』など村史の直接確認が今後の課題
  - 同名の福島県昭和村との交流事業の有無など、2つの昭和村の関係史は未確認
  updated: '2026-11-13'
- id: muni/10-東吾妻町
  code: '104299'
  names:
    ja: 東吾妻町
    reading: ひがしあがつままち
    aliases:
    - 吾妻町（2006年まで存在した前身の町）
    - 東村（2006年まで存在した前身の村）
    - 原町（1956年に吾妻町へ改称した前身の町）
  user_terms:
  - ひがしあがつま
  - あがつま峡 道の駅
  - 岩櫃城の町
  - 箱島湧水
  naming_type: 合成地名
  naming_note: 2006年の合併に際し公募で選ばれた、東村の「東」と吾妻町の「吾妻」を合わせた合成名
  formation: 合併新設
  prefecture: 群馬県
  homonyms: []
  summary: 吾妻川中流の渓谷と岩櫃山に抱かれた町。平成18年（2006年）3月27日に吾妻町と東村が合併して生まれ、新町名は公募によって、東村の「東」と吾妻町の「吾妻」を合わせた「東吾妻町」に決まった。「吾妻」の層はさらに古く、吾妻町は昭和31年（1956年）に原町が郡名「吾妻」を取って改称したもので、郡名そのものは日本武尊の「吾嬬者耶」の故事に由来するとされる伝説の層を持つ。古代の吾妻郡衙は町内の大宮・厳鼓神社付近に推定されている。
  first_attestation:
    era: 平成18年
    year_western: 2006
    document: 東村・吾妻町の新設合併による東吾妻町の発足（2006年3月27日）
    note: 自治体名としての初出であり、命名そのもの。要素である「吾妻」は古代の郡名に遡る
  claims:
  - text: 東吾妻町の地方公共団体コードは104299である
    kind: fact
    level: E1
    status: established
    sources:
    - b-cap-chiba-soumu-code
  - text: 平成18年（2006年）3月27日、吾妻郡の吾妻町と東村が新設合併して東吾妻町が誕生した
    kind: fact
    level: E2
    status: established
    sources:
    - w8-higashiagatsuma-gunma-arabashi
    - w8-higashiagatsuma-gunma-hensen1
  - text: 新町の名称は公募され、合併協議会で「東吾妻町」とすることが決まった。公募の「名付け親賞」には東村大字箱島の当時9歳の児童が抽選で選ばれた
    kind: fact
    level: E2
    status: established
    sources:
    - w8-higashiagatsuma-gappei-dayori
  - text: 「東吾妻」は、東村の「東」と吾妻町の「吾妻」を合わせた合成の名であり、合併した両町村の名の要素をともに残す形になっている
    kind: fact
    level: E2
    status: established
    sources:
    - w8-higashiagatsuma-gappei-dayori
    - w8-higashiagatsuma-gunma-hensen1
  - text: 前身の吾妻町は、昭和30年（1955年）に合併で生まれた原町が、昭和31年（1956年）2月1日に郡名を取って「吾妻町」へ改称したもので、「吾妻」の名はこの改称で自治体名に取り込まれた
    kind: fact
    level: E2
    status: established
    sources:
    - w8-higashiagatsuma-gunma-hensen1
  - text: 前身の東村は明治22年（1889年）に五町田村・箱島村・岡崎新田・奥田村・新巻村の区域をもって成立し、116年間続いた村だった
    kind: fact
    level: E5
    status: established
    sources:
    - w8-higashiagatsuma-uub-azuma
  - text: 古代の律令制下ではこの一帯は上野国吾妻郡に属し、郡の役所である郡衙は町内の大宮巖鼓神社（東吾妻町）付近に存在したと推定されている
    kind: fact
    level: E2
    status: established
    sources:
    - w8-nakanojo-town-history
  - text: 町域には戦国時代に真田氏の吾妻地方統治の拠点だった岩櫃城のあった岩櫃山がそびえ、吾妻川には国の名勝・吾妻渓谷がある
    kind: fact
    level: E2
    status: established
    sources:
    - w8-higashiagatsuma-gunma-arabashi
  - text: 郡名「吾妻」は、日本武尊が亡き妻を偲んで「吾嬬者耶」と嘆いた故事に由来すると伝えられ、隣接する嬬恋村の村名と同じ伝説の層を共有する
    kind: legend
    level: E4
    status: established
    sources:
    - w8-tsumagoi-kankou
  column:
    title: 新しい町の名前を付けたのは、9歳の「名付け親」だった
    text: 2006年の合併で生まれた東吾妻町の名前は、住民公募で決まりました。合併協議会だよりによれば、公募された名称の中から「東吾妻町」が選ばれ、その名付け親賞に輝いたのは、東村の箱島に住む当時9歳の大塚翔太君でした。東村の「東」と吾妻町の「吾妻」をつなぐという、言われてみれば明快な合成です。もっとも、その「吾妻」をたどると、原町が1956年に郡名を名乗り、郡名の由来はさらに日本武尊の妻恋いの伝説にまで遡ります。9歳の子どもが付けた名前の底には、千年を超える地名の層が重なっていたことになります。
    sources:
    - w8-higashiagatsuma-gappei-dayori
    - w8-higashiagatsuma-gunma-hensen1
  relations:
  - pref/10
  - muni/10-嬬恋村
  unknowns:
  - 公募に寄せられた他の候補名の一覧は未確認
  - 1956年に原町が「吾妻町」へ改称した際の理由の公式記録は未確認
  updated: '2026-11-13'
- id: muni/10-板倉町
  code: '105210'
  names:
    ja: 板倉町
    reading: いたくらまち
    aliases:
    - 板倉村（伊奈良村の大字となった旧村。現在の大字板倉）
  user_terms:
  - いたくらまち
  - 雷電神社の町
  - 渡良瀬遊水地の町
  - 群馬の水郷
  - なまずの町
  naming_type: 中心地名の継承
  naming_note: 1955年の4村合併・町制施行に際し、中心地である旧板倉村（伊奈良村の大字）の名を採用
  formation: 合併新設
  prefecture: 群馬県
  homonyms: []
  summary: 利根川と渡良瀬川に挟まれた低湿地の町で、関東の雷電神社の総本宮とされる雷電神社と、渡良瀬遊水地で知られる。昭和30年（1955年）2月1日に西谷田村・海老瀬村・大箇野村・伊奈良村が合併し、同時に町制を施行して板倉町となった。町名は4村のいずれでもなく、伊奈良村の大字で雷電神社の鎮座する旧板倉村の名による。「板倉」の語源については、かつて町の中央にあった板倉沼に由来すると紹介する資料がある一方、確実な説明はなく、戦国大名の板倉氏との関係を示す資料も確認できない。
  first_attestation:
    era: 昭和30年
    year_western: 1955
    document: 西谷田村・海老瀬村・大箇野村・伊奈良村の合併・町制施行による板倉町の発足（1955年2月1日）
    note: 自治体名としての初出。地名「板倉」（旧板倉村・板倉沼）の文献上の初出は未確認
  claims:
  - text: 板倉町の地方公共団体コードは105210である
    kind: fact
    level: E1
    status: established
    sources:
    - b-cap-chiba-soumu-code
  - text: 昭和30年（1955年）2月1日、西谷田村・海老瀬村・大箇野村・伊奈良村の四村が合併し、同時に町制を施行して板倉町が誕生した
    kind: fact
    level: E2
    status: established
    sources:
    - w8-itakura-town-70th
    - w8-chiyoda-gunma-hensen
  - text: 町名「板倉」は合併した4村のいずれの名でもなく、伊奈良村を構成した旧村の一つ・板倉村（現在の大字板倉）の名を引き継いだもので、町役場も大字板倉に置かれる
    kind: fact
    level: E2
    status: established
    sources:
    - w8-itakura-wiki
    - w8-chiyoda-gunma-hensen
  - text: 大字板倉には雷電神社が鎮座し、関東一円に点在する雷電神社の総本宮とされ、地元では「雷電さま」と親しまれる
    kind: fact
    level: E2
    status: established
    sources:
    - w8-itakura-town-raiden
    - w8-itakura-wiki
  - text: 雷電神社の創建は、社伝では推古天皇6年（598年）に聖徳太子によると伝えられ、かつては板倉沼・伊奈良の沼に突き出す半島や小島の上に社があった
    kind: legend
    level: E2
    status: established
    sources:
    - w8-itakura-town-raiden
    - w8-itakura-wiki
  - text: 町名「板倉」は、かつて町のほぼ中央に存在した板倉沼に由来する、と紹介する地域案内がある。ただし沼と地名のどちらが先かを含め、裏づけのある語源説は確認できていない
    kind: fact
    level: E4
    status: indeterminate
    sources:
    - w8-itakura-ryomo-walker
  - text: 町は利根川と渡良瀬川の合流域の低湿地にあり、洪水に備えて主屋より高く築かれた避難所兼倉庫「水塚」が集落に残る水郷の景観で知られる
    kind: fact
    level: E4
    status: established
    sources:
    - w8-itakura-ryomo-walker
  - text: 「板倉」の語源が戦国大名の板倉氏（京都所司代を務めた家）に由来することを示す資料は、確認した範囲では見当たらず、両者の関係は確認できない
    kind: fact
    level: E4
    status: indeterminate
    sources:
    - w8-itakura-ryomo-walker
    - w8-itakura-wiki
  column:
    title: 沼に浮かぶ島の神社が、町の名前の中心になった
    text: 板倉町の中心、大字板倉に鎮座する雷電神社は、関東各地の雷電神社の総本宮とされる古社です。今でこそ陸続きの境内ですが、かつて雷電神社は板倉沼と亥の子沼に突き出す半島の上にあり、近くの伊奈良の沼に浮かぶ小島の社だった時代の姿が伝えられます。周囲は利根川と渡良瀬川に挟まれた低湿地で、人々は洪水のたびに水に浸かりながら、水塚（みつか）と呼ばれる高台の倉庫に逃れて暮らしてきました。1955年に4つの村が合併したとき、新しい町の名前として残ったのは、この沼と神社の地「板倉」でした。水と格闘してきた土地の記憶が、そのまま町名になっています。
    sources:
    - w8-itakura-town-raiden
    - w8-itakura-wiki
    - w8-itakura-ryomo-walker
  relations:
  - pref/10
  unknowns:
  - 地名「板倉」の文献上の初出と確実な語源（板倉沼由来説の裏づけを含む）は未確認
  - 1955年の合併時に他の町名候補があったかどうかは未確認
  updated: '2026-11-13'
- id: muni/10-桐生市
  code: '102032'
  names:
    ja: 桐生市
    reading: きりゅうし
    aliases: []
  user_terms:
  - 桐生の名前の由来
  - 織物のまち桐生
  - 西の西陣、東の桐生
  naming_type: 中心地名の継承
  formation: 単独発足
  prefecture: 群馬県
  homonyms: []
  summary: 『吾妻鏡』の養和元年（1181）条に足利氏の郎党「桐生六郎」と現れるのが名の初出とされ、桐生氏の本拠・織物のまちとして発展した。1921年に山田郡桐生町が市制を施行して桐生市となった。語源は「きり＝開墾地、う＝峡谷」とする説などがあり、定説はない。
  first_attestation:
    era: 養和元年
    year_western: 1181
    document: 『吾妻鏡』
    note: 養和元年閏2月25日条に足利氏の郎党として「桐生六郎」がみえる（日本歴史地名大系・桐生市公式資料が紹介）。人名としての現れが地名の初出とされる。
  claims:
  - text: 総務省の地方公共団体コード一覧では、桐生市の団体コードは102032とされている。
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  - text: 日本歴史地名大系によれば、『吾妻鏡』養和元年（1181）閏2月25日条に足利氏の郎党として「桐生六郎」がみえ、これが桐生の名の歴史上の初出とされる。
    kind: fact
    level: E3
    status: established
    sources:
    - m3-kotobank-kiryu
  - text: 桐生市公式の歴史資料も『吾妻鏡』のこの記事を紹介し、六郎が戦功の恩賞として桐生の地を与えられたことが桐生氏の起こりであると伝える。
    kind: fact
    level: E2
    status: established
    sources:
    - m3-kiryu-fuchi
  - text: 日本歴史地名大系は語源について、「きり」は開墾地、「う」は峡谷の意で、地形から地名が付けられたという説を紹介している。
    kind: fact
    level: E3
    status: contested
    sources:
    - m3-kotobank-kiryu
  - text: Wikipediaは「桐が多く自生する土地」から「桐生」、「霧が多く発生する土地」から「霧生」とする説も挙げるが、どちらも決め手は無いとしている。
    kind: fact
    level: E5
    status: contested
    sources:
    - m3-kiryu-wiki
  - text: 日本歴史地名大系によれば、市名は近世に当地方の中心であった桐生新町、近代の桐生町に由来する。
    kind: fact
    level: E3
    status: established
    sources:
    - m3-kotobank-kiryu
  - text: 大正10年（1921）3月1日に山田郡桐生町が市制を施行して桐生市となり、県内では3番目、県東部では初の市制であった。
    kind: fact
    level: E2
    status: established
    sources:
    - m3-kiryu-nenpyo
  - text: 平成17年（2005）6月13日に勢多郡新里村・黒保根村と合併し、市域はおよそ2倍に広がった。
    kind: fact
    level: E2
    status: established
    sources:
    - m3-kiryu-nenpyo
  column:
    title: 奈良時代から続く絹のまち
    text: 桐生の織物の古さは、上野国の絹の記録にたどれる。桐生市の歴史資料によれば、『続日本紀』には和銅7年（714）に上野国が絁（あしぎぬ）を朝廷に献上した記録がある。近世に「西の西陣、東の桐生」と並び称される織物の産地になった背景には、こうした古い絹織物の伝統があった。
    sources:
    - m3-kiryu-fuchi
  relations:
  - pref/10
  unknowns:
  - 語源は「きり＝開墾地・う＝峡谷」説、桐の自生説、霧生説などが併存し、定説は確認できなかった
  - 中世の桐生郷の範囲と成立時期の詳細は未確認
  updated: '2026-11-13'
- id: muni/10-榛東村
  code: '103446'
  names:
    ja: 榛東村
    reading: しんとうむら
    aliases:
    - 桃井村（1959年まで存在した前身の村名）
  user_terms:
  - しんとう
  - 榛名山の東の村
  - 相馬原駐屯地の村
  - 県内で一番人口の多い村
  - しんとうワイナリー
  naming_type: 方位・位置による命名
  naming_note: 1959年に村名を公募し、榛名山の東という位置を表す「榛東」を採用して桃井村から改称
  formation: 合併新設
  prefecture: 群馬県
  homonyms: []
  summary: 榛名山東麓に広がり、陸上自衛隊相馬原駐屯地を擁する、群馬県で最も人口の多い村。現在の村名は古くからの地名ではなく、昭和34年（1959年）8月1日に村名を公募して採用された「榛名山の東」を意味する新しい名で、それまでは古代に遡る地名「桃井」を継ぐ桃井村だった。昭和32年（1957年）に桃井村と群馬郡相馬村大字広馬場が合併した後の改称で、位置を表す名が歴史地名に取って代わった事例である。
  first_attestation:
    era: 昭和34年
    year_western: 1959
    document: 桃井村の村名公募による「榛東村」への改称（1959年8月1日）
    note: 自治体名としての初出であり、命名そのもの。前身の地名「桃井」は藤原京出土木簡や『和名類聚抄』に見える古代の地名である
  claims:
  - text: 榛東村の地方公共団体コードは103446である
    kind: fact
    level: E1
    status: established
    sources:
    - b-cap-chiba-soumu-code
  - text: 昭和32年（1957年）、北群馬郡桃井村と群馬郡相馬村大字広馬場が合併して桃井村が誕生し、その後村名を公募して、昭和34年（1959年）8月1日に現在の村名「榛東村」となった
    kind: fact
    level: E2
    status: established
    sources:
    - w8-shinto-shokokai-keikaku
    - w8-shinto-gunma-arabashi
  - text: 「榛東」の名は、村が榛名山の東に位置することに由来する
    kind: fact
    level: E5
    status: established
    sources:
    - w8-shinto-gunma-arabashi
  - text: 1959年の改称まで村の名だった「桃井」は古代に遡る地名で、藤原京出土木簡には「上毛野国車評桃井里」から鮎が献上されたことを示す墨書があり、『和名類聚抄』にも「桃井」の地名が見える、と村教育委員会の資料は紹介する
    kind: fact
    level: E2
    status: established
    sources:
    - w8-shinto-vill-kyoiku
  - text: 鎌倉時代には承久の乱（1221年）を契機に足利系の桃井氏が桃井郷（現在の榛東村一帯）を治め、桃井城址や柳沢寺にその名残を伝える
    kind: fact
    level: E2
    status: established
    sources:
    - w8-shinto-vill-kyoiku
    - w8-shinto-gunma-arabashi
  - text: 村は榛名山の東麓に広がる都市近郊農村で、村内には陸上自衛隊の相馬原駐屯地（第12旅団司令部）があり、旅団司令部が置かれる自治体としては全国で唯一の村である
    kind: fact
    level: E3
    status: established
    sources:
    - w8-shinto-gunma-arabashi
    - w8-shinto-kotobank
  - text: 村域には茅野遺跡（国指定史跡）や高塚古墳（県指定史跡）をはじめ古墳が多く残り、『上毛古墳綜覧』編纂時には168基の古墳が確認された
    kind: fact
    level: E2
    status: established
    sources:
    - w8-shinto-vill-kyoiku
    - w8-shinto-gunma-arabashi
  - text: 改称前の「桃井村」は1889年（明治22年）の町村制で成立した村で、郡の所属は西群馬郡・群馬郡を経て1949年に北群馬郡となった
    kind: fact
    level: E5
    status: established
    sources:
    - w8-shinto-wiki
  column:
    title: 千年続いた「桃井」を捨てて、「榛名山の東」を選んだ村
    text: 榛東村の前身・桃井村の「桃井」は、藤原京の木簡に「上毛野国車評桃井里」と記され、都へ鮎を献上した記録が残るほど古い地名でした。鎌倉時代には桃井氏の本拠となり、その名は千年以上この土地に付いてきたのです。ところが1959年、村は名前を公募し、「榛東」という全く新しい名を選びました。由来は単純で、榛名山の東にあるから。歴史の重みのある旧名を置いて、誰にでも位置が分かる名を取る ― 合併と改称が相次いだ昭和の大合併期らしい、実用を選んだ命名です。いま「桃井」の名は、桃井城址や桃井小学校の名に静かに残っています。
    sources:
    - w8-shinto-vill-kyoiku
    - w8-shinto-shokokai-keikaku
  relations:
  - pref/10
  - muni/10-吉岡町
  unknowns:
  - 1959年の村名公募に寄せられた候補名や、「榛東」の名付け親は未確認
  - 「桃井」の語源そのものは未確認
  updated: '2026-11-13'
- id: muni/10-沼田市
  code: '102067'
  names:
    ja: 沼田市
    reading: ぬまたし
    aliases:
    - 渭田
    - 沼田町
  user_terms:
  - 真田の城下町
  - ぬまた
  - 天空の城下町
  - 河岸段丘のまち
  naming_type: 中心地名の継承
  formation: 単独発足
  prefecture: 群馬県
  homonyms: []
  summary: 群馬県北部の中心都市で、利根川と片品川がつくった河岸段丘の上に市街地が広がる。「沼田」の名は『和名類聚抄』に見える利根郡渭田（ぬまた）郷の遺称と考えられ、近世の城下町・沼田町がそのまま市名になった。中世以来の沼田氏、戦国末期の真田氏の城下町として知られ、1954年に市制施行した。
  first_attestation:
    era: 平安時代
    year_western: null
    document: 和名類聚抄（利根郡渭田郷）
    note: 『日本歴史地名大系』が「地名は『和名抄』にみえる利根郡渭田（ぬまた）郷の遺名と考えられる」と紹介するもの。現在と同じ「沼田」の表記の初出は未確認
  claims:
  - text: 地名「沼田」は『和名類聚抄』に見える利根郡渭田（ぬまた）郷の遺名と考えられ、市名は近世市域の中心であった城下・沼田町を継承する（『日本歴史地名大系』）
    kind: fact
    level: E3
    status: established
    sources:
    - u5-numata-kotobank
  - text: 沼田氏は鎌倉時代以来この地方の有力者であり、沼田の地は中世を通じてその本拠であった
    kind: fact
    level: E3
    status: established
    sources:
    - u5-numata-kotobank
  - text: 沼田城は天文元年（1532）に沼田氏12代・万鬼斎顕泰が蔵内（倉内）城として築城したもので、市公式はこれを「沼田市街地発祥のかなめ」とする
    kind: fact
    level: E2
    status: established
    sources:
    - u5-numata-sanada
  - text: 天正8年（1580）に武田勝頼の武将・真田昌幸が入城し、天正18年（1590）に嫡子信幸が沼田領2万7千石の初代城主となって、以後真田氏5代91年の居城となった
    kind: fact
    level: E2
    status: established
    sources:
    - u5-numata-sanada
  - text: 慶長年間に五層天守が建造されて城下町の形態が完成したが、天和元年（1681）に5代信利が改易され、翌年に城は完全に破却された
    kind: fact
    level: E2
    status: established
    sources:
    - u5-numata-sanada
  - text: 1954年4月1日に沼田町・利南村・池田村・薄根村・川田村が合併して市制施行し、2005年2月13日に白沢村・利根村を編入した
    kind: fact
    level: E2
    status: established
    sources:
    - k6-kusatsu-gunma-henssen
    - u5-numata-kotobank
  column:
    title: 「渭田」から「沼田」へ――読みは同じでも字が変わった
    text: 平安時代の『和名類聚抄』に利根郡の郷として見えるのは「渭田」で、読みは今と同じ「ぬまた」だった。やがて「沼田」の字が定着するが、いつ、なぜ字が替わったのかははっきりしない。水の多い低地を思わせる「沼」の字は、利根川と片品川に挟まれた段丘の下に広がる地形とも重なる。読みが千年以上変わらない一方で、表記だけが静かに入れ替わった地名である。
    sources:
    - u5-numata-kotobank
  relations:
  - pref/10
  unknowns:
  - 「渭田」から「沼田」への表記の切り替わりの時期と理由は未確認
  - 渭田郷の語源（「沼の多い田」の意か等）は専門辞典でも確定していない
  updated: '2026-11-13'
- id: muni/10-渋川市
  code: '102083'
  names:
    ja: 渋川市
    reading: しぶかわし
    aliases: []
  user_terms:
  - 渋川の名前の由来
  - 伊香保温泉のある市
  - 渋川市は合併でどう変わったか
  naming_type: 中心地名の継承
  formation: 合併新設
  prefecture: 群馬県
  homonyms: []
  summary: 「渋川」の名は貞和4年（1348）の懸仏にみえるのが早い用例とされる。1954年に渋川町ほか3村で市制を施行し、2006年の新設合併で伊香保温泉のある榛名山東麓から赤城山西麓までを含む大きな市域となった。新市名は公募でも「渋川市」が最多の支持を得た。語源は未確定である。
  first_attestation:
    era: 貞和4年
    year_western: 1348
    document: 懸仏の銘文
    note: 日本歴史地名大系『渋川市』が「渋川の地名は貞和四年（一三四八）の懸仏にみえるのが早い例である」とする（同書経由の紹介として記録）。
  claims:
  - text: 総務省の地方公共団体コード一覧では、渋川市の団体コードは102083とされている。
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  - text: 日本歴史地名大系によれば、渋川の地名は貞和4年（1348）の懸仏にみえるのが早い例である。
    kind: fact
    level: E3
    status: established
    sources:
    - m3-kotobank-shibukawa
  - text: 日本歴史地名大系によれば、市名は昭和29年（1954）の市制施行の際に中核となった渋川町による。
    kind: fact
    level: E3
    status: established
    sources:
    - m3-kotobank-shibukawa
  - text: 昭和29年（1954）4月1日に渋川町・古巻村・豊秋村・金島村が合併して、旧・渋川市が発足した。旧市の市域は利根川と吾妻川に沿う市の南部が中心であった。
    kind: fact
    level: E2
    status: established
    sources:
    - m3-shibukawa-hensen
  - text: 平成18年（2006）2月20日に旧渋川市・伊香保町・小野上村・子持村・赤城村・北橘村の1市1町4村が新設合併して、現在の渋川市が発足した。
    kind: fact
    level: E2
    status: established
    sources:
    - m3-shibukawa-hensen
  - text: この合併により市域は旧市の範囲を大きく超え、伊香保温泉のある榛名山東麓から、赤城山西麓・子持山方面までを含むようになった。
    kind: fact
    level: E2
    status: established
    sources:
    - m3-shibukawa-hensen
  - text: 合併協議会の資料によれば、新市の名称は公募され、応募総数2,011件のうち「渋川市」への応募が508人と最多で、そのまま新しい市名に決まった。
    kind: fact
    level: E2
    status: established
    sources:
    - m3-shibukawa-gappei
  - text: 「渋川」の語源については、参照した専門地名辞典・公的資料に定説の明示がなく、未確定である。
    kind: fact
    level: E3
    status: indeterminate
    sources:
    - m3-kotobank-shibukawa
  column:
    title: 公募で選ばれた「渋川市」と名付け親大賞
    text: 2006年の新設合併では、新しい市の名前が公募された。応募は2,011件にのぼり、最多だったのは508人が寄せた「渋川市」そのものだった。結局、新市名は旧市の名を受け継ぐことに決まり、応募者の中から「名付け親大賞」が表彰された。合併で市域が大きく姿を変えても、名前は変わらなかった珍しい例である。
    sources:
    - m3-shibukawa-gappei
  relations:
  - pref/10
  unknowns:
  - 「渋川」の語源は未確定で、市内を流れる渋川（川の名）との先後関係も出典で確認できていない
  - 貞和4年（1348）の懸仏の現物と所蔵先の確認は未実施
  updated: '2026-11-13'
- id: muni/10-片品村
  code: '104434'
  names:
    ja: 片品村
    reading: かたしなむら
    aliases:
    - 笠科（古代の郷名「笠科郷」と目される旧称）
  user_terms:
  - かたしな
  - 尾瀬の郷
  - 尾瀬の玄関口
  - 道の駅尾瀬かたしな
  - 特別豪雪地帯の村
  naming_type: 旧行政区画名の継承
  naming_note: 古代の郷名「笠科（かさしな）」の転訛と伝えられる古い地名を、1888年の合併村名として継承
  formation: 合併新設
  prefecture: 群馬県
  homonyms: []
  summary: 尾瀬の群馬県側の玄関口にあたる山村で、県の北東端、新潟・福島・栃木の3県に接する。「片品」の名は、平安時代の『和名類聚抄』に上野国利根郡の郷として見える「笠科（かさしな）」が転訛したものと村では伝えられる。明治21年（1888年）に須賀川組と越本組の12村が合併して片品村となり、以来この名が続く。村内を片品川が流れ、関東唯一の特別豪雪地帯に指定されている。
  first_attestation:
    era: 承平年間
    year_western: null
    document: 『和名類聚抄』上野国利根郡「笠科郷」
    note: 村商工会の歴史紹介が伝える記載で、原典は未読のため紹介として扱う。「笠科（かさしな）」が「片品（かたしな）」の前身とされる層であり、「片品」の表記での初出は未確認
  claims:
  - text: 片品村の地方公共団体コードは104434である
    kind: fact
    level: E1
    status: established
    sources:
    - b-cap-chiba-soumu-code
  - text: 『和名類聚抄』には上野国利根郡に「笠科郷」の記載があり、「笠科（かさしな）」が転訛して現在の「片品（かたしな）」になったと伝えられている、と片品村商工会の村史紹介は述べる
    kind: fact
    level: E4
    status: established
    sources:
    - w8-katashina-shokokai
  - text: 明治21年（1888年）、町村制の公布に伴い、連合戸長の須賀川組と越本組の12村が合併して片品村となり、明治22年（1889年）に村役場が須賀川に置かれた
    kind: fact
    level: E2
    status: established
    sources:
    - w8-katashina-vill-enkaku
    - w8-katashina-gunma-arabashi
  - text: 村は平安時代には中央に知られた集落が形成されていたと公式の沿革が述べ、平治年間（1159年）に沼田氏の所領となり、天正年間には真田氏の所領となった
    kind: fact
    level: E2
    status: established
    sources:
    - w8-katashina-vill-enkaku
  - text: 江戸時代には村内の戸倉に関所が置かれ、「入り鉄砲に出女」を取り締まる要所だったと村史紹介は伝える
    kind: fact
    level: E4
    status: established
    sources:
    - w8-katashina-shokokai
  - text: 村は群馬県の北東端に位置して新潟・福島・栃木の各県に接し、尾瀬国立公園の玄関口として知られる。主な居住地域の標高は約700〜1,000メートルで、関東で唯一の特別豪雪地帯である
    kind: fact
    level: E2
    status: established
    sources:
    - w8-katashina-sogokeikaku
    - w8-katashina-vill-enkaku
  - text: 村内を流れる片品川は尾瀬ヶ原を源流域とし、村名と同じ「片品（かたしな）」の読みを持つ。川名と地名のどちらが先かは、確認した資料では示されていない
    kind: fact
    level: E2
    status: indeterminate
    sources:
    - w8-katashina-vill-enkaku
  - text: 村は「尾瀬の郷・かたしな」を将来像に掲げ、尾瀬（特別天然記念物）や片品の猿追い祭り（国重要無形民俗文化財）を村の象徴とする
    kind: fact
    level: E2
    status: established
    sources:
    - w8-katashina-sogokeikaku
  column:
    title: 「かさしな」が「かたしな」になるまで ― 尾瀬の玄関の古い名前
    text: 片品村の名前の奥には、平安時代の辞書に載る郷の名前が隠れています。『和名類聚抄』に記された上野国利根郡の「笠科郷（かさしなごう）」が、この地の古い姿だと村では伝えられます。「かさしな」の音が長い年月の中で「かたしな」へとずれ、当てる漢字も「笠科」から「片品」へ付け替えられた、というわけです。いま「片品」の名は、尾瀬へ向かう登山者が鳩待峠や大清水へ入る玄関の名として全国に知られますが、その音の底には千年以上前の郷の名が静かに残っています。
    sources:
    - w8-katashina-shokokai
    - w8-katashina-sogokeikaku
  relations:
  - pref/10
  - muni/10-川場村
  unknowns:
  - 『和名類聚抄』の「笠科郷」の原文は直接確認しておらず、村商工会の紹介による
  - 「笠科」から「片品」への転訛の過程や、「片品」の表記の初出は未確認
  - 片品川の川名と地名「片品」の先後関係は未確認
  updated: '2026-11-13'
- id: muni/10-玉村町
  code: '104647'
  names:
    ja: 玉村町
    reading: たまむらまち
    aliases:
    - 玉村宿
  user_terms:
  - 玉村町の名前の由来
  - 龍の玉伝説の町
  - 日光例幣使道の宿場の町
  - 群馬県立女子大学のある町
  naming_type: 中心地名の継承
  formation: 合併新設
  prefecture: 群馬県
  homonyms: []
  summary: 群馬県佐波郡の町。町名は、江戸時代に日光例幣使道の宿場として栄えた中心地「玉村」の名を受け継ぎ、明治22年（1889年）の合併でそのまま町名になった。町には龍の落とした碧玉にちなむという「龍の玉伝説」が伝わるが、語源の確証はなく、水の溜まりやすい低地に由来するとする説もある。江戸初期には幕府の代官・伊奈忠次による新田開発が行われた土地でもある。
  first_attestation:
    era: 江戸時代
    year_western: null
    document: 玉村町公式「近世」にみえる日光例幣使道の宿場「玉村宿」
    note: 宿場名としての使用例の確認範囲。地名そのものの初出文書（中世以前の記録）は未確認
  claims:
  - text: 総務省の全国地方公共団体コードで、玉村町の団体コードは104647と定められている
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
    - w9-tamamura-town-kinsei
  - text: 明治22年（1889年）の町村制施行により、那波郡の福島・南玉・上飯島・上之手・角淵・下新田・上新田・与六分・斎田の9か村が合併して玉村町が成立し、新町名には江戸時代の宿場名「玉村」が採用された（地名研究の講演資料による分類）
    kind: fact
    level: E3
    status: established
    sources:
    - w9-kitagawa-gunma-chimei
  - text: 近世の玉村は、日光東照宮へ幣帛を奉納する勅使が通る日光例幣使道の宿場（玉村宿・五料宿）として栄えた
    kind: fact
    level: E2
    status: established
    sources:
    - w9-tamamura-town-kinsei
  - text: 江戸時代の初め、幕府の代官伊奈備前守忠次は家臣の協力を得て荒野に用水（代官堀＝滝川用水）を引き、新田を開発して「新田」の村を誕生させた
    kind: fact
    level: E2
    status: established
    sources:
    - w9-tamamura-town-kinsei
  - text: 町に伝わる「龍の玉伝説」では、矢川に身を投げた娘の化身である龍の玉（碧玉）を村人が拾って祀り、「龍の玉によりできた村であるため、玉村と呼ぶようになった」と語られる
    kind: legend
    level: E2
    status: established
    sources:
    - w9-tamamura-town-densetsu
  - text: 町名の語源については、利根川や烏川などの水が溜まり易い場所であったことに由来すると思われる、とする説もあるが、裏づけとなる資料は確認できていない
    kind: fact
    level: E5
    status: indeterminate
    sources:
    - w9-tamamura-wiki
  - text: 昭和30年（1955年）に玉村町と芝根村が合併し、昭和32年（1957年）に上陽村および群南村の一部と合併して、現在の玉村町のかたちになった
    kind: fact
    level: E2
    status: established
    sources:
    - w9-tamamura-town-ayumi
  column:
    title: 見ると失明する、龍の玉の箱
    text: 玉村町の満福寺には、黒塗りの二重の箱が伝わっています。中には龍の玉伝説の碧玉が入っているといわれますが、「見ると失明する」といわれ、誰も開けたことがないそうです。伝説の原話とみられる文書『玉村之故実』は玉村小学校に寄託されており、町はこの伝説を公式サイトで町の地名伝説として紹介しています。玉という字の由来を、実在するかどうか確かめられない宝物に結びつける語り方は、宿場町として栄えた玉村の人々が自分たちの名前に寄せた愛着の表れと言えるでしょう。
    sources:
    - w9-tamamura-town-densetsu
  relations:
  - pref/10
  - muni/11-伊奈町
  unknowns:
  - 「玉村」という地名そのものの初出文書（中世の記録）は未確認
  - 語源についての専門辞典（『角川日本地名大辞典』等）の見解は未確認
  - 伝説の原話『玉村之故実』の成立年は未確認
  updated: '2026-11-13'
- id: muni/10-甘楽町
  code: '103845'
  names:
    ja: 甘楽町
    reading: かんらまち
    aliases:
    - 小幡町
  user_terms:
  - 甘楽町の名前の由来
  - 小幡の城下町
  - 郡名がそのまま町名になった町
  - 楽山園のある町
  naming_type: 旧行政区画名の継承
  formation: 合併新設
  prefecture: 群馬県
  homonyms: []
  summary: 群馬県甘楽郡の町。町名は古代上野国の郡名「甘楽」をそのまま受け継いだもので、郡は8世紀初めに「甘良郡」として現れ、『和名類聚抄』では「加牟良（かむら）」と読まれた。語源は朝鮮半島からの渡来人を指す「から」の転訛とする説があるが確証はない。昭和34年（1959年）、小幡町・新屋村・福島町の一部の合併に際して郡名が町名になった。
  first_attestation:
    era: 和銅4年
    year_western: 711
    document: 『続日本紀』和銅4年条および多胡碑の碑文（「甘良郡」として）
    note: 郡名としての初出であり、町名としての初出ではない。表記は現在の「甘楽」ではなく「甘良」
  claims:
  - text: 総務省の全国地方公共団体コードで、甘楽町の団体コードは103845と定められている
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
    - w9-kanra-town-fukei
  - text: 和銅4年（711年）に建てられた多胡碑の碑文には「甘良郡」の名が見え、甘良郡・片岡郡・緑野郡の三郡から三百戸を割いて多胡郡が置かれたことが刻まれている（地名研究の講演資料が碑文を紹介）
    kind: fact
    level: E2
    status: established
    sources:
    - w9-kitagawa-gunma-chimei
  - text: 『和名類聚抄』は上野国甘楽郡の訓を「加牟良（かむら）」と示しており、現在の「かんら」とは異なる古い読みが伝えられている
    kind: fact
    level: E3
    status: established
    sources:
    - w9-kitagawa-gunma-chimei
  - text: 「甘良（かんら）」の語源については、韓からの渡来人が多く住んだことから渡来人を指す「から」が変化したとする説があり、鏑川流域に織物職人ら渡来系の人々が住んだことと結びつけて語られるが、確証はない
    kind: fact
    level: E4
    status: contested
    sources:
    - w9-mahora-gunma-nandoku
    - w9-kanra-wiki-gun
  - text: 明治22年（1889年）に北甘楽郡へ小幡町・秋畑村・福島町・新屋村が成立し、昭和25年（1950年）に北甘楽郡は甘楽郡と改称された
    kind: fact
    level: E2
    status: established
    sources:
    - w9-kanra-town-fukei
    - k6-kusatsu-gunma-henssen
  - text: 昭和30年（1955年）に小幡町と秋畑村が合併し、昭和34年（1959年）2月1日に小幡町・新屋村・福島町の一部が新設合併して、郡名をそのまま町名とする甘楽町が誕生した
    kind: fact
    level: E2
    status: established
    sources:
    - k6-kusatsu-gunma-henssen
    - w9-kanra-town-fukei
  - text: 町域の中心だった小幡は、元和元年（1615年）以降、織田信長の二男信雄の子孫が治めた小幡領の中心で、福島に御殿、小幡に城が置かれた
    kind: fact
    level: E2
    status: established
    sources:
    - w9-kanra-town-rekishi
  column:
    title: 「家に養蚕せざるなく、婦に製糸せざるなし」
    text: 甘楽町の農協支所には、大正6年（1917年）に建てられた甘楽社小幡組の由来碑があります。碑文の一節は「邑ニ養蚕セザルノ家ナク製絲セザルノ婦ナシ」――村中で養蚕をしない家はなく、製糸をしない女性はいなかった、という意味です。渡来人が多く住んで織物の技術を伝えたとされる甘楽の地は、近代には生糸の品質で全国に知られた「甘楽社」の産地になりました。古代の郡名に結びつく「から」の語源説が語られ続ける背景には、この織物の土地という記憶があるのかもしれません。
    sources:
    - w9-kanra-town-sha
    - w9-mahora-gunma-nandoku
  relations:
  - pref/10
  unknowns:
  - 「甘良」から「甘楽」への表記の定着時期は未確認
  - 「から」説以外の語源説の学術的検討は未確認
  - 1959年の合併時に郡名以外の町名候補があったかは未確認
  updated: '2026-11-13'
- id: muni/10-神流町
  code: '103675'
  names:
    ja: 神流町
    reading: かんなまち
    aliases:
    - 万場町
    - 中里村
  user_terms:
  - 神流町の名前の由来
  - 神流川の町
  - 恐竜の足跡の化石の町
  - かんなの鯉のぼりの町
  naming_type: 自然地名から
  formation: 合併新設
  prefecture: 群馬県
  homonyms: []
  summary: 群馬県多野郡の山間の町。平成15年（2003年）に万場町と中里村が合併して誕生し、町名は両町村を貫いて流れる神流川から採られた。川名は「神（カム）の川」から転じたとされ、感納川・甘奈とも綴られた。川には日本武尊が弟橘姫の遺髪を流したという「髪流川」の伝承も残る。
  first_attestation:
    era: 平成15年
    year_western: 2003
    document: 万場町・中里村合併協議会による新町名の決定（官報告示は平成15年2月3日）
    note: 町名としての初出（命名そのもの）。川名「神流川」自体の初出文書は未確認
  claims:
  - text: 総務省の全国地方公共団体コードで、神流町の団体コードは103675と定められている
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
    - w9-kanna-town-plan
  - text: 平成15年（2003年）4月1日に多野郡万場町と中里村が新設合併して神流町が誕生した
    kind: fact
    level: E2
    status: established
    sources:
    - w9-kanna-town-plan
  - text: 新町名は公募で集まった案から選ばれ、応募の上位には「神流」「万中」「神流川」「奥多野」などがあり、最終候補にも「神流」「かんな」「神流川」が残った
    kind: fact
    level: E5
    status: established
    sources:
    - w9-kanna-uub
  - text: 町名の直接の由来である神流川は、三国山に源を発し、町域を貫流して烏川に注ぐ利根川水系の川である
    kind: fact
    level: E2
    status: established
    sources:
    - w9-kanna-mlit-kanto
    - w9-kanna-town-plan
  - text: 神流川の名は「神（カム）の川」から転じたとされ、感納川・甘奈とも綴られたと、国土交通省関東地方整備局の流域資料は紹介する。また武蔵の北の果て「上」の国から流れる川の意で「カミノ川」といわれたともいう
    kind: fact
    level: E2
    status: contested
    sources:
    - w9-kanna-mlit-kanto
  - text: 『日本歴史地名大系』は神流川の別表記として神奈川・神名川・神野川を挙げ、一説に「カンナ」は砂鉄を採る「鉄穴（かんな）」の意ともいう
    kind: fact
    level: E3
    status: contested
    sources:
    - w9-kanna-kotobank-taikei
  - text: 伝承によると、日本武尊が神流川の上流で弟橘姫の遺髪を流したことから「髪流川」と呼ばれるようになったという
    kind: legend
    level: E3
    status: established
    sources:
    - w9-kanna-kotobank-taikei
  - text: 前身の一つ万場町は、明治22年（1889年）に成立した神川村が大正15年（1926年）に町制を施行する際に改称したものである
    kind: fact
    level: E2
    status: established
    sources:
    - k6-kusatsu-gunma-henssen
  column:
    title: 本能寺の変の知らせが届いた戦場
    text: 天正10年（1582年）、本能寺の変で信長が倒れた直後、上州を制圧していた滝川一益と小田原北条氏の軍勢が、現在の神流川の付近で激突しました。「神流川合戦」と呼ばれるこの戦いは北条軍の勝利に終わり、一益は上州から駆逐されます。川の名を冠した戦いとして記録されるほど、この川は既に戦国時代には土地の顔でした。また下流の上里町には江戸時代に神流川の渡し場が開かれ、上州と武蔵を結ぶ交通の節目でもありました。
    sources:
    - w9-kanna-mlit-river
  relations:
  - pref/10
  - muni/11-上里町
  unknowns:
  - 神流川の川名の初出文書は未確認
  - 旧町名「万場」の由来は未確認
  - 神川村の村名と神流川の関係（川名からの命名か）は未確認
  updated: '2026-11-13'
- id: muni/10-草津町
  code: '104264'
  names:
    ja: 草津町
    reading: くさつまち
    aliases:
