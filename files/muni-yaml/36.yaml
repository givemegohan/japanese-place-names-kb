  summary: 2005年3月1日に鷲敷・相生・上那賀・木沢・木頭の5町村が合併して発足し、所属する那賀郡の名をそのまま町名とした。那賀の名は那賀川に連なり、その源流は『日本書紀』に「奈我」「長」と書かれた「長の国」に遡ると国土交通省の河川解説が紹介する。
  first_attestation:
    era: 飛鳥時代
    year_western: 720
    document: 日本書紀
    note: 国土交通省の那賀川解説が「長の国の名称は日本書紀に奈我、長などと書かれた」と紹介するもの。原文を直接確認したわけではないため、関連する主張はE2に格下げて記録する。
  claims:
  - text: 地方公共団体コードは363685である
    kind: fact
