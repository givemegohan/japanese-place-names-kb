  - くそうづとは何か
  - 草津温泉は誰が発見したの
  - 草津町はいつできたの
  naming_type: 中心地名の継承
  naming_note: 温泉地の地名「草津」を継承し、草津村の分割で町制を施行
  formation: 分村・分立
  prefecture: 群馬県
  homonyms: []
  summary: 草津の古い呼び名は「くそうづ」で、「草津」のほか「九草津」「草生津」「九相津」とも書かれた。地名研究では、硫化水素の強い臭気を持つ泉、すなわち「臭い泉」の意味とする説が有力である。温泉の発見については源頼朝・行基・日本武尊の三つの伝承が並び立つ。町としては1900年、草津村の分割によって大字草津・前口が草津町となった。
  first_attestation:
    era: 文明18年
    year_western: 1486
    document: 堯恵「北国紀行」
    note: 「草津の温泉」という記述がみえる用例を日本歴史地名大系ジャーナルが紹介するもの。現在も現地では温泉地を「くさづ」と呼ぶ
  claims:
  - text: 地名「草津」の古い形は「くそうづ」で、「草津」のほか「九草津」「草生津」「九相津」とも記され、現在も現地では温泉地を「くさづ」と呼ぶと日本歴史地名大系ジャーナルは紹介する（地方公共団体コードは104264）
    kind: fact
    level: E3
    status: established
    sources:
    - k6-kusatsu-japanknowledge
    - b-cap-chiba-soumu-code
  - text: 語源については、萩原進『草津温泉史』が湯の硫化水素の臭気によるものとし、谷川健一編『地名の話』も湧水を指す「そうず」の語から「くそうず」すなわち「臭い泉」の意味であるとするなど、「臭い泉」説が地名研究では有力である
    kind: fact
    level: E3
    status: established
    sources:
    - k6-kusatsu-japanknowledge
  - text: 同じ「草生津」の表記は全国各地にみられ、石油や炭化水素の臭気に結びついた地名が多いことも、「臭い泉」説を補強すると同ジャーナルは指摘する
    kind: fact
    level: E3
    status: established
    sources:
    - k6-kusatsu-japanknowledge
  - text: 文献の上では、文明18年（1486年）の堯恵『北国紀行』に「草津の温泉」がみえ、明応4年（1495年）の『松陰私語』にも用例がある
    kind: fact
    level: E3
    status: established
    sources:
    - k6-kusatsu-japanknowledge
  - text: 温泉の発見をめぐっては、行基菩薩が発見したとする光泉寺の縁起や、文治元年（1185年）に源頼朝が発見したとする『草津温泉来由記』の伝承が伝えられている
    kind: legend
    level: E3
    status: contested
    sources:
    - k6-kusatsu-japanknowledge
    - k6-kusatsu-kanko
  - text: 草津温泉観光協会は、日本武尊が病を癒すために温泉を発見したという伝承を紹介している
    kind: legend
    level: E4
    status: contested
    sources:
    - k6-kusatsu-kanko
  - text: 1900年（明治33年）7月1日、草津村が分割され、大字草津・大字前口の区域をもって草津町が発足した（残りの区域は六合村となった）と群馬県の変遷表は記録する
    kind: fact
    level: E2
    status: established
    sources:
    - k6-kusatsu-gunma-henssen
  column:
    title: 冬は村を捨てて下山した温泉町——「冬住み」の慣習
    text: 海抜1,200メートル。草津の冬はあまりに厳しく、江戸から明治にかけての温泉場の人々は、冬になると麓の小雨村へ移り住む「冬住み」を続けた。この慣習が終わったのは1897年（明治30年）のことだという。硫黄の臭いのする湯の恵みと、暮らしを町ごと引っ越しさせるほどの寒さ。その両方が「くそうづ（臭い泉）」という名の土地の素顔だった。
    sources:
    - k6-kusatsu-japanknowledge
  relations:
  - pref/10
  unknowns:
  - 「くそうづ」の初出とされる中世以前の文献用例は、確認できた範囲では室町時代が最古であり、それ以前は未確認
  - 草津温泉が「日本三名泉」に数えられる典拠（林羅山の選定）の一次確認は未了のため主張に含めていない
  updated: '2026-11-13'
- id: muni/10-藤岡市
  code: '102091'
  names:
    ja: 藤岡市
    reading: ふじおかし
    aliases:
    - 富士岡
    - 常が岡
  user_terms:
  - 藤岡の名前の由来
  - 高山社跡のある市
  - 富岡と藤岡はどう違うか
  naming_type: 中心地名の継承
  formation: 編入合併
  prefecture: 群馬県
  homonyms: []
  summary: 中世の藤岡は「常が岡」と呼ばれ、富士浅間神社の創建を機に「富士岡」、のちに「藤岡」になったと伝えられる。1954年の市制施行と2006年の鬼石町との合併を経て現在に至る。近代養蚕法「清温育」の発祥地である高山社跡は、世界遺産「富岡製糸場と絹産業遺産群」の構成資産である。
  first_attestation:
    era: 永享年間（15世紀前半）
    year_western: null
    document: 『続太平記』
    note: 日本歴史地名大系『藤岡町』は、永享の乱に際して上杉憲実が藤岡などに陣を張ったと『続太平記』にあることを紹介する。それ以前は「常が岡（常ヶ岡）」と呼ばれたと縁起書が伝える。
  claims:
  - text: 総務省の地方公共団体コード一覧では、藤岡市の団体コードは102091とされている。
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  - text: 藤岡市の文化財保存活用地域計画によれば、古代の上野国緑野郡はほぼ現在の藤岡市にあたり、その名は『和名類聚抄』にもみえる。
    kind: fact
    level: E2
    status: established
    sources:
    - m3-fujioka-bunkazai
  - text: 同計画は、「緑野」の由来について、水が集まる平野という意味の「水の処野（みどの）」と呼ばれたところに「緑野」の字が当てられたと伝えられると記している。
    kind: fact
    level: E2
    status: indeterminate
    sources:
    - m3-fujioka-bunkazai
  - text: 日本歴史地名大系によれば、享和3年（1803）の富士浅間神社縁起書には、文応元年（1260）に日蓮が常が岡鮭塚に経を納め、富士山の分霊を勧請して鎮守として以来、この地は「富士岡」と称したという話が記されている。
    kind: legend
    level: E3
    status: established
    sources:
    - m3-kotobank-fujioka-machi
  - text: 日本歴史地名大系によれば、『続太平記』には永享の乱で上杉憲実が平井城攻めにあたり藤岡などに陣を張ったとあり、15世紀には「藤岡」の名が用いられていた。
    kind: fact
    level: E3
    status: established
    sources:
    - m3-kotobank-fujioka-machi
  - text: 「富士岡」が隣の「富岡」と紛らわしかったため、「富士」の字を「藤」に改めて「藤岡」になったという説がある。
    kind: fact
    level: E4
    status: contested
    sources:
    - m3-fujioka-gogen
  - text: 昭和29年（1954）4月1日に藤岡町・神流村・小野村・美土里村・美九里村が合併して市制を施行し、翌1955年3月1日に平井村・日野村を編入した。
    kind: fact
    level: E2
    status: established
    sources:
    - m3-fujioka-gaiyo
  - text: 平成18年（2006）1月1日に鬼石町と合併し、現在の藤岡市となった。
    kind: fact
    level: E2
    status: established
    sources:
    - m3-fujioka-gaiyo
  - text: 藤岡市公式によれば、高山社跡は「富岡製糸場と絹産業遺産群」の構成資産の一つとして、平成26年（2014）6月25日に世界文化遺産となった。
    kind: fact
    level: E2
    status: established
    sources:
    - m3-fujioka-kankyou
  column:
    title: 清温育と高山長五郎
    text: 藤岡は、近代養蚕法「清温育」の発祥の地である。高山長五郎は蚕の飼育の温度管理を体系化した清温育を確立したと伝えられ、1884年には養蚕改良高山社を組織して全国に門下を広げた。その拠点だった高山社跡は、富岡製糸場とともに世界遺産に登録されている。製糸場のある富岡市と、蚕種と飼育法の改良を担った藤岡市は、絹産業遺産群の中で対をなす存在である。
    sources:
    - m3-fujioka-takayama
    - m3-fujioka-kankyou
  relations:
  - pref/10
  - muni/10-富岡市
  unknowns:
  - 「藤岡」の語源は富士浅間神社由来説が有力とされるが、市公式の見解としては確認できていない
  - 常が岡から富士岡への改称の時期は、縁起書の伝承に基づくもので史料的な裏づけは弱い
  updated: '2026-11-13'
- id: muni/10-邑楽町
  code: '105252'
  names:
    ja: 邑楽町
    reading: おうらまち
    aliases:
    - 中島村
    - 中野村
    - 高島村
  user_terms:
  - 邑楽町の名前の由来
  - おうらと読む難読の町
  - 多々良沼に白鳥が来る町
  - 郡名がそのまま町名になった町
  naming_type: 旧行政区画名の継承
  formation: 改称
  prefecture: 群馬県
  homonyms: []
  summary: 群馬県邑楽郡の町。町名は古代上野国の郡名「邑楽」を、昭和32年（1957年）の改称で受け継いだ。郡の古名は藤原京出土木簡に残る「大荒木」で、『和名類聚抄』の訓は「於波良岐（おはらき）」――現在の「おうら」はその音が転じたものと考えられる。郡名としては神護景雲3年（769年）の『続日本紀』に見える古い地名である。
  first_attestation:
    era: 神護景雲3年
    year_western: 769
    document: 『続日本紀』神護景雲3年4月27日条（「邑楽郡」の初出として『日本歴史地名大系』が紹介）
    note: 郡名としての初出。ただし藤原京出土木簡には古名「大荒木評」が見え、郡の成立自体はこれより遡る
  claims:
  - text: 総務省の全国地方公共団体コードで、邑楽町の団体コードは105252と定められている
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
    - w9-ora-gunma-aramashi
  - text: 『日本歴史地名大系』によれば、「邑楽郡」という地名の初出は『続日本紀』神護景雲3年（769年）4月27日条である
    kind: fact
    level: E2
    status: established
    sources:
    - w9-ora-kotobank-taikei
  - text: 藤原京出土の木簡に「大荒木評」と記されたものがあり、これが邑楽郡の古名であり、同時に古代の読みをも示唆していると『日本歴史地名大系』は説明する
    kind: fact
    level: E2
    status: established
    sources:
    - w9-ora-kotobank-taikei
  - text: 『和名類聚抄』が邑楽郡の訓として示すのは「於波良岐（おはらき）」で、現在の「おうら」という読みは後世の転訛と考えられる。「邑楽」の二字自体は和銅6年（713年）の好字二字令で整えられた郡名とされる
    kind: fact
    level: E3
    status: inferred
    sources:
    - w9-kitagawa-gunma-chimei
    - w9-mahora-gunma-nandoku
  - text: 天正20年（1592年）の検地帳にはなお「大荒木郡」と記されたものが残されており、「おおあらき／おはらき」の読みが近世初頭まで生きていたと地名解説資料は伝える
    kind: fact
    level: E4
    status: established
    sources:
    - w9-mahora-gunma-nandoku
  - text: 現在の町域は、昭和30年（1955年）に中野村と高島村が合併して中島村となり、昭和31年（1956年）に旧長柄村の区域を編入、昭和32年（1957年）1月1日に中島村が郡名を採って邑楽村と改称し、昭和43年（1968年）4月1日に町制を施行して邑楽町となった
    kind: fact
    level: E2
    status: established
    sources:
    - k6-kusatsu-gunma-henssen
    - w9-ora-gunma-aramashi
  - text: 郡域は利根川と渡良瀬川の合流部にあたる低湿地で、『和名類聚抄』の郷名にも池田・疋太・八田など低地を意味するものが多く、古くから池沼が散在していたと『日本歴史地名大系』は指摘する
    kind: fact
    level: E3
    status: established
    sources:
    - w9-ora-kotobank-taikei
  column:
    title: 「おうら」と読めるようになるまで、1300年
    text: 邑楽という字面を見て「おうら」と読める人は、地元の人以外にはまずいません。古代、この郡は「大荒木（おおあらき）」と呼ばれ、藤原京の木簡にその名が残ります。平安時代の『和名類聚抄』では「おはらき」と読まれ、戦国時代の検地帳にもまだ「大荒木郡」の文字がありました。それがいつしか音が縮まって「おうら」になり、漢字のほうは713年の好字二字令で整えられた「邑楽」が残った――つまりこの町名は、音のほうが1300年かけて旅をし、字のほうが古代に固定された、珍しい組み合わせなのです。
    sources:
    - w9-ora-kotobank-taikei
    - w9-mahora-gunma-nandoku
    - w9-kitagawa-gunma-chimei
  relations:
  - pref/10
  unknowns:
  - 「大荒木」の語源（荒木＝未開墾地の意か等）は未確認
  - おはらきから「おうら」への音変化がいつ頃起きたかは未確認
  - 1957年の改称時に郡名以外の候補があったかは未確認
  updated: '2026-11-13'
- id: muni/10-長野原町
  code: '104248'
  names:
    ja: 長野原町
    reading: ながのはらまち
    aliases:
    - 長野原宿
  user_terms:
  - 長野原町の名前の由来
  - 長野県の長野とは別の町
  - 八ッ場ダムの町
  - 草津温泉への入口の町
  naming_type: 中心地名の継承
  formation: 合併新設
  prefecture: 群馬県
  homonyms: []
  summary: 群馬県吾妻郡の町。名は草津街道の宿場町だった中心集落「長野原」を受け継ぎ、明治22年（1889年）の町村制以来、町域はほぼ変わっていない。長野県・長野市とは無関係で、「長野」の部分をめぐっては河岸段丘の地形に由来する説のほか、戦国時代の箕輪城主・長野業盛の一族が落ち延びたという伝承などがあり、語源は定まっていない。
  first_attestation:
    era: 永禄6年
    year_western: 1563
    document: 長野原合戦の記録（町内諏訪神社の由緒として伝わる）
    note: 戦いの名としての使用例であり、地名の命名文書ではない。地名そのものの初出は未確認
  claims:
  - text: 総務省の全国地方公共団体コードで、長野原町の団体コードは104248と定められている
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
    - w9-naganohara-town-about
  - text: 明治22年（1889年）の町村制施行により、近隣の1町9村が合併して現在の長野原町が誕生した。その後、平成16年（2004年）の合併協議会は解散となり、町は単独存続の道を選んだ
    kind: fact
    level: E2
    status: established
    sources:
    - w9-naganohara-town-about
  - text: 中心集落の長野原は、草津温泉・川原湯温泉への湯治客や善光寺への参詣者が行き交う交通の要衝で、草津街道と信濃支道（上田街道）の分岐点の宿場町として発展し、六歳市が開かれた
    kind: fact
    level: E2
    status: established
    sources:
    - w9-naganohara-town-about
    - w9-naganohara-kusatsu-kaido
  - text: 「長野原」の語源については、吾妻川と白砂川の合流部にできた河岸段丘が横長だったことに由来するとする説があるが、出典の裏づけは弱い
    kind: fact
    level: E4
    status: indeterminate
    sources:
    - w9-naganohara-jinja-suwa
  - text: 戦国時代、上野国箕輪城を支配した長野業盛が武田信玄に攻められて落城したのち、その一族が落ち延びてこの地に隠棲したので「長野原」の地名になったという伝承がある
    kind: legend
    level: E4
    status: established
    sources:
    - w9-naganohara-jinja-suwa
  - text: 逆に、平安時代に長野氏一族の先祖である在原業重が上野国司に任じられて赴任する際に長野原に住んだことから、長野氏を名乗るようになったという、名の生まれる向きが逆の伝承も伝えられている
    kind: legend
    level: E4
    status: established
    sources:
    - w9-naganohara-jinja-suwa
  - text: 永禄6年（1563年）には長野原合戦が行われ、町内の諏訪神社の境内はその古戦場跡とされる
    kind: fact
    level: E4
    status: established
    sources:
    - w9-naganohara-jinja-suwa
  column:
    title: 名が先か、人が先か
    text: 長野原の「長野」をめぐる二つの伝承は、面白いことに矢印の向きが正反対です。一つは、箕輪城の長野業盛の一族が落ち延びてきたから、この地が長野原と呼ばれるようになったという話。もう一つは、在原業重がこの地に住んだからこそ、子孫が「長野」を名乗るようになったという話。地名が人を名付けたのか、人が地名を名付けたのか。どちらの伝承も史料の裏づけは乏しいものの、「長野」という名がこの土地と古く結びついていたことを、人々が物語で説明しようとした跡として読むことができます。
    sources:
    - w9-naganohara-jinja-suwa
  relations:
  - pref/10
  unknowns:
  - 「長野原」の地名そのものの初出文書は未確認
  - 河岸段丘の地形説を述べる町史等の資料は未確認
  - 1889年合併時の旧1町9村の内訳と、町名決定の経緯は未確認
  updated: '2026-11-13'
- id: muni/10-館林市
  code: '102075'
  names:
    ja: 館林市
    reading: たてばやしし
    aliases:
    - 立林
  user_terms:
  - 館林の名前の由来
  - 尾曳城の狐の伝説
  - つつじのまち館林
  naming_type: 中心地名の継承
  formation: 合併新設
  prefecture: 群馬県
  homonyms: []
  summary: 15世紀の史料に「立林城」などと現れる城下町で、狐が尾を曳いて縄張りを案内したという尾曳城の伝説で知られる。1954年に館林町と7村が合併して市制を施行し、以後は合併を行っていない。「館林」の語源については定説がない。
  first_attestation:
    era: 文明3年
    year_western: 1471
    document: 館林城に関する最古の史料（市の歴史文化基本構想）
    note: 市の基本構想は館林城の最古の史料を文明3年（1471）とする。一方で『鎌倉大草紙』応永22年（1415）条に館林の記事があるとする紹介もあり、初出の確定には原典の確認を要する。
  claims:
  - text: 総務省の地方公共団体コード一覧では、館林市の団体コードは102075とされている。
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  - text: 館林市公式は、「館林の名が古文書に初めて出てくるのは15世紀の中頃である」としている。
    kind: fact
    level: E2
    status: established
    sources:
    - m3-tatebayashi-intro
  - text: 館林市の歴史文化基本構想は、館林城に関する最古の史料を文明3年（1471）のものとし、この頃の城は「立林城」とも書かれた。
    kind: fact
    level: E2
    status: established
    sources:
    - m3-tatebayashi-bunka
  - text: Wikipediaは、『鎌倉大草紙』の応永22年（1415）条に上杉禅秀が館林を討った記事があるとし、表記には館林・立林、読みには「たてばやし」と「たちばやし」のゆれがあって永禄年間以降に現在の形に定まったとする。
    kind: fact
    level: E5
    status: contested
    sources:
    - m3-tatebayashi-wiki
  - text: 館林城の築城時期や築城者を明記した当時の記録は発見されておらず、赤井照光による築城は江戸時代になって書かれたものにみえる話が、狐の尾曳伝説と相まって広く知られている。
    kind: fact
    level: E2
    status: established
    sources:
    - m3-tatebayashi-bunka
  - text: 伝説では、大袋城主の赤井照光が子狐を助けたところ、親狐が報恩に現れて尾を曳いて城の縄張りを案内し、その通りに築いた城が尾曳城（館林城）であると語られる。
    kind: legend
    level: E2
    status: established
    sources:
    - m3-tatebayashi-satonuma
  - text: 昭和29年（1954）4月1日に館林町・郷谷村・大島村・赤羽村・六郷村・三野谷村・多々良村・渡瀬村が合併して館林市が発足し、以後、市町村合併は行われていない。
    kind: fact
    level: E2
    status: established
    sources:
    - m3-tatebayashi-shiryo
  - text: 「館林」の語源については、市公式の定説はなく、も確定できなかった。
    kind: fact
    level: E2
    status: indeterminate
    sources:
    - m3-tatebayashi-intro
  column:
    title: 狐が残した三つの稲荷
    text: 尾曳伝説の舞台には、今も狐にまつわる稲荷社が残る。尾曳稲荷神社のほか、狐が初めて尾を引き出した地とされる初引稲荷（初曳稲荷）、夜明けにまつわる夜明稲荷があり、市は日本遺産「里沼」の物語の一つとしてこの伝説を伝えている。築城の史実とは別に、伝説のほうもまた地名の記憶として生き続けている。
    sources:
    - m3-tatebayashi-satonuma
  relations:
  - pref/10
  unknowns:
  - 初出は『鎌倉大草紙』応永22年（1415）条とする紹介と、城の最古史料を文明3年（1471）とする市の基本構想があり、性格の異なる2つの「初出」を原典で確定するには至っていない
  - 「館林」の語源の定説は未確認
  updated: '2026-11-13'
- id: muni/10-高山村
  code: '104281'
  names:
    ja: 高山村
    reading: たかやまむら
    aliases: []
  user_terms:
  - 高山村 群馬 合成地名
  - 中山と尻高の村
  - 三国街道の宿場の村
  naming_type: 合成地名
  formation: 合併新設
  prefecture: 群馬県
  homonyms:
  - muni/20-高山村
  summary: 明治22年（1889年）に中山村と尻高村が合併して生まれた村で、村名は尻高の「高」と中山の「山」を合わせた合成地名である。長野県にも高山村があり、そちらも合成地名だが、材料は高井村と山田村で、字面の一致は偶然である。旧村名は現在の大字「中山」「尻高」に残る。
  first_attestation:
    era: 明治22年
    year_western: 1889
    document: 町村制施行による高山村の誕生（1889年4月1日）
    note: 自治体名としての初出（合併時の合成地名）
  claims:
  - text: 明治22年（1889年）4月1日、西群馬郡の尻高村と中山村が合併して高山村が誕生した（明治29年に吾妻郡へ編入）
    kind: fact
    level: E2
    status: established
    sources:
    - h6-takayama-gunma-official
    - h6-takayama-gunma-pref
  - text: 地名研究の講演資料（北川和秀）は、明治22年の群馬県の新地名の分類で高山村を「合併した町村名を合成」した例に挙げ、「尻高と中山の各一字をとって合成したもの」と説明する
    kind: fact
    level: E3
    status: established
    sources:
    - h6-takayama-gosei-kitagawa
  - text: 合成地名の一覧資料でも、群馬県吾妻郡高山村は「尻高村＋中山村」の合成地名として挙げられている
    kind: fact
    level: E5
    status: established
    sources:
    - h6-takayama-gosei-list
  - text: 長野県の高山村も合成地名という点は共通するが、材料は高井村の「高」と山田村の「山」で、群馬側の尻高・中山とは無関係である（共通する層＝合成地名という命名方式、異なる層＝元の村名）
    kind: fact
    level: E5
    status: established
    sources:
    - h6-takayama-gosei-list
    - h6-takayama-nagano-wiki
  - text: 合併前の旧村名は、現在の大字「中山」「尻高」として村内に残っている
    kind: fact
    level: E2
    status: established
    sources:
    - h6-takayama-gunma-pref
  - text: 村は近世に越後と江戸を結ぶ三国街道の宿場として栄えた土地で、繁栄は街道が廃止される明治初期まで続いた
    kind: fact
    level: E2
    status: established
    sources:
    - h6-takayama-gunma-official
  column:
    title: 「足して二で割る」合成地名
    text: 明治22年の大合併では、新しい村名の付け方にいくつかの型がありました。地名研究者はその一つを「足して二で割る」方式と呼びます。高山村はその典型で、尻高の「高」と中山の「山」を一字ずつ取って「高山」。隣の県の長野県高山村も、高井の「高」と山田の「山」で同じ結果になりました。作り方は同じでも材料が違えば別の村――二つの高山村は、明治の命名の型そのものを比べられる好例です。
    sources:
    - h6-takayama-gosei-kitagawa
    - h6-takayama-gosei-list
  relations:
  - pref/10
  - muni/20-高山村
  unknowns:
  - 合成の際に「高山」の字順・読みを決めた経緯の記録は未確認
  - 「中山」「尻高」という旧村名自体の語源は未調査
  updated: '2026-11-13'
- id: muni/10-高崎市
  code: '102024'
  names:
    ja: 高崎市
    reading: たかさきし
    aliases:
    - 和田
    - 高崎町
    - 高崎城
  user_terms:
  - 高崎市の名前の由来
  - 高崎は誰が名付けたのか
  - 高崎城と井伊直政
  - 金井沢碑とは
  naming_type: 新規命名
  formation: 単独発足
  prefecture: 群馬県
  homonyms: []
  summary: 「高崎」は慶長3年（1598）に井伊直政が高崎城を築いたときに生まれた地名である。それまで和田と呼ばれていた土地を、直政は「松カ崎」と改めようとしたが、竜広寺の住職白菴が「成功高大」の意味から「高崎」を進言して採用されたと市は伝える。城下町の名として定着し、1900年に市制を施行した。
  first_attestation:
    era: 慶長3年
    year_western: 1598
    document: 高崎城の築城に伴う命名（高崎市文化財情報「高崎城址」）
    note: 和田と呼ばれていた土地への命名そのもの。「成功高大」の字義を込めた命名と市は説明する
  claims:
  - text: 慶長3年（1598）、箕輪城主井伊直政は徳川家康の命令により、かつて和田氏の和田城があった地に高崎城を新たに築き、箕輪城より移転した
    kind: fact
    level: E2
    status: established
    sources:
    - l2-takasaki-castle
  - text: 築城にあたって直政は、当時和田と呼ばれていた地名を「松カ崎」と改めようとして竜広寺の住職白菴に相談した。白菴は諸木には栄枯があることを説き、「成功高大」の意味から「高崎」と名づけるように進言し、これが採用されて「高崎」の地名が誕生したと高崎市は伝える
    kind: fact
    level: E2
    status: established
    sources:
    - l2-takasaki-castle
  - text: 城下町は箕輪城下から移された寺院や町（連雀町・田町など）とともに整備され、高崎城の完成は元和5年（1619）に入城した安藤重信ら安藤氏3代によるといわれる
    kind: fact
    level: E2
    status: established
    sources:
    - l2-takasaki-castle
  - text: 市域の山名町には、神亀3年（726）に豪族三家氏が建てた金井沢碑があり、碑文には上野国群馬郡下賛郷高田里に住んだ一族の名が刻まれている。上野三碑の一つで特別史跡に指定されている
    kind: fact
    level: E2
    status: established
    sources:
    - l2-takasaki-kanaizawa
  - text: 明治33年（1900）4月1日、群馬郡高崎町が市制を施行して高崎市が誕生した
    kind: fact
    level: E5
    status: established
    sources:
    - l2-gunma-hensei
  - text: 総務省の全国地方公共団体コードで、高崎市の団体コードは102024と定められている
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 「松カ崎」になるはずだった城下町
    text: 高崎城を築いた井伊直政は、松の字を入れた「松カ崎」という名を考えていました。それを止めたのは竜広寺の住職白菴です。木には栄える時も枯れる時もある、というのがその理由で、代わりに勧めたのが「成功高大」の願いを込めた「高崎」でした。松は城下の景観としては魅力的でも、枯れる木に町の将来を託すのは縁起が悪い、というわけです。直政はこの進言を受け入れ、1598年に「高崎」という地名が生まれました。ただしこれは市が文化財解説で伝える命名譚であり、同時代の記録で裏付けられた話ではありません。その断りを含めて、戦国大名と僧侶の問答から生まれた地名として記憶されています。
    sources:
    - l2-takasaki-castle
  relations:
  - pref/10
  unknowns:
  - 白菴の進言による命名は市の文化財情報が伝える話で、同時代史料での裏付けは確認できていない
  - 1598年以前に「高崎」の用例があったかどうかは、専門の地名辞典まで確認できていない
  updated: '2026-11-13'
