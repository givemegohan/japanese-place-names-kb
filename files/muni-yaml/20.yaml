  naming_type: 合併新設（大河原村と鹿塩村の頭文字を繋いだ合成名）
  prefecture: 長野県
  homonyms: []
  summary: 南アルプス西麓の山村。明治初期に大河原村と鹿塩村が合併した際、両村の頭文字「大」と「鹿」を繋いで「大鹿村」となった合成地名で、大きな鹿に由来する名ではない。合併年には村公式の1874年説と、新聞・百科事典の1875年説の相違がある。村の真ん中を中央構造線が貫き、大鹿歌舞伎で知られる。
  first_attestation:
    era: 明治7〜8年
    year_western: null
    document: null
    note: 村名「大鹿」の初出は大河原村・鹿塩村の合併による発足時。合併年は村公式が明治7年（1874年）とし、信濃毎日新聞・Wikipediaは明治8年（1875年）とする相違があるため年は確定できない
  claims:
  - text: 村名「大鹿」は、大河原（おおかわら）村と鹿塩（かしお）村が合併した際に両村の頭文字をとって繋いだ合成地名であり、大きな鹿に由来する名ではない
    kind: fact
    level: E4
    status: established
    sources:
    - v11-ooshika-shinmai
  - text: 初回の合併年について、村公式の沿革は明治7年（1874年）とする一方、信濃毎日新聞の地名コラムとWikipediaは明治8年（1875年）（Wikipediaは1月23日）とし、一年の相違がある
    kind: fact
    level: E2
    status: contested
    sources:
    - v11-ooshika-vill-enkaku
    - v11-ooshika-shinmai
  - text: 明治15年（1882年）に大河原村と鹿塩村に分村したが、明治22年（1889年）に再び合併して現在の大鹿村となった
    kind: fact
    level: E2
    status: established
    sources:
    - v11-ooshika-vill-enkaku
  - text: 中央構造線が村の真ん中を貫いており、大鹿村の北川露頭・安康露頭は国の天然記念物に指定され、断層岩は村の字名から「鹿塩マイロナイト」と呼ばれる
    kind: fact
    level: E2
    status: established
    sources:
    - v11-ooshika-bunka-db
  - text: 鹿塩の谷沿いでは塩水が湧き、今も山塩が採られている
    kind: fact
    level: E4
    status: established
    sources:
    - v11-ooshika-shinmai
  - text: 大鹿歌舞伎は2017年（平成29年）に、地芝居の分野では全国で初めて国の重要無形民俗文化財に指定された
    kind: fact
    level: E2
    status: established
    sources:
    - v11-ooshika-utsukushii
  - text: 鹿塩の谷で生まれた猫には、その猫一代は蚤がつかない、という言い伝えが村の七不思議の一つとして伝わっている
    kind: legend
    level: E5
    status: established
    sources:
    - v11-ooshika-wiki
  - text: 大鹿村の地方公共団体コードは204170である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 鹿はいても、いなかった
    text: 「大鹿」と聞けば大きな鹿を思い浮かべるが、この村名は大河原と鹿塩の頭文字を繋いだだけの合成地名である。ただ、偶然とはいえ鹿塩の「鹿」には塩の歴史が詰まっている。内陸の山中に塩水が湧き、山塩が採れる特異な地で、断層岩の名「鹿塩マイロナイト」にもその字が残る。村を貫く中央構造線は、巨大な断層の境目を地表で見られる場所として国の天然記念物になっている。頭文字の村名が、結果として大地の物語を背負うことになった例である。
    sources:
    - v11-ooshika-shinmai
    - v11-ooshika-bunka-db
  relations:
  - pref/20
  unknowns:
  - 初回の合併年の確定（村公式1874年説と新聞・百科事典1875年説の相違）。当時の県の布達等の原資料での確認が要る
  - 大河原・鹿塩という各旧村名の語源そのもの
  updated: '2026-11-13'
- id: muni/20-天龍村
  code: '204137'
  names:
    ja: 天龍村
    reading: てんりゅうむら
    aliases: []
  user_terms:
  - てんりゅう
  - 天竜川最南端の村
  - 龍泉閣のある村
  naming_type: 合併新設（1956年に平岡村・神原村が合併。天竜川にちなむ命名の理由が村の説明として残る）
  prefecture: 長野県
  homonyms: []
  summary: 長野県最南端、天竜川沿いの村。1956年に平岡村と神原村が天竜川を隔てて新設合併し、川の名を採って「天龍村」となった。村の総務課は、平岡ダム・佐久間ダムで姿を変えた天竜川の姿を村名に留め、天に昇る龍の勢いで産業を興そうとの意を込めたと命名理由を言葉で残している。川は「天竜」、村名は「天龍」と字が異なる。
  first_attestation:
    era: 昭和31年
    year_western: 1956
    document: null
    note: 村名「天龍」の初出は昭和31年（1956年）9月30日の平岡村・神原村の新設合併による天龍村発足（長野県資料の変遷表による）
  claims:
  - text: 昭和31年（1956年）9月30日、下伊那郡平岡村と神原村が新設合併して天龍村が発足した
    kind: fact
    level: E2
    status: established
    sources:
    - v11-tenryu-pref
  - text: この合併は天竜川を隔てた合併の先駆けであったと全国町村会の村紹介は記す
    kind: fact
    level: E2
    status: established
    sources:
    - v11-tenryu-zck
  - text: 命名理由について村の総務課は、「平岡ダムや佐久間ダムの完成により変わり果てた天竜川の姿を、せめても村名に著して永久に留め、天にも昇る龍の勢いでますます産業を盛んにし、新村建設に飛龍の気魄を持って奮起しようとの意を込めて『天龍村』と名付けられた」と説明している
    kind: fact
    level: E2
    status: established
    sources:
    - v11-tenryu-zck
  - text: 川の名は「天竜川」と書くが村名は「天龍村」で、「竜」と「龍」の字が異なる
    kind: fact
    level: E2
    status: established
    sources:
    - v11-tenryu-vill-about
  - text: 旧平岡村・旧神原村はいずれも天領で、江戸幕府の代官所・遠山10ヶ村の連合体に関わり、幕末には両村とも青崩峠を境に別々の代官所の管轄となった分合の歴史を持つ
    kind: fact
    level: E2
    status: established
    sources:
    - v11-tenryu-vill-about
  - text: 村の真ん中を南北に天竜川が流れ、険しいV字谷に集落がかかっている、長野県最南端の村である
    kind: fact
    level: E2
    status: established
    sources:
    - v11-tenryu-vill-about
  - text: 天龍村の地方公共団体コードは204137である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: ダムに沈んだ川の名を、村の名に
    text: 1956年の合併の直前、天竜川は平岡ダム（1951年竣工）と佐久間ダム（1956年竣工）によって姿を変えたばかりだった。新しい村の名付けにあたって人々が選んだのは、変わり果てた川への惜別と、天に昇る龍の勢いという二つの思いだった。「せめても村名に著して永久に留め」――命名理由がこれほど言葉で残されている昭和の合併名は珍しい。川は「天竜」、村は「天龍」。字の違いが、川そのものと川への思いの違いを分けている。
    sources:
    - v11-tenryu-zck
    - v11-tenryu-vill-about
  relations:
  - pref/20
  unknowns:
  - 命名が決まった合併協議の会議記録そのもの（村総務課の説明は後年の紹介文による伝承）
  - 川名「天竜」自体の語源（天龍村の名は川名の借用だが、川名の由来は別途の確認を要する）
  updated: '2026-11-13'
- id: muni/20-安曇野市
  code: '202207'
  names:
    ja: 安曇野市
    reading: あづみのし
    aliases:
    - 安曇
    - 安曇野
  user_terms:
  - あづみのし
  - 安曇野
  - わさびのまち
  - 北アルプスのふもと
  - 安曇の名前の由来
  naming_type: 合併新設
  prefecture: 長野県
  homonyms: []
  summary: 安曇野市は2005年に豊科町・穂高町・三郷村・堀金村・明科町の5町村が合併して生まれた市で、名は古代の信濃国安曇郡を受け継ぐ。「安曇」は、綿津見神を祖神とする海人の有力氏族・安曇氏（阿曇氏）の名であり、北九州の志賀島を本拠とした同氏の一部が、姫川をさかのぼって内陸の信濃・安曇郡に住み着いたと伝えられる。海から遠く離れた山国に、海の神を祀る穂高神社と船の祭りが残るのはそのためとされる。
  first_attestation:
    era: 古代
    year_western: null
    document: （未確認）
    note: 信濃国安曇郡の名は平安時代の文献に遡ると考えられるが、本調査では一次資料の原文で確認できなかった。なお『和名類聚抄』には筑前国糟屋郡の「阿曇郷」がみえ（國學院大學の神名データベースによる）、これは安曇氏の本拠地側の地名である
  claims:
  - text: 平成17年（2005年）10月1日に、豊科町・穂高町・三郷村・堀金村・明科町の5町村が合併して安曇野市が誕生した
    kind: fact
    level: E2
    status: established
    sources:
    - v2-azumino-bunsho
  - text: 現在の安曇野市一帯は古代の信濃国安曇郡にあたり、市名「安曇野」はこの郡名を受け継ぐ
    kind: fact
    level: E4
    status: established
    sources:
    - v2-azumi-reinet
  - text: 國學院大學の神名データベースによれば、綿津見神は阿曇連（安曇氏）が祖神として奉斎する神で、阿曇連は海人を統括した有力な氏族であり、その拠点は筑前国糟屋郡阿曇郷（現在の福岡市東区和白・糟屋郡新宮町付近）とされる
    kind: fact
    level: E2
    status: established
    sources:
    - v2-azumi-kokugakuin
  - text: 志賀島の志賀海神社では阿曇氏が綿津見神を祀っており、『先代旧事本紀』は三柱の綿津見神を阿曇連らの祀る「筑紫斯香神」すなわち志賀の神と明記する（國學院大學の神名データベースが紹介するもの）
    kind: fact
    level: E2
    status: established
    sources:
    - v2-azumi-kokugakuin
  - text: 本拠地を離れた安曇族の一部は日本海を北上し、交易関係にあった越後の糸魚川にたどり着いて、そこから姫川をさかのぼり、信濃国の安曇郡に住み着いたと伝えられる
    kind: legend
    level: E4
    status: established
    sources:
    - v2-azumi-reinet
  - text: 穂高神社はこの地の安曇氏が祖神を祀った古社とされ、穂高見命や綿津見命など海の神を祀っており、海のない山国でありながら船を用いる「御船祭り」が行われる
    kind: fact
    level: E4
    status: established
    sources:
    - v2-azumi-reinet
  - text: 「安曇」の語源については、「海人津見（あまつみ）」が転訛したもので「海に住む人」を意味するという説がある
    kind: fact
    level: E4
    status: contested
    sources:
    - v2-azumi-reinet
  - text: 安曇野市の地方公共団体コードは202207である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 海のない山国に残る、海の神と船の祭り
    text: 安曇野のほぼ中央に鎮座する穂高神社では、毎年、舟の形をした山車を引き回してぶつけ合う「御船祭り」が行われる。周囲に海はなく、あるのは北アルプスの山々と田園だけである。それなのに祭神は海の神・綿津見命であり、その子で安曇氏の祖とされる穂高見命である。海人だった安曇氏が遠く九州から移り住んだという伝承は、この不思議な取り合わせを説明するために語り継がれてきた。「安曇野」という地名は、山国に残された海の記憶なのである。
    sources:
    - v2-azumi-reinet
  relations:
  - pref/20
  unknowns:
  - 信濃国安曇郡の初出を一次資料（『和名類聚抄』等）の原文で確認できなかった
  - 安曇氏の信濃への移住の時期と経路は伝承の域を出ておらず、考古学的な裏付けを確認できなかった
  - 2005年の合併に際して市名「安曇野市」が選定された経緯（公募・協議の過程）の詳細を確認できなかった
  updated: '2026-11-13'
- id: muni/20-宮田村
  code: '203882'
  names:
    ja: 宮田村
    reading: みやだむら
    aliases:
    - 宮田駅
    - 宮田郷
  user_terms:
  - 宮田
  - みやだ
  - 木曽駒ヶ岳のふもとの村
  - 駒ヶ根の隣の村
  naming_type: 一部の地名（古代の駅名・郷名「宮田」の継承）
  prefecture: 長野県
  homonyms: []
  summary: 上伊那郡の村。村名は平安時代の『延喜式』『和名類聚抄』に見える東山道の駅名「宮田」を受け継ぐもので、村の観光協会も「村名は延喜式や倭名類聚抄の中に出てくる『宮田』によります」と説明する。中世には宮田郷があり、1875年に宮田村と中越村が合併して現在の村の原型ができた。1954年には駒ヶ根市の発足に加わったが、1956年に分市して村に戻ったという珍しい歴史を持つ。
  first_attestation:
    era: 延長5年
    year_western: 927
    document: 『延喜式』兵部省
    note: 『日本歴史地名大系』「宮田駅」項が「宮田」の文献上の初見として紹介する駅馬の規定。村公式の略年表は『和名類聚抄』（935年）に東山道の駅名として記されるとし、村公式資料の間でも初出の示し方には揺れがある。原文の直接確認はしていない
  claims:
  - text: 村名の由来について、宮田村観光協会は「村名は平安時代の律令に関する資料である『延喜式』や、百科事典的な資料『倭名類聚抄』の中に出てくる『宮田』によります」と説明する
    kind: fact
    level: E2
    status: established
    sources:
    - v12-miyada-kankou
  - text: 『日本歴史地名大系』「宮田駅」項は、「宮田」の文献上の初見は『延喜式』兵部省の「信濃国駅馬、阿知卅疋、育良・賢錐・宮田・深沢・覚志各十疋」という駅馬の規定であると紹介する
    kind: fact
    level: E3
    status: established
    sources:
    - v12-miyada-kotobank-taikei-eki
  - text: 村勢要覧は927年に著された『延喜式』の東山道の駅名の一つに「宮田」の名が見えるとする一方、村の略年表は『和名類聚抄』（935年）を挙げ、『延喜式』の駅馬の記録を967年（康保4年）のこととしており、村公式資料の間でも初出の示し方が異なる
    kind: fact
    level: E2
    status: contested
    sources:
    - v12-miyada-vill-yoran
    - v12-miyada-vill-chronology
  - text: 中世には宮田郷が置かれ、1329年（嘉暦4年）には宮田中越郷の地頭らが鎌倉幕府より諏訪上社五月会の頭役を命じられたと、村の略年表が伝える
    kind: fact
    level: E2
    status: established
    sources:
    - v12-miyada-vill-chronology
  - text: 江戸時代、宮田の地は高遠領に属し、町割・北割・南割のいわゆる宮田3か村と中越村があった。1873年（明治6年）に宮田3か村が合併し、1875年（明治8年）にその宮田村と中越村が合併して現在の宮田村は誕生した
    kind: fact
    level: E2
    status: established
    sources:
    - v12-miyada-vill-yoran
  - text: 1954年（昭和29年）には宮田村は駒ヶ根市の誕生に加わったが、1956年（昭和31年）に分市して再び宮田村となった
    kind: fact
    level: E2
    status: established
    sources:
    - v12-miyada-vill-yoran
  - text: 「宮田」という言葉そのものの語源（宮に属する田、すなわち神田を指すのか等）については、確認した村公式・専門資料に確定的な説明が見当たらなかった
    kind: fact
    level: E2
    status: indeterminate
    sources:
    - v12-miyada-kankou
    - v12-miyada-kotobank-taikei-eki
  - text: 宮田村の地方公共団体コードは203882である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 一度は市になり、2年で村に戻った村
    text: 1954年、宮田村は周辺の町村と合併して発足した駒ヶ根市の一部になった。ところがわずか2年後の1956年、宮田は市を離れて（分市）再び宮田村として独立した。昭和の大合併で「市になった元村」は数多いが、いったん市に加わりながら村に戻った例は珍しい。駅名として『延喜式』に残る千年以上の歴史を持つ「宮田」の名は、市になっても村に戻っても、そのまま手放されずに残った。
    sources:
    - v12-miyada-vill-yoran
  relations:
  - pref/20
  - muni/20-駒ヶ根市
  unknowns:
  - 「宮田」の語源（「宮の田」すなわち神社・朝廷に属する田を意味するのか等）を明示した専門資料は本バッチでは確認できなかった
  - 『延喜式』の駅馬規定について、村公式資料の間でも927年のこととするか967年のこととするか示し方が異なり、原典での確認は今後の課題
  updated: '2026-11-13'
