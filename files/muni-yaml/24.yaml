  column:
    title: 木曽川の東岸にある、三重県の町
    text: 木曽岬町は、三重県でありながら木曽川の東岸にある。県内の市町村で川の東側に位置するのは、この町と桑名市長島町の一部だけで、東隣はもう愛知県である。町域そのものが江戸時代以来、河口の干潟に築かれた新田の集まりで、1889年に25もの新田が寄り集まって一つの村になった。輪中の堤防に囲まれ、川と海の境目に生きてきた土地だからこそ、「木曽川の岬」という名がそのまま自治体の名になったのだろう。県境の川を越えた飛び地のような位置も、この町の個性である。
