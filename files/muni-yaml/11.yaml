    sources:
    - m4-kumagaya-sizei
  - text: 昭和8年（1933年）4月1日に市制が施行されて熊谷市となり、平成17年（2005年）10月1日に旧熊谷市・大里町・妻沼町が新設合併して新熊谷市が誕生し、平成19年（2007年）2月13日に江南町を編入した
    kind: fact
    level: E2
    status: established
    sources:
    - m4-kumagaya-sizei
  - text: 熊谷の語源には、高城明神の鎮座による「神谷（くまけや）」からという説と、この地域で荒川が大きく蛇行していたことによる「曲谷（くまがい）」からという説などがあり、定説はない
    kind: fact
    level: E5
    status: contested
    sources:
    - m4-kumagaya-wiki
  - text: 熊谷直実の父・熊谷直貞が、この地にいた熊を退治したことが「熊谷」の名の起こりだという言い伝えがある
    kind: legend
    level: E5
    status: established
    sources:
    - m4-kumagaya-wiki
  - text: 熊谷氏の名字は地名の熊谷に由来するものであり（地名が先、名字が後）、地名の読みは後に「くまがい」から「くまがや」に改まった
    kind: fact
    level: E5
    status: established
    sources:
    - m4-kumagaya-wiki
  - text: 総務省の全国地方公共団体コードで、熊谷市のコードは112020と定められている（J-LISの埼玉県内市町村一覧による）
    kind: fact
    level: E2
    status: established
    sources:
    - k1-jlis-saitama
  column:
    title: 名字は「くまがい」、地名は「くまがや」
    text: 『平家物語』の一ノ谷の場面で知られる熊谷次郎直実の名字は、今も「くまがい」と読む。ところが名字の古里である地名の方は、読みが「くまがい」から「くまがや」に変わってしまった。先にあったのは地名で、名字はそれを名乗ったもの。駅前には直実の像が立ち、読みのずれた名字の武将が、読みの変わった地名の町を見守っている。
    sources:
    - m4-kumagaya-wiki
  relations:
  - pref/11
  unknowns:
  - 語源の定説はない（神谷説・曲谷説などを併記し、熊退治は伝承として分離した）
  - 「熊谷」の確実な初出文書は特定できていない
  - 読みが「くまがい」から「くまがや」に変わった時期と理由は未確認
  updated: '2026-11-13'
- id: muni/11-狭山市
  code: '112151'
  names:
    ja: 狭山市
    reading: さやまし
    aliases:
    - 入間川町
    - 入間川
  user_terms:
  - 狭山市の名前の由来
  - さやまの語源
  - 狭山茶のまち
  - 入間川町から狭山市へ
  naming_type: 自然地名から
  formation: 合併新設
  prefecture: 埼玉県
  homonyms: []
  summary: 前身の中心は入間川町であり、「狭山」は昭和29年（1954年）の合併・市制施行の際に新たに採用された市名である。市名は狭山丘陵と特産物の狭山茶に由来するとされるが、狭山丘陵そのものは市域に含まれていない。昭和54年（1979年）には入間川駅も狭山市駅に改称した。なお、大阪府の大阪狭山市とは別の自治体である。
  first_attestation:
    era: 昭和29年
    year_western: 1954
    document: 市制施行時の市名（狭山市）
    note: 市名としての初出。「狭山」の表現自体は、江戸時代後期の『新編武蔵風土記稿』に狭山丘陵を指す山の名として見える
  claims:
  - text: 昭和29年（1954年）7月1日、入間川町・入間村・堀兼村・奥富村・柏原村・水富村が新設合併して市制を施行し、狭山市が誕生した（合併当時の人口は31,030人）
    kind: fact
    level: E5
    status: established
    sources:
    - m4-sayama-wiki
  - text: 市名の「狭山」は、狭山丘陵及び市内の特産物である「狭山茶」に由来するとされる。ただし狭山市の市域に狭山丘陵の区域は含まれておらず、狭山茶の生産量は隣の入間市の方が多い
    kind: fact
    level: E5
    status: established
    sources:
    - m4-sayama-wiki
  - text: 江戸時代後期に編まれた『新編武蔵風土記稿』では、「狭山」は狭山丘陵を指し、山の名称のように用いられていた。なお明治41年の測図では、狭山丘陵部に別の狭山村（現在の東京都東大和市狭山）があったことも知られる
    kind: fact
    level: E5
    status: established
    sources:
    - m4-sayama-wiki
  - text: 昭和54年（1979年）、西武新宿線の入間川駅が狭山市駅と改称され、中心駅の名も市名にそろえられた
    kind: fact
    level: E5
    status: established
    sources:
    - m4-sayama-wiki
  - text: 総務省の全国地方公共団体コードで、狭山市のコードは112151と定められている（J-LISの埼玉県内市町村一覧による）
    kind: fact
    level: E2
    status: established
    sources:
    - k1-jlis-saitama
  column:
    title: 丘陵のない「狭山市」
    text: 市の名の由来とされる狭山丘陵は、実は狭山市の市域には入っていない。丘陵は隣の所沢市・入間市・東京都側にかけて広がり、狭山茶の生産量も入間市の方が多い。それでも市は「お茶香るまち さやま」を掲げる。狭山茶は地域一帯のブランドであり、その名を市名に迎えたのが1954年の合併だった。名実のずれではなく、広域の名を新しい市の旗印にした、合併命名らしい一例である。
    sources:
    - m4-sayama-wiki
  relations:
  - pref/11
  - muni/27-大阪狭山市
  unknowns:
  - 市名選定の経緯（候補案や選定理由を示す一次資料）は未確認
  - 「狭山」という地名表現そのものの語源（なぜ「狭い山」なのか）は未確認
  updated: '2026-11-13'
- id: muni/11-白岡市
  code: '112461'
  names:
    ja: 白岡市
    reading: しらおかし
    aliases:
    - 白岡町
    - 白岡駅
  user_terms:
  - しらおか
  - 白岡ニュータウン
  naming_type: 学校名・駅名などから
  formation: 合併新設
  prefecture: 埼玉県
  homonyms: []
  summary: 埼玉県東部の市で、町名・市名は鉄道の駅名に由来する珍しい系譜を持つ。1910年に開業した白岡駅の名は古社・白岡八幡宮にちなみ、1954年の合併でその駅名を取って白岡町が誕生し、2012年に単独で市制を施行して白岡市となった。「白岡」の地名自体の由来は、白岡八幡宮の縁起に伝わる白鳩の命名譚と、貝塚の貝殻が白く輝く岡という説が市の資料に併記されている。
  first_attestation:
    era: null
    year_western: null
    document: 白岡八幡宮の縁起（嘉祥2年・849年の命名譚を伝える）
    note: 「白岡」の名の史料上の初出は未確認。849年の慈覚大師による命名は八幡宮の縁起に伝わる伝承であり、年代の裏付けはない。
  claims:
  - text: 1954年（昭和29年）9月1日に日勝村・篠津村・大山村（上大崎を除く）が合併して白岡町が誕生した
    kind: fact
    level: E2
    status: established
    sources:
    - w3-shiraoka-city-plan
  - text: 町名「白岡」は、1910年（明治43年）に開業した東北本線の白岡駅の名にちなんで付けられたとされる
    kind: fact
    level: E5
    status: established
    sources:
    - w3-shiraoka-wiki
    - w3-shiraoka-donnatoko
  - text: 白岡駅の名は、駅の所在地が小久喜地内だったものの隣の久喜駅と紛らわしいため、古社の白岡八幡宮にちなんで採用されたと紹介されている
    kind: fact
    level: E5
    status: established
    sources:
    - w3-shiraoka-donnatoko
  - text: 白岡八幡宮の縁起によれば、嘉祥2年（849年）に慈覚大師（円仁）が八幡宮を訪れた際、大師の前に三羽の白い鳩が舞い遊び、その様子を見た大師が「白鳩の住める白い岡」により白岡と命名したと伝えられる
    kind: legend
    level: E2
    status: established
    sources:
    - w3-shiraoka-city-plan
  - text: 「白岡」の由来には、正福院貝塚の貝殻が元荒川方向から見ると太陽の光で光輝いて見える岡であったという説もあり、市はこの説と八幡宮の縁起の説を併記して諸説あるとしている
    kind: fact
    level: E2
    status: contested
    sources:
    - w3-shiraoka-city-plan
  - text: 2010年の国勢調査で人口5万人を突破したことを受け、2012年（平成24年）10月1日に白岡町が単独で市制を施行して白岡市が誕生した
    kind: fact
    level: E2
    status: established
    sources:
    - w3-shiraoka-city-plan
    - w3-shiraoka-wiki
  - text: 総務省の全国地方公共団体コードで、白岡市の団体コードは112461と定められている
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 駅の名前が、そのまま町の名前になった
    text: 白岡の名前の系譜は「神社→駅→町→市」という順番でたどれる。1910年に東北本線の駅ができたとき、駅のある小久喜という地名は隣の久喜駅と紛らわしかったため、古くから信仰を集める白岡八幡宮にちなんで「白岡駅」と名付けられたと紹介されている。1954年に周辺の村々が合併する際、新しい町の名にはこの駅名が採用され、2012年の単独市制でも「白岡」がそのまま引き継がれた。もとの「白岡」自体にも、八幡宮の縁起が語る白い鳩の命名譚と、縄文時代の貝塚の貝殻が陽光に白く輝く岡だったという説が伝わり、市の資料は両説を併記している。
    sources:
    - w3-shiraoka-city-plan
    - w3-shiraoka-donnatoko
    - w3-shiraoka-wiki
  relations:
  - pref/11
  unknowns:
  - 「白岡」の地名の史料上の初出は未確認（白岡八幡宮の縁起の849年命名譚は伝承であり、裏付ける同時代史料は確認できなかった）
  - 白岡駅の命名理由（久喜駅との混同回避と八幡宮へのちなみ）を確認できる鉄道側の一次資料は未確認で、市の文化財計画を紹介する二次資料による
  updated: '2026-11-13'
- id: muni/11-皆野町
  code: '113620'
  names:
    ja: 皆野町
    reading: みなのまち
    aliases:
    - 皆野之郷
    - 皆野村
    - 美野町
  user_terms:
  - 皆野
  - みなの
  - 秩父音頭の里
  - 美野町
  - 天空のポピー
  naming_type: 中心地名の継承
  naming_note: 古くからの地名「皆野」の継承。1943年の戦時合併で一時「美野町」となったが1946年に復した
  formation: 合併新設
  prefecture: 埼玉県
  homonyms: []
  summary: 秩父郡の町で、地名は戦国期から見える皆野之郷に由来する古名であり、村名の由来は広大な原野の地形によるものと伝えられる。1889年（明治22年）に皆野村、1928年（昭和3年）に皆野町となったが、1943年（昭和18年）の戦時合併で近隣町村と合併して「美野町」に改称され、1946年（昭和21年）に解体して皆野町に戻った。1955年（昭和30年）に4町村の合併で現在の皆野町となり、秩父音頭の発祥地として知られる。
  first_attestation:
    era: 戦国期
    year_western: null
    document: 皆野之郷の用例（『角川日本地名大辞典』が紹介）
    note: 地名「皆野」は戦国期より見出せる皆野之郷が古い用例とされる。具体的な文書名・年次は確認できなかった
  claims:
  - text: 地名「皆野」は、古くは戦国期より見出せる皆野之郷に由来し、江戸期には皆野村として続いた
    kind: fact
    level: E3
    status: established
    sources:
    - w11-minano-kakugawa
    - w11-minano-wiki
  - text: 村名の由来は、広大な原野が広がる地形によるものと云われている
    kind: fact
    level: E3
    status: indeterminate
    sources:
    - w11-minano-kakugawa
  - text: 1889年（明治22年）4月1日の町村制施行で皆野村が成立し、1928年（昭和3年）11月1日に町制を施行して皆野町となった
    kind: fact
    level: E2
    status: established
    sources:
    - w11-minano-geoshape
    - w11-minano-wiki
  - text: 1943年（昭和18年）9月8日、戦時町村合併促進法により国神村・金沢村・日野沢村・三沢村・大田村および白鳥村の一部（下田野）と合併し、町名は「美野町」と改められた
    kind: fact
    level: E5
    status: established
    sources:
    - w11-minano-wiki
  - text: 1946年（昭和21年）12月1日に美野町は解体され、皆野町ほか1町5村に分離して「皆野」の名が戻った
    kind: fact
    level: E5
    status: established
    sources:
    - w11-minano-wiki
  - text: 1955年（昭和30年）3月1日に皆野町・国神村・金沢村・日野沢村が合併して現在の皆野町となった
    kind: fact
    level: E5
    status: established
    sources:
    - w11-minano-wiki
  - text: 皆野町は秩父音頭の発祥の地として知られる
    kind: fact
    level: E2
    status: established
    sources:
    - w11-minano-pref
  - text: 皆野町の地方公共団体コードは113620である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 3年だけ存在した「美野町」
    text: 皆野町の名は、1943年から1946年までの3年あまりだけ地図から消えた。戦時町村合併促進法で皆野町と周辺の村々が合併した際、新しい町名として「美野町」が選ばれたためである。だが戦後間もない1946年、この合併は解体され、皆野町は元の名に戻った。そして1955年に再び合併したとき、町名に選ばれたのはやはり「皆野」だった。戦国期から続く古い地名の重みが、「美野」という新名を退けた形である。「美野町」は、昭和の合併史の中でも短命だった町名の一つとして残る。
    sources:
    - w11-minano-wiki
  relations:
  - pref/11
  - muni/11-長瀞町
  - muni/11-神川町
  unknowns:
  - 「皆野」の語源は「広大な原野」説が伝えられるのみで、語義の確かな説明は専門資料でも確認できなかった
  - 皆野之郷の初出文書の書誌（文書名・年次）は確認できなかった
  - 1943年の合併で「美野町」の名が選ばれた経緯（候補や選定理由）は確認できなかった
  updated: '2026-11-13'
- id: muni/11-神川町
  code: '113832'
  names:
