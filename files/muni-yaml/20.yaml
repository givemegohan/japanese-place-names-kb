  summary: 長野県下伊那郡の町。1956年（昭和31年）9月20日に下伊那郡大島村と上伊那郡上片桐村が合併して発足した、郡をまたぐ合併による町。町名は中央アルプスから流れる片桐松川にちなんで命名されたと町公式資料が明記する。北安曇郡の松川村（1874年以来の村）とは同じ県内の別の自治体である。
