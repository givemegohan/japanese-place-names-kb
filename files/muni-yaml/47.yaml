  - text: 1649年の『絵図郷村帳』に出てくる現在の宜野座村域の地名は古知屋・宜野座・惣慶・漢那の4村（ほかに「はま村」）で、これらの村々は金武間切に属して「上四ヶ」とも称され、地域としてのまとまりをもっていたと宜野座村公式は紹介している
    kind: fact
    level: E2
    status: established
    sources:
    - s7-ginoza-rekishi
  - text: 『日本歴史地名大系』は、近世の宜野座村の読みを「ぎぬざ」とし、宜野座・惣慶・漢那・古知屋の村々は上之四島（いいぬゆしま）とも称されていたと記している
    kind: fact
    level: E3
    status: established
    sources:
    - s7-ginoza-kotobank-taikei
  - text: いつ頃かははっきりしないが、この地域へ島横目役として「宜野座」という姓の役人が派遣されてきたといわれ、その島横目屋敷跡も残っていると、宜野座村公式は伝承として紹介している
    kind: legend
    level: E2
    status: established
    sources:
    - s7-ginoza-rekishi
  - text: この伝承は役人の姓についてのものであり、村名「宜野座」がその姓に由来するとまでは村公式資料も述べておらず、村名の語源は確定していない
    kind: fact
    level: E2
    status: indeterminate
    sources:
    - s7-ginoza-rekishi
  - text: 1908年の島嶼町村制により、金武間切の古知屋・宜野座・惣慶・漢那の4村と現在の金武町域の3村をもって金武村が成立したと宜野座村公式は紹介している
    kind: fact
    level: E2
    status: established
    sources:
    - s7-ginoza-rekishi
  - text: 昭和21（1946）年4月1日、金武村から古知屋（現在の松田）・宜野座・惣慶・福山・漢那・城原が分村し、人口18,540人の宜野座村が誕生したと総務省の戦災調査は記録している
    kind: fact
    level: E2
    status: established
    sources:
    - s7-ginoza-soumu-sensai
  - text: 沖縄戦後、宜野座一帯には米軍の民間人収容地が置かれて宜野座・漢那・古知屋の収容集落は「市」と呼ばれ、北部軍政府も置かれた宜野座は戦後北部の行政の中心地となったと総務省の戦災調査は記録している
    kind: fact
    level: E2
    status: established
    sources:
    - s7-ginoza-soumu-sensai
  column:
    title: 収容所の「市」から生まれた村
    text: 沖縄戦の直後、宜野座には民間人収容地が置かれ、宜野座・漢那・古知屋の収容集落は「宜野座市」「漢那市」「古知屋市」と呼ばれた。北部軍政府も置かれた宜野座は、焼け野原の北部の行政中心となり、翌1946年、金武村からの分村によって宜野座村が誕生する。村の歴史でいちばん新しい層は、戦争と収容所の記憶と結びついている。
    sources:
    - s7-ginoza-soumu-sensai
    - s7-ginoza-rekishi
  relations:
  - pref/47
  - muni/47-金武町
  - muni/47-恩納村
  unknowns:
  - 村名「宜野座」の語源の確定（島横目役人の姓の伝承はあるが、村名との先後関係は裏づけられていない）
  - 『絵図郷村帳』（1649年）の原文を直接確認できていないこと
  - 島横目屋敷跡にまつわる伝承の年代
  updated: '2026-11-13'
- id: muni/47-宜野湾市
  code: '472051'
  names:
    ja: 宜野湾市
    reading: ぎのわんし
    aliases:
    - 宜野湾村
    - 宜野湾間切
    - ジノーン
  user_terms:
  - ぎのわん
  - ジノーン（地元の方音）
  - 普天間基地のまち
  - ねたての都市
  naming_type: 中心地名の継承
  formation: 単独発足
  prefecture: 沖縄県
  homonyms: []
  summary: 沖縄本島中南部の市で、昭和37年（1962年）7月1日に宜野湾村が単独で市制を施行した。「宜野湾」は方音「ジノーン（じのーん）」に漢字を当てた表記で、古くは『おもろさうし』の「きのわん」に遡ると考えられ、近世には宜野湾間切の名として定着した。語の意味そのものの確定した語源は専門辞典にも示されていない。戦後は市域の中央を米軍普天間飛行場が占め、旧来の中心地だった字宜野湾は基地の敷地の中に消えた。
  first_attestation:
    era: null
    year_western: null
    document: 『おもろさうし』巻15
    note: 『日本歴史地名大系』は『おもろさうし』巻15に当地を指すと考えられる「きのわん」がみえると紹介する。文書で表記の確定する用例は元和7年（1621年）の知行目録（高嶺家文書）の「儀野湾村」である（いずれも二次資料経由の確認）
  claims:
  - text: 宜野湾市の地方公共団体コードは472051である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  - text: 宜野湾市は昭和37年（1962年）7月1日、宜野湾村が市制を施行して発足した
    kind: fact
    level: E2
    status: established
    sources:
    - s5-ginowan-plan
  - text: 地元の方音は「ジノーン（じのーん）」であり、「宜野湾」の漢字表記はこの琉球語の音に字を当てたものである
    kind: fact
    level: E3
    status: established
    sources:
    - s5-ginowan-kotobank-magiri
  - text: 『おもろさうし』巻15には当地を指すと考えられる「きのわん」がみえ、元和7年（1621年）3月16日の尚恭浦添王子朝良宛知行目録（高嶺家文書）には浦添間切のうちに「儀野湾村」と記されることが『日本歴史地名大系』で紹介されている
    kind: fact
    level: E3
    status: established
    sources:
    - s5-ginowan-kotobank-mura
    - s5-ginowan-kotobank-magiri
  - text: 康熙10年（1671年）、浦添・中城・北谷の各間切から14か村を割いて宜野湾間切が新設され、間切番所は宜野湾村に置かれた
    kind: fact
    level: E3
    status: established
    sources:
    - s5-ginowan-kotobank-magiri
    - s5-ginowan-city-gaiyo
  - text: 戦前の宜野湾村では字宜野湾（現在の普天間飛行場内）に村役場があり、琉球王国時代から村行政の中心地として発展していたが、戦後にその一帯は普天間飛行場の敷地となった
    kind: fact
    level: E2
    status: established
    sources:
    - s5-ginowan-soumu
  - text: 市は、古謡「おもろそうし」に表された言葉で「物事の根元」「共同体の中心」を意味する「ねたて」を、「ねたての都市ぎのわん」として市の合言葉にしている
    kind: fact
    level: E2
    status: established
    sources:
    - s5-ginowan-about
  column:
    title: 基地の中に消えた中心地「宜野湾」
    text: 「宜野湾」という地名の本来の中心は、今は地図の上でたどることが難しい。近世に間切番所が置かれ、戦前は村役場のあった字宜野湾は、現在の米軍普天間飛行場の敷地の中にある。戦後、集落は接収され、住民は周辺へ移った。かつてその中心地へ続く道には「ジノーンナンマチ（宜野湾並松）」と呼ばれる松並木があり、1932年には国の天然記念物に指定されるほど知られた景観だったが、これも戦禍と基地建設の中で失われた。市の中心は野嵩・普天間方面へ移り、「宜野湾」の名だけが、元の集落のあった場所から少し離れた市全体の名として残っている。地名とその原点の位置がずれてしまった典型的な例である。
    sources:
    - s5-ginowan-soumu
    - s5-ginowan-kotobank-magiri
  relations:
  - pref/47
  unknowns:
  - 「ジノーン」という語そのものの語源（「ジノー」の意味の分解を含む）は、専門辞典や市公式サイトでは確定した説明を確認できなかった。宜野湾市教育委員会『ぎのわんの地名』（2012年）の検討は未確認である
  - 『おもろさうし』の「きのわん」が宜野湾を指すかどうかは『日本歴史地名大系』も「考えられる」とする段階にとどまる
  - 普天間飛行場が市面積に占める割合は資料によって表現が異なり、数値を採用しなかった
  updated: '2026-11-13'
- id: muni/47-宮古島市
  code: '472140'
  names:
    ja: 宮古島市
    reading: みやこじまし
    aliases:
    - 平良市
    - 宮古市（決定されかけた名称）
    - ミャーク
  user_terms:
  - みやこじま
  - ミャーク（宮古語の呼び名）
  - 宮古ブルーの島
  - 伊良部大橋のある市
  naming_type: 島名の継承
  formation: 合併新設
  prefecture: 沖縄県
  homonyms: []
  summary: 平成17年（2005年）10月1日、平良市・城辺町・下地町・上野村・伊良部町の5市町村が新設合併して発足した、宮古列島の市。新市名は合併協議でいったん「宮古市」に決まったが、岩手県宮古市と同名になることを避けて最終的に島の名を含む「宮古島市」となった。「宮古」は方音「ミャーク」に対応する古い島名で、もともとは主島だけでなく列島全体の総称であり、文献上の初出は中国の『元史』にみえる「密牙古人」の記事と一般にいわれる。
  first_attestation:
    era: null
    year_western: null
    document: 『元史』
    note: 『日本歴史地名大系』によれば、『元史』仁宗紀の延祐4年（1317）10月条と『温州府志』巻18に、交易の途次に遭難・救助された「海外婆羅公管下密牙古人民」の記事があり、「密牙古」を宮古と解釈して、これが文献における宮古の初出とされる。解釈を含む話であり専門辞典経由の確認にとどまるため、年は特定しない
  claims:
  - text: 宮古島市の地方公共団体コードは472140である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  - text: 宮古島市は平成17年（2005年）10月1日、平良市・城辺町・下地町・上野村・伊良部町の5市町村が合併して誕生した
    kind: fact
    level: E2
    status: established
    sources:
    - s5-miyakojima-koho20
  - text: 新市の名称は平成16年（2004年）11月17日の平良市・城辺町・伊良部町合併推進協議会でいったん「宮古市」に決定されていた
    kind: fact
    level: E2
    status: established
    sources:
    - s5-miyakojima-city-gappei
  - text: 名称は合併協議で最も難航した項目であり、協議会で「宮古市」と決めた後に住民側からアンケート実施の要請があり、協議会での無記名投票を経て住民アンケートを実施して最終決定に至った経過が合併事例資料に記録されている
    kind: fact
    level: E4
    status: established
    sources:
    - s5-miyakojima-jirei
  - text: 最終的には岩手県の宮古市と同名になることを避ける形で、島の名を入れた「宮古島市」で決着した経緯が紹介されている
    kind: fact
    level: E4
    status: established
    sources:
    - s5-miyakojima-uub-arc
  - text: 『日本歴史地名大系』によれば、「宮古」の文献上の初出は『元史』仁宗紀の延祐4年（1317）10月条と『温州府志』巻18にみえる、「撤里即地面」との交易の途次に遭難・救助された「海外婆羅公管下密牙古人民」の記事であり、「密牙古」を宮古と解釈する。なお婆羅公の「婆羅」を宮古島の保良（ぶら）に見立てる説もある
    kind: fact
    level: E3
    status: established
    sources:
    - s5-miyako-kotobank
  - text: 『中山世譜』（1701年の蔡鐸本を1724年に蔡温が重修）首巻の三十六島の条には、平良・来間・大神・池間・水納・伊良部・多良間の七島を挙げて「以上七島、総称之曰宮古島、又曰麻姑山」とあり、「宮古島」はもともと列島全体の総称で、主島自体は平良（庇郎喇）と呼ばれていた
    kind: fact
    level: E2
    status: established
    sources:
    - upg-t8-miyako-sefu
    - upg-t8-miyako-sefu-history
  - text: 方音は「ミャーク」で、『日本歴史地名大系』は宮古を主島・宮古島を中心とする島々の総称とし、麻姑山・都島・太平山などの別称も史料にみえると紹介している
    kind: fact
    level: E3
    status: established
    sources:
    - s5-miyako-kotobank
  column:
    title: 日本に二つの「宮古市」が生まれる寸前だった
    text: 2004年11月、宮古の合併協議会は新市の名前を「宮古市」と決めた。ところが日本にはすでに岩手県に宮古市がある。市の同名は法律で禁止されているわけではないが、混乱を避けるのが通例で、この決定は全国的な話題になった。名称問題は合併協議で最も難航した項目となり、住民アンケートまで行われた末、最終的に選ばれたのは「宮古島市」である。岩手の宮古市は港町の名、沖縄の宮古は島々の総称の名で、字は同じでも成り立ちは無関係だったが、同名回避の一字「島」が、結果として「島の市」であることをよく表す名前になった。なお宮古市と宮古島市は現在も別の市として併存しており、同名そのものではなく「同名になりかけた」事例として珍しい。
    sources:
    - s5-miyakojima-city-gappei
    - s5-miyakojima-jirei
    - s5-miyakojima-uub-arc
  relations:
  - pref/47
  - muni/03-宮古市
  unknowns:
  - 「宮古（ミャーク）」という語そのものの語源（何を意味する語だったか）は、専門辞典でも確定した説明を確認できなかった
  - 『元史』の「密牙古人」の記事の原文と年代は二次資料経由でしか確認できていない
  - 「宮古市」から「宮古島市」への変更を正式に決めた会議の日付と議事は、市の公式年表では確認できなかった
  updated: '2026-11-13'
- id: muni/47-座間味村
  code: '473545'
  names:
    ja: 座間味村
    reading: ざまみそん
    aliases:
    - 後慶良間
  user_terms:
  - 座間味島
