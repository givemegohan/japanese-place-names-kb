    status: established
    sources:
    - x8-toin-uub
  - text: 東員町公式サイトの沿革ページは年表形式で町の歴史を示すが、「東員」の命名理由については説明していない
    kind: fact
    level: E2
    status: established
    sources:
    - x8-toin-town
  - text: 「東員」は員弁郡の東部に位置することと郡名の「員」を組み合わせた命名と考えられるが、命名理由を明記した公的資料は確認できなかった
    kind: fact
    level: H
    status: inferred
    sources:
    - x8-toin-pamphlet
    - x8-toin-uub
  - text: 町の中央を員弁川が東流し、町域は古代豪族・猪名部氏の本拠地とされる
    kind: fact
