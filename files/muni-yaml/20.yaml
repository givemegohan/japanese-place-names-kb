prefecture_code: '20'
records:
- id: muni/20-上田市
  code: '202037'
  names:
    ja: 上田市
    reading: うえだし
    aliases:
    - 上田町
  user_terms:
  - 上田市の名前の由来
  - 上田はなぜ上田というのか
  - 真田昌幸の上田城のまち
  - 信州上田
  naming_type: 一部の地名
  prefecture: 長野県
  homonyms: []
  summary: 市名は真田昌幸が天正11年（1583年）に築いた上田城と、その城下町の名を受け継いだものである。「上田」という地名自体は築城以前からこの地の呼称として使われていたとみられるが、語源や文献上の初出は本バッチでは確定できなかった。大正8年（1919年）に市制を施行し、平成18年（2006年）に丸子町・真田町・武石村と新設合併して現在の市域となった。
  first_attestation:
    era: 天正11年
    year_western: 1583
    document: 真田昌幸による上田城築城の開始（上田市公式「上田城の歴史」）
    note: 城名・城下町名としての確実な起点。地名「上田」自体の文献上の初出は特定できていない
  claims:
  - text: 上田城築城以前のこの地は、東山道・北国道などの通る交通の要点として集落をなし、中世末には地方土豪の拠点であった
    kind: fact
    level: E3
    status: established
    sources:
    - l3-ueda-kotobank
  - text: 古代の上田市域には信濃国府が置かれ、その所在地については染屋台や信州大学繊維学部周辺が有力と推測されている
    kind: fact
    level: E2
    status: established
    sources:
    - l3-ueda-fuzoku
  - text: 天正11年（1583年）、真田昌幸は徳川氏の力を借りて上田城の築城に着手した
    kind: fact
    level: E2
    status: established
    sources:
    - l3-ueda-uedajo
  - text: 天正13年（1585年）、第一次上田合戦で昌幸は数ではるかに優勢な徳川軍を上田城に退けた
    kind: fact
    level: E2
    status: established
    sources:
    - l3-ueda-uedajo
  - text: 大正8年（1919年）5月1日、上田町が市制を施行して上田市となった
    kind: fact
    level: E2
    status: established
    sources:
    - l3-ueda-donna
  - text: 平成18年（2006年）3月6日、上田市・丸子町・真田町・武石村の4市町村が対等合併し、新しい上田市が誕生した
    kind: fact
    level: E2
    status: established
    sources:
    - l3-ueda-donna
  - text: 総務省「地方公共団体コード一覧」では、上田市のコードは202037とされる
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 本拠「真田」と新城「上田」
    text: 真田氏の本拠は現在の上田市真田町周辺の「真田」であり、昌幸はそこから約10キロメートル南西の、小県盆地の中心・上田に新しい城を築いた。2006年の合併で真田町が上田市に入ったことで、本拠の地と新城の地が一つの市に収まった。市名は新城の名「上田」のままである。
    sources:
    - l3-ueda-kotobank
  relations:
  - pref/20
  unknowns:
  - 地名「上田」の語源（氏の名に由来するのか、地形に由来するのか）や文献上の初出は、本バッチでは確定できなかった。築城以前から使われていたことは各種資料が示唆するが、断定はしない
  updated: '2026-11-13'
- id: muni/20-中野市
  code: '202118'
  names:
    ja: 中野市
    reading: なかのし
    aliases:
    - 中野町
    - 中野牧
    - 信州中野
  user_terms:
  - なかの
  - 信州中野
  - 高井富士の見える市
  - 唱歌「故郷」のふるさと
  naming_type: 一部の地名
  prefecture: 長野県
  homonyms: []
  summary: 1954年（昭和29年）に下高井郡中野町を中心に1町8村が合併して誕生した市で、市名は旧中野町の名を継承した。「中野」の名は古代の官牧とされる中野牧に遡り、鎌倉時代には中野氏が活躍した。2005年には豊田村と合併して現在の市域となった。市の北にそびえる高社山は、その秀麗な姿から「高井富士」の異名で親しまれている。
  first_attestation:
    era: 平安時代
    year_western: null
    document: null
    note: 市公式の沿革が古代の「中野牧」の発達を述べることから、地名「中野」は古代の牧の名として現れる。牧の名を記した一次史料の直接確認は未了のため、西暦年と文献名は null とした
  claims:
  - text: 総務省の全国地方公共団体コードで、中野市の団体コードは202118と定められている
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  - text: 中野市によれば、古代には官牧とされる中野牧・笠原牧が発達し、郷の形成を促した。「中野」の名はこの牧の名に遡る
    kind: fact
    level: E2
    status: established
    sources:
    - v1-nakano-city-enkaku
  - text: 中野市によれば、鎌倉時代には中野氏が活躍し、のち高梨氏が館を構えて城下町を形成し、現在の本市の基盤をつくった
    kind: fact
    level: E2
    status: established
    sources:
    - v1-nakano-city-enkaku
  - text: 中野市によれば、明治初年に中野村に中野県の県庁が置かれたが、中野騒動で県庁が焼失し、明治4年（1871年）に県庁を長野村へ移して長野県と改称された
    kind: fact
    level: E2
    status: established
    sources:
    - v1-nakano-city-enkaku
  - text: 中野市によれば、昭和29年（1954年）に中野町を中心に近隣8か村が合併して中野市が誕生し、市名は中心町の中野町の名を継承した
    kind: fact
    level: E2
    status: established
    sources:
    - v1-nakano-city-enkaku
  - text: 中野市によれば、平成17年（2005年）4月1日に中野市と豊田村が合併し、新市「中野市」として発足した
    kind: fact
    level: E2
    status: established
    sources:
    - v1-nakano-city-keikaku
  - text: 中野市によれば、市北部の高社山（こうしゃさん）は地元で「たかやしろ」と呼ばれ、その美しさから「高井富士（たかいふじ）」の異名をもつ市のシンボルである
    kind: fact
    level: E2
    status: established
    sources:
    - v1-nakano-city-kanko
  column:
    title: 一度は県庁所在地だった「中野」
    text: 中野市には、長野県の県名を決めたドラマの前半が眠っています。明治3年（1870年）、伊那県から分かれた中野県の県庁は中野村（現在の中野市）に置かれました。ところが翌年、世直しを求める中野騒動で県庁が焼失。県庁は長野村へ移され、県名も長野県に改められました。もし騒動がなければ、「中野県」が生まれていたかもしれない——県庁所在地の座を巡る歴史の分岐点が、この市の名に刻まれています。
    sources:
    - v1-nakano-city-enkaku
  relations:
  - pref/20
  unknowns:
  - 「中野牧」の名を記した一次史料（延喜式等）の直接確認は未了で、市公式の沿革の紹介による
  - 「中野」の語源（野の中ほどという地形的解釈など）を専門辞典で確認することは未了
  updated: '2026-11-13'
- id: muni/20-伊那市
  code: '202096'
  names:
    ja: 伊那市
    reading: いなし
    aliases:
    - 伊那町
  user_terms:
  - いなし
  - 伊那谷の中心
  - 上伊那の中心都市
  - 伊那の名前の由来
  naming_type: その他（古代の伊那郡に遡る郡名の継承）
  prefecture: 長野県
  homonyms: []
  summary: 伊那市は天竜川の流れる伊那谷北部の中心都市で、市名「伊那」は古代の信濃国伊那郡に遡る古い名である。旧伊那市は1954年の合併で発足し、2006年に高遠町・長谷村と合併して現在の伊那市となった。「伊那」の語源については、渡来系の造船技術集団「伊奈部氏」に由来する説と地形に由来する説があり、地名研究者の間でも見解が分かれている。
  first_attestation:
    era: 古代
    year_western: null
    document: （未確認）
    note: 信濃国伊那郡の名は平安時代の文献に遡ると考えられるが、本調査では一次資料の原文で確認できなかった
  claims:
  - text: 平成18年（2006年）3月31日に、旧伊那市・高遠町・長谷村が合併して新しい伊那市が誕生した
    kind: fact
    level: E2
    status: established
    sources:
    - v2-ina-plan
  - text: 旧伊那市は昭和29年（1954年）4月1日に伊那町・富県村・美篶村・手良村・東春近村・西箕輪村の1町5村の合併で発足し、昭和40年（1965年）に西春近村を編入した
    kind: fact
    level: E2
    status: established
    sources:
    - v2-ina-plan
  - text: 2006年の合併は新設合併であったが、新市の名称には旧伊那市の「伊那市」がそのまま用いられた
    kind: fact
    level: E2
    status: established
    sources:
    - v2-ina-plan
  - text: 「伊那」の語源については、朝鮮半島からの渡来系の造船技術集団「伊奈部氏」に由来するという説がある（伊那谷地名研究会の研究者の説として、伊那市歴史シンポジウムの報告で長野県公式ブログが紹介するもの）
    kind: fact
    level: E4
    status: contested
    sources:
    - v2-ina-sympo
  - text: 同じシンポジウムでは地形に由来するという別の見解も示されており、「いな」という地名の語源は地名研究者の間でも見解がまったく異なっている（長野県公式ブログのシンポジウム報告による）
    kind: fact
    level: E4
    status: contested
    sources:
    - v2-ina-sympo
  - text: 伊那市の地方公共団体コードは202096である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 「伊那」は氏族の名か、地形の名か
    text: 伊那市で開かれた歴史シンポジウムでは、普段当たり前に使っている「いな」という地名の語源をめぐって、研究者の見解が真っ向から分かれた。伊那谷地名研究会の側は、朝鮮半島から渡来した造船技術集団「伊奈部氏」に由来するという説を唱え、別の研究者は地形に由来するという説を唱えた。県の公式ブログはこの対立を「伊那谷の歴史上の事件」とまで書いている。語源が決まらないことは欠陥ではなく、それだけ古く、多くの人の営みが重なった名前だということでもある。
    sources:
    - v2-ina-sympo
  relations:
  - pref/20
  unknowns:
  - 「伊那」の語源の定説は確認できなかった（伊奈部氏説と地形説が研究者の間で対立している）
  - 伊那郡の初出文献を一次資料の原文で確認できなかった
  - 「稲」に由来するとする説など、その他の諸説の出典を確認できなかった
  updated: '2026-11-13'
- id: muni/20-佐久市
  code: '202177'
  names:
    ja: 佐久市
    reading: さくし
    aliases: []
  user_terms:
  - 佐久の名前の由来
  - さくし
  - 佐久平の市
  - 佐久鯉のまち
  naming_type: その他（郡名「佐久」以来の地名の継承）
  prefecture: 長野県
  homonyms: []
  summary: 佐久市は、信濃国の古代の郡名「佐久郡」に由来する地名を受け継ぐ。佐久の語源については、他の信濃諸郡から隔たる位置に由来する説、国境を守る柵の説、狭い地形の説などが古くから挙げられてきたが、『佐久市志』も定説はないとし、『北佐久郡志』は解明は困難だと述べる。市としては昭和36年（1961年）に浅間町ほか3町村の合併で市制を施行し、平成17年（2005年）に臼田町・浅科村・望月町と合併して現在の市となった。
  first_attestation:
    era: 古代
    year_western: null
    document: 和名類聚抄ほか古代史料
    note: 『北佐久郡志』によれば六国史・延喜式・和名抄などの諸書にも佐久郡に関する記述ははなはだ少なく、郡名の確実な初出は本バッチでは特定できなかった
  claims:
  - text: 旧佐久市は、昭和36年（1961年）4月1日に北佐久郡浅間町・東村と南佐久郡野沢町・中込町の合併により市制を施行した
    kind: fact
    level: E2
    status: established
    sources:
    - n3-saku-gappei
  - text: 平成17年（2005年）4月1日に、佐久市・臼田町・浅科村・望月町の4市町村が合併し、現在の佐久市となった
    kind: fact
    level: E2
    status: established
    sources:
    - n3-saku-gappei
  - text: 佐久市は本州のほぼ中央にあり、標高約692メートルで県下四つの平の一つである佐久平の中央に位置する高原都市である
    kind: fact
    level: E2
    status: established
    sources:
    - n3-saku-gappei
  - text: 『佐久市志』は、「佐久」という地名の由来に定説はないとしながら、甲斐・上州の間に突出して他の信濃諸郡から隔たる（さかる）位置にあることに由来する説、国境を守る柵に由来する説、狭隘な地形を意味する「剖割（さきわる）」に由来する説、平地を抉ったような地形に由来する説を挙げている
    kind: fact
    level: E5
    status: contested
    sources:
    - n3-saku-wiki-note
  - text: 『北佐久郡志』は、諏訪の国から地を割（さ）いて分けた意味であるという説や、外敵を防ぐ柵が築かれたためであるという説について「ともに納得できる語源説ではない」とし、今日これを解明することは困難であろうと述べている
    kind: fact
    level: E5
    status: contested
    sources:
    - n3-saku-wiki-note
  - text: 『北佐久郡志』は、六国史・延喜式・和名抄等の諸書にも佐久郡に関する記述ははなはだ少ないことを指摘している
    kind: fact
    level: E5
    status: established
    sources:
    - n3-saku-wiki-note
  - text: 佐久市の地方公共団体コードは202177である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 定説のない地名を、子どもたちにどう教えるか
    text: 佐久の地元の小中学校で使われる副読本『見たい・行きたい 佐久の歴史』は、「佐久」という地名の由来に4つの説を併記している。他の信濃の郡々から遠く離れた「さかる」から来たという説、関東とを結ぶ碓氷峠が国境をふさぐ「せく」が転じたという説、外敵を防ぐ柵が築かれたという説、開拓の神を祀る新海三社神社に関係して「新開（にいさく）」が略されたという説。どれが正しいかは、いまも決まっていない。決まっていないことを決まっていないまま並べて教える――地名の由来の扱いとして、これはむしろ誠実なやり方だろう。
    sources:
    - n3-saku-wiki-note
  relations:
  - pref/20
  unknowns:
  - 「佐久」の語源は定説がなく、市志・郡志とも解明は困難としている
  - 佐久郡の名の確実な初出となる史料は、古代史料の記述自体が乏しく、本バッチでは特定できなかった
  - 平成17年（2005年）の合併の方式（新設合併か編入合併か）は、協議会資料の公開範囲では確認できなかった
  updated: '2026-11-13'
- id: muni/20-千曲市
  code: '202185'
  names:
    ja: 千曲市
    reading: ちくまし
    aliases:
    - 更埴市
    - 戸倉町
    - 上山田町
  user_terms:
  - ちくまし
  - 千曲川に由来する市名
  - 更埴・戸倉・上山田の合併市
  naming_type: 合併新設
  prefecture: 長野県
  homonyms: []
  summary: 千曲市は2003年に更埴市・戸倉町・上山田町が合併して生まれた市で、市名は地域を流れる千曲川（信濃川の長野県内での名）にちなむ。新市名は公募から絞られた「千曲市」と「更科市」の二択による住民アンケートで決められ、千曲市19,346人（51.3%）が更科市17,580人（46.6%）を僅差で上回った。
  first_attestation:
    era: 平成15年
    year_western: 2003
    document: 更埴市・戸倉町・上山田町合併協議会の決定（千曲市公式サイト「千曲市誕生までの経緯」による）
    note: 市名としての「千曲」の命名そのもの。元になった千曲川の名の初出は本調査では確認できなかった
  claims:
  - text: 平成15年（2003年）9月1日に、更埴市・埴科郡戸倉町・更級郡上山田町が合併して千曲市が設置された
    kind: fact
    level: E2
    status: established
    sources:
    - v2-chikuma-keii
  - text: 新市の名称は公募され、応募のあった全346種類から候補が絞り込まれ、最終的に「千曲市」と「更科市」の2つから選ぶ住民アンケートが実施された
    kind: fact
    level: E2
    status: established
    sources:
    - v2-chikuma-keii
  - text: アンケートは18歳以上の全住民53,730人を対象とし、37,714人（70.2%）が回答した。その結果、千曲市19,346人（51.3%）が更科市17,580人（46.6%）を上回り、平成15年1月16日の第8回合併協議会で新市名が「千曲市」に決定した
    kind: fact
    level: E2
    status: established
    sources:
    - v2-chikuma-keii
  - text: 新市名の「千曲」は、合併した1市2町を流れる千曲川の名に由来する
    kind: fact
    level: E2
    status: established
    sources:
    - v2-chikuma-keii
  - text: 合併そのものの賛否を問う住民アンケートでは、対象53,569人のうち42,649人（79.6%）が回答し、合併に前向きな回答が61.7%だった
    kind: fact
    level: E2
    status: established
    sources:
    - v2-chikuma-keii
  - text: 千曲市の地方公共団体コードは202185である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: わずか1,766票差で決まった市名
    text: 千曲市の名前は、住民アンケートの僅差で決まった。「千曲市」19,346票に対して「更科市」17,580票、差は1,766票、割合にして51.3%対46.6%である。敗れた「更科」も、更級郡・更科の名に根ざす由緒ある候補だった。回答率は70.2%と高く、地域のほぼ半分ずつが別の名を推したことになる。今では当たり前に使われる「千曲市」だが、その名は地域の意見が真っ二つに割れた末の、薄氷の決定だった。
    sources:
    - v2-chikuma-keii
  relations:
  - pref/20
  unknowns:
