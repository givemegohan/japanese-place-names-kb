  prefecture: 福岡県
  homonyms: []
  summary: 三井郡の町で、筑後平野の北東部に位置する。町名の本義は「太刀洗」で、南北朝時代の武将・菊池武光が合戦の後に小川で太刀を洗ったという伝承に由来するとされる。1889年に「太刀洗村」と届け出たものが官報に「大刀洗村」と誤って掲載され、その表記がそのまま自治体名として定着した。1955年に大刀洗村・本郷村・大堰村が合併して現在の町となった。
  first_attestation:
    era: 南北朝時代
    year_western: 1359
    document: 大保原の合戦（筑後川の戦い）にまつわる菊池武光の太刀洗い伝承
    note: 由来伝承の舞台となった年であり、「太刀洗」の表記での文献初出そのものは確認できなかった
  claims:
  - text: 菊池武光が合戦の後、小川で血のついた太刀を洗い、川がたちまち朱に染まったといい、そこから「太刀洗」という地名が生まれたと伝えられる
    kind: legend
    level: E4
    status: established
    sources:
    - r4-tachiarai-asahi
  - text: 福岡県の広報誌『グラフふくおか』は、町名は1359年の筑後川の戦いにおいて武将・菊池武光が小川で太刀を洗ったという伝説から名付けられたと紹介する
    kind: legend
    level: E2
    status: established
    sources:
    - r4-tachiarai-fukuoka
  - text: 『日本歴史地名大系』は『大刀洗町史』を引き、大刀洗川の名は延文4年（1359年）の合戦で菊池武光が小川を渡り、そこで大刀を洗ったことに由来すると説明し、山隈には菊池渡（きくちわたり）という字名があるとする
    kind: legend
    level: E3
    status: established
    sources:
    - upg-p9-tachiarai-kotobank
  - text: 1889年（明治22年）の町村制施行の際、村は「太刀洗村」として届け出たが、政府側の手違いで官報に「大刀洗村」と誤って記載され、訂正の申請は認められなかったため、「大刀洗」の表記が自治体名として定着した（朝日新聞が町企画財政課の説明として紹介）
    kind: fact
    level: E4
    status: established
    sources:
    - r4-tachiarai-asahi
  - text: 1955年（昭和30年）3月31日、大刀洗村・本郷村・大堰村が対等合併し、大刀洗町が発足した
    kind: fact
    level: E2
    status: established
    sources:
    - upg-p9-tachiarai-plan
  - text: 大刀洗公園には、町名の由来となった武将・菊池武光の銅像が設置されている
    kind: fact
    level: E2
    status: established
    sources:
    - r4-tachiarai-fukuoka
  - text: 町の北部から隣の筑前町にかけて、かつて「東洋一と謳われた」大刀洗飛行場があり、大刀洗陸軍飛行学校が置かれて西日本航空発祥の地とされる。飛行場の名には「大刀洗」ではなく「太刀洗」の表記が残った
    kind: fact
    level: E2
    status: established
    sources:
    - r4-tachiarai-town
  - text: 地方公共団体コードは405035である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 役所の手違いが町名になった
    text: 「太刀洗村」の届け出が官報で「大刀洗村」と誤植され、訂正も認められないまま130年以上が過ぎた。一方で、旧陸軍の大刀洗飛行場や駅名などには本来の「太刀洗」の表記が残り、町内とその周辺では今も「大刀洗」と「太刀洗」が混在している。誤記が正式な地名として勝ち残った、全国でも珍しい例である。
    sources:
    - r4-tachiarai-asahi
    - r4-tachiarai-town
  relations:
  - pref/40
  - muni/40-筑前町
  unknowns:
  - 「太刀洗」の表記での地名の文献初出（伝承の舞台である1359年以前に遡るか）は確認できなかった
  - 官報の誤記について、官報そのものや県の公文書での直接確認はできていない（町企画財政課の説明を伝える新聞報道による）
  updated: '2026-11-13'
- id: muni/40-大川市
  code: '402125'
  names:
    ja: 大川市
    reading: おおかわし
    aliases:
    - 大川町
  user_terms:
  - 大川はなぜ大川というの
  - 家具のまち大川
  - 大川家具の産地
  - 榎津（えのきづ）のあたり
  naming_type: 中心地名の継承
  formation: 合併新設
  prefecture: 福岡県
  homonyms: []
  summary: 筑後川の河口域に位置する家具のまち。明治22年（1889年）に誕生した大川町の名を引き継ぎ、昭和29年（1954年）に大川町と周辺5村が合併して大川市となった。市は「大川」の名を「筑後川にゆかりある地名」と説明するが、命名の具体的な経緯や語源の定説は公表資料では示されていない。河口の榎津・若津は古くから水運の拠点で、船大工の技術が後の大川家具の基盤になった。
  first_attestation:
    era: 明治22年
    year_western: 1889
    document: 町村制施行による大川町の発足
    note: 自治体名としての「大川」の初出。それ以前に集落名・地域名として「大川」がどの範囲を指して使われていたかは、確認した市の資料では明らかにされていない
  claims:
  - text: 大川市の地方公共団体コードは402125である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  - text: 明治22年（1889年）の町村合併に伴い大川町が誕生したと大川市の歴史文化基本構想は伝える
    kind: fact
    level: E2
    status: established
    sources:
    - r4-okawa-rekishi-bunka
  - text: 昭和29年（1954年）の町村合併の際に、三瀦郡大川町と三又村・木室村・田口村・川口村・大野島村の1町5村が合併して「大川市」が誕生し、「大川」の名は新市の名称として継承された
    kind: fact
    level: E2
    status: established
    sources:
    - r4-okawa-rekishi-bunka
  - text: 「大川」の名について市は「筑後川にゆかりのある地名として市民に定着している」と説明するにとどまり、命名の経緯や語源の定説は市の公表資料では示されていない
    kind: fact
    level: E2
    status: indeterminate
    sources:
    - r4-okawa-rekishi-bunka
  - text: 筑後川はかつて「ちとせ川（千年川）」や「一夜川」、筑前・筑後の両国の中間にあるため「筑間川」とも呼ばれ、江戸幕府の命により寛永13年（1636年）に「筑後川」と改称されたと市の資料は伝える
    kind: fact
    level: E2
    status: established
    sources:
    - r4-okawa-rekishi-bunka
  - text: 市域の榎津には近世初期に船大工が住んでいたことが史料で確認でき、日田の木材が筑後川を通じて運ばれたことが、後の木工・家具産業の発展の基盤になった
    kind: fact
    level: E2
    status: established
    sources:
    - r4-okawa-rekishi-bunka
  column:
    title: 川の名を冠する家具のまち
    text: 大川市の市名は、九州最大の川・筑後川の河口に開けた町の名である。河口の榎津・若津は水運の拠点として栄え、船大工たちが高度な木工技術を伝えた。明治に入ると榎津指物は「大川指物」と呼ばれるようになり、昭和54年（1979年）には生産額1,000億円を超えて「日本一の家具のまち」となった。川が運んだ木材と、川の名を冠した町の名は、このまちでは今も切り離せない。
    sources:
    - r4-okawa-rekishi-bunka
  relations:
  - pref/40
  unknowns:
  - 「大川」の語源の定説（筑後川そのものを指した呼び名だったのか、1889年の合併時に新たに付けられたのか）は、公的・専門資料では確認できなかった
  - 明治22年（1889年）の大川町の成立時の構成（榎津・小保・向島などの範囲）は、市の要約資料からは確認できなかった
  updated: '2026-11-13'
- id: muni/40-大木町
  code: '405221'
  names:
    ja: 大木町
    reading: おおきまち
    aliases: []
  user_terms:
  - おおき
  - 大木
  - クリーク（堀）の町
  - 三潴郡で唯一の町
  naming_type: 合成地名
  naming_note: 1955年に3村が合併し、村を経ず町として発足
  formation: 合併新設
  prefecture: 福岡県
  homonyms: []
  summary: 三潴郡の町で、筑後平野の南西部に位置する。1889年に発足した大溝村・木佐木村・大莞村が、1955年1月1日に合併し、村を経ずに直接町制を施行して大木町となった。新町名「大木」は村民公募で集められた候補を協議で3案に絞り、全村民投票で決定したと福岡県公文書館が紹介する。2005年以降は三潴郡を構成する唯一の自治体である。
  first_attestation:
    era: 昭和30年
    year_western: 1955
    document: 大溝村・木佐木村・大莞村の合併に伴う新町名の選定（福岡県公文書館の紹介による全村民投票）
    note: 町名「大木」そのものの成立時点。前身の旧村名の初出は確認していない
  claims:
  - text: 1889年（明治22年）の町村制施行により、大溝村・木佐木村・大莞村が発足した
    kind: fact
    level: E2
    status: established
    sources:
    - r4-ooki-town
    - r4-ooki-kobunshokan
  - text: 1955年（昭和30年）1月1日、大溝村・木佐木村・大莞村が新設合併して町制を施行し、大木町が発足した
    kind: fact
    level: E2
    status: established
    sources:
    - upg-p9-ooki-koho
  - text: 福岡県公文書館によれば、新しい町名は村民から募集し、協議で絞られた「大木」「木佐木」「花井」の3つの候補から、全村民投票によって「大木」に決定した
    kind: fact
    level: E2
    status: established
    sources:
    - r4-ooki-kobunshokan
  - text: 「大木」は大溝村の「大」と木佐木村の「木」を合わせた合成名と見ることもできるが、命名の理由を明記した公的資料は確認できず、確認できるのは村民投票で選ばれたという経緯のみである
    kind: fact
    level: H
    status: inferred
    sources:
    - r4-ooki-kobunshokan
  - text: 2005年（平成17年）に城島町と三潴町が久留米市へ編入合併された結果、大木町は三潴郡を構成する唯一の自治体となった
    kind: fact
    level: E2
    status: established
    sources:
    - r4-ooki-kobunshokan
  - text: 町域は標高4〜5メートルのほぼ平坦な水田地帯で、「堀」と呼ばれるクリーク（溝渠）が縦横に走り、その面積は町全体の14%を占める
    kind: fact
    level: E2
    status: established
    sources:
    - r4-ooki-kobunshokan
  - text: 中世には藤原北家・徳大寺家の荘園があり、筑後宇都宮氏が下向して大木城に拠った。戦国時代には蒲池氏の一族・大木氏の領地であった
    kind: fact
    level: E5
    status: established
    sources:
    - r4-ooki-wiki
  - text: 地方公共団体コードは405221である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 投票で決まった町名と、中世の「大木」
    text: 町内には中世の大木城や大木氏の名が残るため、「大木町」は古い地名の継承のように見える。しかし実際に町名が決まったのは1955年の合併のときで、公募で集まった候補を「大木」「木佐木」「花井」の3案に絞り、全村民の投票で「大木」が選ばれた。古名と響きが重なったのは偶然か意図か、記録は残っていない。
    sources:
    - r4-ooki-kobunshokan
    - r4-ooki-wiki
  relations:
  - pref/40
  unknowns:
  - 村民投票で選ばれた「大木」という候補名そのものの命名理由（応募者の意図）は確認できなかった
  - 大溝・木佐木・大莞の旧村名それぞれの語源・初出は確認できなかった
  updated: '2026-11-13'
- id: muni/40-大牟田市
  code: '402028'
  names:
    ja: 大牟田市
    reading: おおむたし
    aliases: []
  user_terms:
  - 大牟田ってどういう意味
  - 三池炭鉱のまち
  - 大蛇山まつりのまち
  naming_type: 中心地名の継承
  formation: 合併新設
  prefecture: 福岡県
  homonyms: []
  summary: 市名は、有明海沿岸に広がっていた大きな低湿地帯を指す「ムタ（牟田）」に由来すると公的資料は説明する。「牟田」は沼地・湿地を意味する古い地名語で、1889年に合併で生まれた大牟田町がそのまま1917年に市制を施行して大牟田市となった。
  first_attestation:
    era: 明治22年
    year_western: 1889
    document: 町村制施行による三池郡大牟田町の発足
    note: 大牟田町は大牟田・下里・稲荷・横須の4か村の合併で発足し、構成村の一つ大牟田村の名を継いだ。村名としての「大牟田」の文書上の初出は特定できなかった
  claims:
  - text: 環境省九州地方環境事務所の資料は「本市の名称は、有明海沿岸の大きな低湿地帯（ムタ）に由来する」と説明する
    kind: fact
    level: E2
    status: established
    sources:
    - l6-omuta-env-kyushu
  - text: 「牟田（無田）」は沼地・湿地を意味する語で、大分県立図書館のレファレンス回答も「無田（牟田）は沼地、湿地のこと」と解説する
    kind: fact
    level: E2
    status: established
    sources:
    - l6-omuta-ndl-crd
  - text: 1889年（明治22年）に大牟田・下里・稲荷・横須の4か村が合併して大牟田町が発足した
    kind: fact
    level: E2
    status: established
    sources:
    - upg-p11-omuta-city-museum
  - text: 1917年（大正6年）に市制を施行して大牟田市となった（地方公共団体コードは402028）
    kind: fact
    level: E2
    status: established
    sources:
    - l6-omuta-city-ayumi
    - b-cap-chiba-soumu-code
  - text: 市制後も市名は受け継がれ、1929年（昭和4年）には三川町を編入するなど市域を広げながら「大牟田」の名を維持した
    kind: fact
    level: E2
    status: established
    sources:
    - l6-omuta-city-ayumi
  - text: 市の夏祭り「大蛇山」は三池の祇園祭に由来し、蛇は水の神様の象徴とする水神信仰と結びついた行事であると祭りの公式サイトは説明する。1852年（嘉永5年）の三池祇園の祭りで約30人が山を曳いた記録が原型とされる
    kind: legend
    level: E4
    status: established
    sources:
    - l6-omuta-daijayama
  column:
    title: ムタのまちと、水の神の大蛇
    text: 「大牟田」という名の芯にあるのは、沼地や湿地を指す古い言葉「ムタ」である。有明海の干潟に面した低湿地の地名が、そのまま炭鉱のまちの名になった。一方、このまちの夏を彩る大蛇山まつりで主役になるのは、水の神の象徴とされる大蛇の山車である。湿地の名を持つまちが、水の神を祀る祭りを育てたという重なりは、偶然以上の土地の記憶を感じさせる。もっとも、これは地名と祭りの由来を直接結ぶ資料があるわけではなく、あくまで読み物としての感想にとどまる。
    sources:
    - l6-omuta-env-kyushu
    - l6-omuta-daijayama
  relations:
  - pref/40
  unknowns:
  - 村名としての「大牟田」の文書上の初出（中世・近世の三池郡大牟田村の用例）は特定できなかった
  - 『角川日本地名大辞典』など専門辞典における大牟田の語源記述の直接確認が未了
  updated: '2026-11-13'
- id: muni/40-大野城市
  code: '402192'
  names:
    ja: 大野城市
    reading: おおのじょうし
    aliases:
    - 大野
  user_terms:
  - 大野城市の名前の由来
  - 大野城跡の市
  - 日本最古の山城の名前の市
  naming_type: 藩名・城名から
  naming_note: 古代の山城「大野城」の名に由来し、旧村名・町名「大野」を経て市名となった
  formation: 単独発足
  prefecture: 福岡県
  homonyms: []
  summary: 市名は、天智4年（665年）に大野山（現在の四王寺山）に築かれた朝鮮式山城「大野城」に由来すると市は説明する。663年の白村江の戦いの敗北を受け、大宰府を守るために築かれた日本最古級の山城で、その名は1889年発足の大野村、大野町を経て、1972年4月の市制施行により大野城市となった。
  first_attestation:
    era: 天智4年
    year_western: 665
    document: 日本書紀（天智天皇4年条）
    note: 憶礼福留らを筑紫に遣わして大野城と基肄城（椽城）を築かせた記事として『改訂新版 世界大百科事典』が紹介するもの。原文の直接確認は未了のため紹介形で記録する
  claims:
  - text: 大野城市の地方公共団体コードは402192である（総務省「地方公共団体コード一覧」による）
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  - text: 大野城市の名称は、天智4年（665年）に大野山（現在の四王寺山）に築かれた、わが国最古の朝鮮式山城「大野城」に由来する
    kind: fact
    level: E2
    status: established
    sources:
    - r2-onojo-city-gaiyo
  - text: 大野城は663年の白村江の戦いの敗北を受けて唐・新羅の攻撃に備えて築かれ、水城・基肄城と連携して大宰府の防衛にあたった
    kind: fact
    level: E2
    status: established
    sources:
    - r2-onojo-city-gaiyo
  - text: 『日本書紀』天智天皇4年条には、百済系の憶礼福留と四比福夫を筑紫国に遣わして大野城と椽城（基肄城）を築かせたことが記されていると『改訂新版 世界大百科事典』は紹介する
    kind: fact
    level: E3
    status: established
    sources:
    - r2-onojo-kotobank
  - text: 現在の市域は1889年の村制施行による大野村の誕生をもって一つの自治体となり、1950年に町制を施行して大野町、1972年4月に市制を施行して大野城市となった
    kind: fact
    level: E2
    status: established
    sources:
    - r2-onojo-city-gaiyo
  - text: 大野城跡は太宰府市・宇美町にもまたがる国の特別史跡で、四王寺山一帯に全周約6キロを超える土塁・石垣の跡が残る
    kind: fact
    level: E3
    status: established
    sources:
    - r2-onojo-kotobank
  column:
    title: 山の上の城の名を名乗る市
    text: 大野城市の市役所のあたりに、城はない。市の名の由来となった大野城は、市域の端、四王寺山の山上にある。665年、白村江の敗戦の衝撃の中で築かれた朝鮮式山城で、全周6キロを超える土塁が山を取り巻いた。城跡自体は太宰府市・宇美町にもまたがり、今は特別史跡として静かに残るだけだが、その名は大野村・大野町を経て市の名前となり、1300年以上も呼ばれ続けている。実物の城が役目を終えたあとも、名前だけが平地の市に生き残ったのである。
    sources:
    - r2-onojo-city-gaiyo
    - r2-onojo-kotobank
  relations:
  - pref/40
  - muni/40-太宰府市
  - muni/40-春日市
  - muni/40-福岡市
  unknowns:
  - 1889年の大野村の村名が大野城に直接由来することを示す当時の記録は未確認であり、市の説明の範囲にとどまる
  - 「大野」という地名自体の語源は、資料では特定できなかった
  updated: '2026-11-13'
- id: muni/40-太宰府市
  code: '402214'
  names:
    ja: 太宰府市
    reading: だざいふし
    aliases:
    - 大宰府
    - 宰府
  user_terms:
  - 太宰府と大宰府の違い
  - 令和の都 太宰府
  - 太宰府天満宮の市
  - 大宰府政庁跡
  naming_type: 中心地名の継承
  formation: 改称
  prefecture: 福岡県
  homonyms: []
  summary: 市名は、九州全体を統治した古代の役所「大宰府」に由来する。役所の正式表記は「大宰府」だが、地名としては奈良時代から「太宰府」の表記も現れ、中世以降は「太」が主流となり、近世にはほとんど「太宰府」と書かれた。1881年に宰府村が太宰府村と改称し、1892年に太宰府町、1982年4月1日に太宰府市となった。現在も役所・遺跡は「大宰府」、地名・自治体は「太宰府」と書き分けられている。
  first_attestation:
    era: 天智10年
    year_western: 671
    document: 日本書紀
    note: 「大宰府」の語の初出とWikipediaが紹介するもの。原文の直接確認は未了のため紹介形で記録する
  claims:
  - text: 太宰府市の地方公共団体コードは402214である（総務省「地方公共団体コード一覧」による）
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  - text: 古代の役所の正式な表記は、現存する印影「大宰之印」や『続日本紀』の表記から「大宰府」であったと考えられている
    kind: fact
    level: E2
    status: established
    sources:
    - r2-dazaifu-city-faq
  - text: 奈良時代の文書にもすでに「太宰府」と表記されたものがあり、中世からは「太宰府」と書く文書が多くなり、近世以降は地名としてほとんど「太宰府」と書かれるようになった
    kind: fact
    level: E2
    status: established
    sources:
    - r2-dazaifu-city-faq
  - text: 太宰府市公式によれば、昭和30年代末頃に九州大学の鏡山猛教授らが古代の役所と中世以降の地名を書き分けることを始めたことがきっかけとなり、現在は律令時代の役所・遺跡を「大宰府」、中世以降の地名や太宰府天満宮を「太宰府」と表記し、行政表記も「大宰府政庁跡」「太宰府市」のように明確に使い分けられている
    kind: fact
    level: E2
    status: established
    sources:
    - r2-dazaifu-city-faq
    - r2-dazaifu-city-plan
  - text: 「宰府」という略称の確認できる最古の用例は永長2年（1097年）の記述で、12世紀以降に使用例が増えた
    kind: fact
    level: E2
    status: established
    sources:
    - r2-dazaifu-city-faq
  - text: 1881年に御笠郡宰府村が太宰府村と改称し、1889年の町村制で太宰府村となり、1892年に町制を施行して太宰府町となった
    kind: fact
    level: E2
    status: established
    sources:
    - upg-p12-dazaifu-city-gappei
    - upg-p12-dazaifu-city-hensen
  - text: 1955年3月1日に水城村と対等合併して新・太宰府町となり、1982年4月1日に市制を施行して太宰府市となった
    kind: fact
    level: E2
    status: established
    sources:
    - upg-p12-dazaifu-city-hensen
  - text: 大宰府は九州における政治の重要性を考えて古代律令制下に置かれた役所であり、その読みは和名でオオイミコトモチノツカサであったと太宰府市は説明する
    kind: fact
    level: E2
    status: established
    sources:
    - r2-dazaifu-city-chimei
  column:
    title: 元号「令和」は太宰府で生まれた
    text: 新元号「令和」の典拠となった『万葉集』巻5の「梅花の宴」の序文は、大宰府の長官・大伴旅人の邸宅で催された宴を記したものである。730年正月、九州各地の官人たちが旅人の邸に集い、梅の花を題に32首の歌を詠んだ。その宴の序に「初春の令月、気淑く風和らぐ」とあったことが、1300年近くを経て日本の元号の出典となった。太宰府市はこのゆかりから「令和発祥の都」を掲げている。古代の役所の名を継ぐ市が、元号のふるさとにもなったのである。
    sources:
    - r2-dazaifu-city-plan
  relations:
  - pref/40
  - muni/40-大野城市
  - muni/40-福岡市
  unknowns:
  - 村名として「太宰府」の表記が1881年の改称で採用された経緯（なぜ「大」でなく「太」だったのか）は、市の公式資料では確認できなかった
  - 『日本書紀』の671年の記事が「大宰府」の初出であるという説はWikipediaの紹介によるもので、原文の確認は未了
  updated: '2026-11-13'
- id: muni/40-宇美町
  code: '403415'
  names:
    ja: 宇美町
    reading: うみまち
    aliases:
    - 宇瀰
    - 蚊田
  user_terms:
  - うみ
  - 宇美
  - 応神天皇が生まれたと伝わる町
  - 安産の神様・宇美八幡宮の町
  naming_type: 中心地名の継承
  naming_note: 旧・宇美村の名を継承
  formation: 合併新設
  prefecture: 福岡県
  homonyms: []
  summary: 糟屋郡の町。『古事記』『日本書紀』が伝える神功皇后の応神天皇出産の故事にちなみ、出産を意味する「産み」に通じる名とされ、古くは「宇瀰」とも書かれた。1889年に宇美村・炭焼村・四王寺村・井野村の区域をもって宇美村が発足し、1920年に糟屋郡で最初に町制を施行した。以来一度も合併していない。
  first_attestation:
    era: 奈良時代
    year_western: 712
    document: 『古事記』中巻（神功皇后の条）
    note: 『古事記』は皇后の御子の生地を号けて「宇美」というとし、『日本書紀』（720年）では「宇瀰」の表記で産所を号けたとする。いずれも宇美八幡宮・宇美町公式資料が紹介する記載で、原文の直接確認はしていない
  claims:
  - text: 宇美町総合計画は、『古事記』や『日本書紀』に、神功皇后が応神天皇を出産された地を「宇美（産み）」と呼ぶようになったという記述があると紹介する
    kind: legend
    level: E2
    status: established
    sources:
    - r4-umi-plan
  - text: 宇美八幡宮によれば、『日本書紀』には皇后が新羅から還る際に皇子を生み、その産所を号けて「宇瀰」といったとあり、産所の地「蚊田（かだ）」は宇美の古名とされる
    kind: legend
    level: E4
    status: established
    sources:
    - r4-umi-hachimangu
  - text: 宇美八幡宮は、御産所の四辺に八つの幡（はた）を立てて兵士に守らせた故事が、後世「八幡大神」と称する由縁になったとも伝え、同宮は敏達天皇の御宇（570年頃）に創建されたと伝える
    kind: legend
    level: E4
    status: established
    sources:
    - r4-umi-hachimangu
  - text: 『魏志』「倭人伝」に現れる不弥国を宇美に比定する説は、新井白石が『古史通惑問』で指摘して以来唱えられており、町は国指定史跡・光正寺古墳をその根拠の一つとして注目する
    kind: fact
    level: E2
    status: contested
    sources:
    - r4-umi-plan
    - r4-umi-wiki
  - text: 明治期に宇美・炭焼・井野・四王寺の4村が合併して宇美村が発足し、1920年（大正9年）10月に糟屋郡で最初に町制を施行して宇美町となった
    kind: fact
    level: E2
    status: established
    sources:
    - upg-p9-umi-zck
  - text: 町制施行は糟屋郡で最初であり、当時の戸数は2,585戸、人口は11,975人であった（宇美町総合計画）
    kind: fact
    level: E2
    status: established
    sources:
    - r4-umi-plan
  - text: かつては石炭産業で栄え、三菱鉱業勝田鉱業所があったが、1948年（昭和23年）6月18日に坑内爆発事故が発生して多数の死者が出た。勝田鉱業所は1963年（昭和38年）に閉山した
    kind: fact
    level: E2
    status: established
    sources:
    - r4-umi-plan
    - r4-umi-wiki
  - text: 宇美八幡宮の安産信仰にまつわる「子安の木（槐）」「産湯の水」「胞衣が浦」などの対象は、1955年（昭和30年）に福岡県指定文化財（民俗資料）に一括指定された
    kind: fact
    level: E4
    status: established
    sources:
    - r4-umi-hachimangu
  - text: 地方公共団体コードは403415である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 「産み」の町と、古い名「蚊田」
    text: 記紀の伝承では、応神天皇が生まれた土地そのものは「蚊田（かだ）」と呼ばれていて、生まれたこと自体を記念して「宇瀰（うみ）」、のち「宇美」と号したとされる。つまり宇美は土地の古名ではなく「出来事の記念名」だという点が珍しい。今も宇美八幡宮は安産の守護神「子安大神」として全国から参拝者を集めている。
    sources:
    - r4-umi-hachimangu
  relations:
  - pref/40
  - muni/40-志免町
  unknowns:
  - 『和名類聚抄』など律令期の文献に「宇美」の郷名が見えるかどうかは確認できなかった
  - 不弥国の比定地については諸説があり、宇美とする説が定説かどうかは確認できなかった
  updated: '2026-11-13'
- id: muni/40-宗像市
  code: '402206'
  names:
    ja: 宗像市
    reading: むなかたし
    aliases:
    - 胸形
    - 胸肩
    - 宗形
    - 牟那加多
  user_terms:
  - 宗像の名前の由来
  - 宗像大社の市
  - 沖ノ島の世界遺産の市
  - 胸形と書いた宗像
  naming_type: 中心地名の継承
  formation: 編入合併
  prefecture: 福岡県
  homonyms: []
  summary: 市名は、宗像大社とそれを奉斎した胸形氏（のちの宗像氏）、そして古代の宗像郡の名を継ぐ。ムナカタは記紀では「胸形」「胸肩」などと書かれ、「宗像」の表記は平安から中世以降に定着した。1955年に宗像町が成立し、1981年に市制を施行、2003年に玄海町と合併、2005年に大島村を編入して現在の市域となった。2017年には宗像大社の三宮を含む資産が世界遺産に登録された。
  first_attestation:
    era: 奈良時代
    year_western: 712
    document: 古事記
    note: 宗像三女神の鎮座地として「胸形の奥津宮・中津宮・辺津宮」のように「胸形」の表記で現れる（國學院大學の神社データベースが紹介）。現在の「宗像」の表記ではない点に注意
  claims:
  - text: 宗像市の地方公共団体コードは402206である（総務省「地方公共団体コード一覧」による）
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  - text: 國學院大學の神社データベースによれば、『古事記』は宗像三女神が「胸形の奥津宮・中津宮・辺津宮」に鎮座すると伝え、三女神を奉斎する氏族を記紀の本書は「胸形君」とする
    kind: fact
    level: E2
    status: established
    sources:
    - r2-kokugakuin-munakata
  - text: ムナカタの表記は古くは胸形・胸肩・宗形・牟那加多など様々に書かれたが、平安時代以降（むなかた電子博物館は中世以降とする）に「宗像」の表記が定着したとされる
    kind: fact
    level: E2
    status: established
    sources:
    - r2-kokugakuin-takirihime
    - r2-munahaku-chimei
  - text: 古代の宗像郡は現在の宗像市・福津市・古賀市のほぼ全域を含む範囲であり、『和名類聚抄』には郡内に十四郷があったと宗像市の計画資料は紹介する
    kind: fact
    level: E2
    status: established
    sources:
    - r2-munakata-city-plan
  - text: 1981年に宗像町が市制を施行し、2003年に玄海町と合併、2005年に大島村を編入して現在の宗像市となった
    kind: fact
    level: E2
    status: established
    sources:
    - r2-munakata-city-plan
  - text: 宗像大社の沖津宮・中津宮・辺津宮を含む「『神宿る島』宗像・沖ノ島と関連遺産群」が2017年7月に世界遺産に登録され、三宮すべてが同一自治体内に所在するようになったことが登録活動の弾みになったと宗像市は説明する
    kind: fact
    level: E2
    status: established
    sources:
    - r2-munakata-city-plan
  - text: ムナカタの語源については、『宗像郡勢大鑑』がムネ（高くなった所）・カタ（方）の転訛で沼沢地に接する集落を意味するとし、『福岡県地名考』はヌマ・カタ・ガタ（潟）の転訛とする説を紹介しており、定説はない
    kind: fact
    level: E4
    status: contested
    sources:
    - r2-munahaku-chimei
  - text: 『西海道風土記』の逸文に基づく伝承として、宗像三女神の形代を奉祭したことから「身の形・身の像」と称し、これが宗像の名の起こりであると伝えられる
    kind: legend
    level: E4
    status: established
    sources:
    - r2-munahaku-chimei
  column:
    title: 合併が世界遺産を後押しした
    text: 宗像大社は、沖ノ島の沖津宮、大島の中津宮、本土の辺津宮の三宮からなる。この三宮は、もともと別々の自治体に分かれて存在していた。2003年に玄海町が、2005年に大島村が宗像市に加わったことで、三宮すべてがひとつの市の中にそろった。市の計画資料は、この合併が世界遺産登録への活動の大きな弾みになったと振り返る。2017年、「『神宿る島』宗像・沖ノ島と関連遺産群」は世界遺産に登録された。地名の由来である神社の三宮が、平成の市町村合併によって一つの自治体に収まったのである。
    sources:
    - r2-munakata-city-plan
  relations:
  - pref/40
  - muni/40-福津市
  - muni/40-古賀市
  unknowns:
  - 「胸形」の語義（なぜ「胸」の字があてられたのか）は、資料では確定できなかった
  - 宗像郡という郡名の文献上の初出は特定できなかった
  updated: '2026-11-13'
- id: muni/40-宮若市
  code: '402265'
  names:
    ja: 宮若市
    reading: みやわかし
    aliases:
    - 宮田町
    - 若宮町
  user_terms:
  - 宮若はなぜ宮若というの
  - 旧宮田町・若宮町のあたり
  - 犬鳴（いぬなき）の山あい
  - 脇田温泉のまち
  naming_type: 合成地名
  formation: 合併新設
  prefecture: 福岡県
  homonyms: []
  summary: 平成18年（2006年）2月11日、鞍手郡の宮田町と若宮町が合併して発足した市。市名「宮若」は宮田の「宮」と若宮の「若」を合わせた合成地名で、公募の上位10候補への3回の投票を経て選ばれた。若宮の名は中世の荘園「若宮荘」に遡り、その起こりは若宮八幡宮と推定されている。
  first_attestation:
    era: 平成17年
    year_western: 2005
    document: 合併の官報告示（平成17年4月28日）
    note: 市名「宮若」としての初出はこの合併告示とされ、自治体としては平成18年（2006年）2月11日に発足した。もとの地名の層では、中世の荘園名「若宮荘」が古い用例にあたる
  claims:
  - text: 宮若市の地方公共団体コードは402265である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  - text: 本市は平成18年（2006年）2月11日、鞍手郡宮田町と若宮町の合併を経て発足したと宮若市教育委員会の文化財保護基本計画は伝える
    kind: fact
    level: E2
    status: established
    sources:
    - r4-miyawaka-bunkazai-plan
  - text: 中世の本市域は宗像社領や若宮荘・粥田荘の領域で、若宮荘の名は、京都六条若宮との関係でこの地に置かれた若宮八幡宮がその名の起こりと推定されている
    kind: fact
    level: E2
    status: established
    sources:
    - r4-miyawaka-bunkazai-plan
  - text: 若宮町は昭和18年（1943年）に町制を施行し、昭和26年（1951年）に中村・山口村と合併したと市の計画は伝える
    kind: fact
    level: E2
    status: established
    sources:
    - r4-miyawaka-bunkazai-plan
  - text: 新市名は公募され、応募数の上位10点までの候補について3回にわたる投票（10点から3点、さらに2点へと絞り込み）が行われて「宮若」が選定されたと、日本都市センターの合併要覧は伝える
    kind: fact
    level: E2
    status: established
    sources:
    - upg-ag4-miyawaka-gappei-yoran
  - text: 市名「宮若」は、合併した宮田町と若宮町の名から一字ずつを取った合成地名である
    kind: fact
    level: E2
    status: established
    sources:
    - upg-ag4-miyawaka-gappei-yoran
  column:
    title: 大きな合併からこぼれて生まれた市
    text: 宮若市の合併は、最初から2町の合併だったわけではない。当初は直方市を中心とする「直鞍合併協議会」が平成15年（2003年）に設置され、5市町での大合併が目指された。しかし若宮町が協議から離脱を表明し、宮田町もこれに続いて、結局は2町だけの法定協議会が作り直された。平成18年（2006年）2月11日、宮田の「宮」と若宮の「若」を編んだ「宮若市」が誕生した。大きな枠組みからこぼれた2町が、自分たちの頭文字で新しい市の名を作ったのである。
    sources:
    - r4-miyawaka-hensen-db
    - r4-miyawaka-bunkazai-plan
  relations:
  - pref/40
  unknowns:
  - 宮田の「宮」がどの宮（神社）に由来するかは、確認した市の資料では説明されていなかった
  - 公募候補の具体的な名称（「若宮田」「犬鳴」など）は市区町村変遷情報が伝えるのみで、日本都市センターの合併要覧には候補名の列挙がない
  updated: '2026-11-13'
- id: muni/40-小竹町
  code: '404012'
  names:
    ja: 小竹町
    reading: こたけまち
    aliases:
    - 勝野村
  user_terms:
  - こたけ
  - 小竹
  - 小竹の処
  - 筑豊の旧炭鉱町
  naming_type: 新規命名
  naming_note: 町制施行に際し、古称「小竹の処」をもとに命名
  formation: 合併新設
  prefecture: 福岡県
  homonyms: []
  summary: 鞍手郡の町。1889年に6村が合併して勝野村として発足したが、1928年1月1日の町制施行の際に「小竹町」へ改称した。町公式によれば、古来、町内の街道沿いに竹薮が生い茂り「小竹の処（ところ）」といわれたことが町名の起こりとされる。中心地の勝野ではなく、街道の景観に由来する古称を自治体名に選んだ例である。
  first_attestation:
    era: 昭和3年
    year_western: 1928
    document: 勝野村の町制施行に伴う改称（小竹町公式サイト「町の概要」）
    note: 町名「小竹」としての成立時点。「小竹の処」という古称自体の初出文献・時期は確認できなかった
  claims:
  - text: 1884年（明治17年）に勝野・新多・新山崎・南良津・御徳・赤地・中泉の7か村で勝野村外6か村戸長役場が置かれ、1889年（明治22年）の町村制の際に中泉村は福智村（現・直方市）に併合され、他の6か村を合併して勝野村として発足した
    kind: fact
    level: E2
    status: established
    sources:
    - r4-kotake-town
  - text: 1928年（昭和3年）1月1日、勝野村に町制が施行され、現町名「小竹町」に名称変更された
    kind: fact
    level: E2
    status: established
    sources:
    - r4-kotake-town
  - text: 町名の由来は、古来、町内の街道沿いに竹薮が生い茂り、小竹の町まで続いていて、「小竹の処」といわれたのが町名のおこりになったといわれている（小竹町公式の説明）
    kind: legend
    level: E2
    status: indeterminate
    sources:
    - r4-kotake-town
  - text: 町章は1938年（昭和13年）1月1日に制定され、「小竹」の文字をデザイン化し、色は竹をイメージしたものと町公式が説明する
    kind: fact
    level: E2
    status: established
    sources:
    - r4-kotake-town
  - text: 町域の中央部を遠賀川が北流し、長崎街道を擁する交通の要衝として栄えた（小竹町公式）
    kind: fact
    level: E2
    status: established
    sources:
    - r4-kotake-town
  - text: 戦中・戦後を通じて石炭産業で栄えたが、エネルギー革命の影響で閉山が相次ぎ、昭和31年（1956年）に有馬御徳炭鉱が閉山したのを皮切りに、主力の古河目尾（しゃかのお）炭鉱も昭和44年（1969年）に閉山した
    kind: fact
    level: E2
    status: established
    sources:
    - upg-b-kotake-town
  - text: 地方公共団体コードは404012である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 中心地の名を捨てて、街道の景観を採った
    text: 1889年の発足時は、戸長役場の置かれた勝野の名をとって勝野村だった。ところが1928年の町制施行で選ばれたのは「小竹」という古称だった。長崎街道沿いに竹薮が続く景観を指す「小竹の処」という呼び名が、行政の中心地の名を上書きしたことになる。町章も「小竹」の文字を竹の色でデザイン化しており、竹のイメージが町の表看板になっている。
    sources:
    - r4-kotake-town
  relations:
  - pref/40
  unknowns:
  - 「小竹の処」という古称がいつ頃から使われたか、文献上の初出は確認できなかった
  - 1928年の改称の際に他の候補名があったかどうかは確認できなかった
  updated: '2026-11-13'
- id: muni/40-小郡市
  code: '402168'
  names:
    ja: 小郡市
    reading: おごおりし
    aliases:
    - 小郡町
    - 小郡村
  user_terms:
  - 七夕の里おごおり
  - 筑紫小郡
  - 小郡官衙のまち
  - おごおりし
  naming_type: 文献・故事から命名
  formation: 合併新設
  prefecture: 福岡県
  homonyms: []
  summary: 福岡県南西部、宝満川流域の市。地名は『日本書紀』に外国使節の饗応の場として記される「筑紫小郡」に遡り、市域には大宰府の客館の施設とされる小郡官衙遺跡がある。1889年に小郡村が成立し、1955年の合併を経て1972年4月1日に市制を施行した。山口県に2005年まであった小郡町とは別の自治体であり、現行の同名自治体はない。
  first_attestation:
    era: 持統天皇3年
    year_western: 689
    document: 『日本書紀』
    note: 「筑紫の小郡にして新羅の弔使に設たまふ」という記事に見える。小郡市公式の資料が『日本書紀』に客館として「筑紫小郡」の名が記されていると紹介する形で確認した
  claims:
  - text: 小郡市の地方公共団体コードは402168である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  - text: 小郡市公式の農村環境計画は、『日本書紀』に客館（外国使節の接待施設）として「筑紫小郡」の名が記されていると紹介している
    kind: fact
    level: E2
    status: established
    sources:
    - r3-ogori-nokankyo
  - text: 市域には官衙の遺跡である小郡官衙遺跡があり、大宰府の客館の所在地として栄えたと市の資料は伝える。ただし設置の時期は、市の「紹介」ページが飛鳥時代、農村環境計画が奈良時代としており、市の資料の間でも表現が分かれている
    kind: fact
    level: E2
    status: contested
    sources:
    - r3-ogori-shokai
    - r3-ogori-nokankyo
  - text: 明治22年（1889年）に三井郡小郡村が誕生し、昭和28年（1953年）に町制を施行、昭和30年（1955年）に小郡町・三国村・立石村・御原村・味坂村の1町4村が合併して新・小郡町となった
    kind: fact
    level: E2
    status: established
    sources:
    - r3-ogori-shokai
    - r3-ogori-nokankyo
  - text: 昭和47年（1972年）4月1日に市制を施行して小郡市となった。市制は筑紫野市・春日市・大野城市と同日で、官報告示では小郡市が最初に掲載されたことを市は紹介している
    kind: fact
    level: E2
    status: established
    sources:
    - r3-ogori-50th
    - r3-ogori-shokai
  - text: 江戸時代には薩摩街道（坊の津街道）などが市内の松崎を通り、松崎は宿場町として栄えた
    kind: fact
    level: E2
    status: established
    sources:
    - r3-ogori-shokai
  - text: 山口県にあった小郡町は2005年に山口市との合併で消滅しており、現在の小郡市と同名の現行自治体は存在しない
    kind: fact
    level: E2
    status: established
    sources:
    - upg-p12-ogori-toshi-yamaguchi
    - b-cap-chiba-soumu-code
  column:
    title: 客をもてなす場所の名前
    text: 「小郡」は、もとは郡の名前ではない。『日本書紀』の筑紫小郡は、外国からの使節を迎えて饗応する客館の名だった。市内には小郡官衙遺跡が残り、大宰府の客をもてなす表玄関だったことを今に伝える。1889年の村名、1972年の市名として受け継がれたこの二文字は、行政区画の名になるずっと前から、遠来の客を迎える場所の名前だったのである。
    sources:
    - r3-ogori-nokankyo
    - r3-ogori-shokai
  relations:
  - pref/40
  unknowns:
  - 「小郡」が『日本書紀』に見える「大郡」と対になる、大小の客館を指す名だったという語源説明は広く流布しているが、専門辞典の原文では確認できなかった
  - 小郡官衙の設置時期については、市の資料でも飛鳥時代と奈良時代に表現が分かれており確定できなかった
  updated: '2026-11-13'
- id: muni/40-岡垣町
  code: '403831'
  names:
    ja: 岡垣町
    reading: おかがきまち
    aliases: []
  user_terms:
  - おかがき
  - 岡垣
  - 海老津駅の町
  - 三里松原の町
  naming_type: 合成地名
  naming_note: 1907年に古地名「岡」と「垣前（垣崎）」の二字を折衷した新造名
  formation: 合併新設
  prefecture: 福岡県
  homonyms: []
  summary: 遠賀郡の町。1889年に編成された岡県村と矢矧村が1907年に合併して岡垣村となり、1962年に町制を施行した。「岡垣」は合併時に新たに作られた名で、それまで歴史上に現れたことのない名称だった。砂丘の地形に由来する古地名「岡」と、垣前郷（垣崎）の「垣」を合わせたもので、新村名をめぐる両村の対立を遠賀郡長が裁定して決めたと伝えられる。
  first_attestation:
    era: 奈良時代
    year_western: 720
    document: 『日本書紀』神武天皇条（「筑紫の国崗」）
    note: 町公式「町名の由来」が「岡」の古層として引く記載で、「岡垣」の名そのものは1907年の新造である
  claims:
  - text: 1907年（明治40年）に岡県村と矢矧村が合併して岡垣村が発足し、1962年（昭和37年）10月1日に町制を施行して岡垣町となった
    kind: fact
    level: E2
    status: established
    sources:
    - r4-okagaki-kobunshokan
  - text: 「岡垣」という名称は1907年の合併まで歴史上に一度も現れたことがなく、合併に際して新たに採用された名である（岡垣町公式）
    kind: fact
    level: E2
    status: established
    sources:
    - r4-okagaki-town
  - text: 新村名について、岡県村側は「矢矧村も古くは岡の県だったから岡県村とすべきだ」とし、矢矧村側は弓矢を作った故事に由来する由緒正しい名だと主張して意見がまとまらなかった。そこで遠賀郡長が、岡県の「岡」と、古くからこの地方を「垣崎」と呼んでいたことから「垣」をとり、合わせて「岡垣」とする決定を下した（岡垣町公式が『己百斎筆語』による話として紹介し、福岡県公文書館も同旨を紹介する）
    kind: fact
    level: E2
    status: established
    sources:
    - r4-okagaki-town
    - r4-okagaki-kobunshokan
  - text: 「岡」の古層について町公式は、『日本書紀』神武天皇条に「筑紫の国崗」のくだりがあること、『筑前国続風土記』に「内浦の西、原村より芦屋までの海辺に、高き岡つづけり。ゆえに、その辺りを岡と称し、郡の名もこれにより名付きならん」とあることを引き、この一帯が「岡郷」「岡の庄」と呼ばれていたとする
    kind: fact
    level: E2
    status: established
    sources:
    - r4-okagaki-town
  - text: 「垣」の古層である垣前郷については、神功皇后が宿陣された時に海風の強さを嫌って一晩に千本の松を植えさせて垣としたのが起こりで、松が生茂って垣崎の松原・垣崎の郷と呼ばれるようになった、と『筑前国続風土記』や遠賀郡誌が伝えることを町公式が紹介する
    kind: legend
    level: E2
    status: established
    sources:
    - r4-okagaki-town
  - text: 村名に残せなかった矢矧村の名前は矢矧川にその名を残し、矢矧村の中心であった海老津の名は1910年（明治43年）に開業した国鉄の駅名に残った
    kind: fact
    level: E2
    status: established
    sources:
    - r4-okagaki-town
    - r4-okagaki-kobunshokan
  - text: 地方公共団体コードは403831である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 郡長の鶴の一声で生まれた合成名
    text: 「岡垣」の「岡」は砂丘の地形、「垣」は防風の松林という、この土地の風土そのものを写した二字である。だが決定の過程は穏やかではなかった。由緒を競う両村の主張が平行線をたどり、最後は遠賀郡長が双方の古名から一字ずつ取って裁定した。敗れた矢矧村は、川の名と駅の名にその名を残すことで折り合いをつけた。
    sources:
    - r4-okagaki-town
    - r4-okagaki-kobunshokan
  relations:
  - pref/40
  - muni/40-芦屋町
  unknowns:
  - 『己百斎筆語』そのものの書誌（著者・成立時期）は確認できなかった
  - 「岡郷」「垣前郷」の郷名としての初出文献の直接確認はできていない（町公式の紹介による）
  updated: '2026-11-13'
- id: muni/40-川崎町
  code: '406058'
  names:
    ja: 川崎町
    reading: かわさきまち
    aliases:
    - 川崎村
    - 東川崎村
    - 西川崎村
  user_terms:
  - 川崎町の名前の由来
  - 福岡の川崎町はなぜ川崎
  - 田川郡の炭鉱町
  naming_type: 中心地名の継承
  formation: 合併新設
  prefecture: 福岡県
  homonyms:
  - muni/04-川崎町
  summary: 明治期に東川崎村・西川崎村が合併して生まれた川崎村を前身とし、1937年に安真木村と合併、1938年に町制を施行して川崎町となった。「川崎」の名は村名として先行していたが、その語源は確認した資料では説明されない。宮城県川崎町とは成立の経緯が異なり、共通の命名理由は立証できない。
  first_attestation:
    era: 明治時代（明治20年）
    year_western: 1887
    document: 東川崎村・西川崎村の合併による川崎村の成立
    note: 東・西川崎の村名自体はこれ以前から存在するが、「川崎」の初出・語源は未確認
  claims:
  - text: 明治20年（1887年）4月に東川崎村と西川崎村が合併して川崎村となり、明治22年（1889年）には川崎・田原・池尻が合併して新たな川崎村が誕生したと沿線紹介資料が伝える
    kind: fact
    level: E4
    status: established
    sources:
    - h3-kawasaki-f-hitahiko
  - text: 昭和12年（1937年）に南部の安真木村と北部の川崎村が合併し、昭和13年（1938年）から町制を施行して川崎町となった
    kind: fact
    level: E2
    status: established
    sources:
    - h3-kawasaki-f-town
    - h3-kawasaki-f-yoran
  - text: 『日本歴史地名大系』は、町域中部を中元寺川が北流し、古代律令制下では和名抄の位登郷に含まれていたとみられると紹介する
    kind: fact
    level: E3
    status: established
    sources:
    - h3-kawasaki-kotobank
  - text: 明治末期以降、古河大峰・三井田川などの炭鉱を有する炭鉱町として発達したが、昭和30年代後半にすべて閉山されたと百科事典の解説にある
    kind: fact
    level: E3
    status: established
    sources:
    - h3-kawasaki-f-kotobank
  - text: 宮城県川崎町とは「川崎村」を前身とする点は共通する。ただし宮城では1889年の構成5村に「川崎」がなく宿場名「川崎宿」が先行したのに対し、福岡では東・西川崎という村名が先行する点が異なる。両町とも「川崎」の語源そのものは未確認で、共通の命名理由は立証できない
    kind: fact
    level: E3
    status: established
    sources:
    - h3-kawasaki-m-uub
    - h3-kawasaki-m-juku
    - h3-kawasaki-f-hitahiko
  - text: 総務省「地方公共団体コード一覧」では本町のコードは406058とされる
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 川崎村が二度生まれた町
    text: この町の前身「川崎村」は、1887年に東・西川崎の合併で一度生まれ、1889年の町村制施行でもう一度、田原・池尻を加えて生まれ直しています。さらに1937年の安真木村との合併でも名は「川崎」のまま残り、翌年に町になりました。合併のたびに残り続けた名ですが、その最初の語源だけが記録に残っていません。
    sources:
    - h3-kawasaki-f-hitahiko
    - h3-kawasaki-f-town
  relations:
  - pref/40
  - muni/04-川崎町
  unknowns:
  - 東・西川崎村の初出と「川崎」の語源（中元寺川との関係を含む）
  - 1887年・1889年の合併の法的根拠の一次確認
  updated: '2026-11-13'
- id: muni/40-広川町
  code: '405442'
  names:
    ja: 広川町
    reading: ひろかわまち
    aliases:
    - 上広川村
    - 中広川村
    - 下広川村
  user_terms:
  - 福岡の広川町の由来
  - 八女の広川町 なぜ広川か
  - 上広川 中広川 下広川
  naming_type: 中心地名の継承
  formation: 合併新設
  prefecture: 福岡県
  homonyms:
  - muni/30-広川町
  summary: 八女郡の町で、読みは「ひろかわまち」。「広川」は1889（明治22）年の町村制で上広川村・中広川村・下広川村の3村がそろって名乗った、町村制以前の広川村に遡る既存の地名である。昭和30年（1955）に上・中両村の合併で広川町が発足し、同年12月に下広川村の一部が編入された。同名の和歌山県広川町が合併時に川名を新たに採用した新名であるのと対照的に、こちらは古い地名の継承・統一である。
  first_attestation:
    era: 明治22年
    year_western: 1889
    document: 町村制施行による上広川村・中広川村・下広川村の発足
    note: 「広川」は下広川村を構成した広川村のように、町村制以前から存在した村名・川名に遡る。町としての初出は1955年
  claims:
  - text: 昭和30年（1955）4月1日に上広川村と中広川村が新設合併して広川町が発足し、同年12月1日に下広川村の一部が編入されて現在の町域となった
    kind: fact
    level: E2
    status: established
    sources:
    - h5-hirogawa-fukuoka-masterplan
  - text: 明治22年（1889）の町村制施行により、町域には上広川村・中広川村・下広川村が発足した
    kind: fact
    level: E2
    status: established
    sources:
    - h5-hirogawa-fukuoka-enkaku
  - text: 下広川村は明治8年以来の広川村・藤田村・一条村を区域としており、「広川」という村名は町村制以前から存在した
    kind: fact
    level: E2
    status: established
    sources:
    - h5-hirogawa-fukuoka-enkaku
  - text: 下広川村の区域は全域が広川町に入ったのではなく、一部は筑後市と筑邦町へ分かれて編入された
    kind: fact
    level: E2
    status: established
    sources:
    - h5-hirogawa-fukuoka-ayumi
  - text: 町域は発心山に源を発する広川がつくる広川谷の盆地にあり、町名と同じ川が流れ下って筑後川に注ぐ
    kind: fact
    level: E2
    status: established
    sources:
    - h5-hirogawa-fukuoka-masterplan
  - text: 共通する層として、同名の和歌山県広川町も「広川」という川の名にちなむ町名であり、両町とも町の中心地帯を同名の川が流れる
    kind: fact
    level: E2
    status: established
    sources:
    - h5-hirogawa-wakayama-gaiyo
  - text: 異なる層として、福岡の「広川」は合併で新しく作られた名ではなく、1889年以来3村が共有してきた地名を引き継いで一つの町名に統一したものである。和歌山のように川名を新たに町名へ採用した事例とは成り立ちが逆であり、読みも「ひろかわまち」と異なる
    kind: fact
    level: E2
    status: established
    sources:
    - h5-hirogawa-fukuoka-enkaku
    - h5-hirogawa-kotobank
  - text: 地方公共団体情報システム機構（J-LIS）のコード一覧で、広川町の団体コードは405442とされている
    kind: fact
    level: E2
    status: established
    sources:
    - h5-jlis-fukuoka
  column:
    title: 上・中・下、川の流れで分かれていた三つの「広川」
    text: 福岡の広川町の前身は、川の上流から下流へ、上広川村・中広川村・下広川村と並んでいました。同じ川の流域に暮らしながら、1889年以来ずっと別々の村だったのです。1955年4月にまず上と中が合併して広川町になり、下は同年12月にようやく一部が町へ加わりましたが、残りは筑後市や筑邦町へと分かれました。一つの川の名前を分け合っていた三つの村が、一つの町に結び直されたのが、この町の成り立ちです。
    sources:
    - h5-hirogawa-fukuoka-enkaku
    - h5-hirogawa-fukuoka-ayumi
  relations:
  - pref/40
  - muni/30-広川町
  unknowns:
  - 川名「広川」の語源（広い川原・氾濫原に由来するか等）の町史・地名辞典での確認は未了
  - 町村制以前の「広川村」の成立時期、近世の村名としての初出は未確認
  updated: '2026-11-13'
- id: muni/40-志免町
  code: '403431'
  names:
    ja: 志免町
    reading: しめまち
    aliases: []
  user_terms:
  - しめ
  - 志免
  - しめ縄の地名と伝わる町
  - 旧志免鉱業所の竪坑櫓がある町
  naming_type: 中心地名の継承
  naming_note: 旧・志免村の名を継承
  formation: 合併新設
  prefecture: 福岡県
  homonyms: []
  summary: 糟屋郡の町で、福岡市の東に隣接する。1889年に田富・吉原・志免・南里・別府・御手洗の区域をもって志免村が発足し、1939年に町制を施行した。地名の由来については、隣町・宇美町の宇美八幡宮の注連縄（しめなわ）が張られた土地であることから「志免」になったという説が伝えられる。かつては炭鉱の町で、旧志免鉱業所の竪坑櫓がその象徴として残る。
  first_attestation:
    era: null
    year_western: null
    document: null
    note: 「志免」の文献上の初出は確認できなかった。1889年に旧村名を継承して志免村が発足している
  claims:
  - text: 1889年（明治22年）に田富・吉原・志免・南里・別府・御手洗の6カ村が合併して志免村が発足し、1939年（昭和14年）4月に町制を施行して志免町となった
    kind: fact
    level: E2
    status: established
    sources:
    - r4-shime-town
  - text: 志免町の町名は、1889年の合併で区域に含まれた旧・志免村の名を継承したものである
    kind: fact
    level: E2
    status: established
    sources:
    - r4-shime-town
  - text: 志免町は、宇美八幡宮の注連縄（しめなわ）が張られた土地であることから「志免」の地名となったという説がある（志免町公式パンフレットの紹介）
    kind: legend
    level: E2
    status: indeterminate
    sources:
    - r4-shime-town
  - text: 町の公式キャラクター「シメッチャ」は、この注連縄説をモチーフに、しめ縄を模した角を持ち、頭と体に「S」と「M」の模様が入った羊としてデザインされた
    kind: fact
    level: E2
    status: established
    sources:
    - r4-shime-town
  - text: 町内には旧志免鉱業所の竪坑櫓（たてこうやぐら）が残されており、かつて産炭地であった町の歴史を伝えている
    kind: fact
    level: E2
    status: established
    sources:
    - r4-shime-town
  - text: 町の面積は8.69平方キロメートルで、福岡県内では3番目に小さい町である
    kind: fact
    level: E2
    status: established
    sources:
    - r4-shime-town
  - text: 地方公共団体コードは403431である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 神域の結界が、そのまま町名に
    text: 注連縄説が正しければ、「志免」は神域と俗界を分ける結界の内側だった土地を指す名ということになる。隣の宇美町が「応神天皇の生まれた町」なら、志免町はその聖地を守る縄の張られた側の町、という対の関係が浮かび上がる。町もこの説を積極的に採用し、公式キャラクターの角をしめ縄の形にしている。
    sources:
    - r4-shime-town
  relations:
  - pref/40
  - muni/40-宇美町
  unknowns:
  - 「志免」の文献上の初出（『和名類聚抄』の糟屋郡の郷名に含まれるか等）は確認できなかった
  - 注連縄説以外に地名の語源を説明する公的・専門資料は確認できなかった
  updated: '2026-11-13'
- id: muni/40-新宮町
  code: '403458'
  names:
    ja: 新宮町
    reading: しんぐうまち
    aliases: []
  user_terms:
  - しんぐう
  - 新宮
  - 相島（猫の島）のある町
  - 立花山の町
  naming_type: 中心地名の継承
  naming_note: 旧・新宮村の名を継承
  formation: 合併新設
  prefecture: 福岡県
  homonyms:
  - muni/30-新宮市
  summary: 糟屋郡の町で、福岡市の東に隣接し、玄界灘の沖合には相島を擁する。1889年に合併した5村のうち最大の村だった新宮（新宮浦）の名を採って新宮村となり、1954年に町制、1955年に立花村と合併して現在に至る。「新宮」の起こりについては、住吉の神を勧請したためとする説と、紀州熊野から速玉の神を迎えたためとする伝承が併存する。和歌山県新宮市とは同名だが由来は別である。
  first_attestation:
    era: 平安時代
    year_western: null
    document: 『本朝無題詩集』所収、藤原周光の詩
    note: 詩集は986年から1140年ごろまでの詩を選録したものとされ、「新宮湊」に詠まれたこの詩に「住吉霊社を此地に移し、新宮と号す。故にこの地名を新宮と言う」とあることを、新宮町公式サイトが紹介する
  claims:
  - text: 1889年（明治22年）に上府村・下府村・新宮村（新宮浦）・湊村・相島村が合併して新宮村が発足した際、一番大きな村である新宮の名前をとって村名とした（新宮町公式）
    kind: fact
    level: E2
    status: established
    sources:
    - r4-shingu-town-yurai
    - r4-shingu-town-enkaku
  - text: 1954年（昭和29年）11月1日に新宮村が町制を施行して新宮町となり、1955年（昭和30年）4月1日に立花村と対等合併して新制の新宮町が発足した
    kind: fact
    level: E2
    status: established
    sources:
    - r4-shingu-town-enkaku
  - text: 「新宮」の由来について新宮町公式は、住吉霊社をこの地に移したことに求める説を紹介する。『本朝無題詩集』所収の藤原周光の詩にその旨が詠まれ、貝原益軒『筑前国続風土記』は住吉の神を勧請して磯崎神社としたことに由来すると主張し、青柳種信『筑前国続風土記拾遺』は上府・下府の氏神である新宮神社に住吉神社を勧請したとする
    kind: fact
    level: E2
    status: contested
    sources:
    - r4-shingu-town-yurai
  - text: 磯崎神社文書「新宮浦由来書上帳」は、その昔、紀州熊野新宮浦より速玉（はやたま）の御神がこの地に来臨し、漁人が網に引き上げて新宮大明神と称したため、湊浦を新宮浦と改号したと伝える
    kind: legend
    level: E2
    status: contested
    sources:
    - r4-shingu-town-yurai
  - text: 『日本歴史地名大系』「立花城跡」によれば、立花山の山頂部には大友貞載が築いたとされる山城・立花山城があり、立花氏の拠点となった
    kind: fact
    level: E3
    status: established
    sources:
    - upg-ae5-shingu-kotobank-tachibanajo
  - text: 古代の町域は宗像郡席内郷に属していたが、奈良・平安時代頃に糟屋郡へ郡代えされたとされ、1955年に合併した旧立花村の名は、立花山・立花氏ゆかりの地域名である
    kind: fact
    level: E5
    status: established
    sources:
    - r4-shingu-wiki
  - text: 玄界灘の沖合約7.5キロメートルに位置する相島は、1889年の新宮村発足時からの村域（現在の町域）であり、国指定史跡の相島積石塚群がある
    kind: fact
    level: E2
    status: established
    sources:
    - r4-shingu-town-enkaku
  - text: 地方公共団体コードは403458である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 「新しい宮」はどちらの神か
    text: 「新宮」は「新たに勧請された宮（神社）」があった土地の名とみられるが、勧請元については住吉とする文献群と熊野とする由緒書が対立している。熊野説が正しければ、和歌山県新宮市（熊野速玉大社の所在地）と福岡県新宮町は、同じ神を迎えた縁で結ばれた同名地名ということになる。ただし両自治体の名の直接のつながりを示す資料はなく、同名であることと勧請の伝承は分けて読む必要がある。
    sources:
    - r4-shingu-town-yurai
  relations:
  - pref/40
  - muni/30-新宮市
  unknowns:
  - 住吉勧請説と熊野勧請説のいずれが古い層か、史料の成立年代からの確定はできなかった
  - 『本朝無題詩集』の藤原周光の詩そのものの原文確認はできていない（町公式の引用による）
  updated: '2026-11-13'
- id: muni/40-春日市
  code: '402184'
  names:
    ja: 春日市
    reading: かすがし
    aliases: []
  user_terms:
  - 春日市の名前の由来
  - 春日神社の市
  - 奈良の春日と関係ある春日
  - 奴国の地の市
  - 合併していない市
  naming_type: 中心地名の継承
  formation: 合併新設
  prefecture: 福岡県
  homonyms: []
  summary: 市名は旧春日村の名を継ぐもので、その「春日」は春日神社に由来する。神社の名は、768年に大和国（奈良）の春日郷に祀られていた神々をこの地に迎えたことに始まると社記が伝え、地名も神社にちなんで名付けられたと『筑前国続風土記』が記す。1889年に5村の合併で発足した春日村は、その後一度も合併・分離を経験せず、1953年に春日町、1972年4月1日に春日市となった。
  first_attestation:
    era: 神護景雲2年
    year_western: 768
    document: 筑前国那珂郡春日大明神記録（春日神社社記）
    note: 春日神社に「春日」の名が付いた年として社記が伝えるもの。地名としての使用はその後とみられる。社記の記述は春日市公式サイトの紹介によって確認した
  claims:
  - text: 春日市の地方公共団体コードは402184である（総務省「地方公共団体コード一覧」による）
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  - text: 1889年4月1日、那珂郡の春日村・小倉村・須玖村・上白水村・下白水村の5村が合併して新・春日村が発足し、村名は面積が最も大きかった旧春日村の「春日」を取って付けられた
    kind: fact
    level: E2
    status: established
    sources:
    - r2-kasuga-city-yurai
  - text: 春日市は1889年の発足以来、一度の分離も合併も経験しておらず、「春日」の地名が今日まで続いてきたまれな自治体である
    kind: fact
    level: E2
    status: established
    sources:
    - r2-kasuga-city-yurai
  - text: 春日村は1953年1月1日に町制を施行して春日町となり、1972年4月1日に市制を施行して春日市となった
    kind: fact
    level: E2
    status: established
    sources:
    - r2-kasuga-kobunsyokan
  - text: 『筑前国続風土記』の春日神社の項には「春日村にあり。村の名前も此神社あるによりて名つけたり」とあり、地名「春日」は春日神社に由来すると春日市は説明する
    kind: fact
    level: E2
    status: established
    sources:
    - r2-kasuga-city-chimei
  - text: 春日神社の「春日」は、神護景雲2年（768年）に大和国添上郡春日郷（現在の奈良市春日野町）に祀られていた天児屋命らがこの地に迎えられて祀られたことに始まると社記は伝え、筑前の春日の名は大和の春日郷に由来する
    kind: fact
    level: E2
    status: established
    sources:
    - r2-kasuga-city-yurai
  - text: 「春日」はもと「ハルヒ」と読まれたが、「春日（ハルヒ）がカスム（霞む）」という連想から次第に「カスガ」と読まれるようになったと市は説明し、カスガの語義には霞の多い所（霞処）、神の住所（カスカ）、砂礫地を指す古語などの諸説がある
    kind: fact
    level: E2
    status: contested
    sources:
    - r2-kasuga-city-chimei
  - text: 春日神社の社記が村民の言い伝えとして記すところによれば、661年に斉明天皇とともに筑紫に下った中大兄皇子（後の天智天皇）が、この地に天児屋命を祀ったのが春日神社の始まりであるという
    kind: legend
    level: E2
    status: established
    sources:
    - r2-kasuga-city-yurai
  column:
    title: 奈良から来た「春日」
    text: 福岡県に「春日」と名のつく市があるのは、奈良の春日と無関係ではない。768年、大宰府にゆかりの藤原氏が、大和国春日郷（現在の奈良市春日野町）の神々をこの地に迎えて祀ったのが春日神社の始まりだと社記は伝える。地名の「春日」はその神社から生まれ、読みももとの「ハルヒ」から、霞のイメージを重ねて「カスガ」へと変わっていったという。九州の春日は、奈良の春日の分身として生まれた地名なのである。全国に点在する「春日」の地名の多くも、こうした勧請の広がりを映している。
    sources:
    - r2-kasuga-city-yurai
    - r2-kasuga-city-chimei
  relations:
  - pref/40
  - muni/40-大野城市
  - muni/40-福岡市
  unknowns:
  - 地名としての「春日」の文献上の初出は特定できなかった
  - 「ハルヒ」から「カスガ」へ読みが変わった時期は、市の説明でも特定されていない
  updated: '2026-11-13'
- id: muni/40-朝倉市
  code: '402281'
  names:
    ja: 朝倉市
    reading: あさくらし
    aliases:
    - 甘木市
    - 朝倉町
    - 杷木町
  user_terms:
  - 甘木・朝倉の合併市
  - 朝倉橘広庭宮の地
  - 三連水車のまち
  - 原鶴温泉のまち
  naming_type: 旧行政区画名の継承
  formation: 合併新設
  prefecture: 福岡県
  homonyms: []
  summary: 福岡県中央部の市。2006年3月20日、甘木市・朝倉町・杷木町が新設合併して誕生し、市名は3市町に共通する旧郡名「朝倉」を継いだ。朝倉の名は古代に遡り、斉明天皇7年（661）には朝倉橘広庭宮が営まれ、『和名類聚抄』は上座・下座の「あさくら」の訓を伝える。1896年には上座・下座・夜須の三郡が合併して朝倉郡が成立した。なお現在の朝倉郡（筑前町・東峰村）は本市とは別の区域であり、同名の現行市区町村はない。
  first_attestation:
    era: 斉明天皇7年
    year_western: 661
    document: 『日本書紀』
    note: 朝倉橘広庭宮への遷居の記事として「朝倉」が見える。甘木歴史資料館の展示解説が紹介する形で確認した
  claims:
  - text: 朝倉市の地方公共団体コードは402281である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  - text: 2006年3月20日、甘木市・朝倉郡朝倉町・杷木町が新設合併して朝倉市が誕生した。新市の事務所の位置は旧甘木市大字菩提寺412番地2（現在の市役所所在地）とされた
    kind: fact
    level: E2
    status: established
    sources:
    - r3-asakura-pref-gappei
    - r3-asakura-fukko
  - text: 合併は甘木市・朝倉町・杷木町合併協議会（2004年10月に法定協議会を設置）で協議され、新市の名称は「朝倉市」と決定された
    kind: fact
    level: E2
    status: established
    sources:
    - r3-asakura-pref-gappei
  - text: 朝倉郡は1896年（明治29年）に上座郡・下座郡・夜須郡が合併して成立した
    kind: fact
    level: E3
    status: established
    sources:
    - r3-asakura-kotobank-gun
  - text: 甘木歴史資料館の展示解説によれば、『和名類聚抄』は朝倉の地を上座（かみつあさくら）・下座（しもつあさくら）に分け、「座」の字に「あさくら」の読みを対応させている
    kind: fact
    level: E2
    status: established
    sources:
    - r3-asakura-museum
  - text: 斉明天皇7年（661）、百済を救援する西征に際して朝倉に朝倉橘広庭宮が造営され、斉明天皇は約2か月後にこの宮で崩御した
    kind: fact
    level: E2
    status: established
    sources:
    - r3-asakura-museum
  - text: 旧中心地・甘木の名は、豪族の甘木安長が建立した甘木山安長寺にちなんで呼ばれたと『精選版日本国語大辞典』は説明し、福岡県町村合併調書も9〜10世紀頃の安長寺の建立を由来として紹介している
    kind: fact
    level: E3
    status: established
    sources:
    - r3-kotobank-amagi
    - r3-amagi-yasunaga
  - text: 前身の甘木市は1954年4月1日、甘木町・秋月町・上秋月村・安川村・立石村・福田村・馬田村・蜷城村・三奈木村・金川村の合併によって発足した
    kind: fact
    level: E2
    status: established
    sources:
    - r3-asakura-fukko
  column:
    title: 宮の名と寺の名——二つの由来を持つ市
    text: 朝倉市の名は古代の宮に遡る。661年、斉明天皇は百済を救う西征の途上、朝倉に橘広庭宮を営み、ここで崩御した。一方、合併前の中心市だった甘木市の「甘木」は、豪族・甘木安長が建てた甘木山安長寺の寺号から来たと伝えられる。2006年の合併で選ばれたのは、寺の名でも宮の名でもなく、3市町に共通する郡の名「朝倉」だった。歴史の層のいちばん下にある名前が、いちばん新しく市名になった。
    sources:
    - r3-asakura-museum
    - r3-kotobank-amagi
  relations:
  - pref/40
  unknowns:
  - 新市名「朝倉市」の選定方法（公募の有無や候補名・得票など）は、県の合併協議会資料では確認できなかった
  - 朝倉橘広庭宮の所在地については諸説があり確定していない
  - 「朝倉」の語源（校倉造りの倉庫にちなむ説、神を迎える朝の座にちなむ説が専門辞典で候補として紹介される）はいずれも確定説ではない
  - 『日本書紀』に見える、朝倉社の木を切って宮を造ったため神が怒って殿を壊したという記事は、二次資料経由でのみ接し、市公式資料での裏付けは取れなかった
  updated: '2026-11-13'
- id: muni/40-東峰村
  code: '404489'
  names:
    ja: 東峰村
    reading: とうほうむら
    aliases: []
  user_terms:
  - とうほう
  - 東峰村
  - 小石原焼の村
  - 棚田の村
  - 日本で最も美しい村の一つ
  naming_type: 新規命名
  naming_note: 2005年に小石原村と宝珠山村が合併して発足
  formation: 合併新設
  prefecture: 福岡県
  homonyms: []
  summary: 朝倉郡の村で、福岡県の中南部の山間にある。2005年3月28日に小石原村と宝珠山村が合併して発足した平成の大合併期の自治体でありながら、合併後も村制を選んだ数少ない村である。新村名「東峰」は公募を経て最終候補5点の中から選ばれた。旧村名のうち宝珠山は岩屋神社の宝珠石の伝承に、小石原は「腰原（越原）」の転訛とも小石の多い原ともいわれる。
  first_attestation:
    era: 平成17年
    year_western: 2005
    document: 小石原村・宝珠山村合併協議会による新村名の選定
    note: 村名「東峰」そのものの成立時点。旧村名「小石原」「宝珠山」の初出はそれぞれ別に古い
  claims:
  - text: 2005年（平成17年）3月28日、小石原村と宝珠山村が対等合併して東峰村が発足した。平成の大合併で発足した市町村では数少ない村制の自治体であり、合併時の人口は旧2村合わせて約2,900人で、「日本一小さな合併」とも言われた
    kind: fact
    level: E2
    status: established
    sources:
    - upg-p9-toho-pref
    - upg-p9-toho-zck
    - r4-toho-ijuu
  - text: 新村名は公募を経て、最終候補5点（東峰・宝石〈ほうせき〉・陶宝〈とうほう〉・小宝・宝珠小石原）の中から「東峰」が選ばれた（市区町村変遷情報）
    kind: fact
    level: E4
    status: established
    sources:
    - r4-toho-uub
  - text: 合併に先立つ1985年（昭和60年）4月1日、宝珠山村・小石原村の組合立中学校として「東峰中学校」が誕生していた（東峰学園公式サイトの沿革）
    kind: fact
    level: E2
    status: established
    sources:
    - upg-ae5-toho-gakuen-enkaku
  - text: 学校名と新村名が同じ「東峰」になったが、両者に直接の関係はないとされる
    kind: fact
    level: E5
    status: established
    sources:
    - r4-toho-wiki
  - text: 旧宝珠山村の名は岩屋神社に祀られた宝珠石に由来するとされ、欽明天皇8年（547年）のある日、岩屋に光り輝くものが降ってきて、社僧がこれを「宝珠石」と名付け、ご神体として祀ったと伝えられる
    kind: legend
    level: E2
    status: established
    sources:
    - r4-toho-ijuu
  - text: 旧小石原村の「小石原」の語源については、昔の呼称「腰原（越原）村」の転訛とする説と、小石の多い原っぱを指して呼んだとする説がある
    kind: fact
    level: E2
    status: contested
    sources:
    - r4-toho-ijuu
  - text: 小石原は日田街道の宿場町として栄え、九州修験道の中心道場である英彦山への登山口に当たり、英彦山と宝満山を結ぶ修験者たちの峰入りルートの要地であった
    kind: fact
    level: E2
    status: established
    sources:
    - r4-toho-ijuu
  - text: 2017年（平成29年）の九州北部豪雨で村は甚大な被害を受け、交通網の寸断により一時孤立状態になった
    kind: fact
    level: E2
    status: established
    sources:
    - r4-toho-ijuu
  - text: 地方公共団体コードは404489である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 落ちた候補名「宝石」と「陶宝」
    text: 新村名の最終候補には、宝珠山の「宝」と小石原焼の「陶」をめぐる案が並んだ。「宝石（ほうせき）」は宝珠山の宝珠石と小石原の石を、「陶宝（とうほう）」は陶器の里と宝珠山を組み合わせた案と読める。選ばれた「東峰」は両村の名を直接には含まない第三の名だった。面白いことに「東峰」は1985年から両村の組合立中学校の名として先に存在しており、生徒たちには馴染みのある言葉でもあった。
    sources:
    - r4-toho-uub
    - r4-toho-wiki
  relations:
  - pref/40
  unknowns:
  - 「東峰」という名称が選ばれた理由（命名の趣旨）を明記した合併協議会の一次資料は確認できなかった
  - 旧村名「宝珠山」「小石原」の文献上の初出は確認できなかった
  updated: '2026-11-13'
- id: muni/40-柳川市
  code: '402079'
  names:
    ja: 柳川市
    reading: やながわし
    aliases:
    - 柳河町
    - 柳川町
    - 簗川（最古の用例とされる表記）
  user_terms:
  - 水郷柳川
  - 掘割と川下りのまち
  - 柳河（旧表記）
  - 立花宗茂の城下町
  - さげもんのまち
  naming_type: 中心地名の継承
  formation: 合併新設
  prefecture: 福岡県
  homonyms: []
  summary: 福岡県南西部、矢部川の下流に広がる水郷の市で、掘割の川下りで知られる。地名「柳川」の由来は定かではなく、市公式も諸説いずれも決め手を欠くとし、最古の用例は永仁4年（1296）の「簗川」だと紹介する。柳の木の景観説、漁具の簗に由来する説、城下の水路の名とする説が並立する。江戸時代は柳川藩の城下町として栄え、1952年に市制を施行、2005年に大和町・三橋町と合併して現在の市となった。
  first_attestation:
    era: 鎌倉時代（永仁4年）
    year_western: 1296
    document: 「簗川」と記された史料（柳川市公式「柳川の地名の由来」が紹介するもの）
    note: 市公式が「柳川」の最古の用例として挙げるのは「簗川」の表記である。「柳川」「柳河」の表記は安土桃山時代から見えると同ページは伝える
  claims:
  - text: 柳川市の地方公共団体コードは402079である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  - text: 柳川市公式「柳川の地名の由来」は、「柳川」の由来について、柳の木の景観説・漁具の簗に由来する説・水路の名とする説のいずれも決め手を欠き、由来は定かではないとしている
    kind: fact
    level: E2
    status: indeterminate
    sources:
    - r3-yanagawa-chimei
  - text: 市公式によれば、「柳川」の最古の用例は永仁4年（1296）の史料に見える「簗川」で、川に仕掛ける漁具「簗」に由来する可能性がある
    kind: fact
    level: E2
    status: contested
    sources:
    - r3-yanagawa-chimei
  - text: 市公式は、柳の多い土地であることを由来とする説が江戸時代の地誌『太宰管内志』に既に見えること、柳河藩士・西原一甫の『柳河明証図会』が音楽寺（現在の八剣神社）裏を流れる小流「柳川」を地名の起源とする水路名説を唱えたことを併せて紹介している
    kind: fact
    level: E2
    status: contested
    sources:
    - r3-yanagawa-chimei
  - text: 戦国時代に蒲池氏が柳川城を築き、天正15年（1587）に立花宗茂が柳川を城地として城下町の形成を本格化させ、慶長6年（1601）に入城した田中吉政が城の大修築と町割りを行ったと市公式は伝える
    kind: fact
    level: E2
    status: established
    sources:
    - r3-yanagawa-jokamachi
  - text: 関ヶ原の戦いで改易された立花宗茂が柳川へ再封された年は、柳川市公式の資料でも「城下町柳川」が元和7年（1621）、第2次総合計画が元和6年（1620）としており、表記が分かれている
    kind: fact
    level: E2
    status: contested
    sources:
    - r3-yanagawa-jokamachi
    - r3-yanagawa-sogokeikaku
  - text: 1951年4月1日に柳河町と城内村・沖端村・西宮永村・東宮永村・両開村が合併して柳川町となり、このとき自治体名の表記は「柳川」に統一され、1952年4月1日に市制を施行して柳川市が誕生した（1955年には昭代村・蒲池村を編入）
    kind: fact
    level: E4
    status: established
    sources:
    - r3-yanagawa-uub
  - text: 2005年3月21日に柳川市・大和町・三橋町が新設合併して、現在の柳川市となった
    kind: fact
    level: E2
    status: established
    sources:
    - r3-yanagawa-soumu-gappei
  column:
    title: 柳か、簗か——決め手のない地名
    text: 柳川といえば柳の並木と掘割の川下りが思い浮かぶが、市の公式の由来解説は意外なほど慎重で、「いずれの説も決め手を欠く」と結んでいる。現存する最古の用例は「柳」ではなく「簗川」（1296年）で、川に仕掛ける漁具の簗から来たのかもしれない。柳の景観説は江戸時代の地誌『太宰管内志』に既に見える由緒ある説だが、それでも決着はついていない。水の町の名前の底には、柳の緑と漁の仕掛けの両方が沈んでいる。
    sources:
    - r3-yanagawa-chimei
  relations:
  - pref/40
  unknowns:
  - 永仁4年（1296）の「簗川」が見える史料の具体的な名称は、市の公式ページに示されておらず確認できなかった
  - 「柳川」と「柳河」の表記が、藩の公式文書でどのように使い分けられたかは確認できなかった
  updated: '2026-11-13'
- id: muni/40-桂川町
  code: '404217'
  names:
    ja: 桂川町
    reading: けいせんまち
    aliases: []
  user_terms:
  - けいせん
  - 桂川
  - 王塚古墳の町
  - 装飾古墳の町
  naming_type: 新規命名
  naming_note: 1889年に9村が合併して桂川村が発足。名の由来は未詳
  formation: 合併新設
  prefecture: 福岡県
  homonyms: []
  summary: 嘉穂郡の町で、福岡県の中央部に位置する。1889年に瀬戸・寿命・中屋・豆田・九郎丸・土居・吉隈・土師・内山田の9村が合併して穂波郡桂川村となり、1940年4月17日に町制を施行した。古代には穂波郡土師郷に比定される土地で、王塚古墳をはじめ装飾古墳の多い地域だが、村名「桂川」の由来を明記した公的・専門資料は確認できなかった。
  first_attestation:
    era: 明治22年
    year_western: 1889
    document: 町村制施行に伴う桂川村の発足（桂川町総合計画）
    note: 「桂川」という村名の初出としての時点。それ以前の使用例や命名の由来は確認できなかった
  claims:
  - text: 1889年（明治22年）、瀬戸村・寿命村・中屋村・豆田村・九郎丸村・土居村・吉隈村・土師村・内山田村が合併し、穂波郡桂川村として発足した（桂川町総合計画）
    kind: fact
    level: E2
    status: established
    sources:
    - r4-keisen-plan
  - text: 1940年（昭和15年）4月17日に町制を施行して桂川町となった
    kind: fact
    level: E2
    status: established
    sources:
    - upg-p9-keisen-koho
  - text: 『日本歴史地名大系』は、町域は『和名類聚抄』に載る古代穂浪（穂波）郡土師（はじ）郷に比定されるとする。中世には安楽寺（現・太宰府天満宮）の荘園「土師庄」が置かれた
    kind: fact
    level: E3
    status: established
    sources:
    - r4-keisen-kotobank
  - text: 町域には6世紀の王塚古墳（国の特別史跡）をはじめ前方後円墳が造られた。王塚古墳は最大の装飾古墳として知られる
    kind: fact
    level: E2
    status: established
    sources:
    - r4-keisen-plan
    - r4-keisen-kotobank
  - text: 明治中期に炭鉱が開かれて発展したが、エネルギー革命の中で閉山が進み、1972年（昭和47年）には町内最後の平山炭鉱が閉山した
    kind: fact
    level: E2
    status: established
    sources:
    - upg-p9-keisen-kobunshokan
    - upg-p9-keisen-kotobank-sekai
  - text: 村名「桂川」の由来は、町公式資料・専門資料のいずれにも明記を確認できなかった。なお現在の町内を流れる主な川は泉河内川・穂波川・馬敷川・又手川で、「桂川」という名の河川は町域に見当たらない
    kind: fact
    level: H
    status: inferred
    sources:
    - r4-keisen-kotobank
    - r4-keisen-plan
  - text: 地方公共団体コードは404217である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 由来の残らなかった町名
    text: 王塚古墳の壁画で知られる古墳の宝庫であり、古代の郷名（土師郷）や中世の荘園名（土師庄）までは文献で辿れるのに、1889年に付けられた村名「桂川」の理由だけが記録に残っていない。京都の桂川のような清流の名にあやかった瑞祥命名ではないかという見方もあるが、裏付ける資料は見つからなかった。由来の「空白」そのものが、この町の記録の特徴である。
    sources:
    - r4-keisen-kotobank
    - r4-keisen-plan
  relations:
  - pref/40
  unknowns:
  - 村名「桂川」の命名理由・由来は、町公式資料（総合計画）・『日本歴史地名大系』のいずれでも確認できなかった
  - 1889年以前に「桂川」という地名がこの地域で使われていたかどうかは確認できなかった
  updated: '2026-11-13'
