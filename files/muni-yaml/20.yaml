    - v11-takagi-vill-150th
    - v11-takagi-kotobank-britannica
  relations:
  - pref/20
  unknowns:
  - 『詩経』の句を用いることを誰が提案したのか、他にどのような候補名があったのかという命名の経緯の記録
  - 明治8年の命名以前に「喬木」という地名が他地域に存在したかどうか
