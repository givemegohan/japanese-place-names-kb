  - text: 防府市の公式資料は、大化2年（646年）に孝徳天皇が改新の詔を発してこの地に周防国が建てられ国府が設けられたことに由来し、「周防国の国府」から「防府」と命名されたと説明している
    kind: fact
    level: E2
