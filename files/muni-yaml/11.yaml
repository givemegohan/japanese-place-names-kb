  - もろやま
  - 桂木柚子
  - 流鏑馬
  - 新しき村のある町
  naming_type: 合成地名
  naming_note: 1939年に毛呂村の「毛呂」と山根村の「山」を合わせた合成地名
  formation: 合併新設
  prefecture: 埼玉県
  homonyms: []
  summary: 入間郡の町で、町名は1939年（昭和14年）に毛呂村と山根村が合併した際に両村の名を合わせた合成地名である。「毛呂」は中世の毛呂郷にさかのぼる古い地名だが語源に定説はなく、町の広報特集は「地名の由来は毛呂氏ではなかった」と題して諸説を検証している。1955年（昭和30年）に川角村と合併して現在の町域となった。臥龍山の出雲伊波比神社の流鏑馬や桂木柚子で知られる。
  first_attestation:
    era: 治承4年
    year_western: 1180
    document: 『吾妻鏡』
    note: 「毛呂冠者季光」と見えるのが書物における「毛呂」の最古の用例として町の広報が紹介するが、これは地名ではなく武士の氏としての登場である。地名「毛呂」の表記が残る最古の資料は文明7年（1475年）のものと広報は紹介する
  claims:
  - text: 町名「毛呂山」は、1939年（昭和14年）4月1日に毛呂村と山根村が合併した際に、毛呂村の「毛呂」と山根村の「山」を合わせた合成地名である
    kind: fact
    level: E2
    status: established
    sources:
    - w11-moroyama-koho-tokushu
  - text: 1955年（昭和30年）4月1日に川角村と合併し、現在の毛呂山町となった
    kind: fact
    level: E2
    status: established
    sources:
    - w11-moroyama-koho65
  - text: 「毛呂」の語源に定説はなく、町の広報特集は「地名の由来は毛呂氏ではなかった」と題し、毛呂氏に由来する通説を退けたうえで複数の説を紹介している
    kind: fact
    level: E2
    status: established
    sources:
    - w11-moroyama-koho-tokushu
  - text: 書物に「毛呂」が現れる最古の例は、町の広報が紹介する『吾妻鏡』治承4年（1180年）12月12日条の「毛呂冠者季光」で、地名ではなく源頼朝に仕えた武士・毛呂氏の人名としての登場である
    kind: fact
    level: E2
    status: established
    sources:
    - w11-moroyama-koho-tokushu
  - text: 中世には毛呂郷があり、臥龍山を中心として川に囲まれた村々の一帯を指す地域名であった
    kind: fact
    level: E2
    status: established
    sources:
    - w11-moroyama-koho-tokushu
  - text: 毛呂氏は平安時代末から鎌倉時代にこの地に住んだ武士で、この地に住んだために毛呂氏を称したとも伝えられ、地名と氏のどちらが先かは定かでない
    kind: fact
    level: E2
    status: contested
    sources:
    - w11-moroyama-koho-tokushu
  - text: 語源説の一つとして、「毛呂」は「諸（もろ）」の転で、臥龍山が出雲伊波比神社の神域として諸々の氏子を見渡す山であったことにちなむとする郷土研究家の説がある
    kind: fact
    level: E4
    status: contested
    sources:
    - w11-moroyama-koho-tokushu
  - text: 毛呂山町の地方公共団体コードは113263である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 「毛呂氏ではなかった」—町広報が自ら通説を検証した
    text: 毛呂山町の広報は、合併60年の特集で「地名の由来は毛呂氏ではなかった」と題し、町名の由来を一から追った。鎌倉武士の毛呂氏が住んだから「毛呂」、という説明は分かりやすい。だが『吾妻鏡』に残る「毛呂冠者季光」はあくまで人の名で、地名としての「毛呂」の初出は文明7年（1475年）の資料まで下るという。広報がたどり着いた答えは、語源は一つに決められないまま、臥龍山と出雲伊波比神社を中心とする毛呂郷の名が残った、というものだった。その出雲伊波比神社では今も流鏑馬が奉納され、毛呂郷の中心だった山と社は町の顔であり続けている。
    sources:
    - w11-moroyama-koho-tokushu
  relations:
  - pref/11
  - muni/11-越生町
  - muni/11-鳩山町
  unknowns:
  - 「毛呂」の語源そのもの（「諸」の転訛説、神聖な地を表すとする説など）は決着しておらず、町の広報も定説なしとしている
  - 地名「毛呂」の初出とされる文明7年（1475年）の資料の書誌詳細は確認できなかった
  updated: '2026-11-13'
- id: muni/11-深谷市
  code: '112186'
  names:
    ja: 深谷市
    reading: ふかやし
    aliases:
    - 深谷町
    - 深谷宿
    - 深谷城
  user_terms:
  - ふかや
  - 深谷ネギ
  - 渋沢栄一のふるさと
  naming_type: 中心地名の継承
  formation: 合併新設
  prefecture: 埼玉県
  homonyms: []
  summary: 中山道の宿場町・城下町として発展した県北部の市で、渋沢栄一の出身地として知られる。「深谷」の地名は中世には記録に現れるが、語源を説明する確かな資料は市の公式資料にも見当たらず未確定である。1955年に（旧）深谷市が発足し、2006年に岡部町・川本町・花園町と合併して現在の深谷市となった。
  first_attestation:
    era: 延文元年
    year_western: 1356
    document: 世界大百科事典が「深谷」の地名の初見とする記録
    note: 初見の年は世界大百科事典によるとする紹介情報であり、初出の文書そのものは未確認。なお康応2年（1390年）の国済寺梵鐘には「幡羅郡深谷庄」と刻まれていたことが郷土資料に紹介されている。
  claims:
  - text: 市域の南部は荒川の洪積扇状地である櫛挽台地で、台地を刻んで唐沢川が北流し、台地の末端には比高数メートルの崖が連なっている
    kind: fact
    level: E3
    status: established
    sources:
    - w3-fukaya-kotobank
  - text: 「深谷」の地名の初見は1356年であると世界大百科事典が紹介している
    kind: fact
    level: E5
    status: established
    sources:
    - w3-saitamae-yurai
  - text: 1456年（康正2年）に上杉房顕が櫛引台地の北端付近に深谷城を築き、その周辺に城下町が形成されたのが現在の中心市街地の始まりである
    kind: fact
    level: E5
    status: established
    sources:
    - w3-fukaya-wiki
  - text: 江戸時代には中山道の宿場である深谷宿が置かれ、最盛期には旅籠が約80軒並ぶなど宿場町として発展した
    kind: fact
    level: E5
    status: established
    sources:
    - w3-fukaya-wiki
  - text: 渋沢栄一は現在の深谷市血洗島の出身であり、1887年（明治20年）には栄一が中心となって日本初の機械式煉瓦製造工場である日本煉瓦製造株式会社が設立され、深谷の上敷免で煉瓦が作られた
    kind: fact
    level: E2
    status: established
    sources:
    - w3-fukaya-city-hatara
  - text: 渋沢栄一の生地である血洗島には、源義家の奥州遠征の途中で家臣が切り落とされた片手を洗ったため「血洗島」と呼ばれるようになったという伝説が伝わっている
    kind: legend
    level: E2
    status: established
    sources:
    - w3-fukaya-shibusawa-museum
  - text: 1955年（昭和30年）1月1日に深谷町・明戸村・幡羅村・大寄村・藤沢村が合併し市制を施行して（旧）深谷市となり、2006年（平成18年）1月1日に旧深谷市・岡部町・川本町・花園町が合併して現在の深谷市が誕生した
    kind: fact
    level: E2
    status: established
    sources:
    - w3-fukaya-city-hatara
    - w3-fukaya-wiki
  - text: 総務省の全国地方公共団体コードで、深谷市の団体コードは112186と定められている
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 渋沢栄一が退けた「血洗島」の伝説
    text: 渋沢栄一の生家のある血洗島（ちあらいじま）は、その物騒な名前の由来を訪れる先々で質問されたと栄一自身が語っている。合戦で切り落とされた手を洗った、源義家にまつわる話、アイヌ語に由来する説などが伝わるが、栄一は大正初期の談話で、こうした伝説や口碑を「斉東野人（田舎者のいいかげんな語り）の語」だとして退けた。深谷市は市の資料で、定説はないとしたうえで、度重なる利根川の氾濫で「地が荒れた」「地を洗うように流れた」という「地荒・地洗」からの転訛とする見方の方が頷けると紹介している。なお市内には血洗島のほか西島・大塚島・伊勢島・高島など「島」のつく地名が多く、『日本歴史地名大系』はこれらを利根川や小山川の洪水の際に避難場所となった微高地を意味すると説明している。
    sources:
    - w3-fukaya-shibusawa-museum
    - w3-fukaya-kotobank
  relations:
  - pref/11
  unknowns:
  - 「深谷」の語源は未確認。市の公式ページにも由来の説明は見当たらず（県内市町村の由来を公式ページ中心に調べた一覧でも「説明が見つからなかった」市に分類されている）、深い谷状の地形に由来するという説明も専門辞典では裏付けが取れなかった
  - 1356年を初見とする世界大百科事典の記述の典拠となった文書そのものは未確認
  updated: '2026-11-13'
