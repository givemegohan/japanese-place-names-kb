  claims:
  - text: 大崎町の地方公共団体コードは464686である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  - text: 大崎町を含む地域は古くは救仁（くに）と呼ばれていた
    kind: fact
    level: E2
    status: established
    sources:
    - s1-osaki-plan
  - text: 「大崎」という地名が記録上に現れるのは室町時代後期であり、これは肝付氏により大崎城が築城されたことによると、町の総合計画は説明している
    kind: fact
    level: E2
    status: established
    sources:
    - s1-osaki-plan
  - text: その後、大崎城をめぐる肝付氏と島津氏の争いに島津氏が勝利し、島津氏により大崎郷が創設された
    kind: fact
    level: E2
    status: established
    sources:
    - s1-osaki-plan
  - text: 1889年（明治22年）4月1日の町村制実施時に、大崎郷内の10村（仮宿・永吉・横瀬・神領・益丸・菱田・持留・岡別府・野方・井俣）が合併して大崎村が成立した
    kind: fact
    level: E2
    status: established
    sources:
    - s1-osaki-plan
    - s1-osaki-wiki
  - text: 1891年（明治24年）8月8日に大字野方が野方村として分村したが、1955年（昭和30年）に再び合併し、現在の大崎町の区域となった。町制は1936年（昭和11年）に施行されている
    kind: fact
    level: E2
    status: established
    sources:
    - s1-osaki-plan
    - s1-osaki-wiki
  - text: 明治初期まで大崎の地域は現在の志布志市とともに日向国諸県郡に属しており、1889年の大崎村は南諸県郡に属した。廃藩置県後は鹿児島県・都城県・宮崎県・鹿児島県と所属が変遷した
    kind: fact
    level: E5
    status: established
    sources:
    - s1-osaki-wiki
  column:
    title: 城の名が郷になり、村になり、町になった
    text: 大崎町の名は、珍しく「城」から生まれた。室町時代後期に肝付氏が築いた大崎城が地名の起点で、島津氏がこの地を治めると城の名は行政区画の「大崎郷」となり、明治の町村制では郷内の10村が合併して「大崎村」になった。城→郷→村→町と、統治の単位が変わるたびに名だけが受け継がれてきた。もっとも、それ以前のこの土地の名は「救仁（くに）」で、いまも海岸の松原は「くにの松原」と呼ばれ、古い名の痕跡を残している。
    sources:
    - s1-osaki-plan
  relations:
  - pref/46
  - muni/46-志布志市
  - muni/46-鹿屋市
  unknowns:
  - 「大崎」の「崎」が具体的にどの地形（岬状の土地など）を指したのかは、町公式・専門資料で確認できなかった
  - 「大崎」の名が見える室町時代後期の具体的な文書名と年は、町の総合計画に示されておらず未確認である
  - 古代の「救仁（くに）」の語源は確認できなかった
  updated: '2026-11-13'
- id: muni/46-天城町
  code: '465313'
  names:
    ja: 天城町
    reading: あまぎちょう
    aliases:
    - 天城村
    - 東天城村
    - 阿布木名方
    - 雨気岳
  user_terms:
  - あまぎ
  - 徳之島の町
  - 天城岳のある町
  - トライアスロンの町
  naming_type: 自然地名から
  formation: 合併新設
  prefecture: 鹿児島県
  homonyms: []
  summary: 徳之島北西部の町。町名は徳之島町との境にある天城岳に由来するといわれ、その旧名「雨気（あめぎ）」が天城に転じたと町公式サイトが説明する。明治41年（1908年）に新村名として「天城」が採択されて天城村が成立し、昭和36年（1961年）の町制施行で天城町となった。
  first_attestation:
    era: 明治時代（明治41年）
    year_western: 1908
    document: 島嶼町村制による天城村の成立
    note: 「天城」の名が自治体名として採択された時点。山名としての「雨気／天城」の文献上の初出は確認できなかった
  claims:
  - text: 天城町の地方公共団体コードは465313である
    kind: fact
    level: E2
    status: established
    sources:
    - s4-kagoshima-muni-list
  - text: 『続日本紀』文武天皇3年（699年）条の「度感」が徳之島であれば、島の名の記録は7世紀末に遡るが、「度感」の読みも徳之島への比定も確定していない
    kind: fact
    level: E4
    status: contested
    sources:
    - s4-tokuda-rekishi
    - s4-wiki-tokunoshima
  - text: 「とくのしま」の表記が確実に現れるのは鎌倉時代後期の徳治元年（1306年）の『千竈時家処分状』の「とくのしま」であると徳田虎雄顕彰記念館の資料が紹介する
    kind: fact
    level: E4
    status: established
    sources:
    - s4-tokuda-rekishi
  - text: 町名は徳之島町との境にある天城岳に由来するといわれ、天城岳の旧名「雨気（あめぎ）」が「天城」に転じたとされる
    kind: fact
    level: E2
    status: established
    sources:
    - s4-amagi-gaiyo
  - text: 明治41年（1908年）の島嶼町村制で阿布木名方と山方などが合併して天城村が成立した際、「天城」が新村名として採択された
    kind: fact
    level: E2
    status: established
    sources:
    - s4-amagi-gaiyo
  - text: 昭和36年（1961年）1月1日、天城村が町制施行して天城町となった
    kind: fact
    level: E2
    status: established
    sources:
    - s4-oshima-gaikyou
    - s4-amagi-gaiyo
  - text: 東天城村の分立年は、鹿児島県大島支庁の沿革資料と天城町公式サイトが大正6年（1917年）とするのに対し、徳之島町町勢要覧は大正5年（1916年）としており、資料により異なる
    kind: fact
    level: E2
    status: contested
    sources:
    - s4-oshima-gaikyou
    - s4-tokunoshima-yoran
  - text: 大昔、天城岳（アメキウデー）にアメンキュという夫婦の神が天から降りてきたという神話が伝えられる
    kind: legend
    level: E2
    status: established
    sources:
    - s4-amagi-gaiyo
  column:
    title: 雨気が天城になった山
    text: 天城町の名の源は、町の東の境にそびえる天城岳（標高533メートル）である。町公式サイトによれば、この山は古く「雨気岳（アメキウデー）」と呼ばれ、アメンキュという夫婦の神が天から降りたという神話の舞台だった。「雨気（あめぎ）」の音が「天城」に転じたとされ、1908年に阿布木名方と山方が合併したとき、新しい村の名としてこの山の名が選ばれた。「あまぎ」という響きは、雨の多い亜熱帯の山の古名を今に伝えている。
    sources:
    - s4-amagi-gaiyo
  relations:
  - pref/46
  - muni/46-徳之島町
  - muni/46-伊仙町
  unknowns:
  - 山名「雨気／天城」の文献上の初出は確認できなかった
  - 「雨気が天城に転じた」という説明の言語学的な裏付けは確認できなかった
  updated: '2026-11-13'
- id: muni/46-奄美市
  code: '462225'
  names:
    ja: 奄美市
    reading: あまみし
    aliases:
    - 名瀬市
  user_terms:
  - 奄美大島の中心都市
  - 世界自然遺産の島の市
  - あまみ
  naming_type: 島名の継承
  formation: 合併新設
  prefecture: 鹿児島県
  homonyms: []
  summary: 平成18年（2006年）3月20日、名瀬市・住用村・笠利町が合併して発足した。市名は奄美大島の名「奄美」をそのまま採ったもので、合併協議は当初1市2町3村で始まったが、瀬戸内町・宇検村・大和村が離脱して3市町村での発足となった。「奄美」は古く「海見」「阿麻弥」とも表記され、県の資料は琉球国の始祖アマミクの降臨によるという伝承を紹介する。旧中心地・名瀬の語源には定説がない。
  first_attestation:
    era: null
    year_western: null
    document: null
    note: 鹿児島県の資料は古い表記として「海見」「阿麻弥」「奄美」を挙げるが、初出の文献名と年代は確認できなかった
  claims:
  - text: 奄美市の地方公共団体コードは462225である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  - text: 奄美市は平成18年（2006年）3月20日、名瀬市・住用村・笠利町が合併して誕生した
    kind: fact
    level: E2
    status: established
    sources:
    - s3-amami-city-tanjo
  - text: 合併協議は当初1市2町3村で始まったが、平成16年（2004年）に住民投票の結果により瀬戸内町が、平成17年（2005年）に宇検村・大和村が協議会を離脱し、最終的に1市1町1村の合併となった
    kind: fact
    level: E2
    status: established
    sources:
    - s3-amami-city-tanjo
  - text: 「奄美」は奄美大島および奄美諸島全域を指す名で、古くは「海見」「阿麻弥」「奄美」と表記されていたと鹿児島県は紹介する
    kind: fact
    level: E2
    status: established
    sources:
    - f-kagoshima-pref
  - text: 奄美地区は慶長14年（1609年）の島津氏による琉球侵攻以前は琉球（沖縄）国に属していた
    kind: fact
    level: E2
    status: established
    sources:
    - f-kagoshima-pref
  - text: 旧中心地である名瀬の名の由来については、魚瀬（ナゼ）からきたとする説、空地（ナージ）からきたとする説、大島の中地（ナージ）からきたとする説があるが、定説はないと鹿児島県は紹介する
    kind: fact
    level: E2
    status: contested
    sources:
    - f-kagoshima-pref
  - text: 「奄美」の名の由来は、琉球国の始祖「阿麻弥久（アマミク）」がこの地に降臨したことによるといわれる
    kind: legend
    level: E2
    status: established
    sources:
    - f-kagoshima-pref
  column:
    title: 島の名前をそのまま市名に――6市町村の協議から3市町村の発足へ
    text: 奄美市の合併協議は、奄美大島の全6市町村（1市2町3村）で始まった。だが住民投票で瀬戸内町が離脱し、宇検村・大和村も続いて、残ったのは名瀬市・笠利町・住用村の3市町村だった。2006年に生まれた新市の名は、島そのものの名「奄美」。県の資料によれば、この名は古く「海見」「阿麻弥」とも書かれ、琉球の始祖アマミクが降臨した地という伝承を持つ。市域は島の約4割にとどまるが、市名は島全体の名を掲げることになった。沖縄の文化圏に属しながら鹿児島県にあるという、この島の二重の帰属も「奄美」という古い名の中に折り重なっている。
    sources:
    - s3-amami-city-tanjo
    - f-kagoshima-pref
  relations:
  - pref/46
  unknowns:
  - 「奄美」の語源の定説は確認できなかった（県公式資料はアマミク降臨の伝承を紹介するのみ）
  - 「阿麻弥」「海見」表記の初出の文献と年代は確認できなかった
  - 新市名「奄美市」の選定過程（公募の有無など）は市公式ページでは確認できなかった
  updated: '2026-11-13'
