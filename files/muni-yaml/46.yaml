- id: muni/46-湧水町
  code: '464520'
  names:
    ja: 湧水町
    reading: ゆうすいちょう
    aliases: []
  user_terms:
  - ゆうすい
  - 丸池湧水の町
  - 栗野と吉松が合併した町
  - 名水の町
  naming_type: 新規命名
  formation: 合併新設
  prefecture: 鹿児島県
  homonyms: []
  summary: 2005年（平成17年）3月22日、姶良郡の栗野町と吉松町が新設合併して発足した町。町名は、旧吉松町の竹中池と旧栗野町の丸池（丸池湧水）という、両町を代表する湧水に由来する。霧島山麓の盆地に位置し、年中涸れない湧水が水道水源や灌漑に使われてきた土地である。
  first_attestation:
    era: 平成時代
    year_western: 2005
    document: 栗野町・吉松町を廃し、湧水町を置く件（平成17年総務省告示第131号、2005年3月22日施行）
    note: 「湧水町」という自治体名の初出はこの合併による命名そのもの。名称自体は2004年3月25日の第20回法定合併協議会で決定された
  claims:
  - text: 湧水町の地方公共団体コードは464520である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  - text: 湧水町は2005年（平成17年）3月22日に姶良郡の吉松町と栗野町が合併して誕生した
    kind: fact
    level: E2
    status: established
    sources:
    - s1-yusui-town-background
  - text: 新町名称「湧水町」は2004年（平成16年）3月25日の第20回法定合併協議会（吉松町・栗野町合併協議会）で決定された
    kind: fact
    level: E2
    status: established
    sources:
    - s1-yusui-town-background
  - text: 町名は、町域の竹中池（旧吉松町内）と丸池（旧栗野町内）から湧き出る湧水に由来すると説明されている
    kind: fact
    level: E5
    status: established
    sources:
    - s1-yusui-wiki
  - text: 町の計画書は、竹中池と丸池について「年中途絶えることなく冷水が湧き出でる」とし、水道の水源や水田灌漑用水として利用されていると述べ、丸池は名水百選に選ばれた「丸池湧水」であるとする。また新町の将来像では「豊富で清らかな湧水など恵まれた自然環境」を町の特性として掲げている
    kind: fact
    level: E2
    status: established
    sources:
    - s1-yusui-plan
  - text: 旧栗野町は、明治22年（1889年）の市町村制実施で栗野郷が栗野村となった地域で、昭和7年（1932年）4月1日に町制を施行した
    kind: fact
    level: E2
    status: established
    sources:
    - s1-yusui-plan
  - text: 旧吉松町の名「吉松」は、島津義弘が亀鶴城の周辺に「亀鶴松竹」のうち亀・鶴・竹にあたる地名が揃っていたところへ残りの「松」を入れて永く栄えることを祈願して改名したことに由来する、と『吉松郷土誌』に基づく伝承として語られている
    kind: legend
    level: E5
    status: established
    sources:
    - s1-yoshimatsu-wiki
  column:
    title: 両町から1つずつ持ち寄った「水」で名付けた町
    text: 合併で生まれる町名は、旧町名の合成か、全く新しい名かで揉めることが多い。湧水町の場合は、吉松の竹中池と栗野の丸池という、両町にそれぞれあった名水を持ち寄る形の命名だった。竹中池は霧島山麓の湧水を集めた池で、丸池は1985年に名水百選に選ばれた丸池湧水。どちらの町にも偏らない「水」という共通項を選んだことで、旧町名をどちらも残さない新名称が受け入れられた。町内にはこのほか筒羽野の疏水など水にまつわる名所も多い。
    sources:
    - s1-yusui-wiki
    - s1-yusui-plan
  relations:
  - pref/46
  - muni/46-さつま町
  - muni/46-伊佐市
  unknowns:
  - 合併協議会が「湧水」を選定した理由を記した協議会資料そのものは確認できなかった（名称の決定日と決定機関は町公式サイトで確認済み）
  - 新町名の候補にどのような案があったかは確認できなかった
  updated: '2026-11-13'
- id: muni/46-瀬戸内町
  code: '465259'
  names:
    ja: 瀬戸内町
    reading: せとうちちょう
    aliases: []
  user_terms:
  - 古仁屋のある町
  - 大島海峡の町
  - 加計呂麻島の町
  naming_type: 旧国名・広域地名の採用
  formation: 合併新設
  prefecture: 鹿児島県
  homonyms: []
  summary: 奄美大島南端部と加計呂麻島・請島・与路島からなる町で、中心集落は古仁屋。1956年に古仁屋町・西方村・実久村・鎮西村が合併して発足した。町名「瀬戸内」は、本州の瀬戸内海にあやかった新造名ではなく、合併前から「瀬戸内五カ村」と呼ばれていた一帯の古い呼称で、1595年の古文書に「せんとうち」と平仮名で見えるという。
  first_attestation:
    era: 文禄4年
    year_western: 1595
    document: 須子茂文書
    note: 加計呂麻島の須子茂に伝わる古文書に「せんとうち」という地名呼称が平仮名で見えることを瀬戸内町立図書館・郷土館が紹介する（同館の紹介による）。町名としての採用は1956年
  claims:
  - text: 瀬戸内町の地方公共団体コードは465259である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  - text: 昭和31年（1956年）9月、町村合併促進法の適用を受けて古仁屋町・西方村・実久村・鎮西村の4町村が対等合併し、瀬戸内町が発足した
    kind: fact
    level: E2
    status: established
    sources:
    - s5-setouchi-lib
    - s5-setouchi-yoran
  - text: 「瀬戸内」という呼称は、合併前まで宇検村の一帯も含めて「瀬戸内五カ村」とも用いていたことから、合併の際に反対意見なくすんなりと新町名に決定したという
    kind: fact
    level: E2
    status: established
    sources:
    - s5-setouchi-lib
  - text: 加計呂麻島の須子茂に伝わっていた文禄4年（1595年）の古文書には、「せんとうち」という地名呼称が平仮名書きで見えていると瀬戸内町立図書館・郷土館は紹介する
    kind: fact
    level: E2
    status: established
    sources:
    - s5-setouchi-lib
  - text: 町立図書館・郷土館は、「瀬戸内」という呼称は日本の瀬戸内海を真似て創られた地名ではなく、波の穏やかな海を指す言葉としてかつて日本・琉球で「せとうち」「せんとうち」が使われていたのかもしれないと述べる
    kind: fact
    level: E2
    status: indeterminate
    sources:
    - s5-setouchi-lib
  - text: 町名の由来は大島海峡の別名「瀬戸内」に因むとも説明される
    kind: fact
    level: E5
    status: established
    sources:
    - s5-setouchi-wiki
  - text: 町の中心集落は古仁屋で、古仁屋港が他の島や各集落への拠点となっている
    kind: fact
    level: E5
    status: established
    sources:
    - s5-setouchi-wiki
  - text: 町域は奄美大島南部、加計呂麻島、請島、与路島の4島に点在する56の集落からなる
    kind: fact
    level: E2
    status: established
    sources:
    - s5-setouchi-lib
  column:
    title: 瀬戸内海の「真似」ではなかった――1595年の文書に残る名前
    text: 「瀬戸内町」と聞くと、本州の瀬戸内海の風景にあやかって付けた名前だと思う人が多い。だが瀬戸内町立図書館・郷土館によれば、この一帯を「瀬戸内」と呼ぶ言い方は古くからあり、加計呂麻島の須子茂に伝わる1595年（文禄4年）の古文書には、すでに「せんとうち」と平仮名で記されていた。合併前のこの地域は、隣の宇検村一帯まで含めて「瀬戸内五カ村」とも呼ばれていたため、1956年の合併で「瀬戸内町」と名乗ることに反対はなかったという。入り江が多く波の穏やかな大島海峡の海を指す言葉が、そのまま町名になった。図書館はこの名を「古くて新しい名前」と呼んでいる。
    sources:
    - s5-setouchi-lib
  relations:
  - pref/46
  - muni/46-宇検村
  unknowns:
  - 須子茂文書の「せんとうち」が具体的にどの範囲（海峡か一帯の集落か）を指していたかは、文書の性格上確定できなかった
  - 中心集落・古仁屋の地名の由来は、調査範囲では確認できなかった
  updated: '2026-11-13'
- id: muni/46-知名町
  code: '465348'
  names:
    ja: 知名町
