    text: カツオの町・枕崎の「枕」は、鰹節の形が枕に似ているから、と思われがちである。しかし『枕崎市史』が伝える由来は別の話で、箱枕に入った金仏が鹿籠浦の瀬崎（せざき）に漂着した故事にちなむという。つまり順序としては、港の名「枕崎」が先にあり、後にこの地が鰹節の一大産地になった。鰹節が枕の形をしているのは偶然の符合だが、その符合のおかげで「枕崎＝鰹節の形」という分かりやすい俗説が生まれやすい土地でもある。市史の伝える故事自体も伝説の層として読むべきもので、事実として確定した語源ではない。
