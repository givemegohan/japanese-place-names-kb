  summary: 三重県中南部、多気郡の山間の町で、県内の町では最大の面積を持ち、全域がユネスコエコパーク「大台ケ原・大峯山・大杉谷」の一部。1956年に三瀬谷町・川添村の合併で発足し、2006年に宮川村と合併して三重県から村が消滅した。町名は大台ヶ原にちなむと一般に説明されるが、1956年の命名理由を明記した公的資料は確認できていない。
  first_attestation:
    era: 昭和31年
    year_western: 1956
    document: 三瀬谷町・川添村の新設合併による大台町発足
    note: 自治体名「大台」としての初出。由来とされる山名「大台ヶ原」の文献上の初出は、確認できていない
  claims:
  - text: 1956年9月30日に三瀬谷町・川添村が新設合併して大台町が発足した
    kind: fact
    level: E4
    status: established
    sources:
    - x8-odai-uub1956
  - text: 2006年1月10日に宮川村と新設合併し、改めて大台町が発足した。これにより三重県から村が消滅した
    kind: fact
    level: E4
    status: established
    sources:
    - x8-odai-uub2006
    - x8-odai-wiki
  - text: 三重県の合併資料は、大台町を平成の合併で「旧町名」を用いた町の一つとし、2町村の合併に際して人口の多い町の名称を用いたものと整理している
    kind: fact
    level: E2
    status: established
    sources:
    - x7-minamiise-mie
  - text: 町名「大台」は大台ヶ原にちなむと一般に説明されるが、1956年の合併時の命名理由を明記した公的資料は確認できなかった
    kind: fact
    level: E5
    status: indeterminate
    sources:
    - x8-odai-wiki
  - text: 『日本歴史地名大系』は、大台町は多気郡の中央部に位置し、宮川とその支流の大内山川の流域に集落が形成されていると記す
    kind: fact
    level: E3
    status: established
    sources:
    - x8-odai-kotobank
  - text: 宮川は大台山系を源流とし伊勢湾に注ぐ延長約100km・三重県内最大の河川で、古くから伊勢神宮の禊川であった
    kind: fact
    level: E2
    status: established
    sources:
    - x8-odai-pref
  - text: 町全域がユネスコエコパーク「大台ケ原・大峯山・大杉谷」の一部として登録されている
    kind: fact
    level: E5
    status: established
    sources:
    - x8-odai-wiki
  - text: 大台町の地方公共団体コードは244431である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 三重県から「村」が消えた町
    text: 2006年1月10日、大台町と宮川村が合併して新しい大台町が生まれたこの日、三重県からは「村」という自治体が完全に姿を消した。県内で最後まで残った村が宮川村だったのである。相手となった大台町は、面積では県内の町で最大、全域が大台ヶ原を含むユネスコエコパークに登録される山の町だ。皮肉なことに、自然の豊かさを誇るこの合併が、県の地図から「村」の字を消す最後の一手になった。いま三重県の市町村はすべて市と町だけで構成されている。
    sources:
    - x8-odai-uub2006
    - x8-odai-wiki
  relations:
  - pref/24
  - muni/24-多気町
  - muni/24-大紀町
  unknowns:
  - 1956年の合併時に「大台」と命名した理由・経緯を記す一次資料（合併協議記録・町史の該当記述）
  - 「大台ヶ原」という山名自体の初出と命名経緯
  updated: '2026-11-13'
- id: muni/24-大紀町
