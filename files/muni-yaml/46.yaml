    sources:
    - s5-sendai-uub
  - text: 「川内」の文字は古くは「千台（旧字体で千臺）」であり、時代や古文書によって「千代」「川内」など表記が異なっていたが、江戸時代に薩摩藩主・島津吉貴が地図を作成する際に「川内」の文字に統一したと市の広報は川内市歴史資料館編『川内市文化財要覧』を引いて紹介する
    kind: fact
    level: E4
    status: established
    sources:
    - s5-sendai-koho-yurai
  - text: 「川内」の語源については、川内川の北側（内側）に薩摩国の国府や国分寺が置かれており、川北を「川内」、川南を「川外」と呼んでいたことに由来するという説が市の広報で紹介されている
    kind: fact
    level: E4
    status: contested
    sources:
    - s5-sendai-koho-yurai
  - text: 「千台」の名は、その昔ニニギノミコト（瓊瓊杵尊）が「千の台（うてな）」を作るように命じたという神話に由来するという説が伝えられている
    kind: legend
    level: E4
    status: established
    sources:
    - s5-sendai-koho-yurai
    - s5-sendai-kotobank
  - text: この地は奈良時代に薩摩国の国府・国分寺が置かれた土地であることが『精選版日本国語大辞典』で紹介されている
    kind: fact
    level: E3
    status: established
    sources:
    - s5-sendai-kotobank
  column:
    title: 「せんだい」違いを解消するための「薩摩」
    text: 日本には「せんだい」と読む大きな地名が二つある。宮城県の仙台市と、鹿児島県の旧川内市である。読みだけでなく、東北新幹線の「仙台」と九州新幹線の「川内」は駅名でも紛らわしく、混同は長年の悩みだった。2004年の合併で旧国名の「薩摩」を頭に付けた新市名「薩摩川内市」は、この混同を避ける狙いもあって選ばれたとされる。もっとも漢字の成り立ちは対照的で、仙台の「仙」は仙台城の雅称に由来する後付けの字、川内の方はもとは「千台」と書かれた古い地名である。「せんだい」の音は同じでも、字の履歴は正反対の二つのまち、というのが面白い対比である。
    sources:
    - s5-sendai-wiki
    - s5-sendai-koho-yurai
  relations:
  - pref/46
  unknowns:
  - 「川内」という地名の確かな初出（文献名と年代）は確認できなかった
  - 新市名の公募件数や最終候補の顔ぶれなど選定過程の詳細は、合併協議会の一次資料では確認できなかった
  - 「川の内側」説以外の語源説（川内川の川名が先か地名が先かを含む）は専門辞典では確認できなかった
  updated: '2026-11-13'
- id: muni/46-西之表市
  code: '462136'
  names:
    ja: 西之表市
    reading: にしのおもてし
    aliases:
    - 西之表町
    - 北種子村
  user_terms:
  - 種子島北部の市
  - 鉄砲伝来の島の玄関口
  - にしのおもて
  naming_type: 一部の地名
  prefecture: 鹿児島県
  homonyms: []
  summary: 種子島北部の市で、明治22年（1889年）に北種子村として発足し、大正15年（1926年）に改称・町制して西之表町、昭和33年（1958年）10月1日に市制を施行した。中心の西之表は種子島氏の城下町で、西海岸の港は島の表玄関とされる。「西之表」という地名自体の語源は、確認した公式・辞典資料では明らかにできなかった。
  first_attestation:
    era: null
    year_western: null
    document: null
    note: 「西之表」の初出は確認できなかった。少なくとも町村制以前から地区の名として存在し、大正15年（1926年）の改称で自治体名になった
  claims:
  - text: 西之表市の地方公共団体コードは462136である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  - text: 明治22年（1889年）4月1日に熊毛郡北種子村が発足し、大正15年（1926年）4月1日に改称・町制して西之表町となったとWikipediaは紹介する
    kind: fact
    level: E5
    status: established
    sources:
    - s3-nishinoomote-wiki
  - text: 昭和33年（1958年）10月1日に市制を施行して「西之表市」が発足した
    kind: fact
    level: E2
    status: established
    sources:
    - s3-nishinoomote-koho
  - text: 西之表は日本最南端の士族である種子島家の城下町として栄え、現在は熊毛支庁や国の出先機関が置かれる種子島および熊毛地区の政治・経済の中心であるとWikipediaは紹介する
    kind: fact
    level: E5
    status: established
    sources:
    - s3-nishinoomote-wiki
  - text: 西之表港は種子島の北西岸に位置する重要港湾で、背後に西之表市の市街地が広がり、鹿児島や屋久島への定期フェリー・高速船が就航する「島の表玄関」であると鹿児島県は紹介する
    kind: fact
    level: E2
    status: established
    sources:
    - s3-nishinoomote-port
  - text: 天文12年（1543年）に鉄砲が伝来した種子島において、西之表は島主・種子島氏の本拠であり、16世紀末に第16代島主久時が知覧へ所替えとなった後も、江戸時代を通じて種子島は種子島家の私領地であったとWikipediaは紹介する
    kind: fact
    level: E5
    status: established
    sources:
    - s3-nishinoomote-wiki
  column:
    title: 鉄砲は南から、政治は西之表から
    text: 種子島といえば1543年の鉄砲伝来だが、ポルトガル船が漂着したのは島の南端（現在の南種子町）である。一方、島を治めた種子島氏の城下町は北部の西之表に置かれ、ここが島の政治の中心だった。現在の西之表市も、熊毛支庁が置かれる大隅諸島の行政の中心であり、西海岸の西之表港は鹿児島と島を結ぶ「表玄関」と県に呼ばれる。島の名を世界史に刻んだ出来事の舞台と、島の暮らしの中心とは、島の両端に分かれているのである。なお「西之表」の「表」が何を指すのか、地名の語源そのものは今回の調査では確定できなかった。
    sources:
    - s3-nishinoomote-wiki
    - s3-nishinoomote-port
  relations:
  - pref/46
  unknowns:
  - 「西之表」という地名の語源（「表」の意味を含む）は、確認した市公式資料・県公式資料・専門辞典の範囲では明らかにできなかった
  - 大正15年（1926年）に北種子村から西之表町へ改称した理由は確認できなかった
  updated: '2026-11-13'
- id: muni/46-阿久根市
  code: '462063'
  names:
    ja: 阿久根市
    reading: あくねし
    aliases:
