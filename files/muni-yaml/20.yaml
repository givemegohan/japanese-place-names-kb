    note: 村名の初出は明治8年（1875年）1月の5村合併による発足。出典として引かれたのは『詩経』「伐木」の「伐木丁丁、鳥鳴嚶々、出自幽谷、遷于喬木」の句
  claims:
  - text: 明治8年（1875年）1月、阿島村・小川村・伊久間村・富田村・加々須村の5か村が合併して喬木村が発足した
    kind: fact
    level: E2
    status: established
    sources:
    - v11-takagi-vill-koho
  - text: 村名「喬木」は中国の古典『詩経』伐木の「伐木丁丁、鳥鳴嚶々、出自幽谷、遷于喬木」から命名されたと村公式が説明する
    kind: fact
    level: E2
    status: established
    sources:
    - v11-takagi-vill-150th
  - text: 『ブリタニカ国際大百科事典』は、村名の由来は中国の『詩経』にある「助け合う村の姿を表すことば」からとったという、と解説する
    kind: fact
    level: E3
    status: established
    sources:
    - v11-takagi-kotobank-britannica
  - text: 村は1875年の発足以来、合併・分村することなく村制が続き、2025年1月に150周年を迎えた
    kind: fact
    level: E2
    status: established
    sources:
