    year_western: 1874
    document: null
    note: 自治体名「松川村」は1874年の5村合併による命名が初出級だが、名自体は構成村の一つであった旧・松川村からの継承で、それより古い。旧松川村の地名としての初出は未確認。
  claims:
  - text: 1874年（明治7年）10月22日に筑摩県安曇郡の鼠穴村・細野村・神戸新田村・松川村・板取村が合併して松川村が発足した。合併村の一つに既に「松川村」があり、現在の村名はその継承である
    kind: fact
