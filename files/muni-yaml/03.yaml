  summary: 九戸郡の町で、平成18年（2006）1月1日に沿岸の種市町と内陸の大野村が合併して誕生した。町名は新町名の一般公募で決められた瑞祥地名で、町役場は「種市町の広々とした海と大野村のなだらかな野原をイメージした名」と説明する。通説では「洋＝太平洋の洋、大野の野」と説明されがちだが、「野」の字は旧大野村の「野」を直接取ったものではないとされる点に注意が要る。旧中心地・種市の名については、県の由来一覧が「撓根津」の転訛など3説を挙げる。
  first_attestation:
    era: 平成18年
