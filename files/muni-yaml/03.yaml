  column:
    title: 高原の町名は、牧場か焼畑か
    text: 葛巻の名の由来は、二つの説の間で決着していない。一つは「葛牧」――葛（クズ）の生えた牧場。もう一つは「葛蒔」――山の斜面を崩して種を蒔いた焼畑のこと。どちらも、山あいの土地で家畜を飼い、畑を開いてきた暮らしの姿を映している。町の中心部は標高約400メートルの高原にあり、明治25年（1892）に乳牛が導入されて以来、葛巻は東北一の酪農郷と呼ばれるようになった。「牧」の説が正しいかどうかは分からないが、少なくとも現在の葛巻の風景は、牧場の説に説得力を与えている。地名の答え合わせが、土地のその後の歴史によって進むこともある。
