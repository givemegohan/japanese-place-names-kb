  summary: 江戸川と中川に挟まれた埼玉県南東端の市。「三郷」は1956年に東和村・彦成村・早稲田村が合併した際の新村名で、合併した三つの村の「三」と、この一帯の古い地域名「二郷半領」の「郷」を合わせたものとされる。1964年に町制、1972年に市制を施行し、村の成立から16年で市になった。
  first_attestation:
    era: 昭和31年
    year_western: 1956
    document: 町村合併による三郷村の発足（1956年9月30日）
    note: 新村の命名そのもの。ただし「郷」の字の背景にある「二郷半領」の呼称は江戸時代の地誌『新編武蔵風土記稿』に説明が見える、より古い地域名である。
  claims:
  - text: 昭和31年（1956年）9月30日に東和村・彦成村・早稲田村の3村が合併し、人口17,313人の三郷村が誕生した
    kind: fact
    level: E2
    status: established
    sources:
    - w1-misato-city-museum
  - text: 村名「三郷」は、合併した三つの村の「三」と、この地域が昔から呼ばれていた「二郷半領」の「郷」の字を合わせて名づけられたとされる
    kind: fact
    level: E5
    status: established
    sources:
    - w1-misato-wiki
  - text: 江戸時代、三郷市域の51か村は武蔵国葛飾郡に属し、現在の吉川市域南部の村々とともに「二郷半領」という地域単位を構成していた
    kind: fact
    level: E2
    status: established
    sources:
    - w1-misato-city-museum
  - text: 『新編武蔵風土記稿』は三輪野江村の定勝寺の梵鐘の碑文を引き、二郷半領とは吉川と彦成の二郷に、彦成より南の「下半郷」を合わせた地域であったと説明していることを市公式が紹介している
    kind: fact
    level: E2
    status: established
    sources:
    - w1-misato-city-museum
  - text: 明治22年（1889年）に彦成村・早稲田村・八木郷村・戸ヶ崎村が誕生し、昭和18年（1943年）に八木郷村と戸ヶ崎村が合併して東和村となった
    kind: fact
    level: E2
    status: established
    sources:
    - w1-misato-city-museum
  - text: 昭和39年（1964年）10月1日に町制を施行して三郷町となり、昭和47年（1972年）5月3日に埼玉県下37番目の市として、人口49,618人で三郷市が誕生した
    kind: fact
    level: E2
    status: established
    sources:
    - w1-misato-city-tanjo
  - text: 総務省の全国地方公共団体コードで、三郷市の団体コードは112372と定められている
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 「三」は合併、「郷」は江戸時代の領名から
    text: 「三郷」という名は、一見すると古い郷の名のようだが、実は1956年の合併で生まれた新しい村名である。「三」は合併した東和・彦成・早稲田の3村、「郷」はこの一帯が江戸時代に属した地域単位「二郷半領」から採られたとされる。二郷半領は現在の三郷市と吉川市にまたがる範囲で、その名の成り立ちは江戸時代の地誌が寺の梵鐘の銘文を引いて説明しているほど古い層を持つ。新しい合併村の名に、消えゆく古い地域名の一字を忍ばせた命名だった。なお、同じ「三郷」を名乗った長野県三郷村（現・安曇野市の一部）とは友好都市の縁があり、同名どうしの交流も生まれた。
    sources:
    - w1-misato-wiki
    - w1-misato-city-museum
  relations:
  - pref/11
  - muni/20-安曇野市
  unknowns:
  - 「三郷」の命名理由を記した1956年当時の合併協議資料そのものは未確認で、由来の説明は二次的な紹介による
  - 二郷半領の呼称の初出と、定勝寺梵鐘碑文の原文確認は未実施
  updated: '2026-11-13'
- id: muni/11-上尾市
  code: '112194'
  names:
    ja: 上尾市
    reading: あげおし
    aliases:
    - 上尾町
    - 上尾宿
    - あけを
  user_terms:
  - あげお
  - 中山道上尾宿
  - 北上尾
  - 上尾駅
  naming_type: 中心地名の継承
  formation: 合併新設
  prefecture: 埼玉県
  homonyms: []
  summary: 大宮台地の中央部に位置する、中山道の宿場町を起源とする市。地名は中世の「上尾郷」に遡り、古くは「あけを」と表記された。江戸時代に中山道の宿駅・上尾宿として整備され、1889年に上尾町、1955年の合併を経て1958年に市制を施行した。「上尾」の語源については定説が確認できていない。
  first_attestation:
    era: 戦国時代
    year_western: null
    document: 旦那引付注文写（熊野那智大社文書）の「足立郷あけをの郷」
    note: 『日本歴史地名大系』が紹介する初出。年未詳の文書の写しで、「あけを」が上尾の古い表記とされる。原文は未読のため紹介の形で記録する。
  claims:
  - text: 年未詳の旦那引付注文写（熊野那智大社文書）に「足立郷あけをの郷」と見え、中世の上尾郷は近世の上尾宿・上尾村・上尾下村から原市村辺りまでを含む一帯であったと推定されることを『日本歴史地名大系』が紹介している
    kind: fact
    level: E3
    status: established
    sources:
    - w1-ageo-kotobank
  - text: 上尾宿は中山道の江戸から五番目の宿駅として賑わい、市公式も本市の成り立ちを江戸時代に設置された上尾宿を起源とする宿場町であるとしている
    kind: fact
    level: E3
    status: established
    sources:
    - w1-ageo-kotobank
    - w1-ageo-city
  - text: 明治22年（1889年）に上尾宿・上尾村・上尾下村・柏座村・春日谷津村・谷津村が合併して北足立郡上尾町となった
    kind: fact
    level: E5
    status: established
    sources:
    - w1-ageo-wiki
  - text: 昭和30年（1955年）1月1日に上尾町・平方町・原市町・大石村・上平村・大谷村の3町3村が合併して上尾町となり、昭和33年（1958年）7月15日に県下19番目の市制を施行して上尾市が誕生した
    kind: fact
    level: E2
    status: established
    sources:
    - w1-ageo-city
  - text: 「上尾」の語源については、確認した専門資料の範囲では定説が示されておらず、確定できない
    kind: fact
    level: E3
    status: indeterminate
    sources:
    - w1-ageo-kotobank
  - text: 総務省の全国地方公共団体コードで、上尾市の団体コードは112194と定められている
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 「あけを」が「あげお」になるまで
    text: 上尾の名は、中世の文書では「あけを」と書かれていた。熊野那智大社の文書に残る「あけをの郷」がその姿で、現在の「上尾（あげお）」とは読みの響きが少し違う。江戸時代、この地は中山道の宿場・上尾宿として整えられ、江戸から五番目の宿として旅人で賑わった。同じ市内でも、荒川の船着場があった平方は水運で上尾宿以上の賑わいを見せたという。宿場の名が町名となり、やがて市名となったが、「あけを」がなぜ「上尾」と書かれるようになったのか、その語源は今もはっきりしない。古い地名ほど、由来が霧の中にある好例である。
    sources:
    - w1-ageo-kotobank
    - w1-ageo-city
  relations:
  - pref/11
  unknowns:
  - 「上尾（あけを）」の語源は未確定。台地の末端を指す「尾」との関係など諸説の専門的検討は未確認
  - 旦那引付注文写の成立年代は未詳で、初出の西暦年は特定できない
  updated: '2026-11-13'
- id: muni/11-上里町
  code: '113859'
  names:
    ja: 上里町
    reading: かみさとまち
    aliases:
    - 上里村
    - 七本木村
    - 神保原村
    - 長幡村
    - 賀美村
  user_terms:
  - 上里町の名前の由来
  - 埼玉県で一番北の町
  - 上を四つ重ねた町章の町
  - こむぎっちの町
  naming_type: 方位・位置による命名
  formation: 合併新設
  prefecture: 埼玉県
  homonyms: []
  summary: 埼玉県児玉郡の町で、県の最北端に位置する。昭和29年（1954年）に七本木村・神保原村・長幡村・賀美村の4村が合併した際、新村名として「上里」が選ばれた。選定理由は、県内で一番上（北）に位置していること、円満な農村であること、簡単に書き易いことの3点だったと町公式が伝える。町章も「上」の字を4つ円形に配し、4村の合併と円満を表す。
  first_attestation:
    era: 昭和29年
    year_western: 1954
    document: 町村合併推進協議会による新村名の選定（昭和29年4月3日）
    note: 村名としての命名そのもの。合併は同年5月3日
  claims:
  - text: 総務省の全国地方公共団体コードで、上里町の団体コードは113859と定められている
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
    - w9-kamisato-town-gaiyou
  - text: 昭和29年（1954年）5月3日、児玉郡の七本木村・神保原村・長幡村・賀美村の4つの村が合併して上里村が誕生した
    kind: fact
    level: E2
    status: established
    sources:
    - w9-kamisato-town-gaiyou
  - text: 新村名については多くの意見の中から昭和29年4月3日に「上里」が選定された
    kind: fact
    level: E2
    status: established
    sources:
    - w9-kamisato-town-gaiyou
  - text: 「上里」の選定理由は、県内で一番上（北）に位置していること、円満な農村であること、簡単に書き易いことなどがあったと、町公式は伝える
    kind: fact
    level: E2
    status: established
    sources:
    - w9-kamisato-town-gaiyou
  - text: 町章は「上」の字を4つ用いて円形に配したもので、4つの「上」は合併した4村を表し、「上」は県の最も上に位置することから用いられ、円には人の和と円満という意味が込められている
    kind: fact
    level: E2
    status: established
    sources:
    - w9-kamisato-town-kyoiku
  - text: 昭和46年（1971年）11月3日に町制を施行して上里町となり、同日に町章が制定された
    kind: fact
    level: E2
    status: established
    sources:
    - w9-kamisato-town-kyoiku
  - text: 町の北境を神流川と烏川が流れ、『日本歴史地名大系』によれば神流川は上里町黛の北方で烏川に合流する
    kind: fact
    level: E3
    status: established
    sources:
    - w9-kanna-kotobank-taikei
  column:
    title: 地図の「一番上」を名前にした町
    text: 自治体の名前は、川や山、旧村名、歴史上の人物から採るのが普通です。ところが上里町の名前の決め手は、地図の上での位置そのものでした。「埼玉県で一番上（北）にある」こと。しかも理由はそれだけではなく、「円満な農村であること」「簡単に書き易いこと」まで公式に挙げられています。発足から17年後の町制施行の際には、「上」の字を4つ円く並べた町章まで作られました。位置・願い・実用性という3つの理由がそろった、合併命名の記録として珍しく明快な事例です。
    sources:
    - w9-kamisato-town-gaiyou
    - w9-kamisato-town-kyoiku
  relations:
  - pref/11
  - muni/10-玉村町
  - muni/10-神流町
  unknowns:
  - 「上里」以外の候補（賀美村の「かみ」の読みを生かす案など）があったかは未確認
  - 「里」の字が付けられた理由の記録は未確認
  updated: '2026-11-13'
- id: muni/11-久喜市
  code: '112321'
  names:
    ja: 久喜市
    reading: くきし
    aliases:
    - 久喜町
    - 菖蒲町
    - 栗橋町
    - 鷲宮町
  user_terms:
  - くき
  - わしみや
  - しょうぶ
  - くりはし
  - 鷲宮神社
  naming_type: 中心地名の継承
  formation: 合併新設
  prefecture: 埼玉県
  homonyms: []
  summary: 埼玉県東北部の交通の要衝で、2010年に旧久喜市と菖蒲町・栗橋町・鷲宮町が合併して誕生した市。市名は最大の構成自治体である旧久喜市の名を継いだ。「久喜」の語源は『久喜市史』が複数の地形説を併記する段階で、自然堤防などの小高い所を指すという説が有力とされる一方、窪みを指すという正反対の説も伝えられている。
  first_attestation:
    era: 近世
    year_western: null
    document: 久喜村・久喜町（近世の村名・町名）
    note: 地名としての確実な初出文書は未確認。室町時代の日記『蔭涼軒日録』に見える「久喜」は宇治の納豆を指す食品名であり、地名の初出ではない。
  claims:
  - text: 『久喜市史 民俗編』は地名「久喜」の由来として、薪・柴等の燃料採取地を意味する地名とする説、山・岡・自然堤防などの小高い所とする説、「久木」の当て字で薪山の意とする説を挙げ、自然堤防などの小高い所を指すという説が有力であると結んでいることを、久喜市公文書館の刊行物が紹介している
    kind: fact
    level: E2
    status: contested
    sources:
    - w1-kuki-city-archive
  - text: 地元出身の漢学者・中島撫山は、「久喜」は「岫（くき）」で岡の中の窪みを意味し、万葉集東歌の「小岫（おぐき）」と同義であるという、小高い所とする説とは正反対の説を弟子に語っていたという逸話が伝えられている
    kind: fact
    level: E2
    status: contested
    sources:
    - w1-kuki-city-archive
  - text: 旧久喜市は昭和29年（1954年）に久喜町と太田村・江面村・清久村が合体して久喜町となり、昭和46年（1971年）10月1日に市制を施行した
    kind: fact
    level: E3
    status: established
    sources:
    - w1-kuki-kotobank
  - text: 平成21年（2009年）5月28日に久喜市・菖蒲町・栗橋町・鷲宮町の合併協定書の調印式が行われ、平成22年（2010年）3月23日に1市3町が合併して人口15万7千人余の新・久喜市が誕生した
    kind: fact
    level: E2
    status: established
    sources:
    - w1-kuki-city-museum
  - text: 室町時代の日記『蔭涼軒日録』には、将軍への献上品や贈答品として「久喜」と呼ばれる納豆が見えるが、これは宇治の名産の食品名であり、地名の久喜とは別の語であると市の刊行物が論じている
    kind: fact
    level: E2
    status: established
    sources:
    - w1-kuki-city-archive
  - text: 総務省の全国地方公共団体コードで、久喜市の団体コードは112321と定められている
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 「久喜」は納豆だった？ 室町時代の贈答品
    text: 室町時代の日記『蔭涼軒日録』を読むと、贈り物や献上品の中に「久喜」という品目が現れる。埼玉県の地名かと思いきや、これは宇治の名産だった納豆の名である。在来製法の納豆を「久喜」、中国伝来の製法のものを「唐豉（とうし）」と呼び分け、正月の贈答に桶入りの「久喜」が用いられたという。久喜市公文書館はこの同名の食品を手がかりにした小文を刊行物に載せている。地名の「久喜」の語源の方はというと、市史が「小高い所」説を有力としつつも、漢学者・中島撫山の「窪み」説という正反対の説も伝える。地形をめぐる解釈が真っ向からぶつかる、珍しい地名である。
    sources:
    - w1-kuki-city-archive
  relations:
  - pref/11
  unknowns:
  - 地名「久喜」の確実な初出（中世文書の用例）の特定は未確認
  - 2010年の合併で新市名を「久喜市」とした決定過程（公募の有無・候補名）は未確認
  updated: '2026-11-13'
- id: muni/11-伊奈町
  code: '113018'
  names:
    ja: 伊奈町
    reading: いなまち
    aliases:
