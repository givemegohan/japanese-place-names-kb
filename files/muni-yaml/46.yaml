  - 沖永良部島の西半分の町
  naming_type: 中心地名の継承
  naming_note: 古くからの中心集落「知名」の名を村名・町名として継承
  formation: 単独発足
  prefecture: 鹿児島県
  homonyms: []
  summary: 沖永良部島の西半分を占める町。読みの「ちな」は方言名ヂンニャに由来し、『沖永良部島地名考』はその語源を「焼畑を行う場所」を意味するキナとする。1908年に知名村として発足し、米軍統治下の1946年に町制を施行した。
  first_attestation:
    era: null
    year_western: null
    document: null
    note: 「ちな」の名の古い用例は確認できなかった。方言名ヂンニャの初出も未確認
  claims:
  - text: 知名町の地方公共団体コードは465348である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  - text: 知名町は明治41年（1908年）4月1日に村制を施行し、昭和21年（1946年）9月1日に町制を施行した
    kind: fact
    level: E2
    status: established
    sources:
    - s5-china-town
    - s5-china-wiki
  - text: 知名町は海抜245メートルの大山を中心に、その裾野に21の集落が形成されている
    kind: fact
    level: E2
    status: established
    sources:
    - s5-china-town
  - text: 『沖永良部島地名考』は、知名の方言名ヂンニャは「焼畑を行う場所」を意味するキナに由来するとし、知名は大山の南に位置して日当たりが良く、島内でも最大規模の焼畑耕作地だったと思われると紹介する
    kind: fact
    level: E4
    status: established
    sources:
    - s5-okinoerabu-aza
  - text: 和泊町の手々知名・上手々知名の「知名」も、同じくキナ（焼畑を行う場所）に由来すると考えられており、「ちな」の名は島の東西に分布する
    kind: fact
    level: E4
    status: established
    sources:
    - s5-okinoerabu-aza
  - text: 慶長14年（1609年）、薩摩藩の琉球侵攻の結果、沖永良部島は薩摩藩直属領となり、元禄3年（1690年）には徳之島代官の行政を離れて沖永良部島に代官所が設置された
    kind: fact
    level: E2
    status: established
    sources:
    - s5-china-town
  - text: 島名の古層として、琉球王国の歌集『おもろさうし』に「ゑらぶしま」「ゑらぷせりよさ」と見え、島は古く「せりよさ」とも呼ばれた
    kind: fact
    level: E3
    status: established
    sources:
    - s5-nakamoto-erabu
  column:
    title: 焼畑の島に残る「キナ」の地名
    text: 知名の「ちな」は、焼畑の記憶を宿した名前である。『沖永良部島地名考』によれば、知名の方言名ヂンニャは「焼畑を行う場所」を意味するキナの転じたもので、知名は大山の南に広がる日当たりの良い土地で、島内最大規模の焼畑耕作地だったと考えられる。キナを含む地名は島内に多く、田皆（タンニャ＝田とキナ）、久志検（グシキヌ）、和泊町の手々知名なども同じ系統とされる。川がほとんどなく水に乏しい隆起サンゴ礁の島では、焼畑こそが暮らしの土台だった。その営みの地名が、東西両町にまたがって今も残っている。
    sources:
    - s5-okinoerabu-aza
  relations:
  - pref/46
  - muni/46-和泊町
  unknowns:
  - ヂンニャに「知名」の漢字が当てられた時期・経緯は確認できなかった
  - キナ（焼畑）説以外の「ちな」の語源説は、調査範囲では確認できなかった
  - 沖永良部島代官所の設置年は、町公式が元禄3年（1690年）、『日本歴史地名大系』が元禄4年（1691年）としており、資料間で1年の差がある
  updated: '2026-11-13'
- id: muni/46-肝付町
  code: '464929'
  names:
    ja: 肝付町
    reading: きもつきちょう
    aliases:
    - 肝杯
    - 肝坏
    - 高山町
    - 内之浦町
  user_terms:
  - きもつき
  - ロケットの町
  - 内之浦のある町
  naming_type: 人名に由来
  formation: 合併新設
  prefecture: 鹿児島県
  homonyms: []
  summary: 鹿児島県肝属郡の町。2005年7月1日、高山町と内之浦町が合併して発足した。町名「肝付」は、平安時代にこの地の郡司の一族が郡名を取って名乗った氏族名「肝付氏」に連なる古い名で、所属する郡の名は同じ読みの「肝属郡」と書く。新町名は公募の最終決選で、読みが同じ「肝付」と「肝属」の2案から「肝付」が選ばれた。「きもつき」という読み自体は、713年の大隅国設置以来の郡名に遡る。
  first_attestation:
    era: 和銅6年
    year_western: 713
    document: 大隅国設置に伴う郡名として（『続日本紀』の記事として伝えられる）
    note: 原文を直接確認できていないため、主張側ではE5として扱う。郡名には「肝杯」「肝坏」などの異表記が伝えられる
  claims:
  - text: 総務省「地方公共団体コード一覧」で、肝付町の団体コードは464929とされている
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  - text: 肝属郡は、713年の大隅国設置当初から存在した4郡のひとつであるとWikipediaは紹介している
    kind: fact
    level: E5
    status: established
    sources:
    - s2-kimotsuki-gun-wiki
  - text: 郡名「きもつき」は、古い記録では「肝杯」「肝坏」などの異なる漢字で書かれることもあったとWikipediaは紹介している
    kind: fact
    level: E5
    status: established
    sources:
    - s2-kimotsuki-gun-wiki
    - s2-kinko-wiki
  - text: 平安時代、伴氏の一族が大隅国肝属郡の郡司・弁済使となり、兼俊の代に郡名を取って「肝付」を名乗り、高山城を拠点とする肝付氏となったとWikipediaは紹介している
    kind: fact
    level: E5
    status: established
    sources:
    - s2-kimotsuki-shi-wiki
  - text: 肝属山地には、神武天皇の父母らを葬ったと伝える神代三陵（可愛山陵・高屋山上陵・吾平山上陵）があり、明治7年に宮内省によって皇族の陵墓と治定されたとWikipediaは紹介している
    kind: legend
    level: E5
    status: established
    sources:
    - s2-kimotsuki-shi-wiki
  - text: 1889年の町村制で高山村・内之浦村が発足し、1932年に高山村は高山町（4月1日）に、内之浦村は内之浦町（10月1日）になったと、市区町村変遷情報データベースは記録している
    kind: fact
    level: E4
    status: established
    sources:
    - s2-kimotsuki-uub
  - text: 2005年7月1日、高山町と内之浦町が新設合併して肝付町が生まれたと、市区町村変遷情報データベースは記録し、Wikipediaも旧高山町と旧内之浦町が合併して誕生した町であると紹介している
    kind: fact
    level: E4
    status: established
    sources:
    - s2-kimotsuki-uub
    - s2-kimotsuki-wiki
  - text: 新町名は公募され、上位10点・候補8点を経て最終候補が「肝付」と「肝属」の2点（いずれも読みは「きもつき」）となり、「肝付町」が選ばれた。また高山町議会は新町名を「国見町」とするよう求める決議を可決していたと、市区町村変遷情報データベースは記録している
    kind: fact
    level: E4
    status: established
    sources:
    - s2-kimotsuki-uub
  column:
    title: 読みは同じ、字が違う——「肝付」対「肝属」の最終決選
    text: 2005年の合併で新しい町の名を決めるとき、公募の最終候補に残ったのは「肝付」と「肝属」だった。読みはどちらも「きもつき」でまったく同じ。違うのは最後の漢字だけである。「肝属」は今も郡名に使われる由緒ある表記で、「肝付」は中世にこの地を治めた肝付氏の表記だった。選ばれたのは「肝付」。つまりこの町の名付けは、音の争いではなく、千三百年の歴史の中で揺れてきた漢字表記の、最後の決定戦だった。ちなみに高山町議会は「国見町」を求める決議まで出していたが、それも含めて退けられた末の「肝付」である。
    sources:
    - s2-kimotsuki-uub
    - s2-kimotsuki-shi-wiki
  relations:
  - pref/46
  - muni/46-東串良町
  - muni/46-錦江町
  - muni/46-南大隅町
  unknowns:
  - 「きもつき」という地名の語源（なぜ「肝」の字が当てられたか）を説明した専門資料は確認できなかった
  - 『和名類聚抄』における肝属郡・郷の記載とその読み（万葉仮名）は、原典を確認できなかった
  - 『続日本紀』713年条の郡名の表記は、伝える資料によって「肝杯」「肝坏」など異なり、原文での確定はできなかった
  updated: '2026-11-13'
