prefecture_code: '06'
records:
- id: muni/06-三川町
  code: '064262'
  names:
    ja: 三川町
    reading: みかわまち
    aliases:
    - 三川村
    - 横山村
    - 東郷村
    - 押切村
  user_terms:
  - 三川町の名前の由来
  - みかわ
  - 三つの川が流れる町
  - 庄内平野の真ん中の町
  naming_type: 自然地名から
  formation: 合併新設
  prefecture: 山形県
  homonyms: []
  summary: 山形県の庄内平野のほぼ中央にある町。1955年（昭和30年）に横山村・東郷村・押切村が合併して三川村となり、1968年（昭和43年）に町制を施行した。町名は、合併した3村の地域を流れる赤川・藤島川・大山川の「三川」に由来する。旧国名の「三河（みかわ）」とは字も由来も異なる同音の地名である。
  first_attestation:
    era: 昭和30年
    year_western: 1955
    document: 三川村の設置（鶴岡市・庄内南部合併協議会資料「三川町の紹介」）
    note: 「三川」の名の初出。1968年6月1日に町制を施行して三川町となった
  claims:
  - text: 昭和30年（1955年）1月1日に横山村・東郷村・押切村が合併して三川村が設置され、昭和43年（1968年）6月1日に町制を施行して三川町となった
    kind: fact
    level: E2
    status: established
    sources:
    - z11-mikawa-tsuruoka-gappei
  - text: 町名「三川」は、合併3村を流れる赤川・藤島川・大山川の三川（さんせん）によるものである
    kind: fact
    level: E2
    status: established
    sources:
    - z11-mikawa-tsuruoka-gappei
  - text: 町は70周年記念ガイドブックで自らを「庄内平野のちょうど真ん中で、三つの川が流れるまち」と紹介している
    kind: fact
    level: E2
    status: established
    sources:
    - z11-mikawa-town-guidebook
  - text: 町は庄内平野のほぼ中央に位置し、北には最上川を隔てて鳥海山を仰ぎ、水田が町の面積の7割ほどを占める穀倉地帯である
    kind: fact
    level: E2
    status: established
    sources:
    - z11-mikawa-tsuruoka-gappei
  - text: 戦国時代には旧横山村の地に横山城が築かれ、助川党という地侍の集団がいたとの説が、町の記念誌で紹介されている
    kind: fact
    level: E2
    status: established
    sources:
    - z11-mikawa-town-guidebook
  - text: 三川町の地方公共団体コードは064262である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 川の数を数えて名前にした町
    text: 「三川」は、3つの川を数え上げてそのまま名にした地名である。合併した3村に共通する財産は、赤川・藤島川・大山川の流れだった。読みは「みかわ」で、愛知県一帯の旧国名「三河」と同じ音だが、字も由来も無関係である。同じ読みで違う字、違う成り立ちを持つ、同音の別地名として並べて見ることができる。
    sources:
    - z11-mikawa-tsuruoka-gappei
  relations:
  - pref/06
  - muni/06-鶴岡市
  - muni/06-庄内町
  unknowns:
  - 1955年の合併時に「三川」以外の候補名があったかどうかは未確認
  - 赤川・藤島川・大山川それぞれの川名の語源は未確認
  updated: '2026-11-13'
- id: muni/06-上山市
  code: '062073'
  names:
    ja: 上山市
    reading: かみのやまし
    aliases:
    - 上大山
    - 上ノ山
    - 上野山
  user_terms:
  - かみのやま温泉
  - 上山城の城下町
  - 上山市の名前の由来
  naming_type: 中心地名の継承
  formation: 合併新設
  prefecture: 山形県
  homonyms: []
  summary: 山形盆地の南にある城下町・温泉の市で、市名は旧町名「上山（かみのやま）」の継承である。「かみのやま」の起源には、古代の山方郷に対する「上ノ山方」の意とする説、古名「上大山」に由来するとみる推定など諸説があり確定していない。室町時代に上山氏が入って城下町が形成され、江戸時代は上山藩の城下町・羽州街道の宿場町として栄えた。1954年に上山町など6町村が合体して上山市となった。
  first_attestation:
    era: 安元2年
    year_western: 1176
    document: 『八条院領目録』
    note: 初見とされる大山庄の庄域に上山盆地が含まれ、後の上大山庄に当市域が含まれたと推定される段階であり、「上山」の語そのものの初出ではない（『日本歴史地名大系』の紹介による）
  claims:
  - text: 『日本歴史地名大系』は、「かみのやま」の地名の起源には諸説があるとし、古代の山方（やまがた）郷に対して「上ノ山方」の意とする説（『大日本地名辞書』）、『上山温泉記』の神山説、『上山見聞随筆』の四神相応説を挙げる
    kind: fact
    level: E3
    status: contested
    sources:
    - t6-kaminoyama-kotobank
  - text: 安元2年（1176）に初見する大山庄（『八条院領目録』）の庄域に上山盆地も含まれ、のちに上下に分かれた大山庄のうち上大山庄に当市域が含まれたと推定され、地名起源の一つともされる（『日本歴史地名大系』）
    kind: fact
    level: E3
    status: contested
    sources:
    - t6-kaminoyama-kotobank
  - text: 上山市の公式資料は、「かみのやま」の地名は古くは「上大山（かみのおおやま）」といわれ、その後「上の山・上野山」などと書かれ、呼ばれてきたと説明する
    kind: fact
    level: E2
    status: established
    sources:
    - t6-kaminoyama-city-plan
  - text: 『ブリタニカ国際大百科事典』は、地名は今の山形に対して「上の山形」といわれていたことに由来するという説を紹介する
    kind: fact
    level: E3
    status: contested
    sources:
    - t6-kaminoyama-kotobank
  - text: 室町時代初期に最上満長が当地を領して「上山殿」と称され、天文4年（1535）に上山義忠が月岡城（上山城）を築城し、前川の流路を変えて城下町として整備したのが現在の市街地の原形である
    kind: fact
    level: E3
    status: established
    sources:
    - t6-kaminoyama-kotobank
    - t6-kaminoyama-city-plan
  - text: 上山温泉の鶴脛（つるはぎ）の湯は、長禄2年（1458）に僧月秀が、鶴が傷を癒やしているのを見て発見したと伝えられる
    kind: legend
    level: E3
    status: established
    sources:
    - t6-kaminoyama-kotobank
  - text: 上山市は1954年（昭和29年）10月1日に上山町・西郷村・本庄村・東村・宮生村・中川村が合体して発足し、1957年に山元村を編入した
    kind: fact
    level: E3
    status: established
    sources:
    - t6-kaminoyama-kotobank
  - text: 上山市の総務省地方公共団体コードは062073である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 市章になった、伝説の鶴
    text: かみのやま温泉の開湯は、長禄2年（1458）に僧月秀が鶴の傷を癒す姿を見て湯を発見したという伝説で語られる。この鶴は市のシンボルにもなっていて、上山市の市章は「上山」の文字に、かみのやま温泉のルーツともいえる鶴を象ったデザインだと市は説明する。城下町・宿場町・温泉町という三つの顔を持つ町の、最も古い物語が鶴の伝説なのである。
    sources:
    - t6-kaminoyama-kotobank
    - t6-kaminoyama-city-suji
  relations:
  - pref/06
  unknowns:
  - 「かみのやま」の語源は諸説が併存し確定していない。最上川の上流という位置に由来するという単純な説明は、専門辞典では確認できなかった
  - 「上山」の語そのものの文献上の初出（年・文書）は未確認
  updated: '2026-11-13'
- id: muni/06-中山町
  code: 063029
  names:
    ja: 中山町
    reading: なかやままち
    aliases:
    - 長崎町
    - 豊田村
  user_terms:
  - 中山町の名前の由来
  - なかやま
  - 芋煮会発祥のまち
  - 長崎中山氏の町
  naming_type: 人名に由来
  formation: 合併新設
  prefecture: 山形県
  homonyms: []
  summary: 山形県中央部、東村山郡の町で、面積は県内の市町村で最も小さい。1954年（昭和29年）に長崎町と豊田村が合併して誕生した。町名は、中世から近世初頭にかけて当地を治めた長崎城（中山城）城主・中山氏にちなむ。中心地の長崎は、江戸時代に最上川舟運の湊として栄えた。
  first_attestation:
    era: 昭和29年
    year_western: 1954
    document: 中山町の成立（1954年の合併）
    note: 町名としての「中山」の初出。もとの中山氏の当地への入部は至徳元年（1384年）と町公式は伝える
  claims:
  - text: 『日本歴史地名大系』は、町名の由来は中世から近世初頭にかけて当地一帯の領主であった長崎城（中山城ともいう）城主中山氏にちなんだものとする
    kind: fact
    level: E3
    status: established
    sources:
    - z11-nakayama-kotobank
  - text: 町公式は、中山氏の墳墓地である玄蕃壇を「町名の由来であり、南北朝時代から江戸時代初頭にかけて当地を治めた中山家に関係する史跡」と明記する
    kind: fact
    level: E2
    status: established
    sources:
    - z11-nakayama-town-genbadan
  - text: 中山氏は至徳元年（1384年）に長崎楯（現在の長崎地区）に入部し、初代の楯主は中山左衛門継信であったと町公式は伝える
    kind: fact
    level: E2
    status: established
    sources:
    - z11-nakayama-town-genbadan
  - text: 昭和29年（1954年）10月1日に長崎町と豊田村が合併して中山町が誕生した
    kind: fact
    level: E2
    status: established
    sources:
    - z11-nakayama-town-kouhou
  - text: 町は昭和59年（1984年）に、中山町誕生30年と「中山氏入部600年」の記念式典を開いており、中山氏の入部を町の歴史の起点として位置づけている
    kind: fact
    level: E2
    status: established
    sources:
    - z11-nakayama-town-rekishi
  - text: 芋煮会は、最上川の船頭たちが長崎湊で棒鱈と里芋を煮て食べたことに始まるという伝承が残り、中山町は「芋煮会発祥の地」の一つとされる
    kind: legend
    level: E2
    status: established
    sources:
    - z11-nakayama-donnatoko
  - text: 中山町の地方公共団体コードは063029である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 消えた城主の姓が、町名として蘇った
    text: 合併前の中心地の名は「長崎」で、今も町の大字として残っている。ところが町名に選ばれたのは地名ではなく、300年以上も前にこの地を去った領主の姓「中山」だった。近代の合併町名に中世の支配者の名を蘇らせた、珍しい命名である。町が今も「中山氏入部600年」を祝うのは、その名を町の誇りとして引き受けているからである。
    sources:
    - z11-nakayama-kotobank
    - z11-nakayama-town-genbadan
  relations:
  - pref/06
  - muni/06-山辺町
  - muni/06-大江町
  unknowns:
  - 合併協議で「中山」の名が選ばれた具体的な経緯（発案者や他の候補名）は未確認
  - 中山氏の姓「中山」自体の由来（出身地の地名かどうか）は未確認
  updated: '2026-11-13'
- id: muni/06-南陽市
  code: 062138
  names:
    ja: 南陽市
    reading: なんようし
    aliases:
    - 赤湯町
    - 宮内町
    - 和郷村
  user_terms:
  - 赤湯温泉の市
  - 鶴の恩返しの里
  - 南陽市の名前の由来
  naming_type: 文献・故事から命名
  formation: 合併新設
  prefecture: 山形県
  homonyms: []
  summary: 1967年に赤湯町・宮内町・和郷村が合併してできた市で、市名「南陽」は在地の地名ではなく、当時の山形県知事が贈った古典由来の名である。中国の古地名「南陽」と、『太平記』にも出てくる不老長生の霊泉「南陽の菊水」にちなみ、「北に丘陵、南に沃野、まことに住み良いところ」という土地柄を表す名として選ばれた。旧中心地の赤湯は温泉、宮内は熊野大社で知られる。
  first_attestation:
    era: 昭和42年
    year_western: 1967
    document: 命名そのもの（合併による市制施行）
    note: 「南陽」は1967年4月1日の市制施行時に新市名として誕生した借用名で、在地の古地名ではない。名の典拠は中国の古地名と古典の故事にある
  claims:
  - text: 南陽市は1967年（昭和42年）4月1日に、赤湯町・宮内町・和郷村の2町1村が合併して誕生し、山形県内で13番目の一番若い市となった（南陽市公式「プロフィール」）
    kind: fact
    level: E2
    status: established
    sources:
    - t6-nanyo-city-profile
  - text: 新市名については様々な意見が出されたが、「南陽」は当時の山形県知事・安孫子藤吉から贈られた名前である（南陽市公式）
    kind: fact
    level: E2
    status: established
    sources:
    - t6-nanyo-city-profile
  - text: 知事は命名の意味として、「南陽」は古来中国で用いられた地名で、「北に丘陵、南に沃野、まことに住み良いところ」と土地柄を表現し、不老長生の霊泉「菊水」の流れる河南省の南陽が代表であると説いた（南陽市公式）
    kind: fact
    level: E2
    status: established
    sources:
    - t6-nanyo-city-profile
  - text: 「南陽の菊水」は『太平記』にも出てくる故事で、国民にも古来から深い関心を呼ぶ名であることが、命名を後押しする理由として知事によって挙げられた（南陽市公式）
    kind: fact
    level: E2
    status: established
    sources:
    - t6-nanyo-city-profile
  - text: 合併した赤湯町・宮内町・和郷村のいずれの名も新市名には採用されず、在地の地名ではない第三の名が選ばれた
    kind: fact
    level: E2
    status: established
    sources:
    - t6-nanyo-city-profile
  - text: 旧中心地の一つ「赤湯」の名は、寛治7年（1093）に源義家の弟義綱が湯を発見し、傷ついた家来たちを湯に入れるとたちまち傷が治り、血で深紅に染まった湯から「赤湯」と呼ばれるようになったという伝説に由来すると伝えられる
    kind: legend
    level: E2
    status: established
    sources:
    - t6-nanyo-city-akayu
  - text: 南陽市公式は赤湯温泉の由来には諸説があるとし、寛治7年（1093年）の説のほか、鎌倉時代初期の説、正和元年（1312年）の説を挙げている
    kind: fact
    level: E2
    status: contested
    sources:
    - t6-nanyo-city-akayu-yurai
  - text: 市名が同じという由縁から中国河南省南陽市との交流が始まり、1988年（昭和63年）10月6日に両市は友好都市を締結した
    kind: fact
    level: E2
    status: established
    sources:
    - t6-nanyo-city-koryu
  - text: 南陽市の総務省地方公共団体コードは062138である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 知事が贈った、中国生まれの市名
    text: 合併した3町村のどの名も使わないと決めたとき、新市名「南陽」を贈ったのは当時の山形県知事だった。典拠は中国の古地名で、『太平記』に語られる不老長生の霊泉「南陽の菊水」の故事まで引いた、格調高い命名である。面白いのはその後で、名の「本家」である中国河南省の南陽市と、同じ名を持つという縁から1988年に友好都市が結ばれた。借り物の名前が、やがて本物同士の姉妹都市関係を生んだ珍しい例である。
    sources:
    - t6-nanyo-city-profile
    - t6-nanyo-city-koryu
  relations:
  - pref/06
  unknowns:
  - 合併協議の場で「南陽」以外にどのような市名候補が挙がり、どのような経緯で知事の贈名に決着したかの詳細は、公式資料では確認できなかった
  - 宮内・和郷といった旧地名そのものの語源は未調査（本レコードでは市名の層を中心に記録した）
  updated: '2026-11-13'
- id: muni/06-大江町
  code: '063240'
  names:
    ja: 大江町
    reading: おおえまち
    aliases:
    - 左沢町
    - 漆川村
    - 本郷村
    - 七軒村
  user_terms:
  - 大江町の名前の由来
  - おおえ
  - 最上川舟唄の町
  - 左沢の町
  naming_type: 新規命名
  formation: 合併新設
  prefecture: 山形県
  homonyms: []
  summary: 山形県中央部、西村山郡の町。1959年（昭和34年）に左沢町と漆川村が合併して誕生した。町名「大江」は、中世に当地を治めた大江氏の姓に直接よるのではなく、最上川の雄大な流れを「大江」と捉え、「百川衆沢尽く一大江に帰する」の意を取った命名であると町公式は説明する。一帯は中世には寒河江荘として、大江広元の子孫である寒河江大江氏の領地でもあった。
  first_attestation:
    era: 昭和34年
    year_western: 1959
    document: 大江町の成立（1959年の合併。大江町公式の景観保存調査報告書）
    note: 町名「大江」の初出。中心地・左沢の地名は中世に遡る
  claims:
  - text: 昭和34年（1959年）に左沢町と漆川村が合併して大江町が誕生した
    kind: fact
    level: E2
    status: established
    sources:
    - z11-oe-town-gaiyo
  - text: 町公式の報告書は、町名は最上川の雄大な眺めに由来しており、「百川衆沢尽く一大江に帰する」の意を取り、町の発展の希望を託している、と説明する
    kind: fact
    level: E2
    status: established
    sources:
    - z11-oe-town-gaiyo
  - text: 大江町を含む西村山郡一帯は中世には寒河江荘で、文治5年（1189年）に源頼朝により寒河江荘の地頭に大江広元が補任され、その後、広元の子孫が知行した
    kind: fact
    level: E2
    status: established
    sources:
    - z11-oe-town-rekishi
  - text: 町名の公式説明は最上川の流れに由来を求めるものであって、この地を治めた寒河江大江氏の姓を直接の由来とはしていない
    kind: fact
    level: E2
    status: established
    sources:
    - z11-oe-town-gaiyo
    - z11-oe-town-rekishi
  - text: 中心市街地の左沢は、江戸時代から最上川舟運の中継地として栄え、民謡「最上川舟唄」の発祥の地とされる
    kind: fact
    level: E2
    status: established
    sources:
    - z11-oe-town-gaiyo
  - text: 漆川村は、昭和29年（1954年）に本郷村と七軒村が合併してできた村である
    kind: fact
    level: E2
    status: established
    sources:
    - z11-oe-town-gaiyo
  - text: 大江町の地方公共団体コードは063240である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 大江氏の里なのに、名は川から
    text: この一帯は鎌倉時代以来の大江氏ゆかりの地だから、町名「大江」も当然、その姓から来たと思われがちである。ところが町の公式説明は違う。最上川の大きな流れに、すべての川と沢が帰一する姿を重ね、町の発展の願いを託した命名だという。「大江」という字面が誘う思い込みを、公式資料が自らほどいている好例である。
    sources:
    - z11-oe-town-gaiyo
    - z11-oe-town-rekishi
  relations:
  - pref/06
  - muni/06-寒河江市
  - muni/06-中山町
  unknowns:
  - 「百川衆沢尽く一大江に帰する」という句の出典（誰の言葉か）は未確認
  - 左沢（あてらざわ）の地名の語源は未確認
  updated: '2026-11-13'
- id: muni/06-大石田町
  code: '063410'
  names:
    ja: 大石田町
    reading: おおいしだまち
    aliases:
    - 大石田村
    - 大石田河岸
    - 大石田本町
    - 大石田四日町
  user_terms:
  - 大石田町の名前の由来
  - おおいしだ
  - 芭蕉が訪れた町
  - 最上川の河岸の町
  naming_type: 中心地名の継承
  formation: 合併新設
  prefecture: 山形県
  homonyms: []
  summary: 山形県の北東部にある、北村山郡で唯一の町。中心地の大石田は、江戸時代に最上川舟運最大の舟着場「大石田河岸」として栄えた在郷町で、元禄2年（1689年）には松尾芭蕉が滞在した。現在の町は1955年（昭和30年）に大石田町・亀井田村・横山村が合併して発足した。「大石田」の語源を確かめる資料は確認できておらず、未詳として残る。
  first_attestation:
    era: 元禄2年
    year_western: 1689
    document: おくのほそ道
    note: 『精選版日本国語大辞典』が「大石田」の初出の実例として「最上川のらんと、大石田と云所に日和を待」の文を引く。地名自体はそれ以前の寛永期の石高帳にも見えるとされる
  claims:
  - text: 町公式は、最上川三難所の下流にある大石田は陸路と水路の接点という地の利から、町の中心部がかつて「大石田河岸」と呼ばれ、最上川舟運最大の舟着場として栄えたと説明する
    kind: fact
    level: E2
    status: established
    sources:
    - z11-oishida-town-about
  - text: 元禄2年（1689年）に松尾芭蕉が門人曽良を伴って大石田を訪れ、地元の俳人・高野一栄の宅に3泊し、句会を催した。歌仙「さみだれを」はその折の作である
    kind: fact
    level: E2
    status: established
    sources:
    - z11-oishida-story-basho
  - text: 『精選版日本国語大辞典』は「大石田」の初出の実例として、『おくのほそ道』の「最上川のらんと、大石田と云所に日和（ひより）を待」の文を引く
    kind: fact
    level: E3
    status: established
    sources:
    - z11-oishida-kotobank
  - text: 関ヶ原の戦いの後、最上義光は大石田に注目し、年貢米等の物資を酒田へ運ぶ河岸として大石田を「町立て」して整備し、最上川の中心的な河岸として位置づけた
    kind: fact
    level: E2
    status: established
    sources:
    - z11-oishida-story-machitate
  - text: 大石田は江戸初期には一つの村だったが、寛永13年（1636年）に四日町が、正保元年（1644年）に本町が、寛文8年（1668年）に大石田村（新町）が分割され、元の村と合わせて4つの行政村に分けられた。大石田河岸としての重要性を領主側が重視した結果と考えられている
    kind: fact
    level: E2
    status: established
    sources:
    - z11-oishida-story-yottsu
  - text: 現在の大石田町は、昭和30年（1955年）1月1日に大石田町・亀井田村・横山村の1町2村が合併して誕生した
    kind: fact
    level: E2
    status: established
    sources:
    - z11-oishida-story-gappei
  - text: 「大石田」の語源を示す確かな資料は、地名辞典類を含め確認できなかった
    kind: fact
    level: E3
    status: indeterminate
    sources:
    - z11-oishida-kotobank
  - text: 大石田町の地方公共団体コードは063410である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 一つの村が四つに割れた河岸町
    text: 江戸時代の大石田はあまりに重要な河岸だったため、支配を分け合いたい領主たちによって村そのものが4つに分割された。明治の地番整理では、4つの「大字大石田」を区別するために甲・乙・丙・丁の番地が振られたという。一方で河岸の実態は「大石田惣町」として一体で、芭蕉が3泊して歌仙を巻いたのもこの町である。割れても一つの町だった、河岸町の不思議な姿が残る。
    sources:
    - z11-oishida-story-yottsu
    - z11-oishida-story-basho
  relations:
  - pref/06
  - muni/06-尾花沢市
  - muni/06-村山市
  unknowns:
  - 「大石田」の語源は未確認（「大きな石の田」等の字面からの解釈を裏づける資料が見当たらない）
  - 中世における「大石田」の初出の文書は未確認
  updated: '2026-11-13'
- id: muni/06-大蔵村
  code: '063657'
  names:
    ja: 大蔵村
    reading: おおくらむら
    aliases:
    - 清水町村
    - 合海町村
    - 南山村
    - 赤松村
  user_terms:
  - 大蔵村の名前の由来
  - おおくら
  - 肘折温泉の村
  - 清水大蔵大輔の村
  naming_type: 人名に由来
  naming_note: 旧領主・清水大蔵大輔義親の名に由来
  formation: 合併新設
  prefecture: 山形県
  homonyms: []
  summary: 山形県北部、最上郡の最南端にある村で、肘折温泉と四ヶ村の棚田で知られる。1889年（明治22年）に清水町村・合海町村・南山村・赤松村が合併して成立し、以来一度も合併していない。村名は、1476年から1614年にかけてこの地を治めた清水家の7代城主・清水大蔵大輔義親の名に由来すると、村公式は伝える。
  first_attestation:
    era: 明治22年
    year_western: 1889
    document: 町村制施行による大蔵村の成立
    note: 村名「大蔵」の初出。もとの清水氏の当地支配は1476年から1614年とされる
  claims:
  - text: 村公式は、村名の由来を、1476年から1614年にこの地を治めていた清水家の7代城主、清水大蔵大輔義親公の名前から「大蔵村」とされた、とする
    kind: fact
    level: E2
    status: established
    sources:
    - z11-ohkura-vill-gaiyo
  - text: 村長の挨拶でも、大蔵村の村名は7代城主・清水大蔵大輔義親公に由来しており、その清水城跡は県指定史跡に指定されているとされる
    kind: fact
    level: E2
    status: established
    sources:
    - z11-ohkura-vill-mayor
  - text: 清水氏は1476年から138年間にわたって城を構え、最上郡の大半を領地に治めていた
    kind: fact
    level: E2
    status: established
    sources:
    - z11-ohkura-vill-mayor
  - text: 大蔵村は明治22年（1889年）の町村制施行から合併・統合をすることなく、令和元年（2019年）に村制施行130周年を迎えた
    kind: fact
    level: E2
    status: established
    sources:
    - z11-ohkura-vill-130th
  - text: 肘折温泉は、大同2年（807年）の開湯以来1200年の歴史をもつと村公式は伝える
    kind: legend
    level: E2
    status: established
    sources:
    - z11-ohkura-vill-gaiyo
  - text: 村の総面積の85パーセントが山林で、南には月山と葉山がそびえ、銅山川と赤松川が村を貫いて最上川に合流する
    kind: fact
    level: E2
    status: established
    sources:
    - z11-ohkura-vill-gaiyo
  - text: 大蔵村の地方公共団体コードは063657である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 官職名がそのまま村の名になった
    text: 「大蔵大輔」は、大蔵省の高官の名である。清水義親が称したこの官名のうち、姓でも諱でもない「大蔵」の部分だけが、地名として残った。しかも命名されたのは義親の時代ではなく、それから270年以上後の1889年、4つの村が合併して新しい村を作ったときだった。遠い昔の領主への敬意が、明治の村名に刻まれた珍しい例である。
    sources:
    - z11-ohkura-vill-gaiyo
    - z11-ohkura-vill-mayor
  relations:
  - pref/06
  - muni/06-新庄市
  - muni/06-庄内町
  unknowns:
  - 1889年の成立時に「大蔵」の名がどのような協議で選ばれたかは未確認
  - 清水大蔵大輔義親の事績について、一次資料による裏づけは未確認（村公式の説明に基づく）
  updated: '2026-11-13'
- id: muni/06-天童市
  code: '062103'
  names:
    ja: 天童市
    reading: てんどうし
    aliases:
    - 成生
  user_terms:
  - 将棋駒のまち天童
  - 人間将棋の天童
  - 天童市の名前の由来
  naming_type: 中心地名の継承
  formation: 単独発足
  prefecture: 山形県
  homonyms: []
  summary: 将棋駒の産地として知られる市で、市名は旧町名「天童」の継承である。「天童」の由来については、天から童子が舞い降りたという行基伝説、南北朝時代の武将・北畠天童丸に由来するという説、アイヌ語源説などが言われるが、天童市自身が「定かではありません」と明記している。14世紀後半に天童氏が舞鶴山に城を築いて城下町が形成され、1958年に市制を施行した。
  first_attestation:
    era: null
    year_western: null
    document: null
    note: 「天童」の地名としての確実な初出は未確認。南北朝時代の「北畠天童丸」という人名に由来するという説がある段階にとどまる
  claims:
  - text: 天童市の統計書は、「天童」の地名については、アイヌ語源説や僧行基にまつわる2人の護法童子伝説、南北朝時代の北畠天童丸住居説などに由来するといわれているが「定かではありません」と明記する
    kind: fact
    level: E2
    status: indeterminate
    sources:
    - t6-tendo-city-tokei
  - text: 『ブリタニカ国際大百科事典』は、地名は南北朝時代に北畠天童丸が根拠地としたことに由来するという説を紹介する
    kind: fact
    level: E3
    status: contested
    sources:
    - t6-tendo-kotobank
  - text: 舞鶴山の山頂で念仏を唱えていた行基のもとへ、天から護衛童子と摩竭童子の2人の童子が舞い降り、山を天童山と名付けたことから、その四方の里が天童と呼ばれるようになったという伝説が、天童市の公式ページで「名前の由来（伝説）」として紹介されている
    kind: legend
    level: E2
    status: established
    sources:
    - t6-tendo-city-yurai
  - text: 1375年に里見頼直が舞鶴山に天童城を築いて本拠を移し、この一族が天童氏を称した。以後、天童は最上氏一族・天童氏の城下町として発展したが、天正12年（1584年）に天童氏は最上義光に追放された
    kind: fact
    level: E3
    status: established
    sources:
    - t6-tendo-city-hayawakari
    - t6-tendo-kotobank
  - text: 市域の旧中心地の一つ成生（なりう）は、10世紀頃に藤原摂関家の荘園・成生荘が成立した土地で、「天童」より古い地名の層を持つ
    kind: fact
    level: E2
    status: established
    sources:
    - t6-tendo-city-tokei
  - text: 将棋駒づくりは、江戸時代に下級武士の内職として始められたものが地場産業として発展したものである（『ブリタニカ国際大百科事典』）
    kind: fact
    level: E3
    status: established
    sources:
    - t6-tendo-kotobank
  - text: 天童市は1954年に天童町・成生村・蔵増村・津山村・田麦野村・山口村・寺津村が合体し、1958年（昭和33年）に市制を施行、1962年に豊栄村を編入した
    kind: fact
    level: E3
    status: established
    sources:
    - t6-tendo-kotobank
  - text: 天童市の総務省地方公共団体コードは062103である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 市役所が「定かではありません」と書く地名
    text: 天童の名の由来は、市の統計書がはっきり「定かではありません」と書く珍しいケースである。候補は三つ。天から二人の童子が舞い降りたという行基の伝説、南北朝の武将・北畠天童丸の居城説、そしてアイヌ語源説。どれも決め手を欠くが、その伝説の舞台である舞鶴山では毎春、甲冑姿の人間が将棋の駒になる「人間将棋」が行われる。由来が一つに決まらないことも、この町の物語の豊かさの一部である。
    sources:
    - t6-tendo-city-tokei
    - t6-tendo-city-yurai
  relations:
  - pref/06
  unknowns:
  - 「天童」の語源・初出は確定しておらず、市公式資料自体が「定かではない」としている。アイヌ語源説の具体的な語形も確認できなかった
  - 北畠天童丸の実在と天童居城についても、確かな史料は残っていないとされる
  updated: '2026-11-13'
- id: muni/06-寒河江市
  code: '062065'
  names:
    ja: 寒河江市
    reading: さがえし
    aliases:
    - 寒河江荘
    - 寒河江庄
  user_terms:
  - さくらんぼの里さがえ
  - 寒河江の名前の由来
  - さがえ
  naming_type: 中心地名の継承
  formation: 合併新設
  prefecture: 山形県
  homonyms: []
  summary: 最上川の西岸、山形盆地の西端にある市で、市名は平安時代の荘園「寒河江荘」に遡る地名の継承である。鎌倉時代に大江広元が地頭職を得て、その子孫は荘名を名字として寒河江氏を称し、城下町が発展した。「寒川の江」が転じたという民間語源が伝えられる。1954年に寒河江町ほかが合併して市制を施行した。
  first_attestation:
    era: 平安時代
    year_western: null
    document: null
    note: 寒河江庄は平安時代後期から見える摂関家領の荘園とされるが、「寒河江」の語の文献上の初出（年・文書）は確認できなかった。寒河江市の沿革では天仁元年（1108）に関白藤原忠実が地頭に任ぜられたことを起点とする
  claims:
  - text: 寒河江荘は平安時代の中期に成立した摂関家領の荘園であり、寒河江市の沿革では天仁元年（1108）に関白藤原忠実が地頭に任ぜられたことを市の成立の起点とする
    kind: fact
    level: E2
    status: established
    sources:
    - t6-sagae-city-kyoiku
    - t6-sagae-city-zeimu
  - text: 鎌倉初期に大江広元が寒河江荘の地頭職を得て、その子孫は荘名を名字の地として寒河江氏を称した。寒河江は鎌倉時代から天正12年（1584）まで大江氏の城下町として発展した
    kind: fact
    level: E3
    status: established
    sources:
    - t6-sagae-kotobank-uji
    - t6-sagae-kotobank
  - text: 「寒河江」は、古代に関東地方から入植してきた寒川の農民が定住した当地は入江が多かったため、初めは「寒川の江」と呼ばれ、次第に「さがえ」と呼ばれるようになった、といわれている（『ブリタニカ国際大百科事典』が紹介する民間語源）
    kind: legend
    level: E3
    status: contested
    sources:
    - t6-sagae-kotobank
  - text: 市域の平野部を寒河江川が東流し、最上川に合流する。荘名・地名と川名のどちらが先かは、確認できなかった
    kind: fact
    level: E3
    status: established
    sources:
    - t6-sagae-kotobank
  - text: 寒河江市は1954年（昭和29）8月1日に寒河江町・西根村・柴橋村・高松村・醍醐村が合併して発足し、同年11月に白岩町・三泉村を編入した
    kind: fact
    level: E2
    status: established
    sources:
    - t6-sagae-city-zeimu
  - text: 寒河江市の総務省地方公共団体コードは062065である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 地名が名字になった寒河江
    text: 寒河江は、地名がそのまま武士の名字になった例である。鎌倉幕府の重臣・大江広元が寒河江荘の地頭となり、その子孫は「寒河江氏」を名乗ってこの地を治め続けた。一方で「寒河江」の語そのものの由来ははっきりせず、寒川の入江にちなむ「寒川の江」説が言い伝えとして紹介されるにとどまる。荘園・名字・城下町と積み重なった層の厚さが、この地名の履歴である。
    sources:
    - t6-sagae-kotobank-uji
    - t6-sagae-kotobank
  relations:
  - pref/06
  unknowns:
  - 「寒河江」の語の確実な初出（文献・年次）は確認できなかった
  - 川名「寒河江川」と荘名・地名「寒河江」の先後関係は未確認
  updated: '2026-11-13'
- id: muni/06-小国町
  code: '064017'
  names:
    ja: 小国町
    reading: おぐにまち
    aliases:
    - 小国郷
    - 小国本村
  user_terms:
  - 小国町の名前の由来
  - 置賜小国と最上小国の違い
  - 小国郷とはどこ
  naming_type: 旧国名・広域地名の採用
  formation: 合併新設
  prefecture: 山形県
  homonyms:
  - muni/43-小国町
  summary: 戦国期以降の文書に見える地域総称「小国」の継承。四方を山に囲まれた小国盆地一帯は中世以来「小国」「小国郷」と呼ばれ、1889年に小国本村・南小国村・北小国村・津川村へ再編、1942年に小国本村が町制を施行、1954年の合体合併で現在の小国町となった。熊本県小国町のような命名伝説は確認できず、地域総称としての用例が中心である。
  first_attestation:
    era: 戦国時代（天文7年）
    year_western: 1538
    document: 段銭古帳（「小国御太領」「おくに 上こほり山かた」）
    note: 『日本歴史地名大系』が紹介する用例で、原典は未読のため紹介として記録する
  claims:
  - text: 『日本歴史地名大系』は「小国」を戦国期以降に見える地名とし、中世には下長井のうち現在の小国町域の大部分を指し、近世にも小国盆地を中心とする地域の総称として広く用いられたと紹介する
    kind: fact
    level: E3
    status: established
    sources:
    - h3-oguni-y-kotobank
  - text: 同書は、天文7年（1538年）の段銭古帳に「小国御太領」「おくに 上こほり山かた」と見え、当地が伊達氏の直轄領と小国城主・上郡山氏の領地に分かれていたことを紹介する
    kind: fact
    level: E3
    status: established
    sources:
    - h3-oguni-y-kotobank
  - text: 町の計画は、当地が「古くから小国郷と呼ばれてきた」とし、四方を1000メートル級の山々に囲まれ他地域と隔絶した地形を「文字どおりの『小国』」を形づくるものと説明する
    kind: fact
    level: E2
    status: established
    sources:
    - h3-oguni-y-plan
  - text: 明治22年（1889年）に小国郷を構成した59か村が小国本村・南小国村・北小国村・津川村に再編され、昭和17年（1942年）に小国本村が町制を施行、昭和29年（1954年）に南小国村・北小国村と合体合併した
    kind: fact
    level: E2
    status: established
    sources:
    - h3-oguni-y-plan-r3
  - text: 熊本県小国町とは、山々に囲まれた盆地の郷名「小国」を継ぐ点で共通する。平凡社の地名コラムは、〈オグニ〉という名が山に囲まれた盆地状の地に広く付き、漢字では「小国」を宛てることが多いと指摘する。一方、熊本側には「国小なり」の言葉に由来するという伝説が公式に伝えられるが、山形側に固有の命名伝説は確認できない
    kind: fact
    level: E3
    status: established
    sources:
    - h3-oguni-jk
    - h3-oguni-k-town
  - text: 総務省「地方公共団体コード一覧」では本町のコードは064017とされる
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 置賜小国・最上小国・庄内小国
    text: 山形県内には「小国」と呼ばれる地域が複数あり、地元では最上郡や鶴岡市の小国と区別して、ここの小国を「置賜小国」と呼びます。山に囲まれた盆地ごとに同じ名が生まれるのは、〈オグニ〉が固有名詞というより地形を表す普通名詞に近い名だったからだと、地名コラムは説明します。
    sources:
    - h3-oguni-jk
  relations:
  - pref/06
  - muni/43-小国町
  unknowns:
  - なぜこの地が「小国」と呼ばれ始めたのかという命名理由そのもの
  - 段銭古帳の書誌・所蔵先の確認
  - 「小国郷」という呼称の初出
  updated: '2026-11-13'
- id: muni/06-尾花沢市
  code: '062120'
  names:
    ja: 尾花沢市
    reading: おばなざわし
    aliases:
    - 尾羽根沢
  user_terms:
  - 銀山温泉のあるまち
  - 尾花沢スイカ
  - おばなざわ
  naming_type: 中心地名の継承
  formation: 合併新設
  prefecture: 山形県
  homonyms: []
  summary: 銀山温泉と尾花沢スイカで知られる豪雪の市で、市名は旧町名「尾花沢」の継承である。「尾花沢」の語源は市の公式にも示されておらず、尾花（ススキ）の群生する沢という説のほか、鷲・鷹の尾羽根の租税に由来する説、アイヌ語説、粘土（はに）のある沢とする説などが言われる。1954年に1町4村が合併し、1959年に市制を施行した。
  first_attestation:
    era: 奈良時代
    year_western: 737
    document: 続日本紀
    note: 天平9年（737）に大野東人が玉野の大室駅に到着した記事が市域の正史への初出とされるが、地名「尾花沢」自体の初出ではない。「尾花沢」の語の初出は未確認
  claims:
  - text: 天平9年（737年）に陸奥出羽按察使の大野東人が玉野の大室駅に到着したことが、尾花沢市域が正史（『続日本紀』）に現れる最初の記事であると尾花沢市は位置づけている
    kind: fact
    level: E2
    status: established
    sources:
    - t6-obanazawa-city-kaso
  - text: 「尾花沢」の語源については市の公式サイトにも説明がなく、尾花（ススキ）が群生し沢が入り組んだ地であったことからとする説のほか、アイヌ語に由来する説、平安時代の調として鷲や鷹の尾羽根を納めた産地「尾羽（おばね）」が尾羽根沢を経て尾花沢になったとする説、「お（接頭語）＋はに（粘土）＋さわ（沢）」の転で「粘土のある沢」とする説などが紹介されており、定説はない
    kind: fact
    level: E4
    status: contested
    sources:
    - t6-obanazawa-folklore
  - text: 市東部の銀山温泉の名は、江戸時代に銀鉱山として栄えた延沢銀山に由来し、開湯後は銀山温泉と呼ばれるようになった（環境省の国民保養温泉地計画書）
    kind: fact
    level: E2
    status: established
    sources:
    - t6-obanazawa-env-ginzan
  - text: 元禄2年（1689年）、松尾芭蕉は『おくのほそ道』の行脚で尾花沢に10日間滞在し、豪商・鈴木清風の宅などに宿泊した
    kind: fact
    level: E2
    status: established
    sources:
    - t6-obanazawa-city-kaso
  - text: 尾花沢市は1954年（昭和29）に尾花沢町・福原村・宮沢村・玉野村・常盤村の1町4村が合併して新しい尾花沢町となり、1959年（昭和34）4月10日に市制を施行して県下12番目の市となった
    kind: fact
    level: E2
    status: established
    sources:
    - t6-obanazawa-city-kaso
  - text: 尾花沢市の総務省地方公共団体コードは062120である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 羽根か、花か、粘土か
    text: 尾花沢の語源候補は、字面の印象とは裏腹に多彩である。ススキの尾花が群生する沢という素直な説に加え、貢納品だった鷹や鷲の「尾羽根」の産地だったとする説、アイヌ語説、そして地質に目を向けた「粘土（はに）のある沢」説。市自身は由来を公式に示しておらず、決着はついていない。雪深い盆地の町に、芭蕉が10日も留まったという事実の確かさと並べて読むと、地名の曖昧さがかえって印象に残る。
    sources:
    - t6-obanazawa-folklore
    - t6-obanazawa-city-kaso
  relations:
  - pref/06
  unknowns:
  - 「尾花沢」の語の文献上の初出と、語源の定説は確認できなかった（市公式にも由来の説明がない）
  - 「尾羽根沢」から「尾花沢」への変遷を示す具体的な史料は未確認
  updated: '2026-11-13'
- id: muni/06-山形市
  code: '062014'
  names:
    ja: 山形市
    reading: やまがたし
    aliases:
    - 山形町
    - 山方郷
  user_terms:
  - 山形市の名前の由来
  - 山形市はいつできた市
  - 山方郷と山形市
  - 最上と呼ばれた土地
  naming_type: 藩名・城名から
  formation: 単独発足
  prefecture: 山形県
  homonyms: []
  summary: 市名は山形藩の城下町名の継承である。地名の核は『和名類聚抄』に現在の山形市の南側を指すとされる「山方郷」で、「山方」の表記は南北朝時代に斯波兼頼がこの地を拠点としてから「山形」として文書に再び現れるようになった。明治9年（1876年）に現在の山形県が成立して県庁所在地となり、明治22年（1889年）に最初に市制が施行された31市の一つとなった。なぜ「山方」と呼ばれたかは県公式も不明とする。
  first_attestation:
    era: 承平年間
    year_western: null
    document: 和名類聚抄
    note: 「山方郷」としての記載。県レコード（pref/06）と共通の起点で、『和名類聚抄』の成立年代（931〜938年頃）から単年は置かない
  claims:
  - text: 山形県は、山形の名は平安時代の『和名類聚抄』に今の山形市の南側を「山方郷」と記したことに由来があると言われている、と説明している
    kind: fact
    level: E2
    status: established
    sources:
    - a-yam-pref
  - text: なぜこの地を山方と言ったかは不明であると、山形県の公式解説は明言している。「山の方にある土地」という単純な地形呼称とする見方も、定説としては確認できない
    kind: fact
    level: E2
    status: indeterminate
    sources:
    - a-yam-pref
  - text: 「山方」の地名はいったん資料から見えなくなり、南北朝時代に斯波兼頼がこの地を政治の拠点として安定させると、土地売買の文書などに「山形」の表記が改めて現れるようになった、と山形県は述べている
    kind: fact
    level: E2
    status: established
    sources:
    - a-yam-pref
  - text: 山形市は、延文元年（1356年）に羽州探題として入部した斯波兼頼がこの地に城を築き城下町を整えて発展の礎を置き、のちに最上義光の時代に飛躍した、と市の沿革で説明している
    kind: fact
    level: E2
    status: established
    sources:
    - a-cap-yamagata-city
  - text: 明治維新によって山形には統一された山形県の県庁が置かれ、明治22年（1889年）4月1日に大阪市や横浜市などとともに日本で最初に市制が施行された31市のうちの1市として市制を施行した（当時の人口2万8400人）、と山形市は述べている
    kind: fact
    level: E2
    status: established
    sources:
    - a-cap-yamagata-city
  - text: 山形市は、かつてこの一帯が「最上（もがみ）」と呼ばれていたことも市の沿革で紹介している。地方の名（最上）と都市の名（山方・山形）は、別の系統の呼び名として併存していた
    kind: fact
    level: E2
    status: established
    sources:
    - a-cap-yamagata-city
  column:
    title: 「最上」と呼ばれた土地の、もう一つの名前
    text: 山形市の沿革は「山形は、古くは最上と呼ばれていた」と書き出します。川と地方を指す「最上」に対し、「山方」は今の市街の南あたりを指す、より小さな地名でした。平安時代の辞書に載ったきり姿を消していた「山方」が、南北朝時代に城下町とともに「山形」と字を替えて戻ってくる――消えかけた小さな地名が、城下町・藩・県・市と大きくなるにつれて地方全体の名前になったのが山形です。
    sources:
    - a-cap-yamagata-city
    - a-yam-pref
  relations:
  - pref/06
  unknowns:
  - 「山方」と呼ばれた理由の確定（県公式も不明と明言）
  - 市名が藩名の継承か城下町名の継承かの厳密な選定経緯（県レコードと同じ未確認事項で、1871年の山形県設置時の命名理由の一次文書は未確認）
  - 「山方」から「山形」への表記変更が起きた具体的な文書・年は未確認
  updated: '2026-11-13'
- id: muni/06-山辺町
  code: '063011'
  names:
    ja: 山辺町
    reading: やまのべまち
    aliases:
    - 山辺村
    - 大寺村
    - 作谷沢村
    - 相模村
  user_terms:
  - 山辺町の名前の由来
  - やまのべ
  - 羽前山辺駅は「やまべ」と読む
  - ニットの町
  naming_type: 中心地名の継承
  formation: 合併新設
  prefecture: 山形県
  homonyms: []
  summary: 山形県中央部、東村山郡の町で、山形盆地の南西、白鷹丘陵の山裾に広がる。もとの山辺村は1889年（明治22年）に成立し、1896年（明治29年）に町制を施行した。1954年（昭和29年）に大寺村・中村・作谷沢村・相模村と合併して、現在の山辺町となった。「山辺」の語源は確かめられていないが、読みはかつて「やまべ」とも読まれ、JR羽前山辺駅の駅名にその読みが残っている。
  first_attestation:
    era: 明治22年
    year_western: 1889
    document: 山辺村の成立（町村制施行）
    note: 自治体名としての初出。地名「山辺」自体の初出と語源は未確認
  claims:
  - text: 山辺村は明治29年（1896年）7月27日に町制を施行して山辺町となり、昭和29年（1954年）10月1日に大寺村・中村・作谷沢村・相模村と合併して、新しい山辺町となった
    kind: fact
    level: E2
    status: established
    sources:
    - z11-yamanobe-uub
  - text: 町公式の副読本は、大正10年（1921年）にできた羽前山辺駅の読みが「やまべ」なのは、駅ができたころは町の名前が「やまべまち」だったからだと説明する
    kind: fact
    level: E2
    status: established
    sources:
    - z11-yamanobe-town-fukudoku
  - text: 『日本歴史地名大系』によれば、町は山形盆地の南西に位置し、町域の大半は白鷹丘陵が占め、東縁を北流する須川に向かって傾斜する地形である
    kind: fact
    level: E3
    status: established
    sources:
    - z11-yamanobe-kotobank
  - text: 町内の大寺地区にある坊主窪古墳群の一号墳は六世紀のものと推定され、日本海側では北限の前方後円墳であると『日本歴史地名大系』は記す
    kind: fact
    level: E3
    status: established
    sources:
    - z11-yamanobe-kotobank
  - text: 「山辺」の語源について、「山の辺（ほとり）」という地形に由来する名とする解釈を裏づける確かな資料は、確認できなかった
    kind: fact
    level: E3
    status: indeterminate
    sources:
    - z11-yamanobe-kotobank
  - text: 山辺町の地方公共団体コードは063011である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 駅名に残った、昔の読み
    text: 町の名の読みは今「やまのべまち」。だが最寄り駅は「羽前山辺（うぜんやまべ）」と読む。町の副読本によれば、駅が開業した大正時代、町は「やまべまち」と読まれていたためだという。自治体の正式な読みが変わっても、駅名は開業時の読みを残し続ける。地名の古い姿が駅名標に「化石」として残った例である。
    sources:
    - z11-yamanobe-town-fukudoku
  relations:
  - pref/06
  - muni/06-中山町
  - muni/06-山形市
  unknowns:
  - 「山辺」の語源と、地名としての初出は未確認
  - 読みが「やまべ」から「やまのべ」に変わった時期と経緯は未確認
  - 1889年の山辺村を構成した旧村の詳細は未確認
  updated: '2026-11-13'
- id: muni/06-川西町
  code: 063827
  names:
    ja: 川西町
    reading: かわにしまち
    aliases: []
  user_terms:
  - 川西町の名前の由来
  - 山形の川西町は最上川の西
  - 川西町は山形と奈良にある
  naming_type: 方位・位置による命名
  formation: 合併新設
  prefecture: 山形県
  homonyms:
  - muni/29-川西町
  summary: 昭和30年（1955年）に小松町・大塚村・犬川村・中郡村・玉庭村・吉島村の1町5村が合併して成立した。町公式は「最上川の西側に位置することから、川西町と名づけられました」と由来を明示しており、大きな川に対する方位で土地を示す、明快な位置地名である。奈良県川西町は命名理由が確認できておらず、同名でも由来の確かさが対照的である。
  first_attestation:
    era: 昭和30年
    year_western: 1955
    document: 川西町の成立（1955年の合併。川西町公式「川西町の概要」）
    note: 自治体としての「川西町」の初出。旧町村名の継承ではなく合併に際しての新名
  claims:
  - text: 川西町は昭和30年（1955年）に小松町・大塚村・犬川村・中郡村・玉庭村・吉島村の1町5村が合併して誕生した町である
    kind: fact
    level: E2
    status: established
    sources:
    - h4-yamagata-kawanishi-gaiyo
  - text: 町公式は「最上川の西側に位置することから、川西町と名づけられました」と明記しており、町名が最上川に対する位置（西側）に由来することが公式に確定している
    kind: fact
    level: E2
    status: established
    sources:
    - h4-yamagata-kawanishi-gaiyo
  - text: 「川西町」という名は、合併した旧町村のいずれの名でもなく、1955年の合併に際して土地の位置から新しく付けられた名である
    kind: fact
    level: E2
    status: established
    sources:
    - h4-yamagata-kawanishi-gaiyo
  - text: 【共通する層】奈良県川西町も「川西」という同じ構成の名を持ち、両町とも大きな川を持つ土地の町である。ただし由来の型が同じかどうかは、奈良側の裏付けが得られてから判断する
    kind: fact
    level: E2
    status: established
    sources:
    - h4-yamagata-kawanishi-gaiyo
    - h4-nara-kawanishi-gaiyo
  - text: 【異なる層】奈良県川西町については、町公式資料に村名・町名の由来の明示がなく、「川西」がどの川の西を指すのかも確認できていない。山形側の明快な位置由来とは対照的である
    kind: fact
    level: E2
    status: established
    sources:
    - h4-nara-kawanishi-rekishi
    - h4-yamagata-kawanishi-gaiyo
  column:
    title: 名刺のような町名
    text: 「最上川の西側だから川西町」。由来の説明が一行で終わる町名は、地図を開けば誰でも納得できる。1955年の合併で生まれた新しい町に、旧町村のどれかの名ではなく、土地の位置そのものを名乗らせる。対等な合併の名付けとして、分かりやすい選択だった。
    sources:
    - h4-yamagata-kawanishi-gaiyo
  relations:
  - pref/06
  - muni/29-川西町
  unknowns:
  - 合併協議における町名の選定過程（他の候補名の有無）は未確認
  - 「川西」という地域の呼称が1955年の合併以前からあったかどうかは未確認
  updated: '2026-11-13'
- id: muni/06-庄内町
  code: 064289
  names:
    ja: 庄内町
    reading: しょうないまち
    aliases:
    - 余目町
    - 立川町
  user_terms:
  - 庄内町の名前の由来
  - しょうない
  - 庄内平野の町
  - 余目と立川の合併で生まれた町
  naming_type: 旧国名・広域地名の採用
  formation: 合併新設
  prefecture: 山形県
  homonyms: []
  summary: 山形県北西部、東田川郡の町。2005年（平成17年）に余目町と立川町が合併して誕生した。町名は公募で選ばれ、広域の地域名「庄内」をそのまま名乗った。「庄内」は、中世にこの一帯を指した「大泉荘内」に由来するとされる地名で、庄内平野や庄内藩の名としても知られる。
  first_attestation:
    era: 平成17年
    year_western: 2005
    document: 庄内町の成立（2005年の合併。庄内町公式「庄内町の歴史」）
    note: 自治体名としての「庄内町」の初出。地域名「庄内」は中世の「大泉荘内」に遡るとされる
  claims:
  - text: 平成17年（2005年）7月1日に余目町と立川町が合併し、庄内町が誕生した
    kind: fact
    level: E2
    status: established
    sources:
    - z11-shonai-town-rekishi
  - text: 新町名は公募で決められ、最終候補は「天の川町」「庄内町」「庄内中央町」の3案となり、平成16年（2004年）4月30日に合併協議会の委員17人で投票が実施され、「庄内町」が14票を獲得して決定した
    kind: fact
    level: E5
    status: established
    sources:
    - z11-shonai-wikipedia
  - text: 『デジタル大辞泉』は、「庄内」の名は中世に大泉氏の所領を「大泉荘内」といったことによると説明する
    kind: fact
    level: E3
    status: established
    sources:
    - z11-shonai-kotobank
  - text: 「庄内」は庄内平野を中心とし、酒田・鶴岡両市を含む山形県北西部の地域名であり、庄内町はそのほぼ中央に位置する
    kind: fact
    level: E3
    status: established
    sources:
    - z11-shonai-kotobank
  - text: 町北部の余目地区の地名は、『和名類聚抄』に載る古代の余戸（あまるべ）郷に由来すると『日本大百科全書』は説明する
    kind: fact
    level: E3
    status: established
    sources:
    - z11-shonai-kotobank
  - text: 国の天然記念物に指定されている月山の頂上は、庄内町にあると町公式は位置づける
    kind: fact
    level: E2
    status: established
    sources:
    - z11-shonai-town-gaiyou
  - text: 庄内町の地方公共団体コードは064289である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 町より大きな名前を引き受けた町
    text: 「庄内」は本来、酒田と鶴岡を含む平野全体を指す地域名で、一つの町には大きすぎる名前だった。公募の最終候補には、余目の「あま」と立川の「川」を織り込んだ「天の川町」という案も残ったが、選ばれたのは知名度のある地域名そのものだった。「庄内地方全域が合併したときに『庄内市』が誕生する、その先駆けに」という願いも込められたという。町は今、その大きな名前の真ん中にいる。
    sources:
    - z11-shonai-wikipedia
    - z11-shonai-kotobank
  relations:
  - pref/06
  - muni/06-鶴岡市
  - muni/06-酒田市
  - muni/06-三川町
  unknowns:
  - 「大泉荘内」という呼称の初出の文書と年代は未確認
  - 公募の応募総数など、町名選定過程の一次資料（合併協議会だより等）による裏づけは未確認
  updated: '2026-11-13'
- id: muni/06-戸沢村
  code: '063673'
  names:
    ja: 戸沢村
    reading: とざわむら
    aliases:
    - 戸沢
    - 旧戸沢村（第1次戸沢村）
    - 古口村（1955年4月1日〜5月1日の名称）
  user_terms:
  - 戸沢
  - とざわ
  - 最上川舟下りの村
  - 最上峡
  - 芭蕉ライン
  naming_type: 人名に由来
  naming_note: 1889年の合併時の新村名。1955年に改称で復活した名で、命名理由は公式資料に明記されていない
  formation: 合併新設
  prefecture: 山形県
  homonyms: []
  summary: 最上郡西部、最上川が鮭川・角川を合わせて出羽山地を横断する最上峡の村で、最上川舟下り（芭蕉ライン）の拠点として知られる。近世は新庄藩戸沢氏の所領で、中心の古口は最上川舟運の要衝として藩の船番所が置かれた。村名「戸沢」は1889年（明治22年）の町村制で5村が合併した際に付けられた新名で、1955年（昭和30年）の合併でいったん古口村となったが、1か月後に戸沢村へ改称して今日に至る。
  first_attestation:
    era: 明治22年
    year_western: 1889
    document: 町村制施行による戸沢村（第1次）の成立
    note: 自治体名としての初出。合併した岩清水・名高・津谷・神田・松坂のいずれの旧村名とも異なる新名であり、地名「戸沢」そのものの初出は確認できていない
  claims:
  - text: 村域のほぼ中央を最上川が西流し、村の東端で鮭川を、中央部で角川を合わせて先行谷を形成しながら出羽山地を横断し、庄内平野へ抜ける
    kind: fact
    level: E3
    status: established
    sources:
    - z12-tozawa-kotobank-taikei
  - text: 近世には戸沢氏新庄藩の所領であり、中心の古口は最上川舟運の要衝で、村の観光サイトは「戸澤藩船番所」が設けられていたと紹介する
    kind: fact
    level: E2
    status: established
    sources:
    - z12-tozawa-kanko-trivia
    - z12-tozawa-kotobank-taikei
  - text: 1889年（明治22年）4月1日の町村制施行により、岩清水村・名高村・津谷村・神田村・松坂村の5村が合併して戸沢村（第1次）が生まれた
    kind: fact
    level: E2
    status: established
    sources:
    - z12-tozawa-vill-jinko
    - z12-tozawa-wiki-old
  - text: 1889年の新村名「戸沢」の命名理由は村公式資料に明記されておらず、藩主であった戸沢氏にちなむとする紹介が一般に見られるが、確証は得られていない
    kind: fact
    level: E5
    status: indeterminate
    sources:
    - z12-tozawa-wiki-old
  - text: 1955年（昭和30年）4月1日、古口村・（旧）戸沢村・角川村の3村が合併して古口村が発足し、同年5月1日に村名を戸沢村に変更して現在の戸沢村となった
    kind: fact
    level: E2
    status: established
    sources:
    - z12-tozawa-vill-jinko
    - z12-tozawa-vill-keikaku
  - text: 『延喜式』兵部省の駅名として見える「佐藝（さぎ）駅」は、村内の津谷付近、最上川と鮭川の合流地点あたりにあった水駅と推定され、古代から内陸と庄内を結ぶ交通路が通っていたとされる
    kind: fact
    level: E5
    status: contested
    sources:
    - z12-tozawa-wiki-old
  - text: 芭蕉が大石田で「五月雨を集めて涼し最上川」と詠んだ句は、増水した最上川の奔流を体験したことで戸沢村の地で「涼し」が「早し」に推敲されたのではないか、と言い伝えられている
    kind: legend
    level: E2
    status: established
    sources:
    - z12-tozawa-kanko-trivia
  - text: 義経北国落ちの際、従者の常陸坊海尊がこの地で義経と別れて山に籠り仙人になったという仙人堂の伝説や、白糸の滝にまつわる義経一行の伝説が村内に伝わる
    kind: legend
    level: E2
    status: established
    sources:
    - z12-tozawa-kanko-trivia
  - text: 戸沢村の地方公共団体コードは063673である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 「涼し」が「早し」に変わった川
    text: 松尾芭蕉の「五月雨を集めて早し最上川」は、この村の川が詠まれた句とされる。村の観光サイトによれば、芭蕉は大石田では「五月雨を集めて涼し最上川」と詠んでいたが、梅雨で増水した最上峡の奔流を実際に下る体験をして、「涼し」を「早し」に推敲したのではないかと言われている。古口に新庄藩の船番所が置かれた舟運の要衝は、芭蕉の時代には命がけの難所でもあった。今日その川を下る観光舟は「芭蕉ライン」と名乗り、句の生まれた川として村の顔になっている。
    sources:
    - z12-tozawa-kanko-trivia
  relations:
  - pref/06
  - muni/06-新庄市
  - muni/06-鮭川村
  unknowns:
  - 1889年の新村名「戸沢」の命名理由（戸沢氏にちなむのか、旧小地名に由来するのか）は、村公式資料・専門辞典のいずれでも確認できなかった
  - 地名「戸沢」の近世以前の用例（戸沢郷等の有無）は確認できなかった
  - 『延喜式』の佐藝駅の比定地は諸説あり確定していない
  updated: '2026-11-13'
- id: muni/06-新庄市
  code: '062057'
  names:
    ja: 新庄市
    reading: しんじょうし
    aliases:
    - 新城
    - 新荘
    - 沼田
  user_terms:
  - 新庄まつりのまち
  - 新庄藩の城下町
  - しんじょう
  naming_type: 中心地名の継承
  formation: 単独発足
  prefecture: 山形県
  homonyms: []
  summary: 新庄藩戸沢氏6万石の城下町を起源とする最上地域の中心市で、市名は旧町名「新庄」の継承である。地名は古く「新城」と書かれ、清水城に対する新しい城に由来するという説と、新しく開かれた荘「新荘」に由来するという説がある。表記は寛文年間頃から「新庄」に定まった。1949年に市制を施行した。
  first_attestation:
    era: null
    year_western: null
    document: null
    note: 市名のもととなった地名は古く「新城」と書かれ、寛文年間（1661〜73）頃から「新庄」の字があてられるようになったと『日本歴史地名大系』が記すが、「新城」の初出の年次・文書は未確認
  claims:
  - text: 市名のもととなった地名は、古くは「新城」の字があてられたが、寛文年間（1661〜73年）頃から「新庄」の文字があてられるようになった（『日本歴史地名大系』）
    kind: fact
    level: E3
    status: established
    sources:
    - t6-shinjo-kotobank
  - text: 元和8年（1622年）に戸沢政盛が新庄藩主となり、寛永元年（1624年）に新荘・清水・升形の三つの古城のうち新荘を城地と定めた。新庄城は寛永2年（1625年）の完成と伝えられ、新庄藩は戸沢氏11代・約250年にわたって続いた
    kind: fact
    level: E2
    status: established
    sources:
    - t6-shinjo-city-han
  - text: 新庄の名の起こりには、清水城（現在の大蔵村）に対して新しい城であったため「新城」と呼ばれたという説と、南北朝時代に小田島氏が東根の本荘に対して新しく開いた村（荘園）という意味で「新荘」と呼ばれるようになったという説の二つが、新庄駅の駅名由来の掲示で紹介されている
    kind: fact
    level: E4
    status: contested
    sources:
    - t6-shinjo-kaido-ekimei
  - text: 新庄市は1889年（明治22年）の町村制施行で成立した新庄町を前身とし、1948年（昭和23年）に稲舟村を合併、1949年（昭和24）4月1日に市制を施行して県内5番目の市となり、1955年に萩野村、1956年に八向村を合併した
    kind: fact
    level: E2
    status: established
    sources:
    - t6-shinjo-city-tokei
  - text: 新庄市の総務省地方公共団体コードは062057である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 新しい城か、新しい荘か
    text: 新庄の「新」は何に対して新しいのか。二つの答えがある。川向かいの古い清水城に対して新しく築かれた城だから「新城」。あるいは、東根の本荘に対して新しく開かれた荘だから「新荘」。戸沢政盛が城地を選んだときの文書には「新荘」とあり、古くは「新城」とも書かれたという。城と荘、二つの層が重なったまま「新庄」の二文字に収まったのが、この地名の面白さである。
    sources:
    - t6-shinjo-kaido-ekimei
    - t6-shinjo-city-han
    - t6-shinjo-kotobank
  relations:
  - pref/06
  unknowns:
  - 「新城」「新荘」の語の初出の年次と文書は確認できなかった。「新しい城」説と「新しい荘」説のどちらが正しいかも未確定
  - 戸沢入部以前の地名（沼田等）と「新城・新荘」の関係の細部は未確認
  updated: '2026-11-13'
- id: muni/06-最上町
  code: '063622'
  names:
    ja: 最上町
    reading: もがみまち
    aliases:
    - 最上
    - 小国郷
    - 東小国村・西小国村（1954年の合併前の村）
  user_terms:
  - 最上
  - もがみ
  - 小国
  - 向町
  - 堺田分水嶺
  - 瀬見温泉
  naming_type: 旧行政区画名の継承
  naming_note: 郡名「最上」の継承
  formation: 合併新設
  prefecture: 山形県
  homonyms: []
  summary: 奥羽山脈に囲まれた小国盆地の町で、町域は中世の小国郷にあたる。町名は郡名「最上」の継承で、「もがみ」は『和名類聚抄』に「毛賀美」と記される古い地名だが語源は確定していない。1954年（昭和29年）に東小国村・西小国村が合併して発足した。町名の由来である最上川の本流は町域を流れず、流れるのは支流の最上小国川である。
  first_attestation:
    era: 和銅5年
    year_western: 712
    document: 『続日本紀』
    note: 最上郡が置賜郡とともに出羽国へ割かれた記事が最上郡の文献初見とされる（二次資料経由の確認による）。当初は陸奥国に属し「裳上」とも書かれたとされる
  claims:
  - text: 最上郡は当初陸奥国に属してのち出羽国に含まれ、仁和2年（886年）に出羽国最上郡から村山郡が分かれた
    kind: fact
    level: E3
    status: established
    sources:
    - z12-mogami-kotobank-gun
  - text: 『続日本紀』和銅5年（712年）に置賜郡・最上郡が出羽国に割譲されたとあるのが最上郡の文献初見とされ、8世紀初めには「裳上郡」とも書かれた
    kind: fact
    level: E5
    status: established
    sources:
    - z12-mogami-wiki-gun
  - text: 太閤検地の頃、南北2郡の名称の入れ替えとともに再編が行われ、旧村山郡の北部が現在の最上郡になったとされる
    kind: fact
    level: E5
    status: contested
    sources:
    - z12-mogami-wiki-gun
  - text: 「もがみ」の語源は確定しておらず、国土交通省の最上川電子大事典は、『和名類聚抄』が最上の名を「毛賀美」と記すことを挙げ、「珍しい岩石の多いところ」の意とする解釈、アイヌ語の「モ・カムイ（静かなる神）」に由来する説、崖の上を意味する「モモカミ」に由来する説を紹介している
    kind: fact
    level: E2
    status: contested
    sources:
    - z12-mogami-mlit-daijiten
  - text: 現在の町域はかつて「小国郷」と呼ばれ、その名は町内を流れる最上小国川（小国川）に残る。最上川の本流は町域を流れていない
    kind: fact
    level: E5
    status: established
    sources:
    - z12-mogami-wiki
  - text: 最上小国川の中流域には向町盆地が開け、町の中心の向町は近世に問屋場が置かれ、堺田越を経て仙台藩へ物資を中継する拠点であった
    kind: fact
    level: E3
    status: established
    sources:
    - z12-mogami-kotobank-gun
    - z12-mogami-wiki
  - text: 1954年（昭和29年）9月1日、最上郡東小国村と西小国村が新設合併して最上町が発足した
    kind: fact
    level: E5
    status: established
    sources:
    - z12-mogami-wiki
    - z12-mogami-town-ayumi
  - text: 1958年（昭和33年）1月8日、「もがみ」を図案化した最上町の町章が制定された
    kind: fact
    level: E2
    status: established
    sources:
    - z12-mogami-town-ayumi
  - text: 最上町の地方公共団体コードは063622である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 最上川の流れない「最上」町
    text: 最上町という名は郡名「最上」の継承だが、町の中を流れているのは最上川ではない。流れるのは支流の最上小国川で、町域は中世には小国郷と呼ばれた土地である。しかも現在の最上郡という枠組み自体、太閤検地の頃に南北の郡名が入れ替わってできたものとされ、古代の最上郡は村山地方を含む別の広がりを持っていた。さらに町の堺田地区には、駅前の用水路で太平洋側と日本海側へ水が二手に分かれる分水嶺まである。「最上」の名の層は、川・郡・郷の三つが重なってできている。
    sources:
    - z12-mogami-wiki
    - z12-mogami-wiki-gun
  relations:
  - pref/06
  - muni/06-新庄市
  - muni/06-舟形町
  unknowns:
  - 「もがみ」の語源は諸説あり（毛賀美＝珍しい岩石の多い所説、アイヌ語説、モモカミ説）、いずれも決定的な裏付けは確認できなかった
  - 1954年の合併時に町名を「最上」と定めた経緯（公募・協議の有無）は、町公式資料では確認できなかった
  - 『続日本紀』和銅5年の記事の原文は未確認で、二次資料経由の紹介にとどまる
