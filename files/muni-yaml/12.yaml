    sources:
    - w4-futtsu-city-yurai
  - text: 第1の説は「古津（ふるつ）」で、古い港という意味であり、中世の文書に出てくる「ふんと」もこの意味といわれ、今津に対するものであるという
    kind: fact
    level: E2
    status: contested
    sources:
    - w4-futtsu-city-yurai
  - text: 第2の説は「ほと」で、古語で突き出た所のことをいい、富津岬の地形から考えられるという
    kind: fact
    level: E2
    status: contested
    sources:
    - w4-futtsu-city-yurai
  - text: 第4の説は「ふつ」で、刀を振った際に発する音であり、富津岬を刀と見て霊力と結びつけたものという
    kind: fact
    level: E2
    status: contested
    sources:
    - w4-futtsu-city-yurai
  - text: 弟橘媛が海神の怒りを鎮めるため海に身を捧げた後、その衣の布が富津の海岸に流れ着いたことから、「布が流れてきた津」すなわち「布流津（ふるつ）」が「富津」になったという伝説が市内に伝わり、富津市は紙芝居風の動画でこの伝説を紹介している
    kind: legend
    level: E2
    status: established
    sources:
    - w4-futtsu-city-furutsu
    - w4-futtsu-city-yurai
  - text: 昭和46年（1971年）4月25日に富津町・大佐和町・天羽町の3町が合併して富津町となり、同年9月1日に市制を施行して富津市が誕生した（富津市公式「市の紹介」）
    kind: fact
    level: E2
    status: established
    sources:
    - w4-futtsu-city-intro
  - text: 富津市の地方公共団体コードは122262である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 「布流津」伝説と、もう一つの「津」の物語
    text: 『古事記』『日本書紀』に記される日本武尊の東征では、妃の弟橘媛が走水の海（今の浦賀水道）に身を投げて嵐を鎮めたとされる。富津に伝わる話はその続きで、上陸した武尊のあとに媛の衣の布が富津の岸に流れ着き、「布流津（ふるつ）」の名が残ったという。同じ伝説圏には、対岸の木更津の「君去らず」の物語もある。一つの伝説が、東京湾の両岸に別々の地名の物語を生んだことになる。ただしこれはあくまで伝説であり、富津市史自身は古津説・ほと説などと並ぶ4説の一つとして扱っている。
    sources:
    - w4-futtsu-city-furutsu
    - w4-futtsu-city-yurai
  relations:
  - pref/12
  - muni/12-木更津市
  unknowns:
  - 中世の文書に見えるという「ふんと」の具体的な文書名と年代は、富津市公式ページに示されていない
  - 「富津」の漢字表記がいつ定着したかは確認できていない
  - 4説のうちどれが有力かは『富津市のあゆみ』でも決着しておらず、市の紹介でも併記にとどまる
  updated: '2026-11-13'
- id: muni/12-富里市
  code: '122335'
  names:
    ja: 富里市
    reading: とみさとし
    aliases:
    - 富里村
    - 富里町
  user_terms:
  - とみさと
  - 富里スイカの市
  - 七栄・十倉
  naming_type: 合成地名
  formation: 合併新設
  prefecture: 千葉県
  homonyms: []
  summary: 「富里」は明治22年（1889年）に13の集落が合併して村を作った際、「十三の里」（里は村の意）ということから名付けられたと富里市公式の歴史は説明する、明治の開拓地らしい名である。市域の七栄・十倉などの地名は、開拓の入植順序と美称を組み合わせた字名に由来する。村は後に町となり、平成14年（2002年）に市制を施行した。
  first_attestation:
    era: 明治22年
    year_western: 1889
    document: 富里村の成立（富里市公式「とみさとの歴史（近現代）」による紹介）
    note: 自治体名「富里」の初出。
  claims:
  - text: 明治22年（1889年）に日吉倉・久能・大和・根木名・七栄・新橋・中沢・新中沢・立沢・立沢新田・高野・高松・十倉の13集落が合併して村を形成し、その名を「十三の里」（里はむらの意味）ということから「富里村」が誕生したと富里市公式の歴史は説明する
    kind: fact
    level: E2
    status: established
    sources:
    - w4-tomisato-city-history
  - text: 市域の七栄という地名は開墾が七番目に行われた所、十倉は十番目に行われた所であることから付いた名であると富里市公式の歴史は説明する
    kind: fact
    level: E2
    status: established
    sources:
    - w4-tomisato-city-history
  - text: 開拓地の字名は入植の順序と美称を組み合わせて付けられ、明治5年（1872年）11月2日付で正式の村名に採用されたもので、初富・二和・三咲・豊四季・五香・六実・七栄・八街・九美上・十倉・十余一・十余二・十余三という名が各地に残っている（富里市公式）
    kind: fact
    level: E2
    status: established
    sources:
    - w4-tomisato-city-history
  - text: 明治2年（1869年）に東京府内の豪商が政府から依頼され、多くの窮民を集めて開拓民としてこの地に送り込み、七栄の原野の開墾から富里一帯の開拓が始まった（富里市公式）
    kind: fact
    level: E2
    status: established
    sources:
    - w4-tomisato-city-history
  - text: 富里市は広報とみさと号外「市制20周年記念号」（2022年）を刊行しており、市制施行は平成14年（2002年）である
    kind: fact
    level: E2
    status: established
    sources:
    - w4-tomisato-city-history
  - text: 富里市の地方公共団体コードは122335である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 番号で名付けられた開拓地の村々
    text: 明治の初め、下総の原野に入植した開拓地では、入植の順番とめでたい言葉を組み合わせて集落に名が付けられた。1番目の初富に始まり、二和、三咲、豊四季、五香、六実、七栄、八街、九美上、十倉、そして十余一・十余二・十余三。現在の富里市にある七栄は7番目、十倉は10番目の開拓地だった。そして富里という市名自体も、13の集落が合わさった「十三の里」に由来するという。番号と数にちなむ命名が二重に重なった、開拓地ならではの地名である。
    sources:
    - w4-tomisato-city-history
  relations:
  - pref/12
  unknowns:
  - 「十三の里」がなぜ「富里」の字に置き換えられたのか（「富」の字を選んだ理由）は、富里市公式の歴史では明示されていない
  - 富里村が町制を施行した年次など、村から市への中間の沿革の詳細は市公式ページの抜粋範囲では確認できなかった
  - 合併した13集落それぞれの古い地名の語源は未調査である
  updated: '2026-11-13'
- id: muni/12-山武市
  code: '122378'
  names:
    ja: 山武市
    reading: さんむし
    aliases:
    - 山武町（さんぶ）
    - 山武郡（さんぶぐん）
    - 成東町
  user_terms:
  - さんむ
  - さんぶ（旧い読み）
  - 山武杉の産地
  naming_type: 旧行政区画名の継承
  formation: 合併新設
  prefecture: 千葉県
  homonyms: []
  summary: 山武市は平成18年（2006年）に山武郡の成東町・山武町・蓮沼村・松尾町が合併して発足した。市名は郡名「山武」を継承したが、読みは合併前の郡・町で使われていた「さんぶ」ではなく、郡の古い読み方とされる「さんむ」を採用した。山武郡は明治30年（1897年）に山辺郡と武射郡が合併して成立した郡であり、現在も郡の読みは「さんぶぐん」のままである。
  first_attestation:
    era: 明治30年
    year_western: 1897
    document: 山武郡の発足（山辺郡・武射郡の統合）
    note: 郡名「山武」の初出。読みは長く「さんぶ」とされてきたが、市は郡の古い読み方とされる「さんむ」を採用した。
  claims:
  - text: 平成18年（2006年）3月27日に山武郡成東町・山武町・蓮沼村・松尾町が合併して山武市が発足した
    kind: fact
    level: E2
    status: established
    sources:
    - upg-r3-chiba-gappei-sammu
  - text: 合併以前は山武郡・山武町とも読みは「さんぶ」であったが、現在の山武市の読みは「さんむ」である
    kind: fact
    level: E3
    status: established
    sources:
    - upg-r3-sammu-kotobank
    - upg-r3-sammu-gun-taikei
  - text: 市名の読み「さんむ」は、山武郡の古い読み方によるものである（『日本大百科全書（ニッポニカ）』）
    kind: fact
    level: E3
    status: established
    sources:
    - upg-r3-sammu-kotobank
  - text: 「山武郡」は現在も「さんぶぐん」が正式な読みであり、市と郡とで「山武」の読みが異なっている
    kind: fact
    level: E3
    status: established
    sources:
    - upg-r3-sammu-gun-taikei
  - text: 山武郡は、明治30年（1897年）に山辺郡と武射郡が合併して成立した郡である（『日本歴史地名大系』）
    kind: fact
    level: E3
    status: established
    sources:
    - upg-r3-sammu-gun-taikei
  - text: 合併は当初、東金市・大網白里町・九十九里町を含む山武地域7市町村（東金市・大網白里町・九十九里町・成東町・山武町・蓮沼村・松尾町）の枠組みで進められ、平成15年（2003年）4月に東金市・九十九里町・成東町・山武町・松尾町の山武地域合併協議会が設置された。しかしこの枠組みは実現せず、平成16年（2004年）11月の東金市の住民投票で合併反対が多数となったことなどから、最終的に成東町・山武町・蓮沼村・松尾町の4町村による合併となった（千葉県公式『千葉県における平成の合併の記録』）
    kind: fact
    level: E2
    status: established
    sources:
    - upg-r3-chiba-gappei-sammu
  - text: 山武市の地方公共団体コードは122378であり、総務省の一覧でも読みは「サンムシ」とされる
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 失われた読みを「復活」させた市名
    text: 平成の大合併で生まれた市の多くは新しい市名を作ったが、山武市は郡の名をそのまま受け継ぎながら、読みの方を変えた。長く「さんぶ」と読まれてきた「山武」を、郡の古い読み方とされる「さんむ」に改めたのである。ところが合併後も山武郡は残り、その読みは「さんぶぐん」のままである。同じ「山武」という字が、市では「さんむ」、郡では「さんぶ」と読み分けられる珍しい状態が続いている。
    sources:
    - w4-sanmu-wiki
  relations:
  - pref/12
  unknowns:
  - 「さんむ」の読みを新市の正式な読みに採用した経緯を示す合併協議会の公式資料は確認できず、Wikipedia の記述に依拠した
  - 山武地域合併協議会が平成15年（2003年）12月に新市名を「九十九里市」と決定したという紹介があるが、千葉県の公式記録では確認できなかった
  - 武射（むさ）という郡名自体の語源、山辺（やまべ）の語源は確認できていない
  - 「さんぶ」への読みの変化が1975年頃という年代の根拠も未確認である
  updated: '2026-11-13'
- id: muni/12-市原市
  code: '122190'
  names:
    ja: 市原市
    reading: いちはらし
    aliases:
    - 市原郡
    - 市原町
  user_terms:
  - 市原市の名前の由来
  - 市原は郡の名前だったのか
  - 五井や姉崎との合併
  - 一郡一市とは
  naming_type: 旧行政区画名の継承
  formation: 合併新設
  prefecture: 千葉県
  homonyms: []
  summary: 市名は、合併した5町が属していた旧・上総国市原郡の郡名を受け継いだもの。1963年に五井町・姉崎町・市原町・市津町・三和町が合併して市制を施行し、1967年には郡の残り全域を編入して「一郡一市」となった。「市原」の地名自体は『万葉集』に見えると市の広報は紹介し、由来にはイチイガシの木が茂っていたとする説と、原に市場が立ったとする説がある。
  first_attestation:
    era: 奈良時代
    year_western: null
    document: 『万葉集』
    note: 市原市の広報特集が、「市原」という地名はすでに万葉集に見ることができると地方史研究の成果として紹介する。具体的な歌・巻数は未確認
  claims:
  - text: 市原市の広報特集は「市原」の由来として、イチイガシ（櫟）の木がこの地によく合って生い茂っていたためとする説と、昔、原に市場（市）が立ったことからとする説の2つを紹介している
    kind: fact
    level: E2
    status: contested
    sources:
    - l2-ichihara-koho
  - text: 同じ特集は、「市原」という地名がすでに『万葉集』に見ることができると、地方史研究の成果として紹介している
    kind: fact
    level: E2
    status: established
    sources:
    - l2-ichihara-koho
  - text: 五井については、刀鍛冶が名刀を鍛える水を求めて井戸を掘り続け、5つ目の井戸水でようやく名刀を鍛えることができたので「五井」と名付けたという伝説が、地名辞典の説として市の広報に紹介されている
    kind: legend
    level: E2
    status: established
    sources:
    - l2-ichihara-koho
  - text: 昭和38年（1963）5月1日、市原郡五井町・姉崎町・市原町・市津町・三和町の5町が合併して市制を施行し、市原市が誕生した
    kind: fact
    level: E2
    status: established
    sources:
    - l2-ichihara-kyoiku
  - text: 昭和42年（1967）10月には南総町・加茂村を合併し、旧市原郡の全域を市域とする「一郡一市」の広域市となった
    kind: fact
    level: E2
    status: established
    sources:
    - l2-ichihara-kyoiku
  - text: 合併した5町はいずれも市原郡に属しており、新市の名にはその郡名「市原」が用いられた。合併の前年には、千葉市の大千葉市構想に対抗して五井町と姉崎町が「南葉町」を発足させる計画もあったが中止されている
    kind: fact
    level: E2
    status: established
    sources:
    - l2-ichihara-kyoiku
  - text: 総務省の全国地方公共団体コードで、市原市の団体コードは122190と定められている
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 一郡一市という大きな市
    text: 市原市は、千葉県で最も広い市の一つです。その広さは、旧市原郡のほぼ全域をそのまま市域にしたことに由来します。1963年、五井・姉崎・市原・市津・三和の5町が合併して市原市が発足し、1967年には残りの南総町・加茂村も合併して、郡と市が一対一で重なる「一郡一市」が実現しました。発足の前年には、千葉市が周辺を取り込む「大千葉市」構想への対抗から、五井町と姉崎町が「南葉町」という別の市を作る計画まで浮上しています。幻の南葉町と、郡名をそのまま名乗る市原市。合併の駆け引きの末に選ばれたのが、奈良時代から続く郡の名前でした。
    sources:
    - l2-ichihara-kyoiku
  relations:
  - pref/12
  unknowns:
  - 『万葉集』に見えるという「市原」の歌の特定（巻・歌番号）は、確認できていない
  - 郡名「市原」自体の成立時期や、律令期の市原郡の初出文献は確認できていない
  updated: '2026-11-13'
- id: muni/12-市川市
  code: '122033'
  names:
    ja: 市川市
    reading: いちかわし
    aliases:
    - 市河
    - 市川町
  user_terms:
  - 市川市の名前の由来
  - 市川の語源は一の川か市場か
  - 下総国府はどこにあったのか
  - 真間の手児奈伝説
  naming_type: 中心地名の継承
  formation: 合併新設
  prefecture: 千葉県
  homonyms: []
  summary: 「市川」の語源には、江戸川が東国一の川だったことから「一の川」が訛ったとする説と、河岸に市が開かれていたことに由来する説の2つが有力とされる。1934年の市制施行では、新市名に旧町村名を使わない原則のもとで江東市・総府市など5候補が検討されたが、結局もっとも発展していた市川町の名が採用された。
  first_attestation:
    era: 室町時代
    year_western: null
    document: 『義経記』
    note: 「松戸庄市河」としての初出。作中の出来事は治承4年（1180）の源頼朝の進軍である
  claims:
  - text: 市川の名称の由来には、江戸川が坂東（関東地方の古称）一の大きな川であったことから「一の川」と呼ばれていたとする説と、川船に荷物を積んで集まった人によって開かれた市場の場所であったことに由来するという説があり、市川市は公式にこの2説を紹介している
    kind: fact
    level: E2
    status: contested
    sources:
    - upg-r11-ichikawa-koho
  - text: 市川の地名が初めて登場するのは『義経記』で、石橋山の戦いに敗れ安房で再起した源頼朝が、軍勢を率いて下総の松戸庄市河に達するという記述である
    kind: fact
    level: E5
    status: established
    sources:
    - l2-ichikawa-wikipedia
  - text: 律令制のもとでは、国府台に下総国の国府が置かれ、その東の国分には国分寺・国分尼寺が建立されて、現在の市川市域は下総国の中心地であった
    kind: fact
    level: E2
    status: established
    sources:
    - upg-r11-ichikawa-enkaku
    - upg-r11-ichikawa-kokubunniji
  - text: 真間には、絶世の美女と伝えられる手児奈の伝説があり、『万葉集』にも手児奈を詠んだ歌が収められる。天平9年（737年）に行基が手児奈の哀話を聞き、その霊を弔うために一宇を建てて「求法寺」と名づけたことが、のちの真間山弘法寺の起こりとして伝えられる
    kind: legend
    level: E2
    status: established
    sources:
    - upg-r11-ichikawa-tegona
    - upg-r11-guhouji-nichiren
  - text: 1934年の合併協議では当初、新市名に旧町村名を使用しないことが原則とされ、協議案に「江東市」「東葛市」「下総市」「北総市」「総府市」の5候補が挙がったが、いずれも新興都市の金字塔にはふさわしくないとして退けられた
    kind: fact
    level: E5
    status: established
    sources:
    - l2-ichikawa-wikipedia
  - text: 市名については、「市川」という名前を使いたい市川町と、それに反対する他町村が対立したが、市の名称は「市川」とし、市庁舎は八幡町域に置くことで折り合いがついたと、市川市は説明している
    kind: fact
    level: E2
    status: established
    sources:
    - upg-r11-ichikawa-koho
  - text: 昭和9年（1934）11月3日、市川町・八幡町・中山町・国分村が合併して市川市が発足した。千葉県内では千葉市、銚子市に次いで3番目の市制施行である
    kind: fact
    level: E2
    status: established
    sources:
    - upg-r11-ichikawa-enkaku
  - text: 市川市立図書館は市内の町名の由来をまとめた地域資料として、『市川市の町名』（1987年）や広報連載「市川のまち 地名の由来」などの索引を公開している
    kind: fact
    level: E2
    status: established
    sources:
    - l2-ichikawa-library
  - text: 総務省の全国地方公共団体コードで、市川市の団体コードは122033と定められている
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 消えた候補「総府市」たち
    text: 1934年、市川町・八幡町・中山町・国分村の合併で新市を作る際、名前は難航しました。当初の原則は「旧町村名を使わない」ことで、候補には江東市・東葛市・下総市・北総市・総府市の5つが並びます。しかし市川町はこれらを「田臭味百パーセント」と切り捨てました。総武線の案内表示で「市川」の名は既に人々に馴染んでいること、縦書きでも横書きでも「市川市」と読める語呂の良さを掲げて「市川市」を主張し、最終的に中山町が庁舎の位置などで譲歩して決着しました。下総国府の「総府」を名乗る案があったこと自体、この土地の古さを物語っています。
    sources:
    - l2-ichikawa-wikipedia
  relations:
  - pref/12
  unknowns:
  - 市川市立図書館が公開する『市川市の町名』所収の「市川」の語源説は、スキャンPDFの本文を読み取れなかったため未確認である
  - 語源の2説（一の川説・市場説）について、専門の地名辞典での検証は今後の課題である
  updated: '2026-11-13'
- id: muni/12-御宿町
  code: '124435'
  names:
    ja: 御宿町
    reading: おんじゅくまち
    aliases:
    - 御宿村
  user_terms:
  - おんじゅく
  - 月の沙漠の町
  - 御宿海岸
  - 海女の町
  naming_type: 中心地名の継承
  naming_note: 貴人の「御宿（みやど）」にちなむという伝承を持つ地名の継承
  formation: 合併新設
  prefecture: 千葉県
  homonyms: []
  summary: 外房の海岸の町で、童謡「月の沙漠」の発祥地として知られる。町名「御宿」の由来は、鎌倉時代に北条時頼が最明寺に泊まり「御宿（みやど）」と詠んだ歌にちなむと伝えられるが、同時代の資料では裏付けられていない。1889年に須賀村など4村の合併で御宿村が生まれ、1914年に町制を施行、1955年に布施村・浪花村の一部と合併して現在の町域になった。
  first_attestation:
    era: 鎌倉時代
    year_western: null
    document: null
    note: 北条時頼の歌に「御宿（みやど）」と詠まれたという伝承が最古の用例として語られるが、伝承の域を出ず、同時代資料による地名の確認はできていない
  claims:
  - text: 『日本歴史地名大系』は須賀の最明寺について、暦仁元年（1238年、一説には康元―正嘉年間とも）に北条時頼が諸国巡察の際当寺に泊まり「御宿せしそのときよりと人問はば網代の海と夕影の松」と詠んだとの伝承を受けて最明寺と改めたといい、この伝承は御宿の地名譚として江戸期の創作とされると記している
    kind: legend
    level: E3
    status: indeterminate
    sources:
    - upg-r5-onjuku-taikei-saimyoji
  - text: 明治22年（1889年）の町村制施行に伴い、須賀村・浜村・高山田村・久保村が合併して御宿村が発足した
    kind: fact
    level: E2
    status: established
    sources:
    - upg-r5-onjuku-town-info
    - upg-r5-onjuku-chiba-toshi
  - text: 大正3年（1914年）4月1日、御宿村が町制を施行して御宿町となった
    kind: fact
    level: E2
    status: established
    sources:
    - w12-onjuku-town-plan
  - text: 昭和30年（1955年）3月31日、御宿町は布施村の上布施・実谷・七本地区と浪花村の岩和田地区を合併し、現在の御宿町となった
    kind: fact
    level: E2
    status: established
    sources:
    - w12-onjuku-town-plan
  - text: 慶長14年（1609年）9月30日、スペイン船サン・フランシスコ号が岩和田沖で座礁し、地元の人々が乗組員373人のうち317人の命を救ったと伝えられ、日本・スペイン・メキシコ交流の起点とされる
    kind: fact
    level: E4
    status: established
    sources:
    - w12-onjuku-kankou
  - text: 童謡「月の沙漠」は加藤まさをが大正12年（1923年）に発表した作品で、御宿海岸の砂浜の風景がモデルとされ、町はその発祥の地として知られる
    kind: fact
    level: E4
    status: established
    sources:
    - w12-onjuku-kankou
  - text: 御宿町の地方公共団体コードは124435で、読みは「おんじゅくまち」である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 砂漠のない町の「月の沙漠」
    text: 御宿海岸に立つ記念像は、ラクダに乗った王子とお姫様の姿をしている。童謡「月の沙漠」は抒情画家・加藤まさをが大正12年（1923年）に発表した作品で、その舞台はアラビアの砂漠ではなく、御宿の白い砂浜だったとされる。加藤は大正中期から御宿をたびたび訪れており、月明かりに照らされる砂丘を砂漠に見立てたという。砂漠の名を持つ歌が生まれたのが海辺の漁町であるところに、この町の地名と風景の二重の面白さがある。記念像と月の沙漠記念館は今も海岸のシンボルである。
    sources:
    - w12-onjuku-kankou
  relations:
  - pref/12
  - muni/12-大多喜町
  unknowns:
  - 北条時頼の宿泊と和歌の伝承を裏付ける同時代の資料は確認できず、「御宿」の名が実際にいつから地名として用いられたかは不明
  - 1889年の御宿村発足時に、なぜ「御宿」が村名に選ばれたのかを示す当時の記録は未確認
  - 伝承以外の語源説（宿場・御宿場としての機能に由来する説など）の専門資料による検討は確認できなかった
  updated: '2026-11-13'
- id: muni/12-成田市
  code: '122114'
  names:
    ja: 成田市
    reading: なりたし
    aliases:
    - 成田町
    - 成田村
    - 成田郷
  user_terms:
  - なりた
  - 成田山のある市
  - 成田空港の市
  - 新勝寺の門前町
  naming_type: 中心地名の継承
  formation: 合併新設
  prefecture: 千葉県
  homonyms: []
  summary: 市名は中世以来の地名「成田」を受け継ぐ。成田は下総国埴生郡の成田郷の名で、応永15年（1408年）の仏像の胎内銘が地名の初見と成田市立図書館は紹介する。成田山新勝寺の門前町として発展し、昭和29年（1954年）に成田町など7町村が合併して成田市が発足した。語源は『成田市史』が鳴田説と熟田説を併記し、決着はしていない。
  first_attestation:
    era: 応永15年
    year_western: 1408
    document: 安養寺聖観音菩薩坐像胎内銘「成田郷 応永十五年」
    note: 成田市立図書館「成田のあゆみ」が「成田の地名の初見」として紹介する像内銘。郷名としての使用例の初出であり、銘そのものを直接確認したものではないため二次資料経由の紹介として扱う。
  claims:
  - text: 成田市立図書館の年表は、応永15年（1408年）に成田村安養寺の聖観音菩薩坐像の胎内に「成田郷 応永十五年」の銘が見えることを「成田の地名の初見」として紹介する
    kind: fact
    level: E2
    status: established
    sources:
    - w4-narita-library-history
  - text: 『成田市史 民俗編』は「成田」の語源として、昔から雷鳴が多いので雷の鳴る田の意から鳴田（ナルタ）が成田に転じたという説と、稲のできがよい土地なので熟田（ナリタ）とつけたという説の2説を記している（成田市立図書館のレファレンス回答による紹介）
    kind: fact
    level: E2
    status: contested
    sources:
    - w4-narita-ndl-reference
  - text: 『成田市史 民俗編』の当該項目の著者は、上記2説よりも、田を開発した「田に成る」こと、または生業（なりわい）に由来すると考えたいと記している（成田市立図書館のレファレンス回答による紹介）
    kind: fact
    level: E2
    status: contested
    sources:
    - w4-narita-ndl-reference
  - text: 成田市立図書館の年表によれば、明治22年（1889年）に成田町が発足し、成田は成田山新勝寺の門前町として近世から参詣客で賑わった
    kind: fact
    level: E2
    status: established
    sources:
    - w4-narita-library-history
  - text: 昭和29年（1954年）に成田町・公津村・八生村・中郷村・久住村・豊住村・遠山村の7町村が合併して成田市が誕生した（成田市立図書館の年表）
    kind: fact
    level: E2
    status: established
    sources:
    - w4-narita-library-history
  - text: 昭和53年（1978年）に市内三里塚に成田空港が開港した（成田市立図書館の年表）
    kind: fact
    level: E2
    status: established
    sources:
    - w4-narita-library-history
  - text: 成田市の地方公共団体コードは122114である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 県内にもう一つの「成田」があった
    text: 千葉県内には、かつて成田という名の村がもう一つあった。現在の旭市の一部で、明治22年（1889年）に網戸村・成田村・十日市場村・太田村が合併して旭町が生まれている。こちらの成田村は海上郡に属した村で、下総国埴生郡の成田郷に由来する成田市の「成田」とは無関係の同名地名である。同じ県の中に、空港と門前町で知られる大きな成田と、旭町に吸収されて消えた小さな成田があったことになる。
    sources:
    - w4-asahi-city-yurai-pdf
  relations:
  - pref/12
  - muni/12-旭市
  unknowns:
  - 「成田郷」が『和名類聚抄』などの古代の文献に見えるかどうかは確認できなかった
  - 語源は成田市史でも鳴田説・熟田説・「田に成る」説が併記されたままで決着していない
  - 応永15年の胎内銘は成田市立図書館の年表による紹介であり、銘文そのものを直接確認したものではない
  updated: '2026-11-13'
- id: muni/12-我孫子市
  code: '122220'
  names:
    ja: 我孫子市
    reading: あびこし
    aliases:
    - 我孫子町
    - 安孫子
  user_terms:
  - 我孫子ってどういう意味
  - あびこの由来
  - 難読地名あびこ
  - 手賀沼のまち
  naming_type: 中心地名の継承
  formation: 合併新設
  prefecture: 千葉県
  homonyms: []
  summary: 市名は我孫子町以来の地名「我孫子（あびこ）」を継いだもの。資料上の最古の用例は鎌倉時代末・正和2年（1313年）の譲状の「あひこのむら」と市公式は説明する。古代には「我孫子」は氏（うじ）や姓の名であり、大和政権が直轄地やその住民にこの名を付けたことが地名の起こりと考えられている。1955年の合併を経て1970年に市制を施行した。
  first_attestation:
    era: 正和2年
    year_western: 1313
    document: 尼しんねん譲状
    note: 我孫子市公式が市域を指す「アビコ」の資料的に最古のものとする（「しもつさのくにあひこのむら」とある）。文書そのものの直接確認は未了のため市公式経由で記録する
  claims:
  - text: 我孫子市公式によれば、市域をさす「アビコ」として資料的に最古のものは、鎌倉時代末の正和2年（1313年）の「尼しんねん譲状」に「しもつさのくにあひこのむら」（下総国我孫子村）とあるものである
    kind: fact
    level: E2
    status: established
    sources:
    - m5-abiko-city-chisei
  - text: 同公式によれば、奈良・平安時代の公式文書では市域周辺は「下総国相馬郡」と呼ばれていて、我孫子という地名は確認されていない
    kind: fact
    level: E2
    status: established
    sources:
    - m5-abiko-city-chisei
  - text: 古代において「我孫子」は氏（ウジ）や姓（カバネ）にかかわる名で人名として使われており、「阿毘古」「我孫公」という人の記録が残されている（我孫子市公式）
    kind: fact
    level: E2
    status: established
    sources:
    - m5-abiko-city-chisei
  - text: 大王や大和地方の有力豪族が地方豪族を支配下に置く際、豊かな土地を直轄地とし、土地やそこに住む人々に「我孫子」という名前を付けたと考えられ、全国各地に「我孫子」「安孫子」「吾孫子」の地名や人名が認められる（我孫子市公式）
    kind: fact
    level: E2
    status: established
    sources:
    - m5-abiko-city-chisei
  - text: 市内には4世紀後半の前方後円墳・水神山古墳（全長69メートル、千葉県北西部地区最大）があり、古墳時代の早い時期から大和政権とつながった人物がいたと考えられる（我孫子市公式）
    kind: fact
    level: E2
    status: established
    sources:
    - m5-abiko-city-chisei
  - text: 1955年（昭和30年）4月に我孫子町・布佐町・湖北村が合併して我孫子町となり、1970年（昭和45年）7月に市制を施行した（我孫子市公式。地方公共団体コードは122220）
    kind: fact
    level: E2
    status: established
    sources:
    - m5-abiko-city-chisei
    - k1-jlis-chiba
  - text: 市制施行日は1970年7月1日である
    kind: fact
    level: E4
    status: established
    sources:
    - m5-uub-chiba-cities
  column:
    title: 人の名が土地の名になった
    text: 「あびこ」は難読地名として知られるが、その正体は地名である前に人の名だった。古代、「我孫子」は氏や姓として人名に使われ、大和政権が直轄地とした土地と住民にこの名を付けたと考えられている。だから我孫子・安孫子・吾孫子の名は全国に散らばっている。1313年の譲状に「あひこのむら」と現れるこの土地の名も、その広がりの一つである。
    sources:
    - m5-abiko-city-chisei
  relations:
  - pref/12
  unknowns:
  - 「我孫子」の名がこの土地に付けられた具体的な経緯は市公式も推測の形で述べており、確定資料はない
  - 正和2年の「尼しんねん譲状」原文の直接確認は未了
  updated: '2026-11-13'
- id: muni/12-旭市
  code: '122157'
  names:
    ja: 旭市
    reading: あさひし
    aliases:
    - 旭町
    - 網戸村
  user_terms:
  - あさひ
  - 千葉の旭
  - 干潟八万石のある市
  naming_type: 新規命名
  formation: 合併新設
  prefecture: 千葉県
  homonyms: []
  summary: 「旭」は明治22年（1889年）に網戸村など4村の合併で旭町が発足した際の新名で、旭市は、木曽義昌の旧跡を訪れた国学者野々口隆正の歌「信濃より いづる旭を…」を由来として説明する。旧旭市は昭和29年（1954年）に市制を施行し、平成17年（2005年）に海上町・飯岡町・干潟町と合併して現在の旭市になった。昭和45年（1970年）に愛知県旭町が市制を施行する際、この旭市との同名を避けて「尾張旭市」と改称している。
  first_attestation:
    era: 明治22年
    year_western: 1889
    document: 旭町の成立（町村制施行時の合併命名、旭市公式資料）
    note: 自治体名「旭」の初出。合併前の中心地・網戸の名は、戦国期に木曽義昌が拠った地としてそれ以前から見える。
  claims:
  - text: 旭市公式資料によれば、明治22年（1889年）4月1日に網戸村・成田村・十日市場村・太田村が合併して旭町となった
    kind: fact
    level: E2
    status: established
    sources:
    - w4-asahi-city-yurai-pdf
  - text: 旭市は「旭の由来」として、国学者の野々口隆正が嘉永5年（1852年）に木曽義昌の旧跡を訪れて詠んだ歌「信濃より いづる旭をしたひ来て 東のくにに 跡とどめけむ」を挙げ、これを由来に明治22年（1889年）に旭という地名が誕生したと説明する
    kind: fact
    level: E2
    status: established
    sources:
    - w4-asahi-city-yurai-pdf
  - text: 旭市の人物誌『あさひ 輝いた人々』は、この歌が「旭市の地名の由来とも言われている」と留保付きで紹介しており、歌の背景には、信濃の木曽氏（木曽義仲の子孫とされる木曽義昌）が東国に移って網戸の地に跡をとどめたという物語がある
    kind: legend
    level: E2
    status: indeterminate
    sources:
    - w4-asahi-city-shishi-pdf
  - text: 昭和29年（1954年）に旭町は矢指村・富浦村・豊畑村・共和村などと合併したうえで市制を施行し、旧旭市が発足した（旭市公式資料の廃置分合の記録）
    kind: fact
    level: E2
    status: established
    sources:
    - w4-asahi-city-yurai-pdf
    - w4-asahi-city-shishi-pdf
  - text: 平成17年（2005年）7月1日に旭市・海上町・飯岡町・干潟町が合併して新しい旭市が誕生した
    kind: fact
    level: E2
    status: established
    sources:
    - w4-asahi-city-shishi-pdf
  - text: 昭和45年（1970年）に愛知県の旭町が市制を施行する際、そのまま「旭市」とすると千葉県旭市と同名になるため、同名回避のために旧国名の「尾張」を冠して「尾張旭市」となったと記録される
    kind: fact
    level: E5
    status: established
    sources:
    - v5-owariasahi-wiki
  - text: 旭市の市の花ツバキは、干潟八万石がかつて「椿の海」と呼ばれたことにちなむと市は説明する
    kind: fact
    level: E2
    status: established
    sources:
    - w4-asahi-city-yurai-pdf
  - text: 旭市の地方公共団体コードは122157である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 千葉の市名が、愛知の市の名前を変えた
    text: 1970年、愛知県の旭町が市制を施行するとき、そのままでは「旭市」となって千葉県の旭市と同名になってしまう。そこで旧国名の「尾張」を頭に付けて「尾張旭市」が誕生した。千葉の旭市から見れば、自分たちの市名が、遠く離れた愛知県の新しい市の名前の形を決めたことになる。同名回避のために改名した側の事情は尾張旭市のレコードに詳しいが、その「相手」はこの旭市である。
    sources:
    - v5-owariasahi-wiki
    - w4-asahi-city-yurai-pdf
  relations:
  - pref/12
  - muni/23-尾張旭市
  - muni/12-成田市
  unknowns:
  - 明治22年の旭町命名に際して野々口隆正の歌が実際に参照されたことを示す当時の公文書は確認できておらず、歌と命名を結ぶ説明は市の公式資料の紹介による
  - 合併前の網戸・十日市場・太田などの個別の地名の語源は未調査である
  updated: '2026-11-13'
- id: muni/12-木更津市
  code: '122068'
  names:
    ja: 木更津市
    reading: きさらづし
    aliases:
    - 木佐良津
    - 木更津町
    - 木更津県
  user_terms:
  - 木更津ってどういう意味
  - 君さらずのまち
  - きさらづの由来
  - 証城寺の狸ばやしのまち
  naming_type: 中心地名の継承
  formation: 合併新設
  prefecture: 千葉県
  homonyms: []
  summary: 市名は中世以来の港町の名「木更津」を継いだもの。語源は日本武尊と弟橘媛の「君さらず」伝説に結びつける説が通説として紹介されるが、「如月の津」「木足らず」などの諸説もあり確定していない。「きさらづ」の古い用例は1273年の文書の「きさらす」にさかのぼる。1942年に木更津町など4町村が合併して市制を施行した。
  first_attestation:
    era: 文永10年
    year_western: 1273
    document: 奉納願文（胎内文書）
    note: 『日本歴史地名大系』によれば、文永10年（1273年）の奉納願文に「きさらすの女房」と見えるのが古い用例で、「木更津」の表記は文和2年（1353年）の『仏像伽藍記』（藻原寺文書）、「木佐良津」の表記は応永17年（1410年）の梵鐘銘に見える。木更津市教育委員会の資料も「『きさらづ』の名が文献に現れてきたのは鎌倉時代に入ってから」とする
  claims:
  - text: 木更津市教育委員会の資料は、「きさらづ」の名が文献に現れてきたのは鎌倉時代に入ってからであると記す
    kind: fact
    level: E2
    status: established
    sources:
    - m5-kisarazu-city-edu
  - text: 『日本歴史地名大系』は、「きさらづ」の古い用例として、文永10年（1273年）の奉納願文（胎内文書）に見える「きさらすの女房」、文和2年（1353年）の『仏像伽藍記』（藻原寺文書）に「木更津」より御衣木が到来したとある記事、応永17年（1410年）の梵鐘銘に記された「木佐良津」を挙げる
    kind: fact
    level: E3
    status: established
    sources:
    - upg-r9-kisarazu-kotobank
  - text: 語源については「君不去（きみさらず）」が元になったという説が通説とされる一方、「如月の津」が転じたとする説や「木足らず」が訛ったとする説もあり、定説は確定していない
    kind: fact
    level: E5
    status: contested
    sources:
    - m5-kisarazu-wikipedia
  - text: 日本武尊が相模の走水から上総へ渡ろうとした際、妃の弟橘媛が海神を鎮めるために海に身を投じ、尊がこの地を去りがたく思ったことから「君さらず」と呼ばれたという伝説が、木更津市教育委員会の資料に記される
    kind: legend
    level: E2
    status: established
    sources:
    - m5-kisarazu-city-edu
  - text: 木更津市の中心市街地活性化基本計画は、「きさらづ」の語源は日本武尊と弟橘媛の悲話の「きみさらず伝説」にあるという説があると紹介する
    kind: fact
    level: E2
    status: established
    sources:
    - m5-kisarazu-city-plan
  - text: 1871年（明治4年）に木更津県が誕生し、木更津はその県庁所在地となった（木更津市公式）
    kind: fact
    level: E2
    status: established
    sources:
    - m5-kisarazu-city-history
  - text: 1942年（昭和17年）11月3日、木更津町・巖根村・清川村・波岡村が合併して市制を施行し、木更津市が発足した（地方公共団体コードは122068）
    kind: fact
    level: E2
    status: established
    sources:
    - m5-kisarazu-city-edu
    - m5-uub-chiba-cities
    - k1-jlis-chiba
  column:
    title: 県名になった港町
    text: 木更津は一度だけ「県の名前」になったことがある。明治4年（1871年）に木更津県が置かれ、その県庁所在地となった。しかし明治6年（1873年）に印旛県と合併して千葉県ができると、木更津県は姿を消した。いま千葉県の中央部に残る「木更津」の名は、県名の座を譲った港町の名である。
    sources:
    - m5-kisarazu-city-history
    - m5-kisarazu-wikipedia
  relations:
  - pref/12
  unknowns:
  - 語源の確定には至らず、「君さらず」説は伝説の域を出ないとされる
  updated: '2026-11-13'
- id: muni/12-東庄町
  code: '123498'
  names:
    ja: 東庄町
    reading: とうのしょうまち
    aliases:
    - 橘庄
    - 立花郷
    - 東荘
  user_terms:
  - 東庄
  - とうのしょう
  - 笹川
  - 利根川沿いの町
  naming_type: 旧行政区画名の継承
  naming_note: 中世の荘園名「東庄」を継承した命名
  formation: 合併新設
  prefecture: 千葉県
  homonyms: []
  summary: 利根川下流南岸の町。町名は中世の荘園「東庄」に由来し、町公式は「昔この地域が東氏（とうし）の荘園であったことが由来」と説明する。東庄はもと橘庄（立花郷）と呼ばれ、千葉氏一族の東氏が治める33郷の中心だった。現在の町は1955年に笹川町など1町3村の合併で成立し、その際に古い荘園名が町名として復活した。
  first_attestation:
    era: 正和2年
    year_western: 1313
    document: 関東下知状案（円福寺文書）
    note: 『日本歴史地名大系』が紹介する記載で「橘庄 号東庄」と見える。原文未確認のため、主張側では紹介として扱う
  claims:
  - text: 町公式サイトは、町名の由来について「昔この地域が東氏（とうし）の荘園であったことが由来です」と説明している
    kind: fact
    level: E2
    status: established
    sources:
    - w12-tohnosho-town-gaiyo
  - text: 『日本歴史地名大系』は、東庄は立花郷・橘庄の後身と考えられるとし、正和2年（1313年）4月25日の関東下知状案（円福寺文書）に「橘庄 号東庄」と見えることから、橘庄が東庄と改められたことが知られると記す
    kind: fact
    level: E3
    status: established
    sources:
    - w12-tohnosho-kotobank-taikei
  - text: 12世紀半ば頃から見える国衙領の立花郷はのちに東庄とも称され、千葉氏の支流・東氏の根本所領となった
    kind: fact
    level: E3
    status: established
    sources:
    - w12-tohnosho-kotobank-taikei-machi
  - text: 東庄の地頭で庄名を名字とした東氏本宗家の祖・胤頼は千葉常胤の六男で、香取郡東庄33郷を与えられたという
    kind: fact
    level: E3
    status: established
    sources:
    - w12-tohnosho-kotobank-taikei
  - text: 昭和30年（1955年）7月20日、笹川町・神代村・橘村・東城村の1町3村が合併して東庄町が誕生した
    kind: fact
    level: E2
    status: established
    sources:
    - w12-tohnosho-town-gaiyo
  - text: 現在の町名は、合併の際に新しく作られた名ではなく、中世以来この一帯を指した荘園名「東庄」をそのまま継いだものである
    kind: fact
    level: E2
    status: established
    sources:
    - w12-tohnosho-town-gaiyo
    - w12-tohnosho-kotobank-taikei
  - text: 東庄町の地方公共団体コードは123498で、読みは「とうのしょうまち」である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 荘園の名が名字になり、町名になった
    text: 東庄の名の歩みは少し変わっている。もとの名は橘庄（立花郷）。千葉常胤の六男・胤頼がこの荘園を与えられ、庄名をそのまま名字として「東氏」を名乗った。つまり東庄という地名が、東という武家の一族の姓を生んだのである。東氏は東庄33郷を治め、宮本の東大神はその惣鎮守とされた。やがて荘園の名は歴史の中に埋もれたが、1955年の合併で1町3村が新しい町の名を探したとき、選ばれたのは中世の荘園名「東庄」だった。消えたはずの名前が、名字を経由して700年後に自治体の名として戻ってきたことになる。
    sources:
    - w12-tohnosho-kotobank-taikei
    - w12-tohnosho-town-gaiyo
  relations:
  - pref/12
  - muni/12-神崎町
  unknowns:
  - 立花郷（橘庄）が「東庄」と改められた正確な時期と理由（1313年の文書で改称が知られるが、それ以前の経緯は未確認）
  - 「東庄」の「東」が何に対する東なのか（香取神宮・郡・川などとの位置関係）は、専門資料でも特定できなかった
  - 1955年の合併時に町名として「東庄」を選んだ協議の具体的な記録は未確認
  updated: '2026-11-13'
- id: muni/12-東金市
  code: '122131'
  names:
    ja: 東金市
    reading: とうがねし
    aliases:
    - 東金町
    - 辺田方
    - 岡山
  user_terms:
  - 東金ってどういう意味
  - とうがねの由来
  - 東金城のまち
  - 上総の黄金町
  naming_type: 中心地名の継承
  formation: 編入合併
  prefecture: 千葉県
  homonyms: []
  summary: 市名は東金町以来の地名「東金」を継いだもの。その名は中世の城名「鴇カ峰・鴇ヶ根（ときがね）」の転化によるといわれ、町の古称には岡山・辺田方がある。1953年に東金町と5村が合併し、翌1954年に源村・福岡村の各一部を編入して市制を施行した。
  first_attestation:
    era: 文禄3年
    year_western: 1594
    document: 上総国村高帳
    note: 『日本歴史地名大系』が「東金町」の名の文書上の早い例として挙げるもの。地名そのものは中世の城名「鴇ヶ根（ときがね）」に由来するとされる
  claims:
  - text: 『日本大百科全書』によれば、東金の地名は中世に築かれた千葉氏の城名「鴇カ峰・鴇ヶ根（ときがね）」の転化によるといわれる
    kind: fact
    level: E3
    status: established
    sources:
    - m5-togane-kotobank
  - text: 『東金町誌』に基づく伝承として、最福寺境内の山嶺が鴇（とき）の頭に似ていることから鴇ヶ峯と称され、「トウガネ」に転訛して東金と言うようになったと伝えられる
    kind: legend
    level: E5
    status: established
    sources:
    - m5-togane-wikipedia
  - text: 町の古称については諸説があり、『日本歴史地名大系』は古くは岡山（古代の山辺郡岡山郷の遺称地とする説）と称し、また辺田方ともいったとし、大永期に酒井氏が東金城に居城してから東金町と称したという説（『上総国誌』）と、慶長19年に東金御殿が造営されてから東金町としたという所伝を併記する
    kind: fact
    level: E3
    status: contested
    sources:
    - m5-togane-kotobank-machi
  - text: 東金市公式によれば、東金城は東金酒井氏の本城として天正18年（1590年）まで機能し、本城の初見は『鎌倉大草紙』にみえる享徳の乱初期の東常縁の家臣・浜春利が拠ったとする記事である
    kind: fact
    level: E2
    status: established
    sources:
    - m5-togane-city-castle
  - text: 1953年（昭和28年）に東金町と公平・丘山・大和・正気・豊成の5村が合併し、翌1954年に源村・福岡村の各一部を編入して市制を施行し、東金市となった（日本大百科全書。地方公共団体コードは122131）
    kind: fact
    level: E3
    status: established
    sources:
    - m5-togane-kotobank
    - k1-jlis-chiba
  - text: 江戸時代の東金は、徳川家康の鷹狩りのための東金御殿と船橋までを結ぶ御成街道が整備され、九十九里の海産物が集まる問屋町として発展し、「上総の黄金町」とうたわれた
    kind: fact
    level: E4
    status: established
    sources:
    - m5-togane-kanko
  column:
    title: 鴇の頭の山と城の名
    text: 東金の名の出発点は、城のあった山の名「鴇ヶ根（ときがね）」とされる。その山嶺が鴇（とき）の頭に似ていたことから名づいたという伝えが残る。城は鴇ヶ嶺城・東鐘城・鴇ヶ根城と呼ばれたのち東金城となり、戦国期には酒井氏が5代にわたって治めた。城下の町の名も「ときがね」の音を残して「とうがね」となった。
    sources:
    - m5-togane-kotobank
    - m5-togane-wikipedia
    - m5-togane-kanko
  relations:
  - pref/12
  unknowns:
  - 「東金町」と称し始めた時期については大永期説と慶長19年説が併存し、確定していない
  - 『東金町誌』そのものの直接確認は未了（Wikipedia経由の紹介として記録）
  - 語源の「鴇ヶ根」は城名の転化とする辞典の説明があるが、山の名自体の由来は伝承の域を出ない
  updated: '2026-11-13'
- id: muni/12-松戸市
  code: '122076'
  names:
    ja: 松戸市
    reading: まつどし
    aliases:
    - 松里
    - 馬津
    - 松戸町
    - 松戸宿
  user_terms:
  - 松戸市の名前の由来
  - 松戸はなぜ松戸というのか
  - 更級日記のまつさとの渡り
  - 松戸宿と水戸街道
  naming_type: 中心地名の継承
  formation: 合併新設
  prefecture: 千葉県
  homonyms: []
  summary: 松戸は太日川（現在の江戸川）の渡し場の集落として生まれた地名と考えられる。市の公式説明では、渡し場を意味する「馬津（うまつ）」「馬津郷（うまつさと）」が「まつさと」を経て「まつど」になったという説を紹介する。平安時代の『更級日記』の「まつさとの渡り」が最古級の用例とされる。
  first_attestation:
    era: 平安時代（11世紀中頃）
    year_western: null
    document: 『更級日記』
    note: 「まつさとの渡り（松里の渡しの津）」と記され、現在の松戸を指す最古級の用例と考えられている
  claims:
  - text: 松戸市の公式サイトは地名の由来の一つとして、この地域が太日川（現在の江戸川）の津（渡し場）でもあったことから「馬津（うまつ）」とか「馬津郷（うまつさと）」と呼ばれており、それが「まつさと」になり、やがて「まつど」になったという説を紹介している
    kind: fact
    level: E2
    status: contested
    sources:
    - l2-matsudo-yurai
  - text: 松戸神社の伝承では、東国を巡ったヤマトタケルが従者とこの地で待ち合わせ、そこに祠を祀ったという故事から「待つ里」「まつど」「松戸」と称されたとも伝えられる
    kind: legend
    level: E4
    status: established
    sources:
    - l2-matsudo-taiyo
  - text: 松戸市デジタルミュージアムは、平安時代に書かれた『更級日記』に描かれた「まつさとのわたりのつ」が、松戸の地名の起こりかともいわれると紹介している
    kind: fact
    level: E2
    status: established
    sources:
    - l2-matsudo-museum
  - text: 江戸時代には松戸・小金・馬橋が水戸街道の宿場町となり、明治11年（1878）には東葛飾郡役所が松戸に置かれた
    kind: fact
    level: E2
    status: established
    sources:
    - l2-matsudo-nenpyo
  - text: 昭和18年（1943）、松戸町・高木村・馬橋村が合併し、県下7番目の市として松戸市が誕生した
    kind: fact
    level: E2
    status: established
    sources:
    - l2-matsudo-nenpyo
  - text: 総務省の全国地方公共団体コードで、松戸市の団体コードは122076と定められている
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 旅日記に残った渡し場
    text: 『更級日記』の作者・菅原孝標女は、少女時代を父の下総国司としての任国で過ごし、寛仁4年（1020）頃に帰京の旅へ出ました。その旅の記録に「まつさとの渡り」という渡し場が現れます。太日川（今の江戸川）の浅瀬を人や馬が渡る津が、松戸という地名の出発点だったと考えられています。川を渡る場所には人が集まり、やがて宿場ができ、松戸は水戸街道の宿場町として江戸と水戸を結ぶ要所になりました。平安の旅日記に一行だけ残る渡し場の名が、今も50万人都市の名前として生きています。
    sources:
    - l2-matsudo-museum
    - l2-matsudo-yurai
  relations:
  - pref/12
  unknowns:
  - 市公式も「諸説あります」とするとおり、馬津説が定説かどうかは専門の地名辞典では確認できていない
  - 『更級日記』の「まつさと」が現松戸市域の渡しを指すことは比定に基づくもので、確定はしていない
  updated: '2026-11-13'
