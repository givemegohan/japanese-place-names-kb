  - text: 喬木村の地方公共団体コードは204153である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 『詩経』から来た村名
    text: 『詩経』の「伐木」は鳥の群れの歌である。「伐木丁丁、鳥鳴嚶々、出自幽谷、遷于喬木」（木を伐る音が響き、鳥は仲良く鳴く。深い谷を出て、高い木へと移る）。1875年の合併で生まれた新しい村は、この「幽谷を出て喬木に移る」という一節から名を取った。山あいの村々が寄り集まって一歩上に移る――新村の抱負を漢籍の句に託した命名は、明治の村名の中でもとりわけ文学的なものの一つである。
