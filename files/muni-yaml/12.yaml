  - 柏はなぜ柏というのか
  - 東葛市だった柏市
  - 柏駅のまち
  naming_type: 中心地名の継承
  formation: 合併新設
  prefecture: 千葉県
  homonyms: []
  summary: 市名は2段階で決まった。昭和29年（1954年）9月の合併では、構成町村の名を避けて「東葛市」と命名されたが、旧小金町の分離を契機に名称への疑問が広がり、市民の要望に応えて同年11月15日、中心地として定着していた「柏」の名に改称された。「柏」は江戸時代の柏村に遡る地名だが、その語源は市の公式資料では説明されていない。
  first_attestation:
    era: 江戸時代
    year_western: null
    document: 柏村（水戸街道沿いの村）
    note: 市名の直接の由来である柏町は大正15年（1926年）に千代田村が町制を施行して成立した。「柏」という地名自体はそれ以前の柏村に遡るが、初出の文献と語源は確認できなかった
  claims:
  - text: 江戸時代の柏村は、明治22年（1889年）の町村制施行で新たに設けられた千代田村の一部となった
    kind: fact
    level: E2
    status: established
    sources:
    - k1-kashiwa-shisei
  - text: 明治29年（1896年）に鉄道（現在のJR常磐線）が敷設されて柏駅が開業すると、柏駅を中心に市街地が形成され始めた
    kind: fact
    level: E2
    status: established
    sources:
    - k1-kashiwa-shisei
  - text: 大正15年（1926年）に千代田村は町制を施行し、「柏町」となった
    kind: fact
    level: E2
    status: established
    sources:
    - k1-kashiwa-shisei
  - text: 昭和29年（1954年）9月1日、柏町・小金町・田中村・土村の4町村が合併して東葛市が発足した。市名は、四か町村の名称を受け継ぐことが市民の融和の妨げになると予想されたため、この地区が東葛飾郡の中央部に位置することにちなんで「東葛市」と決定された
    kind: fact
    level: E2
    status: established
    sources:
    - k1-kashiwa-tokatsu
  - text: 同年10月15日に旧小金町の大部分が松戸市へ編入され、11月1日には富勢村の一部が東葛市に編入された
    kind: fact
    level: E2
    status: established
    sources:
    - k1-kashiwa-tokatsu
    - k1-kashiwa-rekishi
  - text: 旧小金町の分離を契機に住民の間から東葛市という名称に疑問がつけられ、当時の市の広報は「市民の要望に応え市の名称を柏市と変更」と伝えた。昭和29年（1954年）11月15日、市の名称変更に関する条例により、東葛市は柏市に改称された
    kind: fact
    level: E2
    status: established
    sources:
    - k1-kashiwa-tokatsu
  - text: 柏市は、柏駅の設置とともに交通の要衝として市街地が形成される中で、「柏」という名前はもはや旧村名ではなく、新市にふさわしい名称として周囲から認められる存在になっていたと説明している
    kind: fact
    level: E2
    status: established
    sources:
    - k1-kashiwa-tokatsu
  - text: 総務省の全国地方公共団体コードで、柏市のコードは122173と定められている（J-LISの千葉県内市町村一覧による）
    kind: fact
    level: E2
    status: established
    sources:
    - k1-jlis-chiba
  column:
    title: 75日だけ存在した市「東葛市」
    text: 柏市の前身「東葛市」が存在したのは、昭和29年（1954年）9月1日から11月15日までの約75日間にすぎない。融和を考えて付けたはずの新市名は、合併の枠組みが崩れた（小金町の大半が松戸市へ移った）途端に存在意義を問われ、住民の要望で中心地の旧名「柏」に取って代わられた。市の名前がこれほど短期間で覆る例は珍しく、東葛市の役所看板の写真が市の公式サイトに残されている。現在の「東葛」という言葉は、高校名（県立東葛飾高校）などに生き続けている。
    sources:
    - k1-kashiwa-tokatsu
  relations:
  - pref/12
  unknowns:
  - 「柏」という地名自体の語源（柏の木に因む説など）は、参照した市の公式資料では説明されておらず、専門文献での確認が今後の課題
  - 柏村の初出文献は未確認
  updated: '2026-11-13'
- id: muni/12-栄町
  code: '123293'
  names:
    ja: 栄町
    reading: さかえまち
    aliases:
    - 安食町
    - 布鎌村
    - 境村
  user_terms:
  - さかえ
  - 栄
  - 安食（あじき）
  - 龍角寺の町
  - 房総のむら
  naming_type: 合成地名
  naming_note: 1955年の新設合併による新名。旧町名・旧村名の合成ではない
  formation: 合併新設
  prefecture: 千葉県
  homonyms: []
  summary: 印旛郡の町で、利根川と印旛沼にはさまれた水と緑の町。現在の町は1955年12月1日に安食町と布鎌村が合併して生まれたもので、町名の「栄」はどちらの旧名からも取られていない新名である。旧中心の「安食（あじき）」の名は今も大字や駅名に残る。基礎自治体としての「栄町」は全国でこの町のみとされる。
  first_attestation:
    era: 昭和30年
    year_western: 1955
    document: null
    note: 合併による新町名のため、「栄町」の名の初出は1955年12月1日の栄町発足そのもの
  claims:
  - text: 明治22年（1889年）、安食村・北辺田村・龍角寺村・酒直村・矢口村・須賀村・麻生村の7村と安食ト杭新田飛地が合併して境村となり、同年に布鎌村も成立した
    kind: fact
    level: E2
    status: established
    sources:
    - w12-sakae-town-plan
  - text: 境村は明治25年（1892年）に安食町と改称した
    kind: fact
    level: E2
    status: established
    sources:
    - w12-sakae-town-plan
  - text: 昭和30年（1955年）12月1日、安食町と布鎌村が合併して栄町が誕生した
    kind: fact
    level: E2
    status: established
    sources:
    - w12-sakae-town-toshi
  - text: 新しい町名「栄町」は、合併した安食町・布鎌村のどちらの名の一部でもない、まったく新たに選ばれた名である
    kind: fact
    level: E2
    status: established
    sources:
    - w12-sakae-town-toshi
  - text: 基礎自治体（町）としての「栄町」は千葉県の当町のみであり、総務省「地方公共団体コード一覧」に自治体名「栄町」として記載されているのは当町だけである
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  - text: 旧中心地名の「安食（あじき）」は、現在も栄町の大字やJR成田線・安食駅の名として残っている
    kind: fact
    level: E2
    status: established
    sources:
    - w12-sakae-town-toshi
  - text: 町内の古刹・龍角寺には、和銅2年（709年）に龍女が現れて一夜のうちに諸堂を建立したという寺伝があり、もとは「龍閣寺」と称したが、干ばつを救った龍の頭を葬ってからは「龍角寺」に改められたと伝えられる
    kind: legend
    level: E2
    status: established
    sources:
    - w12-sakae-town-guide
  - text: 栄町の地方公共団体コードは123293である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 龍の頭が眠る寺と、町の龍のキャラクター
    text: 栄町の東部、龍角寺台の丘陵に龍角寺古墳群と古刹・龍角寺がある。寺伝では、和銅2年（709年）に龍女が現れて一夜のうちに諸堂を建立し、干ばつのときに人々を救った龍の頭が葬られてから「龍角寺」と改められたという。町はこの龍の伝承を現代にも受け継ぎ、イメージキャラクターは龍の子「龍夢（ドラム）」――「ドラゴン」のドラと「夢」のムを合わせ、「町民に夢や未来を与える」という願いを込めた名である。1955年に生まれた新しい町名「栄」の傍らで、千年を超える龍の物語が町の顔になっているのは対照的で面白い。
    sources:
    - w12-sakae-town-guide
  relations:
  - pref/12
  - muni/12-酒々井町
  unknowns:
  - 「栄」の字が選ばれた理由（「町が栄えるように」という願いと一般に説明されるが、町公式資料でその表現は確認できなかった）と、公募など選定手続きの有無
  - 旧名「安食（あじき）」自体の語源（安食の「あじき」が何に由来するか）は専門資料で確認できなかった
  - 1892年に境村が安食町へ改称した際の経緯（なぜ「境」でなく「安食」だったか）
  updated: '2026-11-13'
- id: muni/12-横芝光町
  code: '124109'
  names:
    ja: 横芝光町
    reading: よこしばひかりまち
    aliases:
    - 横芝町
    - 光町
    - 横芝村
    - 旭村
  user_terms:
  - 横芝光
  - よこしばひかり
  - 横芝
  - 光（ひかり）
  - 九十九里の町
  naming_type: 合成地名
  naming_note: 旧横芝町と旧光町の名を連ねた合成名
  formation: 合併新設
  prefecture: 千葉県
  homonyms: []
  summary: 九十九里平野のほぼ中央にある町。2006年3月27日に山武郡横芝町と匝瑳郡光町が合併して生まれ、町名は両町の名を連ねた合成名である。合併前の2町は上総国と下総国という別の令制国に属していた。「横芝」は近世以来の集落名、「光」は1954年の4村合併で生まれた町名だが、どちらの名の由来も公式・専門資料では確認できていない。
  first_attestation:
    era: 平成18年
    year_western: 2006
    document: null
    note: 合併による新町名のため、「横芝光町」の初出は2006年3月27日の発足そのもの。要素の「横芝」は1889年に旭村へ合併された近世の横芝村に遡る地名
  claims:
  - text: 平成18年（2006年）3月27日、山武郡横芝町と匝瑳郡光町が合併して横芝光町が誕生した
    kind: fact
    level: E2
    status: established
    sources:
    - w12-yokoshiba-town-20th
  - text: 町名「横芝光」は、合併した横芝町と光町の名をそのまま連ねた合成名である
    kind: fact
    level: E2
    status: established
    sources:
    - w12-yokoshiba-town-20th
  - text: 合併前の横芝町は上総国・山武郡に、光町は下総国・匝瑳郡に属しており、令制国も郡も異なる2町の合併であった
    kind: fact
    level: E3
    status: established
    sources:
    - upg-r5-yokoshiba-taikei-yokoshiba
    - upg-r5-yokoshiba-kokudo
  - text: この合併により、光町の属していた匝瑳郡は消滅した
    kind: fact
    level: E4
    status: established
    sources:
    - upg-r5-yokoshiba-kokudo
  - text: 旧横芝町側では、明治22年（1889年）に旭村・大総村・上堺村が発足し、旭村はのちに横芝村となり、昭和30年（1955年）2月に3町村が合併して横芝町が誕生した
    kind: fact
    level: E2
    status: established
    sources:
    - w12-yokoshiba-town-20th
  - text: 旧光町側では、明治22年（1889年）に日吉村・南条村・東陽村・白浜村が発足し、昭和29年（1954年）5月にこの4村が合併して光町が誕生した
    kind: fact
    level: E2
    status: established
    sources:
    - w12-yokoshiba-town-20th
  - text: 横芝光町の地方公共団体コードは124109で、読みは「よこしばひかりまち」である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
    - w12-yokoshiba-hikari-city
  column:
    title: 上総と下総、二つの国の合併
    text: 横芝光町の合併は、単なる隣町同士の合併ではなかった。横芝町は上総国、光町は下総国――令制の時代なら「国境」をまたぐ合併であり、郡も山武郡と匝瑳郡で別々だった。しかも光側はもともと日吉村が香取郡から匝瑳郡へ移るなど、境界の組み替えを重ねてきた地域である。2006年の合併で匝瑳郡は千葉県から姿を消した。二つの町の名をそのままつないだ「横芝光」という名は、どちらか一方に吸収されない対等合併の証しとして読むことができる。
    sources:
    - w12-yokoshiba-wiki
    - w12-yokoshiba-town-20th
  relations:
  - pref/12
  - muni/12-芝山町
  unknowns:
  - 「横芝」という地名の語源（近世の横芝村に遡ることは分かるが、名の由来は町公式・専門資料で確認できなかった）
  - 1954年の光町発足時に「光」の名が選ばれた理由と経緯（公募・協議の記録は未確認）
  - 2006年の新町名「横芝光」の最終決定手続き（合併協議会での公募の有無など）の詳細は未確認
  updated: '2026-11-13'
- id: muni/12-流山市
  code: '122203'
  names:
    ja: 流山市
    reading: ながれやまし
    aliases:
    - 流山町
  user_terms:
  - 流山ってどういう意味
  - ながれやまの由来
  - みりんのまち
  - 赤城山伝説のまち
  naming_type: 中心地名の継承
  formation: 単独発足
  prefecture: 千葉県
  homonyms: []
  summary: 市名は流山町以来の地名「流山」を継いだもの。「流山」の記録上の初出は慶長19年（1614年）の文書とされ、由来ははっきりしない。市内の赤城山には上州赤城山の一部が流れ着いたという伝説が残る。1967年に流山町が市制を施行して流山市となった。
  first_attestation:
    era: 慶長19年
    year_western: 1614
    document: 小金之領野馬売付之帳
    note: 流山市公式資料が「流山」の地名の記録上最初の確認とするもの（「流山喜左衛門尉」とある）。文書そのものの直接確認は未了のため市公式資料経由で記録する
  claims:
  - text: 流山市公式資料によれば、「流山」の地名が記録上確認されるのは慶長19年（1614年）の「小金之領野馬売付之帳」に「流山喜左衛門尉」とあるのが最初である
    kind: fact
    level: E2
    status: established
    sources:
    - m5-nagareyama-city-gaiyo
  - text: 同資料は、はっきりとした地名の由来はわかっていないとする
    kind: fact
    level: E2
    status: established
    sources:
    - m5-nagareyama-city-gaiyo
  - text: 流山6丁目の赤城山の山頂にある「赤城祠碑」の碑文には、建長年間（1249〜1256年）に上州（群馬県）赤城山の一角が崩れて小山が流れ着いたとあり、「流山」の地名発祥の地と言われている（流山市公式資料）
    kind: legend
    level: E2
    status: established
    sources:
    - m5-nagareyama-city-gaiyo
  - text: 同資料は、建長年間に赤城山が噴火した記録はなく、この流れ着いた山の伝説に史実としての裏付けはないとする
    kind: fact
    level: E2
    status: established
    sources:
    - m5-nagareyama-city-gaiyo
  - text: 言い伝えの諸説として、上州赤城山に生い茂っていた熊笹が流山の赤城山と同種のものであるとか、洪水の際に上州赤城神社のお札が赤城山に流れ着いて祀ったとの伝えがあることが同資料に紹介される
    kind: legend
    level: E2
    status: established
    sources:
    - m5-nagareyama-city-gaiyo
  - text: 1967年（昭和42年）1月1日、東葛飾郡流山町が市制を施行して流山市となった（地方公共団体コードは122203）
    kind: fact
    level: E4
    status: established
    sources:
    - m5-uub-chiba-cities
    - k1-jlis-chiba
  - text: 市北部の旧新川村の名は、享保年間の江戸川の改修でできた直線的な流路を新川と呼んだことに由来すると市公式資料は記す
    kind: fact
    level: E2
    status: established
    sources:
    - m5-nagareyama-city-gaiyo
  column:
    title: 流れてきた山の伝説
    text: 流山の地名の由来は、公式資料でも「わかっていない」とされる。その代わりに語り継がれてきたのが、赤城山の伝説である。建長年間に上州の赤城山の一角が崩れて流れ着き、小さな山になったという話で、流山6丁目の赤城山の山頂には「流山の地名発祥の地」とする碑が立つ。市公式資料は噴火の記録がないことも正直に記しており、伝説と史実の線引きがはっきりした例といえる。
    sources:
    - m5-nagareyama-city-gaiyo
  relations:
  - pref/12
  unknowns:
  - 「流山」の語源は市公式資料でも「わかっていない」とされ、確定できなかった
  - 1614年以前の村名・郷名としての「流山」の用例の確認が未了
  updated: '2026-11-13'
- id: muni/12-浦安市
  code: '122271'
  names:
    ja: 浦安市
    reading: うらやすし
    aliases:
    - 浦安村
    - 浦安町
  user_terms:
  - 東京ディズニーリゾートのある市
  - ディズニーランドのまち
  - うらやす
  naming_type: 新規命名
  naming_note: 明治22年（1889年）の町村制施行に伴う3村合併の際に新たに命名された
  formation: 合併新設
  prefecture: 千葉県
  homonyms: []
  summary: 東京湾岸の漁師町を起源とする市。「浦安」は明治22年（1889年）に堀江・猫実・当代島の3村が合併した際に新たに名付けられた名前で、漁浦の安泰を祈る意味を込めて初代村長が命名したといわれる。昭和39年（1964年）以降は海面埋立で市域が大きく広がり、現在の市域の多くは埋立地で、埋立地の舞浜には東京ディズニーランドが開園した。旧来の漁師町の地名（堀江・猫実・当代島）と埋立地の新しい地名が同居する市である。
  first_attestation:
    era: 明治22年
    year_western: 1889
    document: 町村制施行に伴う浦安村の発足（浦安市公式「浦安村の誕生」が伝える）
    note: 市名としての「浦安」の初出は命名そのもの。なお「浦安」の語自体は『日本書紀』に日本国の美称として現れる古典的な語彙で、別説ではこれにちなむともいわれる
  claims:
  - text: 総務省の全国地方公共団体コードで、浦安市の団体コードは122271と定められている
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  - text: 浦安市公式サイトによれば、明治22年（1889年）の町村制施行に伴い、堀江村・猫実村・当代島村の3村が合併して浦安村が誕生した
    kind: fact
    level: E2
    status: established
    sources:
    - w5-urayasu-city-tanjou
  - text: 浦安市公式サイトによれば、「浦安」の命名は、当時漁村であった当地の漁浦の安泰を祈願する意味で、初代村長・新井甚左衛門によって名付けられたといわれている
    kind: fact
    level: E2
    status: contested
    sources:
    - w5-urayasu-city-tanjou
  - text: 浦安市公式サイトによれば、一説には、日本国は昔「浦安の国」と称したことからこの名を採用したともいわれている
    kind: fact
    level: E2
    status: contested
    sources:
    - w5-urayasu-city-tanjou
  - text: 浦安市公式サイトによれば、浦安村は明治42年（1909年）に町制を施行して浦安町となり、昭和56年（1981年）4月1日に市制を施行して浦安市となった
    kind: fact
    level: E2
    status: established
    sources:
    - w5-urayasu-city-tanjou
  - text: 浦安市公式サイトによれば、昭和39年（1964年）秋から海面埋立事業が本格化し、漁民は段階的に漁業権を放棄して昭和46年（1971年）に全面放棄に至り、昭和58年（1983年）4月には埋立地の舞浜に東京ディズニーランドが開園した
    kind: fact
    level: E2
    status: established
    sources:
    - w5-urayasu-city-tanjou
  - text: 浦安市公式サイトの大字解説によれば、猫実の名は、大津波の被害を受けた集落の人々が堤防に松を植え「この松の根を波が越さないように」と願った「根越さね」が転じたものといわれている
    kind: legend
    level: E2
    status: indeterminate
    sources:
    - w5-urayasu-city-chimei
  - text: 浦安市公式サイトの大字解説によれば、当代島の名は、鎌倉時代に開墾されて人々が住みついた土地を「当代（現代の意）にできた島」であるからと名付けたといわれている
    kind: legend
    level: E2
    status: indeterminate
    sources:
    - w5-urayasu-city-chimei
  column:
    title: 「浦安の国」か、漁浦の安泰か
    text: 浦安という名には二つの由来说が並んで伝わります。一つは実務的な祈りの名で、明治22年（1889年）に3村が合併した際、初代村長が漁浦の安泰を祈って付けたというもの。もう一つは、日本の国そのものが古く「浦安の国」と呼ばれたことにちなむという格調高い説です。市公式サイトは両説を併記しています。面白いのは、その後の市の姿です。もとの陸地は堀江・猫実・当代島の漁師町だけでしたが、昭和の海面埋立で市域は大きく広がり、埋立地には「明るい海」にちなむ明海、「東京ディズニーランド」のある舞浜など、由来のまったく違う新しい地名が並ぶようになりました。古い漁師町の地名と埋立地の地名が同居するのが、今の浦安の地図です。
    sources:
    - w5-urayasu-city-tanjou
    - w5-urayasu-city-chimei
  relations:
  - pref/12
  unknowns:
  - 「浦安」が県知事によって命名されたとする俗説が広く流布しているが、浦安市公式サイトの説明は初代村長・新井甚左衛門による命名としており、県知事命名説を裏付ける公的資料は確認できなかった
  - 「浦安の国」の原典である『日本書紀』の該当箇所の原文は未読のため、記載内容の直接確認はできていない
  updated: '2026-11-13'
- id: muni/12-白井市
  code: '122327'
  names:
    ja: 白井市
    reading: しろいし
    aliases:
    - 白井郷
    - 白井村
    - 白井町
  user_terms:
  - 梨のまち
  - しろい
  - なし坊のまち
  naming_type: 旧行政区画名の継承
  naming_note: 中世の郷名「白井郷」に由来し、町村制施行時に白井橋本村の通称「白井」を村名として踏襲した
  formation: 単独発足
  prefecture: 千葉県
  homonyms: []
  summary: 千葉県北西部の内陸都市で、全国有数の日本梨の産地として知られる。「白井」の起源は中世の郷名「白井郷」で、慶長7年（1602年）の水帳にその名が確認できる。明治22年（1889年）に白井橋本村の通称「白井」を踏襲して白井村が置かれ、昭和39年（1964年）の町制を経て、千葉ニュータウン開発による人口増を受け平成13年（2001年）に市制を施行した。
  first_attestation:
    era: 慶長7年
    year_western: 1602
    document: 『下総国印西庄外郷白井郷之内橋本之郷水帳』（船橋市西図書館蔵。白井市郷土資料館が「白井郷」の確実な史料として紹介）
    note: 「白井郷」の名が確認できる確実な最古の史料（郷土資料館の紹介による。原文は未読）。郷そのものの成立は室町時代当初から天正10年（1582年）までの間と推定されている
  claims:
  - text: 総務省の全国地方公共団体コードで、白井市の団体コードは122327と定められている
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  - text: 白井市郷土資料館によれば、白井という地名の起源は郷名「白井郷」であり、確実に遡れる史料は慶長7年（1602年）の『下総国印西庄外郷白井郷之内橋本之郷水帳』である
    kind: fact
    level: E2
    status: established
    sources:
    - w5-shiroi-museum-chimei
  - text: 白井市郷土資料館によれば、「白井郷」は早ければ室町時代当初から、遅くとも戦国期の天正10年（1582年）までに成立していたと考えられる
    kind: fact
    level: E2
    status: established
    sources:
    - w5-shiroi-museum-chimei
  - text: 白井市郷土資料館は、白井郷がかつての埴生西冨谷郷の範囲と重なることに着目し、富んだ谷津に囲まれた場所に村が開かれ、谷津田の開発が進んで苗代に囲まれるようになった結果、「冨谷」から「代囲」を経て「白井」へと地名が成立・変化した過程を想像できるとしている
    kind: fact
    level: E2
    status: inferred
    sources:
    - w5-shiroi-museum-chimei
  - text: 白井市公式サイトによれば、明治22年（1889年）の市制町村制施行時に白井村谷清村組合村が誕生し、白井村の村名は、当時この地域で最も知られていた白井橋本村の通称「白井」を踏襲したといわれている
    kind: fact
    level: E2
    status: established
    sources:
    - w5-shiroi-city-rekishi
  - text: 白井市公式サイトによれば、大正2年（1913年）に組合村が廃止されて単独の白井村が誕生し、昭和39年（1964年）9月1日に町制を施行して白井町となり、平成13年（2001年）4月に市制を施行して白井市が誕生した
    kind: fact
    level: E2
    status: established
    sources:
    - w5-shiroi-city-rekishi
  - text: 白井市郷土資料館によれば、白井は全国有数の日本梨の産地であり、梨の栽培は明治38年（1905年）頃に白井木戸新田の浅海久太郎らによって始められたと伝えられている
    kind: fact
    level: E2
    status: established
    sources:
    - w5-shiroi-museum-chimei
  column:
    title: 苗代の白さから生まれた名か――冨谷・代囲・白井
    text: 「白井」という名の語源は、はっきりとは分かっていません。白井市郷土資料館が示すのは一つの想像です。白井郷は、もとの「冨谷郷」（富んだ谷津の郷）の範囲と重なる。谷津田の開発が進むと集落は苗代に囲まれるようになり、「冨谷」から「代囲（しろい）」へ、やがて「白井」と書かれるようになったのではないか、というのです。田植え前の水田の情景から生まれた名だとすれば、水の乏しい台地の新田地帯だった白井らしい成り立ちといえます。もっとも、これは資料館自身が「想像」と断る推測の域の話です。今の白井を象徴するのは梨で、明治38年（1905年）頃に始まった栽培は、戦時中も梨業組合を結成して守り抜かれ、全国有数の産地になりました。
    sources:
    - w5-shiroi-museum-chimei
  relations:
  - pref/12
  unknowns:
  - 『下総国印西庄外郷白井郷之内橋本之郷水帳』（1602年）の原文は未読であり、白井郷の記載は郷土資料館の紹介による
  - 「白井」の語源は郷土資料館の推測（冨谷→代囲→白井）以外に公的資料で確認できる説がなく、確定していない
  updated: '2026-11-13'
- id: muni/12-白子町
  code: '124249'
  names:
    ja: 白子町
    reading: しらこまち
    aliases:
    - 白潟町
    - 関村
    - 南白亀村
  user_terms:
  - しらこ
  - 白子
  - テニスの町
  - 白子温泉
  - 白子神社
  naming_type: 学校名・駅名などから
  naming_note: 1955年の合併時に郷社・白子神社の名を取った命名
  formation: 合併新設
  prefecture: 千葉県
  homonyms: []
  summary: 九十九里浜南部の町で、テニス合宿と温泉で知られる。町名は1955年の合併の際、白潟町・関村・南白亀村のいずれの名でもなく、地域の鎮守である白子神社の名を取って付けられた。神社には平安時代の白亀と白蛇の伝承があり、「白子」の名は1708年に賜った「正一位白子大明神」の神号にも見える。
  first_attestation:
    era: 宝永5年
    year_western: 1708
    document: null
    note: 白子神社の由緒によれば、宝永5年に朝廷から「正一位白子大明神」の神号を賜った。「白子」の用例として確認できた最古級のもの。これ以前の用例は未確認
  claims:
  - text: 明治22年（1889年）の町村制施行により旧14村が合併して関村・白潟村・南白亀村が発足し、白潟村は昭和15年（1940年）2月2日に町制を施行して白潟町となった
    kind: fact
    level: E2
    status: established
    sources:
    - w12-shirako-town-enkaku
  - text: 昭和30年（1955年）2月11日、白潟町・関村・南白亀村の1町2村が合併して白子町が誕生した
    kind: fact
    level: E2
    status: established
    sources:
    - w12-shirako-town-enkaku
  - text: 町公式の沿革は、新しい町名について「白子神社の名をとって白子町が誕生しました」と明記しており、合併した3町村のどの名でもない神社の名が選ばれた
    kind: fact
    level: E2
    status: established
    sources:
    - w12-shirako-town-enkaku
  - text: 白子神社の由緒によれば、神社は永承3年（1048年）に現在の八斗で大己貴命（大国主命）を祀ったのが始まりとされ、久安3年（1147年）に現在の関の南白亀台（なばきだい）へ移して祀られた
    kind: fact
    level: E4
    status: established
    sources:
    - w12-shirako-jinja
  - text: 大治元年（1126年）8月13日、里人が沖から白い亀の上に白蛇がとぐろを巻いて乗ってくるのを見つけ、「もし神さまならどうぞこの潮を汲む柄杓にお乗りください」と申し上げると白蛇はゆっくりと登り始めたので、里人はこの白蛇を神として祀ったと伝えられる
    kind: legend
    level: E4
    status: established
    sources:
    - w12-shirako-jinja
  - text: 宝永5年（1708年）に朝廷から「正一位白子大明神」の神号を賜り、明治維新による神仏分離の後、神社は「白子神社」と名を変えたと由緒は伝える
    kind: fact
    level: E4
    status: established
    sources:
    - w12-shirako-jinja
  - text: 神社の遷座先である「南白亀（なばき）」の名は、旧村名の南白亀村や町内を流れる南白亀川の名として今も残り、白亀の伝承の層を伝えている
    kind: fact
    level: E4
    status: established
    sources:
    - w12-shirako-jinja
    - w12-shirako-town-enkaku
  - text: 白子町の地方公共団体コードは124249である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 白亀に乗ってきた白蛇
    text: 白子神社の由緒の中心にあるのは、海から来た神の物語である。大治元年（1126年）、潮汲みをしていた里人の前に、白い亀の背に白蛇がとぐろを巻いて乗る姿が現れた。「神さまなら、この柄杓にお乗りください」と言うと、白蛇はゆっくりと柄杓に登ってきたという。里人はこの蛇を神として祀り、神社はいまも白蛇を大切にし、拝殿前には撫でると利益があるとされる「撫で蛇様」がいる。1955年、合併で新しい町の名が必要になったとき、人々が選んだのは3町村のどの名でもなく、この白蛇の神社の名「白子」だった。町の名は、平安時代の海辺の伝承をそのまま現代に運んでいる。
    sources:
    - w12-shirako-jinja
    - w12-shirako-town-enkaku
  relations:
  - pref/12
  - muni/12-睦沢町
  unknowns:
  - 「白子」という語そのものの成り立ち（白蛇にちなむ命名かどうか）は、神社の由緒でも直接には説明されておらず未確認
  - 1708年の神号以前に「白子」の名が地名・社名として用いられた用例は、確認できなかった
  - 1955年の合併協議で「白子」以外の町名候補があったかどうかは未確認
  updated: '2026-11-13'
- id: muni/12-睦沢町
