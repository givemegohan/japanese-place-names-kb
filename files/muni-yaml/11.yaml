  - かみかわ
  - 神流川
  - 神流湖
  - 下久保ダム
  - 金鑽神社
  naming_type: 自然地名から
  naming_note: 1954年に丹荘村・青柳村が合併して神川村。命名理由の公式な明記は確認できていない
  formation: 合併新設
  prefecture: 埼玉県
  homonyms: []
  summary: 児玉郡の町で、北部を利根川水系の神流川が流れ、群馬県との境をなす。1954年（昭和29年）に丹荘村と青柳村が合併して神川村が発足し、1987年（昭和62年）に町制を施行、2006年（平成18年）に神泉村と合併して現在の神川町となった。村名・町名「神川」の命名理由を明記した公式資料は確認できておらず、神流川にちなむ名と考えられるが確証はない。なお川の名「神流」は、古く「カミノ川」と呼ばれたものが「神の川」「神名」へ転じたと国土交通省が解説している。
  first_attestation:
    era: 昭和29年
    year_western: 1954
    document: 神川村の発足（丹荘村・青柳村の合併）
    note: 自治体名としての初出。川名「神流川」は古くカミノ川と呼ばれたと伝えられるが、文書上の初出は確認できなかった
  claims:
  - text: 町域の北部を神流川が流れ、群馬県藤岡市との境をなし、町域には下久保ダムによる神流湖がかかる
