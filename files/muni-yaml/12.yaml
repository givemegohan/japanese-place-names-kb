    - 袖ヶ浦町
  user_terms:
  - そでがうら
  - 袖ヶ浦
  - アクアラインに近い工業のまち
  naming_type: 旧国名・広域地名の採用
  naming_note: 弟橘姫の袖の伝説に由来するとされる地域名「袖ケ浦」を、1955年の合併で誕生した新町の名として採用した
  formation: 合併新設
  prefecture: 千葉県
  homonyms: []
  summary: 東京湾に面する京葉工業地域の市。「袖ケ浦」の名は、日本武尊の東征の際に海に身を投じた弟橘姫の袖が流れ着いたという伝説に由来するとされ、昭和30年（1955年）に合併で袖ヶ浦町が誕生した際に町名として採用された。昭和46年（1971年）に平川町と合併し、平成3年（1991年）に市制を施行した。臨海部は埋立造成された石油化学・エネルギーのコンビナートが広がる。
  first_attestation:
    era: 昭和30年
    year_western: 1955
    document: 袖ヶ浦町の発足に伴う町名の採用（袖ケ浦市総合計画が伝える）
    note: 市名としての「袖ケ浦」の初出は1955年の町名採用。由来とされる弟橘姫の袖の伝説は『古事記』の日本武尊東征譚に結びつけて市が紹介するもので、袖の漂着そのものを記す一次文献の記載は未確認
  claims:
  - text: 総務省の全国地方公共団体コードで、袖ケ浦市の団体コードは122297と定められている
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  - text: 袖ケ浦市の総合計画によれば、「袖ケ浦」の名は、『古事記』の日本武尊が東征の折に走水（現在の東京湾）を渡る際に大時化に遭い、海神の怒りを鎮めるため海に身を投じた妃・弟橘姫の袖が、この地方の海岸に流れ着いたという伝説に由来している
    kind: legend
    level: E2
    status: indeterminate
    sources:
    - w5-sodegaura-city-plan
  - text: 袖ケ浦市の総合計画によれば、「袖ケ浦」の名は昭和30年（1955年）に旧袖ヶ浦町が誕生した際に、町名として採用されたものである
    kind: fact
    level: E2
    status: established
    sources:
    - w5-sodegaura-city-plan
  - text: 袖ケ浦市の総合計画によれば、この地域には室町時代に「横田郷」と呼ばれる大きな村ができていた
    kind: fact
    level: E2
    status: established
    sources:
    - w5-sodegaura-city-plan
  - text: 袖ケ浦市の総合計画によれば、昭和46年（1971年）11月3日に旧袖ヶ浦町と旧平川町が合併して新たな袖ヶ浦町が発足した
    kind: fact
    level: E2
    status: established
    sources:
    - w5-sodegaura-city-plan
  - text: 袖ケ浦市の総合計画によれば、平成3年（1991年）4月1日に市制を施行し、袖ケ浦市が誕生した
    kind: fact
    level: E2
    status: established
    sources:
    - w5-sodegaura-city-plan
  - text: 袖ケ浦市の総合計画によれば、高度経済成長期に入ると海岸の埋め立て造成により石油化学やエネルギー関連のコンビナートが形成され、市は京葉工業地域の一翼を担う地域となった
    kind: fact
    level: E2
    status: established
    sources:
    - w5-sodegaura-city-plan
  column:
    title: 海に身を投げた姫の「袖」が、町の名前になった
    text: 袖ケ浦の名は、古代の悲しい伝説に結びつけられてきました。日本武尊が走水の海を渡ろうとして嵐に遭ったとき、妃の弟橘姫が海神の怒りを鎮めるために身を投じ、その袖がこの浦に流れ着いた――市はこの伝説を地名の由来として紹介し、昭和30年（1955年）の合併で新しい町が生まれたとき、この伝説の名が町名に選ばれました。弟橘姫の入水自体は『古事記』『日本書紀』に記される東征譚ですが、袖の漂着がこの地のことだという結びつきは、文献で裏付けられるものではなく伝承の世界です。今ではその海岸は埋め立てられ、石油化学コンビナートと発電所が並ぶ京葉工業地域になりました。伝説の「浦」の面影は、名前にだけ残っているといえます。
    sources:
    - w5-sodegaura-city-plan
  relations:
  - pref/12
  unknowns:
  - 弟橘姫の袖の漂着を現在の袖ケ浦の地に結びつける一次文献の記載は確認できていない（市の総合計画も伝説として紹介している）
  - 1955年に発足した旧袖ヶ浦町の構成町村の詳細は、市総合計画では確認できなかった
  - 「袖ケ浦」が伝説以外に、袖のように入り組んだ浦辺の地形に由来するとする地形語源説について、公的資料での確認はできていない
  updated: '2026-11-13'
- id: muni/12-酒々井町
  code: '123226'
  names:
    ja: 酒々井町
    reading: しすいまち
    aliases:
    - 須々井
    - 酒々井宿
  user_terms:
  - しすい
  - 酒々井
  - 酒の井
  - 難読地名
  - アウトレットの町
  naming_type: 中心地名の継承
  naming_note: 古地名「酒々井」の継承。町公式の説明では酒の井の伝説に由来
  formation: 合併新設
  prefecture: 千葉県
  homonyms: []
  summary: 印旛沼の東岸の町で、県内最古級の町の歴史を持つとされる。町公式の「町名の由来」は、酒好きの父のために孝行息子が見つけた「酒の井」の伝説を掲げる。一方、地名の古い記録は室町時代の「須々井」で、印旛沼畔の湧き水「出水（しゅすい）」に由来すると考えるのが自然だという見解も報じられており、伝説と語源は分けて記録する必要がある。1889年に16か町村の合併で町として発足した。
  first_attestation:
    era: 応永14年頃
    year_western: 1407
    document: null
    note: 酒々井町教育委員会の見解として、応永14年頃に「須々井」という地名が記録されていると報じられている。16世紀頃には「酒々井」と記されるようになったという
  claims:
  - text: 酒好きの年老いた父のために毎日働いて酒を買っていた孝行息子が、ある日、道ばたの井戸から酒の香りがするのに気づき、汲んでみると本物の酒であった。この酒は親子以外の人が飲むとただの水になってしまい、人々は「孝行息子の真心が天に通じたにちがいない」と称えた。後にこの井戸を「酒の井」と呼び、村も「酒々井」と呼ぶようになったという
    kind: legend
    level: E2
    status: established
    sources:
    - w12-shisui-town-yurai
    - w12-shisui-town-fudoki
  - text: 町公式の概要資料は「『酒々井』という町名は『酒の井戸』から転じたと言われており……『酒の井伝説』に由来しています」と説明する
    kind: fact
    level: E2
    status: established
    sources:
    - w12-shisui-town-overview
  - text: この伝説は『印旛郡誌』（大正2年・1913年）に記されており、円福院神宮寺に伝わる「孝子酒泉」の説話で、鎌倉時代の説話集『十訓抄』に見える養老の滝の説話が広まったものと関係すると町は解説する
    kind: fact
    level: E2
    status: established
    sources:
    - w12-shisui-town-fudoki
  - text: 地名の歴史的な成り立ちについては、室町時代の応永14年（1407年）頃に「須々井（すすい）」の記録があり、印旛沼の畔に湧き水があったことから「出水（しゅすい）」が酒々井となったと考えるのが自然だという町教育委員会の見解が報じられている
    kind: fact
    level: E4
    status: contested
    sources:
    - w12-shisui-tabimag
  - text: 明治22年（1889年）の町村制施行で近隣16か町村が合併し、酒々井町が誕生した（発足当初から町）
    kind: fact
    level: E2
    status: established
    sources:
    - w12-shisui-town-overview
  - text: 江戸時代には成田参詣の宿場町（酒々井宿）としてにぎわった
    kind: fact
    level: E2
    status: established
    sources:
    - w12-shisui-town-overview
  - text: 酒々井町の地方公共団体コードは123226で、読みは「しすいまち」である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 養老の滝の房総版、「酒の井」
    text: 親孝行な息子と、酒に変わる水の物語は、日本の説話の定番である。美濃の養老の滝では山で汲んだ水が酒になり、鎌倉時代の説話集『十訓抄』にも載る孝子説話として広まった。酒々井の「酒の井」もこの系譜にあり、円福院神宮寺が御神酒を醸すのに使った井戸の水を背景に生まれたと考えられている。説話の型は全国共通でも、地名として定着したのはここだけである。廃寺となった神宮寺の跡には今も「酒の井」が復元され、難読地名「しすい」の由来を静かに語り続けている。
    sources:
    - w12-shisui-town-fudoki
    - w12-shisui-tabimag
  relations:
  - pref/12
  - muni/12-栄町
  unknowns:
  - 応永14年頃の「須々井」の記録の具体的な文書名は、報じられた範囲では特定できなかった（一次資料による直接確認は未了）
  - 「出水（しゅすい）」から「しすい」への音の変化と、「酒々井」の字が当てられた正確な時期は未確認
  - 酒の井伝説がいつ地名の説明として定着したか（伝説と地名の先後関係）は確定していない
  updated: '2026-11-13'
- id: muni/12-野田市
  code: '122084'
  names:
    ja: 野田市
    reading: のだし
    aliases:
    - 野田町
    - 関宿町
  user_terms:
  - 醤油のまち
  - キッコーマンのまち
  - のだ
  naming_type: 中心地名の継承
  naming_note: 「野の中にある田」という普通名詞的な地名の継承
  formation: 編入合併
  prefecture: 千葉県
  homonyms: []
  summary: 利根川と江戸川に挟まれた台地の市で、江戸時代以来の醤油醸造の中心地。「野田」は広い原野の中に水田が開かれた土地を表す名と説明され、「野の中にある田」という普通名詞に由来する。醤油は江戸川の水運で江戸へ送られ、大正6年（1917年）には野田醤油株式会社（後のキッコーマン）が生まれた。昭和25年（1950年）に市制を施行し、平成15年（2003年）に城下町・関宿の町を編入して現在の市域となった。
  first_attestation:
    era: null
    year_western: null
    document: null
    note: 「野田」という地名の文献上の確実な初出は確認できていない。語としては「野の中にある田」を意味する普通名詞で、中世にはこの一帯が関宿城主・簗田氏の支配下にあったことが辞典類に紹介されるにとどまる
  claims:
  - text: 総務省の全国地方公共団体コードで、野田市の団体コードは122084と定められている
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  - text: 『日本大百科全書（ニッポニカ）』は、野田の地名は広い原野に水田が開かれたことに由来すると説明している
    kind: fact
    level: E3
    status: established
    sources:
    - w5-noda-kotobank
  - text: 『デジタル大辞泉』は、「野田」を「野の中にある田」と解する普通名詞として立項している
    kind: fact
    level: E3
    status: established
    sources:
    - w5-noda-kotobank
  - text: 『日本大百科全書（ニッポニカ）』によれば、野田の地は平安時代末に下河辺荘に属し、中世には関宿城主・簗田氏に支配された
    kind: fact
    level: E3
    status: established
    sources:
    - w5-noda-kotobank
  - text: 野田市公式サイトによれば、野田の近世の醤油醸造は寛文元年（1661年）に髙梨兵左衛門が醸造を開始してから商品化が進んだと考えられ、大正6年（1917年）には茂木・髙梨両一族の八家合同で野田醤油株式会社（キッコーマン株式会社の前身）が誕生した
    kind: fact
    level: E2
    status: established
    sources:
    - w5-noda-city-shoyu
  - text: 『日本大百科全書（ニッポニカ）』によれば、昭和25年（1950年）に野田町と旭村・七福村・梅郷村が合併して市制を施行し、野田市となった
    kind: fact
    level: E3
    status: established
    sources:
    - w5-noda-kotobank
  - text: 野田市公式サイトによれば、平成15年（2003年）6月に旧野田市が旧関宿町を編入合併し、現在の野田市が誕生した
    kind: fact
    level: E2
    status: established
    sources:
    - w5-noda-city-enkaku
  column:
    title: 原野の田んぼが、世界の醤油の名になった
    text: 「野田」は、野の中に開かれた田という、ごく素朴な農村の呼び名でした。その小さな地名が世界に知られるようになったのは醤油のおかげです。利根川と江戸川の水運に恵まれた野田では、江戸時代に醤油醸造が本格化し、江戸市中の需要を関西の醤油から奪うほどに成長しました。大正6年（1917年）には醸造家の茂木・髙梨両一族が合同して野田醤油株式会社を設立し、これが後のキッコーマンとなります。キッコーマンの本社が今も野田市にあるのは、この地名あってのことです。ちなみに現在の野田市には、北端に関宿城の城下町だった旧関宿町が含まれます。2003年の編入で、「野田」の市域は城下町まで広がりました。
    sources:
    - w5-noda-city-shoyu
    - w5-noda-kotobank
  relations:
  - pref/12
  unknowns:
  - 「野田」の文献上の確実な初出（中世文書での用例）は、専門辞典のオンライン公開範囲では確認できなかった
  - 野田市公式サイトに「野田」という地名そのものの由来を解説するページは確認できず、語源は辞典類の説明に拠った
  updated: '2026-11-13'
- id: muni/12-銚子市
  code: '122025'
  names:
    ja: 銚子市
    reading: ちょうしし
    aliases:
    - 鳥子
    - 銚子町
    - 本銚子町
  user_terms:
  - 銚子ってどういう意味
  - 犬吠埼のまち
  - 醤油のまち銚子
  - 日本一早い初日の出
  naming_type: 中心地名の継承
  formation: 合併新設
  prefecture: 千葉県
  homonyms: []
  summary: 市名は利根川河口一帯の広域通称名「銚子」を継いだもの。河口の地形が酒器の銚子の口に似ていたことが名の由来とされ、古くは「鳥子」と記されたが、江戸時代初期に「銚子」の表記が当てられたという。1933年に銚子町など3町1村が合併して市制を施行した。
  first_attestation:
    era: 江戸時代初期
    year_western: null
    document: 「先代集」（田中家文書）に基づく『日本歴史地名大系』の記述
    note: 銚子という町村名はもともとなく、河口付近一帯の呼称として近世初期ごろから呼ばれだした。旧記「鳥子」から「銚子」表記への転換を伝えるもので、一次資料そのものの直接確認は未了
  claims:
  - text: 『精選版日本国語大辞典』は「銚子」の地名について、利根川の河口が銚子（酒器）に似て口の部分が狭いところから呼ばれたと説明する
    kind: fact
    level: E3
    status: established
    sources:
    - m5-choshi-kotobank
  - text: 『日本歴史地名大系』によれば、銚子は江戸時代以来、海上郡の利根川河口部一帯をいう広域通称名で、行政単位ではなく通称であったと考えられる
    kind: fact
    level: E3
    status: established
    sources:
    - m5-choshi-kotobank
  - text: 旧くは「鳥子」と記されていたが、松平伊昌の時代に河口部の潮の出入りが銚子の出口に似ているとして「銚子」の表記を当てたという（『日本歴史地名大系』が「先代集」田中家文書に基づく記述として紹介）
    kind: fact
    level: E3
    status: established
    sources:
    - m5-choshi-kotobank
  - text: 江戸時代の銚子は銚子湊・銚子領として知られ、飯沼には高崎藩の陣屋（銚子役所）が置かれたと銚子市公式の歴史文化資料は記す
    kind: fact
    level: E2
    status: established
    sources:
    - m5-choshi-city-history
  - text: 1889年（明治22年）の町村制施行で本銚子町・銚子町などが成立したと銚子市公式の歴史文化資料は記す
    kind: fact
    level: E2
    status: established
    sources:
    - m5-choshi-city-history
  - text: 1933年（昭和8年）2月11日、海上郡銚子町・本銚子町・西銚子町・豊浦村が合併して市制を施行し、銚子市が発足した（地方公共団体コードは122025）
    kind: fact
    level: E3
    status: established
    sources:
    - m5-choshi-kotobank
    - m5-uub-chiba-cities
    - k1-jlis-chiba
  - text: 市制後も周辺町村の編入を重ね、1956年までにおおむね現在の市域が形成された
    kind: fact
    level: E4
    status: established
    sources:
    - m5-uub-chiba-cities
  column:
    title: 酒器の名を持つ港町
    text: 銚子という名は、もともと町村の名ではなく、利根川の河口一帯を指す通称だった。川の口が酒器の銚子に似て狭いところから呼ばれたといい、最初は「鳥子」と書かれていたが、江戸時代の初めごろ、潮の出入りが銚子の口に似ているとして「銚子」の字が当てられたという。港町として栄えた土地が、やがて酒器の名をまちの名として受け継いだ。
    sources:
    - m5-choshi-kotobank
  relations:
  - pref/12
  unknowns:
  - 銚子の語源（河口形状説）については辞典類の説明があるが、一次資料による裏づけの確認は未了
  - 「鳥子」表記の文書上の初出の特定が未了
  - 利根川の旧称（銚子口）との関係についての専門辞典の記述確認が未了
  updated: '2026-11-13'
- id: muni/12-鋸南町
  code: '124630'
  names:
    ja: 鋸南町
    reading: きょなんまち
    aliases:
    - 勝山町
    - 保田町
  user_terms:
  - 鋸南町の名前の由来
  - 鋸山の南の町
  - きょなんまち
  - 日本寺のある町
  naming_type: 方位・位置による命名
  formation: 合併新設
  prefecture: 千葉県
  homonyms: []
  summary: 昭和34年（1959年）3月30日に勝山町と保田町が合併して発足した町。町名は、町の北にそびえる鋸山（のこぎりやま）の南に位置することから名付けられた。鋸山は稜線が鋸の歯のように見えることから名付けられた山で、その南斜面には聖武天皇の勅願によって開かれたと伝える日本寺がある。
  first_attestation:
    era: 昭和34年
    year_western: 1959
    document: 勝山町・保田町の合併による鋸南町の発足
    note: 町名の命名そのもの。名の材料となった「鋸山」の山名自体は、江戸時代の石切りとともに広まったと考えられるが、初出は確認できていない
  claims:
  - text: 昭和34年（1959年）3月30日に旧勝山町と旧保田町が合併して鋸南町が誕生した
    kind: fact
    level: E2
    status: established
    sources:
    - v1-kyonan-jichiken
  - text: 町名は、町の北部に標高329メートルの鋸山があり、その南に位置することから「鋸南町」と名付けられた
    kind: fact
    level: E2
    status: established
    sources:
    - v1-kyonan-jichiken
  - text: 富津市公式によれば、鋸山は江戸時代から昭和60年まで房州石（ぼうしゅういし）を切り出しており、山肌や稜線がギザギザのノコギリのように見えることから「鋸山」と呼ばれている
    kind: fact
    level: E2
    status: established
    sources:
    - v1-futtsu-nokogiriyama
  - text: 鋸山は昔から東京湾に入る船の目印とされていた
    kind: fact
    level: E2
    status: established
    sources:
    - v1-jtb-nokogiriyama
  - text: 日本寺は神亀2年（725年）に聖武天皇の勅願によって行基が開創した古刹であると、寺の公式サイトと全国観光資源台帳が伝えている
    kind: fact
    level: E2
    status: established
    sources:
    - v1-nihonji-yuisho
    - v1-jtb-nokogiriyama
  - text: 日本寺の由緒によれば、源頼朝は石橋山の戦いに敗れて房州に逃れた折に日本寺で武運を祈願し、自ら蘇鉄を手植えしたと伝えられ、その大蘇鉄が現在も境内に残っている
    kind: legend
    level: E2
    status: established
    sources:
    - v1-nihonji-yuisho
  - text: 総務省の地方公共団体コードで、鋸南町のコードは124630と定められている
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 鋸の歯の稜線は、石を切った山の姿
    text: 「鋸山」のギザギザの稜線は、眺める人を楽しませる自然の造形であると同時に、江戸時代から昭和まで続いた房州石の石切りの歴史を刻んだ姿でもある。富津市公式は、石を切り出したことで山肌や稜線がギザギザのノコギリのように見えることから「鋸山」と呼ばれていると説明する。つまりこの山の名は、山の形そのものと、人の手が加わった結果とを切り離せない。1959年に生まれた町名「鋸南」は、その山の南という位置を示す、房総でも分かりやすい命名の一つである。
    sources:
    - v1-futtsu-nokogiriyama
    - v1-kyonan-jichiken
  relations:
  - pref/12
  unknowns:
  - 1959年の合併時に新町名「鋸南」がどのような手続き（公募か協議か）で選ばれたかを明記した公的資料は確認できなかった
  - 山名「鋸山」の文献上の初出は確認できていない
  updated: '2026-11-13'
- id: muni/12-鎌ケ谷市
  code: '122246'
  names:
    ja: 鎌ケ谷市
    reading: かまがやし
    aliases:
    - 鎌ヶ谷
    - 蒲萱
    - 鎌ケ谷村
    - 鎌ケ谷町
  user_terms:
  - かまがや
  - 鎌ヶ谷
  - 鎌ヶ谷大仏のあるまち
  naming_type: 中心地名の継承
  naming_note: 江戸時代に宿場として成立した中心集落・鎌ケ谷村の名の継承
  formation: 合併新設
  prefecture: 千葉県
  homonyms: []
  summary: 下総台地の谷あいの市で、鎌ヶ谷大仏で知られる。「かまがや」はもともと市域の一部を指す古い地名だが、正確な由来は分かっておらず、市立図書館は釜形の谷・蒲の群生する谷など複数の語源説を示している。中心集落の鎌ケ谷村は江戸時代に木下街道の宿場として成立し、明治22年（1889年）の合併で生まれた鎌ケ谷村は以後一度も合併せず、昭和46年（1971年）に単独で市制を施行した。表記は「ヶ」と「ケ」が混在したが、平成11年（1999年）に公文書では「鎌ケ谷」に統一された。
  first_attestation:
    era: 室町時代
    year_western: null
    document: 室町時代の記録に見える「蒲萱」（鎌ケ谷市立図書館が「鎌ケ谷ではないか」と紹介するもの）
    note: 初出は未確定。「蒲萱」が鎌ケ谷を指すかどうかも断定されておらず、市立図書館は「もともとの『かまがや』がどの地域をさしたものかわからないため正確な由来はわかりません」としている。市域で最も遡れる地名は文永9年（1272年）の幕府文書に見える佐津間・粟野である
  claims:
  - text: 総務省の全国地方公共団体コードで、鎌ケ谷市の団体コードは122246と定められている
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  - text: 鎌ケ谷市立図書館によれば、「かまがや」はもともと現在の市域より狭い地域を指した地名で、室町時代の記録に見える「蒲萱」が「鎌ケ谷」ではないかともいわれている
    kind: fact
    level: E2
    status: indeterminate
    sources:
    - w5-kamagaya-library-chimei
  - text: 鎌ケ谷市立図書館によれば、「かまがや」の正確な由来は分からないが、語源としては、台地に挟まれた釜形の谷、大量に水の湧くカマ（穴）のある谷、蒲（ガマ）の群生している谷、えぐったような崖のある谷などが考えられている
    kind: fact
    level: E2
    status: indeterminate
    sources:
    - w5-kamagaya-library-chimei
  - text: 鎌ケ谷市立図書館によれば、鎌ケ谷村は江戸時代の寛永6年（1629年）に、木下街道の宿場町として成立した村である
    kind: fact
    level: E2
    status: established
    sources:
    - w5-kamagaya-library-chimei
  - text: 鎌ケ谷市立図書館によれば、明治22年（1889年）に佐津間・粟野・初富・鎌ケ谷・道野辺・中沢・軽井沢新田の7か村と串崎新田飛地が合併して鎌ケ谷村が誕生し、同村は以後どの市町村とも合併せずに現在まで至っている
    kind: fact
    level: E2
    status: established
    sources:
    - w5-kamagaya-library-chimei
  - text: 鎌ケ谷市は昭和33年（1958年）8月1日に町制を施行して鎌ケ谷町となり、昭和46年（1971年）9月1日に市制を施行した
    kind: fact
    level: E2
    status: established
    sources:
    - upg-r6-kamagaya-geoshape-town
    - upg-r6-kamagaya-geoshape-city
    - upg-r6-kamagaya-plan
  - text: 安永5年（1776年）に大国屋文右衛門（福田文右衛門）が鎌ヶ谷大仏を建立した
    kind: fact
    level: E2
    status: established
    sources:
    - upg-r6-kamagaya-bunkazai
  - text: 表記は小文字の「鎌ヶ谷」と大文字の「鎌ケ谷」が混在していたが、市は平成11年（1999年）6月に、市制施行時の千葉県からの公文書に「鎌ケ谷」と記されていたことをもとに、市が作成する公文書等は大文字の「鎌ケ谷」表記に統一する方針を定めた
    kind: fact
    level: E2
    status: established
    sources:
    - upg-r6-kamagaya-hyoki
  column:
    title: 「ヶ」か「ケ」か――一文字をめぐる表記の決着
    text: 鎌ケ谷の名でもう一つ有名なのが、「ヶ」と「ケ」の書き分けです。駅名や古い地図では小文字の「鎌ヶ谷」、市役所の公文書では大文字の「鎌ケ谷」と、同じ市の中で表記が揺れてきました。市は平成11年（1999年）、千葉県からの公文書で大文字の「鎌ケ谷」と記されていたことに基づき、公文書では大文字に統一する方針を決めました。いっぽう安永5年（1776年）に建立された名物の大仏は今も「鎌ヶ谷大仏」と小文字で呼ばれ、駅名も「鎌ヶ谷大仏駅」のままです。語源のほうはさらに決着がついていません。市立図書館は正直に「正確な由来はわかりません」と書いたうえで、釜形の谷、湧き水の穴のある谷、蒲の群生する谷など、四つの考えを示しています。
    sources:
    - w5-kamagaya-wikipedia
    - w5-kamagaya-library-chimei
  relations:
  - pref/12
  unknowns:
  - 「かまがや」の語源は市立図書館が示す複数の考えのいずれとも確定しておらず、『角川日本地名大辞典』等の専門辞典での見解は未確認
  - 室町時代の記録の「蒲萱」が鎌ケ谷を指すという見方は、市立図書館の紹介によるもので、原典の直接確認はできていない
  updated: '2026-11-13'
- id: muni/12-長南町
  code: '124273'
  names:
    ja: 長南町
    reading: ちょうなんまち
    aliases:
    - 庁南町
    - 長南宿
    - 武丘村
  user_terms:
  - 長南町の名前の由来
  - ちょうなんまち
  - 庁南と長南はどう違う
  - 長南城のある町
  naming_type: 中心地名の継承
  formation: 分村・分立
  prefecture: 千葉県
  homonyms: []
  summary: 昭和30年（1955年）2月11日に庁南町・豊栄村・西村・東村が合併して発足した町。町名「長南」は中世以来の地名で、平安末期に長柄郡が南北に分かれた際にその南半分を指して生まれた名と考えられている。読みの同じ前身の庁南町は、庁南城にちなむとされる別の字の町名で、合併によって古い「長南」の表記に戻った形になっている。
  first_attestation:
    era: 天正18年
    year_western: 1590
    document: 豊臣秀吉禁制（長福寿寺文書）
    note: 『日本歴史地名大系』が紹介する「長南」の使用例。地名自体は平安末期の長柄郡の再編に遡ると想定されているが、文献で確認できる範囲はここまで
  claims:
  - text: 昭和30年（1955年）2月11日に庁南町・豊栄村・東村・西村の4町村が合併して長南町が発足した
    kind: fact
    level: E2
    status: established
    sources:
    - v1-chonan-yoran2025
    - v1-chonan-wiki
  - text: 長南町公式の総合計画は、平安末頃に長柄郡が南北に分割され、そこから「長南」の名が起こったと考えられると説明している
    kind: fact
    level: E2
    status: established
    sources:
    - v1-chonan-sougoukeikaku
  - text: 『日本歴史地名大系』は、長南の称は長柄郡が平安時代末に再編されて成立した長北・長南両郡に由来したと想定することが可能だが確定はできないとし、他方で「庁南」の表記からは官衙の南という説明も可能だとしている
    kind: fact
    level: E3
    status: contested
    sources:
    - v1-chonan-kotobank-taikei
  - text: 『日本歴史地名大系』によれば、天正18年（1590年）6月の豊臣秀吉の禁制（長福寿寺文書）に「長南」の地名が見える
    kind: fact
    level: E3
    status: established
    sources:
    - v1-chonan-kotobank-taikei
  - text: 前身の庁南町は、1889年（明治22年）に長南宿・蔵持村・坂本村が合併した武丘村が、翌1890年に町制施行のうえ改称した町であり、読みは同じ「ちょうなん」でも現在の長南町とは別の自治体だった
    kind: fact
    level: E4
    status: established
    sources:
    - upg-r11-chonan-uub-s
    - upg-r11-chonan-uub
  - text: 中世には長南武田氏の居城だった長南城（庁南城）を中心に城下町が形成され、江戸時代には街道沿いの宿場町「長南宿」として栄えたことを、町公式の総合計画が述べている
    kind: fact
    level: E2
    status: established
    sources:
    - v1-chonan-sougoukeikaku
  - text: 1889年に発足した武丘村の村名は、日本武尊が東征の折に太鼓森と呼ばれる丘に陣営を設けたという伝承から「武」「丘」の字を採ったと、『明治22年千葉県町村分合資料』にあることが紹介されている
    kind: legend
    level: E5
    status: established
    sources:
    - v1-chonan-wiki
  - text: 総務省の地方公共団体コードで、長南町のコードは124273と定められている
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 読みは同じ、字が違う二つの町名
    text: 長南町の前身は「庁南町」といった。読みはどちらも「ちょうなん」。庁南は上総武田氏の居城・庁南城にちなむ名とされるが、『日本歴史地名大系』は「庁南」の表記から官衙の南という説明も可能としており、語源は確定していない。1890年に武丘村から改称して生まれた。一方「長南」は、平安末期に長柄郡が南北に分かれたときに南半分を指した、中世以来の古い地名である。1955年の合併で新しい町名に選ばれたのは、城の名の「庁南」ではなく、古い地名の「長南」のほうだった。結果として町名は、65年ぶりに中世の表記へ戻ったことになる。
    sources:
    - v1-chonan-wiki
    - v1-chonan-sougoukeikaku
    - v1-chonan-kotobank-taikei
  relations:
  - pref/12
  - muni/12-長柄町
  unknowns:
  - 1955年の合併協議で、新町名に「庁南」でなく「長南」を選んだ理由を明記した公的記録は確認できなかった
  - 「長南」の語源は、長柄郡の南北分割に由来する説と官衙の南という説があり、専門資料でも確定していない
  updated: '2026-11-13'
- id: muni/12-長柄町
  code: '124265'
  names:
    ja: 長柄町
    reading: ながらまち
    aliases:
    - 長柄村
    - 日吉村
    - 水上村
  user_terms:
  - 長柄町の名前の由来
  - ながらまち
  - 長柄はなぜ「ながら」と読む
  - 長柄ダムのある町
  naming_type: 中心地名の継承
  formation: 分村・分立
  prefecture: 千葉県
  homonyms: []
  summary: 昭和30年（1955年）4月29日に長柄村・日吉村・水上村が合併して発足し、庁舎を旧長柄村役場に置いたことから「長柄」の名を継いだ町。「長柄」は上総国（かずさのくに）の古代の郡名で、8世紀の『万葉集』にすでに見える古い地名だが、その語源は確定していない。
  first_attestation:
    era: 天平勝宝7年
    year_western: 755
    document: 『万葉集』巻20（防人・若麻績部羊の歌）
    note: 『日本歴史地名大系』が紹介する「長柄郡」の使用例。郡の成立自体は明らかでないとされる
  claims:
  - text: 昭和30年（1955年）4月29日に長柄村・日吉村・水上村の3村が合併して長柄町が発足し、庁舎は旧長柄村役場に置かれた
    kind: fact
    level: E2
    status: established
    sources:
    - v1-nagara-town
  - text: これに先立ち、旧水上村の大字深沢と笠森は、地理的条件から昭和30年4月1日に分離して長南町に合併した
    kind: fact
    level: E2
    status: established
    sources:
    - v1-nagara-town
  - text: 『日本歴史地名大系』によれば、長柄郡は上総国の東部に置かれた古代以来の郡で、天平勝宝7年（755年）に筑紫国へ赴いた防人・長柄郡上丁の若麻績部羊（わかおみべのひつじ）が詠んだ歌が『万葉集』巻20に残り、「長柄郡」の名を伝えている
    kind: fact
    level: E3
    status: established
    sources:
    - v1-nagara-kotobank-taikei
  - text: 『日本歴史地名大系』によれば、『和名類聚抄』では長柄郡に奈加良（ナカラ）の訓が付き、郷として刑部（おさかべ）郷・管見郷・車持郷などが記された
    kind: fact
    level: E3
    status: established
    sources:
    - v1-nagara-kotobank-taikei
  - text: 『日本歴史地名大系』「長柄町」項によれば、現在の一宮川流域の東端にある国府里（こうり）は長柄郡衙が所在したことに由来する地名といわれ、刑部郷とともに古代の中心であったことがうかがえる
    kind: fact
    level: E3
    status: established
    sources:
    - v1-nagara-kotobank-machi
  - text: 『長柄町史』は、長柄の地名の起源について、邨岡良弼（むらおかりょうすけ）が『日本地理志料』で、『新撰姓氏録』に見える古代の氏族「長柄首（ながらのおびと）」の裔がこの地に居たことに因むと推測した説を紹介しているが、この説自体は推測にとどまる
    kind: fact
    level: E2
    status: indeterminate
    sources:
    - v1-nagaracho-shi
  - text: 長柄郡は平安末期に長北・長南の二郡に分かれたが江戸初期に長柄郡に復し、明治30年（1897年）に上埴生郡と合併して長生郡となった
    kind: fact
    level: E3
    status: established
    sources:
    - v1-nagara-kotobank-taikei
    - v1-chosei-kotobank-taikei
  - text: 総務省の地方公共団体コードで、長柄町のコードは124265と定められている
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 『万葉集』に残る防人のふるさと
    text: 天平勝宝7年（755年）、筑紫の防衛に赴く防人の中に、上総国長柄郡の若麻績部羊という男がいた。彼は「筑紫辺に舳（へ）向かる船の南時（なぎ）しかも 仕へ奉りて本郷に舳向かも」と、帰りの船がふるさとへ向かう日を願う歌を詠み、それが『万葉集』巻20に残った。「長柄」の名が文献に現れる最初期の例である。しかも現在の長柄町域には、長柄郡の役所（郡衙）が置かれたことに由来する「国府里」という地名まである。防人が出発した郡の中心は、まさにいまの長柄町のあたりだったと考えられている。
    sources:
    - v1-nagara-kotobank-taikei
    - v1-nagara-kotobank-machi
  relations:
  - pref/12
  - muni/12-長南町
  - muni/12-長生村
  unknowns:
  - 「長柄」の語源は確定しておらず、町史が紹介する長柄首説も推測にとどまる。細長い地形に由来するといった説明も、典拠のある形では確認できなかった
  - 1889年（明治22年）の町村制で旧長柄村がどの村々の合併で成立したかの詳細は、調査範囲では確認できなかった
  updated: '2026-11-13'
- id: muni/12-長生村
  code: '124231'
  names:
    ja: 長生村
    reading: ちょうせいむら
    aliases:
    - 一松村
    - 八積村
    - 高根村
  user_terms:
  - 長生村の名前の由来
  - ちょうせいむら
  - 千葉県で唯一の村
  - ながいきの村
  naming_type: 旧行政区画名の継承
  formation: 合併新設
  prefecture: 千葉県
  homonyms: []
  summary: 昭和28年（1953年）11月3日に一松村・八積村・高根村が合併して発足した、現在では千葉県で唯一の村。村名「長生」は構成3村のいずれの名でもなく、所属する長生郡の郡名と同じ名で、この郡名は明治30年（1897年）に長柄郡と上埴生郡が合併した際に生まれた。ただし、村名の命名理由を明記した合併当時の公的資料は確認できていない。
  first_attestation:
    era: 昭和28年
    year_western: 1953
    document: 一松村・八積村・高根村の合併による長生村の発足
    note: 村名の命名そのもの。名の材料となった郡名「長生」は明治30年（1897年）の長生郡成立に遡る
  claims:
  - text: 昭和28年（1953年）11月3日に八積村・高根村・一松村の合併により長生村が誕生した
    kind: fact
    level: E2
    status: established
    sources:
    - v1-chosei-youran2026
  - text: 『日本歴史地名大系』によれば、長生郡は明治30年（1897年）に、上埴生郡（旧埴生郡）と長柄郡が合併して成立した郡である
    kind: fact
    level: E3
    status: established
    sources:
    - v1-chosei-kotobank-taikei
  - text: 新村名「長生」は構成3村のいずれの名でもなく郡名と同一の名だが、郡名を採ったのか長寿の願いを込めたのかなど、命名理由を明記した公的資料は確認できていない
    kind: fact
    level: E2
    status: indeterminate
    sources:
    - v1-chosei-youran2026
    - v1-chosei-kotobank-taikei
  - text: 1954年から1955年にかけて、旧一松村の一部（船頭給・新地）と旧八積村の一部（宮原）が一宮町に編入され、村域は発足時からやや縮小した
    kind: fact
    level: E2
    status: established
    sources:
    - v1-chosei-youran2026
  - text: 現在、千葉県内の基礎自治体で「村」は長生村のみであり、村はこれを「千葉県で唯一の村」と位置付けている
    kind: fact
    level: E2
    status: established
    sources:
    - v1-chosei-soncho
  - text: 村と長生観光協会は、村名の「長生」を「ながいき」と読み替え、平和と安全の願いを込めた「長生（ながいき）観音」を建立するなど、村名を長寿のイメージで活用している
    kind: fact
    level: E2
    status: established
    sources:
    - v1-chosei-nagaiki
  - text: 総務省の地方公共団体コードで、長生村のコードは124231と定められている
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 県内唯一の「村」は、人口1万を超える
    text: 長生村は千葉県でただ一つの村だが、人口は1万3千人ほどで、県内のいくつかの町より多い。村はこの個性を前向きに使い、村名の「長生（ちょうせい）」を「ながいき」と読み替えて、「ながいきトマト」「ながいきそば」といったブランドや、長生（ながいき）観音のようなモニュメントに展開している。合併で生まれた郡名由来らしい村名が、いまは「長く生きる村」というキャッチフレーズの源泉になっている。
    sources:
    - v1-chosei-soncho
    - v1-chosei-nagaiki
  relations:
  - pref/12
  - muni/12-長柄町
  - muni/12-長南町
  unknowns:
  - 村名「長生」の命名理由（郡名を採ったのか、長寿への願いか）を明記した合併当時（1953年）の公的資料は確認できなかった
  - 郡名「長生」が長柄郡の「長」と埴生郡の「生」を組み合わせた合成名であるという説明は一般に流布しているが、専門資料による裏づけが取れなかった
  updated: '2026-11-13'
- id: muni/12-館山市
  code: '122050'
  names:
    ja: 館山市
    reading: たてやまし
    aliases:
    - 館山町
    - 館山北条町
  user_terms:
  - 館山ってどういう意味
  - 里見八犬伝のまち
  - 城山のあるまち
  - 南房総のまち
  naming_type: 中心地名の継承
  formation: 合併新設
  prefecture: 千葉県
  homonyms: []
  summary: 市名は館山町以来の地名「館山」を継いだもの。館山城が築かれた丘（城山）が「館山」の名の由来とされ、里見氏の築城以前から城館の構えられた山の名として呼ばれていたようである。1939年に館山北条町・那古町・船形町が合併して市制を施行した。
  first_attestation:
    era: 天正19年
    year_western: 1591
    document: 里見義康の館山城への移城（館山市公式資料）
    note: 「館山」の名自体は里見氏の築城（天正8年・1580年）以前から城館のあった丘の名として呼ばれていたとされるが、文書上の初出は特定できなかった
  claims:
  - text: 館山市立博物館は、館山城跡のある丘（城山）が「館山」の地名の由来になっていると説明する
    kind: fact
    level: E2
    status: established
    sources:
    - m5-tateyama-museum-shiroyama
  - text: 現在の城山と呼ばれる独立丘には、里見氏の築城以前にも城館が構えられ、ここから館山という名で呼ばれていたようであると紹介される
    kind: fact
    level: E4
    status: established
    sources:
    - upg-r9-tateyama-hanaumi
    - m5-tateyama-museum-shiroyama
  - text: 天正19年（1591年）に里見義康が居城を館山城に移し、その間に整備された城下町が現在の館山市の基礎となった（館山市公式）
    kind: fact
    level: E2
    status: established
    sources:
    - m5-tateyama-city-joseki
  - text: 1889年（明治22年）に館山町・上真倉村・下真倉村が合併して館山町となり、1914年（大正3年）に豊津村と合併して館山町となった（館山市公式）
    kind: fact
    level: E2
    status: established
    sources:
    - m5-tateyama-city-history
  - text: 1939年（昭和14年）11月3日、館山北条町・那古町・船形町の3町を廃止して市制を施行し、館山市が誕生した（館山市の統計資料の沿革。地方公共団体コードは122050）
    kind: fact
    level: E2
    status: established
    sources:
    - m5-tateyama-city-enkaku
    - k1-jlis-chiba
  - text: 1954年（昭和29年）5月3日、西岬・神戸・富崎・豊房・館野・九重の6か村を合併し、おおむね現在の館山市の市域が形成された（館山市の統計資料の沿革）
    kind: fact
    level: E2
    status: established
    sources:
    - m5-tateyama-city-enkaku
  - text: 館山は、里見氏を題材とした曲亭馬琴の『南総里見八犬伝』ゆかりの地であり、館山城跡のある城山の山頂に建つ模擬天守「館山城」は八犬伝博物館として八犬伝に関する資料を展示している
    kind: fact
    level: E2
    status: established
    sources:
    - upg-r9-tateyama-maruchiba
  column:
    title: 名前の由来になった山
    text: 館山という名は、市街地の南にそびえる城山（館山城跡）から来ていると博物館は説明する。里見氏が館山城を築く前から、この丘には城館があり、「館のある山」として呼ばれていたという。城下町として整備された港町が、そのまま山の名をまちの名に受け継ぎ、やがて里見氏の物語『南総里見八犬伝』の舞台として広く知られるようになった。
    sources:
    - m5-tateyama-museum-shiroyama
    - m5-tateyama-city-joseki
  relations:
  - pref/12
  unknowns:
  - 「館山」の文書上の初出（中世文書における用例）は特定できなかった
  - 語源については「館（城館）のある山」と解する博物館資料の説明があるが、専門辞典（角川日本地名大辞典・日本歴史地名大系）における語源記述の直接確認は未了
  updated: '2026-11-13'
- id: muni/12-香取市
  code: '122360'
  names:
    ja: 香取市
    reading: かとりし
    aliases:
    - 香取郡
    - 佐原市
    - 加止里
  user_terms:
  - かとり
  - 香取神宮のまち
  - 水郷のまち
  - 小江戸・佐原
  naming_type: 旧行政区画名の継承
  naming_note: 古代の下総国香取郡の郡名であり香取神宮の名でもある「香取」を、2006年の合併新市の名として採用した
  formation: 合併新設
  prefecture: 千葉県
  homonyms: []
  summary: 利根川下流・水郷地帯の市で、下総国一宮の香取神宮を擁する。市名「香取」は古代の郡名に由来し、平成18年（2006年）に佐原市と香取郡3町が合併した際に公募を経て採用された。核となる香取神宮は経津主大神を祭り、伊勢・鹿島と並んで「神宮」と称された古社である。旧中心地の佐原は水運で栄えた「小江戸」で、市名とは別の語源の層を持つ。
  first_attestation:
    era: 平安時代（10世紀）
    year_western: null
    document: 『和名類聚抄』の下総国香取郡に付けられた訓「加止里」（地名研究サイトの紹介による）
    note: 確認できる古い用例として『和名類聚抄』の訓を地名研究が紹介するもの（原文は未読）。香取郡の設置自体はそれ以前に遡るとされるが、設置年次の直接確認はできていない
  claims:
  - text: 総務省の全国地方公共団体コードで、香取市の団体コードは122360と定められている
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  - text: 香取神宮の公式サイトによれば、平成18年（2006年）3月27日に佐原市・小見川町・栗源町・山田町が合併して「香取市」が誕生した
    kind: fact
    level: E2
    status: established
    sources:
    - w5-katori-jingu
  - text: 合併時の新市名公募では「香取」のほか「かとり」「水郷」「北総」「大利根」「水郷香取」「あやめ」「利根」「小江戸」などが上位候補となり、新市名は「香取市」に決まった
    kind: fact
    level: E4
    status: established
    sources:
    - w5-katori-uub
  - text: 香取神宮の公式サイトによれば、神宮は経津主大神を祭神とし、中世以降は下総国の一宮とされ、「神宮」の称号は明治以前には伊勢神宮・香取神宮・鹿島神宮のみに許された
    kind: fact
    level: E2
    status: established
    sources:
    - w5-katori-jingu
  - text: 地名研究サイトによれば、「香取」は古代の下総国香取郡の郡名で、郡は古く香取神宮の神郡として設置され、郡内には神宮周辺の香取郷があった
    kind: fact
    level: E4
    status: established
    sources:
    - w5-katori-chimei-kenkyu
  - text: 地名研究サイトによれば、「香取」の名称には「鹿取」「紆托」「楫取」などの文字があてられた時期があり、『和名類聚抄』では「加止里」と訓じられ、郡名の由来には「かた糸（堅織）説」と「舟輯取説」があった
    kind: fact
    level: E4
    status: contested
    sources:
    - w5-katori-chimei-kenkyu
  - text: 地名研究サイトによれば、旧中心地「佐原」の名は、香取神宮の神職が祭事に用いる土器を現地で「オサハラ」と呼んだことが転じたものという説がある
    kind: fact
    level: E4
    status: indeterminate
    sources:
    - w5-katori-chimei-kenkyu
  column:
    title: 市の名は神宮から、町の名は土器から？
    text: 2006年の合併で「香取市」が生まれたとき、市名の候補には「水郷」「北総」「小江戸」なども並びましたが、選ばれたのは古代の郡名であり神宮の名でもある「香取」でした。ところが、市の中心市街である佐原の名は、それとはまったく違う由来が語られています。香取神宮の祭事に使う土器を、土地の人々が「オサハラ」と呼んだのが転じて「サワラ（佐原）」になったというのです。真偽はともかく、同じ市の中で、壮大な神話の神の名をいただく市名と、祭りの道具の呼び名に由来するという町名が重なっているのが面白いところです。佐原は利根川の水運で栄えた商家の町で、「小江戸」と呼ばれる町並みが残ります。
    sources:
    - w5-katori-chimei-kenkyu
    - w5-katori-jingu
  relations:
  - pref/12
  unknowns:
  - 香取郡の設置年次と「香取」の語源は、専門辞典（『角川日本地名大辞典』等）での直接確認ができておらず、地名研究サイトの紹介に拠っている
  - 『和名類聚抄』の「加止里」の訓は原文未読であり、紹介形で記録した
  updated: '2026-11-13'
- id: muni/12-鴨川市
  code: '122238'
  names:
    ja: 鴨川市
    reading: かもがわし
    aliases:
    - 加茂川
    - 鴨川町
    - 加茂郷
  user_terms:
  - かもがわ
  - 鯛の浦と日蓮生誕地のまち
  - 南房総の拠点都市
  naming_type: 自然地名から
  naming_note: 川名「加茂川」の継承。明治22年（1889年）の合併時に「加茂」を「鴨」に改めて町名とした
  formation: 合併新設
  prefecture: 千葉県
  homonyms: []
  summary: 南房総の太平洋岸の市。市名の起源は、市域を貫く川「加茂川」で、その名は古代の長狭郡加茂郷に遡ると推定される。明治22年（1889年）の合併で新町の名を決める際、「加茂」の字を「鴨」に改めて鴨川町とし、昭和46年（1971年）に3町の合併で市制を施行した。平成17年（2005年）には日蓮生誕の地・天津小湊町を合併した。市自身が「諸説があり確かなことは分からない」と断る、由来の層が重なった地名である。
  first_attestation:
    era: 平安時代（10世紀）
    year_western: null
    document: 『倭名類聚抄（和名類聚抄）』の安房国長狭郡「加茂郷」（鴨川市公式「市史ミニ講座」が『千葉県町村合併史』の記述として紹介）
    note: 「鴨川」の直接の初出ではなく、起源と推定される郷名の用例（原文は未読、紹介形）。市名としての「鴨川」は明治22年（1889年）の鴨川町成立に始まる
  claims:
  - text: 総務省の全国地方公共団体コードで、鴨川市の団体コードは122238と定められている
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  - text: 鴨川市公式サイトが引く『千葉県町村合併史』によれば、明治22年（1889年）の合併に当たり新町の名称は鴨川町と決定したが、これは新町内を加茂川が貫流し、また『倭名類聚抄』に長狭郡に加茂郷の郷名が見え、それが当地区であったと推定されることによる、史的所伝に基づく命名であった
    kind: fact
    level: E2
    status: contested
    sources:
    - w5-kamogawa-city-shishi
  - text: 鴨川市公式サイトが引く『鴨川沿革史』（昭和39年）によれば、この地方は古く賀茂（加茂）郷と称し、貫流する川は京都の鴨川に似ているというので加茂川と称したものを、明治22年4月の町村合併の時に「加茂」を「鴨」に作って鴨川町と名付けた
    kind: fact
    level: E2
    status: contested
    sources:
    - w5-kamogawa-city-shishi
  - text: 鴨川市公式サイトは、鴨川の由来について「諸説がありますが確かなことは分かりかねます」と結論づけている
    kind: fact
    level: E2
    status: established
    sources:
    - w5-kamogawa-city-shishi
  - text: 鴨川市統計書によれば、「長狭」の地名は『古事記』神武天皇の条に神八井耳命を長狭国造の祖とする記述があり、『古語拾遺』には長狭の地名伝承が載せられている
    kind: fact
    level: E2
    status: established
    sources:
    - w5-kamogawa-city-toukei
  - text: 鴨川市統計書によれば、昭和46年（1971年）3月31日に鴨川町・長狭町・江見町の3町が合併して市制を施行し、鴨川市が発足した
    kind: fact
    level: E2
    status: established
    sources:
    - w5-kamogawa-city-toukei
  - text: 鴨川市統計書によれば、平成17年（2005年）2月11日に鴨川市と天津小湊町が合併し、新しい鴨川市が誕生した
    kind: fact
    level: E2
    status: established
    sources:
    - w5-kamogawa-city-toukei
  column:
    title: 京都の鴨川に「似ている」から、加茂川になった？
    text: 鴨川市の名の由来には、二つの話が重なっています。一つは学問的な話で、平安時代の辞書『和名類聚抄』に安房国長狭郡の「加茂郷」が見え、この地がその加茂郷だったと推定されることから、川も郷も「加茂」と呼ばれたというもの。もう一つは『鴨川沿革史』の語る話で、市域を流れる川が京都の鴨川に似ているので「加茂川」と呼ばれるようになった、というものです。どちらにしても、明治22年（1889年）に新しい町の名を決めた人々は、「加茂」の字を「鴨」に替えて「鴨川町」としました。鴨の字を選んだ理由も含め、市は正直に「確かなことは分かりかねます」と書いています。なお、2005年に合併した天津小湊は日蓮の生誕地として知られる別の歴史を持つ町で、現在の鴨川市は由来の異なる二つの中心を持つ市になっています。
    sources:
    - w5-kamogawa-city-shishi
    - w5-kamogawa-city-toukei
  relations:
  - pref/12
  unknowns:
  - 「加茂川」の名が京都の鴨川に似ることから付いたという『鴨川沿革史』の説と、加茂郷に由来するという説のどちらが正しいかは、市の公式資料でも確定していない
  - 『倭名類聚抄』の長狭郡加茂郷の原文は未読であり、市の紹介する『千葉県町村合併史』の記述による
  updated: '2026-11-13'
