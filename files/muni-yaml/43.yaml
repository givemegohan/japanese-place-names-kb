records:
- id: muni/43-あさぎり町
  code: '435147'
  names:
    ja: あさぎり町
    reading: あさぎりちょう
    aliases: []
  user_terms:
  - あさぎり町の名前の由来
  - 朝霧の町
  - 中球磨の合併した町
  naming_type: 合併新設
  prefecture: 熊本県
  homonyms: []
  summary: 2003年4月1日、人吉盆地中央の中球磨5町村（上村・免田町・岡原村・須恵村・深田村）の合併で誕生した町。町名は住民公募から選ばれた平仮名名で、町公式は「朝の幻想的な霧が美しいことに由来してこの名がつきました」と説明する。熊本県内で唯一の平仮名表記の自治体名とされる。
  first_attestation:
    era: 平成15年
    year_western: 2003
    document: 中球磨5か町村の合併（合併協議会の決定）
    note: 町名そのものの誕生。2003年4月1日に新設合併で発足
  claims:
  - text: 平成15年（2003）4月1日、上村・免田町・岡原村・須恵村・深田村の5町村の合併により「あさぎり町」が誕生した
    kind: fact
    level: E2
    status: established
    sources:
    - r8-asagiri-pref
  - text: 町名は住民公募のうえ小委員会における選定を経て残った4つの最終候補（「あさぎり」「五彩町」「五福町」「なかくま町」）のひとつで、最終候補についての各町村の意向が合併協議会に持ち寄られ、協議の結果「あさぎり町」に決した
    kind: fact
    level: E2
    status: established
    sources:
    - r8-asagiri-pref
  - text: 決した大きな理由について熊本県資料は、当地域には球磨川の恵みを受けた豊かな自然環境があり、新鮮さや清らかさ、自然を表すイメージで好感が持てることであったと記す
    kind: fact
    level: E2
    status: established
    sources:
    - r8-asagiri-pref
  - text: 町公式資料は町の概要として「朝の幻想的な霧が美しいことに由来してこの名がつきました」と説明しており、町名は盆地に立つ「朝霧」を平仮名化したものと位置づけられる
    kind: fact
    level: E2
    status: established
    sources:
    - r8-asagiri-town
  - text: 合併前の中心だった免田町は、明治22年（1889）の町村制施行の際に免田村として発足し、昭和12年（1937）に町制を施行した町で、新町の役場は旧免田町役場に置かれた
    kind: fact
    level: E2
    status: established
    sources:
    - r8-asagiri-pref
  - text: あさぎり町は熊本県内では山都町・氷川町とともに「まち」でなく「ちょう」と読む数少ない町であり、県内の市町村名で唯一の平仮名表記の自治体である
    kind: fact
    level: E5
    status: established
    sources:
    - r8-asagiri-wiki
  - text: 総務省「地方公共団体コード一覧」では本町のコードは435147とされる
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 落ちた候補「五彩町」「五福町」「なかくま町」
    text: 新町名の最終候補には、「あさぎり」のほかに「五彩町」「五福町」「なかくま町」が残りました。5つの町村が集まったことを思わせる「五彩」「五福」と、地域の旧来の呼び名「中球磨」を縮めた「なかくま」。どれも合併の事情を映した名前でしたが、選ばれたのは構成町村のどれの名でも地名でもない、盆地の朝の霧という情景の名前でした。合併名にありがちな「どの町の名を残すか」の争いを、風景の名前で回避した例といえます。
    sources:
    - r8-asagiri-pref
  relations:
  - pref/43
  - muni/43-多良木町
  unknowns:
  - 公募で「あさぎり」を提案した応募者側の命名意図の記録は未確認（決定理由は県資料のイメージ論で確認）
  - 最終候補「五彩」「五福」の命名意図を公式に説明した資料は未確認
  updated: '2026-11-13'
- id: muni/43-上天草市
  code: '432121'
  names:
    ja: 上天草市
    reading: かみあまくさし
    aliases:
    - 大矢野町
    - 松島町
    - 姫戸町
    - 龍ヶ岳町
  user_terms:
  - かみあまくさ
  - 天草上島の市
  - 天草五橋の入口のまち
  - 大矢野・松島のある市
  naming_type: 合併新設
  prefecture: 熊本県
  homonyms: []
  summary: 平成16年（2004年）3月31日、天草郡の大矢野町・松島町・姫戸町・龍ヶ岳町の4町が新設合併して発足した市。市域は天草諸島の北側、天草上島と大矢野島などを中心とし、天草地域の玄関口にあたる。市名は公募をもとに「上天草」と「東天草」の2案に絞られ、「天草で一番上に位置しており、呼びやすく、親しみやすい」として「上天草」が選ばれた。基層にある「天草」は古代に遡る古い地名である。
  first_attestation:
    era: 平成16年
    year_western: 2004
    document: null
    note: 「上天草」の初出は平成の合併における命名そのもの。基層の「天草」は『続日本紀』天平16年（744年）の記事に見える古い地名とされるが、原文は未読のため紹介形で記録する
  claims:
  - text: 上天草市の地方公共団体コードは432121である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  - text: 平成16年（2004年）3月31日、天草郡の大矢野町・松島町・姫戸町・龍ヶ岳町が新設合併（対等合併）して上天草市が発足した
    kind: fact
    level: E2
    status: established
    sources:
    - s1-kamiamakusa-pref
  - text: 新市名は公募で集まった3,591件から選定が進められ、候補5点（天草上島・天草・上天草・新天草・東天草）を経て「上天草」と「東天草」の最終2案に絞られた
    kind: fact
    level: E2
    status: established
    sources:
    - s1-kamiamakusa-pref
  - text: 「上天草」が選ばれた理由は「天草で一番上に位置しており、呼びやすく、親しみやすい」ためであると合併協議の記録が伝える
    kind: fact
    level: E2
    status: established
    sources:
    - s1-kamiamakusa-pref
  - text: 市域は天草上島・大矢野島・湯島・維和島など大小の島々からなり、熊本県西部で有明海と八代海が接する天草地域の玄関口に位置する
    kind: fact
    level: E2
    status: established
    sources:
    - s1-kamiamakusa-pref
  - text: 基層の地名「天草」は古く、『続日本紀』天平16年（744年）の天草に関する記事が信頼できる史書での初出とされることが、Wikipedia「天草諸島」の紹介で述べられている
    kind: fact
    level: E5
    status: established
    sources:
    - r6-amakusa-wiki-shotou
  - text: 合併協議では新市役所の位置が難航し、発足時は大矢野町役場と松島町役場の双方を同格の本庁舎とする方式が採られた
    kind: fact
    level: E2
    status: established
    sources:
    - s1-kamiamakusa-pref
  column:
    title: 公募で「天草シオマネキ」が上位に入った市
    text: 新市名の公募で集まった案の上位10点には、「上天草」や「天草五橋（ごきょう）」と並んで「天草シオマネキ」という案が入っていた（市区町村変遷情報データベースの記録による）。有明海の干潟にすむ小さなカニの名を市名に推す声があったことになる。最終候補は「上天草」と「東天草」の2案に絞られ、位置の分かりやすさと呼びやすさで「上天草」が選ばれた。なお天草の下島側を中心とする市は、2年後の平成18年（2006年）に「天草市」として発足しており、「上」と「天草」の2つの市名が並ぶ形になった。
    sources:
    - s1-kamiamakusa-uub
    - s1-kamiamakusa-pref
  relations:
  - pref/43
  - muni/43-天草市
  unknowns:
  - 「天草」という地名そのものの語源（天草国造との関係を含む）は、今回の調査範囲では専門辞典で確認できなかった
  - 『続日本紀』天平16年（744年）記事の原文は未読のため、初出の主張は紹介形にとどめた
  updated: '2026-11-13'
- id: muni/43-五木村
  code: '435112'
  names:
    ja: 五木村
    reading: いつきむら
    aliases:
    - 五城
    - 居付
  user_terms:
  - 五木の子守唄の村
  - 五木村の名前の由来
  - 川辺川ダムの村
  naming_type: その他
  prefecture: 熊本県
  homonyms: []
  summary: 球磨郡北部の山村。村名の由来は確定しておらず、熊本県資料は「御器」が「五木」になった説、「五城」になった説、「居付」説をいずれも伝説の範囲として紹介し「明らかな由来はわからない」と結論づける。史料上の初出は建久3年（1192）の平河文書と村公式は伝える。村の名を全国に広めたのは地名の由来とは別層の「五木の子守唄」であり、1966年以来の川辺川ダム計画も村の歴史の大きな層である。
  first_attestation:
    era: 鎌倉時代（建久3年）
    year_western: 1192
    document: 平河文書
    note: 村公式「五木村の歴史」が「球磨の歴史に初めて五木が登場するのは、建久三年（一一九二）の平河文書です」と紹介するもの。原典は未読のため紹介として記録する
  claims:
  - text: 熊本県資料は村名の由来として、御器（ごき）が流れてきたことにより発見された村であるから「御器」とよばれ、それが「五木」となったという説を伝えている
    kind: legend
    level: E2
    status: established
    sources:
    - r8-itsuki-pref
  - text: 同資料はまた、五つの館によって統治されていたから「五城」とよばれ、それが「五木」となったという説も伝える。村内に残る寛政の頃（1790年代）の文書には「五城」の文字があるが、それ以前は「五木」となっているという
    kind: legend
    level: E2
    status: established
    sources:
    - r8-itsuki-pref
  - text: 落人が居ついた所であるから「居付」あるいは「居築」と呼ばれ、「五木」となったという説もあるが、同資料はこれらはいずれも国碑伝説の範囲を出ないようで、明らかな由来はわからないと結論づけている
    kind: legend
    level: E2
    status: established
    sources:
    - r8-itsuki-pref
  - text: 村公式の歴史解説によれば、球磨の歴史に「五木」が初めて登場するのは建久3年（1192）の平河文書である
    kind: fact
    level: E2
    status: established
    sources:
    - r8-itsuki-vill
  - text: 明治22年（1889）の町村制では四浦村（現在の相良村四浦）との組合役場を創設して発足し、明治29年（1896）4月から五木村としての独立の役場が認可された
    kind: fact
    level: E2
    status: established
    sources:
    - r8-itsuki-vill
  - text: 「五木の子守唄」は、子守奉公に出た幼い娘たちが親やふるさとへの思いを口ずさみ歌い継がれたもので、1935（昭和10）年にNHK熊本から全国放送され、1950（昭和25）年にレコードとなって全国的に知られるようになった。これは地名の由来とは別の、村の名を広めた層である
    kind: fact
    level: E4
    status: established
    sources:
    - r8-itsuki-jtb
  - text: 昭和41年（1966）に川辺川ダム建設が打ち出され、村は当初建設に反対し、その後はダム建設を前提とした新しい村づくりに取り組んできたが、近年はダム建設が見直され、ダムによらない治水を探る方向に変化し、ダム問題は現在も継続中である
    kind: fact
    level: E2
    status: established
    sources:
    - r8-itsuki-pref
  - text: 総務省「地方公共団体コード一覧」では本村のコードは435112とされる
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 由来は謎のまま、歌が運んだ村の名前
    text: 五木村の名前の由来は、県の資料自身が「明らかでない」と認めるほど謎に包まれています。それでも「五木」の名は全国に知られています。運んだのは子守唄でした。貧しい山村から人吉の商家や農家へ子守奉公に出た娘たちが歌った「五木の子守唄」は、昭和10年のラジオ放送と昭和25年のレコード化で一躍全国区になりました。地名の語源は分からなくても、歌が地名を運ぶことがある――その典型のような村です。
    sources:
    - r8-itsuki-jtb
    - r8-itsuki-pref
  relations:
  - pref/43
  unknowns:
  - 「五木」の語源は熊本県資料自身が「明らかな由来はわからない」としており、確定できない
  - 建久3年の平河文書における「五木」表記の原文確認は未了
  updated: '2026-11-13'
- id: muni/43-人吉市
  code: '432032'
  names:
    ja: 人吉市
    reading: ひとよしし
    aliases:
    - 人吉町
    - 人吉郷
  user_terms:
  - 相良氏の城下町
  - ひとよし
  - 球磨焼酎のまち
  - 人吉温泉のある市
  naming_type: 一部の地名
  prefecture: 熊本県
  homonyms: []
  summary: 肥後国球磨郡の地で、平安時代中期の『和名類聚抄』に球磨郡六郷の一つ「人吉郷」として現れる古い地名を受け継ぐ市。鎌倉時代初期に遠江から入った相良氏が明治維新まで約700年治めた城下町で、人吉藩の中心だった。昭和17年（1942年）2月11日に人吉町・藍田村・西瀬村・中原村の合併で市制を施行した。語源は「舎（宿）を『ひとよし』と読んだ」説が市公式に紹介されるが、確定はしていない。
  first_attestation:
    era: 平安時代中期
    year_western: 934
    document: 『和名類聚抄』（和名抄）球磨郡の郷名「人吉」
    note: 市公式は醍醐天皇の時代の「和名抄」に球磨郡の六郷（球玖・久米・人吉・東村・西村・千脱）の一つとして出ると紹介する。成立年は『和名類聚抄』の一般的な成立時期（承平年間）による
  claims:
  - text: 人吉市の地方公共団体コードは432032である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  - text: 「人吉」の地名は平安時代中期に現れ、醍醐天皇の時代の『和名抄』に球磨郡の六郷（球玖・久米・人吉・東村・西村・千脱）の一つとして記されていると市公式は紹介している
    kind: fact
    level: E2
    status: established
    sources:
    - r6-hitoyoshi-city
  - text: 人吉の語源には、日向・薩摩・佐敷を結ぶ交通の要衝にあった「舎（宿）」を「ひとよし」と読んでいたため「人吉」になったとする説がある
    kind: fact
    level: E2
    status: indeterminate
    sources:
    - r6-hitoyoshi-city
  - text: この地方の総称「球磨」は、南九州の部族「熊襲（くまそ）」が「熊縣（くまあがた）」となり、やがて地名の「球磨（くま）」になったものといわれている
    kind: fact
    level: E2
    status: indeterminate
    sources:
    - r6-hitoyoshi-city
  - text: 鎌倉時代初期に鎌倉幕府の地頭として遠江国から相良氏が入国し、明治維新まで約700年間この地を治めたため、人吉はその城下町として発展した
    kind: fact
    level: E2
    status: established
    sources:
    - r6-hitoyoshi-city
  - text: 明治4年（1871年）の廃藩置県では人吉県が置かれ、人吉の名は県名にもなった（のち八代県・白川県を経て熊本県）
    kind: fact
    level: E2
    status: established
    sources:
    - r6-hitoyoshi-city
  - text: 人吉市は昭和17年（1942年）2月11日、人吉町・藍田村・西瀬村・中原村の合併により、熊本県内で3番目に市制を施行して発足した
    kind: fact
    level: E2
    status: established
    sources:
    - r6-hitoyoshi-city
  column:
    title: 「宿」を「ひとよし」と読んだ町
    text: 人吉の語源として市が紹介するのは、少し変わった読みの話である。かつてこの盆地は日向・薩摩方面と佐敷を結ぶ交通の要衝で、旅人を泊める「舎（やど）」があった。その舎を土地の人は「ひとよし」と読んでいたため、地名が「人吉」になったという。漢字の「人」と「吉」が先にあったのではなく、「ひとよし」という音に後から字を当てたという見方である。定説とまではいえないが、「人柄の良い町」という印象とは別に、宿場の記憶が名に残っている可能性を示す説として読める。
    sources:
    - r6-hitoyoshi-city
  relations:
  - pref/43
  unknowns:
  - 「人良し（人の気質が良い）」などの他の民間語源説は、専門辞典での裏が取れず収録しなかった
  - 『和名類聚抄』の人吉郷の原文表記・読みは未確認（市公式の紹介による）
  updated: '2026-11-13'
- id: muni/43-八代市
  code: '432024'
  names:
    ja: 八代市
    reading: やつしろし
    aliases: []
  user_terms:
  - やつしろの由来
  - 八代妙見祭のまち
  - 不知火の海のまち
  naming_type: 一部の地名
  prefecture: 熊本県
  homonyms: []
  summary: 市名は旧八代郡の郡名以来の広域地名「八代」を継いだもの。語源については、上古に神所があったため「社（やしろ）」と呼ばれたという里俗の説が『肥後国誌』に記録され、八代市公式資料がこれを紹介する。1940年に市制を施行し、2005年の合併でも公募の末に「八代市」の名が維持された。
  first_attestation:
    era: 奈良時代
    year_western: 720
    document: 日本書紀
    note: 八代市公式資料（市勢要覧）が「やつしろ」の地名の文献上の初見を『日本書紀』とする。具体的な条文の直接確認は未了のため、市公式資料経由の初出として記録する
  claims:
  - text: 八代市公式資料によれば、「やつしろ」の地名が文献上、初見されるのは『日本書紀』である
    kind: fact
    level: E2
    status: established
    sources:
    - l6-yatsushiro-city-shisei
  - text: 語源について『肥後国誌』は里俗の説として、八代上古は神所であったので「社（ヤシロ）」と言い、後に「八代」の字が当てられたと記すと、八代市公式資料は紹介する
    kind: fact
    level: E2
    status: contested
    sources:
    - l6-yatsushiro-city-shisei
  - text: 「八代」は当該地域で郡名にも用いられていた地名で、地域に広く浸透していたと熊本県の合併関連資料は述べる
    kind: fact
    level: E2
    status: established
    sources:
    - l6-yatsushiro-pref-kumamoto
  - text: 1940年（昭和15年）9月1日、八代町を中心に周辺町村が合併して市制を敷き、八代市が誕生した（地方公共団体コードは432024）
    kind: fact
    level: E2
    status: established
    sources:
    - l6-yatsushiro-pref-kumamoto
    - b-cap-chiba-soumu-code
  - text: 2005年（平成17年）8月1日、八代市と八代郡の坂本村・千丁町・鏡町・東陽村・泉村の1市2町3村が合併し、新「八代市」となった
    kind: fact
    level: E2
    status: established
    sources:
    - l6-yatsushiro-city-shisei
  - text: 2005年の合併に際して新市名称が公募され、有効応募約4,500通の上位3点は「八代市」「やつしろ市」「新八代市」だった。地理的・歴史的知名度や地名を変える不利益の大きさが考慮され、「八代市」に決まった
    kind: fact
    level: E2
    status: established
    sources:
    - l6-yatsushiro-pref-kumamoto
  - text: 市域の球磨川河口にある水島と不知火は、『日本書紀』に記述のある、夜間航行で方角を見失った天皇の船を陸地へ導いたとされる「不知火」にまつわる景勝地として知られる
    kind: legend
    level: E2
    status: established
    sources:
    - l6-yatsushiro-pref-kumamoto
  column:
    title: 「社（やしろ）」が「八代」になるまで
    text: 八代の語源として市の公式資料が引く『肥後国誌』の説は、もともと「社（やしろ）」だったというものだ。神の社のある場所という呼び名に、後から「八代」の漢字が当てられたという説明である。里俗の説として記録されたもので、語源の決着とは言えないが、2005年の合併公募で「やつしろ市」が2位に入ったことにも表れているように、この読みと響き自体が地域の資産になってきた。漢字が変わっても音が残る地名の典型例と言える。
    sources:
    - l6-yatsushiro-city-shisei
    - l6-yatsushiro-pref-kumamoto
  relations:
  - pref/43
  unknowns:
  - 『日本書紀』のどの条文に八代の地名が見えるかの直接確認は未了（市公式資料の紹介に基づく）
  - 社（やしろ）説以外の語源学説（専門辞典の記述）の確認が未了
  updated: '2026-11-13'
- id: muni/43-南小国町
  code: '434230'
  names:
    ja: 南小国町
    reading: みなみおぐにまち
    aliases:
    - 小国郷
    - 南小国村
  user_terms:
  - 南小国町の名前の由来
  - 黒川温泉のある町
  - 小国郷の南半分
  naming_type: その他
  prefecture: 熊本県
  homonyms: []
  summary: 阿蘇郡の町で、北隣の小国町とともに中世以来の「小国郷」の地を分け合う。熊本県資料は「本町はその小国郷の南部に位置するので南小国とされた」と明記する。1889年に赤馬場村・満願寺村・中原村が合併して南小国村が発足し、1969年に町制を施行した。「小国」自体の起源には、阿蘇神社の神話に結びつく「国小なり」の伝説がある。
  first_attestation:
    era: 奈良時代
    year_western: null
    document: 『豊後国風土記』
    note: 熊本県資料（南小国町）が「『豊後風土記』に『肥後国阿蘇郡小国の峯』という言葉もある」と紹介するもの。原文での直接確認は未了のため紹介として記録する。「南小国」の名自体の初出は1889年の南小国村発足
  claims:
  - text: 小国の地名の起源として、阿蘇神社の祭神となった建磐龍命（健磐竜命）が阿蘇山上から放った矢の落ちた「御矢の原」の地主・大川片澄が、巡視に来た二神を迎えて「臣が国小なりといえども、青山四方を巡りて住み吉の国なり」と申し上げた言葉の中の「国小なり」から「小国」の地名ができたという説が、『小国郷史』からの引用として熊本県資料に伝えられる
    kind: legend
    level: E2
    status: established
    sources:
    - r8-minamioguni-pref
    - h3-oguni-k-town
  - text: 熊本県資料は、『豊後国風土記』に「肥後国阿蘇郡小国の峯」という言葉もあり、「小国」という名は古くから語り続けられてきたとし、この「小国」は小国郷一帯を指すものであったと紹介する
    kind: fact
    level: E2
    status: established
    sources:
    - r8-minamioguni-pref
  - text: 熊本県資料は「本町はその小国郷の南部に位置するので南小国とされた」と記し、町名が小国郷の南部という位置による命名であることを明記している
    kind: fact
    level: E2
    status: established
    sources:
    - r8-minamioguni-pref
  - text: 明治22年（1889）4月1日の町村制施行により、赤馬場村・満願寺村・中原村の3村が合併して南小国村が発足した
    kind: fact
    level: E2
    status: established
    sources:
    - r8-minamioguni-maff
  - text: 昭和44年（1969）11月1日に町制を施行して南小国町となった
    kind: fact
    level: E2
    status: established
    sources:
    - r8-minamioguni-env
  - text: 平成の合併では小国町との二町合併が協議されたが、平成16年（2004）7月の南小国町での住民投票の結果、合併反対が賛成を大きく上回り、法定協議会は解散した
    kind: fact
    level: E2
    status: established
    sources:
    - r8-minamioguni-pref
  - text: 総務省「地方公共団体コード一覧」では本町のコードは434230とされる
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 一つの郷が二つの町に
    text: 1889年、小国郷は北小国村と南小国村に分かれました。北側は1935年に町制施行と同時に郷の名そのままの「小国町」を名乗り、南側は1969年の町制施行でも「南小国町」と、南の字を手放しませんでした。2004年には二町の合併が住民投票にかけられましたが、南小国町側の反対多数で協議会は解散。一つの郷の名は、今も二つの町に分かれて残っています。
    sources:
    - r8-minamioguni-pref
    - h3-oguni-k-town
  relations:
  - pref/43
  - muni/43-小国町
  unknowns:
  - 『豊後国風土記』の「小国の峯」の原文確認は未了（熊本県資料経由の紹介にとどまる）
  - 1889年の合併時に「南小国村」の名がどう決められたかを示す一次記録は未確認
  updated: '2026-11-13'
- id: muni/43-南関町
  code: '433675'
  names:
    ja: 南関町
    reading: なんかんまち
    aliases:
    - 南の関
    - 大津山の関
    - 松風の関
    - 南関郷
  user_terms:
  - 南関町の名前の由来
  - 南関そうめんの町
  - 関所のあった町
  naming_type: その他
  prefecture: 熊本県
  homonyms: []
  summary: 玉名郡の町で、町名は古代・中世以来この地に置かれた関所に由来する。熊本県資料によれば、奈良時代には大水郷と呼ばれ駅家が置かれ、平安時代には「大津山の関」、鎌倉時代末期の史料には「南の関」の名が見える。1889年の合併で一度「南関町」が成立し、1955年の5町村合併でも、公募の中で最も親しまれた「南関」が選ばれて現町名となった。
  first_attestation:
    era: 鎌倉時代末期
    year_western: null
    document: 鎌倉時代末期の史料（熊本県資料が紹介）
    note: 熊本県資料が「鎌倉時代末期の史料には、『南の関』という名称が見えている」と紹介するもの。具体的な史料名は未確認。平安時代には「白間野荘の大津山の関」ともいわれたと同資料は記す
  claims:
  - text: 熊本県資料によれば、この町の地域は奈良時代には「大水郷（おおむつごう）」と呼ばれ、駅家（うまや）が置かれた
    kind: fact
    level: E2
    status: established
    sources:
    - r8-nankan-pref
  - text: 平安時代には荘園ができ「白間野荘の大津山の関」などといわれていたが、鎌倉時代末期の史料には「南の関」という名称が見えている、と同資料は記す
    kind: fact
    level: E2
    status: established
    sources:
    - r8-nankan-pref
  - text: 元来この地域は、松風の関または南の関と称される関所を有する交通の要衝であった、と同資料は説明する
    kind: fact
    level: E2
    status: established
    sources:
    - r8-nankan-pref
  - text: 明治22年（1889）の合併の際、新町名を「南関町」とした。すなわち「南関町」という自治体は明治期に一度成立していた
    kind: fact
    level: E2
    status: established
    sources:
    - r8-nankan-pref
  - text: 昭和30年（1955）4月1日、南関町・賢木村・大原村・坂下村・米富村の5町村が合併して、新しい「南関町」となった
    kind: fact
    level: E2
    status: established
    sources:
    - r8-nankan-town
  - text: 1955年の合併に際しては、関係住民から公募した名称の中で住民に最も親しまれ、関係5か町村も南関郷として行政的伝統を有することから「南関」を選んで「南関町」とした、と同資料は記す
    kind: fact
    level: E2
    status: established
    sources:
    - r8-nankan-pref
  - text: 総務省「地方公共団体コード一覧」では本町のコードは433675とされる
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 関所の町から県北の玄関口へ
    text: 南関は、古代の駅家、中世の「南の関」を経て、江戸時代には肥後藩主の参勤交代や領内巡視の休憩・宿泊所となる南関御茶屋（嘉永5年完成、国指定史跡）が置かれた交通の要所でした。今は九州自動車道の南関インターチェンジが「熊本県の北の玄関口」と呼ばれます。関所からインターチェンジへ、形は変わっても「肥後の北の入口」というこの地の役割は、千年以上続いていることになります。
    sources:
    - r8-nankan-pref
  relations:
  - pref/43
  - muni/43-和水町
  unknowns:
  - 「南の関」の名称が見えるという鎌倉時代末期の史料の具体名は未確認
  - 「松風の関」の名の由来は未確認
  updated: '2026-11-13'
- id: muni/43-南阿蘇村
  code: '434337'
  names:
    ja: 南阿蘇村
    reading: みなみあそむら
    aliases:
    - 南郷谷
  user_terms:
  - 南阿蘇村の名前の由来
  - 阿蘇の南の村
  - 白水村・長陽村・久木野村が合併した村
  naming_type: 合併新設
  prefecture: 熊本県
  homonyms: []
  summary: 2005年2月13日、白水村・久木野村・長陽村の3村の合併で誕生した村。村のある地域は古くから阿蘇カルデラ南部の「南郷谷」と呼ばれてきた。村名は公募で集まった1,262件から4候補に絞られ、住民に馴染み深い「南阿蘇」が合併協議会で全会一致で選ばれた。2016年の熊本地震で大きな被害を受けたが、それは村名の由来とは別の層である。
  first_attestation:
    era: 平成17年
    year_western: 2005
    document: 南阿蘇合併協議会の決定（2005年2月13日の3村合併）
    note: 村名そのものの誕生
  claims:
  - text: 平成17年（2005）2月13日、白水村・久木野村・長陽村の三村が合併し、南阿蘇村が誕生した
    kind: fact
    level: E2
    status: established
    sources:
    - r8-minamiaso-pref
  - text: 村は、古くから南郷谷と呼称される阿蘇カルデラの南部に位置する
    kind: fact
    level: E2
    status: established
    sources:
    - r8-minamiaso-pref
  - text: 新村名の決定にあたり、合併協議会は三村の小学生以上を対象に新村名を公募し、1,262件（567種）の応募があり、「阿蘇白川村」「阿蘇南郷村」「大阿蘇村」「南阿蘇村」の四種類が候補として残った
    kind: fact
    level: E2
    status: established
    sources:
    - r8-minamiaso-pref
  - text: 各村で検討された結果、地域住民に馴染み深い「南阿蘇」の呼称が良いとの意見が大勢で、最終的には合併協議会において全会一致で「南阿蘇村」に決定された
    kind: fact
    level: E2
    status: established
    sources:
    - r8-minamiaso-pref
  - text: 合併前の白水村・久木野村・長陽村の3村はいずれも明治22年（1889）に誕生した村で、以後平成の合併まで村制を継続した
    kind: fact
    level: E2
    status: established
    sources:
    - r8-minamiaso-vill
  - text: 平成28年（2016）の熊本地震では村内の文化財も多数が被害を受け、村は文化財の保存活用のための地域計画を策定している。これは村名の由来とは別の、村の近年の歴史の層である
    kind: fact
    level: E2
    status: established
    sources:
    - r8-minamiaso-vill
  - text: 総務省「地方公共団体コード一覧」では本村のコードは434337とされる
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 落ちた候補「阿蘇南郷村」と古い谷の名前
    text: 最終候補には、この谷の古い呼び名「南郷谷」にちなむ「阿蘇南郷村」も残っていました。歴史の深さでは南郷に分がありましたが、実際に人々が日常使っていたのは「南阿蘇」という呼び方でした。応募1,262件の頂点は、古名の復活ではなく、生きていた呼称の採用だったわけです。なお旧村の役場は「久木野庁舎」「白水庁舎」「長陽庁舎」と旧村名を残した分庁舎方式で使われ続けています。
    sources:
    - r8-minamiaso-pref
  relations:
  - pref/43
  unknowns:
  - 「南阿蘇」という呼称が地域名として使われ始めた時期の初出は未確認
  - 公募における各候補の応募件数の内訳は未確認
  updated: '2026-11-13'
- id: muni/43-合志市
  code: '432164'
  names:
    ja: 合志市
    reading: こうしし
    aliases:
    - 合志町
    - 西合志町
    - 合志郡
    - 皮石
    - 加波志
  user_terms:
  - こうし
  - 熊本市のベッドタウン
  - 本田技研熊本製作所のある市
  naming_type: 合併新設
  prefecture: 熊本県
  homonyms: []
  summary: 平成18年（2006年）2月27日、菊池郡の合志町と西合志町の2町が新設合併して発足した市。市名は、古代から明治29年（1896年）の菊池郡への編入まで続いた郡名「合志郡」に由来する。合志は古く「加波志（かはし）」と呼ばれ、『日本書紀』には「皮石郡」と見え、和銅6年（713年）の好字二字の詔ののち「合志」の表記が定着したと考えられている。熊本市に隣接し、人口が増え続ける住宅都市である。
  first_attestation:
    era: null
    year_western: null
    document: 日本書紀
    note: 県の市町村史資料が、合志郡の初見として『日本書紀』の「皮石郡」の記載を紹介している。原文は未読のため紹介形で記録する
  claims:
  - text: 合志市の地方公共団体コードは432164である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  - text: 平成18年（2006年）2月27日、菊池郡合志町と西合志町が新設合併して合志市が発足した
    kind: fact
    level: E2
    status: established
    sources:
    - s1-koshi-pref
  - text: 合志市の名は、古代より明治29年（1896年）まで続いた「合志郡」の郡名に由来する
    kind: fact
    level: E2
    status: established
    sources:
    - s1-koshi-pref
  - text: 合志郡の初見は『日本書紀』に見える「皮石郡」であると、熊本県の市町村史資料が紹介している
    kind: fact
    level: E2
    status: established
    sources:
    - s1-koshi-pref
  - text: 平安時代の辞書（『和名類聚抄』）には「合志」の読みとして「加波志（かはし）」が万葉仮名で記されていると、熊本県の市町村史資料が紹介している
    kind: fact
    level: E2
    status: established
    sources:
    - s1-koshi-pref
  - text: 和銅6年（713年）に郷郡の名に好字を当てるよう命じた詔の以後、「合志」の表記が定着したものと考えられている
    kind: fact
    level: E2
    status: established
    sources:
    - s1-koshi-pref
    - s1-koshi-city-gaiyo
  - text: かつての合志郡の郡域は現在の合志市にとどまらず、菊池市南部や菊池郡（大津町・菊陽町）の大部分、熊本市の一部にも及んでいた
    kind: fact
    level: E2
    status: established
    sources:
    - s1-koshi-pref
  - text: 市公式資料によれば、この地は古く「加波志」と称し、応神天皇期の地名改称によって「皮石」と改められたと伝えられる
    kind: fact
    level: E2
    status: established
    sources:
    - s1-koshi-city-gaiyo
  column:
    title: 「志を合わせる」市民憲章と、3度変わった名前
    text: 合志市の市民憲章は「わたしたちは『志』を『合』わせて協働によるまちづくりをすすめる」と書き起こし、「合志」の2文字を「志を合わせる」と読み解く言葉遊びを掲げている。もとの地名の歩みは、加波志（かはし）→皮石→合志と表記が移り、読みは「かはし」から「こうし」へ変わった。平成の合併では新市名の選定をめぐる大きな争いは伝えられず、2町が共有してきた古代郡名がそのまま市名になった。人口が増え続ける数少ない市として、憲章の言葉どおり「志を合わせる」まちづくりが続いている。
    sources:
    - s1-koshi-city-plan
    - s1-koshi-pref
  relations:
  - pref/43
  - muni/43-菊池市
  unknowns:
  - 「加波志（かはし）」という古い読みの語源（合志川など川の合流に因むか等）は、今回の調査範囲では確認できなかった
  - 『日本書紀』の「皮石郡」の原文は未読のため、初出の主張は県資料による紹介形にとどめた
  updated: '2026-11-13'
- id: muni/43-和水町
  code: '433691'
  names:
    ja: 和水町
    reading: なごみまち
    aliases: []
  user_terms:
  - 和水町の名前の由来
  - なごみ町の読み方
  - 菊水町と三加和町が合併した町
  naming_type: 合併新設
  prefecture: 熊本県
  homonyms: []
  summary: 2006年3月1日、菊水町と三加和町の合併で誕生した町。町名は公募をもとに選ばれた合成名で、熊本県資料は、三加和の「和」と菊水の「水」をとり、和を尊び清らかな水が流れ続ける町に、という願いを込めたと説明する。読みは「なごみ」。
  first_attestation:
    era: 平成18年
    year_western: 2006
    document: 菊水町・三加和町の合併（合併協議会の決定）
    note: 町名そのものの誕生。2006年3月1日に新設合併で発足
  claims:
  - text: 平成18年（2006）3月1日、菊水町と三加和町が合併し「和水町」が誕生した
    kind: fact
    level: E2
    status: established
    sources:
    - r8-nagomi-pref
  - text: 新町名について合併協議会は公募を行い、これを基に審議して最終候補を「菊和」「和水」「緑水」「夢民の里」「彩野」に絞り、ここから「和水町」と決定した
    kind: fact
    level: E2
    status: established
    sources:
    - r8-nagomi-pref
  - text: 選定の理由は、三加和の「和」と菊水の「水」をとって、和を尊び清らかな水がいつまでも流れ続ける町となるように、また、お互いの町をつなぐ川、水の流れ、住む人々の心も一つにつないで和ませて、豊かな町になることを希望して、というものであった
    kind: fact
    level: E2
    status: established
    sources:
    - r8-nagomi-pref
  - text: 旧・菊水町は昭和29年（1954）4月1日に江田町・花簇村・東郷村・川沿村の一町三村が合併してできた町であり、旧・三加和町は昭和30年（1955）4月1日に春富村・緑村・神尾村の三村が合併して三加和村となり、昭和43年（1968）に町制施行した町である
    kind: fact
    level: E2
    status: established
    sources:
    - r8-nagomi-pref
  - text: 「和水」の読み「なごみ」は、県資料の選定理由文にある「和ませて」という願いと響き合う読みであると考えられるが、読みの決定経緯そのものを直接記した資料は確認できていない
    kind: fact
    level: H
    status: inferred
    sources:
    - r8-nagomi-pref
  - text: 総務省「地方公共団体コード一覧」では本町のコードは433691とされる
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 最終候補に残った「夢民の里」
    text: 「和水」の競争相手には「菊和」「緑水」という無難な合成名に混じって、「夢民の里」「彩野」という、およそ自治体名らしくない候補が残っていました。公募らしい自由さですが、最終的に選ばれたのは二町の名から一文字ずつの、最も合併名らしい「和水」でした。なお旧三加和町は、日本マラソンの父・金栗四三の出身地としても知られます。
    sources:
    - r8-nagomi-pref
  relations:
  - pref/43
  - muni/43-南関町
  unknowns:
  - 「和水」の読み「なごみ」の決定経緯を直接記した資料は未確認
  - 合成元のひとつ「三加和」の名自体の由来（春富・緑・神尾の三村との関係）は未確認
  updated: '2026-11-13'
- id: muni/43-嘉島町
  code: '434426'
  names:
    ja: 嘉島町
    reading: かしままち
    aliases:
    - 嘉島村
    - 六嘉村
    - 大島村
  user_terms:
  - 嘉島町の名前の由来
  - 浮島神社の町
  - 六嘉と大島を合わせた地名
  naming_type: 合併新設
  prefecture: 熊本県
  homonyms: []
  summary: 1955年1月1日、六嘉村と大島村の合併で誕生した嘉島村が前身で、1969年2月1日に町制を施行した。町名は両村民の公募を参考に協議して決められた合成名で、六嘉の「嘉」と大島の「島」を組み合わせたもの。町内の名所である浮島（浮島熊野座神社の湧水の池）の「島」とは直接の関係はない。
  first_attestation:
    era: 昭和30年
    year_western: 1955
    document: 六嘉村・大島村の合併による嘉島村の発足
    note: 町名そのものの誕生。合成元の「六嘉」「大島」はそれ以前からの地名で、六嘉は上六嘉・下六嘉などの村名に、大島は1905年に大川村と上島村が合併してできた村名に残っていた
  claims:
  - text: 昭和30年（1955）1月1日、上益城郡大島村と六嘉村が合併し、嘉島村が誕生した
    kind: fact
    level: E2
    status: established
    sources:
    - r8-kashima-pref
    - r8-kashima-town
  - text: 昭和の合併時、六嘉村、大島村の伝統を残し、将来の発展を期するため、両村民からの公募による村名案を参考として協議した結果、六嘉の「嘉」と大島の「島」の二字を組み合わせて「嘉島村」と決定された
    kind: fact
    level: E2
    status: established
    sources:
    - r8-kashima-pref
  - text: 昭和44年（1969）2月1日、町制を施行し「嘉島町」となった
    kind: fact
    level: E2
    status: established
    sources:
    - r8-kashima-town
  - text: 大島村は明治38年（1905）10月に大川村と上島村が合併してできた村であり、町名の「島」はこの大島村に由来し、その「島」は上島の「島」にさかのぼる
    kind: fact
    level: E2
    status: established
    sources:
    - r8-kashima-town
  - text: 町内には清冽な清水をたたえる浮島があり浮島熊野座神社が鎮座し、六嘉湧水群・浮島は環境省の「平成の名水百選」に選定されている。町名の「島」は大島村に由来するもので、この浮島とは直接の関係はない
    kind: fact
    level: E2
    status: established
    sources:
    - r8-kashima-pref
  - text: 総務省「地方公共団体コード一覧」では本町のコードは434426とされる
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 浮島の「島」と嘉島の「島」は別物
    text: 嘉島町といえば、湧水の池に浮かぶように鎮座する浮島熊野座神社、「浮島さん」が町の象徴です。町名にも「島」の字があるので、この浮島から採った名前と思われがちですが、実際はそうではありません。町名の「島」は旧大島村の「島」で、さらにたどれば1905年に大川村と合併した上島村の「島」です。象徴の「島」と町名の「島」が、同じ町で偶然重なった例といえます。
    sources:
    - r8-kashima-pref
    - r8-kashima-town
  relations:
  - pref/43
  unknowns:
  - 「六嘉」の名自体の由来（「嘉」の字が選ばれた理由を含む）は未確認
  - 「大島」「上島」の名自体の由来も未確認
  updated: '2026-11-13'
- id: muni/43-多良木町
  code: '435058'
  names:
    ja: 多良木町
    reading: たらぎまち
    aliases:
    - 多良木村
  user_terms:
  - 多良木町の名前の由来
  - 相良氏が最初に住んだ町
  - 上球磨の中心地
  naming_type: その他
  prefecture: 熊本県
  homonyms: []
  summary: 球磨郡東部の町で、人吉盆地の東の中心地。鎌倉時代に相良氏が領知して最初に住み着いた地と町公式は伝える。1889年に多良木村として発足し、1926年に町制施行、1955年に黒肥地村・久米村と合併して現在の多良木町となった。「多良木」という地名自体の語源は、調査した公的・専門資料では確認できず未詳である。
  first_attestation:
    era: 明治22年
    year_western: 1889
    document: 町村制施行による多良木村の発足
    note: 自治体名として確認できる初出。地名「多良木」自体は鎌倉時代の相良氏領知の頃には存在したと考えられるが、文書上の初出は未確認。町内には『和名類聚抄』にみえる球磨郡の郷のうち東村郷・久米郷があったと町公式は伝える
  claims:
  - text: 町公式によれば、1100年前に編集された百科事典『和名類聚抄』には、球磨郡に六つの郷があり、このうちの東村郷・久米郷が多良木町内にあったとされている
    kind: fact
    level: E2
    status: established
    sources:
    - r8-taragi-town
  - text: 鎌倉時代、遠江国の武士である相良氏が多良木を領知した。相良氏は人吉荘の地頭になって勢力を大きくし、多良木はその相良氏が最初に住み着いたところで、相良家発展の足掛かりとなった土地である、と町公式は説明する
    kind: fact
    level: E2
    status: established
    sources:
    - r8-taragi-town
  - text: 明治22年（1889）の市町村制施行により多良木村・黒肥地村・久米村が発足し、大正15年（1926）5月1日に多良木村が町制を施行した
    kind: fact
    level: E2
    status: established
    sources:
    - r8-taragi-town
  - text: 昭和30年（1955）4月1日、町村合併促進法により多良木町・黒肥地村・久米村が合併し、現在の多良木町となった
    kind: fact
    level: E2
    status: established
    sources:
    - r8-taragi-town
  - text: 「多良木」という地名の語源は、町公式の概要や『日本歴史地名大系』の多良木町の解説でも説明されておらず、未詳である
    kind: fact
    level: E3
    status: indeterminate
    sources:
    - r8-taragi-town
    - r8-taragi-kotobank
  - text: 総務省「地方公共団体コード一覧」では本町のコードは435058とされる
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 相良700年の出発点
    text: 遠江から来た相良氏が最初に住み着いたのが多良木で、その後人吉に移って約700年にわたり球磨地方を治めました。2015年4月、人吉球磨地域は「相良700年」が紡いだ文化を伝える地域として日本遺産に認定されています。町の中心を少し外れたところには、相良氏初期の居館跡とされる多良木の遺跡群が残り、町の名前の古さそのものが相良氏の歴史の起点を示しています。
    sources:
    - r8-taragi-town
  relations:
  - pref/43
  - muni/43-あさぎり町
  unknowns:
  - 「多良木」の語源は未確認（公的・専門資料に語源の説明が見当たらない）
  - 地名「多良木」の文書上の初出（鎌倉時代以前かどうかを含む）は未確認
  updated: '2026-11-13'
- id: muni/43-大津町
  code: '434035'
  names:
    ja: 大津町
    reading: おおづまち
    aliases: []
  user_terms:
  - おおづまち
  - 熊本の大津
  - ホンダの工場がある町
  - からいもの町
  naming_type: その他（中世以来の地名の継承。1956年の合併でも旧町名をそのまま受け継いだ）
  prefecture: 熊本県
  homonyms: []
  summary: 熊本市東方の菊池郡の町。室町時代に大津十郎を名乗る武士が城を築いた頃から「大津」と呼ばれるようになったと伝わり、江戸時代には藩の行政区画「大津手永（郷）」の名でもあった。1956年の合併でも、一帯の通称だった「大津町」の名がそのまま受け継がれた。滋賀県大津市（おおつ）とは読みが異なる。
  first_attestation:
    era: 戦国時代
    year_western: null
    document: 『肥後国誌』（Wikipedia「大津町」が紹介）
    note: 合志氏の一族「大津十朗義兼」という人名の形で見えるもので、地名としての用例そのものかは判然としない。県の合併資料が伝える伝承では「大津十郎義廉」とする
  claims:
  - text: 総務省の全国地方公共団体コードで、大津町の団体コードは434035と定められている
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  - text: 熊本県の市町村合併資料は、足利時代の初めに平真城村真木に下っていた佐々木氏の支族・大津十郎義廉を城主とした舞鶴城が東嶽に築城され、その当時から一小部落を作り、自然「大津」といわれるようになったと伝える
    kind: legend
    level: E2
    status: established
    sources:
    - r9-pref-ozu
  - text: Wikipedia「大津町」は『肥後国誌』を引き、戦国期に合志氏の一族が東嶽城（現・日吉神社）を築き大津十朗義兼と名乗っていることから、既にこの頃には大津の地名があったようだとし、県の合併資料の伝承（大津十郎義廉・舞鶴城）とは人名の字や城の名が細部で異なる。また『合志川芥』には「此の所は『火児国大水（ヒゴノクニオオズ）』と呼ばれていた」とあるとする
    kind: fact
    level: E5
    status: contested
    sources:
    - r9-ozu-wiki
  - text: 旧藩時代、本町地域は合志郡代の支配下にあり「大津手永」に属していた（明治3年の藩政改革で手永は郷と改称され「大津郷」）。「大津」は集落の名であると同時に、藩政期の行政区画の名でもあった
    kind: fact
    level: E2
    status: established
    sources:
    - r9-pref-ozu
  - text: 1879年（明治12年）に行政区画として発足した合志郡の郡域には大津町の大部分が含まれていたが、現在の大津町は菊池郡に属する
    kind: fact
    level: E5
    status: established
    sources:
    - r9-ozu-wiki
  - text: 1889年（明治22年）4月1日、市制町村制の施行により、もとからあった大津町に室町・灰塚村・新村・引水村の区域をあわせて大津町が生まれた
    kind: fact
    level: E5
    status: established
    sources:
    - r9-ozu-wiki
  - text: 1956年（昭和31年）8月1日、陣内村・平真城村・錦野村などと合併して新しい大津町が発足した際も、歴史的にゆかりのある名称で従来から新町一帯は通称「大津」で通っていたことから、「大津町」の名がそのまま受け継がれた
    kind: fact
    level: E2
    status: established
    sources:
    - r9-pref-ozu
    - r9-ozu-wiki
  column:
    title: 「大水」とも書かれた大津
    text: 大津十郎の伝承が語られる一方で、「大津」という名の確かな語源は実は分かっていない。古い随筆『合志川芥』には、この地が「火児国大水（ヒゴノクニオオズ）」と呼ばれていたという記述があるとされ、「津」ではなく「水」の字で結びつけられた時代もあったことになる。同じ「大津」でも、近江の大津市は「おおつ」、熊本の大津町は「おおづ」と読みが違う。語源の決め手を欠いたまま、城主の姓と結びついた伝承と、手永という行政区画の名とが、名の古さを物語っている。
    sources:
    - r9-ozu-wiki
    - r9-pref-ozu
  relations:
  - pref/43
  unknowns:
  - 「大津」の語源そのものは確定しておらず（Wikipedia「大津町」も「大津の名前の由来はよくわからない」とする）、「津」が具体的に何を指したのか（港・渡津・水辺の地形など）は確認できなかった
  - 大津十郎伝承の原資料である『肥後国誌』等の原文は未読で、義廉・義兼の表記の異同も原文では確認できていない
  updated: '2026-11-13'
- id: muni/43-天草市
  code: '432156'
  names:
    ja: 天草市
    reading: あまくさし
    aliases:
    - 本渡市
    - 牛深市
    - 天草町
  user_terms:
  - 天草の中心の市
  - あまくさ
  - 天草四郎のふるさと
  - イルカウォッチングの市
  naming_type: 合併新設
  prefecture: 熊本県
  homonyms: []
  summary: 平成18年（2006年）3月27日、本渡市・牛深市の2市と有明町・御所浦町・倉岳町・栖本町・新和町・五和町・天草町・河浦町の8町が合体して発足した市。市名は旧2市のどちらでもなく、島々全体の名であり肥後国天草郡に遡る「天草」を採った。「天草」の確かな初出は天平16年（744年）の『続日本紀』で、それより古いとする『先代旧事本紀』の「天草国造」の記事には偽書説がある。
  first_attestation:
    era: 天平16年
    year_western: 744
    document: 『続日本紀』
    note: 地震・洪水による天草郡の被害を記した記事が、信頼できる史書における「天草」の初出とされる（二次資料の紹介による）。『和名類聚抄』では郡名を「安万久佐」と表記した
  claims:
  - text: 天草市の地方公共団体コードは432156である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  - text: 天草市は平成18年（2006年）3月27日、本渡市・牛深市・有明町・御所浦町・倉岳町・栖本町・新和町・五和町・天草町・河浦町の2市8町の合体で発足した
    kind: fact
    level: E2
    status: established
    sources:
    - r6-amakusa-estat
    - r6-amakusa-city-enkaku
  - text: 新市名には旧中心市の本渡・牛深のいずれでもなく、諸島全体を指し古代の郡名でもある「天草」が採られた
    kind: fact
    level: E2
    status: established
    sources:
    - r6-amakusa-city-enkaku
  - text: 信頼できる史書における「天草」の初出は『続日本紀』で、天平16年（744年）に地震と洪水による天草郡の被害（田290余町・民家470余戸など）が記された
    kind: fact
    level: E5
    status: established
    sources:
    - r6-amakusa-wiki-shotou
  - text: 『先代旧事本紀』には成務天皇の時代に建島松命が天草国造に任じられたとあるが、同書には偽書説が濃厚で、この記事をもって天草の初出とすることはできない
    kind: fact
    level: E5
    status: contested
    sources:
    - r6-amakusa-wiki-shotou
  - text: 市域は元来すべて肥後国天草郡であり、天正9年（1581年）までに長島・獅子島などが薩摩国出水郡へ移ったため、現在の天草諸島は熊本・鹿児島の2県にまたがっている
    kind: fact
    level: E5
    status: established
    sources:
    - r6-amakusa-wiki-shotou
  - text: 島原の乱ののち天草は幕府直轄領（天領）となり富岡に代官所が置かれ、近代には崎津集落などを擁するキリシタンの歴史の地として知られる
    kind: fact
    level: E5
    status: established
    sources:
    - r6-amakusa-wiki-shotou
  column:
    title: 744年初出の名を、2006年の新市が受け継いだ
    text: 天草市の合併は2市8町という大規模なもので、中心だった本渡市と牛深市はどちらも市名を譲った。その受け皿になったのが、島全体の名「天草」である。この名は『続日本紀』の744年の記事にまで遡れる一方で、『先代旧事本紀』が伝える「天草国造」の話は、その本自体に偽書説があり鵜呑みにできない。古さを競うなら新しいほうの記録を正直に採る――天草の初出はそう線引きされる。それでも1,260年以上の歴史を持つ郡名が、平成の合併市の名として再び表舞台に立ったことになる。
    sources:
    - r6-amakusa-wiki-shotou
    - r6-amakusa-city-enkaku
  relations:
  - pref/43
  - muni/43-上天草市
  - muni/42-雲仙市
  - muni/42-南島原市
  unknowns:
  - 合併協議会における新市名の候補（公募結果など）は確認できなかった
  - 「天草」の語源（天の草・海士の民草など諸説ある）は専門辞典で裏が取れず、確定説はないものとして記録した
  - 『続日本紀』744年記事の原文は未確認であり、二次資料の紹介によっている
  updated: '2026-11-13'
- id: muni/43-宇土市
  code: '432113'
  names:
    ja: 宇土市
    reading: うとし
    aliases:
    - 宇土町
    - 宇土郡
    - 浮土
  user_terms:
  - うと
  - 小西行長の城下町
  - 宇土城・鶴城のまち
  - 御輿来海岸のある市
  naming_type: その他（中世以来の地名「宇土」を継承し、宇土町が市制を施行）
  prefecture: 熊本県
  homonyms: []
  summary: 宇土半島の北半分を占める市で、名は古代の宇土郡に遡る。「宇土」の由来に定説はなく、「海門」や「穿戸」の転訛とする説、「浮土」（島の意）とする説、五穀の実りから「殖処」が起こったとする説などが併記される。中世には宇土庄・宇土城をめぐって宇土氏・名和氏が拠り、天正16年（1588年）に小西行長が城山に新城を築いて城下町を整えた。昭和33年（1958年）に宇土町が市制を施行して宇土市となった。
  first_attestation:
    era: 天平勝宝2年
    year_western: 750
    document: null
    note: 市公式年表が、天平勝宝2年（750年）に宇土郡大宅郷の戸主の名が見えること、延暦9年（790年）の石碑に宇土郡名があることを紹介する。原典の特定・原文確認は未了のため紹介形で記録する
  claims:
  - text: 宇土市の地方公共団体コードは432113である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  - text: 「宇土」の名は古く、市公式年表は天平勝宝2年（750年）に宇土郡大宅郷の戸主の名が見えること、延暦9年（790年）の石碑に宇土郡の名があることを紹介している
    kind: fact
    level: E2
    status: established
    sources:
    - s1-uto-city-nenpyo
  - text: 「宇土」の由来について定説はなく、熊本県の市町村史資料は、地形に求めて「海門」または「穿戸」の転訛とする説、島を意味して「浮土」と書いたとする説、五穀がよく実ったことから「殖処」が起こったとする説などを併記している
    kind: fact
    level: E2
    status: contested
    sources:
    - s1-uto-pref
  - text: 古記によれば宇土は「浮土」とも書かれ、古くから「宇土じま」と呼ばれて九州本土とは別の島のように思われていたと、熊本県の市町村史資料が伝える
    kind: fact
    level: E2
    status: established
    sources:
    - s1-uto-pref
  - text: 中世、宇土庄の庄官であった宇土氏（菊池氏の一族と伝えられる）が西岡台の宇土城の最初の城主とされ、宇土氏は文亀3年（1503年）に滅び、のち名和氏が宇土を拠点とした
    kind: fact
    level: E2
    status: established
    sources:
    - s1-uto-city-museum
  - text: 天正16年（1588年）に肥後南半へ入部した小西行長は、西岡台の旧城から城山へ城を移して本格的な城郭（宇土城、一名鶴城）と城下町を築き、その天守は関ヶ原の戦いののち熊本城へ移築されて宇土櫓として現存する
    kind: fact
    level: E2
    status: established
    sources:
    - s1-uto-pref
  - text: 昭和の合併と市制施行にあたっては、合併関係町村の中核であり由緒ある名であったことから宇土町の名が継承され、昭和33年（1958年）に宇土市が発足した
    kind: fact
    level: E2
    status: established
    sources:
    - s1-uto-pref
  column:
    title: 日本最古の上水道が今も流れる城下町
    text: 宇土の城下町を潤したのは、細川氏が轟水源から引いた総延長約5キロの「轟泉水道」である。県の市町村史資料によれば、藩主細川氏が良好な飲料水の不足を補うために設けたもので、延宝・元禄期の整備と細川興文による明和6年（1769年）の大改修を経て、今なお生活用水として使われている。「現存する日本最古の上水道」と紹介されるこの水道は、小西行長が築き加藤・細川と受け継がれた城下町の暮らしを、400年以上たった今も支えている。
    sources:
    - s1-uto-pref
  relations:
  - pref/43
  - muni/43-宇城市
  - muni/43-上天草市
  unknowns:
  - 「宇土」の語源は諸説あり、いずれの説も裏付ける一次資料を今回の調査では確認できなかった
  - 天平勝宝2年（750年）の宇土郡大宅郷の記録の原典（戸籍等の文書名）は特定できなかった
  updated: '2026-11-13'
- id: muni/43-宇城市
  code: '432130'
  names:
    ja: 宇城市
    reading: うきし
    aliases:
    - 三角町
    - 不知火町
    - 松橋町
    - 小川町
    - 豊野町
  user_terms:
  - うき
  - 三角西港のある市
  - 不知火の見えるまち
  - 松橋が中心の市
  naming_type: 合併新設
  prefecture: 熊本県
  homonyms: []
  summary: 平成17年（2005年）1月15日、宇土郡の三角町・不知火町と下益城郡の松橋町・小川町・豊野町の5町が新設合併して発足した市。市名は公募で最多の支持を集めた「宇城」で、宇土郡と下益城郡にまたがるこの地域は、もともと広く「宇城」と呼ばれて住民に定着していた。基層にある「宇土」は北隣の宇土市の古代郡名に遡り、「城」は益城（ましき）の「城」とする理解が一般的だが、協議会記録としての明示は「宇城」という地域呼称の定着に求められている。
  first_attestation:
    era: 平成17年
    year_western: 2005
    document: null
    note: 「宇城」という市名の初出は平成の合併における命名そのもの。ただし「宇城」は合併以前から宇土・下益城地域を指す地域呼称として定着していたと県資料が述べる
  claims:
  - text: 宇城市の地方公共団体コードは432130である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  - text: 平成17年（2005年）1月15日、宇土郡三角町・不知火町、下益城郡松橋町・小川町・豊野町の五町が新設合併して宇城市が発足した
    kind: fact
    level: E2
    status: established
    sources:
    - s1-uki-pref
  - text: 新市名は宇城西部五町合併協議会が平成14年（2002年）11月から平成15年（2003年）1月にかけて公募し、県内外から4,616件（1,955種類）の有効応募があった
    kind: fact
    level: E2
    status: established
    sources:
    - s1-uki-pref
  - text: 候補は「宇城市」「うき市」「中九州市」「肥後市」の4つに絞られ、合併協議会で「宇城市」に決定された
    kind: fact
    level: E2
    status: established
    sources:
    - s1-uki-pref
  - text: 「宇城」が選ばれた背景として、五町が属した宇土郡・下益城郡にまたがる地域を広く「宇城」と呼ぶことが住民に定着しており、公募でも最多の得票であったことが挙げられる
    kind: fact
    level: E2
    status: established
    sources:
    - s1-uki-pref
  - text: 市名の「宇」は宇土郡、「城」は下益城郡の「城（益城）」から採った合成名と一般に説明されるが、県の市町村史資料が決定理由として明記するのは、地域呼称「宇城」の定着と公募での最多得票である
    kind: fact
    level: E2
    status: contested
    sources:
    - s1-uki-pref
  - text: 市西端の三角には明治期に築かれた三角西港があり、全国で唯一現存する石積埠頭を持つ港として知られる。また旧暦8月1日の深夜には不知火海に「不知火」と呼ばれる光の現象が見られることで知られる
    kind: fact
    level: E2
    status: established
    sources:
    - s1-uki-pref
  column:
    title: 候補に「中九州市」と「肥後市」があった
    text: 新市名の最終候補は「宇城市」「うき市」「中九州市」「肥後市」の4つだった。九州の真ん中を名乗る案と、旧国名を掲げる案を退けて選ばれたのは、住民が日頃からこの一帯を呼んできた「宇城」という地域の名前である。合併協議会の名自体が「宇城西部五町合併協議会」であったことからも分かるように、「宇城」は合併のために作られた新語ではなく、宇土半島の付け根から内陸へ広がる地域を指す言葉として先に生きていた。行政の広域圏の名前（宇城地域・宇城広域連合）が、そのまま市名になった例である。
    sources:
    - s1-uki-pref
  relations:
  - pref/43
  - muni/43-宇土市
  - muni/43-上天草市
  unknowns:
  - 地域呼称としての「宇城」がいつ頃から使われ始めたかは、今回の調査範囲では確認できなかった
  - 「宇＝宇土・城＝益城」の合成説を合併協議会自身が説明した一次資料は確認できなかった
  updated: '2026-11-13'
- id: muni/43-小国町
  code: '434248'
  names:
    ja: 小国町
    reading: おぐにまち
    aliases:
    - 小国郷
    - 北小国村
  user_terms:
  - 小国町の名前の由来
  - 国小なりの伝説
  - 小国郷とはどこ
  naming_type: その他
  prefecture: 熊本県
  homonyms:
  - muni/06-小国町
  summary: 阿蘇の北側に広がる小国郷の名の継承。中世の文書に「小国之分」と見える地域で、1889年に北小国村・南小国村に分かれ、1935年に北小国村が町制施行と同時に「小国町」へ改称した。町公式は地名の起こりとして、健磐竜命にまつわる「臣が国小なり」という言葉から「小国」が生まれたという伝説を、『小国郷史』由来の話として伝える。
  first_attestation:
    era: 室町時代（文明16年）
    year_western: 1484
    document: 阿蘇家文書「阿蘇十二社同霜宮最花米注文」（「小国之分」）
    note: 『日本歴史地名大系』の記載として阿蘇ペディアが紹介するもの。原典は未読のため紹介として記録する。より古い用例として『豊後国風土記』の「小国の峯」が南小国町の町名由来（熊本県資料）に紹介されるが、原文での確認は未了
  claims:
  - text: 阿蘇神社の祭神・健磐竜命が阿蘇山上から放った矢の落ちた御矢の原（現在の宮原）の地主・大河片澄が、巡視に来た二神を迎えて「臣が国、小なりと雖も、青山四方を巡りて住み吉の国なり」と申し上げた。その言葉の中の「国小なり」から「小国」の地名が生まれたという話が、『小国郷史』からの引用として町公式・熊本県資料に伝えられる
    kind: legend
    level: E2
    status: established
    sources:
    - h3-oguni-k-town
    - h3-oguni-k-pref
  - text: 文明16年（1484年）の阿蘇家文書「阿蘇十二社同霜宮最花米注文」に「小国之分」の記載があり、郷内の二十数か村の名が見えることを『日本歴史地名大系』が紹介していると阿蘇ペディアが伝える
    kind: fact
    level: E4
    status: established
    sources:
    - h3-oguni-k-asopedia
  - text: 中世の小国郷は阿蘇本社領に属し、満願寺・宮原・上田・北里などの村が含まれていたと阿蘇ペディアが伝える
    kind: fact
    level: E4
    status: established
    sources:
    - h3-oguni-k-asopedia
  - text: 明治3年（1870年）に旧25か村が9か村となり、明治22年（1889年）の町村制施行で北小国村（6か村）と南小国村（3か村）に分かれた
    kind: fact
    level: E2
    status: established
    sources:
    - h3-oguni-k-town
  - text: 北小国村は昭和10年（1935年）4月1日に町制を施行し「小国町」と改称した。町公式は、人口11,000人余で県内で唯一の人口1万人以上の村だったことなどを、その背景として記す
    kind: fact
    level: E2
    status: established
    sources:
    - h3-oguni-k-town
  - text: 山形県小国町とは、山に囲まれた盆地の郷名「小国」を継ぐ点で共通する。異なるのは、本町では「国小なり」の言葉に由来するという伝説が『小国郷史』以来の説明として公式に伝えられている点で、山形側には対応する命名伝説が確認できない
    kind: fact
    level: E3
    status: established
    sources:
    - h3-oguni-k-town
    - h3-oguni-jk
  - text: 総務省「地方公共団体コード一覧」では本町のコードは434248とされる
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 矢が落ちた原と「御矢の原」
    text: 伝説で健磐竜命の矢が落ちたとされる「御矢の原」は、現在の宮原にあたると町は説明します。宮原は今も町の中心地で、役場や商店が集まります。地名の伝説が現在の中心地と結びついて語り継がれているのが、この町の伝承の特徴です。
    sources:
    - h3-oguni-k-town
    - h3-oguni-k-pref
  relations:
  - pref/43
  - muni/06-小国町
  unknowns:
  - 「小国郷」の文書上の初出の確定（『豊後国風土記』の「小国の峯」の原文確認を含む）
  - 伝説とは別に、歴史地名としての「小国」の成立理由を専門資料がどう説明するか
  updated: '2026-11-13'
- id: muni/43-山江村
  code: '435121'
  names:
    ja: 山江村
    reading: やまえむら
    aliases: []
  user_terms:
  - やまえむら
  - 山田と万江が一緒になった村
  - 球磨川の上流の山村
  - 相良氏の旧領の村
  naming_type: 合併新設（1889年に山田村と万江村が合併し、両村の名を一字ずつ取った合成地名）
  prefecture: 熊本県
  homonyms: []
  summary: 球磨郡北部の山村。1889年、山田村と万江村が合併した際、両村の名から一字ずつ取って「山江村」と名付けられた典型的な合成地名。山田・万江は中世以来、人吉の相良氏領内の二つの区であり、今も地区名と、村を流れる山田川・万江川の名に残る。
  first_attestation:
    era: 明治22年
    year_western: 1889
    document: 市制町村制の施行に伴う山江村の発足
    note: 「山江」の名そのものの初出（命名）。構成要素の山田・万江の名は建久年間以来の相良領の二区として古いが、それぞれの文献上の初出は未確認
  claims:
  - text: 総務省の全国地方公共団体コードで、山江村の団体コードは435121と定められている
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  - text: 明治22年（1889年）、市制町村制の施行により山田村と万江村が合併し、両村の名を一字ずつとり「山江村」となった
    kind: fact
    level: E2
    status: established
    sources:
    - r9-pref-yamae
  - text: 村域は建久年間より人吉相良（相良氏）の領分であり、山田・万江の二区よりなっていた。1889年4月1日に山田と万江が合併して山江村が誕生し、2つの村の頭文字は現在も残っている
    kind: fact
    level: E2
    status: established
    sources:
    - r9-yamae-school
  - text: 村は東部を山田地区、西部を万江地区と称し、北部山岳地帯に源を発する山田川・万江川が谷間の水田を潤して人吉平野を貫流し球磨川に合流する。旧村名は地区名と川名の形で現在も残っている
    kind: fact
    level: E2
    status: established
    sources:
    - r9-pref-yamae
  - text: 『日本歴史地名大系』の解説によれば、村域の大部分は山林で南端部のみ人吉盆地に属し、仰烏帽子山から南流する山田川・万江（まえ）川の流域に小集落が点在する地形であり、2つの旧村はそれぞれ川沿いの谷の集落であったことがうかがえる
    kind: fact
    level: E3
    status: established
    sources:
    - r9-yamae-kotobank
  column:
    title: 消えなかった二つの村名
    text: 合併で生まれた合成地名は、元の村名を消してしまうことも多いが、山江村では山田と万江の両方が生き残った。村は今も東の山田地区・西の万江地区に分かれ、それぞれの地区を山田川・万江川が流れて人吉で球磨川に合流する。新しい村名「山江」の一字ずつが、そのまま土地の呼び名として地図に残っているのである。中世以来、相良氏の領内で並び立ってきた二つの区の名が、頭文字の形で一つの村に同居している。
    sources:
    - r9-pref-yamae
    - r9-yamae-school
  relations:
  - pref/43
  - muni/43-球磨村
  unknowns:
  - 山田・万江それぞれの地名の語源と、文献上の初出は確認できなかった
  - 1889年の合併時に「山江」の名を選んだ経緯（他の候補の有無など）の一次資料は未確認
  updated: '2026-11-13'
- id: muni/43-山都町
  code: '434477'
  names:
    ja: 山都町
    reading: やまとちょう
    aliases: []
  user_terms:
  - やまとちょう
  - 通潤橋の町
  - 九州のへそ
  - 山の都
  naming_type: 合併新設（2005年の合併に際し公募で選ばれた新町名。「山の都」として栄えるようにとの願いが込められた）
  prefecture: 熊本県
  homonyms: []
  summary: 熊本県東部、上益城郡の町。2005年、矢部町・清和村と阿蘇郡の蘇陽町が、平成の合併で県内唯一の郡境を越えた合併をして誕生した。新町名は公募で集められた候補から合併協議会が満場一致で選んだ「山都」で、「山の都として栄えるように」という応募理由が伝えられる。
  first_attestation:
    era: 平成17年
    year_western: 2005
    document: 矢部・清和・蘇陽三町村合併協議会による新町名の決定と山都町の発足
    note: 命名そのもの。公募候補には「九央町」「蘇南町」「美山町」などもあった
  claims:
  - text: 総務省の全国地方公共団体コードで、山都町の団体コードは434477と定められている
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  - text: 平成17年（2005年）2月11日、上益城郡の矢部町・清和村と阿蘇郡の蘇陽町が合併して山都町が誕生した。熊本県における平成の合併で、唯一の郡境を越えた合併であった
    kind: fact
    level: E2
    status: established
    sources:
    - r9-pref-yamato
  - text: 新町の名称は合併協議会が公募し、そこから候補を選定した。「九央町」「蘇南町」「美山町」「山都町」といった町名候補についての各町村の意向が持ち寄られ、協議の結果、満場一致で「山都町」に決した
    kind: fact
    level: E2
    status: established
    sources:
    - r9-pref-yamato
  - text: 山都町郷土史伝承会によれば、「山都町」の町名は公募によって命名され、その応募理由は「『山の都』として栄えるように。山を三と読替え、三町村が栄えるという意味も含んでいます。大和朝廷の『やまと』と同じ響きです」というものであった
    kind: fact
    level: E4
    status: established
    sources:
    - r9-yamato-densho
  - text: 合併にあたって新町が上益城郡に属することとされたため、阿蘇郡に属する蘇陽町内では「阿蘇」の名前から離れることを危惧する意見もあったが、三町村で合併に向けた手続が進められた
    kind: fact
    level: E2
    status: established
    sources:
    - r9-pref-yamato
  - text: 読みは「やまとちょう」であり、「やまとまち」ではない。熊本県内ではあさぎり町・氷川町とともに、「まち」ではなく「ちょう」と読む数少ない町である
    kind: fact
    level: E4
    status: established
    sources:
    - r9-yamato-densho
  column:
    title: 「まち」ではなく「ちょう」と読む
    text: 熊本県の町の多くは「まち」と読むが、山都町は「やまとちょう」である。県内で「ちょう」と読む町は、あさぎり町と氷川町、それにこの山都町くらいだという。公募で寄せられた「山都」という名には、「山の都として栄えるように」「山を三と読み替え三町村が栄えるように」という願いと、大和（やまと）と同じ響きへの意識が込められていたと郷土史伝承会は伝える。字も読みも、合併協議会の満場一致で決まった新しい名である。
    sources:
    - r9-yamato-densho
    - r9-pref-yamato
  relations:
  - pref/43
  unknowns:
  - 公募の応募総数や、「山都」を応募した個人・理由書の原文は確認できていない（応募理由は郷土史伝承会の紹介による）
  - 合併前の矢部町・清和村・蘇陽町それぞれの町名・村名の由来は、本レコードでは扱っていない
  updated: '2026-11-13'
- id: muni/43-山鹿市
  code: '432083'
  names:
    ja: 山鹿市
    reading: やまがし
    aliases:
    - 山鹿町
    - 山鹿郡
    - 鹿本町
    - 菊鹿町
    - 鹿北町
    - 鹿央町
  user_terms:
  - やまが
  - 山鹿灯籠のまち
  - 山鹿温泉
  - 八千代座のある市
  naming_type: 合併新設
  prefecture: 熊本県
  homonyms: []
  summary: 菊池川中流の県北の市。名は古代の山鹿郡に遡り、郡名の初見は『筑後国風土記』逸文の「山鹿郡荒爪之山」で、『和名類聚抄』は「夜万加（やまが）」の訓と温泉郷を含む10郷を伝える。語源に定説はない。昭和29年（1954年）に山鹿町ほか7村の合併で一度市制を施行し、平成17年（2005年）1月15日に鹿本郡の鹿北町・菊鹿町・鹿本町・鹿央町と新設合併して現在の山鹿市となり、公募を経た最終候補（山鹿市・鹿北市・鹿本市）から「山鹿市」が選ばれた。山鹿温泉と山鹿灯籠まつりで知られる。
  first_attestation:
    era: 和銅6年頃
    year_western: 713
    document: 筑後国風土記（逸文。『釈日本紀』に引用されて伝わる）
    note: 『日本歴史地名大系』が「山鹿郡荒爪之山」を郡名の初見として紹介する。原文は未読のため紹介形で記録する
  claims:
  - text: 山鹿市の地方公共団体コードは432083である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  - text: 山鹿郡の名の初見は、『筑後国風土記』逸文に三毛郡の棟木の影が「山鹿郡荒爪之山」を蔽うとある記事であると、『日本歴史地名大系』が紹介している
    kind: fact
    level: E3
    status: established
    sources:
    - s1-yamaga-kotobank-gun
  - text: 『和名類聚抄』は山鹿郡に「夜万加（やまが）」の訓を付し、温泉（ゆ）郷を含む10郷を挙げており、古代の山鹿が温泉の地として知られていたことがうかがえる
    kind: fact
    level: E3
    status: established
    sources:
    - s1-yamaga-kotobank-gun
  - text: 「山鹿」の語源については定説がなく、山あいの地を意味する「山処（やまか）」の転訛とする説や、鹿との関わりをいう説が一般向け解説で紹介されるにとどまる
    kind: fact
    level: E5
    status: indeterminate
    sources:
    - s1-yamaga-onsen-local
  - text: 昭和29年（1954年）4月1日に山鹿町ほか七村が合併して山鹿市が発足し、平成17年（2005年）1月15日に鹿本郡鹿北町・菊鹿町・鹿本町・鹿央町と新設合併して現在の山鹿市となった
    kind: fact
    level: E2
    status: established
    sources:
    - s1-yamaga-pref
  - text: 平成の合併では新市名を全国公募し、最終候補の「山鹿市」「鹿北市」「鹿本市」の中から合併協議会の協議で「山鹿市」が選ばれた。山鹿の名は奈良時代の記録に見られる由緒ある地名であることが理由として述べられている
    kind: fact
    level: E2
    status: established
    sources:
    - s1-yamaga-pref
  - text: 山鹿温泉は県下一の湧出量を誇るとされ、中心市街地には明治の芝居小屋・八千代座があり、毎年8月15・16日の山鹿灯籠まつりでは金灯籠を頭に掲げた女性たちが舞う
    kind: fact
    level: E2
    status: established
    sources:
    - s1-yamaga-city-intro
  - text: 保元2年（1157年）に保元の乱で敗れて下向した宇野親治が、山中で鹿が湯浴みしているのを見て山鹿温泉を発見したという伝承が伝わる
    kind: legend
    level: E4
    status: established
    sources:
    - s1-yamaga-onsen-local
  column:
    title: 鹿が湯を浴びていた、という温泉の始まり
    text: 山鹿温泉の発見譚は名前に「鹿」が入るこの町らしい。保元の乱（1156年）に敗れて肥後に下った宇野親治が、山の中で湯浴みする鹿を見つけて温泉を発見し、菊池氏の許しを得て湯主になったという（郷土資料の伝える伝承）。もっとも「山鹿」の語源そのものに定説はなく、鹿の伝承が先にあったのか、名にちなんで物語が生まれたのかは分からない。毎年8月の山鹿灯籠まつりで女性たちが頭に載せる金灯籠は、和紙と糊だけで作られる国指定伝統的工芸品で、温泉とともに町の象徴になっている。
    sources:
    - s1-yamaga-onsen-local
    - s1-yamaga-city-intro
  relations:
  - pref/43
  - muni/43-菊池市
  - muni/43-玉名市
  unknowns:
  - 「山鹿」の語源は専門辞典でも確定しておらず、今回の調査では諸説の段階にとどまった
  - 『筑後国風土記』逸文の原文（『釈日本紀』の引用文）は未読のため、初出の主張は専門辞典による紹介形にとどめた
  updated: '2026-11-13'
- id: muni/43-御船町
  code: '434418'
  names:
    ja: 御船町
    reading: みふねまち
    aliases: []
  user_terms:
  - みふねまち
  - 恐竜の町
  - 御船川の船着場の町
  naming_type: その他（景行天皇の御船着岸という伝承に由来すると伝えられる古い地名の継承）
  prefecture: 熊本県
  homonyms: []
  summary: 熊本市の南東、上益城郡の町。「御船」の名は、景行天皇の九州平定の巡幸の折、その御船（おんふね）が着岸したことに由来すると町公式に伝えられる。中世には御船氏の城下、江戸時代には御船川の船着場を擁する豪商の町として栄え、1955年の合併でも町名が残された。
  first_attestation:
    era: 明治22年
    year_western: 1889
    document: 町村制施行による御船町の発足
    note: 自治体としての発足時点。地名「御船」自体は中世の御船氏の名に遡り、その起こりは景行天皇の御船着岸の伝承で説明される
  claims:
  - text: 総務省の全国地方公共団体コードで、御船町の団体コードは434418と定められている
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  - text: 「御船（みふね）」の由来は、景行天皇が九州を平定するためにご巡幸なさった折、その「御船（おんふね）」が着岸したことによると伝えられる
    kind: legend
    level: E2
    status: established
    sources:
    - r9-mifune-town
    - r9-pref-mifune
  - text: 南北朝のころには阿蘇家の一族、御船河内守盛安が領有し、戦国時代には御船阿波守の居城、続いて甲斐宗運の居城となって御船の名を高めた。中世には「御船」はこの地を領した氏族や城の名としても用いられた
    kind: fact
    level: E2
    status: established
    sources:
    - r9-pref-mifune
    - r9-mifune-town
  - text: 加藤・細川の時代には、町域を流れる御船川は商業の中心となる船着場を擁して町の発展を支え、豪商の町「御船」の名は関西まで知られ県内第一の町として栄えた。天皇の船の伝承とは別に、近世には川港の町として「御船」の名が広く知られた
    kind: fact
    level: E2
    status: established
    sources:
    - r9-pref-mifune
  - text: 町村制施行にともない御船町は独立村となり（「町」を名乗りながら村格）、大正7年（1918年）に御船町と滝川村が合併して改めて御船町となった
    kind: fact
    level: E2
    status: established
    sources:
    - r9-pref-mifune
    - r9-mifune-wiki
  - text: 1955年（昭和30年）の合併に際しても、町名は「御船町」を残した
    kind: fact
    level: E5
    status: established
    sources:
    - r9-mifune-wiki
  column:
    title: 天皇の船の名が、恐竜の地層の名になった
    text: 御船町の名は景行天皇の「御船」の伝承で語られるが、この町の名は地質学の用語にもなっている。御船町や甲佐町などに分布する後期白亜紀の地層は「御船層群」と呼ばれ、恐竜をはじめとする化石を含むことで知られる。1979年には日本で初めての肉食恐竜の化石が町内で発見され、町には御船町恐竜博物館がある。古代の船着き場の伝承を持つ名が、太古の地層の名として学術の世界でも使われているのである。
    sources:
    - r9-mifune-sougun
    - r9-mifune-wiki
  relations:
  - pref/43
  unknowns:
  - 景行天皇の御船着岸という伝承が、いつ・どの史料に初めて記録されたかは確認できなかった
  - 「御船」が藩主などの御用船を直接指したという史料は確認できておらず、伝承の「御船」と近世の船着場との関係も未確認
  updated: '2026-11-13'
- id: muni/43-水上村
  code: '435074'
  names:
    ja: 水上村
    reading: みずかみむら
    aliases: []
  user_terms:
  - みずかみむら
  - 球磨川の源流の村
  - 市房山のふもとの村
  naming_type: 合併新設（1895年の合併に際し、球磨川の水源地に位置することから「水上」と命名）
  prefecture: 熊本県
  homonyms: []
  summary: 球磨郡東部の山村で、球磨川の源流域にあたる。1889年の町村制では岩野・江代・湯山の三か村は組合村として発足し、1895年11月28日に合併して一村となった際、球磨川の源を発する地に位置することから「水上」と命名された。川の最上流という位置そのものを名にした村である。
  first_attestation:
    era: 明治28年
    year_western: 1895
    document: 明治28年11月28日の湯山村・岩野村・江代村の合併による水上村の発足（水上村公式）
    note: 命名そのもの。村は2025年に、この1895年を起点とする村制施行130周年を記念した
  claims:
  - text: 総務省の全国地方公共団体コードで、水上村の団体コードは435074と定められている
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  - text: 水上村は、明治28年（1895年）11月28日に湯山村・岩野村・江代村が合併して生まれ、球磨川の源を発する地に位置することから「水上」と命名された（村公式）。熊本県の合併資料も、この地方が球磨川の最上流水源地であるところから「水上」の名がとられたものと考えられるとする
    kind: fact
    level: E2
    status: established
    sources:
    - r9-mizukami-vill
    - r9-pref-mizukami
  - text: 明治22年（1889年）の町村制施行の時点では、岩野・江代・湯山の三か村は組合村として発足しており、1895年に至って正式に合併して一つの村となった
    kind: fact
    level: E2
    status: established
    sources:
    - r9-pref-mizukami
  - text: 急流で名高い球磨川は、本村北西部の高塚山を源として南下し村の中央部を流れる。「水上」という村名は、この川の最上流・水源地という位置そのものを表している
    kind: fact
    level: E2
    status: established
    sources:
    - r9-pref-mizukami
  - text: 村の東の宮崎県境には、熊本県第二の高峰で国定公園に指定されている市房山（標高1,722メートル）があり、村域は球磨川源流の山岳地帯である
    kind: fact
    level: E2
    status: established
    sources:
    - r9-pref-mizukami
  - text: 水上村は2025年（令和7年）に村制施行130周年記念式典を開いており、1895年の三村合併・命名を村の起点として数えている
    kind: fact
    level: E2
    status: established
    sources:
    - r9-mizukami-vill
  column:
    title: 川の「一番上」を名乗る村
    text: 「水上（みずかみ）」は、球磨川の流れの最も上、水源の地という意味である。日本三大急流の一つに数えられる球磨川も、水上村の北西部、高塚山に源を発する頃はまだ細い源流で、村の中央部を南へ下っていく。1889年の町村制では組合村として発足した岩野・江代・湯山の三村が、1895年に一つになるときに選んだ名が、この「水上」だった。下流の人吉盆地まで続く長い川の物語の、まさに第一ページにあたる場所を示す名である。
    sources:
    - r9-mizukami-vill
    - r9-pref-mizukami
  relations:
  - pref/43
  - muni/43-湯前町
  unknowns:
  - 「水上」の名の提案者や、合併協議の具体的な記録など命名の一次資料は確認できなかった
  - 1889年から1895年までの組合村時代に、三村がどのように村政を行ったかの詳細は未確認
  updated: '2026-11-13'
- id: muni/43-水俣市
  code: '432059'
  names:
    ja: 水俣市
    reading: みなまたし
    aliases:
    - 水俣郷
