prefecture_code: '22'
records:
- id: muni/22-三島市
  code: '222062'
  names:
    ja: 三島市
    reading: みしまし
    aliases:
    - 三島町
    - 伊豆府中
    - 三島宿
  user_terms:
  - 三島市の名前の由来
  - 三嶋大社の門前町
  - 水の都三島
  - 伊豆の玄関口
  naming_type: その他（三嶋大社の社名に由来する地名の継承）
  prefecture: 静岡県
  homonyms: []
  summary: 市名は、伊豆国一宮の三嶋大社に由来する門前町の地名「三島」を受け継ぐ。古代の当地は伊豆国の国府が置かれ「国府（こう）」とも呼ばれたが、三嶋神が祀られるにつれて大社の名が土地の名となり、13世紀末頃から「三島」と呼ばれるようになったとされる。大社の社名は「三嶋」と書くが、市名は「三島」と書く。江戸時代は東海道の三島宿として栄え、昭和16年（1941年）に三島町と錦田村が合併して三島市が発足した。
  first_attestation:
    era: 平安時代
    year_western: null
    document: 和名類聚抄（伊豆国賀茂郡「三島郷」）
    note: 「三島郷」は伊豆諸島側を含む賀茂郡の郷名として見えるもので、現在の三島市域の地名そのものの初出ではない。鎮座地の地名としての「三島」は中世以降、三嶋大社にちなんで広がったとされる
  claims:
  - text: 三島市公式サイトは、三島が伊豆国の国府として、また三嶋大社の門前町として、この地域の政治・経済の中心地となったと紹介している
    kind: fact
    level: E2
    status: established
    sources:
    - n4-mishima-city-history
  - text: 三嶋大社は大山祇命と積羽八重事代主神を祭神とし、両神を総じて三嶋大明神と称する、伊豆国一宮・名神大社の古社である
    kind: fact
    level: E2
    status: established
    sources:
    - n4-mishima-jinjacho
  - text: 社名の「三嶋」は「御島」すなわち伊豆大島・三宅島などからなる伊豆諸島を意味するとされ、三嶋神は伊豆諸島の神として崇敬されてきた
    kind: fact
    level: E5
    status: established
    sources:
    - n4-mishima-taisha-wiki
  - text: 現在の鎮座地は古代には伊豆国の国府があったことから「国府（こう）」と称され、三嶋神が国府に祀られたのち、13世紀末頃から大社にちなんで地名も「三島」と呼ぶようになったとされる
    kind: fact
    level: E5
    status: established
    sources:
    - n4-mishima-taisha-wiki
  - text: 地名の由来にはこのほか、三嶋大明神が遷座したときに名が生まれたとする説、三嶋大明神が3つの洲（安志我良・珠流河・賀茂）の神であることから洲が嶋に改められたとする説、清流に挟まれた土地が3つの島のように見えたとする説がある
    kind: fact
    level: E5
    status: contested
    sources:
    - n4-mishima-city-wiki
  - text: 江戸時代の三島は東海道の宿場町（三島宿）として、箱根八里を東に控える交通の要衝であり、三嶋暦などの文化も生まれた
    kind: fact
    level: E2
    status: established
    sources:
    - n4-mishima-city-history
  - text: 昭和16年（1941年）、三島町と錦田村が新設合併して三島市が発足した
    kind: fact
    level: E5
    status: established
    sources:
    - n4-mishima-city-wiki
  - text: 三島市の地方公共団体コードは222062である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 神社は「三嶋」、市は「三島」
    text: 三島の中心にある大社の名前は「三嶋大社」と書くが、市の名前は「三島市」と書く。「嶋」は島の異体字で、もともとは同じ「みしま」の表記ゆれである。大社の側も戦前は「三島神社」と称しており、戦後に「三嶋大社」を正式な称号としたとされる。駅名も市の名も「三島」で統一されるなか、大社だけが古風な「嶋」の字を守っているのは、伊豆諸島を指す古い言葉「御島」の記憶を社名に留めるためでもある。まちを歩くと、看板のなかで二つの「みしま」が静かに同居していることに気づく。
    sources:
    - n4-mishima-taisha-wiki
  relations:
  - pref/22
  - muni/22-沼津市
  - muni/22-下田市
  unknowns:
  - 「三島」の地名が鎮座地を指して使われた最も古い文書（13世紀末頃とされる時期の具体的な史料名）は本バッチでは特定できなかった
  - 三嶋神の元の鎮座地（伊豆諸島側か半島側か）については諸説があり、本バッチでは確定しなかった
  updated: '2026-11-13'
- id: muni/22-下田市
  code: '222194'
  names:
    ja: 下田市
    reading: しもだし
    aliases:
    - 下田町
  user_terms:
  - 下田市の名前の由来
  - ペリー来航のまち
  - 開国の港町
  - 伊豆の南の玄関口
  naming_type: その他（港町以来の地名の継承）
  prefecture: 静岡県
  homonyms: []
  summary: 市名は、伊豆半島南部の港町として古くから知られた「下田」を受け継ぐ。古代の当地は伊豆国賀茂郡の大社郷に含まれていたと考えられると市資料は紹介するが、「下田」の名自体の語源や初出は、本調査では確認できなかった。江戸時代には下田奉行の置かれた港町として栄え、嘉永7年（1854年）の日米和親条約で日本最初の開港場の一つとなった。昭和30年（1955年）に6か町村が合併して下田町となり、昭和46年（1971年）に市制を施行した。
  first_attestation:
    era: 不明
    year_western: null
    document: null
    note: 「下田」の名の文書上の初出は本バッチでは特定できなかった。古代の当地は『和名類聚抄』の賀茂郡大社郷に含まれていたと下田市資料が推定する
  claims:
  - text: 下田市資料は、『和名類聚抄』に見える伊豆国賀茂郡の5郷（賀茂・川津・三島・大社・月間）のうち大社郷が、現在の白浜地区を中心に稲梓・稲生沢・浜崎・下田地区を含む範囲を指したと考えられると紹介している
    kind: fact
    level: E2
    status: established
    sources:
    - n4-shimoda-machiisan
  - text: 平城京二条大路で出土した天平7年（735年）の木簡に「賀茂郡稲梓郷稲梓里」の表記が見え、現市域の稲梓の地名が奈良時代には存在していたことが判明している
    kind: fact
    level: E2
    status: established
    sources:
    - n4-shimoda-machiisan
  - text: 元和2年（1616年）に下田奉行が置かれ、下田は江戸時代を通じて幕府支配下の港町として栄えた
    kind: fact
    level: E5
    status: established
    sources:
    - n4-shimoda-city-wiki
  - text: 嘉永7年（1854年）の日米和親条約により下田港が開港し、了仙寺で付録の下田条約が調印され、安政3年（1856年）には玉泉寺に日本最初の米国総領事館が置かれた
    kind: fact
    level: E5
    status: established
    sources:
    - n4-shimoda-city-wiki
  - text: 昭和30年（1955年）3月31日、下田町・稲梓村・稲生沢村・浜崎村・朝日村・白浜村の6か町村が合併して、新たな下田町が発足した
    kind: fact
    level: E2
    status: established
    sources:
    - n4-shimoda-koho
  - text: 昭和46年（1971年）1月1日、市制施行により下田市となり、県内19番目の市となった
    kind: fact
    level: E2
    status: established
    sources:
    - n4-shimoda-koho
    - n4-shimoda-city-wiki
  - text: 「下田」の地名の語源については、低地にある田を指す普通名詞的な地名とする見方はあるものの、当市について裏付けのある説明は本バッチでは確認できず、古代の「志太田」と結びつける説についても典拠は得られなかった
    kind: fact
    level: E5
    status: indeterminate
    sources:
    - n4-shimoda-machiisan
  - text: 下田市の地方公共団体コードは222194である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 開国の舞台は、名の由来の分からない港町
    text: 1854年、ペリーの黒船が入港し、了仙寺で下田条約が結ばれ、初代駐日総領事ハリスが玉泉寺に陣取った。下田は日本の開国の最前線だった。その割に、「下田」という名の由来は驚くほど記録が薄い。古代のこの一帯は大社郷と呼ばれ、下田の名がいつ、なぜ生まれたのかは確かな記録が残っていない。世界史の転換点となった港町の名前の根っこが霧の中にあるという事実も、歴史の記録の偏りを考えさせる材料である。
    sources:
    - n4-shimoda-city-wiki
    - n4-shimoda-machiisan
  relations:
  - pref/22
  - muni/22-三島市
  unknowns:
  - 「下田」の地名の初出と語源は、市公式資料・専門辞典のいずれでも本バッチでは確認できなかった
  - 古代の「志太田」と下田を結びつける説については典拠を確認できなかった（志太郡は駿河国の郡であり、下田は伊豆国賀茂郡に属する）
  - 中世の下田（下田城築城以前）の地名の用例は本バッチでは特定できなかった
  updated: '2026-11-13'
- id: muni/22-伊東市
  code: '222089'
  names:
    ja: 伊東市
    reading: いとうし
    aliases:
    - 伊東町
    - 伊東村
    - 伊東荘
  user_terms:
  - 伊東市の名前の由来
  - 伊東温泉のまち
  - 祐親と八重姫の伊東
  - 伊豆の温泉都市
  naming_type: その他（荘園名以来の中心地名の継承）
  prefecture: 静岡県
  homonyms: []
  summary: 市名は、中心地の古い地名「伊東」を受け継ぐ。「伊東」は中世に伊豆国田方郡にあった伊東荘の名で、この荘を本貫地とした武士団が伊東氏を称したことで広く知られるようになった。明治22年（1889年）に伊東村が発足し、明治39年（1906年）に伊東町となり、昭和22年（1947年）に小室村と合併して市制を施行し伊東市となった。地名「伊東」自体の語源は、確定した説が確認できていない。
  first_attestation:
    era: 平安時代末期
    year_western: null
    document: 伊東荘（伊豆国田方郡）
    note: 伊東氏の本貫地としての「伊東荘」の初出文献と年は本バッチでは特定できなかった。伊東の名は12世紀の伊東氏関係史料を通じて知られる
  claims:
  - text: 伊東荘は伊豆国田方郡の荘園で、大見・宇佐見・伊東からなる久須見荘の一部を占めていた
    kind: fact
    level: E5
    status: established
    sources:
    - n4-ito-uji-wiki
  - text: 藤原南家工藤氏の支族は伊東荘を本貫地としたことから伊東氏と称し、伊東祐親・祐清らを輩出した
    kind: fact
    level: E5
    status: established
    sources:
    - n4-ito-uji-wiki
  - text: 『曽我物語』などによれば、伊豆に流されていた源頼朝の監視を任された伊東祐親は、上洛中に娘の八重姫が頼朝と通じて子（千鶴）をもうけたことを知って激怒し、千鶴を川に沈め、頼朝をも討とうとしたと伝えられる
    kind: legend
    level: E5
    status: established
    sources:
    - n4-ito-uji-wiki
  - text: 「伊東」は「伊豆国の東」を意味するという説明が名字由来辞典などにあるが、専門の地名辞典による裏付けは本バッチでは確認できなかった
    kind: fact
    level: E5
    status: indeterminate
    sources:
    - n4-ito-namedic
  - text: 明治22年（1889年）に伊東村が発足し、明治39年（1906年）に町制を施行して伊東町となった
    kind: fact
    level: E5
    status: established
    sources:
    - n4-ito-city-wiki
  - text: 昭和22年（1947年）8月10日、伊東町と小室村が合併して市制を施行し、伊東市が発足した
    kind: fact
    level: E5
    status: established
    sources:
    - n4-ito-city-wiki
  - text: 昭和30年（1955年）に対島村・宇佐美村が編入され、現在の市域の骨格ができた
    kind: fact
    level: E5
    status: established
    sources:
    - n4-ito-city-wiki
  - text: 伊東市の地方公共団体コードは222089である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 祐親と八重姫、温泉の町の悲話
    text: 伊東の名を全国に知らせたのは、皮肉にも土地の領主一族の悲劇である。平家方として源頼朝の監視役を任された伊東祐親は、大番役で上洛している留守に、娘の八重姫が頼朝と結ばれ子まで生まれていたことを知る。平家への聞こえを恐れた祐親は孫の千鶴を殺し、頼朝の命をも狙ったと『曽我物語』は語る。物語の細部は伝承の域を出ないが、伊東市では今も「伊東祐親まつり」が開かれ、市役所前には祐親の騎馬像が立つ。温泉観光の町の玄関には、鎌倉幕府誕生の陰で滅びた在地豪族の物語が静かに埋め込まれている。
    sources:
    - n4-ito-uji-wiki
  relations:
  - pref/22
  unknowns:
  - 地名「伊東」の語源は、市公式・専門辞典のいずれでも確定した説明を確認できなかった（「伊豆の東」説は名字辞典レベルの説明にとどまる）
  - 伊東荘の成立時期と「伊東」の初出文献は本バッチでは特定できなかった
  - 伊東市公式の沿革資料（広報いとう市制施行70周年記念号など）は本バッチでは直接確認できなかった
  updated: '2026-11-13'
- id: muni/22-伊豆の国市
  code: '222259'
  names:
    ja: 伊豆の国市
    reading: いずのくにし
    aliases:
    - 伊豆長岡町
    - 韮山町
    - 大仁町
  user_terms:
  - いずのくに
  - 伊豆の国市の名前の由来
  - 伊豆市との違い
  - 韮山の市
  naming_type: 合併新設
  prefecture: 静岡県
  homonyms: []
  summary: 伊豆の国市は2005年（平成17年）4月1日に田方郡の伊豆長岡町・韮山町・大仁町が合併して発足した市である。市名は古代の令制国「伊豆国」に「の」を挿んで言及する名で、公募の名称案には上位に入っていなかったが、候補7点から絞り込まれ、最終的に「伊豆北条市」との投票を12対10で制して決定した。ただし、伊豆国の国府が置かれたのは市域ではなく三島市であり、この点はしばしば誤解される。市域と伊豆国との結びつきとしては、伊豆国分寺の瓦が市内の瓦窯で生産されたことが市の資料に記されている。
  first_attestation:
    era: 平成17年
    year_western: 2005
    document: null
    note: 「伊豆の国市」という市名の初出は2005年4月1日の市発足時。もとになる「伊豆国」は天武9年（680年）の分置とされ、伊豆の国市公式の歴史概要が記す
  claims:
  - text: 総務省の全国地方公共団体コードで、伊豆の国市の団体コードは222259と定められている
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  - text: 伊豆の国市によれば、天武9年（680年）に駿河国から伊豆国が分置され、大宝令公布（701年）の頃に田方・那賀・賀茂の3郡が分かれ、市域は田方郡に含まれた
    kind: fact
    level: E2
    status: established
    sources:
    - v4-izunokuni-city-history
  - text: 伊豆の国市によれば、伊豆国の国府は三島に置かれた（市域ではない）
    kind: fact
    level: E2
    status: established
    sources:
    - v4-izunokuni-city-history
  - text: 伊豆の国市によれば、伊豆国分寺の瓦は市内の瓦窯で生産された
    kind: fact
    level: E2
    status: established
    sources:
    - v4-izunokuni-city-history
  - text: 2005年（平成17年）4月1日に田方郡伊豆長岡町・大仁町・韮山町が合併して伊豆の国市が発足し、市名は一般公募で寄せられた名前をもとに決定した
    kind: fact
    level: E5
    status: established
    sources:
    - v4-izunokuni-wiki
  - text: 合併協議会の公表資料に基づく記録によれば、新市名称は公募の493種類の案から候補7点（伊豆中央市・伊豆の国市・伊豆北条市・狩野川市・北伊豆市・田方市・田方野市）に絞られ、2004年3月24日の第9回合併協議会の無記名投票で「伊豆の国市」12票対「伊豆北条市」10票により決定した
    kind: fact
    level: E4
    status: established
    sources:
    - v4-izunokuni-meishou
  - text: 同記録によれば、公募の上位10点には「伊豆の国市」は含まれておらず、上位は伊豆中央・伊豆長岡・伊豆韮山・伊豆北条・狩野川・北伊豆・田方・韮山などであった
    kind: fact
    level: E4
    status: established
    sources:
    - v4-izunokuni-meishou
  - text: 「伊豆の国」の名称の先行例として、1993年に当時の韮山町に誕生したJA伊豆の国（伊豆の国農業協同組合）がある
    kind: fact
    level: E5
    status: established
    sources:
    - v4-izunokuni-wiki
  column:
    title: 12対10で決まった市名
    text: 伊豆の国市の名前は、公募の人気投票では決まりませんでした。応募の多かった「伊豆中央」や「韮山」ではなく、小委員会が候補に残した「伊豆の国市」は、最終投票で「伊豆北条市」に12対10の僅差で勝ちました。しかも市名が言及する伊豆国の国府は、実は隣の三島市にありました。「の国」という響きの柔らかさと、伊豆全体を指す広がりが、2票差を生んだようです。
    sources:
    - v4-izunokuni-meishou
    - v4-izunokuni-city-history
  relations:
  - pref/22
  - muni/22-伊豆市
  unknowns:
  - 「伊豆の国」という市名の提案理由（選定小委員会の公式の選定理由文）は未確認
  - 伊豆国の国府が中世以降に韮山へ移ったとする説の有無・真偽は未確認（市の公式資料は国府を三島とする）
  - 「伊豆」という語自体の語源は伊豆市のレコード側に記録し、本レコードでは未詳として扱う
  updated: '2026-11-13'
- id: muni/22-伊豆市
  code: '222224'
  names:
    ja: 伊豆市
    reading: いずし
    aliases:
    - 修善寺町
    - 土肥町
    - 天城湯ケ島町
    - 中伊豆町
  user_terms:
  - いず
  - 伊豆市の名前の由来
  - 伊豆の国市との違い
  - 伊豆半島の市
  naming_type: 合併新設
  prefecture: 静岡県
  homonyms: []
  summary: 伊豆市は2004年（平成16年）4月1日に田方郡の修善寺町・土肥町・天城湯ケ島町・中伊豆町の4町が合併して発足した市で、伊豆半島の中央部に位置し半島で最大の面積を持つ。市名は旧国名であり半島名でもある「伊豆」をそのまま採用した。「伊豆」の語は飛鳥時代の藤原宮出土木簡に「伊豆国」と見えるのが古い用例とされ、語源には半島の突出した地形に基づく「出づ（いづ）」説と、温泉の「湯出（ゆづ）」説があるが、確定していない。
  first_attestation:
    era: 天武9年
    year_western: 680
    document: null
    note: 伊豆国の分置年（駿河国から分立）。語としての「伊豆国」は藤原宮出土木簡に見えるのが古いと語源資料は紹介するが、木簡そのものの直接確認は未実施。「伊豆市」としての初出は2004年4月1日
  claims:
  - text: 総務省の全国地方公共団体コードで、伊豆市の団体コードは222224と定められている
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  - text: 2004年（平成16年）4月1日に田方郡修善寺町・土肥町・天城湯ケ島町・中伊豆町の4町が合併して伊豆市が発足した
    kind: fact
    level: E5
    status: established
    sources:
    - v4-izu-wiki
  - text: 伊豆市は伊豆半島の中央部に位置し、この半島で最大の面積を占める基礎自治体である
    kind: fact
    level: E5
    status: established
    sources:
    - v4-izu-wiki
  - text: 伊豆の国市によれば、天武9年（680年）に駿河国から伊豆国が分置され、伊豆市域を含む地域はその田方郡などに含まれた
    kind: fact
    level: E2
    status: established
    sources:
    - v4-izunokuni-city-history
  - text: 語源資料によれば、伊豆の地名は旧国名として飛鳥期の藤原宮木簡に「伊豆国」で見えるのが古い
    kind: fact
    level: E4
    status: established
    sources:
    - v4-izu-gogen
  - text: 語源資料によれば、伊豆の由来には半島の突出した地形から「いづ（出づ）」が語源と考えられているとする説と、湯が多く出る国で「ゆづ（湯出）」が変化したとする説がある
    kind: fact
    level: E4
    status: contested
    sources:
    - v4-izu-gogen
  column:
    title: 半島の名を独占した市
    text: 「伊豆」は半島全体と旧国名を指す広域地名です。その名をそのまま市名にした伊豆市に対し、翌年に発足した隣の市は「伊豆の国市」と、わざわざ「の国」を挟んで区別しました。広い名前を先に取った伊豆市は半島最大の面積を持つ市でもあり、修善寺温泉や天城山など伊豆の代表的な景勝地を市域に抱えています。広域地名を自治体名にすることの強さと難しさが、2市の並立によく表れています。
    sources:
    - v4-izu-wiki
    - v4-izu-gogen
  relations:
  - pref/22
  - muni/22-伊豆の国市
  unknowns:
  - 伊豆市の新市名の公募結果・決定過程の詳細（候補名や得票）は未確認
  - 「伊豆」の語源は諸説あり未確定（出づ説・湯出説のいずれも専門辞典での最終確認は未実施）
  - 藤原宮木簡の「伊豆国」の記載の直接確認は未実施
  updated: '2026-11-13'
- id: muni/22-富士宮市
  code: '222071'
  names:
    ja: 富士宮市
    reading: ふじのみやし
    aliases:
    - 大宮町
    - 富士の宮
  user_terms:
  - 富士宮市の名前の由来
  - 浅間大社の門前町
  - 富士山の玄関口の市
  - 宮と略される市
  naming_type: 合併新設
  prefecture: 静岡県
  homonyms: []
  summary: 市名は、富士山本宮浅間大社の別称「富士の宮」に由来する。昭和17年（1942年）、門前町の大宮町と富丘村が合併して市制を施行する際、市制施行に関する内務省調査資料に「一名富士ノ宮トモ称セラレ、往昔ヨリ人口ニ膾炙セラレ」として新市名に選ばれ、埼玉県の大宮市と重なることも新しい名を選ぶ理由になった。前身の大宮町は、全国の浅間神社の総本宮である大社の鳥居前町として発展したまちである。
  first_attestation:
    era: 鎌倉時代
    year_western: 1235
    document: 新勅撰和歌集（北条泰時の歌の詞書に「ふじの宮」）
    note: 浅間大社を指す「富士の宮」の古例として市公式・百科事典類が紹介するもの。『今昔物語集』にも駿河国の富士の宮にまつわる説話が見えるとされる
  claims:
  - text: 昭和17年（1942年）6月1日、大宮町と富丘村が合併して市制を施行し、富士宮市が発足した
    kind: fact
    level: E2
    status: established
    sources:
    - n4-fujinomiya-gaiyo
  - text: 市名は、駿河国一の宮である浅間大社が「富士の宮」とも称され古くから広く知られていたことから定められ、当時すでに埼玉県に大宮市があったことも新市名とする理由になったと、市制施行に関する内務省調査資料に記される
    kind: fact
    level: E2
    status: established
    sources:
    - n4-fujinomiya-kensho
  - text: 前身の大宮町は、富士山本宮浅間大社（全国1300余社の浅間神社の総本宮）の門前町として発展したまちで、大社の奥宮は富士山頂に鎮座する
    kind: fact
    level: E2
    status: established
    sources:
    - n4-fujinomiya-gaiyo
    - n4-fujinomiya-kensho
  - text: 富士宮市立中央図書館の資料は、浅間大社が大同元年（806年）に現在の大宮の地へ移されたと伝え、大社を中心に門前町ができたと紹介している
    kind: fact
    level: E2
    status: established
    sources:
    - n4-fujinomiya-lib
  - text: 「富士の宮」の呼称は『今昔物語集』や『新勅撰和歌集』など平安時代・鎌倉時代の文献にも見える古い名称であるとされる
    kind: fact
    level: E5
    status: established
    sources:
    - n4-fujinomiya-city-wiki
  - text: 昭和30年（1955年）に富士根村と合併し、平成22年（2010年）に芝川町と合併して現在の市域となった
    kind: fact
    level: E2
    status: established
    sources:
    - n4-fujinomiya-gaiyo
    - n4-fujinomiya-city-wiki
  - text: 富士宮市の地方公共団体コードは222071である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 大社の住所は「宮町1-1」
    text: 富士宮市の中心には今も浅間大社があり、その住所は「富士宮市宮町1-1」である。旧大宮町の時代、大社は町の1丁目1番地に位置していた。その名残で市名が「富士宮」に変わった後も、大社の町名は「宮町」のまま残った。地元では市を「宮」と略すことも多く、店の屋号や学校名にも「宮」の一字が目立つ。合併で生まれた新しい市名が、800年以上前から人々に呼ばれてきた神社の別称だったという点に、このまちの名付けの確かさがある。
    sources:
    - n4-fujinomiya-city-wiki
    - n4-fujinomiya-kensho
  relations:
  - pref/22
  - muni/22-富士市
  - muni/22-御殿場市
  unknowns:
  - 「大宮」という旧町名自体の成立時期（大社の門前町がいつから大宮と呼ばれたか）は本バッチでは特定できなかった
  - 『今昔物語集』『新勅撰和歌集』の「ふじの宮」の原文は本バッチでは直接確認していない（二次資料経由）
  updated: '2026-11-13'
- id: muni/22-富士市
  code: '222101'
  names:
    ja: 富士市
    reading: ふじし
    aliases:
    - 吉原市
    - 鷹岡町
    - 旧富士市
  user_terms:
  - 富士市の名前の由来
  - 富士市はなぜ富士というのか
  - 吉原市と合併した市
  - 富士山のふもとの市
  naming_type: 合併新設
  prefecture: 静岡県
  homonyms: []
  summary: 現在の富士市は昭和41年（1966年）11月1日、吉原市・旧富士市・鷹岡町の2市1町が合併して誕生した。市名は、合併協議会で全員一致で決まったもので、合併する市の一つである旧富士市の名が引き継がれた。旧富士市自体は昭和29年（1954年）に富士町ほかが合併して生まれており、「富士市」の名はその時が最初である。平成20年（2008年）には富士川町と合併した。
  first_attestation:
    era: 昭和41年
    year_western: 1966
    document: 吉原市・富士市・鷹岡町の合併による新「富士市」の発足（旧吉原市『広報よしわら』昭和41年9月25日号が新市の名称の決定を伝える）
    note: 「富士市」という市名自体は、昭和29年（1954年）に発足した旧富士市に遡る
  claims:
  - text: 昭和29年（1954年）3月31日、富士町・田子浦村・岩松村を廃し、その区域をもって旧富士市が置かれた
    kind: fact
    level: E2
    status: established
    sources:
    - l3-fuji-kyukoho
  - text: 昭和41年（1966年）9月、岳南2市1町合併促進協議会で、新市の名称を含む残された協議事項が全員一致で決まった
    kind: fact
    level: E2
    status: established
    sources:
    - l3-fuji-yoshiwara
  - text: 昭和41年（1966年）11月1日、旧吉原市・旧富士市・旧鷹岡町が合併して富士市が誕生し、人口は16万4932人だった
    kind: fact
    level: E2
    status: established
    sources:
    - l3-fuji-60th
  - text: 新市の名称「富士市」は、岳南2市1町合併促進協議会で協議事項の一つとして決まったもので、旧富士市の名がそのまま新市の名となった
    kind: fact
    level: E2
    status: established
    sources:
    - l3-fuji-yoshiwara
  - text: 平成20年（2008年）11月1日、富士市は富士川町と合併して新しい富士市が誕生した
    kind: fact
    level: E2
    status: established
    sources:
    - l3-fuji-fujikawa
  - text: 吉原の地は奈良時代には「よし原」と呼ばれており、江戸の吉原とは全く関係がない、と市の広報は説明する
    kind: fact
    level: E2
    status: established
    sources:
    - l3-fuji-chimei
  - text: 総務省「地方公共団体コード一覧」では、富士市のコードは222101とされる
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 消えた市名「吉原」
    text: 東海道の吉原宿で知られる吉原は、もともと鈴川・今井の地にあり、遷された後、元の宿があった地は「元（もと）吉原」と呼ばれるようになった。1966年の合併で「吉原市」という市名は消えたが、元吉原などの地名にその名残が残る。市の広報は地名の由来の回で、吉原が江戸の吉原とは無関係であることをわざわざ断っている。
    sources:
    - l3-fuji-chimei
    - l3-fuji-yoshiwara
  relations:
  - pref/22
  unknowns:
  - 合併協議会で「富士市」以外の名称候補が挙がったかどうかは、本バッチでは確認できなかった
  - 旧富士市が1954年に「富士市」と命名された経緯（公募の有無など）は、市制10周年の広報では触れられておらず未確認である
  updated: '2026-11-13'
- id: muni/22-島田市
  code: '222097'
  names:
    ja: 島田市
    reading: しまだし
    aliases:
    - 島田町
    - 島田宿
    - 嶋田
  user_terms:
  - 島田市の名前の由来
  - 大井川の川越しのまち
  - 島田宿と金谷宿の市
  - お茶のまち島田
  naming_type: その他（宿場町以来の地名の継承）
  prefecture: 静岡県
  homonyms: []
  summary: 市名は、大井川左岸の東海道の宿場町「島田」を受け継ぐ。島田市公式資料によれば、「島田（嶋田）」の地名は『吾妻鏡』建久元年（1190年）条に、源頼朝が宿泊した場所として初めて登場する。江戸時代には島田宿と対岸の金谷宿が「越すに越されぬ大井川」の川越制度を担う宿場として幕府直轄領となり栄えた。昭和23年（1948年）に島田町が市制を施行し、平成17年（2005年）に金谷町、平成20年（2008年）に川根町と合併して現在の市域となった。語源については定説が確認できていない。
  first_attestation:
    era: 鎌倉時代
    year_western: 1190
    document: 吾妻鏡（建久元年条の「嶋田」）
    note: 島田市公式資料（島田市博物館）が紹介する初出。原文は本バッチでは直接確認していないため、主張は市の紹介として格下げして記録する
  claims:
  - text: 島田市公式資料は、『吾妻鏡』建久元年（1190年）条に、京へ向かう源頼朝が宿泊した場所として「嶋田」の地名が初めて登場すると紹介している
    kind: fact
    level: E2
    status: established
    sources:
    - n4-shimada-gaiyo-ancient
  - text: 古代の当地は駿河国志太郡の大長郷・大津郷・葦原郷などにあたり、これらの郷名は10世紀中頃の『和名類聚抄』に見えると島田市公式資料は紹介している
    kind: fact
    level: E2
    status: established
    sources:
    - n4-shimada-gaiyo-ancient
  - text: 江戸時代、島田宿と金谷宿は大井川の両岸の宿場に定められ、要衝であったため幕府直轄領として治められた
    kind: fact
    level: E2
    status: established
    sources:
    - n4-shimada-gaiyo-edo
  - text: 島田宿はもと元島田付近にあったが、天正年間の大井川の瀬替えで流路が南へ移ったため現在地へ移り、慶長19年（1614年）に現在の本通り付近に戻ったと島田市公式資料は紹介している
    kind: fact
    level: E2
    status: established
    sources:
    - n4-shimada-gaiyo-edo
  - text: 「島田」の語源については、川の中州など島状の土地の田を指すとするような一般的な地名解釈があるものの、当市について確認できる定説はない
    kind: fact
    level: E5
    status: indeterminate
    sources:
    - n4-shimada-namedic
  - text: 昭和23年（1948年）1月1日、島田町が市制を施行して島田市となった
    kind: fact
    level: E5
    status: established
    sources:
    - n4-shimada-city-wiki
  - text: 平成17年（2005年）5月5日に金谷町と合併し、平成20年（2008年）4月1日に川根町と合併して現在の島田市となった
    kind: fact
    level: E5
    status: established
    sources:
    - n4-shimada-city-wiki
  - text: 島田市の地方公共団体コードは222097である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 「越すに越されぬ大井川」を挟んだ双子の宿場
    text: 「箱根八里は馬でも越すが、越すに越されぬ大井川」とうたわれた難所の両岸に、島田宿と金谷宿は双子のように向かい合っていた。橋も船も許されず、旅人は川越人足の肩や蓮台に頼って渡るしかなかった。増水で川が止まれば、宿場は足止めされた旅人で大いに賑わったという。2005年、その両岸の宿場町が一つの市に合併した。川を挟んで向かい合ってきた二つの宿が、400年を経て同じ自治体になったのである。
    sources:
    - n4-shimada-gaiyo-edo
    - n4-shimada-city-wiki
  relations:
  - pref/22
  - muni/22-藤枝市
  - muni/22-掛川市
  - muni/22-焼津市
  unknowns:
  - 「島田」の語源は市公式資料にも明示がなく、専門辞典での確認は本バッチではできなかった
  - 『吾妻鏡』建久元年条の「嶋田」の原文は本バッチでは直接確認していない（市公式資料の紹介による）
  updated: '2026-11-13'
- id: muni/22-御前崎市
  code: '222232'
  names:
    ja: 御前崎市
    reading: おまえざきし
    aliases:
    - 御前崎町
    - 浜岡町
    - 御厩崎
  user_terms:
  - おまえざき
  - 御前崎市の名前の由来
  - 御前崎の岬
  - 浜岡原発のある市
  naming_type: 一部の地名
  prefecture: 静岡県
  homonyms: []
  summary: 御前崎市は2004年（平成16年）4月1日に御前崎町と浜岡町が合併して発足した市で、市名は静岡県最南端の岬「御前崎」の名を採用した。岬の名の由来には、江戸幕府が灯台と観音堂を設けたことから「神社の前にある岬」とする説と、馬の生産地であったことから「御厩崎（うまやざき）」が転じたとする説の2説があり、地名研究家の谷川彰英は前者が妥当と指摘しているという。新市名は合併協議会で委員の全会一致により決定した。
  first_attestation:
    era: null
    year_western: null
    document: null
    note: 岬の名「御前崎」の初出の史料は未確認。第一説が結びつける観音堂の建立は1635年（寛永12年）とされるが、それ以前から「御前崎」の名があったかどうかは確認できていない。「御前崎市」としての初出は2004年4月1日
  claims:
  - text: 総務省の全国地方公共団体コードで、御前崎市の団体コードは222232と定められている
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  - text: 2004年（平成16年）4月1日に榛原郡御前崎町と小笠郡浜岡町が合併して御前崎市が発足した
    kind: fact
    level: E5
    status: established
    sources:
    - v4-omaezaki-wiki
  - text: 合併後の新市名は2003年（平成15年）1月15日に浜岡町役場で開催された第5回合併協議会で、全国的にも有名な「御前崎」の案が委員の全会一致により「御前崎市」と決定した
    kind: fact
    level: E5
    status: established
    sources:
    - v4-omaezaki-wiki
  - text: 「御前崎」の名の由来の第一説は、岬の沿岸で海難事故が発生したことから江戸幕府が1635年（寛永12年）に灯台を設置し観音堂を建立し、「神社の前にある岬」から「御前崎」と呼称されるようになったとするものである
    kind: fact
    level: E5
    status: contested
    sources:
    - v4-omaezaki-wiki
  - text: 第二説は、馬の生産地として知られていたことから「御厩崎（うまやざき）」が転じて「御前崎」となったとするものである
    kind: fact
    level: E5
    status: contested
    sources:
    - v4-omaezaki-wiki
  - text: 日本地名研究所の所長を務めた谷川彰英は、第一説（神社の前にある岬）が妥当な解釈であると指摘している
    kind: fact
    level: E5
    status: established
    sources:
    - v4-omaezaki-wiki
  column:
    title: 「神の前」か「馬の厩」か
    text: 御前崎の「御前」の読み解きは2つに割れています。岬の観音堂に結びつける「神社の前の岬」説と、馬の生産地だったという「御厩崎（うまやざき）」の転訛説。地名研究家の谷川彰英は前者を妥当としましたが、決着したわけではありません。2004年の合併では、浜岡町側も含めた全会一致でこの岬の名が新市名に選ばれ、静岡県最南端のランドマークが、そのまま市の看板になりました。
    sources:
    - v4-omaezaki-wiki
  relations:
  - pref/22
  unknowns:
  - 2説の典拠となる御前崎市公式の市名由来の説明は本バッチでは未確認で、記述は Wikipedia の「市名の由来」節に拠る
  - 1635年の観音堂建立より前に「御前崎」の表記が史料に現れるかは未確認
  - 第一説の「神社」が具体的にどの社を指すのかは未確認
  updated: '2026-11-13'
- id: muni/22-御殿場市
  code: '222151'
  names:
    ja: 御殿場市
    reading: ごてんばし
    aliases:
    - 御殿場町
    - 御厨町
    - 御殿新町
  user_terms:
  - 御殿場市の名前の由来
  - 家康の御殿のまち
  - 富士山とアウトレットのまち
  - 御厨だったまち
  naming_type: その他（徳川家康の御殿に由来する地名の継承）
  prefecture: 静岡県
  homonyms: []
  summary: 「御殿場」の名は、江戸時代初期に建てられた徳川家康の御殿に由来すると市公式資料が説明する。沼津代官が地元の土豪・芹澤将監に命じて家康の使う御殿を造営させ、周辺に御殿新町が生まれたが、家康が実際にその御殿（休憩所）を使うことはなかったという。もとの中心地は伊勢神宮の荘園「御厨」の名を負う御厨町だったが、大正3年（1914年）に御殿場町へ改称し、昭和30年（1955年）の合併で御殿場市が発足した。
  first_attestation:
    era: 江戸時代
    year_western: null
    document: 御殿新町・御殿場村（江戸期の地名として）
    note: 御殿の造営年は諸説があり特定できない。市公式資料は江戸幕府成立後の出来事として紹介するが、正確な年は示していない
  claims:
  - text: 御殿場市公式資料によれば、江戸時代初期、沼津代官はこの地方の土豪・芹澤将監に対し、徳川家康が使う御殿の造営とその周辺への新町の建設を命じ、「御殿場」という地名はこの「御殿」に由来している
    kind: fact
    level: E2
    status: established
    sources:
    - n4-gotemba-keikan
  - text: 家康が実際にその御殿（休憩所）を使用することはなかったが、御殿を中心に御殿新町が生まれたと御殿場市公式資料は記している
    kind: fact
    level: E2
    status: established
    sources:
    - n4-gotemba-keikan
  - text: 御殿の跡とされる地に鎮座する吾妻神社には、東照大権現（徳川家康）が合祀され、「御殿場発祥の地」碑や「徳川家康公御殿土塁跡」碑が立つ
    kind: fact
    level: E5
    status: established
    sources:
    - n4-gotemba-azuma-wiki
  - text: 当地には平安時代に伊勢神宮の荘園である大沼鮎沢御厨があり、のちの御厨町の名にその名残を留めていた
    kind: fact
    level: E5
    status: established
    sources:
    - n4-gotemba-city-wiki
  - text: 大正3年（1914年）、御厨町が御殿場町に改称した
    kind: fact
    level: E2
    status: established
    sources:
    - n4-gotemba-keikan
  - text: 昭和30年（1955年）2月11日、御殿場町・富士岡村・原里村・印野村・玉穂村が対等合併して市制が施行され、御殿場市が誕生した
    kind: fact
    level: E5
    status: established
    sources:
    - n4-gotemba-city-wiki
  - text: 御殿場市の地方公共団体コードは222151である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 使われなかった御殿が、町の名になった
    text: 御殿場の語源は、将軍のために用意されながら、将軍本人には一度も使われなかった御殿である。駿府と江戸の往還の休憩所として建てられたというが、市公式資料はあっさりと「家康が実際に休憩所を使用することはありませんでした」と記す。それでも御殿を守り維持する人々が集まり、御殿新町が生まれ、地名が残った。権力者のための施設の名が、主の不在のまま土地の名として定着する。隣の御厨という古い荘園名を押しのけてまで生き残ったのは、使われなかった御殿の物語の強さかもしれない。
    sources:
    - n4-gotemba-keikan
  relations:
  - pref/22
  - muni/22-富士宮市
  - muni/22-富士市
  unknowns:
  - 御殿の造営年については、駿府在城期の休憩所とする説と、家康の遺骸を久能山から日光へ移す際の仮殿とする説などがあり、本バッチでは特定できなかった
  - 御殿の正確な位置（現在の吾妻神社付近と伝えられる）は考古学的に確定していない
  updated: '2026-11-13'
- id: muni/22-掛川市
  code: '222135'
  names:
    ja: 掛川市
    reading: かけがわし
    aliases:
    - 掛川町
    - 掛川宿
    - 懸川
  user_terms:
  - 掛川市の名前の由来
  - 掛川城の城下町
  - 掛川茶のまち
  - 雲霧城のまち
  naming_type: その他（川の地形に由来するとされる古地名の継承）
  prefecture: 静岡県
  homonyms: []
  summary: 市名は、城下町・宿場町として栄えた中心地「掛川」を受け継ぐ。由来は市中心部を流れる逆川にまつわるとされ、切り立った崖のような流れや、たびたび堤が欠ける川の姿から「缺けた川」「懸川」と呼ばれ、やがて「掛川」になったという説が伝えられるが、定説は定まっていない。室町時代に今川氏の家臣朝比奈氏が掛川城を築いて以降は遠江の要衝となり、昭和29年（1954年）に市制を施行、平成17年（2005年）に大東町・大須賀町と合併して現在の市域となった。
  first_attestation:
    era: 室町時代
    year_western: null
    document: 掛川城（懸川城）の築城に伴う地名の用例
    note: 「掛川」の文書上の確実な初出は本バッチでは特定できなかった。戦国期の城は「懸川城」とも表記されたとされる
  claims:
  - text: 地名の由来は中心部を流れる逆川にまつわるとされ、流れが切り立った崖のように見えたことから「缺けた川」と呼ばれ、次第に略されて「懸川」となり、さらに「掛川」になったという説がある
    kind: fact
    level: E5
    status: contested
    sources:
    - n4-kakegawa-city-wiki
  - text: 逆川については、蛇行が激しく堤が欠ける（決壊する）ことから「かけがわ」（欠川から掛川）とも呼ばれ、当地域が「掛川」と呼ばれる由縁になったとも伝えられる
    kind: fact
    level: E5
    status: contested
    sources:
    - n4-kakegawa-sakagawa-wiki
  - text: 掛川城は室町時代に、駿河の守護大名今川氏が遠江進出を狙い、家臣の朝比奈氏に命じて築かせたのが始まりであると掛川市は紹介している
    kind: fact
    level: E2
    status: established
    sources:
    - n4-kakegawa-castle
  - text: 天正18年（1590年）に城主となった山内一豊は天守閣や大手門を建設し城下町の整備に力を注ぎ、高知城は掛川城を模して作られたとも伝えられる
    kind: fact
    level: E2
    status: established
    sources:
    - n4-kakegawa-castle
  - text: 永禄11年（1568年）、駿河を追われた今川氏真が掛川城に逃げ込み、徳川家康が城を攻めた際、井戸から立ちこめた霧が城をすっぽりと覆い隠して攻撃できなくなったといい、以来掛川城は「雲霧城」とも呼ばれるようになったと伝えられる
    kind: legend
    level: E2
    status: established
    sources:
    - n4-kakegawa-castle
  - text: 明治22年（1889年）、掛川宿を中心に掛川町が発足した
    kind: fact
    level: E5
    status: established
    sources:
    - n4-kakegawa-city-wiki
  - text: 昭和29年（1954年）3月31日、掛川町が曽我村・東山口村を編入して市制を施行し、掛川市となった
    kind: fact
    level: E5
    status: established
    sources:
    - n4-kakegawa-city-wiki
  - text: 平成17年（2005年）4月1日、旧掛川市・大東町・大須賀町が合併して現在の掛川市が発足した
    kind: fact
    level: E5
    status: established
    sources:
    - n4-kakegawa-city-wiki
  - text: 掛川市の地方公共団体コードは222135である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 霧に守られた城
    text: 掛川城には、霧吹き井戸の伝説がある。1568年、駿河を失った今川氏真が朝比奈氏の掛川城に逃げ込み、徳川家康の軍に攻められたとき、城の井戸から霧が立ちこめて城をすっぽり隠し、徳川軍は攻撃を諦めたという。天守台の脇には今もその井戸が残り、城は「雲霧城」の別名を持つ。川が崖を欠く土地の名「掛川」に、霧に守られた城の物語が重なることで、この地名は単なる地形の記述以上の表情を持つようになった。
    sources:
    - n4-kakegawa-castle
  relations:
  - pref/22
  - muni/22-磐田市
  - muni/22-島田市
  unknowns:
  - 「掛川」の語源は市公式の地名解説を直接確認できておらず、諸説の典拠（市史等）は本バッチでは特定できなかった
  - 「掛川」の文書上の初出（中世の掛川郷などの用例）は本バッチでは特定できなかった
  updated: '2026-11-13'
- id: muni/22-森町
  code: '224618'
  names:
    ja: 森町
    reading: もりまち
    aliases:
    - 森町村
    - 三木の里
  user_terms:
  - 森町 静岡
  - 遠州の小京都
  - 三木の里 森町
  - 周智郡の町
  naming_type: 一部の地名
  prefecture: 静岡県
  homonyms:
  - muni/01-森町
  summary: 静岡県周智郡の町。町の説明では「森町という名前の村ができたのは鎌倉時代中頃」とされ、中世の村名を継承する。明治22年（1889）の町村制で森町として発足し、昭和30〜31年（1955〜56）の合併で現在の町域となった。古代の周智郡や小國神社の記録は古いが、「森」の名自体は中世以降のものである。
  first_attestation:
    era: 鎌倉時代中頃
    year_western: null
    document: 森の村の成立を伝える町公式の説明
    note: 具体的な文書名・年は町の説明では示されていない
  claims:
  - text: 町公式の説明によれば、「森町という名前の村ができたのは鎌倉時代中頃」で、それ以前の古代の資料に「森」の名は確認できない
    kind: fact
    level: E2
    status: established
    sources:
    - h2-mori-shizuoka-yurai
  - text: 周智郡と小國神社は『続日本後紀』承和7年（840）の記事に現れる古代以来の名だが、『和名類聚抄』に載る周智郡の5郷（大田・上山・野中・土器・井伊）に「森」はなく、「森」の名は中世のものである
    kind: fact
    level: E2
    status: established
    sources:
    - h2-mori-shizuoka-zusetsu
    - h2-mori-shizuoka-yurai
  - text: 明治22年（1889）の町村制施行で三倉村・天方村・森町・一宮村・園田村・飯田村が発足し、昭和30年（1955）に天方村・一宮村・園田村・飯田村が森町と合併、翌年に三倉村が合併して現在の森町となった
    kind: fact
    level: E2
    status: established
    sources:
    - h2-mori-shizuoka-keikan
  - text: 別名「三木の里」は、「森」の字が木を3つ重ねた形であることにちなむ
    kind: fact
    level: E2
    status: established
    sources:
    - h2-mori-shizuoka-yurai
  - text: 同名の比較（異なる層）：北海道森町が江戸時代の漁村名（アイヌ語オニウシに対応する和名）に由来するのに対し、静岡県森町は中世の村名の継承であり、名の古さが大きく異なる
    kind: fact
    level: E2
    status: established
    sources:
    - h2-mori-shizuoka-yurai
    - h2-mori-hok-tokei
  - text: 同名の比較（共通する層）：読みは北海道森町と同じ「もりまち」である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 遠州の小京都と「三木の里」
    text: 大正12年（1923）、地理学者の志賀重昂は森町を訪れて「遠州森町は如何にも小京都である」と称えたと観光協会は伝える。小國神社・天宮神社という古社を抱え、秋葉街道の宿場として栄えた町の佇まいが評価されたものだ。もう一つの愛称「三木の里」は、森の字が木を3つ重ねた形という、漢字の形そのものへの着目から生まれた。名の由来が分からなくても、字の形から新しい物語が生まれる例である。
    sources:
    - h2-mori-kanko
    - h2-mori-shizuoka-yurai
  relations:
  - pref/22
  - muni/01-森町
  unknowns:
  - 「森」の村名の具体的な初出文書は未確認（町の説明は鎌倉時代中頃とするが文書名を示していない）
  - 森の名の由来（森林の姿によるか、神社の森によるか等）を特定する資料は未確認
  updated: '2026-11-13'
- id: muni/22-沼津市
  code: '222038'
  names:
    ja: 沼津市
    reading: ぬまづし
    aliases:
    - 沼津町
    - 蓼原
  user_terms:
  - 沼津市の名前の由来
  - 沼津はなぜ沼津というのか
  - 吾妻鏡に初めて出る地名
  - 東海道沼津宿のまち
  naming_type: 一部の地名
  prefecture: 静岡県
  homonyms: []
  summary: 市名は狩野川河口の港町の名である。「沼津」の地名は鎌倉時代の歴史書『吾妻鏡』承元2年（1208年）の記事で文献に初めて現れると沼津市は紹介する。狩野川のほとりに蓼が茂っていたことから、この地は「蓼原」とも呼ばれたという。大正12年（1923年）7月1日、沼津町と楊原村の合併で市制が施行され、全国で89番目の市となった。
  first_attestation:
    era: 承元2年
    year_western: 1208
    document: 『吾妻鏡』承元2年（1208年）閏4月2日条（沼津市公式「沼津の歴史」が「文献に初めて記される」と紹介）
    note: 伊豆の狩野山から切り出した神宮・寺の造営用材木を「沼津の海」へ運び出したという記事
  claims:
  - text: 沼津市公式によれば、「沼津」という地名が文献に初めて記されるのは『吾妻鏡』承元2年（1208年）の記事である
    kind: fact
    level: E2
    status: established
    sources:
    - l3-numazu-azuma
  - text: 『吾妻鏡』のこの記事は、伊豆の山から切り出された大木が建材として「沼津の海」へ運ばれたという内容で、沼津は当時から材木を積み出す港だったことがうかがえる
    kind: fact
    level: E2
    status: established
    sources:
    - l3-numazu-azuma
  - text: 中世の沼津は狩野川河口の地で、水が深く流れも緩やかで港に適し、物資の集散地や漁港として発達していたと市は説明する
    kind: fact
    level: E2
    status: established
    sources:
    - l3-numazu-azuma
  - text: 狩野川のほとりに蓼が茂っていたことから、この土地は「蓼原」とも呼ばれたという
    kind: fact
    level: E2
    status: established
    sources:
    - l3-numazu-azuma
  - text: 明治22年（1889年）、字蓼原の一部を含む沼津町が置かれ、同年に東海道線が開通すると沼津町は急速に発展した
    kind: fact
    level: E2
    status: established
    sources:
    - l3-numazu-gappei
  - text: 大正12年（1923年）7月1日、沼津町と楊原村が対等合併して沼津市が誕生し、人口3万4482人の全国で89番目の市となった
    kind: fact
    level: E2
    status: established
    sources:
    - l3-numazu-tanjou
  - text: 昭和19年（1944年）4月1日、片浜村・金岡村・大岡村・静浦村の4か村と合併した
    kind: fact
    level: E2
    status: established
    sources:
    - l3-numazu-gappei
  - text: 総務省「地方公共団体コード一覧」では、沼津市のコードは222038とされる
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 初出は「港の記録」だった
    text: 1208年、『吾妻鏡』に初めて「沼津」の名が現れたとき、それは伊豆の山から切り出した材木を「沼津の海」へ下したという記事だった。地名の初出がそのまま、その土地の生業の記録になっている。狩野川の河口で水が深く静かな沼津は、漁港であると同時に、山の木を海へ送り出す物資集散の港でもあったのである。
    sources:
    - l3-numazu-azuma
  relations:
  - pref/22
  unknowns:
  - 「沼（沼地）＋津（港）」という語の構成による語源解釈は本バッチでは専門文献で裏づけが取れなかったため、主張としては記録しない
  - 『吾妻鏡』の原文そのものは未読であり、市の紹介を通じた記録である
  updated: '2026-11-13'
- id: muni/22-浜松市
  code: '221309'
  names:
    ja: 浜松市
    reading: はままつし
    aliases:
    - 浜津
    - 引間
    - 曳馬
    - 浜松町
  user_terms:
  - 浜松市の名前の由来
  - 浜松はなぜ浜松というのか
  - 曳馬と浜松の関係
  - 浜松城の名前の由来
  naming_type: 一部の地名
  prefecture: 静岡県
  homonyms: []
  summary: 市名は古代の郷名「浜松（はまつ）」を受け継いだものである。古くは「浜津」と書かれ、市の中心域は中世には引間（引馬）と呼ばれていたが、元亀元年（1570）に徳川家康が引間城を浜松城と改めてから、城下町の名として浜松が定着した。明治44年（1911）に市制を施行して浜松市となった。
  first_attestation:
    era: 奈良時代
    year_western: null
    document: 伊場遺跡出土木簡・『和名類聚抄』高山寺本
    note: 地名の古形「浜津（はまつ）」としての初出。現在の表記「浜松」は『和名類聚抄』の室町時代の写本に見える
  claims:
  - text: 浜松は古代の遠江国敷智郡の郷名で、『和名類聚抄』高山寺本には「浜津（はまつ）」とされ、奈良時代の伊場遺跡出土木簡にも同じ表記が見えると浜松市の概要は説明する
    kind: fact
    level: E2
    status: established
    sources:
    - k3-hamamatsu-gaiyo
  - text: 『和名類聚抄』の平安時代後期の写本には「浜津」とあるが、室町時代の写本では「浜松」と表記され「波万万都（はまつ）」の読み仮名が添えられており、表記は中世のうちに浜津から浜松へ移った
    kind: fact
    level: E2
    status: established
    sources:
    - k3-hamamatsu-fuchi
  - text: 中世の市の中心域は引間（引馬とも表記）と呼ばれ、『吾妻鏡』建長4年（1252）に東海道の引間宿の名が見えるなど、引間は当地随一の経済拠点として発展した
    kind: fact
    level: E2
    status: established
    sources:
    - k3-hamamatsu-gaiyo
  - text: 元亀元年（1570年）、徳川家康が引間城を改修して浜松城と改め、近世には城下町の名称として浜松が定着した
    kind: fact
    level: E2
    status: established
    sources:
    - k3-hamamatsu-gaiyo
  - text: 読みが「はまつ」のまま「浜津」から「浜松」へ字が置き換わった理由は、確認できた市の公式資料では説明されておらず、確定していない
    kind: fact
    level: E2
    status: indeterminate
    sources:
    - k3-hamamatsu-fuchi
    - k3-hamamatsu-gaiyo
  - text: 明治22年（1889）に浜松町が誕生し、明治44年（1911）7月1日の市制施行により、静岡県では静岡市に次いで2番目の市となる浜松市が誕生した
    kind: fact
    level: E2
    status: established
    sources:
    - k3-hamamatsu-gaiyo
  - text: 平成17年（2005）に浜松市・浜北市・天竜市など12市町村が合併して現在の浜松市となり、平成19年（2007）に政令指定都市へ移行した
    kind: fact
    level: E2
    status: established
    sources:
    - k3-hamamatsu-gaiyo
  - text: 総務省の全国地方公共団体コードで、浜松市の団体コードは221309と定められている
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 読みはそのまま、字だけが変わった
    text: 奈良時代の伊場遺跡の木簡に残るこの地の名は「浜津」でした。読みは今と同じ「はまつ」です。ところが室町時代の『和名類聚抄』の写本では、読み仮名「波万万都（はまつ）」を添えながら、字の方はもう「浜松」に置き換わっています。なぜ「津」が「松」になったのか、市の資料は教えてくれません。一方、中世のまちの中心は引間と呼ばれ、浜松はその周辺を指す地名でした。1570年に家康が引間城を浜松城と改めると、周辺地名だったはずの浜松が城と城下町全体の名前に昇格します。読みは奈良時代から不変、主役の地名は中世と近世で入れ替わった、というのが浜松の名前の歩みです。
    sources:
    - k3-hamamatsu-fuchi
    - k3-hamamatsu-gaiyo
  relations:
  - pref/22
  unknowns:
  - 「浜津」から「浜松」へ表記が変わった理由と正確な時期は、市の公式資料では確定していない
  - 「浜津」の「津」が浜名湖の港を指すのかなど、語源そのものの検証は専門の地名辞典まで確認できていない
  - 引間（ひくま）の語源については本バッチでは確認できていない
  updated: '2026-11-13'
- id: muni/22-清水町
  code: '223417'
  names:
    ja: 清水町
    reading: しみずちょう
    aliases:
    - 清水村
  user_terms:
  - 清水町 静岡
  - 柿田川の清水町
  - 駿東郡の清水町
  - 湧水の町 清水
  naming_type: その他（湧水にちなむ新規命名）
  prefecture: 静岡県
  homonyms:
  - muni/01-清水町
  summary: 静岡県駿東郡の町。明治22年（1889）に12か村と徳倉村が合併して清水村となり、昭和38年（1963）に町制施行した。合併前の構成村に「清水」はなく、町名は日本歴史地名大系が「町名の由来ともなった湧水」と記す柿田川の清らかな湧水にちなむ新規命名である。
  first_attestation:
    era: 明治22年
    year_western: 1889
    document: 町村制施行による清水村の成立
    note: 合併前の構成村に「清水」の名はなく、湧水にちなむ新名として付けられた
  claims:
  - text: 日本歴史地名大系は、狩野川（古くは泉川とも呼ばれた）に注ぐ湧水の川・柿田川を「町名の由来ともなった湧水」と記す
    kind: fact
    level: E3
    status: established
    sources:
    - h2-kotobank-shimizu
  - text: 明治22年（1889）に12か村と徳倉村が合併して清水村となり、昭和38年（1963）に町制を施行して清水町となった
    kind: fact
    level: E2
    status: established
    sources:
    - h2-shimizu-shizuoka-plan
  - text: 柿田川は富士山に降った雨や雪が伏流水となって湧き出す川で、湧水量は日量約100万トンとされ、環境省の名水百選に選ばれている
    kind: fact
    level: E2
    status: established
    sources:
    - h2-kakita-meisui
  - text: 同名の比較（共通する層と異なる層）：「清水（清らかな水）」に由来する点は北海道清水町と共通するが、こちらは土地の湧水をそのまま名にした和名であり、アイヌ語（ペケレベツ）の意訳である北海道清水町とは出発点が異なる
    kind: fact
    level: E3
    status: established
    sources:
    - h2-kotobank-shimizu
    - h2-shimizu-hok-history
  - text: 同じ静岡県内には旧清水市（現在の静岡市清水区）という別の大きな「清水」があり、県内でも同名の地名が重なっている
    kind: fact
    level: E3
    status: established
    sources:
    - h2-kotobank-shimizu
  - text: 同名の比較（共通する層）：読みは北海道清水町と同じ「しみずちょう」である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 名は看板に偽りなし——県内最小の町と日本有数の湧水
    text: 清水町の面積は静岡県の市町村で最も小さい部類だが、その小さな町域に、1日約100万トンもの水が湧く柿田川が流れる。「清らかな水」という名は、誇張でも願望でもなく、町の真ん中を流れる川そのものの描写だった。1889年、合併した村々がどの村の名でもない中立の新名として「清水」を選んだのは、水の恵みこそが共通の財産だったからだろう。
    sources:
    - h2-kakita-meisui
    - h2-shimizu-shizuoka-plan
  relations:
  - pref/22
  - muni/01-清水町
  unknowns:
  - 1889年の合併時に「清水」の名を選んだ経緯を示す議事記録等は未確認
  - 柿田川が「町名の由来ともなった湧水」とする以上の、命名者や選定過程は未確認
  updated: '2026-11-13'
- id: muni/22-湖西市
  code: '222216'
  names:
    ja: 湖西市
    reading: こさいし
    aliases:
    - 湖西町
    - 鷲津町
    - 白須賀町
    - 新居町
  user_terms:
  - こさい
  - 湖西市の名前の由来
  - 浜名湖の西
  - 静岡県最西端の市
  naming_type: その他
  prefecture: 静岡県
  homonyms: []
  summary: 湖西市は、1955年（昭和30年）に鷲津町・白須賀町・新所村・入出村・知波田村の2町3村が合併して生まれた湖西町が、1972年（昭和47年）1月1日に市制を施行した市である。「湖西」は、全国的に知られる浜名湖の西岸に位置することに基づく方角地名で、市は自らを「浜名湖の西岸のまち」と紹介している。2010年（平成22年）には新居町を編入し、現在の市域となった。
  first_attestation:
    era: 昭和30年
    year_western: 1955
    document: null
    note: 「湖西」の地名の初出は1955年4月1日の湖西町発足時。方角地名であることは市の位置と公式の説明から明らかだが、命名の経緯（候補名や選定理由）を記した公式資料は未確認
  claims:
  - text: 総務省の全国地方公共団体コードで、湖西市の団体コードは222216と定められている
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  - text: 湖西市によれば、戦後の市域は鷲津町・白須賀町・新所村・入出村・知波田村の2町3村に分かれており、これらが町村合併促進法を受け昭和30年（1955年）4月1日に湖西町となった
    kind: fact
    level: E2
    status: established
    sources:
    - v4-kosai-city-ayumi
  - text: 湖西市によれば、昭和47年（1972年）1月1日に3万人市制特例法に基づき静岡県で21番目の市として市制を施行し、湖西市となった
    kind: fact
    level: E2
    status: established
    sources:
    - v4-kosai-city-ayumi
  - text: 湖西市は自らを「浜名湖の西岸のまち」と紹介しており、「湖西」の名は浜名湖の西という位置に基づく
    kind: fact
    level: E2
    status: established
    sources:
    - v4-kosai-city-ayumi
  - text: 湖西市は静岡県で最も西に位置し、市の範囲は浜名湖西岸から愛知県との県境に及ぶ
    kind: fact
    level: E5
    status: established
    sources:
    - v4-kosai-wiki
  - text: 湖西市によれば、平成22年（2010年）3月23日に120年の歴史を持つ新居町と合併した
    kind: fact
    level: E2
    status: established
    sources:
    - v4-kosai-city-ayumi
  column:
    title: 湖を基準にした方角の名
    text: 方角地名は普通、山や川や城下町を基準にしますが、湖西市の基準は浜名湖そのものです。県境の市が「県の西端」ではなく「湖の西」と名乗ったことで、名は県を越えて湖の地理を指し示すようになりました。滋賀県には琵琶湖の西岸を通るJR湖西線があり、「湖西」は大きな湖の西岸を指す言葉として日本に2か所で生きています。2010年に編入した新居町は東海道の関所・新居関で知られる宿場町で、市の歴史の層はこの合併で大きく厚くなりました。
    sources:
    - v4-kosai-city-ayumi
    - v4-kosai-wiki
  relations:
  - pref/22
  unknowns:
  - 1955年の湖西町発足時に「湖西」の名が選ばれた経緯（他の候補名の有無）は未確認
  - 「湖西」という地域名が1955年以前から浜名湖西岸一帯の呼称として使われていたかは未確認
  updated: '2026-11-13'
- id: muni/22-焼津市
  code: '222127'
  names:
    ja: 焼津市
    reading: やいづし
    aliases:
    - 焼津町
    - 焼遣
    - 益津
  user_terms:
  - 焼津市の名前の由来
  - ヤマトタケルの焼津
  - カツオとマグロの港町
  - 草薙と対の地名
  naming_type: その他（記紀の伝説に由来する古地名の継承）
  prefecture: 静岡県
  homonyms: []
  summary: 「焼津」の名は、『古事記』『日本書紀』が伝える日本武尊（ヤマトタケル）東征の火難伝説に由来するとされる、全国でも珍しい記紀に起源説話を持つ地名である。賊の火攻めに遭った尊が草を薙ぎ向かい火で逃れた故事から、剣は草薙剣と呼ばれるようになり、その地は焼津（古事記では焼遣）と呼ばれたという。近代以降は遠洋漁業の港町として発展し、明治34年（1901年）に焼津町となり、昭和26年（1951年）に市制を施行した。
  first_attestation:
    era: 奈良時代
    year_western: 720
    document: 日本書紀（景行天皇紀の「焼津」）・古事記（「焼遣」）
    note: 地名の起源を説く伝説中の用例として。両書で伝承地の国名が異なり（書紀は駿河国、古事記は相武国）、当地への比定は後世の伝承に基づく
  claims:
  - text: 『日本書紀』『古事記』の伝える日本武尊の東征伝説では、賊の火攻めに遭った尊が剣で草を薙ぎ払い向かい火を放って難を逃れた地を「焼津」（古事記では「焼遣」）と呼んだとされ、この故事により剣は草薙剣と呼ばれるようになったという
    kind: legend
    level: E5
    status: established
    sources:
    - n4-yaizu-jinja-wiki
  - text: 火難伝説の地について『日本書紀』は駿河国、『古事記』は相武国（相模国か）と記して異同があり、『焼津市史』は書紀の記述に原初的な要素を見て、伝承地が駿河から相模へ移されたのは古事記の編纂過程の影響と推測している
    kind: fact
    level: E5
    status: contested
    sources:
    - n4-yaizu-jinja-wiki
  - text: 『万葉集』巻3には、駿河国の地名として「焼津辺」を詠んだ歌が知られる
    kind: fact
    level: E5
    status: established
    sources:
    - n4-yaizu-jinja-wiki
  - text: 駿河国には益頭（のち益津）と呼ばれる郡・郷があり、これは「ヤキツ」の「焼」の字を忌んで好字の「益」を当てたものが「マシヅ」の読みに転訛したものとされる
    kind: fact
    level: E5
    status: established
    sources:
    - n4-yaizu-jinja-wiki
  - text: 延長5年（927年）成立の『延喜式』神名帳には、駿河国益頭郡の式内社として焼津神社が記載される
    kind: fact
    level: E5
    status: established
    sources:
    - n4-yaizu-jinja-wiki
  - text: 明治34年（1901年）6月28日に町制を施行して焼津町となり、昭和26年（1951年）3月1日に市制を施行して焼津市となった
    kind: fact
    level: E5
    status: established
    sources:
    - n4-yaizu-city-wiki
  - text: 焼津市の地方公共団体コードは222127である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 一つの伝説から生まれた二つの地名
    text: ヤマトタケルの火難伝説は、静岡の地名を二つ生んだ。炎に囲まれた地は「焼津」、そのときに草を薙いだ剣の名を負う地は、東へ約30キロ離れた静岡市清水区の「草薙」である。焼津神社と草薙神社はともに式内社で、同じ伝説を分かち合う双子のような存在だ。伝説の舞台が駿河だったのか相模だったのかは記紀の間でも食い違うが、地名の側は静岡にしっかりと根を下ろした。小泉八雲がこよなく愛した漁港の名が、神話の英雄の危機一髪に由来するというのも、焼津らしい物語である。
    sources:
    - n4-yaizu-jinja-wiki
  relations:
  - pref/22
  - muni/22-静岡市
  - muni/22-藤枝市
  - muni/22-島田市
  unknowns:
  - 『焼津市史』の伝承地に関する見解は、本バッチではWikipedia経由の紹介にとどまり原典を確認していない
  - 先行地名としての「ヤキツ」の語源（天然ガスの自燃に由来する等の説がある）は裏付けを取れなかった
  - 焼津市公式サイトの地名由来の解説は本バッチでは確認できなかった
  updated: '2026-11-13'
