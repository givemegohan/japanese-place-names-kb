prefecture_code: '40'
records:
- id: muni/40-うきは市
  code: '402257'
  names:
    ja: うきは市
    reading: うきはし
    aliases:
    - 浮羽町
    - 吉井町
  user_terms:
  - うきははなぜひらがななの
  - 浮羽（うきは）の読み方
  - フルーツの里うきは
  - 筑後吉井の白壁のまち
  naming_type: 旧行政区画名の継承
  formation: 合併新設
  prefecture: 福岡県
  homonyms: []
  summary: 平成17年（2005年）3月20日、浮羽町と吉井町が合併して発足した市。市名は両町が属した浮羽郡の名によるが、表記は合併協議会が公募と投票を経て平仮名の「うきは」を選んだ。「浮羽」の名は古代の生葉郡（いくは）に連なり、『日本書紀』景行天皇条には、従者が盞（うき）を忘れた地を「浮羽」と号したという地名伝承が記されている。
  first_attestation:
    era: 霊亀2年
    year_western: 716
    document: 平城宮跡出土木簡（「筑後国生葉郡煮塩年魚…」と記す）
    note: 郡名「生葉」の初見として『日本歴史地名大系』が示すもの。「浮羽」の表記は『日本書紀』景行天皇18年条の地名伝承記事に見えるが、実際の行政地名としては「的」「生葉」が先行し、「浮羽」が郡名になったのは明治29年（1896年）である
  claims:
  - text: うきは市の地方公共団体コードは402257である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  - text: 平成17年（2005年）3月20日、旧浮羽町と旧吉井町が合併して「うきは市」が誕生し、福岡県内26番目の市となったと市公式の概要は伝える
    kind: fact
    level: E2
    status: established
    sources:
    - r4-ukiha-city-profile
  - text: 新市の名称は、住民らを対象に公募し、幹事会で5点に絞り込んだうえで合併協議会の委員による投票で決定され、選定理由として「慣れ親しんだ名称であること」と「『ひらがな』の方が読みやすく優しい感じがすること」が挙げられた
    kind: fact
    level: E2
    status: established
    sources:
    - r4-ukiha-gappei-jirei
  - text: 『日本歴史地名大系』は、『日本書紀』景行天皇18年8月条に「的邑に到りて進食す。是の日に、膳夫等、盞を遺る。故、時人、其の盞を忘れし処を号けて浮羽と曰ふ」とみえ、盞（ウキ）を「浮羽」と呼んだことからその地を「浮羽」と称し、これが訛って的（いくは）邑になったとする記事があることを紹介している
    kind: fact
    level: E3
    status: established
    sources:
    - r4-ukiha-kotobank-ikuha
  - text: 『筑後国風土記』逸文（『釈日本紀』所引）は、景行天皇が「惜しきかも。朕が酒盞はや」と言ったことから「宇枳波夜郡（ウキハヤノコホリ）」と呼んだが、後の人が誤って「生葉郡」となったと伝えており、「浮羽」と「生葉」のどちらが本字かは古代の資料の間でも説明が食い違う
    kind: fact
    level: E3
    status: contested
    sources:
    - r4-ukiha-kotobank-ikuha
  - text: 郡名の初見は霊亀2年（716年）の年紀をもつ平城宮跡出土木簡の「筑後国生葉郡」の記載であり、『和名類聚抄』も筑後国に生葉郡（訓は「以久波」）を載せると『日本歴史地名大系』は記す
    kind: fact
    level: E3
    status: established
    sources:
    - r4-ukiha-kotobank-ikuha
  - text: 明治29年（1896年）に竹野郡と生葉郡の一部をもって浮羽郡が発足し、昭和26年（1951年）には御幸町が周辺の村を編入して浮羽町へと改称した
    kind: fact
    level: E3
    status: established
    sources:
    - upg-p11-ukiha-kotobank-ukihagun
    - r4-ukiha-kobunshokan
  - text: 景行天皇がこの地で食事をした際、供の者が酒盞（うき）を持ってくるのを忘れ、天皇が「惜しきかも、朕が酒盞（うき）はや」と嘆いたことが「うきは」の名の起こりだと伝えられる
    kind: legend
    level: E3
    status: established
    sources:
    - r4-ukiha-kotobank-ikuha
  column:
    title: 盞を忘れた天皇と、ひらがなの市名
    text: 『日本書紀』と『筑後国風土記』の逸文は、景行天皇が九州巡幸の途次、この地で盞（さかずき）を忘れた従者を嘆いた故事を「浮羽」の名の起こりとして伝える。ただし実際に使われた郡名は長く「生葉（いくは）」で、「浮羽」が郡名として復活したのは明治29年（1896年）のことだった。平成17年（2005年）の合併では、その由緒ある漢字ではなく平仮名の「うきは」が選ばれた。理由は「ひらがなの方が読みやすく優しい感じがする」からだという。古代の天皇の嘆きに由来する名が、優しさを理由に平仮名で蘇った市名である。
    sources:
    - r4-ukiha-kotobank-ikuha
    - r4-ukiha-gappei-jirei
  relations:
  - pref/40
  unknowns:
  - 「浮羽」の語源について、『日本書紀』は盞（ウキ）の故事を掲げ、生葉（イクハ）はその訛とするが、実際の用例では生葉が先行しており、語源の確定はできない
  - 新市名公募の応募総数と、最終候補5点の具体的な名称は、確認した資料では示されていなかった
  updated: '2026-11-13'
- id: muni/40-みやこ町
  code: '406252'
  names:
    ja: みやこ町
    reading: みやこまち
    aliases:
    - 勝山町
    - 犀川町
    - 豊津町
  user_terms:
  - みやこまち
  - 京都郡の町
  - みやこぐん
  - 豊前国府の町
  naming_type: 旧行政区画名の継承
  formation: 合併新設
  prefecture: 福岡県
  homonyms: []
  summary: 福岡県東部、京都郡の町。2006年3月20日に勝山町・犀川町・豊津町の新設合併で発足した。町名は郡名によるもので、京都郡は「きょうと」ではなく「みやこ」と読む。郡名の由来には、日本書紀に記される景行天皇の滞在伝承が地域資料で紹介されている。豊津地区には豊前国の国府跡・国分寺跡がある。
  first_attestation:
    era: 平成時代
    year_western: 2006
    document: 3町の新設合併による新町名「みやこ町」
    note: 町名そのものは2006年の新命名。由来となった郡名「京都（みやこ）」の初出文献は未確認
  claims:
  - text: 2006年（平成18年）3月20日、豊津町・犀川町・勝山町の3町が新設合併してみやこ町が発足した
    kind: fact
    level: E2
    status: established
    sources:
    - r3-yanagawa-soumu-gappei
    - r3-miyako-wiki
  - text: 町名は、所属する京都郡の郡名「みやこ」に因んで名付けられた
    kind: fact
    level: E5
    status: established
    sources:
    - r3-miyako-wiki
  - text: 京都郡は「きょうと」ではなく「みやこ」と読み、豊津・犀川など旧仲津郡の区域は1896年（明治29年）に京都郡へ編入されて、現在の郡の範囲となった
    kind: fact
    level: E3
    status: established
    sources:
    - upg-p8-miyako-kotobank-gun
  - text: 郡名「みやこ」の由来として、日本書紀に、景行天皇が九州に来られた際に仮の御殿を建てて滞在され、天皇がしばらく住まわれた場所なのでこの地は「みやこ」と呼ばれるようになった、との記述があると地域の観光協会資料が紹介する
    kind: legend
    level: E4
    status: indeterminate
    sources:
    - r3-miyako-pref-pdf
    - r3-miyako-jiji
  - text: 豊津地区では豊前国の国府跡や国分寺跡が発見されており、古代には豊前国の中心地であったとされる
    kind: fact
    level: E2
    status: established
    sources:
    - upg-p8-miyako-museum-kokufu
    - upg-p8-miyako-youran2024
  - text: 総務省の地方公共団体コードは406252である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 「京都」と書いて「みやこ」と読む
    text: みやこ町の名は、日本で唯一といっていい読み方をする郡名から来ている。「京都」と書いて「きょうと」ではなく「みやこ」と読む京都郡である。地元では、日本書紀にある景行天皇の滞在の物語がその由来として語られ、実際に豊津には豊前国の国府と国分寺があった。都（みやこ）とは無関係に思える地名の奥に、古代の国の中心地だったという土地の記憶が重なっている。
    sources:
    - r3-miyako-pref-pdf
    - r3-miyako-wiki
  relations:
  - pref/40
  unknowns:
  - 郡名「京都（みやこ）」の初出文献と、古代における読みの確定資料は未確認
  - 景行天皇の滞在を記すとされる日本書紀の原文該当箇所は未読のため、伝承として記録した
  updated: '2026-11-13'
- id: muni/40-みやま市
  code: '402290'
  names:
    ja: みやま市
    reading: みやまし
    aliases:
    - 瀬高町
    - 山川町
    - 高田町
  user_terms:
  - みやま市はなぜ「みやま」なの
  - 旧瀬高町のあたり
  - 三池と山門のまち
  - セロリの産地みやま
  naming_type: 合成地名
  formation: 合併新設
  prefecture: 福岡県
  homonyms: []
  summary: 平成19年（2007年）1月29日、山門郡の瀬高町・山川町と三池郡の高田町が合併して発足した市。市の説明では、市名「みやま」は山門郡と三池郡の名称にちなみ、3町にある清水山・御牧山・愛宕山の3つの山や、美しい山並みに囲まれた豊かな市をイメージしたものとされる。市役所は旧瀬高町に置かれた。
  first_attestation:
    era: 平成18年
    year_western: 2006
    document: 総務大臣による瀬高町・山川町・高田町の合併の告示（平成18年7月13日）
    note: 市名「みやま」としての初出はこの合併告示とされ、自治体としては平成19年（2007年）1月29日に発足した。もとの地名である瀬高・山川・高田はいずれも古い村名に遡るが、市名自体は合併時の新命名である
  claims:
  - text: みやま市の地方公共団体コードは402290である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  - text: 山門郡の瀬高町・山川町と三池郡の高田町の3町は合併協議会を設置して協議を進め、平成18年（2006年）3月に調印と合併の議決を終え、平成19年（2007年）1月29日に「みやま市」が誕生したと市の市勢概要は伝える
    kind: fact
    level: E2
    status: established
    sources:
    - r4-miyama-shisei-gaiyo
  - text: 市名「みやま」の由来について市の市勢概要は、「山門郡と三池郡の名称にちなみ、また3町にある清水山、御牧山、愛宕山の3つの山、美しい山、海と山に囲まれた豊かな市をイメージさせます」と説明している
    kind: fact
    level: E2
    status: established
    sources:
    - r4-miyama-shisei-gaiyo
  - text: 新市名は公募され、応募の上位には「三山（みやま）」「山門（やまと）」「筑南（ちくなん）」などが挙がり、最終候補3点（三山・山門・筑南）の中から「みやま」が選定されたと市区町村変遷のデータベースは伝える
    kind: fact
    level: E5
    status: established
    sources:
    - r4-miyama-hensen-db
  - text: 合併協議会は全部で13回開催され、平成18年（2006年）7月13日に総務大臣による合併の告示が行われたと市の市勢概要は伝える
    kind: fact
    level: E2
    status: established
    sources:
    - r4-miyama-shisei-gaiyo
  - text: 市の中心となった旧瀬高町は矢部川沿いに栄えた町で、新市役所も旧瀬高町（瀬高町小川）に置かれた
    kind: fact
    level: E2
    status: established
    sources:
    - r4-miyama-shisei-gaiyo
  column:
    title: 二つの郡の名を編んだ「みやま」
    text: みやま市の名は、合併した3町が属していた二つの郡、山門郡と三池郡の名にちなむと市は説明する。三池の「み」と山門の「やま」をつないだ読みに、3町それぞれの山（清水山・御牧山・愛宕山）の姿と「美しい山」の願いが重ねられた。公募では漢字の「三山」が最有力候補だったと伝えられ、それを平仮名に開いた「みやま」が最終的に選ばれた。郡の境界を越えた合併の象徴として、どちらの郡の名も捨てずに編み合わせた市名である。
    sources:
    - r4-miyama-shisei-gaiyo
    - r4-miyama-hensen-db
  relations:
  - pref/40
  unknowns:
  - 旧中心地名「瀬高」の語源（矢部川の瀬に由来するという説があるが、公的・専門資料では確認できなかった）
  - 公募の応募総数と、最終候補から「みやま」を選んだ投票等の具体的な手続きは、市の公表資料では確認できなかった
  updated: '2026-11-13'
- id: muni/40-上毛町
  code: '406465'
  names:
    ja: 上毛町
    reading: こうげまち
    aliases:
    - 新吉富村
    - 大平村
  user_terms:
  - こうげまち
  - 大平山の町
  - 旧上毛郡の町
  naming_type: 旧行政区画名の継承
  formation: 合併新設
  prefecture: 福岡県
  homonyms: []
  summary: 福岡県東端、築上郡の町。2005年10月11日に新吉富村と大平村が合併し町制施行して発足した。町名は、築上郡が誕生する前にこの地域が属していた旧郡名「上毛郡」にちなむ復活命名である。この「上毛」は豊前国の三毛郡が山国川を境に上下に分かれた一方に由来し、群馬県の旧国名「上毛野」との直接の関係は確認できない。
  first_attestation:
    era: 平成時代
    year_western: 2005
    document: 合併による新町名「上毛町」（旧郡名の復活採用）
    note: 町名そのものは2005年の新命名。旧郡名「上毛」自体は古代の三毛郡の分割に遡る
  claims:
  - text: 2005年（平成17年）10月11日、新吉富村と大平村が対等合併し、町制を施行して上毛町が発足した
    kind: fact
    level: E2
    status: established
    sources:
    - r3-yanagawa-soumu-gappei
    - r3-koge-wiki
  - text: 町名は、築上郡が誕生する前、この地域が明治時代以前に上毛郡と呼ばれていたことから、その旧郡名にちなんで名付けられた
    kind: fact
    level: E2
    status: established
    sources:
    - upg-p8-koge-youran2024
  - text: 上毛郡は、古代の三毛郡（みけのこおり）が後に山国川を境に上三毛郡と下三毛郡に分けられ、さらに上毛郡・下毛郡となったものである
    kind: fact
    level: E2
    status: established
    sources:
    - upg-p8-koge-youran2024
  - text: 群馬県の旧国名「上毛野（こうずけ）」との直接の関係を示す資料は確認できず、当地の「上毛」は豊前国三毛郡の上下分割に由来する、由来の経路が異なる地名である
    kind: fact
    level: E5
    status: established
    sources:
    - r3-koge-gun-wiki
  - text: 前身の大平村は1955年（昭和30年）に唐原村と友枝村の合併で誕生した。新吉富村も同年に西吉富村と南吉富村の合併で誕生した
    kind: fact
    level: E2
    status: established
    sources:
    - upg-p8-koge-youran2024
  - text: 合併は当初、吉富町・新吉富村・大平村の3町村で進められ、新町名は「大富町」（おおとみまち）に決まっていたが、管理部門の位置などをめぐって合意に至らず3町村の協議会は解散し、吉富町を除く新吉富村・大平村の2村で合併することとなった
    kind: fact
    level: E2
    status: established
    sources:
    - upg-ae2-fukuoka-gappeishi3
  - text: 総務省の地方公共団体コードは406465である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 消えた町名「大富町」
    text: 上毛町が誕生する前、この地域の合併後の名前は別のものに決まっていた。吉富町・新吉富村・大平村の3町村は法定合併協議会を設け、新町名を「大富町」と決定した。しかし役場の位置などをめぐって協議は難航し、吉富町は合併から離脱。残った2村は旧郡名「上毛」を新しい町の名に選んだ。決まっていた名前が消え、失われていた郡の名前が百年ぶりに自治体名として戻ってきた合併である。
    sources:
    - r3-koge-wiki
    - r3-yoshitomi-wiki
  relations:
  - pref/40
  - muni/40-吉富町
  unknowns:
  - 旧郡名「上毛」の初出文献（古代の三毛郡の分割を記す一次史料）は未確認
  updated: '2026-11-13'
- id: muni/40-中間市
  code: '402150'
  names:
    ja: 中間市
    reading: なかまし
    aliases:
    - 中間町
    - 長津町
    - 長津村
    - 中間村
