  - text: 1987年（昭和62年）10月1日に神川村が町制を施行して神川町となり、2006年（平成18年）1月1日に神泉村と合併して新しい神川町が発足した
    kind: fact
    level: E2
    status: established
    sources:
    - w11-kamikawa-estat
  - text: 神川村の命名理由を明記した公的資料は確認できず、神流川にちなむ命名と考えられるものの確証はない
    kind: fact
    level: E5
    status: indeterminate
    sources:
    - w11-kamikawa-wiki
  - text: 干ばつに悩むこの地では金鑽神社にまつわる龍神伝説が伝えられ、現れた武蔵国の役人が「私が金龍になって神流川の流れを導く」と告げて姿を消し、その後に九郷用水が切り拓かれたという
    kind: legend
    level: E2
    status: established
    sources:
    - w11-kanna-water
  - text: 神川町の地方公共団体コードは113832である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 金の龍が導いた川
    text: 神流川沿いは、ひとたび大雨が降れば洪水、降らなければ渇水という、治水と利水の両方に苦しんだ土地だった。水資源機構の資料が伝える金鑽神社の龍神伝説では、干ばつの地に現れた武蔵国の役人が「私が金龍になって神流川の流れを導く」と言い残して姿を消し、そののちに九郷用水が切り拓かれたという。神流川の「神」は古く「カミノ川」から転じたと国土交通省は解説するが、水を神に願うしかなかった土地の暮らしが、「神の川」の名をいっそう重いものにしてきた。1954年に生まれた「神川」という村名も、この川の名の重みの上に成り立っている。
    sources:
    - w11-kanna-water
    - w11-kanna-mlit
  relations:
  - pref/11
  - muni/11-皆野町
  unknowns:
  - 神川村（1954年）の命名理由の公式記録は確認できなかった（神流川にちなむのか、両村に共通する要素から採ったのかは未確認）
  - 川名「神流川」の文書上の初出は確認できなかった
  updated: '2026-11-13'
- id: muni/11-秩父市
  code: '112071'
  names:
    ja: 秩父市
    reading: ちちぶし
    aliases:
    - 大宮町
    - 大宮郷
    - 秩父町
    - 知知夫
    - 知々夫国
  user_terms:
  - 秩父の名前の由来
  - ちちぶの語源
  - 和同開珎のふるさと
  - 大宮町から秩父へ
  naming_type: 中心地名の継承
  formation: 合併新設
  prefecture: 埼玉県
  homonyms: []
  summary: 市名は古代の知知夫国（ちちぶのくに）、のちの武蔵国秩父郡に由来する古い地域名を受け継いだものである。中心地は長く大宮郷・大宮町と呼ばれたが、大正5年（1916年）に郡名を採って秩父町と改称し、昭和25年（1950年）に市制を施行した。和銅元年（708年）に秩父郡から自然銅が献上され、元号が「和銅」に改められた地でもある。
  first_attestation:
    era: 慶雲5年（和銅元年）
    year_western: 708
    document: 『続日本紀』（武蔵国秩父郡の献銅の記事）
    note: 秩父市公式資料が紹介する、記録で確実に追える初出級の用例。地名の古い形「知知夫」は『先代旧事本紀』国造本紀の知知夫国造にも見えるとされる
  claims:
  - text: 秩父市公式資料によれば、この地は『先代旧事本紀』国造本紀に知知夫国造が見える「知知夫国」であり、後に无邪志国と合わさって武蔵国の一部となり、秩父郡が置かれた
    kind: fact
    level: E2
    status: established
    sources:
    - m4-chichibu-vision
  - text: 秩父市公式資料によれば、西暦708年に武蔵国秩父郡から自然銅（和銅、にぎあかがね）が朝廷に献上されたことが『続日本紀』に現れ、これを記念して元号が「和銅」に改められ、この銅によって和同開珎が鋳造された
    kind: fact
    level: E2
    status: established
    sources:
    - m4-chichibu-vision
  - text: 市の中心地は、古く中村郷、のち大宮郷と呼ばれた秩父神社の門前町で、明治22年（1889年）に大宮町となり、大正5年（1916年）1月1日に秩父町へ改称した。改称の理由には、秩父郡の中心であること、秩父鉄道の駅が郡名を採って「秩父駅」となったこと、県内の北足立郡大宮町との混同を避けることが挙げられる
    kind: fact
    level: E5
    status: established
    sources:
    - m4-chichibu-wiki
  - text: 昭和25年（1950年）4月1日に市制を施行して秩父市となり、平成17年（2005年）4月1日に旧秩父市・吉田町・荒川村・大滝村が新設合併して現在の秩父市となった
    kind: fact
    level: E5
    status: established
    sources:
    - m4-chichibu-wiki
  - text: 「ちちぶ」の語源には諸説があり、国造・知知夫彦命に由来するという説、イチョウを意味する古語「チチノキ」説、鍾乳石の別名「乳石（ちちいし）」説、アイヌ語で「冷やかな清水」を意味するという説、「千千峰（峰が多い）」説、父母を意味する「ちちぼ」説などが挙げられ、定説はない
    kind: fact
    level: E5
    status: contested
    sources:
    - m4-chichibu-basin
  - text: 総務省の全国地方公共団体コードで、秩父市のコードは112071と定められている（J-LISの埼玉県内市町村一覧による）
    kind: fact
    level: E2
    status: established
    sources:
    - k1-jlis-saitama
  column:
    title: 「大宮」を手放した町
    text: 秩父の中心地は、もともと大宮郷・大宮町だった。ところが1916年、町は郡名を名乗り「秩父町」に改称した。理由の一つが、同じ県内に北足立郡の大宮町があったことだと言われる。その大宮町は後に大宮市となり、2001年にさいたま市へ合流した。県内に二つあった「大宮」は、一つが郡の名に、一つが県都の名に、それぞれ姿を変えた。
    sources:
    - m4-chichibu-wiki
  relations:
  - pref/11
  unknowns:
  - 「ちちぶ」の語源は諸説あり未確定（知知夫彦命説・チチノキ説・乳石説・アイヌ語説などを併記した）
  - 「知知夫」の表記の初出資料については、国造本紀の成立年代の問題もあり深追いできていない
  updated: '2026-11-13'
- id: muni/11-美里町
  code: '113816'
  names:
    ja: 美里町
    reading: みさとまち
    aliases:
    - 美里村
  user_terms:
  - 美里町の名前の由来
  - 美里村はどうやって決まった
  - 児玉郡の美里町
  naming_type: 新規命名
  formation: 合併新設
  prefecture: 埼玉県
  homonyms:
  - muni/04-美里町
  - muni/43-美里町
  summary: 1954年に東児玉村・松久村・大沢村が合併した際、住民公募と全世帯投票で選ばれた新村名「美里村」が前身で、1984年に町制を施行して美里町となった。町長の公式コラムは、この名に「将来も平和な農村として発展したい」という意味が込められたと説明する。3つの美里町の中で命名が最も古く、理由が公式に説明される点で宮城県美里町と異なる。
  first_attestation:
    era: 昭和29年
    year_western: 1954
    document: 新村名「美里村」の決定（三村合併促進協議会の候補選出と村内全世帯の投票による）
    note: 村名としての初出。これ以前に「美里」という小地名が域内にあったかは未確認
  claims:
  - text: 昭和29年（1954年）に東児玉村・松久村・大沢村が合併して美里村が誕生し、昭和59年（1984年）10月に町制を施行して美里町となった
    kind: fact
    level: E2
    status: established
    sources:
    - h3-saitama-enkaku
  - text: 合併後の新村名は住民公募とし、三村合併促進協議会で「美里村」「山里村」「三栗村」の候補を投票で選出したうえで、村内全世帯に選んでもらい「美里村」に決まったと町長コラムが伝える
    kind: fact
    level: E2
    status: established
    sources:
    - h3-saitama-mayor
  - text: 町長コラムは「住民の大部分が農業を営んでおり、将来も平和な農村として発展したいという意味が込められています」と命名の意味を説明する
    kind: fact
    level: E2
    status: established
    sources:
    - h3-saitama-mayor
  - text: 3町とも「美しい里」と読める字面の合併新名という点は共通する。ただし本町は1954年と命名が最も古く、公式の説明は字義の「美しい里」そのものより「平和な農村として発展したい」という願いに置かれている。熊本県美里町は「美しいふる里」への願いを理由文に明記し、宮城県美里町は理由が確認できない
    kind: fact
    level: E2
    status: established
    sources:
    - h3-saitama-mayor
    - h3-kumamoto-misato-town
  - text: 総務省「地方公共団体コード一覧」では本町のコードは113816とされる
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 落選した「三栗村」と「山里村」
    text: 最終候補に残ったのは「美里村」「山里村」「三栗村」の3つで、決め方は協議会の投票で候補を絞ったうえでの全世帯投票でした。落選した候補名まで具体的に記録が残っている例は、合併新名の記録として貴重です。
    sources:
    - h3-saitama-mayor
  relations:
  - pref/11
  - muni/04-美里町
  - muni/43-美里町
  unknowns:
  - 公募の応募総数と各候補の得票数
  - 1954年以前に「美里」という小地名が域内にあったか
  updated: '2026-11-13'
- id: muni/11-羽生市
  code: '112160'
  names:
    ja: 羽生市
    reading: はにゅうし
    aliases:
    - 羽生町
    - 埴生
    - 羽丹生
  user_terms:
  - 羽生の名前の由来
  - はにゅうの語源
  - 埴生から羽生へ
  - 田舎教師のまち
  naming_type: 中心地名の継承
  formation: 合併新設
  prefecture: 埼玉県
  homonyms: []
  summary: 市名は古い地名「埴生（はにう）」の系譜を受け継ぐとされる。市内の神社にある懸仏には天正18年（1590年）の「太田埴生庄」の銘があり、埴（赤土）が多い土地を表すという説のほか、埴輪がなまったという説もある。戦国時代の記録には「羽生」「羽丹生」の表記も見える。昭和29年（1954年）に市制を施行した。
  first_attestation:
    era: 文明10年
    year_western: 1478
    document: 『鎌倉大革紙』
    note: 長尾景春が「羽生の峰」に陣取ったという、「羽生」表記の早い用例。羽生市公式『羽生の歴史』が紹介するものとして、Wikipedia『羽生市』経由で確認
  claims:
  - text: 羽生市公式『羽生の歴史』が紹介するところでは、市内の神社にある懸仏に天正18年（1590年）の「太田埴生庄」という銘があり、埴生は埴（はに、赤土の意）が生（う、多いの意）である土地を表しているといわれている。また、埴輪（はにわ）がなまったものという説もある（Wikipedia『羽生市』経由で確認）
    kind: fact
    level: E5
    status: contested
    sources:
    - m4-hanyu-wiki
  - text: 『羽生市史』上巻によれば、「小田原旧記」には「武州羽丹生城代」という表記があり、埴生・羽生・羽丹生の3種の表記が用いられてきた（Wikipedia『羽生市』経由で確認）
    kind: fact
    level: E5
    status: established
    sources:
    - m4-hanyu-wiki
  - text: 羽生は江戸時代末期から青縞（あおじま）の生産が行われた衣料の町として発展した
    kind: fact
    level: E5
    status: established
    sources:
    - m4-hanyu-wiki
  - text: 昭和29年（1954年）9月1日、北埼玉郡羽生町・新郷村・須影村・岩瀬村・川俣村・村君村・手子林村が新設合併して市制を施行し、羽生市が発足した
    kind: fact
    level: E5
    status: established
    sources:
    - m4-hanyu-wiki
  - text: 総務省の全国地方公共団体コードで、羽生市のコードは112160と定められている（J-LISの埼玉県内市町村一覧による）
    kind: fact
    level: E2
    status: established
    sources:
    - k1-jlis-saitama
  column:
    title: 赤土の多い土地「埴生」
    text: 羽生の古い書き方は「埴生」。埴は赤土、生は多いこと。利根川沿いのこの一帯は、埴輪の材料になるような粘土質の土に恵まれていた。天正18年の懸仏には「太田埴生庄」と刻まれ、戦国の記録には羽生・羽丹生と揺れる。音は「はにう」から「はにゅう」へ。土の性質を名前にした土地が、やがて青縞の衣料の町になったのは、土と水に生きる土地らしい成り行きである。
    sources:
    - m4-hanyu-wiki
  relations:
  - pref/11
  unknowns:
  - 語源は埴生（赤土の多い土地）説が紹介されるが確証はなく、埴輪転訛説も併記した
  - 羽生市公式『羽生の歴史』のページは移転しており、Wikipedia経由の確認にとどまる
  updated: '2026-11-13'
- id: muni/11-草加市
  code: '112216'
  names:
    ja: 草加市
    reading: そうかし
    aliases:
    - 草加町
    - 草加宿
  user_terms:
  - そうか
  - 草加せんべい
  - 草加松原
  naming_type: 中心地名の継承
  formation: 合併新設
  prefecture: 埼玉県
  homonyms: []
  summary: 日光街道（日光道中）の宿場町・草加宿を中心に発展した市で、草加せんべいの産地として知られる。「草加」の地名は天正元年（1573年）に初めて記録に現れ、語源は砂地を意味する「ソガ」の転訛とする説などがある。1955年に草加町・谷塚町・新田村が合併して草加町となり、1958年11月1日に市制を施行した。
  first_attestation:
    era: 天正元年
    year_western: 1573
    document: 八潮市「持昌院文書ほか」に見える記録
    note: 「草加」の地名の初見とされる年。文書そのものは未読で、郷土史サイトとWikipediaの紹介による。
  claims:
  - text: 「草加」の地名が記録に初めて現れるのは天正元年（1573年）である
    kind: fact
    level: E4
    status: established
    sources:
    - w3-soka-historia
  - text: 「草加」の語源については、綾瀬川右岸に発達した砂地を意味する「ソガ」が転じたとする説がある
    kind: fact
    level: E4
    status: contested
    sources:
    - w3-soka-historia
  - text: 沼地に草を敷いて道を造った働きを「草の大功」と称えたことが「草加」の名の由来であるという伝承も伝えられている
    kind: legend
    level: E5
    status: established
    sources:
    - w3-saitamae-yurai
  - text: 草加宿は幕府が千住と越ヶ谷を最短で結ぶ新道の中間に新しい宿駅の設置を命じたことに始まり、寛永7年（1630年）に幕府の公認を受けて正式な伝馬宿となった
    kind: fact
    level: E2
    status: established
    sources:
    - w3-soka-city-shukuba
  - text: 元禄2年（1689年）には松尾芭蕉が『おくのほそ道』の旅で草加宿に足跡を残した
    kind: fact
    level: E2
    status: established
    sources:
    - w3-soka-city-shukuba
  - text: 1955年（昭和30年）に草加町・谷塚町・新田村の2町1村が合併して草加町となり、1958年（昭和33年）11月1日に埼玉県下21番目の市として市制を施行した
    kind: fact
    level: E2
    status: established
    sources:
    - w3-soka-city-keikaku
    - w3-soka-rekimin
  - text: 草加せんべいは、米どころ草加で農家が余った米を保存するために作っていた保存食が起源とされ、江戸時代に草加宿ができると店で売られるようになり広まったと考えられている
    kind: fact
    level: E2
    status: established
    sources:
    - w3-soka-city-senbei
  - text: 茶屋のおせんさんが売れ残りの団子をつぶして乾かし焼き餅として売ったのが草加せんべいの始まりだという物語が語り継がれているが、草加市はこの物語について「実は昭和時代に作られた物語です」と公式に説明している
    kind: legend
    level: E2
    status: established
    sources:
    - w3-soka-city-senbei
  - text: 総務省の全国地方公共団体コードで、草加市の団体コードは112216と定められている
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 市が「作られた物語」と明かす、おせんさんの伝説
    text: 草加せんべいの起源として最も親しまれているのは、草加松原の茶屋で団子を売っていたおせんさんが、売れ残りの団子の処分に困っていたところ、通りかかった侍に「つぶして乾かし、焼き餅として売ってはどうか」と助言され、たちまち街道の名物になったという物語である。ところが草加市は公式ページで、この話は「実は昭和時代に作られた物語です」とはっきり書いている。実際の草加せんべいは、米どころだった草加で農家が作っていた保存食が、宿場の店売りを通じて広まったものと考えられている。大正時代に特別大演習で天皇に献上されたことが「草加せんべい」の名を全国に広めたという。伝説を否定すること自体を市の公式情報として発信している点が、このまちの面白さである。
    sources:
    - w3-soka-city-senbei
  relations:
  - pref/11
  unknowns:
  - 「草加」の語源は確定していない。ソガ（砂地）転訛説のほか諸説の専門辞典での扱いは未確認
  - 初見とされる1573年の「持昌院文書ほか」の文書そのものは未読で、紹介情報による
  updated: '2026-11-13'
- id: muni/11-蓮田市
  code: '112381'
  names:
    ja: 蓮田市
    reading: はすだし
    aliases:
    - 蓮田町
    - 綾瀬村
    - 蓮田村
  user_terms:
  - はすだ
  - 蓮の花のまち
  naming_type: 中心地名の継承
  formation: 合併新設
  prefecture: 埼玉県
  homonyms: []
  summary: 元荒川と綾瀬川に挟まれた台地と低地の市で、市名は旧村名「蓮田」の継承である。「蓮田」の由来については、奈良時代の高僧が蓮の花に感動して弥陀堂を蓮華院と名付けたことに始まるという伝説を市が紹介している。1889年に綾瀬村となり、1934年に改称・町制して蓮田町、1954年に黒浜村・平野村と合併、1972年10月1日に市制を施行した。
  first_attestation:
    era: 明治7年
    year_western: 1874
    document: 蓮田市教育委員会の展示資料（上蓮田村・下蓮田村が合併して蓮田村となった記録として紹介）
    note: 「蓮田村」という村名の成立を示す記録。地名「蓮田」自体の初出は未確認で、奈良時代に遡る命名譚は伝説として分離して記録する。
  claims:
  - text: 「蓮田」の地名の由来については、奈良時代の高僧がこの地を訪れた際、咲き乱れる蓮の花の美しさに感動して宿となった弥陀堂を蓮華院と名付け、それ以来この地が蓮田と呼ばれるようになったという伝説があると、蓮田市が公式計画の中で紹介している
    kind: legend
    level: E2
    status: established
    sources:
    - w3-hasuda-city-plan
  - text: 蓮華院弥陀堂は「蓮田の地名発祥の地」とされている
    kind: fact
    level: E5
    status: established
    sources:
    - w3-hasuda-wiki
  - text: 明治7年（1874年）に上蓮田村と下蓮田村が合併して蓮田村となり、1889年（明治22年）の町村制施行では蓮田村・貝塚村・閏戸村が合併して綾瀬村（村名は綾瀬川に因む）となった
    kind: fact
    level: E2
    status: established
    sources:
    - w3-hasuda-museum
    - w3-hasuda-wiki
  - text: 1934年（昭和9年）に綾瀬村が「蓮田町」と名称変更して町制を施行し、かつての村名が町名として復活した
    kind: fact
    level: E2
    status: established
    sources:
    - w3-hasuda-city-plan
  - text: 1954年（昭和29年）5月3日に蓮田町・黒浜村・平野村が合併して新しい蓮田町が生まれた
    kind: fact
    level: E2
    status: established
    sources:
    - w3-hasuda-city-plan
  - text: 1972年（昭和47年）10月1日に埼玉県で38番目の市として市制を施行し、蓮田市となった
    kind: fact
    level: E2
    status: established
    sources:
    - w3-hasuda-city-plan
  - text: 2011年（平成23年）1月4日に、条例改正により市名の「蓮」の字の表記が、しんにょうの点が2つの「蓮」から点が1つの「蓮」に変更された
    kind: fact
    level: E5
    status: established
    sources:
    - w3-hasuda-wiki
  - text: 総務省の全国地方公共団体コードで、蓮田市の団体コードは112381と定められている
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 幻の市名「彩野市」
    text: 蓮田市は平成の大合併で一度だけ姿を消しかけた。南埼玉郡白岡町（現・白岡市）・菖蒲町（現・久喜市）との合併を目指し、新しい市の名前は「彩野市（あやのし）」とするところまで決まっていた。ところが2005年2月2日の住民投票で合併が否決され、「彩野市」は幻の市名となった。蓮田市は単独の道を歩み、2011年には市名の漢字そのものも変えている。「蓮」のしんにょうの点を2つから1つに改めたのである。「蓮田」という名は、奈良時代の高僧と蓮の花の伝説を語り継ぎながら、表記だけが現代の字体に合わせて静かに更新された。
    sources:
    - w3-hasuda-wiki
    - w3-hasuda-city-plan
  relations:
  - pref/11
  unknowns:
  - 「蓮田」の地名の史料上の初出は未確認。市が紹介する由来は奈良時代の高僧にまつわる伝説であり、文書で裏付けられる命名の経緯は確認できなかった
  - 蓮華院の創建年代や、弥陀堂と「蓮田」の名の結びつきを示す古文書は未確認
  updated: '2026-11-13'
- id: muni/11-蕨市
  code: '112232'
  names:
    ja: 蕨市
    reading: わらびし
    aliases:
    - 蕨町
    - 蕨宿
    - 蕨郷
  user_terms:
  - わらび
  - 成年式発祥の地
  - 日本一小さい市
  naming_type: 中心地名の継承
  formation: 合併新設
  prefecture: 埼玉県
  homonyms: []
  summary: 面積が日本一小さい市で、人口密度も日本一高い。中山道の蕨宿と機織りのまちとして発展し、1946年に全国に先駆けて「成年式」を行った成人式発祥の地である。「蕨」の地名は1352年の文書に「蕨郷」と現れるが、由来は文献に残されておらず、「藁火」説と植物の蕨にちなむ説が有力とされる。1889年に蕨宿と塚越村が合併して蕨町となり、1959年に市制を施行した。
  first_attestation:
    era: 観応3年
    year_western: 1352
    document: 賀上家文献（「蕨郷上下」と記される）
    note: 文献上の初出とされる記録。文書そのものは未読で、Wikipediaの紹介による。
  claims:
  - text: 「蕨」という地名の文献上の初出は、1352年（観応3年）付の「賀上家文献」に見える「蕨郷上下」の表記であると紹介されている
    kind: fact
    level: E5
    status: established
    sources:
    - w3-warabi-wiki
  - text: 「蕨」の名は、源義経が立ちのぼる煙を見て「藁火村」と名付けた、あるいは在原業平が藁を焚いてもてなされたところから「藁火」と命名したという「藁火」説が伝えられている
    kind: legend
    level: E5
    status: established
    sources:
    - w3-warabi-wiki
  - text: 植物の蕨（わらび）にちなんで名付けられたとする説も有力とされており、蕨の地名の由来は文献には残されておらず確定していない
    kind: fact
    level: E5
    status: contested
    sources:
    - w3-warabi-wiki
  - text: 蕨宿は中山道で江戸日本橋から2番目の宿場として栄え、その開設時期は諸説あるが慶長17年（1612年）といわれている
    kind: fact
    level: E2
    status: established
    sources:
    - w3-warabi-city-rekishi
  - text: 明治22年（1889年）に当時の蕨宿と塚越村が合併して蕨町となり、以後130年にわたって現在の市域面積のまま推移してきた
    kind: fact
    level: E2
    status: established
    sources:
    - w3-warabi-mayor
  - text: 蕨市は、面積が日本一小さく、人口密度は日本一高い市である
    kind: fact
    level: E2
    status: established
    sources:
    - w3-warabi-mayor
  - text: 昭和21年（1946年）に蕨町青年団が中心となって企画した「青年祭」の幕開けとして全国に先駆けて「成年式」が行われ、これが昭和23年（1948年）の国民の祝日「成人の日」制定につながったとされる
    kind: fact
    level: E2
    status: established
    sources:
    - w3-warabi-city-seinen
  - text: 令和元年（2019年）に市制施行60周年を迎えており、蕨市の市制施行は昭和34年（1959年）である
    kind: fact
    level: E2
    status: established
    sources:
    - w3-warabi-mayor
  - text: 総務省の全国地方公共団体コードで、蕨市の団体コードは112232と定められている
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 「成人式」は、敗戦の翌年に蕨で生まれた
    text: 終戦の翌年、1946年。敗戦の混乱と虚脱感の中で、蕨町青年団が次代を担う若者たちを勇気づけようと「青年祭」を企画した。その幕開けに行われたのが「成年式」である。11月22日から24日、蕨第一国民学校に国民服やもんぺ姿の若者約100人が集まり、町長や来賓の激励に誓いの言葉で応えた。この催しは国や県の関心を集め、1948年には国民の祝日として「成人の日」が制定された。全国の自治体が「成人式」と呼ぶ中で、蕨市だけは今も第1回の名称をそのまま使い、「成年式」として式典を行っている。日本一小さい市の、大きな発明である。
    sources:
    - w3-warabi-city-seinen
  relations:
  - pref/11
  unknowns:
  - 「蕨」の語源は文献に残されておらず未確定。「藁火」説・植物の蕨説とも、専門辞典（角川日本地名大辞典等）での扱いは未確認
  - 初出とされる1352年の「賀上家文献」は未読で、紹介情報による
  - 市制施行の正確な月日（1959年11月1日とされる）は、市の60周年記念式典の記録から年は確認できたが月日の一次資料は未確認
  updated: '2026-11-13'
- id: muni/11-行田市
  code: '112062'
  names:
    ja: 行田市
    reading: ぎょうだし
    aliases:
    - 忍町
    - 忍市
    - 行田町
    - 埼玉村
  user_terms:
  - 行田市の名前の由来
  - 行田はなぜ行田というのか
  - 埼玉県名発祥の地
  - 忍城のまち 行田足袋
  naming_type: 中心地名の継承
  naming_note: 城下の町人町の名だった「行田」を、市制施行時に市名として採用
  formation: 改称
  prefecture: 埼玉県
  homonyms: []
  summary: 市の中心は忍藩の城下町で、明治以降は忍町と呼ばれた。昭和24年（1949年）に忍市として市制を施行した同日に行田市へ改称した。「行田」は城下の町人町の名で、行田足袋の産地として全国に知られた名だった。一方、市域の大字「埼玉（さきたま）」は古代の埼玉郡・前玉（さきたま）の地であり、埼玉県名の発祥地とされる。県名の原点は、県庁所在地のさいたま市ではなく行田市内にある。
  first_attestation:
    era: 昭和24年
    year_western: 1949
    document: 市制施行・改称（忍市から行田市へ）
    note: 市名としての初出。地名「行田」は江戸時代の忍城下の町人町の名に遡るが、その語源と確実な初出は未確認
  claims:
  - text: 行田市域の「埼玉（さきたま）」は古代の埼玉郡の中心地とみられる地で、前玉神社と埼玉古墳群があり、『万葉集』には「さきたまの津」が詠まれている。埼玉県名はこの埼玉郡の名に由来する（都道府県レコード「埼玉県」と同旨）
    kind: fact
    level: E2
    status: established
    sources:
    - b-saitama-hasshohi
    - b-saitama-lib-manyo
  - text: 昭和29年（1954年）7月1日、北埼玉郡埼玉村が行田市に編入され、県名発祥の地である「埼玉」は行田市の大字となった
    kind: fact
    level: E5
    status: established
    sources:
    - m4-gyoda-wiki
  - text: 明治22年（1889年）に成田町・行田町・佐間村が合併して忍町となり、昭和24年（1949年）5月3日に忍市として市制を施行した同日、行田市へ改称した
    kind: fact
    level: E5
    status: established
    sources:
    - m4-gyoda-wiki
  - text: 「行田」はもとは忍城下の町人町の名で、1889年の合併後は忍町の字名だった。行田足袋が全国的に知られるようになったことが、1949年に市名として「行田」を選ぶきっかけになったとされる
    kind: fact
    level: E5
    status: established
    sources:
    - m4-gyoda-tabi
  - text: 平成13年（2001年）にさいたま市が誕生する際、新市名の候補となっていた「埼玉市」について、行田市は「埼玉」という地名の発祥の地が市内の旧埼玉村であることを理由として難色を示したと伝えられる
    kind: fact
    level: E5
    status: established
    sources:
    - m4-gyoda-wiki
  - text: 総務省の全国地方公共団体コードで、行田市のコードは112062と定められている（J-LISの埼玉県内市町村一覧による）
    kind: fact
    level: E2
    status: established
    sources:
    - k1-jlis-saitama
  column:
    title: 県名の原点は、県庁のある市にはない
    text: 埼玉県の名は埼玉郡から採られたが、その原点は現在のさいたま市ではなく、行田市の大字「埼玉（さきたま）」である。古代の読みは「さきたま」で、前玉神社と埼玉古墳群が残る。1954年に埼玉村が行田市へ編入され、原点は行田の一部になった。そして2001年、合併で生まれる新市の名が「埼玉市」になりかけたとき、行田市は発祥の地として待ったをかけたと伝えられる。県名の本家は、今も行田にある。
    sources:
    - b-saitama-hasshohi
    - m4-gyoda-wiki
  relations:
  - pref/11
  - muni/11-さいたま市
  unknowns:
  - 「行田」の語源は市の公式資料にも記載がなく、未確認（地名としての確実な初出も特定できていない）
  - 1949年の改称理由について、市の公式文書による明示は未確認（行田足袋の知名度によるとする説明は二次資料による）
  updated: '2026-11-13'
- id: muni/11-越生町
  code: '113271'
  names:
    ja: 越生町
    reading: おごせまち
    aliases:
    - 越生郷
    - 越生村
    - 梅園村
    - 今市村
  user_terms:
  - 越生
  - おごせ
  - 越生梅林
  - おっぺ川
  - ハイキングのまち
  - 山吹の里
  naming_type: 旧行政区画名の継承
  naming_note: 中世以来の越生郷の名を継承し、1889年の町村制施行で合併してそのまま町となった
  formation: 合併新設
  prefecture: 埼玉県
  homonyms: []
  summary: 入間郡の町で、「おごせ」という難読地名で知られる。名は鎌倉時代以来の越生郷にさかのぼり、語源は秩父方面へ尾根を越える地勢から「尾根越し」が転じたとする説が有力とされる。1873年（明治6年）に今市村が越生村と改め、1889年（明治22年）の町村制施行で周辺8か村と合併して越生町が誕生し、1955年（昭和30年）に梅園村と合併して現在に至る。関東三大梅林の一つ、越生梅林の町である。
  first_attestation:
    era: 鎌倉時代
    year_western: null
    document: 越生郷の用例（越生町公式「沿革」が紹介）
    note: 町の沿革は「鎌倉時代のはじめから戦国時代に至るまで、越生氏の所領であった今市村の周辺一帯は越生郷と呼ばれ」と記す。具体的な文書名は挙げられていない
  claims:
  - text: 鎌倉時代のはじめから戦国時代まで、越生氏の所領だった今市村の周辺一帯は越生郷と呼ばれた
    kind: fact
    level: E2
    status: established
    sources:
    - w11-ogose-enkaku
  - text: 1873年（明治6年）に今市村が越生村と改称し、1889年（明治22年）の町村制施行で上野村・如意村・黒岩村・西和田村・大谷村・鹿下村・成瀬村・古池村の8か村と合併して越生町となった
    kind: fact
    level: E2
    status: established
    sources:
    - w11-ogose-enkaku
  - text: 1955年（昭和30年）に梅園村と合併して現在の越生町となった
    kind: fact
    level: E2
    status: established
    sources:
    - w11-ogose-enkaku
    - w11-ogose-guide
  - text: 「おごせ」の語源は、秩父地方との往来には尾根を越えねばならない地勢から、「尾根越し（おねごし）」が「尾越し（おごし）」を経て「おごせ」に変化したとする説が有力とされる
    kind: fact
    level: E5
    status: contested
    sources:
    - w11-ogose-wiki
    - w3-saitamae-yurai
  - text: 柳田國男は『山の神とヲコゼ』（1936年）で、埼玉県入間郡越生（オゴセ）のような地名は「峯越（ヲゴシ）」の意味ではあるまいかと述べている
    kind: fact
    level: E3
    status: contested
    sources:
    - w11-ogose-yanagita
    - w11-ogose-wiki
  - text: 町のほぼ中央を越辺川（おっぺがわ）が貫流している
    kind: fact
    level: E2
    status: established
    sources:
    - w11-ogose-guide
  - text: 越生梅林は関東三大梅林の一つに数えられ、梅は町の木に定められている
    kind: fact
    level: E2
    status: established
    sources:
    - w11-ogose-guide
  - text: 越生町の地方公共団体コードは113271である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 町村制と同時に生まれた「日本で一番古い町」
    text: 多くの町は、まず村として発足し、人口が増えてから町へ「昇格」する。だが越生町は1889年（明治22年）の町村制施行のその年に、合併して最初から「町」として発足した。そのため町は、町村制施行時に誕生した日本で一番古い町と自らを紹介している。中心だった今市村は、相州から上州へ通じる街道の宿駅として古くから名を知られた町場で、村ではなく町として扱われるだけの賑わいがあった。明治6年にその今市が「越生村」と改称し、周辺の村々と合併して越生町になったとき、中世の越生郷の名が自治体の名として復活したのである。
    sources:
    - w11-ogose-enkaku
    - w3-saitamae-yurai
  relations:
  - pref/11
  - muni/11-毛呂山町
  - muni/11-鳩山町
  unknowns:
  - 「おごせ」の語源は尾根越し説が有力とされるが、越辺川の「おっぺ」との関係を含め、確定的な説明は確認できなかった
  - 越生郷の初出文書の書誌は確認できなかった
  updated: '2026-11-13'
- id: muni/11-越谷市
  code: '112224'
  names:
    ja: 越谷市
    reading: こしがやし
    aliases:
    - 越ヶ谷町
    - 越ヶ谷宿
    - 越ヶ谷郷
  user_terms:
  - 越谷市の名前の由来
  - 越谷と越ヶ谷の違い
  - 越ヶ谷宿のあったまち
  naming_type: 旧行政区画名の継承
  formation: 合併新設
  prefecture: 埼玉県
  homonyms: []
  summary: 市名は、昭和29年（1954年）の合併で発足した越谷町の名を受け継いだものである。その際、合併前の越ヶ谷町と区別するため「ヶ」を取って「越谷」とした。「越ヶ谷」はもと広い地域を指した越ヶ谷郷の名で、語源は「越（腰）＝山や丘のふもと」「谷＝低地」とされ、台地のふもとの低地を指す名だと市の資料は説明する。
  first_attestation:
    era: 永禄5年
    year_western: 1562
    document: 小田原北条氏が葛西の本田氏に宛てた印判状（「越谷・舎人」）
    note: 『越谷市の文化財』が紹介する用例。「越ヶ谷」はもと越ヶ谷郷と称され広い地域を指した。戦国期には「越谷」と書かれ、江戸期に「越ヶ谷」と記すようになった
  claims:
  - text: 『越谷市の文化財』によれば、「越ヶ谷」はもと「越ヶ谷郷」と称され、市内の出羽地区や荻島地区、それに現在のさいたま市岩槻区の一部などを含めた広い地域を指していた
    kind: fact
    level: E2
    status: established
    sources:
    - k1-koshigaya-bunkazai
  - text: 永禄5年（1562年）の小田原北条氏が葛西の本田氏に宛てた印判状には、「越谷・舎人」は大郷であると記されている
    kind: fact
    level: E2
    status: established
    sources:
    - k1-koshigaya-bunkazai
  - text: 『越谷市の文化財』は地名の由来について、「越」は「腰」とも書かれ山や丘のふもとを、「谷」は低地を指すといわれ、越ヶ谷は川口から大門にかけての台地のふもとの低地であることによる名だと説明している
    kind: fact
    level: E2
    status: contested
    sources:
    - k1-koshigaya-bunkazai
  - text: 一方、語源由来辞典は別の説として、旧荒川の川谷を越える地を意味するという説や、「コシ」は崩壊地形を意味するという説も挙げており、語源は確定していない
    kind: fact
    level: E3
    status: contested
    sources:
    - k1-koshigaya-gogen
  - text: 明治22年（1889年）の町村制施行では「越ヶ谷町」として成立した
    kind: fact
    level: E3
    status: established
    sources:
    - k1-koshigaya-gogen
  - text: 昭和29年（1954年）11月3日、越ヶ谷町・大沢町の2町と桜井村・新方村・増林村・大袋村・荻島村・出羽村・蒲生村・大相模村の8村が合併して越谷町が発足した。その際、合併前の越ヶ谷町と区別するために「ヶ」を取って「越谷町」とした
    kind: fact
    level: E2
    status: established
    sources:
    - k1-koshigaya-tokei
    - k1-koshigaya-gogen
  - text: 昭和33年（1958年）11月3日、市制を施行して越谷市となった。埼玉県下で22番目の市だった
    kind: fact
    level: E2
    status: established
    sources:
    - k1-koshigaya-tokei
  - text: 総務省の全国地方公共団体コードで、越谷市のコードは112224と定められている（J-LISの埼玉県内市町村一覧による）
    kind: fact
    level: E2
    status: established
    sources:
    - k1-jlis-saitama
  column:
    title: 「ヶ」があるかないかで分かる新旧
    text: 越谷の中心部にある旧来の土地は今も「越ヶ谷」と「ヶ」を付けて書き、越ヶ谷高校や越ヶ谷宿の表記にも「ヶ」が残る。一方、1954年の合併後に生まれた地名は「ヶ」なしで、南越谷・北越谷・東越谷のほか越谷北高校・越谷南高校にも「ヶ」は入らない。これは1954年に、新しい町を合併前の越ヶ谷町と区別するために「ヶ」を外した名残である。市内で「ヶ」のある地名とない地名を見比べると、合併前の町の範囲と、その後に広がった市街地の輪郭が浮かび上がる。
    sources:
    - k1-koshigaya-gogen
    - k1-koshigaya-tokei
  relations:
  - pref/11
  unknowns:
  - 語源は台地のふもとの低地とする説と、川谷を越える地とする説などがあり確定していない
  - 越ヶ谷郷の成立時期を示す中世以前の確実な用例は、確認できなかった
  updated: '2026-11-13'
- id: muni/11-長瀞町
  code: '113638'
  names:
    ja: 長瀞町
    reading: ながとろまち
    aliases:
    - 野上町
    - 野上村
    - 野上三郷
  user_terms:
  - 長瀞
  - ながとろ
  - 岩畳
  - ライン下り
  - 長瀞渓谷
  - 地球の窓
  naming_type: 自然地名から
  naming_note: 1972年に野上町から、国の名勝・天然記念物「長瀞」の名へ改称
  formation: 改称
  prefecture: 埼玉県
  homonyms: []
  summary: 秩父郡の町で、もとは戦国期から見える野上三郷に由来する野上村・野上町だった。荒川の流れがゆるやかで深い「瀞」が長く続く一帯は「長瀞」と呼ばれて渓谷美で知られ、1924年（大正13年）に国の名勝・天然記念物に指定された。1940年（昭和15年）の町制時には大字藤谷淵が大字長瀞に改称され、1972年（昭和47年）11月1日には町そのものも全国に知られる観光地の名を採って長瀞町へ改称した。
  first_attestation:
    era: 大正13年
    year_western: 1924
    document: 国の名勝及び天然記念物「長瀞」の指定（大正13年12月9日）
    note: 景勝地名としての「長瀞」の公的な区切りの一つ。大字名としては1940年に藤谷淵から改称され、町名としては1972年から使われている
  claims:
  - text: 江戸期には本野上村・中野上村・野上下郷村があり「野上三郷」と通称され、1889年（明治22年）の町村制で野上村、1940年（昭和15年）に町制を施行して野上町となった
    kind: fact
    level: E2
    status: established
    sources:
    - w11-nagatoro-town
    - w11-nagatoro-wiki
  - text: 1940年の町制施行の際、大字藤谷淵は大字長瀞に改称された
    kind: fact
    level: E5
    status: established
    sources:
    - w11-nagatoro-wiki
  - text: 荒川の上長瀞から高砂橋に至る両岸は、1924年（大正13年）12月9日に国の名勝及び天然記念物「長瀞」に指定された
    kind: fact
    level: E2
    status: established
    sources:
    - w11-nagatoro-town
    - w11-nagatoro-pref
  - text: 「瀞」は川の流れがゆるやかで深い部分を指す言葉であり、「長瀞」は荒川のゆるやかな流れ「瀞」が長く続くことから付いた名であると町の公式説明を紹介する資料がある
    kind: fact
    level: E5
    status: established
    sources:
    - w3-saitamae-yurai
  - text: 1972年（昭和47年）11月1日、野上町から長瀞町へ町名を変更した
    kind: fact
    level: E2
    status: established
    sources:
    - w11-nagatoro-town
    - w11-nagatoro-pref
  - text: 町の教育要覧は改称の理由を「全国的に知られる『観光地長瀞』を町名にと」と記している
    kind: fact
    level: E2
    status: established
    sources:
    - w11-nagatoro-kyoiku
  - text: 長瀞渓谷は結晶片岩から成り、一帯は「日本地質学発祥の地」とも呼ばれている
    kind: fact
    level: E2
    status: established
    sources:
    - w11-nagatoro-kyoiku
    - w11-nagatoro-pref
  - text: 長瀞町の地方公共団体コードは113638である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 観光地の名を町名にした1972年
    text: 長瀞町は、合併ではなく改称で生まれた町名の代表例である。もとの「野上」は戦国期から見える古い地名で、野上三郷と呼ばれた村々の名だった。一方の「長瀞」は、1924年に国の名勝・天然記念物に指定されて以来、岩畳とライン下りで全国に知られる渓谷の名である。1972年、町は古い名を手放し、観光地の名を町名に採用した。ただし「長瀞」は突然現れた名ではない。1940年の町制のときに大字藤谷淵が大字長瀞へ改称されており、景勝地の名は30年以上かけて地域に根を張った末に、町名へと昇格したのである。
    sources:
    - w11-nagatoro-kyoiku
    - w11-nagatoro-wiki
  relations:
  - pref/11
  - muni/11-皆野町
  unknowns:
  - 景勝地名「長瀞」の文書上の初出（いつから荒川のこの区間が長瀞と呼ばれたか）は確認できなかった
  - 1972年の改称に際して他の候補名や異論があったかは確認できなかった
  updated: '2026-11-13'
- id: muni/11-飯能市
  code: '112097'
  names:
    ja: 飯能市
    reading: はんのうし
    aliases:
    - 飯能町
    - 判乃
    - 飯生
  user_terms:
  - 飯能の名前の由来
  - はんのうの語源
  - 西川材のまち
  - 飯能はいいのうと読まない
  naming_type: 中心地名の継承
  formation: 単独発足
  prefecture: 埼玉県
  homonyms: []
  summary: 市名は中世以来の地名「飯能」を受け継いだものである。古くは「判乃」と書かれ、武蔵七党・丹党の判乃氏の拠った地だったとされる。ハンノウの名義には、楱野あるいは萩野と解する説、朝鮮語に由来を求める説、もとは「イノ」と呼ばれた土地への当て字だとする説など諸説があり、定説はない。林業と西川材の集散地として栄え、昭和29年（1954年）に市制を施行した。
  first_attestation:
    era: 中世
    year_western: null
    document: 旧表記「判乃」（加治郷・加治庄における判乃氏の在所）
    note: 『埼玉県地名誌』などが伝える古い表記で、郷土研究資料が紹介するもの。確実な初出文書は特定できていない
  claims:
  - text: 郷土研究資料によれば、飯能は古くは「判乃」と書き、加治郷・加治庄・加治領に属し、武蔵七党丹党の判乃氏の在所であった
    kind: fact
    level: E4
    status: established
    sources:
    - m4-hanno-chimei
  - text: ハンノウの名義について『入間郡誌』と『飯能郷土史』は、楱野（はしばみの野）あるいは萩野と解し、いずれかといえば楱野が自然であるとしている
    kind: fact
    level: E4
    status: contested
    sources:
    - m4-hanno-chimei
  - text: ハンノウは朝鮮語のハンナーラ（あるいはハンナイ）から出て、大部落・大野・大川のいずれかの意であるとする説や、飯の集会所であったから「聚能（ハンノウ）」と命名したという説もある
    kind: fact
    level: E4
    status: contested
    sources:
    - m4-hanno-chimei
  - text: 「飯能」の文字は当て字で、もともとは飯野・伊能などと同類の「イノ」と呼ばれていた土地に「飯能」の字を当てたために「ハンノウ」と唱えるようになった、という見方もある（『埼玉県地名誌』に基づく郷土研究の紹介）
    kind: fact
    level: E4
    status: contested
    sources:
    - m4-hanno-chimei
  - text: 飯能市博物館の学芸員コラムによれば、幕末・弘化4年（1847年）の諸国の市を番付風に並べた史料に「武州飯生市」とあり、これは飯能の町を指すと考えられ、江戸時代には「飯生」と書かれることもあった可能性がある
    kind: fact
    level: E2
    status: established
    sources:
    - m4-hanno-ippin
  - text: 飯能市公式資料によれば、昭和18年（1943年）に飯能町・精明村・南高麗村・加治村・元加治村が合併して飯能町となり、昭和29年（1954年）1月1日に県下9番目の市制を施行して飯能市が誕生した（当時の人口は36,513人）
    kind: fact
    level: E2
    status: established
    sources:
    - m4-hanno-kouhou
  - text: 明治22年（1889年）に高麗郡飯能町・中山村などが合併して飯能町となり、平成17年（2005年）1月1日には入間郡名栗村を編入した
    kind: fact
    level: E5
    status: established
    sources:
    - m4-hanno-wiki
  - text: 総務省の全国地方公共団体コードで、飯能市のコードは112097と定められている（J-LISの埼玉県内市町村一覧による）
    kind: fact
    level: E2
    status: established
    sources:
    - k1-jlis-saitama
  column:
    title: 「いいのう（飯生）」でいいの？
    text: 飯能市の学芸員が着任早々、周囲から「いいのう」と読み間違えられたという話を紹介している。幕末の番付表には、諸国の市の一つとして「武州飯生市」とある。これは飯能のことと考えられ、当時は「飯生」とも書かれたらしい。「飯能」は「はんのう」と読むが、字づらからは「いいのう」と読みたくなる。その読み間違いには、江戸時代の表記の名残があったのかもしれない。
    sources:
    - m4-hanno-ippin
  relations:
  - pref/11
  unknowns:
  - 語源の定説はない（楱野説・萩野説・朝鮮語説・聚能説・当て字イノ説を併記した）
  - 「判乃」の確実な初出文書は特定できていない
  updated: '2026-11-13'
- id: muni/11-鳩山町
  code: '113484'
  names:
    ja: 鳩山町
    reading: はとやままち
    aliases:
    - 鳩山村
    - 今宿村
    - 亀井村
  user_terms:
  - 鳩山
  - はとやま
  - 鳩山ニュータウン
  - 南比企窯跡群
  - 鳩ヶ丘
  naming_type: 中心地名の継承
  naming_note: 1955年に今宿村・亀井村が合併し、両村の中央にあった地名「鳩山」を村名に採用
  formation: 合併新設
  prefecture: 埼玉県
  homonyms: []
  summary: 比企郡の町で、1955年（昭和30年）に今宿村と亀井村が合併した際、両村の中央にあった地名「鳩山」を新しい村名に採り、1982年（昭和57年）に町制を施行した。古代には南比企窯跡群の窯業地帯として栄え、昭和後期には鳩山ニュータウンが開発されて東京のベッドタウンとなった。「鳩山」という小地名自体の由来は、公式資料では確認できていない。
  first_attestation:
    era: 昭和30年
    year_western: 1955
    document: 鳩山村の発足（今宿村・亀井村の合併）
    note: 自治体名としての初出。小地名「鳩山」自体の初出は確認できなかった
  claims:
  - text: 1955年（昭和30年）に今宿村と亀井村が合併して鳩山村が発足した
    kind: fact
    level: E5
    status: established
    sources:
    - w3-saitamae-yurai
    - w11-hatoyama-wiki
  - text: 村名「鳩山」は、合併した2つの村の中央にあった地名「鳩山」から採られたと町の公式説明を紹介する資料がある
    kind: fact
    level: E5
    status: established
    sources:
    - w3-saitamae-yurai
  - text: 1982年（昭和57年）4月1日に町制を施行して鳩山町となった
    kind: fact
    level: E2
    status: established
    sources:
    - w11-hatoyama-geoshape
  - text: 町域の大部分は岩殿丘陵の中央部に位置し、鳩川が町内を流れる
    kind: fact
    level: E5
    status: established
    sources:
    - w11-hatoyama-wiki
  - text: 古代の町域は南比企窯跡群の一角で、奈良時代には武蔵国分寺の瓦を焼いた窯跡が残るなど、窯業の一大産地だった
    kind: fact
    level: E5
    status: established
    sources:
    - w11-hatoyama-wiki
  - text: 昭和後期に開発された鳩山ニュータウンにより東京のベッドタウンとなった一方、2020年（令和2年）の高齢化率は45.9%で県内の自治体で最も高い
    kind: fact
    level: E5
    status: established
    sources:
    - w11-hatoyama-wiki
  - text: 鳩山町の地方公共団体コードは113484である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: ニュータウンに残った「鳩」の名
    text: 鳩山の名は、宅地開発で生まれたニュータウンの街区名に姿を変えて残っている。鳩ヶ丘、楓ヶ丘、松ヶ丘。丘陵の地名を「ヶ丘」で結ぶ命名の中で、「鳩ヶ丘」だけが古い小地名「鳩山」の記憶を受け継いでいる。もとの鳩山がなぜ「鳩」のつく山だったのか、確かな記録は残っていない。だが、1955年の合併で村名に選ばれ、ニュータウンの住所に生き残ったことで、この小さな地名は少なくとも二度の転機を生き延びた。地名の由来が分からなくても、地名がどう生き延びたかは記録できる。その好例が鳩山である。
    sources:
    - w11-hatoyama-wiki
  relations:
  - pref/11
  - muni/11-越生町
  - muni/11-毛呂山町
  - muni/11-滑川町
  unknowns:
  - 小地名「鳩山」自体の由来（鳩の多い山だったのか、別の語の転訛か）は公式資料・専門資料で確認できなかった
  - 「鳩山」が今宿村・亀井村のいずれの区域の字だったかなど、小地名としての位置の詳細は確認できなかった
  updated: '2026-11-13'
- id: muni/11-鴻巣市
  code: '112178'
  names:
    ja: 鴻巣市
    reading: こうのすし
    aliases:
    - 鴻巣町
    - 鴻巣宿
    - 鴻巣郷
  user_terms:
  - こうのす
  - 鴻巣びな
  - コウノトリのまち
  naming_type: 中心地名の継承
  formation: 単独発足
  prefecture: 埼玉県
  homonyms: []
  summary: 中山道の鴻巣宿と「鴻巣びな」の人形作りで知られる市。地名の由来は、武蔵国造・笠原直使主の時代に一時国府が置かれて「国府の州（こくふのす）」と呼ばれたのが始まりで、後に鴻神社のコウノトリ伝説から「鴻巣」の字が当てられたと市は伝える。1954年9月30日に市制を施行し、2005年に吹上町・川里町と合併した。2025年には地名の由来の一つとされるコウノトリが市の鳥に制定された。
  first_attestation:
    era: null
    year_western: null
    document: null
    note: 「鴻巣郷」の初出とされる文献は未確認。『日本書紀』が伝える534年の武蔵国造の乱は隣接する笠原郷を拠点とした笠原直使主にまつわる記事であり、「鴻巣」の名そのものの初出ではない。
  claims:
  - text: 鴻巣という地名は、武蔵国造である笠原直使主が現在の笠原の辺りに住み、一時この地が武蔵の国府となったことから「国府の州（こくふのす）」と呼ばれたのが始まりとされ、それが「こふのす」となり、後にコウノトリ伝説から「鴻巣」の字を当てはめるようになったと言われている
    kind: fact
    level: E2
    status: contested
    sources:
    - w3-kounosu-city-pdf
  - text: 鴻神社に伝わる「こうのとり伝説」では、日照りに苦しむ村に飛来したコウノトリが神の木のてっぺんに巣を作って卵を生み、卵を狙った大蛇を退治したとされ、この伝説が地名の由来の一つといわれている
    kind: legend
    level: E2
    status: established
    sources:
    - w3-kounosu-city-konotori
    - w3-kounosu-city-tori
  - text: 大宮台地の高台の砂地を「コウ（高）のス（洲）」と言い換えたことが「こうのす」の由来であるとする説もあり、鴻巣の地名の由来は確定していない
    kind: fact
    level: E5
    status: contested
    sources:
    - w3-kounosu-wiki
  - text: 江戸時代に中山道の宿駅が設置されると、鴻巣宿は交通の要衝として県内屈指の宿場にぎわいを見せた
    kind: fact
    level: E2
    status: established
    sources:
    - w3-kounosu-city-pdf
  - text: 鴻巣では江戸時代中頃から人形作りが始まり、やがて関東三大雛市の一つに数えられるまでに成長し、「鴻巣びな」の名は全国に知られるようになった
    kind: fact
    level: E2
    status: established
    sources:
    - w3-kounosu-city-pdf
  - text: 1954年（昭和29年）9月30日に市制を施行し、2005年（平成17年）には北足立郡吹上町・北埼玉郡川里町と合併して現在の鴻巣市となった
    kind: fact
    level: E5
    status: established
    sources:
    - w3-kounosu-wiki
  - text: 2025年（令和7年）10月1日、地名の由来の一つともいわれるコウノトリが鴻巣市の鳥に制定された
    kind: fact
    level: E2
    status: established
    sources:
    - w3-kounosu-city-tori
  - text: 総務省の全国地方公共団体コードで、鴻巣市の団体コードは112178と定められている
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 伝説の鳥が、市の鳥になった
    text: 鴻巣の中心にある鴻神社には「こうのとり伝説」が伝わる。日照りに苦しむ村に一羽のコウノトリが飛来して神の木のてっぺんに巣を作り、卵を狙う大蛇を退治したため、平和な日々が続いたという物語である。この伝説は「鴻巣」という地名の由来の一つともいわれ、『新編武蔵風土記稿』にも、鴻巣宿の総鎮守だった氷川社（現在の鴻神社）が「鴻ノ宮」とも呼ばれて地名の由来となる神社だと記されていた。2025年10月、市はこのコウノトリを合併20周年を契機に市の鳥に制定した。地名の由来の物語の中の鳥が、千年以上を経て市のシンボルに「就任」したことになる。
    sources:
    - w3-kounosu-city-tori
    - w3-kounosu-city-konotori
  relations:
  - pref/11
  unknowns:
  - 「鴻巣」の名の史料上の初出は未確認。「国府の州」説・「高の洲」説とも語源としての決着はついていない
  - 笠原直使主の拠点と鴻巣郷の位置関係（隣接する笠原郷との混同の可能性）については、専門辞典での検証が未了
  updated: '2026-11-13'
- id: muni/11-鶴ヶ島市
  code: '112411'
  names:
    ja: 鶴ヶ島市
    reading: つるがしまし
    aliases:
    - 鶴ヶ島村
    - 鶴ヶ島町
  user_terms:
  - つるがしま
  - 脚折雨乞のまち
  naming_type: 新規命名
  formation: 合併新設
  prefecture: 埼玉県
  homonyms: []
  summary: 町村制施行以来一度も合併せず、村から町、町から市へと単独で昇格してきた市。市名の「鶴ヶ島」は1889年の合併村の命名で、室町時代に脚折近くの島状の地に鶴が巣をこもったという祥伝にちなむとされる。巨大な龍蛇を担いで練り歩く雨乞い行事「脚折雨乞」で知られる。1991年9月1日に市制を施行した。
  first_attestation:
    era: 明治22年
    year_western: 1889
    document: 町村制施行による高麗郡鶴ヶ島村の発足
    note: 「鶴ヶ島」という名そのものの初出であり、命名の時点。名の由来とされる鶴の祥伝は室町時代に遡ると伝えられるが、その伝承自体の初出文献は未確認。
  claims:
  - text: 1889年（明治22年）4月1日の町村制施行により、上広谷村連合を構成する14村の区域をもって鶴ヶ島村が発足し、この名は室町時代に脚折近くの島状の地に鶴が巣篭もったという祥伝にちなんでいるとされる
    kind: legend
    level: E5
    status: established
    sources:
    - w3-tsurugashima-wiki
  - text: 鶴ヶ島の語源の説明は『鶴ヶ島町史（文化・地誌篇）』（1988年）に基づくものとして紹介されている
    kind: fact
    level: E5
    status: established
    sources:
    - w3-tsurugashima-wiki
  - text: 鶴ヶ島が村であった期間は1889年から1966年までの77年間で、この間を含め町村制施行以来一度も合併していない
    kind: fact
    level: E2
    status: established
    sources:
    - w3-tsurugashima-lib
    - w3-tsurugashima-wiki
  - text: 1966年（昭和41年）4月1日に町制を施行して鶴ヶ島町となり、1991年（平成3年）9月1日に市制を施行して鶴ヶ島市となった
    kind: fact
    level: E5
    status: established
    sources:
    - w3-tsurugashima-wiki
  - text: 脚折雨乞には、雷電池に住んでいた大蛇が、寛永の頃に池を縮めて田とされたため上州板倉の雷電の池へ移ってしまい、その後は雨乞いをしても雨が降らなくなったという伝承がある
    kind: legend
    level: E2
    status: established
    sources:
    - w3-tsurugashima-city-yurai
  - text: 明治7年（1874年）夏の干ばつの際、村人が板倉雷電社で一晩中降雨を祈願して池の水を竹筒に入れて持ち帰ったところ、快晴の空がたちまち曇って雨が降ったという記録が残されている
    kind: fact
    level: E2
    status: established
    sources:
    - w3-tsurugashima-city-yurai
  - text: 脚折雨乞は昭和39年（1964年）を最後に一度途絶えたが、昭和51年（1976年）に復活し、現在は国選択無形民俗文化財として4年に一度行われている
    kind: fact
    level: E2
    status: established
    sources:
    - w3-tsurugashima-city-amagoi
    - w3-tsurugashima-city-yurai
  - text: 脚折雨乞では、長さ36メートル・重さ約3トンもある龍蛇（りゅうだ）を約300人が担ぎ、白鬚神社から雷電池まで練り歩く
    kind: fact
    level: E2
    status: established
    sources:
    - w3-tsurugashima-city-amagoi
  - text: 総務省の全国地方公共団体コードで、鶴ヶ島市の団体コードは112411と定められている
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 雨を呼ぶ龍と、池を追われた大蛇
    text: 鶴ヶ島の脚折（すねおり）地区に伝わる雨乞い行事「脚折雨乞」は、竹と麦わらで作る長さ36メートルの龍蛇を約300人で担ぎ、雷電池（かんだちがいけ）に入って雨を祈る豪快な祭りである。その背景には池の大蛇の伝承がある。雷電池には昔大蛇が住み、雷電社の前で祈れば必ず雨が降った。しかし寛永の頃に池を縮めて田にしたため、大蛇は上州板倉の雷電の池へ移ってしまい、雨が降らなくなったという。明治7年の大干ばつには、村人が板倉まで出かけて祈願し、池の水を竹筒に入れて持ち帰ったところ、快晴の空が曇って雨が降ったと記録される。行事は1964年に途絶えたが1976年に復活し、今はオリンピックと同じ4年に一度の開催が続く。
    sources:
    - w3-tsurugashima-city-yurai
    - w3-tsurugashima-city-amagoi
  relations:
  - pref/11
  unknowns:
  - 鶴の祥伝の初出文献は未確認。語源の典拠とされる『鶴ヶ島町史（文化・地誌篇）』そのものは未読で、Wikipedia経由の紹介による
  - 「島状の地」の具体的な地形（湿地の中の微高地とされる）の考古・地形学的な裏付けは未確認
  updated: '2026-11-13'
