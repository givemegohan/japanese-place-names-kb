    document: あわ北合併協議会の協議を経た4町の合併による阿波市の発足
    note: 市名としての初出は2005年。国名「阿波」自体の初出は都道府県レコード（徳島県）側で扱う領域であり、本レコードでは扱わない。
  claims:
  - text: 阿波市は2005年4月1日、板野郡の吉野町・土成町と阿波郡の市場町・阿波町の4町が合併して発足した。
    kind: fact
    level: E2
    status: established
    sources:
    - q4-tokushima-enkaku
  - text: 阿波市の総合計画はこの合併を「あわ北4町の合併により誕生した阿波市」と位置づけている。
    kind: fact
    level: E2
    status: established
    sources:
    - q4-awa-city-plan
  - text: 構成町の一つである旧・阿波町は、1955年3月31日に久勝町・林町・伊沢村が合併して成立した町である。新市名「阿波」は、この町名と旧国名の双方に重なる名である。
    kind: fact
    level: E4
    status: established
    sources:
    - q4-awa-uub
  - text: 合併の協議は、阿波郡の市場町・阿波町の検討協議会に板野郡の吉野町・土成町が加わる形で「あわ北合併協議会」として進められた、郡をまたぐ合併だった。
    kind: fact
    level: E4
    status: established
    sources:
    - q4-awa-uub
  - text: この合併により阿波郡は消滅した一方、板野郡は他の町を残して存続した。
    kind: fact
    level: E4
    status: established
    sources:
    - q4-awa-uub
  - text: 阿波市の地方公共団体コードは362069である。
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 旧国名を名乗る市
    text: 県名が「徳島」になってから130年以上たって、旧国名「阿波」を名乗る市が現れた。2005年の合併で4町が一つになるとき、中心的な町名を採る代わりに選ばれたのが、県全体を指していた古い国名だった。ただし、この命名が成立した鍵は、構成町の中にすでに「阿波町」という町が実在したことにある。阿波町は1955年、阿波郡の3町村の合併で生まれた町で、国名を町名にしていた。その名が合併で市名へ「格上げ」される形になったため、新市名は国名への回帰であると同時に、実在の町名の継承でもあり、反発を招きにくい着地点になった。同じ徳島県内では、阿南市もまた阿波の地域呼称から生まれた名である。
    sources:
    - q4-awa-uub
    - q4-tokushima-enkaku
  relations:
  - pref/36
  unknowns:
  - あわ北合併協議会で市名がどう選ばれたか（公募・候補・選定理由）の一次資料は確認できなかった。
  - 旧・阿波町が1955年に「阿波」と名付けられた理由も確認できなかった。
  updated: '2026-11-13'
