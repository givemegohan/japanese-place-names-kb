records:
- id: muni/36-三好市
  code: '362085'
  names:
    ja: 三好市
    reading: みよしし
    aliases: []
  user_terms:
  - みよしし 徳島
  - 大歩危・祖谷のある市
  - 三好郡の合併市
  - 愛知県のみよし市とは違う三好市
  naming_type: 合併新設
  prefecture: 徳島県
  homonyms: []
  summary: 2006年3月1日に三好郡の三野町・池田町・山城町・井川町・東祖谷山村・西祖谷山村が合併して誕生した市で、市名には郡名「三好」がそのまま採用された。当初は三好郡全体での合併が検討されたが、東部の三好町・三加茂町は東みよし町として同日に分かれて発足した。戦国大名・三好長慶で知られる三好氏はこの三好郡を拠点とした一族で、氏の名は郡名に由来し、郡名のほうが先にあった。大歩危・小歩危や祖谷のかずら橋を市域に含む。
  first_attestation:
    era: null
    year_western: null
    document: null
    note: 市名「三好市」の初出は2006年の発足時である。元になった郡名「三好」の文献上の初出は、本調査では特定できなかった。
  claims:
  - text: 三好市は2006年3月1日、三好郡の三野町・池田町・山城町・井川町・東祖谷山村・西祖谷山村が合併して誕生した。
    kind: fact
    level: E2
    status: established
    sources:
    - q4-miyoshi-yoran
  - text: 合併した6町村はいずれも三好郡に属し、新市名には郡名「三好」がそのまま採用された。
    kind: fact
    level: E2
    status: established
    sources:
    - q4-tokushima-enkaku
    - q4-miyoshi-uub
  - text: もともと三好郡の8町村全体での合併が検討されたが合併の枠組みで折り合わず、西部6町村の「三好市」と、東部2町（三好町・三加茂町）の「東みよし町」に分かれて同じ日に発足した。
    kind: fact
    level: E5
    status: established
    sources:
    - q4-miyoshi-wiki
  - text: 新市名「三好市」の決定に対しては、中心地だった池田町で反対意見の動きが強まり、池田町議会で合併の見直しを求める意見が出された。
    kind: fact
    level: E5
    status: established
    sources:
    - q4-miyoshi-wiki
  - text: 三好長慶で知られる三好氏は、三好郡を本拠とした一族であり、氏の名は郡名に由来する。すなわち「三好」の名は三好氏にちなんで付けられたのではなく、郡名が先にあって氏がそれを名乗ったものである。
    kind: fact
    level: E5
    status: established
    sources:
    - q4-miyoshi-wiki
  - text: 愛知県西加茂郡三好町が市制移行にあたり「三好市」を名乗ることを打診したが、徳島の三好市は2007〜2008年度に反対の意思を伝えた。そのため愛知県側は、2010年に平仮名の「みよし市」として市制を施行した。
    kind: fact
    level: E5
    status: established
    sources:
    - q4-miyoshi-wiki
  - text: 三好市の地方公共団体コードは362085である。
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 「三好市」を譲らなかった市
    text: 全国でも珍しいのが、「三好」という名をめぐる二つの自治体の綱引きである。愛知県の三好町は町名も読みも徳島の三好市と同じで、市制を施行すれば当然「三好市」になるはずだった。しかし先行していた徳島の三好市が公式に反対を表明したため、愛知県側は異例の平仮名市名「みよし市」を選んだ。一方、徳島の三好市の足元でも、三好町と三加茂町は合併から離れて「東みよし町」となり、「三好」を名乗る自治体は三好市・東みよし町・みよし市・三次市（三好とは無関係）の4つが並ぶややこしい地図になった。「三好」はもともと郡の名で、戦国大名の三好氏さえその郡名を借りた側である。名の正統をめぐる小さな争いは、郡名の古さの裏返しでもある。
    sources:
    - q4-miyoshi-wiki
  relations:
  - pref/36
  - muni/36-東みよし町
  - muni/23-みよし市
  - muni/34-三次市
  unknowns:
  - 三好西部合併協議会で新市名を決めた手続き（公募の有無・候補名）は、協議会の一次資料では確認できなかった。
  - 郡名「三好」自体の語源と文献上の初出は確認できなかった。
  updated: '2026-11-13'
- id: muni/36-吉野川市
  code: '362051'
  names:
    ja: 吉野川市
    reading: よしのがわし
    aliases: []
  user_terms:
  - 吉野川のほとりの市
  - よしのがわ
  - 鴨島・川島・山川の合併市
  - 麻植市にならなかった市
  naming_type: 合併新設
  prefecture: 徳島県
  homonyms: []
  summary: 2004年10月1日に麻植郡の鴨島町・川島町・山川町・美郷村が合併して発足した市で、市名は4町村すべてを流れる吉野川に由来する。新市名称の公募では郡名を採った「麻植市」が1位だったが、麻植郡合併協議会は2位の「吉野川市」に決定した。この合併で麻植郡は消滅した。
  first_attestation:
    era: 平成16年
    year_western: 2004
    document: 麻植郡合併協議会による新市名称の決定と合併による吉野川市の発足
    note: 市名としては2004年の合併で生まれた名。河川名「吉野川」自体の初出・語源は本レコードでは扱わない。
  claims:
  - text: 吉野川市は2004年10月1日、麻植郡の鴨島町・川島町・山川町・美郷村が合併して発足した。
    kind: fact
    level: E2
    status: established
    sources:
    - q4-tokushima-enkaku
  - text: 新市名称の公募（2002年7〜8月）には2,396通（有効2,284通）の応募と896種類の名称があり、応募数1位は「麻植市」、2位は「吉野川市」だった。
    kind: fact
    level: E5
    status: established
    sources:
    - q4-yoshinogawa-wiki
  - text: 麻植郡合併協議会は新市名称の候補を「麻植市」「吉野川市」の2案に絞り込んだうえで協議し、第7回合併協議会で「吉野川市」に決定した。
    kind: fact
    level: E5
    status: established
    sources:
    - q4-yoshinogawa-wiki
  - text: この合併で麻植郡の全町村が一つの市となり、麻植郡自体も消滅した。
    kind: fact
    level: E4
    status: established
    sources:
    - q4-yoshinogawa-uub
  - text: 市名の由来である吉野川は、合併した4町村すべてを流れる四国最大の河川で、4町村に共通する名として選ばれた。
    kind: fact
    level: E5
    status: established
    sources:
    - q4-yoshinogawa-wiki
  - text: 吉野川市の地方公共団体コードは362051である。
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 公募1位が敗れた市名
    text: 合併の新市名を公募すると、多くの場合、応募1位がそのまま採用される。吉野川市はその逆を行った例である。2002年の公募で最も多かったのは、郡名を残す「麻植市」だった。協議会もいったん候補を「麻植市」と「吉野川市」の2案に絞ったが、最終的に選んだのは2位のほうだった。麻植という郡名は「あさぎ」とも読める難読さもあり、吉野川の知名度が勝ったとみられる。結果として「麻植」は郡ごと地図から消え、川の名が残った。地名の存続は、公募の票数だけでは決まらないのである。
    sources:
    - q4-yoshinogawa-wiki
    - q4-yoshinogawa-uub
  relations:
  - pref/36
  unknowns:
  - 協議会が公募2位の「吉野川市」を選んだ理由の公式な説明は確認できなかった。
  - 河川名「吉野川」の語源（奈良の吉野との関係など）は確認できなかった。
  updated: '2026-11-13'
- id: muni/36-小松島市
  code: '362034'
  names:
    ja: 小松島市
    reading: こまつしまし
    aliases: []
  user_terms:
  - こまつしま
  - 小松市と小松島市の違い
  - 四国と阪神を結ぶ港町
  - フェリーの港 小松島
  naming_type: その他
  prefecture: 徳島県
  homonyms: []
  summary: 市の公式の沿革によれば、「小松島」の地名は、平安時代に当地の篠原郷が京都の仁和寺の荘園だった折、仁和寺のある京都の「小松郷」にちなんで生まれたとされる。1908年に小松島村が町制を施行し、1951年に市制を施行して小松島市となった。石川県の小松市とは別であり、こちらは四国と京阪神を結ぶ港町として発展した。
  first_attestation:
    era: 平安時代
    year_western: null
    document: null
    note: 市の公式の沿革は、篠原郷が仁和寺領だった時期に「小松島」の名が生まれたと説明するが、初出の文書名は示されておらず確認できなかった。
  claims:
  - text: 小松島市公式の沿革によれば、平安時代の当地には篠原郷・新居郷・余戸郷があり、篠原郷は一時、京都の仁和寺の荘園であった。
    kind: fact
    level: E2
    status: established
    sources:
    - q4-komatsushima-city-enkaku
  - text: 同市の沿革は、仁和寺が京都の「小松郷」という場所にあったことにちなんで「小松島」の地名が生まれたものと考えられると説明している。
    kind: fact
    level: E2
    status: established
    sources:
    - q4-komatsushima-city-enkaku
  - text: 小松島村は1908年11月1日に町制を施行して小松島町となり、1951年4月に那賀郡立江町と合併、同年6月1日に市制を施行して小松島市となった。
    kind: fact
    level: E2
    status: established
    sources:
    - q4-komatsushima-gaikyo
    - q4-komatsushima-city-enkaku
  - text: 1956年に那賀郡坂野町を編入し、現在の市域となった。
    kind: fact
    level: E2
    status: established
    sources:
    - q4-komatsushima-gaikyo
  - text: 小松島は天然の良港を持ち、四国と京阪神を結ぶ海上交通の要衝として「港都」と呼ばれる都市へ発展した。
    kind: fact
    level: E2
    status: established
    sources:
    - q4-komatsushima-city-enkaku
  - text: 小松島市の地方公共団体コードは362034である。
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 京都の小松郷から来た名前
    text: 小松島という名の故郷は、四国ではなく京都にある。市の沿革が語る由来はこうだ。平安時代、この地の篠原郷は京都の仁和寺の荘園だった。仁和寺は京都の「小松郷」と呼ばれる場所にあり、それにちなんで遠く離れた荘園の地にも「小松島」の名が生まれたという。荘園を通じて本拠地の地名が遠隔地へ移植される例は各地にあるが、本家が寺院で、名の由来が寺のある郷の名というのは珍しい。石川県の小松市は加賀の小松の地名に由来する別の市で、読みも成り立ちも異なる。港町・小松島の名は、京の寺へのつながりを今に伝えている。
    sources:
    - q4-komatsushima-city-enkaku
  relations:
  - pref/36
  - muni/17-小松市
  unknowns:
  - 「小松島」の名が文献に現れる初出は確認できなかった。
  - 篠原郷が仁和寺の荘園だった時期の詳細（荘園の名称や年代）は、市の公式の説明の範囲を超えては確認できなかった。
  updated: '2026-11-13'
- id: muni/36-徳島市
  code: '362018'
  names:
    ja: 徳島市
    reading: とくしまし
    aliases: []
  user_terms:
  - 徳島の名前の由来
  - 阿波おどりの市の名前
  - 渭津から徳島に改名した市の名前
  naming_type: 藩名
  prefecture: 徳島県
  homonyms: []
  summary: 市名は徳島藩の城下町・徳島に由来する。天正13年（1585年）、蜂須賀家政が猪山（現在の城山）に徳島城を築く際、それまで「渭津（いのつ）」と呼ばれた地を「徳島」と改めた。誰が名付けたか、「徳」の字をなぜ選んだかを示す文献は確認されておらず、縁起を担いだ命名とする郷土史家の推定がある。徳島市は明治22年（1889年）10月1日に誕生した。
  first_attestation:
    era: 天正13年
    year_western: 1585
    document: 徳島城築城に伴う改名（徳島市立徳島城博物館の解説）
    note: 地名の命名そのものとしての初出。改名を記した同時代の一次文書は今回特定できていない
  claims:
  - text: 徳島市の地方公共団体コードは362018である（総務省「全国地方公共団体コード」市区町村コード一覧による）
    kind: fact
    level: E2
    status: established
    sources:
    - e-cap-soumu-code-list
  - text: 天正13年（1585年）、豊臣秀吉の四国平定により蜂須賀家政が阿波国を与えられ、徳島城を築いて居城とした
    kind: fact
    level: E2
    status: established
    sources:
    - e-tokushima-pref-gaiyo
  - text: 城地は秀吉の命により猪山（現在の城山）と定められたと徳島市立徳島城博物館は伝えている
    kind: fact
    level: E2
    status: established
    sources:
    - e-tokushima-city-history01
  - text: 築城当時、城の周囲の地は「渭津（いのつ）」と呼ばれていたが、築城と城下町の開設にあたって「徳島」と地名を改めた
    kind: fact
    level: E2
    status: established
    sources:
    - e-tokushima-city-history05
    - e-tokushima-city-history01
  - text: 「徳島」という地名を誰が命名したかを、文献・古文書は明らかにしてくれない。郷土史家・河野幸夫は、「徳」は富田庄の「富」と同意の嘉字（よい意味の字）であり、東に福島という地名もあることから、家政が福島に対して徳島と縁起をかついで名付けたのではないかと推定しているが、決め手はないとされている
    kind: fact
    level: E2
    status: inferred
    sources:
    - e-tokushima-city-history05
  - text: 徳島は江戸時代を通じて、阿波・淡路両国25万7千石を領した蜂須賀氏の城下町として栄えた
    kind: fact
    level: E2
    status: established
    sources:
    - e-tokushima-pref-gaiyo
  - text: 明治22年（1889年）10月1日、かつて御山下と称した朱引地内の33か町村とこれに接続する4郷町村に市制が施行され、徳島市が誕生した。当時の徳島市の人口は6万861人で、その年に市制を施行した市の中で全国10位の規模だった
    kind: fact
    level: E2
    status: established
    sources:
    - e-cap-tokushima-city-hensan
  - text: 市制施行の際、市内の町村名はすべて「町」に統一され、10月1日は後に徳島市の置市記念日とされた
    kind: fact
    level: E2
    status: established
    sources:
    - e-cap-tokushima-city-hensan
  column:
    title: 福島の隣に徳島を ― 縁起を担いだ命名か
    text: 「徳島」の名付け親は分からない。しかし手がかりは地名の配置にある。城下の東には「福島」という地名があった。郷土史家・河野幸夫は、富田庄の「富」と同じく縁起のよい字である「徳」を選び、福島に対して徳島と対にして名付けたのではないか、と推定した。徳島城博物館の連載はこの推定を紹介しながら「決め手はない」と正直に結んでいる。命名の理由が残らなかった城下町は多いが、徳島の場合は「分からない」と明示した上で、もっともらしい推定の根拠まで示されている点が読みどころである。
    sources:
    - e-tokushima-city-history05
  relations:
  - pref/36
  unknowns:
  - 「徳島」の命名者と、「徳」の字が選ばれた理由を示す確かな記録は確認できていない
  - 「渭津」から「徳島」への改名を記した同時代の一次文書は今回特定できていない
  updated: '2026-11-13'
- id: muni/36-美馬市
  code: '362077'
  names:
    ja: 美馬市
    reading: みまし
    aliases: []
  user_terms:
  - うだつの上がる町並みの脇町
  - みまし
  - 美馬郡の名前の市
  - 美馬市と美馬郡つるぎ町
  naming_type: 合併新設
  prefecture: 徳島県
  homonyms: []
  summary: 2005年3月1日に美馬郡の脇町・美馬町・穴吹町・木屋平村が合併して発足した市で、市名には郡名「美馬」が採用された。同日の合併で貞光町・半田町・八千代村からつるぎ町が生まれ、美馬郡はつるぎ町のみを残して存続したため、「美馬市」と「美馬郡つるぎ町」が隣り合って併存する。「うだつの上がる町並み」で知られる脇町を含む。郡名「美馬」の語源には諸説があり、定説はない。
  first_attestation:
    era: 平安時代
    year_western: null
    document: 『和名類聚抄』（阿波国美馬郡）
    note: 郡名の初出としての性格を持つ。原本は未確認で、本レコードでは紹介資料による確認にとどめる。
  claims:
  - text: 美馬市は2005年3月1日、美馬郡の脇町・美馬町・穴吹町・木屋平村が合併して発足し、市名には郡名「美馬」が採用された。
    kind: fact
    level: E2
    status: established
    sources:
    - q4-tokushima-enkaku
    - q4-mima-uub
  - text: 旧・美馬町は1957年3月31日に郡里町と重清村が合併して生まれた町であり、市名「美馬」は郡名であると同時に、この旧町名とも重なっている。
    kind: fact
    level: E4
    status: established
    sources:
    - q4-mima-uub
  - text: 同じ2005年3月1日の合併で、美馬郡の残りの貞光町・半田町・八千代村からつるぎ町が生まれ、美馬郡はつるぎ町のみを残して存続した。そのため郡名を名乗る市と、その郡に属する町が隣り合って併存している。
    kind: fact
    level: E2
    status: established
    sources:
    - q4-tokushima-enkaku
  - text: 「美馬」の語源について、徳島県立図書館のレファレンス回答が引く『阿波 地名の学習』は、良馬を産出したとする説や、水の女神への信仰に結びつける説など複数の説を紹介し、著者自身は地形から「水沼（みぬま）」の音が変化したものとする説を採っている。
    kind: fact
    level: E2
    status: contested
    sources:
    - q4-mima-ndl
  - text: 『古代地名語源辞典』は「美馬」を「水間（みま）」すなわち湿地の意とする説を示し、「良馬の産地だった」という説には否定的であり、語源は資料によって見解が分かれている。
    kind: fact
    level: E4
    status: contested
    sources:
    - q4-mima-ndl
    - q4-mima-gogen
  - text: 脇町地区は脇城の城下町として、また藍の集散地として発展し、「うだつの上がる町並み」が1988年12月16日に国の重要伝統的建造物群保存地区に選定された。
    kind: fact
    level: E2
    status: established
    sources:
    - q4-mima-city-udatsu
  - text: 美馬市の地方公共団体コードは362077である。
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 市になっても消えなかった郡名
    text: 合併で市が郡名を名乗ると、普通はその郡は姿を消す。美馬の場合は違った。2005年、美馬郡の西半分が「美馬市」になり、東半分の3町村は「つるぎ町」として独立した合併を選んだため、美馬郡はつるぎ町1町だけを抱えて存続した。結果、「美馬市」と「美馬郡つるぎ町」が隣り合う、全国でも珍しい地図になった。しかも市名の「美馬」と旧・美馬町は別の由来を持つわけではなく、町名も郡名から来ている。市になった脇町は、商家の屋根に防火壁「うだつ」を連ねた町並みで知られる。郡名が市と郡の両方に生き残る土地で、江戸時代の商いの繁栄の跡が今も通りに残っている。
    sources:
    - q4-mima-uub
    - q4-tokushima-enkaku
  relations:
  - pref/36
  - muni/36-つるぎ町
  unknowns:
  - 「美馬」の語源は諸説あり、定説は確認できなかった（記録した対立のまま）。
  - 2005年の合併協議会で市名「美馬」が選定された経緯の詳細は確認できなかった。
  updated: '2026-11-13'
- id: muni/36-阿南市
  code: '362042'
  names:
    ja: 阿南市
    reading: あなんし
    aliases: []
  user_terms:
  - あなん 徳島
  - LEDのまち阿南
  - 那賀川の工業都市
  - 長野県の阿南町とは違う阿南市
  naming_type: 合併新設
  prefecture: 徳島県
  homonyms:
  - muni/20-阿南町
  summary: 1958年5月1日に那賀郡の富岡町と橘町が合併して市制を施行した市。「阿南」は、阿波国を阿南・阿北・阿西と呼びならわしてきた言い方に由来し、県南の代表にふさわしい名として選ばれたと図書館のレファレンス回答は伝える。2006年に那賀川町・羽ノ浦町を編入して現在の市域となった。長野県下伊那郡にも同名の阿南町があるが、由来は無関係である。
  first_attestation:
    era: 昭和33年
    year_western: 1958
    document: 富岡町と橘町の合併による阿南市の市制施行
    note: 「阿南」という呼び名自体は、それ以前から阿波の南部を指す地域呼称として使われていたと図書館の回答は述べるが、その初出の文書は確認できなかった。
  claims:
  - text: 阿南市立那賀川図書館のレファレンス回答によれば、「阿南市」の名称は、阿波国を阿南・阿北・阿西と呼びならわしていたことから名付けたもので、県南の代表たるにふさわしいとされた。
    kind: fact
    level: E2
    status: established
    sources:
    - q4-anan-ndl
  - text: 阿南市は1958年5月1日、那賀郡の富岡町と橘町が合併して市制を施行し、発足した。
    kind: fact
    level: E2
    status: established
    sources:
    - q4-tokushima-enkaku
    - q4-anan-city-profile
  - text: 富岡町は1954年から1955年にかけて、中野島村・宝田村・長生村・加茂谷村・見能林村など周辺の町村を相次いで編入し、阿南市発足時の市域の骨格を作っていた。
    kind: fact
    level: E2
    status: established
    sources:
    - q4-tokushima-enkaku
  - text: 中心市街地のある富岡は、室町時代に阿波公方の居地となった旧城下町である。
    kind: fact
    level: E2
    status: established
    sources:
    - q4-anan-city-profile
  - text: 2006年3月20日に那賀川町と羽ノ浦町を編入し、新しい阿南市として出発した。
    kind: fact
    level: E2
    status: established
    sources:
    - q4-anan-city-profile
  - text: 阿南市の地方公共団体コードは362042である。
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 阿波の「南」という名前
    text: 1958年の合併で候補になり得たのは、中心地の富岡でも、もう一方の橘でもなかった。選ばれた「阿南」は、どちらの町の名でもない第三の名である。阿波の国は古くから阿南・阿北・阿西と呼び分けられてきた。その「阿波の南」という地域呼称をそのまま市名にすれば、県南を代表する市にふさわしい――それが図書館に伝わる命名の理由である。合併で片方の地名を採ると他方が反発する、という新市名の定番の難問を、地域全体の呼び名で解いた例といえる。なお、この名の読みは「あなん」で、長野県の山あいにある同名の阿南町とは由来も場所も全く異なる。今の阿南市はLED産業の集積で「光のまち阿南」を掲げる工業都市である。
    sources:
    - q4-anan-ndl
    - q4-anan-city-profile
  relations:
  - pref/36
  unknowns:
  - 「阿南」という呼称がいつから阿波の南部を指して使われたか、その初出は確認できなかった。
  - 1958年の市名選定の手続き（公募の有無や他の候補名）は確認できなかった。
  updated: '2026-11-13'
- id: muni/36-阿波市
  code: '362069'
  names:
    ja: 阿波市
    reading: あわし
    aliases: []
  user_terms:
  - あわし
  - 旧国名を名乗る市
  - あわ北4町の合併
  - 市場町・阿波町の合併市
  naming_type: 合併新設
  prefecture: 徳島県
  homonyms: []
  summary: 2005年4月1日に板野郡の吉野町・土成町と阿波郡の市場町・阿波町の4町が合併して発足した市。市の総合計画はこの合併を「あわ北4町の合併」と位置づけている。市名「阿波」は旧国名であると同時に、構成町の一つだった旧・阿波町の名と重なっており、国名への回帰と町名の継承が重なった命名である。この合併で阿波郡は消滅した。
  first_attestation:
    era: 平成17年
    year_western: 2005
    document: あわ北合併協議会の協議を経た4町の合併による阿波市の発足
    note: 市名としての初出は2005年。国名「阿波」自体の初出は都道府県レコード（徳島県）側で扱う領域であり、本レコードでは扱わない。
  claims:
  - text: 阿波市は2005年4月1日、板野郡の吉野町・土成町と阿波郡の市場町・阿波町の4町が合併して発足した。
    kind: fact
    level: E2
    status: established
    sources:
    - q4-tokushima-enkaku
  - text: 阿波市の総合計画はこの合併を「あわ北4町の合併により誕生した阿波市」と位置づけている。
    kind: fact
    level: E2
    status: established
    sources:
    - q4-awa-city-plan
  - text: 構成町の一つである旧・阿波町は、1955年3月31日に久勝町・林町・伊沢村が合併して成立した町である。新市名「阿波」は、この町名と旧国名の双方に重なる名である。
    kind: fact
    level: E4
    status: established
    sources:
    - q4-awa-uub
  - text: 合併の協議は、阿波郡の市場町・阿波町の検討協議会に板野郡の吉野町・土成町が加わる形で「あわ北合併協議会」として進められた、郡をまたぐ合併だった。
    kind: fact
    level: E4
    status: established
    sources:
    - q4-awa-uub
  - text: この合併により阿波郡は消滅した一方、板野郡は他の町を残して存続した。
    kind: fact
    level: E4
    status: established
    sources:
    - q4-awa-uub
  - text: 阿波市の地方公共団体コードは362069である。
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 旧国名を名乗る市
    text: 県名が「徳島」になってから130年以上たって、旧国名「阿波」を名乗る市が現れた。2005年の合併で4町が一つになるとき、中心的な町名を採る代わりに選ばれたのが、県全体を指していた古い国名だった。ただし、この命名が成立した鍵は、構成町の中にすでに「阿波町」という町が実在したことにある。阿波町は1955年、阿波郡の3町村の合併で生まれた町で、国名を町名にしていた。その名が合併で市名へ「格上げ」される形になったため、新市名は国名への回帰であると同時に、実在の町名の継承でもあり、反発を招きにくい着地点になった。同じ徳島県内では、阿南市もまた阿波の地域呼称から生まれた名である。
    sources:
    - q4-awa-uub
    - q4-tokushima-enkaku
  relations:
  - pref/36
  unknowns:
  - あわ北合併協議会で市名がどう選ばれたか（公募・候補・選定理由）の一次資料は確認できなかった。
  - 旧・阿波町が1955年に「阿波」と名付けられた理由も確認できなかった。
  updated: '2026-11-13'
- id: muni/36-鳴門市
  code: '362026'
  names:
    ja: 鳴門市
    reading: なるとし
    aliases:
    - 鳴南市
  user_terms:
  - 鳴門の名前の由来
  - 鳴南市って何
  - 渦潮の市の名前
  - 撫養（むや）の意味
  naming_type: 合併新設
  prefecture: 徳島県
  homonyms: []
  summary: 1947年（昭和22年）3月に板野郡撫養町・瀬戸町・鳴門町・里浦村が合併して発足した市。発足時の市名は妥協案の「鳴南市」だったが市民に不評で、わずか2か月後の同年5月に、渦潮で知られる鳴門海峡の名を取って「鳴門市」に改称した。中心市街の撫養は古代からの港町で、古くは牟夜（むや）と呼ばれた地である。
  first_attestation:
    era: 奈良時代
    year_western: 713
    document: 『阿波国風土記』逸文（『万葉集註釈』所引）「牟夜戸」
    note: 市名そのものの初出ではなく、現中心市街・撫養の古名「牟夜」の初出とされるもの（風土記の編纂は和銅6年=713年の命令による）。海峡名「鳴門」の文献上の初出は確認できていない
  claims:
  - text: 鳴門市の地方公共団体コードは362026である（総務省「地方公共団体コード一覧」による）
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  - text: 1947年（昭和22年）3月15日、板野郡撫養町・瀬戸町・鳴門町・里浦村の3町1村が合併して鳴南市が発足し、同年5月15日に鳴門市へ改称した
    kind: fact
    level: E2
    status: established
    sources:
    - q5-naruto-city-history
    - q5-tokushima-pref-naruto
  - text: 新市名は中心市街の撫養町と渦潮観光の鳴門町との間で調整が難航し、「鳴南市」とすることで妥協したが、市民から不評だったため2か月で鳴門市に改称された
    kind: fact
    level: E5
    status: established
    sources:
    - q5-naruto-wiki
  - text: 市名の元になった海峡名「鳴門」は、潮流が音を立てて鳴る狭い海峡（鳴る瀬戸・迫門）の意と説明され、近世以前は「鳴戸」とも書かれた
    kind: fact
    level: E5
    status: established
    sources:
    - q5-naruto-wiki
  - text: 鳴門市公式の名勝解説によれば、この海峡は古くは『日本書紀』や『土佐日記』に「あはのみと（阿波の水門・粟門）」として現れ、『後撰和歌集』など和歌に詠み込まれる中で「鳴門」の名が次第に定着した
    kind: fact
    level: E2
    status: established
    sources:
    - q5-naruto-meisho
  - text: 中心市街の撫養（むや）は古代からの港町で、『阿波国風土記』逸文には「牟夜戸」と見え、平城宮跡出土木簡にも「牟屋」と表れることが『日本歴史地名大系』に紹介されており、牟夜（牟屋）がのちの撫養である
    kind: fact
    level: E3
    status: established
    sources:
    - q5-muya-kotobank
  - text: 撫養の語源については、港に船をつなぐ意の「もやい」の転訛とする説と、古代の官道・南海道の水駅として設けられた「室屋」の転訛とする説がある
    kind: fact
    level: E3
    status: contested
    sources:
    - q5-muya-kotobank
  - text: 1967年（昭和42年）に大麻町を編入して現在の市域となり、市役所は旧撫養町の撫養町南浜に置かれている。市の中心は海峡沿いの鳴門町地区ではなく撫養にある
    kind: fact
    level: E2
    status: established
    sources:
    - q5-tokushima-pref-naruto
    - q5-naruto-city-history
  column:
    title: 2か月だけ存在した「鳴南市」
    text: 1947年の合併で生まれた市の最初の名前は「鳴南市（めいなんし）」だった。中心市街の撫養町と、渦潮観光で名を売る鳴門町。どちらの名を市名にするかで調整が難航し、「撫養鳴門市」という折衷案まで出た末の妥協が鳴南市だったと伝えられる。ところがこの名は市民に不評で、発足からわずか2か月で「鳴門市」に改称された。妥協の産物ではなく、誰もが知る海峡の名を選んだ方が早かった、という決着である。市役所はいまも撫養にあり、地図の上では「鳴門」の原点（海峡）と市の中心がずれている点も、この市の面白さである。
    sources:
    - q5-naruto-wiki
    - q5-naruto-city-history
  relations:
  - pref/36
  unknowns:
  - 海峡名「鳴門」の文献上の初出（「鳴戸」表記を含む）は確認できていない
  - 「鳴南市」の「南」の字が何を意味したのか（鳴門の南の意か等）は資料で確認できていない
  - 撫養の語源について「もやい」説と「室屋」説のどちらが正しいかは決着していない
  - 『日本書紀』『土佐日記』にいう「あはのみと」の具体的な条文は原典で確認していない（市公式解説の紹介による）
  updated: '2026-11-13'
