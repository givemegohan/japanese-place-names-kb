  - 水と緑と太陽の里
  naming_type: 中心地名の継承
  formation: 分村・分立
  prefecture: 沖縄県
  homonyms: []
  summary: 沖縄本島東海岸中部、国頭郡の村。「宜野座」は古くからの集落名で、1649年の『絵図郷村帳』に金武間切の村として見え、近世には「ぎぬざ」と読まれた。1908年に金武村の一部となり、終戦後の1946年に金武村から分村して宜野座村が誕生した。村名の語源は確定しておらず、姓が「宜野座」という島横目役人が派遣されたという伝承が村公式に残るが、それは村名の由来とまでは裏づけられていない。
  first_attestation:
    era: 慶安2年
    year_western: 1649
    document: 『絵図郷村帳』
    note: 宜野座村公式「宜野座村の歴史」が、1649年の『絵図郷村帳』に現在の村域の地名として古知屋・宜野座・惣慶・漢那の4村が見えると紹介するもの。原典を直接確認していないため、主張側ではE2として扱う
  claims:
  - text: 総務省「地方公共団体コード一覧」で、宜野座村の団体コードは473138とされている
    kind: fact
    level: E2
    status: established
    sources:
