    - v11-sakaki-wiki
  - text: 明治19年（1886年）5月18日に村名の表記が「坂木」から「坂城」へ改められ、明治22年（1889年）に坂城村が単独で発足したとされる
    kind: fact
    level: E5
    status: established
    sources:
    - v11-sakaki-wiki
  - text: 村上氏は南北朝時代に坂木（坂城）の地へ拠点を移し、千曲川右岸の葛尾城を居城としたと町公式が説明する
    kind: fact
    level: E2
    status: established
    sources:
    - v11-sakaki-town-kazurao
  - text: 天文22年（1553年）、村上義清は武田信玄の攻撃に敗れて葛尾城を自落させ越後へ逃れ、これが上杉謙信の出兵と川中島の合戦を招いた
    kind: fact
    level: E2
    status: established
    sources:
    - v11-sakaki-town-kazurao
  - text: 明治37年（1904年）に坂城村が町制を施行し、昭和30年（1955年）4月1日に南条村・中之条村と合併して現在の坂城町となった
    kind: fact
    level: E4
    status: established
    sources:
    - v11-sakaki-uub
  - text: 明治19年の「坂木」から「坂城」への改称の理由は、確認した公的資料に明示されていない
    kind: fact
    level: E2
    status: indeterminate
    sources:
    - v11-sakaki-town-kazurao
  - text: 葛尾城の落城の際、村上義清の奥方が危険を顧みず渡し船の船頭に髪の笄（こうがい）を礼として手渡し、それ以来その渡し場が「笄の渡し」と呼ばれるようになったという伝説がある
    kind: legend
    level: E2
    status: established
    sources:
    - v11-sakaki-town-kougai
  - text: 坂城町の地方公共団体コードは205214である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 坂「木」が坂「城」に戻った日
    text: 平安時代の『和名類聚抄』に「坂城」と書かれた郷は、中世以降「坂木」と書かれるようになり、宿場町も「坂木宿」だった。ところが明治19年（1886年）、表記がふたたび「坂城」へ改められた。千年前の古い表記に、自分たちの地名を「戻した」出来事である。読みの「さかき」は変わらなかったため、「坂城」と書いて榊の木と混同されることもあるが、読みの由来は榊とは別である。葛尾城の麓で、村上義清が武田信玄と戦った城下の名が、今も町の名として残っている。
    sources:
    - v11-sakaki-kotobank-taikei
    - v11-sakaki-wiki
  relations:
  - pref/20
  unknowns:
  - 「さかき」という読みそのものの語源（坂の多い地形に由来する説など、専門資料での確定は未確認）
  - 明治19年（1886年）の「坂木」から「坂城」への改称が、古代の郷名への復古だったのかを示す当時の記録
  updated: '2026-11-13'
- id: muni/20-塩尻市
  code: '202151'
  names:
    ja: 塩尻市
    reading: しおじりし
    aliases:
    - 塩尻町
    - 塩尻宿
  user_terms:
  - しおじりし
  - 塩の道のまち
  - 塩尻宿の宿場町
  - 塩尻の名前の由来
  naming_type: その他（塩の道の集散地だった宿場町・塩尻の名の継承）
  prefecture: 長野県
  homonyms: []
  summary: 塩尻市は中山道の宿場町・塩尻宿を中心に発達した市で、名は塩の輸送の末端という位置に由来すると説明される。市公式サイトによれば、太平洋側と日本海側の両方から塩を運ぶ「塩の道」の終着・集散の地だったため、道の最後を意味する「尻」が付いたという説が有名である（諸説あるとも明記される）。1959年に塩尻町ほかの合併で市制を施行し、2005年に楢川村と合併した。
  first_attestation:
    era: （未確認）
    year_western: null
    document: （未確認）
    note: 塩尻宿は近世の中山道の宿場として知られるが、「塩尻」の地名の初出は本調査では確認できなかった
  claims:
  - text: 塩尻市公式サイトは「塩尻」の由来として、太平洋側と日本海側の両方から塩を運ぶ「塩の道」の終着・集散の地だったため、道の最後を意味する「尻」を付けたという説が有名であると紹介している
    kind: fact
    level: E2
    status: contested
    sources:
    - v2-shiojiri-yurai
  - text: 同ページは、この由来については諸説あることも明記しており、塩の道説を唯一の定説とはしていない
    kind: fact
    level: E2
    status: contested
    sources:
    - v2-shiojiri-yurai
  - text: 昭和34年（1959年）に塩尻町・片丘村・広丘村・宗賀村・筑摩地村が合併して塩尻市が発足した
    kind: fact
    level: E2
    status: established
    sources:
    - v2-shiojiri-yurai
  - text: 平成17年（2005年）に木曽郡楢川村と合併し、現在の塩尻市となった
    kind: fact
    level: E2
    status: established
    sources:
    - v2-shiojiri-yurai
  - text: 塩尻は中山道の宿場町（塩尻宿）を中心とする地名であり、市名はこの宿場町の名を受け継ぐ
    kind: fact
    level: E2
    status: established
    sources:
    - v2-shiojiri-yurai
  - text: 塩尻市の地方公共団体コードは202151である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 海のない真ん中で、二つの海の塩が出会った
    text: 海に面しない信濃の山あいにあって、塩は命をつなぐ貴重品だった。塩尻には、日本海側の糸魚川から千国街道を南下する塩と、太平洋側から伊那谷を北上する塩の、両方の「塩の道」が届いた。その終着点であり集散地だったことが、「尻」という名の由来とされる。地名の最後の一文字に、海から遠く離れた土地の切実な事情が刻まれている。
    sources:
    - v2-shiojiri-yurai
  relations:
  - pref/20
  unknowns:
  - 「塩尻」の地名の初出文献を確認できなかった
  - 塩の道説以外の諸説の具体的な内容を、専門辞典で確認できなかった
  - 合併年次は市の紹介ページに基づくもので、市史による裏付けは今後の課題
  updated: '2026-11-13'
- id: muni/20-売木村
  code: '204129'
  names:
    ja: 売木村
    reading: うるぎむら
    aliases: []
  user_terms:
  - うるぎ
  - 南信州の小さな村
  - 米俵マラソンの村
  naming_type: その他（古来の地名「売木」の継承。語源は未確定）
  prefecture: 長野県
  homonyms: []
  summary: 下伊那郡南部の山間の小村。「売木（うるぎ）」の名は江戸時代前期の『下条記』に見え、地域は中世の遠山庄の一部だった。語源には定説がなく、湿地に関わる「ウル（潤す）」説と、川の上流を指す「ウレ・ウラ」説が挙げられている。1889年に和合村と共に豊村となり、1948年に分村して売木村が発足した。
  first_attestation:
    era: 江戸時代（元禄年間）
    year_western: null
    document: 『下条記』
    note: 『日本歴史地名大系』が紹介する元禄末成立の『下条記』に「西ハ和合・売木・月瀬・根羽・平谷」とあり、「売木」の名の初期の確認例とされる。原文を直接確認していないため、主張側ではE3に格下げして扱う
  claims:
  - text: 「うるぎ」という地名には定説がなく、「ウル」という語幹を「潤す」の意味と見て低湿地を指す説と、「ウレ」ないし「ウラ」は川の上流端や谷を示す語の転じたものという説が挙げられている
    kind: fact
    level: E4
    status: contested
    sources:
    - v11-urugi-rekishinote
  - text: 村は「うるぎ」を「うるおう木」と読み解き、自らを「うるおう木の村」と紹介している
    kind: fact
    level: E4
    status: established
    sources:
    - v11-urugi-japanlocal
  - text: 『日本歴史地名大系』によれば、元禄末に成立した『下条記』に「西ハ和合・売木・月瀬・根羽・平谷」と記されており、この地域は江儀遠山庄と美濃遠山庄の二つの荘域が合わさる地域にあたっていたとみられる
    kind: fact
    level: E3
    status: established
    sources:
    - v11-urugi-kotobank-taikei
  - text: 江戸時代の売木は、年貢を米でなく榑木（くれき、板子）で納める地であったと『世界大百科事典』は記す
    kind: fact
    level: E3
    status: established
    sources:
    - v11-urugi-kotobank-sekai
  - text: 明治22年（1889年）に和合村・売木村の区域をもって豊村が発足し、昭和23年（1948年）7月1日に分村して大字売木の区域をもって売木村が発足した
    kind: fact
    level: E5
    status: established
    sources:
    - v11-urugi-wiki
  - text: 売木村の地方公共団体コードは204129である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 「木を売る村」ではなかった
    text: 漢字だけ見れば「木を売る村」と読めてしまう「売木（うるぎ）」。しかし読みは「うるぎ」で、語源は確定していない。「潤い」の語幹に関わる湿地説、川の上流を指す語の転訛説――いずれも「売る」「木」とは無関係である。実際、江戸時代のこの地は年貢を米ではなく榑木（板）で納める山の村で、木材は暮らしの中心だった。村自身は「うるおう木の村」と漢字を読み解いて標語にしている。四つの峠に囲まれた小さな盆地の名は、まだ謎のままである。
    sources:
    - v11-urugi-rekishinote
    - v11-urugi-kotobank-sekai
    - v11-urugi-japanlocal
  relations:
  - pref/20
  - muni/20-阿南町
  unknowns:
  - 「うるぎ」の確定的な語源。江戸期以前の史料での用例の確認を含め、専門文献での決着は未確認
  - 『下条記』より古い「売木」の表記の初出
  updated: '2026-11-13'
- id: muni/20-大桑村
  code: '204307'
  names:
    ja: 大桑村
    reading: おおくわむら
    aliases:
    - 小吉祖荘
  user_terms:
  - おおくわ
  - 須原宿のある村
  - 木曽谷の村
  naming_type: 新規命名（1874年の合併に際し、養蚕の振興を願って命名したと伝わる）
  prefecture: 長野県
  homonyms: []
  summary: 木曽谷の中ほどの村。中世には小吉祖（おぎそ）荘の地だった。1874年に須原・長野・殿・野尻の4村が合併した際、将来有望視された養蚕業の振興を願って「大桑」と命名したと伝わる。村章も桑の葉の形である。1881年に一度分村したが1889年に再び合併して現在の大桑村となった。
  first_attestation:
    era: 明治7年
    year_western: 1874
    document: null
    note: 村名「大桑」の初出は明治7年（1874年）12月の4村合併による大桑村発足（村公式の沿革による）
  claims:
  - text: 明治7年（1874年）12月に須原村・長野村・殿村・野尻村が合併して大桑村となり、明治14年（1881年）3月に分村したが、明治22年（1889年）4月に再び合併して現在の村域となったと村公式の沿革は記す
    kind: fact
    level: E2
    status: established
    sources:
    - v11-okuwa-vill-enkaku
  - text: 村名は、将来有望視される養蚕業の振興を願って命名したという
    kind: fact
    level: E4
    status: established
    sources:
    - v11-okuwa-shinmai
  - text: 中世には現在の大桑村を中心に小吉祖（おぎそ）荘が成立していた
    kind: fact
    level: E2
    status: established
    sources:
    - v11-okuwa-vill-enkaku
  - text: 村公式の沿革は、『続日本紀』に大宝2年（702年）「岐蘇山道を開く」、和銅6年（713年）に元明女帝勅使が岐蘇山道を通ったとあることを、当地域の古代の交通の記録として紹介している
    kind: fact
    level: E2
    status: established
    sources:
    - v11-okuwa-vill-enkaku
  - text: 村内の須原宿は木曽谷の中で最も古くに栄えた宿場の一つで、洪水被害のため享保2年（1717年）に現在地へ移転した
    kind: fact
    level: E2
    status: established
    sources:
    - v11-okuwa-vill-suhara
  - text: 村章は桑の葉の形に「大」の字を組み合わせたもので、村名の由来とされる養蚕への願いを図案化している
    kind: fact
    level: E4
    status: established
    sources:
    - v11-okuwa-shinmai
  - text: 大桑村の地方公共団体コードは204307である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 願いを込めた「桑」の字
    text: 大桑村の名は、1874年の合併のとき新しく付けられた「願い」の名である。木曽谷で将来有望と見られた養蚕を盛んにしたい――その願いを、蚕の餌である桑の字に込めた。村章はそのまま桑の葉の形に「大」の字を入れたものだ。合併のわずか7年後に村は一度分かれたが、1889年に再び一つに戻り、「大桑」の名はそのまま続いた。中世の小吉祖荘の地に、明治の産業の希望が村名として刻まれている。
    sources:
    - v11-okuwa-shinmai
    - v11-okuwa-vill-enkaku
  relations:
  - pref/20
  - muni/20-南木曽町
  unknowns:
  - 1874年の合併時に「大桑」という名が選ばれた経緯を示す当時の記録（養蚕振興説は新聞の地名コラムによる伝承）
  - 中世の荘園名「小吉祖（おぎそ）」の語源
  updated: '2026-11-13'
- id: muni/20-大町市
  code: '202126'
  names:
    ja: 大町市
    reading: おおまちし
    aliases: []
  user_terms:
  - おおまちし
  - 北アルプスの玄関口
  - 黒部ダムの玄関口
  - 仁科三湖のまち
  naming_type: 一部の地名
  prefecture: 長野県
  homonyms:
  - muni/41-大町町
  summary: 大町市は北アルプスの麓、仁科三湖を擁する市で、「大町」の名は中世の市場町に遡る。『角川日本地名大辞典』によれば「大町」の初出は天文22年（1553年）の仁科盛政文書で、本来は本町と仲町の総称だったという。平安時代から戦国時代にこの地を領有した仁科氏のもと、千国街道（塩の道）沿いの交通の要地として発展した。なお佐賀県には同名の「大町町」がある。
  first_attestation:
    era: 天文22年
    year_western: 1553
    document: 仁科盛政文書
    note: 『角川日本地名大辞典 20 長野県』の記載としてWikipedia「大町（大町市）」が紹介するもの（辞典・原典そのものの確認はしていない）
  claims:
  - text: Wikipedia「大町（大町市）」は『角川日本地名大辞典 20 長野県』の記載として、「大町」の名称の初出は天文22年（1553年）の仁科盛政文書で、本来は「本町」と「仲町」の総称を指したと紹介する
    kind: fact
    level: E5
    status: established
    sources:
    - v2-omachi-wiki
  - text: 同記事は同じく同辞典の記載として、鎌倉時代には仁科氏の居館を中心に三日町・五日町などの定期市が立つ市場町が形成され、戦国期以降は千国街道（糸魚川街道）沿いに大町宿が形成されたと紹介する
    kind: fact
    level: E5
    status: established
    sources:
    - v2-omachi-wiki
  - text: 長野県の資料によれば、この地は平安時代中期から戦国時代にかけて仁科氏が領有し、北方の糸魚川方面と結ぶ千国街道（通称・塩の道）に沿って発展し、海産物をはじめ多くの物資が流通した
    kind: fact
    level: E2
    status: established
    sources:
    - v2-omachi-pref
  - text: 昭和29年（1954年）7月に大町・平村・常盤村・社村が合併して大町市が発足し、平成18年（2006年）1月に美麻村・八坂村を編入した
    kind: fact
    level: E2
    status: established
    sources:
    - v2-omachi-pref
  - text: 大町市には国宝の仁科神明宮や仁科三湖（青木湖・中綱湖・木崎湖）があり、黒部ダム・立山黒部アルペンルートの長野県側の玄関口である
    kind: fact
    level: E2
    status: established
    sources:
    - v2-omachi-pref
  - text: 大町市の地方公共団体コードは202126である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 「大きな町」ではなく、二つの町の総称だった
    text: 「大町」という名は、町が大きかったから付いたのではない。もともとは「本町」と「仲町」という、市場町の二つの町並みをまとめて呼ぶ総称だったという。仁科氏の居館のまわりには三日町・五日町といった定期市の立つ町が並び、やがて千国街道の宿場として賑わった。二つの町の名が合わさって残り、昭和の合併で市の名になった。佐賀県の大町町と同名だが、由来の層はまったく別の土地の話である。
    sources:
    - v2-omachi-wiki
    - v2-omachi-pref
  relations:
  - pref/20
  - muni/41-大町町
  unknowns:
  - 『角川日本地名大辞典 20 長野県』の「大町」項目を直接確認できなかった（Wikipedia経由の紹介による）
  - 佐賀県大町町との由来の異同は、相手方のレコード作成時に確認する
  updated: '2026-11-13'
- id: muni/20-大鹿村
  code: '204170'
  names:
