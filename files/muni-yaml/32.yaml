  prefecture: 島根県
  homonyms: []
  summary: 市名は、中国地方最大の河川・江の川の河口の港を意味する中心地「江津」の名を継いだもの。『日本歴史地名大系』は、江川河口の港津の意から江津または郷津と称されたと説明する。江戸時代には北前船の寄港地として栄え、1954年に江津町を中心とする9町村の合併で市制を施行し、2004年に桜江町を編入した。
  first_attestation:
    era: null
    year_western: null
    document: null
    note: 「江津」の名の初出は今回の調査では特定できなかった。『日本歴史地名大系』は名の意味（江川河口の港津）を説明するが、初出の史料は示されていない。
  claims:
  - text: 『日本歴史地名大系』は、江津の地名は江川（江の川）河口の港津の意から江津または郷津と称されたもので、市制施行にあたり中心地である江津町の名称をもって市名としたと説明する。
    kind: fact
    level: E3
    status: established
    sources:
    - q1-gotsu-jiten
  - text: 江津市は公式の歴史解説で「江津（川の港）」の名のとおり、江の川河口の港として発展したと説明している。
    kind: fact
    level: E2
    status: established
    sources:
    - q1-gotsu-city
  - text: 江戸時代の市域は大森代官所（天領）・浜田藩・津和野藩の3領地に分かれていたが、交通の要衝である江津本町は天領に組み込まれ、北前船の寄港地として栄えた。
    kind: fact
    level: E2
    status: established
    sources:
    - q1-gotsu-city
  - text: 約1300年前、万葉の歌人・柿本人麻呂が妻の依羅娘子とともにこの地で過ごしたとされ、別離を詠んだ石見相聞歌ゆかりの地として知られる。
    kind: legend
    level: E2
    status: established
    sources:
    - q1-gotsu-city
  - text: 1954年（昭和29年）4月1日、那賀郡江津町・都野津町など9町村が合併して江津市が誕生した。
    kind: fact
    level: E2
    status: established
    sources:
    - q1-gotsu-city
  - text: 2004年（平成16年）10月1日に邑智郡桜江町を編入し、現在の江津市となった。
    kind: fact
    level: E2
    status: established
    sources:
    - q1-gotsu-city
  column:
    title: 読みにくい「ごうつ」、意味は単純「川の港」
    text: 初めて見る人の多くが読みに迷う「江津（ごうつ）」。しかし名の意味は驚くほど単純で、中国地方最大の川・江の川の河口にある港（津）という、そのままの地形地名である。「郷津」という表記もあったと辞典は伝える。江の川の水運と日本海の海運が交わる場所だったからこそ、江戸時代には天領として押さえられ、北前船が寄港した。読みの古めかしさと意味の明快さの落差が、この地名の面白さである。なお、この地は万葉歌人・柿本人麻呂が石見で妻と別れた歌の舞台としても知られ、港町であると同時に万葉ゆかりの地でもある。
    sources:
    - q1-gotsu-jiten
    - q1-gotsu-city
  relations:
  - pref/32
  unknowns:
  - 「江津」の名が史料に初めて現れる時期は特定できなかった
  - 「ごうつ」という読みが定着した経緯（「郷津」表記との関係を含む）は確認できなかった
  updated: '2026-11-13'
- id: muni/32-津和野町
  code: '325015'
  names:
    ja: 津和野町
    reading: つわのちょう
    aliases: []
  user_terms:
  - 津和野の名前の由来
  - なぜ山陰の小京都というの
  - 津和野城と吉見氏 亀井氏
  - 津和野町はいつ合併したの
  naming_type: 合併新設
  prefecture: 島根県
  homonyms: []
  summary: 現在の津和野町は2005年に旧津和野町と日原町が合併して生まれ、町名は旧津和野町の名を継承した。津和野は中世に吉見氏の城下として開け、江戸時代は亀井氏の城下町として「山陰の小京都」と呼ばれる町並みを育んだ。「津和野」の語源については、専門辞典・町の資料のいずれでも確定した説明を確認できず、語源未詳として記録する。
  first_attestation:
    era: 文明2年
    year_western: 1470
    document: 弘中武長書状（益田家文書）
    note: 「津和野」の用例を日本歴史地名大系が紹介するもの。津和野は中世の吉賀郡野々郷の範囲に比定される
  claims:
  - text: 2005年（平成17年）9月25日、旧津和野町と日原町が合併して現在の津和野町が誕生し、町名は旧津和野町の名を継承した。町役場は旧日原町役場に置かれた（地方公共団体コードは325015）
    kind: fact
    level: E2
    status: established
    sources:
    - k6-tsuwano-town-keikaku
    - b-cap-chiba-soumu-code
  - text: 1955年（昭和30年）1月10日、津和野町・畑迫村・木部村と小川村の一部が合併して、新しい津和野町が発足した
    kind: fact
    level: E2
    status: established
    sources:
    - e-shimane-pref-chimeikan
    - k6-tsuwano-town-keikaku
  - text: 1889年（明治22年）の町村制施行により、鹿足郡津和野町が発足した
    kind: fact
    level: E2
    status: established
    sources:
    - k6-tsuwano-town-keikaku
  - text: 津和野は中世の吉賀郡野々郷の範囲に比定され、「津和野」の用例として文明2年（1470年）の益田家文書（弘中武長書状）が確認できると日本歴史地名大系は紹介する
    kind: fact
    level: E3
    status: established
    sources:
    - k6-tsuwano-kotobank
  - text: 鎌倉時代、弘安5年（1282年）に吉見頼行が下って館を構え、永仁3年（1295年）から城（三本松城、のちの津和野城）の築城を始めた。吉見氏は14代・319年にわたってこの地を治めた
    kind: fact
    level: E2
    status: established
    sources:
    - k6-tsuwano-town-dai1syou
  - text: 江戸時代には元和3年（1617年）に亀井氏が入城し、山あいの盆地に城下町が整備された。津和野は森鷗外・西周らを輩出し、「山陰の小京都」と呼ばれる
    kind: fact
    level: E2
    status: established
    sources:
    - k6-tsuwano-town-dai1syou
  - text: 「津和野」という地名の語源については、町の計画資料・島根県の地名鑑・日本歴史地名大系のいずれにおいても確定した説明を確認できず、現時点では語源未詳とする
    kind: fact
    level: E3
    status: indeterminate
    sources:
    - k6-tsuwano-kotobank
    - e-shimane-pref-chimeikan
  column:
    title: 京都から山口を経て、山あいの城下へ——鷺舞が運んだ都の文化
    text: 津和野の初夏を彩る鷺舞は、京都・祇園祭の舞楽が山口へ伝わり、さらに戦国時代の当主・吉見正頼の頃に津和野へ移されたものと町は伝える。都の祭りの芸能が二段階の伝播を経て、中国山地の小さな城下に根づいた。その町並みと文化の蓄積が「山陰の小京都」の呼び名を生み、近代には森鷗外や西周のような人材を送り出した。語源は謎のままでも、町の名が背負った文化の履歴ははっきりしている。
    sources:
    - k6-tsuwano-town-dai1syou
  relations:
  - pref/32
  unknowns:
  - 「津和野」の語源（津＋和野等の字面解釈を含む）は専門資料で確認できず未詳。和名類聚抄など古代の郡郷名との対応も未確認
  - 1470年より古い「津和野」の用例の有無は未確認
  - 1889年発足時の町域と中世の城下の範囲の正確な対応は未確認
  updated: '2026-11-13'
- id: muni/32-浜田市
  code: '322024'
  names:
    ja: 浜田市
    reading: はまだし
    aliases:
    - 浜田町
    - 浜田城下
  user_terms:
  - はまだ
  - 石見の城下町
  - 浜田城のまち
  naming_type: 一部の地名
  prefecture: 島根県
  homonyms: []
  summary: 市名は中世以来の地名「浜田」を継いだもの。「浜田」の現存最古の用例は嘉吉3年（1443年）ごろに書写された宝福寺の大般若経の奥書とされる。江戸時代には浜田藩の城下町として整備され、1940年に市制を施行、2005年に金城町・旭町・弥栄村・三隅町と合併して現在の市域となった。「浜田」の語源そのものは今回の資料では確定できなかった。
  first_attestation:
    era: 嘉吉3年
    year_western: 1443
    document: 宝福寺所蔵の大般若経の奥書
    note: 浜田市公式年表と『日本歴史地名大系』がともに「浜田」の地名が記される現存最古の史料とする（書写は嘉吉3年から文安元年の間とされる）。使用例の初出。
  claims:
  - text: 「浜田」の地名が記される現存最古の史料は、嘉吉3年（1443）から文安元年（1444）の間に書写されたとされる宝福寺の大般若経の奥書であると、浜田市の公式年表と『日本歴史地名大系』が述べている。
    kind: fact
    level: E3
    status: established
    sources:
    - q1-hamada-nenpyo
    - q1-hamada-jiten
  - text: 元和5年（1619）に古田氏が浜田に入って浜田藩が成立し、元和9年（1623）には浜田城と城下町がほぼ完成した。
    kind: fact
    level: E2
    status: established
    sources:
    - q1-hamada-nenpyo
  - text: 1940年（昭和15年）11月3日、浜田町・周布村・長浜村・石見村・美川村が合併して浜田市が発足した。
    kind: fact
    level: E2
    status: established
    sources:
    - q1-hamada-nenpyo
  - text: 1899年（明治32年）に浜田港が開港場に指定され、城下町から港町としての性格を強めていった。
    kind: fact
    level: E2
    status: established
    sources:
    - q1-hamada-nenpyo
  - text: 2005年（平成17年）10月1日、浜田市・金城町・旭町・弥栄村・三隅町の対等合併により新・浜田市が発足した。
    kind: fact
    level: E2
    status: established
    sources:
    - q1-hamada-nenpyo
  - text: 石見国の国府は現在の浜田市内に置かれていたとされ、近世の城下町「浜田」は、古代の国府の地とは重ならない海岸部を中心に形成された。
    kind: fact
    level: E2
    status: established
    sources:
    - q1-masuda-kyoiku
  column:
    title: 初出はお寺の経典の奥書だった
    text: 浜田の名が歴史に現れるのは、城でも役所の文書でもなく、お寺の経典の奥書である。1443年ごろ、宝福寺の大般若経を写した人が奥書に「浜田」と地名を記した。これが現存最古の用例と市の年表も専門辞典も認めている。それから約180年後、古田氏が入封して浜田城と城下町ができ、この中世の小さな地名が藩の名、市の名として生き続けることになる。荘園や郷の名として古代に遡る地名が多い中で、浜田は「室町の写経に残った名」という、やや遅いが確かな出発点を持つ地名である。
    sources:
    - q1-hamada-nenpyo
    - q1-hamada-jiten
  relations:
  - pref/32
  unknowns:
  - 「浜田」という地名の語源（浜辺の田を意味する普通名詞的な成立かどうか）は、今回参照した市公式・専門辞典の範囲では確定できなかった
  - 1443年以前の「浜田」の用例は確認できなかった
  updated: '2026-11-13'
- id: muni/32-益田市
  code: '322041'
  names:
    ja: 益田市
    reading: ますだし
    aliases:
    - 益田町
    - 益田郷
    - 益田荘
  user_terms:
  - ますだ
  - 中世のまち
  - 益田氏の本拠
  - グラントワのあるまち
  naming_type: 一部の地名
  prefecture: 島根県
  homonyms: []
  summary: 市名は、古代の益田郷にさかのぼる「益田」の名を継いだもの。『和名類聚抄』に美濃郡の益田郷が見え、「末須太（ますた）」と訓じられている。平安時代末期には益田荘が成立し、中世には地名を名字とする豪族・益田氏が本拠を置いて発展した。1952年に市制を施行し、2004年に美都町・匹見町を編入した。
  first_attestation:
    era: 平安時代（『和名類聚抄』成立の10世紀）
    year_western: null
    document: 『和名類聚抄』の美濃郡益田郷
    note: 『日本歴史地名大系』が益田の地名について「『和名抄』に益田郷がみえ、『末須太』と訓じている」と述べるもの。原文は未確認のため、主張は大系の紹介として記録する。
  claims:
  - text: 『日本歴史地名大系』は、益田の地名は『和名類聚抄』に益田郷がみえ「末須太（ますた）」と訓じられており、のちに真田・舛田とも記されたと説明する。
    kind: fact
    level: E3
    status: established
    sources:
    - q1-masuda-jiten
  - text: 『益田町史』は、益田一帯が良田の「真砂田（ますだ）」であったことからの音韻転訛を地名の由来とする説を述べていると『日本歴史地名大系』は紹介する。
    kind: fact
    level: E3
    status: contested
    sources:
    - q1-masuda-jiten
  - text: 平安時代末期には益田荘と長野荘が成立し、美濃郡内のほとんどの地域が荘園となった。
    kind: fact
    level: E2
    status: established
    sources:
    - q1-masuda-kyoiku
  - text: 中世には益田氏が本拠を置いて大きく発展し、南北朝時代に益田兼見が益田本郷を掌握して以降、益田氏は山陰の有力武士団となった。益田氏は慶長5年（1600年）の関ヶ原の戦いののち毛利氏に従って長門国須佐へ移った。
    kind: fact
    level: E2
    status: established
    sources:
    - q1-masuda-kyoiku
  - text: 1952年（昭和27年）に益田町と安田村・北仙道村・豊川村など7村が合併して市制を施行し、益田市が発足した。
    kind: fact
    level: E3
    status: established
    sources:
    - q1-masuda-jiten
  - text: 2004年（平成16年）11月1日に益田市・美都町・匹見町が合併して現在の益田市となった。
    kind: fact
    level: E2
    status: established
    sources:
    - q1-masuda-kyoiku
  column:
    title: 「ますだ」はもともと「ますた」だった
    text: 『和名類聚抄』の中で益田郷には「末須太」という訓が付けられている。つまり平安時代、この地は「ますた」と読まれていた。真田・舛田という表記も伝わり、『益田町史』は良田を意味する「真砂田」がなまった名だと説く。やがて中世に、この地名を名字とする益田氏が現れて本拠とし、七尾城と三宅御土居を中心に港町まで備えた中世都市が育った。市が「中世の歴史的景観を色濃く残す稀な町」と自らを評する背景には、古代の郷名→荘園→豪族の名字→市の名という、名前の受け継ぎの連鎖がある。
    sources:
    - q1-masuda-jiten
    - q1-masuda-kyoiku
  relations:
  - pref/32
  unknowns:
  - 益田氏がいつ・どのように地名を名字として名乗り始めたかの一次史料は確認できなかった
  - 「真砂田」説以外の語源説の有無は確認できなかった
  updated: '2026-11-13'
- id: muni/32-美郷町
  code: '324485'
  names:
    ja: 美郷町
    reading: みさとちょう
    aliases: []
  user_terms:
  - 美郷町の名前の由来
  - 島根の美郷町は江の川の町
  - 美郷町は秋田と島根と宮崎にある
  naming_type: 合併新設
  prefecture: 島根県
  homonyms:
  - muni/05-美郷町
  - muni/45-美郷町
  summary: 平成16年（2004年）10月1日に邑智町と大和村が合併して誕生した新名。町公式は、両町村を貫く江の川と中国山地の織りなす風景が「ふるさとの原風景」を思い起こさせることから、自然豊かな美しい故郷をいつまでも残したいという住民の願いと、「みさと」という響きの温もりを命名の理由に挙げる。秋田県・宮崎県の美郷町と願いは共通するが、根拠とする川と山はそれぞれの土地のものである。
  first_attestation:
    era: 平成16年
    year_western: 2004
    document: 美郷町の発足（2004年10月1日）
    note: 自治体としての発足をもって名称の初出とする。合併協議における選定過程の一次記録は未確認
  claims:
  - text: 平成16年（2004年）に邑智郡の邑智町と大和村が合併して美郷町が誕生した。町章も同じ平成16年10月に制定されている
    kind: fact
    level: E2
    status: established
    sources:
    - h4-shimane-misato-gaiyo
  - text: 町公式は町名の由来として、合併前の2町村を江の川が貫流し、その両岸に中国山地が織りなす四季折々の豊かな自然と美しい街並みが広がる様子が、日本の古き良きふるさとの原風景を思い起こさせることを挙げる
    kind: fact
    level: E2
    status: established
    sources:
    - h4-shimane-misato-gaiyo
  - text: 「美郷（みさと）」には、この自然豊かな美しい故郷（ふるさと）をいつまでも残しておきたいという住民の願いが込められており、「みさと」という響きが持つ温もりも、人情豊かなこの地域をよく表すものとして新町の名称に決定された理由とされる
    kind: fact
    level: E2
    status: established
    sources:
    - h4-shimane-misato-gaiyo
  - text: 【共通する層】秋田県・宮崎県の美郷町も平成の大合併の新名で、「美しい故郷でありたい」という願いを込めた命名という点は共通する
    kind: fact
    level: E2
    status: established
    sources:
    - h4-akita-gappei-kiroku
    - h4-shimane-misato-gaiyo
  - text: 【異なる層】島根の公式説明は江の川と中国山地という固有の風景に根ざし、「みさと」の音の温もりまで理由に含める点に特徴がある。秋田のような公募・投票による選定の記録は、公表資料では確認できない
    kind: fact
    level: E2
    status: established
    sources:
    - h4-shimane-misato-gaiyo
    - h4-akita-gappei-kiroku
  column:
    title: 響きまで理由に入った名前
    text: 島根の美郷町の公式説明が面白いのは、意味だけでなく「みさと」という響きの温もりまで命名理由に数えていることだ。江の川の両岸に広がる原風景を「いつまでも残したい」という願いと、音の柔らかさ。平成の大合併では各地で新しい町名が作られたが、ここまで音の印象を表に出して説明する例は珍しい。
    sources:
    - h4-shimane-misato-gaiyo
  relations:
  - pref/32
  - muni/05-美郷町
  - muni/45-美郷町
  unknowns:
  - 合併協議会での名称選定過程（公募の有無・対抗候補など）の公表資料は未確認
  - 旧邑智町・大和村それぞれの地名の由来は本バッチの対象外で未確認
  updated: '2026-11-13'
- id: muni/32-雲南市
  code: '322091'
  names:
    ja: 雲南市
    reading: うんなんし
    aliases: []
  user_terms:
  - うんなん
  - 雲南三郡
  - 神話のふるさと
  naming_type: 合併新設
  prefecture: 島根県
  homonyms: []
  summary: 2004年（平成16年）11月1日に大原郡・飯石郡の6町村が合併して生まれた市で、市名は新しく選ばれた。「雲南」は旧国名「出雲」の南に位置する地方を指す呼び名で、明治以降に旧大原郡・飯石郡・仁多郡を「雲南三郡」と呼ぶなど、この地方の広域名として定着していた。市名は全国公募2,939点から「雲南市」と「南雲市（なぐもし）」の2候補に絞られ、最終的に雲南市に決定した。市役所は旧木次町に置かれている。
  first_attestation:
    era: 平成16年
    year_western: 2004
    document: 雲南市の発足（合併協議会の決定と合併告示）
    note: 市名「雲南市」の初出は命名そのもの。ただし広域名「雲南」自体は、市公式の説明では明治以降に使われてきた呼び名とされる。
  claims:
  - text: 雲南市は、大東町・加茂町・木次町・三刀屋町・吉田村・掛合町の6町村が合併して平成16年（2004年）11月1日に誕生した。
    kind: fact
    level: E2
    status: established
    sources:
    - q1-unnan-city
  - text: 新市の名称は合併協議会が全国公募を行い、2,939点の応募の中から「雲南市」と「南雲市」の2つに候補が絞り込まれ、最終的に「雲南市」に決定した。
    kind: fact
    level: E2
    status: established
    sources:
    - q1-unnan-city
  - text: 「雲南」という名称は、旧国名「出雲」の南に位置する地方の意味として明治以降に使われ、合併前の旧大原郡・飯石郡・仁多郡を合わせて「雲南三郡」と呼ぶなど、この地方を表す呼び名として定着していたと市は説明する。
    kind: fact
    level: E2
    status: established
    sources:
    - q1-unnan-city
  - text: 雲南市が誕生する前から、市域には公立雲南総合病院や雲南消防本部など「雲南」の名を用いる機関が多く、地域別天気予報でも「雲南地方」が使われていた。
    kind: fact
    level: E2
    status: established
    sources:
    - q1-unnan-city
  - text: 公募の上位には雲南・奥出雲・南出雲・さくら・斐伊川などが並び、最終候補は「雲南（うんなん）」と「南雲（なぐも）」の2案であった。
    kind: fact
    level: E5
    status: established
    sources:
    - q1-unnan-uub
  - text: 市役所は旧木次町の区域（木次町里方）に置かれており、市名は旧中心町の名ではなく広域の地方名から選ばれた。
    kind: fact
    level: E2
    status: established
    sources:
    - q1-unnan-city
  column:
    title: 中国の雲南省ではない、「出雲の南」の雲南
    text: 日本で「雲南」と聞くと中国の雲南省を思い浮かべる人が多いが、島根県雲南市の「雲南」は「出雲の南」という純然たる国内の方角地名である。明治以降、出雲国の南部にあたる大原・飯石・仁多の三郡は「雲南三郡」と呼ばれ、病院も消防も天気予報の地域区分も「雲南」を名乗ってきた。だから2004年の合併で新市名を公募したとき、「雲南」は新造の名前でありながら住民には最もなじみのある名前だった。最終候補に残った「南雲（なぐも）」との一騎打ちを制した経緯は、公募の記録が伝えている。合併新市名の多くが泡沫候補に終わる中で、雲南は「もともと生活の中で使われていた広域名」を正式名称に格上げした成功例である。
    sources:
    - q1-unnan-city
    - q1-unnan-uub
  relations:
  - pref/32
  - muni/32-出雲市
  unknowns:
  - 旧中心地の一つである木次（きすき）の地名の由来は、今回の調査では公的資料で確認できなかった
  - 「南雲市」との最終決定がどのような手続き（投票等）で行われたかは、市公式ページの記述からは読み取れなかった
  updated: '2026-11-13'
