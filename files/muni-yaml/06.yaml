  prefecture: 山形県
  homonyms: []
  summary: 西村山郡西部、寒河江川の上流から中流の流域に位置し、北に月山、西に朝日連峰を望む豪雪の山間の町。1954年（昭和29年）10月1日に西山村・川土居村・本道寺村・大井沢村の4村が合併して発足した。町名「西川」は川の名ではなく、西山村と川土居村が共同で設置した「西川中学校組合」の名称に由来することを町公式資料が明記しており、学校組合の名が町名になった珍しい命名経路をもつ。町域には出羽三山への登拝路・六十里越が通り、1990年完成の寒河江ダムの湖は月山湖と呼ばれる。
  first_attestation:
    era: 昭和29年
    year_western: 1954
    document: 町村合併による西川町の発足
    note: 町名としての初出。由来となった西川中学校組合の設置年は確認できていない（戦後の新学制に伴う町村組合立中学校とみられる）
  claims:
  - text: 1954年（昭和29年）10月1日、西山村・川土居村・本道寺村・大井沢村の4村が合併して西川町が発足した
    kind: fact
    level: E2
    status: established
    sources:
    - z12-nishikawa-town-gaiyo
  - text: 町公式資料は町名の由来について、西山村と川土居村の両村が設置した「西川中学校組合」の名称に由来すると明記する
    kind: fact
    level: E2
    status: established
    sources:
    - z12-nishikawa-town-gaiyo
  - text: 組合名「西川」は西山村の「西」と川土居村の「川」を取った合成名とみられるが、その命名経緯を直接記した資料は確認できていない
    kind: fact
    level: H
    status: inferred
    sources:
    - z12-nishikawa-town-gaiyo
  - text: 町域は寒河江川の上流から中流域を占め、寒河江川が町の中央を貫流する
    kind: fact
    level: E3
    status: established
    sources:
    - z12-nishikawa-kotobank
  - text: 北に月山（出羽三山の主峰）、西に朝日連峰があり、町域は豪雪地帯である
    kind: fact
    level: E3
    status: established
    sources:
    - z12-nishikawa-kotobank
  - text: 寒河江川沿いの六十里越は出羽三山への登拝路で、本道寺・志津は宿場・宗教集落として栄え、大井沢・本道寺・岩根沢が登拝口となった
    kind: fact
    level: E3
    status: established
    sources:
    - z12-nishikawa-kotobank
  - text: 1990年（平成2年）に寒河江ダムが完成し、そのダム湖は月山湖と名付けられた
    kind: fact
    level: E3
    status: established
    sources:
    - z12-nishikawa-kotobank
  - text: 西川町の地方公共団体コードは063223である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 中学校の名前が町の名前になった
    text: 合併で生まれる新町名は、たいてい旧村名の合成か、川・山・郷といった土地の名から取られる。西川町は違う。町の公式資料は、町名の由来を「西山村と川土居村の両村が設置した『西川中学校組合』の名称に由来」とはっきり書く。戦後の新制中学校は町村の組合で運営される例が多く、合併より先に二つの村の子どもたちが通っていた学校の名前が、やがて四つの村の新しい町の名前になった。役所の名前より先に、暮らしの中の名前があったということだろう。
    sources:
    - z12-nishikawa-town-gaiyo
  relations:
  - pref/06
  unknowns:
  - 西川中学校組合の設置年と、組合名「西川」の命名経緯（両村名の合成であることの直接の典拠）は確認できていない
  - 1954年の合併の際に他の町名案が検討されたかどうかは確認できていない
  updated: '2026-11-13'
- id: muni/06-遊佐町
  code: '064611'
  names:
    ja: 遊佐町
    reading: ゆざまち
    aliases:
    - 遊佐
    - 遊佐駅（『延喜式』の駅名）
    - 遊佐郷
    - 遊佐荘
  user_terms:
  - 遊佐
  - ゆざ
  - 鳥海山の湧水の町
  - 胴腹滝
  - 丸池様
  - 水の郷
  naming_type: 旧行政区画名の継承
  naming_note: 平安時代の駅名・郷名「遊佐」の継承
  formation: 合併新設
  prefecture: 山形県
  homonyms: []
  summary: 飽海郡唯一の町で、県の最北部に位置し日本海に面する。北東に鳥海山（標高2,236メートル）をいただき、その伏流水による湧水に恵まれて国土交通省の「水の郷百選」に選ばれている。地名「遊佐」は延長5年（927年）成立の『延喜式』に駅名として見え、『和名類聚抄』にも遊佐郷が載る、千年以上にわたって文字も読みも変わっていない珍しい地名である。1889年（明治22年）に遊佐村が発足し、1941年（昭和16年）に町制を施行、1954年（昭和29年）8月1日に稲川村など5村と合併して現在の町となった。
  first_attestation:
    era: 延長5年
    year_western: 927
    document: 『延喜式』巻28・兵部省（出羽国駅馬に「遊佐 十疋」とある）
    note: 駅名としての初出。承平7年（937年）頃の『和名類聚抄』にも「遊佐郷」が見える
  claims:
  - text: 『延喜式』兵部省にみえる遊佐駅は、飽海駅（現酒田市平田地区に比定）と蚶方駅（現にかほ市象潟に比定）の間にあり、現在の大楯に比定されている
    kind: fact
    level: E3
    status: established
    sources:
    - z12-yuza-kotobank
  - text: 遊佐の地名が歴史に登場するのは延長5年（927年）の『延喜式』にある「遊佐 十疋」の記述で、『和名類聚抄』にも「遊佐郷」とあり、千年以上前から文字も音もそのまま伝えられている珍しい例とされる
    kind: fact
    level: E5
    status: established
    sources:
    - z12-yuza-wiki
  - text: 「ゆざ」の語源に定説はなく、『荘内地名辞典』は「揺（ゆさ）」すなわち鳥海山の火山活動によって揺れた土地とする説と、「いさ（砂）」で砂地とする説などを紹介する
    kind: fact
    level: E4
    status: contested
    sources:
    - z12-yuza-shonai-jiten
  - text: 中世には遊佐荘があり、豪族である遊佐氏の根拠地となった
    kind: fact
    level: E3
    status: established
    sources:
    - z12-yuza-kotobank-nipponica
  - text: 1889年（明治22年）4月1日の町村制施行により、遊佐町村・白井新田村・野沢村・吉出村・小田原村（一部）が合併して遊佐村が発足した
    kind: fact
    level: E5
    status: established
    sources:
    - z12-yuza-wiki
  - text: 1941年（昭和16年）4月1日に遊佐村が町制を施行して遊佐町となり、1954年（昭和29年）8月1日に遊佐町・稲川村・西遊佐村・蕨岡村・高瀬村・吹浦村の1町5村が合併して新たな遊佐町が誕生した
    kind: fact
    level: E2
    status: established
    sources:
    - z12-yuza-town-keikaku
    - z12-yuza-kotobank-nipponica
  - text: 町内には鳥海山の伏流水による湧水や自噴井戸が多く、1996年（平成8年）に国土交通省の「水の郷百選」に認定された
    kind: fact
    level: E5
    status: established
    sources:
    - z12-yuza-wiki
  - text: 鳥海山を神体とする大物忌神と月山神は国家鎮護の神々として朝廷の保護を受け、『三代実録』元慶4年（880年）には両神とも従二位に叙されたとある（日本歴史地名大系が紹介）
    kind: fact
    level: E3
    status: established
    sources:
    - z12-yuza-kotobank
  - text: 遊佐町の地方公共団体コードは064611である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 千年変わらない名前
    text: 『延喜式』の駅名「遊佐」は、千年あまりを経ても、文字も読みもそのままで現在の町名になっている。『和名類聚抄』の遊佐郷、中世の遊佐荘を経て、明治の遊佐村、昭和の遊佐町へと受け継がれてきた。一方で、その意味のほうは霧の中である。『荘内地名辞典』は「揺（ゆさ）」つまり鳥海山の噴火に揺れた土地とする説や、砂地に由来する説を挙げるが、どれも決め手に欠ける。日本最古級の地名の一つでありながら、由来は未解決――その落差もまた、この町の個性である。
    sources:
    - z12-yuza-wiki
    - z12-yuza-shonai-jiten
  relations:
  - pref/06
  unknowns:
  - 「ゆざ」の語源の定説はなく、揺（ゆさ）説・砂（いさ）説はいずれも裏付けを欠く
  - 『延喜式』の遊佐駅の大楯への比定は日本歴史地名大系の比定によるもので、発掘による確定ではない
  updated: '2026-11-13'
- id: muni/06-酒田市
  code: 062049
  names:
    ja: 酒田市
    reading: さかたし
    aliases:
    - 坂田
    - 酒田町
    - 酒田湊
  user_terms:
  - 酒田の名前の由来
  - 酒田はもともと何と読んだのか
  - 三十六人衆と酒田の始まり
  naming_type: その他
  naming_note: 「さかた」への当て字。元の意味は未確定
  formation: 合併新設
  prefecture: 山形県
  homonyms: []
  summary: 「酒田」は、最上川河口の地形に付けられた「さかた」という名に後から当てられた当て字で、その地形が消滅したため「さかた」の元の意味は分からなくなっていると『荘内地名辞典』は述べる。「さ潟」と解する説は候補の一つだが決着していない。中世末に最上川南岸の袖の浦から北岸の砂潟の地へ町が移り、港町として発展。昭和8年（1933年）に市制を施行し、平成17年（2005年）に八幡町・松山町・平田町と合併した。
  first_attestation:
    era: 室町時代初期
    year_western: null
    document: 『義経記』
    note: 「酒田の湊」の表記が見えることを土木学会誌の酒田特集が紹介する。『義経記』の成立年代には幅があるため年は特定しない。
  claims:
  - text: 大沼浩『荘内地名辞典』は「さかた」を「酒田と当て字の地名」とし、最上川河口にあった一つの地形に名付けられたもので、名付けは出羽国が置かれた8世紀以降であろうが、その地形は後に消滅し、「さかた」の意味は不明となったと述べる。
    kind: fact
    level: E4
    status: indeterminate
    sources:
    - l1-sakata-jiten
  - text: 同辞典は、「さかた」を「さ潟」と解することが考えられるものの、潟が潟湖かどうかは分からず、「さ」に砂・沙・狭を当てる解釈や、「さ」は何の意味もない発語とする説もあって、選択することは難しいとする。
    kind: fact
    level: E4
    status: contested
    sources:
    - l1-sakata-jiten
  - text: 酒田商工会議所の観光ガイドは、町の移転先となった最上川北岸の地が「砂潟」と呼ばれる砂原地であったと述べる。
    kind: fact
    level: E4
    status: established
    sources:
    - l1-sakata-cci-honmachi
  - text: 土木学会誌の酒田特集は、室町時代初期に成立した『義経記』に「酒田の湊」と見えること、また『吾妻鏡』に坂田三郎の名が見えることを紹介する。
    kind: fact
    level: E3
    status: established
    sources:
    - l1-sakata-jcca
  - text: 酒田市公式の略年表によれば、明応元年（1492年）に宮野浦から現酒田への移転が始まり、大永元年（1521年）に三十六人衆が本町でまちづくりを始め、寛文12年（1672年）に河村瑞賢が西廻り航路を整備し、明治2年（1869年）に酒田県が置かれた。
    kind: fact
    level: E2
    status: established
    sources:
    - l1-sakata-nenpyo
  - text: 酒田発祥の伝説として、文治5年（1189年）の奥州藤原氏滅亡の際、藤原秀衡の後室または妹とされる徳尼公が36人の遺臣に守られて最上川南岸の袖の浦（宮野浦、「向う酒田」）に落ち延びたのが酒田の始まりと伝わる。遺臣たちは「三十六人衆」と呼ばれ、のちに町の礎を築いたとされる。
    kind: legend
    level: E4
    status: established
    sources:
    - l1-sakata-cci-guide
  - text: 旧酒田市は昭和8年（1933年）に市制を施行し、平成17年（2005年）11月1日に八幡町・松山町・平田町と合併して新しい酒田市となった。
    kind: fact
    level: E3
    status: established
    sources:
    - l1-sakata-kotobank
  - text: 総務省「地方公共団体コード一覧」では、酒田市のコードは062049とされる。
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 意味の消えた名前
    text: 酒田の「さかた」は、名前が指していた地形そのものが消えてしまったために、意味が分からなくなった地名である。『荘内地名辞典』は、河口の地形に付けられた名が残り、酒の字が当てられただけだと率直に書く。「砂潟」の砂原に町が移った記憶は残るが、それがそのまま語源かどうかは辞典も断定しない。意味は失われても、名は『義経記』の「酒田の湊」以来、港町とともに800年近く生き続けてきた。
    sources:
    - l1-sakata-jiten
    - l1-sakata-cci-honmachi
  relations:
  - pref/06
  unknowns:
  - 「さかた」の原義は地名辞典の段階でも未確定であり、も決着しなかった。
  - 『義経記』原文における「酒田の湊」の箇所の直接確認は未実施。
  - 2005年の合併協定書における市名決定の条項（「新市の名称は、酒田市とする」）の原文確認は未実施。
  updated: '2026-11-13'
- id: muni/06-金山町
  code: '063614'
  names:
    ja: 金山町
    reading: かねやままち
    aliases:
    - 金山村
  user_terms:
  - 金山町の名前の由来
  - 山形の金山町は宿場町だった
  - 金山町は山形と福島にある
  naming_type: 中心地名の継承
  formation: 単独発足
  prefecture: 山形県
  homonyms:
  - muni/07-金山町
  summary: 明治22年（1889年）に成立した金山村が大正14年（1925年）1月に町制を施行して以来、合併を経験していない町。中心集落の金山は近世、金山内町・金山七日町・金山十日町の「金山三ヵ村」で羽州街道の宿場町「金山町」を形成していた。地名の由来についてブリタニカ国際大百科事典は「金銀の鉱山が多かったことに由来するといわれる」と伝えるが、断定できる資料は確認できていない。中世以来の広域名「金山谷」を背景に持つ福島県の金山町とは成り立ちが異なる。
  first_attestation:
    era: 明治22年
    year_western: 1889
    document: 金山村の成立（町村制施行）
    note: 自治体名としての初出。集落名としての「金山」は近世の郷帳類に「金山三ヵ村」として見えるが、用例の年次の特定は未確認
  claims:
  - text: 金山町は大正14年（1925年）1月に町制を施行した。町公式年表はこの町制施行を起点に現在まで続いており、明治22年（1889年）の金山村成立以来、合併による自治体の再編は行われていない
    kind: fact
    level: E2
    status: established
    sources:
    - h4-yamagata-kaneyama-ayumi
  - text: 日本歴史地名大系によれば、近世には金山内町・金山七日町・金山十日町の3村が「金山三ヵ村」と通称され、羽州街道の宿場町を形成して「金山町」と呼ばれ、金山郷の交通・商業の中心地だった
    kind: fact
    level: E3
    status: established
    sources:
    - h4-kotobank-kaneyama
  - text: ブリタニカ国際大百科事典小項目事典は「地名は金銀の鉱山が多かったことに由来するといわれる」とし、町の西部に谷口銀山の名残りがあることを併記する。ただし由来そのものは「といわれる」の形で伝えられるにとどまり、断定する資料は確認できていない
    kind: fact
    level: E3
    status: indeterminate
    sources:
    - h4-kotobank-kaneyama
  - text: 【異なる層】福島県金山町の「金山」は中世以来の広域地域名「金山谷」に由来する層が濃いのに対し、山形県金山町の「金山」は宿場町として栄えた中心集落の名がそのまま自治体名になったもので、同名でも成り立ちが異なる
    kind: fact
    level: E3
    status: established
    sources:
    - h4-kotobank-kaneyamadani
    - h4-kotobank-kaneyama
  - text: 【共通する層】両町の名の核は近世以前からの地域の呼称にさかのぼり、昭和の大合併で新しく作られた名ではない点は共通する
    kind: fact
    level: E3
    status: established
    sources:
    - h4-kotobank-kaneyama
    - h4-fukushima-kaneyama-profile
  column:
    title: 宿場町の名前がそのまま残った町
    text: 江戸時代、金山の集落は内町・七日町・十日町という3つの町からなる宿場町で、市場が立つ商業の中心だった。1889年に村になり、1925年に町になってからも名前は変わらず、昭和・平成の合併の波もこの町は単独で越えた。自治体の名前が江戸時代の宿場町の呼び名と地続きなのは、全国でもそう多くない。
    sources:
    - h4-kotobank-kaneyama
    - h4-yamagata-kaneyama-ayumi
  relations:
  - pref/06
  - muni/07-金山町
  unknowns:
  - 「金銀の鉱山が多かった」ことを示す具体的な鉱山の記録（谷口銀山の操業実態を含む一次資料）は未確認
  - 1889年の金山村成立当時の構成村の確認は未実施
  updated: '2026-11-13'
- id: muni/06-長井市
  code: 062090
  names:
    ja: 長井市
    reading: ながいし
    aliases:
    - 長井町
    - 長井荘
  user_terms:
  - ながい
  - 水と緑と花のながい
  - 山の港町
  - 黒獅子の里
  naming_type: 中心地名の継承
  formation: 合併新設
  prefecture: 山形県
  homonyms: []
  summary: 山形県南西部、長井盆地に位置し、最上川・置賜白川・置賜野川の3河川が合流する「水の集まる所」の市。地名は平安時代の郷名「長井」に遡り、鎌倉時代には置賜一円を指す「長井荘（長井の庄）」の名に広がった。江戸時代には最上川舟運の集積地「山の港町」として栄え、1954年に1町5村の合併で市制を施行した。
  first_attestation:
    era: 平安時代中期
    year_western: null
    document: 『和名類聚抄』地名部（置賜郡の郷名「長井」）
    note: 市の文化財計画が『和名類聚抄』の記載として紹介するもの。原文は未読のため、紹介した公的資料の形で記録し、西暦年は特定しない。
  claims:
  - text: 平安時代中期に編纂された『和名類聚抄』地名部の置賜郡に「長井」という郷名が見えることを、長井市の文化財保存活用地域計画が紹介している
    kind: fact
    level: E2
    status: established
    sources:
    - w1-nagai-city-bunkazai
  - text: 愛知県の西光寺の地蔵菩薩像から発見された胎内印仏の銘に「長井荘」とあることから、遅くとも鎌倉時代初期にはこの地が長井と呼ばれていたと市の文化財計画が述べている
    kind: fact
    level: E2
    status: established
    sources:
    - w1-nagai-city-bunkazai
  - text: 長井市公式は地名の由来を「長井の『井』は水の集まる所」と説明し、朝日山系を源とする置賜野川、飯豊山系を源とする置賜白川、市の南北を貫流する最上川の3河川がまちを囲むように流れる地形と結びつけている
    kind: fact
    level: E2
    status: established
    sources:
    - w1-nagai-city-rekishi
    - w1-nagai-city-bunkazai
  - text: 文治5年（1189年）に鎌倉幕府の御家人・大江時広が地頭となり、置賜一円は「長井の庄」と改められ、時広はその名を冠して長井時広と名乗ったことを市公式の沿革が記している
    kind: fact
    level: E2
    status: established
    sources:
    - w1-nagai-city-rekishi
  - text: 元禄7年（1694年）に西村久左衛門によって最上川の舟運が開かれると、長井は米沢藩の物資運搬の集積地となり、絹織物などを扱う豪商が現れる「山の港町」として栄えた
    kind: fact
    level: E2
    status: established
    sources:
    - w1-nagai-city-rekishi
  - text: 昭和29年（1954年）11月15日に長井町・長井村・西根村・平野村・豊田村・伊佐沢村の1町5村が合併して長井市が誕生した
    kind: fact
    level: E2
    status: established
    sources:
    - w1-nagai-city-aramashi
  - text: 千年ほど前、源頼義がこの地で戦勝を祝って軍士に獅子舞をさせたことが、市内の約40の神社に伝わる黒獅子舞の始まりであると伝えられている
    kind: legend
    level: E2
    status: indeterminate
    sources:
    - w1-nagai-city-rekishi
  - text: 総務省の全国地方公共団体コードで、長井市の団体コードは062090と定められている
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 「水の集まる所」が藩の玄関口になった
    text: 長井の「井」は水の集まる所を意味すると市は説明する。朝日山系の野川、飯豊山系の白川、そして最上川。三つの川が集まる地形は、ときに水害の地でもあったが、元禄7年（1694年）に最上川の舟運が開かれると一転して強みになった。米沢藩の米や特産品は長井の舟場に集められ、酒田を経て京都・大坂へ運ばれた。山あいの盆地の町が「山の港町」と呼ばれ、豪商の屋敷が建ち並んだ。地名が指す水の地形が、そのまま町の繁栄の条件になった例である。
    sources:
    - w1-nagai-city-rekishi
  relations:
  - pref/06
  unknowns:
  - 『和名類聚抄』の「長井」郷の訓や位置比定など、原文レベルでの確認は未実施
  - 「長井」の語源について専門辞典（『角川日本地名大辞典』等）の検討は未確認で、市公式の「水の集まる所」説以外の説の存否は今後の課題
  updated: '2026-11-13'
- id: muni/06-飯豊町
  code: '064033'
  names:
    ja: 飯豊町
    reading: いいでまち
    aliases:
    - 飯豊
    - 飯豊村（1954〜1958年）
    - いいとよ（会津地方での山名の呼び方）
  user_terms:
  - 飯豊
  - いいで
  - 飯豊連峰の町
  - 日本で最も美しい村
  - 白川ダム
  - 中津川
  naming_type: 自然地名から
  naming_note: 1954年の3村合併で新設された名。町域南部の飯豊連峰・飯豊山の山名にちなむとみられるが、選定経緯の公式記録は未確認
  formation: 編入合併
  prefecture: 山形県
  homonyms: []
  summary: 西置賜郡南部、白川の流域を占める山間の町で、南に飯豊連峰の山々が連なる。1954年（昭和29年）10月1日に豊原村・添川村・豊川村が合併して飯豊村が発足し、1958年（昭和33年）9月1日に中津川村を編入して町制を施行した。町名の元になった山名「いいで」の由来は、『陸奥国風土記』逸文に伝わる皇女・飯豊青皇女の伝承をはじめ諸説があり、定説はない。「日本で最も美しい村」連合に加盟する。
  first_attestation:
    era: 奈良時代
    year_western: null
    document: 『陸奥国風土記』逸文（山名「飯豊」の由来を説く伝承）
    note: 風土記本文は散逸し、後世の引用である逸文によってのみ伝わるため、記載の年代は厳密には特定できない。町名としての初出は1954年の飯豊村発足
  claims:
  - text: 1954年（昭和29年）10月1日、西置賜郡の豊原村・添川村・豊川村が合併して飯豊村が発足した
    kind: fact
    level: E2
    status: established
    sources:
    - upg-a-iide-kasokeikaku
    - z12-iide-wiki
  - text: 1958年（昭和33年）9月1日、飯豊村は南置賜郡中津川村を編入し、町制を施行して飯豊町となった
    kind: fact
    level: E3
    status: established
    sources:
    - z12-iide-kotobank
    - z12-iide-wiki
  - text: 合併前の3村のいずれの名でもない「飯豊」は新しく選ばれた名で、町域南部に連なる飯豊連峰（飯豊山）の山名にちなむものとみられる
    kind: fact
    level: H
    status: inferred
    sources:
    - z12-iide-kotobank
  - text: 『陸奥国風土記』逸文には、豊受比売神の神域であったこの山に、履中天皇の皇女・飯豊青皇女が物部氏を遣わして御幣を奉納したため、山を飯豊と呼ぶようになったという伝承が伝わる
    kind: legend
    level: E2
    status: established
    sources:
    - z12-iide-wiki-yama
  - text: 同じく風土記逸文には、垂仁天皇の時代に飢饉が起きたため山を「宇惠々山」と呼ぶようになり、後に豊田と改められ、さらに変化して飯豊と呼ぶようになったという伝承も伝わる
    kind: legend
    level: E2
    status: established
    sources:
    - z12-iide-wiki-yama
  - text: 山名「飯豊」の由来は確定しておらず、会津地方で「いいとよさん」とも呼ばれることと結びつけて雪化粧した山容が飯を豊かに盛った様子に見えるためとする説のほか、「いひとよ」（古代語でフクロウの意）が語源とする説、山麓の温泉から「湯出（ゆいで）」が変化したとする説がある
    kind: fact
    level: E5
    status: contested
    sources:
    - z12-iide-wiki-yama
  - text: 町域は飯豊山地に源を発する白川の流域を占め、上流の中津川地区は純山村、下流部は長井盆地に属する水稲単作地帯で、町域の一部は磐梯朝日国立公園に属する
    kind: fact
    level: E3
    status: established
    sources:
    - z12-iide-kotobank
  - text: 飯豊町の地方公共団体コードは064033である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: フクロウか、湯出か、皇女か
    text: 町名の元になった山の名前「いいで」は、読み方からして難読である。『陸奥国風土記』の逸文は、皇女・飯豊青皇女が豊受比売神に幣を奉じた故事と、飢饉の「宇惠々山」が豊田を経て飯豊に変わったという、二つの由来の伝承を伝える。後世の説も、雪山を飯盛りに見立てる説、古語「いひとよ（フクロウ）」説、温泉の「湯出（ゆいで）」の転訛説と分かれ、定説はない。会津側では今も「いいとよさん」と呼ぶという。伝承の層の厚さそのものが、この山の古さと信仰の深さを物語っている。
    sources:
    - z12-iide-wiki-yama
  relations:
  - pref/06
  unknowns:
  - 1954年の合併時に「飯豊」の名が選ばれた経緯を記した公式資料は確認できていない
  - 山名「いいで」の語源の定説はない
  updated: '2026-11-13'
- id: muni/06-高畠町
  code: 063819
  names:
    ja: 高畠町
    reading: たかはたちょう
    aliases:
    - 高畠
    - 高畑町（1895〜1905年の表記）
    - 社郷町（1954〜1955年の名称）
    - たかはたけ（中世の読み）
  user_terms:
  - 高畠
  - たかはた
  - まほろばの里
  - 高畠石
  - 浜田広介の里
  - 瓜割石庭公園
  naming_type: 中心地名の継承
  naming_note: 中世以来の地名「高畠」の継承。1895年に高畑町として発足し1905年に高畠町へ改称、1954年に社郷町となったが1955年に高畠町へ復した
  formation: 合併新設
  prefecture: 山形県
  homonyms: []
  summary: 東置賜郡東部、米沢盆地の東端に位置し、屋代川・和田川の扇状地に開けた町。地名「高畠」は中世から書かれてきた古い名で、当時は「タカハタケ」とも読まれた。1895年（明治28年）に高畑町として町制を施行し、1905年（明治38年）に高畠町へ改称。1954年（昭和29年）に4村と合併して社郷町となったが、1955年（昭和30年）に糠野目村を編入する際、高畠町へ戻った。黄色みのある凝灰岩の石材「高畠石」は、産地であるこの地名に由来する名である。
  first_attestation:
    era: 天文16年
    year_western: 1547
    document: 伊達晴宗の書状（「味方は高畠から新宿までを制圧」とある。日本歴史地名大系が高畑村の項で紹介）
    note: 中世の用例として確認できるもの。これより古い時代、この地は置賜郡屋代郷・屋代荘に含まれていたとみられる
  claims:
  - text: 高畠の地は屋代川の渓口部に位置し、古代には置賜郡屋代郷（『和名類聚抄』）に含まれていたとみられ、平安時代後期からは同郷が荘園化した屋代荘に属した
    kind: fact
    level: E3
    status: established
    sources:
    - z12-takahata-kotobank-vill
  - text: 中世から江戸中期までは「高畠」と記すことが多く、「タカハタケ」とも読まれた
    kind: fact
    level: E3
    status: established
    sources:
    - z12-takahata-kotobank-vill
  - text: 1895年（明治28年）に高畑町として町制を施行し、1905年（明治38年）に高畠町へ改称した
    kind: fact
    level: E3
    status: established
    sources:
    - z12-takahata-kotobank
  - text: 1954年（昭和29年）10月、高畠町・二井宿村・屋代村・亀岡村・和田村の1町4村が合併して社郷町が発足した
    kind: fact
    level: E2
    status: established
    sources:
    - z12-takahata-town-youran
  - text: 1955年（昭和30年）4月、社郷町は糠野目村を合併し、町名を「高畠町」と改称した
    kind: fact
    level: E2
    status: established
    sources:
    - z12-takahata-town-youran
  - text: 「たかはた」の語源を直接記した資料は確認できておらず、屋代川扇状地の開けた地形に対応する「高い畑」の地形地名とみる見方が自然だが、裏付ける典拠は得られていない
    kind: fact
    level: H
    status: indeterminate
    sources:
    - z12-takahata-kotobank-vill
  - text: 高畠石は高畠町一帯から採掘される凝灰岩の総称で、古墳時代の石室や民家の石塀などに広く使われてきた町の特産品であり、石材の名は産地の地名に由来する（地名が先で石材名が後）
    kind: fact
    level: E2
    status: established
    sources:
    - z12-takahata-town-uriwari
    - z12-takahata-maibun
  - text: 高畠石の採石場跡である瓜割石庭公園の名は、石切り場の清水に瓜を冷やしたところ瓜が割れたという言い伝えに由来すると町は紹介する
    kind: legend
    level: E2
    status: established
    sources:
    - z12-takahata-town-uriwari
  - text: 高畠町の地方公共団体コードは063819である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 消えた「社郷町」と、石に残った地名
    text: 1954年の合併で高畠町は一度消え、「社郷町」になった。ところが翌1955年、糠野目村を編入するのを機に、町名は高畠へ戻された。社郷の名は半年ほどで姿を消し、中世以来の「高畠」が残った。その地名は石の名にもなっている。町一帯で採れる凝灰岩「高畠石」は、古墳の石室から旧高畠駅舎（国の登録有形文化財）まで使われ続けてきた名産である。ただし順序は逆で、石が町に名を与えたのではなく、地名「高畠」が先にあって、産地名として石に付いたのである。
    sources:
    - z12-takahata-town-youran
    - z12-takahata-town-uriwari
    - z12-takahata-maibun
  relations:
  - pref/06
  unknowns:
  - 「たかはた（け）」の語源を直接記した資料は確認できていない
  - 1905年（明治38年）に「畑」から「畠」へ改称した理由を記した資料は確認できていない（中世以来「高畠」の表記が多かったことへの復帰とみられる）
  - 1954年の合併町名「社郷」の命名理由は確認できていない
  updated: '2026-11-13'
- id: muni/06-鮭川村
  code: '063665'
  names:
    ja: 鮭川村
    reading: さけがわむら
    aliases:
    - 鮭川
  user_terms:
  - 鮭川
  - さけがわ
  - 鮭の里
  - きのこ王国
  - トトロの木（小杉の大杉）
  naming_type: 自然地名から
  naming_note: 川名「鮭川」の継承
  formation: 合併新設
  prefecture: 山形県
  homonyms: []
  summary: 最上郡北西部、村の中央を川の名そのままの鮭川が貫流する農山村。村名の由来はこの鮭川によることを村公式資料が明言する。鮭川は最上川水系で流域面積が支流中最大の川で、川の名は鮭が多く遡上したことに由来すると考えられている。1889年（明治22年）に発足し、1954年（昭和29年）12月に豊里村・豊田村と合併して現在の村となった。
  first_attestation:
    era: 明治22年
    year_western: 1889
    document: 町村制施行による鮭川村の発足
    note: 自治体名としての初出。川名「鮭川」の文献初出は確認できていない
  claims:
  - text: 村名の由来は、本村の中央部を貫流する鮭川による（村の総合発展計画の沿革の明記）
    kind: fact
    level: E2
    status: established
    sources:
    - z12-sakegawa-vill-keikaku
  - text: 鮭川は真室川町の西部を南東流し、鮭川村の北端で真室川を合わせて南に向かい、戸沢村津谷で最上川の右岸に注ぐ流路延長約48キロの一級河川で、流域面積は最上川の支流中最大である
    kind: fact
    level: E3
    status: established
    sources:
    - z12-sakegawa-kotobank
  - text: 川名「鮭川」は、鮭が多く遡上したことに由来すると考えられ、『デジタル大辞泉』も「名の由来はサケが遡上することから」とする
    kind: fact
    level: E3
    status: established
    sources:
    - z12-sakegawa-kotobank
  - text: 鮭川の流域段丘上には縄文遺跡が数多く分布し、出土する石錘・石槍などは鮭漁に使用されたものと思われる
    kind: fact
    level: E3
    status: established
    sources:
    - z12-sakegawa-kotobank
  - text: 1889年（明治22年）4月1日の町村制施行により、川口村・佐渡村・向居村・中渡村の区域をもって鮭川村が発足した
    kind: fact
    level: E5
    status: established
    sources:
    - z12-sakegawa-wiki
  - text: 1954年（昭和29年）12月、鮭川村・豊里村・豊田村の3村の合併により、現在の鮭川村となった
    kind: fact
    level: E2
    status: established
    sources:
    - z12-sakegawa-vill-keikaku
  - text: 村の魚は「鮭」と定められ、今も秋になると多くの鮭が鮭川を遡上し、地元漁協は卵をふ化させて稚魚を放流する取り組みを行っている
    kind: fact
    level: E4
    status: established
    sources:
    - z12-sakegawa-wiki
  - text: 鮭川村の地方公共団体コードは063665である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 鮭の帰ってくる村
    text: 村の名は川の名、川の名は魚の名である。鮭川の流域段丘には縄文遺跡が数多く分布し、出土する石錘や石槍は鮭漁に使われたものと思われるというから、人は大昔からこの川の鮭とともに暮らしてきたらしい。村内には「鮭石」という史跡があり、郷土料理には「鮭の新切り」がある。村の魚はもちろん「鮭」。秋に遡上する鮭を絶やさないよう、漁協はふ化と放流を続けている。地名・食・祭り・生業までが一匹の魚でつながっている村である。
    sources:
    - z12-sakegawa-kotobank
    - z12-sakegawa-wiki
  relations:
  - pref/06
  - muni/06-真室川町
  - muni/06-戸沢村
  unknowns:
  - 川名「鮭川」の文献上の初出は確認できていない
  - 1889年の村の成立時の構成村は、Wikipediaの記述に基づき村公式資料では裏付けが取れなかった
  updated: '2026-11-13'
- id: muni/06-鶴岡市
  code: '062031'
  names:
    ja: 鶴岡市
    reading: つるおかし
    aliases:
    - 鶴ヶ岡
    - 大宝寺
    - 鶴岡町
  user_terms:
  - 鶴岡の名前の由来
  - 鶴ヶ岡城とは何か
  - 鶴岡と海亀の関係
  - 鶴岡は誰が名付けたか
  naming_type: 藩名・城名から
  formation: 単独発足
  prefecture: 山形県
  homonyms: []
  summary: 「鶴岡」は、慶長8年（1603年）に最上義光が居城・大宝寺城を「鶴ヶ岡城」と改名したときに生まれた地名だと鶴岡市公式は明記する。酒田浜に大きな海亀が上がったことを吉兆として、亀ヶ崎城など3城を同時に改名したうちの一つという。後に庄内藩主となった酒井忠勝は名付け主ではなく、鶴ヶ岡を居城として城下を整えた側である。
  first_attestation:
    era: 慶長8年
    year_western: 1603
    document: 最上義光による大宝寺城の「鶴ヶ岡城」への改名（鶴岡市公式の概要・沿革）
    note: 「鶴岡」の地名の成立時点として市公式が示すもの。改名の動機（海亀の上陸）は市の計画書が「といわれる」と伝える伝承的な説明を含む。
  claims:
  - text: 鶴岡市公式「鶴岡市の概要（令和7年度）」によれば、「鶴岡」という地名は、慶長8年（1603年）に最上義光が大宝寺城を「鶴ヶ岡城」と改名したときにできたものである。
    kind: fact
    level: E2
    status: established
    sources:
    - k2-tsuruoka-city-gaiyo
    - k2-tsuruoka-city-enkaku
  - text: 鶴岡市の歴史的風致維持向上計画によれば、義光は慶長8年（1603年）、酒田浜に巨大な海亀が上がったことをめでたいことの前兆として、東禅寺城を亀ヶ崎城、大宝寺城を鶴ヶ岡城、尾浦城を大山城と改名したといわれる。長寿の象徴である鶴と亀を対にした、瑞祥を願う同時改名だったことがうかがえる。
    kind: fact
    level: E2
    status: established
    sources:
    - k2-tsuruoka-fuchi
  - text: 「鶴ヶ岡」の名付け主は酒井氏ではない。江戸時代に入った元和8年（1622年）に最上氏が領地を没収されると、譜代大名の酒井忠勝が庄内藩主として入部し、既に鶴ヶ岡と名付いていた城を居城として新たに城を築き、城下町を整備して現在の鶴岡の基礎を築いた。
    kind: fact
    level: E2
    status: established
    sources:
    - k2-tsuruoka-city-gaiyo
    - k2-tsuruoka-city-enkaku
  - text: 鶴ヶ岡城の前身である大宝寺は、平安時代末期には出羽国田川郡の大泉荘の中心地であり、鎌倉時代以降は武藤（大宝寺）氏の拠点として栄えた地である。「大宝寺」の名は現在も鶴岡市内の地名として残る。
    kind: fact
    level: E2
    status: established
    sources:
    - k2-tsuruoka-city-gaiyo
  - text: 大正13年（1924年）10月1日、鶴岡町が市制を施行して鶴岡市となった。
    kind: fact
    level: E4
    status: established
    sources:
    - k2-uub-tsuruoka
  - text: 平成17年（2005年）10月1日、鶴岡市・藤島町・羽黒町・櫛引町・朝日村・温海町の1市4町1村が合併して新・鶴岡市が発足し、面積は東北地方で最も広い市となった。
    kind: fact
    level: E2
    status: established
    sources:
    - k2-tsuruoka-city-enkaku
  - text: 総務省「地方公共団体コード一覧」では、鶴岡市のコードは062031とされる（当初想定された062026ではなく062031であることを一覧で確認した）。
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 海亀が運んできた「鶴」の字
    text: 鶴岡に鶴が群れていたから鶴岡なのではない。1603年、庄内の浜に巨大な海亀が上がった。領主の最上義光はこれを吉兆と受け取り、領内の3つの城をいっせいに改名した。酒田の城は亀そのものの「亀ヶ崎城」、尾浦の城は「大山城」、そして大宝寺の城には亀と対になる長寿の瑞獣「鶴」を充てて「鶴ヶ岡城」とした。つまり鶴岡の鶴は、実在の鳥ではなく、海亀への返礼として選ばれた縁起の文字である。亀の相方として呼ばれた鶴の名が、城が消えた後も400年以上、庄内の中心都市の名前として残った。
    sources:
    - k2-tsuruoka-city-gaiyo
    - k2-tsuruoka-fuchi
  relations:
  - pref/06
  unknowns:
  - 海亀の上陸を吉兆としたという改名の動機は、市の計画書が「といわれる」と記す伝承的な説明であり、当時の一次史料での確認は未了。
  - 庄内藩の石高について市の資料間で表記が異なる（概要は13万8千石、沿革は14万石）ため、本レコードでは石高の数値を使っていない。
  updated: '2026-11-13'
