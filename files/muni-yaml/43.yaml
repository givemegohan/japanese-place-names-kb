- id: muni/43-苓北町
  code: '435317'
  names:
    ja: 苓北町
    reading: れいほくまち
    aliases: []
  user_terms:
  - 苓北
  - れいほく
  - 天草の苓北町
  - 富岡
  - 苓北火力発電所のある町
  naming_type: 新規命名
  prefecture: 熊本県
  homonyms: []
  summary: 天草郡の町で、天草下島の北西端に位置する。1955年に富岡町・坂瀬川村・志岐村が合併して発足し、町名は住民公募をもとに、天草の別名「苓州」の西北部に位置することから「苓北」と名付けられた。江戸時代には富岡に代官所が置かれ、天草の中心地だった。
  first_attestation:
    era: 昭和30年
    year_western: 1955
    document: 苓北町の発足（富岡町・坂瀬川村・志岐村の合併）
    note: 町名としての初出。「苓州」という天草の別名自体の初出は未確認
  claims:
  - text: 1955年（昭和30年）1月1日、坂瀬川村・志岐村・富岡町の3町村が合併して苓北町が誕生し、翌1956年に都呂々村が編入されて現在の町域になった
    kind: fact
    level: E2
    status: established
    sources:
    - r10-reihoku-town
  - text: 町名は、3町村の住民からの公募720件をもとに合併協議会で審議され、天草を別名「苓州」と呼んでおり、この地区が苓州の西北部に位置しているところから、満場一致で「苓北町」と決まった
    kind: fact
    level: E2
    status: established
    sources:
    - r10-reihoku-pref
  - text: 「苓」は「あまくさ（甘草）」を意味し、天草全土が「苓州」と呼ばれていたことから、苓州の北部に位置する町という意味で名付けられたと、町は説明する
    kind: fact
    level: E2
    status: established
    sources:
    - r10-reihoku-town
  - text: 江戸時代には富岡に代官所が置かれ、約270年間、天草全土の政治・経済・文化の中心地として繁栄した
    kind: fact
    level: E2
    status: established
    sources:
    - r10-reihoku-town
  - text: 1205年に志岐光弘が地頭となり、坂瀬川・志岐・都呂々・富岡を含む一帯を志岐氏が約400年統治した
    kind: fact
    level: E2
    status: established
    sources:
    - r10-reihoku-town
  - text: 町域の西北端にある富岡半島は陸繋島として知られ、天然の富岡港を形成している
    kind: fact
    level: E2
    status: established
    sources:
    - r10-reihoku-pref
  - text: 1995年（平成7年）から苓北火力発電所が運用を開始している
    kind: fact
    level: E2
    status: established
    sources:
    - r10-reihoku-pref
  - text: 地方公共団体コードは435317である（総務省「地方公共団体コード一覧」で確認）
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 「苓州」とは何か——天草のもう一つの名前
    text: 天草には「苓州」という雅な別名がある。「苓」は甘草（あまくさ）のこと。地名「天草」の読みと植物の名を重ねた言葉遊びのような別称で、その州の北にあるから「苓北」。1955年の合併では、720件の公募の中から、雅称を使ったこの名が満場一致で選ばれた。旧村名を一切使わない、しかし土地の古い呼称に根ざした、美しい新名の例である。
    sources:
    - r10-reihoku-town
    - r10-reihoku-pref
  relations:
  - pref/43
  unknowns:
  - 「苓州」という呼称がいつ頃から使われたかは確認できなかった
  - 富岡城の築城と城下の形成については、本調査では出典を確認できなかった
  updated: '2026-11-13'
- id: muni/43-荒尾市
  code: '432041'
  names:
    ja: 荒尾市
    reading: あらおし
    aliases:
    - 荒尾町
    - 荒尾郷
    - 荒尾村
  user_terms:
  - あらお
  - 万田坑のある市
  - グリーンランドのまち
  - 三池炭鉱のまち
  naming_type: その他（中核となった荒尾町の名を継承して市制を施行）
  prefecture: 熊本県
  homonyms: []
  summary: 熊本県北西端、大牟田市と市街地が連なる有明海沿いの市。「荒尾」の名は中世の玉名郡野原荘のうちに現れ、康暦元年（1379年）の詫摩文書に「あらを」と見えるが、語源は明らかでない。宝治元年（1247年）以来、小代氏が荒尾郷を領した。明治以降は三井三池炭鉱の万田坑（1897年開坑）を中心に炭鉱のまちとして発展し、昭和17年（1942年）に荒尾町と4村が合体して市制を施行した。地名の層は炭鉱の時代より600年以上古い。
  first_attestation:
    era: 康暦元年
    year_western: 1379
    document: 詫磨寂祐譲状（詫摩文書）
    note: 『日本歴史地名大系』が紹介する「あらを」の用例。県の市町村史資料は、宝治元年（1247年）に小代重俊が野原荘の地頭職を得、その三男泰経が「荒尾」を称したことを伝えており、人名・領域名としての現れはさらに遡る
  claims:
  - text: 荒尾市の地方公共団体コードは432041である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  - text: 「荒尾」の地名がどのようにして生まれたかは明らかでないと、熊本県の市町村史資料が明記している
    kind: fact
    level: E2
    status: indeterminate
    sources:
    - s1-arao-pref
  - text: 「荒尾」の用例としては、康暦元年（1379年）の詫磨寂祐譲状（詫摩文書）に「野原の西郷と三万呂名内、あらをの田畠屋敷」とあるものが、『日本歴史地名大系』で確認できる
    kind: fact
    level: E3
    status: established
    sources:
    - s1-arao-kotobank
  - text: 宝治元年（1247年）に小代重俊が肥後国玉名郡野原荘の地頭職に補せられて以来、小代氏が代々荒尾郷を領し、重俊の三男泰経は荒尾村を与えられて「荒尾八郎左衛門尉」と称した
    kind: fact
    level: E2
    status: established
    sources:
    - s1-arao-pref
  - text: 昭和17年（1942年）、荒尾町と平井村・有明村・八幡村・府本村が合体して市制を施行し、市名は中核となった荒尾町による
    kind: fact
    level: E3
    status: established
    sources:
    - s1-arao-kotobank
  - text: 三井三池炭鉱の万田坑は、明治30年（1897年）から明治35年（1902年）にかけて作られた第一竪坑と、明治41年（1908年）完成の第二竪坑からなる、わが国最大規模の竪坑であった
    kind: fact
    level: E2
    status: established
    sources:
    - s1-arao-city-manda
  - text: 万田坑は昭和26年（1951年）に採炭を中止したが、第二竪坑は揚水と坑内管理のため平成9年（1997年）の三池炭鉱閉山まで維持され、施設は国指定重要文化財・史跡となり、平成27年（2015年）に世界文化遺産「明治日本の産業革命遺産」の構成資産として登録された
    kind: fact
    level: E3
    status: established
    sources:
    - s1-arao-city-manda
    - s1-arao-kotobank
  column:
    title: 炭鉱より700年近く古い地名
    text: 「荒尾」と聞くと三池炭鉱のまちを思い浮かべるが、地名の記録は炭鉱よりはるかに古い。鎌倉時代の宝治元年（1247年）に野原荘の地頭となった小代氏の一族が「荒尾」を名乗り、室町時代の譲状にも「あらを」の名が見える。語源は今も分からないままである。明治30年（1897年）に開かれた万田坑は日本最大級の竪坑として栄え、その第二竪坑は採炭が終わった後も坑内の水を汲み上げ続けるため、平成9年（1997年）の閉山の日まで動き続けた。いま万田坑は世界文化遺産となり、炭鉱の記憶は中世以来の地名の上に重なっている。
    sources:
    - s1-arao-pref
    - s1-arao-city-manda
  relations:
  - pref/43
  - muni/43-玉名市
  unknowns:
  - 「荒尾」の語源は未解明で、確かな説は今回の調査範囲では得られなかった
  - 康暦元年（1379年）の詫摩文書の原文は未読のため、用例の主張は専門辞典による紹介形にとどめた
  updated: '2026-11-13'
- id: muni/43-菊池市
  code: '432105'
  names:
    ja: 菊池市
    reading: きくちし
    aliases:
    - 菊池町
    - 菊池郡
    - 鞠智
    - 久々知
    - 隈府
  user_terms:
  - きくち
  - 菊池渓谷・菊池温泉のある市
  - 菊池一族の本拠
  - 隈府（わいふ）のまち
  naming_type: 合併新設（2005年の新設合併で発足。市名は旧菊池市・菊池郡の名を継承）
  prefecture: 熊本県
  homonyms: []
  summary: 菊池川上・中流の県北の市。地名の古層は「鞠智（くくち）」で、『続日本紀』文武天皇2年（698年）条に修繕を命じられた古代山城の名として現れ、「くくち」の読みに後世「菊池」の佳字が当てられた。中世には藤原隆家の孫とされる藤原則隆の末裔・菊池氏が隈府を本拠に肥後の大勢力となり、15代武光は懐良親王を迎えて太宰府を攻略した。昭和33年（1958年）に菊池町が市制を施行し、平成17年（2005年）3月22日に七城町・旭志村・泗水町と新設合併して現在の菊池市となった。
  first_attestation:
    era: 文武天皇2年
    year_western: 698
    document: 続日本紀
    note: 文化遺産オンライン（文化庁）が、『続日本紀』文武天皇2年（698年）の条に大野・基肄とともに修繕を命じられた「鞠智（城）」の記載があることを紹介する。「菊池」の表記ではなく「鞠智」としての初出であり、原文は未読のため紹介形で記録する
  claims:
  - text: 菊池市の地方公共団体コードは432105である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  - text: 菊池の古層の名は「鞠智」で、7世紀後半に大宰府防衛のために築かれた朝鮮式山城・鞠智城の名として『続日本紀』文武天皇2年（698年）の条に現れることを、文化遺産オンラインが紹介している
    kind: fact
    level: E2
    status: established
    sources:
    - s1-kikuchi-bunka
  - text: 鞠智城は当時「久々知（くくち）の城」と呼ばれていたと、熊本県立の歴史公園鞠智城・温故創生館が説明しており、地名の読みはもともと「くくち」であった
    kind: fact
    level: E2
    status: established
    sources:
    - s1-kikuchi-kofunkan
  - text: 『和名類聚抄』はこの地名に「久々知」の註を付け、『延喜式』には「菊池」の表記が見えることから、10世紀頃までには「くくち」に「菊池」の佳字が当てられたと考えられると、Wikipedia「菊池氏」が紹介している
    kind: fact
    level: E5
    status: established
    sources:
    - s1-kikuchi-wiki-shi
  - text: 平安時代後期、大宰権帥・藤原隆家の孫とされる藤原則隆が肥後国に下向して菊池氏を称して以来、菊池氏は隈府を本拠とする肥後の在地勢力の雄となり、15代菊池武光は懐良親王を隈府城に迎えて太宰府を攻略した
    kind: fact
    level: E2
    status: established
    sources:
    - s1-kikuchi-pref
  - text: 中心市街地の旧称「隈府」は、南北朝時代に「隈部」と呼ばれた集落が、菊池氏の居跡があったことから後に隈府と改められたと伝えられる
    kind: fact
    level: E2
    status: established
    sources:
    - s1-kikuchi-pref
  - text: 昭和33年（1958年）8月1日に菊池町が市制を施行して菊池市となり、平成17年（2005年）3月22日に菊池郡七城町・旭志村・泗水町と新設合併して現在の菊池市が発足した
    kind: fact
    level: E2
    status: established
    sources:
    - s1-kikuchi-pref
    - s1-kikuchi-uub
  - text: 平成の合併で新市名の最終候補は「菊池市」「きくち市」「菊池野市」「新菊池市」「清流市」の五つで、「由緒があり全国的に知名度が高く、一つのブランドとして確立している」ことから「菊池市」に決した
    kind: fact
    level: E2
    status: established
    sources:
    - s1-kikuchi-pref
  column:
    title: 「菊池」は当て字だった――くくち、鞠智、菊池
    text: 「菊池」という優雅な字面は、もとの名への当て字である。古代、この地は「くくち」と呼ばれ、7世紀の山城は「鞠智（くくち）の城」と書かれた。『和名類聚抄』が「久々知」と読みを註し、『延喜式』の頃に「菊池」の字が当てられたと考えられている。菊の花の池という風流な由来譚は後付けで、「くくち」の本来の意味は定かでない。なお鞠智城は長く所在地の分からない「幻の城」だったが、発掘調査で菊池市と山鹿市菊鹿町にまたがる山城跡がその実体と確認され、平成16年（2004年）に国の史跡に指定された。鞠智城のマスコットキャラクター「ころう君」も、この城の名を広めている。
    sources:
    - s1-kikuchi-kofunkan
    - s1-kikuchi-bunka
    - s1-kikuchi-wiki-shi
  relations:
  - pref/43
  - muni/43-山鹿市
  - muni/43-合志市
  unknowns:
  - 「くくち」の語源（谷の出口を意味するとする説があるが、出典のある裏付けは得られなかった）
  - 『続日本紀』『和名類聚抄』『延喜式』の原文は未読のため、表記の変遷は公的機関・事典による紹介形にとどめた
  updated: '2026-11-13'
- id: muni/43-菊陽町
  code: '434043'
  names:
    ja: 菊陽町
    reading: きくようまち
    aliases: []
  user_terms:
  - 菊陽
  - きくよう
  - 光の森
  - 津久礼
  - 菊陽にんじん
  - 空港に近い町
  naming_type: 合併新設
  prefecture: 熊本県
  homonyms: []
  summary: 菊池郡の町で、熊本市に隣接する。1955年に津田村・原水村・白水村の3村が合併して菊陽村が発足し、1969年に町制を施行した。町名は、菊池郡の南方に位置し、陽光さんとして輝く発展を祈念して選ばれた。町内には近世以来の古い地名「津久礼」が残る。
  first_attestation:
    era: 昭和30年
    year_western: 1955
    document: 菊陽村の発足（津田村・原水村・白水村の合併）
    note: 町名（村名）としての初出。地区名「津久礼」は江戸時代の上津久礼村・下津久礼村に遡る古い地名
  claims:
  - text: 1955年（昭和30年）4月、菊池郡津田村・原水村と上益城郡白水村の3村が合併して菊陽村が誕生した
    kind: fact
    level: E2
    status: established
    sources:
    - r10-kikuyo-town
  - text: 町名は、本町が菊池郡の南方に位置し、陽光さんとして輝き、前途の希望は洋々たるものがあるという意味をもち、永遠の発展を祈念するという考えから、昭和の合併時に選定された
    kind: fact
    level: E2
    status: established
    sources:
    - r10-kikuyo-pref
  - text: 1969年（昭和44年）に町制を施行し、菊陽町が誕生した
    kind: fact
    level: E2
    status: established
    sources:
    - r10-kikuyo-yoran
  - text: 合併した白水村は、古くは詫磨郡に属した戸次・馬場楠・曲手・唐川（辛川）の4村の区域で、1889年に上益城郡白水村として誕生した。菊陽の合併は郡を越えた合併だった
    kind: fact
    level: E2
    status: established
    sources:
    - r10-kikuyo-yoran
  - text: 町内の津久礼は、1876年（明治9年）に上津久礼村と下津久礼村が合併して津久礼村となり、1889年に久保田村と合併して津田村の一部となった
    kind: fact
    level: E2
    status: established
    sources:
    - r10-kikuyo-pref
  - text: 豊後街道沿いの杉並木は加藤清正にまつわる名所で、樹齢約400年の若杉が残る
    kind: fact
    level: E2
    status: established
    sources:
    - r10-kikuyo-pref
  - text: 近年は熊本市に隣接する「光の森」地区の発展が著しく、行政サービスの受け皿として注視されている
    kind: fact
    level: E2
    status: established
    sources:
    - r10-kikuyo-pref
  - text: 地方公共団体コードは434043である（総務省「地方公共団体コード一覧」で確認）
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 郡を越えて生まれた町と、残った古名「津久礼」
    text: 菊陽村は、菊池郡の2村に上益城郡の白水村を加えた、郡を越える合併で生まれた。「菊陽」という新しい名の下には、津久礼・原水・辛川といった古い地名が今も大字や施設名として生きている。とりわけ「津久礼」は江戸時代の組名に遡る層で、新しい町の成り立ちを知る手がかりになっている。
    sources:
    - r10-kikuyo-yoran
    - r10-kikuyo-pref
  relations:
  - pref/43
  unknowns:
  - 「津久礼」という地名の語源は確認できなかった
  - 『和名類聚抄』の菊池郡の郷に「津久礼」が含まれるかは確認できなかった
  - 「菊陽」以外の町名候補が挙がったかどうかは確認できなかった
  updated: '2026-11-13'
- id: muni/43-西原村
