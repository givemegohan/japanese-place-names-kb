  naming_type: 中心地名の継承
  formation: 単独発足
  prefecture: 鹿児島県
  homonyms: []
  summary: 奄美大島中央部の村。村名は中心集落「大和浜」に由来し、明治41年（1908年）の島嶼町村制施行の際に「大和浜」から名をとって大和村が誕生したと村公式サイトが明記する。村名は1908年の成立以来、改称されずに現在まで継承されている。
  first_attestation:
    era: 安土桃山時代（1572年）
    year_western: 1572
    document: 琉球王の辞令書
    note: 村公式サイトが「屋まとはま」という地名の出現を紹介する。地名「大和浜」の初出とされるもの
  claims:
  - text: 大和村の地方公共団体コードは465232である
    kind: fact
    level: E2
    status: established
    sources:
    - s4-kagoshima-muni-list
  - text: 1572年（隆慶6年）の琉球王の辞令書に「屋まとはま」という地名が現れると村公式サイトが紹介する
    kind: fact
    level: E2
    status: established
    sources:
    - s4-yamato-history
  - text: 薩摩藩統治下では、焼内間切の行政区分として「大和浜方」が置かれた
    kind: fact
    level: E2
    status: established
    sources:
    - s4-yamato-history
  - text: 明治41年（1908年）4月の島嶼町村制施行で村に改める際、「大和浜」から名をとって「大和村」が誕生した
    kind: fact
    level: E2
    status: established
    sources:
