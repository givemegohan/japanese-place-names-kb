  unknowns:
  - 「オキナワ／ウチナー」の語源（漁場説ほか）は学術的に確定しておらず、本KBでも通説として断定しない
  - 『隋書』の「流求」の比定先（台湾か沖縄か島嶼総称か）は未決着であり、「琉球」の初出として沖縄に結びつけることはできない
  - 漢字「沖縄」の厳密な初出（薩摩藩行政文書の用例と元禄国絵図・『南島志』の先後）は本調査では一次資料で確定できなかった
