  naming_type: 島名の継承
  formation: 合併新設
  prefecture: 鹿児島県
  homonyms: []
  summary: 徳之島東部の町。昭和33年（1958年）に亀津町と東天城村が合併して発足し、町名には島名「徳之島」そのものが選ばれた。島名は『続日本紀』の「度感」に比定されることがあるが確定せず、確実な初出は1306年の文書の「とくのしま」とされる。
  first_attestation:
    era: 飛鳥時代（文武天皇3年）
    year_western: 699
    document: 『続日本紀』
    note: 「度感」を徳之島とする比定に基づく島名の初出。比定を採らなければ1306年『千竈時家処分状』の「とくのしま」が確実な初出となる
  claims:
  - text: 徳之島町の地方公共団体コードは465305である
    kind: fact
    level: E2
    status: established
    sources:
    - s4-kagoshima-muni-list
  - text: 『続日本紀』文武天皇3年（699年）条の「度感」が徳之島であれば、島の名の記録は7世紀末に遡るが、「度感」の読みも徳之島への比定も確定していない
    kind: fact
    level: E4
    status: contested
    sources:
    - s4-tokuda-rekishi
    - s4-wiki-tokunoshima
  - text: 「とくのしま」の表記が確実に現れるのは鎌倉時代後期の徳治元年（1306年）の『千竈時家処分状』の「とくのしま」であると徳田虎雄顕彰記念館の資料が紹介する
    kind: fact
    level: E4
    status: established
    sources:
    - s4-tokuda-rekishi
  - text: 島は方言で「とぅくぬしま」と呼ばれ、「とくのしま」の語源に定説はない
    kind: fact
    level: E5
    status: indeterminate
    sources:
    - s4-wiki-tokunoshima
  - text: 明治41年（1908年）の島嶼町村制で、徳之島は亀津村・天城村・島尻村の3村に区画された
    kind: fact
    level: E2
    status: established
    sources:
    - s4-oshima-gaikyou
  - text: 昭和33年（1958年）4月1日、亀津町と東天城村が合併して徳之島町が発足した
    kind: fact
    level: E2
    status: established
    sources:
    - s4-oshima-gaikyou
    - s4-tokunoshima-yoran
  - text: 町名「徳之島町」は旧町名の「亀津」ではなく、島全体の名「徳之島」そのものを新町名として採用したものと考えられる
    kind: fact
    level: H
    status: inferred
    sources:
    - s4-oshima-gaikyou
  column:
    title: 島の名をそのまま町名にした合併
    text: 1958年の合併で生まれた町の名は、合併前の中心地「亀津」ではなく、島そのものの名「徳之島」だった。島の名の歴史は古く、『続日本紀』の「度感」に比定する見方では7世紀末、確実なところでは1306年の文書の「とくのしま」まで遡る。方言では「とぅくぬしま」と呼ばれてきたこの名の語源は、今も解明されていない。島に三つの町がある中で、島名をそのまま名乗るのはこの町だけである。
    sources:
    - s4-oshima-gaikyou
    - s4-tokuda-rekishi
  relations:
  - pref/46
  - muni/46-天城町
  - muni/46-伊仙町
  unknowns:
  - 「とくのしま」の語源の定説は確認できなかった
  - 『続日本紀』の「度感」が徳之島を指すかどうかは確定していない
  - 亀津村の町制施行の年月日は、県大島支庁資料（昭和16年12月15日に亀津町へ改称）とWikipedia（昭和17年1月1日町制施行）で表記が異なり、ここでは県資料に従った
  updated: '2026-11-13'
