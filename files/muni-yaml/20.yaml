  claims:
  - text: 村名は漢詩の「泰山丘阜」に由来すると、Wikipediaが泰阜村について記す。「泰山丘阜」は大きな山と丘を意味する語である
    kind: fact
    level: E5
    status: established
    sources:
    - x1-yasuoka-wiki
  - text: 1875年（明治8年）1月23日に、伊那郡の南山村・唐笠村・金野村・怒田村・左京村・平島田村・鍬不取村・平野村・田野口村・柿野村・明島村・門島村・打沢村・黒見村・高町村・稲伏戸村・万場村の17村が合併して泰阜村が発足した
    kind: fact
    level: E5
    status: established
    sources:
    - x1-yasuoka-wiki
    - x1-yasuoka-donnatoko
  - text: 1889年（明治22年）4月1日の町村制施行でも泰阜村は区域のまま発足し、現在に至る
    kind: fact
    level: E4
    status: established
    sources:
    - x1-yasuoka-donnatoko
  - text: 村名の読み「やすおか」は、「泰」の字の意味（安らか）から「やす」、「阜」の字の意味（丘）から「おか」と、漢字の意味に沿って訓読されたものとみられる
    kind: fact
    level: H
    status: inferred
    sources:
    - x1-yasuoka-wiki
  - text: 中世の村域は、南部が南山郷、北部が今田郷と呼ばれていたと、泰阜村の計画書に基づく資料が伝える
    kind: fact
    level: E4
    status: established
    sources:
    - x1-yasuoka-donnatoko
  - text: 地方公共団体コードは204145である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 漢詩から生まれた村の名
    text: 1875年、17もの村が合併して生まれた新しい村に付けられたのは、どの村の名でも地形の名でもなく、漢詩の言葉「泰山丘阜」だった。大きな山と丘――天竜川の左岸に丘陵が連なる村の姿に重ねた命名とも読める。読みも「たいふ」ではなく、字の意味を訓読した「やすおか」。意味から名を作る明治初期の教養が感じられる命名である。ただし出典となった具体的な漢詩までは特定できていない。Wikipediaと泰阜村の計画書に基づく資料による。
    sources:
    - x1-yasuoka-wiki
    - x1-yasuoka-donnatoko
  relations:
  - pref/20
  unknowns:
  - 「泰山丘阜」の出典である具体的な漢詩（作品名・作者）は特定できておらず、村誌等での一次確認が残る
  - 村名の由来の説明はWikipedia依拠であり、村公式資料での裏づけは確認できていない
  updated: '2026-11-13'
- id: muni/20-王滝村
  code: '204293'
  names:
    ja: 王滝村
    reading: おうたきむら
    aliases: []
  user_terms:
  - 御嶽山の登山口の村
  - 木曽郡の村
  - おんたけの村
  naming_type: 一部の地名
  prefecture: 長野県
  homonyms: []
  summary: 長野県木曽郡の村。御嶽山の登山口にあたり、木曽谷で唯一、江戸時代のままの区域で形成されている自治体とされる。村名はもともと「大滝」と書かれ、その名は王滝川に由来すると村誌が伝える。後に後白河法皇にまつわる伝承によって「大」が「王」に改められたとされる。
  first_attestation:
    era: 戦国時代
    year_western: 1504
    document: null
    note: 旧表記「大滝村」の存在を示す記録が1504年（永正元年）のものとして紹介されるが、本調査では原典を確認できていない。「王滝」の表記自体の文書上の初出も未確認で、村誌の伝承では鎌倉時代（後白河法皇の頃）に改められたとされる。
  claims:
  - text: 村名は昔は「大滝」と書かれており、「大滝」が王滝川に由来することは事実である、と『王滝村誌』が記す内容を、水資源機構（国土交通省所管）の職員コラムが紹介する
    kind: fact
    level: E2
    status: established
    sources:
    - x1-otaki-water
  - text: 77代・後白河天皇が法皇となった後の急病が、御嶽山の神への祈祷によって快方に向かったため、勅によって「大滝」の「大」に代えて「皇」の字から「白」を取り去った「王」の字を用いることが許され、以来「王滝」と書くようになったと、『王滝村誌』の伝承として紹介されている
    kind: legend
    level: E2
    status: indeterminate
    sources:
    - x1-otaki-water
  - text: 王滝の読みは、江戸時代初期までは「おのたけ」、中期以後は「おんたけ」、明治7年（1874年）以後は「おおたき」と変遷したと『王滝村誌』が伝え、現在の「おうたき」はその後の読みである
    kind: fact
    level: E2
    status: established
    sources:
    - x1-otaki-water
  - text: 1889年（明治22年）4月1日の町村制施行により西筑摩郡王滝村の区域をもって王滝村が発足し、木曽谷で唯一、江戸時代のままの区域で形成されている自治体である
    kind: fact
    level: E5
    status: established
    sources:
    - x1-otaki-wiki
  - text: 1984年（昭和59年）の長野県西部地震では御嶽山の中腹が崩れて土石流が王滝川をせき止め、自然湖ができたと、林野庁の資料として紹介されている
    kind: fact
    level: E4
    status: established
    sources:
    - x1-otaki-donnatoko
  - text: 地方公共団体コードは204293である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 「皇」から白を取った「王」
    text: 王滝村の名には、字そのものの成り立ちを説く伝説がある。後白河法皇の病が御嶽山への祈祷で癒えた礼として、「皇」の字から「白」を除いた「王」を村の名に使うことが許されたという。もとの名「大滝」は王滝川に由来する地名で、伝説は表記の交代を説明する物語として村誌に残された。さらに読みも「おのたけ」「おんたけ」「おおたき」と時代ごとに揺れており、隣の旧三岳村の命名にも影響した。水資源機構のコラムが『王滝村誌』の記述として紹介する内容に基づく。
    sources:
    - x1-otaki-water
  relations:
  - pref/20
  - muni/20-木曽町
  - muni/20-木祖村
  unknowns:
  - 「大滝村」の存在を示す1504年の記録の出典（史料名）は確認できていない
  - 「王滝」表記の文書上の初出は確認できていない（村誌の伝承では鎌倉時代に遡るとされる）
  updated: '2026-11-13'
- id: muni/20-生坂村
  code: '204480'
  names:
    ja: 生坂村
    reading: いくさかむら
    aliases:
    - 上生坂村
    - 下生坂村
  user_terms:
  - 生坂村
  - いくさか
  - 山清路の村
  naming_type: 一部の地名（江戸期に上生坂村・下生坂村として現れる「生坂」の継承）
  prefecture: 長野県
  homonyms: []
  summary: 東筑摩郡の村。村名は、江戸時代に上生坂村・下生坂村として現れる古い地名「生坂」の継承で、1875年に小立野・下生野・上生坂・下生坂の4村が合併して生坂村となり、1957年に陸郷村・広津村の各一部を合わせて現在の村域となった。「生坂」の語源は確定していないが、イカ（厳）・サカ（坂）の転で急傾斜地を意味するとの説が紹介されている。犀川の渓谷・山清路を擁し、竜が山を割って平野を作ったという泉小太郎伝説の舞台でもある。
  first_attestation:
    era: 寛永19年
    year_western: 1642
    document: 『日本歴史地名大系』「下生坂村」項が紹介する寛永19年の高付けの記録
    note: 上生坂村・下生坂村としての用例。大系経由の紹介であり、検地帳等の原文の直接確認はしていない
  claims:
  - text: 村公式の沿革によれば、明治8年（1875年）1月に小立野村・下生野村・上生坂村・下生坂村が合併し、現在のもととなる生坂村が発足した
    kind: fact
    level: E2
    status: established
    sources:
    - x2-ikusaka-vill-official
  - text: 昭和32年（1957年）3月31日、当時の陸郷村の一部、旧生坂村、広津村の一部が合併し、新しい生坂村が発足して現在に至ると村公式は伝える
    kind: fact
    level: E2
    status: established
    sources:
    - x2-ikusaka-vill-official
  - text: 『日本歴史地名大系』は、慶長19年（1614年）の寄帳ではこの一帯が日岐村とされていたものが、寛永19年（1642年）には上生坂村・下生坂村・下生野村・小立野村・上生野村に分かれて現れることを紹介する
    kind: fact
    level: E3
    status: established
    sources:
    - x2-ikusaka-kotobank-taikei
  - text: 「生坂」の由来は近世の通称で、イカ（厳）・サカ（坂）の転じたもの、「急傾斜地」のことと考えられる、とする解説がある
    kind: fact
    level: E5
    status: indeterminate
    sources:
    - x2-ikusaka-mapbinder
  - text: 村公式は、平安時代の延長5年（927年）にできた『延喜式』に日置神社（明治になって日岐神社と改称）が載っていることを伝える
    kind: fact
    level: E2
    status: established
    sources:
    - x2-ikusaka-vill-official
  - text: 『信濃の国有明の里由来記』に基づく伝説として、諏訪大明神の化身である母犀竜に乗った泉小太郎が山清路の岩山を乗り割り、湖の水を千曲川筋から越後の海まで流したために松本・安曇の平らが人の住む平野となった、と村公式は伝える
    kind: legend
    level: E2
    status: established
    sources:
    - x2-ikusaka-vill-official
  - text: 生坂村の地方公共団体コードは204480である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 竜が割った谷――山清路と泉小太郎
    text: 生坂村の中心を流れる犀川の名は、村に伝わる泉小太郎伝説と結びついている。昔この一帯は湖で、諏訪大明神の化身の母犀竜に乗った小太郎が山清路の巨岩を突き破って水を落とし、平野を作ったという。その通り道が犀川になったとされ、犀川と麻績川が合流する大渓谷・山清路は今も村の象徴である。「生坂」の名の由来そのものは急傾斜地を指す古い通称という説にとどまるが、村の景観はまさに険しい坂と谷の連続であり、伝説の舞台装置とよく重なっている。
    sources:
    - x2-ikusaka-vill-official
    - x2-ikusaka-mapbinder
  relations:
  - pref/20
  unknowns:
  - 「生坂」の語源（イカ・サカ説）を裏付ける一次資料・自治体史の記述は確認できなかった
  - 寛永19年（1642年）より前の「生坂」の用例は確認できなかった
  updated: '2026-11-13'
- id: muni/20-白馬村
  code: '204854'
  names:
    ja: 白馬村
    reading: はくばむら
    aliases:
    - 神城村
    - 北城村
  user_terms:
  - 白馬村
  - はくば
  - ハクバ
  - ハクババレー
  naming_type: 合併新設（白馬岳の山名を採った新名）
  prefecture: 長野県
  homonyms: []
  summary: 北安曇郡の村。1956年に神城村と北城村が合併して誕生し、村名は白馬連峰の主峰・白馬岳に由来する。山名の「白馬」のもとは、春の山肌に現れる「代掻き馬」の雪形から来た「代馬（しろうま）」で、語源的には「しろうま」が本来の読みとされるが、音読の「はくば」が広がって村名・駅名の読みとなった。村の読みは「はくばむら」で、今も山名の読みをめぐっては「しろうまだけ」と「はくばだけ」の揺れが残る。
  first_attestation:
    era: 昭和31年
    year_western: 1956
    document: 白馬村公式「白馬村の歩み（合併～平成）」
    note: 村名としての初出は1956年9月30日の合併時の命名。山名「白馬」自体の成立はそれ以前に遡るが、命名年は特定できない
  claims:
  - text: 村公式の年表によれば、1956年（昭和31年）9月30日に神城村と北城村が合併して白馬村となった
    kind: fact
    level: E2
    status: established
    sources:
    - x2-hakuba-vill-ayumi
  - text: 村名は富山県と接する白馬連峰の白馬岳（しろうまだけ）に由来するとされる
    kind: fact
    level: E5
    status: established
    sources:
    - x2-hakuba-wiki
  - text: 林野庁の広報誌は、白馬の由来について、春になると雪が解けた山肌に黒い「代掻き馬」の雪形が浮かび上がることから、代掻き馬が代馬（しろうま）と呼ばれるようになったとする
    kind: fact
    level: E2
    status: established
    sources:
    - x2-hakuba-rinya
  - text: 全国観光資源台帳（日本交通公社）は、山頂付近に現れる馬の雪形をめやすに苗代を作るところから苗代馬・代馬（しろうま）といわれるようになったとし、「白馬は語源的には『はくば』でなく『しろうま』である」と解説する
    kind: fact
    level: E3
    status: established
    sources:
    - x2-hakuba-jtb
  - text: 白馬岳は古くは大蓮華岳といい、代掻き馬の雪形が出ることから代馬岳と呼ばれ、それが白馬岳に変った、と雪形の研究資料は伝える
    kind: fact
    level: E4
    status: established
    sources:
    - x2-hakuba-yukigata
  - text: 「代馬岳（しろうまだけ）」はやがて「白馬岳（しろうまだけ）」に変化し、さらに「はくば」と音読されるようになって、麓の村や鉄道駅の名称にもなったとされる
    kind: fact
    level: E5
    status: contested
    sources:
    - x2-hakuba-wiki
  - text: 村名の読みは総務省の一覧でも「はくばむら」であり、山名に地図で使われる「しろうまだけ」とは読みが分かれている
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
    - x2-hakuba-jtb
  - text: 白馬村の地方公共団体コードは204854である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 「しろうま」か「はくば」か――雪形が決めた山の名
    text: 白馬岳の名の核心は、春の残雪が山肌に描く馬の姿、雪形にある。田植え前の代掻きの時期に現れるその馬を「代掻き馬」「代馬（しろうま）」と呼び、農作業の目安にしてきた。だから語源の読みは「しろうま」で、国土地理院の地図も白馬岳を「しろうまだけ」とする。一方で地元の山案内人たちは「はくばだけ」こそ地元の呼び名だと主張してきた歴史があり、村の名前も駅名も「はくば」で定着した。同じ二文字に二つの読みが重なることが、この村の名前のいちばんの面白さである。
    sources:
    - x2-hakuba-rinya
    - x2-hakuba-jtb
    - x2-hakuba-wiki
  relations:
  - pref/20
  - muni/20-小谷村
  unknowns:
  - 1956年の合併時に村名の読みを「はくば」と定めた経緯を示す合併協議会等の一次記録は確認できなかった
  - 山名「白馬」の文献上の初出年は特定できなかった（村公式の村史資料は、明治26年頃まで山名さえ定かでなかったとする）
  updated: '2026-11-13'
- id: muni/20-立科町
  code: '203246'
  names:
    ja: 立科町
    reading: たてしなまち
    aliases:
    - 立科村
    - 芦田村
    - 横鳥村
    - 三都和村
  user_terms:
  - 立科町
  - たてしな
  - 蓼科
  naming_type: 合併新設（蓼科山の名を採り、当用漢字にない「蓼」を古表記「立科」に改めた命名）
  prefecture: 長野県
  homonyms: []
  summary: 北佐久郡の町。1955年に芦田村・横鳥村・三都和村が合併して立科村が誕生し、1958年に町制施行して立科町となった。合併時の新村名は蓼科山にちなむ「蓼科村」で準備が進められていたが、「蓼」が当用漢字になかったことと、蓼科山は古くは「立科山」と表記されていたことから、「立科村」に決まった。山の名（蓼科山）と町の名（立科町）で漢字が書き分けられる、表記変更型の命名である。
  first_attestation:
    era: 昭和30年
    year_western: 1955
    document: 立科町公式「立科町の概要」（名称の由来）
    note: 村名としての命名そのもの（1955年4月1日の合併時）。典拠となった山名の古表記「立科山」はそれ以前に遡るが、具体的な年代は確認できなかった
  claims:
  - text: 歴史的行政区域データセットによれば、立科村は1955年4月1日に成立し、1958年10月1日に立科町となった
    kind: fact
    level: E2
    status: established
    sources:
    - x2-tateshina-nii-geoshape
  - text: 町公式「名称の由来」によれば、明峰「蓼科山」の麓に発展した芦田村・横鳥村・三都和村の三村が合併して立科村が誕生し、その後町制施行により立科町となった
    kind: fact
    level: E2
    status: established
    sources:
    - x2-tateshina-town-gaiyo
  - text: 合併に際して新村名は「蓼科村」とすることで準備が進められていたと町公式は伝える
    kind: fact
    level: E2
    status: established
    sources:
    - x2-tateshina-town-gaiyo
  - text: しかし「蓼」の字が当用漢字になかったこと、蓼科山は古くは立科山と表記されていたことから、新村名は「立科村」に異議なく決定されたと町公式は説明する
    kind: fact
    level: E2
    status: established
    sources:
    - x2-tateshina-town-gaiyo
  - text: 三村が関わる連合体にはすべて蓼科の名が冠され、三村の組合が設置した蓼科実業補習学校（現在の長野県立蓼科高等学校）の存在も、蓼科の名を新村名とする背景となったと町公式は述べる
    kind: fact
    level: E2
    status: established
    sources:
    - x2-tateshina-town-gaiyo
  - text: 『日本歴史地名大系』は、町域の古町地区に蓼科神社の里宮や中世の芦田氏の城館跡があることを記しており、「たてしな」の名が神社名としても地域に根付いていたことがうかがえる
    kind: fact
    level: E3
    status: established
    sources:
    - x2-tateshina-kotobank-taikei
  - text: 立科町の地方公共団体コードは203246である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 当用漢字に消された「蓼科村」
    text: 立科町の名前は、あと一歩で「蓼科村」になるところだった。合併する三村は学校組合などあらゆる連合体に「蓼科」を冠して融和を図り、新しい村の名も「蓼科村」で話が進んでいた。ところが「蓼」は当用漢字に入っていなかった。そこで引っ張り出されたのが、蓼科山の古い表記「立科山」である。古表記を根拠に「立科村」とすることで決着し、以来この一帯では、山は「蓼科山」、町は「立科町」、高校は「蓼科高等学校」と、同じ「たてしな」に二つの書き方が併存することになった。
    sources:
    - x2-tateshina-town-gaiyo
  relations:
  - pref/20
  - muni/20-長和町
  unknowns:
  - 蓼科山を「立科山」と記した古い文献の具体例と年代は、町公式の説明以上には確認できなかった
  - 「たてしな」という山名自体の語源（蓼の群生地とする説など）は、公的・専門資料で確定できなかった
  updated: '2026-11-13'
- id: muni/20-筑北村
  code: '204528'
  names:
    ja: 筑北村
    reading: ちくほくむら
    aliases:
    - 本城村
    - 坂北村
    - 坂井村
  user_terms:
  - 筑北村
  - ちくほく
  naming_type: 合併新設（東筑摩郡北部の地域名「筑北」の採用）
  prefecture: 長野県
  homonyms: []
  summary: 東筑摩郡の村。2005年10月11日に本城村・坂北村・坂井村が新設合併して誕生した平成合併の村である。村名の公式な選定記録は確認できないが、東筑摩郡では平野部を「筑南」、山間部を「筑北」と呼び分ける地域名があり、この筑摩郡北部の総称「筑北」をそのまま村名に採ったものと考えられる。当初は隣の麻績村を含む枠組みも検討されたが、麻績村は加わらず3村の合併となった。
  first_attestation:
    era: 平成17年
    year_western: 2005
    document: 筑北村公式「合併の歴史」
    note: 村名としての初出は2005年10月11日の新設合併時の命名。地域名としての「筑北」の使用はそれ以前に遡るが、初出年は確認できなかった
  claims:
  - text: 村公式「合併の歴史」によれば、旧本城村・旧坂北村・旧坂井村が平成17年（2005年）に合併して筑北村となり、合併日は2005年10月11日である
    kind: fact
    level: E2
    status: established
    sources:
    - x2-chikuhoku-vill-gappei
    - x2-chikuhoku-uub
  - text: 合併の枠組みには当初、隣接する麻績村も関わり、2001年12月から2002年1月にかけて麻績村で合併に関する住民アンケートが行われた記録があるが、最終的に麻績村は加わらず3村の合併となった
    kind: fact
    level: E4
    status: established
    sources:
    - x2-chikuhoku-uub
  - text: 東筑摩郡では、上田市・松本市側の平野部に位置する朝日村・山形村を筑南、山間部に位置する生坂村・麻績村・筑北村を筑北と呼んで区別することがある
    kind: fact
    level: E5
    status: established
    sources:
    - x2-chikuhoku-wiki-gun
  - text: 村名「筑北」は、筑摩郡（東筑摩郡）北部の地域を指すこの「筑北」という呼び名を、合併新村の名として採用したものと考えられる
    kind: fact
    level: H
    status: inferred
    sources:
    - x2-chikuhoku-wiki-gun
    - x2-chikuhoku-vill-gappei
  - text: 旧坂北村は明治8年（1875年）に阪北村として成立し、のちに坂北村となったが、「阪」から「坂」への字の変更については村公式も「定かではありません」としている
    kind: fact
    level: E2
    status: established
    sources:
    - x2-chikuhoku-vill-gappei
  - text: 旧本城村は、明治8年（1875年）に乱橋・西条・東条・大沢新田の各村から本条村となったが、明治15年（1882年）に元の4か村に分離し、明治22年（1889年）に再び合併して本城村となった
    kind: fact
    level: E2
    status: established
    sources:
    - x2-chikuhoku-vill-gappei
  - text: 筑北村の地方公共団体コードは204528である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 郡の北半分の呼び名が、そのまま村の名になった
    text: 筑北村の名は、合併で新しく発明された言葉ではない。松本平の東側、東筑摩郡の山間部は、地元で長く「筑北」と呼ばれてきた。平野部の「筑南」と対になる、暮らしの中の方位地名である。2005年の合併では、本城・坂北・坂井のどの旧村名も採らず、この地域全体の呼び名が新村名になった。もっとも、同じ「筑北」に括られてきた生坂村や麻績村は合併に加わらなかったため、「筑北」という地名の範囲と筑北村の村域は今も完全には一致していない。
    sources:
    - x2-chikuhoku-wiki-gun
    - x2-chikuhoku-vill-gappei
  relations:
  - pref/20
  - muni/20-麻績村
  - muni/20-生坂村
  unknowns:
  - 村名「筑北」の選定経緯（公募の有無・候補名）を記した合併協議会等の公式記録は確認できなかった
  - 地域名としての「筑北」の初出と成立時期は確認できなかった
  updated: '2026-11-13'
- id: muni/20-箕輪町
  code: '203831'
  names:
    ja: 箕輪町
    reading: みのわまち
    aliases:
    - 中箕輪町
    - 東箕輪村
    - 箕輪村
  user_terms:
  - 箕輪町
  - みのわ
  naming_type: 合併新設（三町村に共通する古い郷名「箕輪」の採用）
  prefecture: 長野県
  homonyms: []
  summary: 上伊那郡の町。1955年1月1日に中箕輪町・箕輪村・東箕輪村が合併して誕生し、町名は三町村に共通する古い郷名「箕輪」を採った。「箕輪」は現在の箕輪町・南箕輪村・伊那市西箕輪一帯を指した中世以来の地域名（箕輪郷）で、その起源は平安中期の荘園「蕗原庄」に遡るとされる。「箕輪」という地名一般については、突出した丘を取り囲む村落が箕の形に似ることからいうとする辞典の解説がある。
  first_attestation:
    era: 応仁3年
    year_western: 1469
    document: 『諏訪御符礼之古書』
    note: 地域史資料が「箕輪郷」の用例として紹介するもの。原典の直接確認はしておらず、文明9年（1477年）の同書にも見えるとされる
  claims:
  - text: 町公式の検定資料によれば、昭和30年（1955年）1月1日、中箕輪町と箕輪村、東箕輪村が合併し、箕輪町が誕生した
    kind: fact
    level: E2
    status: established
    sources:
    - x2-minowa-town-kentei
  - text: 合併した三町村はいずれも名に「箕輪」を含んでおり、新町名はその共通部分である「箕輪」を採った形になっている
    kind: fact
    level: E2
    status: established
    sources:
    - x2-minowa-town-kentei
    - x2-minowa-town-yoran
  - text: 町勢要覧の変遷図は、明治8年（1875年）2月12日に中箕輪村と東箕輪村が成立したことを示し、中箕輪村は昭和23年（1948年）に町制施行して中箕輪町となった
    kind: fact
    level: E2
    status: established
    sources:
    - x2-minowa-town-yoran
  - text: 「箕輪郷」は現在の箕輪町・南箕輪村および伊那市の西箕輪・手良一帯を指す歴史的地名で、応仁3年（1469年）と文明9年（1477年）に編まれた諏訪社の記録『諏訪御符礼之古書』にも「箕輪郷」の名が記されていると、地域史資料が紹介する
    kind: fact
    level: E5
    status: indeterminate
    sources:
    - v11-minamiminowa-blog-minowago
  - text: 箕輪郷の起源は平安中期の荘園「蕗原（ふきはら）庄」に遡り、「箕輪」「箕輪郷」「箕輪領」の呼称が用いられるようになったのは室町後期とみられると、地域史資料は説明する。箕輪町の町民憲章も町を「歴史の古い蕗原の里」と表現している
    kind: fact
    level: E5
    status: contested
    sources:
    - v11-minamiminowa-blog-minowago
    - x2-minowa-town-yoran
  - text: 『精選版 日本国語大辞典』は「箕輪」を、中部地方以東で砦を中心に発達した村をいい、突出した丘の周囲を取り囲んだ村落が箕の形に似ているところからいう、と解説する
    kind: fact
    level: E3
    status: established
    sources:
    - x2-minowa-kotobank-kokugo
  - text: ジャパンナレッジの地名解説は、『地名の語源』（鏡味完二・鏡味明克）の「半円形の土地」を意味するという説もあわせて紹介しており、「みのわ」の語源は一つに定まっていない
    kind: fact
    level: E3
    status: contested
    sources:
    - v11-minowa-japanknowledge
  - text: 箕輪町の地方公共団体コードは203831である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 中・東・南に枝分かれした「箕輪」
    text: 「箕輪」の名は伊那谷の北部一帯を指す古い郷の名で、明治の町村整理では中箕輪・東箕輪（現在の箕輪町側）と南箕輪（南箕輪村側）、さらに西箕輪（現・伊那市）という具合に、方位を付けて枝分かれしていった。1955年の合併で中・東と箕輪村が一緒になるとき、新しい町の名に選ばれたのは、枝分かれする前の大本の名「箕輪」そのものだった。いわば先祖の名に里帰りした命名で、南箕輪村だけが「南」を付けたまま今も隣に残っている。
    sources:
    - v11-minamiminowa-blog-minowago
    - x2-minowa-town-kentei
  relations:
  - pref/20
  - muni/20-南箕輪村
  - muni/20-辰野町
  unknowns:
  - 『諏訪御符礼之古書』における「箕輪郷」の用例は地域史資料の紹介によるもので、原典での直接確認はしていない
  - 箕輪郷の「箕輪」の語源が、当地についても「箕の形」説で説明できるかは専門資料で確定できなかった
  updated: '2026-11-13'
- id: muni/20-茅野市
  code: '202142'
  names:
    ja: 茅野市
    reading: ちのし
    aliases:
    - ちの町
    - 永明村
  user_terms:
  - ちのし
  - 縄文のビーナスのまち
  - 八ヶ岳の玄関口
  - 茅野の名前の由来
  naming_type: 一部の地名
  prefecture: 長野県
  homonyms: []
  summary: 茅野市は八ヶ岳山麓の市で、市名「茅野」は茅（かや）の生える野という意味で、もとは旧村の一地名だった。1905年に開設された茅野駅の名が全国的に知られるようになり、駅名が町名となり、やがて市の名になった。1948年には永明村が「ちの町」と改称し、日本で最初の平仮名の自治体名となった時期がある。縄文時代の国宝土偶「縄文のビーナス」「仮面の女神」を出土した遺跡の地でもある。
  first_attestation:
    era: 明治38年
    year_western: 1905
    document: 中央本線 茅野駅の開設
    note: 地名としての初出ではなく、「茅野」の名が駅名として全国に知られる契機となった年。もとは旧村の一地名とされるが、その初出は未確認
  claims:
  - text: 茅野市統計書の「市名の由来」によれば、「茅野」は茅（かや）の生える野という意味で、もとは旧村の一地名だった
    kind: fact
    level: E2
    status: established
    sources:
    - v2-chino-tokei
  - text: 明治38年（1905年）に鉄道中央本線が開通して茅野駅が開設されて以来、駅名が全国的に有名になったことなどから、駅名を町名にし、その後市の名前になった（茅野市統計書の「市名の由来」による）
    kind: fact
    level: E2
    status: established
    sources:
    - v2-chino-tokei
  - text: 昭和23年（1948年）5月3日に永明村が町制を施行し、「ちの町」と改称した。これは日本で最初の平仮名の自治体名とされる
    kind: fact
    level: E2
    status: established
    sources:
    - v2-chino-tokei
  - text: 同じ改称の際に、駅前の地区の区称は「茅野町」と改められており、漢字の「茅野」は駅と駅前地区の名として残った
    kind: fact
    level: E2
    status: established
    sources:
    - v2-chino-tokei
  - text: 昭和30年（1955年）2月1日に1町8ヵ村が合併して茅野町となり、昭和33年（1958年）8月1日の市制施行により茅野市が誕生した
    kind: fact
    level: E2
    status: established
    sources:
    - v2-chino-tokei
  - text: 棚畑遺跡から昭和61年（1986年）に発掘された土偶「縄文のビーナス」は、平成7年（1995年）6月に縄文時代の土偶として初めて国宝に指定された
    kind: fact
    level: E2
    status: established
    sources:
    - v2-chino-tokei
  - text: 中ッ原遺跡から平成12年（2000年）に出土した土偶「仮面の女神」も、平成26年（2014年）8月に国宝に指定された
    kind: fact
    level: E2
    status: established
    sources:
    - v2-chino-tokei
  - text: 茅野市の地方公共団体コードは202142である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 日本で最初のひらがなの町名
    text: 1948年、永明村は町制を施行するにあたって、名を平仮名で「ちの町」とした。日本で最初の平仮名の自治体名とされる、大胆な改称だった。ところが合併を経て1955年に町名が決まる段になると、採用されたのは漢字の「茅野町」だった。決め手は、1905年の開設以来、全国に知られていた「茅野駅」の名である。平仮名の革新性よりも、駅名の知名度が勝った。それでも「ちの町」の7年間は、自治体の名の付け方の歴史に残る実験だった。
    sources:
    - v2-chino-tokei
  relations:
  - pref/20
  unknowns:
  - 「茅野」という地名としての初出文献を確認できなかった（旧村の一地名とされるにとどまる）
  - 茅野駅の駅名が旧村名から取られた際の選定記録を確認できなかった
  - 「茅の生える野」以外の語源説を確認できなかった
  - 尖石遺跡など縄文遺跡と地名との関係は確認できなかった（地名の層とは別に記録すべき考古学的事項）
  updated: '2026-11-13'
- id: muni/20-諏訪市
  code: '202061'
  names:
    ja: 諏訪市
    reading: すわし
    aliases:
    - 洲羽
    - 須波
    - 諏方
    - 上諏訪町
  user_terms:
  - 諏訪の名前の由来
  - すわし
  - お諏訪さまのまち
  - 諏訪湖のまち
  - 御柱のまち
  naming_type: その他（郡名・湖名・神社名に共通する古地名の継承）
  prefecture: 長野県
  homonyms: []
  summary: 「諏訪」は、諏訪湖・諏訪郡・諏訪大社に共通する古い地名で、古くは洲羽・須波・諏方などと書かれた。『古事記』の国譲り神話では、建御名方神が「州羽の海」で降参した土地とされ、その神を祀る諏訪大社の上社本宮が現在の諏訪市に鎮座する。市としては昭和16年（1941年）に上諏訪町・豊田村・四賀村の合併で市制を施行し、その際、町名ではなく地域全体の名「諏訪」が市名となった。
  first_attestation:
    era: 古代（8世紀）
    year_western: null
    document: 古事記
    note: 建御名方神が降参した地を「科野の国州羽の海」と記す国譲り神話の記事として、全国観光資源台帳が紹介するもの（原典そのものの確認はしていない）。漢字表記「諏訪」が定着した時期は未確認
  claims:
  - text: 『古事記』によると、父の大国主神と兄の事代主神が穏やかに国譲りをしたのに対し一人抵抗した建御名方神は、最後に科野（しなの）の国州羽の海（すわのうみ）で降参し、この地を出ないことで許されたと記される
    kind: legend
    level: E2
    status: established
    sources:
    - n3-suwa-jtb
  - text: 諏訪大社は諏訪湖を隔てて南北に上社と下社が鎮座し、上社は諏訪市の本宮と茅野市の前宮、下社は下諏訪町の春宮と秋宮に分かれる4社を合わせて諏訪大社となる、信濃国一之宮である
    kind: fact
    level: E2
    status: established
    sources:
    - n3-suwa-jtb
  - text: 諏訪大社の祭神は出雲系の神である建御名方神と妻の八坂刀売神で、上社は建御名方神の神裔という神（じん）氏が大祝を世襲して祀り、のちに諏訪氏と称して諏訪地方の祭政に携わった
    kind: fact
    level: E2
    status: established
    sources:
    - n3-suwa-jtb
  - text: 「諏訪」は、洲羽、須波、諏方などと書かれた古い時代もあった
    kind: fact
    level: E2
    status: established
    sources:
    - n3-suwa-yoran
  - text: 諏訪市議会の要覧は、現在の「諏訪」の字について、中国の太湖を詠じた詩の中に「雲諏波訪（雲諏い波訪う）」という景色の良さを形容する語があり、諏訪湖が太湖によく似ているためにこの詩語を取って「諏訪」と書くようになったという説を紹介している
    kind: fact
    level: E2
    status: contested
    sources:
    - n3-suwa-yoran
  - text: 昭和16年（1941年）8月10日に上諏訪町・豊田村・四賀村が合併し、諏訪市として市制を施行した（全国184番目、県下6番目）。その後、昭和30年（1955年）に中洲村・湖南村が合併し、現在の諏訪市となった
    kind: fact
    level: E2
    status: established
    sources:
    - n3-suwa-yoran
  - text: 諏訪市の地方公共団体コードは202061である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 湖を挟んで4つの社、16本の御柱
    text: 諏訪大社は一つの社ではない。諏訪湖の南東に上社（本宮・前宮）、北西に下社（春宮・秋宮）が向き合い、4社を合わせて一つの大社をなす。そして4社それぞれに4本ずつ、合計16本の御柱（おんばしら）が立っている。祭神の建御名方神は『古事記』では出雲から逃れて州羽の海で降参した神とされ、上社の大祝は、その神の子孫と称して生き神として祀られてきた。「諏訪」という一つの名が、湖と、郡と、神社と、そして市の名として重なり合っているのが、この地域の名前の積み重なりである。
    sources:
    - n3-suwa-jtb
  relations:
  - pref/20
  - muni/20-下諏訪町
  unknowns:
  - 「諏訪」の語源そのものは定かでない。市議会要覧が紹介する太湖の詩語説は市の紹介する説であり、専門辞典による裏付けは本バッチでは確認できなかった
  - 漢字表記「諏訪」がいつ定着したかは、本バッチでは確認できなかった
  updated: '2026-11-13'
- id: muni/20-豊丘村
  code: '204161'
  names:
    ja: 豊丘村
    reading: とよおかむら
    aliases:
    - 神稲村
    - 河野村
  user_terms:
  - 豊丘村
  - とよおか
  naming_type: 合併新設（天竜川沿いの段丘の景観にちなむ新名）
  prefecture: 長野県
  homonyms: []
  summary: 下伊那郡の村。1955年4月1日に神稲村と河野村が合併して誕生した。「豊丘」は合併時の新名で、発足直後に村が発行した村勢要覧は「豊丘の村名も此の自然の景観に負う所が少くない」と記しており、天竜川沿いに発達した河岸段丘の豊かな丘陵の景観にちなむ命名と考えられる。前身の一つ神稲村は「くましろ」と読む難読の村名だった。同じ読みの豊岡市（兵庫県）や豊岡村（静岡県、現・磐田市）とは別の自治体である。
  first_attestation:
    era: 昭和30年
    year_western: 1955
    document: 豊丘村『村勢要覧』（1955年発行）
    note: 村名としての初出は1955年4月1日の合併時の新命名。村勢要覧は発足直後の村公式出版物で、村名と景観の関わりを記す
  claims:
  - text: 1955年4月1日、神稲村と河野村が新設合併して豊丘村が誕生した
    kind: fact
    level: E5
    status: established
    sources:
    - x2-toyooka-wiki-kumashiro
  - text: 合併発足直後の昭和30年（1955年）に村が発行した村勢要覧は、発足以来の村の歩みを記すとともに、「豊丘の村名も此の自然の景観に負う所が少くない」と述べ、村名を村の自然景観に結びつけている
    kind: fact
    level: E2
    status: established
    sources:
    - x2-toyooka-yoran1955
  - text: 『日本歴史地名大系』は、豊丘村が天竜川左岸に位置し、天竜川に沿って南北に発達した数段の河岸段丘をもつ農村であることを記す
    kind: fact
    level: E3
    status: established
    sources:
    - x2-toyooka-kotobank-taikei
  - text: 村名「豊丘」は、この段丘の丘陵地が豊かに実る地であることにちなむ合併時の新命名と考えられるが、命名の審議経過そのものは確認できていない
    kind: fact
    level: H
    status: inferred
    sources:
    - x2-toyooka-yoran1955
    - x2-toyooka-kotobank-taikei
  - text: 前身の神稲村は「くましろむら」と読む難読の村名で、村役場は現在も旧神稲村域の神稲地区に置かれている
    kind: fact
    level: E5
    status: established
    sources:
    - x2-toyooka-wiki-kumashiro
  - text: 豊丘村の地方公共団体コードは204161である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 消えた難読村名「神稲（くましろ）」
    text: 豊丘村の前身のひとつは、初見ではまず読めない「神稲村（くましろむら）」だった。1955年の合併でこの難読名は表舞台から消え、代わりに選ばれたのが、誰にでも読めて景観そのものを表す「豊丘」である。天竜川の段丘に田畑と果樹園が重なる眺めを、そのまま名前にしたような命名だった。もっとも「神稲」の名は消えたわけではなく、村役場のある地区の名として今も残り、村の住所に生き続けている。
    sources:
    - x2-toyooka-wiki-kumashiro
    - x2-toyooka-yoran1955
  relations:
  - pref/20
  - muni/20-喬木村
  - muni/20-大鹿村
  unknowns:
  - 「豊丘」の命名者・候補名など合併協議の具体的な経過は、村勢要覧の景観への言及以外に確認できなかった
  - 神稲（くましろ）の語源は確認できなかった
  updated: '2026-11-13'
- id: muni/20-軽井沢町
  code: '203211'
  names:
    ja: 軽井沢町
    reading: かるいざわまち
    aliases:
    - 軽井沢宿
    - 東長倉村
    - かるいさわ
  user_terms:
  - 軽井沢の名前の由来
  - 軽井沢のアイヌ語説は本当か
  - かるいさわ と かるいざわ の違い
  - 軽井沢の語源の諸説
  naming_type: 一部の地名
  prefecture: 長野県
  homonyms: []
  summary: 町名は碓氷峠のふもとの集落・宿場の名「軽井沢」の継承である。古くは「かるいさわ」と読まれ、明治以降に避暑地として知られるようになると「かるいざわ」に変化したとされる。語源は今日でもはっきりしておらず、渇れた沢とする説、柳田国男の「背負う」説、アイヌ語説など諸説が対立したままで、専門の論文も定説なしと評価している。大正時代に東長倉村が町制を施行して軽井沢町となった。
  first_attestation:
    era: 応永2年
    year_western: 1395
    document: 真楽寺金剛力士像の墨書銘（『信濃史料』第7巻収録）
    note: 北佐久郡軽井沢の文献上の初出として地名研究の江良武の論文が紹介するもの。「軽井沢」の名の成立は中世とみるのが妥当と論文は論じる
  claims:
  - text: 軽井沢は古くは「かるいさわ」と呼ばれ、明治以降に避暑地として広まり外国人の往来が盛んになると、発音しやすい「かるいざわ」へ変化していったといわれている
    kind: fact
    level: E4
    status: established
    sources:
    - k3-karuizawa-kanko
  - text: この地名がいつ何から起こったのかは今日でもはっきりしていないと軽井沢観光協会は述べ、「凍り冷わ（こおりさわ）」から転じたという説、「軽石沢」から来たという説、水が枯れた「かれ沢」から来たという説などを挙げている
    kind: fact
    level: E4
    status: contested
    sources:
    - k3-karuizawa-kanko
  - text: 地名研究者の江良武は、北佐久郡軽井沢の文献上の初出として応永2年（1395）の真楽寺金剛力士像後頭部の墨書銘に旦那名として見える例を挙げ、軽井沢地名の成立は中世とみてよいと論じている
    kind: fact
    level: E3
    status: established
    sources:
    - k3-karuizawa-era
  - text: 「karuはアイヌ語で軽石、iは大いなる、sawaは沢であるから『軽石の大沢』の意である」とするアイヌ語説が辞典類に紹介されているが、江良は、こうした音の類似性という直感に基づく諸説は論理に乏しいと評している
    kind: fact
    level: E3
    status: contested
    sources:
    - k3-karuizawa-era
  - text: 柳田国男は、峠では荷物を馬からおろして自分で背負って登らねばならず、中古時代に背負うことを「かるう」といったことから「かるう沢」が「かるい沢」に転じたとする説を唱えた。この説は論議の中心となって批判も受け、今日では水の枯れた沢に由来する渇沢説が有力になっているように思われると江良は述べる
    kind: fact
    level: E3
    status: contested
    sources:
    - k3-karuizawa-era
    - k3-karuizawa-kanko
  - text: 江戸時代には五街道の一つである中山道に軽井沢宿が設置され、宿場として栄えた
    kind: fact
    level: E4
    status: established
    sources:
    - k3-karuizawa-kanko
  - text: 大正時代に東長倉村が町制を施行し、軽井沢町と改称して現在に至っている
    kind: fact
    level: E4
    status: established
    sources:
    - k3-karuizawa-kanko
  - text: 総務省の全国地方公共団体コードで、軽井沢町の団体コードは203211と定められている
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 荷物を背負って越えた峠のふもと
    text: 碓氷峠は中山道最大の難所で、馬の背に荷を載せたままでは越えられず、ふもとで荷をおろし、人が背負って登ったといいます。柳田国男はここに目をつけ、背負うことを意味した古い言葉「かるう」から「かるう沢」、やがて「軽井沢」になったと考えました。地名研究の江良武はこの説への批判を整理したうえで、軽井沢型の地名の多くが街道沿いの居住地名であることは、命名が農業ではなく交通に関係したことを暗示すると指摘しています。語源の決着はついていませんが、「峠の交通が生んだ名前」という見立て自体は、軽井沢が宿場として育った歴史とよく響き合います。
    sources:
    - k3-karuizawa-era
    - k3-karuizawa-kanko
  relations:
  - pref/20
  unknowns:
  - 語源は諸説が対立したままで、専門の論文も「どれも特に有力な説とはいえない」水準の評価にとどまる
  - 1395年より前の用例の有無は確認できていない
  - 東長倉村が町制を施行して軽井沢町となった正確な年月日は、本バッチで確認した観光協会の資料では年次まで示されていない
  - アイヌ語説を最初に唱えた文献とその根拠の詳細は、論文の要約的な紹介の範囲を超えて確認できていない
  updated: '2026-11-13'
- id: muni/20-辰野町
  code: '203823'
  names:
    ja: 辰野町
    reading: たつのまち
    aliases:
    - 伊那富村
  user_terms:
  - 辰野町
  - たつの
  - 日本の中心の町
  - ほたるの町
  naming_type: その他（古い地域名「辰野」を、1947年の町制施行時に伊那富村が町名として採用）
  prefecture: 長野県
  homonyms: []
  summary: 上伊那郡の町。町名の「辰野」は、古代に御牧が置かれ中世には庄園の名にもなった古い地域名で、1947年に伊那富村が町制を施行する際、辰野町と改めたことに始まる。その語源は町公式も「はっきりとわかっていない」とし、竜が住む湖があったという伝承が残る。なお町が掲げる「日本の中心」は、経緯度のほぼ中央に当たるという近代の標榜であり、地名の由来とは別のものである。
  first_attestation:
    era: 鎌倉時代
    year_western: null
    document: 庄園名「辰野」に言及する研究（伊藤富雄「庄園辰野・平出・宮所の研究」『伊那路』第4巻、1960年。県立長野図書館のレファレンス事例が紹介）
    note: 「辰野」の名は古代の御牧・中世の庄園の名に遡るとされるが、具体的な初出史料と年次は確認できなかった
  claims:
  - text: 町公式は「辰野（たつの）という地域の歴史は古いが、地名の由来については、はっきりとわかっていません」と明記している
    kind: fact
    level: E2
    status: indeterminate
    sources:
    - x2-tatsuno-town-iware
  - text: 辰野町資料（第22号）に掲載された伝承では、昔、荒神山が天竜川をせき止めて辰野は湖であり、一匹の竜が住んでいたが、大雨で湖の水が荒神山を切り崩して流れ出し、水がなくなって竜も天へ昇ってしまった、それで辰野というようになった、と語られる
    kind: legend
    level: E2
    status: established
    sources:
    - x2-tatsuno-town-iware
  - text: 江戸時代後期の国学者・松沢義章の著書『洲羽国考』には、この辺りに1里四方の湖があり「天ノ竜ノ海」と呼ばれていたこと、天竜川の流路が変わって湖が干潟となり辰野の地名が残された、との趣旨が記されていると町公式は紹介する
    kind: legend
    level: E2
    status: established
    sources:
    - x2-tatsuno-town-iware
  - text: 町勢要覧は、古代に朝廷直轄の御牧が平出・宮所・辰野・小野に設けられ、毎年都へ貢馬が送られていたとする
    kind: fact
    level: E2
    status: established
    sources:
    - x2-tatsuno-town-yoran
  - text: 中世には庄園としての辰野が存在し、伊藤富雄「庄園辰野・平出・宮所の研究」（『伊那路』1960年）などの研究があることを、県立長野図書館のレファレンス事例が紹介している
    kind: fact
    level: E2
    status: established
    sources:
    - x2-tatsuno-ndl-ref
  - text: 町勢要覧の沿革によれば、昭和22年（1947年）の町制施行で伊那富村が辰野町となり、昭和30年（1955年）に朝日村、昭和31年（1956年）に川島村、昭和36年（1961年）に小野村を合併して現在の町域となった
    kind: fact
    level: E2
    status: established
    sources:
    - x2-tatsuno-town-yoran
  - text: 町は、東経138度と北緯36度の線が交わり日本列島のほぼ中心に当たることを掲げ、鶴ヶ峰には昭和45年（1970年）に「日本中心の標」が設置されたが、これは地名「辰野」の由来とは別の、近代になってからの標榜である
    kind: fact
    level: E2
    status: established
    sources:
    - x2-tatsuno-town-center
    - x2-tatsuno-town-yoran
  - text: 辰野町の地方公共団体コードは203823である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 竜の湖の伝説と「日本の中心」
    text: 辰野には、名前を彩る看板が二つある。一つは古い伝承の「竜の湖」――天竜川をせき止めた湖に竜が住み、水が抜けたあとに「辰（竜）の野」が残ったという語りで、江戸時代の国学者も「天ノ竜ノ海」と書き留めた。もう一つは現代の「日本の中心」で、経緯度の交点を根拠に1970年に標が建てられ、町民憲章の冒頭にも「辰野町は日本の真ん中」とうたわれる。ただし後者は地名の由来ではなく、町が後から掲げたキャッチフレーズである。語源そのものは今も「はっきりとわかっていない」というのが、町の公式見解である。
    sources:
    - x2-tatsuno-town-iware
    - x2-tatsuno-town-center
  relations:
  - pref/20
  - muni/20-箕輪町
  - muni/20-下諏訪町
  unknowns:
  - 「辰野」の語源について、伝承以外の学術的な説明は確認できなかった
  - 御牧・庄園としての「辰野」の初出史料と年次は特定できなかった
  - 1947年に伊那富村が町制施行にあたって「辰野」と改名した理由を明記した資料は確認できなかった（地域の古名の採用とみられる）
  updated: '2026-11-13'
- id: muni/20-野沢温泉村
  code: '205630'
  names:
    ja: 野沢温泉村
    reading: のざわおんせんむら
    aliases:
    - 豊郷村
    - 湯山村
    - 野沢村
  user_terms:
  - 野沢温泉村
  - のざわおんせん
  - 野沢温泉
  - ノザワ
  naming_type: その他（旧豊郷村が1953年に温泉地の名「野沢温泉」へ改称）
  prefecture: 長野県
  homonyms: []
  summary: 下高井郡の村。もとは湯山村と呼ばれた温泉の集落で、室町時代頃に野沢村となり、明治以降は豊郷村を名乗ったが、1953年に温泉地の名をそのまま自治体名とする「野沢温泉村」へ改称し、1956年に市川村と合併して現在の村となった。集落の記録上の初めは1272年の「湯山村」で、温泉の発見は奈良時代と伝えられる。「野沢温泉」という観光地の名が、そのまま村の正式名称になった事例である。
  first_attestation:
    era: 文永9年
    year_western: 1272
    document: 野沢温泉村公式「野沢温泉村概要」が紹介する記録
    note: 集落が「湯山村」として歴史に現れる最初と村公式が述べるもの。記録の原典名は明示されておらず、原文の直接確認はしていない
  claims:
  - text: 村公式の概要によれば、野沢温泉村が「湯山村」として歴史に現れてくるのは鎌倉時代中期の文永9年（1272年）が最初であり、江戸時代初期にはすでに24軒もの宿屋があったといわれる
    kind: fact
    level: E2
    status: established
    sources:
    - x2-nozawa-vill-gaiyo
  - text: 地縁団体野沢組の年表は、室町時代の応永年間に湯山村から野沢村に変わったと思われるとし、当時の集落は現在の位置より西に下がった古屋敷にあったとする
    kind: fact
    level: E4
    status: established
    sources:
    - x2-nozawa-gumi-history
  - text: 野沢組の年表によれば、弘治3年（1557年）の上杉景虎（謙信）の願文と武田晴信（信玄）の書状に「野沢の湯」との記録があり、戦国時代には「野沢」の名が文書に現れている
    kind: fact
    level: E4
    status: established
    sources:
    - x2-nozawa-gumi-history
  - text: 温泉の発見は奈良時代の神亀2年（724年）、聖武天皇の頃のことと野沢組の年表は伝える
    kind: legend
    level: E4
    status: established
    sources:
    - x2-nozawa-gumi-history
  - text: 明治22年（1889年）の町村制で豊郷村と坪山村の区域から豊郷村が成立し、昭和28年（1953年）8月18日の改称により野沢温泉村となった
    kind: fact
    level: E4
    status: established
    sources:
    - x2-nozawa-uub-toyogo
  - text: 昭和31年（1956年）9月30日、野沢温泉村と市川村が新設合併し、改めて野沢温泉村が発足して現在の村域となった
    kind: fact
    level: E5
    status: established
    sources:
    - x2-nozawa-wiki-ichikawa
  - text: 村名に「温泉」を含む形は、1953年の改称で、古くからの温泉地の呼称「野沢温泉」をそのまま自治体名に採り入れたことによるものである
    kind: fact
    level: H
    status: inferred
    sources:
    - x2-nozawa-uub-toyogo
    - x2-nozawa-vill-gaiyo
  - text: 野沢温泉村の地方公共団体コードは205630である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 観光地の名前が、そのまま村の名前になった
    text: この村の名前の変遷は、湯山村→野沢村→豊郷村→野沢温泉村と、まるで看板の掛け替えのようである。注目したいのは最後の改称で、1953年、村は由緒ある行政名「豊郷」を捨て、温泉地として知られた通称「野沢温泉」を正式な村名に採用した。13の外湯を村人が共同で守る「湯仲間」の文化で知られるこの村では、温泉こそが村のアイデンティティそのものだった。名実を一致させる改称は、その後スキー場と並んで「野沢温泉」の名を世界に広めることになる。
    sources:
    - x2-nozawa-uub-toyogo
    - x2-nozawa-vill-gaiyo
  relations:
  - pref/20
  - muni/20-木島平村
  unknowns:
  - 「湯山村」の1272年の記録の原典（文書名）は村公式・野沢組の資料に明示されておらず、直接確認できなかった
  - 「野沢」の語源（野の沢という地形名か等）を明示した専門資料は確認できなかった
  - 1953年の改称の審議経過（候補名など）は確認できなかった
  updated: '2026-11-13'
- id: muni/20-長和町
  code: '203505'
  names:
    ja: 長和町
    reading: ながわまち
    aliases:
    - 長門町
    - 和田村
  user_terms:
  - 長和町
  - ながわ
  naming_type: 合併新設（長門町の「長」と和田村の「和」の合成）
  prefecture: 長野県
  homonyms: []
  summary: 小県郡の町。2005年10月1日に長門町と和田村が合併して誕生し、町名「長和」は長門の「長」と和田の「和」を合わせた合成名である。しかも前身の長門町自体が、1956年に長久保・長窪の「長」と大門の「門」を合わせた合成名であり、合成地名の中に合成地名が入る入れ子構造になっている。読みは「ながわ」で、旧国名の長門（山口県）とは無関係である。
  first_attestation:
    era: 平成17年
    year_western: 2005
    document: 長和町「長和町の概況」
    note: 町名としての初出は2005年10月1日の合併時の命名（合成名）
  claims:
  - text: 町公式の概況によれば、長和町は平成17年（2005年）10月1日、長門町と和田村とが合併し誕生した
    kind: fact
    level: E2
    status: established
    sources:
    - x2-nagawa-town-gaikyo
  - text: 町名「長和」は、長門町と和田村という両町村の頭文字（「長」と「和」）より命名された合成名である
    kind: fact
    level: E5
    status: established
    sources:
    - x2-nagawa-wiki
  - text: 合併に先立ち、平成16年（2004年）3月28日に任意合併協議会が設立され、同年9月に法定合併協議会へ移行し、平成17年（2005年）3月1日に両町村議会で全会一致により合併が議決された経過を、町公式の概況は記す
    kind: fact
    level: E2
    status: established
    sources:
    - x2-nagawa-town-gaikyo
  - text: 前身の長門町は、昭和31年（1956年）9月30日に長久保新町・長窪古町・大門村が合併して発足し、その名は長窪古町と長久保新町の「長」と大門村の「門」より命名された合成名であった
    kind: fact
    level: E5
    status: established
    sources:
    - x2-nagato-wiki
  - text: もう一方の前身・和田村は、明治22年（1889年）の町村制以来2005年まで単独の村として存続し、中山道の和田宿を擁した。和田宿本陣などは国の史跡に指定されている
    kind: fact
    level: E2
    status: established
    sources:
    - x2-nagawa-gikai-yoran
  - text: 町名の読みは総務省の一覧でも「ながわまち」であり、山口県の旧国名・長門や長門市とは読みも成り立ちも異なる
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  - text: 長和町の地方公共団体コードは203505である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 合成地名の入れ子――「長和」の中の「長門」
    text: 「長和」は、長門の「長」と和田の「和」を貼り合わせた名前である。ところが、その材料になった「長門」もまた、1956年に長久保・長窪の「長」と大門の「門」を貼り合わせた名前だった。つまり長和町は、合成地名どうしをさらに合成した、二重の入れ子構造の名前なのである。合併のたびに旧名の断片を残してきた結果、現在の町名の二文字の中に、長久保・長窪・大門・和田という4つの旧町村の痕跡が畳み込まれている。
    sources:
    - x2-nagawa-wiki
    - x2-nagato-wiki
  relations:
  - pref/20
  - muni/20-立科町
  unknowns:
  - 町名「長和」の合成であることを明記した合併協議会・町の一次資料は確認できず、合成の説明はWikipediaの記述に基づく
  - 長門町の「長」「門」合成についても、一次資料での裏付けは取れていない
  updated: '2026-11-13'
- id: muni/20-長野市
  code: '202011'
  names:
    ja: 長野市
    reading: ながのし
    aliases:
    - 長野町
    - 長野村
    - 善光寺町
  user_terms:
  - 長野市の名前の由来
  - 長野市はなぜ長野というのか
  - 善光寺と長野市の関係
  - 長野市の市制が遅かった理由
  naming_type: 一部の地名
  prefecture: 長野県
  homonyms: []
  summary: 市名は善光寺の門前町を含む長野村・長野町の名を受け継いだものである。「長野」は扇状地の長い緩やかな傾斜地を指す地形由来の地名と説明される。明治4年（1871）に県庁が長野村へ移って村名が県名になり、市制の施行は明治30年（1897）と県庁所在地としては遅めだった。
  first_attestation:
    era: 慶長6年
    year_western: 1601
    document: 善光寺文書（大久保長安等連署証文）
    note: 慶長6年9月16日付の証文に「信州水内郡之内長野」とある。1570年の武田信玄書状に初出を求める説もあるが字句の読みが定まらないため、確実な用例としてこちらを採った（県レコードと同一の記録）
  claims:
  - text: 慶長6年（1601）9月16日の大久保長安等連署証文（善光寺文書）に「信州水内郡之内長野」とあり、善光寺領の確定に関わる文書の中で「長野」が確認できる
    kind: fact
    level: E2
    status: established
    sources:
    - c-jstage-nagano
  - text: 元亀元年（1570）の武田信玄の書状に長野の初出を見る説もあるが、その字句は「艮野」とも読まれ、1601年初出説と併存している
    kind: fact
    level: E3
    status: contested
    sources:
    - c-jstage-nagano
  - text: 「長野」は、善光寺平に裾花川などがつくった扇状地のような、長く緩やかな傾斜地を指す地形由来の地名と説明される
    kind: fact
    level: E2
    status: established
    sources:
    - c-suzaka-city
  - text: 江戸時代、現・長野市中心部は地籍上は水内郡長野村であり、その町場の部分が善光寺の門前町として善光寺町と呼ばれた
    kind: fact
    level: E2
    status: established
    sources:
    - c-ndl-nagano
  - text: 明治4年（1871）6月、中野県の県庁が長野村の西方寺へ移され、県名が長野県と改称されたため、村名「長野」がそのまま県名になった
    kind: fact
    level: E2
    status: established
    sources:
    - c-nagano-shishi
  - text: 明治30年（1897）4月1日、長野町が市制を施行して長野市が誕生した。県庁所在地になってから市になるまでに26年を要している
    kind: fact
    level: E2
    status: established
    sources:
    - c-nagano-shishi
    - c-cap-nagano-uub
  - text: 総務省の全国地方公共団体コードで、長野市の団体コードは202011と定められている
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 一つのまちに、二つの名前
    text: 江戸時代のいまの長野市中心部には、二つの名前が重なっていました。地籍のうえでは水内郡「長野村」、しかし実際に人々が暮らし参詣客でにぎわう町場は、善光寺の門前町として「善光寺町」と呼ばれていたのです。明治4年（1871）に県庁の引っ越し先になったのは長野村で、県の名前は「長野県」になりました。一方、まちの知名度でいえば善光寺の方が圧倒的でした。村の名前が県名になり、門前町のにぎわいがそのまま都市の土台になる――長野市は、その二つの名前の重なりから生まれた県庁所在地です。
    sources:
    - c-ndl-nagano
    - c-nagano-shishi
  relations:
  - pref/20
  unknowns:
  - 1570年の武田信玄書状の該当字句（長野か艮野か）の確定には原本の画像確認が必要で未了（県レコードと同一の未確認事項）
  - 長野村から長野町が成立した年次（町制の経緯）については本バッチでは市公式資料まで確認できていない
  - 「長野＝長い傾斜地」とする地形語源説の言語学的な検証水準は、専門地名辞典まで確認できていない
  updated: '2026-11-13'
- id: muni/20-阿南町
  code: '204048'
  names:
    ja: 阿南町
    reading: あなんちょう
    aliases:
    - 大下条村
    - 和合村
    - 旦開村
    - 富草村
  user_terms:
  - 阿南町
  - あなんちょう
  - あなん
  naming_type: 合併新設（地域名「阿南」を公募で採用）
  prefecture: 長野県
  homonyms:
  - muni/36-阿南市
  summary: 下伊那郡の町。1957年7月に大下条村・和合村・旦開村が合併して誕生した。町名の「阿南」は、阿智川（阿知川）以南一帯を指す地域名で、明治中期に青年たちが「阿南青年会」を組織した頃から使われ始めた比較的新しい地名であり、合併時の公募で「南信濃町」との最終対決を制して採用された。読みは「あなんちょう」で、長野県の町では唯一「ちょう」と読む。徳島県の阿南市とは同名だが、成り立ちは無関係である。
  first_attestation:
    era: 明治24年
    year_western: 1891
    document: 「阿南青年会」の組織（町公式「町名の由来」が『下伊那青年運動70年史』によるものとして紹介）
    note: 地域名としての「阿南」の使用の最初と町公式が述べるもの。江戸時代の文献には「阿南」の文字は見当たらないと町公式は説明する
  claims:
  - text: 町公式の沿革によれば、阿南町は大下条村・和合村・旦開（あさげ）村が昭和32年（1957年）7月に合併して誕生し、さらに昭和34年（1959年）4月に富草村と合併して現在の阿南町となった
    kind: fact
    level: E2
    status: established
    sources:
    - x2-anan-town-enkaku
  - text: 町公式「町名の由来」によれば、阿智川以南の地域は明治の中期から「阿南」と呼ばれるようになり、明治24年（1891年）に下條・富草・大下条・泰阜の青年たちが『阿南青年会』を組織したのが、「阿南」という名称が使われた最初である
    kind: fact
    level: E2
    status: established
    sources:
    - x2-anan-town-yurai
  - text: 「阿知川の南だから阿南」という考え方は、当時の若い世代によるものだったと町公式は伝える
    kind: fact
    level: E2
    status: established
    sources:
    - x2-anan-town-yurai
  - text: 合併に際して町名は公募され、応募総数300通・95種類の中から最終段階で5候補が残り、最後は「阿南町」と「南信濃町」の2つに絞り込まれたと町公式は記録する
    kind: fact
    level: E2
    status: established
    sources:
    - x2-anan-town-yurai
  - text: 町名決定の理由として、「阿知川の南に生まれた新しい町だから」「日常に『阿南』の言葉が多く使われていて当地方の代名詞として広く知られていたから」「応募数が一番多かったから」などが挙げられたと町公式は伝える
    kind: fact
    level: E2
    status: established
    sources:
    - x2-anan-town-yurai
  - text: 町名の読みは「あなんちょう」で、長野県の町で唯一「ちょう」と呼ぶ町であると町公式は説明する。近接する静岡・愛知・岐阜で「ちょう」と呼ぶ地域との交流の影響が考えられるという
    kind: fact
    level: E2
    status: established
    sources:
    - x2-anan-town-yurai
  - text: 徳島県の阿南市は那賀川河口に位置する港町で、同名ながら長野県阿南町とは成り立ちが無関係である
    kind: fact
    level: E3
    status: established
    sources:
    - x2-anan-kotobank
  - text: 阿南町の地方公共団体コードは204048である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 「阿南」は若者が作った名前
    text: 多くの地名が古代や中世に遡る中で、「阿南」は異色の若い地名である。江戸時代の文献に「阿南」の文字はなく、明治24年（1891年）に地域の青年たちが「阿南青年会」を名乗ったのが始まりと町は説明する。「阿知川の南」という明快な命名は、その後、阿南新聞、阿南病院、阿南高校、阿南警察署と地域の機関名に次々に広がり、1957年の合併では公募300通の頂点に立って、ついに自治体名になった。青年会の看板が66年かけて町名に昇格したのである。
    sources:
    - x2-anan-town-yurai
  relations:
  - pref/20
  - muni/36-阿南市
  - muni/20-泰阜村
  unknowns:
  - 「阿南青年会」の組織年（明治24年）や名称使用の最初であることは町公式の紹介によるもので、『下伊那青年運動70年史』の原典は直接確認していない
  - 公募の最終候補5つのうち「阿南町」「南信濃町」以外の3候補の名称は、町公式ページに明記されていなかった
  updated: '2026-11-13'
- id: muni/20-阿智村
  code: '204072'
  names:
    ja: 阿智村
    reading: あちむら
    aliases:
    - 阿知
  user_terms:
  - あちむら
  - 日本一の星空の村
  - 昼神温泉の村
  - 花桃の里
  naming_type: 合併新設（1956年に3村が合併し、地域の古名「阿智」を新村名に採用）
  prefecture: 長野県
  homonyms: []
  summary: 長野県の南端、下伊那郡の村。1956年に会地村・伍和村・智里村が合併した際、構成村の名ではなく、古代からこの一帯を指した通称「阿智」を新村名に採用した。村公式によれば『先代旧事本紀』に一帯を「阿智」と呼ぶ記述があり、『延喜式』には東山道の阿智駅が見えるという。2006年に浪合村、2009年に清内路村を編入して現在の村域になった。
  first_attestation:
    era: 延長5年
    year_western: 927
    document: 延喜式
    note: 村公式が『延喜式』に東山道の駅として「阿智駅」が載ると紹介するもの。駅の所在地は現在の駒場地区付近と推定される。原文を直接確認したものではないため、村名そのものの初出は1956年の合併発足時である
  claims:
  - text: 昭和31年（1956年）9月30日、会地村・伍和村・智里村が合併して阿智村が発足した
    kind: fact
    level: E2
    status: established
    sources:
    - x3-achi-vill-plan
  - text: 村名「阿智」は合併した3村の名ではなく、古くからこの一帯を通称した「阿智」をもって新村名としたものである
    kind: fact
    level: E2
    status: established
    sources:
    - x3-achi-vill-gaiyo
  - text: 阿智村公式は、平安初期に編纂された『先代旧事本紀』にこの地域一帯を「阿智」と呼ぶ記述があると紹介する
    kind: fact
    level: E2
    status: established
    sources:
    - x3-achi-vill-gaiyo
  - text: 阿智村公式は、『延喜式』に東山道の道筋の中に阿智駅が載っていると紹介し、古代の阿智は東山道の駅が置かれたこの地方の中心だったとする
    kind: fact
    level: E2
    status: established
    sources:
    - x3-achi-vill-gaiyo
    - x3-achi-vill-plan
  - text: 平成18年（2006年）1月1日に浪合村、平成21年（2009年）3月31日に清内路村と合併し、現在の阿智村となった
    kind: fact
    level: E2
    status: established
    sources:
    - x3-achi-vill-gaiyo
  - text: 昼神地区は延喜式内社の阿智神社の鎮座地であり、知恵の神・思兼命（おもいかねのみこと）とその氏族が入植した地域であると伝えられる
    kind: legend
    level: E5
    status: established
    sources:
    - x3-hirugami-wiki
  - text: 『日本書紀』応神天皇20年の条には、東漢氏の祖・阿知使主（あちのおみ）が子の都加使主と党類17県を率いて渡来したとあり、『古事記』では阿知吉師と記されるが、「阿知」と信濃の阿智を結びつける史料はなく、村名との直接の関係は確認できない
    kind: fact
    level: E5
    status: indeterminate
    sources:
    - x3-achi-no-omi-wiki
  - text: 昼神温泉は昭和48年（1973年）1月、計画中の国鉄中津川線のトンネル工事に伴うボーリング調査中に昼神湯ノ瀬地区で温水が湧出して始まった新しい温泉である
    kind: fact
    level: E2
    status: established
    sources:
    - x3-hirugami-tsukuba
  - text: 昼神では江戸時代の享保・元文年間にまとめられた『信州伊奈郡村鑑』に温泉が湧き出して近郷の人が湯治したという記録が残るが、その湧出口は後に阿智川の大水で埋没したと学術論文は紹介する
    kind: fact
    level: E2
    status: established
    sources:
    - x3-hirugami-tsukuba
  - text: 阿智村の地方公共団体コードは204072である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 村より1200年古い名前
    text: 阿智村という自治体ができたのは1956年だが、「阿智」という名前はそれより千年以上前からこの谷を指していた。村の公式説明によれば、『先代旧事本紀』には一帯を「阿智」と呼ぶ記述があり、『延喜式』には東山道の駅として阿智駅が載る。東山道は都と東国を結ぶ古代の幹線で、駅が置かれる場所はその地域の中心だった。1956年の合併で3村が新しい名前を必要としたとき、選ばれたのは構成村のどれかではなく、谷全体を千年以上指してきた通称だった。合併で生まれた村が、合併相手のどの名前でもない「一番古くて一番広い名前」を拾う――そういう命名の型がここにはある。
    sources:
    - x3-achi-vill-gaiyo
    - x3-achi-vill-plan
  relations:
  - pref/20
  - muni/20-平谷村
  unknowns:
  - 「阿智」という地名そのものの語源（『先代旧事本紀』の記述の原文と、その「阿智」が現村域とどう重なるかは未確認）
  - 阿智駅の正確な所在地（駒場地区付近とする推定にとどまる）
  - 『古事記』『日本書紀』の阿知使主・阿知吉師と信濃国阿智との関係を示す史料の有無
  - 大字「昼神」の地名の由来
  updated: '2026-11-13'
- id: muni/20-青木村
  code: '203491'
  names:
    ja: 青木村
    reading: あおきむら
    aliases: []
  user_terms:
  - あおきむら
  - 義民の里
  - 五島慶太の出身地
  - 田沢温泉と沓掛温泉の村
  naming_type: 合併新設（1889年に6村が合併し、小字名であり学校名でもあった「青木」を新村名に採用）
  prefecture: 長野県
  homonyms: []
  summary: 長野県小県郡の村。1889年の町村制施行で奈良本村・沓掛村・夫神村・殿戸村・村松郷・田沢村が合併して発足した。新村名の選定は難航したが、田沢の小字「青木」にちなみ、1886年にその地に置かれた「青木学校」の名でもあった「青木村」が選ばれたと伝えられる。小字「青木」の名は、東山道の道しるべだったネズの名木に由来するという。
  first_attestation:
    era: 寛正6年
    year_western: 1465
    document: 諏訪御符礼之古書
    note: 『日本歴史地名大系』「青木」項が紹介する用例。同書の寛正6年五月会の件に「青木」の名が見え、集落名としての使用例の初出とされる。村名としての初出は1889年の青木村発足時
  claims:
  - text: 明治22年（1889年）4月1日、町村制の施行により小県郡の奈良本村・沓掛村・夫神村・殿戸村・村松郷・田沢村の区域をもって青木村が発足した
    kind: fact
    level: E5
    status: established
    sources:
    - x3-aoki-wiki
  - text: 『日本歴史地名大系』は、現在の青木村大字田沢の「青木」を「青木村の語源となった集落」とし、東山道と国道143号との分岐点にあたると説明する
    kind: fact
    level: E3
    status: established
    sources:
    - x3-aoki-kotobank-taikei
  - text: 『日本歴史地名大系』によれば、『諏訪御符礼之古書』の寛正6年（1465年）五月会の件に「左頭、青木、代官深井肥前守治光」とあり、室町時代には「青木」の名が記録に現れている
    kind: fact
    level: E3
    status: established
    sources:
    - x3-aoki-kotobank-taikei
  - text: 小字「青木」の名は、東山道の道しるべだった「ねずみさし」（ネズ）の名木に由来するとされ、その地には明治19年（1886年）に近隣の学校を統合した「青木学校」が置かれた
    kind: fact
    level: E5
    status: established
    sources:
    - x3-aoki-wiki
  - text: 1889年の合併で新村名の選定が難航する中、学校の名でもあり希望に輝く新しい村の名称にふさわしいとして「青木村」が選ばれたと、『青木村誌』に基づく説明が紹介されている
    kind: fact
    level: E5
    status: established
    sources:
    - x3-aoki-wiki
  - text: 昭和32年（1957年）3月31日、浦里村の一部（大字当郷）と合併して新しい青木村が発足し、村はこの年を「新制青木村」の誕生と位置づけている
    kind: fact
    level: E5
    status: established
    sources:
    - x3-aoki-wiki
  - text: 村名の由来を戦国期に当地に居住した青木氏に求める説明は、福島県の旧青木村など他地域の事例と混同されることがあり、長野県青木村について氏族由来を裏づける資料は確認できない
    kind: fact
    level: E5
    status: indeterminate
    sources:
    - x3-aoki-wiki
  - text: 青木村の地方公共団体コードは203491である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 学校の名前が村の名前になった
    text: 村の名前が学校から来るというのは珍しい順序である。田沢の小字「青木」には東山道の道しるべだったネズの名木があり、その場所に1886年、近隣4校を統合した学校ができて「青木学校」と名乗った。3年後、6村の合併で新しい村名が決まらないとき、人々が思いついたのがこの学校の名前だった。名木は後に切られたが、村民有志が根を掘り返して3つに分け、小学校・中学校・文化会館に保存したという。木は消えても、木の名前は学校を経由して村全体の名前として残った。
    sources:
    - x3-aoki-wiki
  relations:
  - pref/20
  - muni/20-麻績村
  unknowns:
  - 『青木村誌 歴史編 下』（1992年）が「村名の由来」として記す内容の原文（本バッチではWikipedia経由の紹介にとどまる）
  - ネズの名木があった場所と「青木」という小字名が付けられた時期
  - 1465年以前の「青木」の用例の有無
  updated: '2026-11-13'
- id: muni/20-須坂市
  code: '202070'
  names:
    ja: 須坂市
    reading: すざかし
    aliases:
    - 須坂村
    - 須坂町
  user_terms:
  - すざかし
  - 蔵の町
  - 製糸の町
  - 須坂の名前の由来
  naming_type: 一部の地名
  prefecture: 長野県
  homonyms: []
  summary: 須坂市は千曲川東岸、扇状地の上に広がる市で、江戸時代は須坂藩の陣屋町、明治から大正にかけては製糸業で栄えた町である。「須坂」の語源には定説がなく、戦国武将の須田氏にゆかりがあるという説や、坂田地区に残る古地名「砂田」との関係を説く見方がある。須坂村は1876年に須坂町となり、1954年に県内7番目の市として市制を施行した。
  first_attestation:
    era: （未確認）
    year_western: null
    document: （未確認）
    note: 須坂村・須坂藩の名は近世の資料にみえるが、「須坂」の地名の初出は本調査では確認できなかった
  claims:
  - text: 須坂は江戸時代に須坂藩堀氏の陣屋町として発展し、明治9年（1876年）に須坂村から須坂町に改称した
    kind: fact
    level: E2
    status: established
    sources:
    - v2-suzaka-gaiyo
    - v2-suzaka-monjo
  - text: 昭和29年（1954年）4月1日に市制を施行して須坂市が誕生し、その後、昭和30年（1955年）に井上村・高甫村を、昭和46年（1971年）に東村を編入して現在の市域となった
    kind: fact
    level: E2
    status: established
    sources:
    - v2-suzaka-monjo
    - v2-suzaka-gaiyo
  - text: 「須坂」の語源には定説がない。須田氏は一説に須坂の地名につながるゆかりのある家とされるが、須田氏自体の発祥にも定説はない（長野県立歴史館の研究者の講演録を須坂市が公開するもの）
    kind: fact
    level: E2
    status: contested
    sources:
    - v2-suzaka-suda
  - text: 同じ講演では、坂田地区に残る古い地名「砂田」が須田氏の発祥ではないかという説が紹介され、「須田」のような名は扇状地によくある地名だと説明された
    kind: fact
    level: E2
    status: contested
    sources:
    - v2-suzaka-suda
  - text: 須坂の中心市街地は、千曲川の支流である鮎川・百々川・八木沢川・松川が押し出した大きな扇状地の上に形成されており、鎌倉・室町時代には井上氏・須田氏・高梨氏などの武士がこの地を支配した
    kind: fact
    level: E2
    status: established
    sources:
    - v2-suzaka-gaiyo
  - text: 明治時代に水車動力による生糸製造が盛んになり、大正時代には製糸業が全盛期を迎えて「世界に知られた生糸の町」となり、蔵造りの商家の町並みが残る
    kind: fact
    level: E2
    status: established
    sources:
    - v2-suzaka-gaiyo
  - text: 須坂市の地方公共団体コードは202070である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 「須坂」の「す」は砂だったのか
    text: 須坂の語源は、いまだに決着していない。手がかりの一つは、戦国時代にこの地で活躍した須田氏である。長野県立歴史館の研究者は講演で、須田氏の発祥には定説がないとしたうえで、坂田地区に残る古い地名「砂田」がその発祥ではないかという説を紹介した。須坂は川が運んだ砂の扇状地の町であり、「すだ」「すざか」のような音は、砂地の地名として扇状地によく現れるという。川の洲と坂に由来するという分かりやすい説明も広く流布しているが、公的な資料で裏付けられたものではない。砂なのか洲なのか、答えはまだ扇状地の中に埋もれている。
    sources:
    - v2-suzaka-suda
    - v2-suzaka-gaiyo
  relations:
  - pref/20
  unknowns:
  - 「須坂」の語源の定説は確認できなかった（千曲川の「洲」と扇状地の「坂」に由来するという通説も、公的資料では裏付けが取れなかった）
  - 「須坂」の地名の初出文献を確認できなかった
  - 須坂藩の陣屋町として「須坂」の名が定着した過程を、市史の記述で確認できなかった
  updated: '2026-11-13'
- id: muni/20-飯山市
  code: '202134'
  names:
    ja: 飯山市
    reading: いいやまし
    aliases:
    - 飯山町
  user_terms:
  - いいやま
  - 北信州いいやま
  - 豪雪地帯の市
  - 寺のまち飯山
  naming_type: 一部の地名
  prefecture: 長野県
  homonyms: []
  summary: 長野県最北部の市で、地名は戦国時代に上杉謙信が築いた飯山城の城名として定着した。江戸時代は飯山藩の城下町、明治以降は飯山町として続き、1954年に飯山町と周辺6村が合併して飯山市となった。「飯山」の語源そのものは未詳であり、城名としての層と、日本有数の豪雪地帯という土地の性格は分けて理解する必要がある。
  first_attestation:
    era: 永禄7年
    year_western: 1564
    document: null
    note: 地名「飯山」の文書上の初出は特定できていない。1564年の飯山城築城が、城名としての「飯山」の確実な用例として確認できる画期であり、初出そのものではない
  claims:
  - text: 総務省の全国地方公共団体コードで、飯山市の団体コードは202134と定められている
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  - text: 飯山市の基本計画書によれば、飯山城は永禄7年（1564）に上杉謙信が武田氏への前線基地として本格的に築城し、本市の都市形成はこの飯山城を中心に城下町としてなされた
    kind: fact
    level: E2
    status: established
    sources:
    - v3-iiyama-jouyama-plan
  - text: 同計画書によれば、江戸時代の飯山は飯山藩の城下町で、享保2年（1717）から本多氏が9代151年にわたり藩主を務めた
    kind: fact
    level: E2
    status: established
    sources:
    - v3-iiyama-jouyama-plan
  - text: 政府の特区計画によれば、昭和29年（1954）8月に飯山町・秋津村・柳原村・外様村・常盤村・瑞穂村・木島村の1町6村が合併して飯山市が誕生し、昭和31年（1956）に太田村・岡山村を編入して現在の姿となった
    kind: fact
    level: E2
    status: established
    sources:
    - v3-iiyama-tokku-plan
  - text: 市名は、城下町以来の中心地である飯山町の名をそのまま継承したものである
    kind: fact
    level: E2
    status: established
    sources:
    - v3-iiyama-tokku-plan
    - v3-iiyama-jouyama-plan
  - text: 同じ特区計画によれば、飯山は古くから山国信州と日本海を結ぶ交通の要所として栄え、塩・魚などの海産物の集散地であった
    kind: fact
    level: E2
    status: established
    sources:
    - v3-iiyama-tokku-plan
  - text: 同じ特区計画によれば、飯山には江戸時代から続く寺町文化があり、名僧・正受老人の正受庵をはじめとする寺社の景観が市の文化を形作っている
    kind: fact
    level: E2
    status: established
    sources:
    - v3-iiyama-tokku-plan
  - text: 飯山市は日本有数の豪雪地帯であり、豪雪地帯対策特別措置法に基づく「特別豪雪地帯」の指定を受けている
    kind: fact
    level: E5
    status: established
    sources:
    - v3-wiki-iiyama
  column:
    title: 城の名と雪のまち
    text: 飯山の名は城から生まれました。戦国の境目に築かれた飯山城の城下町がまちの骨格となり、江戸時代を通じて藩庁の置かれた「飯山」が地域の中心の名として定着しました。一方で、この土地を語るもう一つの顔が雪です。日本有数の豪雪地帯で「特別豪雪地帯」の指定を受ける飯山では、雪国らしい連帯と協調の精神が市民性として語られ、城下町に集まった寺々がつくる「寺のまち」の景観とあわせて、現在の飯山の個性になっています。城名の層と豪雪の層は、同じ「飯山」でも由来の異なる二つの物語です。
    sources:
    - v3-iiyama-jouyama-plan
    - v3-iiyama-tokku-plan
    - v3-wiki-iiyama
  relations:
  - pref/20
  unknowns:
  - 「飯山」という地名の語源（なぜ「飯」の字が当てられたか）は、市の公式資料でも示されておらず、今回の調査範囲では確認できなかった
  - 地名「飯山」の文書上の初出（中世文書における用例）は特定できなかった
  - 飯山城の築城以前に「飯山」という地名が存在したかどうかは未確認
  updated: '2026-11-13'
- id: muni/20-飯島町
  code: '203840'
  names:
    ja: 飯島町
    reading: いいじままち
    aliases: []
  user_terms:
  - いいじままち
  - ふたつのアルプスが見えるまち
  - 飯島陣屋の町
  naming_type: 一部の地名（中世の郷名「飯島郷」に由来する村名を継承し、町制・合併を経て現在に至る）
  prefecture: 長野県
  homonyms: []
  summary: 長野県上伊那郡の町。町公式の沿革によれば、鎌倉時代には飯島氏の支配のもとで飯島郷の開発が進んだとされ、その郷名が後の飯島村・飯島町に引き継がれた。1875年に飯島村など4か村が合併して飯島村となり、1889年の町村制でも飯島村・田切村・本郷村の合併で飯島村が発足、1954年に町制を施行して飯島町となり、1956年に七久保村と合併して現在の町域になった。「飯島」の語源そのものは資料で確定していない。
  first_attestation:
    era: 明治8年
    year_western: 1875
    document: null
    note: 自治体名としての「飯島村」の成立は1875年1月23日の4か村合併による。もとになった郷名「飯島郷」は鎌倉時代に遡ると町公式の沿革が記すが、文書上の初出は本バッチでは確認できていない
  claims:
  - text: 飯島町公式の沿革は、鎌倉時代に飯島氏の支配のもとで飯島郷の開発が進んだと記す
    kind: fact
    level: E2
    status: established
    sources:
    - x3-iijima-town-history
  - text: 江戸時代には幕府直轄領を支配する飯島陣屋が置かれ、延宝5年（1677年）に設置されたといい、明治維新後は伊那県庁として使われた
    kind: fact
    level: E2
    status: established
    sources:
    - x3-iijima-town-history
  - text: 明治8年（1875年）1月23日、飯島村・石曽根村・田切村・本郷村の4か村が合併して飯島村となった
    kind: fact
    level: E2
    status: established
    sources:
    - x3-iijima-town-history
  - text: 明治22年（1889年）4月1日の町村制施行の際、分離していた飯島村・田切村・本郷村の3か村が合併して改めて飯島村が発足した
    kind: fact
    level: E2
    status: established
    sources:
    - x3-iijima-town-history
  - text: 昭和29年（1954年）1月1日に飯島村は町制を施行して飯島町となり、昭和31年（1956年）9月30日に七久保村と合併して新・飯島町となった
    kind: fact
    level: E2
    status: established
    sources:
    - x3-iijima-town-report
  - text: 町名は中世の郷名「飯島郷」を受け継ぐ飯島村の名を、町制施行と合併を通じてそのまま引き継いだもので、新たに付けられた名ではない
    kind: fact
    level: E2
    status: established
    sources:
    - x3-iijima-town-history
    - x3-iijima-town-report
  - text: 「飯島」という地名の語源は、飯島氏が地名を名乗ったのか、地名が先にあったのかを含め、確認できる資料では確定していない
    kind: fact
    level: E2
    status: indeterminate
    sources:
    - x3-iijima-town-history
  - text: 飯島町の地方公共団体コードは203840である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 県庁だった町
    text: 飯島は、江戸時代には天領を治める陣屋の町だった。延宝5年（1677年）に置かれたという飯島陣屋は、明治維新のあと短期間だが「伊那県」の県庁として使われた。伊那県は1868年に置かれ1871年に廃止された短命の県で、その庁舎が陣屋の建物を転用したものだった。つまり飯島町は、ほんの数年とはいえ県庁所在地だったことがある。県庁が置かれたのは、この地が中世以来「飯島郷」の中心であり、江戸時代を通じて伊那谷北部の行政の拠点だったからである。
    sources:
    - x3-iijima-town-history
  relations:
  - pref/20
  - muni/20-中川村
  unknowns:
  - 「飯島郷」の文書上の初出と、飯島氏の出自（地名が先か氏が先か）
  - 「飯島」の語源についての専門的検討（角川日本地名大辞典・日本歴史地名大系の該当項を未確認）
  updated: '2026-11-13'
- id: muni/20-飯田市
  code: '202053'
  names:
    ja: 飯田市
    reading: いいだし
    aliases:
    - 飯田郷
    - 飯田町
    - 上飯田町
  user_terms:
  - 飯田の名前の由来
  - いいだし
  - 伊那谷の中心都市
  - 人形劇のまち
  - 水引のまち
  naming_type: その他（中世以来の郷名の継承）
  prefecture: 長野県
  homonyms: []
  summary: 「飯田」は伊那郡の郷名に由来する古い地名で、文献への登場は鎌倉時代とされる。市公式は語源を「結いの田」、つまり共同労働の田の意味から生まれたという言い伝えで説明している。室町時代に飯田城が築かれて発祥とし、江戸時代には堀氏2万石の城下町として栄えた。昭和12年（1937年）に飯田町と上飯田町が合併して飯田市が発足した。
  first_attestation:
    era: 鎌倉時代
    year_western: null
    document: 文献名は未特定
    note: 飯田市公式が「文献に登場するのは鎌倉時代のことである」とするが、具体的な文献名は示されておらず、本バッチでも特定できなかった
  claims:
  - text: 飯田市は、「飯田」という地名は文献に登場するのは鎌倉時代のことであるとし、鎌倉時代には郊戸庄飯田郷に地頭阿曾沼氏の存在が知られたと説明している
    kind: fact
    level: E2
    status: established
    sources:
    - n3-iida-city
  - text: 「飯田」という地名は「結いの田」つまり共同労働の田の意味から生まれたといわれているが、これは言い伝えとして伝えられる説明であり、確実な典拠は示されていない
    kind: fact
    level: E2
    status: indeterminate
    sources:
    - n3-iida-city
  - text: 室町時代に小笠原氏系の坂西氏が飯田城を築いたといわれ、このあたりが飯田の発祥とされる
    kind: fact
    level: E2
    status: established
    sources:
    - n3-iida-city
  - text: 毛利氏から京極氏のころの10年足らずの間に飯田城の大改修が行われ、本町・知久町・松尾町など城下町15町が新たに開発され、現在の飯田市街にみられる碁盤の目状の街路網の基盤がこのとき作られた
    kind: fact
    level: E2
    status: established
    sources:
    - n3-iida-city
  - text: 寛文12年（1672年）に堀親昌が2万石で入城し、以後明治まで196年間にわたって堀氏が飯田の統治を行った
    kind: fact
    level: E2
    status: established
    sources:
    - n3-iida-city
  - text: 昭和12年（1937年）4月1日に飯田町が上飯田町と合併し、飯田市として新しく発足した
    kind: fact
    level: E2
    status: established
    sources:
    - n3-iida-city
  - text: 飯田市の地方公共団体コードは202053である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: わずか10年で作られた碁盤の目の城下町
    text: 現在の飯田の市街を歩くと、道が碁盤の目状に整然と走っている。この街路網の基盤は、16世紀の終わりのわずか10年足らずの間に作られた。豊臣政権のもとで伊那郡を治めた毛利秀頼と、その婿の京極高知の時代に、飯田城の大改修と寺院の移転、伝馬の整備が行われ、本町・知久町・松尾町をはじめ城下町15町が新たに開発されたという。その後の藩主が代わっても町割りは受け継がれ、400年後のまちの骨格になっている。地名の「飯田」は中世の郷の名だが、まちの形は近世初頭の10年の産物である。
    sources:
    - n3-iida-city
  relations:
  - pref/20
  unknowns:
  - 「飯田」の初出とされる鎌倉時代の具体的な文献名は、市公式でも示されておらず、本バッチでも特定できなかった
  - 語源の「結いの田」説について、それを裏づける古い記録は確認できなかった
  updated: '2026-11-13'
- id: muni/20-飯綱町
  code: '205907'
  names:
    ja: 飯綱町
    reading: いいづなまち
    aliases:
    - 飯縄
  user_terms:
  - いいづなまち
  - 飯綱山のふもとの町
  - りんごの町
  naming_type: 合併新設（2005年に2村が合併し、公募と住民アンケートを経て、地域の山「飯縄山」にちなむ新町名を採用）
  prefecture: 長野県
  homonyms: []
  summary: 長野県上水内郡の町。2005年10月1日に牟礼村と三水村が合併して発足した。新町名は公募と住民アンケートを経て決められ、「飯綱町」が約51パーセントの支持で選ばれた。名前のもとになった山の正式な表記は「飯縄山（いいづなやま）」で、合併以前から両村共通の飯綱中学校などの施設名に「飯綱」が使われていたことが、町名への後押しになったと町は説明する。
  first_attestation:
    era: 平成17年
    year_western: 2005
    document: null
    note: 町名「飯綱町」の初出は2005年10月1日の飯綱町発足時。もとになった山名「飯縄山」は中世以来の修験の山として知られるが、その初出文書は本バッチでは確認していない
  claims:
  - text: 平成17年（2005年）10月1日、牟礼村と三水村が合併して飯綱町が発足した
    kind: fact
    level: E2
    status: established
    sources:
    - x3-iizuna-town-tokei
  - text: 新町名は平成16年（2004年）9月に牟礼村・三水村合併協議会が公募を行い、700件を超える応募があった
    kind: fact
    level: E2
    status: established
    sources:
    - x3-iizuna-town-tokei
  - text: 同年11月の住民アンケート（12歳以上）では「飯綱町」が約51パーセントの支持を得て最も多く、11月25日の第8回合併協議会で新町名が「飯綱町」に決定した
    kind: fact
    level: E2
    status: established
    sources:
    - x3-iizuna-town-tokei
  - text: アンケートでは「いいづな町」「飯綱村」「いいづな村」といった表記や町村の別が異なる候補も票を集め、「鳥居川町」などの候補もあった
    kind: fact
    level: E2
    status: established
    sources:
    - x3-iizuna-town-tokei
  - text: 町は、合併以前から飯綱中学校や病院など両村共通の公共施設に「飯綱」の名が存在し、住民に親しみやすく分かりやすい名称だったことを命名の背景として説明する
    kind: fact
    level: E2
    status: established
    sources:
    - x3-iizuna-town-tokei
  - text: 町名のもとになった山の名は「飯縄山」と書くのが正式で、町章も飯縄山と斑尾山をモチーフとしており、町名の「飯綱」と山名の「飯縄」では表記が異なる
    kind: fact
    level: E2
    status: established
    sources:
    - x3-iizuna-town-tokei
  - text: 飯綱町の地方公共団体コードは205907である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: アンケートで決まった町名
    text: 平成の大合併では新しい自治体名を公募で決めることが多かったが、飯綱町はその過程が数字つきで記録に残っている好例である。公募では700件を超える応募があり、20歳未満の応募者の約58パーセントが「飯綱」に関する名前を寄せた。住民アンケートでは「飯綱町」が51.23パーセントで1位だったが、「いいづな町」（20.31パーセント）という平仮名案も2位に入った。漢字にするか平仮名にするか、町にするか村にするか――名前の中身は早くから「いいづな」で固まっていて、最後に競われたのは表記の形だった。
    sources:
    - x3-iizuna-town-tokei
  relations:
  - pref/20
  - muni/20-信濃町
  unknowns:
  - 山名「飯縄山」の語源と初出（飯綱権現信仰との関係を含む）
  - 町名で「飯縄」ではなく「飯綱」の表記が選ばれた経緯の詳細
  updated: '2026-11-13'
- id: muni/20-駒ヶ根市
  code: '202100'
  names:
    ja: 駒ヶ根市
    reading: こまがねし
    aliases:
    - 駒ケ根市
    - 赤穂町
  user_terms:
  - こまがね
  - 駒ヶ岳の見える市
  - 中央アルプスの玄関口
  - 駒ヶ根の名前の由来
  naming_type: 新規命名
  prefecture: 長野県
  homonyms: []
  summary: 1954年に上伊那郡の赤穂町・宮田町・中沢村・伊那村が合併して発足した市。市名「駒ヶ根」は市制施行時に公募で新たに選ばれた名で、駒ヶ根市は「駒ヶ岳の麓のまち」という意味だと説明する。合併した町村の名は引き継がれておらず、「駒ヶ根」という名自体は隣の宮田村のキャンプ場の名などに先行して見られた。
  first_attestation:
    era: 昭和29年
    year_western: 1954
    document: null
    note: 市名としての初出は命名そのもの。市の公式資料は昭和29年の市制施行時に命名されたと記す。地名としての先行例（宮田村のキャンプ場名など）の命名年は未確認
  claims:
  - text: 総務省の全国地方公共団体コードで、駒ヶ根市の団体コードは202100と定められている
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  - text: 国立国会図書館の典拠および歴史的行政区域データセットによれば、1954年7月1日に上伊那郡の赤穂町・宮田町・中沢村・伊那村が合併して駒ヶ根市が発足した
    kind: fact
    level: E2
    status: established
    sources:
    - v3-ndl-komagane
    - v3-geoshape-komagane
  - text: 駒ヶ根市によれば、「駒ヶ根」という名前は駒ヶ岳の麓のまちという意味で、昭和29年（1954）の市制施行時に命名された
    kind: fact
    level: E2
    status: established
    sources:
    - v3-komagane-city
  - text: 『駒ヶ根市誌』の記述として、市名は小・中・高等学校に電話で応募を依頼した公募から、僅か3日で決定したと紹介されている
    kind: fact
    level: E5
    status: established
    sources:
    - v3-wiki-komagane
  - text: 「駒ヶ根」という名称は、隣の宮田村にあったキャンプ場の名称でもあったと紹介されている
    kind: fact
    level: E5
    status: established
    sources:
    - v3-wiki-komagane
  - text: 合併に参加した宮田町の大字宮田は、1956年（昭和31）9月30日に宮田村として駒ヶ根市から分立した
    kind: fact
    level: E5
    status: established
    sources:
    - v3-wiki-komagane
  - text: 2005年には飯島町・中川村との合併で「中央アルプス市」へ改名する計画があったが、住民投票で反対多数となり合併は断念された
    kind: fact
    level: E5
    status: established
    sources:
    - v3-wiki-komagane
  - text: 駒ヶ根市役所は旧赤穂町の区域である赤須町に置かれており、市の中心は赤穂地区である
    kind: fact
    level: E2
    status: established
    sources:
    - v3-geoshape-komagane
  column:
    title: 3日で決まった市名と、去っていった宮田
    text: 駒ヶ根の市名は、学校への電話での呼びかけによる公募から僅か3日で決まったと『駒ヶ根市誌』に基づく紹介が伝えています。ところが合併に参加した宮田町では合併への反対が根強く、市制施行の直後から分立の申し入れがあり、1956年には大字宮田が宮田村として分かれました。皮肉なことに、「駒ヶ根」という名はその宮田村にあったキャンプ場の名でもあったとされます。市名の決定の速さと、合併の合意形成の難しさが対照的な、昭和の大合併らしいエピソードです。
    sources:
    - v3-wiki-komagane
    - v3-komagane-city
  relations:
  - pref/20
  unknowns:
  - 「駒ヶ根」が駒（馬）の寝た姿に由来するという説は、市の公式資料では確認できなかった（市の公式説明は「駒ヶ岳の麓のまち」である）
  - 「駒ヶ根」の「根」の語源（麓・裾野の意かなど）について、専門辞典での裏付けは未確認
  - 宮田村のキャンプ場が「駒ヶ根」と名付けられた経緯は未確認
  updated: '2026-11-13'
- id: muni/20-高山村
  code: '205435'
  names:
    ja: 高山村
    reading: たかやまむら
    aliases: []
  user_terms:
  - 高山村 長野 合成地名
  - 高井と山田の村
  - 一茶ゆかりの里
  naming_type: 合併新設
  prefecture: 長野県
  homonyms:
  - muni/10-高山村
  summary: 昭和31年（1956年）に高井村と山田村が合併して生まれた村で、村名は高井の「高」と山田の「山」を合わせた合成地名とされる。群馬県の高山村も合成地名だが材料は尻高・中山で、字面の一致は偶然である。村内には御牧に由来するとされる「牧」「駒場」の地名も残る。
  first_attestation:
    era: 昭和31年
    year_western: 1956
    document: 高井村・山田村の合併による高山村の発足（1956年9月30日）
    note: 自治体名としての初出（合併時の合成地名）
  claims:
  - text: 昭和31年（1956年）9月30日、高井村と山田村が合併して高山村が発足した
    kind: fact
    level: E5
    status: established
    sources:
    - h6-takayama-nagano-wiki
  - text: 合成地名の一覧資料では、長野県上高井郡高山村は「高井村＋山田村」の合成地名とされる。すなわち高井の「高」と山田の「山」を合わせた名である
    kind: fact
    level: E5
    status: established
    sources:
    - h6-takayama-gosei-list
  - text: 群馬県の高山村も合成地名という点は共通するが、材料は尻高村と中山村であり、「高山」という結果の字面だけが偶然一致する（共通する層＝命名方式、異なる層＝元の村名と成立年）
    kind: fact
    level: E5
    status: established
    sources:
    - h6-takayama-gosei-list
    - h6-takayama-gosei-kitagawa
  - text: 合併前の高井村は明治22年に高井村・牧村の区域をもって発足し、山田村は中山村・奥山田村の区域をもって発足した村で、旧村名は現在の大字（高井・牧など）に残る
    kind: fact
    level: E5
    status: established
    sources:
    - h6-takayama-nagano-wiki
  - text: 村内には「牧」「駒場」の地名があり、奈良時代末に皇室の馬を飼育する御牧が各地に置かれたことと関係するとされる
    kind: fact
    level: E5
    status: established
    sources:
    - h6-takayama-nagano-wiki
  column:
    title: 同じレシピ、違う材料
    text: 高井村の「高」と山田村の「山」。群馬県高山村の尻高＋中山とまったく同じ作り方で、まったく同じ「高山村」ができました。面白いのは、この村の旧村域にはもう一つ「牧村」という村があり、いまも大字「牧」が残っていることです。御牧（皇室の馬の放牧地）に由来するとされる地名で、県境の向こうの二つの「南牧村」とも、馬と牧をめぐる地名の集まりとして眺めると一続きの風景に見えてきます。
    sources:
    - h6-takayama-nagano-wiki
    - h6-takayama-gosei-list
  relations:
  - pref/20
  - muni/10-高山村
  unknowns:
  - 昭和31年の合併時の命名経緯を記した村公式資料は未確認（合成地名の説明は一覧資料とWikipediaによる）
  - 「高井」「山田」という旧村名自体の語源は今回未調査
  updated: '2026-11-13'
- id: muni/20-高森町
