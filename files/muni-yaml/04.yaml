- id: muni/04-色麻町
  code: '044440'
  names:
    ja: 色麻町
    reading: しかまちょう
    aliases:
    - 色麻村
    - 色麻柵
  user_terms:
  - しかま
  - 色麻町の名前の由来
  - 加美郡色麻町
  - 色麻柵（古代の柵）
  naming_type: 一部の地名
  prefecture: 宮城県
  homonyms: []
  summary: 「色麻」は、天平9年（737年）の『続日本紀』に陸奥国の柵「色麻柵」として現れる古い地名で、『和名類聚抄』にも「之加萬（しかま）」の訓が見える。明治22年（1889年）に色麻村が発足し、昭和53年（1978年）に町制を施行して色麻町となった。しかまの語源そのものは確定していないが、柵を築いた大野東人の軍に加わった播磨国飾磨（しかま）出身の兵たちが、故郷を偲んで故地の名で呼んだという伝承が伝わる。
  first_attestation:
    era: 天平9年
    year_western: 737
    document: 『続日本紀』巻12（色麻柵）
    note: 町公式サイトが天平9年4月の条の原文を引用して紹介する「色麻柵」が、地名「色麻」の文献上の初出。延暦8年の条にも「色麻」が登場すると町公式は紹介する
  claims:
  - text: 総務省の全国地方公共団体コードで、色麻町の団体コードは044440と定められている
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  - text: 色麻町公式サイトは、『続日本紀』天平9年（737年）4月の条に、将軍大野東人が多賀柵を発ち色麻柵を拠点として出羽国へ向かった記述があることを、原文を引用して紹介している
    kind: fact
    level: E2
    status: established
    sources:
    - z10-shikama-town-history
  - text: 色麻町公式サイトによれば、『和名類聚抄』には「色麻」に「之加萬」の字があてられ「シカマ」の訓が与えられており、古代から「しかま」と呼ばれていたことが文献で裏づけられる
    kind: fact
    level: E2
    status: established
    sources:
    - z10-shikama-town-history
  - text: 色麻柵は、陸奥国と出羽国を結ぶ軍事直道を確保するための中継拠点であり、約6,000人の兵が集結したと町公式サイトは解説している
    kind: fact
    level: E2
    status: established
    sources:
    - z10-shikama-town-history
  - text: 明治22年（1889年）4月1日の市町村制施行により色麻村が発足し、昭和53年（1978年）4月1日に町制を施行して色麻町となった
    kind: fact
    level: E2
    status: established
    sources:
    - z10-shikama-maff-biomass
  - text: 天平9年（737年）に大野東人が当地に国府多賀城の前進基地として柵を築いた際、播磨国飾磨から移住した兵士たちが故郷を偲んでこの地を「色麻」と呼んだことに由来すると伝えられている
    kind: legend
    level: E2
    status: established
    sources:
    - z10-shikama-meti-plan
  column:
    title: 播磨の「飾磨」から来た名前？
    text: 色麻（しかま）という名には、遠く播磨国（現在の兵庫県）の飾磨（しかま）とのつながりを語る伝承があります。天平9年（737年）、陸奥按察使の大野東人が出羽への道をひらく拠点として当地に色麻柵を築いたとき、播磨国飾磨から移り住んだ兵士たちが、故郷を偲んでこの地を故地の名で呼んだのだと伝えられています。読みが「しかま」で一致するのは確かですが、これを裏づける当時の記録は残っておらず、あくまで伝承として紹介される話です。柵の瓦を焼いた日の出山瓦窯跡（国指定史跡）が残る当地は、奈良時代の東北経営の最前線だった土地でもあります。
    sources:
    - z10-shikama-meti-plan
    - z10-shikama-town-history
  relations:
  - pref/04
  - muni/04-加美町
  - muni/04-大崎市
  unknowns:
  - 「しかま」の語源そのものは確定しておらず、飾磨伝承を裏づける奈良時代の史料は確認できなかった
  - 色麻町四竈に鎮座する色麻神社と地名「色麻」の先後関係・関係の有無は、今回の調査では確認できなかった
  - 「色麻」が麻の染色（染め）と関係するという説明は、公的資料では確認できなかった
  - 『続日本紀』の「色麻」の記載は町公式サイトの引用経由で確認したもので、原文そのものは未読である
  updated: '2026-11-13'
- id: muni/04-蔵王町
  code: '043010'
  names:
    ja: 蔵王町
    reading: ざおうまち
    aliases:
    - 宮村
    - 円田村
  user_terms:
  - ざおう
  - 蔵王町の名前の由来
  - 刈田郡蔵王町
  - 遠刈田温泉
  naming_type: 合併新設
  prefecture: 宮城県
  homonyms: []
  summary: 昭和30年（1955年）に宮村と円田村が合併して誕生した町で、町名は「地域のシンボルである霊峰・蔵王からいただいた」と町統計書に明記されている。蔵王連峰の「蔵王」は、刈田嶺神社が祀る蔵王権現に由来すると説明される。合併に際して旧村名のどちらも採らず、仰ぎ見る山の名を町名にした事例である。
  first_attestation:
    era: 大同1年
    year_western: 806
    document: 国の法令資料（蔵王町統計書「沿革」による）
    note: 蔵王権現を祀る刈田嶺神社の名が法令資料に現れる年として町統計書が挙げるもので、山名「蔵王」自体の文献上の初出ではない。町名「蔵王町」の初出は昭和30年（1955年）の合併による命名そのもの
  claims:
  - text: 総務省の全国地方公共団体コードで、蔵王町の団体コードは043010と定められている
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  - text: 蔵王町統計書の沿革によれば、昭和30年（1955年）に宮村・円田村が合併して蔵王町が誕生し、町名は地域のシンボルである霊峰・蔵王からいただいた
    kind: fact
    level: E2
    status: established
    sources:
    - z10-zao-town-stats
  - text: 蔵王町統計書の沿革によれば、町域は明治11年（1878年）時点で宮・曲竹・矢附・円田・塩沢・平沢・小村崎の7か村で、明治22年（1889年）にうち6村が合併して円田村が誕生し、宮村と円田村の2村となった
    kind: fact
    level: E2
    status: established
    sources:
    - z10-zao-town-stats
  - text: 蔵王町統計書の沿革によれば、刈田嶺神社の名は大同1年（806年）に国の法令資料に現れる
    kind: fact
    level: E2
    status: established
    sources:
    - z10-zao-town-stats
  - text: 蔵王連峰の「蔵王」は、刈田岳山頂の奥宮と遠刈田の里宮からなる刈田嶺神社が祀っていた蔵王権現に由来すると説明されている
    kind: fact
    level: E5
    status: established
    sources:
    - z10-zao-katamine-wiki
  - text: 刈田嶺神社の社伝では、役小角が吉野山から蔵王権現を奉還して不忘山に祀り、山名も「蔵王山」と改められたと伝えられている
    kind: legend
    level: E5
    status: established
    sources:
    - z10-zao-katamine-wiki
  - text: 蔵王町統計書によれば、昭和34年（1959年）に制定された町章は「ざ」の字を図案化し、蔵王連峰と特産物の桃を表現したものである
    kind: fact
    level: E2
    status: established
    sources:
    - z10-zao-town-stats
  column:
    title: 山から名前を「いただいた」町
    text: 1955年の合併で生まれた蔵王町は、宮村と円田村のどちらの名も継がず、町統計書のことばを借りれば「地域のシンボルである霊峰・蔵王からいただいた」名前を名乗りました。西にそびえる蔵王連峰は、刈田嶺神社が祀る蔵王権現にちなむ山の名と説明されます。麓の遠刈田温泉は古くから蔵王参りと湯治の基地で、1962年に蔵王エコーラインが開通すると、山は「仰ぐ山」から「登る山」へと近づきました。町章にまで蔵王連峰と特産の桃を描くほど、この町の自己紹介は山と一体になっています。
    sources:
    - z10-zao-town-stats
    - z10-zao-katamine-wiki
  relations:
  - pref/04
  - muni/04-白石市
  - muni/04-川崎町
  - muni/04-村田町
  unknowns:
  - 山名「蔵王」の文献上の初出は、今回の調査では確認できなかった
  - 蔵王権現の奉祀の始期は刈田嶺神社の社伝の域を出ず、専門資料（角川日本地名大辞典・日本歴史地名大系等）での裏づけは未確認である
  updated: '2026-11-13'
- id: muni/04-角田市
  code: 042081
  names:
    ja: 角田市
    reading: かくだし
    aliases:
    - 角田町
    - 角田本郷
    - かく田
  user_terms:
  - かくだ
  - 宇宙のまち（JAXA角田宇宙センター）
  - 石川氏の城下町
  - 角田盆地の中心
  naming_type: 一部の地名
  prefecture: 宮城県
  homonyms: []
  summary: 宮城県南部、伊具盆地（角田盆地）の中心にある市。「角田」の名は戦国期に成立した郷村名で、天文7年（1538年）の段銭古帳に「かく田」と見えるのが記録上の初見級である。語源は専門辞典でも「明らかでない」とされ、四角に開けた田に求める説、「すみた（隅田）」の転訛とみる説などが定まっていない。戦国期は伊達一族の田手氏が拠り、慶長3年（1598年）に伊達一門筆頭の石川昭光が入封して以降、角田要害（臥牛城）の城下町として270年にわたり石川氏が治めた。1958年（昭和33年）に市制を施行して角田市となった。
  first_attestation:
    era: 天文7年
    year_western: 1538
    document: 天文段銭古帳（段銭帳）
    note: 『日本歴史地名大系』が、段銭古帳に後世の角田本郷にあたる地として段銭29貫250文の「かく田かう」が見えると紹介するもの（紹介形で記録）。地名の成立自体は戦国期と角川日本地名大辞典が述べる
  claims:
  - text: 角田市の地方公共団体コードは042081である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  - text: 角田町は1958年（昭和33年）に市制を施行して角田市となった
    kind: fact
    level: E3
    status: established
    sources:
    - t5-kakuda-kakugawa
  - text: 『日本歴史地名大系』は、天文7年（1538年）の段銭古帳に後世の角田本郷にあたる「かく田かう」が見えると紹介し、天文15年（1546年）の伊達晴宗の書状にも「角田」の地の動向を気遣う文が見える
    kind: fact
    level: E3
    status: established
    sources:
    - t5-kakuda-kotobank-hongo
  - text: 角川日本地名大辞典は「角田」の地名の由来は明らかでないとし、角田城門近くに四角に田が開けたからとする説、阿武隈川と西方山地の間に細長く田が開けたからとする説、「すみた（隅田）」と読んで隅田の意味に考える説（『宮城県地名考』）などを挙げて定説はないとする
    kind: fact
    level: E3
    status: indeterminate
    sources:
    - t5-kakuda-kakugawa
  - text: 戦国期の角田の領主は伊達一族の田手氏で、次いで伊達の重臣・伊達成実が入った
    kind: fact
    level: E3
    status: established
    sources:
    - t5-kakuda-kakugawa
  - text: 慶長3年（1598年）、伊達家一門筆頭の石川昭光が松山より移封されて角田に入り、臥牛城（角田館・角田要害）は以後明治維新に至るまで270年間、石川氏の居城となった
    kind: fact
    level: E2
    status: established
    sources:
    - t5-kakuda-city-castle
    - t5-kakuda-kakugawa
  - text: 石川氏は阿武隈川の治水・利水に尽力し、角田本郷は阿武隈川水運の中継地として繁栄し、米や生糸の集散地となった
    kind: fact
    level: E3
    status: established
    sources:
    - t5-kakuda-kakugawa
  column:
    title: 読みも決まらなかった「かくだ」
    text: 「角田」は今でこそ「かくだ」と読むが、角川日本地名大辞典が引く『宮城県地名考』は「すみた」と読んで隅田（すみだ）の意味に考える説を紹介する。実際、「角田」は全国的には「つのだ」「かくた」「すみた」など読みが分かれる姓・地名で、隅田・門田と通じる字でもある。天文の段銭古帳の表記も漢字ではなく「かく田かう」という音の記録だった。漢字の「角田」が定着し読みが「かくだ」に落ち着くまで、この地名は長いあいだ音として受け継がれてきたらしい。語源が「明らかでない」という専門辞典の結論は、この地名の古さの裏返しでもある。
    sources:
    - t5-kakuda-kakugawa
    - t5-kakuda-kotobank-hongo
  relations:
  - pref/04
  - muni/04-白石市
  unknowns:
  - 「角田」の語源は角川日本地名大辞典が「明らかでない」と明記する通り未解明で、四角田説・細長田説・隅田説のいずれも裏付けが得られなかった
  - 1958年（昭和33年）の市制施行が単独市制か合併を伴うものかは、今回の調査範囲では市公式資料で確認できなかった
  updated: '2026-11-13'
