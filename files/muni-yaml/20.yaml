  naming_type: 合併新設
  prefecture: 長野県
  homonyms: []
  summary: 長野県木曽郡の町。2005年（平成17年）11月1日に木曽福島町・日義村・開田村・三岳村が合併して発足した。町名「木曽」は、4町村に共通する郡名であり、木曽川・木曽谷・木曽路に通じる広域地名である。前身の中心地・木曽福島は中山道の福島宿と福島関所の地で、日義は木曽義仲が育った地と伝わる。
  first_attestation:
    era: 中世
    year_western: null
    document: null
    note: 「木曽町」という自治体名の初出は2005年の合併による命名そのもの。「木曽」という地名自体は中世以来の広域地名だが、本調査では一次資料での初出確認はしていない。
  claims:
  - text: 2005年（平成17年）11月1日に木曽福島町・日義村・開田村・三岳村が合併して木曽町となったことが、総務省の市町村合併資料集に記録されている
    kind: fact
    level: E2
    status: established
    sources:
    - x1-kiso-soumu-gapei
    - x1-kiso-ndl-kisofukushima
  - text: 前身の木曽福島町は1967年（昭和42年）4月に福島町と新開村が合併して成立した町で、その名は中山道の宿場町・関所の地であった「福島」に郡名の「木曽」を冠したものである
    kind: fact
    level: E2
    status: established
    sources:
    - x1-kiso-ndl-kisofukushima
    - x1-kiso-yoshinaka
  - text: 木曽郡はもと西筑摩郡と称し、1968年（昭和43年）5月1日に「木曽郡」へ改称された。すなわち「木曽」は2005年の町名に先立って郡名として公式化されていた
    kind: fact
    level: E5
    status: established
    sources:
    - x1-kisofukushima-wiki
  - text: 新町名「木曽」は、合併した4町村のいずれの名でもなく、4町村に共通する郡名・広域地名を採用したものとみられる
    kind: fact
    level: H
    status: inferred
    sources:
    - x1-kiso-soumu-gapei
  - text: 町域の日義は、平安時代末期の武将・木曽義仲（源義仲）が育った地と伝えられ、義仲館などの史跡があると長野県公式資料が紹介する
    kind: legend
    level: E2
    status: indeterminate
    sources:
    - x1-kiso-yoshinaka
  - text: 地方公共団体コードは204323である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 旧・三岳村の名前と王滝のややこしさ
    text: 木曽町に合併した旧三岳村の名は、1874年（明治7年）に黒沢村と三尾村が合併した際、「三尾」の「三」に御嶽山の「嶽」を組み合わせて作られたと三岳村誌が伝える。その背景には、当時お隣の王滝村が「おんたけ」と呼ばれていて混同を避けたかったという事情があったという。王滝の読みが変わったことで生まれた隣村の名前が、今は木曽町の大字として残っている。水資源機構のコラムが村誌の記述として紹介する話に基づく。
    sources:
    - x1-otaki-water
