    year_western: null
    document: 『日本歴史地名大系』「大東諸島」
    note: 大系は琉球王国時代から南北大東島の二島が「ウフアガリジマ（大東島）」と呼ばれたと記す。南大東島単独を指す呼称の文献上の初出は確認できなかった。村名としての「南大東」は1946年の村制施行に始まる
  claims:
  - text: 南大東村の地方公共団体コードは473570である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  - text: 南大東村は昭和21年（1946年）6月12日に村制が施行されて発足した自治体で、国立情報学研究所の歴史的行政区域データセットは村の有効期間の始期を同日とし、ブリタニカ国際大百科事典も1946年に村制が施行され南大東村・北大東村が発足したと記す
    kind: fact
    level: E2
    status: established
    sources:
    - s11-geoshape-minamidaito
    - s11-kotobank-daito-taikei
  - text: 南大東村公式サイトは「大東島という名前は、沖縄の古人が、遙か東の海の彼方にある島という意味の島言葉『ウフアガリジマ』からきていると言われる」と説明する
    kind: fact
    level: E2
    status: established
    sources:
    - s11-minamidaito-official-intro
  - text: 『角川日本地名大辞典』も、大東諸島は方言で「東の大きな島」を意味するウフアガリ島と呼ばれ、それに「大東」の漢字をあてたとする説を『島尻郡誌』を出典として紹介する
    kind: fact
    level: E3
    status: established
    sources:
    - s11-jlogos-kadokawa-okidaito
  - text: 明治18年（1885年）、南北大東島の二島に国標「沖縄県所轄」が建てられ、日本領土に編入された
    kind: fact
    level: E3
    status: established
    sources:
    - s11-kotobank-daito-taikei
  - text: 玉置半右衛門は明治32年（1899年）に開墾の許可を得て、明治33年（1900年）1月23日に八丈島出身者を中心とする開拓者23名が南大東島に上陸し、開拓が始まった
    kind: fact
    level: E2
    status: established
    sources:
    - s11-jfe-minamidaito
  - text: 戦前の南大東島では製糖会社が開拓と島の経営を担い、サトウキビのモノカルチャー経済が形成された。町村は置かれなかったため、自治体としての村の成立は1946年の村制施行まで待たなければならなかった
    kind: fact
    level: E2
    status: established
    sources:
    - s11-jfe-minamidaito
    - s11-kotobank-daito-taikei
  - text: 島の土地は開拓以来、製糖会社が所有し、耕作者である島民に所有権は認められなかった。戦後、島民は所有権の獲得を求めて陳情や期成会の運動を続け、1964年（昭和39年）7月30日に民政府布告第22号により土地所有権が認められて、島内の耕作地の所有者が大日本製糖ではなく島民であることが最終的に確認された
    kind: fact
    level: E2
    status: established
    sources:
    - s11-kitadaito-official-history
    - upg-t12-minamidaito-maki
  column:
    title: 会社が治めた島に、村が生まれた年
    text: 南大東島には、開拓が始まってから半世紀近く「村」がなかった。島を開いた玉置半右衛門の会社が事業を引き継いだ製糖会社とともに島の経営を握り、住民はサトウキビを作る小作人で、島の暮らしは会社の工場を中心に回っていた。選挙で長を選ぶ自治はなく、村制が施行されたのは戦後の昭和21年（1946年）のことである。それでも、耕作地が島民の土地であると最終的に確認されるのは昭和39年（1964年）まで待たなければならなかった。「南大東村」という名は古い島の名を受け継ぎながら、自治体の名としては沖縄の村々のなかでも新しい部類に入る。
    sources:
    - s11-jfe-minamidaito
    - s11-geoshape-minamidaito
    - s11-wiki-minamidaito
  relations:
  - pref/47
  - muni/47-北大東村
  unknowns:
  - ウフアガリという呼称の文献上の初出は確認できなかった
  - 南大東島だけを指す古称が近世の文献にあったかは確認できなかった
  - 1946年の村制施行の告示文そのもの（北大東村側で村公式年表に確認できた沖縄民政府告示第4号の1と同一の告示によるか）は、南大東村側の資料では直接確認できなかった
  - 玉置半右衛門が入植者と「30年後には土地を与える」約束を交わしたと伝えられるが、その約束自体は公的・学術資料では直接確認できなかった（所有権獲得運動と1964年の決着は村公式年表と学術論文で確認できる）
  updated: '2026-11-13'
- id: muni/47-南風原町
  code: '473502'
  names:
    ja: 南風原町
    reading: はえばるちょう
    aliases:
    - 南風原
    - ふぇーばる（沖縄語の現地読み）
  user_terms:
  - はえばる 読み方
  - 海に面していない町 沖縄
  - 南風原 由来 南風
  naming_type: 旧行政区画名の継承
  naming_note: 王府直轄地・南風原間切の名を継承し、1980年に町制を施行した
  formation: 単独発足
  prefecture: 沖縄県
  homonyms: []
  summary: 沖縄本島南部にある、沖縄県内で唯一海に面していない町。町名は王国時代の南風原間切に由来し、西原・真和志とともに首里王府直轄の「首里三平等」の一つ「南風之平等」に属した。沖縄語で南（南風）を「フェー」、原を「バル」といい、首里の南に広がる原野を意味する地名と説明される。1908年に南風原村が形成され、1980年4月1日に南風原町となった。
  first_attestation:
    era: 17世紀
    year_western: null
    document: 王府の行政区分「首里三平等」のうちの「南風之平等」
    note: 名前そのものの初出文献は特定できなかった。確認できる古い層は、王国時代に王府直轄地である三平等の一角「南風之平等（フェーヌフィラ）」として位置づけられていたことである。
  claims:
  - text: 町名は王国時代の間切名「南風原間切」を継承する。1908年（明治41年）の特別町村制の施行により11字からなる南風原村が形成され、1980年（昭和55年）4月1日に町制を施行して南風原町となった
    kind: fact
    level: E2
    status: established
    sources:
    - s9-haebaru-gaiyo
    - s9-estat-haebaru
  - text: 王府時代、南風原は西原・真和志とともに「首里三平等」の一つに組み込まれた王府直轄地で、財務省の広報誌は三平等を南風之平等（フェーヌフィラ）・真和志之平等（マージヌフィラ）・西之平等（ニシヌフィラ）と紹介している
    kind: fact
    level: E2
    status: established
    sources:
    - s9-mof-finance
    - s9-haebaru-gaiyo
  - text: 西原町の公式資料は西原を「南の南風原に対する名称」と位置づけており、南風原と西原は、首里を中心に南北一対をなす方位地名として成立したことがうかがえる
    kind: fact
    level: E2
    status: established
    sources:
    - s9-nishihara-fukki50
  - text: 語源については、沖縄語で南の方角・南風を「フェー（ハエ）」、原っぱ・原野を「バル」と呼ぶ語構成から、「首里の南にひらけた土地」を意味すると説明されるが、専門辞典による直接の確認は取れなかった
    kind: fact
    level: E5
    status: indeterminate
    sources:
    - s9-haebaru-note
  - text: 南風原町は沖縄県内で唯一、海に面していない町である。面積は10.76平方キロメートルで、県内41市町村の中で4番目に小さい
    kind: fact
    level: E2
    status: established
    sources:
    - s9-haebaru-gaiyo
  - text: 町の公式の標語は「黄金南風（くがにばえ）の平和郷・はえばる」であり、南風を讃える沖縄の美称「くがにばえ」が町の象徴として掲げられている
    kind: fact
    level: E2
    status: established
    sources:
    - s9-haebaru-gaiyo
  - text: 2002年（平成14年）10月17日に東風平町・大里村・具志頭村との4町村合併協議会が設置されたが、合併は実現せず、町公式の年表によれば協議会は2004年（平成16年）9月29日に解散した。その後、東風平町と具志頭村は合併して八重瀬町となった
    kind: fact
    level: E2
    status: established
    sources:
    - upg-t6-haebaru-nenpyo
    - s9-yaese-keikaku
  - text: 自治体コードは473502である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 海のない町が「南風」を名乗る理由
    text: 南風原町は沖縄県で唯一、海に面していない。それでも町の名前と標語は「南風」で満ちている。理由は位置にある。王国時代、この地は首里城の真南に広がる王府直轄の農村地帯で、「西原（実は北の原）」や真和志と並ぶ「首里三平等」の南端を担った。首里から見た「南の原野」、それが南風原である。町が掲げる「黄金南風（くがにばえ）」は南風を讃える沖縄の美称で、海を持たない内陸の町が、風と畑の記憶を名前の誇りとして守ってきたことがうかがえる。
    sources:
    - s9-haebaru-gaiyo
    - s9-mof-finance
  relations:
  - pref/47
  - muni/47-西原町
  - muni/47-八重瀬町
  unknowns:
  - 「南風原」という名の文献上の初出（間切名としての初出文献と年代）
  - フェー（南）＋バル（原）という語構成の語源説について、角川日本地名大辞典や日本歴史地名大系での記載の直接確認
  updated: '2026-11-13'
- id: muni/47-名護市
  code: '472093'
  names:
    ja: 名護市
    reading: なごし
    aliases:
    - 名護町
    - 那古
    - 那五
  user_terms:
  - なご
  - ナグ（地元の方音）
  - やんばるの中心都市
  - 名護湾のまち
  naming_type: 中心地名の継承
  formation: 合併新設
  prefecture: 沖縄県
  homonyms: []
  summary: 沖縄本島北部の中心都市で、昭和45年（1970年）8月1日に名護町と屋部村・羽地村・屋我地村・久志村が合併して市制を施行した。「名護」は15世紀の朝鮮の地理書『海東諸国紀』に「那五」と記される古い地名で、地元の方音は「ナグ」。語源は名護湾の波の穏やかさに結びつける凪（なぎ）説のほか、平坦地とする説、砂浜の波の音とする説などがあり、専門辞典でも諸説併記で確定していない。
  first_attestation:
    era: 文明3年
    year_western: 1471
    document: 『海東諸国紀』
    note: 朝鮮で編まれた『海東諸国紀』に「那五」と記されるのが確認できる古い用例の一つであると『日本歴史地名大系』が紹介している（二次資料経由の確認）。その後、嘉靖41年（1562年）の琉球碑文には「那古」、『おもろさうし』には「なこ」と記される
  claims:
  - text: 名護市の地方公共団体コードは472093である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  - text: 名護市は昭和45年（1970年）8月1日、名護町と屋部・羽地・屋我地・久志の4村が合併して市制を施行した
    kind: fact
    level: E3
    status: established
    sources:
    - s5-nago-kotobank-shi
  - text: 「名護」の古い用例として、『海東諸国紀』には「那五」、首里城にあった嘉靖41年（1562年）の碑文には「那古」、『おもろさうし』には「なこ」、『琉球神道記』には「那呉」と記されることが『日本歴史地名大系』で紹介されている
    kind: fact
    level: E3
    status: established
    sources:
    - s5-nago-kotobank-magiri
  - text: 地名の意味については、名護湾の波の穏やかな様子、平坦地、砂浜で波の音の和やかなところなど諸説があり、定説は得られていないことが『日本歴史地名大系』で紹介されている
    kind: fact
    level: E3
    status: contested
    sources:
    - s5-nago-kotobank-magiri
  - text: 地元の方音は「ナグ」で、近世の名護村も「なぐ」と読まれており、和語の「なごむ（和む）」や「凪」に結びつける説明はこの音に基づいている
    kind: fact
    level: E3
    status: established
    sources:
    - s5-nago-kotobank-magiri
    - s5-nago-kotobank
  - text: 近世には国頭方に属する名護間切が置かれ、間切番所のある名護村がこの地域の中心だった
    kind: fact
    level: E3
    status: established
    sources:
    - s5-nago-kotobank-magiri
  - text: 市は、豊かな海の幸や海外文化をもたらすところをうたった古謡「おもろさうし」の「あきみよ」に由来する言葉「あけみお」を、「あけみおのまち・名護」としてまちの象徴に位置づけている
    kind: fact
    level: E2
    status: established
    sources:
    - s5-nago-plan
  column:
    title: 「ナゴ」か「ナグ」か――読みに残る琉球語
    text: 名護の地元での呼び名は、沖縄語で「ナグ」。近世の文書でも名護村は「なぐ」と読まれてきた。ところが自治体名の公式の読みは「なごし」で、本土の人が「和（なご）やか」「凪（なぎ）」と結びつけやすい音に寄せられている。面白いのは市内の名護城跡で、こちらは「ナゴグスク」ではなく「ナングスク」と読む通称が定着している。同じ「名護」の字でも、市の名前は和風に、城の名前は琉球風に読まれるという二重の読みが同居しているのである。地名の読みは、標準化される過程で元の音を少しずつ離れていくが、このまちではその途中の姿が今も見える。
    sources:
    - s5-nago-kotobank-magiri
    - s5-nago-kotobank
  relations:
  - pref/47
  unknowns:
  - 語源の諸説（凪・平坦地・波の音など）のうちどれが正しいかは、専門辞典でも確定していなかった
  - 『海東諸国紀』「那五」の原文は二次資料経由でしか確認できていない
  - 名護市教育委員会の地名調査資料など郷土資料による語源の検討は未確認である
  updated: '2026-11-13'
- id: muni/47-嘉手納町
  code: '473251'
  names:
    ja: 嘉手納町
    reading: かでなちょう
    aliases:
    - かでぃなー
  user_terms:
  - 嘉手納基地の町
  - かでなの由来
  - 嘉手納ってどう読むの
  naming_type: 中心地名の継承
  formation: 分村・分立
  prefecture: 沖縄県
  homonyms: []
  summary: 北谷間切の村・嘉手納を前身とする町で、沖縄語では「かでぃなー」。戦前は県営鉄道の終着駅や県立農林学校を擁する中頭の中心だったが、戦後、嘉手納飛行場によって北谷村が南北に分断され、1948年に分村して嘉手納村が誕生し、1976年に町制を施行した。現在も町面積の8割以上が米軍基地である。「かでな」の語源は定かではなく、「カリー（縁起が良い）」と「ナ（土地）」の結合とする伝承がある。
  first_attestation:
    era: 近世（琉球王国時代）
    year_western: null
    document: おもろさうし・琉球国旧記
    note: 嘉手納町公式「嘉手納町の歴史」は、屋良・嘉手納の往時の様子が『おもろさうし』や『琉球国旧記』等の記述からうかがえると紹介する。嘉手納の具体的な表記形と年次は未確認
  claims:
  - text: 王朝時代、現在の町域は北谷間切に属する村々で、中でも屋良・嘉手納・野國の地域が早くから村として開けたといわれる（嘉手納町公式「嘉手納町の歴史」）
    kind: fact
    level: E2
    status: established
    sources:
    - s8-kadena-official
  - text: 1908年（明治41年）の町村制で嘉手納は北谷村の字となり、戦前は県営鉄道嘉手納線の終着駅や県立農林学校・製糖工場がある中頭郡の中心であった
    kind: fact
    level: E2
    status: established
    sources:
    - s8-kadena-official
    - s8-kadena-kotobank
  - text: 1948年（昭和23年）12月4日、嘉手納飛行場内の通行禁止によって北谷村が南北に分断されたため、北谷村から分村して嘉手納村が誕生した（嘉手納町公式）
    kind: fact
    level: E2
    status: established
    sources:
    - s8-kadena-official
  - text: 1976年（昭和51年）に町制を施行して嘉手納町となり、町域の8割以上が軍用地で、比率では県内第1の基地の町である（ブリタニカ国際大百科事典小項目事典）
    kind: fact
    level: E3
    status: established
    sources:
    - s8-kadena-kotobank
  - text: 『日本歴史地名大系』は、町内に嘉手納（かでぃなー）グスク・屋良グスク・国直（くんのーい）グスクがあるとし、嘉手納の現地の読みを「かでぃなー」とする
    kind: fact
    level: E3
    status: established
    sources:
    - s8-kadena-kotobank
  - text: 嘉手納町公式は、1605年に中国から甘藷を持ち帰ったとされる野國總管を町内の字野國の出身として紹介し、町民の誇りとなっているとする
    kind: fact
    level: E2
    status: established
    sources:
    - s8-kadena-official
  - text: 「嘉手納」の由来は定かではないが、一説には、縁起が良いという意味の「カリー」と、土地という意味の「ナ」が一緒になって、「カリー・ナ」が「カデナ」になったと伝えられる（琉球朝日放送「地デジカ地名辞典」）
    kind: legend
    level: E4
    status: indeterminate
    sources:
    - s8-kadena-qab
  - text: 地方公共団体コードは473251である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 基地に分断されて生まれた町
    text: 嘉手納という名そのものは、北谷間切の村の名として古くからあった。ところが自治体としての嘉手納は、戦争の産物である。嘉手納飛行場が建設されて村の行き来が断たれ、南北に分断された北谷村の北側が、1948年に嘉手納村として独立した。戦前、この一帯は軽便鉄道の終着駅と県立農林学校を擁する中頭の中心だった。その中心地の名が、基地の町名として残ったのである。なお「かでな」の語源は定かでなく、「カリー（縁起が良い）」と「ナ（土地）」が結びついたという伝承が伝わるにとどまる。
    sources:
    - s8-kadena-official
    - s8-kadena-kotobank
  relations:
  - pref/47
  - muni/47-北谷町
  - muni/47-読谷村
  unknowns:
  - 「かでな」の語源には定説がなく、も専門辞典に語源の明示は確認できなかった（カリー＋ナ説は伝承として記録した）
  - 『おもろさうし』等における嘉手納の具体的な表記形・初出年次は未確認
  updated: '2026-11-13'
- id: muni/47-国頭村
  code: '473014'
  names:
    ja: 国頭村
    reading: くにがみそん
    aliases:
