records:
- id: muni/16-上市町
  code: '163228'
  names:
    ja: 上市町
    reading: かみいちまち
    aliases:
    - 上市野
    - 三日市
  user_terms:
  - かみいち
  - 剱岳の町
  - 大岩そうめんの町
  naming_type: 中心地名の継承
  naming_note: 定期市の名「上の市」に由来する市場町の名の継承
  formation: 編入合併
  prefecture: 富山県
  homonyms: []
  summary: 剱岳を仰ぐ上市川沿いの市場町。「上市」は、法音寺の門前で三のつく日に開かれていた「三日市」に対して、その上にあたる東に開かれた「上の市」に由来すると町公式が説明する。古くは上市野と称された一帯の中心地で、1889年に町制を施行し、昭和の合併で現在の町域となった。
  first_attestation:
    era: 江戸時代
    year_western: null
    document: null
    note: 「上の市」がいつ開かれたかを示す一次資料は確認できていない。町は「上市野と称され、町の前身となった」と説明し、文政7年（1824年）の資料に450戸が記録されるというが、「上市」の語の文献上の初出は特定できていない
  claims:
  - text: 町公式の説明によれば、山岳信仰の道筋であった当地には法音寺の門前町を中心に三のつく日に「三日市」が開かれ、その後、三日市の上にあたる東に「上の市」が開かれて呉東随一の賑わいをもつ町並がつくられ、これが「上市」の名の由来である
    kind: fact
    level: E2
    status: established
    sources:
    - v7-kamiichi-town
  - text: 『日本歴史地名大系』は『上市町誌』を引いて、上市の地名は若杉五社明神の門前市として栄えた三日市の上流に市が立てられたことから名付けられたという。門前市の主体を法音寺とする町公式の説明と、五社明神とする町誌の説明とで細部が異なる
    kind: fact
    level: E3
    status: contested
    sources:
    - v7-kamiichi-kotobank-taikei
  - text: 一帯は古く「上市野」と称され、上市の町並はその中心であった
    kind: fact
    level: E2
    status: established
    sources:
    - v7-kamiichi-town
  - text: 明治22年（1889年）の町村制実施によって上市町となり、昭和16年（1941年）に音杉村を編入、昭和28年（1953年）に5村と合併し、昭和29年（1954年）に2村を編入して現在の町域となった
    kind: fact
    level: E4
    status: established
    sources:
    - v7-kamiichi-jtb
    - v7-kamiichi-town
  - text: 町章（昭和29年制定）は「上市」の頭文字を図案化したもので、真ん中の山は町のシンボルである剱岳を表す
    kind: fact
    level: E2
    status: established
    sources:
    - v7-kamiichi-town
  - text: 町域の東南部にそびえる剱岳は古くから山岳信仰の山で、山頂付近からは平安時代のものと推定される錫杖頭が発見されている
    kind: fact
    level: E2
    status: established
    sources:
    - v7-kamiichi-town
  - text: 上市町の地方公共団体コードは163228である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 「三日市」の上にできたから「上市」
    text: 上市の名は、市場の上下関係から生まれた。もとこの地には、法音寺の門前で月の三のつく日に立つ「三日市」があった。やがてその上流・東側にも市が立つようになり、こちらは「上の市」と呼ばれた。上の市は呉東随一といわれるほど栄え、町並そのものが「上市」と呼ばれるようになったという。つまり上市は、固有名詞として発明された名ではなく、「あの上の方の市」という呼び方がそのまま地名になった市場町の名である。剱岳への登山道の入口という立地が、山の信仰と平野の交易をこの一点に集めた。
    sources:
    - v7-kamiichi-town
    - v7-kamiichi-kotobank-taikei
  relations:
  - pref/16
  - muni/16-立山町
  - muni/16-舟橋村
  unknowns:
  - 「上の市」が開かれた正確な時期と、「上市」の語の文献上の初出
  - 三日市の門前市の主体が法音寺か若杉五社明神か（町公式と町誌で説明が異なる）について、一次資料による確認はできていない
  - 「下市」にあたる市がどこにあったかは資料では確認できなかった
  updated: '2026-11-13'
- id: muni/16-入善町
  code: '163422'
  names:
    ja: 入善町
    reading: にゅうぜんまち
    aliases:
    - 入膳村
    - 入善荘
  user_terms:
  - にゅうぜん
  - 黒部川扇状地の町
  - 杉沢の沢スギ
  - ジャンボスイカの町
  naming_type: 旧行政区画名の継承
  naming_note: 中世の荘園名「入善荘」以来の地名の継承。江戸時代は「入膳」とも書かれた
  formation: 合併新設
  prefecture: 富山県
  homonyms: []
  summary: 黒部川扇状地の中央の町。地名は12世紀前半に東大寺の荘園として成立した「入善荘」に遡る。江戸時代の村名は「入膳村」とも書かれ、1889年の町制時に「入善町」となった。「入善」という語そのものの語源は、確認できる公的・専門資料では確定していない。
  first_attestation:
    era: 平安時代後期（12世紀前半）
    year_western: null
    document: null
    note: 町公式資料は「12世紀前半には東大寺の荘園、入善荘が成立した」と述べるが、入善荘の名が見える具体的な文書名・年次は特定できていない。「入善」の確実な初出は未確認
  claims:
  - text: 町公式の総合計画によれば、12世紀前半には東大寺の荘園である入善荘が成立し、南北朝時代には飯野に小佐味荘も存在した
    kind: fact
    level: E2
    status: established
    sources:
    - v7-nyuzen-town-plan
  - text: 1889年（明治22年）4月1日、下新川郡入膳村・入膳新村・元青島村・君島村・神林新村の区域をもって入善町が発足した。もとの村名は「入膳」と書かれ、町制の際に「入善」の表記となった
    kind: fact
    level: E5
    status: established
    sources:
    - v7-nyuzen-wiki
  - text: 江戸時代の文書には「入膳村」と書かれており、地元の黒部川扇状地研究所では「入善」と「入膳」の違いや地名の由来が古文書解読の研究テーマになっている
    kind: fact
    level: E4
    status: established
    sources:
    - v7-nyuzen-senjochi
  - text: 昭和28年（1953年）10月、入善町と上原村・青木村・飯野村・小摺戸村・新屋村・椚山村・横山村の1町7か村が新設合併して新しい入善町が発足し、昭和34年（1959年）1月には舟見町が編入されて現在に至っている
    kind: fact
    level: E2
    status: established
    sources:
    - v7-nyuzen-town-plan
  - text: 町域はもと新川県、ついで石川県に属したが、明治16年（1883年）に本町出身の県会議員・米澤紋三郎らが分県運動を進め、石川県から分かれて富山県となった
    kind: fact
    level: E2
    status: established
    sources:
    - v7-nyuzen-town-plan
  - text: 一帯は古く「黒部四十八ヶ瀬」と称され、親不知とともに北国往還最大の難所として知られた
    kind: fact
    level: E2
    status: established
    sources:
    - v7-nyuzen-town-plan
  - text: 「入善」という語の語源については、町公式資料や確認した専門資料に確定的な説明が見当たらず、未詳である
    kind: fact
    level: E2
    status: indeterminate
    sources:
    - v7-nyuzen-town-plan
  - text: 入善町の地方公共団体コードは163422である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 「入善」と「入膳」――一字違いの800年
    text: 入善の古い書き方は「入膳」だった。膳は食事を盛る器、転じて食事そのものを指す字である。江戸時代の入膳村の古文書を解読する地元の研究会では、「入善」と「入膳」の違いや地名の由来そのものが話題になるという。一方、荘園の名としては「入善荘」と書かれてきた。供膳のための荘園だったのか、善の字に何か願いが込められたのかは、いまのところ確かな資料がない。漢字一字の揺れの向こうに、中世の荘園と近世の村のあいだの長い時間が横たわっている。
    sources:
    - v7-nyuzen-senjochi
    - v7-nyuzen-town-plan
  relations:
  - pref/16
  unknowns:
  - 「入善」の語源（「入膳」からの転化か、別の由来か）は、公的・専門資料で確定できなかった
  - 入善荘の名が見える最古の文書の書名と年次
  - 1889年の町制時に「入膳」から「入善」へ表記が改められた経緯・理由
  updated: '2026-11-13'
- id: muni/16-南砺市
  code: '162108'
  names:
    ja: 南砺市
    reading: なんとし
    aliases: []
  user_terms:
  - なんと
  - 五箇山
  - 井波彫刻
  - 城端
  - 福光
  naming_type: 合成地名
  formation: 合併新設
  prefecture: 富山県
  homonyms: []
  summary: 南砺市は、平成16年（2004）に東礪波郡の7町村と西礪波郡福光町の4町4村が合併して生まれた自治体で、市名は全国公募と合併協議会の投票で決められた。「南砺」は、旧礪波郡に属したこの地域が砺波地域の南部にあたることにちなむ合成地名である。合併前の中心地のうち井波・城端は寺院の門前町、福野・福光は市場町として発展した歴史を持つ。
  first_attestation:
    era: 平成16年
    year_western: 2004
    document: 南砺市の発足（4町4村の新設合併）
    note: 市名「南砺」は2004年の合併に際して新たに作られた名称で、それ以前に「南砺」という地名の用例はない
  claims:
  - text: 平成16年（2004）11月1日に、東礪波郡城端町・平村・上平村・利賀村・井波町・井口村・福野町と西礪波郡福光町の4町4村が合併して南砺市が誕生した
    kind: fact
    level: E2
    status: established
    sources:
    - n2-nanto-city
  - text: 新市名は2003年4月から同年4月30日までの公募で全国から5,699通・2,752種類の応募があり、「越南市」「光南市」「南砺市」「八乙女市」の4案に絞り込まれたうえ、同年8月2日の合併協議会における委員の投票で「南砺市」と決定された
    kind: fact
    level: E5
    status: established
    sources:
    - n2-nanto-wiki
  - text: 「南砺」は、合併した8町村がいずれも旧礪波郡（東礪波郡・西礪波郡）に属し、砺波地域の南部に位置することにちなむ合成地名である
    kind: fact
    level: E5
    status: established
    sources:
    - n2-nanto-wiki
  - text: 南砺市公式の沿革によれば、中世に瑞泉寺が建立され善徳寺が加賀から移ったことで旧井波町と旧城端町は門前町として栄え、旧福野町や旧福光町は市場町として発展した
    kind: fact
    level: E2
    status: established
    sources:
    - n2-nanto-city
  - text: 南砺市公式によれば、市域の五箇山の合掌造り集落は平成7年（1995）にユネスコの世界遺産に登録された
    kind: fact
    level: E2
    status: established
    sources:
    - n2-nanto-city
  - text: 総務省の全国地方公共団体コードで、南砺市の団体コードは162108と定められている
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 2,752種類の名前から選ばれた「南砺」
    text: 南砺市の名前は、全国公募に集まった5,699通、2,752種類もの案の中から選ばれました。最終候補には「越南市」「光南市」「八乙女市」も残りました。どの旧町名も採用せず、郡の名「礪波」に方角の「南」を組み合わせた合成地名になったのは、門前町の井波・城端、市場町の福野・福光、合掌造りの五箇山という個性の強い地域同士の合併ならではの落としどころでした。
    sources:
    - n2-nanto-wiki
  relations:
  - pref/16
  - muni/16-砺波市
  unknowns:
  - 公募と投票の経緯はWikipedia経由で、合併協議会の一次資料（協議会だより等）での確認は未了
  - 城端・福光・井波・福野など旧中心地の地名そのものの語源は、本レコードでは未確認
  - 読み「なんと」の決定経緯（公募時の指定か協議会での決定か）は未確認
  updated: '2026-11-13'
- id: muni/16-富山市
  code: '162019'
  names:
    ja: 富山市
    reading: とやまし
    aliases:
    - 富山町
    - 外山郷
    - 富山城下
  user_terms:
  - 富山市の名前の由来
  - 富山市はなぜ富山というのか
  - 外山と富山の違い
  - 富山市が2005年に合併した経緯
  naming_type: 藩名・城名から
  formation: 合併新設
  prefecture: 富山県
  homonyms: []
  summary: 現在の富山市は、平成17年（2005）に旧富山市と周辺6町村の新設合併で発足した自治体だが、市名自体は明治22年（1889）の市制施行以来のもので、富山藩の城下町「富山」の名を受け継いでいる。その「とやま」は室町期の郷名「外山郷」に遡り、「富山」の字は戦国期以降に広がった。
  first_attestation:
    era: 応永5年
    year_western: 1398
    document: 吉見詮頼寄進状
    note: 「富山」ではなく「外山郷（越中国外山郷地頭職）」という表記での初見（富山市郷土博物館蔵）
  claims:
  - text: 応永5年（1398）5月3日の吉見詮頼寄進状に「越中国外山郷地頭職」とあり、「とやま」の文献上の初見は「外山」の表記だった
    kind: fact
    level: E2
    status: established
    sources:
    - c-toyama-joka
  - text: 「外山」の語源については、呉羽山の外側に位置することによるとする説のほか、深山に対する外山とする説などもあり、確定していない
    kind: fact
    level: E3
    status: contested
    sources:
    - c-toyama-weblio
  - text: もとは藤井村と称された地が、真言宗の藤井山富山（ふせん）寺にちなんで富山と改称したという伝承が『三州志』などに伝えられる
    kind: legend
    level: E3
    status: established
    sources:
    - c-toyama-joka
  - text: 「富山」という表記は戦国時代に現れ、江戸時代には「外山」と「富山」の両表記が使われた
    kind: fact
    level: E2
    status: established
    sources:
    - c-toyama-weblio
  - text: 明治22年（1889）4月1日に市制が施行されて富山市が誕生した。当時の人口は約5万7千人で、日本海側では金沢に次ぐ規模であり、明治29年の調べでは全国14位の人口だった
    kind: fact
    level: E2
    status: established
    sources:
    - c-cap-toyama-museum
  - text: 初代富山市長には、旧富山藩主・前田家の前田則邦（富山藩9代藩主の孫）が任命され、藩政期との人的な連続があった
    kind: fact
    level: E2
    status: established
    sources:
    - c-cap-toyama-museum
  - text: 現在の富山市は、平成17年（2005）4月1日に旧富山市・大沢野町・大山町・八尾町・婦中町・山田村・細入村の7市町村が新設合併して発足した自治体であり、市名は1889年以来の「富山市」を受け継いだ
    kind: fact
    level: E4
    status: established
    sources:
    - c-cap-toyama-uub
  - text: 総務省の全国地方公共団体コードで、富山市の団体コードは162019と定められている
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 藩主の孫が、初代市長になった
    text: 明治22年（1889）に富山市が誕生したとき、初代市長に選ばれたのは旧富山藩主・前田家の前田則邦でした。当時の市長は市民の直接選挙ではなく、市会が推した候補から内務大臣が任命する仕組みで、則邦は富山藩9代藩主の孫にあたります。廃藩置県から18年、まちの顔は藩主の家系から選ばれたのです。しかも当時の富山市は人口約5万7千人、日本海側では金沢に次ぐ大都市で、人口では全国14位（明治29年）という存在感がありました。
    sources:
    - c-cap-toyama-museum
  relations:
  - pref/16
  unknowns:
  - 「外山」から「富山」へ字が替わった正確な時期と理由は確定していない（県レコードでも未確認として記録）
  - 外山郷の成立時期は特定できていない
  - 2005年の新設合併の経緯（合併協議の公式記録）については市公式資料での直接確認は未了
  updated: '2026-11-13'
- id: muni/16-射水市
  code: '162116'
  names:
    ja: 射水市
    reading: いみずし
    aliases:
    - 伊弥頭
    - 伊美都
  user_terms:
  - イミズ
  - 射水市の名前の由来
  - 新湊
  - 小杉
  naming_type: 旧行政区画名の継承
  formation: 合併新設
  prefecture: 富山県
  homonyms: []
  summary: 現在の射水市は、平成17年（2005）に新湊市と射水郡の4町村が新設合併して生まれた自治体で、市名は合併協議会の公募で最多となった「射水市」が選ばれた。その「射水」は古代の郡名に遡り、『先代旧事本紀』の「伊弥頭国造」に見える「いみづ」が古い用例で、奈良時代に表記が「射水」に統一されたと考えられている。語源は、水の湧き出る土地を表す「イ」「ミズ」に求める説が市公式に紹介されている。
  first_attestation:
    era: 天平18年
    year_western: 746
    document: 『万葉集』（大伴家持の長歌）
    note: 市の統計書が「射水」という地名の初見として挙げる、746年に越中守として赴任した大伴家持の長歌。なお『先代旧事本紀』には「伊彌頭国造」の名が見え、「いみづ」の読み自体の古い用例とされる
  claims:
  - text: 平成17年（2005）11月1日に新湊市・射水郡小杉町・大門町・大島町・下村の5市町村が新設合併して射水市が発足した
    kind: fact
    level: E2
    status: established
    sources:
    - n2-imizu-city-history
    - n2-imizu-uub
  - text: 合併協議会が行った新市名の公募では1,934点・507通りの名称案が寄せられ、「射水市」が581点で最多を占めて新市名に決定された。候補には「万葉市」「海王市」などもあった
    kind: fact
    level: E5
    status: established
    sources:
    - n2-imizu-wiki
  - text: 射水市公式は、「射水」の語源について、水の湧出を表す言葉「イ」「ミズ」にちなみ、古代の人々がこの地を「イミズ」と呼んだと考えられると説明している
    kind: fact
    level: E2
    status: established
    sources:
    - n2-imizu-city-name
  - text: 射水市公式は、『先代旧事本紀』に伊弥頭（イミズ）を支配した豪族「伊弥頭国造（いみづのくにみやつこ）」が記されていることを紹介している
    kind: fact
    level: E2
    status: established
    sources:
    - n2-imizu-city-name
  - text: 射水市公式は、行政区域としての「射水郡」の名は、大伴家持がまとめたとされる『万葉集』の中で初めて登場すると紹介している
    kind: fact
    level: E2
    status: established
    sources:
    - n2-imizu-city-name
  - text: 射水市公式は、『続日本紀』が伝える和銅6年（713）の好字二字令のころ、それまで「伊弥頭」「伊美都」などとまちまちだった地名表記が「射水」に統一されたと考えられると紹介している
    kind: fact
    level: E2
    status: established
    sources:
    - n2-imizu-city-name
  - text: 奈良時代の射水郡は現在の射水市域よりはるかに広く、高岡市と氷見市の大部分、富山市の一部を含んでいた
    kind: fact
    level: E2
    status: established
    sources:
    - n2-imizu-city-name
  - text: 総務省の全国地方公共団体コードで、射水市の団体コードは162116と定められている
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 万葉の歌人が「初見」を残したまち
    text: 射水市が市の統計書で伝える「射水」の初見は、天平18年（746）に越中の国守として伏木に赴任した大伴家持の長歌です。家持は任地の風物を多くの歌に詠み、その中に奈呉の海（現在の新湊）や三島野（大島・大門一帯）の地名も残されました。いまの市域は当時の射水郡の一部にすぎませんが、市名は万葉の歌人が歌った郡の名を、平成の合併でそのまま受け継いだことになります。
    sources:
    - n2-imizu-city-history
  relations:
  - pref/16
  unknowns:
  - 語源の「イ」「ミズ」説について、専門辞典（角川日本地名大辞典・日本歴史地名大系）での裏づけは未確認
  - 『万葉集』における「射水郡」の具体的用例の巻・歌番号は未確認
  - 新市名公募の結果は合併協議会の一次資料では未確認（Wikipedia経由の情報として記録）
  updated: '2026-11-13'
- id: muni/16-小矢部市
  code: '162094'
  names:
    ja: 小矢部市
    reading: おやべし
    aliases:
    - 小矢部村
    - 大矢部村
    - おやへ
  user_terms:
  - おやべ
  - メルヘン建築のまち
  - 倶利伽羅峠
  - 石動
  naming_type: 中心地名の継承
  formation: 合併新設
  prefecture: 富山県
  homonyms: []
  summary: 富山県西端の市で、1962年に石動町と砺中町が合併して市制施行した。市名は小矢部川に由来し、川の名はさらに上流にあった小矢部村に由来すると国土交通省が説明する、地名が村から川へ、川から市へ渡った連鎖である。村の名は戦国時代の文書に「おやへ」「大矢部村」と見える。中心地の石動は北陸道の宿場町で、市内には世界の名建築を模した「メルヘン建築」35棟が残る。
  first_attestation:
    era: 戦国時代
    year_western: 1583
    document: 知行方目録（敦賀郡古文書）
    note: 『日本歴史地名大系』が「天正11年（1583）8月20日の知行方目録によれば、佐々成政は『利波郡おやへ』の100俵などを石塚藤三郎に与えている」と紹介するもの。原文を直接確認したものではない
  claims:
  - text: 天正11年（1583）8月20日の知行方目録（敦賀郡古文書）によれば、佐々成政は「利波郡おやへ」の100俵を石塚藤三郎に与えている（『日本歴史地名大系』）
    kind: fact
    level: E3
    status: established
    sources:
    - u5-oyabe-kotobank
  - text: 天正14年（1586）10月12日の前田利秀寄進状（永伝寺文書）には「越中礪波郡之内大矢部村」と見え、「小矢部」と「大矢部」の表記が併存していた（『日本歴史地名大系』）
    kind: fact
    level: E3
    status: established
    sources:
    - u5-oyabe-kotobank
  - text: 小矢部川の名前は、市の上流に小矢部という村があったことに由来すると国土交通省が説明する。すなわち川名は村名から来ており、市名はその川にちなむ
    kind: fact
    level: E2
    status: established
    sources:
    - u5-oyabe-mlit
  - text: 『万葉集』に大伴家持が詠んだ「射水川」は、当時庄川と合流していた小矢部川を指すといわれている（国土交通省）
    kind: fact
    level: E2
    status: established
    sources:
    - u5-oyabe-mlit
  - text: 1962年8月1日、西礪波郡石動町と砺中町が合併・市制施行して小矢部市が誕生した
    kind: fact
    level: E4
    status: established
    sources:
    - u5-oyabe-rail
  - text: 中心市街地の石動の名は、天正13年（1585）に前田利秀が石動山の伊須流岐比古神社の虚空蔵菩薩をこの地に移したことに由来し、「新しい石動」の意味で「今石動」と名付けられたと伝えられる
    kind: fact
    level: E4
    status: contested
    sources:
    - u5-oyabe-rail
  - text: 市内には世界の有名な建築を模した公共建築「メルヘン建築」が35棟建てられたが、1992年を最後に新築は打ち切られ、現在は観光資源として活用されている
    kind: fact
    level: E4
    status: established
    sources:
    - u5-oyabe-rail
  column:
    title: 村から川へ、川から市へ――名前のバトンリレー
    text: 小矢部川は「川のそばの村」から名をもらい、小矢部市はその川から名をもらった。ふつう川の名は土地の名より古いと思われがちだが、この地では順序が逆で、戦国時代の文書に残る小さな村の名が、川全体の名となり、1962年には市の名になった。しかも当時は「大矢部村」という表記も並んでいた。「小」が残った側の名が、最終的に市名として生き残ったことになる。
    sources:
    - u5-oyabe-mlit
    - u5-oyabe-kotobank
  relations:
  - pref/16
  unknowns:
  - 「矢部」の語源は未確定。古代の職能集団「矢作部」に結びつける説などが唱えられるが、公的・専門的な裏づけは確認できなかった
  - 「小矢部」と「大矢部」の対比が何に対する大小だったのか（対になる集落の場所を含む）は未確認
  - 1962年の市制時に市名として「小矢部」を選んだ経緯の公式記録は未確認
  updated: '2026-11-13'
- id: muni/16-朝日町
  code: '163431'
  names:
    ja: 朝日町
    reading: あさひまち
    aliases: []
  user_terms:
  - 朝日町の名前の由来
  - 富山の朝日町は朝日岳にちなむ
  - 朝日町は山形と富山と三重にある
  naming_type: 自然地名から
  formation: 合併新設
  prefecture: 富山県
  homonyms:
  - muni/06-朝日町
  - muni/24-朝日町
  summary: 昭和29年（1954年）8月に泊町・大家庄村・山崎村・南保村・五箇荘村・宮崎村・境村の1町6村が合併して誕生した。町公式は「名峰朝日岳にちなんで『朝日町』と名付けられ」と由来を明示しており、3つの朝日町のうち唯一、山名由来が公式に確定している例である。同じ昭和29年の合併で生まれた山形県朝日町にも朝日岳（大朝日岳）があるが、そちらには由来の明示がない。
  first_attestation:
    era: 昭和29年
    year_western: 1954
    document: 朝日町の成立（1954年8月の合併。朝日町公式「朝日町の概要」）
    note: 自治体としての「朝日町」の初出。由来の元である朝日岳の山名自体の初出は未確認
  claims:
  - text: 昭和29年（1954年）8月、泊町・山崎村・大家庄村・南保村・五箇庄村・宮崎村・境村の1町6村が合併し、朝日町が誕生した
    kind: fact
    level: E2
    status: established
    sources:
    - h4-toyama-asahi-gaiyo
  - text: 町公式は「名峰朝日岳にちなんで『朝日町』と名付けられ」と明記しており、町名が朝日岳に由来することが公式に確定している
    kind: fact
    level: E2
    status: established
    sources:
    - h4-toyama-asahi-gaiyo
  - text: 【共通する層】山形県朝日町も同じ昭和29年（1954年）の合併で生まれ、朝日連峰の主峰・大朝日岳を擁する山麓の町である。2つの朝日町は、同じ年に生まれ、同じ読みの山の名と結びつく点で共通する
    kind: fact
    level: E2
    status: established
    sources:
    - h4-yamagata-asahi-gikai
    - h4-toyama-asahi-gaiyo
  - text: 【異なる層】ただし山名由来を公式に明示しているのは富山側だけで、山形側には同様の明示が確認できない。また三重県朝日町の「朝日」は山名ではなく、大海人皇子（天武天皇）が朝日を拝んだという故事にあやかったもので、命名の型が異なる
    kind: fact
    level: E2
    status: established
    sources:
    - h4-toyama-asahi-gaiyo
    - h4-yamagata-asahi-gikai
    - h4-mie-asahi-aramashi
  - text: 命名の背景にある泊は、江戸時代には加賀藩の統治下で境に関所が置かれた街道筋の宿場町として栄えたと町公式は説明する
    kind: fact
    level: E2
    status: established
    sources:
    - h4-toyama-asahi-gaiyo
  column:
    title: 朝日岳は2つある
    text: 富山の朝日岳と、山形の大朝日岳は、別の山である。なのに山麓の町はどちらも「朝日町」を名乗り、しかも同じ1954年に生まれた。富山側は「名峰朝日岳にちなんで」と公式に宣言していて、山への誇りがそのまま町の名になっている。同名の町が並ぶと紛らわしいが、山の名を誇る気持ちは両町に共通しているのだろう。
    sources:
    - h4-toyama-asahi-gaiyo
    - h4-yamagata-asahi-gikai
  relations:
  - pref/16
  - muni/06-朝日町
  - muni/24-朝日町
  unknowns:
  - 朝日岳の山名自体の由来（なぜ「朝日」と呼ばれるか）の確かな資料は未確認
  - 1954年11月20日の野中村編入の町公式資料での再確認は未実施
  updated: '2026-11-13'
- id: muni/16-氷見市
  code: '162051'
  names:
    ja: 氷見市
    reading: ひみし
    aliases:
    - 比美
  user_terms:
  - ひみ
  - 氷見の寒ブリ
  - 氷見市の名前の由来
  - 比美乃江
  naming_type: 中心地名の継承
  formation: 分村・分立
  prefecture: 富山県
  homonyms: []
  summary: 氷見市は、氷見町が昭和27年（1952）に市制を施行して生まれ、昭和29年（1954）までには氷見郡の全域を占める「一郡一市」となった。「ひみ」の名は『万葉集』に「比美の江」と歌われたのが古い用例で、「氷見」と書く理由については、市公式が狼煙の「火見」説や立山連峰の万年雪説など4説を併記し、定説はない。
  first_attestation:
    era: 天平19年
    year_western: 747
    document: 『万葉集』巻17（大伴家持の長歌）
    note: 日本歴史地名大系によれば、『万葉集』に「ひみ」が見えるのは天平19年（747）9月26日作の長歌に「都奈之取る比美の江過ぎて」と歌われた一首のみとされる。表記は「比美」で、現在の氷見市沿岸の入江を指すと考えられている
  claims:
  - text: 日本歴史地名大系によれば、『万葉集』に「ひみ」の地名が見えるのは、大伴家持が天平19年（747）に詠んだ長歌（巻17）の「都奈之取る比美の江過ぎて」の一首のみである
    kind: fact
    level: E3
    status: established
    sources:
    - n2-himi-kotobank
  - text: 氷見市公式は、「氷見」の由来には諸説あるとして、蝦夷防備の狼煙を監視する場所で火を見るところから「火見」と言った説、海をへだてて立山連峰の万年雪が見えるところから「氷見」と言った説、海の漁り火が見えるところから「火見」と言った説、海が干し上がって陸地になったところから「干海（ひみ）」と読んだ説の4説を紹介している
    kind: fact
    level: E2
    status: contested
    sources:
    - n2-himi-city
  - text: 日本歴史地名大系は、『平家物語』巻7に寿永2年（1183）の木曾義仲の進軍にあたって氷見の湊が記されていることを紹介しており、中世には湊として知られていた
    kind: fact
    level: E3
    status: established
    sources:
    - n2-himi-kotobank
  - text: 氷見市公式によれば、明治22年（1889）に氷見町ほか20か村が誕生し、明治29年（1896）には射水郡から分かれて氷見郡となった
    kind: fact
    level: E2
    status: established
    sources:
    - n2-himi-city
  - text: 氷見市公式によれば、昭和27年（1952）から市制を施行し、その後昭和29年（1954）までに3回の合併を行って、全国でもまれに見る一郡一市となった
    kind: fact
    level: E2
    status: established
    sources:
    - n2-himi-city
  - text: 総務省の全国地方公共団体コードで、氷見市の団体コードは162051と定められている
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 「氷見と書いて、ひみと読むのは全国的にも珍しい」
    text: 氷見市の公式ページは、地名の由来の項で「『氷見』と書いて『ひみ』読ませるのは全国的にも珍しく、愛媛県西条市に同じ読み方をする町名がありますが、その他には無いものと思います。もし有りましたら是非教えてください」と呼びかけています。市自身が諸説を併記して決着をつけていない読み方で、万葉集では「比美」と書かれていました。語源の決着は、市民からの情報提供に開かれたままなのです。
    sources:
    - n2-himi-city
  relations:
  - pref/16
  - muni/16-射水市
  unknowns:
  - 「ひみ」の語源の定説は未確認（市公式も4説を併記し、決着していない）
  - 昭和27年（1952）の市制施行の正確な月日と、編入した村の構成は市公式ページでは確認できていない
  - 「氷見」の表記が定着した時期と経緯は未確認
  updated: '2026-11-13'
- id: muni/16-滑川市
  code: '162060'
  names:
    ja: 滑川市
    reading: なめりかわし
    aliases:
    - 滑河
    - 波入川
    - 滑川町
  user_terms:
  - なめりかわ
  - すべりかわ（誤読）
  - ホタルイカのまち
  - 滑川市の名前の由来
  naming_type: 自然地名から
  formation: 単独発足
  prefecture: 富山県
  homonyms: []
  summary: 滑川の名は、市域を流れる川「波入川（なみいりがわ、現在の中川）」に発祥するとされる。中世にこの川の名に「滑河」の漢字が当てられて地名となり、のち「滑川」となった。1954年（昭和29年）に滑川町が市制を施行して滑川市となった。読みは「なめりかわ」で、「すべりかわ」は誤読として知られる。
  first_attestation:
    era: 文治2年
    year_western: 1186
    document: null
    note: 「滑河」の初見とされる年。滑川市立博物館の刊行物を引く Wikipedia の紹介によるもので、初見の文書そのものは確認できていない
  claims:
  - text: 総務省の全国地方公共団体コードで、滑川市の団体コードは162060と定められている
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  - text: 滑川市によれば、市章は市の源名「波入川」にちなんで図案化されたものである
    kind: fact
    level: E2
    status: established
    sources:
    - u6-namerikawa-handbook70
  - text: 滑川市立博物館の刊行物を引く資料によれば、滑川の名は市の中央を流れる「波入川（なみいりがわ、現在の中川）」より発祥した
    kind: fact
    level: E5
    status: established
    sources:
    - u6-namerikawa-wiki
  - text: 同資料によれば、中世に波入川の名に「滑河」の漢字が当てられて地名「滑河」となり、その初見は1186年とされる
    kind: fact
    level: E5
    status: established
    sources:
    - u6-namerikawa-wiki
  - text: 伝承では、名越朝時が承久の乱（1221年）の際に波入川のほとりに立ち、景観と読みが鎌倉の滑川に似ているため「滑河」と呼んだと伝えられるが、比企朝宗の事績が外孫の朝時のエピソードへ脚色されて伝えられたものと考えられている
    kind: legend
    level: E5
    status: established
    sources:
    - u6-namerikawa-wiki
  - text: 町村制施行時の町名選定では「滑川」と古代の郷名に由来する「加積」が最終候補に残り、最終決定を一任された富山県知事が知名度を考慮して「滑川」を選んだとされる
    kind: fact
    level: E5
    status: established
    sources:
    - u6-namerikawa-wiki
  - text: 滑川市によれば、滑川町は昭和29年（1954年）3月に市制を施行して滑川市となった
    kind: fact
    level: E2
    status: established
    sources:
    - u6-namerikawa-handbook70
  - text: 滑川市によれば、市は神秘的な光を放つホタルイカのまちとして全国的に知られている
    kind: fact
    level: E2
    status: established
    sources:
    - u6-namerikawa-handbook70
  column:
    title: 「すべらない街」という逆手
    text: 「滑川」は「なめりかわ」と読みますが、「すべりかわ」と読み間違える人が後を絶ちません。市はこれを逆手に取り、「すべりかわ」じゃない「なめりかわ」！「すべらない街 滑川市」というキャッチコピーを2023年に発表しました。受験生には縁起のよい冗談として受け止められていますが、名の由来は意外に古く、中世に「滑河」と書かれた川の名に遡ります。
    sources:
    - u6-namerikawa-wiki
  relations:
  - pref/16
  unknowns:
  - 「滑河」の初見（1186年）の文書そのものは未確認で、滑川市立博物館の刊行物を引く二次的な紹介による
  - 「波入川」の名の由来（日本海の荒波が河口から遡上したためとする言い伝え）は郷土資料レベルの伝承で、専門辞典での裏付けは未確認
  - 「川が滑るように流れる地形に由来する」という俗説は、確認した公的資料・専門資料には見当たらなかった
  updated: '2026-11-13'
- id: muni/16-砺波市
  code: '162086'
  names:
    ja: 砺波市
    reading: となみし
    aliases:
    - 礪波
    - 利波
  user_terms:
  - となみ
  - 砺波平野
  - 散居村
  - チューリップのまち
  naming_type: 旧行政区画名の継承
  formation: 合併新設
  prefecture: 富山県
  homonyms: []
  summary: 砺波市は、昭和27年（1952）に1町5村の合併で生まれた砺波町が昭和29年（1954）に市制を施行し、平成16年（2004）に庄川町との対等合併で現在の市となった。「砺波」は古代の郡名「礪波郡」に由来し、和銅3年（710）の平城宮木簡には「利波郡」、『万葉集』には「礪波」の表記が見える。ただし「となみ」の語源自体は確定していない。
  first_attestation:
    era: 和銅3年
    year_western: 710
    document: 平城宮跡出土木簡「越中国利波郡川上里」銘
    note: 日本歴史地名大系が郡名の早い用例として挙げるもので、表記は「利波」。「礪波」の表記は『万葉集』巻17の題詞「礪波郡雄神河辺作歌一首」などに見える
  claims:
  - text: 日本歴史地名大系によれば、郡名「となみ」の早い用例は平城宮跡出土の和銅3年（710）の木簡に「越中国利波郡川上里」とあるもので、「礪波」の表記は『万葉集』巻17の題詞をはじめ、天平宝字3年（759）の東大寺越中国諸郡庄園総券や礪波郡伊加流伎開田地図（正倉院蔵）に見える
    kind: fact
    level: E3
    status: established
    sources:
    - n2-tonami-kotobank-gun
  - text: 日本歴史地名大系によれば、「となみ」の訓は『和名類聚抄』に「止奈美」、『万葉集』巻17・巻18に「刀奈美」と記されている
    kind: fact
    level: E3
    status: established
    sources:
    - n2-tonami-kotobank-gun
  - text: 「となみ」の語源については、日本歴史地名大系の礪波郡の項にも確定的な説明はなく、定説は確認できていない
    kind: fact
    level: E3
    status: indeterminate
    sources:
    - n2-tonami-kotobank-gun
  - text: 昭和27年（1952）4月1日に出町を中心に林村・油田村・庄下村・中野村・五鹿屋村の1町5村が合併して砺波町が誕生し、昭和29年（1954）4月1日に市制を施行して砺波市となった
    kind: fact
    level: E2
    status: established
    sources:
    - n2-tonami-city
  - text: 砺波市『文化財保存活用地域計画』によれば、砺波町は昭和29年（1954）1月15日に5村、同年3月1日に4村を編入して町域を広げたうえで市制を施行した
    kind: fact
    level: E2
    status: established
    sources:
    - n2-tonami-city-plan
  - text: 砺波市のデジタルアーカイブによれば、1954年の市制は面積や人口の要件を満たさないまま町村合併特例法の特例をもって許可されたもので、砺波市は富山県下で8番目の市として誕生した
    kind: fact
    level: E2
    status: established
    sources:
    - n2-tonami-archive
  - text: 平成16年（2004）11月1日に旧砺波市と庄川町が対等合併し、現在の砺波市が誕生した
    kind: fact
    level: E2
    status: established
    sources:
    - n2-tonami-city
  - text: 総務省の全国地方公共団体コードで、砺波市の団体コードは162086と定められている
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 「利波」と書かれた木簡、「礪波」と書かれた万葉集
    text: 砺波という地名は、奈良時代の文書の中で表記が揺れています。和銅3年（710）の平城宮木簡では「利波郡」、大伴家持の歌を収める『万葉集』では題詞に「礪波郡」とあり、『和名類聚抄』は訓を「止奈美」と示します。いまの「砺波」は、もとの「礪波」の略字にあたります。千年以上読み続けられてきた「となみ」ですが、その意味するところは今もはっきりしないままです。
    sources:
    - n2-tonami-kotobank-gun
  relations:
  - pref/16
  - muni/16-南砺市
  unknowns:
  - 「となみ」の語源の本格的な検討（角川日本地名大辞典の礪波郡の項など）は未確認
  - 礪波郡がいつ、どの郡から分かれて成立したかは未確認
  - 1952年の合併で新町名に「砺波」が選ばれた経緯の公式記録は未確認
  updated: '2026-11-13'
- id: muni/16-立山町
  code: '163236'
  names:
    ja: 立山町
    reading: たてやままち
    aliases:
    - 雄山町
    - 立山村
    - 芦峅寺
  user_terms:
  - たてやま
  - 立山黒部アルペンルートの玄関口
  - 称名滝の町
  - 芦峅寺
  naming_type: 文献・故事から命名
  naming_note: 1954年の合併時に霊峰立山の名にちなんで命名
  formation: 編入合併
  prefecture: 富山県
  homonyms: []
  summary: 立山連峰を町域に含む山麓の町。町名は、1954年1月の1町5村の合併の際に「霊峰立山の名にちなんで」新しく命名された。山名「立山」は『万葉集』に大伴家持が詠んだ「たちやま」が文献上の初出とされ、町内には立山信仰の拠点・芦峅寺があって、山の名と信仰の歴史がそのまま町の名の土台になっている。
  first_attestation:
    era: 天平19年
    year_western: 747
    document: 『万葉集』巻17（大伴家持「立山賦」）
    note: 山名「立山（たちやま）」の文献上の初出。町名「立山町」としての初出は1954年の合併時の命名で、層が異なる
  claims:
  - text: 昭和29年（1954年）1月10日、雄山町・利田村・上段村・東谷村・釜ケ渕村・立山村の1町5村が合併して立山町が誕生し、同年7月には新川村全域が編入合併した
    kind: fact
    level: E2
    status: established
    sources:
    - v7-tateyama-town-70th
    - v7-tateyama-pref
  - text: 富山県の公式紹介によれば、新町名は「霊峰立山の名にちなんで立山町と命名」されたものである
    kind: fact
    level: E2
    status: established
    sources:
    - v7-tateyama-pref
  - text: 山名としての「立山」が文献に表れた最初は『万葉集』で、越中守として赴任した大伴家持が天平19年（747年）4月に長歌「立山賦」（巻17）などを詠んだ
    kind: fact
    level: E3
    status: established
    sources:
    - v7-tateyama-kotobank
  - text: 家持の詠んだ「たちやま」は劔岳を含めた立山連峰全体の総称であったとされる
    kind: fact
    level: E3
    status: established
    sources:
    - v7-tateyama-kotobank
  - text: 「立山」の語源については、入山を禁じた「断ち山」によるとする説や、神の宿る「館山」によるとする説などがあり、定説はない
    kind: fact
    level: E3
    status: contested
    sources:
    - v7-tateyama-kotobank
  - text: 町内の芦峅寺は立山信仰の拠点で、登拝案内の版木や立山曼荼羅など立山信仰に関する用具1,243点が国の重要有形民俗文化財に指定されている
    kind: fact
    level: E2
    status: established
    sources:
    - v7-tateyama-museum
  - text: 立山の開山は、大宝元年（701年）に越中の城主・佐伯有若の子、佐伯有頼によってなされたという説が知られているが、開山については諸説がある
    kind: legend
    level: E4
    status: indeterminate
    sources:
    - v7-tateyama-jtb
  - text: 立山町の地方公共団体コードは163236である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 町名は「山の名」をそのまま借りた
    text: 立山町という名は、合併前のどの町村の名でもない。1954年の合併で、雄山町・立山村を含む6町村は、そろって頭上にそびえる霊峰の名を新しい町の名に選んだ。山の名「立山」は、奈良時代に大伴家持が「たちやま」と詠んで以来の古い名で、江戸時代には芦峅寺の衆徒が立山曼荼羅を携えて全国を回り、人々をこの山へ誘った。信仰の山のふもとの町が、行政の名としても山の名を名乗る――町名は、1200年以上人々が仰いできた山への向き合い方の表明でもある。
    sources:
    - v7-tateyama-pref
    - v7-tateyama-kotobank
    - v7-tateyama-museum
  relations:
  - pref/16
  - muni/16-上市町
  - muni/16-舟橋村
  unknowns:
  - 1954年の合併時に「立山町」の名がどのような手続き（公募・協議）で選ばれたかの記録は、確認できていない
  - 「立山」の語源の定説（「断ち山」説・「館山」説などはいずれも後世の説明とされる）
  updated: '2026-11-13'
- id: muni/16-舟橋村
  code: '163210'
  names:
    ja: 舟橋村
    reading: ふなはしむら
    aliases:
    - 舟橋
  user_terms:
  - ふなはし
  - 日本一小さい村
  - 北陸唯一の村
  - 駅に図書館のある村
  naming_type: 中心地名の継承
  naming_note: 中世以来の村名「舟橋」の継承
  formation: 合併新設
  prefecture: 富山県
  homonyms: []
  summary: 面積3.47平方キロで日本一小さい自治体。「舟橋」は中世から続く村名で、文献上の初出は応永26年（1419年）の書状に見える「舟橋村」とされる。名の由来は、細川宗十郎が舟を連ねて架けた橋（舟橋）に村ができたとする『越中志徴』の伝承と、白岩川に架けられた舟橋によるとする説がある。1889年の発足以来、一度も合併していない。
  first_attestation:
    era: 応永26年
    year_western: 1419
    document: 高野宗秀書状（『極性寺暦代略記』所収、『日本歴史地名大系』が紹介）
    note: 書状には高野宗秀が「舟橋村道場」に屋敷と田二反を寄進したとあり、「舟橋村」の名の確実な初出とみられる。原文は未読で、地名大系経由の確認である
  claims:
  - text: 『日本歴史地名大系』によれば、応永26年（1419年）8月25日の高野宗秀書状（極性寺暦代略記）には、高野宗秀が舟橋村道場に屋敷と田二反を寄進したことが見え、「舟橋村」の名はこの頃すでに用いられていた
    kind: fact
    level: E2
    status: established
    sources:
    - v7-funahashi-kotobank-taikei
  - text: 『日本歴史地名大系』は『越中志徴』を引いて、地名は「かつて細川宗十郎が架けた舟橋の橋詰に村立てしたことに由来するという」と紹介する
    kind: fact
    level: E3
    status: established
    sources:
    - v7-funahashi-kotobank-taikei
  - text: 村名の由来については諸説があり、室町時代に仏生寺城主の細川宗（曾）十郎が城の堀に舟を連ねて橋を架けたことによるとする説と、白岩川に架けられた舟橋に由来するとする説がある
    kind: fact
    level: E5
    status: contested
    sources:
    - v7-funahashi-wiki
  - text: 村は白岩川と栃津川の合流点に位置し、舟橋の名は川に舟を並べて架ける橋の通行と結びついた地名である
    kind: fact
    level: E3
    status: established
    sources:
    - v7-funahashi-kotobank-taikei
  - text: 明治22年（1889年）4月1日の町村制施行により、舟橋村・仏生寺村・竹内村など15か村の区域をもって上新川郡舟橋村が発足し、以後一度も合併を行っていない
    kind: fact
    level: E5
    status: established
    sources:
    - v7-funahashi-wiki
  - text: 村の面積は3.47平方キロメートルで、岐阜県墨俣町が消滅した2006年3月27日以降、日本で最も面積が小さい基礎自治体となっている
    kind: fact
    level: E5
    status: established
    sources:
    - v7-funahashi-wiki
  - text: 村域はもと富山県内で最小の市町村であり、2005年には富山県唯一の村、2006年には北陸3県唯一の村となった
    kind: fact
    level: E5
    status: established
    sources:
    - v7-funahashi-wiki
  - text: 舟橋村の地方公共団体コードは163210である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 日本一小さい村の、600年前の名前
    text: 舟橋村は面積3.47平方キロ、日本一小さい自治体である。ところがこの小さな村の名は、応永26年（1419年）の書状に「舟橋村」と見える600年越しの古名である。由来とされるのは、川に舟を連ねて架けた橋――舟橋である。細川宗十郎という人物が橋を架け、その橋詰に村ができたと『越中志徴』は伝える。村は1889年の発足以来一度も合併せず、平成の大合併の波の中でも自立を選んだ。日本一小さい村が守っているのは、日本でも指折りに古い村名の一つでもある。
    sources:
    - v7-funahashi-kotobank-taikei
    - v7-funahashi-wiki
  relations:
  - pref/16
  - muni/16-上市町
  - muni/16-立山町
  unknowns:
  - 細川宗十郎の実在と舟橋架橋の年代（『越中志徴』の伝承の域を出ない）
  - 舟橋が架けられたのが仏生寺城の堀か白岩川か、資料によって説明が異なる点の決着
  - 1419年より古い「舟橋」の用例があるかどうか
  updated: '2026-11-13'
- id: muni/16-高岡市
  code: '162027'
  names:
    ja: 高岡市
    reading: たかおかし
    aliases:
    - 関野
    - 高岡町
  user_terms:
  - 高岡市の名前の由来
  - 高岡はなぜ高岡というのか
  - 詩経から名付けられたまち
  - 前田利長が開いた城下町
  naming_type: 文献・故事から命名
  formation: 合併新設
  prefecture: 富山県
  homonyms: []
  summary: 慶長14年（1609年）、加賀藩2代藩主・前田利長が「関野」と呼ばれた荒野に高岡城と城下町を開いた際、『詩経』の一節「鳳凰鳴矣、于彼高岡」にちなんで「高岡」と命名したと伝えられる、文献引用型の命名である。明治22年（1889年）に市制を施行した全国でも最初期の市の一つで、平成17年（2005年）に福岡町と合併して現在の市域となった。
  first_attestation:
    era: 慶長14年
    year_western: 1609
    document: 前田利長による高岡城築城と開町（『角川日本地名大辞典』の記述を高岡市歴史まちづくり計画が引用）
    note: それまで関野・関野ヶ原・志貴野などと呼ばれた地に、命名によって生まれた地名
  claims:
  - text: 現在の高岡市街地は、古くは関野・関野ヶ原・志貴野などと称した荒野であった
    kind: fact
    level: E3
    status: established
    sources:
    - l3-takaoka-rekimachi
  - text: 慶長14年（1609年）9月、加賀藩2代藩主の前田利長が当地に築城し、魚津から居所を移したことにより城下町が開かれた
    kind: fact
    level: E3
    status: established
    sources:
    - l3-takaoka-rekimachi
  - text: 地名「高岡」は、「鳳凰鳴矣、于彼高岡」という『詩経』の一節にちなんで付けられたという
    kind: fact
    level: E3
    status: established
    sources:
    - l3-takaoka-rekimachi
  - text: 利長は城下建設にあたって北陸道のルートを高岡を経由するよう変更し、この道に沿って碁盤目状の町割りを行い、移住した町人には土地の無償提供などの特権を与えた
    kind: fact
    level: E2
    status: established
    sources:
    - l3-takaoka-rekimachi
  - text: 「高岡」という地名は、総持寺の快雄が利長に授けたものとも言われる
    kind: fact
    level: E2
    status: established
    sources:
    - l3-takaoka-rekimachi
  - text: 明治22年（1889年）、市制町村制の施行により「高岡市」という行政単位が成立した
    kind: fact
    level: E2
    status: established
    sources:
    - l3-takaoka-kihonkoso
  - text: 平成17年（2005年）11月1日、旧高岡市と旧福岡町が合併し、現在の高岡市が誕生した
    kind: fact
    level: E2
    status: established
    sources:
    - l3-takaoka-gaiyo
  - text: 総務省「地方公共団体コード一覧」では、高岡市のコードは162027とされる
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 城を捨てて町を残した
    text: 高岡城は築城からわずか6年後、元和元年（1615年）の一国一城令で廃城となった。しかし3代藩主・前田利常は元和6年（1620年）に町人の高岡からの転出を禁止し、城のない城下町は物資集散の商都として生き延びた。城主が名付けた「高岡」の名は、城が消えた後も町とともに残り、やがて市の名となった。
    sources:
    - l3-takaoka-rekimachi
  relations:
  - pref/16
  unknowns:
  - 『詩経』から命名したという話は『角川日本地名大辞典』が「という」の形で伝えるもので、命名を直接示す利長自身の文書は確認できなかった
  - 快雄が地名を授けたという話も、市の計画書が「言われる」と記す伝承の域である
  updated: '2026-11-13'
- id: muni/16-魚津市
  code: '162043'
  names:
    ja: 魚津市
    reading: うおづし
    aliases:
    - 魚堵
    - 小戸
    - 小津
  user_terms:
  - うおづ
  - 魚津の名前の由来
  - 蜃気楼のまち
  - 魚のまち
  naming_type: 中心地名の継承
  formation: 合併新設
  prefecture: 富山県
  homonyms: []
  summary: 魚津市は、昭和27年（1952）に魚津町と周辺11村が合併して発足した。市公式の説明では、この地は古来「魚堵（おど）」と称し、小戸・小津とも言われてきたものが、魚の産地であることから「魚津」に改称されたと伝えられる。「魚津」の名自体は中世末から近世初めのもので、1476年のこととするものや、1595年に小津から改称したと記す文献があるという。
  first_attestation:
    era: 文明8年
    year_western: 1476
    document: 不明（魚津市公式が「1476年とするもの」と紹介）
    note: 市公式は、「魚津」の名の現れる時期について1476年とするものと、天正23年（1595）に小津を魚津に改称したと記す文献があることを紹介する。どちらの文献名も未確認
  claims:
  - text: 魚津市公式は、古来この地は「魚堵（おど）」と称し、小戸ケ浦・小戸・小津とも言われてきたものが、魚の産地ということで「魚津」に改称され、今日に至ったと伝えている
    kind: fact
    level: E2
    status: contested
    sources:
    - n2-uozu-city
  - text: 魚津市公式は、「魚津」の名そのものはさほど古いものではなく、1476年のこととするもの、また1595年に小津を魚津に改称したと記す文献があることを紹介している
    kind: fact
    level: E2
    status: established
    sources:
    - n2-uozu-city
  - text: 魚がよくとれたので、あちこちからだんだん人が移ってきて、しだいに家数も増えてきたと言い伝えられている
    kind: legend
    level: E2
    status: established
    sources:
    - n2-uozu-city
  - text: 現在の「うおづ」という読みと、古称とされる「魚堵（おど）」の読みは大きく異なっており、「魚津」への改称に際して読みも改められた可能性がある
    kind: fact
    level: H
    status: inferred
    sources:
    - n2-uozu-city
  - text: 昭和27年（1952）4月1日に、下新川郡魚津町と下中島村・上中島村・松倉村・上野方村・下野方村・片貝谷村・加積村・道下村・経田村・天神村・西布施村の11村が合併して魚津市が発足した
    kind: fact
    level: E4
    status: established
    sources:
    - n2-uozu-uub
  - text: 総務省の全国地方公共団体コードで、魚津市の団体コードは162043と定められている
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 「おど」から「うおづ」へ、読みまで変わった改名
    text: 魚津市公式の説明によれば、この地はもともと「魚堵（おど）」と呼ばれていました。それが小戸、小津と姿を変え、魚の産地らしく「魚の津」という意味の分かる「魚津」になったというのです。字が変わるだけでなく、読みも「おど」から「うおづ」へと大きく姿を変えたことになります。豊かな漁場を持つ港町が、自らの看板を「魚」に書き換えた改名でした。
    sources:
    - n2-uozu-city
  relations:
  - pref/16
  unknowns:
  - 1476年・1595年の改称を記すとされる文献の特定は未了（市公式の紹介経由）
  - 「魚堵（おど）」の語源と、その表記の古い用例は未確認
  - 1952年の市制施行時に市名がそのまま「魚津」とされた経緯（他候補の有無）は未確認
  updated: '2026-11-13'
- id: muni/16-黒部市
  code: '162078'
  names:
    ja: 黒部市
    reading: くろべし
    aliases:
    - 黒辺
  user_terms:
  - くろべ
  - 黒部ダム
  - 黒部峡谷
  - 宇奈月温泉
  naming_type: 中心地名の継承
  formation: 合併新設
  prefecture: 富山県
  homonyms: []
  summary: 黒部市は、昭和29年（1954）に桜井町と生地町が合併して生まれ、平成18年（2006）に宇奈月町を合併した。市名は市域を流れる黒部川にちなむ地域の総称から採られた。その「黒部」の語源は定まっておらず、国土交通省の河川事務所はアイヌ語の「クンネ・ペッ（黒い川）」説、「クル・ペッ（魔の川）」説、ネズコの別名クロベに由来する説を紹介している。
  first_attestation:
    era: 不明
    year_western: null
    document: 古書にみえる「黒辺川」の表記
    note: 建設省黒部工事事務所『いろは川 黒部四十八ヶ瀬50年のあゆみ』が紹介する古書の表記で、その古書の成立時期は特定できていない。「黒部」という地名の文献上の初出は未確認
  claims:
  - text: 黒部市公式によれば、昭和29年（1954）4月に桜井町と生地町が合併して黒部市が誕生した
    kind: fact
    level: E2
    status: established
    sources:
    - n2-kurobe-city
  - text: 黒部市公式によれば、平成18年（2006）3月に黒部市と宇奈月町が合併して、現在の黒部市が誕生した
    kind: fact
    level: E2
    status: established
    sources:
    - n2-kurobe-city
  - text: 国土交通省北陸地方整備局黒部河川事務所は、黒部川の名の語源として、アイヌ語の「クンネ・ペッ（クンネは暗い・黒い、ペッは川）」が変化したものという説を紹介している
    kind: fact
    level: E2
    status: contested
    sources:
    - n2-kurobe-mlit
  - text: 同事務所は、アイヌ語の「クル・ペッ（魔の川）」によるという説と、黒部の奥山に多いネズコの別名が黒檜（クロベ）であったためという説も紹介している
    kind: fact
    level: E2
    status: contested
    sources:
    - n2-kurobe-mlit
  - text: 黒部川は古書に「黒辺川」と記されたものがあり、江戸時代には扇状地上で流路がさまざまに分かれる様子から「黒部四十八ヶ瀬」「いろは川」とも呼ばれた
    kind: fact
    level: E5
    status: established
    sources:
    - n2-kurobe-wiki
  - text: 総務省の全国地方公共団体コードで、黒部市の団体コードは162078と定められている
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 「黒い川」か「魔の川」か
    text: 黒部川の名前には、よく似た音のアイヌ語に由来を求める説が2つあります。「クンネ・ペッ（黒い川）」と「クル・ペッ（魔の川）」です。橋もなく「四十八ヶ瀬」と呼ばれて北陸道の難所だった暴れ川の姿を思えば、「魔の川」と呼びたくなる気持ちも分かります。ただ、どちらも決め手はなく、奥山のネズコ（クロベ）の群落に由来するという日本語側の説も並び立っています。
    sources:
    - n2-kurobe-mlit
    - n2-kurobe-wiki
  relations:
  - pref/16
  unknowns:
  - 「黒部」の地名としての初出（荘園名・郷名としての用例）は未確認
  - 昭和29年（1954）の合併で市名に「黒部」が選ばれた経緯の公式記録は未確認
  - アイヌ語由来説について、地名学の専門文献での検証は未確認
  updated: '2026-11-13'
