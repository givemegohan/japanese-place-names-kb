- id: muni/24-松阪市
  code: '242047'
  names:
    ja: 松阪市
    reading: まつさかし
    aliases:
    - 松坂
    - 松ヶ島
    - 松坂町
  user_terms:
  - 松阪市の名前の由来
  - 松阪と松坂どっちが正しいの
  - 松阪牛のまち
  - まつさか まつざか 読み方
  naming_type: 藩名・城名から
  naming_note: 戦国大名の築城に伴う命名
  formation: 単独発足
  prefecture: 三重県
  homonyms: []
  summary: 市名は、天正16年（1588年）に蒲生氏郷が四五百森（よいほのもり）に築城して入城し、城下町を「松坂」と改めたことに始まる。もとの地は松ヶ島城の城下だった。明治22年（1889年）の町制施行の際、「大坂」が「大阪」に変わったことにも歩調を合わせる形で表記を「松阪」に統一した。江戸時代は紀州藩領だったが、地名は松平氏ではなく氏郷の命名に由来する。昭和8年（1933年）に市制を施行した。
  first_attestation:
    era: 安土桃山時代
    year_western: 1588
    document: 蒲生氏郷の松坂城築城と城下町の「松坂」への改称（松阪市公式の解説）
    note: 命名そのものを初出とする。「松坂」の名が現れる当時の文書そのものは未確認
  claims:
  - text: 天正12年（1584年）に南伊勢12万3千石の松ヶ島城主となった蒲生氏郷は、松ヶ島の南の四五百森に新城を築き、天正16年（1588年）に入城して城下町を「松坂」と改めた
    kind: fact
    level: E2
    status: established
    sources:
    - n6-matsusaka-gamou
  - text: 「松坂」の「坂」は、豊臣秀吉が治める大坂から一字をもらったものだと市の公式解説は伝えている
    kind: fact
    level: E2
    status: established
    sources:
    - n6-matsusaka-gamou
  - text: 氏郷は伊勢街道を松坂城下を通るよう付け替え、近江日野や伊勢大湊から有力商人を誘致するなど、城下町の整備を進めた
    kind: fact
    level: E2
    status: established
    sources:
    - n6-matsusaka-gamou
  - text: 「松坂」の表記は、明治22年（1889年）の町制施行の際に「松阪」に統一された。市はその背景に「大坂」が「大阪」に変更されたことがあると説明しており、城の名称については史跡名称として今も「松坂城跡」と表記する
    kind: fact
    level: E2
    status: established
    sources:
    - n6-matsusaka-gaiyo
    - n6-matsusaka-gamou
  - text: 江戸時代の松坂は、元和5年（1619年）に徳川頼宣が和歌山に封ぜられて以降は紀州藩（紀州徳川家）の統治下にあり城代が置かれたが、地名「松坂」そのものはそれ以前の蒲生氏郷の命名に由来し、松平氏の名にちなむものではない
    kind: fact
    level: E2
    status: established
    sources:
    - n6-matsusaka-shiseki
    - n6-matsusaka-gamou
  - text: 江戸時代から「まつさか」と「まつざか」の2通りの読み方が存在していた
    kind: fact
    level: E2
    status: established
    sources:
    - n6-matsusaka-gaiyo
  - text: 昭和8年（1933年）に松阪町が市制を施行して松阪市となった
    kind: fact
    level: E5
    status: established
    sources:
    - n6-matsusaka-wiki
  - text: 平成17年（2005年）1月1日、松阪市・嬉野町・三雲町・飯南町・飯高町の1市4町が合併して現在の松阪市となった
    kind: fact
    level: E2
    status: established
    sources:
    - n6-matsusaka-gaiyo
  - text: 総務省の地方公共団体コード一覧では、松阪市のコードは242047である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 「坂」と「阪」、一字違いの400年
    text: 松阪の中心には「松坂城跡」の石碑が立ち、市名は「松阪市」と書く。同じまちで「坂」と「阪」が使い分けられているのは、明治22年（1889年）に地名が「松阪」へ統一された一方、城の名は歴史的名称として「松坂」のまま残されたからだ。もとの「松坂」は、蒲生氏郷が大坂から一字をもらって付けたと市の公式解説が伝える名。氏郷が会津へ移ったあとも城下町は伊勢商人の本拠として栄え、三井家をはじめとする豪商を生んだ。松阪牛の知名度に隠れがちだが、この一字の表記の揺れのなかに、戦国大名の町づくりから明治の字の統一までの歴史が折り重なっている。
    sources:
    - n6-matsusaka-gamou
    - n6-matsusaka-gaiyo
  relations:
  - pref/24
  - muni/24-伊勢市
  unknowns:
  - 「松坂」の「松」の字の由来（築城地の四五百森に松が多かったことにちなむという説など）は、市の公式ページで明記を確認できなかった
  - 昭和8年（1933年）の市制施行の日付（2月1日とされる）は、市の公式資料で裏づけが取れていない
  - 「松坂」の名が現れる戦国期の文書そのものは未確認
  updated: '2026-11-13'
- id: muni/24-桑名市
  code: '242055'
  names:
    ja: 桑名市
    reading: くわなし
    aliases:
    - 桑名町
    - 桑名郡
    - 桑名郷
  user_terms:
  - 桑名市の名前の由来
  - 桑名って桑の木の名なの
  - 七里の渡しのまち
  naming_type: 旧行政区画名の継承
  naming_note: 古代郡名の継承
  formation: 単独発足
  prefecture: 三重県
  homonyms: []
  summary: 市名は、古代の伊勢国桑名郡の郡名を受け継ぐ。「桑名」の初見は『日本書紀』天武天皇元年（672年）条で、壬申の乱の途上にあった大海人皇子が桑名郡家に泊まったという記事だと『日本歴史地名大系』が紹介する。江戸時代は松平氏の城下町・東海道の宿場町として栄えたが、地名そのものはそれより千年近く古い。昭和12年（1937年）に市制を施行した。
  first_attestation:
    era: 飛鳥時代
    year_western: 672
    document: 日本書紀 天武天皇元年6月26日条「桑名郡家に宿りたまふ」
    note: 『日本歴史地名大系』が初見として紹介する記事。原典そのものは未読のため、辞典経由の記載として記録する
  claims:
  - text: 桑名の名の初見は『日本書紀』天武天皇元年（672年）6月26日条で、大海人皇子（のちの天武天皇）が壬申の乱に際して「桑名郡家に宿りたまふ」とある記事であると『日本歴史地名大系』が紹介している
    kind: fact
    level: E3
    status: established
    sources:
    - n6-kuwana-kotobank
  - text: 『続日本紀』天平12年（740年）11月25日条には、聖武天皇が「桑名郡石占頓宮」に至ったとあることも、同大系が紹介している
    kind: fact
    level: E3
    status: established
    sources:
    - n6-kuwana-kotobank
  - text: 『和名類聚抄』には桑名郡の郷として桑名郷が見え、古代には郡名・郷名として定着していた
    kind: fact
    level: E3
    status: established
    sources:
    - n6-kuwana-kotobank
  - text: 市名は古来からの郡名「桑名」による
    kind: fact
    level: E3
    status: established
    sources:
    - n6-kuwana-kotobank
  - text: 『新撰姓氏録』には当地開発の豪族と考えられる「桑名首」が見えるが、「桑名」という地名の語源そのものは確定していない
    kind: fact
    level: E3
    status: indeterminate
    sources:
    - n6-kuwana-kotobank
  - text: 江戸時代の桑名は松平氏11万石の城下町、東海道の宿場町・港町として発展したが、地名は古代の郡名に由来し、松平氏の入封にちなむものではない
    kind: fact
    level: E3
    status: established
    sources:
    - n6-kuwana-kotobank
  - text: 昭和12年（1937年）に西桑名町を桑名町に編入し、市制を施行した
    kind: fact
    level: E3
    status: established
    sources:
    - n6-kuwana-kotobank
  - text: 平成16年（2004年）12月6日、桑名市・多度町・長島町が合併して現在の桑名市となった
    kind: fact
    level: E3
    status: established
    sources:
    - n6-kuwana-kotobank
  - text: 総務省の地方公共団体コード一覧では、桑名市のコードは242055である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 壬申の乱の夜、大海人皇子が泊まったまち
    text: 672年、壬申の乱を起こして西へ向かう大海人皇子は、伊勢の桑名郡家に一夜を泊めた。『日本書紀』に残るこの一行が、「桑名」の名の初見とされる。郡家とは郡の役所であり、桑名はすでに古代国家の行政の拠点だった。その後も聖武天皇の頓宮が置かれ、東海道の駅と湊を兼ねた交通の要所であり続けた。江戸時代には熱田との間に「七里の渡し」が通い、松平氏の城下町として栄えるが、その繁栄の土台には、古代から千年にわたって要衝であり続けた地の利があった。
    sources:
    - n6-kuwana-kotobank
  relations:
  - pref/24
  - muni/24-四日市市
  unknowns:
  - 「桑名」の語源（桑の字義と地形・植生との関係など）は、『日本歴史地名大系』の解説でも特定されておらず未確定
  - 『日本書紀』の記事の原文は未読で、辞典経由の確認にとどまる
  updated: '2026-11-13'
- id: muni/24-津市
  code: '242012'
  names:
    ja: 津市
    reading: つし
    aliases:
    - 安濃津
    - 津町
  user_terms:
  - 県庁所在地の津
  - 藤堂高虎の城下町
  - 日本三津の港町
  naming_type: 中心地名の継承
  formation: 合併新設
  prefecture: 三重県
  homonyms: []
  summary: 市名は「港」を意味する「津」に由来する。古代・中世の港「安濃津」の名が短縮され、江戸時代には藤堂家の城下町「津」として定着し、1889年の市制施行でそのまま市名となった。2006年の10市町村合併でも「津市」の名は継承された。
  first_attestation:
    era: 嘉保3年
    year_western: 1096
    document: 『中右記』嘉保3年12月9日条（裏書）
    note: 「安乃津」と表記され、地震・津波の被害記事として安濃津が文書に現れる早い確認例（『日本歴史地名大系』の整理による二次確認）。「津」単独の呼称は中世後期以降に現れる。
  claims:
  - text: 「津」は本来「港」を意味する言葉であり、津市議会の資料は、市の名が海上交通・交易の拠点を表す港に由来すると説明する。
    kind: fact
    level: E2
    status: established
    sources:
    - d-cap-tsu-gikai
  - text: 地名の歴史は安濃郡の港「安濃津」に始まると『日本歴史地名大系』は解説する。
    kind: fact
    level: E3
    status: established
    sources:
    - d-cap-tsu-kotobank
  - text: 安濃津は『中右記』嘉保3年（1096年）の裏書に「安乃津」と見えて地震・津波の記事があり、『兵範記』には「安濃津」、『玉葉』には「阿乃之津」とあるなど、平安時代後期以降の文書に散見する。
    kind: fact
    level: E3
    status: established
    sources:
    - d-cap-tsu-kotobank
  - text: 安濃津は博多津・坊津とともに日本三津とうたわれ、対外貿易の港町として栄えた。
    kind: fact
    level: E2
    status: established
    sources:
    - d-cap-tsu-gikai
  - text: 鎌倉後期には「津湊」とも呼ばれ、大永2年（1522年）の文書に「津四郷」、慶長13年（1608年）の藤堂高虎の文書に「津町中」とあるなど、近世には「津」の呼称が主流となって安濃津の用例は少なくなった。
    kind: fact
    level: E3
    status: established
    sources:
    - d-cap-tsu-kotobank
  - text: 江戸時代、津は藤堂高虎が安濃津城を改修した津城の城下町（32万3900石）として栄え、市名はこの城下町「津」を継ぐものである。
    kind: fact
    level: E2
    status: established
    sources:
    - d-cap-tsu-gikai
    - d-cap-tsu-castle
  - text: 1889年4月1日、全国の30市とともに日本で最初の市制が施行され、津市が誕生した。当時の人口は約2万7000人、面積は7.9平方キロであった。
    kind: fact
    level: E2
    status: established
    sources:
    - d-cap-tsu-mayor
    - d-cap-tsu-gikai
  - text: 2006年1月1日に津市・久居市・河芸町・芸濃町・美里村・安濃町・香良洲町・一志町・白山町・美杉村の10市町村が合併して新しい津市が誕生し、市名「津」は継承された。
    kind: fact
    level: E2
    status: established
    sources:
    - d-cap-tsu-gikai
  - text: 聖徳太子が四方に四天王寺を建立する企ての中で、当地の四天王寺を東の難波の四天王寺に対応させたという話が伝わるが、『日本歴史地名大系』はこの話を伝説の域を出ないとする。
    kind: legend
    level: E3
    status: established
    sources:
    - d-cap-tsu-kotobank
  - text: 津市の地方公共団体コードは242012である。
    kind: fact
    level: E2
    status: established
    sources:
    - d-cap-jlis-mie
  column:
    title: 「安濃津市」になりかけた津市
    text: 1889年の市制施行にあたって、津には「安濃津市」という名称案があった。古代以来の港のフルネームを復活させる案である。しかし実際に選ばれたのは、城下町として定着していた短い「津」の方だった。安濃津から津へという短縮は、鎌倉時代の「津湊」や近世の「津町中」といった用例が示すとおり、何百年もかけて進んだ流れの到着点だったといえる。
    sources:
    - d-cap-tsu-kotobank
  relations:
  - pref/24
  unknowns:
  - 郡名・郷名としての「安濃」自体の語源は、参照した範囲では確認できなかった。
  - 古代の安濃津の港湾施設の正確な範囲は、発掘成果まで確認していない。
  - 『中右記』の裏書記事は『日本歴史地名大系』経由の確認で、原典は未読である。
  updated: '2026-11-13'
- id: muni/24-熊野市
  code: '242128'
  names:
    ja: 熊野市
    reading: くまのし
    aliases:
    - 熊野
    - 久満野
    - 木本町
    - 奥熊野
  user_terms:
  - くまの
  - 熊野
  - 熊野市の名前の由来
  - 奥熊野の中心
  - 鬼ヶ城のまち
  naming_type: 旧国名・広域地名の採用
  naming_note: 広域地名「熊野」を採用
  formation: 合併新設
  prefecture: 三重県
  homonyms: []
  summary: 市名「熊野」は、三重・和歌山・奈良にまたがる広域地名「熊野」をそのまま市名にしたもの。昭和29年（1954年）に木本町ほか7村が合併する際、奥熊野の中心・木本を擁する市として「熊野」と名乗った。「熊野」は『日本書紀』にも現れる古い名で、『紀伊続風土記』は「隈（くま）＝こもる（隠れる）の義、山川幽深の地ゆえの名」と説く。熊野三山そのものは和歌山県側にある。
  first_attestation:
    era: 奈良時代（720年成立の文献への収載）
    year_western: null
    document: 『日本書紀』神代巻の「紀伊国の熊野の有馬村」
    note: 『日本歴史地名大系』が紹介するもの。イザナミ尊の葬地とする神代の記事で、歴史的事実としての年代ではない。有馬村は現在の熊野市有馬町にあたり、花の窟が伝承地とされる
  claims:
  - text: 『日本書紀』神代巻の一書には、イザナミ尊を「紀伊国の熊野の有馬村に葬りまつる」とあり、この有馬村は現在の熊野市有馬町で、花の窟がその地とされることを『日本歴史地名大系』は紹介している
    kind: fact
    level: E3
    status: established
    sources:
    - r1-kumano-kotobank
  - text: 熊野はかつて「熊野国」と呼ばれて国造が置かれたが、大化の国郡制定の際に紀伊国牟婁（むろ）郡となった
    kind: fact
    level: E3
    status: established
    sources:
    - r1-kumano-kotobank
  - text: 「熊野」の名の由来について、江戸時代の地誌『紀伊続風土記』は「熊は隈（くま）にて古茂累（こもる）の義にして、山川幽深、樹木蓊欝（おううつ）なるを以て名づくなり」と、山深く隠れた土地の意と説いている
    kind: fact
    level: E3
    status: established
    sources:
    - r1-kumano-kotobank
  - text: 神武天皇が熊野村に至ったときに大熊に出会ったという『古事記』の話を「熊野」の名の起源とする説があるが、日本大百科全書（ニッポニカ）はこの説を「採用できない」としている
    kind: legend
    level: E3
    status: contested
    sources:
    - r1-kumano-kotobank
  - text: 江戸時代、現在の熊野市域を含む東側の熊野は「奥熊野」と呼ばれ、木本はその中心の町であった
    kind: fact
    level: E3
    status: established
    sources:
    - r1-kumano-kotobank
  - text: 昭和29年（1954年）11月、木本町・荒坂村・新鹿村・泊村・有井村・飛鳥村・五郷村・神川村の8か町村が合併して熊野市が誕生し、市制を施行した。市名は、牟婁郡が大化改新以前に熊野国と呼ばれ、木本が奥熊野の中心であったことによる
    kind: fact
    level: E2
    status: established
    sources:
    - r1-kumano-city-history
    - r1-kumano-kotobank
  - text: 平成17年（2005年）11月1日、旧熊野市は南牟婁郡紀和町と合併して、現在の熊野市となった
    kind: fact
    level: E3
    status: established
    sources:
    - r1-kumano-kotobank
  - text: 熊野市の地方公共団体コードは242128である
    kind: fact
    level: E2
    status: established
    sources:
    - k4-ise-jlis
  column:
    title: 「熊野市」に熊野三山はない
    text: 熊野市と聞くと熊野三山のある市と思われがちだが、本宮大社・速玉大社・那智大社はすべて和歌山県側にある。熊野市は、伊勢から三山を目指す参詣者が必ず通った「伊勢路」の町で、奥熊野の中心・木本を核に1954年に生まれた。面白いのは市の広報紙の名で、1955年の創刊号は「市報・久満野（くまの）」と表記された。「くまの」には「久満野」という美しい当て字もあったのである。一方、『日本書紀』がイザナミの葬地とする「熊野の有馬村」は、この熊野市有馬町にあたる。
    sources:
    - r1-kumano-city-history
    - r1-kumano-kotobank
  relations:
  - pref/24
  - muni/24-尾鷲市
  unknowns:
  - 「熊野」の語源は隈（こもる）説が有力とされるが、確定したとは言えず、辞典の紹介の範囲にとどめた
  - 1954年の合併時に市名「熊野」を決定した協議の一次記録は未確認
  - 『日本書紀』神代巻の該当記事は原典未読で、大系の紹介に拠っている
  updated: '2026-11-13'
- id: muni/24-玉城町
  code: '244619'
  names:
    ja: 玉城町
    reading: たまきちょう
    aliases: []
  user_terms:
  - たまきちょう
  - 玉城
  - 田丸城の城下町
  - 度会郡の町
  naming_type: 藩名・城名から
  naming_note: 1955年の合併で生まれた町名。田丸城の古称「玉丸城」にちなむとブリタニカ国際大百科事典は記す
  formation: 合併新設
  prefecture: 三重県
  homonyms: []
  summary: 三重県中部、度会郡の町。1955年に田丸町・東外城田村・有田村の一部が合併して発足した。町名は、中心地区・田丸に北畠親房が築いた田丸城の古称「玉丸城」にちなむとブリタニカ国際大百科事典は記す。沖縄県の旧玉城村（現・南城市）とは「全国で唯一の同名町村」の縁で姉妹町村盟約を結んだ。
  first_attestation:
    era: 昭和30年
    year_western: 1955
    document: 田丸町・東外城田村・有田村の一部の合併による玉城町発足
    note: 自治体名としての初出。由来とされる田丸城の古称「玉丸城」の文献上の初出は、確認できていない
  claims:
  - text: 1955年4月10日に田丸町・東外城田村・有田村の一部が合併して玉城町が発足し、1956年9月30日に下外城田村を編入した
    kind: fact
    level: E3
    status: established
    sources:
    - x8-tamaki-kotobank
  - text: ブリタニカ国際大百科事典小項目事典は、玉城町について「町名は田丸城の古称玉丸城にちなむ」と記している
    kind: fact
    level: E3
    status: established
    sources:
    - x8-tamaki-kotobank
  - text: 中心地区の田丸は、延元元年（1336年）に北畠親房が田丸城を築いて以来の城下町である
    kind: fact
    level: E2
    status: established
    sources:
    - x8-tamaki-town
  - text: 『日本歴史地名大系』は、玉城町は度会郡の北部にあり、宮川下流の左岸に位置すると記す
    kind: fact
    level: E3
    status: established
    sources:
    - x8-tamaki-kotobank
  - text: 沖縄県の旧玉城村（現・南城市）とは「全国で唯一の同名町村」の縁により、1993年11月12日に姉妹町村盟約を結んだ
    kind: fact
    level: E2
    status: established
    sources:
    - x8-tamaki-nanjo
  - text: 「玉城」の名が1955年以前の郷名などの古い地名に遡るかどうかは、確認できなかった
    kind: fact
    level: E5
    status: indeterminate
    sources:
    - x8-tamaki-wiki
  - text: 玉城町の地方公共団体コードは244619である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 全国で唯一の同名町村だった縁
    text: 1993年、三重県玉城町は遠く沖縄県の玉城村と姉妹町村の盟約を結んだ。理由は明快で、当時この二つが「全国で唯一の同名町村」だったからである。読みも同じ「たまき」。沖縄の玉城はグスク（城）に由来する琉球の地名、三重の玉城は田丸城の古称「玉丸城」にちなむとされ、由来はまったく異なる。2006年に沖縄の玉城村は合併して南城市の一部となり、同名町村のペアは消えたが、盟約は南城市との間で今も生きている。同名地名が自治体同士を結びつけた、珍しい縁の記録である。
    sources:
    - x8-tamaki-nanjo
    - x8-tamaki-kotobank
  relations:
  - pref/24
  - muni/24-度会町
  - muni/24-伊勢市
  unknowns:
  - 田丸城の古称「玉丸城」の用例が確認できる文献と、その初出時期
  - 1955年の合併で「玉城町」が選定された経緯（公募の有無・他候補）。ブリタニカの記述以外の裏づけ
  updated: '2026-11-13'
- id: muni/24-紀北町
  code: '245437'
  names:
    ja: 紀北町
    reading: きほくちょう
    aliases: []
  user_terms:
  - きほくちょう
  - 紀北
  - 熊野古道の町
  - 東紀州の玄関口
  naming_type: 新規命名
  naming_note: 2005年の合併で住民公募から選ばれた新名。「紀伊の北部」という広域名で、合併以前から県民局・農協等の名称として親しまれていた
  formation: 合併新設
  prefecture: 三重県
  homonyms: []
  summary: 三重県南部、北牟婁郡唯一の町。2005年に紀伊長島町・海山町の合併で発足した。町名「紀北」は三重県の合併資料によれば住民公募で募り、幹事会で10候補に絞って協議会の投票で決めた新名で、決定理由は「地理的にイメージできる」「県民局、農協等で使用され親しみがある」。町域はもと志摩国に属したが、1582年に紀伊国へ編入された土地である。
  first_attestation:
    era: 平成17年
    year_western: 2005
    document: 紀伊長島町・海山町の新設合併による紀北町発足
    note: 自治体名としての初出。「紀北」の語そのものは、県民局や農協などの地域名称として合併以前から使われていたことが、三重県の合併資料からうかがえる
  claims:
  - text: 2005年10月11日に北牟婁郡紀伊長島町・海山町が新設合併して紀北町が発足した
    kind: fact
    level: E4
    status: established
    sources:
    - x8-kihoku-uub
  - text: 三重県の合併資料によれば、町名は地域住民からの公募をもとに、幹事会で10候補を選定し、合併協議会の投票によって決定された新名である
    kind: fact
    level: E2
    status: established
    sources:
    - x7-minamiise-mie
  - text: 同資料が記録する決定理由は「地理的にイメージできる」「県民局、農協等で使用され親しみがある」で、「紀北」が合併前から広域名として使われていたことがうかがえる
    kind: fact
    level: E2
    status: established
    sources:
    - x7-minamiise-mie
  - text: 紀北町は北牟婁郡に属する唯一の自治体である
    kind: fact
    level: E5
    status: established
    sources:
    - x8-kihoku-wiki
  - text: 町域はもと志摩国に属していたが、天正10年（1582年）に新宮の堀内氏善の北進によって一帯が紀伊の国に編入されたと、紀北町公式サイトは記している
    kind: fact
    level: E2
    status: established
    sources:
    - x8-kihoku-town
  - text: 町内には、ユネスコ世界文化遺産「紀伊山地の霊場と参詣道」を構成する熊野古道の馬越峠などの峠道がある
    kind: fact
    level: E5
    status: established
    sources:
    - x8-kihoku-wiki
  - text: 紀北町の地方公共団体コードは245437である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: もとは志摩国、いまは「紀」の北
    text: 紀北町の「紀」は紀伊国の紀だが、この土地はもともと紀伊ではなかった。町公式の歴史によれば、一帯はかつて志摩国に属し、伊勢神宮の御領地となったのち、1582年に新宮の堀内氏善の進出によって紀伊の国に組み込まれたという。以来400年あまり「紀伊の端」にあった土地が、平成の合併で「紀伊の北部＝紀北」を名乗ったことになる。しかも県の資料によれば、この名は県民局や農協の名称として以前から地域で使われ、親しまれていた。合併で作られた新名でありながら、実は先に暮らしの中で育っていた名前だった。
    sources:
    - x8-kihoku-town
    - x7-minamiise-mie
  relations:
  - pref/24
  - muni/24-尾鷲市
  - muni/24-大紀町
  unknowns:
  - 公募における「紀北町」以外の最終候補（10候補）の内容と得票状況
  - 「紀北」の広域名としての使用開始時期（県民局・農協の名称に採用された時期）
  updated: '2026-11-13'
