prefecture_code: '03'
records:
- id: muni/03-一戸町
  code: '035246'
  names:
    ja: 一戸町
    reading: いちのへまち
    aliases:
    - 一戸村
  user_terms:
  - いちのへ
  - 戸の地名の一番目
  - 一戸から九戸の由来
  - 馬の産地だった町
  naming_type: 一部の地名
  prefecture: 岩手県
  homonyms: []
  summary: 一戸は、岩手県北から青森県南に一から九まで並ぶ「戸」の地名の1番目である。古代末期から中世にかけて「糠部郡」と呼ばれた地域の区分名で、その正体については、名馬の牧場を九つに分けた「九牧」に由来する説、律令制の統治機構に由来する説などが対立し、確定していない。一戸町自身は「平安末期から名馬の産地として知られ、牧場を一から九の戸に分けられたことから」と説明する。1889年に町として発足し、1957年に4村と合併して現在の町となった。
  first_attestation:
    era: 中世（鎌倉時代）
    year_western: null
    document: 糠部地方における「戸」の区分（九ヶ部四門の制）
    note: 郷土史研究は、鎌倉時代初期には一戸から九戸までの区分が存在したとする。「一戸」の個別名が文書に現れる初出の年は未確認
  claims:
  - text: 総務省の全国地方公共団体コードで、一戸町の団体コードは035246と定められている
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  - text: 八戸市公式によれば、岩手県北から青森県南東部にかけての一から九の数字に「戸」の付く地名は、古代末期から中世にかけて「糠部郡」と呼ばれた地域に残るものであり、一戸はその1番目の「戸」を意味する
    kind: fact
    level: E2
    status: established
    sources:
    - k2-hachinohe-city-gaiyo
  - text: 一戸町公式は、一戸の由来は諸説あるとした上で、平安末期から名馬の産地として名が知られ、その牧場を一から九の戸に分けられたことからといわれている、と説明している
    kind: fact
    level: E2
    status: contested
    sources:
    - z6-ichinohe-town-about
  - text: 「戸」の起源については、岩手県立図書館のレファレンス事例が、南部氏の九牧説のほか、貢馬の幣説、防衛施設説、糠部開拓のエリア区分説、九カ部四門の制説などを挙げており、定説は決まっていない
    kind: fact
    level: E3
    status: contested
    sources:
    - t4-iwate-lib-ref-he
  - text: 南部氏の祖・南部光行が糠部郡を九つの牧場（戸）に分け、四門を設ける「九ヶ戸四門」の制度を敷いたため、その行政区分の名残が地名に残った、という伝承が二戸市公式によって紹介されている
    kind: legend
    level: E2
    status: contested
    sources:
    - t4-ninohe-city-intro
  - text: 明治22年（1889年）4月1日、一戸村と高善寺村が合併して一戸町が発足した
    kind: fact
    level: E5
    status: established
    sources:
    - z6-ichinohe-wiki
  - text: 昭和32年（1957年）11月1日、一戸町・浪打村・鳥海村・小鳥谷村・姉帯村の1町4村が合併して、現在の一戸町が誕生した
    kind: fact
    level: E2
    status: established
    sources:
    - z6-ichinohe-town-about
  column:
    title: 一戸町は、二戸郡にある
    text: 一から九まで並ぶ「戸」の地名の起点が一戸町である。ところが一戸町が所属するのは一戸郡ではなく「二戸郡」だ。郡の名前は近世以降の分割や再編で付け替わってきたため、番号の若い町が、番号の違う郡に入るというねじれが生じた。似たねじれは青森側にもあり、三戸町や五戸町は三戸郡、八戸市は郡に属さない。「戸」の番号は1000年近く前の区分の化石で、現在の行政の枠組みとは独立に、地名だけが昔の番号札を守り続けている。
    sources:
    - z6-ichinohe-wiki
    - t4-iwate-lib-ref-he
  relations:
  - pref/03
  - muni/03-二戸市
  - muni/02-八戸市
  unknowns:
  - 「戸」の起源（牧場の区分か、統治機構か、その他か）は確定していない
  - 「一戸」の名が文書に初めて現れる年と文献は未確認
  updated: '2026-11-13'
- id: muni/03-一関市
  code: 032093
  names:
    ja: 一関市
    reading: いちのせきし
    aliases:
    - 一関町
  user_terms:
  - 一関は関所の名前なのか
  - 一ノ堰とは何か
  - 一関 二関 三関は本当にあるのか
  naming_type: 一部の地名
  prefecture: 岩手県
  homonyms: []
  summary: 市名は中心地「一関」の地名の継承である。その語源には、北上川の氾濫をせき止める一番目の堰「一ノ堰」から転じたとする説と、市内に残る「一関・二関・三関」の地名が平泉の関所にちなむとする説が並立している。昭和23年（1948年）に市制を施行し、平成17年（2005年）の新設合併で現在の一関市となった。
  first_attestation:
    era: 昭和23年
    year_western: 1948
    document: 一関市の市制施行
    note: 市名としての初出。地名「一関」自体はこれより古いが、文書上の初出は未確認
  claims:
  - text: 岩手県の「いわての文化情報大事典」は、「一関」の由来の第1説として、北上川の氾濫をせき止めるために作った一番目の「堰」である「一ノ堰」から転じたものだとする説を挙げている
    kind: fact
    level: E2
    status: contested
    sources:
    - a-cap-morioka-bunka
  - text: 同大事典の第2説は、市内に「一関」「二関」「三関」があり、平泉の関所にちなむとするもので、2説は併記されており決着していない
    kind: fact
    level: E2
    status: contested
    sources:
    - a-cap-morioka-bunka
  - text: 一関市議会要覧の沿革によれば、この地域は戦後まもなく36の町村に分かれていたが、昭和23年から33年にかけての合併で合併前の8市町村となり、昭和23年（1948年）に市制を施行した旧一関市がその一つであった
    kind: fact
    level: E2
    status: established
    sources:
    - m1-ichinoseki-youran
  - text: 政府統計の廃置分合情報によれば、平成17年（2005年）9月20日、一関市・花泉町・大東町・千厩町・東山町・室根村・川崎村が合併して一関市が新設された
    kind: fact
    level: E2
    status: established
    sources:
    - m1-ichinoseki-estat
  - text: 平成23年（2011年）9月26日に藤沢町が一関市に編入され、東磐井郡は廃止された、と政府統計の記録および市議会要覧は述べる
    kind: fact
    level: E2
    status: established
    sources:
    - m1-ichinoseki-estat
    - m1-ichinoseki-youran
  - text: 地方公共団体コードは032093である（総務省「地方公共団体コード一覧」）
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 一・二・三と並ぶ「関」
    text: 「関所」説の根拠は、市内に「一関」だけでなく「二関」「三関」という地名が実際に並んで残っていることです。一方、「一ノ堰」説は、暴れ川だった北上川を治める堰の記憶に名前の起源を求めます。街道の関か、水をせき止める堰か。「せき」という音に、二つの異なる風景が重なっているのが一関の名前の面白さです。
    sources:
    - a-cap-morioka-bunka
  relations:
  - pref/03
  unknowns:
  - 地名「一関」の文書上の初出（中世文書での用例）の確認は未実施
  - 「二関」「三関」の地名が関所そのものの跡かどうかは、今回の資料では確認できていない
  updated: '2026-11-13'
- id: muni/03-久慈市
  code: '032077'
  names:
    ja: 久慈市
    reading: くじし
    aliases:
    - 久慈町
    - 久慈郡
  user_terms:
  - あまちゃんのまち
  - 琥珀のまち
  - 北限の海女のまち
  - 北三陸の港町
  naming_type: その他
  prefecture: 岩手県
  homonyms: []
  summary: 「久慈」は南北朝期からの郡名として見られる古い地名で、現在の市名は旧久慈町から受け継がれた。語源は確定しておらず、岩手県の資料は「くびれた地形」「海食でえぐられた地」「口津（河口の船着場）」「口州（河口の砂州）」の4説を併記する。なお『常陸国風土記』のクジラに似た丘の伝承は、茨城県のもう一つの久慈の由来であり、岩手の久慈の話ではない。市は琥珀の産地として知られ、2013年のNHK連続テレビ小説『あまちゃん』のロケ地となった。
  first_attestation:
    era: 元弘4年
    year_western: 1334
    document: 北畠顕家が南部師行に宛てた書状
    note: Wikipedia「糠部郡」が、北畠顕家が久慈郡へ代官を入部させるよう命じた記事として紹介する用例で、原典は未確認。岩手県の文化情報大事典は「久慈」を南北朝期からの郡名とする
  claims:
  - text: 総務省の全国地方公共団体コードで、久慈市の団体コードは032077と定められている
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  - text: 岩手県の文化情報大事典「市名の由来」は、「久慈」は南北朝期からの郡名として見られる地名であると説明する
    kind: fact
    level: E2
    status: established
    sources:
    - a-cap-morioka-bunka
  - text: 同じく県の大事典は久慈の語源として、くびれた地形からとする説、海食で陸地がクジ（えぐられ）て崩れたところとする説、「口津」の意味で河口の船着場とする説、「口州」の意味で河口に横たわる長い海砂州とする説の4説を併記しており、定説は示されていない
    kind: fact
    level: E2
    status: contested
    sources:
    - a-cap-morioka-bunka
  - text: 岩手県内の地名研究家・宍戸敦は、「久慈」は「抉（えぐ）る＝くじる」に由来する可能性が高く、岩が削られた久慈渓流の渓谷がその場所の候補だと説いている
    kind: fact
    level: E4
    status: contested
    sources:
    - t4-kuji-menkoi-chimei
  - text: 『常陸国風土記』に伝わる「鯨鯢（くじら）に似た小さい丘を倭武天皇が久慈と名づけた」という由来譚は、茨城県の久慈郡・久慈川流域の地名についてのもので、岩手県の久慈の語源として県の資料には挙げられていない
    kind: fact
    level: E2
    status: established
    sources:
    - t4-kuji-mlit-kujikawa
    - a-cap-morioka-bunka
  - text: 久慈市によれば、昭和29年（1954年）に久慈町・長内町など2町5村が合併して久慈市が誕生し、平成18年（2006年）3月6日に山形村と合併して現在の久慈市となった
    kind: fact
    level: E2
    status: established
    sources:
    - t4-kuji-city-enkaku
  - text: 久慈は世界有数かつ国内最大の琥珀の採掘産地として知られ、採掘場・加工場・博物館を備える
    kind: fact
    level: E5
    status: established
    sources:
    - t4-kuji-wiki
  - text: 2013年放送のNHK連続テレビ小説『あまちゃん』では、架空の市「北三陸市」の場面のロケが久慈市内各所で行われ、放送後に観光客が増加した
    kind: fact
    level: E5
    status: established
    sources:
    - t4-kuji-wiki
  column:
    title: クジラの岡は、もう一つの「久慈」の話
    text: 「久慈」の由来として有名なのは、『常陸国風土記』にある「鯨鯢（くじら）の岡」の話です。小さな丘の形がクジラに似ていたので、倭武天皇が「久慈」と名づけたというこの伝承は、実は茨城県の久慈郡・久慈川の地名についてのものです。岩手県の久慈については、県の資料が挙げるのは地形にまつわる4つの説で、クジラは登場しません。同名の地名どうしで由来が混ざり合うのは珍しくないことで、この二つの久慈は、名前は同じでも由来の層はまったく別々にたどる必要があります。
    sources:
    - t4-kuji-mlit-kujikawa
    - a-cap-morioka-bunka
  relations:
  - pref/03
  unknowns:
  - 「久慈」の語源は確定しておらず、県の資料が併記する4説のいずれも典拠となる古文書を確認できなかった
  - 郡名「久慈」の初出について、1334年の書状の記事は二次資料（Wikipedia）経由の確認にとどまり、原典を確認できなかった
  - 久慈氏がこの地を領した中世の経緯と地名との関係は、市公式の沿革ページでは確認できなかった
  updated: '2026-11-13'
- id: muni/03-九戸村
  code: 035068
  names:
    ja: 九戸村
    reading: くのへむら
    aliases: []
  user_terms:
  - くのへ
  - 戸の地名の九番目
  - 九戸城はどこか
  - 木炭の村
  naming_type: 合併新設
  prefecture: 岩手県
  homonyms: []
  summary: 九戸は、一から九まで並ぶ「戸」の地名の9番目にあたる古い地域名である。1955年、戸田村・伊保内村・江刺家村の3村が合併する際、3村のいずれの名も採らず、この一帯を指してきた「九戸」の名を村名に採用して九戸村が発足した。もと糠部郡の一部で、近世には九戸郡が置かれていた土地であり、中世には九戸氏を称した武士の名にもなっている。なお九戸城は九戸村ではなく二戸市にある。
  first_attestation:
    era: 昭和30年
    year_western: 1955
    document: 町村合併による九戸村の発足
    note: 村名としての初出。地域名「九戸」自体は、建久2年（1191年）に九戸五郎を称したという言い伝えや、寛永11年（1634年）の九戸郡の成立に遡る
  claims:
  - text: 総務省の全国地方公共団体コードで、九戸村の団体コードは035068と定められている
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  - text: 八戸市公式によれば、一から九の数字に「戸」の付く地名は古代末期から中世にかけて「糠部郡」と呼ばれた地域に残るものであり、九戸はその9番目の「戸」を意味する
    kind: fact
    level: E2
    status: established
    sources:
    - k2-hachinohe-city-gaiyo
  - text: 「戸」の起源については、岩手県立図書館のレファレンス事例が九牧説・貢馬の幣説・防衛施設説・エリア区分説・九カ部四門の制説などを挙げており、九戸を含む「戸」地名群全体でも定説は決まっていない
    kind: fact
    level: E3
    status: contested
    sources:
    - t4-iwate-lib-ref-he
  - text: 寛永11年（1634年）に糠部郡が北郡・二戸郡・三戸郡・九戸郡に分割され、この一帯は九戸郡となった
    kind: fact
    level: E5
    status: established
    sources:
    - t4-nukabe-wiki
  - text: 九戸村公式の計画によれば、本村が歴史に登場するのは建久2年（1191年）、南部藩の祖となった三郎光行の五男・五郎行連が「九戸五郎」と名乗り、本村の長興寺に居を構えてからであると言い伝えられている
    kind: legend
    level: E2
    status: established
    sources:
    - z6-kunohe-vill-plan
  - text: 明治22年（1889年）の町村制でこの一帯は戸田村・伊保内村・江刺家村の3か村となり、昭和30年（1955年）4月に3か村が合併して「九戸村」となった、と九戸村公式の計画は記している
    kind: fact
    level: E2
    status: established
    sources:
    - z6-kunohe-vill-plan
  - text: 新村名「九戸」は、合併した3村（戸田・伊保内・江刺家）のいずれの名でもなく、この一帯の郡名として使われてきた「九戸」を採ったものである
    kind: fact
    level: E2
    status: established
    sources:
    - z6-kunohe-vill-plan
    - t4-nukabe-wiki
  - text: 九戸城は九戸村にはなく、二戸市に存在する。これは「九戸氏の居城」という意味合いの名である
    kind: fact
    level: E5
    status: established
    sources:
    - z6-kunohe-wiki
  column:
    title: 九戸城は、九戸村にはない
    text: 「九戸」と聞いて思い浮かぶのは、豊臣秀吉の奥州仕置きに最後まで抵抗した九戸政実と、その居城・九戸城の戦いだろう。だが九戸城の跡は、九戸村ではなく隣の二戸市にある。城の名は「九戸氏の城」という意味で、村の名は「戸」の地名群の九番と郡名に由来する。同じ「九戸」でも、氏族の名・城の名・郡の名・村の名が、それぞれ別の場所や時代に根を持ちながら重なっている。1955年に生まれた村は、その重なりの中から郡の名を受け継いだ。
    sources:
    - z6-kunohe-wiki
    - z6-kunohe-vill-plan
  relations:
  - pref/03
  - muni/03-一戸町
  - muni/03-二戸市
  unknowns:
  - 1955年の合併協議で「九戸」を新村名に決めた経緯の一次記録は未確認
  - 「九戸」の名が文書に初めて現れる年と文献は未確認
  updated: '2026-11-13'
- id: muni/03-二戸市
  code: '032131'
  names:
    ja: 二戸市
    reading: にのへし
    aliases:
    - 福岡町
    - 二戸郡
  user_terms:
  - 戸（へ）のつく地名の一つ
  - 金田一温泉のまち
  - 漆のまち
  - カシオペア連邦
  naming_type: その他
  prefecture: 岩手県
  homonyms: []
  summary: 「二戸」は、古代〜中世に陸奥国糠部郡を一から九までの「戸」に分けた区分の名残とされる地名で、一戸・三戸・五戸〜九戸と並ぶ「戸（へ）」の地名群の一つ。馬の牧場を分けた「九戸四門」の制に由来するという説明が県・市ともに伝えられるが、由来には諸説あり確定していない。「四戸」だけは現行の自治体名として残っていない。現在の二戸市は1972年に福岡町と金田一村が合併して生まれ、2006年に浄法寺町と合併した。
  first_attestation:
    era: null
    year_western: null
    document: null
    note: 「二戸」の名自体の初出となる一次文書は確認できなかった。岩手県の文化情報大事典は、平安時代に採用された「九戸四門」制に由来すると説明する
  claims:
  - text: 総務省の全国地方公共団体コードで、二戸市の団体コードは032131と定められている
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  - text: 岩手県の文化情報大事典「市名の由来」は、二戸の由来を、平安時代に糠部郡を蝦夷から守るため四方に柵と門を設け、のちにその囲いの中で馬を育てるため門に一から九までの番号をふって一戸に一牧場を置く「九戸四門」制を採用したことによると説明する
    kind: fact
    level: E2
    status: contested
    sources:
    - a-cap-morioka-bunka
  - text: 二戸市は、この地方が軍馬の育成に適し「糠部の馬」が中央政府に納められていた土地柄であったと説明している
    kind: fact
    level: E2
    status: established
    sources:
    - t4-ninohe-city-intro
  - text: 鎌倉時代の文治5年（1189年）、甲斐国の南部三郎光行が軍功により糠部郡を授けられ、官営牧場の馬を経営するためこの地方を九つの牧場（戸）に分け、東西南北に4つの門を設けて「九ヶ戸四門」と呼ばれる制度を敷いたと伝えられ、その行政区分の名残が現在の地名として残った
    kind: legend
    level: E2
    status: established
    sources:
    - t4-ninohe-city-intro
  - text: 岩手県立図書館のレファレンス事例によれば、「戸」の由来には諸説があり、南部氏の「九牧」に由来する説、貢馬の「幣（へ）」に関わる説、蝦夷に対する防衛施設（木戸・関所・城柵）に関わる説、糠部開拓経営のためのエリア区分に由来する説などが参考文献に挙げられている
    kind: fact
    level: E2
    status: contested
    sources:
    - t4-iwate-lib-ref-he
  - text: 糠部郡は寛永11年（1634年）に北郡・二戸郡・三戸郡・九戸郡に分割され、四戸を除く一戸から九戸までの名は現在も行政地名として現存している
    kind: fact
    level: E5
    status: established
    sources:
    - t4-nukabe-wiki
  - text: 現在の二戸市の前身は、昭和47年（1972年）に福岡町と金田一村が合併して市制を施行し二戸市と命名されたもので、平成18年（2006年）1月1日に旧二戸市と旧浄法寺町が合併して新しい二戸市が誕生した
    kind: fact
    level: E2
    status: established
    sources:
    - a-cap-morioka-bunka
    - t4-ninohe-city-intro
  column:
    title: 並んでいるのに一つだけない「四戸」
    text: 岩手県北部から青森県にかけて、一戸・二戸・三戸・五戸・六戸・七戸・八戸・九戸と、「戸（へ）」のつく地名が順に並んでいます。ところが四戸だけは、現在の自治体名としては存在しません。岩手県立図書館のレファレンス事例によれば、四戸は地名としては失われたものの、四戸氏の名を介して四戸城跡（二戸市金田一）などに痕跡を残しているといいます。番号のついた区分の名残とされる一連の地名の中で、欠けた「四」がかえって、この地名群が古い制度の名残であることを物語っています。
    sources:
    - t4-iwate-lib-ref-he
    - t4-nukabe-wiki
  relations:
  - pref/03
  unknowns:
  - 「戸」の制度の実態（牧場区分か、防衛の柵か、行政区分か）は資料によって説明が分かれ、一次史料で確定できなかった
  - 「二戸」という区分名の初出となる文書を確認できなかった
  - 四戸が地名として失われた時期と経緯は、確認した資料では特定できなかった
  updated: '2026-11-13'
- id: muni/03-住田町
  code: '034410'
  names:
    ja: 住田町
    reading: すみたちょう
    aliases:
    - 世田米町
  user_terms:
  - すみた
  - 森林と林業の町
  - 世田米とは
  - 成瀬町にならなかった町
  naming_type: 合併新設
  prefecture: 岩手県
  homonyms: []
  summary: 住田町は1955年の合併で生まれた合成地名である。世田米町と上有住村・下有住村が合併する際、有住の「住」と世田米の「田」を組み合わせて「住田」とした。合併協議では当初、気仙川の別名に因む「成瀬町」が予定されていたが、反対があって現在の名に落ち着いたという。町の中心は旧世田米町で、旧名「世田米」は「せたまい」と読む。
  first_attestation:
    era: 昭和30年
    year_western: 1955
    document: 町村合併による住田町の発足
    note: 合成地名「住田」の命名そのものが初出。構成要素の世田米・有住の地名はそれ以前に遡る
  claims:
  - text: 総務省の全国地方公共団体コードで、住田町の団体コードは034410と定められている
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  - text: 岩手県の文化情報大事典によれば、住田の名は、1955年に世田米町と上有住村・下有住村が合併した際、有住の「住」と世田米の「田」を組み合わせたものである
    kind: fact
    level: E2
    status: established
    sources:
    - z6-iwate-bunka-chimei
  - text: 合併協議の際は、地域を流れる気仙川（成瀬川）に由来する「成瀬町」にする予定だったが、反対により現在の「住田町」となった
    kind: fact
    level: E5
    status: established
    sources:
    - z6-sumita-wiki
  - text: 明治22年（1889年）に世田米村・上有住村・下有住村がそれぞれ単独で村制を施行し、昭和15年（1940年）に世田米村が町制を施行して世田米町となった
    kind: fact
    level: E5
    status: established
    sources:
    - z6-sumita-wiki
  - text: 昭和30年（1955年）4月1日、世田米町・上有住村・下有住村が合併して住田町となった
    kind: fact
    level: E2
    status: established
    sources:
    - z6-iwate-bunka-chimei
    - z6-sumita-wiki
  - text: 合併前の中心地・世田米は「せたまい」と読み、現在も住田町の中心地区の名として残っている
    kind: fact
    level: E2
    status: established
    sources:
    - z6-iwate-bunka-chimei
  column:
    title: あやうく「成瀬町」になるところだった
    text: 住田町の名は、最初から決まっていたわけではない。合併協議では、町を流れる気仙川の上流部の名「成瀬」に因んだ「成瀬町」が予定されていた。ところが反対が出て、白紙に戻り、最後に選ばれたのが有住の「住」と世田米の「田」を合わせた「住田」だった。川の名か、旧村名の合成か。昭和の合併では、こうした綱引きの末に生まれた名が全国に数多くある。世田米（せたまい）という難読の旧名も、合成地名の中に「田」の一文字だけを残して生き延びた。
    sources:
    - z6-sumita-wiki
  relations:
  - pref/03
  unknowns:
  - 「成瀬町」案への反対の理由や、合併協議の具体的な経緯の一次記録は未確認
  - 世田米・有住それぞれの地名の語源は未確認
  updated: '2026-11-13'
- id: muni/03-八幡平市
  code: '032140'
  names:
    ja: 八幡平市
    reading: はちまんたいし
    aliases:
    - 西根町
    - 松尾村
    - 安代町
  user_terms:
  - 八幡平ドラゴンアイ
  - 雪の回廊
  - 日本百名山の山の名をもつ市
  - 安比高原のある市
  naming_type: 合併新設
  prefecture: 岩手県
  homonyms: []
  summary: 2005年に岩手郡の西根町・松尾村・安代町が合併して生まれた市で、市名は市域の西にそびえる八幡平（標高1,614m）の山名に由来する。八幡平は岩手・秋田両県にまたがる火山性の高原台地で、日本百名山の一つであり、十和田八幡平国立公園に含まれる。山名そのものの由来は確定しておらず、坂上田村麻呂が八幡神を祀って「八幡平」と名付けたという伝承が伝えられるにとどまる。構成した3町村のいずれの名でもない、地域の象徴である山の名を新市名に採った事例である。
  first_attestation:
    era: 平成17年
    year_western: 2005
    document: 八幡平市の発足（平成17年9月1日）
    note: 市名としての初出。山名「八幡平」自体の初出となる文書は確認できなかった
  claims:
  - text: 総務省の全国地方公共団体コードで、八幡平市の団体コードは032140と定められている
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  - text: 八幡平市によれば、市は平成17年（2005年）9月1日に旧西根町・旧松尾村・旧安代町の2町1村が合併して誕生した
    kind: fact
    level: E2
    status: established
    sources:
    - t4-hachimantai-city-plan
  - text: 市名の「八幡平」は、市の西にそびえる日本百名山の八幡平（標高1,614m）に由来する
    kind: fact
    level: E5
    status: established
    sources:
    - t4-hachimantai-wiki
  - text: 八幡平は秋田県と岩手県にまたがる標高1,614mの山およびその周囲の高原台地で、山域は1956年（昭和31年）に十和田八幡平国立公園に指定された
    kind: fact
    level: E5
    status: established
    sources:
    - t4-hachimantai-wiki
  - text: 桓武天皇の勅命で奥州に下った坂上田村麻呂が、八幡平にたどり着いて景色に感激し、戦の神である八幡神を奉って戦勝を祈り、討伐後にこの地を「八幡平」と名付けたと伝えられるが、史実では田村麻呂はこの地には至っていない
    kind: legend
    level: E5
    status: established
    sources:
    - t4-hachimantai-wiki
  - text: 秋田県側にも、同じ山名にちなむ八幡平村（1956〜1972年、現在の鹿角市の一部）が存在した時期がある
    kind: fact
    level: E5
    status: established
    sources:
    - t4-hachimantai-wiki
  column:
    title: 平らすぎて土を盛られた山頂
    text: 八幡平の「平」は伊達ではなく、主峰の頂上部はあまりに平らで、どこが山頂か分からないほどでした。1962年には、あまりに平らで山頂らしくないということで、岩手県が山頂に土盛りをして人為的に高くしたという記録が残っています。春には山頂近くの鏡沼の雪どけ模様が竜の目に似る「ドラゴンアイ」で知られるこの山の名は、2005年の合併で3町村のどの名でもない新しい市名として選ばれ、山の両側にかつてあった自治体の名（岩手側の八幡平市と、かつての秋田側の八幡平村）にもなっています。
    sources:
    - t4-hachimantai-wiki
  relations:
  - pref/03
  unknowns:
  - 新市名「八幡平」が合併協議会でどのように選定されたか（公募の有無・候補名など）の詳細は、市の公式資料で確認できなかった
  - 山名「八幡平」の初出と命名年代は確認できなかった
  - 市名の由来を八幡平市の公式サイト自身が説明するページを確認できなかった（市公式資料は合併の事実の確認にとどまった）
  updated: '2026-11-13'
- id: muni/03-北上市
  code: 032069
  names:
    ja: 北上市
    reading: きたかみし
    aliases:
    - 黒沢尻町
  user_terms:
  - 北上は日高見から来た名前か
  - 黒沢尻はどうなったのか
  - 北上川の名前の由来
  naming_type: 一部の地名
  prefecture: 岩手県
  homonyms: []
  summary: 市名は、北上川の流域を指す広域名「北上」を採用したものである。その語源は古名「日高見（ヒタカミ）」が変わったものとされ、解釈には諸説がある。昭和29年（1954年）、黒沢尻町・飯豊村など7町村が合併した際に「北上市」と命名された。
  first_attestation:
    era: 昭和29年
    year_western: 1954
    document: 北上市の命名（黒沢尻町ほか7町村の合併・市制施行）
    note: 市名としての初出。「北上」「日高見」という語自体は古代の記録に遡るが、市名との直接の系譜は合併時の命名による
  claims:
  - text: 岩手県の「いわての文化情報大事典」は、「北上」は「日高見（ヒタカミ）」から変わったものだとする
    kind: fact
    level: E2
    status: contested
    sources:
    - a-cap-morioka-bunka
  - text: 「日高見」の解釈には、ヒダ（山ひだ）にカ（処）を結ぶ説、ヒダ（高）にカ（地）を結ぶ説、ヒナ（夷）にカ（処）を結ぶ説、ヒタカミを「辺境」とみる説の4説があり、同大事典に併記されている
    kind: fact
    level: E2
    status: contested
    sources:
    - a-cap-morioka-bunka
  - text: 昭和29年（1954年）、黒沢尻町・飯豊村・二子村・更木村・福岡村・鬼柳村・相去村が合併して「北上市」と命名された、と同大事典は述べる
    kind: fact
    level: E2
    status: established
    sources:
    - a-cap-morioka-bunka
  - text: 地方公共団体コードは032069である（総務省「地方公共団体コード一覧」）
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 「日高見」の面影
    text: 古代の東北は、朝廷から見て「日高見（ひたかみ）」の地と呼ばれたという伝承的な地理観があります。「ヒタカミ」が「キタカミ」へと音を変えたというのが県の大事典の説明で、山ひだ・高地・夷の地・辺境という4つの解釈が並びます。かつての中心地・黒沢尻の名を捨て、川と地域の大きな名「北上」を選んだ1954年の命名は、広域の名を新しい市の看板にする戦後らしい選択でした。
    sources:
    - a-cap-morioka-bunka
  relations:
  - pref/03
  unknowns:
  - 1954年の合併時に「北上」と命名した理由の明文（川名・北上駅名との関係を含む）は、県の大事典には記されておらず未確認
  - 「日高見」の語が見える古代の原典（『日本書紀』等）との照合は未実施
  - 平成3年（1991年）の和賀町・江釣子村との合併など、その後の市域の変遷は本レコードでは未確認
  updated: '2026-11-13'
- id: muni/03-大槌町
  code: '034614'
  names:
    ja: 大槌町
    reading: おおつちちょう
    aliases: []
  user_terms:
  - おおつち
  - ひょっこりひょうたん島の町
  - 吉里吉里のある町
  - 蓬莱島のある町
  naming_type: 一部の地名
  prefecture: 岩手県
  homonyms: []
  summary: 大槌町は三陸海岸の大槌湾に面した町で、その名は大槌川の流域の古い地名に由来する。語源は確定しておらず、県の文化情報大事典は「ツツ（包む）」とする説、大きな川内（オホウチ）とする説、「津地（船着場）」とする説、「辻（道の交差）」とする説の4説を併記する。中世には大槌氏が大槌城に拠った。1889年に大槌村・小鎚村・吉里吉里村が合併して町制を施行し、1955年に金沢村と合併して現在の町となった。2011年の東日本大震災で甚大な被害を受けた。
  first_attestation:
    era: 明治22年
    year_western: 1889
    document: 市町村制施行による大槌町の成立
    note: 町としての初出。地名「大槌」自体は中世の大槌氏の名などに遡るが、文書上の初出年は未確認
  claims:
  - text: 総務省の全国地方公共団体コードで、大槌町の団体コードは034614と定められている
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  - text: 岩手県の文化情報大事典は「大槌」の由来として、ツツ（包む）の意味で崎に包まれた地とする説、大槌川・小鎚川流域の大きな川内（オホウチ）で小鎚は小さい川内とする説、「津地」の意味で船着場とする説、「辻」の意味で道の交差するところとする説の4説を挙げており、定説は決まっていない
    kind: fact
    level: E2
    status: contested
    sources:
    - z6-iwate-bunka-chimei
  - text: 戦国時代、当地は大槌氏の支配下にあったが、元和3年（1617年）に大槌孫八郎政貞が南部利直から謀反の嫌疑をかけられて切腹し、大槌氏は断絶した
    kind: fact
    level: E5
    status: established
    sources:
    - z6-otsuchi-wiki
  - text: 明治22年（1889年）4月1日、南閉伊郡の大槌村・小鎚村・吉里吉里村が合併し、町制を施行して大槌町が成立した
    kind: fact
    level: E2
    status: established
    sources:
    - z6-otsuchi-uub
  - text: 昭和30年（1955年）4月1日、大槌町と金沢村が合併し、現在の大槌町となった
    kind: fact
    level: E5
    status: established
    sources:
    - z6-otsuchi-wiki
  - text: 大槌湾内の蓬莱島は、江戸時代には「珊瑚島」と呼ばれていたが、元文3年（1738年）に盛岡藩主・南部利視が巡検の際に命じて「蓬莱島」と呼ばれるようになった
    kind: fact
    level: E4
    status: established
    sources:
    - z6-otsuchi-ta-horai
  - text: 大槌町は平成23年（2011年）の東日本大震災の津波で甚大な被害を受け、蓬莱島の大槌港灯台も倒壊し、その後再建された
    kind: fact
    level: E4
    status: established
    sources:
    - z6-otsuchi-ta-horai
    - z6-otsuchi-wiki
  column:
    title: ひょうたん島の本当の名前は蓬莱島
    text: 大槌湾に浮かぶ小さな島は、人形劇『ひょっこりひょうたん島』のモデルといわれ、「ひょうたん島」の愛称で親しまれている。だが正式な名は蓬莱島で、江戸時代には珊瑚島と呼ばれていたものを、1738年に藩主・南部利視が巡見の際に「蓬莱島」と名付けたと伝わる。中国の伝説で仙人の住むとされる理想郷の名である。東日本大震災では島の灯台が根元から倒壊したが、住民の応募デザインで再建され、いまは復興のシンボルになっている。愛称と由緒ある名と、二つの名を持つ島である。
    sources:
    - z6-otsuchi-ta-horai
  relations:
  - pref/03
  - muni/03-山田町
  unknowns:
  - 「大槌」の語源は4説が併記されるにとどまり、確定していない
  - 「大きな槌」に結びつける民間伝承の確かな記録は、今回の調査では確認できなかった
  updated: '2026-11-13'
- id: muni/03-大船渡市
  code: '032034'
  names:
    ja: 大船渡市
    reading: おおふなとし
    aliases:
    - 大船渡町
  user_terms:
  - 大船渡は大きな船着場という意味か
  - サン・アンドレス湾と呼ばれた理由
  - 大船渡の名前はいつからあるのか
  naming_type: 一部の地名
  prefecture: 岩手県
  homonyms: []
  summary: 市名は中世以来の地名「大船渡」の継承で、岩手県の文化情報大事典は「大きな船着場」の意味とする。昭和27年（1952年）に大船渡町・盛町の2町と5村が合併して市制を施行し、平成13年（2001年）に三陸町を編入した。
  first_attestation:
    era: 昭和27年
    year_western: 1952
    document: 大船渡市の市制施行
    note: 市名としての初出。地名「大船渡」自体は中世以来とされるが、具体的な初出文書は未確認
  claims:
  - text: 岩手県の「いわての文化情報大事典」は、「大船渡」の由来を「大きな船着場」の意味とする
    kind: fact
    level: E2
    status: established
    sources:
    - a-cap-morioka-bunka
  - text: ブリタニカ国際大百科事典は、市名は港を意味する中世以来の地名であり、1952年に大船渡町・盛町の2町と赤崎村・日頃市村・猪川村・立根村・末崎村の5村が合体して市制を施行した、と述べる
    kind: fact
    level: E3
    status: established
    sources:
    - m1-ofunato-kotobank
  - text: 2001年（平成13年）11月15日に東隣の気仙郡三陸町を編入した、と日本歴史地名大系は述べる
    kind: fact
    level: E3
    status: established
    sources:
    - m1-ofunato-kotobank
  - text: 大船渡市は大船渡港の沿革として、慶長16年（1611年）にスペインの探検家セバスチャン・ビスカイノが当地を探検し、湾を讃えて「サン・アンドレス湾」と名付けたことを紹介している
    kind: fact
    level: E2
    status: established
    sources:
    - m1-ofunato-city-port
  - text: 地方公共団体コードは032034である（総務省「地方公共団体コード一覧」）
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 「サン・アンドレス」と名付けられた湾
    text: 1611年、スペインの探検家ビスカイノは三陸沿岸を測量して大船渡湾に入り、その天然の良港ぶりに感嘆して、聖アンドレの祝日にちなみ「サン・アンドレス」と名付けました。明治に入ると渋沢栄一が「東北における絶好の良港」と絶賛し、横断鉄道と大製鉄所の壮大な計画まで描かれました。「大きな船着場」という地名の意味どおり、この湾は近世・近代を通じて大きな船を迎える場所であり続けたのです。
    sources:
    - m1-ofunato-city-port
    - m1-ofunato-kotobank
  relations:
  - pref/03
  unknowns:
  - 「大船渡」の名が見える中世文書の具体的な初出は未確認
  - 大きな船の到来に結びつける命名伝承は、今回確認した公的・専門資料には見当たらなかった
  updated: '2026-11-13'
- id: muni/03-奥州市
  code: 032158
  names:
    ja: 奥州市
    reading: おうしゅうし
    aliases:
    - 水沢市
    - 江刺市
  user_terms:
  - 奥州市の名前は大きすぎないか
  - 奥州市の名前は公募で決まったのか
  - 奥州とはどこのことか
  naming_type: 合併新設
  prefecture: 岩手県
  homonyms: []
  summary: 平成18年（2006年）2月20日、水沢市・江刺市・胆沢郡前沢町・胆沢町・衣川村の合併で誕生した。市名「奥州」は陸奥国の別称にあたる広域地名で、住民公募で集まった569案から絞り込まれ、合併協議会の決選投票で「水沢市」を破って決まった。一つの市が東北地方の大半を指す名を名乗ることには、「僭称」との批判も向けられた。
  first_attestation:
    era: 平成18年
    year_western: 2006
    document: 奥州市の市制施行（5市町村の新設合併）
    note: 市名としての初出。「奥州」の語自体は陸奥国の別称として古くからある
  claims:
  - text: 平成18年（2006年）に水沢市・江刺市・胆沢郡前沢町・胆沢町・衣川村が合併し、奥州市が誕生した、と岩手県の「いわての文化情報大事典」は述べる
    kind: fact
    level: E2
    status: established
    sources:
    - a-cap-morioka-bunka
  - text: 合併の期日は2006年2月20日であった、と国土計画協会の研究助成論文は述べる
    kind: fact
    level: E3
    status: established
    sources:
    - m1-oshu-kokudo
  - text: 新市名は一般公募で決められ、2005年1月24日から2月14日まで5市町村の全住民を対象に募集して569案が集まった。その際、応募数は考慮せず、各案は等価に扱われた、と同論文は述べる
    kind: fact
    level: E3
    status: established
    sources:
    - m1-oshu-kokudo
  - text: 小委員会の絞り込みで残った5案（みちのく・奥州・北平泉・胆沢城・水沢）について、2005年2月25日の合併協議会で委員40名が無記名投票を行い、奥州21票・水沢9票・胆沢城4票・みちのく4票・北平泉2票となった。過半数ではなく3分の2以上の得票が必要だったため上位2案の決選投票となり、奥州29票・水沢11票で「奥州市」に決定した、と同論文は地元紙の報道を引いて述べる
    kind: fact
    level: E3
    status: established
    sources:
    - m1-oshu-kokudo
  - text: 決定に際し、協議会会長であった水沢市長は「広い気持ち、広い大地を感じる、将来に期待を持てる名称だと思う」とコメントした、と同論文は紹介する
    kind: fact
    level: E3
    status: established
    sources:
    - m1-oshu-kokudo
  - text: 「奥州」は本来、陸奥国全体ないし東北地方を指す広域地名であり、一つの市がこれを名乗ることは「僭称」だという批判（片岡、2005年）もあった、と同論文は論評を整理している
    kind: fact
    level: E3
    status: contested
    sources:
    - m1-oshu-kokudo
  - text: 地方公共団体コードは032158である（総務省「地方公共団体コード一覧」）
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 決選投票29対11
    text: 「奥州市」の誕生は、最後は投票で決まりました。公募569案から小委員会が絞った5案を協議会委員が投票し、中心都市の名「水沢」と広域地名「奥州」が決選投票へ。結果は29対11でした。もう一つの候補地だった隣の平泉は、かつて奥州藤原氏の本拠でした。その「奥州」の看板を、平泉を含まない合併が掲げたところに、この名前の野心と論争の両方があります。
    sources:
    - m1-oshu-kokudo
  relations:
  - pref/03
  unknowns:
  - 公募で「奥州」案そのものが何件応募されたかは、応募数を考慮しない方式だったため、論文にも明記がない
  - 「奥州」の語の最古の用例など、語史そのものの確認は本レコードでは未実施
  updated: '2026-11-13'
- id: muni/03-宮古市
  code: '032026'
  names:
    ja: 宮古市
    reading: みやこし
    aliases:
    - 宮古
    - 宮古町
    - 閉伊
  user_terms:
  - 宮古
  - みやこ
  - 浄土ヶ浜
  - 本州最東端のまち
  - 三陸の港町
  naming_type: その他（港町として定着した「宮古」の名を継承）
  prefecture: 岩手県
  homonyms: []
  summary: 三陸海岸のほぼ中央に位置する港町である。名の由来に定説はなく、岩手県の文化情報大事典は「閉伊地方の中心地を意味する『都』から」をはじめ7説を併記する。江戸時代は盛岡藩の代官所が置かれ、宮古港からの交易で領内屈指の繁華地となった。昭和16年（1941年）に宮古町など1町3村が合併して市制を施行し、平成17年（2005年）に田老町・新里村と合併、平成22年（2010年）に川井村を編入した。沖縄県宮古島市とは同名ではないが、宮古島市の側が合併時に「宮古市」との同名回避をした関係にある。
  first_attestation:
    era: ''
    year_western: null
    document: ''
    note: 「宮古」の地名の文献上の初出は特定できなかった。中世の閉伊地方の文書には宮古湾周辺の鍬ヶ崎・笠間などの地名が見えるが、「宮古」そのものは本バッチでは確認できていない
  claims:
  - text: 岩手県の「いわての文化情報大事典」は、宮古の市名の由来として「閉伊地方の経済・文化の中心地の意味で『都』から」とする説など7つの説を併記しており、定説は定まっていない
    kind: fact
    level: E2
    status: contested
    sources:
    - a-cap-morioka-bunka
  - text: 同大事典はほかに、「ミヤ（宮）コ（処）で神社があるところ」「『港』からの転化」「ミヤ（野原）コ（土地）」「宮木（神社や仏堂をつくる材木）の意味」「宮子で神社の氏子」などの説を挙げている
    kind: fact
    level: E2
    status: contested
    sources:
    - a-cap-morioka-bunka
  - text: 江戸時代の宮古は盛岡藩の代官所が置かれ、宮古湾周辺の海産物を宮古港から江戸へ送る交易により、領内屈指の繁華地として賑わったと宮古市の総合計画は述べている
    kind: fact
    level: E2
    status: established
    sources:
    - t3-miyako-city-plan
  - text: 中世の鎌倉時代には源氏ゆかりの閉伊頼基が閉伊郡を拝領したと言われ、この地域は近世まで閉伊郡（後の下閉伊郡）に属したと市の総合計画は述べている
    kind: fact
    level: E2
    status: established
    sources:
    - t3-miyako-city-plan
  - text: 昭和16年（1941年）2月11日、下閉伊郡の宮古町・磯鶏村・千徳村・山口村が合併して宮古市が発足した
    kind: fact
    level: E5
    status: established
    sources:
    - t3-miyako-uub
  - text: 平成17年（2005年）6月6日に田老町・新里村と合併し、平成22年（2010年）1月1日に川井村を編入した
    kind: fact
    level: E2
    status: established
    sources:
    - t3-miyako-city-plan
  - text: 宮古市の地方公共団体コードは032026である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 決まらない「みやこ」と、もう一つの「みやこ」
    text: 宮古の語源候補は、県の大事典に7つも並ぶ。「都」か、「宮のある処」か、「港」の転化か。港町らしく交易の都を名乗ったという説もあれば、神社の材木「宮木」に由来するという職人の匂いのする説もある。そして日本にはもう一つ「みやこ」がある。沖縄の宮古島市は、合併のとき一度は「宮古市」に決まりながら、先にある岩手の宮古市と重なることを避けて「宮古島市」と改めた。決まらない語源の町と、同名を譲られた島の町。二つの「みやこ」は、名前の重さと軽さの好対照である。
    sources:
    - a-cap-morioka-bunka
    - t3-miyako-city-plan
  relations:
  - pref/03
  - muni/47-宮古島市
  unknowns:
  - 「宮古」の地名の文献上の初出は、本バッチでは確認できなかった
  - 県の大事典が挙げる7説の中にアイヌ語起源を明示するものはなく、語源の系統そのものが確定していない
  updated: '2026-11-13'
- id: muni/03-山田町
  code: 034827
  names:
    ja: 山田町
    reading: やまだまち
    aliases:
    - 山田村
  user_terms:
  - やまだ
  - 山田湾の町
  - オランダ島のある町
  - ブレスケンス号が来た町
  naming_type: 一部の地名
  prefecture: 岩手県
  homonyms: []
  summary: 山田町は三陸海岸の山田湾に面した町で、1889年に山田村と飯岡村が合併して町となった。「山田」は全国に無数にある普通地名で、当地の語源を説明する公的な資料は見当たらず、未詳として残す。1955年に豊間根村・大沢村・織笠村・船越村と合併して現在の町となった。町公式の年表は、715年の『続日本紀』の「閉村」の記事や、1643年のオランダ船ブレスケンス号の入港を、町の古い記録として紹介している。
  first_attestation:
    era: 明治22年
    year_western: 1889
    document: 市町村制施行による山田町の成立（山田村・飯岡村の合併）
    note: 町としての初出。「山田村」の名はそれ以前からあったが、その初出と語源は未確認
  claims:
  - text: 総務省の全国地方公共団体コードで、山田町の団体コードは034827と定められている
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  - text: 山田町公式の年表によれば、明治22年（1889年）の市町村制実施により、飯岡村と山田村が合併して山田町となった
    kind: fact
    level: E2
    status: established
    sources:
    - z6-yamada-town-ayumi
  - text: 昭和30年（1955年）に山田町・豊間根村・大沢村・織笠村・船越村の1町4村が合併し、新しい山田町が誕生した
    kind: fact
    level: E2
    status: established
    sources:
    - z6-yamada-town-ayumi
  - text: 山田町公式の年表は、霊亀元年（715年）の『続日本紀』に、蝦夷の須賀君古麻比留が「閉村に郡家を建てて下さい」と求めた記述があり、この頃には当地方にも国政が及んでいたと推測されることを紹介している
    kind: fact
    level: E2
    status: established
    sources:
    - z6-yamada-town-ayumi
  - text: 寛永20年（1643年）、山田湾にオランダ船ブレスケンス号が水と食料を求めて入港したが、オランダ人10名が南部藩に捕らえられ江戸へ護送された
    kind: fact
    level: E2
    status: established
    sources:
    - z6-yamada-town-ayumi
  - text: 山田町公式の年表によれば、平成23年（2011年）の東日本大震災で大津波が発生し、本町の死者・不明者は825人に上った
    kind: fact
    level: E2
    status: established
    sources:
    - z6-yamada-town-ayumi
  column:
    title: オランダ船が来た湾、いまは友好都市の縁
    text: 1643年、オランダ船ブレスケンス号が山田湾に入ってきた。水と食料を求めた乗組員10名は南部藩に捕らえられ、江戸へ送られる事件になった（ブレスケンス号事件）。湾内の小島は、のちに「オランダ島」と呼ばれるようになる。350年を超えた2000年、山田町はオランダのザイスト市と友好都市を締結した。捕らえられた側と捕らえた側の子孫同士が、今度は交流のために向き合う。漁港の町の名前「山田」の由来は分からないままだが、湾の歴史は江戸時代の国際事件から現代の国際交流までを抱えている。
    sources:
    - z6-yamada-town-ayumi
  relations:
  - pref/03
  - muni/03-大槌町
  unknowns:
  - 「山田」の語源は、町公式資料にも専門資料にも当地についての説明が見当たらず、未詳
  - 中世以前の「山田村」の名の初出は未確認
  updated: '2026-11-13'
- id: muni/03-岩手町
  code: '033031'
  names:
    ja: 岩手町
    reading: いわてまち
    aliases:
    - 沼宮内町
  user_terms:
  - いわてまち
  - 県名と同じ名前の町
  - 沼宮内の町
  - 岩手山の見える町
  naming_type: 合併新設
  prefecture: 岩手県
  homonyms: []
  summary: 岩手町は、県名とまったく同じ「岩手」を名乗る町である。1955年、沼宮内町・御堂村・一方井村・川口村が合併する際、合併町村の名を引き継がず、所属する岩手郡の郡名「岩手」を新町名に採用した。その岩手郡は平安時代の奥六郡の一つで、「岩手」の名は『大和物語』に「磐手」と現れるのが初出とされる。県名も同じ岩手郡に由来するので、県と町は一つの郡名を分け合っている。ただし郡名の語源自体は確定しておらず、有名な鬼の手形の伝説は、郡の中心だった盛岡に伝わる話である。
  first_attestation:
    era: 昭和30年
    year_western: 1955
    document: 町村合併による岩手町の発足
    note: 町名としての初出。「岩手」の名自体は、『大和物語』第152段に「磐手の郡」から献上された鷹の名として現れるのが初出とされる
  claims:
  - text: 総務省の全国地方公共団体コードで、岩手町の団体コードは033031と定められている
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  - text: 岩手町公式の年表によれば、昭和30年（1955年）7月21日、沼宮内町・御堂村・一方井村・川口村の1町3村が合併し、「岩手町」となった
    kind: fact
    level: E2
    status: established
    sources:
    - z6-iwate-town-history
  - text: 新町名「岩手」は、合併した4町村のいずれの名でもなく、当時4町村が属していた岩手郡の郡名を採用したものとみられる
    kind: fact
    level: E2
    status: inferred
    sources:
    - z6-iwate-town-history
    - a-iwa-pref
  - text: 「岩手」の名が文献に現れる最初は『大和物語』第152段で、陸奥国・磐手の郡から献上された鷹に帝が付けた名「磐手」として登場するとされる
    kind: fact
    level: E2
    status: established
    sources:
    - a-yamato-monogatari
    - a-iwa-lib
  - text: 岩手郡は平安時代に斯波（志波）郡から分かれて成立した奥六郡の一つとされ、その成立は940年から950年頃と推測される
    kind: fact
    level: E3
    status: inferred
    sources:
    - a-iwa-lib
  - text: 郡名「岩手」自体の語源は確定しておらず、「岩出の森」に由来する説などがあるが決め手はない
    kind: fact
    level: E3
    status: indeterminate
    sources:
    - a-iwa-lib
  - text: 県名「岩手県」も同じ岩手郡の郡名に由来し、明治5年（1872年）に盛岡県から岩手県へ改称された。岩手町と岩手県は、同じ郡名を源泉とする名前である
    kind: fact
    level: E2
    status: established
    sources:
    - a-iwa-pref
  - text: 盛岡市の三ツ石神社に伝わる鬼の手形の伝説、すなわち羅刹鬼が大石に手形を押して逃げ去ったためこの地を「岩手」と呼ぶようになったという話は、郡の中心だった盛岡に伝わる伝承であり、岩手町の町名の直接の由来ではない
    kind: legend
    level: E2
    status: established
    sources:
    - a-iwa-bunka
  column:
    title: 県とおそろいの名前の町
    text: 「岩手町」と聞くと、県庁所在地の間違いかと思う人がいる。県庁は盛岡市にあり、岩手町は盛岡から北へ国道4号を進んだ先の、人口1万人ほどの町だ。中心地の名はもともと沼宮内で、いまも新幹線の駅は「いわて沼宮内駅」を名乗る。1955年の合併で、町は沼宮内でも御堂でもなく、一段大きな「岩手郡」の名を名乗ることにした。県もまた同じ郡名から生まれている。県名と町名が一つの郡名の「きょうだい」だという関係は、全国でもここだけのものだろう。
    sources:
    - z6-iwate-town-history
    - a-iwa-pref
  relations:
  - pref/03
  - muni/03-盛岡市
  unknowns:
  - 1955年の合併協議で「岩手」を新町名に決めた経緯の一次記録は未確認
  - 郡名「岩手」の語源は未確定（県レコード・盛岡市レコードと共通の未解決点）
  updated: '2026-11-13'
- id: muni/03-岩泉町
