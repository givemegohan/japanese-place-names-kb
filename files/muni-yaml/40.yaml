  - text: 町には大字がなく、住所は「福岡県田川郡糸田町○○番地○○」とだけ表示される
    kind: fact
    level: E2
    status: established
    sources:
    - upg-p2-itoda-japanpost
  - text: 現在の字名には上糸田・中糸田・下糸田・南糸田などがあり、「糸田」がこの地域の基幹的な地名であることがうかがえる
    kind: fact
    level: E2
    status: established
    sources:
    - upg-p2-itoda-japanpost
  - text: 町の西部の烏尾峠には、飯塚市との境界線上に豊前国と筑前国の国境石があり、町指定文化財（史跡）に指定されている。烏尾峠は古代からの交通の要衝だったとされる
    kind: fact
    level: E2
    status: established
    sources:
    - upg-p2-itoda-tagawa-list
    - upg-p2-itoda-zck
  - text: 糸田町の地方公共団体コードは406040である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 大字のない町――住所が町名で終わる
    text: 糸田町に住所を書くと「福岡県田川郡糸田町○○番地○○」で終わる。大字がないからだ。町の下には字こそあるが、住所表記には現れない。一方で、この町の名の起こりは一つの泉に結びつけられている。「泌泉（たぎり）」と呼ばれる湧泉が「糸田町の地名の起こり」とされ、町の指定文化財（史跡）第4号に指定されている。泉の名が町の名に育ち、町の名だけが住所に残る。糸田町は、地名の層がとても薄く、しかし一点に凝縮された町だといえる。
    sources:
    - r5-itoda-wiki
  relations:
  - pref/40
  unknowns:
