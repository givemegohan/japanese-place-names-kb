  - 懐古園のまち
  - 小諸の名前の由来
  naming_type: 一部の地名
  prefecture: 長野県
  homonyms: []
  summary: 小諸市は浅間山の南麓、千曲川沿いに広がる城下町で、「小諸」の名の初出は嘉暦4年（1329年）の鎌倉幕府下知状案とされる。語源については、『和名類聚抄』の大村郷に比定される地を「小村」と呼んだものが、村・室・諸と転訛したという説が『日本歴史地名大系』に紹介されている。江戸時代は牧野氏の城下町・北国街道の宿場町として栄え、1954年に1町5村の合併で市制を施行した。
  first_attestation:
    era: 嘉暦4年
    year_western: 1329
    document: 鎌倉幕府下知状案（守矢文書）
    note: 『日本歴史地名大系』の記載による。「佐久郡小諸 小諸太郎」とあるのが初出とされる（原典そのものの確認はしていない）
  claims:
  - text: 『日本歴史地名大系』によれば、「小諸」の名の初出は嘉暦4年（1329年）3月の鎌倉幕府下知状案（守矢文書）にみえる「佐久郡小諸 小諸太郎」である
    kind: fact
    level: E3
    status: established
    sources:
    - v2-komoro-kotobank
  - text: 同書は語源について、『和名類聚抄』に載る大村郷が現在の諸（もろ）地区に比定され、その辺りを「小村」と呼んだものが転訛して村から室、諸へと変わったという『北佐久郡志』の説を紹介する
    kind: fact
    level: E3
    status: contested
    sources:
    - v2-komoro-kotobank
  - text: 「小諸」は古くは「おむろ」とも読み、「小室」とも記された
    kind: fact
    level: E3
    status: established
    sources:
    - v2-komoro-kotobank
  - text: 小諸は江戸時代には牧野氏1万5,000石の城下町であり、北国街道の宿場町、佐久甲州街道の分岐点でもあって、信濃でも有数の商業の中心地だった（ブリタニカ国際大百科事典の解説による）
    kind: fact
    level: E3
    status: established
    sources:
    - v2-komoro-kotobank
  - text: 昭和29年（1954年）4月1日に、小諸町・三岡村・南大井村・北大井村・大里村・川辺村の1町5村の合併で市制を施行し、小諸市が発足した
    kind: fact
    level: E2
    status: established
    sources:
    - v2-komoro-gikai
  - text: 市街地西部の千曲川の断崖上にある小諸城跡の懐古園は、島崎藤村の『千曲川旅情の歌』によって知られる（ブリタニカ国際大百科事典の解説による）
    kind: fact
    level: E3
    status: established
    sources:
    - v2-komoro-kotobank
  - text: 小諸市の地方公共団体コードは202088である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 「小村」が「小諸」になるまで
    text: 小諸という不思議な響きの名は、もとは「小村」だったという。大村郷のあたりの小さな村を指す素朴な呼び名が、時代とともに音が崩れ、「小室（おむろ）」と書かれる時期を経て、やがて「小諸」の字が定着した。転訛の途中の姿が「おむろ」「小室」という読みと表記に残っているところが面白い。千曲川の崖の上に立つ小諸城の城下町として栄えたこの町は、その名自体が言葉の化石のような存在である。
    sources:
    - v2-komoro-kotobank
  relations:
  - pref/20
  unknowns:
  - 千曲川の中州（小諸島）に由来するという説は、本調査で確認した資料には見当たらなかった
  - 『北佐久郡志』の転訛説の原典そのものは確認できなかった（『日本歴史地名大系』経由の紹介による）
  - 守矢文書の下知状案の原文は確認できなかった
  updated: '2026-11-13'
- id: muni/20-岡谷市
  code: '202045'
  names:
    ja: 岡谷市
    reading: おかやし
    aliases:
    - 平野村
    - 岡谷村
  user_terms:
  - おかやし
  - 製糸のまち
  - シルクのまち
  - 諏訪湖の西岸
  naming_type: 一部の地名
  prefecture: 長野県
  homonyms: []
  summary: 岡谷市は諏訪湖の西岸、天竜川の源流に位置する工業都市で、市名は旧岡谷村の名を受け継ぐ。1936年、製糸業で栄えながら恐慌に苦しむ平野村が、多角的工業都市として再出発するために、町制を経ずに村から一気に市制を施行して岡谷市となった。村のまま市制を施行した例は長野県で唯一である。
  first_attestation:
    era: （未確認）
    year_western: null
    document: （未確認）
    note: 岡谷村は明治7年（1874年）の合併で平野村の一部となった旧村として市公式資料に名がみえるが、それ以前の「岡谷」の初出は確認できなかった
  claims:
  - text: 明治7年（1874年）10月13日に、諏訪郡の岡谷村・小口村・小井川村・今井村・若宮新田村・小梅沢新田村・西堀村の7ヵ村が合併して平野村となった
    kind: fact
    level: E2
    status: established
    sources:
    - v2-okaya-intro
  - text: 昭和11年（1936年）4月1日に、諏訪郡平野村が改称・市制施行して岡谷市が発足した。村が町制を経ずに市制施行したのは長野県では唯一で、全国でも11例のみである
    kind: fact
    level: E2
    status: established
    sources:
    - v2-okaya-intro
  - text: 市名「岡谷」は、平野村を構成した7ヵ村の一つである岡谷村の名である
    kind: fact
    level: E2
    status: established
    sources:
    - v2-okaya-intro
  - text: 製糸業で栄えた平野村は当時「村として日本一人口が多かった」が、世界恐慌の打撃を受けて不況に苦しんでおり、多角的工業都市として再出発し人心の一新を図るため、町制を経ずに一気に市制施行を選んだ
    kind: fact
    level: E2
    status: established
    sources:
    - v2-okaya-intro
  - text: その後、昭和30年（1955年）に湊村・川岸村を、昭和32年（1957年）に長地村を合併した
    kind: fact
    level: E2
    status: established
    sources:
    - v2-okaya-intro
  - text: 岡谷市は諏訪湖の西岸に面し、諏訪湖唯一の流出河川である天竜川はここから発して遠く浜松に達する
    kind: fact
    level: E2
    status: established
    sources:
    - v2-okaya-intro
  - text: 岡谷市の地方公共団体コードは202045である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 「日本一人口の多い村」の賭け
    text: 1936年の岡谷市誕生の裏には、製糸の町の危機があった。平野村は生糸の輸出で栄え、村でありながら日本一の人口を抱えるほどだったが、世界恐慌で生糸価格が暴落し、村政は行き詰まった。そこで選ばれたのが、町を経ずに村から一足飛びに市になるという再出発だった。長野県で唯一、全国でも11例しかない異例の市制施行である。新しい市の名には、合併前の7ヵ村の一つ「岡谷」が選ばれた。危機を名付け替えで乗り切ろうとした、製糸の町の決断だった。
    sources:
    - v2-okaya-intro
  relations:
  - pref/20
  unknowns:
  - 「岡谷」という地名自体の語源（岡と谷の地形に由来するか等）を専門資料で確認できなかった
  - 岡谷村の名の初出文献を確認できなかった
  - 平野村の改称先として岡谷村の名が選ばれた経緯（選定過程の記録）を確認できなかった
  updated: '2026-11-13'
- id: muni/20-川上村
  code: '203041'
  names:
    ja: 川上村
    reading: かわかみむら
    aliases:
    - 川上郷
  user_terms:
  - 川上村 千曲川の源流
  - 御所平の村
  - レタスの村
  naming_type: 合併新設
  prefecture: 長野県
  homonyms:
  - muni/29-川上村
  summary: 千曲川の最上流部に位置する村。地域名としては戦国期の文書に「川上郷」が見え、明治22年（1889年）に八つの旧村の区域をもって川上村が発足した。村名は最上流部という立地と旧郷名の継承で説明される。奈良県の川上村とは「大河の最上流部」という命名の構造だけが共通し、川も歴史も無関係である。大字「御所平」には保元の乱にまつわる皇子の伝承が残る。
  first_attestation:
    era: 天正2年
    year_western: 1574
    document: 大井文書
    note: 日本歴史地名大系が紹介する「川上郷」の用例（郷名としての初出）。村名そのものの成立は1889年
  claims:
  - text: 日本歴史地名大系によれば、天正2年（1574年）の大井文書に「平賀之事」とある十二郷の中に「川上郷」の名が見える
    kind: fact
    level: E3
    status: established
    sources:
    - h6-kawakami-kotobank
  - text: 村は千曲川の最上流部に位置し、村域は梓山・秋山・居倉・川端下・原・大深山・御所平・樋沢の旧八か村からなる
    kind: fact
    level: E3
    status: established
    sources:
    - h6-kawakami-kotobank
  - text: 明治22年（1889年）4月1日、居倉村・原村・御所平村・大深山村・秋山村・梓山村・川端下村の区域と大明村の区域のうち樋沢の区域をもって川上村が発足した
    kind: fact
    level: E5
    status: established
    sources:
    - h6-kawakami-nagano-wiki
  - text: 村名「川上」は、千曲川の最上流部にあたる立地と、戦国期以来の地域名「川上郷」の継承によって説明される
    kind: fact
    level: E3
    status: inferred
    sources:
    - h6-kawakami-kotobank
    - h6-kawakami-nagano-yoran
  - text: 奈良県の川上村も「川の上流部」の名という点は共通するが、対象の川は吉野川であり、戦国期の「川上郷」のような旧郷名の用例は奈良側では確認していない（共通する層＝命名の構造、異なる層＝川と地域史）
    kind: fact
    level: E3
    status: established
    sources:
    - h6-kawakami-kotobank
  - text: 保元の乱（1156年）で敗れた崇徳上皇の皇子・重仁親王が、信濃の村上基国を頼って川上村の御所平・御殿窪に安住したという伝承があり、大字「御所平」の名はその名残と語られる。作家の佐藤春夫は『佐久の内裏』で、この伝承と「佐久川上村御所平要図」という史料を取り上げた
    kind: legend
    level: E4
    status: established
    sources:
    - h6-kawakami-shigehito-legend
    - h6-kawakami-nagano-wiki
  column:
    title: 御所平に眠る皇子の伝説
    text: 川上村の大字に「御所平」という、いかにも皇族ゆかりの名があります。伝承では、保元の乱で敗れた崇徳上皇の皇子・重仁親王が、信濃の武士・村上基国を頼って千曲川を遡り、この御所平の御殿窪に住んだとされます。再起を図りながら若くして病に倒れたとも語られ、近くの南相木村には御陵山の名まで残ります。昭和には佐藤春夫が小説『佐久の内裏』にこの伝承を書きました。史実として確認できる話ではありませんが、「川の最上流の村」に皇子の落人伝説が根づいたこと自体が、この土地の記憶の形です。
    sources:
    - h6-kawakami-shigehito-legend
  relations:
  - pref/20
  - muni/29-川上村
  unknowns:
  - 「川上郷」の範囲と現在の村域がどの程度一致するかは未確認
  - 重仁親王伝承について、村公式資料（村史・村勢要覧）がどう扱っているかは未確認
  updated: '2026-11-13'
- id: muni/20-東御市
  code: '202193'
  names:
    ja: 東御市
    reading: とうみし
    aliases:
    - 東部町
    - 北御牧村
  user_terms:
  - とうみし
  - 東部と御牧の合成市名
  - 東御の名前の由来
  naming_type: 合併新設
  prefecture: 長野県
  homonyms: []
  summary: 東御市は2004年に小県郡東部町と北佐久郡北御牧村が合併して生まれた市で、郡境を越えた合併だった。市名「東御」は、東部町の「東」と北御牧村の「御」の各1文字を取った合成地名で、読みは「とうみ」。「御」の元になった北御牧村の名は、平安時代の信濃御牧・望月牧の北半が村域だったことに由来するとされる。
  first_attestation:
    era: 平成16年
    year_western: 2004
    document: 東部町・北御牧村の合併（東御市公式サイト「東部町と北御牧村の合併協議の経過」による）
    note: 市名としての「東御」の命名そのもの
  claims:
  - text: 平成16年（2004年）4月1日に、小県郡東部町と北佐久郡北御牧村が新設合併して、長野県下で第18番目の新市「東御市」が誕生した
    kind: fact
    level: E2
    status: established
    sources:
    - v2-tomi-gappei
  - text: 市名「東御」は、合併した東部町の「東」と北御牧村の「御」の各1文字を取った合成地名である（Wikipedia「東御市」による）
    kind: fact
    level: E5
    status: established
    sources:
    - v2-tomi-wiki
  - text: 新市名の選定にあたっては、合併協議会に新市名称候補選定小委員会が置かれ、平成15年（2003年）5月16日から6月14日にかけて新市名称アンケート調査が実施され、6月16日に開票された
    kind: fact
    level: E2
    status: established
    sources:
    - v2-tomi-gappei
  - text: 「御」の元になった北御牧村の村名は、平安時代の信濃御牧（官牧）の一つで最も貢馬が多かったと伝えられる望月牧の、北半分が村域だったことから「北御牧村」としたものである（Wikipedia「北御牧村」が東部町・北御牧村合併協議会の町村プロフィールを引いて紹介するもの）
    kind: fact
    level: E5
    status: established
    sources:
    - v2-tomi-kitami
  - text: 合併した2町村は、小県郡と北佐久郡という異なる郡に属し、それぞれ上田地域と佐久地域に分かれていた
    kind: fact
    level: E2
    status: established
    sources:
    - v2-tomi-gappei
  - text: 東御市の地方公共団体コードは202193である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 10月3日は「東御の日」
    text: 「東御」と書いて「とうみ」と読む。この読みは、東部町の「東（とう）」と北御牧村の「御（み）」を組み合わせた合成地名だからこそ生まれた、新しい読みである。そして市は、この語呂にちなんで10月3日を「東御の日」としている。合併で生まれた名の弱点は「読みにくさ」だが、東御市はそれを逆手に取り、記念日に変えてしまった。郡も広域圏も違う2町村が一つの市になる象徴として、名の読みまで含めて新しく作られた例である。
    sources:
    - v2-tomi-wiki
    - v2-tomi-gappei
  relations:
  - pref/20
  unknowns:
  - 市名の最終候補5点（東御・東信濃・美駒・御牧野・湯の牧）と「東御」が28.9%で最多だったという数値は、市区町村変遷情報サイトで見られる情報であり、市公式資料では確認できなかった
  - 「東御」が合成地名であることの、市公式資料による明示は確認できなかった（Wikipediaによる）
  - 東部町の「東部」という名の由来（1956年に田中町・祢津村・和村が合併して発足した際の命名理由）は確認できなかった
  updated: '2026-11-13'
- id: muni/20-松本市
  code: '202029'
  names:
    ja: 松本市
    reading: まつもとし
    aliases:
    - 深志
    - 府中
    - 松本町
  user_terms:
  - 松本市の名前の由来
  - 深志から松本への改称
  - 松本城の名前の由来
  naming_type: その他（城の改称に由来する名の継承）
  prefecture: 長野県
  homonyms: []
  summary: 市名は城下町「松本」の継承で、その松本は天正10年（1582）に小笠原貞慶が深志城を松本城と改めたことに始まると松本市は説明する。この地は古くは深志と呼ばれ、国府が置かれてからは府中とも呼ばれた。貞慶がなぜ「松本」の名を選んだのかは同時代の記録では確認できていない。明治40年（1907）に市制を施行した。
  first_attestation:
    era: 天正10年
    year_western: 1582
    document: 小笠原貞慶による深志城の松本城への改称（松本市公式「松本城の歴史」）
    note: 「松本」の公称としての初出は1582年の城の改称。これ以前に地名としての用例があったかは確認できていない
  claims:
  - text: 松本の地は古くは深志と呼ばれ、平安時代初期に上田から国府が移されてからは府中とも呼ばれていた
    kind: fact
    level: E2
    status: established
    sources:
    - k3-matsumoto-shiseki
  - text: 深志城は永正元年（1504）に小笠原氏の一族・島立貞永により平城として構築され、天文19年（1550）以降は武田氏の信濃支配の拠点となった
    kind: fact
    level: E2
    status: established
    sources:
    - k3-matsumoto-shiseki
  - text: 天正10年（1582年）、武田氏の滅亡後に小笠原貞慶が深志城を回復して名を松本城と改め、これ以降、松本の地名が用いられるようになった
    kind: fact
    level: E2
    status: established
    sources:
    - k3-matsumoto-fuchi
    - k3-matsumoto-castle
  - text: 貞慶が「松本」という名を選んだ理由について、松本市公式の資料は説明しておらず、「松本」の語源は確定していない
    kind: fact
    level: E2
    status: indeterminate
    sources:
    - k3-matsumoto-castle
    - k3-matsumoto-shiseki
  - text: 明治40年（1907）5月1日に市制を施行して松本市が誕生した
    kind: fact
    level: E2
    status: established
    sources:
    - k3-matsumoto-fuchi
  - text: 平成17年（2005）と平成22年（2010）の合併を経て、現在の松本市の市域となった
    kind: fact
    level: E2
    status: established
    sources:
    - k3-matsumoto-fuchi
  - text: 総務省の全国地方公共団体コードで、松本市の団体コードは202029と定められている
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 名前を付けた人は、天守を見ていない
    text: 1582年に城を「松本」と名付けた小笠原貞慶は、父の代に武田氏に追われた旧領を取り返したばかりでした。深志という旧名を捨てて新しい名を掲げることは、支配の再出発の宣言でもあったはずです。ところが貞慶は1590年に移封され、いま私たちが見ている国宝の天守を実際に築いたのは、次の城主・石川康長の代（1593年から）です。名前を付けた人は天守を見ず、天守を建てた人は名前を変えなかった。その後400年以上、「松本」の名だけが城とまちの顔として残りました。
    sources:
    - k3-matsumoto-castle
    - k3-matsumoto-fuchi
  relations:
  - pref/20
  unknowns:
  - 貞慶が「松本」の名を選んだ理由を示す同時代史料は確認できていない
  - 1582年の改称以前に「松本」という地名の用例があったかは未確認
  - 「深志」の語源については本バッチでは確認できていない
  updated: '2026-11-13'
