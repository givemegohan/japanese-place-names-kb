  summary: 比企郡の町で、町名は町域のほぼ中央を東西に流れる荒川水系の川「滑川」に由来する。1954年（昭和29年）に福田村と宮前村が合併した際、両村の間を流れる滑川の名を新しい村名に採り、1984年（昭和59年）に町制を施行した。富山県滑川市も同じ「滑川」だが、あちらは波入川に中世に「滑河」の字が当てられた地名で、成り立ちは異なる。
  first_attestation:
    era: 昭和29年
    year_western: 1954
    document: 滑川村の発足（福田村・宮前村の合併）
    note: 自治体名としての初出。川名「滑川」自体の初出は確認できなかった
  claims:
  - text: 町の中央を、町名の由来にもなっている滑川が流れる
    kind: fact
    level: E4
    status: established
    sources:
    - w11-namegawa-sarfic
    - w11-namegawa-river-wiki
  - text: 滑川は嵐山町の三反田沼に源を発し、滑川町を経て東松山市で市野川に合流する流路延長13.5kmの一級河川で、読みは「なめかわ」である
    kind: fact
    level: E5
    status: established
    sources:
    - w11-namegawa-river-wiki
  - text: 1954年（昭和29年）11月3日に福田村と宮前村が合併して滑川村が発足した
    kind: fact
    level: E5
    status: established
    sources:
    - w11-namegawa-wiki
  - text: 合併時の新しい村名は、2つの村の間を流れる川の名から採られたと町の公式説明を紹介する資料がある
    kind: fact
    level: E5
    status: established
    sources:
    - w3-saitamae-yurai
  - text: 1984年（昭和59年）11月3日に町制を施行して滑川町となった
    kind: fact
    level: E5
    status: established
    sources:
    - w11-namegawa-wiki
  - text: 富山県滑川市の「滑川」は、市の中央を流れる波入川（現在の中川）に中世に「滑河」の漢字が当てられた地名で、初見は1186年とされ、埼玉県滑川町の川名由来の滑川とは成り立ちが異なる同名である
    kind: fact
    level: E5
    status: established
    sources:
    - u6-namerikawa-wiki
  - text: 町内では谷津の地形に造られたため池群による農業が続き、「比企丘陵の天水を利用した谷津沼農業システム」は2023年（令和5年）1月に日本農業遺産に認定された
    kind: fact
    level: E4
    status: established
    sources:
    - w11-namegawa-sarfic
  - text: 滑川町の地方公共団体コードは113417である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 同じ「滑川」、違う川—比企の滑川と富山の滑川
    text: 「滑川」という名の自治体は、埼玉県滑川町と富山県滑川市の二つある。富山の滑川は、かつて波入川と呼ばれた川に中世の武士・比企氏が「滑河」の字を当てたのが始まりと伝わる。その比企氏の本拠は武蔵国比企郡、つまり埼玉の滑川町のある郡だった。では埼玉の滑川も同じ由来かというと、そうではない。埼玉の滑川はもともと川の名で、1954年の合併のときに両村の間を流れる川の名をそのまま村名にした、昭和の命名である。同じ字を書く二つの「滑川」は、片や中世の当て字、片や合併命名という対照的な生い立ちを持ち、不思議なことに両方とも比企の名と無縁ではない。
    sources:
    - u6-namerikawa-wiki
    - w11-namegawa-wiki
  relations:
  - pref/11
  - muni/16-滑川市
  - muni/11-鳩山町
  unknowns:
  - 川名「滑川」自体の語源（「滑らか」な流れや川底に由来するのか等）は、町公式・専門資料で確認できなかった
  - 1954年の合併時に滑川以外の村名候補があったかどうかは確認できなかった
