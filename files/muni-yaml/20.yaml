  - 水引のまち
  naming_type: その他（中世以来の郷名の継承）
  prefecture: 長野県
  homonyms: []
  summary: 「飯田」は伊那郡の郷名に由来する古い地名で、文献への登場は鎌倉時代とされる。市公式は語源を「結いの田」、つまり共同労働の田の意味から生まれたという言い伝えで説明している。室町時代に飯田城が築かれて発祥とし、江戸時代には堀氏2万石の城下町として栄えた。昭和12年（1937年）に飯田町と上飯田町が合併して飯田市が発足した。
  first_attestation:
    era: 鎌倉時代
    year_western: null
    document: 文献名は未特定
    note: 飯田市公式が「文献に登場するのは鎌倉時代のことである」とするが、具体的な文献名は示されておらず、本バッチでも特定できなかった
  claims:
  - text: 飯田市は、「飯田」という地名は文献に登場するのは鎌倉時代のことであるとし、鎌倉時代には郊戸庄飯田郷に地頭阿曾沼氏の存在が知られたと説明している
    kind: fact
    level: E2
    status: established
    sources:
    - n3-iida-city
  - text: 「飯田」という地名は「結いの田」つまり共同労働の田の意味から生まれたといわれているが、これは言い伝えとして伝えられる説明であり、確実な典拠は示されていない
    kind: fact
    level: E2
    status: indeterminate
    sources:
    - n3-iida-city
  - text: 室町時代に小笠原氏系の坂西氏が飯田城を築いたといわれ、このあたりが飯田の発祥とされる
    kind: fact
    level: E2
    status: established
    sources:
    - n3-iida-city
  - text: 毛利氏から京極氏のころの10年足らずの間に飯田城の大改修が行われ、本町・知久町・松尾町など城下町15町が新たに開発され、現在の飯田市街にみられる碁盤の目状の街路網の基盤がこのとき作られた
    kind: fact
    level: E2
    status: established
    sources:
    - n3-iida-city
  - text: 寛文12年（1672年）に堀親昌が2万石で入城し、以後明治まで196年間にわたって堀氏が飯田の統治を行った
    kind: fact
    level: E2
    status: established
    sources:
    - n3-iida-city
  - text: 昭和12年（1937年）4月1日に飯田町が上飯田町と合併し、飯田市として新しく発足した
    kind: fact
    level: E2
    status: established
    sources:
    - n3-iida-city
  - text: 飯田市の地方公共団体コードは202053である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: わずか10年で作られた碁盤の目の城下町
    text: 現在の飯田の市街を歩くと、道が碁盤の目状に整然と走っている。この街路網の基盤は、16世紀の終わりのわずか10年足らずの間に作られた。豊臣政権のもとで伊那郡を治めた毛利秀頼と、その婿の京極高知の時代に、飯田城の大改修と寺院の移転、伝馬の整備が行われ、本町・知久町・松尾町をはじめ城下町15町が新たに開発されたという。その後の藩主が代わっても町割りは受け継がれ、400年後のまちの骨格になっている。地名の「飯田」は中世の郷の名だが、まちの形は近世初頭の10年の産物である。
    sources:
    - n3-iida-city
  relations:
  - pref/20
  unknowns:
  - 「飯田」の初出とされる鎌倉時代の具体的な文献名は、市公式でも示されておらず、本バッチでも特定できなかった
  - 語源の「結いの田」説について、それを裏づける古い記録は確認できなかった
  updated: '2026-11-13'
