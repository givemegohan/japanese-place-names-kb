  - 甑島への玄関口
  naming_type: 中心地名の継承
  formation: 合併新設
  prefecture: 鹿児島県
  homonyms: []
  summary: 平成16年（2004年）10月12日、川内市と薩摩郡の樋脇町・入来町・東郷町・祁答院町・里村・上甑村・下甑村・鹿島村の1市4町4村が新設合併して発足した市。中心地名の「川内」は川内川に由来する古い地名で、古くは「千台（千臺）」とも書かれ、江戸時代に「川内」の表記に統一された。新市名では県名でも藩名でもない旧国名「薩摩」を冠し、「川内」だけでは宮城県仙台市と読みが混同される問題の解消も図られた。
  first_attestation:
    era: null
    year_western: null
    document: null
    note: 「川内」の確かな初出は確認できなかった。奈良時代にはこの地に薩摩国の国府・国分寺が置かれていたことが辞典類に紹介されているが、「川内」という地名そのものの初出文書は特定できていない
  claims:
  - text: 薩摩川内市の地方公共団体コードは462152である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  - text: 薩摩川内市は平成16年（2004年）10月12日、川内市・樋脇町・入来町・東郷町・祁答院町・里村・上甑村・下甑村・鹿島村の1市4町4村の新設合併で誕生した
    kind: fact
    level: E2
    status: established
    sources:
    - s5-sendai-city-intro
    - s5-sendai-uub
  - text: 新市名については中心だった川内市の名をそのまま使う案もあったが、9つもの自治体の合併で川内市が名称にこだわりすぎると他の自治体の合併意欲を削ぎかねない懸念と、宮城県仙台市との混同を防ぐ観点から単独継承は見送られ、旧国名「薩摩」を冠した「薩摩川内市」が採用されたことが紹介されている
    kind: fact
    level: E5
    status: established
    sources:
    - s5-sendai-wiki
  - text: 旧川内市は昭和4年（1929年）に隈之城村・平佐村・東水引村の合併で川内町として発足し、昭和15年（1940年）2月11日に市制を施行した
    kind: fact
    level: E4
    status: established
    sources:
    - s5-sendai-uub
  - text: 「川内」の文字は古くは「千台（旧字体で千臺）」であり、時代や古文書によって「千代」「川内」など表記が異なっていたが、江戸時代に薩摩藩主・島津吉貴が地図を作成する際に「川内」の文字に統一したと市の広報は川内市歴史資料館編『川内市文化財要覧』を引いて紹介する
    kind: fact
    level: E4
    status: established
    sources:
    - s5-sendai-koho-yurai
  - text: 「川内」の語源については、川内川の北側（内側）に薩摩国の国府や国分寺が置かれており、川北を「川内」、川南を「川外」と呼んでいたことに由来するという説が市の広報で紹介されている
    kind: fact
    level: E4
    status: contested
    sources:
    - s5-sendai-koho-yurai
  - text: 「千台」の名は、その昔ニニギノミコト（瓊瓊杵尊）が「千の台（うてな）」を作るように命じたという神話に由来するという説が伝えられている
    kind: legend
    level: E4
    status: established
    sources:
    - s5-sendai-koho-yurai
    - s5-sendai-kotobank
  - text: この地は奈良時代に薩摩国の国府・国分寺が置かれた土地であることが『精選版日本国語大辞典』で紹介されている
    kind: fact
    level: E3
    status: established
    sources:
    - s5-sendai-kotobank
  column:
    title: 「せんだい」違いを解消するための「薩摩」
    text: 日本には「せんだい」と読む大きな地名が二つある。宮城県の仙台市と、鹿児島県の旧川内市である。読みだけでなく、東北新幹線の「仙台」と九州新幹線の「川内」は駅名でも紛らわしく、混同は長年の悩みだった。2004年の合併で旧国名の「薩摩」を頭に付けた新市名「薩摩川内市」は、この混同を避ける狙いもあって選ばれたとされる。もっとも漢字の成り立ちは対照的で、仙台の「仙」は仙台城の雅称に由来する後付けの字、川内の方はもとは「千台」と書かれた古い地名である。「せんだい」の音は同じでも、字の履歴は正反対の二つのまち、というのが面白い対比である。
    sources:
    - s5-sendai-wiki
    - s5-sendai-koho-yurai
  relations:
  - pref/46
  unknowns:
  - 「川内」という地名の確かな初出（文献名と年代）は確認できなかった
  - 新市名の公募件数や最終候補の顔ぶれなど選定過程の詳細は、合併協議会の一次資料では確認できなかった
  - 「川の内側」説以外の語源説（川内川の川名が先か地名が先かを含む）は専門辞典では確認できなかった
  updated: '2026-11-13'
- id: muni/46-西之表市
  code: '462136'
  names:
    ja: 西之表市
    reading: にしのおもてし
    aliases:
    - 西之表町
    - 北種子村
  user_terms:
  - 種子島北部の市
  - 鉄砲伝来の島の玄関口
  - にしのおもて
  naming_type: 中心地名の継承
  formation: 改称
  prefecture: 鹿児島県
  homonyms: []
  summary: 種子島北部の市で、明治22年（1889年）に北種子村として発足し、大正15年（1926年）に改称・町制して西之表町、昭和33年（1958年）10月1日に市制を施行した。中心の西之表は種子島氏の城下町で、西海岸の港は島の表玄関とされる。「西之表」という地名自体の語源は、確認した公式・辞典資料では明らかにできなかった。
  first_attestation:
    era: null
    year_western: null
    document: null
    note: 「西之表」の初出は確認できなかった。少なくとも町村制以前から地区の名として存在し、大正15年（1926年）の改称で自治体名になった
  claims:
  - text: 西之表市の地方公共団体コードは462136である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  - text: 明治22年（1889年）4月1日に熊毛郡北種子村が発足し、大正15年（1926年）4月1日に改称・町制して西之表町となったとWikipediaは紹介する
    kind: fact
    level: E5
    status: established
    sources:
    - s3-nishinoomote-wiki
  - text: 昭和33年（1958年）10月1日に市制を施行して「西之表市」が発足した
    kind: fact
    level: E2
    status: established
    sources:
    - s3-nishinoomote-koho
  - text: 西之表は日本最南端の士族である種子島家の城下町として栄え、現在は熊毛支庁や国の出先機関が置かれる種子島および熊毛地区の政治・経済の中心であるとWikipediaは紹介する
    kind: fact
    level: E5
    status: established
    sources:
    - s3-nishinoomote-wiki
  - text: 西之表港は種子島の北西岸に位置する重要港湾で、背後に西之表市の市街地が広がり、鹿児島や屋久島への定期フェリー・高速船が就航する「島の表玄関」であると鹿児島県は紹介する
    kind: fact
    level: E2
    status: established
    sources:
    - s3-nishinoomote-port
  - text: 天文12年（1543年）に鉄砲が伝来した種子島において、西之表は島主・種子島氏の本拠であり、16世紀末に第16代島主久時が知覧へ所替えとなった後も、江戸時代を通じて種子島は種子島家の私領地であったとWikipediaは紹介する
    kind: fact
    level: E5
    status: established
    sources:
    - s3-nishinoomote-wiki
  column:
    title: 鉄砲は南から、政治は西之表から
    text: 種子島といえば1543年の鉄砲伝来だが、ポルトガル船が漂着したのは島の南端（現在の南種子町）である。一方、島を治めた種子島氏の城下町は北部の西之表に置かれ、ここが島の政治の中心だった。現在の西之表市も、熊毛支庁が置かれる大隅諸島の行政の中心であり、西海岸の西之表港は鹿児島と島を結ぶ「表玄関」と県に呼ばれる。島の名を世界史に刻んだ出来事の舞台と、島の暮らしの中心とは、島の両端に分かれているのである。なお「西之表」の「表」が何を指すのか、地名の語源そのものは確定できなかった。
    sources:
    - s3-nishinoomote-wiki
    - s3-nishinoomote-port
  relations:
  - pref/46
  unknowns:
  - 「西之表」という地名の語源（「表」の意味を含む）は、確認した市公式資料・県公式資料・専門辞典の範囲では明らかにできなかった
  - 大正15年（1926年）に北種子村から西之表町へ改称した理由は確認できなかった
  updated: '2026-11-13'
- id: muni/46-錦江町
  code: '464902'
  names:
    ja: 錦江町
    reading: きんこうちょう
    aliases:
    - 大根占町
    - 田代町
  user_terms:
  - きんこう
  - 錦江湾に面した町
  naming_type: 自然地名から
  formation: 合併新設
  prefecture: 鹿児島県
  homonyms: []
  summary: 鹿児島県肝属郡の町。2005年3月22日、大根占町と田代町が合併して発足した。町名「錦江」は、町の西に広がる錦江湾（鹿児島湾の別名）から採られ、一般公募で決まった。湾名「錦江」の起源は、島津氏第18代家久が詠んだ「浪のおりかくる錦は磯山の梢にさらす花の色かな」という歌にあると鹿児島県は紹介している。旧町域は中世に禰寝院の荘園支配を受けた地域で、大根占・田代の両郷が町村制以来の町の骨格である。
  first_attestation:
    era: 平成17年
    year_western: 2005
    document: 大根占町・田代町合併協議会における新町名の決定
    note: 町名そのものの初出。湾名「錦江」の側の起源は、島津家久の歌に遡るという伝承として別に記録する
  claims:
  - text: 総務省「地方公共団体コード一覧」で、錦江町の団体コードは464902とされている
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  - text: 2005年3月22日、大根占町と田代町が新設合併して錦江町が生まれたと、市区町村変遷情報データベースは記録している
    kind: fact
    level: E4
    status: established
    sources:
    - s2-kinko-uub
  - text: 町名は、町の西側に広がる錦江湾（鹿児島湾）に由来し、一般公募により決定されたとWikipediaは紹介している
    kind: fact
    level: E5
    status: established
    sources:
    - s2-kinko-wiki
  - text: 新町名の公募では上位4点が大田・大代・大根田・南隅と旧町名にちなむ案だったが、最終候補6点（青葉・大隅中央・錦江・滝瀬・滝花・実野里）の中から「錦江」が選ばれたと、市区町村変遷情報データベースは記録している
    kind: fact
    level: E4
    status: established
    sources:
    - s2-kinko-uub
  - text: 鹿児島県は公式ページ「地名の由来」で、錦江湾の名の起源は、島津氏第18代家久が鳳山和尚の庵を訪ねて詠んだ「浪のおりかくる錦は磯山の梢にさらす花の色かな」という歌であるといわれると紹介している
    kind: fact
    level: E2
    status: established
    sources:
    - s2-kagoshima-pref-yurai
  - text: 一方で、「錦江」はもともと黒川（日木山川）の別称であり、明治時代に入ってから海の呼称に転化したとする説もあり、湾名の成立過程については見解が分かれるとWikipediaは紹介している
    kind: fact
    level: E5
    status: contested
    sources:
    - s2-kagoshimawan-wiki
  - text: 湾の正式な名は鹿児島湾で、1955年の錦江湾国定公園の指定以降、地図などで「鹿児島湾（錦江湾）」と併記されることが広がったとWikipediaは紹介している
    kind: fact
    level: E5
    status: established
    sources:
    - s2-kagoshimawan-wiki
  - text: 旧町域は713年に大隅国が置かれて以来の郡に属し、平安中期には禰寝院として荘園支配がなされた。江戸時代の大根占郷・田代郷は1889年の町村制でそのまま大根占村・田代村となり、大根占村は1933年、田代村は1961年に町制を施行したとWikipediaは紹介している
    kind: fact
    level: E5
    status: established
    sources:
    - s2-kinko-wiki
  column:
    title: 合成地名の候補を破った「海の名前」
    text: 平成の大合併では、旧町名の文字を組み合わせた合成地名が各地に生まれた。錦江町の公募でも、当初は大根占の「大」と田代の「田」を取る「大田」「大根田」などが上位に入っていた。ところが最終候補の段階で残ったのは「錦江」だった。西に広がる錦江湾の名である。その湾名の源は、島津家久が波と花を錦にたとえた歌に遡るという。旧町名のどちらも残さない代わりに、四百年前に詠まれた歌の海の名を、町は自分の名として引き継いだ。
    sources:
    - s2-kinko-uub
    - s2-kinko-wiki
    - s2-kagoshima-pref-yurai
  relations:
  - pref/46
  - muni/46-南大隅町
  - muni/46-肝付町
  unknowns:
  - 合併協議会が最終候補の中から「錦江」を選んだ理由を記した公式文言は確認できなかった（湾に由来することはWikipediaの説明による）
  - 新町名公募の応募総数は確認できなかった
  - 「大根占」「田代」という旧町名それぞれの由来は確認できなかった
  updated: '2026-11-13'
- id: muni/46-長島町
  code: '464040'
  names:
    ja: 長島町
    reading: ながしまちょう
    aliases:
    - 仲島
    - 大仲島
    - 東長島村
    - 西長島村
    - 東町
  user_terms:
  - ながしま
  - 古墳の島
  - じゃがいもの島
  naming_type: 島名の継承
  formation: 合併新設
  prefecture: 鹿児島県
  homonyms: []
  summary: 鹿児島県出水郡の町で、長島本島を中心とする島々の町。町名は島名「長島」の継承で、2006年3月20日、東町と（旧）長島町が新設合併した際に、住民募集で最も応募が多かった「長島町」が新町名に選ばれた。島は古くは仲島・大仲島とも呼ばれ、元は肥後国天草郡に属したが戦国時代に島津氏の支配下に入って薩摩国出水郡に移り、鎌倉時代には長島氏が島名を名乗って領有した。1889年に東長島村・西長島村に分かれて以来、117年ぶりに一つの「長島」に戻った形である。
  first_attestation:
    era: 鎌倉時代
    year_western: null
    document: 長島町公式サイト「歴史」（長島氏が地名を名乗って領有したとする紹介）
    note: 島名「長島」の文献上の初出そのものは確認できておらず、町公式が伝える長島氏の名乗りを最古層として記録する
  claims:
  - text: 総務省「地方公共団体コード一覧」で、長島町の団体コードは464040とされている
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  - text: 長島は古くは仲島、あるいは大仲島と呼ばれていたとWikipediaは紹介している
    kind: fact
    level: E5
    status: established
    sources:
    - s2-nagashima-island-wiki
  - text: 長島は元来、肥後国天草郡の一部であったが、1565年（永禄8年）の堂崎城落城をはじめとする島津氏の侵攻を経て薩摩に属するようになり、天正9年（1581年）に薩摩国出水郡へ移管されたとWikipediaは紹介している
    kind: fact
    level: E5
    status: established
    sources:
    - s2-nagashima-island-wiki
    - s2-izumi-gun-wiki
  - text: 鎌倉時代になると、長島は長島氏が地名を名乗って領有するようになり、同氏は戦国時代まで海の豪族として活躍したと、長島町公式サイト「歴史」は紹介している
    kind: fact
    level: E2
    status: established
    sources:
    - s2-nagashima-town-history
  - text: 江戸時代には薩摩藩の外城の一つとして長島郷が置かれ、明治22年（1889年）の町村制施行で島は東長島村と西長島村の2村に分かれたと、長島町公式サイトは紹介している
    kind: fact
    level: E2
    status: established
    sources:
    - s2-nagashima-town-history
  - text: 東長島村は1956年7月10日に東町と改称して町制を施行し、西長島村は1960年1月1日に長島町と改称して町制を施行した。そして2006年3月20日、東町と長島町が合併して新しい長島町となったと、長島町公式サイトは紹介している
    kind: fact
    level: E2
    status: established
    sources:
    - s2-nagashima-town-history
  - text: 2006年の合併にあたって町名は住民らから募集され、合併協議会により最も応募数が多かった「長島町」に決定した。他の案には「ながしま町」「新長島町」「東西長島町」「薩摩長島町」「黒之瀬戸町」があったとWikipediaは紹介している
    kind: fact
    level: E5
    status: established
    sources:
    - s2-nagashima-wiki
  - text: 出水郡は現在、長島町のみを含む郡であり、町域は長島本島・諸浦島・伊唐島・獅子島などからなるとWikipediaは紹介している
    kind: fact
    level: E5
    status: established
    sources:
    - s2-izumi-gun-wiki
    - s2-nagashima-island-wiki
  column:
    title: 肥後から薩摩へ、東西に分かれて117年
    text: 長島はもともと肥後の島だった。天草諸島の南端にあり、戦国時代に島津氏が攻め落とすまでは肥後国天草郡に属していた。薩摩に移ってからも島の運命は揺れ、1889年には東長島村と西長島村に二分される。西は1960年に島の名そのままの「長島町」を名乗ったが、東は1956年に「東町」となっていた。2006年の合併で新町名を募集すると、最も多かったのはやはり「長島町」だった。候補には町を潤す急潮で知られる「黒之瀬戸町」もあったが、選ばれたのは島の名そのもの。二つに分かれて117年、島は一つの名前を取り戻した。
    sources:
    - s2-nagashima-town-history
    - s2-nagashima-wiki
    - s2-nagashima-island-wiki
  relations:
  - pref/46
  unknowns:
  - 島名「長島」の文献上の初出は確認できなかった
  - 古称「仲島」「大仲島」から「長島」へ改まった時期と理由は確認できなかった
  - 『和名類聚抄』の肥後国天草郡に長島に関わる郷名が収録されているかは確認できなかった
  updated: '2026-11-13'
- id: muni/46-阿久根市
  code: '462063'
  names:
    ja: 阿久根市
    reading: あくねし
    aliases:
