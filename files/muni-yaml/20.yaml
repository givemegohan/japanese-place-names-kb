  homonyms: []
  summary: 1954年に上伊那郡の赤穂町・宮田町・中沢村・伊那村が合併して発足した市。市名「駒ヶ根」は市制施行時に公募で新たに選ばれた名で、駒ヶ根市は「駒ヶ岳の麓のまち」という意味だと説明する。合併した町村の名は引き継がれておらず、「駒ヶ根」という名自体は隣の宮田村のキャンプ場の名などに先行して見られた。
