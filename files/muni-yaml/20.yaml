    sources:
    - h5-takamori-nagano-handbook
  - text: 異なる層として、同名の熊本県高森町は江戸時代に行政区画「高森手永」が置かれ、1889年の町村制ですでに高森町が存在した古い地名であり、1957年に山名から新しく名付けられた長野の高森とは、名前の古さが対照的である
    kind: fact
    level: E2
    status: established
    sources:
    - h5-takamori-kumamoto-enkaku
  - text: 共通する層として、両町とも「森」を含む名が山地の地形と結びついた町であり、昭和の大合併期に現在の町として発足した点は共通する
    kind: fact
    level: E2
    status: established
    sources:
    - h5-takamori-nagano-handbook
    - h5-takamori-kumamoto-kaso
  - text: 総務省の全国地方公共団体コードで、高森町の団体コードは204030と定められている
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 二つの村を「山頂で結ぶ」山の名前
    text: 長野の高森町の名前の決め方は、町の公式資料に美しい一文で残っています。「両村を山頂で結ぶ本高森山に由来して、町名を高森町としました」。本高森山の山頂は市田村と山吹村の境界にあり、合併する二つの村はもともと一つの山で結ばれていた、というわけです。どちらか一方の村の名前を選ぶのではなく、二つの村の真上にある山の名前を共有の名にしたところに、対等合併の知恵が見えます。
    sources:
    - h5-takamori-nagano-handbook
  relations:
  - pref/20
  - muni/43-高森町
  unknowns:
  - 命名の選定過程（公募だったか、候補名に何があったか）は未確認
  - 山名「本高森山」の「高森」自体の由来（いつ、なぜ高森と呼ばれるようになったか）は未確認
  updated: '2026-11-13'
- id: muni/20-麻績村
  code: '204463'
  names:
    ja: 麻績村
    reading: おみむら
    aliases:
    - 麻続
  user_terms:
  - おみむら
  - 麻績宿の村
  - 聖高原の村
  - 難読地名
  naming_type: 一部の地名（古代の郷名「麻績郷」を受け継ぐ地名で、1875年の合併で村名となった）
  prefecture: 長野県
  homonyms: []
  summary: 長野県東筑摩郡の村。「麻績」は「おみ」と読む難読地名で、もとは麻を績む（裂いて糸にする）ことを業とした人々＝麻績氏・麻績部に由来する郷名とされる。『和名類聚抄』には「麻続」「麻績」と記され「乎美（をみ）」と訓じられている。江戸時代は北国脇往還の麻績宿として栄え、1875年に麻績町など5か村が合併して麻績村となり、1956年に日向村と合併して現在に至る。
  first_attestation:
    era: 承平年間
    year_western: null
    document: 和名類聚抄
    note: 『日本歴史地名大系』「麻績郷」項によれば、『和名抄』高山寺本は「麻続」、流布本は「麻績」と記し、ともに「乎美（をみ）」と訓じる。『和名類聚抄』の成立は承平年間（931〜938年）頃とされるため西暦年は確定せず null とした
  claims:
  - text: 『日本歴史地名大系』によれば、『和名類聚抄』の高山寺本はこの郷を「麻続」と、流布本は「麻績」と記し、いずれも「乎美（をみ）」と訓じており、「をみ」という読みが平安時代に確かだったことが分かる
    kind: fact
    level: E3
    status: established
    sources:
    - x3-omi-kotobank-taikei-go
  - text: 『日本歴史地名大系』は、麻績郷の名は品部（専門技術集団）を擁していた麻績氏が定着した土地であることを示すと考えられると説明する
    kind: fact
    level: E3
    status: established
    sources:
    - x3-omi-kotobank-taikei-go
  - text: 『精選版 日本国語大辞典』によれば、「麻績（をみ）」は「おうみ（苧績）」の音変化した語で、麻を細く裂いてより合わせ糸にすることをいい、それを業とする氏族の名でもあった
    kind: fact
    level: E3
    status: established
    sources:
    - x3-omi-kotobank-dictionary
  - text: 麻績村公式によれば、平安時代には伊勢神宮の麻績御厨（みくりや）がこの地に設けられ、荘園としての麻績が置かれた
    kind: fact
    level: E2
    status: established
    sources:
    - x3-omi-vill-aramashi
  - text: 江戸時代、麻績は天領で、北国脇往還（善光寺街道）の宿駅・麻績宿が置かれて善光寺参りの人々などで賑わった
    kind: fact
    level: E2
    status: established
    sources:
    - x3-omi-vill-aramashi
  - text: 『日本歴史地名大系』によれば、明治8年（1875年）1月、麻績組のうち麻績町・矢倉・市野川・下井堀・野口の五か村が合併して麻績村がつくられ、昭和31年（1956年）に日向村と合併した
    kind: fact
    level: E3
    status: established
    sources:
    - x3-omi-kotobank-taikei-mura
  - text: 麻績郷は『和名類聚抄』では更級郡の部に記されるが、その範囲は現在の筑北盆地の本城・坂北・麻績・坂井の四か村一帯にあたると推定されており、現在の麻績村はその一部である
    kind: fact
    level: E3
    status: established
    sources:
    - x3-omi-kotobank-taikei-go
  - text: 麻績村の地方公共団体コードは204463である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: なぜ「麻績」と書いて「おみ」と読むのか
    text: 「麻績」を音読みすれば「ましょく」、訓読みでも「あさつみ」としか読めない。ところがこの村は「おみ」と読む。鍵は古代の職能集団にある。「をみ（麻績）」は、麻の繊維を裂いてつなぎ、糸にする仕事のことで、それを朝廷に納める品部の人々は「麻績氏」「麻績部」と呼ばれた。『万葉集』にも「麻績の子ら」の歌がある。平安時代の『和名類聚抄』はこの地を「麻績」と書いて「乎美」と読ませているから、「をみ」の読みは千年以上前からこの土地の名前だった。仕事の名前が、その仕事をする人々の住む土地の名前になり、さらに村の名前として残ったのである。
    sources:
    - x3-omi-kotobank-taikei-go
    - x3-omi-kotobank-dictionary
  relations:
  - pref/20
  - muni/20-青木村
  - muni/20-筑北村
  unknowns:
