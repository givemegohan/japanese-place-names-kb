  user_terms:
  - 舟形
  - ふながた
  - 縄文の女神の町
  - 西ノ前遺跡
  - 小国川の鮎
  naming_type: 中心地名の継承
  naming_note: 古くからの地名「舟形」の継承。古くは「鮒方」と書いたとされる
  formation: 合併新設
  prefecture: 山形県
  homonyms: []
  summary: 最上郡の南端、最上川と最上小国川・松橋川の流域に東西に細長い町。地名は古く「鮒方（ふなかた）」と書き、フナの形をした石が出たことに由来するといわれる。近世は羽州街道と北羽前街道の交わる宿駅として栄えた。1954年（昭和29年）に舟形村・堀内村が合併して町制を施行。国宝土偶「縄文の女神」の出土した西ノ前遺跡の町としても知られる。
  first_attestation:
    era: 明治22年
    year_western: 1889
    document: 町村制施行による舟形村の成立
    note: 自治体名としての初出。地名「舟形（鮒方）」の文献初出は確認できていない
  claims:
  - text: 地名は古くは「鮒方（ふなかた）」と書き、フナの形をした石が出たことに由来するといわれる
    kind: fact
    level: E3
    status: contested
    sources:
    - z12-funagata-kotobank
  - text: 町域の中央部を最上川が西流し、右岸に最上小国川、左岸に松橋川などが注ぎ、最上川・最上小国川の河岸段丘上には縄文時代の遺跡が多く分布する
    kind: fact
    level: E3
    status: established
    sources:
    - z12-funagata-kotobank
  - text: 町内の長者原を、『続日本紀』天平宝字3年（759年）9月26日条や『延喜式』に見える避翼（さるはね）駅に比定する説があり、南方の猿羽根山（峠）をその遺称とする説もある
    kind: fact
    level: E3
    status: contested
    sources:
    - z12-funagata-kotobank
  - text: 近世は羽州街道と北羽前街道の交点にある宿駅として栄えた
    kind: fact
    level: E3
    status: established
    sources:
    - z12-funagata-kotobank
  - text: 1889年（明治22年）に舟形村が生まれ、翌1890年（明治23年）11月に堀内地区が分村して堀内村となった
    kind: fact
    level: E2
    status: established
    sources:
    - z12-funagata-town-50th
  - text: 1954年（昭和29年）12月1日、舟形村と堀内村が合併し、町制を施行して現在の舟形町が誕生した
    kind: fact
    level: E2
    status: established
    sources:
    - z12-funagata-town-50th
  - text: 1992年（平成4年）8月、西ノ前遺跡から高さ45センチの日本最大の土偶が出土して「縄文の女神」と呼ばれ、1998年に国の重要文化財、2012年（平成24年）に国宝に指定された
    kind: fact
    level: E2
    status: established
    sources:
    - z12-funagata-town-megami
    - z12-funagata-museum
  - text: 舟形町の地方公共団体コードは063631である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: フナの形の石と、川辺の女神
    text: 「舟形」の古い書き方は「鮒方」で、フナの形をした石が出たことに由来するといわれる。川の魚の名を負ったこの地は、古くは駅の置かれた交通の要衝で、近世には二つの街道が交わる宿駅だった。そして1992年、小国川の清流を見下ろす西ノ前遺跡から、高さ45センチという日本最大の土偶が姿を現した。均整のとれた姿から「縄文の女神」と名付けられた土偶は、2012年に国宝となった。フナにちなむ地名の町が、川辺に暮らした縄文の人々の「女神」を抱えている。
    sources:
    - z12-funagata-kotobank
    - z12-funagata-town-megami
  relations:
  - pref/06
  - muni/06-最上町
  - muni/06-新庄市
  unknowns:
  - 「鮒方」の文献上の初出と、「舟形」の表記に改まった時期・経緯は確認できなかった
  - フナの形をした石に由来するとする伝承の典拠（いつの記録か）は確認できなかった
  - 舟形の名が船形の山に由来するとする説は、典拠を確認できなかった
  updated: '2026-11-13'
