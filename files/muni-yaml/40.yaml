  summary: 福岡県北東部、周防灘に面する京築地域の中心市。地名「行橋」は1889年（明治22年）の町村合併の際に生まれた合成地名で、『行橋市史』によれば、合併した行事・大橋・宮市の3村のうち、行事と大橋から1字ずつを取って名付けられた。読みは「ゆくはし」。1954年10月10日、行橋町と8村が合併して市制を施行した。市の花コスモスの8枚の花びらは、合併した8村を表すとされる。
