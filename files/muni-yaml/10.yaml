  prefecture: 群馬県
  homonyms: []
  summary: 中世の太田郷・新田荘の中心地で、金山城の城下町、日光例幣使街道の太田宿として発展した。1948年に新田郡太田町が市制を施行し、2005年に尾島町・新田町・藪塚本町と新設合併して現在の太田市となった。「太田」の語源と太田郷の初出は未確定である。
  first_attestation:
    era: 中世
    year_western: null
    document: 日本歴史地名大系『太田町』
    note: 同書は中世の太田が太田郷に属したことを記すが、太田郷の初出史料とその年は特定できなかった。
  claims:
  - text: 総務省の地方公共団体コード一覧では、太田市の団体コードは102059とされている。
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  - text: 太田市観光協会の資料によれば、現在の太田市域は中世に新田荘が成立した地であり、新田義貞の本拠地として文化が形成された。
    kind: fact
    level: E4
    status: established
    sources:
    - m3-ota-kanko
  - text: 日本歴史地名大系によれば、中世の太田は太田郷に属し、文明元年（1469）に金山城が築かれたのち、その城下町として発展し町場の基礎が築かれた。
    kind: fact
    level: E3
    status: established
    sources:
    - m3-kotobank-ota-machi
  - text: 同書によれば、近世の太田は日光例幣使街道の宿駅（太田宿）であり、六斎市の立つ市場町として活況を呈した。
    kind: fact
    level: E3
    status: established
    sources:
    - m3-kotobank-ota-machi
  - text: 太田市観光協会によれば、大光院は慶長18年（1613）に徳川家康が先祖と仰ぐ新田義重を弔うために建立した寺で、開山の呑龍上人が貧しい家の子を養育したことから「子育て呑龍さま」と言われるようになった。
    kind: fact
    level: E4
    status: established
    sources:
    - m3-ota-kanko
  - text: 昭和23年（1948）5月3日に新田郡太田町が市制を施行して太田市となり、その後、強戸村・休泊村（1957年）、矢場川村の一部（1960年）、宝泉村（1963年4月）、毛里田村（1963年12月）を編入した。
    kind: fact
    level: E2
    status: established
    sources:
    - m3-ota-city-pdf
    - k6-kusatsu-gunma-henssen
  - text: 平成17年（2005）3月28日に太田市・尾島町・新田町・藪塚本町の1市3町が新設合併して、新しい太田市が誕生した。
    kind: fact
    level: E2
    status: established
    sources:
    - m3-ota-city-pdf
  - text: 「太田」の語源と、太田郷の初出の史料・年代は、本調査では特定できなかった。
    kind: fact
    level: E3
    status: indeterminate
    sources:
    - m3-kotobank-ota-machi
  column:
    title: 市章に受け継がれた新田氏の旗印「大中黒」
    text: 2005年の新設合併で生まれた新・太田市の市章は、この地域を治めた新田氏（新田義貞）の旗印「大中黒」をベースに、右下に市名をひらがなで配置したデザインである。太田市は、大中黒に「脈々と受け継がれる伝統と革新の精神」を表現したと説明している。中世の荘園領主の旗印が、平成の合併で生まれた市の紋章に生き続けている。
    sources:
    - m3-ota-city-pdf
  relations:
  - pref/10
  unknowns:
  - 太田郷の初出史料と年代は未確認
  - 「太田」の語源の定説は未確認（「大きな田」などの一般的な解釈を裏づける地元資料は取得できなかった）
  updated: '2026-11-13'
- id: muni/10-安中市
  code: '102113'
  names:
    ja: 安中市
    reading: あんなかし
    aliases:
    - 安中町
    - 安中宿
  user_terms:
  - 安中宿
  - サムライマラソン
  - 安政遠足
  - 碓氷峠のふもと
  naming_type: 一部の地名
  prefecture: 群馬県
  homonyms: []
  summary: 群馬県西部の市で、中山道の安中宿と安中藩の城下町として栄えた。「安中」の名は中世以来この地を治めた安中氏に結びつき、戦国期の安中城の名として同時代文書に現れる。江戸時代末期の安政遠足は「日本マラソン発祥の地」の物語として今も侍マラソンに受け継がれている。1958年に市制施行し、2006年に松井田町と合併して現在の市域となった。
  first_attestation:
    era: 戦国時代
    year_western: 1556
    document: 足利義氏感状案（武州文書）
    note: 群馬県立文書館の古文書群概要が、弘治2年（1556）11月16日の感状案に「今度於上州安中城働之所」と見えると紹介するもの。原文を直接確認したものではないため、紹介として記録する
  claims:
  - text: 当地は『和名類聚抄』碓氷郡野後郷の故地とされ、『延喜式』にも東山道の駅として野後駅が見えると、群馬県立文書館の古文書群概要が紹介する
    kind: fact
    level: E2
    status: established
    sources:
    - u5-annaka-kenbunsho
  - text: 地名「安中」は、戦国期に安中忠政が当地に築城して入り、自らの姓をとって安中城としたのが始まりといわれていると『安中志』が伝え、県立文書館がその説を紹介する
    kind: fact
    level: E2
    status: contested
    sources:
    - u5-annaka-kenbunsho
  - text: 弘治2年（1556）11月16日の足利義氏感状案に「今度於上州安中城働之所」と見え、安中城の名は1550年代半ばには同時代文書に現れている（県立文書館の紹介による）
    kind: fact
    level: E2
    status: established
    sources:
    - u5-annaka-kenbunsho
  - text: 近世の記録は永禄2年（1559）に安中氏が野尻の地に城を移して安中と改めたと伝えるが、1556年の文書にすでに安中城の名が見えるため、改名の年次には食い違いがある
    kind: fact
    level: E4
    status: contested
    sources:
    - u5-annaka-localhistoria
    - u5-annaka-kenbunsho
  - text: 安中は中山道の宿場町（安中宿）であり、近世を通じて安中藩の城下町であった。藩主は井伊氏に始まり、幕末まで板倉氏が続いた
    kind: fact
    level: E4
    status: established
    sources:
    - u5-annaka-localhistoria
  - text: 安政2年（1855）、安中藩主・板倉勝明が50歳以下の家臣96人に、安中城内から中山道・碓氷峠頂上の熊野神社までの約29kmを走らせた安政遠足が行われ、その到着記録「安中御城内御諸士御遠足着帳」が残された
    kind: fact
    level: E2
    status: established
    sources:
    - u5-annaka-ansei
  - text: 1955年3月1日に安中町・原市町・磯部町・東横野村・岩野谷村・板鼻町・秋間村・後閑町が新設合併して安中町となり、1958年11月1日に市制施行して安中市となった。2006年3月18日に松井田町と新設合併して現在の安中市となった
    kind: fact
    level: E2
    status: established
    sources:
    - k6-kusatsu-gunma-henssen
  - text: 安政遠足は1955年に古文書が発見されて史実が明らかになり、1975年に第1回「侍マラソン」が開催され、現在は「安政遠足侍マラソン」として続いている
    kind: fact
    level: E2
    status: established
    sources:
    - u5-annaka-ansei
  column:
    title: 日本マラソン発祥の地――藩士の徒競走「安政遠足」
    text: 安政2年（1855）、安中藩主の板倉勝明は、心身鍛練のため50歳以下の家臣96人に安中城内から碓氷峠頂上の熊野神社まで約29kmを走らせた。神主が書き残した到着帳が昭和30年（1955）に発見され、この出来事が史実と分かった。市はこれを「日本マラソン発祥の地」とし、1975年から「侍マラソン」（現在の安政遠足侍マラソン）が続いている。城下町の名が武家の姓に由来する一方で、町のもう一つの顔はこの徒競走の記憶である。
    sources:
    - u5-annaka-ansei
  relations:
  - pref/10
  unknowns:
  - 安中氏の姓の由来そのもの（越後国新発田から移ってきたという伝承の裏づけ）は未確認
  - 地名としての「安中」が安中氏の入部以前から存在したとする新説（木部道金書状の紹介）は郷土研究レベルの確認にとどまる
  - 安中市公式サイトに市名の由来を直接説明するページは確認できなかった
  updated: '2026-11-13'
- id: muni/10-富岡市
  code: '102105'
  names:
    ja: 富岡市
    reading: とみおかし
    aliases: []
  user_terms:
  - 富岡の名前の由来
  - 富岡製糸場のある市
  - 世界遺産の製糸場のまち
  naming_type: 一部の地名
  prefecture: 群馬県
  homonyms: []
  summary: 近世の富岡町は、慶長17年（1612）に幕府代官の計画で宮崎村の住民を移住させて成立した町である。明治5年（1872）に官営富岡製糸場が置かれて名が知られ、1954年に市制、2006年に妙義町との新設合併を経て、2014年には製糸場が世界文化遺産となった。「富岡」の語源は未確定である。
  first_attestation:
    era: 慶長17年
    year_western: 1612
    document: 角川日本地名大辞典『富岡町（近世）』
    note: 幕府代官中野七蔵の計画により宮崎村の住民が小幡領瀬下郷へ移住して富岡町が成立した年。元和3年（1617）の検地帳には「小幡領富岡新田」とみえる。「富岡」の名自体がこれより遡るかは確認できていない。
  claims:
  - text: 総務省の地方公共団体コード一覧では、富岡市の団体コードは102105とされている。
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  - text: 角川日本地名大辞典によれば、近世の富岡町は慶長17年（1612）に幕府代官中野七蔵が中山道脇往還に新町を作ることを計画し、小幡領瀬下郷へ宮崎村の住民を移住させて成立した町であり、元和3年（1617）の検地帳に「小幡領富岡新田」とみえる。
    kind: fact
    level: E3
    status: established
    sources:
    - m3-jlogos-tomioka
  - text: 同書は言い伝えとして、旧城下町の系譜を持つ宮崎村の中町が富岡の上町を、宮崎村の上町が中町を形成し、瀬下郷の住民が下町を作ったという町の成り立ちを紹介している。
    kind: legend
    level: E3
    status: established
    sources:
    - m3-jlogos-tomioka
  - text: 群馬県によれば、富岡製糸場は明治5年（1872）に日本で最初の官営器械製糸工場として設立され、フランス人技師ポール・ブリュナの指導のもとで建物の建設と器械製糸技術の導入がはかられた。
    kind: fact
    level: E2
    status: established
    sources:
    - m3-gunma-tomioka-wh
  - text: 富岡市公式によれば、昭和29年（1954）4月に富岡町へ黒岩村・一ノ宮町・高瀬村・額部村・小野村が編入合併して富岡市が誕生し、次いで吉田村や丹生村などが編入された。
    kind: fact
    level: E2
    status: established
    sources:
    - m3-tomioka-keikaku
  - text: 富岡市公式によれば、平成18年（2006）3月27日に富岡市と妙義町が新設合併して、現在の富岡市が誕生した。
    kind: fact
    level: E2
    status: established
    sources:
    - m3-tomioka-keikaku
  - text: 富岡市公式によれば、平成26年（2014）6月に「富岡製糸場と絹産業遺産群」が世界文化遺産に登録され、同年12月に繰糸所・東置繭所・西置繭所の3棟が国宝に指定された。
    kind: fact
    level: E2
    status: established
    sources:
    - m3-tomioka-keikaku
  - text: 富岡市の景観計画によれば、富岡製糸場で働いた工女の当時の様子は、信州松代藩士の娘・和田英が残した『富岡日記』にみることができる。
    kind: fact
    level: E2
    status: established
    sources:
    - m3-tomioka-keikan
  column:
    title: 工女たちが技術を持ち帰ったまち
    text: 富岡製糸場は、器械製糸の技術を全国へ広めるための模範工場だった。全国から集まった工女たちはフランス人技術者から技術を学び、伝習を終えて故郷に戻ると、各地に設立された製糸工場で指導者となった。その工女の一人、和田英が残した『富岡日記』は、製糸場の暮らしを伝える貴重な記録である。富岡の名は、製糸場とともに全国へ広がった。
    sources:
    - m3-gunma-tomioka-wh
    - m3-tomioka-keikan
  relations:
  - pref/10
  - muni/10-藤岡市
  unknowns:
  - 「富岡」の語源と、1612年の町成立以前の「富岡」の用例は確認できなかった
  - 古代の甘楽郡の郷（額部・小野など）の多くは現市域に比定されるが、「富岡」の名自体は古代・中世の史料に確認できていない
  updated: '2026-11-13'
- id: muni/10-明和町
  code: '105228'
  names:
    ja: 明和町
    reading: めいわちょう
    aliases:
    - 明和村
  user_terms:
  - 群馬の明和町の由来
  - 明和村から明和町になった町
  - 理想郷という意味の明和
  naming_type: 合併新設
  prefecture: 群馬県
  homonyms:
  - muni/24-明和町
  summary: 邑楽郡の町で、昭和30年（1955）に千江田村・梅島村・佐貫村の合併で「明和村」として誕生した。新村名は3か村への公募で決まり、「明朗にして平和なる理想郷の象徴」として選ばれた瑞祥地名である。平成10年（1998）の町制施行では慣れ親しんだ村名を残し「明和町」となった。同名の三重県明和町も公募命名だが、そちらは前身町村名の字の合成で、命名の論理が異なる。
  first_attestation:
    era: 昭和30年
    year_western: 1955
    document: 公募による「明和村」の命名（3村の合併）
    note: 名前としての初出は1955年の明和村。町としての初出は1998年10月1日の町制施行で、村名をそのまま引き継いだ
  claims:
  - text: 昭和30年（1955）、旧千江田村・梅島村・佐貫村が合併して明和村が誕生した
    kind: fact
    level: E2
    status: established
    sources:
    - h5-meiwa-gunma-koho
  - text: 新村名は3か村に公募され、応募総数は215通、村名は89種類にのぼった
    kind: fact
    level: E2
    status: established
    sources:
    - h5-meiwa-gunma-yurai
  - text: 審査の結果、「明朗にして平和なる理想郷の象徴」として「明和村」の名称が決められたと、町は由来を説明している
    kind: fact
    level: E2
    status: established
    sources:
    - h5-meiwa-gunma-yurai
  - text: 平成10年（1998）10月1日の町制施行にあたり、43年間慣れ親しんだ村名を廃止するには忍びないとして、新しい町名は「明和町」と決まった
    kind: fact
    level: E2
    status: established
    sources:
    - h5-meiwa-gunma-yurai
  - text: 共通する層として、同名の三重県明和町も1950年代の合併で新町名を公募により決めており、「公募で生まれた明和」という点は両町に共通する
    kind: fact
    level: E2
    status: established
    sources:
    - h5-meiwa-mie-rekimachi
  - text: 異なる層として、群馬の明和は特定の旧村名の字を採った合成名ではなく「明朗」「平和」という理念そのものを名にした瑞祥地名であり、また1955年から1998年まで43年間は「明和村」だった点で、発足時から町だった三重の明和町と履歴が異なる
    kind: fact
    level: E2
    status: established
    sources:
    - h5-meiwa-gunma-yurai
    - h5-meiwa-mie-weblio
  - text: 総務省の全国地方公共団体コードで、明和町の団体コードは105228と定められている
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 89種類の候補から選ばれた「理想郷」の名前
    text: 1955年の合併で新しい村の名前を決めるとき、群馬の明和は3か村の住民に公募しました。条件は、3か村に共通する感じであること、簡潔で印象が明朗なこと、新鮮味のあること。集まった215通・89種類の中から選ばれたのが「明和」で、その理由は「明朗にして平和なる理想郷の象徴」と記録されています。村名に村の理想そのものを書き込む、昭和の大合併期らしい瑞祥命名です。そして43年後、町になるときも町民はこの名を手放さず、「廃止するには忍びない」と残しました。
    sources:
    - h5-meiwa-gunma-yurai
  relations:
  - pref/10
  - muni/24-明和町
  unknowns:
  - 公募で「明和」に次ぐ候補だった村名（次点の候補）は未確認
  - 「明和村」の名称を応募したのが誰か（個人名）は未確認
  updated: '2026-11-13'
- id: muni/10-昭和村
  code: '104485'
  names:
    ja: 昭和村
    reading: しょうわむら
    aliases:
    - 久呂保村
    - 糸之瀬村
  user_terms:
  - 群馬の昭和村の由来
  - 昭和村はなぜ昭和という名前か 群馬
  - こんにゃくいもの村 昭和村
  naming_type: 合併新設
  prefecture: 群馬県
  homonyms:
  - muni/07-昭和村
  summary: 利根郡の村で、昭和33年（1958）11月1日に久呂保村と糸之瀬村の合併で誕生した、昭和の大合併期の村である。村名が元号「昭和」と同字であることは明らかだが、命名理由を明記した村公式・県の公的資料は本調査では確認できず、理由は未詳として残す。同名の福島県昭和村は1927年の成立で改元あやかりの命名が説明されており、対照的である。
  first_attestation:
    era: 昭和33年
    year_western: 1958
    document: 昭和村の発足（久呂保村・糸之瀬村の合併）
    note: 村名の初出は1958年の合併による命名そのもの。ただし命名理由の公的記録は本調査で未確認
  claims:
  - text: 昭和33年（1958）11月1日に久呂保村と糸之瀬村が合併して昭和村が誕生した
    kind: fact
    level: E2
    status: established
    sources:
    - h5-showa-gunma-plan
  - text: 昭和36年（1961）8月1日には、利根村の大字生越が境界変更により昭和村へ編入された
    kind: fact
    level: E2
    status: established
    sources:
    - h5-showa-gunma-plan
  - text: 前身の久呂保村は1889年（明治22年）に森下村・橡久保村・川額村の合併で、糸之瀬村は糸井村・貝野瀬村の合併で発足した村である
    kind: fact
    level: E2
    status: established
    sources:
    - h5-showa-gunma-plan
  - text: 県の市町村要覧は、昭和村の団体コードを104485、村制施行の日を昭和33年11月1日と記す
    kind: fact
    level: E2
    status: established
    sources:
    - h5-showa-gunma-youran
  - text: 村名「昭和」の命名理由は、村公式の総合計画や県の市町村要覧・市町村名変遷表には記されておらず、本調査では命名理由を明記した公的資料を確認できなかった
    kind: fact
    level: E2
    status: indeterminate
    sources:
    - h5-showa-gunma-plan
    - h5-showa-gunma-youran
  - text: 異なる層として、同名の福島県昭和村は昭和2年（1927）に成立し、「昭和時代に入って誕生した村」という改元あやかりの命名理由が公的資料で説明されるのに対し、群馬の昭和村は昭和の大合併期（1958）の成立で、理由も記録されていない
    kind: fact
    level: E2
    status: established
    sources:
    - h5-showa-fk-soka
    - h5-showa-gunma-plan
  - text: 共通する層として、両村とも合併で旧村名を継承せず、元号と同字の新名「昭和」を採った村である
    kind: fact
    level: E2
    status: established
    sources:
    - h5-showa-fk-soka
    - h5-showa-gunma-plan
  - text: 平成の大合併では、村は「自主自立の道」を選択し、合併せずに単独の村として存続した
    kind: fact
    level: E2
    status: established
    sources:
    - h5-showa-gunma-plan
  column:
    title: 「昭和の日」が、村の行事になる村
    text: 群馬の昭和村では、県の市町村要覧の行事一覧に「『昭和の日』記念イベント（4月）」が載っています。村名が元号そのものなので、4月29日の「昭和の日」が、そのまま村のアイデンティティを祝う日になるのです。こんにゃくいもの大鍋が名物のこのイベントも含め、村は「昭和」という名を積極的に使い続けています。ただし、1958年の合併時に誰がなぜこの名を選んだのかは、公表された資料ではまだ分かりません。名の使い方は華やかでも、名の由来の記録は静かです。
    sources:
    - h5-showa-gunma-youran
    - h5-showa-gunma-plan
  relations:
  - pref/10
  - muni/07-昭和村
  unknowns:
  - 村名「昭和」の命名理由・発案者・選定過程は公表資料で未確認であり、『昭和村誌』など村史の直接確認が今後の課題
  - 同名の福島県昭和村との交流事業の有無など、2つの昭和村の関係史は未確認
  updated: '2026-11-13'
- id: muni/10-桐生市
  code: '102032'
  names:
    ja: 桐生市
    reading: きりゅうし
    aliases: []
  user_terms:
  - 桐生の名前の由来
  - 織物のまち桐生
  - 西の西陣、東の桐生
  naming_type: 一部の地名
  prefecture: 群馬県
  homonyms: []
  summary: 『吾妻鏡』の養和元年（1181）条に足利氏の郎党「桐生六郎」と現れるのが名の初出とされ、桐生氏の本拠・織物のまちとして発展した。1921年に山田郡桐生町が市制を施行して桐生市となった。語源は「きり＝開墾地、う＝峡谷」とする説などがあり、定説はない。
  first_attestation:
    era: 養和元年
    year_western: 1181
    document: 『吾妻鏡』
    note: 養和元年閏2月25日条に足利氏の郎党として「桐生六郎」がみえる（日本歴史地名大系・桐生市公式資料が紹介）。人名としての現れが地名の初出とされる。
  claims:
  - text: 総務省の地方公共団体コード一覧では、桐生市の団体コードは102032とされている。
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  - text: 日本歴史地名大系によれば、『吾妻鏡』養和元年（1181）閏2月25日条に足利氏の郎党として「桐生六郎」がみえ、これが桐生の名の歴史上の初出とされる。
    kind: fact
    level: E3
    status: established
    sources:
    - m3-kotobank-kiryu
  - text: 桐生市公式の歴史資料も『吾妻鏡』のこの記事を紹介し、六郎が戦功の恩賞として桐生の地を与えられたことが桐生氏の起こりであると伝える。
    kind: fact
    level: E2
    status: established
    sources:
    - m3-kiryu-fuchi
  - text: 日本歴史地名大系は語源について、「きり」は開墾地、「う」は峡谷の意で、地形から地名が付けられたという説を紹介している。
    kind: fact
    level: E3
    status: contested
    sources:
    - m3-kotobank-kiryu
  - text: Wikipediaは「桐が多く自生する土地」から「桐生」、「霧が多く発生する土地」から「霧生」とする説も挙げるが、どちらも決め手は無いとしている。
    kind: fact
    level: E5
    status: contested
    sources:
    - m3-kiryu-wiki
  - text: 日本歴史地名大系によれば、市名は近世に当地方の中心であった桐生新町、近代の桐生町に由来する。
    kind: fact
    level: E3
    status: established
    sources:
    - m3-kotobank-kiryu
  - text: 大正10年（1921）3月1日に山田郡桐生町が市制を施行して桐生市となり、県内では3番目、県東部では初の市制であった。
    kind: fact
    level: E2
    status: established
    sources:
    - m3-kiryu-nenpyo
  - text: 平成17年（2005）6月13日に勢多郡新里村・黒保根村と合併し、市域はおよそ2倍に広がった。
    kind: fact
    level: E2
    status: established
    sources:
    - m3-kiryu-nenpyo
  column:
    title: 奈良時代から続く絹のまち
    text: 桐生の織物の古さは、上野国の絹の記録にたどれる。桐生市の歴史資料によれば、『続日本紀』には和銅7年（714）に上野国が絁（あしぎぬ）を朝廷に献上した記録がある。近世に「西の西陣、東の桐生」と並び称される織物の産地になった背景には、こうした古い絹織物の伝統があった。
    sources:
    - m3-kiryu-fuchi
  relations:
  - pref/10
  unknowns:
  - 語源は「きり＝開墾地・う＝峡谷」説、桐の自生説、霧生説などが併存し、定説は確認できなかった
  - 中世の桐生郷の範囲と成立時期の詳細は未確認
  updated: '2026-11-13'
- id: muni/10-沼田市
  code: '102067'
  names:
    ja: 沼田市
    reading: ぬまたし
    aliases:
    - 渭田
    - 沼田町
  user_terms:
  - 真田の城下町
  - ぬまた
  - 天空の城下町
  - 河岸段丘のまち
  naming_type: 一部の地名
  prefecture: 群馬県
  homonyms: []
  summary: 群馬県北部の中心都市で、利根川と片品川がつくった河岸段丘の上に市街地が広がる。「沼田」の名は『和名類聚抄』に見える利根郡渭田（ぬまた）郷の遺称と考えられ、近世の城下町・沼田町がそのまま市名になった。中世以来の沼田氏、戦国末期の真田氏の城下町として知られ、1954年に市制施行した。
  first_attestation:
    era: 平安時代
    year_western: null
    document: 和名類聚抄（利根郡渭田郷）
    note: 『日本歴史地名大系』が「地名は『和名抄』にみえる利根郡渭田（ぬまた）郷の遺名と考えられる」と紹介するもの。現在と同じ「沼田」の表記の初出は未確認
  claims:
  - text: 地名「沼田」は『和名類聚抄』に見える利根郡渭田（ぬまた）郷の遺名と考えられ、市名は近世市域の中心であった城下・沼田町を継承する（『日本歴史地名大系』）
    kind: fact
    level: E3
    status: established
    sources:
    - u5-numata-kotobank
  - text: 沼田氏は鎌倉時代以来この地方の有力者であり、沼田の地は中世を通じてその本拠であった
    kind: fact
    level: E3
    status: established
    sources:
    - u5-numata-kotobank
  - text: 沼田城は天文元年（1532）に沼田氏12代・万鬼斎顕泰が蔵内（倉内）城として築城したもので、市公式はこれを「沼田市街地発祥のかなめ」とする
    kind: fact
    level: E2
    status: established
    sources:
    - u5-numata-sanada
  - text: 天正8年（1580）に武田勝頼の武将・真田昌幸が入城し、天正18年（1590）に嫡子信幸が沼田領2万7千石の初代城主となって、以後真田氏5代91年の居城となった
    kind: fact
    level: E2
    status: established
    sources:
    - u5-numata-sanada
  - text: 慶長年間に五層天守が建造されて城下町の形態が完成したが、天和元年（1681）に5代信利が改易され、翌年に城は完全に破却された
    kind: fact
    level: E2
    status: established
    sources:
    - u5-numata-sanada
  - text: 1954年4月1日に沼田町・利南村・池田村・薄根村・川田村が合併して市制施行し、2005年2月13日に白沢村・利根村を編入した
    kind: fact
    level: E2
    status: established
    sources:
    - k6-kusatsu-gunma-henssen
    - u5-numata-kotobank
  column:
    title: 「渭田」から「沼田」へ――読みは同じでも字が変わった
    text: 平安時代の『和名類聚抄』に利根郡の郷として見えるのは「渭田」で、読みは今と同じ「ぬまた」だった。やがて「沼田」の字が定着するが、いつ、なぜ字が替わったのかははっきりしない。水の多い低地を思わせる「沼」の字は、利根川と片品川に挟まれた段丘の下に広がる地形とも重なる。読みが千年以上変わらない一方で、表記だけが静かに入れ替わった地名である。
    sources:
    - u5-numata-kotobank
  relations:
  - pref/10
  unknowns:
  - 「渭田」から「沼田」への表記の切り替わりの時期と理由は未確認
  - 渭田郷の語源（「沼の多い田」の意か等）は専門辞典でも確定していない
  updated: '2026-11-13'
- id: muni/10-渋川市
  code: '102083'
  names:
    ja: 渋川市
    reading: しぶかわし
    aliases: []
  user_terms:
  - 渋川の名前の由来
  - 伊香保温泉のある市
  - 渋川市は合併でどう変わったか
  naming_type: 一部の地名
  prefecture: 群馬県
  homonyms: []
  summary: 「渋川」の名は貞和4年（1348）の懸仏にみえるのが早い用例とされる。1954年に渋川町ほか3村で市制を施行し、2006年の新設合併で伊香保温泉のある榛名山東麓から赤城山西麓までを含む大きな市域となった。新市名は公募でも「渋川市」が最多の支持を得た。語源は未確定である。
  first_attestation:
    era: 貞和4年
    year_western: 1348
    document: 懸仏の銘文
    note: 日本歴史地名大系『渋川市』が「渋川の地名は貞和四年（一三四八）の懸仏にみえるのが早い例である」とする（同書経由の紹介として記録）。
  claims:
  - text: 総務省の地方公共団体コード一覧では、渋川市の団体コードは102083とされている。
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  - text: 日本歴史地名大系によれば、渋川の地名は貞和4年（1348）の懸仏にみえるのが早い例である。
    kind: fact
    level: E3
    status: established
    sources:
    - m3-kotobank-shibukawa
  - text: 日本歴史地名大系によれば、市名は昭和29年（1954）の市制施行の際に中核となった渋川町による。
    kind: fact
    level: E3
    status: established
    sources:
    - m3-kotobank-shibukawa
  - text: 昭和29年（1954）4月1日に渋川町・古巻村・豊秋村・金島村が合併して、旧・渋川市が発足した。旧市の市域は利根川と吾妻川に沿う市の南部が中心であった。
    kind: fact
    level: E2
    status: established
    sources:
    - m3-shibukawa-hensen
  - text: 平成18年（2006）2月20日に旧渋川市・伊香保町・小野上村・子持村・赤城村・北橘村の1市1町4村が新設合併して、現在の渋川市が発足した。
    kind: fact
    level: E2
    status: established
    sources:
    - m3-shibukawa-hensen
  - text: この合併により市域は旧市の範囲を大きく超え、伊香保温泉のある榛名山東麓から、赤城山西麓・子持山方面までを含むようになった。
    kind: fact
    level: E2
    status: established
    sources:
    - m3-shibukawa-hensen
  - text: 合併協議会の資料によれば、新市の名称は公募され、応募総数2,011件のうち「渋川市」への応募が508人と最多で、そのまま新しい市名に決まった。
    kind: fact
    level: E2
    status: established
    sources:
    - m3-shibukawa-gappei
  - text: 「渋川」の語源については、本調査で参照した専門地名辞典・公的資料に定説の明示がなく、未確定である。
    kind: fact
    level: E3
    status: indeterminate
    sources:
    - m3-kotobank-shibukawa
  column:
    title: 公募で選ばれた「渋川市」と名付け親大賞
    text: 2006年の新設合併では、新しい市の名前が公募された。応募は2,011件にのぼり、最多だったのは508人が寄せた「渋川市」そのものだった。結局、新市名は旧市の名を受け継ぐことに決まり、応募者の中から「名付け親大賞」が表彰された。合併で市域が大きく姿を変えても、名前は変わらなかった珍しい例である。
    sources:
    - m3-shibukawa-gappei
  relations:
  - pref/10
  unknowns:
  - 「渋川」の語源は未確定で、市内を流れる渋川（川の名）との先後関係も出典で確認できていない
  - 貞和4年（1348）の懸仏の現物と所蔵先の確認は未実施
  updated: '2026-11-13'
- id: muni/10-草津町
  code: '104264'
  names:
    ja: 草津町
    reading: くさつまち
    aliases:
    - 草生津
    - 九草津
    - 九相津
  user_terms:
  - 草津の名前の由来
  - くそうづとは何か
  - 草津温泉は誰が発見したの
  - 草津町はいつできたの
  naming_type: その他（温泉地の地名「草津」を継承し、草津村の分割で町制を施行）
  prefecture: 群馬県
  homonyms: []
  summary: 草津の古い呼び名は「くそうづ」で、「草津」のほか「九草津」「草生津」「九相津」とも書かれた。地名研究では、硫化水素の強い臭気を持つ泉、すなわち「臭い泉」の意味とする説が有力である。温泉の発見については源頼朝・行基・日本武尊の三つの伝承が並び立つ。町としては1900年、草津村の分割によって大字草津・前口が草津町となった。
  first_attestation:
    era: 文明18年
    year_western: 1486
    document: 堯恵「北国紀行」
    note: 「草津の温泉」という記述がみえる用例を日本歴史地名大系ジャーナルが紹介するもの。現在も現地では温泉地を「くさづ」と呼ぶ
  claims:
  - text: 地名「草津」の古い形は「くそうづ」で、「草津」のほか「九草津」「草生津」「九相津」とも記され、現在も現地では温泉地を「くさづ」と呼ぶと日本歴史地名大系ジャーナルは紹介する（地方公共団体コードは104264）
    kind: fact
    level: E3
    status: established
    sources:
    - k6-kusatsu-japanknowledge
    - b-cap-chiba-soumu-code
  - text: 語源については、萩原進『草津温泉史』が湯の硫化水素の臭気によるものとし、谷川健一編『地名の話』も湧水を指す「そうず」の語から「くそうず」すなわち「臭い泉」の意味であるとするなど、「臭い泉」説が地名研究では有力である
    kind: fact
    level: E3
    status: established
    sources:
    - k6-kusatsu-japanknowledge
  - text: 同じ「草生津」の表記は全国各地にみられ、石油や炭化水素の臭気に結びついた地名が多いことも、「臭い泉」説を補強すると同ジャーナルは指摘する
    kind: fact
    level: E3
    status: established
    sources:
    - k6-kusatsu-japanknowledge
  - text: 文献の上では、文明18年（1486年）の堯恵『北国紀行』に「草津の温泉」がみえ、明応4年（1495年）の『松陰私語』にも用例がある
    kind: fact
    level: E3
    status: established
    sources:
    - k6-kusatsu-japanknowledge
  - text: 温泉の発見をめぐっては、行基菩薩が発見したとする光泉寺の縁起や、文治元年（1185年）に源頼朝が発見したとする『草津温泉来由記』の伝承が伝えられている
    kind: legend
    level: E3
    status: contested
    sources:
    - k6-kusatsu-japanknowledge
    - k6-kusatsu-kanko
  - text: 草津温泉観光協会は、日本武尊が病を癒すために温泉を発見したという伝承を紹介している
    kind: legend
    level: E4
    status: contested
    sources:
    - k6-kusatsu-kanko
  - text: 1900年（明治33年）7月1日、草津村が分割され、大字草津・大字前口の区域をもって草津町が発足した（残りの区域は六合村となった）と群馬県の変遷表は記録する
    kind: fact
    level: E2
    status: established
    sources:
    - k6-kusatsu-gunma-henssen
  column:
    title: 冬は村を捨てて下山した温泉町——「冬住み」の慣習
    text: 海抜1,200メートル。草津の冬はあまりに厳しく、江戸から明治にかけての温泉場の人々は、冬になると麓の小雨村へ移り住む「冬住み」を続けた。この慣習が終わったのは1897年（明治30年）のことだという。硫黄の臭いのする湯の恵みと、暮らしを町ごと引っ越しさせるほどの寒さ。その両方が「くそうづ（臭い泉）」という名の土地の素顔だった。
    sources:
    - k6-kusatsu-japanknowledge
  relations:
  - pref/10
  unknowns:
  - 「くそうづ」の初出とされる中世以前の文献用例は、今回確認できた範囲では室町時代が最古であり、それ以前は未確認
  - 草津温泉が「日本三名泉」に数えられる典拠（林羅山の選定）の一次確認は未了のため主張に含めていない
  updated: '2026-11-13'
- id: muni/10-藤岡市
  code: '102091'
  names:
    ja: 藤岡市
    reading: ふじおかし
    aliases:
    - 富士岡
    - 常が岡
  user_terms:
  - 藤岡の名前の由来
  - 高山社跡のある市
  - 富岡と藤岡はどう違うか
  naming_type: 一部の地名
  prefecture: 群馬県
  homonyms: []
  summary: 中世の藤岡は「常が岡」と呼ばれ、富士浅間神社の創建を機に「富士岡」、のちに「藤岡」になったと伝えられる。1954年の市制施行と2006年の鬼石町との合併を経て現在に至る。近代養蚕法「清温育」の発祥地である高山社跡は、世界遺産「富岡製糸場と絹産業遺産群」の構成資産である。
  first_attestation:
    era: 永享年間（15世紀前半）
    year_western: null
    document: 『続太平記』
    note: 日本歴史地名大系『藤岡町』は、永享の乱に際して上杉憲実が藤岡などに陣を張ったと『続太平記』にあることを紹介する。それ以前は「常が岡（常ヶ岡）」と呼ばれたと縁起書が伝える。
  claims:
  - text: 総務省の地方公共団体コード一覧では、藤岡市の団体コードは102091とされている。
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  - text: 藤岡市の文化財保存活用地域計画によれば、古代の上野国緑野郡はほぼ現在の藤岡市にあたり、その名は『和名類聚抄』にもみえる。
    kind: fact
    level: E2
    status: established
    sources:
    - m3-fujioka-bunkazai
  - text: 同計画は、「緑野」の由来について、水が集まる平野という意味の「水の処野（みどの）」と呼ばれたところに「緑野」の字が当てられたと伝えられると記している。
    kind: fact
    level: E2
    status: indeterminate
    sources:
    - m3-fujioka-bunkazai
  - text: 日本歴史地名大系によれば、享和3年（1803）の富士浅間神社縁起書には、文応元年（1260）に日蓮が常が岡鮭塚に経を納め、富士山の分霊を勧請して鎮守として以来、この地は「富士岡」と称したという話が記されている。
    kind: legend
    level: E3
    status: established
    sources:
    - m3-kotobank-fujioka-machi
  - text: 日本歴史地名大系によれば、『続太平記』には永享の乱で上杉憲実が平井城攻めにあたり藤岡などに陣を張ったとあり、15世紀には「藤岡」の名が用いられていた。
    kind: fact
    level: E3
    status: established
    sources:
    - m3-kotobank-fujioka-machi
  - text: 「富士岡」が隣の「富岡」と紛らわしかったため、「富士」の字を「藤」に改めて「藤岡」になったという説がある。
    kind: fact
    level: E4
    status: contested
    sources:
    - m3-fujioka-gogen
  - text: 昭和29年（1954）4月1日に藤岡町・神流村・小野村・美土里村・美九里村が合併して市制を施行し、翌1955年3月1日に平井村・日野村を編入した。
    kind: fact
    level: E2
    status: established
    sources:
    - m3-fujioka-gaiyo
  - text: 平成18年（2006）1月1日に鬼石町と合併し、現在の藤岡市となった。
    kind: fact
    level: E2
    status: established
    sources:
    - m3-fujioka-gaiyo
  - text: 藤岡市公式によれば、高山社跡は「富岡製糸場と絹産業遺産群」の構成資産の一つとして、平成26年（2014）6月25日に世界文化遺産となった。
    kind: fact
    level: E2
    status: established
    sources:
    - m3-fujioka-kankyou
  column:
    title: 清温育と高山長五郎
    text: 藤岡は、近代養蚕法「清温育」の発祥の地である。高山長五郎は蚕の飼育の温度管理を体系化した清温育を確立したと伝えられ、1884年には養蚕改良高山社を組織して全国に門下を広げた。その拠点だった高山社跡は、富岡製糸場とともに世界遺産に登録されている。製糸場のある富岡市と、蚕種と飼育法の改良を担った藤岡市は、絹産業遺産群の中で対をなす存在である。
    sources:
    - m3-fujioka-takayama
    - m3-fujioka-kankyou
  relations:
  - pref/10
  - muni/10-富岡市
  unknowns:
  - 「藤岡」の語源は富士浅間神社由来説が有力とされるが、市公式の見解としては確認できていない
  - 常が岡から富士岡への改称の時期は、縁起書の伝承に基づくもので史料的な裏づけは弱い
  updated: '2026-11-13'
- id: muni/10-館林市
  code: '102075'
  names:
    ja: 館林市
    reading: たてばやしし
    aliases:
    - 立林
  user_terms:
  - 館林の名前の由来
  - 尾曳城の狐の伝説
  - つつじのまち館林
  naming_type: 一部の地名
  prefecture: 群馬県
  homonyms: []
  summary: 15世紀の史料に「立林城」などと現れる城下町で、狐が尾を曳いて縄張りを案内したという尾曳城の伝説で知られる。1954年に館林町と7村が合併して市制を施行し、以後は合併を行っていない。「館林」の語源については定説がない。
  first_attestation:
    era: 文明3年
    year_western: 1471
    document: 館林城に関する最古の史料（市の歴史文化基本構想）
    note: 市の基本構想は館林城の最古の史料を文明3年（1471）とする。一方で『鎌倉大草紙』応永22年（1415）条に館林の記事があるとする紹介もあり、初出の確定には原典の確認を要する。
  claims:
  - text: 総務省の地方公共団体コード一覧では、館林市の団体コードは102075とされている。
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  - text: 館林市公式は、「館林の名が古文書に初めて出てくるのは15世紀の中頃である」としている。
    kind: fact
    level: E2
    status: established
    sources:
    - m3-tatebayashi-intro
  - text: 館林市の歴史文化基本構想は、館林城に関する最古の史料を文明3年（1471）のものとし、この頃の城は「立林城」とも書かれた。
    kind: fact
    level: E2
    status: established
    sources:
    - m3-tatebayashi-bunka
  - text: Wikipediaは、『鎌倉大草紙』の応永22年（1415）条に上杉禅秀が館林を討った記事があるとし、表記には館林・立林、読みには「たてばやし」と「たちばやし」のゆれがあって永禄年間以降に現在の形に定まったとする。
    kind: fact
    level: E5
    status: contested
    sources:
    - m3-tatebayashi-wiki
  - text: 館林城の築城時期や築城者を明記した当時の記録は発見されておらず、赤井照光による築城は江戸時代になって書かれたものにみえる話が、狐の尾曳伝説と相まって広く知られている。
    kind: fact
    level: E2
    status: established
    sources:
    - m3-tatebayashi-bunka
  - text: 伝説では、大袋城主の赤井照光が子狐を助けたところ、親狐が報恩に現れて尾を曳いて城の縄張りを案内し、その通りに築いた城が尾曳城（館林城）であると語られる。
    kind: legend
    level: E2
    status: established
    sources:
    - m3-tatebayashi-satonuma
  - text: 昭和29年（1954）4月1日に館林町・郷谷村・大島村・赤羽村・六郷村・三野谷村・多々良村・渡瀬村が合併して館林市が発足し、以後、市町村合併は行われていない。
    kind: fact
    level: E2
    status: established
    sources:
    - m3-tatebayashi-shiryo
  - text: 「館林」の語源については、市公式の定説はなく、本調査でも確定できなかった。
    kind: fact
    level: E2
    status: indeterminate
    sources:
    - m3-tatebayashi-intro
  column:
    title: 狐が残した三つの稲荷
    text: 尾曳伝説の舞台には、今も狐にまつわる稲荷社が残る。尾曳稲荷神社のほか、狐が初めて尾を引き出した地とされる初引稲荷（初曳稲荷）、夜明けにまつわる夜明稲荷があり、市は日本遺産「里沼」の物語の一つとしてこの伝説を伝えている。築城の史実とは別に、伝説のほうもまた地名の記憶として生き続けている。
    sources:
    - m3-tatebayashi-satonuma
  relations:
  - pref/10
  unknowns:
  - 初出は『鎌倉大草紙』応永22年（1415）条とする紹介と、城の最古史料を文明3年（1471）とする市の基本構想があり、性格の異なる2つの「初出」を原典で確定するには至っていない
  - 「館林」の語源の定説は未確認
  updated: '2026-11-13'
- id: muni/10-高山村
  code: '104281'
  names:
    ja: 高山村
    reading: たかやまむら
    aliases: []
  user_terms:
  - 高山村 群馬 合成地名
  - 中山と尻高の村
  - 三国街道の宿場の村
  naming_type: 合併新設
  prefecture: 群馬県
  homonyms:
  - muni/20-高山村
  summary: 明治22年（1889年）に中山村と尻高村が合併して生まれた村で、村名は尻高の「高」と中山の「山」を合わせた合成地名である。長野県にも高山村があり、そちらも合成地名だが、材料は高井村と山田村で、字面の一致は偶然である。旧村名は現在の大字「中山」「尻高」に残る。
  first_attestation:
    era: 明治22年
    year_western: 1889
    document: 町村制施行による高山村の誕生（1889年4月1日）
    note: 自治体名としての初出（合併時の合成地名）
  claims:
  - text: 明治22年（1889年）4月1日、西群馬郡の尻高村と中山村が合併して高山村が誕生した（明治29年に吾妻郡へ編入）
    kind: fact
    level: E2
    status: established
    sources:
    - h6-takayama-gunma-official
    - h6-takayama-gunma-pref
  - text: 地名研究の講演資料（北川和秀）は、明治22年の群馬県の新地名の分類で高山村を「合併した町村名を合成」した例に挙げ、「尻高と中山の各一字をとって合成したもの」と説明する
    kind: fact
    level: E3
    status: established
    sources:
    - h6-takayama-gosei-kitagawa
  - text: 合成地名の一覧資料でも、群馬県吾妻郡高山村は「尻高村＋中山村」の合成地名として挙げられている
    kind: fact
    level: E5
    status: established
    sources:
    - h6-takayama-gosei-list
  - text: 長野県の高山村も合成地名という点は共通するが、材料は高井村の「高」と山田村の「山」で、群馬側の尻高・中山とは無関係である（共通する層＝合成地名という命名方式、異なる層＝元の村名）
    kind: fact
    level: E5
    status: established
    sources:
    - h6-takayama-gosei-list
    - h6-takayama-nagano-wiki
  - text: 合併前の旧村名は、現在の大字「中山」「尻高」として村内に残っている
    kind: fact
    level: E2
    status: established
    sources:
    - h6-takayama-gunma-pref
  - text: 村は近世に越後と江戸を結ぶ三国街道の宿場として栄えた土地で、繁栄は街道が廃止される明治初期まで続いた
    kind: fact
    level: E2
    status: established
    sources:
    - h6-takayama-gunma-official
  column:
    title: 「足して二で割る」合成地名
    text: 明治22年の大合併では、新しい村名の付け方にいくつかの型がありました。地名研究者はその一つを「足して二で割る」方式と呼びます。高山村はその典型で、尻高の「高」と中山の「山」を一字ずつ取って「高山」。隣の県の長野県高山村も、高井の「高」と山田の「山」で同じ結果になりました。作り方は同じでも材料が違えば別の村――二つの高山村は、明治の命名の型そのものを比べられる好例です。
    sources:
    - h6-takayama-gosei-kitagawa
    - h6-takayama-gosei-list
  relations:
  - pref/10
  - muni/20-高山村
  unknowns:
  - 合成の際に「高山」の字順・読みを決めた経緯の記録は未確認
  - 「中山」「尻高」という旧村名自体の語源は今回未調査
  updated: '2026-11-13'
- id: muni/10-高崎市
  code: '102024'
  names:
    ja: 高崎市
    reading: たかさきし
    aliases:
    - 和田
    - 高崎町
    - 高崎城
  user_terms:
  - 高崎市の名前の由来
  - 高崎は誰が名付けたのか
  - 高崎城と井伊直政
  - 金井沢碑とは
  naming_type: 新規命名
  prefecture: 群馬県
  homonyms: []
  summary: 「高崎」は慶長3年（1598）に井伊直政が高崎城を築いたときに生まれた地名である。それまで和田と呼ばれていた土地を、直政は「松カ崎」と改めようとしたが、竜広寺の住職白菴が「成功高大」の意味から「高崎」を進言して採用されたと市は伝える。城下町の名として定着し、1900年に市制を施行した。
  first_attestation:
    era: 慶長3年
    year_western: 1598
    document: 高崎城の築城に伴う命名（高崎市文化財情報「高崎城址」）
    note: 和田と呼ばれていた土地への命名そのもの。「成功高大」の字義を込めた命名と市は説明する
  claims:
  - text: 慶長3年（1598）、箕輪城主井伊直政は徳川家康の命令により、かつて和田氏の和田城があった地に高崎城を新たに築き、箕輪城より移転した
    kind: fact
    level: E2
    status: established
    sources:
    - l2-takasaki-castle
  - text: 築城にあたって直政は、当時和田と呼ばれていた地名を「松カ崎」と改めようとして竜広寺の住職白菴に相談した。白菴は諸木には栄枯があることを説き、「成功高大」の意味から「高崎」と名づけるように進言し、これが採用されて「高崎」の地名が誕生したと高崎市は伝える
    kind: fact
    level: E2
    status: established
    sources:
    - l2-takasaki-castle
  - text: 城下町は箕輪城下から移された寺院や町（連雀町・田町など）とともに整備され、高崎城の完成は元和5年（1619）に入城した安藤重信ら安藤氏3代によるといわれる
    kind: fact
    level: E2
    status: established
    sources:
    - l2-takasaki-castle
  - text: 市域の山名町には、神亀3年（726）に豪族三家氏が建てた金井沢碑があり、碑文には上野国群馬郡下賛郷高田里に住んだ一族の名が刻まれている。上野三碑の一つで特別史跡に指定されている
    kind: fact
    level: E2
    status: established
    sources:
    - l2-takasaki-kanaizawa
  - text: 明治33年（1900）4月1日、群馬郡高崎町が市制を施行して高崎市が誕生した
    kind: fact
    level: E5
    status: established
    sources:
    - l2-gunma-hensei
  - text: 総務省の全国地方公共団体コードで、高崎市の団体コードは102024と定められている
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 「松カ崎」になるはずだった城下町
    text: 高崎城を築いた井伊直政は、松の字を入れた「松カ崎」という名を考えていました。それを止めたのは竜広寺の住職白菴です。木には栄える時も枯れる時もある、というのがその理由で、代わりに勧めたのが「成功高大」の願いを込めた「高崎」でした。松は城下の景観としては魅力的でも、枯れる木に町の将来を託すのは縁起が悪い、というわけです。直政はこの進言を受け入れ、1598年に「高崎」という地名が生まれました。ただしこれは市が文化財解説で伝える命名譚であり、同時代の記録で裏付けられた話ではありません。その断りを含めて、戦国大名と僧侶の問答から生まれた地名として記憶されています。
    sources:
    - l2-takasaki-castle
  relations:
  - pref/10
  unknowns:
  - 白菴の進言による命名は市の文化財情報が伝える話で、同時代史料での裏付けは本バッチでは確認できていない
  - 1598年以前に「高崎」の用例があったかどうかは、専門の地名辞典まで確認できていない
  updated: '2026-11-13'
sources:
  b-cap-chiba-soumu-code:
