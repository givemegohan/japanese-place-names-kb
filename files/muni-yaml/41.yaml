prefecture_code: '41'
records:
- id: muni/41-伊万里市
  code: '412058'
  names:
    ja: 伊万里市
    reading: いまりし
    aliases:
    - 伊万里町
    - 伊万里浦
  user_terms:
  - 伊万里はなぜ伊万里というの
  - 伊万里焼の積出港
  - 大川内山の鍋島焼
  - 有田焼との関係
  naming_type: その他（中世以来の港・浦の地名を継承したもの）
  prefecture: 佐賀県
  homonyms: []
  summary: 伊万里湾に面した港町で、市名は中世以来の浦の名「伊万里」による。記録としては、松浦党の伊万里氏に伝わる「伊万里文書」の建保6年（1218年）の譲状案に「伊万里浦」と記されたものが残ると市は伝える。地名のおこりには、奈良時代に九州へ派遣された紀飯麻呂にちなむ説と、条里制の「今里」に由来する説がある。江戸時代には有田焼・鍋島焼の積出港として「イマリ」の名を世界に広め、昭和29年（1954年）に2町7ヶ村の合併で伊万里市が発足した。
  first_attestation:
    era: 建保6年
    year_western: 1218
    document: 「建保六年源披譲状案」（伊万里文書）
    note: 「伊万里浦」としての用例を伊万里市の沿革が紹介するもの。譲状の「案」（控え）であり、原史料の直接確認はしていないため紹介形で記録する
  claims:
  - text: 伊万里市の地方公共団体コードは412058である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  - text: 「伊万里」という地名は、松浦党の伊万里氏に伝わる「伊万里文書」のうち、鎌倉時代の「建保六年源披譲状案」に「伊万里浦」と記された記録が残っていると市の沿革は伝える
    kind: fact
    level: E2
    status: established
    sources:
    - r4-imari-toshi-keikaku
  - text: 地名のおこりについて市は2説を挙げる。一つは、奈良時代に反乱者を討つため九州に派遣された紀飯麻呂がこの地に立ち寄ったことにちなんだという説、もう一つは条里制によるもので、今岳の近くに「今」と呼ばれる里（村）があって、それが「今里（伊万里）」と呼ばれるもとになったという説である
    kind: fact
    level: E2
    status: contested
    sources:
    - r4-imari-toshi-keikaku
  - text: 江戸時代には「古伊万里」の積出港として大いに栄え、「イマリ」の名を世界に広めたと市は説明している（有田で焼かれた磁器が伊万里港から出荷されたため、産地でなく積出港の名で知られた）
    kind: fact
    level: E2
    status: established
    sources:
    - r4-imari-toshi-keikaku
  - text: 明治4年（1871年）の廃藩置県によって一時「伊万里県」が誕生し県庁が大坪町に設置されたが、明治5年（1872年）には県庁が佐賀に移り佐賀県と改称された
    kind: fact
    level: E2
    status: established
    sources:
    - r4-imari-toshi-keikaku
  - text: 昭和29年（1954年）4月、町村合併促進法により伊万里湾沿岸の2町7ヶ村を合併した伊万里市が発足した
    kind: fact
    level: E2
    status: established
    sources:
    - r4-imari-toshi-keikaku
  column:
    title: 産地でない港の名が、世界ブランドになった
    text: 「伊万里焼」は、実は伊万里で焼かれた焼き物ではない。有田の窯で焼かれた磁器が伊万里川を下り、伊万里港から船に積まれて出荷されたため、積出港の名前がそのまま商品名になった。オランダ東インド会社を通じてヨーロッパに渡った磁器は「IMARI」として王侯貴族を魅了し、産地の有田より港の伊万里の名が先に世界へ広がった。市内にはもう一つ、大川内山の鍋島藩窯もある。港の名が世界に届き、窯の名は将軍家への献上品として秘せられた――対照的な二つの名の残り方を、一つの市が抱えている。
    sources:
    - r4-imari-toshi-keikaku
  relations:
  - pref/41
  - muni/41-唐津市
  unknowns:
  - 「伊万里」の語源に確定説はなく、市が挙げる2説はいずれも裏付けの弱い伝承的な説明である
  - 巷間に伝わる「猪の群れがいた里」に由来するという説は、市の公表資料では確認できなかった
  updated: '2026-11-13'
- id: muni/41-佐賀市
  code: '412015'
  names:
    ja: 佐賀市
    reading: さがし
    aliases:
    - 佐嘉
  user_terms:
  - 佐賀市と佐嘉はどう違う
  - 佐賀城下町はいつできた
  - 佐賀市の名前はどこから
  naming_type: その他（佐賀郡・城下町「佐賀」の名を継承して市制を施行）
  prefecture: 佐賀県
  homonyms: []
  summary: 市名は肥前国佐賀郡（古くは佐嘉郡）と、その郡内に育った城下町「佐賀」に由来する。郡名の由来は『肥前国風土記』が伝える「栄の国」伝説と「賢女」伝説が著名だが、いずれも伝承であり、「さが」の語源に定説はない。1889年に佐賀城下町を中心として市制が施行された。
  first_attestation:
    era: 奈良時代（風土記編纂期）
    year_western: null
    document: 肥前国風土記
    note: 「佐嘉郡」の名と由来譚が記録された最古級の資料。風土記自体は713年の編纂命令に基づく
  claims:
  - text: 市名「佐賀」は佐賀郡・城下町の名に由来し、1889年（明治22年）4月1日の市制施行で、佐賀城下町を中心とした佐賀市が誕生した
    kind: fact
    level: E2
    status: established
    sources:
    - f-cap-saga-city-profile
    - f-cap-saga-city-plan
  - text: 『肥前国風土記』佐嘉郡条には、郡名の由来として2つの異なる由緒が併記されている
    kind: fact
    level: E2
    status: established
    sources:
    - f-cap-hizen-fudoki
    - f-saga-city-fudoki
  - text: 風土記の一説では、村に生えた樟（楠）の大木が朝夕の影で隣郡の山々を蔽うほど栄え、日本武尊が「此の国は栄の国と謂うべし」と述べたため栄郡と号し、後に佐嘉郡に改めたと伝える
    kind: legend
    level: E2
    status: established
    sources:
    - f-cap-hizen-fudoki
    - f-saga-city-fudoki
  - text: 風土記のもう一説では、佐嘉川の荒ぶる神を鎮める方策を説いた土蜘蛛の大山田女・狭山田女が「賢女（さかしめ）」と讃えられ、賢女郡と号したものが訛って佐嘉郡になったと伝える
    kind: legend
    level: E2
    status: established
    sources:
    - f-cap-hizen-fudoki
    - f-saga-city-fudoki
  - text: 「さが」の語源については、満潮時に逆流する川にちなむ「逆川」説、傾斜地を指す「坂」説、砂丘地を指す「洲処（すが）」の転訛説などがあり、定説は定まっていない
    kind: fact
    level: E3
    status: contested
    sources:
    - f-saga-city-fudoki
  - text: 表記は古く「佐嘉」が正式で「佐賀」も並行して使われ、明治初年に「佐賀」へ統一されたが、統一の年を1870年とする資料と1872年とする資料がある
    kind: fact
    level: E2
    status: contested
    sources:
    - f-saga-city-fudoki
  - text: 戦国期に龍造寺氏の城下町として発展した佐賀は、1608年（慶長13年）に鍋島直茂が藩主となって佐賀城の総普請が始まり、鍋島氏の城下町として整備された
    kind: fact
    level: E2
    status: established
    sources:
    - f-cap-saga-city-profile
  - text: 現在の市域は、2005年（平成17年）に諸富町・大和町・富士町・三瀬村と、2007年（平成19年）に川副町・東与賀町・久保田町と合併して拡大したもので、1889年の市域は佐賀平野中央部の城下町周辺にとどまっていた
    kind: fact
    level: E2
    status: established
    sources:
    - f-cap-saga-city-plan
  column:
    title: 「佐嘉」と「佐賀」、千年並んだ二つの表記
    text: 佐賀の表記は、奈良時代の『肥前国風土記』以来「佐嘉」が正式とされながら、「佐賀」も古代から並行して使われ続けた。どちらも読みは「さが」で、意味の違いはほとんど意識されないまま千年以上が過ぎ、統一されたのは明治初年のことである（年については1870年説と1872年説がある）。いまもJRの駅は「佐賀駅」だが、佐賀県のゆるキャラ的な話題や老舗の屋号には「佐嘉」の字が残る。表記の統一が遅れた分だけ、古い字のほうにも愛着が残った土地柄といえる。
    sources:
    - f-saga-city-fudoki
  relations:
  - pref/41
  unknowns:
  - 「佐嘉」から「佐賀」への表記統一の正確な年月は資料間で一致せず、本調査では特定できなかった
  - 風土記の2つの由来譚のうち、どちらが実際の郡名成立に近いかは資料上判断できない
  - 「さが」の語源は確定していない
  updated: '2026-11-13'
- id: muni/41-唐津市
  code: '412023'
  names:
    ja: 唐津市
    reading: からつし
    aliases:
    - 唐津町
    - 唐津村
  user_terms:
  - 唐津はなぜ唐津というの
  - 唐津城の城下町
  - 唐津焼と唐津くんちのまち
  - 虹の松原のあるまち
  naming_type: その他（中世以来の港の地名を継承し、藩名にもなったもの）
  prefecture: 佐賀県
  homonyms: []
  summary: 玄界灘に面した港町・城下町で、市名は中世以来の港の名「唐津」による。市の説明では、室町時代に「大陸・半島に渡るみなと（津）」として唐津の地名が生まれたといわれる。文献上の最古の用例は永保3年（1083年）の「辛津（からつ）」で、「唐津」の表記は14世紀後半の文書に現れ、江戸時代に肥前唐津藩の名となって広域の地名になった。昭和7年（1932年）に市制を施行し、平成17年（2005年）に周辺7町村と合併して現在の市域となった。
  first_attestation:
    era: 永保3年
    year_western: 1083
    document: 大宰府安楽寺の草創日記
    note: 「辛津（からつ）」としての最古の用例として唐津市文化事業団が紹介するもの。「唐津」の表記そのものは1368年の有浦文書や1371年の大聖院仏像胎名が早い例とされる
  claims:
  - text: 唐津市の地方公共団体コードは412023である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  - text: 「からつ」という地名の文献上の最古の用例は永保3年（1083年）の大宰府安楽寺の草創日記にみえる「辛津」で、「唐津」と書いたものは有浦文書（1368年）や大聖院の仏像の胎名（1371年）など14世紀後半のものが早いと唐津市文化事業団は説明する
    kind: fact
    level: E2
    status: established
    sources:
    - r4-karatsu-bunka-faq
  - text: 市の市勢要覧は、奈良時代以降「松浦」の呼称を経て、室町時代には「大陸・半島に渡るみなと（津）」として唐津の地名が生まれたといわれていると説明している
    kind: fact
    level: E2
    status: established
    sources:
    - r4-karatsu-shisei-yoran
  - text: 「唐津」が広域の地名として使われるようになったのは江戸時代に肥前唐津藩となってからで、それまでは唐津村という小さな地域の名前だったと唐津市文化事業団は説明する
    kind: fact
    level: E2
    status: established
    sources:
    - r4-karatsu-bunka-faq
  - text: この地方の古い名は中国の史書『魏志倭人伝』にみえる「末盧国」で、奈良時代になると「松浦」という地名がこの地方の呼称として現れた
    kind: fact
    level: E2
    status: established
    sources:
    - r4-karatsu-bunka-faq
    - r4-karatsu-shisei-yoran
  - text: 明治22年（1889年）に唐津に町制が施行され、昭和7年（1932年）1月1日の市制施行により唐津市が発足したと市の市勢要覧は伝える
    kind: fact
    level: E2
    status: established
    sources:
    - r4-karatsu-shisei-yoran
  - text: 平成17年（2005年）1月1日に旧唐津市と浜玉町・厳木町・相知町・北波多村・肥前町・鎮西町・呼子町の7町村が新設合併し、平成18年（2006年）1月1日には七山村を編入して現在の唐津市が誕生した
    kind: fact
    level: E2
    status: established
    sources:
    - r4-karatsu-shisei-yoran
  column:
    title: 「辛津」から「唐津」へ――大陸への窓口の名
    text: 唐津の名の最古の用例は、永保3年（1083年）の記録に残る「辛津」だった。「唐津」と書かれるようになるのは14世紀後半で、当初は港の小さな村の名にすぎなかった。転機は江戸時代、唐津藩の成立である。藩の名となったことで「唐津」は一帯を指す広域地名へと育ち、寺沢広高が築いた唐津城の城下町がその中心になった。大陸・半島に渡る港の名は、藩・町・市と受け継がれ、唐津焼や唐津くんちの名とともに今に残る。
    sources:
    - r4-karatsu-bunka-faq
    - r4-karatsu-shisei-yoran
  relations:
  - pref/41
  - muni/41-伊万里市
  unknowns:
  - 「唐津」の語源を「唐（から）への津（港）」とする説明は市の要覧が「いわれている」と伝えるもので、専門辞典による語源の確定は未確認
  - 「辛津」の比定地や読みの詳細は、文化事業団の解説の範囲を超えては確認できなかった
  updated: '2026-11-13'
- id: muni/41-多久市
  code: '412040'
  names:
    ja: 多久市
    reading: たくし
    aliases:
    - 高来
  user_terms:
  - 多久って何と読む
  - 多久聖廟のある市
  - 文教の里
  naming_type: その他（合併前の五町村に通る中心地名「多久」を継承して市制を施行）
  prefecture: 佐賀県
  homonyms: []
  summary: 市名は多久盆地の中心地名「多久」に由来する。古代には「高来（たく）」と書かれた地名が『和名類聚抄』などに見え、後に「多久」と訓読・表記されるようになったと解されているが、両者の領域比定や語源に定説はない。1954年に北多久町など1町4村が合併して多久市が発足した。江戸時代の領主多久茂文が建てた多久聖廟で「文教の里」として知られる。
  first_attestation:
    era: 平安時代
    year_western: null
    document: 『和名類聚抄』小城郡「高来」郷、『延喜式』の「高来駅」
    note: 「高来」を「多久（たく）」と訓読する比定に基づく初出。表記「多久」そのものは文永3年（1266）の肥前国検注帳案（竜造寺家文書）に見えるのが古い用例とされる
  claims:
  - text: 多久市は1954年（昭和29年）5月1日に、小城郡の北多久町・東多久村・南多久村・多久村・西多久村の1町4村が合併して市制を施行し発足した
    kind: fact
    level: E3
    status: established
    sources:
    - r5-taku-kotobank-chimei
  - text: 『日本歴史地名大系』によれば、『和名類聚抄』には小城郡の郷として「高来」とあり、後に刊本で「多久」と訓読され、近世の多久郷・今日の多久に当たると解されている
    kind: fact
    level: E3
    status: established
    sources:
    - r5-taku-kotobank-chimei
  - text: 『日本歴史地名大系』によれば、表記「多久」は文永3年（1266）の肥前国検注帳案（竜造寺家文書）の裏書に見え、正応5年（1292）の惣田数注文には「高来東郷」「高来西郷」とあるなど、中世には「高来」と「多久」が併用されていた
    kind: fact
    level: E3
    status: established
    sources:
    - r5-taku-kotobank-chimei
  - text: 「高来」と「多久」の相互の関連や領域の比定は史料上あいまいで、『日本歴史地名大系』も確証とすべき史料がないとし、「たく」の語源に定説はない
    kind: fact
    level: E3
    status: indeterminate
    sources:
    - r5-taku-kotobank-chimei
  - text: 「多久」の語源として、カジノキ（栲）の多い土地にちなむという説が伝えられるが、典拠の確かさには留保がつく
    kind: fact
    level: E4
    status: contested
    sources:
    - r5-taku-kotobank-chimei
  - text: 鎌倉時代から戦国時代まで多久氏がこの地を領し、その後龍造寺氏を経て、江戸時代には鍋島氏の一族が新たに多久氏を名のって所領とした
    kind: fact
    level: E3
    status: established
    sources:
    - r5-taku-kotobank-chimei
  - text: 多久市公式サイトによれば、多久家四代の多久茂文が元禄12年（1699）に学問所（後の東原庠舎）を建て、宝永5年（1708）に孔子像を祀る多久聖廟を完成させた
    kind: fact
    level: E2
    status: established
    sources:
    - r5-taku-city-seibyo
  - text: 地方公共団体コードは412040である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 小さな邑に建った孔子廟
    text: 多久は佐賀藩の親類同格とされた多久氏の小さな領地で、財政は苦しかった。それでも四代領主の多久茂文は「領を治めるには教育が大切だ」として学問所を建て、宝永5年（1708）には孔子を祀る聖廟まで完成させた。現存する孔子廟としては足利学校・閑谷学校に次ぐ古さで、国指定重要文化財である。聖廟の天井に描かれた龍（蟠龍）には、あまりの迫力に龍が飛び去るのを恐れて鱗を1枚描き残した、夜な夜な絵から抜け出して池の水を飲むので鱗を1枚はがした、といった言い伝えが市公式の案内にも残る。地名の由来は今も判然としないが、「文教の里」の名はこの聖廟から来ている。
    sources:
    - r5-taku-city-seibyo
    - r5-taku-city-seibyo-map
  relations:
  - pref/41
  unknowns:
  - 「高来」と「多久」の領域比定は史料上確定しておらず、「たく」の語源（栲木説を含む）も定説がない
  - 多久氏の祖・宗直の入部を建久2年（1191）とする話など、中世の経緯には軍記物に拠る伝承の部分が残る
  - 1954年の市制にあたって市名がどのような手続きで決まったかは、市公式資料で確認できなかった
  updated: '2026-11-13'
- id: muni/41-嬉野市
  code: '412091'
  names:
    ja: 嬉野市
    reading: うれしのし
    aliases:
    - 宇礼志野
  user_terms:
  - 嬉野温泉の市
  - うれしの茶
  - 嬉野って何と読む
  naming_type: 合併新設（嬉野町と塩田町の合併。市名は旧嬉野町の地名を継承）
  prefecture: 佐賀県
  homonyms: []
  summary: 市名は旧嬉野町の地名「嬉野」に由来する。「うれしの」の初現は鎌倉時代の「宇礼志野」氏とされ、語源には「末（うれ）し野」説がある一方、神功皇后が「あな、うれしの」と言ったという有名な伝承は、表記が定まった後の類推とされる。2006年に嬉野町と塩田町が合併して嬉野市が発足し、本庁舎は旧塩田町側に置かれた。
  first_attestation:
    era: 鎌倉時代
    year_western: null
    document: 元寇の合戦勲章に見える「宇礼志野」氏の名
    note: 郷土史研究が地名「うれしの」の初現とするもの。本調査では原典そのものは確認できていない
  claims:
  - text: 嬉野市は2006年（平成18年）1月1日に、藤津郡の嬉野町と塩田町が新設合併して発足した
    kind: fact
    level: E2
    status: established
    sources:
    - r5-ureshino-city-masterplan
  - text: 国土交通省の報告書によれば、『肥前国風土記』にはこの地について「東の辺に湯の泉ありて能く人の病を癒す」と記されており、嬉野温泉を指すとされる
    kind: fact
    level: E2
    status: established
    sources:
    - r5-ureshino-mlit-report
  - text: 神功皇后が三韓征伐の帰途に立ち寄り、白鶴が温泉で傷を癒すのを見て兵士を浸からせ、「あな、うれしの」と言ったことから地名になったという伝承がある
    kind: legend
    level: E2
    status: established
    sources:
    - r5-ureshino-mlit-report
  - text: この神功皇后の伝承は、「嬉野」という表記が定まった後に類推されたもので地名の成立とは無関係とされ、発言者を高祖太子や老婆とする異伝も伝えられる
    kind: fact
    level: E5
    status: contested
    sources:
    - r5-ureshino-wikipedia
  - text: 地名「うれしの」の初現は鎌倉時代に元寇の合戦勲章へ見える「宇礼志野」氏とされ、語源は先端を意味する「末（うれ）」に「野」を組み合わせた「末し野」説がある
    kind: fact
    level: E5
    status: contested
    sources:
    - r5-ureshino-wikipedia
  - text: 合併にあたって新市の名称は「嬉野」とする代わりに本庁舎を旧塩田町に置くことが協議の条件とされ、現在の市役所は旧塩田町側にある
    kind: fact
    level: E5
    status: established
    sources:
    - r5-ureshino-wikipedia
  - text: 地方公共団体コードは412091である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 名前は嬉野、本庁は塩田
    text: 2006年の合併は、温泉と茶で名高い嬉野町と、塩田津の町並みで知られる塩田町の対等合併だった。新市の名前は知名度のある「嬉野」に決まったが、その代わり市役所の本庁舎は旧塩田町に置くことが合併の条件になったという。人口の多かった旧嬉野町ではなく旧塩田町に本庁があるのはそのためで、旧塩田町役場が新しく防災面でも有利だったことも後押しした。市名の由来とされる神功皇后の「あな、うれしの」は後世の類推とされるが、名前をめぐる駆け引きのほうは平成の合併協議にしっかり残っている。
    sources:
    - r5-ureshino-wikipedia
  relations:
  - pref/41
  unknowns:
  - 「うれしの」の語源は確定しておらず、「宇礼志野」氏の初出とされる原典は本調査では確認できなかった
  - 合併協議会で市名が正式に決定された過程（公募の有無など）は協議会の一次資料を確認できなかった
  updated: '2026-11-13'
- id: muni/41-小城市
  code: '412082'
  names:
    ja: 小城市
    reading: おぎし
    aliases: []
  user_terms:
  - 小城って何と読む
  - 小城羊羹のまち
  - 小城藩の城下町
  naming_type: 合併新設（小城郡4町の合併。市名は小城町・小城郡の名を継承）
  prefecture: 佐賀県
  homonyms: []
  summary: 市名は古代の小城郡、中世以来の中心地「小城」に由来する。中世には千葉氏が千葉城を築いて城下町をつくり、江戸時代には佐賀藩の支藩・小城藩の城下町となった。2005年に小城町・三日月町・牛津町・芦刈町が合併して小城市が発足した。「小城」という名の語源そのものは専門資料では確認できない。
  first_attestation:
    era: null
    year_western: null
    document: null
    note: 小城郡は古代にさかのぼる郡名だが、本調査では「小城」の初出とされる一次文献を特定できなかった
  claims:
  - text: 小城市は2005年（平成17年）3月1日に、小城郡の小城町・三日月町・牛津町・芦刈町が合併して発足した
    kind: fact
    level: E2
    status: established
    sources:
    - r5-ogi-city-history
  - text: 小城市公式サイトによれば、建久2年（1191）に千葉常胤が小城郡の総地頭職を与えられて以来千葉氏が代々小城を領し、元寇を機に下向した宗胤・胤貞らが千葉城を築いて城下町をつくった
    kind: fact
    level: E2
    status: established
    sources:
    - r5-ogi-city-history
  - text: 元和3年（1617年）に鍋島元茂が小城に所領を得て佐賀藩の支藩・小城藩が成立し、廃藩置県では小城県が置かれた後、伊万里県を経て佐賀県に編入された
    kind: fact
    level: E3
    status: established
    sources:
    - r5-ogi-kotobank-han
  - text: 小城市公式サイトによれば、奈良時代には寺浦廃寺が建立され、その周辺に小城郡を治める郡衙があった可能性があり、「小城」の名は城下町以前の郡名にさかのぼる
    kind: fact
    level: E2
    status: established
    sources:
    - r5-ogi-city-history
  - text: 2005年の合併では新市名が公募され、「小城」「おぎ」「天有」「豊成」「そよかぜ」の最終候補から「小城」が選ばれた
    kind: fact
    level: E5
    status: established
    sources:
    - r5-ogi-uub-hensen
  - text: 地方公共団体コードは412082である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 「桜城」でも「大城」でもなく「小城」
    text: 2005年の合併で新市名を公募したところ、上位には「小城」「おぎ」のほか、「桜城（おうじょう）」「大城（おおしろ）」「天山」「西佐賀」などが並んだ。候補は13点に絞られ、最終候補は「小城」「おぎ」「天有」「豊成」「そよかぜ」の5点。選ばれたのは、郡名・町名として千年近く続いてきた「小城」そのものだった。なお合併協議の過程では隣の多久市も参加を申し入れたが、4町での枠組みが優先されて見送られている。「小」を「大」に変える案もあった中で、あえて「小城」のまま市になった点に、この地名への愛着がうかがえる。
    sources:
    - r5-ogi-uub-hensen
  relations:
  - pref/41
  - muni/41-多久市
  unknowns:
  - 「小城」という地名の語源（小さな城郭にちなむのか等）は、専門辞典・市公式資料では確認できなかった
  - 小城郡の名の初出とされる一次文献は本調査では特定できなかった
  updated: '2026-11-13'
- id: muni/41-武雄市
  code: '412066'
  names:
    ja: 武雄市
    reading: たけおし
    aliases:
    - 武雄宮
  user_terms:
  - 武雄温泉の市
  - たけおって何と読む
  - 御船山と武雄図書館
  naming_type: その他（武雄神社の社名に由来する地名を継承して市制を施行）
  prefecture: 佐賀県
  homonyms: []
  summary: 市名の起源は御船山東麓の武雄神社にある。天暦5年（951）の四至実検状に「肥前国杵嶋西郷武雄宮」と見える古い社名だが、地名として一般に「武雄」と呼ばれたのは江戸時代中期以後とされる。1954年に武雄町など1町6村が合併して市制を施行し、2006年に山内町・北方町と合併して現在の武雄市となった。
  first_attestation:
    era: 天暦5年
    year_western: 951
    document: 四至実検状（武雄神社文書）
    note: 「肥前国杵嶋西郷武雄宮」と神社名の形で現れる初出。地名としての普及は江戸時代中期以後とされる
  claims:
  - text: 『日本歴史地名大系』によれば、市名の起源は武雄神社から名付けられたもので、同神社の創祀は10世紀で、その社域は「武雄の内」と呼ばれたと伝えられる
    kind: fact
    level: E3
    status: established
    sources:
    - r5-takeo-kotobank-chimei
  - text: 『日本歴史地名大系』によれば、天暦5年（951）の四至実検状（武雄神社文書）には「肥前国杵嶋西郷武雄宮」とあるが、一般に地名として「武雄」と呼ばれたのは江戸時代中期以後である
    kind: fact
    level: E3
    status: established
    sources:
    - r5-takeo-kotobank-chimei
  - text: 武雄市公式資料によれば、武雄神社は武内宿禰を主祭神とし、四至実検状（951年）を含む武雄神社文書は国の重要文化財に指定されている
    kind: fact
    level: E2
    status: established
    sources:
    - r5-takeo-city-kenbunroku
  - text: 武雄神社の鎮座する御船山は、神功皇后が三韓征伐の帰途に兵船を止め、それが山と化したものと伝えられる
    kind: legend
    level: E4
    status: established
    sources:
    - r5-takeo-jinja-kyushu
  - text: 『肥前国風土記』の杵島郡の項には湯泉の記事があり、武雄温泉の歴史は奈良時代にさかのぼる
    kind: fact
    level: E3
    status: established
    sources:
    - r5-takeo-kotobank-chimei
  - text: 武雄温泉については、神功皇后が太刀の柄で岩を突いたところ清水が湧き出たという伝説が伝えられる
    kind: legend
    level: E2
    status: established
    sources:
    - r5-takeo-city-kenbunroku
  - text: 武雄市は1954年（昭和29年）4月に武雄町・朝日村・若木村・武内村・西川登村・東川登村・橘村が合併して発足し、2006年（平成18年）3月1日に山内町・北方町と新設合併した
    kind: fact
    level: E2
    status: established
    sources:
    - r5-takeo-city-gikai
  - text: 地方公共団体コードは412066である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 宮の名前が、町の名前になった
    text: 「武雄」はもともと土地の名前ではなく、神社の名前だった。天暦5年（951）の文書にはすでに「武雄宮」とあるのに、あたり一帯が「武雄」と呼ばれるようになったのは江戸時代も半ばを過ぎてからだという。主祭神の武内宿禰をはじめ五柱を「武雄大明神」として祀る社の名が、温泉の町全体の名へと広がっていった。神社の背後の御船山には、神功皇后の兵船がそのまま山になったという伝説まである。1954年に市制を施行したときも、合併した1町6村の新しい市の名には、この社の名がそのまま選ばれた。
    sources:
    - r5-takeo-kotobank-chimei
    - r5-takeo-jinja-kyushu
  relations:
  - pref/41
  unknowns:
  - 社名「武雄」が武内宿禰の名に直接ちなむ命名かどうかは、専門辞典では明言されておらず確認できなかった
  - 江戸時代中期に地名として広がった具体的な経緯は資料で追えなかった
  updated: '2026-11-13'
- id: muni/41-神埼市
  code: '412104'
  names:
    ja: 神埼市
    reading: かんざきし
    aliases:
    - 神崎
  user_terms:
  - 吉野ヶ里遺跡のある市
  - 神埼そうめん
  - かんざきって何と読む
  naming_type: 合併新設（神埼町・千代田町・脊振村の合併。市名は神埼町・神埼郡の名を継承）
  prefecture: 佐賀県
  homonyms: []
  summary: 市名は古代の神埼郡と中心地・神埼ヶ里に由来する。養老年間の平城宮跡出土木簡にすでに「肥前国神埼郡」とあり、『肥前国風土記』は景行天皇が荒神を鎮めたことに郡名を結びつける伝承を伝える。中世は「神崎」とも書かれたが江戸時代に「神埼」に統一された。2006年に神埼町・千代田町・脊振村が合併して神埼市が発足した。
  first_attestation:
    era: 養老年間
    year_western: null
    document: 平城宮跡出土木簡
    note: 「肥前国神埼郡調綿壱伯屯四両、養老□□」とあり、養老年間（717〜724）の用例は『肥前国風土記』の成立より古いと判断される
  claims:
  - text: 『日本歴史地名大系』によれば、神埼の地名は神埼ヶ里（現神埼町神埼）に発し、平城宮跡出土の木簡に「肥前国神埼郡」と養老年間の記載が確認され、『和名類聚抄』には「加無佐岐」と読む神埼の名が見える
    kind: fact
    level: E3
    status: established
    sources:
    - r5-kanzaki-kotobank-gun
  - text: 『肥前国風土記』は、景行天皇が西国巡幸の際にこの地の荒神を鎮めて神幸を得たので神埼郡と呼ぶようになったという伝承を伝え、その荒神を祀ったのが櫛田宮であるとされる
    kind: legend
    level: E3
    status: established
    sources:
    - r5-kanzaki-kotobank-gun
  - text: 『神埼町史』には、6世紀初頭の磐井の乱の頃に置かれた継体天皇の神幸（かんさき）皇女の名代・神幸屯倉に郡名が起因すると推測する別説がある
    kind: fact
    level: E3
    status: contested
    sources:
    - r5-kanzaki-kotobank-gun
  - text: 『日本歴史地名大系』によれば、中世の古文書では「神崎」と書かれることが多かったが、江戸時代の古文書ではいずれも「神埼」の表記になっている
    kind: fact
    level: E3
    status: established
    sources:
    - r5-kanzaki-kotobank-gun
  - text: 神埼市は2006年（平成18年）3月20日に、神埼町・千代田町・脊振村が合併して発足した
    kind: fact
    level: E3
    status: established
    sources:
    - r5-kanzaki-kotobank-shi
  - text: 合併時の新市名の最終候補は「神埼」「城原（じょうばる）」「東佐賀（ひがしさが）」の3点で、「神埼」が選ばれた
    kind: fact
    level: E5
    status: established
    sources:
    - r5-kanzaki-uub-hensen
  - text: 市域の東部から隣の吉野ヶ里町にまたがって弥生時代の大環濠集落である吉野ヶ里遺跡がある
    kind: fact
    level: E3
    status: established
    sources:
    - r5-kanzaki-kotobank-shi
  - text: 地方公共団体コードは412104である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 「神崎」が「神埼」になった
    text: 同じ「かんざき」でも、字は揺れてきた。中世の古文書では「神崎」と書かれることが多く、江戸時代になると「神埼」にそろっていく。いま全国の「かんざき」といえば兵庫県神崎郡の「神崎」が目立つが、佐賀のこちらは「埼」の字で定着した。2006年の合併では新市名の最終候補に「城原（じょうばる）」や「東佐賀」も残ったが、養老年間の木簡にまでさかのぼる「神埼」の名が、そのまま市の名に選ばれた。
    sources:
    - r5-kanzaki-kotobank-gun
    - r5-kanzaki-uub-hensen
  relations:
  - pref/41
  unknowns:
  - 郡名「神埼」の語源は、風土記の伝承と神幸屯倉説が併存し確定していない
  - 『肥前国風土記』の神埼郡条の原文そのものは本調査では確認していない（専門辞典の紹介による）
  updated: '2026-11-13'
- id: muni/41-鳥栖市
  code: '412031'
  names:
    ja: 鳥栖市
    reading: とすし
    aliases:
    - 鳥樔
  user_terms:
  - サガン鳥栖の市
  - 鳥栖ジャンクション
  - とすって何と読む
  naming_type: その他（古代の鳥樔郷にさかのぼる中心地名「鳥栖」を継承して市制を施行）
  prefecture: 佐賀県
  homonyms: []
  summary: 市名は古代の「鳥樔（とす）郷」に由来する。市統計書によれば『肥前国風土記』は、鳥屋が鳥を飼って天皇に献上したことから鳥樔郷と呼ばれたと伝え、後に表記が「鳥栖」に改められた。1954年に鳥栖町など5町村が合併して鳥栖市が発足した。現在は高速道路と鉄道が交わる九州の交通の要衝である。
  first_attestation:
    era: 奈良時代（風土記編纂期）
    year_western: null
    document: 『肥前国風土記』基肄郡「鳥樔郷」
    note: 現行表記「鳥栖」の前身「鳥樔」での初出。風土記は713年の編纂命令に基づく
  claims:
  - text: 鳥栖市統計書によれば、『肥前国風土記』は基肄郡のこの地方について、応神天皇のころ鳥屋があってさまざまな鳥を飼育し天皇に献上したことから「鳥樔郷」といったと伝える
    kind: legend
    level: E2
    status: established
    sources:
    - r5-tosu-city-tokeisho
  - text: 「鳥樔」の表記は後に「鳥栖」に改められ、読み「とす」はそのまま受け継がれた
    kind: fact
    level: E2
    status: established
    sources:
    - r5-tosu-city-tokeisho
  - text: 鳥栖市統計書によれば、明治40年（1907）に轟木町が「鳥栖町」と改称し、昭和29年（1954）4月1日に鳥栖町・田代町・基里村・麓村・旭村の5町村が合併して鳥栖市が発足した
    kind: fact
    level: E2
    status: established
    sources:
    - r5-tosu-city-tokeisho
  - text: 風土記のいう「鳥樔」は鳥の巣・鳥の棲む所を意味し、「鳥の栖」という地名の性格はこの古い表記に表れている
    kind: fact
    level: E2
    status: established
    sources:
    - r5-tosu-city-tokeisho
  - text: 地方公共団体コードは412031である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 「鳥樔」が「鳥栖」になるまで
    text: いまの「鳥栖」の字は、もとは「鳥樔」と書いた。「樔」は鳥の巣のことで、風土記は鳥を飼って天皇に献上する「鳥屋」がいたことに地名を結びつけている。後に巣の字は「栖」（すみか）に置き換わり、意味はほぼそのままに「鳥栖」となった。読みにくい地名の代表のように言われる「とす」だが、由来は意外なほど素直である。市制から70年を経たいま、この名は鳥栖駅・鳥栖ジャンクションの交通の要衝として、またJリーグ「サガン鳥栖」の名として、県外にも広く知られるようになった。
    sources:
    - r5-tosu-city-tokeisho
  relations:
  - pref/41
  unknowns:
  - 「鳥樔」から「鳥栖」への改字がいつ行われたかは、市統計書には明記されておらず確認できなかった
  - 風土記の鳥樔郷が現在の鳥栖市域のどの範囲に当たるかは資料で特定できなかった
  updated: '2026-11-13'
- id: muni/41-鹿島市
  code: '412074'
  names:
    ja: 鹿島市
    reading: かしまし
    aliases: []
  user_terms:
  - 祐徳稲荷のある市
  - 鹿島と鹿嶋はどう違う
  - ガタリンピックの市
  naming_type: その他（合併で発足。市名は中心地・鹿島町の名を継承）
  prefecture: 佐賀県
  homonyms: []
  summary: 市名は中心地「鹿島」に由来し、平安時代には仁和寺の荘園の中心としてその名が見える。江戸時代には佐賀藩の支藩・鹿島藩の城下町となった。1954年に鹿島町・浜町・鹿島村・能古見村・古枝村が合併して鹿島市が発足した。読みが同じ茨城県鹿嶋市とは表記も由来も異なる別自治体である。
  first_attestation:
    era: null
    year_western: null
    document: null
    note: 平安時代初め頃には仁和寺荘園の中心として「鹿島」の名が成立していたと市公式資料が伝えるが、初出の一次文献は特定できなかった
  claims:
  - text: 鹿島市公式資料によれば、平安時代の初め頃、鹿島を中心とする藤津郡一帯は京都の仁和寺の荘園となっており、「鹿島」の名はその頃には成立していた
    kind: fact
    level: E2
    status: established
    sources:
    - r5-kashima-city-fuchi
  - text: 鹿島市は1954年（昭和29年）に鹿島町・浜町・鹿島村・能古見村・古枝村の5町村が合併して発足し、1955年（昭和30年）に七浦村の大半を編入した
    kind: fact
    level: E2
    status: established
    sources:
    - r5-kashima-city-fuchi
  - text: 江戸時代、この地には佐賀藩の支藩である鹿島藩が置かれ、鹿島はその城下町として栄えた
    kind: fact
    level: E2
    status: established
    sources:
    - r5-kashima-city-fuchi
  - text: 鹿島市公式資料によれば、祐徳稲荷神社は貞享4年（1687）に鹿島藩主・鍋島直朝の夫人萬子が京都から勧請した稲荷大神の分霊を祀ったことに始まる
    kind: fact
    level: E2
    status: established
    sources:
    - r5-kashima-city-fuchi
  - text: 読みは同じ「かしま」でも、総務省の地方公共団体コード一覧では佐賀県の「鹿島市」と茨城県の「鹿嶋市」が別自治体として区別されており、両者は同名地名ではない
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  - text: 地方公共団体コードは412074である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 鹿島と鹿嶋、同じ読みの二つの市
    text: 「かしまし」は全国に2つある。佐賀県の鹿島市と、茨城県の鹿嶋市。読みは同じでも字が違い、あちらは「嶋」の旧字を使う。茨城の鹿嶋は鹿島神宮の門前町として育った古い地名で、佐賀の鹿島とは成り立ちがまったく異なる。佐賀側の鹿島は藤津郡の荘園の中心として平安時代に名が現れ、江戸時代には佐賀藩支藩の城下町になった。同名地名の横断調査でも紛らわしい筆頭だが、正式には「同名」ではなく「同音異字」の近似例として区別される。
    sources:
    - r5-kashima-city-fuchi
    - b-cap-chiba-soumu-code
  relations:
  - pref/41
  unknowns:
  - 「鹿島」の語源（鹿島神の信仰との関係や、島状の地形にちなむ説など）は専門資料で確認できなかった
  - 「鹿島」の初出とされる一次文献は本調査では特定できなかった
  updated: '2026-11-13'
