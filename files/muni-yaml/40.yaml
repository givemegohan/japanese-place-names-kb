  claims:
  - text: 行橋市の地方公共団体コードは402133である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  - text: 『行橋市史』によれば、「行橋」という地名は明治22年（1889年）の町村合併で長峡川に向き合う行事・大橋・宮市の3村が合併した際、行事と大橋から1字ずつを取って生まれた。行橋市のキッズページも、行事村の「行」と大橋村の「橋」から取った合成地名と説明している
    kind: fact
    level: E2
    status: established
    sources:
    - r3-yukuhashi-shishi
    - r3-yukuhashi-kids
  - text: 行事と大橋は古くからこの地域の商業の中心地で、明治11年（1878年）の市域人口22,557人のうち4,562人が両地区に集中していたと『行橋市史』は記す
    kind: fact
    level: E2
    status: established
    sources:
    - r3-yukuhashi-shishi
  - text: 古代の律令制下で、現在の行橋市域は豊前国に属し、西側が京都郡、東側が仲津郡にあたったと市公式は説明する
    kind: fact
