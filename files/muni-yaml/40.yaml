  user_terms:
  - なかまし
  - 長津から改名した市
  - 堀川と遠賀川のまち
  - 北九州のベッドタウン
  naming_type: 中心地名の継承
  formation: 合併新設
  prefecture: 福岡県
  homonyms: []
  summary: 福岡県北部、遠賀川中流の市。1889年に岩瀬村と中間村が合併して長津村となったが、「長津」の名は住民に浸透せず、もとの村名である「中間」の通称が広く使われたため、1924年に中間町へ改称した。1958年11月1日に市制を施行して中間市となった。江戸時代には遠賀川から洞海湾へ通す運河・堀川の起点となり、明治末からは筑豊炭田の炭坑のまちとして栄えた。
  first_attestation:
    era: 江戸時代
    year_western: null
    document: null
    note: 「中間」は近世の村名（中間村）に遡るが、文献上の初出は未確認である。1889年の合併でいったん長津村を構成する村名となり、1924年に自治体の正式名として復活した
  claims:
  - text: 中間市の地方公共団体コードは402150である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  - text: 1889年（明治22年）、遠賀郡岩瀬村と中間村が合併して遠賀郡長津村が誕生した
    kind: fact
    level: E2
    status: established
    sources:
    - r3-nakama-kobunsyokan
  - text: 村名「長津」は、斉明天皇が磐瀬にあった磐瀬行宮を「長津宮」と改称したことに由来するといわれていたが、郷土史家らの研究によって磐瀬は別の場所であることが明らかになり、「長津」の名称は住民にあまり浸透せず「中間」の通称が広く用いられていたと、福岡共同公文書館は伝える
    kind: fact
    level: E2
    status: contested
    sources:
    - r3-nakama-kobunsyokan
  - text: 1922年（大正11年）11月に町制を施行して長津町となり、1924年3月に長津町から中間町への改称の認可申請が町会で満場一致で可決され、同年9月1日に中間町と改称した
    kind: fact
    level: E2
    status: established
    sources:
    - r3-nakama-kobunsyokan
    - r3-nakama-yoran
  - text: 1932年（昭和7年）3月1日に遠賀郡底井野村を編入し、1958年（昭和33年）11月1日に市制を施行して中間市が誕生した
    kind: fact
    level: E2
    status: established
    sources:
    - r3-nakama-kobunsyokan
    - r3-nakama-yoran
  - text: 江戸時代初め、遠賀川の洪水対策と物資輸送のため、中間から洞海湾へ通す運河「堀川」の開削が1621年に着工され、黒田長政の死去などで中断を経て、1762年に中間唐戸（水門）が完成した
    kind: fact
    level: E2
    status: established
    sources:
    - r3-nakama-kobunsyokan
    - r3-nakama-yoran
  - text: 明治末期から昭和初期にかけてこの地で石炭が開発され、中間は炭坑のまちとして筑豊炭田の一翼を担い、人口は明治末の約4,800人から昭和34年（1959年）には約46,000人にまで増えた
    kind: fact
    level: E2
    status: established
    sources:
    - r3-nakama-kobunsyokan
  - text: 市の中央を遠賀川が南北に流れ、市域は通称「川東」と「川西」に分かれている
    kind: fact
    level: E2
    status: established
    sources:
    - r3-nakama-kobunsyokan
  column:
    title: 35年で捨てられた「長津」、残った通称「中間」
    text: 1889年に生まれた村の名は「長津」。斉明天皇ゆかりの由緒ある名前のはずだったが、根拠とされた磐瀬行宮は別の場所のものと分かり、住民の口にもなじまなかった。人々がふだん使っていたのは、もとの村の名「中間」のほうだった。1924年、町会は満場一致で改称を決め、35年間使った「長津」を捨てて、通称を正式な名にした。地名とは公文書が決めるものであると同時に、人々の呼び方が決めるものでもある、という好例である。
    sources:
    - r3-nakama-kobunsyokan
  relations:
  - pref/40
  unknowns:
  - 村名「中間」自体の語源は確認できなかった。遠賀川と堀川の「中間」に位置することに由来するという地形説が語られることがあるが、確認した公的資料（市勢要覧・福岡共同公文書館）ではその裏付けは取れなかった。なお堀川は中間を起点として開削されており、「中間」の地名は運河より古い層に属する
  - 中間村の名の文献上の初出は確認できなかった
  updated: '2026-11-13'
- id: muni/40-久山町
  code: '403482'
  names:
    ja: 久山町
    reading: ひさやままち
    aliases:
    - 久原村
    - 山田村
  user_terms:
  - ひさやままち
  - 久山町研究の町
  - ひさやま方式の町
  naming_type: 合成地名
  formation: 合併新設
  prefecture: 福岡県
  homonyms: []
  summary: 福岡県中部、糟屋郡の町で、読みは「ひさやままち」。1956年9月30日に久原村と山田村が合併して発足した。町名は久原の「久」と山田の「山」を合わせた合成地名である。1961年から続く九州大学との疫学研究「久山町研究」の町として世界的に知られる。
  first_attestation:
    era: 昭和時代
    year_western: 1956
    document: 久原村・山田村の合併による新町名「久山町」
    note: 2村の頭文字を合わせた合成地名として1956年に生まれた
  claims:
  - text: 1956年（昭和31年）9月30日、久原村と山田村が合併して久山町が発足した
    kind: fact
    level: E2
    status: established
    sources:
    - r3-hisayama-geoshape
    - r3-hisayama-wiki
  - text: 町名は、久原村の「久」と山田村の「山」の頭文字を合わせた合成地名である
    kind: fact
    level: E4
    status: established
    sources:
    - upg-af6-uub-gousei
    - upg-p8-hisayama-gaiyo
  - text: 久原村は1889年（明治22年）に単独で村制を施行し、山田村は同年に山田村と猪野村の合併によって成立した
    kind: fact
    level: E2
    status: established
    sources:
    - upg-p8-hisayama-gaiyo
  - text: 旧村名は、現在の大字である久原・山田（猪野を含む）に地名として残っている
    kind: fact
    level: E2
    status: established
    sources:
    - upg-p8-hisayama-gaiyo
  - text: 1961年（昭和36年）から、行政・町内開業医・九州大学久山町研究室が連携した健診事業が60年以上続いており、「ひさやま方式」として知られる疫学研究（久山町研究）の町である
    kind: fact
    level: E2
    status: established
    sources:
    - r3-hisayama-town-plan
  - text: 総務省の地方公共団体コードは403482で、町の読みは「ひさやままち」である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 二文字の合成地名と「ひさやま方式」
    text: 久山町の名前は、久原と山田、合併した二つの村から一字ずつ取った合成地名である。その名が世界に知られるようになったのは地名の由来とは別のところにある。1961年に始まった住民健診と九州大学の追跡研究は「久山町研究」と呼ばれ、脳卒中や心血管病の疫学に大きな成果を残した。合成地名という無難な命名が、医学の分野で固有名詞として通用する町になった。
    sources:
    - r3-hisayama-town-plan
    - r3-hisayama-wiki
  relations:
  - pref/40
  unknowns:
  - 合成地名としての命名を決めた当時の協議記録（町史等）は未確認
  updated: '2026-11-13'
- id: muni/40-久留米市
  code: '402036'
  names:
    ja: 久留米市
    reading: くるめし
    aliases:
    - 久留目
  user_terms:
  - 久留米の名前の由来
  - 久留米藩と有馬氏
  - クルメクって何
  - 久留米市はいつできたの
  naming_type: 中心地名の継承
  naming_note: 城下町・郡の名「久留米」を継承して市制を施行
  formation: 単独発足
  prefecture: 福岡県
  homonyms: []
  summary: 市名は、筑後国府の置かれた地に育ち、有馬氏21万石の城下町となった「久留米」の名をそのまま継いだもの。地名の確実な用例は室町時代に遡るが、語源については玖留目神説・機織りの工人に由来する説・来目皇子説・筑後川の蛇行をいう「クルメク」説などが併記され、定説はない。
  first_attestation:
    era: 応永25年
    year_western: 1418
    document: 報恩寺寺領坪付注文
    note: 「久留目屋敷」という表記での用例。『日本歴史地名大系』が隈家文書（『久留米市史7 資料編古代・中世』所収）として紹介する
  claims:
  - text: 1889年（明治22年）4月1日、市制施行により久留米市が誕生した。当時の人口は24,750人で、福岡市とともに福岡県で最初の市の一つであった（地方公共団体コードは402036）
    kind: fact
    level: E2
    status: established
    sources:
    - k6-kurume-city-history
    - b-cap-chiba-soumu-code
  - text: 古代には筑後国府がこの地に置かれ、北部九州の行政・交通の要衝として栄えたと久留米市は説明する
    kind: fact
    level: E2
    status: established
    sources:
    - k6-kurume-city-history
  - text: 江戸時代には有馬氏が丹波国福知山から入部し（1621年）、明治まで11代の城主が治める21万石の城下町となった
    kind: fact
    level: E2
    status: established
    sources:
    - k6-kurume-city-history
  - text: 「久留米」は南北朝期から文献に見える地名で、応永25年（1418年）の報恩寺寺領坪付注文（隈家文書）の畠地坪付には「久留目屋敷」と記されている
    kind: fact
    level: E3
    status: established
    sources:
    - upg-p6-kurume-kotobank
  - text: 語源には、天慶7年（944年）の「筑後国神名帳」にみえる「玖留目神」に由来するとする説、大陸から渡来した機織りの工人の「呉姫（くれひめ）」「繰女（くりめ）」が転訛したとする説、用明天皇の皇子・来目皇子に由来する説、筑後川の大きな蛇行を意味する「クルメク（転く）」を語源とする説などがあり、定説はない
    kind: fact
    level: E5
    status: contested
    sources:
    - k6-kurume-wikipedia
  - text: 2005年（平成17年）2月に田主丸町・北野町・城島町・三潴町の4町を編入して市域が拡大し、2008年（平成20年）4月には九州では県庁所在地以外で唯一の中核市となった
    kind: fact
    level: E2
    status: established
    sources:
    - k6-kurume-city-bunkazai
  column:
    title: 市制の年に襲った大洪水——筑後川との戦いの始まり
    text: 久留米市が生まれた1889年、その年の7月に筑後川が氾濫し、流域は泥土と化して流失家屋は1,262戸に及んだと記録にある。市はこの後も大正10年、昭和28年と大洪水に見舞われ続けた。久留米市自身が「本市の歴史は、筑後川との戦いの歴史であったということができます」と書くほどで、城下町の繁栄も軍都の発展も、つねにこの大河の恵みと脅威の裏表だった。
    sources:
    - k6-kurume-city-history
  relations:
  - pref/40
  unknowns:
  - 語源諸説は、現時点ではWikipediaの整理に依拠しており、『筑後国神名帳』の原典や角川日本地名大辞典での直接確認が未了（1418年の用例は『日本歴史地名大系』で確認済み）
  - 筑後国府の所在地が現在の市街地とどう重なるか（位置のずれ）の精密な検討は未了
  updated: '2026-11-13'
- id: muni/40-八女市
  code: '402109'
  names:
    ja: 八女市
    reading: やめし
    aliases:
    - 福島町
    - 福島市（発足直前に県へ提出された市名）
    - 筑後福島市（計画段階の候補名）
  user_terms:
  - 八女茶のまち
  - 八女津媛のふるさと
  - 幻の福島市
  - 白壁の町並み・福島
  - やめし
  naming_type: 文献・故事から命名
  formation: 編入合併
  prefecture: 福岡県
  homonyms: []
  summary: 福岡県南部、矢部川流域の市で、八女茶や手すき和紙・仏壇などの伝統工芸で知られる。地名「八女」は『日本書紀』が伝える女神・八女津媛に由来するといわれ、1896年に八女郡の名として行政区画に採用された。1954年の市制では当初「福島市」として県へ書類が提出され、「筑後福島市」案を経て、最終的に郡名の「八女市」として発足した。2006年に上陽町、2010年に黒木町・立花町・星野村・矢部村を編入して現在の市域となった。
  first_attestation:
    era: 景行天皇18年（『日本書紀』の編年）
    year_western: null
    document: 『日本書紀』
    note: 景行天皇の筑紫巡行の記事の中に女神「八女津媛」の名が見える。書紀の編年上の年次であり実年代を示すものではない。市公式が地名の由来として引く最古の文献である
  claims:
  - text: 八女市の地方公共団体コードは402109である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  - text: 八女市公式は、地名の由来として『日本書紀』の「この地方に女神あり、その名を八女津媛といい、常に山中にある」という一節を紹介している
    kind: fact
    level: E2
    status: established
    sources:
    - r3-yame-ayumi
    - r3-yame-kobunsyokan
  - text: 市域の矢部地区（北矢部）には、女神・八女津媛を祀る八女津媛神社が鎮座する
    kind: fact
    level: E2
    status: established
    sources:
    - r3-yame-jinja
  - text: 1896年（明治29年）に福島町を中心として八女郡が形成され、「八女」が行政区画の名として採用された
    kind: fact
    level: E2
    status: established
    sources:
    - r3-yame-ayumi
  - text: 近世の中心地は福島で、福島町は八女地方の物産集積地として栄え、福島城の城下に由来する白壁の町並みが現在の市中心部に残る
    kind: fact
    level: E2
    status: established
    sources:
    - r3-yame-ayumi
    - r3-yame-kanko
  - text: 1954年4月1日、福島町に川崎村・忠見村・岡山村の一部が編入して市制を施行し、八女市が誕生した（市制施行時の人口は41,240人）
    kind: fact
    level: E2
    status: established
    sources:
    - r3-yame-ayumi
    - r3-yame-kobunsyokan
  - text: 市名は当初「福島市」として1954年3月12日付で県に提出されたが、福島県の福島市と同名になるため「筑後福島市」に改められた後、隣接する羽犬塚町ほかが「筑後市」として発足することや字画が多すぎるといった意見を受けて再検討され、旧福島町住民の反対を説得の上で最終的に「八女市」に決定したと、福岡共同公文書館は県の公文書に基づいて伝える
    kind: fact
    level: E2
    status: established
    sources:
    - r3-yame-kobunsyokan
  - text: 自治体の変遷記録では、1954年4月1日にいったん「福島市」として市制が施行され、同日付の市名変更条例（条例第5号）と総理府告示第385号によって「八女市」へ名称変更された形で記録されている
    kind: fact
    level: E4
    status: contested
    sources:
    - r3-yame-uub-detail
  - text: 2006年10月1日に上陽町を編入し、2010年2月1日に黒木町・立花町・星野村・矢部村を編入合併した
    kind: fact
    level: E2
    status: established
    sources:
    - r3-yame-ayumi
  column:
    title: 幻の「福島市」と「筑後福島市」
    text: 1954年の市制を前に、八女の新しい市の名前は二転三転した。最初は中心地の名を取った「福島市」。しかし福島県に同名の市がある。そこで「筑後福島市」としたものの、今度は隣の羽犬塚町などが「筑後市」を名乗ることになり、字画も多すぎると再検討になった。旧福島町の住民からは反対も出たが、説得の末に決まったのが、女神の名に由来する郡名「八女」だった。告示の上では「福島市」が一日だけ存在したことになる、日本でも珍しい同名回避の顛末である。
    sources:
    - r3-yame-kobunsyokan
    - r3-yame-uub-detail
  relations:
  - pref/40
  unknowns:
  - 『日本書紀』の八女津媛の記事が現在の八女市域を指すという比定の根拠は、市公式の解説では示されていない
  - 「八女」という語そのものの語源（女神の名が先か、地名が先か）は確定していない
  updated: '2026-11-13'
- id: muni/40-北九州市
  code: '401005'
  names:
    ja: 北九州市
    reading: きたきゅうしゅうし
    aliases: []
  user_terms:
  - 北九州市はどうやってできたの
  - 西京市って何
  - 門司 小倉 八幡の合併
  - 九州で最初の100万都市
  naming_type: 旧国名・広域地名の採用
  formation: 合併新設
  prefecture: 福岡県
  homonyms: []
  summary: 1963年2月10日、門司・小倉・若松・八幡・戸畑の5市が対等合併して誕生した市で、市名は全国公募を経て「北九州市」に決まった。公募の最多票は「西京市」だったが、合併促進協議会が「呼び慣れていて身近に感じる」として、次点の「北九州市」を選んだという経緯が残る。
  first_attestation:
    era: 昭和37年
    year_western: 1962
    document: 新市名の全国公募と北九州五市合併促進協議会による「北九州」の決定
    note: 市名としての成立。翌1963年2月10日に市が発足した。「北九州」という地域名自体は、合併前から五市一帯を指す呼び名として定着していた
  claims:
  - text: 1963年（昭和38年）2月10日、門司市・小倉市・若松市・八幡市・戸畑市の5市が対等合併して北九州市が誕生し、九州初の100万都市となった（地方公共団体コードは401005）
    kind: fact
    level: E2
    status: established
    sources:
    - k6-kitakyushu-city-pr
    - b-cap-chiba-soumu-code
  - text: 新市名は全国に募集され、約13万7,000通の応募があった。最多は「西京市」の約1万2,100通で、「北九州市」は約6,600通で次点だったと北九州市政だよりは伝える
    kind: fact
    level: E2
    status: established
    sources:
    - k6-kitakyushu-city-pr
  - text: 最終的には北九州五市合併促進協議会で、「呼び慣れていて、身近に感じる」などの理由から「北九州市」に決まった
    kind: fact
    level: E2
    status: established
    sources:
    - k6-kitakyushu-city-pr
  - text: 国立国会図書館のレファレンス事例によれば、公募は1962年（昭和37年）4月1日から5月10日まで行われ、応募総数137,142通・市名の種類は19,292種に上り、同年6月10日に「北九州」と決定したと当日の夕刊が報じた
    kind: fact
    level: E2
    status: established
    sources:
    - k6-kitakyushu-ndl-crd
  - text: 合併前の五市一帯はすでに「北九州」と呼ばれており、その呼び慣れた広域地名が新しい市の名として採用された
    kind: fact
    level: E2
    status: established
    sources:
    - k6-kitakyushu-city-pr
  - text: 旧5市の区域は現在の門司区・小倉北区・小倉南区・若松区・八幡東区・八幡西区・戸畑区の7区のおおむねのもとになっており、北九州市は政令指定都市である
    kind: fact
    level: E2
    status: established
    sources:
    - k6-kitakyushu-city-pr
    - b-cap-chiba-soumu-code
  column:
    title: 公募1位は「西京市」だった
    text: 新しい市の名前を全国から募ったところ、集まったのは約13万7,000通。いちばん多かったのは「西京市」で、「北九州市」はその半分ほどしかなかった。それでも最終的に選ばれたのは「北九州市」だった。合併協議会の理由は「呼び慣れていて、身近に感じる」から。応募作の中には「八小門若戸」「19635」「NKC」のような珍名も並んでいたと『北九州五市合併の記録』は伝える。人気投票ではなく「日常の呼び名」を採った判断が、そのまま定着した市名を決めた。
    sources:
    - k6-kitakyushu-city-pr
    - k6-kitakyushu-ndl-crd
  relations:
  - pref/40
  unknowns:
  - 「北九州」という広域地名がいつ頃から五市一帯を指して使われ始めたか（北九州工業地帯の呼称の定着過程）は、確認できなかった
  - 政令指定都市への移行日（1963年4月1日とされる）については、市の公式年表での直接確認が未了のため主張に含めていない
  updated: '2026-11-13'
- id: muni/40-古賀市
  code: '402231'
  names:
    ja: 古賀市
    reading: こがし
    aliases:
    - 席内
  user_terms:
  - 古賀市の名前の由来
  - 駅の名前が町名になった市
  - むしろうちが古賀になった理由
  naming_type: 中心地名の継承
  naming_note: 旧村名「席内」から、村内の一地区名「古賀」へ改称して継承した
  formation: 合併新設
  prefecture: 福岡県
  homonyms: []
  summary: 市名は、もとの村名「席内（むしろうち）」を1938年の町制施行の際に改めた「古賀」に由来する。古賀は村内の海岸沿いの一地区の名で、明治期に開業した古賀駅の所在地として知られていた。1955年に小野村・青柳村と合併して古賀町となり、1997年10月1日に市制を施行した。地区名「古賀」自体の語源は明らかでない。
  first_attestation:
    era: 昭和13年
    year_western: 1938
    document: 町制施行に伴う改称（席内村から古賀町へ）
    note: 自治体名としての「古賀」の初出。地区名としての「古賀」はそれ以前から存在したが、文献上の初出は未確認
  claims:
  - text: 古賀市の地方公共団体コードは402231である（総務省「地方公共団体コード一覧」による）
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  - text: 1889年の町村制施行により糟屋郡に席内村・小野村・青柳村が発足し、席内村は1938年の町制施行により古賀町となった
    kind: fact
    level: E2
    status: established
    sources:
    - r2-koga-city-history
  - text: 1955年に旧古賀町・小野村・青柳村が合併して新・古賀町となり、1997年10月1日に市制を施行して古賀市が誕生した
    kind: fact
    level: E2
    status: established
    sources:
    - r2-koga-city-history
  - text: 古賀駅は1890年（明治23年）9月28日に開業した
    kind: fact
    level: E2
    status: established
    sources:
    - r2-koga-city-history
  - text: 席内が古賀に改称したのは、鉄道が敷かれる際に集落を避けて海岸沿いの「古賀」（現在の天神地区）に駅が作られたためであると言われている
    kind: fact
    level: E5
    status: established
    sources:
    - r2-koga-wikipedia
  - text: 地区名「古賀」の語源は確定しておらず、郷土史研究会は、古代の国衙にちなむ説、花鶴川河口の海辺に沿った「クガ地」（陸）に集落ができたとする地形説、入江を指す「古河（コガ）」とする説など、複数の説を挙げている
    kind: fact
    level: E4
    status: contested
    sources:
    - upg-p12-koga-kyodoshiken
  column:
    title: 駅が村の名前を変えた
    text: もとの名は「席内（むしろうち）」といった。ところが明治23年（1890年）、村に鉄道の駅ができると、駅は集落を避けて海岸沿いの「古賀」という地区に置かれ、「古賀駅」と名付けられた。やがて人々が村を指して呼ぶ名は、駅の名前のほうへ移っていく。1938年、村が町になるとき、ついに自治体の名前そのものが「古賀」に改められた。鉄道の駅名が村名を置き換えた、近代らしい地名の交代である。
    sources:
    - r2-koga-wikipedia
    - r2-koga-city-history
  relations:
  - pref/40
  - muni/40-福津市
  - muni/40-宗像市
  unknowns:
  - 地区名「古賀」の文献上の初出と語源は確認できなかった
  - 改称の理由について、市の一次資料による明示は未確認であり、駅に由来するという説明は言い伝えとして伝わるもの
  updated: '2026-11-13'
- id: muni/40-吉富町
  code: '406422'
  names:
    ja: 吉富町
    reading: よしとみまち
    aliases:
    - 東吉富村
    - 吉富郷
  user_terms:
  - よしとみまち
  - 九州で一番小さい町
  - 吉富製薬の町
  - 神様が相撲をとる町
  naming_type: 旧行政区画名の継承
  formation: 改称
  prefecture: 福岡県
  homonyms: []
  summary: 福岡県最東端、築上郡の町。町名は室町時代から呼ばれてきた郷名「吉富郷」に由来する。1889年に成立した東吉富村が、吉富製薬の工場創立を背景に1942年5月19日に「東」を外して吉富町と改称し町制を施行した。昭和・平成の大合併でも単独を保ち、九州で最も小さい町の一つである。
  first_attestation:
    era: 室町時代
    year_western: null
    document: 吉富郷（福岡共同公文書館が「室町時代から呼称されてきた」と紹介）
    note: 郷名の一次史料における初出自体は未確認
  claims:
  - text: 町名は、室町時代から呼称されてきた「吉富（よしとみ）郷」に由来して名付けられたと、福岡共同公文書館が紹介する
    kind: fact
    level: E2
    status: established
    sources:
    - r3-yoshitomi-kobunsyokan
  - text: 1889年（明治22年）に東吉富村と高浜村が誕生し、築上郡設置の際（1896年）に高浜村のうち山国川を境とした西側の小祝・小犬丸が東吉富村に編入され、現在の町の姿となった
    kind: fact
    level: E2
    status: established
    sources:
    - r3-yoshitomi-kobunsyokan
  - text: 1940年（昭和15年）の吉富製薬の工場創立に伴い、1942年（昭和17年）5月19日に東吉富村が吉富町と改名して町制を施行した
    kind: fact
    level: E2
    status: established
    sources:
    - r3-yoshitomi-kobunsyokan
  - text: 吉富製薬（現在の田辺ファーマの吉富工場）の企業城下町として発展した
    kind: fact
    level: E2
    status: established
    sources:
    - r3-yoshitomi-town-sdgs
  - text: 町公式のSDGs未来都市計画では、面積5.72平方キロメートルで沖縄県を除いて九州で最も小さい自治体とされ、昭和・平成の大合併でも合併せず単独を保ってきたことが記される
    kind: fact
    level: E2
    status: established
    sources:
    - r3-yoshitomi-town-sdgs
  - text: 平成の合併協議では、新吉富村・大平村との3町村協議で新町名「大富町」を含む38項目が合意されたが、管理部門の位置などをめぐって合意に至らず、2004年（平成16年）11月に協議会が解散して合併は破談となり、吉富町は単独で存続した
    kind: fact
    level: E2
    status: established
    sources:
    - upg-ae2-fukuoka-gappeishi3
  - text: 総務省の地方公共団体コードは406422である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 郷の名を分け合う二つの町
    text: 中世の吉富郷は、現在の吉富町と上毛町にまたがる地域だった。郷はやがて東吉富・西吉富・南吉富に分かれ、東吉富は吉富町に、西と南は新吉富村を経て上毛町の一部になった。平成の合併では両者が「大富町」として一つに戻る案が決まりかけたが破談し、郷の名は吉富町が、郡の名は上毛町が名乗る形で落ち着いた。八幡古表神社の「神様が相撲をとる町」という顔も持つ、小さいが由緒のある町である。
    sources:
    - r3-yoshitomi-kobunsyokan
    - r3-koge-wiki
  relations:
  - pref/40
  - muni/40-上毛町
  unknowns:
  - 「吉富郷」の一次史料における初出は未確認
  - 1896年の高浜村との関係について、福岡共同公文書館は一部（小祝・小犬丸）の編入とし、Wikipediaは同年5月1日の合併による東吉富村の再発足としており、記述の細部が異なる
  - 面積について町公式計画は5.72平方キロメートル、福岡共同公文書館ブログは5.68平方キロメートルとしており、数値に差がある
  updated: '2026-11-13'
- id: muni/40-嘉麻市
  code: '402273'
  names:
    ja: 嘉麻市
    reading: かまし
    aliases:
    - 山田市
    - 稲築町
    - 碓井町
    - 嘉穂町
  user_terms:
  - 嘉麻はなぜ嘉麻というの
  - 旧山田市のあたり
  - 遠賀川の源流のまち
  - 嘉穂の南部
  naming_type: 旧行政区画名の継承
  formation: 合併新設
  prefecture: 福岡県
  homonyms: []
  summary: 平成18年（2006年）3月27日、山田市・稲築町・碓井町・嘉穂町の1市3町が合併して発足した市。市名の「嘉麻」は、明治29年（1896年）の郡統合で姿を消した古代以来の郡名「嘉麻郡」の復活で、公募398種・1,531件の中から「地域の歴史・文化に根ざした名称」として選ばれた。もとの名は『日本書紀』にみえる「鎌」に、和銅6年（713年）の好字化で「嘉麻」の字が当てられたと伝えられる。
  first_attestation:
    era: 和銅6年
    year_western: 713
    document: 郡郷名の好字二字化（『続日本紀』和銅6年条に諸国の郡郷名に好字を命じた記事がある）
    note: 「嘉麻」の字が当てられた時期として嘉麻市観光まちづくり協会の資料が伝えるもの。『日本書紀』巻十八の安閑天皇条には前身とされる「鎌の屯倉」の記事がみえるが、「嘉麻」表記そのものの最古の用例は直接確認していない
  claims:
  - text: 嘉麻市の地方公共団体コードは402273である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  - text: 平成16年（2004年）11月に嘉穂南部1市3町合併協議会が設置され、平成18年（2006年）3月27日に山田市・稲築町・碓井町・嘉穂町が合併して「嘉麻市」が誕生した
    kind: fact
    level: E4
    status: established
    sources:
    - r4-kama-kanko-ayumi
  - text: 新市の名称は一般公募され、398種・1,531件の応募の中から「地域の歴史・文化に根ざした名称である」「インパクトがある」等の理由により「嘉麻市」と決定し、最終選考には「嘉穂市」と「嘉南市」が残った
    kind: fact
    level: E4
    status: established
    sources:
    - r4-kama-kanko-ayumi
  - text: 「嘉麻」の由来について嘉麻市観光まちづくり協会は、『日本書紀』巻十八の安閑天皇の条に「鎌の屯倉（みやけ）」を置いたと記され、その後、和銅6年（713年）に諸国の郡郷名に好字をつけることが命令されたときに「嘉麻」の字が当てられたと説明している
    kind: fact
    level: E4
    status: established
    sources:
    - r4-kama-kanko-ayumi
  - text: 明治22年（1889年）の町村制施行時にもこの一帯の村々は嘉麻郡に属していたが、明治29年（1896年）の郡統合で嘉麻郡と穂波郡をもって嘉穂郡が発足し、嘉麻郡は廃止されたため、「嘉麻」の名は約110年ぶりに地域の名として復活したことになる
    kind: fact
    level: E3
    status: established
    sources:
    - upg-p11-kama-kotobank-kahogun
  - text: 『日本歴史地名大系』は、延喜5年（925年）の観世音寺資財帳にみえる筑前国の「碓井封」が嘉麻郡碓井郷にあたると紹介しており、合併前の碓井町の名は古代の碓井郷に遡る
    kind: fact
    level: E3
    status: established
    sources:
    - r4-ukiha-kotobank-ikuha
  column:
    title: 消えた郡の名の復活
    text: 「嘉麻」は新しい造語ではない。古代の筑前国に嘉麻郡があり、その名は『日本書紀』の「鎌の屯倉」に、和銅6年（713年）の好字二字化で瑞祥の字を当てたものと伝えられる。ところが明治29年（1896年）の郡統合で嘉麻郡は嘉穂郡に吸収され、地図から消えた。平成18年（2006年）の合併で新市名を公募したところ、住民の応募の中からこの「嘉麻」が掘り起こされ、「嘉穂市」「嘉南市」を退けて選ばれた。約110年ぶりに、古代の郡名が市名としてよみがえったのである。
    sources:
    - r4-kama-kanko-ayumi
    - r4-kama-wikipedia-gun
  relations:
  - pref/40
  unknowns:
  - 「鎌（かま）」という元の地名の語源（鎌形の地形に由来するのか等）は、確認した資料では説明されていなかった
  - 『日本書紀』の「鎌の屯倉」の記事と後の嘉麻郡とのつながりは市の観光協会資料の説明によるもので、専門辞典による裏付けは未確認
  updated: '2026-11-13'
- id: muni/40-大任町
  code: '406082'
  names:
    ja: 大任町
    reading: おおとうまち
    aliases:
    - 大任村
    - 大行事村
    - 今任原村
  user_terms:
  - おおとうまち
  - 道の駅おおとう桜街道の町
  - 花としじみの里
  naming_type: 合成地名
  formation: 合併新設
  prefecture: 福岡県
  homonyms: []
  summary: 福岡県北東部、田川郡の町。1889年に今任原村と大行事村が合併して大任村が成立した際の、大行事の「大」と今任原の「任」を取った合成地名である。村時代の読みは「おおとうむら」で、1960年の町制施行により大任町（おおとうまち）となった。町の中央を彦山川が流れる。
  first_attestation:
    era: 明治時代
    year_western: 1889
    document: 今任原村・大行事村の合併による新村名「大任村」
    note: 両村名から一字ずつ取った合成地名として1889年に生まれた
  claims:
  - text: 明治22年（1889年）の町村制施行に伴い、今任原村（いまとうばるむら）と大行事村（だいぎょうじむら）が合併して大任村（おおとうむら）が成立した
    kind: fact
    level: E2
    status: established
    sources:
    - r3-oto-kobunsyokan
  - text: 村名「大任」は、大行事村の「大」と今任原村の「任」を一字ずつ取った合成地名である
    kind: fact
    level: E4
    status: established
    sources:
    - upg-af6-uub-gousei
    - r3-oto-kobunsyokan
  - text: 昭和35年（1960年）1月1日、大任村が町制を施行して大任町となった
    kind: fact
    level: E2
    status: established
    sources:
    - r3-oto-kobunsyokan
    - r3-oto-geoshape
  - text: 大行事村は1887年に福田村・元松村・白土村・安永村・成光村・秋永村・柿原村の合併で先行して成立していた
    kind: fact
    level: E3
    status: established
    sources:
    - upg-p8-oto-kotobank-kakibara
  - text: 今任原村は上今任村・下今任村・桑原村の合併で先行して成立していた
    kind: fact
    level: E5
    status: established
    sources:
    - r3-oto-wiki
  - text: 町は田川郡のほぼ中央に位置し、町の中央を南北に彦山川が貫流する
    kind: fact
    level: E2
    status: established
    sources:
    - r3-oto-kobunsyokan
  - text: 町役場は大字大行事に所在する
    kind: fact
    level: E2
    status: established
    sources:
    - r3-oto-geoshape
  - text: 総務省の地方公共団体コードは406082である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 読みが変わった合成地名
    text: 大任町の名は、1889年の合併で生まれた合成地名だが、読みは一度変わっている。村の時代は「おおとうむら」、1960年の町制施行で「おおとうまち」になった。名前を与えた二つの村のうち、大行事は今も大字として残り、町役場もその大字大行事に置かれている。今任原の「任」の字も、合成されて以来ずっと町の名の後ろ半分を担っている。筑豊炭田の産炭地として栄えた歴史を持ち、今は道の駅「おおとう桜街道」と彦山川のしじみで知られる。
    sources:
    - r3-oto-kobunsyokan
    - r3-oto-wiki
  relations:
  - pref/40
  unknowns:
  - 「今任」「大行事」という旧村名自体の語源は未確認
  updated: '2026-11-13'
