  - 海部郡の町
  naming_type: 新規命名
  formation: 合併新設
  prefecture: 徳島県
  homonyms: []
  summary: 徳島県最南端、海部郡の町。太平洋に面し、2006年に海南町・海部町・宍喰町が合併して発足した平成合併の町名である。「海陽」は新町名公募の最終候補5点の中から選ばれた造語的な名で、旧3町のいずれの名でもない。中央を海部川が、南部を宍喰川が太平洋へ流れる。
  first_attestation:
    era: 平成18年
    year_western: 2006
    document: 総務省「市町村合併資料集」
    note: 2006年3月31日に海南町・海部町・宍喰町が合併して「海陽町」として発足したことが町名の初出にあたる
  claims:
  - text: 総務省の地方公共団体コード一覧で、海陽町の団体コードは363880と定められている
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  - text: 2006年3月31日、海南町・海部町・宍喰町が合併して海陽町が発足した
    kind: fact
    level: E2
    status: established
    sources:
    - q10-soumu-gapei
    - q4-tokushima-enkaku
    - q10-nii-kaiyo
    - q10-wiki-kaiyo
  - text: 新町名は公募で集められ、上位には海部・黒潮・下灘・海南などの案が入ったが、最終候補5点（青海・あまべ・海光・海陽・きらら）の中から「海陽」が選ばれた
    kind: fact
    level: E4
    status: established
    sources:
    - q10-uub-kaiyo
  - text: 新町の役場本庁は旧海南町役場に置かれた
    kind: fact
    level: E4
    status: established
    sources:
    - q10-uub-kaiyo
  - text: 旧海南町と旧海部町はいずれも1955年3月31日に周辺の村々が合併して発足した町である
    kind: fact
    level: E2
    status: established
    sources:
    - q4-tokushima-enkaku
  - text: 町は徳島県の最南端に位置し、南東の海岸線は太平洋を臨み、地域の中央を海部川が北から南に、南部を宍喰川が西から東に流れて太平洋に注ぐ
    kind: fact
    level: E2
    status: established
    sources:
    - q10-kaiyo-profile
  - text: 海部川下流左岸の平野は海部川の沖積作用で形成され、その広さは郡内一である
    kind: fact
    level: E2
    status: established
    sources:
    - q10-kaiyo-profile
  column:
    title: 候補に敗れた名前たち――青海・あまべ・海光・きらら
    text: 「海陽」が決まるまでには、公募の上位に「海部」「黒潮」「下灘」といったこの地らしい名が並び、最終候補には青海（あおみ）・あまべ・海光（かいこう）・きららが残った。あまべは旧郡名にもつながる古い響き、海光も海陽と紙一重の案である。選ばれなかった名前の顔ぶれを見ると、合併した3町が「海」を共通項に新しい一体感を作ろうとしたことがよく分かる。
    sources:
    - q10-uub-kaiyo
  relations:
  - pref/36
  - muni/36-牟岐町
  unknowns:
  - 「海陽」という名に込められた意味（命名理由）を示す合併協議会の公式資料は未確認
  - 旧宍喰町の町制施行年について資料間で食い違い（1924年・1938年）があり未確定
  updated: '2026-11-13'
- id: muni/36-牟岐町
  code: '363839'
  names:
    ja: 牟岐町
    reading: むぎちょう
    aliases: []
  user_terms:
  - むぎ
  - 海部郡の町
  - 出羽島のある町
  - 南海地震で被災した町
  naming_type: 中心地名の継承
  formation: 合併新設
  prefecture: 徳島県
  homonyms: []
  summary: 徳島県南部、海部郡の町。太平洋に面し、1889年に牟岐村が発足、1915年に町制を施行して以来、合併を経験していない。町名は構成区域の一つ牟岐浦の名を継いだもので、「牟岐」は戦国期の牟岐城・牟岐氏の名にも見える古い地名である。1946年の昭和南海地震では津波で大きな被害を受けた。
  first_attestation:
    era: 大正4年
    year_western: 1915
    document: 徳島県「市・郡沿革表」
    note: 1915年11月10日に牟岐村が町制を施行して「牟岐町」となったことが町名の初出にあたる。地名「牟岐」自体は戦国期の牟岐城・牟岐氏の名として16世紀には見える
  claims:
  - text: 総務省の地方公共団体コード一覧で、牟岐町の団体コードは363839と定められている
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  - text: 1889年（明治22年）の町村制施行で牟岐村が発足した
    kind: fact
    level: E2
    status: established
    sources:
    - upg-ae2-tokushima-hensen
  - text: 1915年11月10日、牟岐村が町制を施行して牟岐町となり、以後合併を経験していない
    kind: fact
    level: E2
    status: established
    sources:
    - q4-tokushima-enkaku
    - q10-nii-mugi
  - text: 町名は構成区域の一つである牟岐浦の名を継いだものである
    kind: fact
    level: E3
    status: established
    sources:
    - upg-s1-mugiura-taikei
  - text: 戦国期には牟岐大膳允が牟岐城に在城したとされ（『城跡記』）、天正3年（1575年）には長宗我部元親に降伏したという（『元親記』）
    kind: fact
    level: E3
    status: established
    sources:
    - upg-s1-mugijo-taikei
  - text: 1946年12月21日の昭和南海地震では、地震と津波により町内で大きな被害が出た。死者と家屋全壊の数には資料により差があり、『牟岐町史』に基づく学術調査は死者52人・全壊154戸とする一方、53人が死亡し374戸が全壊したとする紹介もある
    kind: fact
    level: E2
    status: contested
    sources:
    - upg-s1-mugi-nankai-ocu
    - q10-wiki-mugi
  - text: 町の海岸部は室戸阿南海岸国定公園の区域に含まれ、町域には牟岐川が流れ、橘川と合流して牟岐浦に注ぐ
    kind: fact
    level: E3
    status: established
    sources:
    - upg-s1-kaifu-taikei
    - upg-s1-mugi-taikei
  column:
    title: 110年続く町制と、南海地震の記憶
    text: 牟岐町は1915年に町制を施行して以来、一度も合併せずに町であり続け、2026年には町制111周年を祝った。その歩みの中で最も深い傷は1946年の昭和南海地震で、津波が町を襲い、50人を超える町民が亡くなった。太平洋に開けた港町の地名「牟岐」は、戦国期の城の名として現れる古い名であり、防災とともに生きる町の歴史の長さを物語っている。
    sources:
    - q10-wiki-mugi
    - q10-nii-mugi
  relations:
  - pref/36
  - muni/36-海陽町
  unknowns:
  - 「牟岐」という地名の語源は未確認
  - 牟岐浦の名の初出を示す中世以前の史料は未確認
  updated: '2026-11-13'
- id: muni/36-石井町
  code: '363413'
  names:
    ja: 石井町
    reading: いしいちょう
    aliases:
    - 石井村
  user_terms:
  - いしい
  - 第十堰の町
  - 名西郡
  naming_type: 中心地名の継承
  formation: 合併新設
  prefecture: 徳島県
  homonyms: []
  summary: 徳島市の西隣に位置する町。1889年に旧来の石井村など6村の区域をもって石井村が発足し、1907年に町制を施行した。1955年に浦庄・高原・藍畑・高川原の4村と合併して現在の石井町となった。町名は中心集落だった石井の名を受け継ぐが、「石井」自体の語源は専門資料で確認できなかった。
  first_attestation:
    era: 明治
    year_western: 1889
    document: 町村制施行による石井村の発足
    note: 自治体名としての初出。地名「石井」自体の初出は未確認である。
  claims:
  - text: 地方公共団体コードは363413である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  - text: 1955年3月に旧石井町と浦庄村・高原村・藍畑村・高川原村の1町4村が合併して現在の石井町が成立した
    kind: fact
    level: E2
    status: established
    sources:
    - q11-ishii-pref
  - text: 1889年10月1日に石井村・城ノ内村・重松村・白鳥村・尼寺村・内谷村の区域をもって石井村が発足し、1907年11月1日に町制施行して石井町となった
    kind: fact
    level: E4
    status: established
    sources:
    - upg-ae4-uub-tokushima
    - q11-ishii-geoshape
  - text: 歴史的行政区域データセットでも石井町の有効期間は1907年11月1日からとされており、町制施行の年次と一致する
    kind: fact
    level: E2
    status: established
    sources:
    - q11-ishii-geoshape
  - text: 町内には「石井町石井字石井」という町名・大字名・小字名が重なる住所が実在し、県の公式文書に石井町商工会の所在地として記されている
    kind: fact
    level: E2
    status: established
    sources:
    - q11-ishii-pref
  - text: 吉野川の第十堰は石井町と上板町に位置し、その可動堰化の是非は徳島市の住民投票でも問われた
    kind: fact
    level: E2
    status: established
    sources:
    - upg-s6-ishii-jusseki-mlit
    - upg-s6-ishii-jusseki-archive
  - text: 行基が石井の地に童学寺を建て、空海がこの寺で学んだと伝えられる
    kind: legend
    level: E2
    status: indeterminate
    sources:
    - upg-s6-ishii-keikaku
  column:
    title: 石井町石井字石井
    text: 住所を書くと「石井」が三つ並ぶ場所がある。徳島県名西郡「石井町」の大字「石井」の小字「石井」で、県の公式文書にも石井町商工会の住所としてそのまま記されている。町・大字・小字の各層で同じ名が残り続けた結果の、全国でも珍しい三重地名である。
    sources:
    - q11-ishii-pref
  relations:
  - pref/36
  unknowns:
  - 「石井」の語源（岩の間から湧き出る井戸に由来すると紹介するウェブ記事はあるが、郷土史料の原典を確認できなかった。角川日本地名大辞典36徳島県・日本歴史地名大系37徳島県の地名での確認が今後の課題）
  - 地名「石井」の中世以前の文献上の初出
  updated: '2026-11-13'
- id: muni/36-神山町
  code: '363421'
  names:
    ja: 神山町
    reading: かみやまちょう
    aliases:
    - 大粟谷
    - 神領
  user_terms:
  - かみやま
  - サテライトオフィスの町
  - 粟生の里
  naming_type: 中心地名の継承
  formation: 合併新設
  prefecture: 徳島県
  homonyms: []
  summary: 鮎喰川上流域の山町。1955年3月31日に阿野・神領・鬼籠野・下分上山・上分上山の5村が合併して発足した。町名は、開けた土地が「神領」と呼ばれる一方で未開の山地が「神山」と呼ばれていたことに由来すると、町の観光ガイドに基づき紹介されている。
  first_attestation:
    era: 昭和
    year_western: 1955
    document: 神山町の発足（5村合併）
    note: 「神山」という地域呼称自体は合併以前からあったとされるが、文献上の初出は未確認である。
  claims:
  - text: 地方公共団体コードは363421である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  - text: 神山町は1955年3月31日に阿野村・神領村・鬼籠野村・下分上山村・上分上山村の5村が合併して発足した。阿野村は広野村と阿川村の、下分上山村は下分上山と左右内の区域から成っていた
    kind: fact
    level: E2
    status: established
    sources:
    - q11-kamiyama-town
  - text: この地域は大粟谷と呼ばれ、その開耕地は神領として耕作され、未開の山地は「神山」と呼ばれていたことから神山町と命名されたと、町の観光ガイドは説明している
    kind: fact
    level: E2
    status: established
    sources:
    - upg-s6-kamiyama-guide
  - text: 神領地区の上一宮大粟神社に祀られる穀類の祖神・大宜都比売命によって、この地が早くから開かれたという伝説がある
    kind: legend
    level: E2
    status: indeterminate
    sources:
    - upg-s6-kamiyama-guide
    - q11-kamiyama-town
  - text: 高根山悲願寺は、卑弥呼の宮城跡であるとする伝承が残る
    kind: legend
    level: E4
    status: indeterminate
    sources:
    - upg-s6-kamiyama-mapple
  - text: 上一宮大粟神社の主祭神・大宜都比売命は日本神話に登場する唯一の穀類の祖神とされ、神領地区は「阿波の語源ともいわれる粟生の里」として町が紹介している
    kind: fact
    level: E2
    status: established
    sources:
    - q11-kamiyama-town
  - text: 町域の約86パーセントを山々が占め、その中央を鮎喰川が東西に横断して流れる
    kind: fact
    level: E2
    status: established
    sources:
    - q11-kamiyama-town
  column:
    title: 粟生の里と阿波の語源
    text: 神領の上一宮大粟神社は、穀類の祖神・大宜都比売命を祀る。町はこの一帯を「阿波の語源ともいわれる『粟生の里』」と紹介する。粟の産地「あわ」が国名の阿波になったという説明は魅力的な説だが、あくまで「ともいわれる」の段階であり、語源として確定したものではない。
    sources:
    - q11-kamiyama-town
    - q11-kamiyama-wiki
  relations:
  - pref/36
  unknowns:
  - 「神山」という山地呼称の文献上の初出と、合併時の命名決定の記録
  - 「大粟谷」の呼称の範囲と初出
  updated: '2026-11-13'
- id: muni/36-美波町
