prefecture_code: '27'
records:
- id: muni/27-交野市
  code: '272302'
  names:
    ja: 交野市
    reading: かたのし
    aliases:
    - 片野
    - 交野郡
    - 交野町
  user_terms:
  - かたの
  - 星のまち
  - 七夕伝説の地
  naming_type: 旧行政区画名の継承
  formation: 単独発足
  prefecture: 大阪府
  homonyms: []
  summary: 市名は古代の河内国の郡名「交野郡」に由来する。交野は『和名類聚抄』に「カタノ」と訓が残る古い地名で、「片野」とも記された。平安時代には皇室の狩猟地として天皇の行幸が繰り返され、のち郡名を引き継いだ交野町を経て1971年に市制を施行した。市内には天野川・逢合橋・星田など、七夕や星にまつわる地名と伝説が集まっており、「星のまち」を名乗る。
  first_attestation:
    era: 宝亀2年
    year_western: 771
    document: 『続日本紀』
    note: 『日本歴史地名大系』が、交野への行幸の初見として『続日本紀』宝亀2年（771）2月13日条の光仁天皇の行幸を挙げる。地名そのものの用例は大系経由の紹介で確認した。郡名としては『和名類聚抄』に「カタノ」の訓がある
  claims:
  - text: 交野市の総務省地方公共団体コードは272302である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  - text: 市名「交野」は、かつて市域が属した河内国交野郡の名に由来する
    kind: fact
    level: E3
    status: established
    sources:
    - x1-katano-kotobank-city
  - text: 交野郡は『和名類聚抄』にみえる郡で、訓は高山寺本に「カタノ」、東急本に「加多乃」とある
    kind: fact
    level: E3
    status: established
    sources:
    - x1-katano-kotobank-gun
  - text: 交野は「片野」とも記され、交野（交野が原）への行幸の初見は『続日本紀』宝亀2年（771）の光仁天皇の行幸で、桓武天皇も延暦2年（783）をはじめ数多くの行幸をして鷹狩りを行った
    kind: fact
    level: E3
    status: established
    sources:
    - x1-katano-kotobank-katano
  - text: 「かたの」の語源は確定しておらず、『日本大百科全書（ニッポニカ）』は、西方の淀川べりから望むと一段高い台地に位置することから「肩野」ともよばれたらしいと紹介している
    kind: fact
    level: E3
    status: contested
    sources:
    - x1-katano-kotobank-katano
  - text: 昭和30年（1955）に交野町と星田村が合体して交野町となり、昭和46年（1971）に市制を施行して交野市となった
    kind: fact
    level: E2
    status: established
    sources:
    - x1-katano-city-chapter1
    - x1-katano-kotobank-city
  - text: 市内を流れる天野川は、もとは「甘野川」と呼ばれていたのが、平安時代に遊猟に訪れた宮廷人が夜空の星の連なる「天の川」になぞらえたことから「天の川（天野川）」の名が定着したと伝えられる
    kind: legend
    level: E2
    status: established
    sources:
    - x1-katano-city-densetsu
  - text: 天野川にかかる逢合橋は、織姫と彦星が七夕の夜に出会っていた場所だという伝説があり、市内の星田という地名も、もとの「乾し田」が降星の伝説によって「星の田」と改称されたと伝えられる
    kind: legend
    level: E2
    status: established
    sources:
    - x1-katano-city-densetsu
  column:
    title: 星の名前が集まるまち
    text: 交野市の地図を広げると、星にちなむ名前が点々と見つかる。星田、南星台、天野川、そして織姫と彦星が出会ったという逢合橋。いずれも「そう伝えられる」という伝説の層の話だが、市はこれを「星のまち☆かたの」という顔として打ち出している。古代には天皇の鷹狩りの原だった交野が原が、星の物語の舞台として読み替えられてきたこと自体が、この地名のもう一つの歴史である。
    sources:
    - x1-katano-city-densetsu
  relations:
  - pref/27
  unknowns:
  - 「かたの」の語源は諸説あり、専門文献で確定した説は確認できなかった
  - 「片野＝片側が原野だった」「肩や潟が交に転じた」「カタ＝山裾の地」などの説は一般の地名解説で紹介されるが、専門文献での裏付けは確認できなかった
  - 『続日本紀』の行幸記事の原文は『日本歴史地名大系』の紹介経由で確認し、原文は未読
  - 交野が原の中心は現在の枚方市側ともいわれ、市域との位置のずれは大系の記述に留めた
  updated: '2026-11-13'
- id: muni/27-八尾市
  code: '272124'
  names:
    ja: 八尾市
    reading: やおし
    aliases:
    - 矢尾
    - 八尾庄
    - 八尾木
  user_terms:
  - やお
  - 鶯の伝説のまち
  naming_type: 中心地名の継承
  formation: 単独発足
  prefecture: 大阪府
  homonyms: []
  summary: 市名は中世以来の地名「八尾」の継承で、文献上の初出は長久2年（1041年）の矢作神社文書とされる。語源は決着しておらず、矢作部の「矢負い」が転訛したという説、尾羽根が8枚ある鶯の伝説、由義宮造営に伴う築堤の「八百の柵」説などが並び立つ。1948年に市制を施行した。
  first_attestation:
    era: 長久2年
    year_western: 1041
    document: 矢作神社文書（「河内国若江郡八尾八幡掃部別宮」）
    note: 八尾市立図書館が『八尾市史』等の資料に基づき紹介する初出。古くは「矢尾」とも書かれた。
  claims:
  - text: 八尾市立図書館は、「八尾」という地名が初めて文献に登場するのは、長久2年（1041年）の矢作神社文書に見える「河内国若江郡八尾八幡掃部別宮」であるという。
    kind: fact
    level: E2
    status: established
    sources:
    - k4-yao-library
  - text: 一つ目の説として、古代の八尾の地に大豪族・物部氏の配下で弓矢の生産に従事していた矢作部や弓削部があったことから「矢負い」という語が生まれ、転訛して「やを」になり「八尾」の字があてられるようになったという説が唱えられている。
    kind: fact
    level: E2
    status: contested
    sources:
    - k4-yao-library
  - text: 尾羽根が8枚ある鶯が美しい声で鳴いたという「八つ尾の鶯」の話は、天文22年（1553年）に三条西公条の『吉野詣記』に記されたもので、もとは「八尾木」の伝説であったものが八尾の地名伝説に転じていったと『八尾市史』は述べている。
    kind: legend
    level: E2
    status: established
    sources:
    - k4-yao-library
  - text: 宝亀元年（770年）から行われた古大和川（長瀬川）の大築堤工事で打ち込まれた大小の柵（木）の壮観を人々が「八百の木」と呼んだことが、「八尾」に転じたという説もあり、称徳天皇の由義宮（西の京）造営計画と結びつけて語られている。
    kind: fact
    level: E2
    status: contested
    sources:
    - k4-yao-library
  - text: このほか、低湿地を意味する古語「矢野」・「谷野」が転訛したという説や、信貴生駒連峰の八つの尾嶺に由来するという説も唱えられている。
    kind: fact
    level: E2
    status: contested
    sources:
    - k4-yao-library
  - text: 八尾市公式の「地名のいわれ」のページも、鶯の尾羽根説・矢負い説・八百の杭説の3つを、市の地名の「いわれ」として並べて紹介している。
    kind: fact
    level: E2
    status: established
    sources:
    - k4-yao-iwaware
  - text: 昭和23年（1948年）4月1日に市制を施行した（当時の人口64,431人、面積18.99平方キロメートル）。
    kind: fact
    level: E2
    status: established
    sources:
    - k4-yao-gaiyo
  - text: 八尾市の地方公共団体コードは272124である。
    kind: fact
    level: E2
    status: established
    sources:
    - d-cap-jlis-osaka
  column:
    title: 「八尾木」の鶯が「八尾」の鶯になるまで
    text: 八尾の鶯伝説は、もともと地名そのものの話ではなかった。『八尾市史』によれば、八つ尾の鶯の話は「八尾木」という木にまつわる伝説として語られていたものが、後に「八尾」の地名伝説へと転じていったという。1553年に吉野詣での途中でこの話を聞いた公卿・三条西公条は、「鶯の八尾のつばさ八千とせの声」と歌まで残した。伝説が地名に取り込まれていく過程を、市史がここまで具体的にたどれる例は珍しい。
    sources:
    - k4-yao-library
  relations:
  - pref/27
  unknowns:
  - 「八尾」の語源は諸説が並立しており、矢負い説・八百の柵説・地形説のいずれにも決着はついていない。
  - 昭和23年（1948年）の市制施行に至る合併の構成町村は、確認した市公式資料には記載がなく、未確認である。
  updated: '2026-11-13'
- id: muni/27-千早赤阪村
  code: '273830'
  names:
    ja: 千早赤阪村
    reading: ちはやあかさかむら
    aliases:
    - 千早
    - 赤阪
  user_terms:
  - 千早赤阪
  - ちはやあかさか
  - 大阪府唯一の村
  - 楠木正成の村
  - 金剛山の村
  naming_type: 合成地名
  naming_note: 1956年に千早村と赤阪村が合併し、両村名を連ねた合成地名とした
  formation: 合併新設
  prefecture: 大阪府
  homonyms: []
  summary: 大阪府南東部、南河内郡の村で、大阪府で唯一の村であり、府内で人口が最も少ない。1956年に千早村と赤阪村が合併して発足した合成地名。千早・赤阪はともに楠木正成ゆかりの地で、元弘の変の舞台となった千早城と赤坂城（上・下）の跡が国の史跡として残る。金剛山の西麓に位置し、大字には旧両村の区域がそのまま残る。
  first_attestation:
    era: 昭和31年
    year_western: 1956
    document: 千早村・赤阪村の合併による新村名（村の発足は1956年9月30日）
    note: 「千早赤阪」の初出は合併命名そのもの。構成要素の「千早」「赤阪」は中世以来の地名で、千早城・赤坂城の名で元弘の変（1331〜1333年）の記録に現れるが、個別の初出用例の確認は未了
  claims:
  - text: 1956年（昭和31年）9月30日に千早村と赤阪村が合併して千早赤阪村が発足した。村名は両村名を連ねた合成地名である
    kind: fact
    level: E2
    status: established
    sources:
    - upg-s8-chihaya-plan
    - upg-s8-chihaya-geoshape
  - text: 千早赤阪村は大阪府で唯一の村であり、府内で人口が最も少ない自治体である
    kind: fact
    level: E2
    status: established
    sources:
    - upg-s8-chihaya-intro
    - upg-s8-osaka-census
  - text: 村は楠木正成の出身地として知られ、千早城跡と赤阪城跡（下赤坂城跡）・楠木城跡（上赤坂城跡）はいずれも国の史跡である。これらの城は正成が鎌倉幕府軍を迎え撃った元弘の変の舞台となった
    kind: fact
    level: E3
    status: established
    sources:
    - upg-s8-chihaya-kotobank
    - upg-s8-chihaya-bunka-akasaka
    - upg-s8-chihaya-bunka-chihaya
    - upg-s8-chihaya-bunka-kusunoki
  - text: 現在の大字は、旧千早村の東阪・小吹・千早・中津原・吉年と、旧赤阪村の川野辺・桐山・水分・二河原辺・森屋からなり、合併前の両村の区域がそのまま残っている
    kind: fact
    level: E2
    status: established
    sources:
    - upg-s8-chihaya-gikai
    - upg-s8-chihaya-ka
  - text: 村章は千早の頭文字「C」と赤阪の頭文字「A」を図案化したもので、1966年（昭和41年）1月に制定された。合併した両村の名をそのまま紋章にしている
    kind: fact
    level: E2
    status: established
    sources:
    - upg-s8-chihaya-intro
  - text: 平成の大合併では、2008年に隣接する河内長野市との合併協議会が設置されて合併が協議されたが、実現には至らず、大阪府で唯一の村は存続した
    kind: fact
    level: E4
    status: established
    sources:
    - upg-s8-chihaya-nikkei
    - upg-s8-chihaya-plan
  - text: 千早赤阪村の地方公共団体コードは273830である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: あと一歩で「大阪府に村がなくなる」ところだった
    text: 2008年、千早赤阪村は隣の河内長野市への編入合併へ大きく傾いた。合併協議会が設けられ、実現すれば大阪府唯一の村は消えるはずだった。ところが協議は実らず、計画は白紙に戻った。人口は府内最少で、2014年には大阪府で初めて過疎地域にも指定された村が、それでも「村」のままであり続けることを選んだのである。村の名前が二つの城の名前の合成なら、その存続もまた、楠木正成の故事めいた粘り強さの現代版といえるかもしれない。
    sources:
    - x10-chihayaakasaka-wiki
    - upg-s8-chihaya-nikkei
    - upg-s8-chihaya-plan
  relations:
  - pref/27
  - muni/27-河南町
  - muni/27-富田林市
  unknowns:
  - 「千早」「赤阪（赤坂）」それぞれの地名の語源と最古の用例
  - 1956年の合併時に他の村名案があったかどうか
  - 楠木正成の出生地を村内のどこに比定するか（下赤坂とする伝承の史料的裏付け）
  updated: '2026-11-13'
- id: muni/27-吹田市
  code: '272051'
  names:
    ja: 吹田市
    reading: すいたし
    aliases:
    - 次田
    - 吹田庄
  user_terms:
  - すいた
  - 万博のまち
  - 千里ニュータウン
  naming_type: 中心地名の継承
  formation: 合併新設
  prefecture: 大阪府
  homonyms: []
  summary: 市名は古代以来の地名「吹田」の継承だが、その出発点は「次田（スキタ）」である。吹田市公式によれば、初見は『行基年譜』の天平13年（741年）の記事で、「スキタ」が音便で「スイタ」に変わり、草書体で「次」に似た「吹」の字があてられて「吹田」になった。1940年に4町村の合併で市制を施行した。
  first_attestation:
    era: 天平13年
    year_western: 741
    document: 『行基年譜』
    note: 現在の「吹田」表記ではなく「嶋下郡次田里」「次田堀川」とあり、「次田（スキタ）」としての初見である。「吹田」表記への移行過程は市公式の説明による。
  claims:
  - text: 吹田市公式は、吹田の地名の初見は「行基年譜」の天平13年（741年）の記にある「嶋下郡次田里」「次田堀川」で、もとは「次田」と書いて「スキタ」と読んでいたと考えられると説明している。
    kind: fact
    level: E2
    status: established
    sources:
    - k4-suita-history
  - text: 「スキタ」は音便で「スイタ」に変化し、草書体で「次」の字に似ている「吹」の字が使われるようになったと考えられると市公式は説明している。
    kind: fact
    level: E2
    status: established
    sources:
    - k4-suita-history
  - text: 吹田市史総説編は、『醍醐雑事記』に、貞観7年（865年）に淳和天皇の皇子・基貞親王の領田として吹田庄が成立し、後に清住寺に寄進されたことが記されていると紹介している。
    kind: fact
    level: E2
    status: established
    sources:
    - k4-suita-shishi
  - text: のちの文献では「スイタ」を「水田」と書く例も見られると市公式は記している。
    kind: fact
    level: E2
    status: established
    sources:
    - k4-suita-history
  - text: 昭和15年（1940年）4月1日、三島郡吹田町・千里村・岸部村と豊能郡豊津村の4町村が合併して吹田市が誕生した。
    kind: fact
    level: E2
    status: established
    sources:
    - k4-suita-enkaku
  - text: 吹田市の地方公共団体コードは272051である。
    kind: fact
    level: E2
    status: established
    sources:
    - d-cap-jlis-osaka
  column:
    title: 「次」が「吹」になったまち
    text: 地名の漢字が変わる理由は、音の変化や縁起担ぎが多いが、吹田の場合は「字の形」である。「次田（スキタ）」の「次」を草書体で書くと「吹」に似るため、いつしか「吹」の字が使われるようになったというのが市の説明だ。音便で読みが「スイタ」に滑らかになるのと並行して、表記まで隣の字へ滑っていった。読みと字形の両方が少しずつずれて固まった地名は、全国的にも珍しい部類に入るだろう。
    sources:
    - k4-suita-history
  relations:
  - pref/27
  unknowns:
  - 『行基年譜』自体は後世に編まれた年譜であり、天平13年（741年）当時の同時代史料で「次田」を確認できたわけではない。
  - 「吹田」表記が文献に定着した時期は、市公式の説明でも明確には示されていない。
  updated: '2026-11-13'
- id: muni/27-和泉市
  code: '272191'
  names:
    ja: 和泉市
    reading: いずみし
    aliases:
    - 泉
    - 和泉町
    - 和泉国
  user_terms:
  - 和泉という地名の由来
  - 和泉の「和」はなぜ読まないの
  - 和泉国府があった市
  - いずみの国 和泉市
  naming_type: 旧国名・広域地名の採用
  formation: 合併新設
  prefecture: 大阪府
  homonyms: []
  summary: 市名は旧国名「和泉」による。和泉の名は、現在の和泉市府中にある泉井上神社の霊泉「和泉清水」に由来し、清水が多く湧く地であったことによるという。もとの表記は「泉」一字で、和銅6年（713年）の好字令を受けて「和」の雅字を添えて「和泉」と記すようになったと推定され、「和」は読まない。霊亀2年（716年）に和泉監が置かれて和泉国が成立し、その国府は現在の和泉市府中に置かれた。昭和31年（1956年）、和泉町など7町村の合併で市制を施行する際、国名にちなむ「和泉市」が選ばれた。
  first_attestation:
    era: 霊亀2年
    year_western: 716
    document: 『続日本紀』（河内国から和泉郡・日根郡を分けて和泉監を置く記事）
    note: 国名としての「和泉」の成立を示す記録。なお字の表記は、和銅6年（713年）の好字令を受けて「泉」に「和」の雅字を添えたものと市公式は推定する。『続日本紀』の原文そのものは未読のため、主張側では二次資料経由として扱う
  claims:
  - text: 和泉市公式サイトは、「和泉」の地名は泉井上神社の境内にある霊泉「和泉清水」に由来するとし、和泉の名を説く『日本得名』の「彼国清水多ク出ル処ナレハ、和泉ト号ス」という記述を紹介している
    kind: fact
    level: E2
    status: established
    sources:
    - p3-izumi-yurai
  - text: 神功皇后が新羅出兵の途中この地を訪れたところ、地中に波音があり、一夜にして清泉が湧き出たことから、それにちなんで「和泉」と名づけられたと伝えられていると和泉市公式サイトは紹介している
    kind: legend
    level: E2
    status: established
    sources:
    - p3-izumi-yurai
  - text: もとの表記は「泉」一字だったと思われるが、和銅6年（713年）に諸国の国郡郷名に良い字を付けるよう命じられたことを受け、「和」という雅字を添えて「和泉」と記すようになったと推定されると和泉市公式サイトは説明しており、「和」は読まない
    kind: fact
    level: E2
    status: established
    sources:
    - p3-izumi-yurai
  - text: 霊亀2年（716年）に河内国から和泉郡・日根郡（後に大鳥郡も）を分けて和泉監が置かれ、天平勝宝9歳（757年）に再び分けられて和泉国が成立し、その国府は現在の和泉市府中町一帯に置かれた
    kind: fact
    level: E4
    status: established
    sources:
    - p3-izumi-localhist
    - p3-izumi-yurai
  - text: 『日本歴史地名大系』は、和泉市の市名は当市の府中にかつて和泉国の中心機関である和泉国府があったことに由来すると説明している
    kind: fact
    level: E3
    status: established
    sources:
    - p3-izumi-kotobank
  - text: 昭和31年（1956年）9月1日、和泉町・北池田村・南池田村・北松尾村・南松尾村・横山村・南横山村が合併して市制を施行し、大阪府内23番目の市として和泉市が誕生した
    kind: fact
    level: E2
    status: established
    sources:
    - p3-izumi-kinenshi
    - p3-izumi-wiki
  - text: 大阪府知事に宛てた合併申請書には、新市名選定の理由として、和泉国にちなんで和泉町の名称を附している関係上「和泉市」とすれば一般に最も親しみある名称となるためこの市名を選定した旨が記されている
    kind: fact
    level: E5
    status: established
    sources:
    - p3-izumi-wiki
  - text: 昭和35年（1960年）に八坂町と信太村を編入し、現在の市域が形成された
    kind: fact
    level: E2
    status: established
    sources:
    - upg-s9-izumi-seisou
  - text: 和泉市の地方公共団体コードは272191である
    kind: fact
    level: E2
    status: established
    sources:
    - d-cap-jlis-osaka
  column:
    title: 「和泉」の「和」はなぜ読まないのか
    text: 「和泉」と書いて「いずみ」と読み、「和」は読みません。和泉市公式の説明によれば、もとの地名は「泉」の一字でした。ところが和銅6年（713年）、国や郡や郷の名には縁起のよい二字を使うよう命じる「好字令」が出され、「泉」にも飾りの字「和」が添えられて「和泉」になったと推定されます。このような意味を持たない飾りの文字を雅字といい、同じ仕組みで「木」に「紀」を添えたのが紀伊国です。読まない字には、奈良時代の役所の都合が刻まれているのです。
    sources:
    - p3-izumi-yurai
  relations:
  - pref/27
  unknowns:
  - 「和泉清水」そのものの初出となる古代の記録は特定できなかった（和泉清水由来説は市公式と『日本得名』の引用に拠る）
  - 合併申請書の市名選定理由は Wikipedia 経由での引用確認にとどまり、申請書そのものは未確認
  - 713年の好字令で「泉」に「和」が添えられたという経緯は、市公式も「推定」とする段階のもので、同時代史料による直接の裏付けは確認できなかった
  updated: '2026-11-13'
- id: muni/27-四條畷市
  code: '272299'
  names:
    ja: 四條畷市
    reading: しじょうなわてし
    aliases:
    - 四条畷
    - 四条縄手
    - 甲可村
  user_terms:
  - しじょうなわて
  - 四条畷の戦いの地
  - なわて
  naming_type: 中心地名の継承
  formation: 改称
  prefecture: 大阪府
  homonyms: []
  summary: 市名は南北朝時代の古戦場「四条縄手（畷）」に由来する。『太平記』に記されたこの地名は、1348年の四條畷の戦いで楠木正行が戦死した場所として知られるようになった。もとの自治体は甲可村だったが、明治期に四條畷神社が創建されて「四條畷」の名が広く知られるようになると、1932年に村名を四條畷村へ改称し、1970年に市制を施行した。「畷」は田のあぜ道を意味する地形語である。
  first_attestation:
    era: 貞和4年・正平3年（戦いの年次）
    year_western: 1348
    document: 『太平記』巻26
    note: 市公式が市名の典拠として『太平記』巻26に記された四条縄手（畷）を挙げる。『太平記』自体の成立は南北朝時代の後期で、戦いの記事はその記述による
  claims:
  - text: 四條畷市の総務省地方公共団体コードは272299である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  - text: 市名「四條畷」は南北朝期の古戦場「四条縄手（畷）」にちなむとされ、市は『太平記』巻26をその典拠に挙げている
    kind: fact
    level: E2
    status: established
    sources:
    - x1-shijonawate-city-yurai
  - text: 1348年（貞和4年・正平3年）の四條畷の戦いでは、南朝方の楠木正行が足利方の高師直らと戦って敗れ、この地で戦死した
    kind: fact
    level: E2
    status: established
    sources:
    - x1-shijonawate-city-rekishi
    - x1-shijonawate-city-miryoku
  - text: 「畷（なわて）」は「縄手」とも書かれる、田と田の間のあぜ道を指す地形語であり、四条縄手は飯盛山西麓の水田地帯の道の名だったと考えられる
    kind: fact
    level: E2
    status: inferred
    sources:
    - x1-shijonawate-city-yurai
  - text: もとの村は甲可村といったが、明治23年（1890）に楠木正行らを祀る四條畷神社が創建されると、駅・学校・郵便局など地域の公共施設が次々と「四條畷」の名を冠するようになった
    kind: fact
    level: E2
    status: established
    sources:
    - x1-shijonawate-city-yurai
  - text: 昭和7年（1932）に甲可村は四條畷村へ改称し、四條畷町を経て、昭和45年（1970）に市制を施行して四條畷市となった
    kind: fact
    level: E2
    status: established
    sources:
    - x1-shijonawate-city-miryoku
  - text: 市名の漢字は旧字体の「四條畷」が正式表記であり、市の広報資料でもJRの駅名は新字体で「四条畷」と表記されている
    kind: fact
    level: E2
    status: established
    sources:
    - x1-shijonawate-city-miryoku
  column:
    title: 神社の名が村の名になった
    text: 四條畷という名は、最初から村の名前だったわけではない。古戦場の名として『太平記』に残り、明治23年に楠木正行を祀る四條畷神社ができると、駅も学校も郵便局も「四條畷」を名乗り始めた。そして昭和7年、ついに村そのものが甲可村から四條畷村へ改名する。有名になった場所の名前が、後から行政の名前を置き換えていく——地名の主従が逆転した珍しい例である。
    sources:
    - x1-shijonawate-city-yurai
  relations:
  - pref/27
  unknowns:
  - 「四条」の「条」が何に由来するか（条里の区画との関係など）は市公式では説明がなく、確認できなかった
  - 四条縄手という地名の『太平記』以前の用例は確認できなかった
  - 戦いの細部は『太平記』の記述によるところが大きく、同時代史料による裏づけの範囲は未確認
  updated: '2026-11-13'
- id: muni/27-堺市
  code: '271403'
  names:
    ja: 堺市
    reading: さかいし
    aliases:
    - 堺津
  user_terms:
  - さかい
  - 環濠都市
  - 政令指定都市
  naming_type: 中心地名の継承
  formation: 単独発足
  prefecture: 大阪府
  homonyms: []
  summary: 市名は中世以来の港町「堺」の継承である。「さかい」の名は、この地が摂津・河内・和泉の国の境（あるいは摂津・和泉の2国の境）にあったことに由来すると説明され、文献への初登場は11世紀中頃とされる。中世後期には環濠都市・貿易港として繁栄し、1889年に市制を施行、2006年に政令指定都市となった。
  first_attestation:
    era: 平安時代
    year_western: null
    document: 文献名不詳（堺市議会「市勢の概要」は「さかい」の地名が文献に初めて登場するのは11世紀中頃とするが、書名を示していない）
    note: 書名を伴う用例としては、角川日本地名大辞典が貞永元年（1232年）の文書に見える「泉州堺津」を紹介している。初出の年には資料間で幅がある。
  claims:
  - text: 堺市議会の「市勢の概要」は、「さかい」の地名が初めて文献に登場するのは11世紀中頃で、堺が摂津・河内・和泉の国境にあったことによるものと言われていると記している。
    kind: fact
    level: E2
    status: established
    sources:
    - k4-sakai-gikai
  - text: 一方で堺市の中心市街地活性化基本計画は、平安時代にこの地が摂津・和泉の2国の境に位置していたことから「さかい」と呼ばれるようになったと説明しており、「境」の国の数をめぐっては市公式資料の間でも2国説と3国説が併存する。
    kind: fact
    level: E2
    status: contested
    sources:
    - k4-sakai-chukatsu
    - k4-sakai-gikai
  - text: 角川日本地名大辞典は、中世の堺を摂津国住吉郡と和泉国大鳥郡にまたがる堺北荘・堺南荘の総称とし、貞永元年（1232年）の文書に、鋳物師らが廻船の拠点とした「泉州堺津」が見えることを示している。
    kind: fact
    level: E3
    status: established
    sources:
    - k4-sakai-kadokawa
  - text: 中世後期の堺は、良港を擁して朱印船貿易など海外貿易の物資集散地となり、防衛のため濠を巡らせた環濠都市が形成され、自治都市として繁栄した。
    kind: fact
    level: E2
    status: established
    sources:
    - k4-sakai-chukatsu
  - text: 1889年4月1日に市制が施行されて堺市が発足し、その後、明治27年（1894年）の第1次合併から14次にわたって22町村を編入して現在の市域が形成された。
    kind: fact
    level: E2
    status: established
    sources:
    - k4-sakai-gappei
  - text: 2005年2月1日に南河内郡美原町を編入し、これを契機として2006年4月に政令指定都市へ移行した。
    kind: fact
    level: E2
    status: established
    sources:
    - k4-sakai-gappei
    - k4-sakai-rekimachi
  - text: 堺市の地方公共団体コードは271403である。
    kind: fact
    level: E2
    status: established
    sources:
    - d-cap-jlis-osaka
  column:
    title: 三つの「市」の字が語る、国境のまち
    text: 明治28年（1895年）に制定された堺の市章は、「市」の字を三つ組み合わせた形をしている。堺市議会の資料によれば、これは3国の境に発達した都市という意味を込めたものだという。国と国の境目という、行政の周縁にあったはずの場所が、港の地の利を得て中世には会合衆が治める自治都市にまで育った。市章の三つの「市」は、その出自を今も静かに語り続けている。
    sources:
    - k4-sakai-gikai
    - k4-sakai-chukatsu
  relations:
  - pref/27
  - muni/27-大阪市
  unknowns:
  - 「さかい」の初出について、堺市議会資料は11世紀中頃とするが具体的な文献名を示しておらず、角川地名大辞典が示す鎌倉期の用例との間で幅があり、一次文献での確定には至らなかった。
  - 境の国の数が2国（摂津・和泉）か3国（摂津・河内・和泉）かは、市の公式資料の間でも説明が分かれており決着していない。
  updated: '2026-11-13'
- id: muni/27-大東市
  code: '272183'
  names:
    ja: 大東市
    reading: だいとうし
    aliases:
    - 住道町
    - 四条町
    - 南郷村
  user_terms:
  - 大東という地名の由来
  - だいとう
  - 住道のある市
  - 四条畷駅のある市
  naming_type: 方位・位置による命名
  formation: 合併新設
  prefecture: 大阪府
  homonyms: []
  summary: 「大東」は昭和31年（1956年）の合併・市制施行の際に新しく生まれた市名である。大東市公式資料によれば、住道町・四条町・南郷村の2町1村が合併した際、大阪市の東部に隣接する衛星都市として飛躍的発展が期待されるという展望のもと、過去の栄光と「光は東方より」という将来への展望を託して「大東市」と命名された。合併前の中心地名である住道や、条里制の「四条」に由来するとされる四條の名は、現在も駅名などに残っている。
  first_attestation:
    era: 昭和31年
    year_western: 1956
    document: 『大東市統計書』「市名と市章の由来」
    note: 「大東」は1956年の合併・市制施行に際して命名された新しい地名で、それ以前に地名として使われた例はない。市公式資料が命名の経緯を伝える
  claims:
  - text: 大東市は住道町・四条町・南郷村の2町1村が合併して、昭和31年（1956年）4月1日に誕生したと『大東市統計書』は記している
    kind: fact
    level: E2
    status: established
    sources:
    - p3-daito-toukei
  - text: 『大東市統計書』「市名と市章の由来」は、大阪市の東部に隣接する衛星都市として飛躍的発展が期待されるという明るい展望のもと、市制のスタートを切り、過去の栄光と「光は東方より」という将来への明確な展望を託して「大東市」と命名されたと説明している
    kind: fact
    level: E2
    status: established
    sources:
    - p3-daito-toukei
  - text: 市章は「大とう」の文字をデザイン化したもので公募によって定められ、昭和31年（1956年）8月に制定された
    kind: fact
    level: E2
    status: established
    sources:
    - p3-daito-toukei
  - text: 合併した旧町村のうち「四條」の地名は条里制の「四条」に由来すると、大東市立歴史民俗資料館の館長が説明している
    kind: fact
    level: E4
    status: established
    sources:
    - p3-daito-sankei
  - text: 市内には「大東」と名のつく駅はなく、JR片町線の駅は旧町村名を残す住道・野崎・四条畷で、四条畷駅や四條畷警察署も所在地は大東市内である
    kind: fact
    level: E4
    status: established
    sources:
    - p3-daito-sankei
  - text: 市の東に望む飯盛山の名は、そのなだらかな山容がご飯を高く盛ったように見えることから名付けられたと伝えられている
    kind: legend
    level: E2
    status: indeterminate
    sources:
    - p3-daito-kentei
  - text: 大東市の地方公共団体コードは272183である
    kind: fact
    level: E2
    status: established
    sources:
    - d-cap-jlis-osaka
  column:
    title: 「大東駅」のない大東市
    text: 大東市には「大東」という名前の駅がありません。市の玄関口は旧町名を残す住道駅、そして市の北東部にある四条畷駅も、実は四條畷市ではなく大東市内にあります。この駅は明治時代に、四條畷市の四條畷神社へ参拝する鉄道の終点として開業した名残で、管轄の警察署まで「四條畷」を名乗ります。1956年に生まれた「大東」という新しい市の名前よりも、条里制や神社の参道に遡る古い地名のほうが、今も街の看板では目立っているのです。
    sources:
    - p3-daito-sankei
  relations:
  - pref/27
  - muni/27-四條畷市
  unknowns:
  - 「大東」の命名が公募によるものか協議によるものかなど、選定過程の詳細は市公式資料では確認できなかった（公募で定められたのは市章である）
  - 合併前の中心地名「住道」の語源については、典拠を確認できなかった
  updated: '2026-11-13'
- id: muni/27-大阪市
  code: '271004'
  names:
    ja: 大阪市
    reading: おおさかし
    aliases:
    - 大坂
    - 小坂
  user_terms:
  - 天下の台所
  - 大坂のまち
  - 商都
  naming_type: 中心地名の継承
  formation: 単独発足
  prefecture: 大阪府
  homonyms: []
  summary: 市名は城下町・大坂の名の継承である。地名「大坂」は蓮如の御文章を最古の用例として本願寺の寺内町とともに広まり、江戸時代を通じて「大坂」表記が主流だったが、明治10年ごろ「大阪」の表記に落ち着いた。その過程の途上で、1889年に大阪市が発足した。
  first_attestation:
    era: 明応5年
    year_western: 1496
    document: 蓮如『御文』（御文章）
    note: 大阪市公式が「文献に残る最古」とする「攝州東成郡生玉之庄内大坂」の用例。明応7年（1498年）の蓮如の消息を初見とする資料もあり、年には揺れがある（pref/27でも対立として記録）。
  claims:
  - text: 大阪市公式は、市名のいわれには諸説がありはっきりしないとしつつ、文献に残る最古の「大坂」は、室町時代に石山本願寺を建てた蓮如の御文章に書かれた「攝州東成郡生玉之庄内大坂」であると説明する。
    kind: fact
    level: E2
    status: established
    sources:
    - d-cap-osaka-city-name
  - text: 当時の文献には「大坂」とも「小坂」とも記され、いずれもオサカと発音されていたと思われると大阪市公式は説明する。
    kind: fact
    level: E2
    status: established
    sources:
    - d-cap-osaka-city-name
  - text: 江戸時代には「大坂」が多く使われ「大阪」も混用されてきたが、明治10年ごろになって、ようやく「大阪」に落ち着いた。
    kind: fact
    level: E2
    status: established
    sources:
    - d-cap-osaka-city-name
  - text: もともと「坂」と「阪」は同字で、「阪」から「坂」の字が生まれたとされ、1868年に大阪府が設置されてからも両表記は混用されていたが、明治10年代には「大阪」が一般的になった。
    kind: fact
    level: E2
    status: established
    sources:
    - d-cap-osaka-ndl
  - text: 「坂の字は土に反る（土に帰る）ので不吉として忌み、『阪』を用いるようになった」という説明が流布しているが、これは文化5年（1808年）の『摂陽落穂集』が「坂は不吉な文字として忌み嫌う人もおり、阪をもちいる人もいた」と記す言い伝えに由来するもので、改字を命じた公的記録によるものではない。
    kind: legend
    level: E2
    status: contested
    sources:
    - d-cap-osaka-ndl
  - text: 1889年4月1日、大阪府の東区・南区・西区・北区の4つの区の区域に市制が施行され、大阪市が誕生した。この年に全国で39の市が成立している。
    kind: fact
    level: E2
    status: established
    sources:
    - d-cap-osaka-tayori
  - text: 市制特例により当初の大阪市には市役所ができず、府の知事が市長の職務を行い、府の書記官が助役の職務を行った。
    kind: fact
    level: E2
    status: established
    sources:
    - d-cap-osaka-tayori
  - text: 1898年10月、市制特例の廃止を受けて田村太兵衛が初代大阪市長に就任した。
    kind: fact
    level: E2
    status: established
    sources:
    - d-cap-osaka-nenpyo
  - text: 「大坂」の語源そのものについては、大阪市公式も「いろいろな説がありはっきりとしていません」と述べており、確定していない。
    kind: fact
    level: E2
    status: indeterminate
    sources:
    - d-cap-osaka-city-name
  - text: 大阪市の地方公共団体コードは271004である。
    kind: fact
    level: E2
    status: established
    sources:
    - d-cap-jlis-osaka
  column:
    title: 府も市も、名前の表記が固まる前に生まれた
    text: 大阪府の設置は1868年、大阪市の誕生は1889年。ところが「大阪」という表記が一般的になったのは明治10年代のこととされる。つまり府も市も、「大坂」と書くか「大阪」と書くかがまだ定まらないうちに発足していたことになる。しかも字の古さでいえば、もともと坂と阪は同字で、阪から坂が生まれたというから、表記の移行は「新しい字への変更」というより「古い字への回帰」に近い。
    sources:
    - d-cap-osaka-ndl
    - d-cap-osaka-tayori
  relations:
  - pref/27
  - muni/26-京都市
  unknowns:
  - 「大坂」の語源は大阪市公式も確定していないとしており、本レコードでも諸説の決着には至らなかった。
  - 蓮如の用例の年（1496年か1498年か）は資料により異なり、原典での確定には至っていない。
  updated: '2026-11-13'
- id: muni/27-大阪狭山市
  code: '272311'
  names:
    ja: 大阪狭山市
    reading: おおさかさやまし
    aliases:
    - 狭山町
    - 狭山村
    - 狭山池
    - 狭山藩
  user_terms:
  - おおさかさやま
  - 狭山池のまち
  - さやま
  naming_type: 中心地名の継承
  formation: 改称
  prefecture: 大阪府
  homonyms: []
  summary: 「狭山」は、羽曳野丘陵と泉北丘陵に挟まれた地形に由来する古い地名で、市域の中心には日本最古級のため池・狭山池がある。もとは狭山村・狭山町だったが、1987年の市制施行の際、そのまま「狭山市」とすると埼玉県に既存の狭山市と同名になるため、府名の「大阪」を冠して大阪狭山市となった。同名回避のために自治体名へ府県名を付けた代表例である。
  first_attestation:
    era: 崇神天皇62年7月（『日本書紀』の紀年）
    year_western: null
    document: 『日本書紀』
    note: 市の歴史文化資料が、『日本書紀』崇神天皇62年7月の条に河内の狭山で用水不足を憂う詔が見えることを紹介し、『古事記』には垂仁天皇の時に狭山池を築いたとあることを記す。いずれも二次資料経由の紹介であり、紀年は伝承上のものである
  claims:
  - text: 大阪狭山市の総務省地方公共団体コードは272311である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  - text: 「狭山」の地名は、東の羽曳野丘陵と西の泉北丘陵に挟まれた、なだらかな丘陵と段丘の地形に由来すると市の資料は説明する
    kind: fact
    level: E2
    status: established
    sources:
    - x1-osakasayama-city-shisei
  - text: 市域の中心にある狭山池は日本最古のダム形式のため池といわれ、平成の改修で出土した樋管木材の年輪年代測定から、616年ごろに築造されたことがわかっている
    kind: fact
    level: E2
    status: established
    sources:
    - x1-osakasayama-city-rekishi
  - text: 『古事記』には垂仁天皇の時に狭山池を築いたとあり、『日本書紀』には河内の狭山の用水不足を憂う詔が記されていると、市の歴史文化資料は紹介している
    kind: fact
    level: E2
    status: established
    sources:
    - x1-osakasayama-city-rekibun3
  - text: 江戸時代には池尻村に陣屋を置く狭山藩（北条氏）が置かれ、明治22年（1889）に狭山村と三都村に再編、昭和6年（1931）に合併して狭山村となり、昭和26年（1951）に町制を施行して狭山町となった
    kind: fact
    level: E2
    status: established
    sources:
    - x1-osakasayama-city-rekishi
  - text: 昭和62年（1987）10月1日の市制施行にあたり、そのままでは埼玉県狭山市と同名になるため、一般公募の結果も考慮して候補の中から「大阪狭山市」という名称が決定した
    kind: fact
    level: E2
    status: established
    sources:
    - x1-osakasayama-city-rekishi
  - text: 市制に先立つ町民アンケートでは「河内狭山市」が最も多かったが、実際には行政主導で「大阪狭山市」に決まったという経緯が伝えられている
    kind: fact
    level: E5
    status: contested
    sources:
    - x1-osakasayama-wikipedia
  column:
    title: 先に名乗った方が勝ち、の地名ルール
    text: 「狭山市」という名前は、1954年に埼玉県の狭山市が先に名乗っていた。大阪の狭山町が1987年に市になるとき、この名前は使えない。公募まで行って選ばれたのが、府の名前を頭に付けた「大阪狭山市」だった。東大和市や東久留米市の「東」、宮古島市の同名回避など、日本の市名には「先行する同名都市を避ける」ための工夫が各地に残っている。大阪狭山市はその中でも、府県名をそのまま冠した分かりやすい例である。
    sources:
    - x1-osakasayama-city-rekishi
  relations:
  - pref/27
  - muni/11-狭山市
  unknowns:
  - 「狭山」の語源について、丘陵に挟まれた地形説以外の説（狭山池の築造主体との関係など）の専門文献での検討は未確認
  - 『日本書紀』『古事記』の狭山池関係記事の原文は未読で、市の資料の紹介経由で確認した
  - 公募（アンケート）の票数の内訳はWikipediaの記述のみで、市の一次資料では確認できなかった
  updated: '2026-11-13'
- id: muni/27-太子町
  code: '273813'
  names:
    ja: 太子町
    reading: たいしちょう
    aliases: []
  user_terms:
  - 太子町 聖徳太子のお墓
  - 叡福寺のある町
  - 王陵の谷の町
  naming_type: 人名に由来
  formation: 合併新設
  prefecture: 大阪府
  homonyms:
  - muni/28-太子町
  summary: 昭和31年（1956年）に磯長村と山田村が合併した際、聖徳太子にちなんで命名された町。町内には聖徳太子御廟（叡福寺）があり、天皇陵が集まる「王陵の谷」の中心に位置する。兵庫県の太子町も聖徳太子ゆかりを理由とする命名で、この層は共通するが、大阪側の根拠は太子の墓所そのものが町内にあることにある。
  first_attestation:
    era: 昭和31年
    year_western: 1956
    document: 磯長村・山田村の合併による太子町の発足（1956年9月30日）
    note: 町名としての初出。地名「太子」自体は旧磯長村の大字名として先行する
  claims:
  - text: 町公式プロフィールによれば、昭和31年（1956年）9月30日に磯長村と山田村が合併し、「聖徳太子にちなんで太子町と名付けられた」
    kind: fact
    level: E2
    status: established
    sources:
    - h6-taishi-osaka-profile
  - text: 町内には聖徳太子御廟（叡福寺）があり、敏達・用明・推古・孝徳の各天皇陵とあわせて「梅鉢御陵」と総称され、一帯は天皇・皇族級の古墳が集中する「王陵の谷」と呼ばれる
    kind: fact
    level: E2
    status: established
    sources:
    - h6-taishi-osaka-profile
  - text: 旧磯長村に属していた大字「太子」は、現在も太子町の大字として残っている
    kind: fact
    level: E2
    status: established
    sources:
    - upg-s8-taishi-geoshape-oaza
  - text: 兵庫県の太子町も、聖徳太子ゆかりの町であることを理由に昭和26年（1951年）の合併で命名されており、「聖徳太子にちなむ合併時の命名」という層は共通する（共通する層）
    kind: fact
    level: E2
    status: established
    sources:
    - h6-taishi-osaka-profile
    - h6-taishi-hyogo-wiki
  - text: 両町の違いは根拠の置きどころにあり、大阪側は聖徳太子の御廟（墓所）そのものが町内にあるのに対し、兵庫側は太子が寄進を受けた荘園（鵤荘）と斑鳩寺の伝承が根拠である（異なる層）
    kind: fact
    level: E2
    status: established
    sources:
    - h6-taishi-osaka-profile
    - h6-taishi-hyogo-ikaruga
  - text: 飛鳥時代、この一帯は大和の「遠つ飛鳥」に対して「近つ飛鳥」と呼ばれ、推古天皇によって整備された大道（のちの竹内街道）が通っていた
    kind: fact
    level: E2
    status: established
    sources:
    - h6-taishi-osaka-profile
  column:
    title: 王陵の谷の真ん中で
    text: 太子町は「天皇のお墓だらけの町」です。敏達・用明・推古・孝徳の4天皇陵と聖徳太子御廟を合わせて「梅鉢御陵」と呼び、一帯は「王陵の谷」と呼ばれます。飛鳥の都に近い「近つ飛鳥」として、皇族の墓所が集中的に営まれた土地でした。1956年の命名は、この御廟の存在を町の看板に据えたもの。兵庫県の太子町が「太子ゆかりの荘園」を看板にするのと並べると、同じ聖徳太子でも「墓」と「荘園」という対照が見えてきます。
    sources:
    - h6-taishi-osaka-profile
  relations:
  - pref/27
  - muni/28-太子町
  unknowns:
  - 大字「太子」の名がいつ・どのように御廟にちなんで付けられたかの記録は未確認
  - 1956年の合併時に他の候補名があったかどうかは未確認
  updated: '2026-11-13'
- id: muni/27-守口市
  code: '272094'
  names:
    ja: 守口市
    reading: もりぐちし
    aliases:
    - 森口
    - 守口村
    - 守口町
    - 守口宿
  user_terms:
  - 守口という名前の由来
  - 森口から守口になった市
  - 京街道の守口宿
  - 守口は大阪の入口なの
  naming_type: 中心地名の継承
  formation: 単独発足
  prefecture: 大阪府
  homonyms: []
  summary: 「守口」のもとの表記は「森口」で、室町期には河内国茨田郡の下仁和寺荘に森口村・守口村の両表記が見られ、当初は森口が多かったと『守口市史』は結論づけている。「森口」は生駒山地へ広がる原生林の入口を意味し、のちに石山本願寺・大坂城の軍事的な重要性から「守口」の字に変わったと考えられている。豊臣秀吉が大坂城の「守り口」と名づけたという有名な説は、市史では俗説と位置づけられている。京街道の宿場町・守口宿として栄え、昭和21年（1946年）に市制を施行した。
  first_attestation:
    era: 室町時代
    year_western: null
    document: 未特定（下仁和寺荘の森口村・守口村）
    note: 『守口市史』本文編第1巻によれば室町期には既に「森口」「守口」の2表記が存在し初期は「森口」が多く見られたとされるが、具体的な初出文献と年代は特定できなかった
  claims:
  - text: 『守口市史』は、室町期には既に下仁和寺庄に森口村・守口村と2つの表記が存在しており、初期は「森口」の表記が多く見られると結論づけていると郷土史資料は紹介している
    kind: fact
    level: E4
    status: established
    sources:
    - p3-moriguchi-shishi
  - text: 「森口」は、守口周辺から生駒山地へ広がっていた原生林の入り口を意味する地名であり、平凡社『大阪府の地名』も「もりぐち」はもともと森口と書かれ「森の入り口」を意味していたと説明する
    kind: fact
    level: E4
    status: established
    sources:
    - p3-moriguchi-shishi
    - l4-kadoma-shishitsu
  - text: 「森口」が「守口」に転じたのは、石山本願寺や大坂城との関係で軍事的な意味が意識されたためと考えられている
    kind: fact
    level: E4
    status: contested
    sources:
    - p3-moriguchi-shishi
    - p3-moriguchi-gogen
  - text: 豊臣秀吉が大坂城築城に伴ってこの地を「まもり口」と呼んだことが「守口」の由来だとする説は広く知られているが、室町期に既に「守口」の表記があったことから、『守口市史』を引く郷土史資料はこの説を俗言（俗説）と位置づけている
    kind: fact
    level: E4
    status: contested
    sources:
    - p3-moriguchi-shishi
  - text: 守口市公式の市史年表によれば、仁和4年（888年）に仁和寺が建立された際、朝廷は守口の地を同時に寄進し、以後この地は下仁和寺荘と呼ばれた
    kind: fact
    level: E2
    status: established
    sources:
    - p3-moriguchi-nenpyo
  - text: 守口は京街道の宿場町（守口宿）として栄え、守口市議会事務局編『もりぐち 市政の概要』によれば江戸時代の元禄年間に「守口町」と公称された
    kind: fact
    level: E4
    status: established
    sources:
    - l4-kadoma-shishitsu
  - text: 昭和21年（1946年）11月1日、守口町と三郷町が合併して市制を施行し、全国で206番目・大阪府で11番目の市として守口市が誕生した。その後、昭和32年（1957年）に庭窪町と合併して現在の市の姿になった
    kind: fact
    level: E2
    status: established
    sources:
    - p3-moriguchi-gikai
  - text: 守口市の地方公共団体コードは272094である
    kind: fact
    level: E2
    status: established
    sources:
    - d-cap-jlis-osaka
  column:
    title: 「森の入口」が「城を守る口」になった
    text: 守口の名前は、もとは「森口」でした。淀川の川洲に沿って森が広がり、その森の入口にあたる場所だったというのが『守口市史』の結論です。ところが戦国時代以降、大坂が軍事の要衝になると、同じ「もりぐち」に「守口」の字があてられるようになりました。有名な「秀吉が大坂城の守り口と名づけた」という話は、実は室町期の史料に既に「守口」の表記があるため、市史では俗説扱いです。森の入口から城の守り口へ、字の変化そのものがこの土地の役割の変化を物語っています。
    sources:
    - p3-moriguchi-shishi
    - p3-moriguchi-gogen
  relations:
  - pref/27
  - muni/27-門真市
  unknowns:
  - 「森口」「守口」の初出となる具体的な古文書と年代は特定できなかった（室町期に両表記があったことは『守口市史』の結論を郷土史資料経由で確認したにとどまる）
  - 『守口市史』本文編第1巻そのものを直接確認できておらず、市史の結論は二次的な引用経由である
  - 「守口」表記への切り替わりがいつ完了したのか（元禄年間に「守口町」と公称されたこと以上の経緯）は確認できなかった
  updated: '2026-11-13'
- id: muni/27-富田林市
  code: '272141'
  names:
    ja: 富田林市
    reading: とんだばやしし
    aliases:
    - 富田の芝
    - 富田林村
    - 富田林町
  user_terms:
  - 富田林という地名の由来
  - とんだばやしと読む理由
  - 寺内町のある市
  - じないまち富田林
  naming_type: 新規命名
  naming_note: 寺内町の建設に際して証秀上人が命名したと伝えられる地名の継承
  formation: 単独発足
  prefecture: 大阪府
  homonyms: []
  summary: 「富田林」は、戦国時代末期に生まれた計画的な宗教都市・寺内町の名前である。市公式によれば、永禄2年（1559年）に興正寺の証秀上人が「富田の芝」と呼ばれる荒芝地を切り開いて寺内町を建設し、「富田林」という呼び名は発願した証秀上人によって名付けられたという。もっとも成立を永禄3年（1560年）とする資料もあり、年には異同がある。寺内町の町並みは国の重要伝統的建造物群保存地区に選定され、昭和25年（1950年）に富田林町が市制を施行した。
  first_attestation:
    era: 永禄2年
    year_western: 1559
    document: 『興正寺御門跡兼帯所由緒書抜』（寺内町の成立と「富田林」の名を伝える由緒書）
    note: 市公式は寺内町の成立を永禄2年（1559年）とするが、永禄3年（1560年）とする辞典類もあり、年に異同がある。いずれにせよ「富田林」はこの寺内町建設の時期に生まれた名である
  claims:
  - text: 富田林市公式サイトは、富田林の起こりは永禄2年（1559年）に「富田の芝」と呼ばれる荒芝地を切り開き寺内町が建設されたことにあり、「富田林」という呼び名は、このとき寺内町建設を発願した証秀上人によって名付けられたと説明している
    kind: fact
    level: E2
    status: contested
    sources:
    - p3-tondabayashi-jinai
  - text: 寺内町の成立を永禄3年（1560年）とする辞典類もあり、『日本大百科全書（ニッポニカ）』は1560年（永禄3年）に一向宗の道場を中心に開発されたとし、『精選版日本国語大辞典』も永禄3年（1560年）に証秀上人が寺内町として開発したとしている。市公式の永禄2年（1559年）説とは年に異同がある
    kind: fact
    level: E3
    status: contested
    sources:
    - upg-s9-tondabayashi-kotobank
  - text: 証秀上人は領主から約2万坪の土地を銭百貫文で申し請け、町の建設は周辺の4か村から集められた「八人衆」と呼ばれる町人の代表によって指揮されたと富田林市公式サイトは説明している
    kind: fact
    level: E2
    status: established
    sources:
    - p3-tondabayashi-jinai
  - text: 『日本歴史地名大系』は、富田林市の市名は当地域の中心であった富田林村・富田林町に由来すると説明している
    kind: fact
    level: E3
    status: established
    sources:
    - p3-tondabayashi-kotobank
  - text: 文化庁の国指定文化財等データベースによれば、富田林寺内町は石川西側の河岸段丘上に室町時代末に開かれた興正寺別院を中心とする寺内町で、現在もほぼ寺内町の町割りをとどめており、重要伝統的建造物群保存地区に選定されている
    kind: fact
    level: E2
    status: established
    sources:
    - p3-tondabayashi-bunka
  - text: 昭和25年（1950年）4月に人口約3万人余で、大阪府下16番目の市として富田林市が誕生した
    kind: fact
    level: E2
    status: established
    sources:
    - p3-tondabayashi-gaiyo
  - text: 富田林市の地方公共団体コードは272141である
    kind: fact
    level: E2
    status: established
    sources:
    - d-cap-jlis-osaka
  column:
    title: 荒芝地に生まれた計画都市の名前
    text: 富田林は、自然に育った村の名前ではありません。戦国時代の末、石川を見下ろす台地の「富田の芝」という荒れ地を、お坊さんがお金で買い取り、土居と堀で囲んだ宗教自治都市をゼロから設計して生まれた名前です。名付け親とされるのは興正寺の証秀上人。六筋七町に整然と区画された町割りは今も残り、国の重要伝統的建造物群保存地区になっています。読みの「とんだばやし」も難読として知られ、「富田」の素直な読み「とみた」から大きく姿を変えた名前でもあります。
    sources:
    - p3-tondabayashi-jinai
    - p3-tondabayashi-bunka
  relations:
  - pref/27
  unknowns:
  - 証秀上人がなぜ「富田林」という名を選んだのか（命名の意味・理由）を明示する典拠は確認できなかった
  - 寺内町建設以前の「富田の芝」の「富田」が何に由来するか（周辺の旧村名・小地名との関係）は確認できなかった
  - 「とみたばやし」ではなく「とんだばやし」と読む音変化の経緯を説明する典拠は確認できなかった
  - 寺内町の成立年は永禄2年（1559年）と永禄3年（1560年）で資料により異なり、確定できなかった
  updated: '2026-11-13'
- id: muni/27-寝屋川市
  code: '272159'
  names:
    ja: 寝屋川市
    reading: ねやがわし
    aliases:
    - 寝屋川村
    - 寝屋川町
  user_terms:
  - ねやがわ
  - 鉢かづき姫のまち
  naming_type: 中心地名の継承
  formation: 合併新設
  prefecture: 大阪府
  homonyms: []
  summary: 市名は川の名「寝屋川」の転用である。寝屋川市広報によれば、川名はその起点付近の集落「寝屋」に由来し、1889年に合併で生まれた村が、域内を流れる川の名を村名に採用した。それが町制を経て1951年の市制施行まで受け継がれた。「寝屋」の語源自体は諸説あり確定していない。
  first_attestation:
    era: 明治22年
    year_western: 1889
    document: 寝屋川村の成立（町村制による木田・堀溝・河北・萱島流作新田の4村合併）
    note: 自治体名としての「寝屋川」の初出。川名「寝屋川」は江戸時代初期の記録に初めて登場すると市広報は伝えるが、具体的な書名は示されていない。
  claims:
  - text: 寝屋川市広報は、市名の由来である「寝屋川」という名称は、傍示川と北谷川が合流して寝屋川が始まる地にある「寝屋」という地区の地名に由来すると説明している。
    kind: fact
    level: E2
    status: established
    sources:
    - k4-neyagawa-koho
  - text: 同広報は、寝屋川が記録に初めて登場したのは江戸時代の初期で、それ以前から呼ばれていたようだがはっきりしないと述べている。
    kind: fact
    level: E2
    status: established
    sources:
    - k4-neyagawa-koho
  - text: 明治22年（1889年）4月、木田・堀溝・河北・萱島流作新田の4村が合併して寝屋川村が誕生し、4村に流れていた川の名が村名に採用され、その後、寝屋川町を経て寝屋川市へと受け継がれた。
    kind: fact
    level: E2
    status: established
    sources:
    - k4-neyagawa-koho
  - text: 昭和26年（1951年）5月3日に市制を施行し、同日制定された市章は、中央の部分が「ネ」と「矢」で「寝屋」を、周囲が「川」を表す形で市名を図案化したものである。
    kind: fact
    level: E2
    status: established
    sources:
    - k4-neyagawa-shisho
  - text: 集落名「寝屋」の語源については、星田牧の従事者の宿泊所が存在したことによるとする説と、東高野街道の旅人のための布施屋の設備があったことによるとする説が紹介されている。
    kind: fact
    level: E4
    status: contested
    sources:
    - k4-neyagawa-chimei
  - text: 「寝屋」は「ネ（川岸）」と「ヤ（湿地）」からなる地形名で、川沿いの湿地を指すのではないかという見方もある。
    kind: fact
    level: E4
    status: contested
    sources:
    - k4-neyagawa-chimei
  - text: 市内の寝屋地区には、御伽草子で知られる「鉢かづき姫」の舞台となった寝屋長者の屋敷跡と伝えられる場所があり、寝屋川市はこの伝説をたどる散策コースを設けている。
    kind: legend
    level: E2
    status: established
    sources:
    - k4-neyagawa-hachikazuki
    - k4-neyagawa-chimei
  - text: 寝屋川市の地方公共団体コードは272159である。
    kind: fact
    level: E2
    status: established
    sources:
    - d-cap-jlis-osaka
  column:
    title: お伽草子の姫が眠るまち、寝屋
    text: 「鉢かづき姫」は、継母に大きな鉢をかぶせられながらも幸せをつかむ姫の物語で、室町時代のお伽草子として知られる。その舞台とされるのが寝屋川市の寝屋地区で、姫の父とされる寝屋長者の屋敷跡と伝えられる場所が残り、市は「鉢かづき姫伝説コース」として散策路に組み入れている。川の名がまちの名になり、そのまちの一角には物語の伝承地が残る。地名と伝説が重なり合う好例である。
    sources:
    - k4-neyagawa-hachikazuki
    - k4-neyagawa-chimei
  relations:
  - pref/27
  unknowns:
  - 「寝屋」の語源は宿泊所説・布施屋説・地形説が並立し、確定していない。
  - 川名「寝屋川」の記録上の初出（江戸時代初期）について、市広報は具体的な書名を示しておらず未確認である。
  updated: '2026-11-13'
- id: muni/27-岬町
  code: '273660'
  names:
    ja: 岬町
    reading: みさきちょう
    aliases:
    - 深日
    - 多奈川
    - 淡輪
    - 孝子
  user_terms:
  - 岬町
  - みさき
  - 大阪府最南端の町
  - 深日港の町
  - みさき公園の町
  naming_type: 方位・位置による命名
  naming_note: 1955年の合併時に新しく命名。構成町村の名をいずれも採らず、海岸の岬と半島状に大阪湾へ突き出た地形を表す名（町公式の記念誌による）
  formation: 合併新設
  prefecture: 大阪府
  homonyms: []
  summary: 大阪府最南端、泉南郡の町で、大阪湾に臨み和歌山県に接する。1955年に深日町・多奈川町・淡輪村・孝子村が合併して誕生した。「岬」は合併時の新名で、町公式の記念誌によれば、海岸に岬が突出し、町全体が半島状に大阪湾へ突き出ている地形から名付けられた。古くは紀貫之『土佐日記』に「黒崎の松原」としてこの地の名が残り、中世には淡輪荘・谷川荘・深日荘の3荘園があった。千葉県にも同名の岬町がかつて存在した（現・いすみ市の一部）。
  first_attestation:
    era: 昭和30年
    year_western: 1955
    document: 深日町・多奈川町・淡輪村・孝子村の合併による新町名（1955年4月1日発足）
    note: 「岬町」としての初出は合併命名そのもの。町域の古い地名としては、10世紀の紀貫之『土佐日記』に「黒崎の松原」としてこの地が記されることが町公式の沿革に紹介されている
  claims:
  - text: 1955年（昭和30年）4月1日に泉南郡の深日町・多奈川町・淡輪村・孝子村が合併し、岬町が誕生した
    kind: fact
    level: E2
    status: established
    sources:
    - x10-misaki-town
    - x10-misaki-wiki
  - text: 町名「岬」の理由について、町公式の『岬町町制施行70周年記念誌 統計資料編』は、海岸に数本の岬が突出していることや、町全体が半島状に大阪湾へ突出していることから「岬町」と名付けられたと明記している
    kind: fact
    level: E2
    status: established
    sources:
    - upg-parent-misaki-kinenshi
  - text: 岬町は大阪府の最南端に位置し、南から西を和泉山脈に囲まれて和歌山県と接し、北は大阪湾に面する
    kind: fact
    level: E2
    status: established
    sources:
    - upg-s8-misaki-osaka-plan
  - text: 町公式の沿革によれば、紀貫之の『土佐日記』には「黒崎の松原」としてこの地の名がとどめられており、中世には町域に淡輪荘・谷川荘・深日荘の3つの荘園が存在した
    kind: fact
    level: E2
    status: established
    sources:
    - x10-misaki-town
  - text: 太閤検地によって淡輪・深日・孝子・東畑・西畑・谷川・小島の7か村が成立し、1889年の町村制では谷川・東畑・西畑・小島の4か村が合併して多奈川村が発足した
    kind: fact
    level: E2
    status: established
    sources:
    - x10-misaki-town
  - text: 千葉県にも同名の「岬町」がかつて存在したが、2005年（平成17年）12月5日に夷隅町・大原町と合併していすみ市の一部となった
    kind: fact
    level: E2
    status: established
    sources:
    - w3-isumi-city-plan
  - text: 岬町の地方公共団体コードは273660である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 唯一賛成したのに、合併できなかった町
    text: 平成の大合併で、岬町は泉佐野市・泉南市・阪南市・田尻町との合併を協議し、2005年に新市名「南泉州市」でいったん合意した。ところが住民投票では、合併に賛成多数となったのは5市町の中で岬町だけ。他の市町で反対が多数を占め、協議会は解散、構想は白紙に戻った。大阪府の最南端で、地理的にも大阪の中心から最も遠い町が、最も合併に前向きだったという逆転。結局「岬町」の名は残り、岬町は2021年に大阪府の町として初めて過疎地域に指定されるなど、単独での歩みを続けている。
    sources:
    - x10-misaki-wiki
  relations:
  - pref/27
  - muni/27-阪南市
  unknowns:
  - 1955年の合併時に「岬」の名が選ばれた過程（候補名や合併協議会での議論）を示す一次資料
  - 『土佐日記』の「黒崎の松原」の比定地の詳細
  - 「深日」「多奈川」「淡輪」「孝子」各地区名の語源
  updated: '2026-11-13'
- id: muni/27-岸和田市
  code: '272027'
  names:
    ja: 岸和田市
    reading: きしわだし
    aliases:
    - 岸和田荘
    - 岸和田村
    - 岸和田町
  user_terms:
  - だんじり祭の岸和田
  - 岸和田城の城下町
  - 岸和田という名前はどこから来たの
  - ちきり城のある市
  naming_type: 中心地名の継承
  formation: 単独発足
  prefecture: 大阪府
  homonyms: []
  summary: 「岸和田」の名は、南北朝時代の史料『和田文書』に武将・岸和田治氏らの名字として現れ、地名としては応永7年（1400年）の岸和田荘への寄進文書が初見とされる。由来では、江戸時代の地誌『泉州志』が伝える「岸と呼ばれた地に楠木一族の和田氏が住んだため『岸の和田』と呼ばれた」という説が最も有名だが、名字は治める土地の名を取るのが通例であることから、もともと地名があって氏が名乗ったとする見方も市公式資料で示されており、決着していない。岸和田城の城下町として発展し、大正11年（1922年）に大阪府下で3番目に市制を施行した。
  first_attestation:
    era: 応永7年
    year_western: 1400
    document: 足利義満御判御教書（『石清水文書』。岸和田荘の半分を石清水八幡宮寺へ寄進）
    note: 地名としての初出。なお「岸和田」の語自体は、これに先立つ延元2年（1337年）の岸和田治氏の軍忠状（『和田文書』所収）に人名（名字）として現れる
  claims:
  - text: 岸和田市公式資料は、応永7年（1400年）に足利義満が岸和田荘の半分を石清水八幡宮寺へ寄進した文書を、地名としての「岸和田」の初見史料としている
    kind: fact
    level: E2
    status: established
    sources:
    - p3-kishiwada-komonjo
  - text: 岸和田市公式資料によれば、南北朝時代の史料『和田文書』には「岸和田治氏」「岸和田快智」など、「岸和田」を名字として名乗る人物が登場する
    kind: fact
    level: E2
    status: established
    sources:
    - p3-kishiwada-chimei
  - text: 由来として最も有名なのは、元禄13年（1700年）の地誌『泉州志』が伝える説で、「岸村」と呼ばれた地に楠木正成の一族である和田高家が城郭を構えて住んだことから「岸の和田」と称し、「岸和田」という地名が生まれたとするもので、岸和田市公式の観光ページも建武元年（1334年）の和田氏の築城を地名の起こりとして紹介している
    kind: fact
    level: E2
    status: contested
    sources:
    - p3-kishiwada-chimei
    - p3-kishiwada-jo
  - text: 一方で岸和田市公式資料は、武士の名字はたいてい自分たちが治めていた土地の名前が付くものであることから、和田氏が地名を生んだのではなく、もともと「岸和田」という地名が付いていたと考える方が当時の習わしに合うと指摘しており、『泉州志』説の先後関係には疑問が示されている
    kind: fact
    level: E2
    status: contested
    sources:
    - p3-kishiwada-chimei
  - text: 「岸（キシ）」は海に面した地を指し、「和田」のワダは海を意味する古語であるため、「岸の海」からキシワダの地名が起こったとする地形由来説も唱えられている
    kind: fact
    level: E4
    status: contested
    sources:
    - p3-kishiwada-danjiri
  - text: 大正11年（1922年）11月1日、岸和田町が市制を施行して岸和田市となり、大阪市・堺市に次ぐ大阪府下3番目、全国では87番目の市制施行であった
    kind: fact
    level: E2
    status: established
    sources:
    - p3-kishiwada-100
    - p3-kishiwada-jo
  - text: 昭和17年（1942年）4月1日に春木町・山直町・南掃守村と新設合併して改めて岸和田市となり、現在の市域の骨格ができた
    kind: fact
    level: E2
    status: established
    sources:
    - p3-kishiwada-100
    - p3-kishiwada-wiki
  - text: 岸和田市の地方公共団体コードは272027である
    kind: fact
    level: E2
    status: established
    sources:
    - d-cap-jlis-osaka
  column:
    title: 大阪府に2つある「岸和田」
    text: 「岸和田」という地名は、大阪府内に実は2か所あります。もう1つは門真市内に今も残る字「岸和田」で、平安時代に後白河上皇が新日吉社の社領として寄進した荘園「岸和田庄」の名残です。岸和田市の「岸和田」とは別の場所で生まれた同名の地名です。そして岸和田市の側も、和田氏が来たから地名が生まれたのか、地名があったから和田氏が名乗ったのかという「鶏と卵」の問いに、今も結論が出ていません。
    sources:
    - p3-kishiwada-chimei
  relations:
  - pref/27
  - muni/27-門真市
  unknowns:
  - 「岸和田」の語を構成する「岸」「和田」それぞれの原義について、専門辞典による確定的な語源説明は確認できなかった
  - 延元2年（1337年）の軍忠状を「岸和田」の語の初出とする年代の裏付けは、岸和田治氏に関する二次的な記述に拠っており、軍忠状そのものの翻刻での確認は未実施
  - 岸和田城の築城者・築城年について、市教育委員会のパンフレットでも「詳しいことは不明」とされており、建武元年（1334年）の和田氏築城は伝承の域を出ない
  updated: '2026-11-13'
- id: muni/27-島本町
  code: '273015'
  names:
    ja: 島本町
    reading: しまもとちょう
    aliases:
    - 島本村
  user_terms:
  - 島本という名前の由来
  - 三島郡で唯一の町
  - 水無瀬のある町
  naming_type: 旧行政区画名の継承
  naming_note: 1889年の合併で新設された村名。命名理由は未確認
  formation: 合併新設
  prefecture: 大阪府
  homonyms: []
  summary: 1889年（明治22年）に島上郡の7村が合併して生まれた島本村を前身とし、1940年に町制を施行した町。名の前半は旧郡名「島上」に通じると考えられるが、「島本」の命名理由を明示する公的・専門資料は確認できていない。広瀬・東大寺地区の「水無瀬」は『万葉集』の時代からの歌枕として知られる。
  first_attestation:
    era: 明治22年
    year_western: 1889
    document: 町村制施行による島本村の発足（島上郡7村の合併）
    note: 町名「島本」としての初出はこの命名そのもの。それ以前に「島本」という地名が存在したかどうかは未確認
  claims:
  - text: 1889年（明治22年）に島上郡の桜井・高浜・広瀬・東大寺・山崎・尺代・大沢の7村が合併して島本村が誕生し、1940年（昭和15年）4月1日に町制を施行して島本町となった
    kind: fact
    level: E2
    status: established
    sources:
    - x11-shimamoto-80th
  - text: 所属していた島上郡は、701年（大宝元年）の大宝律令の施行にともなって三島郡が二つに分けられて生まれた郡で、当初は三島上郡とも称され、のちに島上郡と書かれるようになった
    kind: fact
    level: E4
    status: established
    sources:
    - upg-s2-takatsuki-historia
    - upg-s2-mishimagun-kotobank
  - text: 1896年（明治29年）に島上郡・島下郡が合併して三島郡が成立し、現在の島本町は三島郡で唯一の町である
    kind: fact
    level: E3
    status: established
    sources:
    - upg-s2-mishimagun-kotobank
  - text: 広瀬・東大寺地区は「水無瀬」と呼ばれ東大寺の荘園で、『万葉集』の時代から歌枕として知られた。後鳥羽上皇が水無瀬離宮を造営し、没後その跡は水無瀬宮（現在の水無瀬神宮）となった
    kind: fact
    level: E2
    status: established
    sources:
    - x11-shimamoto-rekishi
  - text: 桜井地区は『太平記』に描かれた楠木正成・正行父子の「桜井の別れ」の地で、町章は「嶋本」の字を楠木氏の家紋である菊水紋に似せて変形したものである
    kind: fact
    level: E2
    status: established
    sources:
    - upg-s2-sakurai-osaka
    - upg-s2-shimamoto-tokei
  - text: 「島本」という名は郡名「島上」の「島」の側に由来する部分を含むと考えられるが、「本」の字の由緒を含め、命名理由を明示する公的・専門資料は確認できなかった
    kind: fact
    level: H
    status: inferred
    sources:
    - x11-shimagami-wiki
  - text: 地方公共団体コードは273015である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 菊水紋になった町名
    text: 島本町の町章は、漢字の「嶋本」を上下に割り、上半分を菊の花、下半分を水の流れに見立てたデザインです。モデルは楠木氏の菊水紋。町内の桜井は、湊川の戦いに向かう楠木正成が嫡子・正行と別れた「桜井の別れ」の地とされ、『太平記』の名場面として知られます。合併で生まれた新しい村名が、やがて中世の武将の紋を取り込んで町の顔になったわけです。
    sources:
    - x11-shimamoto-wiki
    - x11-shimamoto-rekishi
  relations:
  - pref/27
  unknowns:
  - 「島本」の命名理由（「島」と「本」の字の由来）は公的・専門資料で未確認
  - 1889年以前に「島本」という地名が存在したかどうかは未確認
  updated: '2026-11-13'
- id: muni/27-忠岡町
  code: '273414'
  names:
    ja: 忠岡町
    reading: ただおかちょう
    aliases:
    - 忠岡村
  user_terms:
  - 日本一面積の小さい町
  - 忠岡という名前の由来
  - 忠行の丘の町
  naming_type: 中心地名の継承
  formation: 編入合併
  prefecture: 大阪府
  homonyms: []
  summary: 1889年（明治22年）に和泉郡の4村が合併した際、もとの忠岡村の名を継承して生まれた町。面積3.97km²で日本一面積の小さい町とされる。「忠岡」の由来には、平忠度の子・忠行が戦死した地とする伝承が語られる。
  first_attestation:
    era: 明治22年
    year_western: 1889
    document: 町村制施行による忠岡村の発足（忠岡村・馬瀬村・北出村・高月村の合併）
    note: 村名「忠岡」は合併前から存在した旧村名の継承であり、その初出そのものは未確認
  claims:
  - text: 1889年（明治22年）4月1日、和泉郡の忠岡村・馬瀬村・北出村・高月村が合併して新しい忠岡村が発足し、村名はもとの忠岡村の名を継承した
    kind: fact
    level: E2
    status: established
    sources:
    - upg-s2-tadaoka-history
  - text: 1939年（昭和14年）10月1日に町制を施行して忠岡町となった
    kind: fact
    level: E2
    status: established
    sources:
    - upg-s2-tadaoka-history
  - text: 面積は3.97km²で、日本一面積の小さい町である
    kind: fact
    level: E2
    status: established
    sources:
    - upg-q10-gsi-menseki
  - text: 源平の時代、平忠度の子・忠行が父を逃がすため今井兼滋の軍勢を食い止めて戦死し、村人が丘を築いて葬って「忠行の丘」と呼んだことが「忠岡」の由来と伝わる
    kind: legend
    level: E4
    status: established
    sources:
    - x11-tadaoka-nankai
  - text: 1889年の村名は合併前の忠岡村の名の継承であり、「忠行の丘」の伝承は行政名としての成立ではなく、その旧村名の由来譚として位置づけられる（異なる層）
    kind: fact
    level: E4
    status: established
    sources:
    - upg-s2-tadaoka-history
    - x11-tadaoka-nankai
  - text: 2003年（平成15年）に岸和田市との合併協議会が設置されたが、住民投票で否決され、合併は実現しなかった
    kind: fact
    level: E5
    status: established
    sources:
    - x11-tadaoka-wiki
  - text: 地方公共団体コードは273414である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 日本一小さい町の、大きな伝説
    text: 面積わずか3.97km²、日本一小さい町に、平家の武将の子の最期の伝説が残っています。平忠度の子・忠行が父を逃がすために敵を食い止めて戦死し、村人がその丘を「忠行の丘」と呼んだ——町名の「忠」はこの孝子・忠臣の物語に結びつけられて語られてきました。伝承の真偽はともかく、小さな町の名に大きな物語が宿っているのが忠岡です。
    sources:
    - x11-tadaoka-nankai
    - x11-tadaoka-wiki
  relations:
  - pref/27
  unknowns:
  - 旧忠岡村の名の初出と命名の経緯は未確認
  - 「忠行の丘」伝承がいつ頃から語られるようになったかは未確認
  updated: '2026-11-13'
- id: muni/27-摂津市
  code: '272248'
  names:
    ja: 摂津市
    reading: せっつし
    aliases:
    - 三島町
    - 三島市
    - 味舌町
  user_terms:
  - せっつ
  - 旧国名の市
  - 三島町
  naming_type: 旧国名・広域地名の採用
  formation: 改称
  prefecture: 大阪府
  homonyms: []
  summary: 市名「摂津」は旧令制国名を採ったもの。前身の三島町（1956年発足）は三島郡の郡名による町名だったが、1966年11月1日の市制施行にあたっては、静岡県三島市との同名を避ける必要があった。新市名は全国公募で選ばれ、古く大阪・北摂・兵庫東部一帯を指した広域の名「摂津」が採用された。法令上はいったん「三島市」が発足し、同日付で「摂津市」へ改称する手続きが取られた。
  first_attestation:
    era: 昭和41年
    year_western: 1966
    document: 摂津市条例第26号「名称を変更する条例」・自治省告示第146号
    note: 市名「摂津市」の初出は1966年の条例・告示である。「摂津」自体は古代の令制国名で、本来は大阪市の大部分から兵庫県東部にわたる広い地域の呼称だった
  claims:
  - text: 摂津市の総務省地方公共団体コードは272248である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  - text: 昭和31年（1956）に三島郡の味舌町・味生村・鳥飼村が合併して三島町が発足した。「三島」は所属する三島郡の郡名による町名である
    kind: fact
    level: E2
    status: established
    sources:
    - x1-settsu-city-50th
  - text: 昭和41年（1966）11月1日、三島町は市制を施行して大阪府内28番目の市となり、同日に「摂津市」へ改称した
    kind: fact
    level: E2
    status: established
    sources:
    - x1-settsu-city-50th
  - text: 法令上の手続きでは、三島町はまず「三島市」となり、その名称を同日付で「摂津市」に変更することとされた（摂津市条例第26号、大阪府告示第945号、自治省告示第146号）
    kind: fact
    level: E1
    status: established
    sources:
    - x1-settsu-city-jorei
  - text: 改称の背景には、静岡県に既存の三島市との同名を回避する事情があった
    kind: fact
    level: E2
    status: established
    sources:
    - x1-settsu-uub
  - text: 新市名「摂津」は全国公募で選ばれ、1,200通を超える応募があった
    kind: fact
    level: E2
    status: established
    sources:
    - x1-settsu-city-50th
  - text: 「摂津」は旧令制国の名で、古くは現在の大阪市の大部分、大阪府の淀川以北部、兵庫県三田市から神戸市の大半にわたる広範囲な地域の呼称だった
    kind: fact
    level: E2
    status: established
    sources:
    - x1-settsu-city-tokei
  column:
    title: 一瞬だけ存在した「三島市」
    text: 摂津市の誕生には、法令上の面白い瞬間がある。手続きの上では、1966年11月1日に三島町はまず「三島市」として市制を施行し、その同じ日に「摂津市」へ名前を変えたことになっている。つまり大阪府の「三島市」は、書類の上でのみ、同名の静岡県三島市と一瞬だけ併存した。そして選ばれた新しい名前は、町村名でも合併前の村名でもなく、千年以上前にこの一帯全体を指していた国の名前だった。公募で寄せられた1,200通を超える応募の中から、人々は最も大きな名前を選んだのである。
    sources:
    - x1-settsu-city-jorei
    - x1-settsu-city-50th
  relations:
  - pref/27
  unknowns:
  - 公募で「摂津」が何票で選ばれたかなど、選考過程の詳細は市の記念誌の範囲では確認できなかった
  - 三島郡の郡名自体の由来（古代の三島郡の成立事情）は本レコードの範囲外として未確認
  updated: '2026-11-13'
- id: muni/27-東大阪市
  code: '272272'
  names:
    ja: 東大阪市
    reading: ひがしおおさかし
    aliases: []
  user_terms:
  - ひがしおおさか
  - 三市合併のまち
  naming_type: 方位・位置による命名
  formation: 合併新設
  prefecture: 大阪府
  homonyms: []
  summary: 市名は1967年の3市合併で生まれた新名である。東大阪市公式によれば、「東大阪市」という呼び名は合併以前から市民に親しみをもって呼称されてきた通称で、新市が地域の中核都市として発展するにふさわしい名称として、合併前の1966年8月に決定された。翌1967年2月1日、布施市・河内市・枚岡市が合併して東大阪市が誕生した。
  first_attestation:
    era: 昭和41年
    year_western: 1966
    document: 合併に先立つ新市名称の決定（1966年8月）
    note: 「東大阪」の呼称自体は合併以前からこの地域を指す通称として市民に使われていたもので、1966年8月に正式な市名として決定された。
  claims:
  - text: 昭和42年（1967年）2月1日、布施市・河内市・枚岡市の3市が合併して東大阪市が誕生した。
    kind: fact
    level: E2
    status: established
    sources:
    - k4-higashiosaka-ayumi
  - text: 東大阪市公式は、「東大阪市」という呼び名は三市合併以前から市民に親しみをもって呼称されてきたものであり、将来この新しい市が地域の中核都市として発展するにふさわしい名称であるとして、合併前の昭和41年（1966年）8月に決定したと説明している。
    kind: fact
    level: E2
    status: established
    sources:
    - k4-higashiosaka-50nen
  - text: 昭和44年（1969年）7月、東大阪市の人口は50万人を突破し、当時、人口50万人以上の都市は全国で15番目であった。
    kind: fact
    level: E2
    status: established
    sources:
    - k4-higashiosaka-ayumi
  - text: 前身の一つである旧布施町では、昭和7年（1932年）3月に給水が開始されており、これは現在の東大阪市水道の起点となっている。
    kind: fact
    level: E2
    status: established
    sources:
    - k4-higashiosaka-suido
  - text: 2017年には市制施行（合併）50周年を迎え、市政だよりは市名の由来を含む特集「東大阪市50年のあゆみ」を組んだ。
    kind: fact
    level: E2
    status: established
    sources:
    - k4-higashiosaka-50nen
  - text: 東大阪市の地方公共団体コードは272272である。
    kind: fact
    level: E2
    status: established
    sources:
    - d-cap-jlis-osaka
  column:
    title: 通称がそのまま市名になったまち
    text: 市同士の合併では、どの旧市名を残すかが揉め事の種になりやすい。ところが1967年の布施・河内・枚岡の合併では、3市のどれでもない「東大阪市」が選ばれた。決め手は格付けではなく日常の言葉だった。この一帯は合併前から市民に「東大阪」と呼ばれており、その通称が「地域の中核都市にふさわしい名称」として1966年8月に正式採用されたのである。行政が作った名前が市民に浸透するのではなく、市民の呼び名が行政を追認させた、珍しい順序の命名だった。
    sources:
    - k4-higashiosaka-50nen
  relations:
  - pref/27
  - muni/27-大阪市
  unknowns:
  - 1966年の市名決定の際、「東大阪市」以外にどのような候補が検討されたかは、確認した市の公式資料には記載がなかった。
  - 前身3市（布施市・河内市・枚岡市）それぞれの市制施行年は、本レコードの調査範囲では公式資料で個別に確認していない。
  updated: '2026-11-13'
- id: muni/27-松原市
  code: '272175'
  names:
    ja: 松原市
    reading: まつばらし
    aliases:
    - 松原庄
    - 松原村
    - 松原町
  user_terms:
  - 松原という地名の由来
  - まつばら
  - 河内松原
  - 丹比柴籬宮のあった地
  naming_type: 中心地名の継承
  formation: 合併新設
  prefecture: 大阪府
  homonyms: []
  summary: 「松原」は平安時代の荘園名「松原荘」に遡る地名で、松原市公式によれば久安4年（1148年）の『御室御所高野山御参籠日記』に「松原庄」と記されたのが初見である。松原荘は京都太秦の広隆寺領で、その名は中世・近世を通じて受け継がれ、当地の中心だった松原村・松原町を経て市名となった。なぜ「松原」と呼ばれたのかについては市公式も「よく分かりません」としており、松の緑と瑞穂の景観があったのではないかという推測が紹介されるにとどまる。昭和30年（1955年）に松原町など5町村の合併で市制を施行した。
  first_attestation:
    era: 久安4年
    year_western: 1148
    document: 『御室御所高野山御参籠日記』
    note: 市公式が「松原」の初見とする。仁和寺の覚法法親王が高野山参籠の途上に松原に至った記事に「子刻許、到着松原庄」と記される
  claims:
  - text: 松原市公式サイトは、「松原」の名の初見は平安時代の『御室御所高野山御参籠日記』の久安4年（1148年）閏6月10日および11日条で、仁和寺の覚法法親王が高野山参籠のため松原に至った記事であり、史料には「子刻許、到着松原庄∧広隆寺庄∨」と記されていると紹介している
    kind: fact
    level: E2
    status: established
    sources:
    - p3-matsubara-meishou
  - text: 松原荘は京都太秦の広隆寺領で、現在の近鉄河内松原駅南側の上田・新堂・岡地区に該当し、平安時代の松原荘の名が中世・近世・近現代と続いて現在の市名に受け継がれていると松原市公式サイトは説明している
    kind: fact
    level: E2
    status: established
    sources:
    - p3-matsubara-meishou
  - text: 『日本歴史地名大系』は、松原市の市名は近世から近代を通じ当地辺りの中心であった松原村・松原町によると説明している
    kind: fact
    level: E3
    status: established
    sources:
    - p3-matsubara-kotobank
  - text: 当地がなぜ「松原」という名になったのかは市公式も「よく分かりません」としており、考古学者の末永雅雄は『松原市史』（1985年）の序文で、市域はかつて松の緑と黄金の瑞穂の景観をもっていたかもしれないと述べたにとどまる
    kind: fact
    level: E2
    status: indeterminate
    sources:
    - p3-matsubara-meishou
  - text: 松原市公式サイトは、市域にあたる地について、『日本書紀』に第18代反正天皇が丹比柴籬宮を置いたと記されること、古墳時代には竹内街道が通り交通の要所だったことを紹介している
    kind: fact
    level: E2
    status: established
    sources:
    - p3-matsubara-rekishi
  - text: 昭和30年（1955年）2月1日に松原町・天美町・布忍村・恵我村・三宅村の5町村が合併して松原市が発足し、昭和32年（1957年）10月15日に北八下村を編入した
    kind: fact
    level: E4
    status: established
    sources:
    - p3-matsubara-localhist
    - p3-matsubara-shisho
  - text: 松原市の地方公共団体コードは272175である
    kind: fact
    level: E2
    status: established
    sources:
    - d-cap-jlis-osaka
  column:
    title: マツとバラを合わせると「マツバラ」
    text: 松原の名の由来は、市の公式見解をもってしても「よく分かりません」。平安時代の荘園名がそのまま残ったものの、なぜ松原と呼ばれたのかは謎のままです。ところが昭和50年（1975年）、市制20周年を機に市の木にマツ、市の花にバラが制定されました。合わせると「マツバラ」。由来の分からない名前に、語呂合わせで新しい意味を重ねたのです。いま市内のあちこちで見かけるマツとバラは、名付けの謎への、市の側からのささやかな回答でもあります。
    sources:
    - p3-matsubara-meishou
  relations:
  - pref/27
  - muni/27-羽曳野市
  unknowns:
  - 「松原」という地名の語源（なぜ松原と呼ばれたか）は市公式・専門辞典のいずれでも確定しておらず、松の植生との関係も推測の域を出ない
  - 松原荘の成立時期など、久安4年（1148年）の初見以前の経緯は確認できなかった
  updated: '2026-11-13'
- id: muni/27-枚方市
  code: '272108'
  names:
    ja: 枚方市
    reading: ひらかたし
    aliases:
    - 枚方里
    - 枚方宿
  user_terms:
  - ひらかた
  - 京街道の宿場町
  - 樟葉宮のまち
  naming_type: 中心地名の継承
  formation: 単独発足
  prefecture: 大阪府
  homonyms: []
  summary: 市名は古代の「枚方里」の継承である。奈良時代初頭の『播磨国風土記』は、播磨に同名の里ができた由来として河内国茨田郡の枚方里の存在を伝えており、河内の枚方はそれ以前から知られた地名だった。一方、「ひらかた」の語源そのものは枚方市公式も「わからない」としており、確定していない。1947年に市制を施行した。
  first_attestation:
    era: 和銅6年〜霊亀元年
    year_western: 713
    document: 『播磨国風土記』揖保郡条
    note: 播磨国の枚方の里の名の由来を述べる中で「河内の国、茨田の郡の枚方の里」に言及する形で現れる。河内の枚方里の成立はこれ以前に遡るはずだが、年代は未確認である（成立年は713〜715年の幅がある）。
  claims:
  - text: 枚方市公式の概説は、いつのころから「ひらかた」と呼ばれるようになったのかは分からないとしながら、『播磨国風土記』に「河内国茨田郡枚方里」と記されていることを紹介している。
    kind: fact
    level: E2
    status: established
    sources:
    - k4-hirakata-ayumi
  - text: 郷土史の解説は、『播磨国風土記』揖保郡条に「枚方と名づる所以は、河内の国、茨田の郡の枚方の里の漢人、来たりて初めてこの村に居りき」という記事があり、播磨の枚方の里は河内の枚方里からの移住者にちなむ名であることを紹介している。
    kind: fact
    level: E4
    status: established
    sources:
    - k4-hirakata-fudoki
  - text: 枚方市公式の概説が「いつのころから『ひらかた』と呼ばれるようになったのかはわかりません」と述べるとおり、「ひらかた」の語源は確定していない。
    kind: fact
    level: E2
    status: indeterminate
    sources:
    - k4-hirakata-ayumi
  - text: 一説に、神武東征の説話に現れる「白肩津（しろかたつ）」という地名が転化して「枚方」になったともいわれる。
    kind: legend
    level: E4
    status: contested
    sources:
    - k4-hirakata-fudoki
  - text: 枚方市公式は、『日本書紀』によれば越前から迎えられた男大迹王（後の継体天皇）が507年に樟葉で即位し、5年にわたり宮を営んだとされ、交野天神社境内が樟葉宮跡の伝承地であると紹介している。
    kind: fact
    level: E2
    status: established
    sources:
    - k4-hirakata-kusuha
  - text: 江戸時代には、岡新町・岡・三矢・泥町の4か村が枚方宿に指定されて京街道の宿場町を形成し、淀川を上下する過書船の中継地としても賑わった。
    kind: fact
    level: E2
    status: established
    sources:
    - k4-hirakata-ayumi
  - text: 昭和22年（1947年）8月1日に市制を施行し、昭和30年（1955年）に津田町を合併して現在の市域となった。
    kind: fact
    level: E2
    status: established
    sources:
    - k4-hirakata-ayumi
  - text: 枚方市の地方公共団体コードは272108である。
    kind: fact
    level: E2
    status: established
    sources:
    - d-cap-jlis-osaka
  column:
    title: もう一つの枚方は「平方」になった
    text: 『播磨国風土記』が伝えるもう一つの「枚方」は、播磨国揖保郡（現在の兵庫県たつの市方面）にあった里で、河内の枚方から移り住んだ人々にちなむ名だったとされる。興味深いことに、播磨の枚方は後に「平方」と書かれるようになったという。残った大阪の枚方は、初見の古さに反して読み方が難しく、「まいかた」「まきかた」と読み間違えられることの多い地名として知られる。同じ名前から出発した二つの里は、表記の運命まで分かれたことになる。
    sources:
    - k4-hirakata-fudoki
    - k4-hirakata-ayumi
  relations:
  - pref/27
  unknowns:
  - 「ひらかた」の語源は枚方市公式も不明としており、白肩津転化説を含め決着はついていない。
  - 枚方里について『和名類聚抄』での郡・郷の記載と読みは、確認できなかった。
  updated: '2026-11-13'
- id: muni/27-柏原市
  code: '272213'
  names:
    ja: 柏原市
    reading: かしわらし
    aliases:
    - 柏原町
    - 柏原村
  user_terms:
  - かしわら
  - 亀の瀬
  - 河内柏原
  - 大和川の付け替え
  naming_type: 中心地名の継承
  formation: 分村・分立
  prefecture: 大阪府
  homonyms: []
  summary: 柏原市は大阪府東部、大和川が亀の瀬の難所を抜けて大阪平野へ流れ出る地点にある市である。市名は当地の発展の中核となってきた旧志紀郡柏原村・柏原町に由来するが、「柏原」という地名そのものの語源は専門辞典でも特定されておらず、初見は近世とされる。1704年の大和川付け替え工事の起点となった、水陸交通の要衝でもある。
  first_attestation:
    era: 近世
    year_western: null
    document: 柏原村
    note: 『日本歴史地名大系』が「柏原」の地名の初見を近世の柏原村とする。具体的な文書名・年次は同書も示していない。
  claims:
  - text: 『日本歴史地名大系』は、市名となった柏原は当地の発展の中核となってきた旧志紀郡柏原村、それに続く柏原町からきていると説明する
    kind: fact
    level: E2
    status: established
    sources:
    - x2-kashiwara-kotobank
  - text: 『日本歴史地名大系』によれば「柏原」の地名の初見は近世の柏原村であり、それ以前に当地を指す用例は確認されておらず、語源は特定されていない
    kind: fact
    level: E3
    status: indeterminate
    sources:
    - x2-kashiwara-kotobank
  - text: 古代の人名として河内国渋川郡の人「柏原広山」が見えるが、これは当地の志紀郡とは別の郡の人名であり、地名「柏原」との関係は確認できない
    kind: fact
    level: E3
    status: established
    sources:
    - x2-kashiwara-kotobank
  - text: 1889年に柏原村と市村新田が合併して志紀郡柏原村が発足し、1915年に町制して柏原町となり、堅上村・堅下村、国分町との合併を経て1958年10月1日に市制を施行して柏原市となった
    kind: fact
    level: E2
    status: established
    sources:
    - x2-kashiwara-enkaku
  - text: 市内を流れる大和川は亀の瀬の峡谷を経て大阪平野へ流れ出ており、元禄17年（1704）の大和川付け替え工事は柏原を起点に行われた
    kind: fact
    level: E2
    status: established
    sources:
    - x2-kashiwara-yamatogawa
  - text: 市の文化財課の調査によれば『続日本紀』『万葉集』など奈良時代の文献に「亀の瀬」の名は見えずこの付近は「竜田山」と見え、「亀瀬」の名を確認できる古い例は平安時代末期成立の『扶桑略記』にある治安3年（1023）の記事である
    kind: fact
    level: E2
    status: established
    sources:
    - x2-kashiwara-kamenose
  - text: 総務省の全国地方公共団体コードで、柏原市の団体コードは272213と定められている
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 柏原市の「柏」はカシワではない
    text: 地名に「柏」の字を持つ柏原市だが、市の木に選ばれているのはカシワではなくコノテガシワである。柏原市の統計書によれば、市の木は「柏（コノテガシワ）」で、市章も柏原の「カ」と「ハ」の字を図案化したものだという。常緑のコノテガシワはヒノキ科の針葉樹で、落葉樹のカシワとは全く別の木である。地名の「柏原」の語源自体が特定されていない以上、市の木の「柏」を地名の由来と結びつけることはできないが、同字異物の取り合わせはこの市の小さな見どころである。
    sources:
    - x2-kashiwara-tokei
    - x2-kashiwara-kotobank
  relations:
  - pref/27
  unknowns:
  - 「柏原」の語源（カシワの原とするような説に史料的裏付けがあるかどうか）
  - 近世の柏原村の初出文書の特定
  - 中世以前の当地の地名表記の変遷
  updated: '2026-11-13'
- id: muni/27-池田市
  code: '272043'
  names:
    ja: 池田市
    reading: いけだし
    aliases:
    - 池田村
    - 池田町
    - 呉庭荘
  user_terms:
  - 池田という地名の由来
  - 呉服の里の池田
  - 池田城のあった市
  - カップヌードル発祥の池田
  naming_type: 中心地名の継承
  formation: 単独発足
  prefecture: 大阪府
  homonyms: []
  summary: 池田の名は中世に現れる地名である。古代の摂津国豊島郡に「池田郷」はなく、市域は秦上郷・秦下郷・豊島郷などと呼ばれ、11世紀には荘園の呉庭荘（くれはのしょう）が成立していた。『日本歴史地名大系』は、池田の地名は式内社・伊居太（いけだ）神社の遷座にちなむともいわれるが不詳とする。鎌倉時代末期から「池田」と呼ばれるようになったとされ、国人の池田氏が築いた池田城の城下町として発展し、昭和14年（1939年）に市制を施行した。
  first_attestation:
    era: 鎌倉時代末期（13世紀末）
    year_western: null
    document: 未特定
    note: 池田市歴史文化基本構想は、13世紀末に池田氏の祖先と思われる藤原景正が建立した石造物が残ることから、地名として「池田」が使われるのもこの頃からと考えられるとする。具体的な初出文献は特定できていない
  claims:
  - text: 池田市公式の沿革によれば、古墳時代から奈良時代にかけて市域には渡来系氏族の秦氏が居住し、秦上郷・秦下郷・豊島郷などと呼ばれていた
    kind: fact
    level: E2
    status: established
    sources:
    - p3-ikeda-enkaku
  - text: 『日本歴史地名大系』は、市名ともなった池田の地名について、もと川辺郡小坂田村（現在の伊丹市）にあったという式内社・伊居太（いけだ）神社の遷座にちなむともいわれるが不詳であるとし、『和名類聚抄』東急本にみえる豊島郡の七郷の中にも「池田郷」は含まれていない
    kind: fact
    level: E3
    status: indeterminate
    sources:
    - p3-ikeda-kotobank
  - text: 池田市歴史文化基本構想によれば、11世紀に河内国土師の里（現在の藤井寺市あたり）出身の土師氏によって開発された荘園・呉庭荘（くれはのしょう）が市域に成立した
    kind: fact
    level: E2
    status: established
    sources:
    - p3-ikeda-kousou
  - text: 池田には、呉の国から来た呉織（クレハトリ）と穴織（アヤハトリ）の姉妹が機織りの技術を伝えたという伝承があり、市の歴史文化基本構想は『日本書紀』の記述を題材にしたもので史実ではないと断ったうえで、船が着いたという唐船が淵、糸を染めた染殿井、星明かりのもとで機を織った星の宮、織り上げた絹を干した絹掛けの松など、物語の各場面に対応する旧跡が残ると紹介している
    kind: legend
    level: E2
    status: established
    sources:
    - p3-ikeda-kousou
  - text: 池田市公式の沿革は「室町時代に土豪の池田氏が大きな勢力を持つようになり、この頃から『池田』という地名が生まれたといわれている」と述べる一方、市の歴史文化基本構想は13世紀末には地名として「池田」が使われていたと考えられるとしており、池田氏が地名を生んだのか地名が氏に先行したのかは確定していない
    kind: fact
    level: E2
    status: contested
    sources:
    - p3-ikeda-enkaku
    - p3-ikeda-kousou
  - text: 池田市歴史文化基本構想によれば、池田氏は中世に五月山南麓へ池田城を築いたと考えられ、応仁・文明の乱では池田充政が細川方についたため大内氏に攻められ、池田城は落城した
    kind: fact
    level: E2
    status: established
    sources:
    - p3-ikeda-kousou
  - text: 明治22年（1889年）に池田村が町制を施行して池田町となり、昭和10年（1935年）に細河村・北豊島村・秦野村と合併し、昭和14年（1939年）4月29日、人口約3万6千人をもって大阪府下で6番目に市制を施行した
    kind: fact
    level: E2
    status: established
    sources:
    - p3-ikeda-enkaku
  - text: 池田市の地方公共団体コードは272043である
    kind: fact
    level: E2
    status: established
    sources:
    - d-cap-jlis-osaka
  column:
    title: 「呉服」という言葉が生まれた里
    text: 「池田」という名前より古い層に、この地の古名「呉服（くれは）の里」があります。伝承では、呉の国から渡ってきた呉織・穴織の姉妹が機織りを伝え、呉織は呉服媛として呉服神社に祭られました。池田市観光協会はこの呉服神社を「呉服」という言葉の発祥の地として紹介しています。今も市内には呉服町・呉服橋・呉服神社の名が残り、地元の人は呉服神社を「下の宮さん」、伝承の妹姫・穴織を祭る伊居太神社を「上の宮さん」と呼び分けています。
    sources:
    - p3-ikeda-kanko
    - p3-ikeda-kousou
  relations:
  - pref/27
  - muni/27-和泉市
  unknowns:
  - 「池田」という地名そのものの語源は『日本歴史地名大系』も「不詳」としており、伊居太神社遷座説以外の裏付けのある説明は確認できなかった
  - 「池田」の初出を示す具体的な古文書は特定できなかった（13世紀末という推定は市の歴史文化基本構想による）
  - 摂津池田氏の発祥を和泉国池田村（現在の和泉市域）とする系譜伝承があり、豊島郡の池田という地名との先後関係は確認できなかった
  updated: '2026-11-13'
- id: muni/27-河内長野市
  code: '272167'
  names:
    ja: 河内長野市
    reading: かわちながのし
    aliases:
    - 長野村
    - 長野町
  user_terms:
  - 河内長野という地名の由来
  - かわちながの
  - 奥河内の市
  - 楠木正成ゆかりの地
  naming_type: 合成地名
  formation: 合併新設
  prefecture: 大阪府
  homonyms: []
  summary: 「河内長野」は、中心地名「長野」に旧国名「河内」を冠した合成地名である。昭和29年（1954年）に長野町など1町5村が合併して市制を施行する際、新市名は住民公募で寄せられた196の候補名の中から最も多かった「河内長野市」に決定したと市公式の講座で紹介されている。一方で、「河内」を冠したのは長野県長野市との重複を避けるためだとする説明もあり、理由の説明は資料により異なる。中心地名「長野」の語源についても、水神に由来するという説が市立図書館の講座で紹介されるなど、定説は定まっていない。
  first_attestation:
    era: null
    year_western: null
    document: 未特定
    note: 中心地名「長野」は近世の錦部郡長野村に遡るが、村名としての初出文献は特定できなかった
  claims:
  - text: 河内長野市は、昭和29年（1954年）に1町5村が合併して誕生したと、河内長野市公式サイトの市制70周年記念講座の報告は伝えている
    kind: fact
    level: E2
    status: established
    sources:
    - p3-kawachinagano-koza
  - text: 合併した1町5村は長野町・三日市村・高向村・加賀田村・天見村・川上村で、中心の長野町は、明治22年（1889年）の町村制で発足した長野村が明治43年（1910年）に町制を施行して長野町となったものである
    kind: fact
    level: E2
    status: established
    sources:
    - upg-s9-kawachinagano-hensen
  - text: 新市名は住民公募で寄せられた196の候補名の中から最も多かった「河内長野市」に決定し、候補には「楠公市」「楠美市」「楠光市」など楠木正成にちなむ名もあったと、市立図書館の講師による講座で紹介された
    kind: fact
    level: E2
    status: established
    sources:
    - p3-kawachinagano-koza
  - text: 「河内」を冠した理由について、地名の由来を扱う資料は長野県長野市と重複しないよう旧国名の「河内」を冠したものと説明するが、市公式の講座では公募で最も多かった名に決定したとされており、理由の説明は資料により異なる
    kind: fact
    level: E5
    status: contested
    sources:
    - p3-kawachinagano-folklore
    - p3-kawachinagano-koza
  - text: 「長野」の「なが」という音には水神の意味があり、長い土地ではなく水神の地が「長野」の語源である可能性もあると、市立図書館の講師による講座で紹介された
    kind: fact
    level: E2
    status: contested
    sources:
    - p3-kawachinagano-koza
  - text: 一方、地名の由来を扱う資料は「長野」を「ナガ（川沿いの長い土地）・ノ（野）」と解する通説的な説明を紹介しており、「長野」の語源は定まっていない
    kind: fact
    level: E5
    status: contested
    sources:
    - p3-kawachinagano-folklore
  - text: 市域は古代の河内国錦部郡に属し、文武天皇3年（699年）に錦部郡鳩原の犬養広麻呂が白鳩を献上したことが『続日本紀』に記され、市域の地名が中央の記録に現れる最も早い例とされると、郷土史サイト「ローカルヒストリア」は紹介している
    kind: fact
    level: E4
    status: established
    sources:
    - p3-kawachinagano-localhist
  - text: 河内長野市の地方公共団体コードは272167である
    kind: fact
    level: E2
    status: established
    sources:
    - d-cap-jlis-osaka
  column:
    title: 「楠公市」にならなかった公募のまち
    text: 1954年の市制施行にあたって河内長野市が行った新市名の公募には、196もの候補名が寄せられました。楠木正成が生まれ育った河内の一角らしく、「楠公市」「楠美市」「楠光市」といった楠公ちなみの名前がずらりと並びました。それでも最も多かったのは、中心の町の名に旧国名を冠した「河内長野市」。英雄の名を冠する案を退けて、土地の名そのものを選んだところに、新しい市の素朴な自己紹介が表れています。
    sources:
    - p3-kawachinagano-koza
  relations:
  - pref/27
  - muni/20-長野市
  - muni/27-富田林市
  unknowns:
  - 中心地名「長野」の初出文献（村名として史料に現れる最も古い例）は特定できなかった
  - 「河内」を冠した理由は資料により説明が異なり（長野市との重複回避説と公募最多説）、市の一次資料では確定できなかった
  - 「長野」の語源は水神説と「川沿いの長い土地」説があり、典拠のある確定説明は得られなかった
  updated: '2026-11-13'
- id: muni/27-河南町
  code: '273821'
  names:
    ja: 河南町
    reading: かなんちょう
    aliases: []
  user_terms:
  - 河南という名前の由来
  - 南河内郡の町
  - 近つ飛鳥の町
  naming_type: 方位・位置による命名
  formation: 合併新設
  prefecture: 大阪府
  homonyms: []
  summary: 1956年（昭和31年）に南河内郡の石川村・白木村・河内村・中村の4村が合併し、同時に町制を施行して生まれた町。名は合併4村のいずれとも異なる新名だが、その命名理由を示す公的記録は確認できていない。宮城県にあった河南町（現・石巻市河南地区）とは別の成立である。
  first_attestation:
    era: 昭和31年
    year_western: 1956
    document: 石川村・白木村・河内村・中村の合併と町制施行による河南町の発足（1956年9月30日）
    note: 町名としての初出はこの命名そのもの
  claims:
  - text: 1956年（昭和31年）9月30日、南河内郡の石川村・白木村・河内村・中村の4村が合併し、同時に町制を施行して河南町が誕生した（新設合併）
    kind: fact
    level: E4
    status: established
    sources:
    - x11-kanan-uub
  - text: 町章は日章をかたどり「カ・ナ・ン」の文字を図案化したもので、内部の4つの空白は合併した旧4村（石川村・白木村・河内村・中村）を表すと町公式が説明する
    kind: fact
    level: E2
    status: established
    sources:
    - x11-kanan-gaiyo
  - text: 町は大阪府の南東部、金剛・葛城山脈の西麓に位置し、面積は25.26km²である
    kind: fact
    level: E2
    status: established
    sources:
    - x11-kanan-gaiyo
  - text: 「河南」という名は合併4村のいずれの名でもない新名で、河内国の南部に位置することを示す位置地名と解されるが、命名の経緯を示す公的記録は確認できなかった
    kind: fact
    level: H
    status: inferred
    sources:
    - x11-kanan-uub
  - text: 宮城県にも河南町（かなんちょう）が1955年から2005年まで存在したが（現・石巻市河南地区）、そちらの「河南」は北上川を境として南北を区別する仙台藩政期以来の広域呼称に由来し、大阪の河南町とは別の成立である（異なる層）
    kind: fact
    level: E5
    status: established
    sources:
    - x11-kanan-miyagi-wiki
  - text: 地方公共団体コードは273821である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: もう一つの「河南町」
    text: かつて日本には「かなんちょう」が二つありました。宮城県桃生郡の河南町（1955〜2005年、現・石巻市河南地区）です。宮城側の「河南」は、北上川の南という位置を示す仙台藩政期以来の広域呼称が町名になったもの。大阪の河南町も1956年の合併新名という点では同時代の命名ですが、命名の記録が残っておらず、二つの「河南」が同じ発想だったのかどうかは、今のところ確かめようがありません。
    sources:
    - x11-kanan-miyagi-wiki
    - x11-kanan-uub
  relations:
  - pref/27
  unknowns:
  - 「河南」の命名理由・命名者は公的資料で未確認
  - 1956年の合併時に他の候補名があったかどうかは未確認
  updated: '2026-11-13'
- id: muni/27-泉佐野市
  code: '272132'
  names:
    ja: 泉佐野市
    reading: いずみさのし
    aliases:
    - 佐野村
    - 佐野町
    - 佐野荘
  user_terms:
  - 泉佐野という名前の由来
  - 佐野に泉がついた理由
  - 関西空港の玄関口の市
  - 泉州タオルのふるさと
  naming_type: 旧国名・広域地名の採用
  naming_note: 中世以来の村名「佐野」に旧国名「和泉」の「泉」を冠した合成地名
  formation: 合併新設
  prefecture: 大阪府
  homonyms: []
  summary: 市名は、中世以来の村名「佐野」に旧国名「和泉」の「泉」を冠した合成地名である。「佐野」については、「狭い原野」を意味する「狭野」が転じたものという伝承が残る。もとの佐野は和泉国日根郡の村で、明治に佐野村、大正に佐野町となり、昭和23年（1948年）4月の市制施行にあたって「泉佐野市」と名乗った。昭和29年（1954年）に周辺5か村と合併して現在の市域の骨格ができた。
  first_attestation:
    era: 中世（鎌倉時代）
    year_western: null
    document: 未特定
    note: 市名の核である「佐野」は中世以来の村名・荘園名（佐野荘）とされるが、「佐野」の語の具体的な初出文献と年代は特定できなかった
  claims:
  - text: 泉佐野市の公式観光サイトは、市名の由来について、中世以来の村名「佐野」に旧国名・和泉を冠したものであると説明している
    kind: fact
    level: E2
    status: established
    sources:
    - p3-izumisano-kanko
  - text: 「佐野」の由来については、「狭い原野」ということから「狭野」というようになり、それが転じて「佐野」と呼ばれるようになったという伝承が残っていると泉佐野市公式観光サイトは紹介している
    kind: legend
    level: E2
    status: established
    sources:
    - p3-izumisano-kanko
  - text: 市域は古代には和泉国日根郡の賀美郷にあたり、『和名類聚抄』に見える日根郡の4郷の1つで、その郷名は今も上之郷という地名に残っている
    kind: fact
    level: E4
    status: established
    sources:
    - p3-izumisano-localhist
  - text: 明治22年（1889年）に日根郡佐野村が町村制を施行し、明治44年（1911年）に町制を施行して佐野町となった
    kind: fact
    level: E4
    status: established
    sources:
    - p3-izumisano-localhist
  - text: 昭和12年（1937年）4月に佐野町と北中通村が合併して新たな佐野町が生まれ、昭和23年（1948年）4月に佐野町が市制を施行して泉佐野市が誕生した
    kind: fact
    level: E2
    status: established
    sources:
    - p3-izumisano-plan
  - text: 昭和29年（1954年）には、南中通・日根野・長滝・上之郷・大土の5か村が泉佐野市に合併し、新しい泉佐野市が形成された
    kind: fact
    level: E2
    status: established
    sources:
    - p3-izumisano-plan
  - text: 泉佐野市の地方公共団体コードは272132である
    kind: fact
    level: E2
    status: established
    sources:
    - d-cap-jlis-osaka
  column:
    title: 村名の上に国名を載せた「泉佐野」
    text: 「泉佐野」は二段構造の名前です。下の段は中世以来の村の名前「佐野」、上の段は旧国名「和泉」の頭の一字「泉」。ふつう合併や市制のときに新しく作られる合成地名は町村どうしの名前を組み合わせますが、泉佐野の場合は、村の名前に「国」の名前を載せたところが変わっています。市制施行は昭和23年（1948年）のことで、この「泉」の一字が、今では関西国際空港の玄関口を名乗る市の看板になっています。
    sources:
    - p3-izumisano-kanko
    - p3-izumisano-plan
  relations:
  - pref/27
  - muni/09-佐野市
  unknowns:
  - 「佐野」の語の具体的な初出文献・年代は特定できなかった（「狭野」からの転訛は伝承として伝えられる段階）
  - 市制施行にあたって「泉」を冠した理由について、栃木県佐野市との同名回避のためとする説明が一般に流布しているが、典拠のある市公式の説明は確認できなかった（市公式観光サイトの説明は「旧国名和泉を冠したもの」とするにとどまる）
  - 佐野荘の成立時期と「佐野」の表記の初出については、専門辞典での確認ができなかった
  updated: '2026-11-13'
- id: muni/27-泉南市
  code: '272281'
  names:
    ja: 泉南市
    reading: せんなんし
    aliases:
    - 泉南町
  user_terms:
  - せんなん
  - 泉南町
  - 関空のまち
  - りんくう泉南
  - 泉州
  naming_type: 旧行政区画名の継承
  formation: 合併新設
  prefecture: 大阪府
  homonyms: []
  summary: 泉南市は大阪府南西部、和泉山脈と大阪湾に挟まれた市である。市名「泉南」の直接の源は、明治29年（1896）に置かれた泉南郡の郡名にある。1956年に郡内の2町4村が合併して郡名を受け継ぐ泉南町が誕生し、1970年に合併を伴わない単独の市制施行で泉南市となった。関西国際空港の南部を市域に含む。
  first_attestation:
    era: 明治
    year_western: 1896
    document: 泉南郡の設置
    note: 市名の直接の出典である郡名「泉南」の成立年であり、地名としての「泉南」の初出を示すものではない。
  claims:
  - text: 「泉南」の名は郡名に由来する。1896年に郡制が布かれ、この地域は泉南郡に属したと市の統計書が記す
    kind: fact
    level: E2
    status: established
    sources:
    - x2-sennan-tokei
  - text: 泉南郡は、明治29年（1896）に南郡と日根郡を合わせて成立した郡で、郡名は旧和泉国の南部に位置することによると『日本歴史地名大系』は述べる
    kind: fact
    level: E3
    status: established
    sources:
    - upg-s5-sennan-gun-kotobank
  - text: 1956年9月30日、泉南郡の新家村・信達町・西信達村・鳴滝村・樽井町・雄信達村の2町4村が合併して泉南町が誕生し、郡名を受け継いだ
    kind: fact
    level: E2
    status: established
    sources:
    - x2-sennan-rekishi
  - text: 1970年7月1日、泉南町が単独で市制を施行して泉南市となった。市制は新たな合併を伴っていない
    kind: fact
    level: E2
    status: established
    sources:
    - x2-sennan-rekishi
  - text: 明治22年（1889）の町村制の時点で、市域の村々は日根郡に属していた
    kind: fact
    level: E2
    status: established
    sources:
    - x2-sennan-tokei
  - text: 1994年9月4日に関西国際空港が開港し、空港に関する産業が市の経済を支えるようになった
    kind: fact
    level: E2
    status: established
    sources:
    - x2-sennan-tokei
  - text: 総務省の全国地方公共団体コードで、泉南市の団体コードは272281と定められている
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 空港を3市町で分け合う
    text: 関西国際空港は一つの市の空港ではない。空港島は泉佐野市・泉南市・田尻町の2市1町にまたがっており、南側の約3分の1は泉南市域で、国際貨物ターミナルなどが置かれている。泉南市にとって関空は貴重な税収源であり、市域の一部でありながら保安区域のため一般の住民が立ち入れないという、少し不思議な「市の一部」でもある。郡名を受け継いだ昭和の新市名「泉南」は、平成の空港によって全国に知られる名になった。
    sources:
    - x2-sennan-wikipedia
    - x2-sennan-tokei
  relations:
  - pref/27
  - muni/27-泉大津市
  - muni/27-阪南市
  unknowns:
  - 1956年の合併に際して町名「泉南」が選ばれた手続き（公募や協議の記録）の詳細
  - 泉南郡の命名理由は『日本歴史地名大系』が旧和泉国の南部に位置することによると述べるが、郡設置当時の公式記録による確認はできていない
  updated: '2026-11-13'
- id: muni/27-泉大津市
  code: '272060'
  names:
    ja: 泉大津市
    reading: いずみおおつし
    aliases:
    - 大津町
    - 大津村
  user_terms:
  - いずみおおつ
  - 毛布のまち
  - 大津の浦
  - だんじり
  naming_type: 中心地名の継承
  formation: 改称
  prefecture: 大阪府
  homonyms: []
  summary: 泉大津市は大阪湾に面した港町で、毛布の一大産地として知られる。地名「大津」は『土佐日記』に見える「小津の浦」に始まると市公式が紹介し、平安時代後期には「大津の浦」と記されるようになった。1942年の市制施行の際、すでに滋賀県に大津市があったため、大津の頭に和泉国の「泉」を置いて「泉大津市」とした、市公式が明記する同名回避の命名である。
  first_attestation:
    era: 平安時代
    year_western: 936
    document: 土佐日記
    note: 市公式が承平6年（936）の『土佐日記』の「小津の浦」を最も古い記載とし、1059年ごろの『更級日記』では「大津の浦」と呼ばれているとする（市公式経由の確認）。当時は「大津」ではなく「小津」と呼ばれていた点が要点である。
  claims:
  - text: 市公式によれば、「大津」の浦のもっとも古い記載は承平6年（936）の『土佐日記』に見える「小津の浦」で、康平2年（1059）ごろの『更級日記』では「大津の浦」と呼ばれている
    kind: fact
    level: E2
    status: established
    sources:
    - x2-izumiotsu-chimei
  - text: 市公式は、「大津」の地名は「小津」より転化したものといわれ、和泉国の国府の港町として徐々に「大きなみなと」になったと説明する
    kind: fact
    level: E2
    status: established
    sources:
    - x2-izumiotsu-chimei
  - text: 江戸時代の1647年に大津村はいったん宇多大津村と下条大津村に分かれたが、明治8年（1875）に両村が合併して大津村となり、大正4年（1915）4月1日に町制して大津町となった
    kind: fact
    level: E2
    status: established
    sources:
    - x2-izumiotsu-chimei
  - text: 昭和17年（1942）4月1日の市制施行にあたり、すでに滋賀県大津市があることから、大津の頭に和泉国の「泉」を置くこととし、「泉大津市」となったと市公式が明記する
    kind: fact
    level: E2
    status: established
    sources:
    - x2-izumiotsu-chimei
  - text: 「小津」の語源について、大津神社の由緒では「国津・国府津から転じたものといわれ、和泉国の国府の外港という意味」と説明される。一方、『日本歴史地名大系』は大津を和泉国衙に往来する官人たちの船の発着場・国庁への玄関口と述べるが、国津からの転訛という語源説自体は記しておらず、市公式の地名解説も「小津」から「大津」への転化を述べるにとどまる
    kind: fact
    level: E4
    status: contested
    sources:
    - upg-s5-izumiotsu-jinja
    - upg-s5-izumiotsu-kotobank
    - x2-izumiotsu-chimei
  - text: 大津は古くから随筆や紀行文に記された名勝の地であり、江戸期には南溟寺を中心にした寺内町として発展したと市公式が述べる
    kind: fact
    level: E2
    status: established
    sources:
    - x2-izumiotsu-chimei
  - text: 市は毛布の生産地として知られ、「日本一の毛布のまち」を掲げている
    kind: fact
    level: E2
    status: established
    sources:
    - x2-izumiotsu-shiru
  - text: 総務省の全国地方公共団体コードで、泉大津市の団体コードは272060と定められている
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 「大津」が二つある話
    text: 1942年、大津町が市制を施行しようとしたとき、同じ「大津市」がすでに滋賀県に存在した。琵琶湖畔の大津は近江国の国府以来の古い都で、1889年の町村制で町となり1898年に市制していた先輩である。そこで大阪側の大津は、国名の和泉から一字を取って頭に冠し、「泉大津市」と名乗ることにした。市公式の地名解説はこの経緯をはっきりと記している。同じ理由による改称は泉大津だけではなく、各地の「同名回避」の命名の典型例として数えられる。「泉大津」の「泉」は、旧国名を残すための工夫であると同時に、先行する同名市への遠慮の跡でもある。
    sources:
    - x2-izumiotsu-chimei
  relations:
  - pref/27
  - muni/25-大津市
  - muni/27-泉南市
  - muni/27-阪南市
  unknowns:
  - 「小津」という地名そのものの語源
  - 1875年の合併以前の宇多・下条両村における「大津」表記の初出
  - 1942年当時、他の候補名が検討されたかどうか
  updated: '2026-11-13'
