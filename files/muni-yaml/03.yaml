  summary: 岩手郡の町で、北上高地の高原にあり、酪農と山ぶどうワインで知られる。町名の語源は岩手県の由来一覧が「葛牧（葛の生えた牧場）」と「葛蒔（傾斜地を崩して蒔いた焼畑）」の2説を挙げ、決着していない。現在の町は昭和30年（1955）7月15日に、旧葛巻町・江刈村・二戸郡田部村が合併して誕生した。
