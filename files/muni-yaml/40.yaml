  summary: 糟屋郡の町。1889年に篠栗村として発足し、1927年に町制を施行、1955年に勢門村と対等合併して現在の町域となった。町名は旧来の村名「篠栗」を継ぐ。四国八十八箇所の写し霊場「篠栗四国八十八箇所」の総本寺・南蔵院と、ブロンズ製として世界最大級の釈迦涅槃像で知られる。「篠栗」の語源は確認できなかった。
  first_attestation:
    era: 明治時代
    year_western: 1889
    document: 町村制による篠栗村の発足（1889年4月1日）
    note: 村名「篠栗」はこれ以前から存在した地名とみられるが、初出文献は確認できなかった
  claims:
  - text: 1889年4月1日に篠栗村と勢門村が発足し、1927年1月1日に篠栗村が町制を施行して篠栗町となった
    kind: fact
    level: E2
    status: established
    sources:
    - upg-p2-sasaguri-geoshape-mura
  - text: 1955年4月1日に篠栗町と勢門村が合併し、篠栗町となった
    kind: fact
    level: E2
    status: established
    sources:
    - upg-p2-sasaguri-geoshape-mura
  - text: 篠栗四国八十八箇所は、1835年（天保6年）に尼僧慈忍が発願したと伝わり、藤木藤助が志を継いで霊場が完成した。完成の年については、嘉永7年（1854年）とする資料と安政2年（1855年）とする資料があり、説明が食い違う
    kind: fact
    level: E2
    status: contested
    sources:
    - upg-p2-sasaguri-toyoshima
    - upg-p2-sasaguri-dwango
  - text: 1899年（明治32年）9月に高野山から南蔵院が招致・移転して篠栗四国霊場の総本寺（第1番札所）となり、その釈迦涅槃像（全長41m）はブロンズ製では世界最大級とされる
    kind: fact
    level: E4
    status: established
    sources:
    - upg-p2-sasaguri-nanzoin
  - text: 若杉山の太祖宮（太祖神社）には、神功皇后の三韓遠征以来の由緒が伝えられている
    kind: legend
    level: E3
    status: indeterminate
    sources:
    - upg-p2-sasaguri-taiso-kotobank
  - text: 篠栗町の地方公共団体コードは403423である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 村の名より有名になった霊場――篠栗四国と涅槃像
    text: 「篠栗」の名を全国に知らしめたのは、地名そのものよりも霊場のほうだった。天保6年（1835年）に尼僧慈忍がこの地を訪れて四国八十八箇所の写し霊場の造成を提案したと伝わり、藤木藤助らの手で88か所がそろった（完成の年は1854年とも1855年とも伝えられる）。明治32年（1899年）には高野山から南蔵院が移って霊場の総本寺となり、今では全長41メートルというブロンズ製で世界最大級の釈迦涅槃像が参拝者を迎える。村の名は1889年以来変わらないが、その響きは霊場とともに育ってきた。
    sources:
    - r5-sasaguri-shikoku-wiki
    - r5-sasaguri-wiki
  relations:
  - pref/40
  unknowns:
  - 「篠栗」の語源は確認できなかった
  - 「篠栗」の初出文献は確認できなかった
  updated: '2026-11-13'
