  summary: 八ヶ岳西麓の高原の村。一帯はかつて諏訪明神の御狩場で「神野（原山）」と呼ばれる原野だった。慶長15年（1610年）の原山新田に始まる新田開発で生まれた8つの新田村が、明治8年（1875年）に合併して原村となった。その後一度も合併していない。
  first_attestation:
    era: 明治8年
    year_western: 1875
    document: null
    note: 村名「原村」の初出は明治8年（1875年）1月23日の8村合併による発足。地名の古層としては、慶長15年（1610年）に開発された「原山新田」の名がある
  claims:
  - text: 村域一帯はかつて諏訪明神の御狩場であった「神野（原山）」一帯で、武田信玄の下知状により住むことが禁止されていたと村公式が説明する
    kind: fact
    level: E2
    status: established
    sources:
    - v11-hara-vill-plan
  - text: 慶長15年（1610年）、諏訪頼水の開発政策により原山新田（現在の中新田）が誕生し、さらに各地で新田開発が進められた
    kind: fact
    level: E2
    status: established
    sources:
    - v11-hara-vill-plan
  - text: 明治8年（1875年）に8つの新田村が合併して原村が誕生し、その後は合併などを経ることなく現在に至る
    kind: fact
    level: E2
    status: established
    sources:
    - v11-hara-vill-plan
  - text: 合併した8村は大久保村・柳沢村・八ツ手新田村・払沢新田村・柏木新田村・菖蒲沢村・中新田村・室内新田村で、原村の発足は明治8年1月23日とされる
    kind: fact
    level: E5
    status: established
    sources:
    - v11-hara-wiki
  - text: 村内には今も「原山」という地区名が残っており、村名の「原」は原山と呼ばれた原野の名を受け継いだものと考えられる
    kind: fact
    level: H
    status: inferred
    sources:
    - v11-hara-vill-plan
  - text: 自然発生的な集落である8か新田が集まって原村を結成したのが明治8年で、以来一度も合併することなく今日に及んでいると村の広報は記す
    kind: fact
    level: E2
    status: established
    sources:
    - v11-hara-vill-shuho
  - text: 村には国史跡の阿久遺跡をはじめ縄文時代を中心とする遺跡が多く、原野の開発が始まる以前から人の営みがあった
    kind: fact
    level: E2
    status: established
    sources:
    - v11-hara-vill-plan
  - text: 原村の地方公共団体コードは203637である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 神の狩場だった原野
    text: 原村の土地は、もともと村ですらなかった。諏訪明神の狩場「神野」として人の居住が禁じられた原野で、江戸時代に入ってようやく新田開発が許された。1610年の原山新田を皮切りに、8つの新田村が原野に点々と生まれ、1875年に合併して「原村」になった。村の名はそのまま「原野の村」という出自の記録である。開発から四百年を記念する「四百年碑」が村に立ち、今ではセロリの産地として知られる高原の畑が広がっている。
    sources:
    - v11-hara-vill-plan
    - v11-hara-vill-shuho
  relations:
  - pref/20
  unknowns:
  - 1875年の合併時に「原村」という名が選ばれた理由を直接記した当時の資料（原山由来は状況からの推定にとどまる）
  - 「原山」という呼称の初出と、「神野（こうや）」と「原山」の呼称の使い分けの経緯
  updated: '2026-11-13'
- id: muni/20-喬木村
