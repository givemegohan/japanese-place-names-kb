  naming_type: 旧行政区画名の継承
  formation: 単独発足
  prefecture: 沖縄県
  homonyms: []
  summary: 慶良間諸島の西半分、座間味島・阿嘉島・慶留間島の有人3島からなる村。沖縄本島から見て渡嘉敷島の後ろにあたるため「後慶良間」とも呼ばれる。近世は座間味間切（方音ジャマン）で、1908年の島嶼町村制により座間味村となった。島名「座間味」の語源は、調査した公的・専門資料に定説がない。1945年の米軍上陸と集団自決は地名の由来とは別の、島の近代史の層である。
  first_attestation:
    era: 江戸時代
    year_western: 1713
    document: 『琉球国由来記』（1713年成立）の座間味間切
    note: 王府の旧記座が編んだ地誌に座間味間切の御嶽・祭祀が記録される。「座間味」の漢字表記の初出そのものは未確認
  claims:
  - text: 座間味村の地方公共団体コードは473545である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  - text: 日本歴史地名大系によれば、近世の座間味は「じやまん間切」と読まれ、渡嘉敷間切とともに慶良間島を構成し、久米方に属した
    kind: fact
    level: E3
    status: established
    sources:
    - s10-zamami-kotobank
  - text: 日本歴史地名大系によれば、座間味集落の方音は「ジャマン」で、座間味間切の行政の中心地であった
    kind: fact
    level: E3
    status: established
    sources:
    - s10-zamami-kotobank
  - text: 村公式サイトによれば、座間味村は那覇市から西へ約40キロの慶良間諸島の西半分を占め、座間味島・阿嘉島・慶留間島の3つの有人島からなる
    kind: fact
    level: E2
    status: established
    sources:
    - s10-zamami-vill
  - text: 日本歴史地名大系によれば、沖縄島から見て渡嘉敷島の後ろにあることから、座間味村の島々は「後慶良間（クシギラマ）」とも呼ばれる
    kind: fact
    level: E3
    status: established
    sources:
    - s10-zamami-kotobank
  - text: 日本歴史地名大系によれば、1908年の沖縄県及島嶼町村制施行により座間味村が成立し、それまでの座間味・阿佐・阿真・阿嘉・慶留間の諸村が字となった
    kind: fact
    level: E3
    status: established
    sources:
    - s10-zamami-kotobank
  - text: 1945年（昭和20年）3月26日、座間味村は米軍の沖縄最初の上陸地点となり、村民402人が集団自決した。これは島名の由来とは別の、島の近代史の層である
    kind: fact
    level: E3
    status: established
    sources:
    - s10-zamami-nipponica
  - text: 「座間味」という島名の語源は、村公式資料・日本歴史地名大系のいずれにも説明が見当たらず、未詳である
    kind: fact
    level: E3
    status: indeterminate
    sources:
    - s10-zamami-kotobank
    - s10-zamami-vill
  column:
    title: 沖縄の鰹節は座間味から
    text: 日本歴史地名大系によれば、座間味村では1901年（明治34年）に鰹漁業が創業して大成功をおさめ、渡嘉敷島はもとより県内各地に普及した。「ケラマ節」と呼ばれた鰹節は村財政を潤し、海の民の島は沖縄の鰹節産業の発祥地となった。現在のダイビングで知られる海の豊かさは、かつて村の暮らしそのものを支えていた。
    sources:
    - s10-zamami-kotobank
  relations:
  - pref/47
  - muni/47-渡嘉敷村
  unknowns:
  - 島名「座間味」の語源は未詳で、方音「ジャマン」の意味も確認できなかった
  - 「座間味」の漢字表記の文献上の初出は確認できなかった
  - 集落が島東部の古座間味から現在地へ移転してきたという伝承の年代は確認できなかった
  updated: '2026-11-13'
