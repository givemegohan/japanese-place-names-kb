prefecture_code: '15'
records:
- id: muni/15-三条市
  code: '152048'
  names:
    ja: 三条市
    reading: さんじょうし
    aliases:
    - 三条町
    - 三條町
    - 三条庄
  user_terms:
  - 三条市の名前の由来
  - 三条はなぜ三条というのか
  - 燕三条の三条
  - 金物のまち三条
  naming_type: 中心地名の継承
  formation: 合併新設
  prefecture: 新潟県
  homonyms: []
  summary: 市名は中世の荘園名「三条庄」にまで遡る地名の継承である。「三条」の語源は専門辞典にも説明がなく未確定だが、14世紀には荘園名として、1382年には市場を持つ地名として文書に現れる。近世に金物の商いの町として栄えた三条町が1934年に市制を施行し、2005年の合併でも市名が継承された。
  first_attestation:
    era: 延慶2年
    year_western: 1309
    document: 大中臣氏略系図（桐村正春家蔵）
    note: 14世紀初頭に成立したとみられる系図に「越後国三条庄」と見える（日本歴史地名大系の紹介による）。荘園名としての用例であり、中世の「三条」が近世の三条町にそのまま連続するかは大系も留保している
  claims:
  - text: 日本歴史地名大系によれば、14世紀初頭に成立したとみられる大中臣氏略系図に「越後国三条庄」と見え、これが「三条」の名の古い確認例である
    kind: fact
    level: E3
    status: established
    sources:
    - n1-sanjo-kotobank-machi
  - text: 永徳2年（1382）の僧都覚有一跡配分目録には「三条七日市場」とあり、中世の三条には市場が開かれていたことがわかる（日本歴史地名大系の紹介による）
    kind: fact
    level: E3
    status: established
    sources:
    - n1-sanjo-kotobank-machi
  - text: 日本歴史地名大系は、中世史料にみえる「三条」は近世の三条町に必ずしも連続しないと注意しており、近世の三条町は寛永から正保年間にかけて三条城回りの空屋敷や畑地を開発して町場化し、万治元年（1658）の検地で本村から独立したとする
    kind: fact
    level: E3
    status: established
    sources:
    - n1-sanjo-kotobank-machi
  - text: 「三条」という名の語源については、日本歴史地名大系の三条町・三条市の項にも説明がなく、確認できる範囲では未確定である
    kind: fact
    level: E3
    status: indeterminate
    sources:
    - n1-sanjo-kotobank-machi
  - text: 昭和9年（1934）1月1日、南蒲原郡三条町が市制を施行して三条市が発足した
    kind: fact
    level: E4
    status: established
    sources:
    - n1-sanjo-uub
  - text: 平成17年（2005）5月1日、旧三条市・南蒲原郡栄町・下田村が新設合併して現在の三条市が発足し、市名は「三条市」が継承された
    kind: fact
    level: E2
    status: established
    sources:
    - n1-sanjo-pref-gappei
  - text: 新潟県の市町村等団体コード一覧では、三条市の団体コードは152048とされている
    kind: fact
    level: E2
    status: established
    sources:
    - n1-niigata-code
  column:
    title: 七日市場から金物の町へ
    text: 中世の三条には「七日市場」という定期市がありました。市（いち）の開かれる場所が町の核になるのは各地に共通する姿で、三条もその系譜にあります。近世以降、三条は五十嵐川と信濃川の合流部という水運の立地を生かして金物の商いの町として発展し、隣の燕市と並ぶ金属加工の産地になりました。今も上越新幹線の駅名は両市にまたがる「燕三条駅」で、産地の総称としても「燕三条」の名が定着しています。
    sources:
    - n1-sanjo-kotobank-machi
    - n1-sanjo-wikipedia
  relations:
  - pref/15
  - muni/15-燕市
  unknowns:
  - 「三条庄」の名がなぜ「三条」なのか（条里制の区画に由来する可能性など）は、典拠のある資料で確認できなかった
  - 2005年合併時の市名決定の詳細（公募の有無・候補名）は未確認
  updated: '2026-11-13'
- id: muni/15-上越市
  code: '152226'
  names:
    ja: 上越市
    reading: じょうえつし
    aliases:
    - 高田市
    - 直江津市
  user_terms:
  - 上越市の名前の由来
  - 上越はなぜ上越というのか
  - 高田と直江津が合併した市
  - 上杉謙信の春日山城のまち
  naming_type: 旧国名・広域地名の採用
  formation: 合併新設
  prefecture: 新潟県
  homonyms: []
  summary: 昭和46年（1971年）4月29日、城下町の高田市と港町の直江津市が対等合併して誕生した新設市である。市名「上越」は、越後国のうち都（京都）に近い側を指す広域地名「上越」を採用したもので、合併協議会では新市の名称について関係機関へのアンケートも行われた。平成17年（2005年）には周辺13町村を編入して現在の市域となった。
  first_attestation:
    era: 昭和46年
    year_western: 1971
    document: 高田市・直江津市の合併に伴う「市の廃置分合に係る処分書」（上越市公文書センター所蔵資料として市が紹介）
    note: 自治体名としての初出。地域名としての「上越」はそれ以前から使われていた
  claims:
  - text: 昭和29年（1954年）11月、高田市・直江津市・春日村の三者は「近き将来において高田市と直江津市を合併して上越中心都市を建設すること」を記した申合書を交換していた
    kind: fact
    level: E2
    status: established
    sources:
    - l3-joetsu-koubunsho
  - text: 昭和45年（1970年）の合併協議会では、町会長・自治会長・市会議員・学校・官公庁・大規模事業所など約500か所を対象に、新市の名称のアンケート調査が実施された
    kind: fact
    level: E2
    status: established
    sources:
    - l3-joetsu-koubunsho
  - text: 昭和46年（1971年）4月29日、高田市と直江津市が合併し、上越市が発足した
    kind: fact
    level: E2
    status: established
    sources:
    - l3-joetsu-koubunsho
  - text: 新潟県立図書館のレファレンス回答によれば、上越・中越・下越の地域区分の「上」「下」は都（京都）を起点とし、都に近い側が「上」、遠い側が「下」とされたという
    kind: fact
    level: E2
    status: established
    sources:
    - l3-joetsu-pref-lib
  - text: 合併前の高田市は明治44年（1911年）に市制を施行した城下町であり、直江津市は昭和29年（1954年）に市制を施行した港町であった
    kind: fact
    level: E2
    status: established
    sources:
    - l3-joetsu-50th
  - text: 平成17年（2005年）1月1日、安塚町・浦川原村・大島村・牧村・柿崎町・大潟町・頸城村・吉川町・中郷村・板倉町・清里村・三和村・名立町の13町村を編入し、人口約21万人・面積約973平方キロメートルの新しい上越市となった
    kind: fact
    level: E2
    status: established
    sources:
    - l3-joetsu-sogokeikaku
  - text: 総務省「地方公共団体コード一覧」では、上越市のコードは152226とされる
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 上越新幹線は上越市を通らない
    text: 「上越新幹線は新潟の上越地区を通っていないのに、なぜ上越新幹線というのか」という疑問は、国立国会図書館のレファレンス協同データベースにも登録されている。回答によれば、新幹線や上越線の「上越」は上野国（上州）と越後国の頭文字を取ったもので、上越市の「上越」（都に近い越後という地域区分）とは全く違う由来だという。同じ「じょうえつ」でも、二つの名前は別々に生まれたのである。
    sources:
    - l3-joetsu-ndlref
  relations:
  - pref/15
  unknowns:
  - 昭和45年（1970年）の新市名アンケートで「上越」がどの程度の支持を得たか、候補名の一覧までは確認できなかった
  - 地域名「上越」の使用例としての確実な初出は特定できなかった
  updated: '2026-11-13'
- id: muni/15-五泉市
  code: '152188'
  names:
    ja: 五泉市
    reading: ごせんし
    aliases:
    - 五泉町
  user_terms:
  - ごせん
  - ニットのまち
  - 五泉ニット
  - 清水のまち
  naming_type: 中心地名の継承
  formation: 合併新設
  prefecture: 新潟県
  homonyms: []
  summary: 新潟県の市で、阿賀野川と早出川に挟まれた平野に広がる。「五泉」の名の由来は確定しておらず、市公式資料も「5つの泉が湧き出ていたから」「5つの川が流れていたから」など諸説が言い伝えられると述べるにとどまる。古くは絹織物、戦後はニットの産地として発展した。1954年に市制施行し、2006年に城下町だった村松町と合併した。
  first_attestation:
    era: null
    year_western: null
    document: null
    note: 「五泉」の文献上の初出は確認できなかった。市公式資料も語源を諸説併記の形で紹介するにとどまる
  claims:
  - text: 『五泉』の地名は「その昔、5つの泉が湧き出ていたから」「5つの川が流れていたから」など、さまざまな説が言い伝えられていると五泉市の公式資料が述べ、確定した語源は示されていない
    kind: fact
    level: E2
    status: indeterminate
    sources:
    - u5-gosen-kaso
  - text: かつて五つの泉が湧き出ていたために「五泉」と名付けられたという言い伝えがある
    kind: legend
    level: E2
    status: indeterminate
    sources:
    - u5-gosen-kaso
  - text: 現在も市内に湧く水として吉清水・どばしっこ清水・どっぱら清水などの清水が知られている
    kind: fact
    level: E2
    status: established
    sources:
    - u5-gosen-kaso
  - text: 昭和29年（1954）11月3日に五泉町・巣本村・川東村・橋田村が合併して市制施行し五泉市となった
    kind: fact
    level: E2
    status: established
    sources:
    - u5-gosen-kaso
  - text: 平成18年（2006）1月1日に村松町と新設合併して現在の五泉市となった
    kind: fact
    level: E2
    status: established
    sources:
    - u5-gosen-kaso
  - text: 合併した旧村松町は、村松藩（堀家3万石）の城下町であった
    kind: fact
    level: E2
    status: established
    sources:
    - u5-gosen-meti
    - u5-gosen-kaso
  - text: 五泉は古くから絹織物の産地であり、戦後はニット工業が発展して全国有数のニット産地となった
    kind: fact
    level: E2
    status: established
    sources:
    - u5-gosen-kaso
    - u5-gosen-meti
  column:
    title: 五つの泉はどこへ――残った三つの清水
    text: 「五泉」の由来とされる五つの泉は、今の市内のどこにあったのかはっきりしない。市が現存する湧水として挙げるのは吉清水・どばしっこ清水・どっぱら清水などである。「どばしっこ」「どっぱら」という方言めいた名も含め、清水は今も生活の水として残る。名の由来が言い伝えの層にとどまるからこそ、残った清水の一つひとつが「五つの泉」の候補として語られ続ける。
    sources:
    - u5-gosen-kaso
  relations:
  - pref/15
  unknowns:
  - 「五泉」の文献上の初出と、語源の確定説（五つの泉説・五つの川説はいずれも言い伝えの域を出ない）
  - 五泉という地名がいつから現在の地域を指すようになったか
  updated: '2026-11-13'
- id: muni/15-佐渡市
  code: '152242'
  names:
    ja: 佐渡市
    reading: さどし
    aliases:
    - 佐度
    - 佐土
    - 佐渡国
    - 佐渡島
  user_terms:
  - 佐渡市の名前の由来
  - 佐渡はなぜ佐渡というのか
  - 佐渡島の市
  - 一島一市の佐渡
  - トキの島
  naming_type: 島名の継承
  formation: 合併新設
  prefecture: 新潟県
  homonyms: []
  summary: 市名は島の名「佐渡」そのものである。島名は『古事記』『日本書紀』の国生み神話に「佐度島」「佐度洲」と現れる古い名で、「さど」の意味は狭門説・雑太郷関連説などがあるが確説はない。2004年、島内の全10市町村が合併して島全体を市域とする「一島一市」の佐渡市が誕生した。
  first_attestation:
    era: 和銅5年
    year_western: 712
    document: 『古事記』上巻（国生み神話）
    note: 大八島国の第七の島として「佐度島」と表記される（國學院大學の古事記地名データベースによる）。島名の初出として扱う
  claims:
  - text: 『古事記』『日本書紀』の国生み物語に「佐度島（さどのしま）」「佐度洲」とあり、佐渡は大八島国の一つとみえる（日本歴史地名大系）
    kind: fact
    level: E3
    status: established
    sources:
    - n1-sado-kotobank-kuni
    - n1-sado-kokugakuin
  - text: 漢字表記は記紀の「佐度」のほか、六国史などでは「佐渡」、正倉院文書の天平宝字6年（762）の文書には「佐土」と、時代により揺れている（日本歴史地名大系）
    kind: fact
    level: E3
    status: established
    sources:
    - n1-sado-kotobank-kuni
  - text: 「さど」の語源については、『日本書紀通証』『古事記伝』などが狭門（海路の狭いところ）の義かと推測し、雑太（さわた）郡雑太郷と関連させる説もあるが、日本歴史地名大系はいずれも確説とはいいがたいとしている
    kind: fact
    level: E3
    status: contested
    sources:
    - n1-sado-kotobank-kuni
  - text: 佐渡は大化改新後に佐渡国となり、天平15年（743）に越後国に合併されたが、天平勝宝4年（752）に再び分立した（改訂新版世界大百科事典）
    kind: fact
    level: E3
    status: established
    sources:
    - n1-sado-kotobank-kuni
  - text: 平成16年（2004）3月1日、島内の両津市・相川町・佐和田町・金井町・畑野町・真野町・羽茂町・小木町・新穂村・赤泊村の全10市町村が合併し、一島一市の佐渡市が誕生した
    kind: fact
    level: E2
    status: established
    sources:
    - n1-sado-city-plan
  - text: 合併前の島内唯一の市だった両津市は、昭和29年（1954）に市制を施行していた
    kind: fact
    level: E4
    status: established
    sources:
    - n1-sado-uub
  - text: 新潟県の市町村等団体コード一覧では、佐渡市の団体コードは152242とされている
    kind: fact
    level: E2
    status: established
    sources:
    - n1-niigata-code
  column:
    title: 隠岐と双子だった佐渡
    text: 国生み神話の中で、佐渡は少し特別な生まれ方をしています。『日本書紀』には、佐度洲（佐渡）は億岐洲（隠岐）と双生（ふたご）であるとする説が見えるのです。イザナギ・イザナミが国々を生んでいく中で、この二島だけが双子として生まれたというわけです。日本海に並んで浮かぶ二つの島の姿が、古代の人々にそう語らせたのかもしれません。なお記紀では「佐度」と書かれ、「佐渡」の表記が一般的になるのは後の時代のことです。
    sources:
    - n1-sado-kotobank-kuni
  relations:
  - pref/15
  unknowns:
  - 「さど」の語源は決着しておらず、狭門説・雑太郷説以外の説の専門資料での検討は未了
  - 2004年合併時の市名決定の経緯（他の候補名の有無など）は未確認
  updated: '2026-11-13'
- id: muni/15-出雲崎町
  code: '154059'
  names:
    ja: 出雲崎町
    reading: いずもざきまち
    aliases:
    - 尼瀬町
  user_terms:
  - 良寛の生まれた町
  - 天領の町
  - 妻入りの街並みの町
  - 北前船の寄港地
  - 出雲崎町の名前の由来
  naming_type: 中心地名の継承
  naming_note: 中世以来の港町の地名の継承
  formation: 不明
  prefecture: 新潟県
  homonyms: []
  summary: 出雲崎は日本海に突き出た岬の港町で、戦国期の文書に柏崎・新潟と並ぶ「三津」の一つとして現れる。「出雲」の冠は、惣社の石井神社が大国主命（出雲の大神）を祀ることに結びつける説が郷土史料で有力とされるが確証はない。江戸時代には幕府の代官所が置かれた越後最初の天領となり、佐渡金銀の陸揚げ港・北前船の寄港地として栄えた。良寛の生地としても知られる。
  first_attestation:
    era: 永禄11年
    year_western: 1568
    document: 上杉輝虎書状
    note: 『日本歴史地名大系』が紹介する用例。本庄繁長との抗争にあたり柏崎・出雲崎・新潟の三津を押えるよう命じた書状。郷土史料は康平3年（1060年）の越後図に既に名が見えるとするが、専門辞典では確認できなかった
  claims:
  - text: 総務省の全国地方公共団体コードで、出雲崎町の団体コードは154059と定められている
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  - text: 『日本歴史地名大系』によれば、永禄11年（1568年）10月22日の上杉輝虎書状に、本庄繁長との抗争にあたって柏崎・出雲崎・新潟の三津を押えるよう命じる記述があり、戦国期の出雲崎は越後の要港の一つだった
    kind: fact
    level: E3
    status: established
    sources:
    - v6-izumozaki-kotobank-taikei
  - text: 郷土史料『出雲崎編年史』は「出雲」の由来について、出雲崎の惣社である石井神社が大国主命（出雲の大神）を祀るため「出雲崎」と呼ばれるという説を首肯する一方、出雲の国が分裂して付着したとか出雲の材木が漂着したという説は附会として退けている
    kind: fact
    level: E4
    status: contested
    sources:
    - v6-izumozaki-nenpyo
  - text: 出雲崎町の公式計画は、海岸地区は神話時代に大国主命によって開拓されたと伝えられていると記している
    kind: legend
    level: E2
    status: established
    sources:
    - v6-izumozaki-town-plan
  - text: 元和2年（1616年）に江戸幕府の代官所（陣屋）が置かれて越後で最初の天領となり、佐渡からの金銀の陸揚げ地・北前船の寄港地として栄えた
    kind: fact
    level: E2
    status: established
    sources:
    - v6-izumozaki-zck
    - v6-izumozaki-town-plan
  - text: 明治22年（1889年）の町村制で出雲崎町・尼瀬町・西越村・中越村・八手村の2町3村が誕生し、明治37年（1904年）に出雲崎町と尼瀬町が合併、昭和32年（1957年）に西越村と合併して現在の出雲崎町となった
    kind: fact
    level: E2
    status: established
    sources:
    - v6-izumozaki-town-plan
  - text: 禅僧・歌人の良寛は宝暦8年（1758年）、出雲崎の名主の家・橘屋に生まれた
    kind: fact
    level: E4
    status: established
    sources:
    - v6-izumozaki-jcca
  - text: 1957年の西越村との合併では、新しい町名が一時「出雲町」とされたが、即日に「出雲崎町」へ改称された（市区町村変遷情報の詳細記録）
    kind: fact
    level: E4
    status: established
    sources:
    - upg-ae5-izumozaki-uub-detail
  column:
    title: 芭蕉の「天河」と、70年後に生まれた良寛
    text: 元禄2年（1689年）、松尾芭蕉は『おくのほそ道』の旅で出雲崎に泊まり、沖に浮かぶ佐渡島に思いを馳せて「荒海や佐渡によこたふ天河」と詠みました。それから約70年後の宝暦8年（1758年）、この町の名主の家に生まれたのが、清貧の禅僧として知られる良寛です。佐渡金銀の陸揚げで賑わった天領の港町は、江戸時代を通じて文人・僧侶の往く町でもありました。間口が狭く奥行きの長い「妻入り」の町家が並ぶ街並みは、その繁栄の名残です。
    sources:
    - v6-izumozaki-jcca
    - v6-izumozaki-zck
  relations:
  - pref/15
  - muni/15-佐渡市
  unknowns:
  - 康平3年（1060年）の越後図に「出雲崎」の名が見えるという郷土史料の記述を、専門辞典・公的資料では確認できなかった
  - 石井神社の祭神・大国主命に結びつける「出雲」の由来説は郷土史料の推論の域を出ず、確証は得られていない
  - 「崎」が岬の地形を指すという点は地形から明らかだが、命名当時の記録は確認できなかった
  updated: '2026-11-13'
- id: muni/15-刈羽村
  code: '155047'
  names:
    ja: 刈羽村
    reading: かりわむら
    aliases:
    - 苅羽
  user_terms:
  - 刈羽郡で唯一の村
  - 刈羽村の名前の由来
  naming_type: 旧行政区画名の継承
  naming_note: 中世の郷名・郡名「刈羽」を継承した村名
  formation: 合併新設
  prefecture: 新潟県
  homonyms: []
  summary: 刈羽は中世の文書に「刈羽郷」「刈羽郡」として現れる古い地名である。古代のこの一帯は『和名類聚抄』の三島（みしま）郡にあたり、「刈羽」の名は中世に入ってから記録に現れる。村は1889年に旧村の名を受け継いで発足し、1901年の合併で現在の村となり、今では刈羽郡を構成する唯一の自治体である。「刈羽」の語源そのものは専門辞典でも説明がなく、確定していない。
  first_attestation:
    era: 正和2年
    year_western: 1313
    document: 源光広和与状写（秋田家文書）
    note: 『日本歴史地名大系』が紹介する「越後国刈羽郷半分」の用例。郡名としての「刈羽郡」の用例は延文2年（1357年）の文書に見える
  claims:
  - text: 総務省の全国地方公共団体コードで、刈羽村の団体コードは155047と定められている
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  - text: 『日本歴史地名大系』によれば、刈羽郡は『和名抄』の越後国内七郡には見えず、古代の三島（みしま）郡が柏崎市を含む旧刈羽郡域にあたると考えられる
    kind: fact
    level: E3
    status: established
    sources:
    - v6-kariwa-kotobank-gun
  - text: 『日本歴史地名大系』によれば、三島郡が刈羽郡へ名称を変えた年次は不明だが、正和2年（1313年）の源光広和与状写に「越後国刈羽郷半分」と見え、延文2年（1357年）の打渡状に「越後国刈羽郡」と見える
    kind: fact
    level: E3
    status: established
    sources:
    - v6-kariwa-kotobank-gun
  - text: 『日本歴史地名大系』の刈羽村の項によれば、享徳3年（1454年）の寄進状や寛正2年（1461年）の田地売券写など善照寺文書に刈羽の地の記録が見え、中世には刈羽の集落が存在した
    kind: fact
    level: E3
    status: established
    sources:
    - v6-kariwa-kotobank-mura
  - text: 市区町村変遷情報によれば、明治22年（1889年）4月1日に旧刈羽村・割町新田・上高町村・下高町村・正明寺村の区域を合わせて刈羽村が生まれ、明治34年（1901年）11月1日に勝山村と合併して新しい刈羽村になった
    kind: fact
    level: E4
    status: established
    sources:
    - v6-kariwa-uub
  - text: 新潟県の市町村概要によれば、刈羽村は昭和31年（1956年）9月に中通村の一部を、昭和34年（1959年）4月に二田村の一部を編入合併した
    kind: fact
    level: E2
    status: established
    sources:
    - v6-kariwa-pref
  - text: 現在、刈羽郡を構成する自治体は刈羽村のみである
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 『和名抄』にない郡名が、村の名として残った
    text: 古代の越後国を記した『和名類聚抄』に「刈羽郡」の名はありません。この一帯は当時「三島（みしま）郡」でした。ところが中世の文書には「刈羽郷」「刈羽郡」が現れ、いつの間にか郡の名が置き換わっていました。その理由は専門辞典も「年次は不明」とする謎のままです。やがて柏崎が市になるなどして郡は姿を変え、今では刈羽郡に残る自治体は刈羽村ただ一つ。出どころのはっきりしない古い名が、小さな村の名として700年以上も受け継がれています。
    sources:
    - v6-kariwa-kotobank-gun
    - v6-kariwa-pref
  relations:
  - pref/15
  unknowns:
  - 「刈羽（カリワ）」の語源は、確認した専門辞典・公的資料のいずれにも説明がなく、確定できなかった
  - 古代の三島（みしま）郡が「刈羽」と呼ばれるようになった時期・経緯は『日本歴史地名大系』も不明とする
  - 1889年の合併で村名に「刈羽」を選んだ経緯を示す公的資料は確認できなかった（旧村名の継承とみられる）
  updated: '2026-11-13'
- id: muni/15-加茂市
  code: '152099'
  names:
    ja: 加茂市
    reading: かもし
    aliases:
    - 加茂町
    - 青海
  user_terms:
  - 加茂市の名前の由来
  - 加茂はなぜ加茂というのか
  - 北越の小京都
  - 桐たんすのまち加茂
  naming_type: 中心地名の継承
  formation: 合併新設
  prefecture: 新潟県
  homonyms: []
  summary: 市名は鎮守・青海神社にまつわる「加茂」の継承である。市公式によれば、794年の平安遷都の折にこの地が京都の賀茂神社の神領となり、上賀茂・下鴨両社の祭神が青海神社に分霊されたことから「加茂」と呼ばれるようになった。三方を山に囲まれ加茂川が流れる地形から「北越の小京都」とも呼ばれる。1954年に加茂町が合併のうえ市制を施行した。
  first_attestation:
    era: 平安時代
    year_western: null
    document: null
    note: 「加茂」という地名の文書上の初出は特定できなかった。市公式は延暦13年（794）の平安遷都の折の賀茂神社領化と分霊を名の起こりとする。なお鎮守の青海神社は『延喜式神名帳』（927年）に名が見える
  claims:
  - text: 加茂市公式によれば、794年の平安遷都の折、加茂の地が京都の賀茂神社（上賀茂神社・下鴨神社）の神領となり、青海神社の鎮座地に両社の祭神が分霊されたことから、「加茂」と呼ばれるようになった
    kind: fact
    level: E2
    status: established
    sources:
    - n1-kamo-city-gaiyo
    - n1-kamo-city-ijyu
  - text: 青海神社は『延喜式神名帳』（927年）に名が記された古社で、加茂の鎮守である（長瀬神社も同じく式内社）
    kind: fact
    level: E2
    status: established
    sources:
    - n1-kamo-city-gaiyo
  - text: 青海神社の由緒では、神亀3年（726）に青海郷を開拓した青海首一族が、祖神・椎根津彦命と大国魂命を祀って青海神社を創建したと伝えられている
    kind: fact
    level: E4
    status: established
    sources:
    - n1-kamo-jinja
  - text: 加茂は、三方を山に囲まれ市内を加茂川が流れる地形が京都に似ていることなどから、「北越の小京都」と呼ばれている（北越は越後と越中の総称）
    kind: fact
    level: E2
    status: established
    sources:
    - n1-kamo-city-ijyu
  - text: 明治22年（1889）の町村制施行で市域は6町村となり、加茂町はその後、狭口村・加新村・下条村と合併して昭和29年（1954）に加茂市となった
    kind: fact
    level: E2
    status: established
    sources:
    - n1-kamo-city-kaso
  - text: 市名「加茂市」は、合併前の中心であった加茂町の名をそのまま継承したものである
    kind: fact
    level: E2
    status: established
    sources:
    - n1-kamo-city-kaso
  - text: 新潟県の市町村等団体コード一覧では、加茂市の団体コードは152099とされている
    kind: fact
    level: E2
    status: established
    sources:
    - n1-niigata-code
  column:
    title: 「加茂」の前の名は「青海」だった
    text: 加茂の鎮守・青海神社は加茂山に鎮座し、「加茂のお明神さま」と親しまれてきました。神社の由緒によれば、この一帯はもともと「青海郷」と呼ばれ、青海首（あおみのおびと）という一族が開拓した土地で、青海郷は23箇村に及んだと伝えられます。794年に京都の賀茂両社の神領となって分霊が祀られ、「賀茂」の縁から「加茂」の名が生まれました。古い地名「青海」は、神社の名として今も残っています。
    sources:
    - n1-kamo-jinja
    - n1-kamo-city-ijyu
  relations:
  - pref/15
  unknowns:
  - 「賀茂」がなぜ「加茂」の字に改められたのか、その理由は市公式・神社由緒のいずれにも明記がなく未確認
  - 794年の神領化・分霊を裏づける同時代史料は確認できなかった（市公式・神社由緒の伝える経緯として記録）
  - 市制施行の正確な月日（3月10日とされる）は市公式資料では確認できなかった
  updated: '2026-11-13'
- id: muni/15-十日町市
  code: '152102'
  names:
    ja: 十日町市
    reading: とおかまちし
    aliases:
    - 十日町
  user_terms:
  - 十日町市の名前の由来
  - 十日町はなぜ十日町というのか
  - きもののまち十日町
  - 妻有の中心
  naming_type: 中心地名の継承
  formation: 合併新設
  prefecture: 新潟県
  homonyms: []
  summary: 市名は定期市の開かれた場所にちなむ地名と推測されている。日本歴史地名大系は、北に四日町の地名が続くことから、十日町は中世末に開かれた六斎市の開設場所にちなむものと思われるとする。江戸時代には越後縮の市場町として栄え、1954年に市制を施行、2005年の新設合併でも市名が継承された。
  first_attestation:
    era: 中世末
    year_western: null
    document: null
    note: 「十日町」の文書上の初出は特定できなかった。日本歴史地名大系は、中世末の六斎市にちなむ地名と推測する
  claims:
  - text: 日本歴史地名大系は、十日町の地名について、北に四日町の地名が続くことから、中世末に六斎市（定期市）の開設場所にちなむものと思われるとする
    kind: fact
    level: E3
    status: inferred
    sources:
    - n1-tokamachi-kotobank
  - text: 江戸時代の寛文13年（1673）に縮市場が開設され、十日町は小千谷・堀之内とともに越後縮の「三市場」の一つとして繁栄した（十日町市中心市街地活性化基本計画）
    kind: fact
    level: E2
    status: established
    sources:
    - n1-tokamachi-city-plan
  - text: 旧十日町市は昭和29年（1954）に十日町・川治村・中条村・六箇村の合併により誕生し、その市制施行日は3月31日である
    kind: fact
    level: E2
    status: established
    sources:
    - n1-tokamachi-city-enkaku
    - n1-tokamachi-uub
  - text: 平成17年（2005）4月1日、旧十日町市・川西町・中里村・松代町・松之山町の5市町村が新設合併して現在の十日町市が誕生し、市名は「十日町市」が継承された
    kind: fact
    level: E2
    status: established
    sources:
    - n1-tokamachi-city-enkaku
  - text: 新潟県の市町村等団体コード一覧では、十日町市の団体コードは152102とされている
    kind: fact
    level: E2
    status: established
    sources:
    - n1-niigata-code
  column:
    title: 四日町・十日町・六日町――日付の地名たち
    text: 魚沼のあたりには、市場の開かれる日をそのまま名にした地名が点々と残ります。十日町の北には四日町があり、南魚沼には六日町があります。月に6回、決まった日に開かれる六斎市が各地にあり、その開催日が土地の名前になったのです。「十日町」は、十日・二十日・三十日（月末）に市が立つ場所だったのでしょう。日付が地名になるほど、市（いち）は人々の生活の中心でした。
    sources:
    - n1-tokamachi-kotobank
  relations:
  - pref/15
  unknowns:
  - 六斎市の開催日が具体的に「十日」を含む日だったことを示す同時代史料は確認できなかった（大系の推測にとどまる）
  - 「十日町」の文書上の初出の年・史料名は未確認
  updated: '2026-11-13'
- id: muni/15-南魚沼市
  code: '152269'
  names:
    ja: 南魚沼市
    reading: みなみうおぬまし
    aliases:
    - 南魚沼郡
  user_terms:
  - みなみうおぬま
  - 魚沼産コシヒカリ
  - 塩沢紬
  - 六日町
  - 塩沢
  naming_type: 旧行政区画名の継承
  formation: 合併新設
  prefecture: 新潟県
  homonyms: []
  summary: 新潟県南部の市で、魚沼盆地の南半を占める。市名は明治時代初期に名付けられた郡名「南魚沼郡」に由来し、「魚沼」の名そのものは古代の魚沼郡に遡る。2004年に六日町・大和町が合併して発足し、2005年に三国街道の宿場町で織物の産地だった塩沢町を編入した。コシヒカリの産地として知られる。
  first_attestation:
    era: 明治時代
    year_western: null
    document: 郡名「南魚沼郡」
    note: 市公式が「旧地名をもとに明治時代初期に名付けられた郡名『南魚沼郡』に由来」と説明するもの。具体的な命名年は未確認。「魚沼」の初出は『和名類聚抄』の魚沼郡（魚沼市のレコード参照）
  claims:
  - text: 市の名称「南魚沼市」は、旧地名をもとに明治時代初期に名付けられた郡名「南魚沼郡」に由来する（南魚沼市公式）
    kind: fact
    level: E2
    status: established
    sources:
    - u5-minamiuonuma-gaiyo
  - text: 市公式は「南」には発展性・明るさがあり、当地が魚沼地域の中核として地域とともに発展し続けたいとの願いを込めた名称であると説明する
    kind: fact
    level: E2
    status: established
    sources:
    - u5-minamiuonuma-gaiyo
  - text: 2004年11月1日に六日町・大和町が新設合併して南魚沼市が発足し、2005年10月1日に塩沢町を編入した
    kind: fact
    level: E2
    status: established
    sources:
    - u5-minamiuonuma-gaiyo
  - text: 編入した塩沢は三国街道の宿場町であり、越後上布・塩沢紬の織物の産地として知られる
    kind: fact
    level: E2
    status: established
    sources:
    - u5-minamiuonuma-makino
  - text: 塩沢の目抜き通り「牧之通り」は、『北越雪譜』の著者で塩沢の織物仲買商の家に生まれた鈴木牧之（1770〜1842）にちなんで名付けられた
    kind: fact
    level: E2
    status: established
    sources:
    - u5-minamiuonuma-makino
  - text: もう一つの旧中心地・六日町は坂戸城を中心とした城下町で、三国街道と清水街道が合流する交通の要所であった
    kind: fact
    level: E2
    status: established
    sources:
    - u5-minamiuonuma-toshi
  column:
    title: 雪の本を書いた商人の通り――塩沢の牧之通り
    text: 塩沢の織物仲買商の家に生まれた鈴木牧之は、雪国の暮らしを描いた『北越雪譜』（1837年刊行開始）を著して江戸で評判になった。その名を冠した「牧之通り」は、塩沢の旧宿場の街並みを整えた目抜き通りである。市名の由来は郡名という行政の層にあるが、塩沢という旧中心の名は、雪と織物と一人の商人の記憶を今も運んでいる。
    sources:
    - u5-minamiuonuma-makino
  relations:
  - pref/15
  unknowns:
  - 南魚沼郡という郡名が具体的に何年に定められたか（1879年の郡再編との関係を含む）は未確認
  - 合併時の市名決定の経緯（公募の有無・候補名）は市公式の概要からは確認できなかった
  updated: '2026-11-13'
