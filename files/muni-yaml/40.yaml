  user_terms:
  - ちくぜん
  - 筑前
  - 旧夜須町
  - 旧三輪町
  - 大己貴神社の町
  naming_type: 旧国名・広域地名の採用
  formation: 合併新設
  prefecture: 福岡県
  homonyms: []
  summary: 朝倉郡の町。2005年3月22日に夜須町と三輪町が対等合併して発足した。町名「筑前」は旧国名の筑前国にちなむ命名とみられるが、その理由を明記した公的資料は確認できなかった。町域は旧筑前国に属し、1896年以降は朝倉郡に属する。三輪地区の大己貴神社は、『日本書紀』の神功皇后の記事に結びつけて「日本最古の神社」と称される由緒を伝える。
  first_attestation:
    era: 平成時代
    year_western: 2005
    document: 夜須町・三輪町の対等合併による筑前町の発足
    note: 「筑前」自体は古代の国名として古くから記録に現れるが、町名として採用した理由・経緯を示す一次資料は確認できなかった
  claims:
  - text: 福岡共同公文書館によれば、筑前町は平成17年（2005年）3月22日に旧夜須町と旧三輪町が合併して誕生した
    kind: fact
    level: E2
    status: established
    sources:
    - r5-chikuzen-kobunsyokan
  - text: 前身の村々は1896年に夜須郡から朝倉郡所属となり、1908年に夜須村と三輪村に再編され、1962年4月1日に両村が町制を施行して夜須町・三輪町となった
    kind: fact
    level: E2
    status: established
    sources:
    - r3-asakura-kotobank-gun
    - upg-p2-chikuzen-yasumura-geoshape
    - upg-p2-chikuzen-yasu-geoshape
  - text: 町名「筑前」は、両町域を含む地域が属した旧国名「筑前国」にちなむ命名とみられるが、命名理由を明記した公的資料は確認できなかった
    kind: fact
    level: H
    status: inferred
    sources:
    - r5-chikuzen-wiki
  - text: 福岡共同公文書館は、大己貴神社について、神功皇后が羽白熊鷲の征伐の後に新羅征討の兵を募るため大神社（大三輪社）を建てて太刀や矛を奉納したところ兵が集まったと『日本書紀』に記載されていることを紹介し、地元では「日本最古の神社」といわれ「おんがさま」と呼ばれて崇敬されていると伝える
    kind: legend
    level: E2
    status: established
    sources:
    - r5-chikuzen-kobunsyokan
  - text: 旧町名の「夜須」は古代以来の夜須郡の名に、「三輪」は大三輪村の名に遡る。合併前の村名のうち安野・栗田は、現在も地区名として残っている
    kind: fact
    level: E2
    status: established
    sources:
    - upg-p2-chikuzen-yasugun-kotobank
    - r3-asakura-kotobank-gun
    - upg-p2-chikuzen-japanpost
  - text: 筑前町の地方公共団体コードは404471である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 「日本最古の神社」を名乗る大己貴神社と「三輪」の名
    text: 筑前町三輪地区の大己貴神社は、地元で「おんがさま」と呼ばれ、「日本最古の神社」といわれる。福岡共同公文書館の紹介によれば、その由緒は『日本書紀』の記事に結びつく。神功皇后が豪族・羽白熊鷲を征伐した後、新羅征討のために兵を募ったが集まらず、大神社（大三輪社）を建てて太刀や矛を奉納したところ、兵が集まったというのである。旧三輪町の「三輪」は、この大三輪社の鎮座する大三輪村の名を受け継いだものだ。2005年の合併で町名は「筑前」に変わったが、「三輪」という名は地区の名として、神社の由緒とともに今も生き続けている。
    sources:
    - r5-chikuzen-kobunsyokan
    - r5-chikuzen-wiki
  relations:
  - pref/40
  unknowns:
  - 「筑前」と命名した理由・経緯を明記した公的資料は確認できなかった
  - 合併時の新町名の候補にどのようなものがあったかは確認できなかった
  updated: '2026-11-13'
