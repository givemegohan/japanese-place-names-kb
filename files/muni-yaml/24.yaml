  - 御在所岳
  - マコモの野
  naming_type: 中心地名の継承
  formation: 編入合併
  prefecture: 三重県
  homonyms: []
  summary: 鈴鹿山脈の東麓、三重郡の町。町公式サイトによれば、その昔マコモ（真菰）などが生い茂る原野を開拓して村づくりが始まり、この地を「こもの」と呼んだことが町名の由来で、表記には薦野・古茂野・菰野が使われてきた。江戸時代には土方氏の菰野藩1万2千石の城下町となり、1889年に菰野村、1928年に菰野町となった。1956〜57年の合併で現在の町域となった。
  first_attestation:
    era: 明治22年
    year_western: 1889
    document: 町村制施行による三重郡菰野村の設置
    note: 自治体名としての初出。地名「こもの」自体の文書上の初出は未確認
  claims:
  - text: 菰野町の地方公共団体コードは243418である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
    - x9-komono-wiki
  - text: 菰野町公式サイトは、その昔マコモ（真菰・真薦）やクサヨモギなどが生い茂る原野が広がっており、そこを切り開いて村づくりがはじめられたことから、この地を「こもの」と命名したことが町名の由来であり、「こもの」の字には薦野・古茂野・菰野が使われてきたと説明している
    kind: fact
    level: E2
    status: established
    sources:
    - x9-komono-town
  - text: 1600年（慶長5年）に土方雄氏が菰野に入って菰野藩（1万2千石）を創設し、陣屋を中心とする城下町として発展した
    kind: fact
    level: E5
    status: established
    sources:
    - x9-komono-wiki
    - x9-komono-han-wiki
  - text: 1871年（明治4年）の廃藩置県では菰野藩は菰野県となり、その後三重県に編入された
    kind: fact
    level: E5
    status: established
    sources:
    - x9-komono-han-wiki
  - text: 1889年（明治22年）に旧城下町の区域で菰野村が発足し、1928年（昭和3年）10月1日に町制を施行して菰野町となった
    kind: fact
    level: E5
    status: established
    sources:
    - x9-komono-wiki
  - text: 1956年（昭和31年）9月30日に鵜川原村・竹永村と合併し、1957年（昭和32年）に朝明村を編入して現在の町域となった
    kind: fact
    level: E5
    status: established
    sources:
    - x9-komono-wiki
  column:
    title: 原野の名が藩の名、県の名になった
    text: 「菰野」はマコモの生い茂る原野を指した土地の名だったが、1600年に土方氏が入ると藩の名になり、1871年の廃藩置県では一瞬だけ「菰野県」という県名にもなった。その後は村の名、町の名として今日まで途切れず使われ続けている。菰野藩は年貢の取り立てが比較的緩やかで、明治維新まで一揆が一度もなかった珍しい藩として紹介される。一つの土地の名が四百年にわたり行政の名として生き延びた例である。
    sources:
    - x9-komono-town
    - x9-komono-han-wiki
  relations:
  - pref/24
  - muni/24-四日市市
  unknowns:
  - 地名「こもの」の文書上の初出（中世文書等での使用例）は未確認
  - 町公式サイトのいう「村づくり」がいつの時期を指すのかは特定できていない
  - 「薦野」「古茂野」表記の具体的な使用年代は未確認
  updated: '2026-11-13'
- id: muni/24-鈴鹿市
  code: '242071'
  names:
    ja: 鈴鹿市
    reading: すずかし
    aliases:
    - 鈴鹿郡
  user_terms:
  - 鈴鹿市の名前の由来
  - 鈴鹿サーキットの市
  - 鈴鹿って鹿の伝説なの
  naming_type: 旧行政区画名の継承
  naming_note: 古代郡名の継承
  formation: 合併新設
  prefecture: 三重県
  homonyms: []
  summary: 市名は、伊勢国以来の郡名「鈴鹿郡」を受け継ぐ。「鈴鹿」は壬申の乱の頃には文献に現れる古い地名だが、その語源は明らかでないとされる。鈴鹿川の名については、大海人皇子（のちの天武天皇）が鈴をつけた鹿に乗って川を渡ったという伝説が国土交通省の河川紹介などに伝えられる。昭和17年（1942年）に鈴鹿郡・河芸郡の2町12村が合併して市制を施行した。
  first_attestation:
    era: 飛鳥時代
    year_western: 672
    document: 日本書紀 天武天皇元年条（「鈴鹿山道」「鈴鹿関司」）
    note: 文献上の初見として紹介される用例。原典そのものは未読のため、紹介資料経由の記載として記録する
  claims:
  - text: 「鈴鹿」の文献上の初見は『日本書紀』天武天皇元年（672年）条とされ、壬申の乱に際して大海人皇子の軍が「鈴鹿山道」を塞がせたことや「鈴鹿関司」という官職名が見える
    kind: fact
    level: E5
    status: established
    sources:
    - n6-suzuka-seki-wiki
  - text: 「鈴鹿」という地名の由来は明らかでないとされる
    kind: fact
    level: E5
    status: indeterminate
    sources:
    - n6-suzuka-seki-wiki
  - text: 鈴鹿川の名前は、大海人皇子が東国への旅の途中で洪水に難渋していたところ、駅路の鈴をつけた鹿が現れてその背に乗って川を渡ったという伝説から来たといわれている
    kind: legend
    level: E2
    status: contested
    sources:
    - n6-suzuka-mlit
  - text: 古代の鈴鹿関は、伊勢国鈴鹿郡（現在の亀山市関町付近）に置かれ、不破関・愛発関とともに「三関」と総称された
    kind: fact
    level: E5
    status: established
    sources:
    - n6-suzuka-seki-wiki
  - text: 鈴鹿郡は伊勢国府の置かれた郡でもあり、現在の鈴鹿市国府町にその名が残る
    kind: fact
    level: E5
    status: established
    sources:
    - n6-suzuka-gun-wiki
  - text: 『万葉集』にも鈴鹿川を詠んだ歌が見えるなど、鈴鹿川は古くから交通の要所を流れる川として知られた
    kind: fact
    level: E2
    status: established
    sources:
    - n6-suzuka-mlit
  - text: 昭和17年（1942年）12月1日、鈴鹿郡と河芸郡の2町12村が合併して鈴鹿市が市制を施行した
    kind: fact
    level: E2
    status: established
    sources:
    - n6-suzuka-city
  - text: 市名は、合併した町村の属した郡名「鈴鹿」をそのまま市名としたものである
    kind: fact
    level: E2
    status: established
    sources:
    - n6-suzuka-city
  - text: 総務省の地方公共団体コード一覧では、鈴鹿市のコードは242071である
    kind: fact
    level: E2
    status: established
    sources:
    - b-cap-chiba-soumu-code
  column:
    title: 鈴をつけた鹿と、F1の轟音
    text: 鈴鹿川の名の由来として国土交通省が紹介する伝説は、まるで昔話である。壬申の乱へ向かう大海人皇子が増水した川の前で立ち往生していると、駅路の鈴をつけた鹿が現れ、皇子を背に乗せて川を渡してくれた——という。地名の本当の語源は不明とされるが、この鹿の伝説が「鈴」と「鹿」の字面に物語を与え続けてきた。そしていま「鈴鹿」の名を世界に響かせているのは、鈴鹿サーキットのF1の轟音である。鹿の鈴の音とエンジンの音。音に縁のある地名として、これほど対照的な二つの時代を持つまちも珍しい。
    sources:
    - n6-suzuka-mlit
    - n6-suzuka-seki-wiki
  relations:
  - pref/24
  - muni/24-四日市市
  unknowns:
  - 「鈴鹿」の語源について、『角川日本地名大辞典』『日本歴史地名大系』の該当項目での確認はできていない
  - 1942年の合併の際に市名を「鈴鹿市」と定めた協議の記録は未確認
  updated: '2026-11-13'
